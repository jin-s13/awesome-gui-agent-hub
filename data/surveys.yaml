  related_work_outline_zh:
  - 主流方向：研究正在从静态点击型GUI基准转向更丰富的交互与真实部署设置，例如动态屏幕、拖拽操作、GUI与CLI混合、长时移动任务和视频引导落地。
  - 研究共性：工作普遍在Pass@1之外引入更细粒度评估信号，如子目标检查、信息效率成本、共形覆盖和不确定性排序，并配合任务合成或弱监督训练。
  - 关键差异：差别在于动作接口覆盖、监督形式，如弱视觉落地、可验证在线强化学习或上下文动作监督微调，以及评测目标是单步落地可靠性还是长时任务成功。
  - 趋势演进：现有高排名证据集中在2026年，趋势属于当前前沿；正在走向可验证任务合成、无标注截图弱监督、观察与上下文管理以及不确定性感知部署。
  - 开放问题：跨平台与跨模型迁移、动态屏幕观察控制、组件贡献归因、多步不确定性校准，以及缺失局限或工件带来的复现缺口仍然存在。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark and evaluation design for heterogeneous action interfaces
      what_it_solves: Expands GUI evaluation beyond click-only static screens to drag
        interactions, GUI+CLI workflows, and dynamic short-video interfaces, with
        multi-checkpoint or cost-accuracy metrics.
      what_remains_open: Coverage is platform-specific, human baseline depth varies,
        and several limitation fields are absent, leaving cross-interface generalization
        unverified.
    - line: Scalable training and task synthesis methods
      what_it_solves: Addresses data scarcity and sample efficiency through weakly-supervised
        visual grounding, verifiable online RL task generation, and context-action
        supervised fine-tuning.
      what_remains_open: Gains from task synthesis, rollout allocation, context management,
        or keyframe extraction are not isolated from surrounding system choices; broad
        transfer is not yet shown.
    - line: Context, observation, and planning-interface methods
      what_it_solves: Improves long-horizon mobile task completion via proactive context
        management and clarifies dynamic-interface failure as over-observation or
        under-observation.
      what_remains_open: Agents still lack explicit observation control on living
        screens, and evidence is limited to specific mobile or short-video settings.
    - line: Uncertainty quantification and reliability protocols
      what_it_solves: Benchmarks post-hoc uncertainty methods for GUI grounding, measures
        ranking transfer, and builds conformal click regions for spatial safety.
      what_remains_open: Evaluation covers single-step executable grounding only;
        cross-model and cross-interface transfer is weak, and coverage degrades under
        distribution shift.
    consensus:
    - Recent work treats action prediction and task completion as requiring richer
      interfaces than click-only web or mobile screens, including drag, GUI+CLI, and
      dynamic content.
    - Fine-grained evaluation beyond Pass@1 is needed because aggregate success hides
      differences in sub-goal completion or information efficiency.
    - Training or finetuning with task-specific or weakly labeled data improves GUI
      grounding and long-horizon performance.
    - Method gains often come from supporting components such as skill libraries,
      context management, or keyframe extraction rather than a single model or framework
      choice.
    disagreements:
    - 'Evaluation granularity differs: single-step executable grounding and long-horizon
      task success are not directly comparable.'
    - Action-space emphasis differs across drag interaction coverage, GUI+CLI workflows,
      dynamic observation control, and video-guided keyframe selection.
    - Supervision signal differs between weakly-supervised visual grounding, verifiable
      online reinforcement learning, and context-action supervised fine-tuning.
    - Metrics differ among Pass@1 with sub-goal checkpoints, cost-accuracy tradeoffs,
      uncertainty ranking transfer, and conformal coverage.
    open_questions:
    - Do gains transfer across platforms, interfaces, and model classes when task
      synthesis, weakly supervised grounding, or context-management methods are evaluated
      only on specific benchmark families?
    - How should agents acquire observation control for living-screen dynamic interfaces
      where content changes between actions?
    - Can post-hoc uncertainty quantification remain calibrated under multi-step trajectories
      and distribution shifts, given current single-step and cross-interface limitations?
    - What is the isolated contribution of each method component such as skill libraries,
      rollout allocation, context-as-action, or keyframe extraction versus surrounding
      system choices?
    - Missing code, dataset, or limitation details in several top-ranked papers leave
      reproducibility and failure-mode boundaries unverified.
  literature_review_zh:
    研究路线矩阵:
    - 路线: 面向异构动作接口的基准与评估设计
      解决的问题: 把GUI评估从静态点击扩展到拖拽、GUI+CLI混合和动态短视频界面，提供多检查点或成本准确性指标。
      尚未覆盖: 覆盖范围集中在特定平台，人类基线深度不一，且若干局限字段缺失，跨界面泛化仍未验证。
    - 路线: 可扩展训练与任务合成方法
      解决的问题: 通过无标注截图弱监督、可验证在线强化学习任务生成和上下文动作监督微调，缓解数据稀缺与样本效率问题。
      尚未覆盖: 任务合成、rollout分配、上下文管理或关键帧提取的增益未与系统其它选择隔离；广泛迁移尚未显示。
    - 路线: 上下文、观察与规划接口方法
      解决的问题: 通过主动上下文管理提升长时移动任务完成度，并将动态界面失败解释为过度观察或观察不足。
      尚未覆盖: 智能体仍缺乏对动态屏幕的显式观察控制，证据仅限于特定移动或短视频设置。
    - 路线: 不确定性与可靠性协议
      解决的问题: 对GUI落地后验不确定性方法做基准测试，测量排序迁移，并构造用于空间安全的共形点击区域。
      尚未覆盖: 仅覆盖单步可执行落地，跨模型和跨接口迁移弱，分布偏移下覆盖度下降。
    共识:
    - 研究正在超越纯点击任务，强调拖拽、GUI+CLI、动态内容等更丰富的动作与观察接口。
    - 仅看Pass@1不够，需要子目标完成度、信息效率或不确定性排序等更细粒度信号。
    - 任务相关训练或弱监督数据可以改善GUI落地和长时任务性能。
    - 方法增益常源自技能库、上下文管理或关键帧提取等配套组件，而非单一模型或框架选择。
    分歧:
    - 评测粒度不一致：单步可执行落地与长时任务成功率难以直接比较。
    - 动作空间侧重不同：拖拽交互、GUI+CLI混合、动态观察控制和视频引导关键帧选择各有侧重。
    - 监督信号不同：弱监督视觉落地、可验证在线强化学习和上下文动作监督微调并存。
    - 指标不同：Pass@1与子目标检查、成本准确性、不确定性排序迁移和共形覆盖度没有统一标准。
    开放问题:
    - 现有方法能否跨平台、跨接口、跨模型类稳定迁移，而不只是在特定基准族内有效？
    - 动态屏幕代理如何获得观察控制，避免过度观察与观察不足？
    - 后验不确定性方法在单步落地基准上有效，但在多步轨迹和分布偏移下是否仍保持校准？
    - 如何隔离技能库、rollout分配、上下文动作和关键帧提取等组件的净贡献？
    - 多个高排名工作未披露局限性、代码或数据，失败边界与可复现性如何验证？
