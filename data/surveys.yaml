  related_work_outline_zh:
  - 主流方向：该主题虽被标记为综述，但证据包主要是GUI/计算机使用代理的原始方法与基准论文；核心方向是构建、定位和评估长程任务完成、自改进、安全与不确定性能力。
  - 研究共性：工作通常创建受控基准或环境，提取任务相关信号（关键帧、密集标注、执行框架证据或可验证任务），再评测冻结或微调视觉语言代理的迁移与任务成功率。
  - 关键差异：监督来源、交互表面和评测目标各不相同：桌面标注、视频关键帧、执行轨迹或强化学习任务合成；桌面、移动端、浏览器、视频；定位、长程完成、良性召回、提示注入安全与不确定性迁移。
  - 趋势演进：2024–2026 可见前沿从静态基准和直接模型训练，走向数据生成、在线强化学习、主动上下文管理以及围绕冻结代理的安全/审计层；跨度较窄，难以推断更早基础。
  - 开放问题：定位与不确定性等结论能否跨界面、跨模型类别迁移；哪些验证缺口最需优先解决；分布偏移下如何维持良性召回与校准；当前证据是否足以支撑系统性综述结论。
  literature_review:
    line_of_work_matrix:
    - line: Taxonomy and roadmap synthesis for GUI agents
      what_it_solves: Organizes fragmented GUI-agent work into directions around grounding,
        long-horizon control, self-improvement, evaluation, and safety.
      what_remains_open: Whether the synthesis is systematic rather than selective,
        and whether missing method details weaken cross-paper claims.
    - line: Comparative evaluation synthesis
      what_it_solves: Summarizes how evaluation choices across desktop, mobile, browser,
        video, fraud, and safety settings shape task-success and grounding conclusions.
      what_remains_open: Comparability across interfaces and model access levels is
        uncertain; several entries lack full limitation or reproducibility evidence.
    - line: Open problem and gap mapping
      what_it_solves: 'Turns covered results into concrete gaps: grounding transfer,
        long-horizon memory, uncertainty transfer, benign recall, and domain-conditioned
        safety.'
      what_remains_open: No evidence-based prioritization of gaps is established;
        current evidence is largely single-step or benchmark-bound.
    consensus:
    - Controlled benchmarks and environments are treated as necessary for exposing
      failures that single-step metrics miss.
    - Frozen or fine-tuned vision-language agents benefit from task-relevant context
      or supervision beyond raw screenshots.
    - Safety, uncertainty, and long-horizon reliability are assessed as first-order
      agent capabilities rather than downstream scores alone.
    - Most findings are benchmark-specific, so cross-interface or cross-model transfer
      requires re-evaluation.
    disagreements:
    - 'Supervision source differs: synthetic desktop annotations, task-driven keyframes,
      execution-harness evidence, and verifiable RL task synthesis target different
      failure modes.'
    - 'Evaluation target differs: element grounding, long-horizon task completion,
      benign recall under sanitized cues, or attack success rate under prompt injection.'
    - 'Interaction surface differs: desktop, mobile, browser, and video-guided tasks
      impose different action spaces, context windows, and safety assumptions.'
    - 'Deployment setting differs: frozen-model harness optimization avoids backbone
      updates, while online RL updates policy weights; uncertainty benchmarks focus
      on single-step grounding rather than multi-step trajectories.'
    open_questions:
    - Can dense synthetic supervision from desktop environments transfer to mobile,
      browser, and fraud-detection contexts without target-specific adaptation?
    - How should uncertainty rankings be used across model classes when cross-tier
      transfer is weak in the bounded evidence?
    - What context-management strategy preserves critical facts while remaining compact
      enough for out-of-distribution long-horizon mobile tasks?
    - Is verifiable task synthesis equally reliable in safety-sensitive or ambiguous
      cases where reward verification may not capture benign outcomes?
    - Is the available packet, which is mostly method and benchmark papers under a
      survey label, sufficient for a systematic survey conclusion?
