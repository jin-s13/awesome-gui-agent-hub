  related_work_outline:
  - 'Mainstream direction: The field is shifting from static click-based GUI grounding
    to dynamic, multi-step agents that handle diverse interactions (drag, scroll,
    CLI) and manage observation proactively, with growing emphasis on data-efficient
    training and fine-grained evaluation that separates agent capability from framework
    scaffolding.'
  - 'Shared research pattern: Most works curate specialized benchmarks or datasets
    to expose a specific capability gap—such as drag, dynamic video interfaces, long-horizon
    context, or uncertainty calibration—then propose a method or evaluation protocol,
    and show that frontier models still underperform humans, motivating targeted architectural
    or training improvements.'
  - 'Key differences: Methods differ in supervision signal (weakly-supervised from
    unlabeled screenshots vs. online RL with synthetic tasks vs. finetuning on curated
    action annotations), in action space (click-only vs. drag vs. context-as-action),
    and in evaluation target (single-step grounding vs. multi-step trajectories vs.
    uncertainty-aware safety).'
  - 'Trend evolution: Within the 2024–2026 frontier, the trend moves from purely static
    benchmarks toward dynamic, video-guided, and long-horizon scenarios; from supervised
    finetuning to RL and weak supervision; and from pass/fail metrics to multi-dimensional
    scoring that includes sub-goal completion, information efficiency, and uncertainty
    quantification.'
  - 'Open questions: Whether data-efficient methods (weak supervision, task synthesis)
    generalize across OS and application domains, whether uncertainty estimates remain
    calibrated under distribution shift, and how to design action interfaces that
    remain stable for very long-horizon tasks without catastrophic context blow-up.'
  related_work_outline_zh:
  - 主流方向：领域正从静态点击式 GUI 基础转向处理拖拽、滚动、命令行等多样交互的动态多步智能体，并主动管理观察，同时越来越重视数据高效训练和能分离智能体能力与框架支撑的细粒度评估。
  - 研究共性：多数工作构建专门基准或数据集以暴露特定能力缺口（如拖拽、动态视频界面、长时域上下文、不确定性校准），然后提出方法或评估协议，并展示前沿模型仍落后于人类表现，从而推动架构或训练改进。
  - 关键差异：方法在监督信号（无标注截图的弱监督 vs. 合成任务的在线 RL vs. 策划动作标注的微调）、动作空间（仅点击 vs. 拖拽 vs. 上下文即动作）和评估目标（单步基础
    vs. 多步轨迹 vs. 不确定性感知安全）上存在差异。
  - 趋势演进：在 2024–2026 年前沿内，趋势从纯静态基准转向动态、视频引导和长时域场景；从监督微调转向 RL 和弱监督；从通过/失败指标转向包含子目标完成度、信息效率和不确定性量化的多维评分。
  - 开放问题：数据高效方法（弱监督、任务合成）能否跨操作系统和应用领域泛化；不确定性估计在分布偏移下是否保持校准；如何设计在极长时域任务中保持稳定且不引发上下文爆炸的动作接口。
  literature_review:
    line_of_work_matrix:
    - line: Training data efficiency and weakly-supervised representation learning
      what_it_solves: Reduces reliance on expensive human action annotations by leveraging
        large-scale unlabeled screenshots or synthetically generated tasks, and designs
        reinforcement learning objectives that scale agent training with verifiable
        rewards.
      what_remains_open: Whether the visual grounding learned from unlabeled screenshots
        transfers to unseen app categories and OS platforms, and whether synthetic
        tasks cover the full distribution of real-world user goals and edge cases.
    - line: Action space expansion and context-aware action interfaces
      what_it_solves: Extends agent capabilities beyond click/type to include continuous
        drag, dynamic observation control, and proactive context management (e.g.,
        folding history, summarizing UI state) as learnable actions, enabling long-horizon
        and interactive-GUI tasks.
      what_remains_open: Stability and efficiency of these extended action interfaces
        on very long trajectories, and how to balance the action space complexity
        with model capacity without overfitting to a specific app or workflow.
    - line: Evaluation methodology and uncertainty quantification
      what_it_solves: Provides fine-grained metrics (sub-goal completion, cost-accuracy),
        deterministic rule-based scoring, multi-checkpoint annotations, and post-hoc
        uncertainty estimates that isolate method contribution from the surrounding
        framework, skill library, or prompt engineering choices.
      what_remains_open: Robustness of evaluation protocols under distribution shift
        (different interfaces, model tiers), and whether uncertainty quantification
        remains calibrated when moving from single-step grounding to multi-step agent
        trajectories in deployment.
    consensus:
    - Current GUI agents still fall short of reliable human-level performance on complex,
      multi-step, and dynamic tasks, and the gap is visible across multiple benchmarks
      and interaction types.
    - Fine-grained evaluation beyond pass/fail or task success is necessary to diagnose
      failure modes—such as sub-goal completion gaps, over-observation, or under-observation—and
      to avoid overestimating agent capability.
    - Data efficiency and off-policy training signals are critical, as high-quality
      human-annotated trajectories are expensive and do not scale to the diversity
      of real-world GUIs.
    disagreements:
    - 'Supervision paradigm: Some works advocate weakly-supervised pretraining on
      unlabeled screenshots followed by light RL calibration, while others rely on
      online RL with verifiable synthetic tasks, and a third group uses fully supervised
      finetuning on curated action datasets.'
    - 'Evaluation scope: Benchmarks differ on whether they target single-step executable
      grounding, multi-step task completion, or uncertainty-aware safety; results
      from one evaluation regime do not directly transfer to another.'
    - 'Action interface design: Proposals range from minimal click-only interfaces
      to rich action spaces that include drag, CLI, and context-management actions,
      with no consensus on the optimal action granularity for general-purpose agents.'
    open_questions:
    - Can weakly-supervised or synthetically-trained agents generalize to unseen applications
      and operating systems, or do they require target-specific recalibration?
    - How should uncertainty quantification be integrated into multi-step agent pipelines
      to guarantee safe execution, especially when calibration degrades under interface
      or data distribution shifts?
    - What is the appropriate action abstraction level that balances expressiveness
      (drag, context management) with sample efficiency and cross-platform transfer?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 训练数据效率与弱监督表示学习
      解决的问题: 通过利用大规模未标注截图或合成生成的任务，减少对昂贵人工动作标注的依赖，并设计基于可验证奖励的强化学习目标来规模化训练智能体。
      尚未覆盖: 从未标注截图学到的视觉定位能否迁移到未见过的应用类别和操作系统平台，以及合成任务是否覆盖真实世界用户目标和边缘案例的完整分布。
    - 路线: 动作空间扩展与上下文感知动作接口
      解决的问题: 将智能体能力从点击/键入扩展到连续拖拽、动态观察控制，以及将主动上下文管理（如折叠历史、汇总 UI 状态）作为可学习动作，从而支持长时域和交互式
        GUI 任务。
      尚未覆盖: 这些扩展动作接口在极长轨迹上的稳定性和效率，以及如何平衡动作空间复杂度与模型容量而不对特定应用或工作流过拟合。
    - 路线: 评估方法论与不确定性量化
      解决的问题: 提供细粒度指标（子目标完成度、成本-准确性）、确定性基于规则的评分、多检查点标注和后验不确定性估计，将方法贡献与周边框架、技能库或提示工程选择隔离开。
      尚未覆盖: 评估协议在分布偏移（不同接口、模型层级）下的鲁棒性，以及不确定性量化从单步基础转移到部署中的多步智能体轨迹时是否保持校准。
    共识:
    - 当前 GUI 智能体在复杂、多步和动态任务上仍远未达到可靠的人类水平性能，这一差距在多个基准和交互类型中都可见。
    - 超越通过/失败或任务成功率的细粒度评估对于诊断失败模式（如子目标完成度差距、过度观察或观察不足）以及避免高估智能体能力是必要的。
    - 数据效率和离线训练信号至关重要，因为高质量人工标注轨迹成本高昂，且无法扩展到真实世界 GUI 的多样性。
    分歧:
    - 监督范式：一些工作主张在未标注截图上进行弱监督预训练，然后进行轻量 RL 校准；另一些依赖在线 RL 与可验证的合成任务；第三组则在策划的动作数据集上进行完全监督微调。
    - 评估范围：基准测试在目标上是单步可执行基础、多步任务完成还是不确定性感知安全方面存在差异；一个评估体制下的结果不能直接迁移到另一种体制。
    - 动作接口设计：提案从最小化的仅点击接口到包含拖拽、命令行和上下文管理动作的丰富动作空间不等，对于通用智能体的最佳动作粒度尚无共识。
    开放问题:
    - 弱监督或合成训练的智能体能否泛化到未见过的应用和操作系统，还是需要目标特定的重新校准？
    - 如何将不确定性量化集成到多步智能体管线中以保证安全执行，尤其是在校准在接口或数据分布偏移下下降时？
    - 什么是合适的动作抽象层级，能在表达能力（拖拽、上下文管理）与样本效率和跨平台迁移之间取得平衡？
