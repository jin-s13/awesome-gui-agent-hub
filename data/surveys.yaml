      尚未覆盖: 形式化定义因基准而异；尚不清楚它们是否能推广到未知的应用领域，以及是否真正改变代理的设计和部署方式。
    - 路线: 代理可靠性与不确定性量化
      解决的问题: 系统评估GUI接地的后验不确定性量化方法，通过共形点击区域引入空间安全，并识别哪些UQ方法族在模型和数据集之间可迁移。
      尚未覆盖: 跨模型和跨接口的UQ排名迁移较弱，且发现仅限于单步接地；覆盖度在分布偏移下下降，多步轨迹级别的可靠性未被涉及。
    - 路线: 数据与训练效率
      解决的问题: 通过利用未标注截图的弱监督或合成可验证任务进行在线RL，减少对昂贵人工标注的依赖，以极少的标注数据取得竞争性性能。
      尚未覆盖: 合成任务的质量和覆盖度未被充分刻画，这些效率提升在多样化真实任务上的泛化性尚未建立。
    - 路线: 长时域任务的上下文与状态管理
      解决的问题: 将上下文管理形式化为代理策略中的第一类动作，使用结构化上下文字段在长轨迹中保留关键信息，避免被动上下文累积。
      尚未覆盖: 该方法仅在单一模型和两个基准上验证；其对更复杂、多应用交织工作流的鲁棒性，以及与可靠性或安全监控的交互仍待探索。
    共识:
    - 当前GUI代理在处理动态界面、非标准交互类型和长时域任务时存在显著差距，这些差距最好通过精心设计的任务定义和评估协议来暴露。
    - 细粒度评估指标（如子目标完成度、成本-准确性、拖拽成功率）比单纯的通过/失败率提供更强的区分信号，能揭示聚合分数掩盖的性能差异。
    - 提升代理性能不仅需要更大的模型，还需要结构化的外部知识（技能、上下文字段）或明确针对所识别交互维度的训练过程。
    分歧:
    - 交互模态：一些工作强调在技能工件中保留视觉图形（多模态技能）的必要性，而另一些则专注于从原始截图中学习视觉定位而不显式保留图形，这反映了对关键视觉信息是什么的不同假设。
    - 评估目标：基准测试在优化单纯任务完成准确率、联合成本-准确性或空间可靠性上存在差异，导致对GUI代理主要失败模式（观察控制、接地不确定性或上下文丢失）的论断各不相同。
    - 训练范式：GUICrafter主张使用少量高质量数据的弱监督，ScaleCUA依赖可验证合成任务的在线RL，MemGUI-Agent则使用带有显式上下文动作标注的监督微调，反映了如何实现高效、鲁棒学习的不同路径。
    开放问题:
    - 所提出的交互形式化（如动态屏幕、拖拽）是否覆盖了所有真实世界的GUI操作，并且能否组合成一个统一的交互理论？
    - 不确定性量化如何从单步接地扩展到完整的代理轨迹，它又如何与长时域上下文管理相互作用？
    - 在什么条件下，弱监督或合成RL带来的训练效率提升能够迁移到所评估基准之外的全新应用和界面？
