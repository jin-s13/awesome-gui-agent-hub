  related_work_outline:
  - 'Mainstream direction: The dominant work is building end-to-end runnable stacks
    for GUI and computer-use agents, spanning online RL training (OpenWebRL, OpenForgeRL),
    weak supervision (GUICrafter), and deployable orchestration around model calls.'
  - 'Shared research pattern: Multiple papers wrap a model with a stateful harness
    or memory layer that captures trajectories, skills, or tool calls, then evaluate
    on live or benchmark GUI tasks.'
  - 'Key differences: They differ in supervision: unannotated screenshots vs online
    RL rollouts; representation: visual skill artifacts vs callable memories vs diffusion
    generation; and evaluation target: end-task success vs step-level transitions
    vs safety attacks.'
  - 'Trend evolution: The 2024-2026 evidence is concentrated at the current frontier,
    with 2026 systems increasingly treating GUI agents as trainable, containerized,
    and safety-audited agents rather than single-shot models.'
  - 'Open questions: Error recovery after RL remains weak; offline step diagnostics
    may not capture live dynamics; reusable memories and skills may not generalize
    across applications; safety hardening appears domain-conditioned.'
  related_work_outline_zh:
  - 主流方向：主流工作是构建面向GUI和计算机使用代理的端到端可运行栈，涵盖在线强化学习训练（OpenWebRL、OpenForgeRL）、弱监督（GUICrafter）以及围绕模型调用的可部署编排。
  - 研究共性：多篇论文将模型嵌入有状态harness或记忆层，捕获轨迹、技能或工具调用，并在真实或基准GUI任务上进行评测。
  - 关键差异：监督信号不同（未标注截图 vs 在线RL回滚）；表示不同（视觉技能工件 vs 可调用记忆 vs 扩散生成）；评测目标不同（端任务成功 vs 步骤级过渡
    vs 安全攻击）。
  - 趋势演进：证据集中在2024-2026当前前沿，2026年系统更多将GUI代理视为可训练、容器化和需安全审计的智能体，而非单次模型调用。
  - 开放问题：RL训练后的错误恢复仍然较弱；离线步骤诊断未必能反映真实动态；可复用记忆和技能未必跨应用泛化；安全加固呈领域条件性。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end GUI policy learning and RL orchestration
      what_it_solves: Turns weakly labeled, supervised, or live GUI interaction into
        policy improvement, covering environment rollouts, trajectory logging, multi-turn
        optimization, and alternative generative architectures for grounding and navigation.
      what_remains_open: Error recovery remains weak after RL; harness design strongly
        affects trainability; cross-platform and cross-action-space generalization
        is not fully evidenced beyond reported benchmarks.
    - line: Reusable GUI skills and execution memory
      what_it_solves: Encodes validated computer-use workflows into retrievable multimodal
        or parameter-controlled memories to reduce token cost, execution time, and
        repeated planning.
      what_remains_open: Evidence does not show cross-application generalization;
        replay is limited to deterministic applicability, and ambiguous or incompatible
        steps are rejected or repaired.
    - line: Step-level diagnostics and safety auditing
      what_it_solves: Measures whether computer-use models understand GUI transitions
        and whether frontier agents resist prompt-injection attacks in specific domains.
      what_remains_open: Offline benchmarks omit live timing and asynchronous dynamics;
        safety evidence is domain-conditioned and does not reproduce optimized attacks;
        desktop coverage is Linux-only with a fixed action vocabulary.
    consensus:
    - GUI agent research is shifting from single model outputs to full system stacks
      that manage training, inference, memory, and evaluation.
    - Grounding and state-transition verification are treated as central failure points,
      with several works targeting UI element identification or before-after action
      understanding.
    - Reinforcement learning from environment interaction is a common but still immature
      training paradigm, often initialized with small supervised or weakly supervised
      data.
    - Open frameworks and public benchmarks are valued as counters to closed evaluation,
      though many papers still leave independent reproduction partially unverified.
    disagreements:
    - 'Reusable knowledge representation differs: visual multimodal skill artifacts
      retain figures and text, while execution memory uses parameter-controlled callable
      records with coordinate reaiming.'
    - 'Supervision strategy differs: one line learns visual grounding from massive
      unannotated screenshots, another uses online multi-turn RL on live sites, and
      another trains through harness model-call interception.'
    - 'Evaluation target differs: some works report end-task success on OSWorld, Online-Mind2Web,
      WebVoyager, or CUA-World, while others isolate step-level temporal ordering
      and action recognition, or measure attack success rates.'
    - 'Deployment setting differs: systems assume containerized rollouts, live web
      sessions, offline Linux desktop traces, or browser and coding safety audits,
      which changes what conclusions can be generalized.'
    open_questions:
    - Why does error recovery remain weak even after reinforcement learning, and which
      training signal or harness property would improve it?
    - Can reusable skills and execution memories transfer beyond the application or
      deterministic replay conditions where they were created?
    - Do offline step-level diagnostics predict live GUI success, latency, and recovery
      behavior under asynchronous interaction dynamics?
    - What would domain-independent safety hardening require, given browser-hardened
      models remain vulnerable in coding tasks?
  literature_review_zh:
    研究路线矩阵:
    - 路线: GUI代理的端到端策略学习与强化学习编排
      解决的问题: 将弱标注、监督或真实GUI交互转化为策略改进，覆盖环境回滚、轨迹记录、多轮优化以及用于接地和导航的替代生成架构。
      尚未覆盖: 强化学习后错误恢复仍然较弱；harness设计显著影响可训练性；跨平台和跨动作空间的泛化在所报告基准之外证据不足。
    - 路线: 可复用GUI技能与执行记忆
      解决的问题: 将经过验证的计算机使用工作流编码为可检索的多模态或参数控制记忆，以降低token成本、执行时间和重复规划。
      尚未覆盖: 证据未显示跨应用泛化；回放限于确定性适用条件，模糊或不可兼容步骤会被拒止或修复。
    - 路线: 步骤级诊断与安全审计
      解决的问题: 衡量计算机使用模型是否理解GUI过渡，以及前沿代理是否在特定领域抵抗提示注入攻击。
      尚未覆盖: 离线基准忽略真实时序和异步动态；安全证据具有领域条件性且未复现优化攻击；桌面覆盖仅限Linux和固定动作词汇。
    共识:
    - GUI代理研究正从单模型输出转向覆盖训练、推理、记忆和评测的完整系统栈。
    - 接地和状态过渡验证被视为核心失败点，多项工作针对UI元素识别或动作前后理解展开。
    - 来自环境交互的强化学习是常见但仍不成熟的训练范式，通常以少量监督或弱监督数据初始化。
    - 开放框架和公开基准被视为对封闭评测的补充，但许多论文的独立复现仍存在未完全验证的缺口。
    分歧:
    - 可复用知识的表示不同：视觉多模态技能工件保留图形和文本，而执行记忆使用带坐标重定位的参数控制可调用记录。
    - 监督策略不同：一条路线从海量未标注截图学习视觉接地，另一条在真实网站上使用在线多轮RL，还有一条通过harness模型调用拦截进行训练。
    - 评测目标不同：部分工作报告OSWorld、Online-Mind2Web、WebVoyager或CUA-World上的端任务成功率，另一些则分离步骤级时序排序和动作识别，或测量攻击成功率。
    - 部署设定不同：系统假设容器化回滚、真实网页会话、离线Linux桌面轨迹或浏览器与编码安全审计，这些差异限制了结论的可泛化性。
    开放问题:
    - 为什么强化学习后错误恢复仍然较弱，哪些训练信号或harness属性可以改善这一点？
    - 可复用技能和执行记忆能否超越其创建时的应用或确定性回放条件进行迁移？
    - 离线步骤级诊断能否预测真实GUI交互中的成功、延迟和异步动态下的恢复行为？
    - 鉴于浏览器加固模型在编码任务中仍然脆弱，什么才是领域无关的安全加固？
