  related_work_outline:
  - 'Mainstream direction: Building realistic GUI agent benchmarks and methods around
    visual grounding, action prediction, and training or harness optimization. The
    current frontier emphasizes fine-grained evaluation, weak or reinforcement learning
    training, and observation or uncertainty control.'
  - 'Shared research pattern: Introduce a task distribution or benchmark, evaluate
    static or frozen models, then show a training, harness, or perception method improves
    a bottleneck such as drag, observation efficiency, grounding uncertainty, or harness
    transfer.'
  - 'Key differences: Work differs in supervision (weakly supervised, online RL, harness
    editing), interaction target (drag, GUI+CLI, dynamic short-video, video-guided,
    single-step grounding), and evaluation metric (task success, sub-goal, cost-accuracy,
    uncertainty/conformal coverage).'
  - 'Trend evolution: Evidence is concentrated within the 2026 frontier, so no long
    trend is visible. Current shifts move evaluation from click/task benchmarks toward
    dynamic interfaces, fine-grained scoring, cost-aware observation, spatial risk,
    and self-improvement without full retraining.'
  - 'Open questions: Whether observation control generalizes beyond short-video platforms;
    whether synthesized RL or weak supervision transfers across platforms; whether
    harness gains isolate from model gains; and whether grounding uncertainty extends
    to multi-step trajectories.'
  related_work_outline_zh:
  - 主流方向：围绕视觉定位、动作预测、训练或执行框架优化构建真实GUI代理基准与方法。当前前沿强调细粒度评估、弱监督或强化学习训练，以及观察或不确定性控制。
  - 研究共性：先引入任务分布或基准，评估静态或冻结模型，再展示训练、执行框架或感知方法如何改善拖拽、观察效率、定位不确定性或执行框架迁移等瓶颈。
  - 关键差异：监督方式（弱监督、在线强化学习、执行框架编辑）、交互对象（拖拽、GUI+CLI、动态短视频、视频引导、单步定位）和评估指标（任务成功、子目标、成本准确率、不确定性或共形覆盖）不同。
  - 趋势演进：现有证据集中在2026年前沿，难以判断长期趋势；当前变化是从点击与任务基准转向动态界面、细粒度评分、成本感知观察、空间风险以及不完整重训的自改进。
  - 开放问题：观察控制能否推广到短视频平台之外；合成强化学习或弱监督能否跨平台迁移；执行框架收益能否与模型收益隔离；定位不确定性能否扩展到多步轨迹。
  literature_review:
    line_of_work_matrix:
    - line: Realistic GUI interaction and fine-grained evaluation benchmarks
      what_it_solves: Covers interaction modes that simple click/task benchmarks miss,
        such as GUI plus CLI, drag, and dynamic live interfaces, and measures sub-goal
        or cost-aware success instead of binary task completion.
      what_remains_open: Whether these benchmarks transfer across operating systems,
        interface layouts, dynamic content types, and long-horizon deployments remains
        under-evidenced.
    - line: Data-efficient and reward-driven training recipes
      what_it_solves: Reduces reliance on expensive human annotations and scales online
        reinforcement learning through verifiable task synthesis and curriculum-based
        visual grounding.
      what_remains_open: Whether reported gains are robust beyond specific suites
        and backbone models, and which training component drives improvement, is not
        isolated.
    - line: Observation selection and dynamic-interface perception
      what_it_solves: Reduces information overload and selects task-relevant visual
        evidence for video-guided or continuously changing GUI tasks.
      what_remains_open: Observation control generalization beyond short-video platforms
        and its integration with action grounding are unresolved.
    - line: Calibrated grounding and uncertainty-aware action interfaces
      what_it_solves: Quantifies reliability of GUI grounding and produces spatial
        confidence regions for safer interaction and selective prediction.
      what_remains_open: Multi-step trajectories, cross-model transfer, and distribution-shift
        coverage remain uncertain.
    - line: Harness-level self-improvement around frozen models
      what_it_solves: Improves agent performance by optimizing the execution harness
        from repeated-run evidence and observed interface transitions without retraining
        backbone models.
      what_remains_open: Whether harness gains are sufficiently isolated from frozen
        model ability and transfer cleanly to new harnesses and platforms remains
        open.
    consensus:
    - 'The field agrees that GUI agent evaluation must move beyond binary task success
      toward finer-grained evidence: sub-goal completion, action accuracy, cost efficiency,
      and spatial or uncertainty quality.'
    - Realistic interaction coverage is treated as a core gap; click-only assumptions
      underestimate drag, mixed GUI/CLI, dynamic live content, and video-guided workflows.
    - Several methods share a pattern of improving frozen or lightly trained models
      through better supervision, harness edits, or perception rather than only end-to-end
      model scaling.
    - Visual grounding and observation behavior are recurring bottlenecks across benchmarks
      and methods.
    disagreements:
    - 'Supervision and optimization differ: weak supervision from unannotated screenshots,
      online RL from synthesized verifiable tasks, and harness editing around frozen
      backbones make different assumptions about annotation cost and training risk.'
    - Evaluation targets differ by interaction mode and deployment setting, spanning
      drag-only grounding, dynamic short-video browsing, mixed GUI/CLI desktop use,
      video-guided GUI tasks, and single-step grounding uncertainty.
    - 'Metrics differ in what success means: pass-at-one, fine-grained sub-goal completion,
      cost-accuracy, and conformal or ranking-based uncertainty capture different
      failure modes and are not directly comparable.'
    - Observation control is treated as an explicit first-class design in dynamic
      or video work, while static benchmark work often holds observation fixed and
      changes action or harness behavior.
    open_questions:
    - Can current training recipes scale beyond specific computer-use suites and specific
      VLMs without hidden overfitting to suite-specific reward structure?
    - Does observation control learned or evaluated on short-video platforms transfer
      to other dynamic surfaces and to multi-step planning?
    - Can uncertainty-aware grounding be extended from single-step executable grounding
      to end-to-end agent trajectories and closed-source interfaces?
    - How much of harness-level improvement comes from evidence quality, bounded source
      edits, and repeated-run aggregation rather than the frozen model's own capabilities?
    - Limitation fields are often missing in the packet; generalization, failure mode,
      and baseline or protocol gaps need targeted verification rather than being assumed.
  literature_review_zh:
    研究路线矩阵:
    - 路线: 真实GUI交互与细粒度评估基准
      解决的问题: 覆盖单纯点击或任务基准遗漏的交互模式，如GUI加CLI、拖拽和动态界面，并以子目标或成本感知指标代替二元任务完成。
      尚未覆盖: 这些基准在操作系统、界面布局、动态内容类型和长程部署中的可迁移性仍缺乏证据。
    - 路线: 数据高效与奖励驱动训练配方
      解决的问题: 降低对人类标注的依赖，通过可验证任务合成和课程式视觉定位扩展在线强化学习。
      尚未覆盖: 报告提升是否在特定测试套件和骨干模型之外稳健，以及哪个训练组件真正带来提升尚不清楚。
    - 路线: 观察选择与动态界面感知
      解决的问题: 减少信息过载，为视频引导或持续变化的GUI任务选择任务相关视觉证据。
      尚未覆盖: 观察控制能否泛化到短视频平台之外，并与动作定位有效结合仍未解决。
    - 路线: 校准定位与不确定性感知动作接口
      解决的问题: 量化GUI定位可靠性，并生成空间置信区域以支持更安全的交互和选择性预测。
      尚未覆盖: 多步轨迹、跨模型迁移和分布偏移下的覆盖度仍不明确。
    - 路线: 冻结模型之外的执行框架级自改进
      解决的问题: 通过重复运行证据和观察到的界面变化优化执行框架，在不重训骨干模型的情况下提升智能体表现。
      尚未覆盖: 执行框架收益是否与冻结模型能力充分隔离，以及能否迁移到新框架和平台仍待验证。
    共识:
    - 该领域认为GUI智能体评估应从二元任务成功转向更细粒度的证据：子目标完成、动作准确率、成本效率以及空间或不确定性质量。
    - 真实交互覆盖被视为核心缺口；仅点击的假设会低估拖拽、混合GUI/CLI、动态内容和视频引导工作流。
    - 多种方法共享同一模式：通过更好的监督、执行框架编辑或感知来改进冻结或轻量训练模型，而非只依赖端到端模型扩展。
    - 视觉定位和观察行为是跨基准与方法反复出现的瓶颈。
    分歧:
    - 监督与优化方式不同：未标注截图弱监督、可验证任务合成在线强化学习和围绕冻结模型的执行框架编辑，对标注成本与训练风险做出不同假设。
    - 评测目标按交互模式和部署设置不同，覆盖拖拽定位、动态短视频浏览、GUI/CLI混合桌面、视频引导任务和单步定位不确定性。
    - 指标对成功的定义不同：单次通过、细粒度子目标完成、成本准确率以及共形或排名不确定性捕捉不同失败模式，难以直接比较。
    - 动态或视频工作将观察控制视为显式一等设计，而静态基准常固定观察方式并改动动作或执行框架行为。
    开放问题:
    - 当前训练配方能否超越特定计算机使用套件和特定VLM，而不依赖套件奖励结构造成隐性过拟合？
    - 在短视频平台上学到或评估的观察控制能否迁移到其他动态界面和多步规划？
    - 不确定性感知定位能否从单步可执行基础扩展到端到端智能体轨迹和闭源接口？
    - 执行框架级改进中有多少来自证据质量、受控源码编辑和重复运行聚合，而非冻结模型自身能力？
    - 证据包中许多论文的限制字段缺失；泛化、失败模式以及基线与协议缺口需要目标验证，而不是直接假定。
