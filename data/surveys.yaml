  related_work_outline:
  - 'Mainstream direction: The current frontier concentrates on executable GUI/computer-use
    benchmarks evaluating real desktop, browser, or containerized tasks, with emphasis
    moving from single-step grounding to multi-step workflows.'
  - 'Shared research pattern: Papers often pair new tasks or environments with fine-grained
    metrics and agent improvements; visual grounding, sub-goal process signals, and
    benchmark verification recur.'
  - 'Key differences: They differ in platform/dynamics, supervision strategy, metric
    emphasis, and evaluation target such as single-step uncertainty, multi-step task
    success, or video-guided tasks.'
  - 'Trend evolution: Within the 2024-2026 frontier, evaluation is moving from static
