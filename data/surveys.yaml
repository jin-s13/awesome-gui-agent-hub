  related_work_outline_zh:
  - 主流方向：GUI智能体方法研究正从静态点击基准转向真实多步任务，覆盖桌面、动态短视频和拖拽等多类界面。
  - 研究共性：工作通过构建任务环境或优化训练/执行流程，揭示子目标完成、观察控制、动作模态或不确定性等细粒度缺口。
  - 关键差异：方法包括可验证在线强化学习与任务合成、未标注截图弱监督、冻结骨干执行框架优化；评测目标涵盖成功率、成本-准确性、子目标、不确定性及交互类型等不同维度。
  - 趋势演进：在2024-2026前沿内，研究向可验证合成数据、高效在线强化学习、自改进执行框架以及动态/未覆盖界面的专项评测演进。
  - 开放问题：模型贡献与执行框架/技能/规划器贡献分离、跨接口不确定性、多步轨迹评测和跨平台泛化仍是缺口。
  literature_review:
    line_of_work_matrix:
    - line: Method representation and objective design
      what_it_solves: Turns GUI agent training into concrete weak-supervision, reinforcement-learning,
        and verifiable-task objectives that reduce annotation cost or scale rollout
        coverage.
      what_remains_open: Whether these objectives transfer beyond reported OSWorld,
        ScienceBoard, and UI-TARS-style comparisons, and whether unannotated visual
        grounding supports long-horizon execution.
    - line: Planning and action-interface methods
      what_it_solves: Connects learned models to executable actions by optimizing
        execution harnesses, observation behavior, keyframe selection, and interaction
        modes such as drag.
      what_remains_open: How much gain comes from the model versus the harness, planner,
        or interface implementation, and how well these choices transfer to unseen
        tasks.
    - line: Verifiable task synthesis and efficient online RL scaling
      what_it_solves: Generates verifiable computer-use tasks and allocates online
        rollouts to improve sample efficiency for GUI agents.
      what_remains_open: Evaluation is concentrated on OSWorld and ScienceBoard; cross-environment
        verification and long-tail interface variability remain weakly evidenced.
    - line: Method evidence and ablation protocol
      what_it_solves: Separates method contribution from benchmark and dataset effects
        using fine-grained scores, sub-goal metrics, uncertainty benchmarks, and targeted
        datasets.
      what_remains_open: Evidence is mostly single-benchmark or single-interface;
        multi-step trajectory evaluation and distribution-shift robustness are not
        yet isolated.
    consensus:
    - Modern GUI-agent method work binds modeling improvements to executable or verifiable
      computer-use tasks, often evaluated on OSWorld/ScienceBoard-style suites or
      custom desktop, web, and video environments.
    - Fine-grained signals such as sub-goal completion, cost-accuracy, observation
      behavior, drag correctness, and uncertainty calibration reveal gaps that aggregate
      Pass@1 hides.
    - Training and self-improvement approaches reduce dependence on dense human annotation
      by using unannotated screenshots, verifiable synthetic tasks, or repeated-run
      evidence.
    - Interface assumptions are treated as first-class design choices; dynamic content,
      GUI/CLI mixtures, and drag actions affect grounding quality and task execution.
    disagreements:
    - 'Representation and supervision differ: some methods learn visual grounding
      from massive unannotated screenshots, others perform online RL on verifiable
      generated tasks, and others keep backbones frozen while optimizing the execution
      harness.'
    - 'Evaluation targets differ: aggregate task success, sub-goal completion, cost-accuracy,
      and post-hoc uncertainty/coverage are not interchangeable and lead to different
      conclusions about agent quality.'
    - 'Interaction scope differs: single-step executable grounding, multi-step application
      tasks, drag-heavy interactions, and dynamic short-video interfaces are covered
      unevenly.'
    - 'Transfer evidence differs: frozen-harness transfer is shown on WindowsAgentArena,
      but uncertainty-ranking transfer is reported weak across model tiers and interfaces,
      while training gains remain mostly benchmark-specific.'
    open_questions:
    - Can reported gains be decomposed into model, harness/planner, skill-library,
      benchmark-choice, and data-recipe contributions?
    - How do uncertainty quantification and observation-control findings extend from
      single-step grounding and short-video settings to multi-step desktop agent trajectories?
    - Do verifiable synthetic RL tasks and unannotated-screenshot objectives capture
      enough long-tail interface variability for deployment?
    - What evidence is still missing for drag, dynamic content, and cross-application
      GUI/CLI interactions in current method evaluations?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 方法表示与目标设计
      解决的问题: 把GUI智能体训练落实为弱监督、强化学习和可验证任务合成目标，减少标注或扩大验证覆盖。
      尚未覆盖: 这些目标是否迁移到OSWorld、ScienceBoard和UI-TARS式对比之外，以及未标注截图学习到的视觉定位是否支撑长程执行。
    - 路线: 规划与动作接口方法
      解决的问题: 通过优化执行框架、观察行为、关键帧选择和拖拽等交互模式，把模型输出连接为可执行动作。
      尚未覆盖: 模型增益有多少来自模型本身，而不是规划器、执行框架或接口实现，以及这些选择在未知任务上的迁移性。
    - 路线: 可验证任务合成与在线强化学习扩展
      解决的问题: 生成可验证计算机使用任务并分配在线采样，以提高GUI智能体的样本效率。
      尚未覆盖: 评测集中于OSWorld和ScienceBoard；跨环境验证与长尾界面变化的覆盖仍不明确。
    - 路线: 方法证据与消融协议
      解决的问题: 通过细粒度评分、子目标指标、不确定性基准和专项数据集，区分方法贡献与数据集/基准因素。
      尚未覆盖: 证据大多集中在单一基准或单一接口；多步轨迹和分布偏移鲁棒性尚未被隔离验证。
    共识:
    - GUI方法工作正把建模改进与可执行或可验证的计算机使用任务绑定，常在OSWorld、ScienceBoard或桌面/网页/视频等评测环境上验证。
    - 子目标完成、成本-准确性、观察行为、拖拽正确性和不确定性校准等细粒度信号能揭示Pass@1掩盖的缺口。
    - 训练与自改进方法通过未标注截图、可验证合成任务或重复运行证据，减少对昂贵密集标注的依赖。
    - 界面假设成为方法设计的核心；动态内容、GUI/CLI混合和拖拽动作会影响定位质量与任务执行。
    分歧:
    - 监督信号不同：基于大规模未标注截图的视觉定位、基于可验证任务的在线强化学习，以及保持骨干冻结只优化执行框架。
    - 评测目标不同：总体成功率、子目标完成、成本-准确性、不确定性/覆盖率并非同一指标，会得到不同结论。
    - 交互覆盖不同：单步可执行定位、多步应用任务、拖拽交互和动态短视频界面的覆盖不均衡。
    - 迁移证据不同：冻结执行框架展示出跨基准迁移，但不确定性排名跨模型/接口迁移弱，训练增益多集中在特定基准。
    开放问题:
    - 报告增益能否分解为模型、执行框架/规划器、技能库、基准选择和数据配方的贡献？
    - 不确定性量化与观察控制结论能否从单步定位和短视频场景扩展到多步桌面代理轨迹？
    - 可验证合成任务和未标注截图目标是否覆盖足够的长尾界面变化以支持部署？
    - 关于拖拽、动态内容和跨应用GUI/CLI交互的方法评测证据还有哪些缺口？
