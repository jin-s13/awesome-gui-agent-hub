  - 主流方向：构建端到端多模态计算机使用/GUI智能体及其训练、部署、评测层；强调可验证任务成功、统一动作空间、强化学习或弱监督，以及轻量推理服务。
  - 研究共性：多数工作从视觉定位和动作生成出发，采用分阶段训练或技能检索，并在移动、桌面、网页或OS基准上评测；越来越多加入延迟、恢复和个性化探针。
  - 关键差异：动作表示（潜空间评分、扩散、自回归VLM、GUI+代码）不同；监督来源（未标注截图、生成混合工件、harness回放）不同；评测焦点（任务成功、效率、恢复、用户偏好）不同。
  - 趋势演进：在2024-2026较窄前沿内，从孤立GUI策略转向集成训练/服务框架和失败模式诊断基准；系统编排与数据效率成为核心。
  - 开放问题：跨平台泛化、错误恢复、harness设计影响、个性化行为与独立可复现性仍证据不足；部分论文缺少明确局限或工件验证。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end training and orchestration stacks for GUI and computer-use
        agents
      what_it_solves: Turning multimodal GUI agents into deployable workflows, including
        RL training over complex inference harnesses, application-artifact supervision,
        and unified GUI/code action spaces.
      what_remains_open: Error recovery remains weak; trainability depends on harness
        design; independent reproduction across infrastructure is not fully evidenced.
    - line: Efficient action policy and serving architectures
      what_it_solves: Reducing latency and parameter cost for GUI action selection
        via decoder-free latent scoring or block-wise diffusion while retaining competitive
        grounding/navigation accuracy.
      what_remains_open: Out-of-distribution and cross-platform generalization; some
        accuracy remains below autoregressive baselines; screen-dynamics pretraining
        may be unnecessary.
    - line: Skill, knowledge, and weak-supervision artifacts
      what_it_solves: Encoding reusable multimodal task knowledge and reducing human
        annotation through unannotated screenshot pretraining or hierarchical visual-text
        skill libraries.
      what_remains_open: Whether visual skill artifacts and weak-supervision transfer
        across applications and deployment settings; limitations are not systematically
        documented.
    - line: Diagnostic evaluation for failure modes and user-facing behavior
      what_it_solves: Measuring recovery consistency and preference personalization
        via controlled probes rather than only task success.
      what_remains_open: Current agents underutilize latent recovery; personalized
        task performance remains low; evaluation frameworks need broader environment
        coverage.
    consensus:
    - Recent work converges on grounded multimodal agents that combine visual GUI
      perception, instruction following, and executable actions in a single system
      or training loop.
    - Training and evaluation increasingly rely on verifiable task success or controlled
      probes across simulator, desktop, web, and mobile environments rather than static
      labels alone.
    - 'Efficiency and data cost are common concerns: authors pursue weak supervision,
      compact or skill-based retrieval, and low-latency scoring.'
    - Recovery, personalization, and error handling are recognized as important failure
      modes separate from nominal task completion.
    disagreements:
    - 'Action generation differs: decoder-free latent scoring, block-wise diffusion
      decoding, and autoregressive/skill-augmented visual-language generation imply
      different latency, accuracy, and controllability trade-offs.'
    - 'Supervision strategies differ: unannotated screenshots with RL calibration,
      hybrid application-artifact supervision with online RL, and harness-native rollout
      logging represent distinct training data pipelines.'
    - 'Evaluation targets differ: some focus on grounding/navigation accuracy, others
      on OS-level task success, recovery consistency, personalization, or cross-platform
      transfer.'
    - 'Deployment settings differ: some systems optimize single-policy serving, while
      others route through orchestration scaffolds, harnesses, or external skill libraries,
      affecting reproducibility and trainability.'
    open_questions:
    - Do efficient GUI policies generalize beyond AndroidControl or reported GUI benchmarks
      to desktop, web, and out-of-distribution interfaces?
    - Can recovery and personalization failures be reduced by architecture, training,
      or orchestration changes rather than only diagnosed?
    - How do harness design and unified GUI/code action spaces affect error recovery
      and trainability across deployment environments?
    - What independent reproduction evidence exists for these systems across teams
      and infrastructure, given several sources lack explicit limitations or artifact
      signals?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端训练与编排栈（GUI/计算机使用智能体）
      解决的问题: 把多模态GUI策略转化为可部署工作流，包括复杂harness的RL训练、应用工件监督、统一GUI/代码动作空间。
      尚未覆盖: 错误恢复仍较弱；训练性受harness设计影响；跨基础设施独立复现证据不足。
    - 路线: 高效动作策略与服务架构
      解决的问题: 通过无解码器潜空间评分或块级扩散降低动作选择延迟和参数成本，同时保持可用定位/导航精度。
      尚未覆盖: 跨平台与分布外泛化、部分精度仍低于自回归基线、屏幕动态预训练可能不必要。
    - 路线: 技能、知识与弱监督工件
      解决的问题: 用分层多模态技能或海量未标注截图减少人工标注并注入可复用任务知识。
      尚未覆盖: 跨应用与部署环境迁移性未充分验证；局限性未系统记录。
    - 路线: 失败模式与用户行为的诊断评测
      解决的问题: 通过受控探针测量恢复一致性和偏好个性化，而非仅看任务成功率。
      尚未覆盖: 当前智能体未能充分利用潜在恢复能力；个性化任务表现仍低；评测环境覆盖面有限。
    共识:
    - 近邻工作收敛到同一个趋势：将视觉GUI感知、指令跟随和可执行动作整合到单一系统或训练循环中。
    - 训练和评测越来越依赖可验证任务成功或受控探针，而不是仅使用静态标签。
    - 效率与数据成本是共同关注点；论文试图通过弱监督、紧凑评分或技能检索降低延迟和标注负担。
    - 恢复、个性化和错误处理被视为独立于名义任务完成的重要失败模式。
    分歧:
    - 动作生成方式不同：无解码器潜空间评分、块级扩散解码和自回归/技能增强视觉语言生成，意味着不同的延迟、精度和可控性权衡。
    - 监督源不同：未标注截图加RL校准、应用工件混合监督加在线RL、harness原生回放日志，构成不同数据管线。
    - 评测目标不同：有的关注定位/导航精度，有的关注OS任务成功、恢复一致性、个性化或跨平台迁移。
    - 部署设置不同：有的优化单策略服务，有的依赖编排脚手架、harness或外部技能库，影响可复现性与可训练性。
    开放问题:
    - 高效GUI策略能否泛化到AndroidControl之外的桌面、网页和分布外界面？
    - 恢复和个性化失败是否能通过架构、训练或编排改善，而不只是被诊断？
    - harness设计与统一GUI/代码动作空间如何影响跨环境的错误恢复和可训练性？
    - 这些系统跨团队和基础设施的独立复现证据是什么？若干来源缺少明确局限或工件信号。
