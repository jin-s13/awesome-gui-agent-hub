  related_work_outline:
  - 'Mainstream direction: Realistic GUI/OS agent benchmarks with executable tasks,
    large task suites, and fine-grained scoring dominate; examples include MacAgentBench,
    LivingScreen, and evaluations built on OSWorld-Verified.'
  - 'Shared research pattern: Build a faithful environment or benchmark, compare frontier
    multimodal agents, then add signals beyond Pass@1 such as sub-goal completion,
    cost-accuracy, or uncertainty calibration.'
  - 'Key differences: Evaluation targets range from static desktop GUI grounding to
    dynamic short-video interaction and video-guided tasks; interaction modes and
    supervision signals also differ, including harness-level rule optimization, online
    RL, and weak supervision from unannotated screenshots.'
  - 'Trend evolution: Within the 2024-2026 frontier, work is shifting from single-step
    GUI grounding toward dynamic real-world environments, observation-control and
    uncertainty metrics, and benchmark-driven training or harness improvement.'
  - 'Open questions: Cross-platform generalization, alignment between proxy metrics
    and downstream user utility, stability under implementation and compute variation,
    and missing reproducibility artifacts remain unresolved.'
  related_work_outline_zh:
  - 主流方向：构建真实GUI/OS代理基准，提供可执行任务和细粒度评分，典型如MacAgentBench、LivingScreen以及基于OSWorld-Verified的评测。
  - 研究共性：在忠实环境或基准上比较前沿多模态代理，除Pass@1之外引入子目标完成、成本-准确性或不确定性校准等更细信号。
  - 关键差异：评测目标从静态桌面GUI基础到动态短视频交互与视频引导任务不等；交互模式与监督信号也不同，如执行框架级规则优化、在线RL和未标注截图弱监督。
  - 趋势演进：在2024-2026前沿内，研究从单步GUI基础转向动态真实环境、观察控制与不确定性指标，以及基准驱动的训练和执行框架改进。
  - 开放问题：跨平台泛化、代理指标与下游用户效用的对齐、不同实现与算力预算下的稳定性，以及可复现工件缺失仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: Real-world GUI/OS task and environment construction
      what_it_solves: Provides executable tasks across desktop, browser, and video-guided
        interfaces with grounded interaction states and shared evaluation surfaces.
      what_remains_open: Coverage of OS/platform diversity, dynamic content, and whether
        the task distribution matches real deployment workflows remains limited.
    - line: Fine-grained metrics and stress-test design
      what_it_solves: Probes sub-goal completion, information efficiency, observation
        control, and uncertainty calibration beyond aggregate pass/fail scores.
      what_remains_open: Proxy metrics have not been tied to downstream user utility
        or deployment risk; cross-model and cross-interface transfer of uncertainty
        rankings is weak.
    - line: Task synthesis, harness optimization, and reproducible baselines
      what_it_solves: Uses shared benchmarks such as OSWorld, OSWorld-Verified, ScienceBoard,
        CUA-World, OSExpert-Eval, and WindowsAgentArena to compare training and harness-level
        methods.
      what_remains_open: Reproducibility and stability across implementations and
        compute budgets are not fully auditable, and several provided analyses lack
        explicit limitation artifacts.
    consensus:
    - Recent work treats GUI automation as executable multimodal agent tasks in real
      or faithful simulated environments rather than text-only instruction following.
    - Fine-grained evaluation is necessary because aggregate Pass@1 can hide differences
      in sub-goal completion, observation behavior, or confidence quality.
    - Frontier multimodal models still show a clear gap to human-level reliability
      on dynamic or multi-application GUI tasks.
    disagreements:
    - 'Evaluation targets differ: some benchmarks assess single-step GUI grounding,
      while others assess multi-step agent trajectories, short-video platform interaction,
      or video-guided GUI workflows.'
    - 'Interaction modes differ: static desktop and browser tasks emphasize action
      grounding, while dynamic-screen tasks emphasize observation control under changing
      content.'
    - 'Supervision and improvement signals differ: methods range from weakly supervised
      visual grounding on unannotated screenshots, to verifiable task synthesis with
      online RL, to harness-level rule optimization with frozen models.'
    open_questions:
    - How can benchmark metrics be connected to downstream user utility, risk, and
      decision quality rather than only task completion proxies?
    - What evidence would show benchmark conclusions remain stable across OS/platform
      versions, interface changes, implementations, and compute budgets?
    - How should observation control and uncertainty calibration be evaluated in multi-step
      dynamic GUI agent trajectories?
    - Where are code, dataset, and limitation artifacts missing from the evidence
      packet, and do those verification gaps affect the comparability of state-of-the-art
      claims?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 真实GUI/OS任务与环境构建
      解决的问题: 在桌面、浏览器和视频引导界面中提供可执行任务，并形成有共同交互状态的评测表面。
      尚未覆盖: 对OS/平台多样性、动态内容的覆盖，以及任务分布是否匹配真实部署工作流仍然有限。
    - 路线: 细粒度指标与压力测试设计
      解决的问题: 在总分之外检验子目标完成、信息效率、观察控制和不确定性校准。
      尚未覆盖: 代理指标尚未与下游用户效用或部署风险建立关联；不确定度排名的跨模型和跨接口迁移较弱。
    - 路线: 任务合成、执行框架优化与可复现基线
      解决的问题: 利用OSWorld、OSWorld-Verified、ScienceBoard、CUA-World、OSExpert-Eval和WindowsAgentArena等共享基准比较训练方法与执行框架方法。
      尚未覆盖: 不同实现和算力预算下的可复现性与结论稳定性尚不可完全审计，且证据中若干分析缺少明确局限性工件。
    共识:
    - 近期研究将GUI自动化视为真实或高保真模拟环境中的可执行多模态代理任务，而不是纯文本指令跟随。
    - 细粒度评估是必要的，因为总体Pass@1可能掩盖子目标完成、观察行为或置信度质量上的差异。
    - 前沿多模态模型在动态或多应用GUI任务上仍与人类可靠水平存在明显差距。
    分歧:
    - 评测目标不同：有的基准评估单步GUI基础，有的评估多步代理轨迹、短视频平台交互或视频引导的GUI工作流。
    - 交互模式不同：静态桌面和浏览器任务强调动作基础，动态屏幕任务强调内容变化下的观察控制。
    - 监督与改进信号不同：方法包括从未标注截图的弱监督视觉基础、可验证任务合成与在线RL，以及冻结模型的执行框架级规则优化。
