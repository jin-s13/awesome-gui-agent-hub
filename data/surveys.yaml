  related_work_outline:
  - 'Mainstream direction: GUI-agent research is consolidating around real-world and
    dynamic computer-use evaluation and training, with emphasis on verifiable task
    synthesis, weak supervision, harness-level self-improvement, and fine-grained
    action/observation control.'
  - 'Shared research pattern: Papers pair a benchmark or environment with model or
    training evaluation, measure step-level or task-level grounding, and report failures
    beyond aggregate success such as observation control, sub-goal completion, or
    uncertainty transfer.'
  - 'Key differences: Evaluation targets differ across desktop GUI+CLI, dynamic short-video,
    video-guided keyframe selection, drag-only interaction, and single-step grounding
    uncertainty; training interventions differ across online RL, weak-supervised curricula,
    and frozen-harness optimization.'
  - 'Trend evolution: Within the available 2024-2026 window, the topic is moving from
    static click/type benchmarks toward dynamic, multi-interface, evidence-driven
    training and harness adaptation, with increasing attention to verifiable rewards
    and data efficiency.'
  - 'Open questions: How well do gains transfer across OS, interface dynamics, action
    spaces, and open/closed model tiers; whether observation control and uncertainty
    calibration can improve without target-specific re-evaluation.'
  related_work_outline_zh:
  - 主流方向：GUI代理研究正围绕真实与动态计算机使用评测和训练收敛，强调可验证任务合成、弱监督、harness级自改进以及细粒度动作/观察控制。
  - 研究共性：论文通常将基准或环境与模型或训练评测配对，测量步骤级或任务级grounding，并在总体成功率之外报告观察控制、子目标完成或不确定性迁移等失效。
  - 关键差异：评测目标涵盖桌面GUI+CLI、动态短视频、视频引导关键帧、拖拽交互和单步grounding不确定性；训练干预涵盖在线RL、弱监督课程和冻结harness优化。
  - 趋势演进：在现有2024-2026窗口内，主题从静态点击/输入基准走向动态、多接口、证据驱动的训练与harness适应，更加强调可验证奖励和数据效率。
  - 开放问题：收益能否跨OS、界面动态、动作空间以及开放/闭源模型层级迁移；观察控制和不确定性校准能否避免目标特定重评。
  literature_review:
    line_of_work_matrix:
    - line: Real-world and dynamic GUI benchmark construction
      what_it_solves: 'Provides coverage for under-tested GUI action spaces and interfaces:
        desktop GUI+CLI, dynamic short-video screens, drag gestures, and grounding
        confidence.'
      what_remains_open: Many benchmarks remain limited to a single interface family
        or interaction granularity; multi-step trajectory evaluation and cross-platform
        generalization are incomplete.
    - line: Video-guided GUI observation and keyframe extraction
      what_it_solves: Reduces video observation overhead for MLLM-based GUI agents
        by selecting task-relevant keyframes for video-guided tasks.
      what_remains_open: Evidence is limited to VideoQA and GUI interactive benchmarks;
        marginal gains and transfer to other video interfaces are not established.
    - line: Training and data-scaling for GUI action prediction
      what_it_solves: Creates scalable training signals for computer-use agents through
        verifiable task synthesis, online RL, and weak supervision from unannotated
        screenshots.
      what_remains_open: Results are mostly reported on OSWorld and ScienceBoard;
        the relative contribution of task synthesis, frontier sampling, and visual
        context segmentation is not separated in available evidence.
    - line: Harness-level and scaffold optimization around frozen models
      what_it_solves: Improves GUI agent performance without retraining backbone models
        by evolving executable harnesses from observed action-effect evidence.
      what_remains_open: Transfer beyond OSWorld-Verified and WindowsAgentArena, and
        how much gain comes from harness edits versus underlying model capability,
        needs further evidence.
    - line: Uncertainty quantification and calibration for GUI grounding
      what_it_solves: Benchmarks post-hoc uncertainty methods for single-step GUI
        grounding, selective UQ ranking transfer, and calibrated click regions.
      what_remains_open: Multi-step agent trajectories and cross-tier open/closed-model
        transfer remain weak; conformal coverage degrades under interface or calibration-test
        shift.
    consensus:
    - Current work agrees that aggregate success rates are insufficient for GUI-agent
      evaluation; fine-grained sub-goal, action-type, interaction, and uncertainty
      metrics expose hidden model differences.
    - There is agreement that frozen pretrained or frontier models still leave important
      capability gaps, particularly in observation control and complex action coverage.
    - Multiple papers converge on reducing annotation or reward engineering costs
      through synthetic tasks, weak supervision, or harness-level adaptation rather
      than only collecting human demonstrations.
    disagreements:
    - 'Evaluation scenarios differ: some focus on static desktop click/type and CLI
      tasks, while others target dynamic short-video, drag, or video-guided interaction,
      leading to different observation and action-space assumptions.'
    - 'Intervention level differs: training-oriented methods optimize model policy
      via online RL or weak supervision, while another line keeps model weights frozen
      and optimizes the execution harness.'
    - 'Evidence granularity differs: uncertainty quantification covers only single-step
      grounding, whereas other work emphasizes multi-step task completion, creating
      different evaluation targets and generalization claims.'
    open_questions:
    - Does harness-level improvement transfer to unseen OS, application, and action
      spaces without re-optimization?
    - Can observation control be trained or calibrated so agents avoid over-/under-observation
      without task-specific metrics or target re-ranking?
    - How much do synthetic task generation, frontier sampling, and visual context
      segmentation individually contribute to OSWorld and ScienceBoard gains?
    - Which drag, CLI, video-guided, and uncertainty findings scale to multi-step,
      multi-application, cross-interface deployments?
    - Can the empty limitation fields and missing ablation/code/dataset details be
      filled to verify transfer and failure-mode claims?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 真实与动态GUI基准构建
      解决的问题: 覆盖未充分测试的GUI动作空间和界面，包括桌面GUI+CLI、动态短视频、拖拽交互与grounding置信度。
      尚未覆盖: 许多基准仍限于单一界面族或交互粒度；多步轨迹评估与跨平台泛化仍不完整。
    - 路线: 视频引导的GUI观察与关键帧提取
      解决的问题: 通过任务相关关键帧降低视频引导GUI代理的观察开销，连接VideoQA与GUI交互任务。
      尚未覆盖: 证据限于VideoQA和GUI交互基准，跨视频界面的迁移尚不明确。
    - 路线: GUI动作预测的训练与数据规模化
      解决的问题: 通过可验证任务合成、在线RL和未标注截图弱监督，降低computer-use代理训练数据成本。
      尚未覆盖: 结果主要在OSWorld和ScienceBoard上；任务合成、frontier sampling和视觉上下文分割的相对贡献未分离。
    - 路线: 冻结模型之上的harness/脚手架优化
      解决的问题: 在不重训骨干模型的情况下，利用动作-效果证据演进执行框架。
      尚未覆盖: OSWorld-Verified和WindowsAgentArena之外的迁移，以及harness修改相对模型能力的增益未充分证明。
    - 路线: GUI grounding的不确定性与校准
      解决的问题: 对单步GUI grounding的后验不确定性方法进行基准评测，分析排名迁移和共形点击区域。
      尚未覆盖: 多步代理轨迹与跨开放/闭源迁移较弱，共形覆盖在校准-测试或接口偏移下退化。
    共识:
    - 多项研究一致认为总体成功率不足以评估GUI代理，细粒度子目标、动作类型、交互和不确定性指标能揭示隐藏差异。
    - 多项工作同意现有预训练或前沿模型在观察控制和复杂动作覆盖上仍有明显能力缺口。
    - 多项工作倾向于通过合成任务、弱监督或harness级适配降低标注与奖励工程成本，而非只收集人工演示。
    分歧:
    - 评测场景差异：有的关注静态桌面点击/输入和CLI，有的关注动态短视频、拖拽或视频引导交互，导致观察与动作空间假设不同。
    - 干预层级差异：训练类方法优化模型策略，如在线RL或弱监督；另一些保持模型权重冻结并优化执行harness。
    - 证据粒度差异：不确定性评测仅覆盖单步grounding，而其他工作强调多步任务完成，因此评测目标与泛化主张不同。
    开放问题:
    - harness级改进能否在未见OS、应用和动作空间中无需重新优化而迁移？
    - 观察控制能否通过训练或校准避免过度/不足观察，并且不依赖任务特定度量或目标重排？
    - 合成任务生成、frontier sampling和视觉上下文分割对OSWorld/ScienceBoard收益的独立贡献是多少？
    - 拖拽、CLI、视频引导和不确定性相关结论能否扩展到多步、多应用、跨接口部署？
    - 能否补充空的局限性字段以及缺失的消融、代码和数据集细节，以验证迁移与失效模式相关结论？
