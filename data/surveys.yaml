  related_work_outline:
  - 'Mainstream direction: Constructing more realistic, diverse, and long-horizon
    GUI agent benchmarks beyond static clicking, such as MacAgentBench for macOS,
    LivingScreen for dynamic short-video platforms, and DragOn for drag interactions.'
  - 'Shared research pattern: Training specialized GUI agents with scalable methods—online
    RL with synthetic task synthesis (SCALECUA), weakly-supervised learning from unannotated
    screenshots (GUICrafter), and proactive context management (MemGUI-Agent).'
  - 'Key differences: Benchmarks emphasize different evaluation dimensions—fine-grained
    sub-goal scoring, information efficiency, uncertainty quantification, and drag-based
    tasks—while method papers diverge in training paradigm (RL, weak supervision,
    supervised fine-tuning) and action space design.'
  - 'Trend evolution: Within the 2024–2026 frontier, the field is moving from click-only
    accuracy to holistic agent capability: observation control, multi-step planning,
    cross-application robustness, and reliability-aware evaluation.'
  - 'Open questions: How to transfer uncertainty estimates across model families and
    interfaces, how to balance observation cost with task success, and how to ensure
    synthetic training data does not introduce hidden biases.'
  related_work_outline_zh:
  - 主流方向：构建更真实、多样、长时域的GUI智能体基准，超越静态点击，如MacAgentBench（macOS）、LivingScreen（动态短视频平台）和DragOn（拖拽交互）。
  - 研究共性：用可扩展方法训练专用GUI智能体——在线强化学习与合成任务生成（SCALECUA）、从未标注截图进行弱监督学习（GUICrafter）、主动上下文管理（MemGUI-Agent）。
  - 关键差异：基准测试强调不同评估维度——细粒度子目标评分、信息效率、不确定性量化、拖拽任务；方法论文在训练范式（RL、弱监督、监督微调）和动作空间设计上存在分歧。
  - 趋势演进：在2024-2026前沿内，领域正从点击准确率转向整体智能体能力：观察控制、多步规划、跨应用鲁棒性和可靠性感知评估。
  - 开放问题：如何跨模型族和接口迁移不确定性估计，如何平衡观察成本与任务成功，如何确保合成训练数据不引入隐藏偏差。
  literature_review:
    line_of_work_matrix:
    - line: Method representation and objective design
      what_it_solves: Designing training objectives, loss functions, and curriculum
        learning schedules to train GUI agents with limited annotation and improve
        long-horizon task completion.
      what_remains_open: Whether these training recipes transfer across diverse platforms
        and task families, and how synthetic data quality affects RL outcomes.
    - line: Planning and action-interface methods
      what_it_solves: Expanding the action space and context management strategies
        of GUI agents to handle dynamic interfaces, drag interactions, and multi-step
        planning.
      what_remains_open: How new action types integrate with existing click-based
        planners, and the generalization of context management strategies beyond the
        training domain.
    - line: Method evidence and ablation protocol
      what_it_solves: Providing standardized benchmarks and metrics (fine-grained
        scoring, information efficiency, uncertainty quantification) to evaluate and
        diagnose GUI agent capabilities.
      what_remains_open: Cross-benchmark comparability and validation of uncertainty
        quantification methods in real-world deployment settings.
    consensus:
    - Current GUI agents are limited by static, click-based evaluation and need more
      realistic benchmarks covering dynamic interfaces, long horizons, and diverse
      interaction types.
    - Pure reliance on proprietary VLMs is insufficient; specialized training or fine-tuning
      is necessary to achieve robust performance.
    - Evaluation should go beyond task success rate to include fine-grained metrics,
      information efficiency, and failure diagnosis.
    disagreements:
    - 'Benchmarks differ in evaluation focus: some emphasize fine-grained sub-goal
      completion, while others prioritize information efficiency or uncertainty quantification.'
    - 'Training paradigms diverge: online RL with synthetic tasks versus weakly-supervised
      learning from unannotated screenshots versus supervised fine-tuning with structured
      actions.'
    - 'Action space design varies: some works treat context management as explicit
      actions, while others focus on expanding primitive actions like drag, revealing
      different assumptions about agent architecture.'
    open_questions:
    - How can uncertainty quantification be reliably transferred across model families
      and interfaces without re-calibration?
    - What is the optimal trade-off between observation frequency and task success,
      and how can agents learn adaptive observation control strategies?
    - To what extent do synthetic training tasks cover the diversity of real-world
      GUI interactions, and how can we detect and mitigate resulting biases?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 方法表示与目标设计
      解决的问题: 设计训练目标、损失函数和课程学习计划，以在有限标注下训练GUI智能体并提高长时域任务完成度。
      尚未覆盖: 这些训练配方是否能在不同平台和任务族之间迁移，以及合成数据质量如何影响强化学习结果。
    - 路线: 规划与动作接口方法
      解决的问题: 扩展GUI智能体的动作空间和上下文管理策略，以处理动态界面、拖拽交互和多步规划。
      尚未覆盖: 新动作类型如何与现有基于点击的规划器集成，以及上下文管理策略在训练域之外的泛化性。
    - 路线: 方法证据与消融协议
      解决的问题: 提供标准化基准和指标（细粒度评分、信息效率、不确定性量化）以评估和诊断GUI智能体能力。
      尚未覆盖: 跨基准的可比性，以及不确定性量化方法在真实部署环境中的验证。
    共识:
    - 当前GUI智能体受限于静态、基于点击的评估，需要更真实的基准，涵盖动态界面、长时域和多样化交互类型。
    - 存在共识：单纯依赖专有VLM是不够的；需要专门的训练或微调来实现鲁棒性能。
    - 评估应超越任务成功率，包括细粒度指标、信息效率和失败诊断。
    分歧:
    - 基准测试在评估重点上存在差异：一些强调细粒度子目标完成度，另一些优先考虑信息效率或不确定性量化。
    - 训练范式存在分歧：使用合成任务的在线强化学习、从未标注截图进行弱监督学习、以及使用结构化动作的监督微调。
    - 动作空间设计各异：一些工作将上下文管理视为显式动作，而另一些则专注于扩展基础动作（如拖拽），反映出对智能体架构的不同假设。
    开放问题:
    - 如何在不重新校准的情况下，可靠地跨模型族和接口迁移不确定性量化？
    - 观察频率与任务成功之间的最佳权衡是什么，智能体如何学习自适应观察控制策略？
    - 合成训练任务在多大程度上覆盖了真实世界GUI交互的多样性，如何检测和减轻由此产生的偏差？
