  related_work_outline:
  - 'Mainstream direction: The mainstream direction is building and evaluating GUI
    agents on realistic desktop, mobile, web, and dynamic application tasks, with
    emphasis on benchmarks that cover fine-grained interactions and sub-goal completion
    rather than only final success.'
  - 'Shared research pattern: Papers share a pattern of moving beyond click-only,
    static-screen evaluation to richer interaction modes: multi-checkpoint scoring,
    drag operations, video-guided tasks, dynamic short-video interfaces, and reuse
    of validated trajectories or multimodal skills.'
  - 'Key differences: They differ in evaluation target (macOS desktop, short-video
    feeds, drag interactions, video-guided workflows), in interaction form (GUI/CLI,
    drag, dynamic observation), and in efficiency mechanism (skill retrieval, compiled
    replay, parameter-controlled memory, block-wise diffusion generation).'
  - 'Trend evolution: The available 2026 evidence indicates a frontier shift from
    single-step GUI grounding toward real-world application benchmarks, dynamic-screen
    observation control, specialized interaction datasets, and deployment-time efficiency
    through memory, replay, and skill reuse.'
  - 'Open questions: Open questions include whether benchmark gains transfer across
    applications and institutions, how agents control observation cost in dynamic
    or video environments, how replay/skill methods remain robust to interface changes,
    and how alternative generative paradigms generalize beyond reported benchmarks.'
  related_work_outline_zh:
  - 主流方向：构建并评测面向真实桌面、移动、网页和动态应用任务的 GUI 智能体，重点转向细粒度交互和子目标完成，而非只看最终任务成功率。
  - 研究共性：研究共同从点击型、静态屏幕评估转向更丰富交互方式，包括多检查点评分、拖拽操作、视频引导任务、动态短视频界面，以及复用经验或多模态技能。
  - 关键差异：差异体现在评测目标（macOS 桌面、短视频流、拖拽交互、视频引导工作流）、交互形式（GUI/CLI、拖拽、动态观察）和效率机制（技能检索、编译回放、参数化记忆、块级扩散生成）。
  - 趋势演进：现有 2026 年证据显示前沿从单步 GUI grounding 转向真实应用基准、动态屏幕观察控制、专门交互数据集，以及通过记忆、回放和技能重用提升部署效率。
  - 开放问题：基准收益能否跨应用和机构迁移；智能体如何控制动态或视频环境中的观察成本；回放和技能方法在界面变化时是否稳健；替代生成范式能否在已报告基准之外泛化。
  literature_review:
    line_of_work_matrix:
    - line: Realistic desktop and application benchmarking
      what_it_solves: Assesses GUI agents on real-world macOS tasks with multi-application
        workflows, GUI/CLI mixing, and fine-grained sub-goal scoring rather than single
        final pass/fail.
      what_remains_open: Whether high Pass@1 and sub-goal differences transfer beyond
        the specific 25-app benchmark, and whether deterministic rules cover ambiguous
        real-world task completion.
    - line: Specialized interaction and dynamic-screen evaluation
      what_it_solves: Extends evaluation to drag-based interactions, short-video platform
        dynamics, and video-guided GUI tasks where observation control and information
        efficiency matter.
      what_remains_open: Coverage is limited to selected platforms or interaction
        types; open whether findings generalize to other dynamic interfaces, applications,
        or observation-control policies.
    - line: Reusable skills, memory, and replay for efficient execution
      what_it_solves: Converts successful trajectories or multimodal documentation
        into reusable skill libraries, state-machine programs, or callable memories
        to cut token cost, latency, and repeated planning.
      what_remains_open: Robustness to interface changes, divergent task parameters,
        and accumulation of faulty or stale stored programs remains partially addressed
        by fallback checks but not broadly validated.
    - line: Multimodal GUI agent architectures and training paradigms
      what_it_solves: Develops vision-language GUI agents using block-wise diffusion
        and task-aware keyframe extraction to improve grounding, navigation, and video-guided
        execution across platforms.
      what_remains_open: Reported gains are on selected grounding and navigation benchmarks;
        evidence for real-world deployment, cross-interface generalization, and efficiency
        relative to autoregressive models is incomplete.
    consensus:
    - Modern GUI agent evaluation is moving from static screenshot grounding and final
      task success to richer task checks, sub-goal scoring, and interaction types
      such as drag or dynamic-screen observation.
    - Reusing validated experience or multimodal task knowledge improves downstream
      computer-use performance or execution efficiency compared with planning from
      scratch.
    - Visual information, whether retained figures, keyframes, or screen-state checks,
      is treated as critical for UI element identification and workflow state verification.
    - Real-world application settings expose deployment costs such as token usage,
      observation count, and repeated-task latency, not only task accuracy.
    disagreements:
    - 'Evaluation focus differs: some work targets broad multi-app desktop completion,
      while others isolate drag primitives, short-video information tasks, or video-guided
      workflows.'
    - 'Efficiency approaches differ in structure: compiled state machines with fallback
      versus parameter-controlled callable memories versus retrieval-based multimodal
      skill files.'
    - 'Agent generation differs: one line uses block-wise diffusion rather than standard
      autoregressive vision-language decoding, with reported gains on grounding/navigation
      but limited deployment evidence.'
    - 'Observation assumptions differ: dynamic-screen work treats observation as a
      controllable cost and finds over-/under-observation, while static desktop benchmarks
      assume identifiable click/type/drag actions.'
    open_questions:
    - Do fine-grained benchmark improvements on GUI agent tasks transfer across unseen
      applications, interaction conventions, or operating environments?
    - How should agents decide when to stop observing or querying a dynamic screen
      to balance task accuracy and information efficiency?
    - Can replayable memory and skill libraries remain safe and useful under interface
      changes, ambiguous states, or multi-step workflows with changing parameters?
    - What evidence would show that non-autoregressive GUI agents generalize beyond
      the reported grounding and navigation benchmarks to real desktop and web tasks?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 真实桌面与应用基准评测
      解决的问题: 在真实 macOS 任务上评估 GUI 智能体，关注多应用工作流、GUI/CLI 混合和细粒度子目标评分，而非仅看最终通过率。
      尚未覆盖: 较高 Pass@1 与子目标差异能否迁移到特定 25 应用基准之外，以及确定性规则是否能处理模糊的真实任务完成情况。
    - 路线: 专门交互与动态屏幕评测
      解决的问题: 扩展评测到拖拽交互、短视频平台动态和视频引导 GUI 任务，观察控制和信息效率成为关键。
      尚未覆盖: 覆盖范围局限于特定平台或交互类型；发现能否推广到其他动态界面、应用或观察控制策略尚未确认。
    - 路线: 可复用技能、记忆与回放
      解决的问题: 将成功轨迹或多模态文档转换为可复用的技能库、状态机程序或可调用记忆，以降低 token 成本、延迟和重复规划。
      尚未覆盖: 界面变化、任务参数发散以及错误或过时存储程序的积累，虽有回退检查但尚未被广泛验证。
    - 路线: 多模态 GUI 智能体架构与训练范式
      解决的问题: 通过块级扩散和任务感知关键帧提取构建视觉语言 GUI 智能体，以提升跨平台 grounding、导航和视频引导执行。
      尚未覆盖: 报告收益集中在所选 grounding 和导航基准；真实部署、跨界面泛化及相对自回归模型的效率证据仍不完整。
    共识:
    - 现代 GUI 智能体评测正从静态截图 grounding 和最终任务成功，转向更完整的任务检查、子目标评分以及拖拽或动态屏幕观察等交互类型。
    - 复用已验证经验或多模态任务知识，相比从零规划，能提升下游计算机使用表现或执行效率。
    - 视觉信息（保留图形、关键帧或屏幕状态检查）被视为 UI 元素识别和工作流状态验证的关键。
