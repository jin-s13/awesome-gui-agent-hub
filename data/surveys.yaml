  - 主流方向：2024-2026年的证据以原始GUI智能体方法和基准论文为主，而非独立综述文章；主导方向是通过可扩展任务合成、执行框架优化、密集监督和可靠性评测来提升泛化能力。
  - 研究共性：多数工作围绕冻结或可训练的视觉语言模型添加新数据、环境或控制机制，然后报告留出集、特定基准或迁移能力提升。
