      尚未覆盖: 结果能否跨操作系统、应用版本或框架选择迁移尚不明确；证据包中未显示明确的局限性分析。
    - 路线: 动态与交互特定GUI任务基准测试
      解决的问题: 评测短视频动态屏幕和拖拽交互等点击中心基准中代表性不足的任务。
      尚未覆盖: 平台或交互类型覆盖仍有限，距离人类水平成本准确性以及在更多界面中的grounding仍存在差距。
    - 路线: 多模态技能库
      解决的问题: 提供应用特定的视觉与文本过程知识，改善UI元素识别和工作流状态验证。
      尚未覆盖: 应用变化时的维护与迁移；现有证据仅覆盖特定计算机使用基准和单一评测设置。
    - 路线: 可重放执行记忆与加速
      解决的问题: 将验证轨迹编译为状态机程序或可调用记忆，在重复任务上降低token成本与执行时间。
      尚未覆盖: 屏幕状态或任务参数不同时的安全回退与错误恢复；证据中可复现工件较为稀疏。
    - 路线: 模型级GUI智能体架构与训练
      解决的问题: 训练或适配视觉语言模型，用于跨移动、桌面、网页平台的GUI定位和导航。
      尚未覆盖: 与前沿专有代理的可比性，以及从微调基准到真实用户任务的迁移。
