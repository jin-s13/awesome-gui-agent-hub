    trade-offs, grounding uncertainty).'
  - 'Key differences: Benchmarks target different interaction modalities (click vs.
    drag, static vs. dynamic screens, pure GUI vs. video-guided) and different evaluation
    lenses (deterministic rule-based checks vs. post-hoc uncertainty quantification
    vs. online RL training signals).'
  - 'Trend evolution: The frontier (2024–2026) is shifting from static web/desktop
    benchmarks toward living-screen and video-aware environments, with growing interest
    in verifiable task synthesis, weakly supervised pretraining from unannotated screenshots,
    and multimodal skill augmentation.'
  - 'Open questions: Whether current task distributions cover the long-tail of real
    user workflows, how to align proxy metrics with human satisfaction, and whether
    training methods that excel on benchmarks remain robust under distribution shift
    and open-world deployment.'
  related_work_outline_zh:
  - 主流方向：构建多样化、动态的 GUI/环境基准，超越单步成功率评估，越来越多地强调真实多应用工作流、视频引导任务、拖拽交互和不确定性量化。
  - 研究共性：每项工作贡献一个新的任务集、数据集或环境，并附带自定义评估协议，专门探测代理的特定弱点（观察控制、细粒度子目标完成度、成本-准确性权衡、定位不确定性）。
  - 关键差异：基准针对不同的交互模态（点击 vs 拖拽、静态 vs 动态屏幕、纯 GUI vs 视频引导）和不同的评估视角（确定性规则检查 vs 事后不确定性量化
