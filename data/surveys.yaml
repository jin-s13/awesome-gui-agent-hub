  related_work_outline_zh:
  - 主流方向：构建可运行的GUI/计算机使用智能体栈，融合多模态感知、分层技能或记忆以及RL训练；近期工作更关注真实/基于Harness的在线训练、步骤级诊断与安全评测，而非仅看端到端成功率。
  - 研究共性：从静态监督评测转向交互式、环境接地的运行，利用视觉工件、轨迹级判定和基准驱动分析来定位感知、状态过渡与安全失败。
  - 关键差异：监督信号从弱监督截图到在线多轮RL不等；记忆从全图到动作接地裁剪或多模态技能文件不等；评测目标覆盖端到端成功、过渡重建和攻击成功率。
  - 趋势演进：证据包跨2024-2026年，但高分证据集中在2026年，因此观察到的趋势属于当前前沿内：围绕实时/基于Harness的RL、记忆与技能层以及专门的安全与状态过渡诊断收敛。
  - 开放问题：RL后错误恢复仍弱；Harness设计影响可训练性；离线诊断可能遗漏实时时序；安全加固呈现领域条件性；记忆与低标注结果需更广泛复现。
  literature_review:
    line_of_work_matrix:
    - line: Hierarchical multimodal skill and memory layers for computer-use agents
      what_it_solves: Grounding UI workflows and reducing state/action errors by retrieving
        application-specific visual and textual artifacts.
      what_remains_open: Cross-application transfer, live asynchronous timing, and
        broader evaluation beyond reported benchmarks; some studies lack explicit
        limitations.
    - line: Data-efficient and weakly supervised GUI policy learning
      what_it_solves: Reducing reliance on expensive annotated trajectories by using
        large unannotated screenshots plus small high-quality RL calibration.
      what_remains_open: Long-horizon error recovery, state verification in deployment,
        and independent evidence on minimal annotation budgets.
    - line: Harness-native and online multi-turn RL training frameworks
      what_it_solves: Training agents inside real deployment harnesses or live browsers
        without modifying harness code, while recording calls for standard RL stacks.
      what_remains_open: Weak post-training error recovery, harness-dependent trainability,
        and limited task counts per benchmark.
    - line: Alternative vision-language generation architectures for GUI agents
      what_it_solves: Introducing block-wise diffusion as a parallel-decoding GUI
        agent alternative to autoregressive models across grounding and navigation.
      what_remains_open: Broader platform and benchmark coverage, and unreported limitations
        around inference complexity or deployment cost.
    - line: Step-level diagnostic evaluation suites
      what_it_solves: Isolating transition understanding and action inference rather
        than relying only on end-task success.
      what_remains_open: Offline settings miss real-time dynamics; coverage is restricted
        to limited action types and desktop environments.
    - line: Safety and reproducibility audits for computer-use agents
      what_it_solves: Measuring attack success and checking whether published red-teaming
        results can be reproduced, including where resistance resides.
      what_remains_open: Optimized attack strings were not reproduced; hand-crafted
        audits do not directly measure optimized-text impact, and safety hardening
        is domain-conditioned.
    consensus:
    - 'Visual information beyond text is central: retaining visual figures, screenshots,
      or action-grounded image crops improves UI element identification and workflow
      state verification.'
    - Training and evaluation are moving from static offline datasets to interactive,
      environment-grounded procedures such as live websites, harness containers, or
      recorded multi-step trajectories.
    - End-to-end success metrics are insufficient; step-level transition understanding,
      failure-mode taxonomies, and safety audits reveal hidden errors.
    - Reinforcement learning is a common training mechanism, but it is combined with
      varied initialization sources such as weak supervision, SFT, or small curated
      trajectories.
    - Many system-level papers report benchmark gains, yet limitations and independent
      reproducibility evidence are often incomplete.
    disagreements:
    - 'Supervision signal differs: weak supervision from unannotated screenshots is
      used to lower annotation cost, while others rely on online multi-turn RL or
      harness-native rollouts.'
    - 'Memory representation differs: full-image memory can reduce state-level failures
      but worsen action-level errors, motivating action-grounded crops or hierarchical
      multimodal skill files.'
    - 'Evaluation target differs: some works optimize end-to-end task success, while
      others target step-level transition reconstruction, action inference, or attack
      success.'
    - 'Generation paradigm differs: a block-wise diffusion model is proposed for GUI
      agents, while several systems use harness-based CLI or autoregressive model
      calls.'
    - 'Deployment setting differs: offline image-pair benchmarks cannot capture live
      asynchronous timing and delays, whereas live-browser or harness-based setups
      include real interaction dynamics.'
    - 'Safety conclusions differ by domain: browser-focused agents resist hand-crafted
      prompt injection, but the same models can fail on coding-domain skill injection.'
    open_questions:
    - How can error recovery be improved after reinforcement learning, given that
      harness-native training still leaves critical recovery abilities weak?
    - What harness or environment design choices determine whether an agent can be
      trained effectively, and why are some harnesses substantially harder to learn?
    - Do offline step-level transition diagnostics predict live agent success, or
      are asynchronous timing and real-time dynamics necessary?
    - Why does safety hardening appear domain-conditioned, and how can browser and
      coding agent safety be unified?
    - How transferable are action-grounded memory and multimodal skill artifacts across
      applications, operating systems, and longer workflows?
    - What is the minimal annotation, RL task, and infrastructure budget needed to
      reproduce strong GUI-agent results across independent teams?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 面向计算机使用智能体的分层多模态技能与记忆层
      解决的问题: 通过检索应用相关的视觉与文本工件来增强UI定位、状态验证并减少动作错误
      尚未覆盖: 跨应用迁移、实时异步时序，以及超出已报告基准的更广泛评估；部分工作未报告明确局限
    - 路线: 数据高效与弱监督GUI策略学习
      解决的问题: 利用大规模未标注截图加少量高质量RL校准，降低对昂贵人工标注轨迹的依赖
      尚未覆盖: 长程错误恢复、部署中的状态验证，以及关于最小标注预算的独立证据
    - 路线: Harness原生与在线多轮RL训练框架
      解决的问题: 在不修改Harness代码的情况下，于真实部署Harness或实时浏览器中训练智能体，并将调用记录为标准RL栈训练数据
      尚未覆盖: 训练后错误恢复较弱、可训练性受Harness设计影响，以及每个基准任务数量有限
    - 路线: 面向GUI智能体的替代视觉语言生成架构
      解决的问题: 以块级扩散作为自回归模型的并行解码替代方案，用于跨平台grounding与导航
      尚未覆盖: 更广泛的平台与基准覆盖，以及推理复杂度或部署成本等未报告局限
    - 路线: 步骤级诊断评测套件
      解决的问题: 隔离状态过渡理解与动作推断，而非仅依赖端到端任务成功
      尚未覆盖: 离线设置缺少实时动态，且评测受限于有限动作类型和桌面环境
    - 路线: 计算机使用智能体的安全与可复现审计
      解决的问题: 测量攻击成功率，并检查已发表红队结果是否可复现以及防御能力位于何处
      尚未覆盖: 优化攻击字符串未被复现；手工攻击审计无法直接衡量优化文本影响，且安全加固具有领域条件性
    共识:
    - 视觉信息超越文本：保留视觉图形、截图或动作接地图像裁剪可改善UI元素识别与工作流状态验证。
    - 训练与评测正从静态离线数据集转向交互式、环境接地的流程，如实时网站、Harness容器或多轮轨迹记录。
    - 端到端成功率不足以暴露隐藏错误，步骤级过渡理解、失败模式分类与安全审计可补充诊断。
    - 强化学习是常见训练机制，但与不同初始化来源结合，如弱监督、SFT或少量精选轨迹。
    - 系统类工作常报告基准提升，但局限与独立可复现证据常不完整。
    分歧:
    - 监督信号不同：弱监督未标注截图降低标注成本，而另一些工作依赖在线多轮RL或Harness原生回滚。
    - 记忆表示不同：全图记忆可能减少状态级失败但加剧动作级错误，因此出现动作接地裁剪或分层多模态技能文件。
    - 评测目标不同：有的优化端到端任务成功率，有的针对步骤级过渡重建、动作推断或攻击成功率。
    - 生成范式不同：有工作提出块级扩散GUI智能体，而多个系统使用基于Harness的CLI或自回归模型调用。
    - 部署设置不同：离线图像对基准无法捕捉实时异步时序和延迟，而实时浏览器或Harness设置包含真实交互动态。
    - 安全结论因领域而异：浏览器场景智能体能抵抗手工提示注入，但相同模型会在编码域技能注入中失败。
    开放问题:
    - 强化学习后错误恢复为何仍弱？如何针对恢复能力进行系统改进？
    - 哪些Harness或环境设计选择决定智能体可训练性？为何某些Harness明显更难学习？
    - 离线步骤级过渡诊断能否预测实时智能体表现？异步时序和实时动态是否不可或缺？
    - 安全加固为何呈现领域条件性？如何统一浏览器与编码智能体的安全策略？
    - 动作接地记忆与多模态技能工件在应用、操作系统和更长工作流之间是否可迁移？
    - 独立团队复现强GUI智能体结果所需的最小标注、RL任务和基础设施预算是多少？
