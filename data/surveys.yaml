  - 'Mainstream direction: The dominant work targets GUI agents that ground visual
    interface states into executable actions, evaluated on realistic desktop, mobile,
    or dynamic-screen task suites rather than isolated static image understanding.'
  - 'Shared research pattern: Most papers combine a vision-language agent with a curated
    environment and measure success, failure modes, or uncertainty; method contributions
    often address observation selection, data efficiency, action interface, or context
    management.'
  - 'Key differences: Settings vary from macOS desktop GUI+CLI, dynamic short-video
    screens, mobile long-horizon tasks, video-guided interaction, and drag-based action;
    supervision ranges from weak screenshots to verifiable online RL and keyframe
    extraction.'
  - 'Trend evolution: Available top-paper evidence is concentrated in 2026, so the
    trend is visible only within the current frontier: moving from click-centric grounding
    toward dynamic, long-horizon, mixed-interface, and specialized action grounding
    with more data-efficient training signals.'
  - 'Open questions: Whether gains transfer across platforms and interface dynamics,
    and whether they originate from model, data, framework, or skill-library choices;
    how to certify uncertainty and observation control beyond single-step benchmarks.'
  related_work_outline_zh:
  - 主流方向：当前主流工作聚焦于将视觉界面状态映射为可执行动作的 GUI 智能体，并在真实桌面、移动端或动态屏幕任务套件上评估，而非仅做静态图像理解。
  - 研究共性：多数论文将视觉语言智能体放入受控环境，衡量任务成功率、失败模式或不确定性；方法贡献常围绕观察选择、数据效率、动作接口或上下文管理展开。
  - 关键差异：评测设置涵盖 macOS 桌面 GUI+CLI、短视频动态屏幕、移动长时域任务、视频引导交互和拖拽操作；监督方式从弱标注截屏到可验证在线 RL 与关键帧提取各异。
  - 趋势演进：由于可用高排名证据集中在 2026 年，趋势只能在当前前沿内观察：从以点击为中心的基础能力，转向动态、长时域、混合接口和专门动作接口，并更重视数据高效训练信号。
  - 开放问题：能力能否跨平台和跨界面动态迁移；收益究竟来自模型、数据、框架还是技能库；如何在单步基准之外验证不确定性和观察控制。
  literature_review:
    line_of_work_matrix:
    - line: Benchmarking GUI agents on realistic and dynamic interaction surfaces
      what_it_solves: Provides task suites, environments, and fine-grained scoring
        for GUI action grounding across desktop, mobile, dynamic-screen, video-guided,
        and drag interactions.
      what_remains_open: Most evidence is limited to the benchmark's platform or action
        type; missing reproducibility artifacts and multi-step/long-horizon transfer
        evidence leave cross-setting generalization unresolved.
    - line: Data-efficient training and verifiable task synthesis for GUI action prediction
      what_it_solves: Reduces reliance on expensive annotations through weak supervision
        from unannotated screenshots, verifiable online RL task generation, or task-aware
        keyframe extraction.
      what_remains_open: The relative contribution of representation, objective, sampling,
        and task-generation remains unclear; transfer beyond reported benchmarks and
        exact training recipes is not fully evidenced.
    - line: Context and observation control for long-horizon GUI agents
      what_it_solves: Improves long-horizon mobile and dynamic-screen task completion
        by treating context management as a first-class action or by jointly scoring
        accuracy and observation efficiency.
      what_remains_open: Evidence does not isolate whether gains come from the policy's
        context actions, base model, or benchmark design; generalization to other
        platforms and interaction types is underexplored.
    - line: Action-interface grounding beyond simple point-and-click
      what_it_solves: Covers drag-based interactions, mixed GUI and CLI actions, and
        dynamic interface changes that require specialized grounding and evaluation
        protocols.
      what_remains_open: Downstream computer-use transfer is only partially shown;
        limitations and failure cases are missing or sparse, making robustness and
        annotation requirements uncertain.
    - line: Uncertainty quantification and failure-mode analysis for GUI grounding
      what_it_solves: Evaluates post-hoc uncertainty methods for GUI action localization
        and identifies over- or under-observation as a failure mode rather than only
        measuring task success.
      what_remains_open: Current uncertainty findings are limited to single-step grounding
        and show weak cross-model transfer; deployment under distribution shift and
        closed-source interface restrictions remains open.
    consensus:
    - GUI agent performance is treated as a visual grounding and action-prediction
      problem, not isolated perception or language understanding.
    - Fine-grained metrics beyond pass rate, such as sub-goal completion, cost-accuracy,
      or uncertainty ranking, reveal differences hidden by aggregate success.
    - Training or calibration signals from unannotated screenshots, generated verifiable
      tasks, keyframes, or context annotations can improve sample efficiency and task
      success.
    - Current evaluations concentrate on constrained task suites, leaving cross-platform,
      long-horizon, and specialized interaction robustness under-evidenced.
    disagreements:
    - 'Evaluation settings differ substantially: full desktop with GUI+CLI, dynamic
      short-video platforms, mobile long-horizon tasks, video-guided tasks, and drag-based
      interactions each imply different grounding requirements.'
    - 'Supervision and training strategies differ: weak supervision from unannotated
      screenshots, verifiable online RL, task-driven keyframe extraction, and supervised
      context-action annotations optimize different objectives.'
    - 'Action-interface treatment differs: some work focuses on point/click or drag
      actions, while others model context management or GUI+CLI coordination as first-class
      policy outputs.'
    - 'Evaluation targets differ: task success, information efficiency, uncertainty
      transfer, and observation control are not aligned across studies, making direct
      method comparison difficult.'
    open_questions:
    - How much of reported agent performance comes from the proposed model or training
      objective versus the task-generation pipeline, framework, skill library, or
      base model?
    - Do GUI agents and benchmarks transfer across platforms, dynamic interfaces,
      and action types beyond their native benchmark setting?
    - Can uncertainty quantification remain reliable for closed-source GUI agents
      and under distribution shift without target-specific re-evaluation?
    - What minimal annotation budget and interface coverage are needed for long-horizon
      mobile, dynamic-screen, and drag-based GUI tasks?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 在真实与动态交互表面上对 GUI 智能体进行基准测试
      解决的问题: 为桌面、移动端、动态屏幕、视频引导和拖拽交互中的 GUI 动作定位提供任务套件、环境与细粒度评分。
      尚未覆盖: 证据多限于特定平台或动作类型；可复现工件和多步/长时域迁移证据不足，跨场景泛化仍未解决。
    - 路线: 面向 GUI 动作预测的数据高效训练与可验证任务合成
      解决的问题: 通过未标注截图弱监督、可验证在线 RL 任务生成或任务感知关键帧提取，降低对昂贵标注的依赖。
      尚未覆盖: 表示、目标、采样和任务生成各自的贡献尚未分离；超出报告基准和训练配方的迁移证据有限。
    - 路线: 面向长时域 GUI 智能体的上下文与观察控制
      解决的问题: 通过将上下文管理建模为第一类动作，或联合评分准确率与观察效率，提升长时域移动端和动态屏幕任务完成度。
      尚未覆盖: 无法区分收益来自上下文策略、基座模型还是基准设计；跨平台和交互类型的泛化探索不足。
    - 路线: 超越简单点按的 GUI 动作接口定位
      解决的问题: 覆盖拖拽操作、GUI 与 CLI 混合动作以及动态界面变化，这些需要专门的定位与评估协议。
      尚未覆盖: 下游计算机使用任务的迁移仅部分展示；局限性和失败案例缺失或稀疏，鲁棒性与标注需求不确定。
    - 路线: GUI 定位的不确定性量化与失败模式分析
      解决的问题: 评测 GUI 动作定位的后验不确定性方法，并将过度观察或观察不足识别为失败模式，而非仅看任务成功率。
      尚未覆盖: 当前不确定性结论限于单步定位，跨模型迁移较弱；分布偏移和闭源接口限制下的部署可靠性仍未解决。
    共识:
    - GUI 智能体性能被视作视觉定位与动作预测问题，而不是孤立的感知或语言理解。
    - 超越通过率的细粒度指标，如子目标完成、成本-准确率或不确定性排名，能揭示聚合成功率掩盖的差异。
    - 来自未标注截图、生成的验证任务、关键帧或上下文标注的训练/校准信号，可以改善样本效率和任务成功率。
    - 当前评测集中于受控任务套件，跨平台、长时域和专门交互鲁棒性的证据不足。
    分歧:
    - 评测设置差异明显：有的使用 GUI+CLI 的完整桌面，有的是动态短视频、移动长时域、视频引导或拖拽交互，各自对定位能力提出不同要求。
    - 监督与训练策略不同：未标注截图弱监督、可验证在线 RL、任务驱动关键帧提取和带上下文标注的监督训练优化目标各异。
    - 动作接口处理不同：部分工作关注点按或拖拽，部分将上下文管理或 GUI+CLI 协调作为第一类策略输出。
    - 评测目标不一致：任务成功率、信息效率、不确定性迁移和观察控制在各研究中并未对齐，难以直接比较方法。
    开放问题:
    - 已有智能体性能中有多少来自所提模型或训练目标，而不是任务生成流程、框架、技能库或基座模型？
    - GUI 智能体和基准能否在平台、动态界面和动作类型之间跨出其原生基准场景实现迁移？
    - 在闭源 GUI 智能体和分布偏移下，不确定性量化能否无需按目标重新评估仍保持可靠？
    - 长时域移动端、动态屏幕和拖拽式 GUI 任务需要的最小标注预算与界面覆盖范围是什么？
