  - 主流方向：当前主题由系统化GUI和计算机使用智能体基准、可验证任务合成、在线强化学习、长时程上下文管理以及安全/不确定性审计驱动，而非孤立演示。
  - 研究共性：工作在受控条件下隔离特定能力，对多个智能体和基线进行评测，并报告成功率或排序提升，同时暴露泛化局限。
  - 关键差异：研究在领域、监督信号、交互粒度和评测目标上各不相同，因此证据聚合应按这些轴展开，而不是直接合并原始分数。
  - 趋势演进：高排名证据几乎全部来自2026年，可见前沿正从静态基准转向可扩展合成任务、强化学习奖励、记忆动作和安全/校准审计。
