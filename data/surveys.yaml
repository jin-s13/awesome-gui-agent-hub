  literature_review:
    line_of_work_matrix:
    - line: Benchmark and task abstraction
      what_it_solves: 'Formalizes wider GUI-agent evaluation spaces: multi-app desktop
        GUI+CLI tasks, drag interactions, and dynamic living-screen observation control.'
      what_remains_open: Each benchmark is domain-specific and leaves cross-interface
        transfer, limitation documentation, and metric generalization unverified.
    - line: Frozen-model augmentation via skills or harnesses
      what_it_solves: Improves execution without changing backbone weights through
        multimodal skill retrieval or evidence-driven harness code changes from repeated
        runs.
      what_remains_open: Reported benchmark-specific gains lack visible limitation
        analysis and safety/robustness boundaries across agent settings.
    - line: Scalable supervision and verifiable training
      what_it_solves: Reduces human annotation or improves sample efficiency by using
        unannotated screenshots, verifiable docker-based task synthesis, and online
        RL.
      what_remains_open: Generalization beyond selected benchmarks, failure modes,
        and cost/training assumptions are not established.
    - line: Uncertainty quantification and reliability framing
      what_it_solves: Benchmarks post-hoc UQ ranking transfer for GUI grounding and
        studies conformal spatial click regions for safer uncertainty use.
      what_remains_open: Single-step grounding scope; multi-step trajectories and
        distribution-shift robustness remain uncovered.
    consensus:
    - Executable, rule-based or fine-grained scoring is becoming central because final
      success alone misses sub-goal/cost differences.
    - Frozen models can still become stronger through external skills, harnesses,
      or contexts rather than only weight updates.
    - Current GUI agents have observable control gaps in observation, drag manipulation,
      and uncertainty calibration.
    - Weak supervision and verifiable synthesized tasks are promising directions for
      reducing annotation dependence or scaling RL data.
    disagreements:
    - 'Evaluation target differs: one line scores overall task completion; another
      measures sub-goal checkpoints and capability annotations; another measures cost-accuracy
      or information efficiency; another measures uncertainty ranking and spatial
      coverage.'
    - 'Interaction mode differs: static click/type actions, drag-based actions, dynamic
      content-changing interfaces, and GUI+CLI multi-interface workflows.'
    - 'Representation differs: multimodal skill artifacts preserve visual figures,
      while some training methods use unannotated screenshots and others rely on repeated-run
      before/after screenshots.'
    - 'Supervision/update route differs: no model update via skills/harness, weak-supervision
      curriculum plus RL, verifiable online RL, or pure post-hoc UQ with conformal
      calibration.'
    - 'Reliability scope differs: UQ evidence covers only single-step GUI grounding,
      while other evidence covers multi-step task execution but does not quantify
      uncertainty.'
    open_questions:
    - How do gains on one benchmark family transfer to different operating systems,
      interface types, or dynamic environments without re-tuning skills or harnesses?
    - Can post-hoc UQ rankings remain reliable across model tiers, interfaces, and
      distribution shifts without target-specific recalibration?
    - What safety and boundary conditions govern verifiable task synthesis and automatic
      harness edits when they optimize frozen models?
    - Does fine-grained observation-control failure found on dynamic platforms generalize
      to desktop, drag, or multi-app workflows?
