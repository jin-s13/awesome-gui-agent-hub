  - 研究共性：论文普遍构造受控评测，隔离定位、上下文丢失、误校准或安全漏洞等失败模式，并在OSWorld-Verified、ScreenSpot-Pro、MobileWorld、WindowsAgentArena等基准上报告迁移效果；多数冻结骨干，通过数据、上下文或执行框架施加改进，或基于生成监督微调。
  - 关键差异：干预方式分为合成任务或密集标注生成、可验证在线RL、执行框架诊断、主动上下文管理与不确定性/安全审计；评测目标和界面也分为任务完成、定位、不确定性迁移、欺诈召回、安全抵抗，以及移动、桌面、网页、浏览器、视频引导等设置，可比性有限。
  - 趋势演进：所有顶部证据均来自2026年，可见趋势限于当前前沿：从单步定位转向长时域和自改进智能体，并更重视可验证性、安全、不确定性与复现审计；数据包缺少2024-2025年背景，较长时段趋势判断无法验证。
  - 开放问题：跨界面与跨模型迁移对不确定性和安全发现仍较弱；若干论文缺少代码、数据、限制说明或共享指标，构成验证缺口；仍需合成数据与执行框架优化的对比证据，以及优化级部署攻击下的鲁棒性证据。
  literature_review:
    line_of_work_matrix:
    - line: Controlled grounding and task-completion benchmarking
      what_it_solves: Creates reproducible GUI task suites that isolate grounding
        errors, context loss, fraud recall, safety failures, and long-horizon execution
        problems.
      what_remains_open: Most results are surface- or model-specific, and cross-benchmark
        compatibility under shared metrics is not systematically established.
    - line: Synthetic and verifiable training-data generation
      what_it_solves: Produces dense desktop annotations or verifiable RL tasks to
        improve GUI grounding and task completion without manual labeling.
      what_remains_open: Sample efficiency, data quality, and generalization beyond
        generated task distributions remain unevenly verified.
    - line: Harness and context optimization around frozen models
      what_it_solves: Improves GUI agents by diagnosing executed actions, modifying
        the execution harness, or managing long-horizon context while keeping backbone
        weights fixed.
      what_remains_open: Evidence is tied to specific corpora and transfer settings;
        error accumulation and failure boundary conditions are under-reported.
    - line: Safety, uncertainty, and robustness auditing
      what_it_solves: Evaluates post-hoc uncertainty calibration, prompt-injection
        resistance, and shortcut-free fraud detection under controlled evidence.
      what_remains_open: Findings are domain-conditioned and sensitive to sanitized
        shortcuts; real-world deployment behavior is not captured.
    - line: Video-guided GUI interaction
      what_it_solves: Connects video understanding to GUI action through task-driven
        keyframe selection and a video-guided benchmark.
      what_remains_open: Current evidence spans a narrow set of video tasks and does
        not yet show long-horizon or cross-surface generalization.
    consensus:
    - Controlled benchmarks are the dominant evidence vehicle for exposing GUI agent
      failures in grounding, long-horizon execution, uncertainty, and safety.
    - Frozen vision-language backbone performance can be improved through external
      harness or context modifications, or through generated supervision and fine-tuning.
    - Generalization is evaluated primarily by transfer to unseen tasks or benchmarks,
      including OSWorld-Verified, ScreenSpot-Pro, MobileWorld, and WindowsAgentArena.
    - Recent work treats risk properties such as calibration, safety resistance, and
      benign-case recall as first-class evaluation targets.
    disagreements:
    - 'Intervention level differs: some methods synthesize training tasks or dense
      labels, while others optimize the execution harness or context policy around
      frozen models, making comparisons indirect.'
    - 'Evaluation target differs: task completion and GUI grounding are primary in
      some work, while others measure uncertainty transfer, prompt-injection resistance,
      or fraud recall.'
    - Surface scope differs across mobile, desktop, web, browser, and video-guided
      settings, producing incompatible assumptions about input modality and action
      space.
    - 'Access to model internals differs: open-weight studies can use hidden states
      and logits, while closed-source safety and uncertainty evaluations rely on observable
      outputs only.'
    - 'Safety evidence conflicts across domains: browser-task resistance appears strong,
      but coding-domain skill injection remains highly effective.'
    open_questions:
    - How should GUI agent benchmarks handle cross-surface, cross-model, and calibration-test
      shift when uncertainty and safety rankings transfer weakly?
    - What evidence can compare synthetic or verifiable data generation with harness/context
      optimization under a shared success metric?
    - Which safety and fraud findings persist when reputation shortcuts or hand-crafted
      templates are replaced by optimized, deployment-like attacks?
    - What minimal reporting of code, data, model access, and limitations would make
      current GUI-agent claims reproducible across independent audits?
    - How can long-horizon mobile, desktop, and web tasks be evaluated under compatible
      criteria to expose context and error-accumulation boundaries?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 受控定位与任务完成基准构建
      解决的问题: 构建可复现的GUI任务套件，隔离定位错误、上下文丢失、欺诈召回、安全失败和长时程执行问题。
      尚未覆盖: 多数结果局限于特定界面或模型，共享指标下的跨基准兼容性尚未系统建立。
    - 路线: 合成与可验证训练数据生成
      解决的问题: 生成密集桌面标注或可验证RL任务，在不依赖人工标注的情况下提升GUI定位与任务完成。
      尚未覆盖: 采样效率、数据质量以及超出生成任务分布的泛化仍缺乏一致验证。
    - 路线: 冻结模型周边的执行框架与上下文优化
      解决的问题: 通过诊断已执行动作、修改执行框架或管理长时程上下文，在不更新骨干权重的情况下改进GUI智能体。
      尚未覆盖: 证据通常绑定特定语料和迁移设置；错误累积与失败边界条件报告不足。
    - 路线: 安全、不确定性与鲁棒性审计
      解决的问题: 在受控证据下评估后验不确定性校准、提示注入抵抗以及无捷径依赖的欺诈检测。
      尚未覆盖: 发现具有领域条件性且对净化的捷径敏感，未能充分反映真实部署行为。
    - 路线: 视频引导的GUI交互
      解决的问题: 通过任务驱动关键帧选择和视频引导基准，将视频理解与GUI动作连接起来。
      尚未覆盖: 当前证据覆盖的视频任务较窄，尚未展示长时程或跨界面泛化。
    共识:
    - 受控基准是暴露GUI智能体在定位、长时程执行、不确定性和安全方面失败的主流证据工具。
    - 冻结的视觉语言骨干能通过外部执行框架或上下文管理，以及生成式监督和微调获得提升。
    - 泛化主要通过迁移到未见任务或基准来评估，如OSWorld-Verified、ScreenSpot-Pro、MobileWorld和WindowsAgentArena。
    - 近期工作开始把校准、安全抵抗和良性召回等风险属性作为一类独立评测目标。
    分歧:
    - 干预层级不同：有的合成训练任务或密集标注，有的优化冻结模型周围的执行框架或上下文策略，比较基础不一致。
    - 评测目标不同：部分以任务完成和GUI定位为主，部分衡量不确定性迁移、提示注入抵抗或欺诈召回。
    - 界面范围不同：移动、桌面、网页、浏览器和视频引导设置中的输入模态和动作空间假设不兼容。
    - 模型内部访问不同：开源权重研究可使用隐藏状态和logits，而闭源安全与不确定性评估只能依赖可观测输出。
    - 安全证据在不同领域相互冲突：浏览器任务抵抗较强，但编码领域技能注入仍可高效成功。
    开放问题:
    - 当不确定性和安全排名跨界面、跨模型及校准-测试偏移下迁移较弱时，GUI智能体基准应如何处理可比性？
    - 在共享成功指标下，合成或可验证数据生成与执行框架/上下文优化之间需要哪些对比证据？
    - 当用部署级优化攻击替换声誉捷径或手工模板时，哪些安全和欺诈发现仍然成立？
    - 何种最低限度的代码、数据、模型访问和限制说明披露才能使当前GUI智能体的声明可被独立复现审计？
    - 如何在兼容标准下评估长时程移动、桌面和网页任务，以暴露上下文丢失和错误累积边界？
