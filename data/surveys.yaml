  related_work_outline_zh:
  - 主流方向：构建并评估真实GUI/OS环境中的计算机使用代理，基准覆盖macOS桌面、浏览器/短视频、视频引导GUI和基础任务；代表性工作如MacAgentBench和LivingScreen。
  - 研究共性：工作定义任务或压力测试，运行多个VLM/代理基线，并使用确定性或细粒度指标揭示基础、观察和状态验证失败，而不只看总分。
  - 关键差异：评测目标从静态桌面任务完成到动态界面成本-准确性、单步不确定性不等；方法在监督信号上不同，包括标注任务、未标注截图、可验证合成任务和重复运行证据。
  - 趋势演进：2026年证据显示从聚合Pass@1基准转向多检查点评分、观察效率、不确定性校准，以及通过技能、harness优化或RL改进冻结/开源代理；数据包时间跨度不足以推断此前趋势。
  - 开放问题：动态界面观察控制、跨模型/接口指标迁移、代理指标与用户决策的一致性、可复现稳定性仍未解决；多篇论文未列局限性，构成验证缺口。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design
      what_it_solves: Provides shared GUI/OS and video-based tasks for comparing computer-use
        agents across desktop, browser, dynamic short-video, and grounding settings.
      what_remains_open: Whether task distributions cover real deployments, mobile/OS
        breadth, dynamic interfaces, and human-level cost-accuracy beyond the current
        benchmark niches.
    - line: Metric and stress-test design
      what_it_solves: Adds fine-grained pass/sub-goal scoring, cost-accuracy, observation
        efficiency, uncertainty ranking, and conformal click regions to reveal failures
        hidden by aggregate success.
      what_remains_open: Alignment of these proxy metrics with downstream user decisions
        and transfer across model tiers, interfaces, and deployment shifts is still
        weak or unverified.
    - line: Agent improvement via skills, harnesses, and training
      what_it_solves: Improves agent execution by retaining multimodal skill artifacts,
        optimizing execution harnesses from repeated evidence, synthesizing verifiable
        RL tasks, or weakly supervising from unannotated screenshots.
      what_remains_open: Cross-benchmark transfer, data efficiency, limitation reporting,
        and robustness under changed frameworks or interfaces remain incomplete.
    - line: Comparable baselines and reporting
      what_it_solves: Enables auditing through model baselines, framework comparisons,
        and published artifacts, while separating skill-library/framework effects
        from model ability.
      what_remains_open: Evidence on stability across implementations, compute budgets,
        and frameworks is not visible in this packet; several top papers lack limitation
        fields, a verification gap.
    consensus:
    - Realistic computer-use evaluation requires tasks across applications, interfaces,
      and interaction modes, with deterministic or rule-based scoring.
    - Aggregate success metrics are insufficient; fine-grained completion, sub-goal,
      cost-accuracy, observation, and uncertainty measures reveal material differences
      between agents.
    - Grounding UI elements and verifying visual workflow state are recurring bottlenecks
      for current VLM/GUI agents.
    - Modifying the execution context around a frozen model—skills, harness, or task
      synthesis—can produce substantial gains without changing backbone weights.
    disagreements:
    - Some work benchmarks static desktop or browser tasks, while others target dynamic
      short-video interfaces, video-guided tasks, or single-step GUI grounding; the
      deployment setting changes the failure profile.
    - 'Supervision and improvement signals differ: manually annotated tasks, unannotated
      screenshots, verifiable docker-synthesized tasks, and repeated execution traces
      each assume different data availability.'
    - 'Evaluation targets differ: Pass@1 or average score, sub-goal completion, cost-accuracy/observation
      efficiency, and calibrated uncertainty/conformal safety are not interchangeable.'
    - 'Knowledge representation differs: explicit multimodal skill artifacts retain
      visual figures, while other approaches train visual grounding directly or optimize
      an executable harness.'
    open_questions:
    - Can agents acquire reliable observation control on dynamic interfaces, where
      current models over- or under-observe and fail to reach human-level cost-accuracy?
    - Do fine-grained benchmark findings transfer across model tiers and interface
      domains, or do they require target-specific recalibration, as suggested by weak
      cross-tier UQ transfer?
    - Are current proxy metrics—sub-goal checks, cost-accuracy, conformity—aligned
      with the downstream decisions and safety demands users care about?
    - How stable are reported gains across frameworks, compute budgets, and repeated
      runs when several studies omit limitations and full cross-implementation evidence?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计
      解决的问题: 提供共享的GUI/OS与视频任务，在桌面、浏览器、动态短视频和基础任务等场景中比较代理能力。
      尚未覆盖: 任务分布是否覆盖真实部署、移动/系统平台广度、动态界面与人类水平成本-准确性仍不确定。
    - 路线: 指标与压力测试设计
      解决的问题: 通过细粒度完成/子目标评分、成本-准确性、观察效率、不确定性排序和共形点击区域，揭示聚合指标掩盖的失败。
      尚未覆盖: 这些代理指标与下游用户决策的一致性，以及跨模型层级、界面和部署偏移的迁移仍弱或未验证。
    - 路线: 通过技能、harness与训练的代理改进
      解决的问题: 通过保留多模态技能工件、基于重复证据优化执行harness、合成可验证RL任务或未标注截图弱监督来改进代理。
      尚未覆盖: 跨基准迁移、数据效率、局限性报告和框架/接口变化下的鲁棒性仍不完整。
    - 路线: 可比基线与报告规范
      解决的问题: 通过模型基线、框架比较和公开工件实现结果审计，并区分技能库/框架效应与模型能力。
      尚未覆盖: 跨实现、算力预算和框架的稳定性证据在本数据包中不可见；多篇高排名论文缺少局限性字段，属验证缺口。
    共识:
    - 真实的计算机使用评估需要跨应用、跨界面和交互模式的任务，并用确定性或规则化评分。
