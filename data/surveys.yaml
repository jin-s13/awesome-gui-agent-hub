  related_work_outline:
  - 'Mainstream direction: Building GUI agent benchmarks that span diverse platforms
    (desktop, short-video, drag-based) and interaction types (click, CLI, drag, video-guided),
    with fine-grained metrics and uncertainty quantification to probe capabilities
    beyond task success.'
  - 'Shared research pattern: All works rely on multimodal VLM agents, move from static
    click-based interfaces toward complex dynamic interactions, and emphasize comprehensive
    evaluation that captures sub-goal progress, efficiency, and robustness.'
  - 'Key differences: Interaction surface (OS desktop vs. short-video platform vs.
    drag-only interface), evaluation dimension (accuracy vs. cost-efficiency vs. uncertainty),
    supervision signal (full annotation vs. weak supervision from unlabeled screenshots
    vs. verifiable synthetic tasks), and deployment environment (real OS vs. browser
    simulator).'
  - 'Trend evolution: Within the 2024–2026 frontier, benchmarks are evolving from
    static, click-only tasks to dynamic, multi-step, multimodal environments, and
    are increasingly integrated with training methods (RL, weak supervision) and stress
    tests (uncertainty quantification) to form a closed evaluation–improvement loop.'
  - 'Open questions: Cross-platform generalization, observation control in dynamic
    screens, robustness of uncertainty quantification under distribution shift, alignment
    between fine-grained metrics and user satisfaction, and real-world performance
    of agents trained on synthetic data.'
  related_work_outline_zh:
  - 主流方向：构建覆盖多平台（桌面、短视频、拖拽）和多交互类型（点击、命令行、拖拽、视频引导）的GUI代理基准，并引入细粒度指标与不确定性量化来深入衡量代理能力。
  - 研究共性：所有工作均基于多模态视觉语言模型，从静态点击界面转向复杂动态交互，强调通过子目标进度、效率和鲁棒性进行超越成功率的综合评估。
  - 关键差异：交互界面（操作系统桌面 vs 短视频平台 vs 拖拽界面）、评估维度（准确性 vs 成本效率 vs 不确定性）、监督信号（全标注 vs 未标注截图弱监督
    vs 可验证合成任务）以及部署环境（真实OS vs 浏览器模拟器）。
  - 趋势演进：在2024–2026前沿内，基准从静态点击任务向多步、多模态、动态环境演进，并逐步与训练方法（强化学习、弱监督）及压力测试（不确定性量化）结合，形成评估与改进的闭环。
  - 开放问题：跨平台泛化、动态屏幕中的观察控制机制、不确定性量化在分布偏移下的鲁棒性、细粒度指标与用户满意度的一致性，以及合成数据训练代理的真实表现。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design
      what_it_solves: Creates shared tasks covering diverse applications, interaction
        types (GUI+CLI, drag, video-guided), and environmental dynamics, enabling
        comparable evaluation of agent capabilities.
      what_remains_open: Whether the task distribution covers all real deployment
        settings, and generalization to dynamic, evolving interfaces remains limited.
    - line: Metric and stress-test design
      what_it_solves: Probes prediction, controllability, robustness, and decision
        utility beyond aggregate success rates by introducing fine-grained sub-goal
        scoring, information efficiency, and uncertainty quantification.
      what_remains_open: Alignment between proxy metrics and the downstream decisions
        users actually care about is unverified; out-of-distribution robustness of
        these metrics is insufficient.
    - line: Comparable baselines and reporting
      what_it_solves: Makes results auditable through publicly available benchmarks,
        code, and training pipelines, promoting reproducibility and method comparison.
      what_remains_open: Stability of benchmark conclusions across different implementations
        and compute budgets, and the lack of unified reporting conventions.
    consensus:
    - Multimodal vision-language models serve as the backbone for GUI agents across
      all settings.
    - Evaluation must go beyond simple task success rates and incorporate fine-grained
      progress, efficiency, or uncertainty dimensions.
    - Dynamic and diverse interactions (drag, video, CLI) are critical extensions
      to static click-based GUIs.
    - Data scarcity and annotation cost motivate weak supervision, synthetic task
      generation, and sample-efficient training.
    disagreements:
    - 'Interaction surface: desktop OS environments vs. short-video platforms vs.
      drag-only interfaces.'
    - 'Evaluation focus: task completion accuracy vs. information efficiency (cost-accuracy)
      vs. uncertainty quantification.'
    - 'Supervision signal: fully annotated demonstrations vs. unannotated screenshots
      exploited via weak supervision vs. verifiable synthetically generated tasks.'
    - 'Deployment setting: real operating systems vs. browser-based simulators.'
    - 'Metric granularity: single-step success vs. multi-step sub-goal completion.'
    open_questions:
    - How well do current benchmark task distributions represent the full range of
      real-world GUI interactions, including mobile and enterprise software?
    - Can agents develop effective observation control strategies for dynamic, content-changing
      interfaces, and what metrics capture this ability?
    - How robust are post-hoc uncertainty quantification methods when transferred
      across model families and interface shifts, and what calibration is needed for
      deployment?
    - What is the empirical relationship between fine-grained benchmark scores and
      user satisfaction or task-completion utility in production?
    - Do agents trained on synthetic or weakly supervised data generalize to genuinely
      novel, unseen applications and workflows outside the training distribution?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计
      解决的问题: 创建涵盖多应用、多交互类型（GUI+CLI、拖拽、视频引导）和动态环境的共享任务，使代理能力评估具备可比性。
      尚未覆盖: 任务分布是否覆盖所有真实部署场景，以及对动态界面演化的泛化能力仍有限。
    - 路线: 指标与压力测试设计
      解决的问题: 在总体成功率之外，通过细粒度子目标评分、信息效率和不确定性量化，检验预测、可控性、鲁棒性和决策效用。
      尚未覆盖: 代理指标与用户真正关心决策之间的一致性未经证实，且这些指标在分布外场景下的鲁棒性不足。
    - 路线: 可比基线与报告规范
      解决的问题: 通过公开的基准、代码和训练流水线使结果可审计，促进可复现性和方法比较。
      尚未覆盖: 基准结论在不同实现和算力预算下的稳定性，以及缺乏统一的报告惯例。
    共识:
    - 多模态视觉语言模型是所有场景下GUI代理的基础。
    - 评估必须超越简单任务成功率，引入细粒度进展、效率或不确定性维度。
    - 动态和多样化的交互（拖拽、视频、命令行）是静态点击式GUI的关键扩展方向。
    - 数据稀缺和标注成本推动了弱监督、合成任务生成和样本高效训练的方法。
    分歧:
    - 交互界面：桌面操作系统环境 vs 短视频平台 vs 纯拖拽界面。
    - 评估重点：任务完成准确性 vs 信息效率（成本-准确性） vs 不确定性量化。
    - 监督信号：全标注示范 vs 利用未标注截图的弱监督 vs 可验证合成任务。
    - 部署环境：真实操作系统 vs 基于浏览器的模拟器。
    - 指标粒度：单步成功 vs 多步子目标完成。
    开放问题:
    - 当前基准任务分布在多大程度上能代表真实世界中GUI交互的全貌，包括移动端和企业软件？
    - 代理能否针对动态内容变化界面形成有效的观察控制策略，何种指标可衡量该能力？
    - 后验不确定性量化方法在跨模型系列和跨接口迁移时有多鲁棒，部署需要何种校准？
    - 细粒度基准得分与用户实际满意度或任务完成效用之间存在怎样的经验关系？
    - 基于合成数据或弱监督数据训练的代理能否泛化到训练分布之外的真实新颖应用和工作流？
