  literature_review:
    line_of_work_matrix:
    - line: Benchmark-driven task and interaction specification for GUI agents
      what_it_solves: Defines task suites, interaction modes such as desktop, dynamic
        short-video, and drag, plus fine-grained metrics for evaluating computer-use
        agents beyond single-click success.
      what_remains_open: Coverage is limited to selected platforms; dynamic-interface
        observation control and multi-step trajectory reliability remain unresolved,
        and limitation reporting is often missing.
    - line: Skill and context augmentation for long-horizon GUI workflows
      what_it_solves: Improves long-horizon performance by preserving multimodal visual
        skill artifacts and treating context management as a first-class policy action.
      what_remains_open: Evidence is tied to specific applications and benchmarks;
        generalization outside evaluated suites, failure analysis, and artifact availability
        require verification.
    - line: Data-efficient and verifiable training for computer-use agents
      what_it_solves: Reduces reliance on human annotation through weakly supervised
        unannotated screenshots or verifiable synthetic task generation with online
        reinforcement learning.
      what_remains_open: Validation is concentrated on OSWorld and ScienceBoard or
        fixed data comparisons; limitations and tradeoffs of frontier sampling and
        visual context segmentation are not detailed.
    - line: Uncertainty quantification and reliability framing for GUI grounding
      what_it_solves: Benchmarks post-hoc uncertainty methods, selective ranking transfer,
        and conformal click regions for spatial safety in single-step GUI grounding.
      what_remains_open: Single-step evaluation does not cover multi-step trajectories;
        cross-model and cross-interface transfer is weak, and conformal coverage degrades
        under distribution shift.
    consensus:
    - GUI agents are evaluated through task suites that combine action correctness
      with finer signals such as subgoal completion, cost-accuracy, or uncertainty
      calibration.
    - Aggregate task success masks important capability differences, so researchers
      are moving toward multi-checkpoint and information-efficiency metrics.
    - Visual and interaction grounding is a shared bottleneck, with visual skill artifacts,
      drag grounding, and observation control all improving or exposing agent weaknesses.
    - Current agents are not yet reliable across dynamic interfaces and long horizons;
      explicit context management or uncertainty information is needed.
    disagreements:
    - 'Supervision and data source differ: weakly supervised screenshots, verifiable
      synthetic online RL tasks, annotated benchmark collections, and curated skill
      libraries.'
    - 'Evaluation target differs: static desktop tasks, dynamic short-video interfaces,
      drag-based interactions, single-step grounding, and long-horizon mobile workflows.'
    - 'Interaction scope differs: click/tap grounding, GUI plus CLI, drag manipulation,
      and context-management actions as outputs.'
    - 'Reliability framing differs: some work quantifies post-hoc uncertainty with
      conformal spatial regions, while other work targets task success, cost-accuracy,
      or skill retrieval gains.'
    - 'Representation differs: multimodal visual skill files, structured context fields,
      text-only skill retrieval, and learned visual grounding from unannotated screenshots.'
    open_questions:
    - What formal task abstractions and safety guarantees can be built from the current
      empirical benchmarking and reliability findings?
    - How should observation control be measured and trained for dynamic interfaces
      where content changes between actions?
    - Which uncertainty, context, and grounding signals transfer across models, interfaces,
      and multi-step trajectories without target-specific recalibration?
    - What are the failure and distribution-shift boundaries of verifiable task synthesis
      and frontier-sampling RL beyond OSWorld and ScienceBoard?
    - Can skill and context methods maintain gains when evaluated outside the applications
      and benchmarks used in their construction?
    - Verification gaps remain because several high-ranked papers in this packet lack
      visible limitation statements or consistent artifact links.
