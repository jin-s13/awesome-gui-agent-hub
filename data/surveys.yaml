  - 'Trend evolution: The available 2024-2026 span is narrow and concentrated in 2026,
    suggesting a current-frontier shift from static click/type benchmarks toward dynamic
    interfaces, multi-interaction primitives, verifiable training loops, uncertainty/safety
    framing, and agent memory/context control.'
  - 'Open questions: Whether benchmark-specific gains transfer across interfaces and
