  literature_review:
    line_of_work_matrix:
    - line: Interaction coverage and task abstraction benchmarks
      what_it_solves: Expands evaluation beyond static clicking by formalizing composite
        GUI+CLI desktop tasks, dynamic living-screen interactions, and drag-based
        manipulation with rule-based or browser-based scoring.
      what_remains_open: Multi-step trajectory evaluation, observation-control formalization,
        cross-platform migration, and evidence that benchmark coverage predicts real
        deployment behavior.
    - line: 'External scaffolding: skill libraries and harness self-improvement'
      what_it_solves: Improves frozen agents by adding hierarchical multimodal skills
        or automatically optimizing the execution harness from screenshot-grounded
        failure evidence.
      what_remains_open: Whether gains transfer across applications and benchmarks
        without per-target re-optimization, and how much comes from framework design
        versus backbone model ability.
    - line: Data-efficient and verifiable training for GUI policies
      what_it_solves: Reduces annotation cost through weak supervision from unannotated
        screenshots or verifiable task synthesis and online RL, scaling open agents
        toward stronger completion.
      what_remains_open: Distribution-shift robustness and whether synthetic or weakly
        supervised tasks predict failures and transfers to real GUI environments.
    - line: Reliability, uncertainty, and safety-oriented evaluation
      what_it_solves: Adds fine-grained sub-goal metrics, cost-accuracy, post-hoc
        uncertainty quantification, and conformal click regions to surface failure
        modes beyond pass/fail.
      what_remains_open: Multi-step uncertainty guarantees, cross-model and cross-interface
        UQ transfer, and coverage under calibration/test or interface mismatch.
    consensus:
    - Evaluation should include finer signals than overall success because similar
      Pass@1 or task accuracy can hide different sub-goal completion, observation
      efficiency, or grounding reliability.
    - Frozen model performance can be improved by external scaffolding such as skills,
      harness edits, or tools without retraining the backbone.
    - Dynamic interfaces and non-click interactions expose substantial gaps in current
      agents, especially observation control and drag-related grounding.
    - Unannotated screenshots and verifiable task synthesis can reduce dependence
      on costly human annotations.
    disagreements:
    - 'Where improvement should occur: some work updates the model through online
      RL or weak supervision, while others keep the model frozen and change the skill
      library or execution harness.'
    - 'Which evaluation target matters most: task completion, information efficiency,
      uncertainty-ranking transfer, or drag-action grounding; each selects different
      primary metrics.'
    - Whether visual artifacts in external knowledge are necessary; one line shows
      multimodal skills outperform matched text-only skills, while others optimize
      code-level or harness-level changes.
    - How broadly uncertainty rankings transfer; evidence shows within-model transfer
      can be strong but cross-tier or cross-interface transfer is weak and target-specific
      reranking is needed.
    open_questions:
    - Can post-hoc uncertainty quantification for GUI grounding be extended from single-step
      grounding to multi-step agent trajectories with valid coverage?
    - How should observation control be formalized and improved for dynamic living-screen
      interfaces where over-observation and under-observation are dominant failures?
    - Do skill-library and harness optimizations generalize across applications, platforms,
      and benchmarks without re-optimization or fine-grained re-validation?
    - Under what distribution shifts do verifiable task synthesis and weakly supervised
      GUI training remain reliable and safe enough for deployment?
