    - line: Weakly supervised and representation-efficient GUI-agent training
      what_it_solves: Lowers dependence on expensive annotated GUI trajectories and
        explores alternative generation paradigms for grounding and navigation.
      what_remains_open: Reported gains rely on selected benchmarks; cross-platform
        robustness, inference latency, and generalization from unannotated screenshots
        still need independent verification.
    - line: Harness-native end-to-end reinforcement learning and unified action orchestration
      what_it_solves: Trains agents inside actual deployment harnesses or desktop
