  related_work_outline_zh:
  - 主流方向：当前的GUI代理理论大多隐含在基准与方法论文中，以任务抽象、可靠性信号和细粒度评测为核心，而非独立形式证明；主导工作关注桌面、动态界面和特定交互上的可测量能力。
  - 研究共性：论文先定义一个缺失的交互、不确定性或评测维度，再构建基准或数据集，比较前沿模型与开源模型，并报告与该维度相关的具体失败或收益；可复现证据不一。
  - 关键差异：表示方式包括视觉技能记忆、harness编辑、不确定性分数和拖拽定位数据；监督信号包括未标注截图、可验证合成RL任务和冻结模型证据；评测目标包括macOS
    GUI+CLI、短视频动态、单步定位和拖拽交互。
  - 趋势演进：顶分证据集中在2026年，可见趋势处于当前前沿内：从静态只看成功率，转向交互方式覆盖、动态观察成本、不确定性，以及借助外部工件或合成数据的自改进。
  - 开放问题：这些抽象和不确定性结论能否跨平台、跨接口、跨多步轨迹迁移；合成或弱监督是否会过拟合；空白局限性字段与工件可得性不一是否形成验证缺口。
  literature_review:
    line_of_work_matrix:
    - line: Formal task and interaction abstraction
      what_it_solves: Clarifies assumptions for dynamic interfaces, action modes such
        as drag, and multi-checkpoint task completion, turning informal GUI tasks
        into measurable objectives.
      what_remains_open: Abstractions are mainly platform-specific or single-step;
        evidence that they predict multi-step agent behavior or transfer across interfaces
        is missing.
    - line: Reliability and uncertainty framing
      what_it_solves: Quantifies confidence in GUI grounding, diagnoses action failures
        from before-and-after evidence, and creates safety-oriented conformal click
        regions.
      what_remains_open: Uncertainty ranking transfers weakly across model classes
        and interfaces; multi-step trajectory reliability and distribution-shift guarantees
        remain unverified.
    - line: External knowledge, harness, and skill-library organization
      what_it_solves: Improves frozen computer-use agents by organizing visual/textual
        skills or optimizing executable harness code instead of updating model weights.
      what_remains_open: Cross-benchmark and cross-application generalization is shown
        only in narrow transfer cases; formal boundaries of harness or skill changes
        are not defined.
    - line: Data synthesis and weak supervision for agent learning
      what_it_solves: Reduces expensive human annotation through large unannotated
        screenshot curricula and verifiable synthesized RL tasks for GUI action learning.
      what_remains_open: Theoretical guarantees or scaling laws connecting synthesized
        or weak data, sample efficiency, and held-out failure rates are absent.
    consensus:
    - 'Fine-grained evaluation beyond overall success is necessary: sub-goal completion,
      observation cost, drag action coverage, and uncertainty ranking reveal differences
      hidden by Pass@1.'
    - External artifacts such as skill libraries or optimized harnesses can improve
      frozen agents, but gains may depend more on the artifact than on framework choice.
    - Current models exhibit avoidable failure modes such as over- or under-observation,
      weak drag grounding, and weak uncertainty transfer across model classes.
    - Large-scale task and training data can be obtained through weak supervision
      or verifiable synthesis, reducing dependence on human annotation.
    disagreements:
    - 'Representation: visual figures plus text in skill memory versus pure text skills,
      harness source edits, uncertainty-score sets, and drag-specific grounding data.'
    - 'Supervision: weak learning from unannotated screenshots, online RL on verifiable
      synthesized tasks, and frozen-model evidence-driven harness optimization.'
    - 'Evaluation target: real macOS GUI+CLI tasks, dynamic short-video browsing,
      single-step GUI grounding, drag interactions, and OSWorld or ScienceBoard-style
      verifiable task suites.'
    - 'Interaction mode: click or tap grounding, drag manipulation, combined GUI and
      CLI workflows, and observation-action sequences under content change.'
    - 'Deployment setting: browser-simulated platforms, Docker-based OS environments,
      real desktop applications, and API-accessible closed-source vendors.'
    open_questions:
    - Can current task and interaction formalisms transfer beyond the specific platform
      or benchmark they were defined on?
    - Does post-hoc uncertainty quantification remain informative over multi-step
      agent trajectories rather than single-step grounding only?
    - How much do synthetic or weakly supervised gains reflect general GUI capability
      versus benchmark-specific or app-specific overfitting?
    - Many top-paper limitation fields are blank and code or dataset availability
      is uneven; which unobserved limitations and reproducibility gaps remain?
    - What minimal assumptions or guarantees would connect harness or skill edits,
      synthesized data scale, and expected failure modes?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 形式化任务与交互抽象
      解决的问题: 明确动态界面、拖拽等操作方式以及多检查点任务完成中的假设，将非形式化GUI任务变为可测量目标。
      尚未覆盖: 抽象主要针对特定平台或单步设置；能否预测多步行为或跨界面迁移仍缺证据。
    - 路线: 可靠性与不确定性框架
      解决的问题: 量化GUI定位置信度，基于操作前后证据诊断动作失败，并构建面向安全的共形点击区域。
      尚未覆盖: 不确定性排名跨模型类别和接口迁移较弱；多步轨迹可靠性与分布偏移保证仍未被验证。
    - 路线: 外部知识、执行框架与技能库组织
      解决的问题: 通过组织视觉或文本技能或优化可执行harness代码，而不是更新模型权重，改进冻结的计算机使用代理。
      尚未覆盖: 仅在少量迁移场景中展示跨基准、跨应用泛化；harness或技能变更的形式边界未定义。
    - 路线: 数据合成与弱监督代理学习
      解决的问题: 通过大规模未标注截图课程和可验证合成RL任务，降低昂贵人工标注并训练GUI动作。
      尚未覆盖: 缺少理论保证或缩放规律，说明合成或弱监督数据如何影响样本效率与保留集失败率。
    共识:
    - 仅看总体成功率不够：子目标完成、观察成本、拖拽操作覆盖和不确定性排名能揭示Pass@1掩盖的差异。
    - 技能库或优化harness等外部工件可改进冻结代理，但收益可能更多来自工件本身而非框架选择。
    - 当前模型仍存在可避免的失败模式，如过度或不足观察、拖拽定位弱、不确定性排名跨模型类别迁移弱。
    - 弱监督或可验证合成可获取大规模任务与训练数据，减少对人工标注的依赖。
    分歧:
    - 表示方式：技能记忆中保留视觉图形加文本、纯文本技能、harness源代码编辑、不确定性分数集和拖拽定位数据。
    - 监督信号：从未标注截图的弱学习、在可验证合成任务上在线RL、以及冻结模型的证据驱动harness优化。
    - 评测目标：真实macOS GUI+CLI任务、动态短视频浏览、单步GUI定位、拖拽交互，以及OSWorld或ScienceBoard式可验证任务套件。
    - 交互模式：点击或轻点定位、拖拽操作、GUI与CLI组合工作流，以及内容变化下的观察-动作序列。
    - 部署场景：浏览器模拟平台、基于Docker的OS环境、真实桌面应用，以及可通过API访问的闭源模型。
