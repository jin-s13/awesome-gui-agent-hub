    and GUI-grounding settings.'
  - 'Shared research pattern: Moving beyond aggregate pass rates toward fine-grained
    sub-goal, observation-cost, uncertainty, and capability signals; several methods
    use these benchmarks to improve or stress agents.'
  - 'Key differences: Static desktop/OS tasks versus dynamic or video-guided interfaces;
    rule-based scoring versus cost-accuracy and uncertainty metrics; frozen-backbone
    skills/harness, online RL, and weak-supervision improvement routes.'
  - 'Trend evolution: The packet spans 2024–2026 but only 2026 top papers appear,
    so evidence shows a current-frontier shift from single static tasks to dynamic,
    video-guided, and meta-evaluation benchmarks.'
  - 'Open questions: Coverage of real workflows, metric-to-downstream alignment, cross-benchmark
    and cross-model stability, and reproducibility/limitations remain unverified.'
  related_work_outline_zh:
  - 主流方向：构建可执行的GUI/OS自动化基准，在真实桌面、浏览器、动态短视频、视频引导和GUI定位等设置中评估计算机使用代理。
  - 研究共性：超越一次性总体成功率，关注子目标完成、观察效率、不确定性校准和可验证能力信号；若干方法用这些基准改进或压力测试代理。
  - 关键差异：静态桌面/OS任务与动态或视频引导界面；规则评分与成本-准确率、不确定性指标；冻结骨干上的技能/harness、在线RL和弱监督改进路线。
  - 趋势演进：证据时间跨度为2024–2026，但仅出现2026年论文，因此当前趋势集中在从单一静态任务扩展到动态、视频引导和元评估基准。
  - 开放问题：真实工作流覆盖、指标与下游价值对齐、跨基准和跨模型稳定性以及可复现性和局限性仍未充分验证。
  literature_review:
    line_of_work_matrix:
    - line: Realistic desktop/OS benchmark design (e.g., MacAgentBench)
      what_it_solves: Creates real macOS multi-application tasks spanning GUI and
        CLI interaction, with fine-grained multi-checkpoint scoring.
      what_remains_open: Coverage across other operating systems, applications, framework/model
        combinations, and long-horizon workflows is unknown.
    - line: Dynamic and video-guided interface benchmarks (e.g., LivingScreen, VG-GUIBench)
      what_it_solves: Defines tasks where interface content changes between actions
        or video guides interaction, exposing observation control and temporal grounding
        issues.
      what_remains_open: Platform breadth, generalization beyond short-video or video-guided
        settings, and cost-accuracy thresholds remain uncovered.
    - line: Uncertainty and metric stress-testing (e.g., Argus)
      what_it_solves: Benchmarks post-hoc uncertainty quantification for GUI grounding
        and reveals selective transfer of UQ rankings across regimes.
      what_remains_open: Multi-step trajectory UQ, cross-interface transfer, and coverage
        guarantees under distribution shift are still missing.
    - line: Benchmark-driven agent baselines and task generation (e.g., VISUALSKILL,
        GUI-HARVEST, ScaleCUA, GUICrafter)
      what_it_solves: Produces stronger computer-use baselines through multimodal
        skills, harness evolution, verifiable task synthesis, and weak supervision,
        while testing benchmark sensitivity.
      what_remains_open: Whether gains transfer beyond the evaluated benchmarks and
        whether synthesized or weakly supervised data introduce hidden distribution
        bias is unclear.
    consensus:
    - Aggregate success rates hide differences in sub-goal completion, observation
      efficiency, and uncertainty quality.
    - Executable GUI/OS environments with verifiable or rule-based success checks
      are central for exposing agent failures.
    - Current agents still fail on observation control, dynamic interfaces, and cross-model/interface
      transfer.
    - Open-weight and closed-source models require different evaluation or uncertainty
      protocols because internal-state access differs.
    disagreements:
    - Static desktop/OS tasks differ from dynamic living-screen and video-guided tasks
      in interface stability, observation demand, and supervision.
    - 'Evaluation targets differ: deterministic rule-based completion, combined cost-accuracy,
      uncertainty calibration, and sub-goal completion are used separately.'
    - Interaction modes differ from single-step GUI grounding to multi-step agentic
      trajectories, changing temporal and state-coverage requirements.
    - 'Improvement routes differ: external multimodal skills or edited harnesses with
      frozen agents; online RL on synthesized verifiable tasks; weak supervision from
      unannotated screenshots.'
    - Environment coverage spans macOS desktop, browser-based short-video, video-guided
      GUI, and GUI grounding datasets, so cross-benchmark comparability is unresolved.
    open_questions:
    - Do current task distributions cover long-horizon, cross-app, dynamic, and multimodal
      workflows that users actually need automated?
    - Which proxy metrics—subgoal completion, cost-accuracy, uncertainty calibration—best
      predict downstream utility and agent reliability?
    - How stable are benchmark rankings across implementations, compute budgets, model
      access levels, and UQ methods?
    - Can verifiable task synthesis and weak supervision scale datasets without introducing
      verifier, annotation, or distribution bias?
    - What observation-control and multi-step trajectory evaluation is still missing
      for living-screen and dynamic GUI agents?
    - Missing limitation details and reproducibility signals in several top papers
      leave failure boundaries and artifact availability as verification gaps.
  literature_review_zh:
    研究路线矩阵:
    - 路线: 真实桌面/OS基准设计（如 MacAgentBench）
      解决的问题: 在真实macOS多应用任务上同时覆盖GUI与CLI交互，并使用细粒度多检查点评分。
      尚未覆盖: 其他操作系统、应用、框架/模型组合和长程工作流的覆盖仍未知。
    - 路线: 动态与视频引导界面基准（如 LivingScreen、VG-GUIBench）
      解决的问题: 定义界面内容在动作间变化或由视频引导的任务，暴露观察控制和时间定位问题。
      尚未覆盖: 平台广度、超出短视频或视频引导设置的泛化以及成本-准确率边界仍未覆盖。
    - 路线: 不确定性与度量压力测试（如 Argus）
      解决的问题: 对GUI定位进行后验不确定性量化评测，揭示UQ排名在不同体制下的选择性迁移。
      尚未覆盖: 多步轨迹UQ、跨接口迁移和分布偏移下的覆盖保证仍然缺失。
    - 路线: 基准驱动的代理基线与任务生成（如 VISUALSKILL、GUI-HARVEST、ScaleCUA、GUICrafter）
      解决的问题: 通过多模态技能、harness演化、可验证任务合成和弱监督提升基线，并检验基准敏感性。
      尚未覆盖: 跨基准迁移能力，以及合成或弱监督数据是否引入隐藏分布偏差，尚未厘清。
    共识:
    - 总体成功率会掩盖子目标完成、观察效率和不确定性质量上的差异。
    - 可执行的GUI/OS环境与可验证或规则化成功检查对暴露代理失败至关重要。
    - 当前代理在观察控制、动态界面和跨模型/跨接口迁移上仍有明显不足。
    - 开放权重与闭源模型需要不同的评估或不确定性协议，因为内部状态可访问性不同。
    分歧:
    - 静态桌面/OS任务与动态living-screen及视频引导任务在界面稳定性、观察需求和监督信号上不同。
