  related_work_outline:
  - 'Mainstream direction: building GUI agents that operate in dynamic real-world
    interfaces (desktop, mobile, short-video) with long-horizon tasks, while reducing
    human annotation via weak supervision, online RL, or synthetic data.'
  - 'Shared research pattern: replacing static, single-step benchmarks with dynamic,
    multi-interaction, and long-horizon evaluations; exploring representation and
    training strategies (keyframe extraction, context management) that improve sample
    efficiency and task coverage.'
  - 'Key differences: supervision signal (manual annotations vs. weak signals from
    unannotated screenshots vs. verifiable synthetic tasks); action space (click,
    drag, CLI, scroll); context representation (raw screenshots, structured history,
    folded UI state); deployment platform (macOS, mobile, browser).'
  - 'Trend evolution: from 2024–2026, evaluations broadened from static desktop to
    dynamic mobile/video and drag-based interactions; training shifted from supervised
    fine-tuning on large human demonstrations to online RL and curriculum learning
    with minimal annotation; benchmarks increasingly incorporate fine-grained, uncertainty-aware,
    and cost-aware metrics.'
  - 'Open questions: how to give agents observation control in dynamic interfaces;
    whether drag-based or hybrid action spaces can be trained end-to-end without large
    annotation; whether post-hoc uncertainty quantification transfers across model
    families and deployment settings; how proactive context management scales to hundreds
    of steps.'
  related_work_outline_zh:
  - 主流方向：构建能在动态真实界面（桌面、移动、短视频）中执行长时域任务的GUI代理，并通过弱监督、在线RL或合成数据减少对人工标注的依赖。
  - 研究共性：从静态、单步基准转向动态、多交互、长时域的评估；探索提升样本效率和任务覆盖的表示与训练策略（关键帧提取、上下文管理）。
  - 关键差异：监督信号（人工标注 vs. 未标注截图的弱信号 vs. 可验证合成任务）；动作空间（点击、拖拽、CLI、滚动）；上下文表示（原始截图、结构化历史、折叠UI状态）；部署平台（macOS、移动、浏览器）。
  - 趋势演进：2024至2026年间，评估从静态桌面扩展到动态移动/视频和拖拽交互；训练从大规模人类示教的监督微调转向在线RL和极少标注的课程学习；基准测试逐步纳入细粒度、不确定性感知和成本感知的指标。
  - 开放问题：如何赋予代理在动态界面中的观察控制能力；拖拽或混合动作空间是否可以端到端训练而无需大量标注；后验不确定性量化能否跨模型家族和部署场景迁移；主动上下文管理如何扩展到数百步的长序列。
  literature_review:
    line_of_work_matrix:
    - line: Method representation and objective design
      what_it_solves: Transforms raw GUI interactions into learnable representations
        and training objectives—e.g., keyframe extraction from video, weak supervision
        from unannotated screenshots, verifiable task synthesis for RL, and structured
        context management for long-horizon agents.
      what_remains_open: Whether gains come from the representation, the training
        curriculum, or a combination; whether these methods transfer across platforms
        and action spaces without per-task redesign.
    - line: Planning and action-interface methods
      what_it_solves: Connects agent perception to action execution beyond simple
        clicks—e.g., drag-based interactions, dynamic observation control, and uncertainty-aware
        spatial grounding—to improve safety and task completion in rich interfaces.
      what_remains_open: How much of the improvement comes from action-space design
        versus the underlying policy; whether uncertainty quantification and conformal
        safety regions remain calibrated under distribution shift.
    - line: Method evidence and ablation protocol
      what_it_solves: Provides benchmarks and evaluation protocols (fine-grained multi-checkpoint
        scoring, cost-accuracy metrics, cross-model UQ rankings) that isolate the
        contribution of agent methods from dataset, framework, and implementation
        effects.
      what_remains_open: Whether current benchmarks represent the full diversity of
        real-world GUI tasks and failure modes; whether UQ benchmarks can reliably
        predict deployment safety without target-specific recalibration.
    consensus:
    - Current GUI agents struggle with observation control in dynamic interfaces,
      tending to over-observe or under-observe.
    - Drag-based interactions remain a weak point, and large-scale drag datasets can
      improve model grounding.
    - Weakly supervised and synthetic data generation can substantially reduce the
      need for expensive human annotations while maintaining competitive performance.
    - Proactive, structured context management outperforms passive history accumulation
      in long-horizon mobile tasks.
    - Post-hoc uncertainty quantification methods show strong within-model ranking
      transfer but degrade sharply across model tiers and interfaces.
    disagreements:
    - 'Supervision approach: some methods rely on reinforcement learning with verifiable
      rewards, while others use weak supervision from unannotated screenshots or full
      human demonstrations.'
    - 'Evaluation target: benchmarks differ in prioritizing task-level Pass@1 versus
      fine-grained sub-goal completion or cost-accuracy trade-offs.'
    - 'Interaction scope: works focus on disjoint action sets—click-only, click+drag,
      click+CLI, or scroll-based—leading to fragmented evidence on comprehensive action
      coverage.'
    - 'Context treatment: passive concatenation of all history versus active folding
      and pruning of context fields; no agreement on the optimal strategy for steps
      beyond a few dozen.'
    open_questions:
    - How can agents autonomously control observation frequency and information intake
      in continuously changing interfaces without external heuristics?
    - Can drag-based and hybrid action spaces be trained end-to-end with the same
      sample efficiency as click-only agents, and do benchmarks like DragOn capture
      the full difficulty of real-world dragging?
    - Under what conditions do post-hoc UQ rankings transfer from open-weight to closed-source
      models, and can conformal prediction regions be made robust to deployment-time
      distribution shifts?
    - What is the minimal set of context fields needed to support reasoning over hundreds
      of steps without losing critical information or exceeding model context limits?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 方法表示与目标设计
      解决的问题: 将原始GUI交互转化为可学习的表示和训练目标，例如从视频中提取关键帧、从未标注截图进行弱监督、为RL生成可验证任务、为长时域代理设计结构化上下文管理。
      尚未覆盖: 收益来自表示本身、训练课程还是两者结合；这些方法是否能跨平台和动作空间迁移而无需针对每个任务重新设计。
    - 路线: 规划与动作接口方法
      解决的问题: 将代理的感知连接到超越简单点击的动作执行，例如拖拽交互、动态观察控制和不确定性感知的空间定位，以提升在丰富界面中的安全性和任务完成度。
      尚未覆盖: 改进中有多少来自动作空间设计而非底层策略；不确定性量化和共形安全区域在分布偏移下是否保持校准。
    - 路线: 方法证据与消融协议
      解决的问题: 提供基准测试和评估协议（细粒度多检查点评分、成本-准确性指标、跨模型UQ排名），以分离代理方法贡献与数据集、框架和实现因素的影响。
      尚未覆盖: 当前基准是否代表真实世界GUI任务的完整多样性和失败模式；UQ基准能否在不进行目标特定重新校准的情况下可靠预测部署安全性。
    共识:
    - 当前GUI代理在动态界面中普遍缺乏观察控制，容易过度观察或观察不足。
    - 拖拽交互仍是薄弱环节，大规模拖拽数据集可以改善模型的空间定位能力。
    - 弱监督和合成数据生成能够大幅减少对昂贵人工标注的依赖，同时保持竞争性性能。
    - 在长时域移动任务中，主动的结构化上下文管理优于被动的历史累积。
    - 后验不确定性量化方法在模型内部排名迁移性很强，但跨模型层级和接口时性能急剧下降。
    分歧:
    - 监督方式：部分方法依赖可验证奖励的强化学习，另一些则使用未标注截图的弱监督或完整人工示教。
    - 评估目标：基准测试在侧重任务级Pass@1、细粒度子目标完成度或成本-准确性权衡上存在差异。
    - 交互范围：工作聚焦于互不相交的动作集合——仅点击、点击+拖拽、点击+CLI或滚动——导致对全面动作覆盖的证据碎片化。
    - 上下文处理：被动拼接所有历史与主动折叠和裁剪上下文字段；在超过几十步后尚无统一的最优策略。
    开放问题:
    - 代理如何在持续变化的界面中自主控制观察频率和信息摄入，而不依赖外部启发式规则？
    - 拖拽和混合动作空间能否以与纯点击代理相同的样本效率进行端到端训练，DragOn等基准是否捕捉了真实拖拽的全部难度？
    - 在什么条件下后验UQ排名能从开源权重模型迁移到闭源模型，并且共形预测区域能否对部署时的分布偏移保持鲁棒？
    - 支持数百步推理所需的最少上下文字段集合是什么，才能既不丢失关键信息又不超过模型上下文窗口限制？
