        evaluations lack reported limitations and artifact details, leaving generalization
        and failure boundaries unverified.
    - line: Multimodal skill and memory augmentation
      what_it_solves: Encode validated workflows as visual+text or callable memories
        to improve UI element identification, workflow state verification, and repeated-task
        efficiency.
      what_remains_open: Unclear how these artifacts remain valid across application
        versions, UI state shifts, and ambiguous runtime conditions without human
        or deterministic repair.
    - line: Efficient experience replay and compilation
      what_it_solves: Convert successful agent trajectories into state-machine or
        parameter-controlled replay programs, reducing language-model calls, token
        cost, and execution time.
      what_remains_open: Reported gains are median token/time reductions on selected
        computer-use tasks; cross-environment robustness and mismatch fallback boundaries
        need more evidence.
    - line: Dynamic-interface observation control and video-guided transfer
      what_it_solves: Model or evaluate agents in settings where content changes between
        actions, introducing observation cost and keyframe selection for video-guided
        GUI tasks.
      what_remains_open: Current agents over- or under-observe; keyframe extraction
        has been validated mainly on VideoQA and limited GUI tasks, not full dynamic
        workflows.
    - line: Model-level GUI grounding and navigation training
      what_it_solves: Train diffusion-based vision-language GUI agents for grounding
        and navigation across mobile, desktop, and web benchmarks.
      what_remains_open: Benchmark coverage and limitation/artifact evidence are incomplete,
        so robustness, failure modes, and deployment boundaries remain open.
    - line: Low-level interaction grounding and data generation for drag actions
      what_it_solves: Create large-scale drag-action tasks and fine-tune VLMs to improve
        grounding for resize, slider, selection, and highlighting.
      what_remains_open: Gains are shown for one fine-tuned VLM on held-out drag tasks;
        no limitation/artifact details are available to assess downstream computer-use
        generalization.
    consensus:
    - 'Multi-step visual GUI tasks expose gaps beyond single-step grounding: sub-goal
      completion, information cost, and observation behavior matter.'
    - Reusable skills, validated memories, or replay programs can reduce cost and
      improve success without per-step language-model calls.
    - Multimodal artifacts, especially retaining visual figures, improve UI element
      identification and workflow state verification.
    - Current agents do not yet match human cost-accuracy in dynamic interfaces.
    disagreements:
    - 'Where to intervene: external skill/memory modules versus training the agent
      model itself.'
    - 'Primary evaluation target: task success/Pass@1 versus cost-accuracy/information
      efficiency versus replay token and time reduction.'
    - 'Interaction scope: static desktop/mobile/web click and drag grounding versus
      dynamic short-video observation control versus video-guided GUI tasks.'
    - 'Representation of reusable knowledge: text-only skill entries versus visual+text
      multimodal skill files versus state-machine callable memories.'
    open_questions:
    - How should reusable memories be validated or repaired when applications change
      UI layout or state preconditions?
    - What observation-control policy would let dynamic-interface agents stop early
      without missing needed information?
    - Do reported improvements in curated task suites transfer to professional office,
      mobile app, or software-operation workflows?
    - What failure modes remain hidden by absent limitation, code, dataset, or metric
      details in top scoring papers?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 真实桌面与动态界面任务套件
      解决的问题: 提供跨应用或动态平台任务，并用确定性、细粒度或成本感知评分揭示接地与观察控制失败。
      尚未覆盖: 覆盖范围通常限于单一平台或交互类型；若干评估缺少局限与工件细节，泛化边界未验证。
    - 路线: 多模态技能与记忆增强
      解决的问题: 将已验证工作流编码为视觉+文本或可调用记忆，改善UI元素识别、工作流状态验证和重复任务效率。
      尚未覆盖: 这些工件在应用版本变化、UI状态偏移和模糊运行条件下如何保持有效仍未明确。
    - 路线: 高效经验重放与编译
      解决的问题: 把成功智能体轨迹转换为状态机或参数化重放程序，减少语言模型调用、token成本和执行时间。
      尚未覆盖: 报告收益主要是选定计算机使用任务上的中位数降幅；跨环境稳健性和不匹配回退边界需更多证据。
    - 路线: 动态界面观察控制与视频引导迁移
      解决的问题: 对动作间内容变化的界面进行建模或评测，并在视频引导GUI任务中引入观察成本与关键帧选择。
      尚未覆盖: 当前智能体普遍过度或不足观察；关键帧提取主要在VideoQA和有限GUI任务上验证，缺少完整动态工作流证据。
    - 路线: 模型级GUI接地与导航训练
      解决的问题: 训练扩散视觉语言GUI智能体，以在移动、桌面和网页基准上完成界面接地与导航。
      尚未覆盖: 基准覆盖与局限/工件证据不完整，稳健性、失败模式和部署边界仍开放。
    - 路线: 低层交互接地与拖拽数据生成
      解决的问题: 构建大规模拖拽操作任务并微调VLM，以改善缩放、滑块、选择与高亮等接地能力。
      尚未覆盖: 仅在单一VLM和保留拖拽任务上显示提升，缺少局限/工件细节以评估下游计算机使用泛化。
    共识:
    - 多步视觉GUI任务暴露单一接地以外的差距，如子目标完成、信息成本和观察行为。
    - 可复用技能、已验证记忆或重放程序能减少成本并提升成功率，而无需每步语言模型调用。
    - 保留视觉图形的多模态工件改善UI元素识别和工作流状态验证。
    - 当前智能体在动态界面中尚未达到人类水平的成本-精度表现。
    分歧:
    - 干预位置不同：外部技能/记忆模块与训练智能体模型本身。
    - 主要评测目标不同：任务成功/Pass@1与成本-精度/信息效率、重放token与时间减少。
    - 交互范围不同：静态桌面/移动/网页点击与拖拽接地、动态短视频观察控制、视频引导GUI任务。
    - 可复用知识表示不同：纯文本技能、视觉+文本多模态技能、状态机可调用记忆。
    开放问题:
    - 应用更改UI布局或状态前提后，可复用记忆应如何验证或修复？
    - 何种观察控制策略能让动态界面智能体在不错过必要信息的前提下提前停止？
    - 在策展任务套件上的提升能否迁移到专业办公、移动应用或软件操作工作流？
    - 高分论文缺失的局限、代码、数据集或指标细节隐藏了哪些失败模式？
