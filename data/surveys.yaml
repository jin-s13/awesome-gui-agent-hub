  literature_review:
    line_of_work_matrix:
    - line: Application-grounded GUI benchmark construction
      what_it_solves: Evaluates agent grounding across desktop tasks, dynamic short-video
        platforms, drag interactions, and video-guided tasks, revealing failure modes
        such as over/under-observation and drag-specific errors.
      what_remains_open: Benchmarks are platform-limited; transfer to professional
        software operation and safety-critical workflows, and whether fine-grained
        metrics predict real deployment, remain unverified.
    - line: Reusable skill, memory, and replay systems
      what_it_solves: Compiles validated GUI trajectories or multimodal skill artifacts
        into replayable or loadable resources to cut token cost, execution time, and
        repeated-task overhead with precondition checks.
      what_remains_open: Robustness to UI changes, dynamic content, ambiguous states,
        and artifact lifecycle/accumulation remain open; deterministic replay is bounded
        to compatible runtime states.
    - line: Multimodal grounding and training for GUI agents
      what_it_solves: Improves visual element identification, navigation, drag grounding,
        or video-guided interaction through diffusion vision-language models, fine-tuning
        on interaction datasets, or task-driven keyframe extraction.
      what_remains_open: Cross-platform and cross-app generalization, closed/open
        model gaps, and reproducibility evidence such as code, datasets, and limitations
        are incomplete in the packet.
    consensus:
    - Application-grounded benchmarks use real or browser-based interfaces and multi-step
      tasks, showing that GUI agents need more than static click success.
    - 'Efficiency and fine-grained diagnostics matter: several works report sub-goal
      completion, cost-accuracy, token cost, execution time, or failure-mode analysis
      rather than only Pass@1.'
    - Reusable artifacts can improve repeated-task performance, but only when runtime
      verification, precondition checking, or fallback mechanisms prevent incorrect
      reuse.
    - Current models still show clear gaps in dynamic observation control, drag interactions,
      or cross-application workflows, supporting continued need for domain-specific
      training and benchmark stress tests.
    disagreements:
    - 'They diverge in evaluation target: some optimize Pass@1 or average score, others
      emphasize cost-accuracy, fine-grained sub-goal checkpoints, or video-guided
      grounding.'
    - 'Interaction scope differs: one cluster covers GUI+CLI desktop tasks, another
      dynamic short-video interfaces, another drag-based manipulation, and another
      video-guided GUI tasks.'
    - 'Reuse mechanism differs: multimodal hierarchical skill artifacts versus state-machine
      replay programs versus parameter-controlled callable memories, each with different
      visual, textual, and deterministic precondition assumptions.'
    - 'Modeling strategy differs: block-wise diffusion vision-language agent, fine-tuning
      a Qwen VLM on drag data, and keyframe extraction over video frames treat representation
      and supervision differently.'
    open_questions:
    - How well do improvements on MacAgentBench, LivingScreen, DragOn, and VG-GUIBench
