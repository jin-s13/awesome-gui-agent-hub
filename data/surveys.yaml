  literature_review:
    line_of_work_matrix:
    - line: Executable GUI task abstraction and evaluation across interface types
      what_it_solves: Defines task suites for macOS GUI+CLI workflows, dynamic short-video
        interfaces, and drag primitives, using rule-based, verifiable, or cost-accuracy
        scoring beyond end-to-end success.
      what_remains_open: Coverage is platform- or interaction-specific; dynamic observation
        control and drag grounding are not yet formalized as general agent capabilities,
        and some limitation records are missing.
    - line: External scaffolding and knowledge augmentation for frozen agents
      what_it_solves: Improves frozen backbone models by providing multimodal per-application
        skill libraries or by diagnosing and editing the execution harness from repeated-run
        evidence.
      what_remains_open: Transfer beyond evaluated applications and benchmarks is
        partly tested but not fully bounded, especially for unseen interfaces and
        interaction types.
    - line: Task synthesis, weak supervision, and online RL for GUI-agent training
      what_it_solves: Reduces annotation cost and scales computer-use training through
        verifiable synthetic tasks with frontier sampling, or through visual grounding
        on massive unannotated screenshots followed by small labeled calibration.
      what_remains_open: Evidence focuses on OSWorld, ScienceBoard, and selected baselines;
        generalization to dynamic screens, drag interactions, and failure prediction
        under distribution shift is not established in visible records.
    - line: Post-hoc uncertainty quantification for reliable GUI grounding
      what_it_solves: Evaluates ranking and spatial calibration of uncertainty methods
        for GUI grounding, identifying stable open-weight method families and reducing
        conformal click radii under calibrated conditions.
      what_remains_open: Findings are limited to single-step grounding; cross-model
        and cross-interface ranking transfer is weak, and coverage degrades under
        calibration-test or interface mismatch.
    - line: Self-improvement through evidence-driven harness or task construction
      what_it_solves: Converts repeated evaluations and verifiable environment interactions
        into structured self-improvement, either by editing the execution harness
        around frozen models or by generating training tasks.
      what_remains_open: Boundaries between harness-induced gains, model capacity
        limits, and environment-specific overfitting are not fully separated; reproducibility
        details are uneven across records.
    consensus:
    - GUI agent work is moving beyond coarse success rates toward fine-grained, verifiable,
      and cost-aware evaluation signals.
    - Frozen models can be improved without retraining by changing external scaffolding,
      including multimodal skill retrieval and harness logic.
    - Training-time scaling increasingly relies on synthetic, weakly labeled, or verifiable
      interaction data instead of purely human annotation.
    - Non-static interfaces and non-click interaction primitives expose distinct failure
      modes such as over/under-observation and weak drag grounding.
    disagreements:
    - 'Intervention level differs: modifying the execution harness or skill artifacts
      versus training the agent with RL or weak supervision versus post-hoc uncertainty
      calibration.'
    - 'Evaluation unit differs: full computer-use task completion is measured in some
      works, while others score single-step grounding, drag primitives, or dynamic-platform
      cost-accuracy.'
    - 'Supervision and data differ: some rely on repeated executions and screenshots
      for diagnosis, some scale synthetic verifiable tasks, and some exploit large
      unannotated screenshots; this changes efficiency and generalization claims.'
    - 'Deployment setting differs: desktop macOS multi-app workflows, browser-based
      short-video platforms, synthetic Docker tasks, GUI grounding datasets, and Windows
      transfer are distinct contexts, so benchmark gains may not transfer.'
    open_questions:
    - Do fine-grained sub-goal and cost-accuracy signals reorder model rankings compared
      with Pass@1, and which signal should guide deployment?
    - Can skill-library or harness-level gains transfer to unseen applications, dynamic
      interfaces, and non-click primitives without task-specific curation?
    - Under what conditions can uncertainty ranking and conformal calibration remain
      reliable across model families, interfaces, and distribution shifts?
    - How should observation control be formalized for living-screen interfaces where
      content changes between actions, and what metrics reflect efficient information
      gathering?
