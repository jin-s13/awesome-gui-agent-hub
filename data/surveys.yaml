  related_work_outline:
  - 'Mainstream direction: Formalizing GUI agent tasks, interactions, and evaluation
    frameworks to define what agents must solve and how to measure progress, moving
    beyond simple click-based benchmarks to dynamic, multi-step, and multi-application
    settings.'
  - 'Shared research pattern: Decomposing agent behavior into structured abstractions—skills,
    context management, task synthesis, or uncertainty estimates—and evaluating using
    dedicated benchmarks that pair accuracy with cost, efficiency, or safety metrics.'
  - 'Key differences: Whether the primary abstraction targets task representation
    (benchmarks), agent internal structure (skill libraries, context policies), training
    data (weak supervision, synthetic RL tasks), or reliability (post-hoc uncertainty).'
  - 'Trend evolution: From 2024 static single-app benchmarks toward 2025–2026 dynamic,
    multi-modal, and long-horizon settings, with growing emphasis on scalability via
    synthetic data, online RL, and uncertainty quantification for deployment safety.'
  - 'Open questions: How well current abstractions transfer across platforms, interface
    modalities, and model families; whether uncertainty quantification can be integrated
    into closed-loop agent control; and how to validate that scaling laws predict
    real-world failure modes.'
  related_work_outline_zh:
  - 主流方向：形式化GUI代理的任务、交互和评估框架，定义代理需要解决的问题以及如何衡量进展，从简单的点击基准测试扩展到动态、多步骤、多应用场景。
  - 研究共性：将代理行为分解为结构化抽象——技能、上下文管理、任务合成或不确定性估计——并使用将准确性与成本、效率或安全指标结合的专用基准进行评估。
  - 关键差异：主要抽象是针对任务表示（基准）、代理内部结构（技能库、上下文策略）、训练数据（弱监督、合成RL任务）还是可靠性（后验不确定性）。
  - 趋势演进：从2024年的静态单应用基准，发展到2025–2026年的动态、多模态和长时域设置，越来越强调通过合成数据、在线RL和不确定性量化实现可扩展性和部署安全性。
  - 开放问题：当前抽象在不同平台、界面模态和模型家族间的迁移性；不确定性量化能否集成到闭环代理控制中；如何验证缩放定律能够预测真实场景中的失败模式。
  literature_review:
    line_of_work_matrix:
    - line: Formal task and interaction abstractions
      what_it_solves: Defines the input space, action primitives, and evaluation protocols
        for GUI agents, including drag interactions, dynamic content, and multi-application
        workflows, enabling systematic comparison of agent capabilities.
      what_remains_open: Whether abstraction taxonomies cover all real-world complexity
        (e.g., concurrent CLI+GUI, live-streaming interfaces) and whether evaluation
        metrics align with downstream user utility.
    - line: Structured agent capability modeling
      what_it_solves: Imposes hierarchical organization on agent behavior—multimodal
        skill libraries, proactive context management policies, or verifiable task
        generators—to improve long-horizon reliability and sample efficiency.
      what_remains_open: Generalization across unseen applications and model backbones;
        whether these structures capture genuine understanding or primarily exploit
        training set regularities.
    - line: Reliability and uncertainty quantification
      what_it_solves: Provides post-hoc calibration of GUI grounding confidence, enabling
        selective failure prediction and spatial safety regions via conformal prediction,
        so that agents can signal when they are likely to be wrong.
      what_remains_open: Coverage guarantees under distribution shift (calibration-test
        mismatch) and in multi-step trajectories; integration of uncertainty signals
        into the agent's decision loop rather than only post-hoc analysis.
    - line: Data and training scaling
      what_it_solves: Reduces reliance on costly human annotations through weak supervision
        from unlabeled screenshots, synthetic task generation, and online RL, showing
        that small amounts of curated data can match or exceed larger supervised datasets.
      what_remains_open: Direct evidence that scaling laws predict transfer to new
        platforms and failure modes; whether the gains from synthetic tasks persist
        under real-world distribution shifts.
    consensus:
    - 'GUI agents require more than click-based evaluation: drag, dynamic content,
      and multi-application workflows are necessary to reflect real usage.'
    - Fine-grained, multi-metric evaluation (sub-goal completion, cost-accuracy, information
      efficiency) reveals capability differences that single success rates conceal.
    - Context management over long horizons is a critical bottleneck, and structured
      representations (folded history, indexed skills) outperform passive history
      accumulation.
    - Uncertainty quantification is essential for safe deployment; current agents
      lack observation control and calibration, leading to over- or under-interaction.
    - Weakly supervised and synthetic data generation can dramatically reduce annotation
      costs while maintaining competitive performance.
    disagreements:
    - Some approaches rely on proprietary frontier models as the agent backbone, while
      others train open-weight models end-to-end, which affects reproducibility and
      deployment flexibility.
    - 'Evaluation protocols differ: rule-based deterministic scoring versus model-based
      or human judgment, making cross-benchmark comparisons difficult.'
    - 'Interaction granularity varies: some formalize high-level task plans, others
      focus on low-level UI element grounding, and a few combine both, but the optimal
      level of abstraction remains unsettled.'
    - Uncertainty methods are assessed only on single-step grounding, leaving open
      whether they extend to multi-step agent trajectories where errors compound.
    open_questions:
    - Can formal task abstractions generalize to unseen interface paradigms (e.g.,
      AR/VR, voice+GUI) without re-engineering the entire benchmark suite?
    - How do we validate that the structured skill or context management learned on
      one set of applications transfers to a completely different application ecosystem?
    - What is the minimal set of calibration data needed to guarantee conformal coverage
      for GUI grounding under realistic deployment shifts?
    - Do the scaling trends observed in synthetic task generation hold when agents
      are evaluated on tasks designed by human users rather than algorithmically generated
      templates?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 任务与交互的形式化抽象
      解决的问题: 定义GUI代理的输入空间、动作原语和评估协议，包括拖拽交互、动态内容和多应用工作流，从而系统比较代理能力。
      尚未覆盖: 抽象分类法是否涵盖所有真实复杂性（如并发CLI+GUI、直播流界面），评估指标是否与下游用户效用一致。
    - 路线: 代理能力的结构化建模
      解决的问题: 对代理行为施加层次化组织——多模态技能库、主动上下文管理策略或可验证任务生成器——以提高长时域可靠性和样本效率。
      尚未覆盖: 在未见应用和模型骨干上的泛化；这些结构是捕捉了真正的理解，还是主要利用了训练集的规律性。
    - 路线: 可靠性与不确定性量化
      解决的问题: 提供GUI定位置信度的后验校准，通过共形预测实现选择性失败预测和空间安全区域，让代理在可能出错时发出信号。
      尚未覆盖: 在分布偏移（校准-测试不匹配）和多步轨迹下的覆盖率保证；将不确定性信号集成到代理决策循环中，而非仅做事后分析。
    - 路线: 数据与训练缩放
      解决的问题: 通过未标注截图的弱监督、合成任务生成和在线RL减少对昂贵人工标注的依赖，证明少量精心策划的数据就能匹敌或超越更大的监督数据集。
      尚未覆盖: 缩放定律能否直接预测新平台上的迁移和失败模式；合成任务的收益在真实分布偏移下是否持续存在。
    共识:
    - GUI代理需要超越基于点击的评估：拖拽、动态内容和多应用工作流是反映真实使用所必需的。
    - 细粒度、多指标评估（子目标完成度、成本-准确性、信息效率）揭示了单一成功率所掩盖的能力差异。
    - 长时域下的上下文管理是关键瓶颈，结构化表示（折叠历史、索引技能）优于被动历史累积。
    - 不确定性量化对于安全部署至关重要；当前代理缺乏观察控制和校准，导致交互过度或不足。
    - 弱监督和合成数据生成可以大幅降低标注成本，同时保持有竞争力的性能。
    分歧:
    - 一些方法依赖专有前沿模型作为代理骨干，另一些则端到端训练开源模型，这影响了可复现性和部署灵活性。
    - 评估协议不同：基于规则的确定性评分与基于模型或人工判断的评分，使得跨基准比较困难。
    - 交互粒度不同：有的形式化高层次任务计划，有的专注于低层次UI元素定位，少数两者兼顾，但最佳抽象层次尚未确定。
    - 不确定性方法仅在单步定位上评估，是否适用于多步代理轨迹中误差累积的情况仍是未知。
    开放问题:
