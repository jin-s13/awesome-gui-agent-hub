  related_work_outline:
  - 'Mainstream direction: Building open-source, end-to-end training and deployment
    frameworks (e.g., OpenForgeRL, OpenWebRL) that enable scalable reinforcement learning
    of native visual GUI agents, augmented by multimodal skill libraries (e.g., VISUALSKILL)
    and weak supervision from unlabeled data (e.g., GUICrafter), with growing emphasis
    on step-level diagnostic benchmarks (e.g., Desktop-Delta Bench) and domain-conditioned
    safety audits.'
  - 'Shared research pattern: Agents take screenshots as input and output keyboard/mouse
    actions; training pipelines combine supervised fine-tuning, curriculum learning,
    and multi-turn RL; evaluation expands from task success to failure-mode taxonomy,
    temporal ordering, and prompt-injection resistance; open-source artifacts are
    prioritized for reproducibility.'
  - 'Key differences: Interaction modality—pure vision (Qwen-CUA) vs. skill-augmented
    (VISUALSKILL); training signal—online RL on live websites (OpenWebRL) vs. offline
    curriculum with weak labels (GUICrafter) vs. verifiable reward RL (Qwen-CUA);
    memory design—full-image history vs. action-grounded crops (AGMem); safety evaluation—browser
    prompt injection vs. coding-domain skill injection; benchmark scope—end-to-end
    task completion vs. step-level diagnostic (Desktop-Delta Bench).'
  - 'Trend evolution: Within 2024–2026, the frontier moved from single-agent architectures
    to integrated training infrastructure, from task-level success rates to fine-grained
    diagnostic and safety layers, and from reliance on human-annotated data to weak
    supervision and large-scale RL rollouts. Safety hardening is shown to be domain-conditioned,
    opening a new research axis.'
  - 'Open questions: How to improve error recovery after RL training; why some inference
    harnesses are harder to learn than others; how to generalize safety hardening
    beyond the browser domain; how to align offline diagnostic metrics with live,
    asynchronous interactions; how to manage visual memory noise that worsens action-level
    errors.'
  related_work_outline_zh:
  - 主流方向：构建开源端到端训练与部署框架（如OpenForgeRL、OpenWebRL），实现对原生视觉GUI代理的可扩展强化学习，并通过多模态技能库（VISUALSKILL）和未标注数据弱监督（GUICrafter）增强代理能力，同时逐步强调步骤级诊断基准（Desktop-Delta
    Bench）和领域条件安全性审计。
  - 研究共性：代理以截图为输入，输出键盘/鼠标动作；训练流水线结合监督微调、课程学习和多轮强化学习；评估从任务成功率扩展到失败模式分类、时序排序和提示注入抵抗；优先提供开源工件以保证可复现性。
  - 关键差异：交互模态——纯视觉（Qwen-CUA）与技能增强（VISUALSKILL）；训练信号——真实网站在线RL（OpenWebRL）与带有弱标注的离线课程学习（GUICrafter）与可验证奖励RL（Qwen-CUA）；记忆设计——全图像历史与动作接地裁剪（AGMem）；安全评估——浏览器提示注入与编码领域技能注入；基准范围——端到端任务完成与步骤级诊断（Desktop-Delta
    Bench）。
  - 趋势演进：2024–2026年间，前沿从单一代理架构转向集成训练基础设施，从任务级成功率转向细粒度诊断和安全层，从依赖人工标注数据转向弱监督和大规模RL部署。安全加固被证明是领域条件的，开启了新的研究方向。
  - 开放问题：如何改善RL训练后的错误恢复能力；为何某些推理框架比其他框架更难学习；如何将安全加固泛化至浏览器之外的领域；如何使离线诊断指标与实时异步交互对齐；如何管理加剧动作级错误的视觉记忆噪声。
  literature_review:
    line_of_work_matrix:
    - line: Scalable online/offline RL training frameworks
      what_it_solves: Enables end-to-end training of visual GUI agents in real or
        simulated environments, managing multi-turn interactions, complex action spaces,
        and harness-based inference.
      what_remains_open: Error recovery remains weak after RL; some harnesses are
        substantially harder to learn; trade-offs between training cost, environment
        fidelity, and generalization across operating systems.
    - line: Multimodal skill and memory augmentation
      what_it_solves: Improves agent performance on UI grounding and workflow verification
        by retaining visual figures alongside text or storing action-grounded image
        crops instead of full screenshots.
      what_remains_open: Long-term memory management across tasks; noise from full-image
        memory increases action-level errors; generalization of skills to previously
        unseen applications.
    - line: Weakly-supervised and data-efficient agent learning
      what_it_solves: Reduces reliance on expensive human annotations by leveraging
        massive unannotated screenshots and curriculum learning, achieving competitive
        performance with minimal labeled data.
      what_remains_open: Robustness in complex, multi-application workflows; calibration
        gap between weak supervision and real-world deployment; scalability to diverse
        desktop environments beyond web.
    - line: Step-level diagnostic and safety benchmarks
      what_it_solves: Isolates specific failure dimensions—state verification, source
        tracking, context-aware control, and prompt-injection resistance—beyond end-task
        success, enabling targeted improvement.
      what_remains_open: Offline benchmarks do not capture asynchronous timing and
        real-time dynamics; safety hardening is domain-conditioned and fails on coding
        tasks; systematic repair methods for diagnosed failures are absent.
    consensus:
    - Screenshot-based visual input is the primary interaction modality for native
      computer-use agents.
    - Reinforcement learning, especially multi-turn online RL, is a key training paradigm
      for improving agent performance.
    - Open-source frameworks and reproducible artifacts are increasingly prioritized,
      with code, data, and infrastructure released to enable community benchmarking.
    - Fine-grained diagnostic evaluation beyond task success rate is necessary to
      understand and improve agent robustness, safety, and grounding.
    disagreements:
    - 'Training data construction: supervised fine-tuning on human-annotated trajectories
      vs. weak supervision from unlabeled screenshots vs. verifiable rewards from
      deterministic rollouts.'
    - 'Visual memory strategy: retaining full-image history vs. storing action-grounded
      image crops vs. building multimodal skill artifacts with visual figures.'
    - 'Safety evaluation scope: hand-crafted browser prompt injection vs. RL-optimized
      attacks; browser-only tasks vs. cross-domain (coding) vulnerability testing.'
    - 'Agent interface: direct keyboard and mouse actions without accessibility metadata
      vs. tool-augmented actions via skill libraries and harnesses.'
    open_questions:
    - Can error recovery be significantly improved through RL training alone, or are
      architectural changes to inference harnesses required?
    - How can safety hardening be generalized across domains when current frontier
      models show domain-conditioned resistance (browser-safe, coding-vulnerable)?
    - What is the relationship between offline diagnostic metrics (e.g., temporal
      ordering accuracy) and actual online task success in live, asynchronous environments?
    - How should visual memory be designed to avoid increasing action-level grounding
      errors while still providing useful state context?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 可扩展的在线/离线RL训练框架
      解决的问题: 在真实或模拟环境中端到端训练视觉GUI代理，处理多轮交互、复杂动作空间和基于推理框架的推理。
      尚未覆盖: RL训练后错误恢复能力仍然较弱；某些框架比其他框架更难学习；训练成本、环境保真度和跨操作系统泛化之间的权衡。
    - 路线: 多模态技能与记忆增强
      解决的问题: 通过保留视觉图形与文本并排或存储动作接地图像裁剪，提升代理在UI定位和工作流验证上的表现。
      尚未覆盖: 跨任务长期记忆管理；全图像记忆的噪声增加了动作级错误；技能向未见过应用的泛化。
    - 路线: 弱监督与数据高效代理学习
      解决的问题: 利用海量未标注截图和课程学习，减少对昂贵人工标注的依赖，以极少量标注数据实现竞争性能。
      尚未覆盖: 复杂多应用工作流中的鲁棒性；弱监督与实际部署之间的校准差距；超出网页的多样化桌面环境的可扩展性。
    - 路线: 步骤级诊断与安全性基准
      解决的问题: 隔离具体失败维度——状态验证、源跟踪、上下文感知控制和提示注入抵抗——超越最终任务成功，实现针对性改进。
      尚未覆盖: 离线基准无法捕捉异步时序和实时动态；安全加固是领域条件的，在编码任务上失败；缺乏对诊断出的失败进行系统修复的方法。
    共识:
    - 基于截图的视觉输入是原生计算机使用代理的主要交互模态。
    - 强化学习，特别是在线多轮RL，是提升代理性能的关键训练范式。
    - 开源框架和可复现工件越来越受到重视，代码、数据和基础设施被发布以供社区基准测试。
    - 超越任务成功率的细粒度诊断评估对于理解和改进代理的鲁棒性、安全性和接地性是必要的。
    分歧:
    - 训练数据构建：对人工标注轨迹的监督微调 与 来自未标注截图的弱监督 与 来自确定性部署的可验证奖励。
    - 视觉记忆策略：保留全图像历史 与 存储动作接地图像裁剪 与 构建带视觉图形的多模态技能工件。
    - 安全评估范围：手工制作的浏览器提示注入 与 RL优化攻击；仅浏览器任务 与 跨领域（编码）漏洞测试。
    - 代理接口：无需可访问性元数据的直接键盘和鼠标动作 与 通过技能库和推理框架增强的工具动作。
    开放问题:
    - 仅通过RL训练能否显著改善错误恢复，还是需要对推理框架进行架构更改？
    - 当前沿模型表现出领域条件抵抗（浏览器安全，编码脆弱）时，如何将安全加固泛化到不同领域？
    - 离线诊断指标（如时序排序准确率）与真实在线异步环境中的在线任务成功率之间存在什么关系？
    - 如何设计视觉记忆以避免增加动作级接地错误，同时仍提供有用的状态上下文？
