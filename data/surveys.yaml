  literature_review:
    line_of_work_matrix:
    - line: Executable GUI benchmark and task abstraction
      what_it_solves: Defines task suites, interaction spaces such as desktop GUI/CLI,
        dynamic short-video screens, and drag-based actions, plus fine-grained scoring
        or capability annotations that separate pass/fail from sub-goal completion.
      what_remains_open: A unified multi-step, cross-interface evaluation framework
        is still missing; dynamic-screen, drag, and uncertainty coverage remain fragmented,
        and several papers report incomplete limitation or artifact evidence.
    - line: Frozen-model skill and harness reuse
      what_it_solves: Improves GUI execution without retraining the backbone by injecting
        multimodal skill artifacts or by evidence-driven harness changes grounded
        in screenshots and repeated runs.
      what_remains_open: Whether skill and harness gains transfer beyond the evaluated
        applications and platforms, and whether harness edits preserve intended behavior
        under unseen tasks, is not formally established.
    - line: Weakly supervised and verifiable-synthetic training
      what_it_solves: Reduces human annotation and scales computer-use policies through
        unannotated screenshots, curriculum grounding, verifiable task generation,
        and online RL.
      what_remains_open: The correctness and safety of generated task verifiers or
        reward signals beyond OSWorld/ScienceBoard-style environments remain open,
        as does robustness under distribution shift.
    - line: Uncertainty, observation control, and reliability formalization
      what_it_solves: Characterizes confidence under GUI grounding and formalizes
        dynamic-screen agents whose content changes between actions; exposes over-observation,
        under-observation, and selective uncertainty-transfer behavior.
      what_remains_open: Multi-step trajectory-level uncertainty, robust conformal
        coverage under interface/model shift, and intervention mechanisms for observation
        control are unresolved.
    consensus:
    - Evaluation is shifting from static or single-pass success toward executable
      environments, multi-checkpoint scoring, and efficiency/cost-aware metrics.
    - Agent capability can be improved without always changing model weights by altering
      the surrounding context such as skills, harness behavior, or data curriculum.
    - Verifiability and annotation cost are recurring bottlenecks; work uses deterministic
      rules, execution checks, conformal calibration, or synthesized verifiable tasks.
    - 'Current GUI agents still lack mature reliability properties: dynamic observation
      control, cross-model uncertainty transfer, and long-horizon safety evidence.'
    disagreements:
    - 'Intervention level differs: some approaches train or RL-tune policies with
      weak or synthetic supervision, while others freeze the backbone and edit skills
      or harness code.'
    - 'Evaluation targets differ: general desktop multi-app, dynamic short-video platforms,
      drag interactions, and single-step GUI grounding are measured separately, limiting
      direct comparison.'
    - 'Reusable knowledge representation differs: some retain visual figures in multimodal
      skills, while others use text-only skill files or executable harness edits.'
    - No shared reliability metric exists across fine-grained sub-goal scores, cost-accuracy,
      uncertainty ranking transfer, and conformal click regions.
    open_questions:
    - Can observation-control and uncertainty findings be fed back into training or
      harness loops to improve dynamic GUI agents rather than only diagnosing them?
    - Do verifiable rules or generated rewards remain valid proxies for task success
      outside the evaluated benchmark environments?
    - How do skill-library and harness improvements transfer across applications,
      platforms, and interaction modes such as drag and live-screen updates?
    - What evaluation would capture formal safety and reliability for multi-step GUI
      trajectories instead of single-step grounding or per-task success?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 可执行GUI基准与任务抽象
      解决的问题: 定义任务套件、交互空间（桌面 GUI/CLI、动态短视频、拖拽），以及区分通过/失败与子目标完成的细粒度评分或能力注释。
      尚未覆盖: 统一的多步、跨界面评测框架仍然缺失；动态屏幕、拖拽和不确定性覆盖分散，部分论文的局限性与工件证据报告不完整。
    - 路线: 冻结模型外部的技能与harness复用
      解决的问题: 在不重新训练骨干模型的情况下，通过多模态技能工件或基于截图与重复运行的证据驱动harness修改来改善GUI执行。
      尚未覆盖: 技能与harness增益能否迁移到已评测应用和平台之外，以及harness编辑在未见过任务下是否保持预期行为，尚未正式验证。
    - 路线: 弱监督与可验证合成训练
      解决的问题: 通过未标注截图、课程式grounding、可验证任务生成和在线RL，减少人工标注并扩展计算机使用策略。
      尚未覆盖: 生成任务验证器或奖励信号在 OSWorld/ScienceBoard 类环境之外的正确性与安全性仍开放，分布偏移下的鲁棒性也缺乏证据。
    - 路线: 不确定性、观察控制与可靠性形式化
      解决的问题: 刻画 GUI grounding 下的置信度，并形式化内容在动作间变化的动态屏幕代理；揭示过度观察、观察不足和选择性不确定性迁移。
      尚未覆盖: 多步轨迹级不确定性、接口/模型偏移下稳健的共形覆盖，以及观察控制干预机制尚未解决。
    共识:
    - 评测正从静态或单次成功转向可执行环境、多检查点评分以及效率/成本感知指标。
    - 智能体能力提升不一定都通过改变模型权重，也可通过改变技能、harness行为或数据课程等外部上下文实现。
    - 可验证性与标注成本是反复出现的瓶颈；相关工作采用确定性规则、执行检查、共形校准或合成可验证任务。
    - 当前GUI智能体在动态观察控制、跨模型不确定性迁移和长程安全证据方面仍不成熟。
    分歧:
    - 干预层级不同：部分方法用弱监督或合成监督训练或RL调优策略，部分方法冻结骨干模型并编辑技能或harness代码。
    - 评测对象不同：桌面多应用、动态短视频平台、拖拽交互和单步GUI grounding分别测量，结论难以直接比较。
    - 可复用知识表示不同：有些在多模态技能中保留视觉图形，有些使用纯文本技能文件或可执行harness编辑。
    - 尚无共享的可靠性指标；细粒度子目标分、成本-准确率、不确定性排序迁移和共形点击区域并存。
    开放问题:
    - 观察控制与不确定性发现能否反馈到训练或harness闭环中，从而改进动态GUI智能体，而不只是用于诊断？
    - 可验证规则或生成奖励在已评测基准环境之外是否仍是任务成功的有效代理？
    - 技能库与harness改进如何跨应用、平台和交互模式（如拖拽、动态屏幕）迁移？
    - 需要怎样的评测才能捕捉多步GUI轨迹的形式化安全与可靠性，而不只是单步grounding或单任务成功？
