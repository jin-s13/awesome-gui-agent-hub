    others change model decoding with LLaDA-UI, and others unify GUI and code actions
    such as OS-Helix.'
  - 'Trend evolution: Within the 2024-2026 frontier, the field is moving from static
    click-only tasks toward dynamic, video-guided, and drag-based interactions, with
    more fine-grained scoring, reusable skills, compiled workflows, and end-to-end
    RL training.'
