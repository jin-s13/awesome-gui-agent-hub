    - line: Dynamic and video-guided interface grounding
      what_it_solves: Handles screens that change between actions and uses task-aware
        keyframe extraction to support video-guided GUI decisions.
      what_remains_open: Evidence is limited to short-video and selected video question-answering
        tasks; observation control and generalization to other live interface types
        remain open.
    - line: Interaction primitive and security-sensitive task coverage
      what_it_solves: Extends evaluation beyond clicks to drag-based manipulation
        and sanitized SMS-to-webpage fraud detection without reputation shortcuts.
      what_remains_open: Drag-based artifacts have low visible reproducibility signals;
        fraud evaluation suppresses real-world URL/reputation cues, leaving deployment
        transfer unmeasured.
    - line: Agent augmentation with multimodal skills, replay programs, and visually
        grounded critics
      what_it_solves: Improves accuracy and repeated-task speed by retrieving multimodal
        skill artifacts, compiling successful trajectories into state-machine replays,
        and intercepting flawed actions with history-aware visual critique.
      what_remains_open: Transfer across applications, frameworks, and models is not
        established; several papers lack visible code, artifacts, and limitation details,
        so robustness and failure boundaries remain verification gaps.
    consensus:
    - Papers converge on treating GUI agents as multimodal systems that must ground
      actions in the current screen state and complete long-horizon tasks.
    - 'Evaluation is moving beyond success-only to finer signals: sub-goal completion,
      cost-accuracy/information efficiency, interaction-type coverage, and error interception.'
    - Benchmarks tend to use controllable environment-specific task suites and compare
