  related_work_outline:
  - 'Mainstream direction: The 2026 frontier is building more realistic GUI/OS automation
    benchmarks that move beyond static single-app success to real desktop mixed GUI/CLI
    tasks, dynamic living-screen interfaces, video-guided control, and uncertainty/risk
    evaluation.'
  - 'Shared research pattern: Works share task-level evaluation of multimodal agents
    in interactive environments with deterministic or rule-based scoring, multiple
    model/framework baselines, and diagnostic signals beyond aggregate accuracy such
    as sub-goal completion, cost-accuracy, and uncertainty ranking transfer.'
  - 'Key differences: Differences are mainly target setting (real desktop vs dynamic
    short-video vs video-guided vs single-step grounding), metric emphasis (Pass@1
    vs multi-checkpoint vs cost-accuracy vs calibration/conformal coverage), and improvement
    path (benchmark creation vs skill/harness/task-synthesis methods).'
  - 'Trend evolution: Within the available 2024-2026 frontier window, evaluation is
    moving from static task success toward dynamic observation-aware settings, mixed
    interaction modes, and compound metrics that capture efficiency, sub-goal quality,
    and risk.'
  - 'Open questions: How well do rankings and metrics transfer across OS versions,
    interface types, and closed-source models? Do diagnostic metrics align with user-valued
    outcomes? Can observation control be measured and improved? Are synthesized-task
    and harness gains stable?'
