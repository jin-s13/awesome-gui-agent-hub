      what_it_solves: Improving agent accuracy and efficiency by reusing successful
        execution traces (compiled state machines), augmenting with multimodal skill
        libraries, or providing history-aware visual critique.
      what_remains_open: Adaptability to UI changes, transfer of skills across different
