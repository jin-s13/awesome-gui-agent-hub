    研究路线矩阵:
    - 路线: 端到端可训练智能体框架与部署栈
      解决的问题: 将多模态模型转化为可运行的计算机/网页交互智能体，并提供训练、回滚和评测流水线。
      尚未覆盖: 跨不同框架、硬件、真实网站和外部环境的稳定性；策略优化后的错误恢复仍较弱。
    - 路线: 统一动作空间与架构设计
      解决的问题: 在单一智能体策略中表示点击、输入和代码执行，或用扩散式生成统一多模态GUI策略。
      尚未覆盖: 跨平台迁移和对复杂动作载荷的推理；泛化证据仍限于已报告基准和操作系统。
    - 路线: 弱监督与数据高效的智能体学习
      解决的问题: 通过大规模未标注截图学习视觉定位，再用少量高质量数据或强化学习校准，降低标注成本。
      尚未覆盖: 极少量高质量数据下的校准能力，以及向复杂动态工作流的迁移。
    - 路线: 可复用技能与执行级记忆
      解决的问题: 将已验证GUI轨迹转换为可调用的多模态技能或记忆，以降低token和执行时间成本。
      尚未覆盖: 仅当运行时状态匹配确定性前置条件时可用；歧义或不兼容步骤仍需重新规划。
    - 路线: 步骤级诊断评测与状态转换理解
      解决的问题: 检验模型是否理解GUI状态转换、来源跟踪和上下文感知控制，补充端到端基准的缺失。
      尚未覆盖: 离线评测无法反映实时异步动态；Linux桌面和有限动作词汇限制泛化。
    共识:
    - 研究正在从孤立UI定位转向环境可验证的长程任务执行。
    - 视觉状态被视作识别界面元素和验证工作流的关键证据。
    - 监督微调常作为热启动，在线强化学习或可验证奖励被用于提升长程成功率。
    - 评测对象正从单帧定位扩展到轨迹级和最终任务可靠性，但诊断层仍不成熟。
    分歧:
    - 监督信号类型：未标注截图的弱监督、混合可验证监督与真实在线强化学习之间存在差异。
    - 动作表示：GUI指针/键盘操作、GUI加代码执行或检索式可回放技能之间存在选择差异。
    - 生成范式：一种路线探索块级扩散，另一类工作更关注强化学习或数据效率而非改变生成机制。
    - 复用策略：显式的记忆/技能工件检索与端到端策略学习之间没有统一。
    - 评测层级：端到端任务成功与离线步骤级转换理解并存，后者可能无法捕捉真实动态。
    开放问题:
    - 为什么强化学习训练后错误恢复仍然较弱，哪些训练或奖励设计能改善这一问题？
    - 框架设计和多进程复杂度在多大程度上影响智能体可训练性与最终能力？
    - 执行级回放记忆能否在确定性前置条件之外泛化，同时保持token和时间节省？
    - 离线步骤级转换基准能否迁移到真实异步GUI环境和其他操作系统？
    - 未标注截图的弱监督在何种规模下会遇到瓶颈，必须引入高质量可验证或标注数据？
