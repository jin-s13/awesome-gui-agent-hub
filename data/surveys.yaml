    - 路线: 可复用执行记忆与技能库
      解决的问题: 通过可调用技能或可重放轨迹保留多模态工作流知识，降低重复规划成本并缩短执行时间。
      尚未覆盖: 重放限于确定性适用条件并拒绝模糊或不兼容步骤；对已验证轨迹和参数控制任务之外的覆盖尚不充分。
    - 路线: 面向恢复与个性化的诊断评测基准
      解决的问题: 衡量智能体是否恢复到过渡一致状态，以及移动GUI智能体是否在任务阶段中遵循用户偏好。
      尚未覆盖: 现有恢复评测存在高成本或回滚限制；个性化诊断覆盖显式画像和行为日志，更广泛部署环境仍待验证。
    共识:
    - GUI/计算机使用能力被视为系统属性，而不仅是模型准确率；任务完成、token成本、执行时间、恢复和偏好遵循均作为证据出现。
    - 训练或适应越来越多地使用可验证环境结果、弱截图信号、强化学习或验证轨迹，而非只依赖静态演示。
    - 智能体行为被分解为阶段或动作，并通过阶段/动作级诊断定位能力和可靠性瓶颈。
    - 多模态视觉grounding仍然核心：保留图形或视觉证据并定位UI元素被视为计算机使用工作流的重要组成。
    分歧:
    - 一类工作通过训练或强化学习修改智能体策略，另一类保持策略固定并添加外部记忆、技能检索或重放脚手架。
    - 部分工作以OSWorld、WebVoyager或移动任务上的最终成功为目标；其他工作以部署成本、恢复一致性或个性化失败作为主要结果。
    - 交互模式不同：有些系统在统一动作空间中结合GUI操作与代码执行，有些则围绕纯GUI策略使用工具调用或可重放动作序列。
    - 监督信号形式不同：弱截图课程、工件验证轨迹、人工撰写的多模态技能和在线可验证回滚对可用数据假设不同。
    开放问题:
    - 当环境重置不可行、动作重放昂贵或回滚仅限Web设置时，如何评测恢复？
    - 在模糊、非确定性GUI状态下，何种条件决定端到端训练或外部记忆/技能框架更有效？
    - 弱监督或强化学习训练在桌面、移动、网页和专有框架环境中的迁移效果如何，尤其在框架设计影响可训练性时？
    - 若干系统论文在证据包中缺少明确局限或可复现细节；结果和工件的独立验证仍是缺口。
