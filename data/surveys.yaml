    - 评测越来越强调特定部署场景下的边界条件，如安全、不确定性、欺诈和长程任务，单一成功率不足以反映能力。
    分歧:
    - 优化目标不同：有的优化冻结策略周围的执行框架，有的对策略本身做在线强化学习，有的把自主评估器反馈作为奖励信号。
