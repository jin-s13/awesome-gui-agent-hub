  literature_review:
    line_of_work_matrix:
    - line: Realistic GUI/OS benchmark and interaction task design
      what_it_solves: Creates environment-faithful task distributions for desktop,
        dynamic short-video, drag-based, and video-guided computer-use settings so
        capabilities can be compared beyond narrow click/type benchmarks.
      what_remains_open: Coverage is still environment- or action-specific; cross-OS,
        cross-app, cross-interface, and longer-horizon real-world generalization is
        not established.
    - line: Agent capability improvement via skills, supervision, and task synthesis
      what_it_solves: Addresses grounding and policy learning gaps through multimodal
        skill artifacts, weakly supervised screenshots, verifiable RL task generation,
        and task-aware keyframe selection.
      what_remains_open: Evidence is concentrated on selected benchmarks; transfer
        to unseen applications, efficiency under different data/compute budgets, and
        robustness over dynamic interfaces remain unreported or unverified.
    - line: Fine-grained metrics, diagnostics, and uncertainty stress-testing
      what_it_solves: Moves beyond aggregate success to sub-goal completion, cost-accuracy
        information efficiency, and post-hoc uncertainty/conformal safety for GUI
        grounding.
      what_remains_open: Proxy metrics are not yet aligned with user decision utility;
        uncertainty ranking transfer across model tiers and interfaces is weak; multi-step
        trajectory uncertainty is not covered.
    - line: Cross-model baselines and reproducibility artifacts
      what_it_solves: Makes results auditable by comparing multiple frontier frameworks/models
        and, in some cases, releasing deterministic rule-based scoring or analysis
        artifacts.
      what_remains_open: Several papers lack visible limitations or complete code/dataset/repository
        signals, so stability across implementations, compute budgets, and benchmark
        versions remains uncertain.
    consensus:
    - Realistic task distributions expose gaps that coarse click/type evaluations
      miss.
    - Fine-grained metrics such as sub-goal completion, cost-accuracy, and uncertainty
      add diagnostic value beyond aggregate success rates.
    - Frontier VLM agents still struggle with dynamic observation, multi-step execution,
      and interaction types beyond simple clicks.
    - Scalable task synthesis, weak supervision, and multimodal skill retrieval are
      promising directions for reducing annotation or improving grounding.
    - Benchmarking requires controlled environments and deterministic or reproducible
      scoring where possible.
    disagreements:
    - 'Interaction space: drag-only, GUI+CLI desktop, dynamic short-video, and video-guided
      tasks emphasize different capability boundaries and are not directly comparable.'
    - 'Evaluation target: single-step GUI grounding, multi-step task completion, and
      efficiency-aware task completion use different success definitions.'
    - 'Supervision and adaptation: weak supervision from unannotated screenshots,
      online RL with verifiable synthesized tasks, multimodal skill libraries, and
      keyframe extraction rely on different data and compute assumptions.'
    - 'Metric priority: Pass@1, sub-goal completion, cost-accuracy, and conformal
      uncertainty reflect different views of reliability and usefulness.'
    - 'Reproducibility posture: some works provide rule-based scoring or public uncertainty
      records while others have missing limitation or artifact signals, making cross-paper
      auditability uneven.'
    open_questions:
    - Do fine-grained benchmark metrics transfer across desktop, web, mobile, and
      dynamic short-video environments without target-specific recalibration?
    - Why do uncertainty ranking methods transfer well within a model family but poorly
      across model tiers and observable interfaces?
    - How should agents learn or regulate observation in dynamic interfaces to avoid
      over- and under-observation?
    - Do skill retrieval, weak supervision, and verifiable RL gains persist on unseen
      applications or operating systems beyond the reported benchmarks?
    - Which minimum dataset, code, metric, baseline, and limitation artifacts are
      needed to verify benchmark conclusions when several packet entries lack those
      signals?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 真实GUI/OS基准与交互任务设计
      解决的问题: 为桌面、动态短视频、拖拽式和视频引导计算机使用场景建立更贴近环境的任务分布，使能力比较不局限于点击/输入类基准。
      尚未覆盖: 覆盖仍偏环境或动作类型；跨OS、跨应用、跨界面和更长时程真实场景泛化尚未被证据确认。
    - 路线: 通过技能、监督和任务合成提升智能体能力
      解决的问题: 用多模态技能工件、未标注截图弱监督、可验证RL任务生成和任务感知关键帧选择缓解视觉定位与策略学习短板。
      尚未覆盖: 证据集中在选定基准；未见应用泛化、不同数据/算力预算下的效率以及动态界面鲁棒性的充分验证。
    - 路线: 细粒度指标、诊断与不确定性压力测试
      解决的问题: 在总体成功率之外提供子目标完成、成本-准确性信息效率和GUI定位的后验不确定性/共形安全诊断。
      尚未覆盖: 代理指标与用户决策效用尚未对齐；跨模型层级和接口的UQ迁移较弱；多步轨迹不确定性未被覆盖。
    - 路线: 跨模型基线与复现工件规范
      解决的问题: 通过多框架/模型对比以及在部分工作中发布确定性评分或分析工件，使结果更可审计。
      尚未覆盖: 若干论文缺少可见局限性或完整代码/数据集/仓库信号，跨实现、算力预算和基准版本的结论稳定性仍不确定。
    共识:
    - 真实任务分布能暴露粗粒度点击/输入评测遗漏的缺陷。
    - 子目标完成、成本-准确性、不确定性等细粒度指标提供总分之外的诊断价值。
    - 前沿VLM智能体在动态观察、多步执行和非点击交互方面仍存在明显不足。
