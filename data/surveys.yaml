  related_work_outline:
  - 'Mainstream direction: Survey-type works on GUI agents focus on systematic benchmarking
    of capabilities and safety, paired with scalable training methods that leverage
    online RL and autonomous evaluation to improve long-horizon task completion.'
  - 'Shared research pattern: All papers rely on VLM-based agents, evaluate via task
    success rates on curated benchmarks, and aim to extend robustness beyond single-step
    grounding through better context, training, or evaluation protocols.'
  - 'Key differences: Works diverge in the evaluation dimension (single-step UQ, multi-step
    browser safety, fraud detection), the training paradigm (offline SFT, online RL
    with noisy rewards, or verification-based RL), and the treatment of safety (ignored,
    benchmarked, or shown to be domain-conditioned).'
  - 'Trend evolution: The 2024–2026 frontier shows a shift from isolated static benchmarks
    to multi-dimensional evaluation suites that combine uncertainty, safety, and domain-specific
    risks, and a move toward autonomous task synthesis and reward generation.'
  - 'Open questions: How to integrate uncertainty estimates and safety constraints
    into online training loops, how to guarantee consistent cross-domain generalization,
    and how to validate that automatically generated tutorials or tasks remain safe
    and correct.'
  related_work_outline_zh:
  - 主流方向：面向GUI智能体的调研类工作聚焦于系统性能力与安全基准，并配合可扩展的在线RL和自主评估训练方法，以提升长时程任务完成率。
  - 研究共性：所有工作均基于VLM智能体，通过定制基准上的任务成功率来评估，并通过改进上下文、训练或评估协议，将鲁棒性从单步扩展至多步。
  - 关键差异：工作的差异体现在评测维度（单步不确定性、多步浏览器安全、欺诈检测）、训练范式（离线SFT、带噪声奖励的在线RL、基于可验证性的RL）以及对安全的处理（忽略、专设基准测试、或揭示出领域条件性安全）。
  - 趋势演进：2024至2026年的前沿呈现出从孤立静态基准向融合不确定性、安全性和领域特定风险的多维度评测套件转变，并趋向于自动任务合成与奖励生成。
  - 开放问题：如何将不确定性估计与安全约束集成到在线训练环中，如何保证跨领域一致性泛化，以及如何验证自动生成的教程或任务始终安全且正确。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark-driven capability diagnosis and safety profiling
      what_it_solves: Systematically exposing failure modes of GUI agents under uncertainty,
        adversarial prompts, sanctioned shortcuts, and domain-specific risks, thereby
        mapping the reliability landscape.
      what_remains_open: How diagnostic signals translate into actionable training
        improvements without overfitting to specific benchmarks, and whether safety
        profiles generalize across domains.
    - line: Scalable online training with autonomous or verifiable rewards
      what_it_solves: Improving agent success rates on long-horizon tasks via RL and
        efficient data/task synthesis, reducing reliance on manual reward engineering.
      what_remains_open: Robustness of autonomous evaluators and noise correction,
        cross-benchmark generalization, and potential safety degradation during online
        fine-tuning.
    - line: Context-aware memory and planning for long-horizon tasks
      what_it_solves: Maintaining critical information across many steps to avoid
        context decay and improve task completion without manual prompt compaction.
      what_remains_open: Integration with safety constraints and handling of dynamic
        UI changes beyond the training distribution.
    - line: Experience-driven knowledge and tutorial generation
      what_it_solves: Transforming human demonstrations into structured multimodal
        tutorials that bootstrap both human learning and agent policy planning.
      what_remains_open: Adaptation to unseen software interfaces and validation of
        tutorial correctness and safety in mission-critical domains.
    consensus:
    - All approaches use vision-language models to perceive screens and interact with
      GUIs, and evaluate on task-completion metrics.
    - Robustness beyond single-step grounding is a shared concern, addressed through
      better context, training, or evaluation.
    - Automated evaluation, whether via VLM judges or verifiable task scripts, is
      critical for scaling training and benchmarking.
    disagreements:
    - 'The granularity of evaluation differs: some focus on single-step uncertainty
      or grounding accuracy, while others target multi-step safety and task success.'
    - 'Training paradigm varies: offline supervised fine-tuning vs. online RL with
      noisy autonomous rewards vs. online RL with verifiable task synthesis.'
    - 'Safety is treated inconsistently: some works ignore it, others benchmark it
      in isolation, and one reveals that safety hardening is domain-conditioned and
      does not transfer across browser and coding tasks.'
    - 'The role of context management differs: some methods passively accumulate history,
      while one proposes first-class context actions to proactively maintain compact
      memory.'
    open_questions:
    - Can uncertainty quantification and conformal prediction be used to gate unsafe
      actions during online RL without breaking the training loop?
    - How do domain-conditioned safety properties change when agents are jointly fine-tuned
      on browser and coding tasks?
    - What is the minimal set of context fields needed to preserve long-horizon task
      success across diverse mobile and desktop environments?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准驱动的能力诊断与安全分析
      解决的问题: 系统性地暴露GUI智能体在不确定性、对抗提示、信誉捷径和领域特定风险下的失效模式，从而绘制可靠性全貌。
      尚未覆盖: 诊断信号如何转化为可操作的训练改进而不对特定基准过拟合，以及安全特性是否跨领域泛化。
    - 路线: 可扩展的在线训练与自主/可验证奖励
      解决的问题: 通过RL和高效数据/任务合成提升长任务成功率，减少对手工奖励工程的依赖。
      尚未覆盖: 自主评估器和噪声校正的鲁棒性，跨基准泛化，以及在线微调期间的安全退化。
    - 路线: 面向长时程任务的上下文感知记忆与规划
      解决的问题: 在多个步骤中维护关键信息，避免上下文衰减，无需人工压缩提示即可提升任务完成。
      尚未覆盖: 与安全约束的集成，以及对训练分布之外动态UI变化的处理。
    - 路线: 经验驱动的知识与教程生成
      解决的问题: 将人类演示转化为结构化多模态教程，同时辅助人类学习和智能体策略规划。
      尚未覆盖: 对未见软件界面的适应，以及在关键任务领域教程正确性与安全性的验证。
    共识:
    - 所有方法均使用视觉-语言模型感知屏幕并操作GUI，以任务完成率等指标进行评估。
    - 超越单步接地的鲁棒性是共同关切，通过更好的上下文、训练或评测协议来解决。
    - 自动化评估（无论是通过VLM评委还是可验证任务脚本）对扩展训练和基准测试至关重要。
    分歧:
    - 评估粒度不同：部分工作聚焦单步不确定性或接地精度，另一些则针对多步安全与任务成功率。
    - 训练范式不同：离线监督微调 vs. 带噪声自主奖励的在线RL vs. 基于可验证任务合成的在线RL。
    - 安全处理不一致：部分工作忽略安全，部分单独评测安全，一项工作揭示安全加固是领域条件的，无法在浏览器和编码任务间迁移。
    - 上下文管理角色不同：一些方法被动累积历史，而一项工作提出将上下文管理作为第一类动作以主动维护紧凑记忆。
    开放问题:
    - 能否将不确定性估计和共形预测用于在线RL中拦截不安全动作，而不破坏训练回路？
    - 当智能体在浏览器和编码任务上联合微调时，领域条件安全特性如何变化？
    - 在多样化的移动和桌面环境中，维持长时程任务成功所需的最少上下文字段集合是什么？
