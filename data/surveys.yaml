  related_work_outline:
  - 'Mainstream direction: Benchmarking and improving GUI agents across diverse tasks
    (video-guided, mobile, web, coding, safety) while shifting from single-step grounding
    to long-horizon interactive evaluation.'
  - 'Shared research pattern: Most works construct a new dataset or benchmark to reveal
    a specific failure mode of current agents, then propose a method (keyframe extraction,
    RL fine-tuning, context management, uncertainty quantification) that addresses
    that mode, often evaluated on both in-domain and out-of-distribution benchmarks.'
  - 'Key differences: Evaluation settings differ in horizon (single-step vs. multi-step),
    interaction modality (browser vs. mobile vs. desktop), reward signal (hand-crafted,
    autonomous evaluator, verifiable task synthesis), and safety focus (prompt injection
    vs. fraud detection).'
  - 'Trend evolution: Within the 2024–2026 frontier, the field is moving from static,
    single-step GUI grounding benchmarks toward dynamic, long-horizon, online RL-based
    training, with growing emphasis on safety, uncertainty, and reproducibility audits.'
  - 'Open questions: How to obtain reliable reward signals without manual labeling,
    how to transfer safety and uncertainty calibration across domains and model tiers,
    and how to validate that benchmark-driven improvements translate to real-world
    agent reliability.'
  related_work_outline_zh:
  - 主流方向：通过多样化任务（视频引导、移动端、网页、编程、安全）对GUI智能体进行基准测试与改进，同时从单步接地转向长时域交互评估。
  - 研究共性：多数工作构建新数据集或基准以揭示当前智能体的特定失效模式，然后提出相应方法（关键帧提取、RL微调、上下文管理、不确定性量化）加以解决，并常在域内和分布外基准上评估。
  - 关键差异：评估设置在时域（单步 vs. 多步）、交互模态（浏览器 vs. 移动端 vs. 桌面）、奖励信号（手工设计、自主评估器、可验证任务合成）以及安全关注点（提示注入
    vs. 欺诈检测）上存在差异。
  - 趋势演进：在2024–2026年前沿内，该领域正从静态的单步GUI接地基准转向动态、长时域、基于在线RL的训练，并日益重视安全性、不确定性以及可复现性审计。
  - 开放问题：如何在无人工标注下获得可靠奖励信号，如何跨领域和模型层级迁移安全与不确定性校准，以及如何验证基准驱动的改进能转化为真实世界智能体的可靠性。
  literature_review:
    line_of_work_matrix:
    - line: Benchmarking for specific GUI agent capabilities
      what_it_solves: Reveals failure modes of current agents in tasks such as video-guided
        interaction, long-horizon mobile tasks, fraud detection without reputation
        shortcuts, and safety under prompt injection.
      what_remains_open: Benchmarks often suppress real-world cues (e.g., URLs) or
        are limited to single-step evaluation; generalizability to unseen domains
        and multi-step trajectories remains unverified.
    - line: Training and optimization with scalable rewards
      what_it_solves: Improves agent success rates by using online RL with verifiable
        task synthesis, autonomous vision-language evaluators, or noise-corrected
        reward signals, reducing dependence on manual labeling.
      what_remains_open: Autonomous evaluators are imperfect and introduce noise;
        reward modeling and correction across diverse tasks and interfaces is not
        yet robust.
    - line: Context and memory management for long-horizon tasks
      what_it_solves: Enables agents to maintain compact, structured context (e.g.,
        folded history, key facts) through proactive context management actions, preventing
        performance degradation over long trajectories.
      what_remains_open: Scaling to extremely long horizons and dynamic task switching
        while preserving critical context without exceeding context window limits.
    - line: Uncertainty quantification and safety calibration
      what_it_solves: Provides post-hoc uncertainty estimates to assess grounding
        reliability, and audits safety against adversarial inputs, revealing domain-conditioned
        safety behaviors.
      what_remains_open: Uncertainty rankings transfer poorly across model classes
        and interfaces; safety hardening is domain-specific and does not generalize
        beyond the audited surface.
    consensus:
    - GUI agents require more realistic, multi-step, long-horizon evaluation to replace
      single-step grounding benchmarks.
    - Online reinforcement learning and autonomous evaluation are promising directions
      to scale training without prohibitive human labeling.
    - Safety and uncertainty awareness are becoming critical components of agent evaluation,
      not afterthoughts.
    - Performance on one benchmark or domain does not reliably transfer to others,
      highlighting the need for cross-domain validation.
    disagreements:
    - Whether to model reward signals as clean binary outcomes or explicitly account
      for evaluator noise and correct it.
    - Whether safety should be evaluated by hand-crafted attacks or RL-optimized injection
      strings, and whether audit results are reproducible across model versions.
    - Whether context management should be an explicit action space or passively handled
      through architecture, and how much historical detail is necessary versus distracting.
    - Whether to use real-world reputation cues (URLs, hosts) in fraud detection benchmarks
      or artificially suppress them to test pure visual reasoning.
    open_questions:
    - How can autonomous evaluators be calibrated to provide reliable reward signals
      across diverse GUI environments without task-specific tuning?
    - What mechanisms enable uncertainty or safety calibration to transfer from open-weight
      to closed-source models and across interaction modalities (browser vs. mobile)?
    - How can long-horizon context management be made robust to irrelevant or adversarial
      history without increasing inference cost?
    - To what extent do benchmark-driven improvements in GUI grounding translate to
      more reliable end-to-end agent behavior in real-world deployments?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 面向特定GUI智能体能力的基准测试
      解决的问题: 揭示当前智能体在视频引导交互、长时域移动任务、无信誉捷径的欺诈检测以及提示注入安全等场景下的失效模式。
      尚未覆盖: 基准常人为抑制真实线索（如URL）或仅限于单步评估；对未见领域和多步轨迹的泛化性尚未验证。
    - 路线: 基于可扩展奖励的训练与优化
      解决的问题: 通过可验证任务合成的在线RL、自主视觉-语言评估器或噪声校正奖励信号提升智能体成功率，减少人工标注依赖。
      尚未覆盖: 自主评估器不完美并引入噪声；跨任务和接口的奖励建模与校正尚未稳健。
    - 路线: 长时域任务的上下文与记忆管理
      解决的问题: 通过主动上下文管理动作维护紧凑的结构化上下文（如折叠历史、关键事实），防止长轨迹中性能衰退。
      尚未覆盖: 在极端长时域和动态任务切换下，如何在不超出上下文窗口的前提下保留关键信息。
    - 路线: 不确定性量化与安全校准
      解决的问题: 提供后验不确定性估计以评估接地可靠性，并审计对抗输入下的安全性，揭示领域条件安全行为。
      尚未覆盖: 不确定性排名跨模型类别和接口迁移性差；安全加固是领域特定的，不能泛化到审计表面之外。
    共识:
    - GUI智能体需要更真实、多步、长时域的评估来替代单步接地基准。
    - 在线强化学习和自主评估是扩展训练规模、减少人工标注的有前景方向。
    - 安全与不确定性意识正成为智能体评估的关键组成部分，而非事后补充。
    - 单一基准或领域的性能无法可靠迁移至其他场景，凸显跨领域验证的必要性。
    分歧:
    - 奖励信号应建模为干净二元结果，还是显式考虑评估器噪声并进行校正。
    - 安全评估应使用手工制作攻击还是RL优化注入字符串，以及审计结果在不同模型版本间是否可复现。
    - 上下文管理应作为显式动作空间，还是通过架构被动处理，以及保留多少历史细节是必要而非干扰的。
    - 欺诈检测基准应使用真实世界的信誉线索（URL、主机），还是人为抑制以测试纯视觉推理能力。
    开放问题:
    - 如何校准自主评估器，使其在未经任务特定调优的情况下，为多样化GUI环境提供可靠奖励信号？
    - 何种机制能使不确定性或安全校准从开源模型迁移到闭源模型，并跨越交互模态（浏览器 vs. 移动端）？
    - 长时域上下文管理如何在不增加推理成本的前提下，抵御无关或对抗性历史的干扰？
    - 基准驱动的GUI接地改进在多大程度上能转化为现实部署中端到端智能体行为的可靠性？
