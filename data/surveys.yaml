    - 路线: Harness 原生 RL 训练与统一动作编排
      解决的问题: 在复杂真实推理 harness 中训练智能体，并将 GUI 交互与代码执行统一到同一动作空间。
      尚未覆盖: 错误恢复仍弱，不同 harness 可训练性差异大，独立跨平台复现证据不完整。
    - 路线: 行为诊断与评测框架
      解决的问题: 形式化并测量恢复一致性与个性化时机等细粒度行为，而非仅看聚合任务成功率。
      尚未覆盖: 框架偏诊断而非改进；干预收益有限，且设置多为移动端或受控环境。
    共识:
    - 研究将智能体置于可执行 GUI 或计算机使用环境中评估，而非仅作为文本规划器。
