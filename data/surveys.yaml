    和 Argus。
  - 研究共性：将智能体行为锚定到截图或执行轨迹，把任务分解为子目标/检查点，并在真实或接近真实的环境中评测；性能提升常来自外部上下文、数据课程或可验证监督，而不仅是模型权重。
  - 关键差异：干预层级不同，包括训练/RL调优、冻结骨干的技能复用和harness编辑；评测对象不同，涵盖桌面 GUI/CLI、动态短视频、拖拽和单步 grounding；可靠性证据采用细粒度子目标分、成本-准确率、不确定性排序和共形区域等不同指标。
