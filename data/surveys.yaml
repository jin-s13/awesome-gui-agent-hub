  related_work_outline:
  - 'Mainstream direction: building and evaluating vision-language GUI agents that
    ground screen or video context into executable actions, with benchmarks expanding
    from static clicks to drag, dynamic, video-guided, multi-app, and long-horizon
    settings.'
  - 'Shared research pattern: papers combine a new benchmark/dataset or training strategy
    with model evaluation, measuring accuracy, step completion, or cost-accuracy and
    reporting that improved grounding, context management, or training data raises
    agent performance.'
  - 'Key differences: evaluation targets range from single-step grounding to long-horizon
    task completion; interaction modes include click, drag, GUI+CLI, and dynamic observation;
    training signals include weak supervision, annotated trajectories, and online
    RL with verifiable synthesized tasks.'
  - 'Trend evolution: within the 2024–2026 evidence, the frontier is moving from static
    GUI grounding and click-focused benchmarks toward real desktop, dynamic interfaces,
    verifiable RL task synthesis, weak supervision from unlabeled screenshots, and
    context-aware long-horizon agents.'
  - 'Open questions: whether improvements transfer beyond reported benchmarks, whether
    gains come from the model or surrounding components such as skill libraries and
    planners, how to quantify uncertainty for multi-step trajectories, and how to
    isolate method contributions given missing limitation or ablation evidence.'
  related_work_outline_zh:
  - 主流方向：构建并评测以视觉语言模型为核心的GUI智能体，将屏幕或视频上下文落地为可执行动作，基准从静态点击扩展到拖拽、动态、视频引导、多应用和长时域设置。
  - 研究共性：论文通常将新基准/数据集或训练策略与模型评测结合，衡量准确率、步骤完成或成本-准确率，并报告更好的接地、上下文管理或训练数据能提升智能体表现。
  - 关键差异：评测目标从单步接地到长时域任务完成不等；交互方式包括点击、拖拽、GUI+CLI和动态观察；训练信号包括弱监督、标注轨迹和带可验证任务合成的在线RL。
  - 趋势演进：在2024–2026证据内，前沿正从静态GUI接地和点击聚焦基准，转向真实桌面、动态界面、可验证RL任务合成、无标注截图弱监督和上下文感知长时域智能体。
  - 开放问题：改进是否迁移到报告基准之外；收益来自模型还是技能库、规划器等周边组件；如何对多步轨迹做不确定性量化；在缺少局限或消融证据时如何隔离方法贡献。
  literature_review:
    line_of_work_matrix:
    - line: Screen grounding and interaction-space benchmarks
      what_it_solves: Expands actionable GUI evaluation beyond static click tasks
        to drag, dynamic short-video, macOS GUI+CLI, and video-guided interactions.
      what_remains_open: Generalization outside the reported platform or interaction
        type; observation control for dynamic content remains unsolved.
    - line: Training and data-scaling methods
      what_it_solves: Reduces annotation dependence via weak supervision from unannotated
        screenshots, or scales online RL with verifiable synthesized tasks.
      what_remains_open: Whether reported gains are attributable to the learning algorithm,
        task-synthesis pipeline, sampling strategy, or baseline implementation choices
        is not isolated.
    - line: Long-horizon context and planning methods
      what_it_solves: Maintains useful context over long mobile GUI trajectories by
        treating context management as first-class policy actions and using compact
        structured context fields.
      what_remains_open: Cross-benchmark evidence is narrow; it is unclear whether
        context-management actions transfer beyond the trained benchmark family.
    - line: Uncertainty and evaluation-protocol methods
      what_it_solves: Separates model ranking from fine-grained step completion and
        quantifies grounding confidence via post-hoc uncertainty methods for safer
        action prediction.
      what_remains_open: Current uncertainty benchmarks stop at single-step grounding;
        multi-step trajectory risk and weak cross-model/cross-interface transfer are
        not covered.
    consensus:
    - 'GUI agents are consistently framed as vision-language action grounding: the
      model observes a screen or video context and outputs executable interface actions.'
    - Evaluation is moving toward richer interaction coverage and finer scoring, including
      sub-goal completion, cost-accuracy, drag interactions, dynamic content, and
      multi-app GUI+CLI tasks.
    - Training innovations aim to lower human annotation cost or increase task coverage
      through weak supervision, curriculum learning, and verifiable online RL.
    - Reported improvements usually depend on multiple components, so separation of
      model, policy, data, and evaluation effects remains an evidence gap.
    disagreements:
    - Single-step executable grounding is treated as a proxy for safe computer use
      in uncertainty work, while other work evaluates long-horizon task success, leading
      to different definitions of agent capability.
    - Several benchmarks assume static screens or click/drag interfaces, whereas others
      target dynamic living-screen content that changes between actions.
    - 'Supervision strategy varies: weakly supervised visual grounding from unlabeled
      screenshots, SFT on annotated trajectories, and online RL with synthesized verifiable
      tasks.'
    - 'Context handling varies: passive history accumulation is replaced by proactive
      context management in some agents, while dynamic-interface work focuses on observation
      control rather than memory policy.'
    - Uncertainty transfer is reported stable within a model family but weak across
      open/closed model tiers, so calibration requirements differ by deployment setting.
    open_questions:
    - What factors make an agent trained or evaluated on one interaction type transfer
      to drag, dynamic, multi-app, or out-of-distribution mobile settings?
    - How much of the gain in scaled computer-use or desktop benchmarks comes from
      the learned policy versus surrounding skill libraries, task synthesis, or sampling
      strategies?
    - Can observation-control behavior be learned and evaluated beyond short-video
      platforms to reduce over- and under-observation?
    - How should uncertainty quantification extend from single-step grounding to long-horizon
      GUI trajectories and closed-source deployments where internal states are unavailable?
    - What minimum ablation and reproducibility evidence is needed to isolate method
      contribution when limitation fields are missing?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 屏幕接地与交互空间基准
      解决的问题: 将可执行的GUI评测从静态点击扩展到拖拽、动态短视频、macOS GUI+CLI以及视频引导交互。
      尚未覆盖: 超出所报告平台或交互类型之外的泛化；动态内容下的观察控制仍未解决。
    - 路线: 训练与数据规模化方法
      解决的问题: 通过无标注截图弱监督或带可验证任务合成的在线RL，降低人工标注依赖并扩大任务覆盖。
      尚未覆盖: 报告增益是否来自学习算法、任务合成管道、采样策略或基线实现选择尚不明确。
    - 路线: 长时域上下文与规划方法
      解决的问题: 在长时域移动GUI轨迹中，通过将上下文管理作为策略动作并采用结构化字段来保持关键信息。
      尚未覆盖: 跨基准证据仍然较窄；上下文管理动作是否能迁移到已训练基准族之外尚未确证。
    - 路线: 不确定性与评测协议方法
      解决的问题: 将模型排名与细粒度步骤完成指标分开，并通过后验不确定性方法量化接地置信度以支持更安全的动作预测。
      尚未覆盖: 现有不确定性基准止步于单步接地；多步轨迹风险和跨模型/跨接口弱迁移未覆盖。
    共识:
    - GUI智能体被一致地框架化为视觉语言动作接地：模型观察屏幕或视频上下文并输出可执行界面动作。
    - 评测正向更丰富的交互覆盖和更细粒度评分演进，包括子目标完成、成本-准确率、拖拽、动态内容和多应用GUI+CLI任务。
    - 训练创新旨在通过弱监督、课程学习和可验证在线RL降低人工标注成本或增加任务覆盖。
    - 报告的提升通常依赖多个组件，因此模型、策略、数据和评测效应的分离仍是证据缺口。
    分歧:
    - 单步可执行接地在不确定性工作中被作为安全计算机使用的代理，而其他工作评测长时域任务成功，导致对智能体能力的定义不同。
    - 若干基准假设静态屏幕或点击/拖拽接口，另有工作关注动作之间发生变化的动态屏幕内容。
    - 监督策略存在差异：来自无标注截图的弱监督视觉接地、标注轨迹SFT，以及带可验证任务合成的在线RL。
    - 上下文处理方式不同：一些智能体将被动历史积累替换为主动上下文管理，而动态界面工作关注观察控制而非记忆策略。
    - 不确定性迁移在同一模型家族内较稳定，但在开闭源模型层级间较弱，因此部署环境不同会带来不同校准需求。
    开放问题:
    - 在某一交互类型上训练或评测的智能体，有哪些因素使其能迁移到拖拽、动态、多应用或分布外移动场景？
    - 在规模化计算机使用或桌面基准中，增益有多少来自学习到的策略，多少来自技能库、任务合成或采样策略等周边系统？
    - 观察控制行为能否在短视频平台之外被学习和评测，以减少过度观察与观察不足？
    - 不确定性量化如何从单步接地扩展到长时域GUI轨迹以及内部状态不可访问的闭源部署？
    - 当局限性字段缺失时，需要哪些最低限度的消融和可复现证据来隔离方法贡献？
