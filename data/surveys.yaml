      尚未覆盖: 技能库的跨应用迁移性以及主动上下文管理在超大状态空间下的可扩展性尚未得到验证。
    - 路线: 可扩展且数据高效的GUI代理训练
      解决的问题: 利用海量未标注截图、可验证的合成任务生成和高效采样策略的在线RL，减少对昂贵人工标注的依赖。
      尚未覆盖: 合成/弱监督训练任务与真实用户任务之间的分布匹配并无保证，且训练过程中未经验证交互的安全影响尚未被探索。
    - 路线: GUI定位的不确定性量化与安全框架
      解决的问题: 为动作预测提供后验置信度评分，通过共形预测区域实现风险感知决策和空间安全。
      尚未覆盖: 当前UQ方法仅在单步grounding上评估；其在多步代理轨迹和闭环人机协作中的校准与有效性仍未得到验证。
    共识:
    - 当前代理在动态界面和长时域任务上表现不佳，原因在于观察控制与上下文管理薄弱，即使单步grounding准确率很高也是如此。
    - 在技能工件或UI表示中保留视觉信息比纯文本方法带来显著提升，因为它有助于识别UI元素和验证工作流状态。
    - 细粒度评估指标（如子目标完成度、成本-准确率、多检查点评分）能揭示被聚合任务成功率掩盖的能力差异。
    - 不确定性量化方法对模型层级和接口类型敏感，在开源权重模型上排名稳定，但向闭源系统迁移时表现很弱。
    分歧:
    - 一些工作通过显式的人工编写的多模态技能库注入任务知识，而另一些则通过端到端在线RL训练代理，依赖环境交互来构建必要技能。
    - 基准测试针对截然不同的交互表面（静态桌面截图、动态短视频信息流、移动端长时域任务），缺乏统一的评估协议，使得跨论文的性能比较很脆弱。
    - 不确定性量化方法的选择存在分歧：隐藏状态和基于密度的方法在开源权重上最稳定，但口头置信度和共形预测更适用于内部状态不可访问的闭源场景，目前尚无全场景通用解决方案。
    开放问题:
    - 观察控制能否被形式化为一个可学习的策略，由模型自主决定何时停止观察并采取行动，而非一个固定的超参数？
    - 如何将拖拽等连续交互的grounding与离散点击grounding统一在同一个动作表示中？
    - 在可验证合成任务上训练的代理，部署到真实世界分布外任务时，其性能和安全保证是否能维持？
    - 如何将后验不确定性量化扩展到完整的多步轨迹，以支持可靠的人机协同决策和提前终止？
