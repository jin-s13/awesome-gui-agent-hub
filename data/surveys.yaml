  literature_review_zh:
    研究路线矩阵:
    - 路线: 真实环境与多应用桌面GUI智能体评测
      解决的问题: 测量真实桌面环境中的跨应用任务完成情况，包括GUI与CLI混合流程和细粒度子目标评分。
      尚未覆盖: 跨平台和跨框架迁移未被证明；局限性说明缺失，子目标得分与下游可靠性是否一致仍未验证。
    - 路线: 动态与视频引导的界面理解
      解决的问题: 处理操作间内容变化的屏幕，并利用任务感知的关键帧提取支持视频引导的GUI决策。
      尚未覆盖: 证据限于短视频和少量视频问答任务；观察控制和向其他动态界面类型的泛化仍未解决。
    - 路线: 交互原语与安全敏感任务覆盖
      解决的问题: 将评测从点击扩展到拖拽操作，并在去除信誉捷径的条件下进行短信到网页欺诈检测。
      尚未覆盖: 拖拽相关工件可复现信号较少；欺诈评测抑制真实URL/信誉线索，部署迁移尚未测量。
    - 路线: 以多模态技能、重放程序和视觉评判增强智能体
      解决的问题: 通过检索多模态技能工件、将成功轨迹编译为状态机重放，以及用历史感知的视觉评判拦截错误动作，提升准确率和重复任务速度。
      尚未覆盖: 跨应用、框架和模型的迁移尚未建立；部分论文缺少可见代码、工件和局限性细节，鲁棒性与失败边界仍是验证缺口。
    共识:
    - 论文普遍将GUI智能体视为必须把动作与当前屏幕状态对齐、并完成长程任务的多模态系统。
    - 评测正从仅看成功率转向更细信号，如子目标完成、成本-准确性、交互类型覆盖和错误拦截。
