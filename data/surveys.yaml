  related_work_outline_zh:
  - 主流方向：构建端到端可训练的GUI智能体，以截图感知并输出键鼠操作，强化学习与多模态技能库取代静态提示。
  - 研究共性：交织实时视觉感知、动作接地与任务完成，依托可扩展训练基础设施和超越成功率指标的诊断性基准。
