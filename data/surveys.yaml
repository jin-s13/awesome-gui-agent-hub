      解决的问题: 定义多应用桌面任务与拖拽交互类型，提供确定性规则和子目标评分，揭示聚合通过率掩盖的差异。
      尚未覆盖: 对动态界面和更广泛拖拽工作流的覆盖迁移未测试；局限性说明常缺失。
    - 路线: 动态屏幕界面形式化
      解决的问题: 建模动作之间内容变化的GUI任务，用准确性与信息成本联合评测。
      尚未覆盖: 证据仅限于短视频平台；现有模型出现过度观察与观察不足，缺少显式控制机制。
    - 路线: 冻结智能体的技能与执行框架增强
      解决的问题: 在不更新模型权重的情况下，通过存储多模态任务知识或根据重复运行证据自动编辑执行框架来改进GUI智能体。
      尚未覆盖: 形式化保证和跨基准迁移尚未建立；改进可能不改变底层模型能力。
    - 路线: 可扩展训练与任务合成
      解决的问题: 通过大规模未标注截图或可验证合成任务与在线RL减少人工标注依赖。
      尚未覆盖: 对真实动态、拖拽或多应用工作流的泛化未直接证实；局限性缺失。
    - 路线: GUI grounding的不确定性量化
      解决的问题: 评估GUI grounding的后验不确定性方法，并通过共形点击区域进行空间安全。
      尚未覆盖: 仅覆盖单步grounding；跨模型、跨接口迁移弱，分布偏移下覆盖度下降。
    共识:
    - 能力声明越来越依赖可执行检查点而非仅聚合成功率；相似通过率下子目标完成度可能差异很大。
    - 冻结模型可通过外部知识、执行框架改动或数据效率方法提升，多条路线报告无需更新骨干模型。
    - 视觉 grounding 是共同瓶颈：保留视觉证据或从截图学习能改善UI元素识别和工作流验证。
    - 评测必须纳入信息成本和可靠性：动态界面与不确定性量化暴露了仅看成功率的指标无法发现的问题。
    - 当前智能体仍缺乏观察控制和可靠的跨模型/界面不确定性迁移。
    分歧:
    - 交互覆盖不同：有的面向静态桌面 GUI 与 CLI，有的面向动态内容、拖拽交互或单步 grounding。
    - 监督与训练信号不同：人工基准标注、未标注截图、可验证合成任务与在线 RL 各异。
    - 评测目标不同：通过率、成本-准确性、子目标评分与不确定性排名/校准导致声明不可直接比较。
    - 改进着力点不同：基准诊断、外部技能库、自动 harness 优化或模型训练。
    - 部署假设不同：macOS、浏览器动态屏幕、OSWorld/Windows 迁移和单步 grounding 的失败模式不可直接迁移。
    开放问题:
