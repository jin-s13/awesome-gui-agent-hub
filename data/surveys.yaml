  - 'Trend evolution: Within the 2024–2026 frontier, benchmarks are shifting from
    static single-step tasks to dynamic multi-step, long-horizon scenarios, and metrics
    are becoming finer-grained (multi-checkpoint, cost-accuracy). Training methods
    are moving from fully supervised to data-efficient approaches using unannotated
    screenshots or synthetic tasks.'
  - 'Open questions: Can uncertainty quantification be integrated into multi-step
    agent loops to improve safety? How do proactive context management and skill abstractions
    generalize to unseen applications? Are weak-supervised or RL-trained agents robust
    on real-world complex tasks beyond controlled benchmarks?'
  related_work_outline_zh:
  - 主流方向：通过更丰富的交互抽象、不确定性量化和减少人工标注的可扩展训练方法，构建更可靠、能处理长时域任务的GUI代理。
  - 研究共性：提出新基准或数据集，揭示代理的特定弱点（如观察控制差、忽略拖拽操作、过度观察），然后评估多个前沿模型。
  - 关键差异：部分工作关注训练可扩展性（在线RL、弱监督），另一些关注交互建模（技能库、主动上下文管理）或安全性（不确定性量化）；评估环境从桌面OS到移动端和短视频平台不等。
  - 趋势演进：在2024–2026前沿内，基准从静态单步任务转向动态多步长时域场景，指标变得更细粒度（多检查点、成本-准确性）。训练方法从全监督转向利用未标注截图或合成任务的数据高效方法。
  - 开放问题：不确定性量化能否集成到多步代理循环中以提升安全性？主动上下文管理和技能抽象如何泛化到未见过的应用？弱监督或RL训练的代理在真实世界复杂任务上是否比受控基准更鲁棒？
  literature_review:
    line_of_work_matrix:
    - line: Interaction abstraction and task representation
      what_it_solves: Structuring complex GUI tasks and knowledge into reusable representations
        for long-horizon multi-step execution.
      what_remains_open: Generalization beyond the evaluated applications and platforms
        is unverified; it is unclear whether these abstractions consistently improve
        end-to-end success across diverse domains.
    - line: Reliability assessment and uncertainty quantification
      what_it_solves: Quantifying uncertainty in GUI grounding and decision-making
        to support safe deployment.
      what_remains_open: Evaluation is limited to single-step grounding; cross-model
        and cross-interface transfer of UQ methods is weak, requiring target-specific
        re-evaluation.
    - line: Scalable training and data efficiency
      what_it_solves: Reducing dependence on expensive human annotations through weak
        supervision, verifiable task synthesis, and online RL.
      what_remains_open: Robustness on complex multi-step real-world tasks is not
        fully validated; synthetic task quality may introduce biases that limit generalization.
    - line: Interaction formalization and evaluation frameworks
      what_it_solves: Providing formal definitions and benchmarks for dynamic, long-horizon,
        and fine-grained GUI interactions such as observation control and drag operations.
      what_remains_open: Current benchmarks are platform- or interaction-type-specific;
        the formal concepts (e.g., observation control) have not yet been translated
        into generalizable agent designs.
    consensus:
    - Fine-grained, multi-dimensional evaluation reveals meaningful agent differences
      that single success rates mask.
    - Current models struggle with long-horizon dynamic tasks due to weak context
      management and observation control.
    - External knowledge—such as skill libraries or pretrained visual grounding—can
      improve performance, but must be combined with deliberate training strategies.
    disagreements:
    - 'Training strategy: supervised fine-tuning versus online reinforcement learning
      versus weak supervision from unlabeled screenshots.'
    - 'Interaction abstraction: external skill retrieval versus internal proactive
      context management actions (ConAct).'
    - 'Evaluation target: task success and efficiency versus uncertainty calibration
      and safety guarantees.'
    - 'Deployment setting: macOS desktop, mobile, or browser-based short-video platforms,
      each imposing different interaction dynamics.'
    open_questions:
    - How can post-hoc uncertainty quantification be incorporated into multi-step
      agent policies to improve safety without sacrificing efficiency?
    - Do proactive context management and skill abstractions transfer to new applications
      without per-app re-engineering?
    - Are agents trained with weak supervision or synthetic RL tasks robust under
      real-world distribution shifts and interface variations?
    - Can a unified formalization capture all GUI interaction types—including drag,
      dynamic content, and observation control—to guide agent design?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 交互抽象与任务表示
      解决的问题: 将复杂GUI任务和知识结构化为可重用表示，以支持长时域多步执行。
      尚未覆盖: 在已评估应用和平台之外的泛化性未经验证；这些抽象是否能跨领域一致提升端到端成功率尚不明确。
    - 路线: 可靠性评估与不确定性量化
      解决的问题: 量化GUI定位和决策中的不确定性，以支持安全部署。
      尚未覆盖: 评估仅限于单步定位；跨模型和跨接口的UQ方法泛化性弱，需要针对具体目标重新评估。
    - 路线: 可扩展训练与数据效率
      解决的问题: 通过弱监督、可验证任务合成和在线RL减少对昂贵人工标注的依赖。
      尚未覆盖: 在复杂多步真实任务上的鲁棒性尚未充分验证；合成任务质量可能引入偏差，限制泛化。
    - 路线: 交互形式化与评估框架
      解决的问题: 为动态、长时域和细粒度GUI交互（如观察控制、拖拽操作）提供形式化定义和基准。
      尚未覆盖: 现有基准局限于特定平台或交互类型；形式化概念（如观察控制）尚未转化为可泛化的代理设计。
    共识:
    - 细粒度、多维评估能揭示单一成功率所掩盖的代理能力差异。
    - 当前模型在长时域动态任务中表现不佳，主要瓶颈在于上下文管理和观察控制。
    - 外部知识（如技能库或预训练视觉定位）能提升性能，但必须与有意识的训练策略相结合。
    分歧:
    - 训练策略：监督微调 vs. 在线强化学习 vs. 从未标注截图弱监督学习。
    - 交互抽象：外部技能检索 vs. 内部主动上下文管理动作（ConAct）。
    - 评估目标：任务成功率与效率 vs. 不确定性校准与安全保证。
    - 部署环境：macOS桌面、移动端或基于浏览器的短视频平台，各自具有不同的交互动态。
    开放问题:
    - 如何将后验不确定性量化整合到多步代理策略中，以在不牺牲效率的情况下提升安全性？
    - 主动上下文管理和技能抽象能否在不进行逐应用重新设计的情况下迁移到新应用？
    - 用弱监督或合成RL任务训练的代理，在真实世界分布偏移和界面变化下是否鲁棒？
    - 能否设计一个统一的形式化框架，涵盖所有GUI交互类型——包括拖拽、动态内容和观察控制——以指导代理设计？
