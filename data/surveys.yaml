      what_remains_open: Most benchmarks do not cover safety-critical scenarios; cross-benchmark
        generalization is unknown; UQ benchmarks are limited to single-step grounding
        and performance degrades under distribution shift.
    - line: Skill and context augmentation
      what_it_solves: Improves long-horizon or complex task performance by injecting
        structured multimodal skill libraries or proactive context management, reducing
        forgetting and UI element misidentification.
      what_remains_open: Skill construction still relies on manual or semi-automatic
        pipelines and does not generalize easily to new applications; context management
        strategies lack validation across diverse model architectures.
    - line: Training and data efficiency
      what_it_solves: Reduces dependence on expensive human annotations by using verifiable
        task synthesis with online RL or weak supervision from massive unannotated
        screenshots, achieving competitive performance with limited labeled data.
      what_remains_open: Online RL lacks safety and stability guarantees; weak supervision
        may introduce noise that harms robustness on real tasks; there is no theoretical
        analysis of training data quality and distribution.
    - line: Formalization and uncertainty analysis
      what_it_solves: Formalizes dynamic-screen agents and post-hoc UQ methods, providing
        a theoretical lens for reliability and a systematic comparison of UQ transferability
        across models and datasets.
      what_remains_open: Formal definitions are not yet calibrated with empirical
        model behavior; UQ methods fail under distribution shift and are not integrated
        into the agent's decision loop for safety.
    consensus:
    - Multimodal input (visual screenshots and text) is essential for GUI agents;
      passage success rates are widely used but fine-grained sub-goal metrics reveal
      hidden performance differences.
    - Current models still struggle with dynamic interfaces, long-horizon tasks, and
      drag-based interactions, with significant gaps to human-level performance.
    - There is a growing need for benchmarks that cover interaction types beyond simple
      clicks, including drag, scroll, and video feed observation.
    disagreements:
    - 'Evaluation philosophy: some works use deterministic rule-based scoring, while
      others adopt joint metrics of task accuracy and information efficiency to penalize
      unnecessary observations.'
    - 'Performance improvement path: one line relies on external skill libraries,
      another on fine-tuning the model via online RL, and a third on pre-training
      with weak supervision from unlabeled data.'
    - 'Uncertainty handling: open-weight models show strong within-model UQ transfer,
      but cross-model transfer is weak, implying that UQ strategy must be tailored
      to the model architecture and access level.'
    open_questions:
    - How can uncertainty quantification be integrated into the action selection process
      to enable safer GUI agents?
    - What formal constraints on observation control can guarantee robust performance
      in dynamic, continuously changing interfaces?
    - How can online RL training be made safe and stable for deployment in real-world
      computer use scenarios?
    - How can skill libraries be automatically constructed and transferred across
      applications without manual authoring?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准测试与评估框架
      解决的问题: 提供标准化、多样化的环境（桌面、动态信息流、拖拽交互）和指标（细粒度检查点、不确定性量化），衡量GUI代理的能力和局限性。
      尚未覆盖: 多数基准未覆盖安全关键场景；跨基准泛化性未知；UQ基准仅限于单步基础，且在分布偏移下性能下降。
    - 路线: 技能与上下文增强
      解决的问题: 通过注入结构化多模态技能库或主动上下文管理，提升长时域或复杂任务性能，减少遗忘和UI元素误识别。
      尚未覆盖: 技能构建仍依赖人工或半自动流程，难以泛化到新应用；上下文管理策略缺乏在不同模型架构上的验证。
    - 路线: 训练与数据效率
      解决的问题: 通过可验证任务合成与在线强化学习，或大规模无标注截图的弱监督，减少对昂贵人工标注的依赖，以有限标注数据达到竞争性能。
      尚未覆盖: 在线强化学习缺乏安全与稳定性保证；弱监督可能引入噪声，损害真实任务上的鲁棒性；缺乏对训练数据质量和分布的理论分析。
    - 路线: 形式化与不确定性分析
      解决的问题: 对动态界面代理和后验UQ方法进行形式化，为可靠性提供理论视角，并系统比较UQ在不同模型和数据集间的迁移性。
      尚未覆盖: 形式化定义尚未与经验模型行为校准；UQ方法在分布偏移下失效，且未集成到代理的安全决策回路中。
    共识:
    - 多模态输入（视觉截图与文本）对GUI代理至关重要；任务通过率被广泛使用，但细粒度子目标指标能揭示隐藏的性能差异。
    - 当前模型在动态界面、长时域任务和拖拽交互上仍存在显著性能差距，与人类水平有较大距离。
    - 需要更多基准来覆盖超越简单点击的交互类型，包括拖拽、滚动和视频信息流观察。
    分歧:
    - 评估理念：部分工作采用确定性基于规则的评分，另一些则采用任务准确性与信息效率的联合指标，以惩罚不必要的观察。
    - 性能提升路径：一条路线依赖外部技能库，另一条通过在线强化学习微调模型，第三条利用无标注数据的弱监督进行预训练。
    - 不确定性处理：开源权重模型表现出较强的模型内UQ迁移，但跨模型迁移很弱，表明UQ策略必须根据模型架构和访问级别定制。
    开放问题:
    - 如何将不确定性量化集成到动作选择中，以实现更安全的GUI代理？
    - 什么样的观察控制形式约束可以保证在动态、持续变化的界面中的鲁棒性能？
    - 如何使在线强化学习训练在真实计算机使用场景中安全且稳定地部署？
    - 如何在不依赖人工编写的情况下，自动构建技能库并在应用间迁移？
