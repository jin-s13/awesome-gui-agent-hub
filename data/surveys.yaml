    研究路线矩阵:
    - 路线: 交互覆盖与任务抽象基准（如 MacAgentBench、LivingScreen、DragOn）
      解决的问题: 把评估从静态点击扩展到复合GUI+CLI桌面任务、动态短视频界面和拖拽操作，并提供规则化或浏览器化评分。
      尚未覆盖: 多步轨迹评估、观察控制形式化、跨平台迁移，以及基准覆盖能否预测真实部署行为。
    - 路线: 外部脚手架：技能库与harness自改进
      解决的问题: 通过分层多模态技能或基于截图的证据驱动harness优化，在保持骨干模型冻结的同时提升代理表现。
      尚未覆盖: 优化是否无需按目标重新调整即可跨应用/基准迁移，以及增益来自框架设计还是骨干模型能力。
    - 路线: 数据高效与可验证的GUI策略训练
      解决的问题: 利用未标注截图的弱监督或可验证任务合成与在线RL，降低标注成本并扩展到更强完成能力。
      尚未覆盖: 分布偏移鲁棒性，以及合成或弱监督任务能否预测真实GUI环境中的失败和迁移。
    - 路线: 可靠性、不确定性与安全导向评估
      解决的问题: 引入细粒度子目标指标、成本-准确率、后验UQ和共形点击区域，揭示超越pass/fail的失败模式。
      尚未覆盖: 多步不确定性保证、跨模型/接口UQ迁移，以及校准-测试或接口不匹配下的覆盖度。
    共识:
    - 评估应超越总体成功率，因为相似的Pass@1或任务准确率可能掩盖子目标完成、观察效率或定位可靠性的差异。
    - 冻结模型可通过技能、harness或工具等外部脚手架提升，而不必重新训练骨干模型。
    - 动态界面和非点击交互暴露当前代理在观察控制和拖拽定位等方面的明显缺口。
    - 未标注截图和可验证任务合成可减少对昂贵人工标注的依赖。
    分歧:
