  - 'Mainstream direction: Building reliable GUI agents through rich interaction abstractions,
    fine-grained evaluation, uncertainty quantification, and scalable training.'
  - 'Shared research pattern: Moving beyond click-only actions to multi-step, multi-modal,
    and dynamic interaction, with emphasis on rigorous benchmarking and reliability.'
  - 'Key differences: Evaluation granularity (single-step grounding vs. long-horizon
    tasks), interface dynamics (static vs. living screens), reliability strategies
    (UQ vs. skill hierarchy vs. fine-grained metrics), and interaction modes (drag,
    click, CLI).'
  - 'Trend evolution: From static click-based benchmarks toward dynamic, living-screen
    environments; from manual annotation to weakly supervised and synthetic data;
    from text-only to multimodal skill libraries; from imitation learning to online
    RL with verifiable rewards.'
  - 'Open questions: How to generalize uncertainty quantification to multi-step agent
    trajectories; how to formalize observation control for dynamic content; how to
    achieve cross-platform interaction abstraction; and what theoretical guarantees
    exist for context management in long-horizon tasks.'
  related_work_outline_zh:
  - 主流方向：通过丰富的交互抽象、细粒度评估、不确定性量化和可扩展训练，构建可靠的GUI代理。
  - 研究共性：从纯点击操作扩展到多步、多模态和动态交互，强调严密的基准测试和可靠性评估。
  - 关键差异：评估粒度（单步基础 vs. 长时域任务），界面动态性（静态 vs. 动态屏幕），可靠性策略（UQ、技能层次、细粒度指标），交互模式（拖拽、点击、CLI）。
  - 趋势演进：从静态点击基准转向动态、实时屏幕环境；从人工标注转向弱监督和合成数据；从纯文本技能库转向多模态技能；从模仿学习转向带可验证奖励的在线RL。
  - 开放问题：如何将不确定性量化推广到多步代理轨迹；如何为动态内容形式化观察控制；如何实现跨平台交互抽象；以及长时域任务中上下文管理的理论保证。
  literature_review:
    line_of_work_matrix:
    - line: Formalizing dynamic interaction and task abstraction
      what_it_solves: Defines agent behavior for living-screen interfaces where content
        changes between actions, and abstracts drag-based interactions beyond click-only
        models.
      what_remains_open: Generalization to other dynamic interface types, and a unified
        formalization of cross-platform interaction primitives.
    - line: Reliability and uncertainty quantification
      what_it_solves: Quantifies confidence in GUI grounding and evaluates reliability
        via fine-grained, multi-checkpoint scoring, enabling safer deployment.
      what_remains_open: Transfer of UQ rankings across model tiers and to multi-step
        trajectories; robustness under distribution shift in real deployments.
    - line: Interaction theory and context management
      what_it_solves: Structures long-horizon GUI interaction through proactive context
        management and hierarchical multimodal skill libraries, preventing information
        loss.
      what_remains_open: Theoretical guarantees for context compression, and cross-application
        skill transfer without per-app retraining.
    - line: Scaling and data efficiency
      what_it_solves: Reduces reliance on human annotations via weakly supervised
        learning from unlabeled screenshots and scalable online RL with verifiable
        task synthesis.
      what_remains_open: Distribution shift between synthetic training tasks and real-world
        use, and the asymptotic limits of data efficiency under weak supervision.
    consensus:
    - GUI agents must support diverse interaction modes (click, drag, CLI) and be
      evaluated with fine-grained, task-decomposed metrics.
    - Reliability is a critical deployment requirement, addressed through either uncertainty
      quantification, skill verification, or multi-checkpoint scoring.
    - Current models struggle with long-horizon tasks and dynamic interfaces, necessitating
      better context management and observation control.
    disagreements:
    - Some works evaluate single-step grounding reliability, while others focus on
      multi-step trajectory success, leading to different reliability metrics.
    - 'Approaches to reliability differ: post-hoc uncertainty quantification vs. skill-based
      verification vs. fine-grained rule-based scoring.'
    - 'Interaction formalization varies: living-screen agents assume dynamic, video-like
      content, while others assume static screenshots, causing incompatible evaluation
      protocols.'
    open_questions:
    - Can uncertainty quantification methods effective for single-step grounding be
      extended to sequential decision-making without recalibration?
    - What is the minimal set of interaction primitives that can cover all GUI tasks
      across platforms, and how can they be formally specified?
    - How can agents maintain observation control in dynamic content without exhaustive
      history, and what theoretical bounds exist for context forgetting?
