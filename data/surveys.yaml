    研究路线矩阵:
    - 路线: GUI智能体的分类体系与路线图综合
      解决的问题: 将碎片化的智能体能力、评测面和失效模式组织为可操作的研究方向和里程碑。
      尚未覆盖: 综合是否由系统证据支撑仍不明确，证据包中较早年份覆盖不可见。
    - 路线: 对比评测综合
      解决的问题: 厘清基准、界面、基线和指标选择如何影响GUI智能体性能结论。
      尚未覆盖: OSWorld、ScienceBoard、MobileWorld、VG-GUIBench以及单步与多步设置间的兼容性尚未建立。
