  - 主流方向：构建端到端可训练的GUI智能体系统，结合在线强化学习框架与可复现评估流水线，从静态模型转向交互式自改进智能体。
  - 研究共性：提供开源构件（框架、技能库、基准），系统化地训练、诊断和审计计算机使用任务中的视觉接地与动作执行，推动可复现工程。
