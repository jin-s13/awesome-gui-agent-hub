    with trajectory-level rewards—and emphasize scalable infrastructure for rollout
    collection across diverse environments.'
  - 'Key differences: Supervision strategy (weakly-supervised from unannotated screenshots
    vs. fully-supervised from expert trajectories vs. RL from environment feedback),
    visual memory design (full-image vs. action-grounded crops vs. hierarchical multimodal
    skill artifacts), and evaluation scope (task success vs. safety robustness vs.
    GUI transition understanding).'
  - 'Trend evolution: Within the 2024–2026 frontier, the field is moving from offline
    benchmarking toward live-browser and containerized RL training loops, with growing
    attention to failure analysis, safety audits, and diagnostic benchmarks that isolate
    specific capabilities such as transition understanding and domain-conditioned
    robustness.'
  - 'Open questions: How well do these frameworks generalize across operating systems,
    application domains, and harness designs? Can error recovery and safety hardening
    transfer across domains, or do they remain tightly conditioned on training environments?
    What is the minimal supervision budget needed to match fully-supervised agents?'
  related_work_outline_zh:
  - 主流方向：面向GUI代理的端到端训练框架与部署栈，明显转向在真实环境中进行在线强化学习，以及通过截图和键盘/鼠标进行原生计算机操作交互。
  - 研究共性：大多数系统采用两阶段流水线——从精心策划或弱标注的轨迹进行监督初始化，然后利用轨迹级奖励进行在线强化学习微调——并强调跨多样化环境的可扩展回滚收集基础设施。
  - 关键差异：监督策略（来自未标注截图的弱监督 vs. 来自专家轨迹的全监督 vs. 来自环境反馈的强化学习）、视觉记忆设计（全图像 vs. 动作接地裁剪 vs.
    分层多模态技能工件）、以及评估范围（任务成功率 vs. 安全鲁棒性 vs. GUI过渡理解）。
  - 趋势演进：在2024–2026年前沿窗口内，该领域正从离线基准测试转向实时浏览器和容器化强化学习训练循环，越来越关注失败分析、安全审计以及能够隔离特定能力（如过渡理解和领域条件鲁棒性）的诊断基准。
  - 开放问题：这些框架在操作系统、应用领域和推理框架设计之间的泛化能力如何？错误恢复和安全加固能否跨领域迁移，还是仍然紧密依赖于训练环境？匹配全监督代理所需的最小监督预算是多少？
  literature_review:
    line_of_work_matrix:
    - line: End-to-end RL training frameworks for GUI and computer-use agents
      what_it_solves: Training agents that use complex inference harnesses (e.g.,
        Claude Code, Codex) directly in live environments via online multi-turn RL,
        decoupling agent training from harness internals and enabling scalable rollout
        collection.
      what_remains_open: Harness design heavily influences trainability; error recovery
        remains weak even after RL training; generalization across harness types and
        environments is unproven beyond the evaluated benchmarks.
    - line: Multimodal skill libraries and action-grounded visual memory
      what_it_solves: Improving GUI agent performance by retaining visual figures
        alongside textual skill descriptions and storing local image crops tied to
        successful actions, rather than relying on full-image history or text-only
        artifacts.
      what_remains_open: Whether hierarchical skill indexing scales to hundreds of
        applications without retrieval degradation; whether action-grounded memory
        benefits transfer across different agent architectures and task domains.
    - line: Native computer-use agents with minimal interface assumptions
      what_it_solves: Building agents that interact solely through screenshots and
        keyboard/mouse events without DOM trees, accessibility metadata, or task-specific
        APIs, enabling operation across arbitrary applications.
      what_remains_open: Large-scale training requires substantial cloud infrastructure
        (nearly 100,000 vCPUs); performance on long-horizon tasks with complex state
        dependencies remains unsaturated; safety hardening is domain-conditioned and
        does not generalize.
    - line: Diagnostic benchmarks for GUI transition understanding and safety
      what_it_solves: Isolating specific failure dimensions—state verification, source
        tracking, context-aware control, and prompt-injection resistance—that are
        not captured by end-to-end task success metrics.
      what_remains_open: Offline benchmarks cannot capture real-time dynamics and
        asynchronous timing; safety audits are limited to hand-crafted attacks and
        may not reflect RL-optimized adversarial strings; cross-OS and cross-domain
        coverage is narrow.
    consensus:
    - Online multi-turn RL on live or containerized environments consistently outperforms
      offline imitation-based training for GUI agents.
    - Visual information—whether as full screenshots, localized crops, or multimodal
      skill artifacts—is essential for robust UI element identification and workflow
      state verification.
    - Scalable rollout infrastructure is a critical enabler; systems that invest in
      cloud orchestration or proxy-based harness interception achieve more reproducible
      training loops.
    - Failure analysis reveals that action-level errors (grounding mistakes, hidden-operation
      blindness) are harder to address than state-level misunderstanding, and full-image
      memory can worsen these errors.
    disagreements:
    - 'Supervision paradigm: GUICrafter demonstrates that weakly-supervised learning
      from unannotated screenshots can match fully-supervised agents with only 0.1%
      of the data, while OpenWebRL and OpenForgeRL rely on supervised initialization
      plus online RL, suggesting unresolved trade-offs between annotation cost and
      final performance.'
    - 'Visual memory design: Naive Visual Memory shows that storing full-image history
      increases action-level errors, advocating for action-grounded crops; VISUALSKILL
      advocates for hierarchical multimodal artifacts with retained figures; Qwen-CUA
      uses a sliding window of 20 active screenshots with older history compressed
      into fixed-size blocks.'
    - 'Evaluation target: Desktop-Delta Bench and the domain-conditioned safety benchmark
      push for diagnostic, capability-isolating evaluation beyond task success, while
      most system papers (OpenWebRL, Qwen-CUA, OpenForgeRL) optimize for aggregate
      benchmark scores on OSWorld and WebVoyager.'
    - 'Deployment scope: Some systems target browser-only tasks, others target desktop
      GUI automation, and the safety benchmark reveals that browser-hardened models
      remain vulnerable in coding environments, highlighting that deployment assumptions
      are not interchangeable.'
    open_questions:
    - Can error recovery be systematically improved through RL, or does it require
      fundamentally different training objectives or architectural priors?
    - Do safety guarantees transfer across application domains, or are they inherently
      domain-conditioned as suggested by the 0% browser ASR vs. 100% coding ASR finding?
    - What is the minimum supervision budget and infrastructure scale needed to train
      a competitive GUI agent, and how does this threshold vary across operating systems
      and application categories?
    - How do offline diagnostic metrics (e.g., GUI transition understanding) correlate
      with live task success, and can they serve as reliable proxies for early-stage
      model selection?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 面向GUI和计算机使用代理的端到端强化学习训练框架
      解决的问题: 在真实环境中通过在线多轮强化学习训练使用复杂推理框架（如Claude Code、Codex）的代理，将代理训练与框架内部解耦，实现可扩展的回滚收集。
      尚未覆盖: 框架设计显著影响可训练性；即使经过强化学习训练，错误恢复仍然薄弱；在评估基准之外的框架类型和环境之间的泛化能力未经验证。
    - 路线: 多模态技能库与动作接地视觉记忆
      解决的问题: 通过在文本技能描述旁保留视觉图形，并存储与成功动作相关的局部图像裁剪，而非依赖全图像历史或纯文本工件，来提升GUI代理性能。
      尚未覆盖: 分层技能索引是否能扩展到数百个应用而不出现检索退化；动作接地记忆的收益是否能在不同代理架构和任务领域之间迁移。
    - 路线: 具有最小接口假设的原生计算机操作代理
      解决的问题: 构建仅通过截图和键盘/鼠标事件交互的代理，无需DOM树、可访问性元数据或任务专用API，从而能够在任意应用上操作。
      尚未覆盖: 大规模训练需要大量云基础设施（近10万vCPU）；在具有复杂状态依赖的长程任务上的性能仍未饱和；安全加固是领域条件的，无法泛化。
    - 路线: 用于GUI过渡理解与安全性的诊断基准
      解决的问题: 隔离端到端任务成功率指标无法捕捉的特定失败维度——状态验证、源跟踪、上下文感知控制以及提示注入抵抗力。
      尚未覆盖: 离线基准无法捕捉实时动态和异步时序；安全审计仅限于手工制作的攻击，可能无法反映RL优化的对抗性字符串；跨操作系统和跨领域的覆盖范围较窄。
    共识:
    - 在真实或容器化环境中进行在线多轮强化学习，始终优于基于离线模仿的GUI代理训练方法。
    - 视觉信息——无论是完整截图、局部裁剪还是多模态技能工件——对于稳健的UI元素识别和工作流状态验证至关重要。
    - 可扩展的回滚基础设施是关键使能因素；投资于云编排或基于代理的框架拦截的系统能够实现更可复现的训练循环。
    - 失败分析表明，动作级错误（接地错误、隐藏操作盲区）比状态级误解更难解决，且全图像记忆可能加剧这些错误。
    分歧:
    - 监督范式：GUICrafter证明从无标注截图的弱监督学习仅用0.1%的数据即可匹配全监督代理，而OpenWebRL和OpenForgeRL依赖监督初始化加在线强化学习，表明标注成本与最终性能之间的权衡尚未解决。
    - 视觉记忆设计：Naive Visual Memory显示存储全图像历史会增加动作级错误，主张使用动作接地裁剪；VISUALSKILL主张使用保留图形的分层多模态工件；Qwen-CUA使用20张活跃截图的滑动窗口，并将较旧历史压缩为固定大小的块。
    - 评估目标：Desktop-Delta Bench和领域条件安全性基准推动超越任务成功率的诊断性、能力隔离评估，而大多数系统论文（OpenWebRL、Qwen-CUA、OpenForgeRL）优化OSWorld和WebVoyager等聚合基准分数。
    - 部署范围：一些系统仅针对浏览器任务，另一些针对桌面GUI自动化，而安全性基准揭示浏览器加固的模型在编码环境中仍然脆弱，强调部署假设不可互换。
    开放问题:
    - 错误恢复能否通过强化学习系统性地改进，还是需要根本不同的训练目标或架构先验？
    - 安全保证能否跨应用领域迁移，还是像0%浏览器攻击成功率与100%编码攻击成功率的发现所表明的那样，本质上具有领域条件性？
    - 训练一个有竞争力的GUI代理所需的最小监督预算和基础设施规模是多少？这一阈值如何在操作系统和应用类别之间变化？
    - 离线诊断指标（如GUI过渡理解）与真实任务成功率之间的相关性如何？它们能否作为早期模型选择的可靠代理指标？
