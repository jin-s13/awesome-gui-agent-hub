  literature_review:
    line_of_work_matrix:
    - line: Real-world desktop and cross-platform computer-use benchmarking
      what_it_solves: Measures GUI agent competence on realistic desktop applications
        and cross-platform web, mobile, and desktop tasks with fine-grained outcomes
        rather than only final success.
      what_remains_open: Evidence is mostly narrow per platform or per task; whether
        fine-grained desktop metrics transfer across operating systems, applications,
        and real professional workflows remains unverified.
    - line: Multimodal skill libraries and reusable task programs
      what_it_solves: Improves computer-use agents by retrieving prior application
        knowledge or compiling successful runs into fast replays, reducing repeated
        reasoning cost and grounding actions in visual artifacts.
      what_remains_open: Visual skill benefits and replay speedups are shown on selected
        benchmarks; stale or mismatched screens, unseen applications, and whether
        reusable artifacts cover dynamic UI changes remain open.
    - line: Dynamic, video-guided, and observation-sensitive GUI tasks
      what_it_solves: Evaluates and improves agents when interface content changes
        over time or when instruction is provided through video and keyframes, including
        observation cost and task accuracy trade-offs.
      what_remains_open: Current agents lack observation control and often over-observe
        or under-observe; keyframe extraction gains are mostly reported on video QA,
        not yet on broad GUI agentic task transfer.
    - line: Specialized interaction grounding and execution correction
      what_it_solves: Covers less click-centric interactions such as drag manipulations
        and intercepts execution errors via history-aware, visually grounded critics
        before actions are taken.
      what_remains_open: Drag and critic results are demonstrated on limited suites;
        combining specialized interaction grounding with cross-platform critic generalization
        and real-world failure costs is not shown.
    - line: Security-sensitive web navigation tasks
      what_it_solves: Tests whether agentic web navigation can judge SMS-to-webpage
        fraud without reputation shortcuts, emphasizing evidence-based decisions and
        benign recall.
      what_remains_open: The benchmark suppresses URL and reputation cues and is limited
        in scale and scenarios; robust detection under real-world shortcuts, more
        languages, and adversarial pages remains unresolved.
    consensus:
    - 'Visual grounding matters across tasks: screenshots, UI elements, or visual
      skill artifacts are central to GUI agent performance and failure diagnosis.'
    - Refined evaluation beyond final success is needed, including sub-goal completion,
      cost-accuracy, and benign recall under controlled conditions.
    - Real or faithfully simulated application environments are necessary because
      text-only or static benchmarks miss execution errors, observation behavior,
      and interaction coverage.
    - 'Current agents show a shared failure pattern: reasonable planning but unreliable
      grounding, observation control, or repeated-task efficiency.'
    disagreements:
    - Works target different domains and interaction modes, from static desktop or
      web tasks to dynamic feeds, drag interaction, video-guided tasks, and security-sensitive
      navigation, implying different observation and action models.
    - 'Intervention choices differ: one line supplies external skill retrieval, another
      compiles replays, another adds a critic, and another selects task-relevant keyframes,
      addressing different bottlenecks.'
    - Evaluation targets differ—aggregate task accuracy, Pass@1, cost-accuracy, sub-goal
      completion, or benign recall—making direct comparison difficult.
    - Some works provide benchmarks without a new intervention, while others propose
      method-level changes; the evidence therefore disagrees on whether gains come
      from the model, framework, or external memory or skill components.
    open_questions:
    - Can skill retrieval, replay, critic, and keyframe gains transfer across operating
      systems, applications, and dynamically changing interfaces?
    - How should agents balance observation cost and task accuracy in streaming or
