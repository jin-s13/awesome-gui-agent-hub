  literature_review:
    line_of_work_matrix:
    - line: Benchmark-driven GUI evaluation and grounding protocols
      what_it_solves: Measures agent capability on controlled GUI grounding, video-guided,
        fraud-detection, safety, and uncertainty tasks while providing metrics and
        baselines.
      what_remains_open: Coverage is limited to selected tasks and interfaces; closed-source
        or optimized adversarial settings are often not reproducible from the packet.
    - line: Data and verifiable task generation for computer-use training
      what_it_solves: Creates dense annotations or verifiable tasks to improve grounding
        and long-horizon policy learning without relying only on human demonstrations.
      what_remains_open: Transfer to unseen applications and whether synthesized tasks
        match real-world distribution is only partially evidenced.
    - line: Execution harness and context management for frozen or compact policies
      what_it_solves: Improves agent reliability by optimizing the executable harness
        or by explicit memory actions while keeping or using small models.
      what_remains_open: Benchmark breadth for long-horizon memory and cross-benchmark
        transfer remains narrow; implementation artifacts are inconsistently available.
    - line: Risk, calibration, and safety auditing
      what_it_solves: Evaluates uncertainty calibration, prompt-injection resistance,
        and security shortcuts under sanitized or controlled protocols.
      what_remains_open: Findings are domain-conditioned and distribution-sensitive;
        coverage is limited and only some artifacts are public.
    consensus:
    - GUI agent evaluation is fragmented across grounding, long-horizon completion,
      and risk dimensions; no single benchmark covers all relevant behaviors.
    - Frozen or compact models can be substantially improved by better data, context,
      or execution harness, indicating that non-model interventions are important.
    - Safety and uncertainty conclusions are highly sensitive to evaluation domain,
      interface, and available shortcuts.
    - Public artifacts and reproducibility signals are uneven, making cross-paper
      comparison reliant on summarized results rather than verified implementations.
    disagreements:
    - Some work improves agents through large-scale verifiable task synthesis and
      online RL, while other work avoids model training and optimizes harness, context,
      or post-hoc calibration instead.
    - 'Evaluation targets differ: single-step grounding, long-horizon task completion,
      and safety or fraud judgment are not directly comparable, so state-of-the-art
      claims vary by setting.'
    - 'Reproducibility evidence differs across contributions: some release detailed
      artifacts, while others mainly report benchmark scores, leaving verification
      gaps.'
    open_questions:
    - Which GUI-agent capabilities should a survey taxonomy prioritize when current
      primary evidence clusters on benchmarks and methods rather than systematic review?
    - How can long-horizon mobile, desktop, browser, and safety evaluations be aligned
      so performance improvements transfer across domains?
    - What minimum evidence of reproducibility and limitation reporting is needed
      to aggregate claims into a trustworthy comparative evaluation?
    - How do conclusions about uncertainty and prompt-injection safety change under
      optimized adversarial inputs and distribution shift?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准驱动的GUI评测与grounding协议
      解决的问题: 在受控GUI grounding、视频引导、诈骗检测、安全与不确定性任务上衡量智能体能力，并提供指标与基线。
