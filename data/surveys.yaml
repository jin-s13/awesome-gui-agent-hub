    DragOn).'
  - 'Shared research pattern: New task datasets or environments expose a specific
    missing capability—observation control, drag grounding, video-guided grounding,
    repeated-task speed, or multimodal skill use—then agents are evaluated against
    that capability.'
  - 'Key differences: Works intervene at different levels: external multimodal skill
    libraries and compiled replay programs avoid model retraining; diffusion decoding
    and GUI grounding datasets change model internals; evaluation targets and metrics
    also differ across static office, dynamic screen, and drag/video-guided tasks.'
  - 'Trend evolution: The evidence sits in the 2024–2026 frontier but top papers are
    all 2026, shifting from click-only benchmarks toward multimodal, dynamic, drag,
    video-guided, and reuse-oriented GUI agents; no clear historical trajectory is
    visible from this packet.'
  - 'Open questions: Cross-platform and cross-interface transfer, observation control,
    real-world validity of benchmark gains, and safe reuse/staleness of stored skills
    or replay programs remain unresolved or under-evidenced.'
  related_work_outline_zh:
  - 主流方向：构建并评估面向真实应用和动态界面的 GUI 智能体，如 MacAgentBench、LivingScreen、DragOn，覆盖桌面、网页、移动端、视频与拖拽交互，强调定位、任务完成和效率。
  - 研究共性：多数工作将新任务表示或数据集与智能体评估绑定，随后揭示观察、定位、技能复用或重放可靠性中的缺失能力。
  - 关键差异：干预层级不同，一类使用外部多模态技能和重放程序，另一类改进模型内部的扩散解码或 GUI 微调；评测目标也从静态桌面任务延伸到动态短视频、拖拽和视频引导任务。
  - 趋势演进：现有证据主要集中在 2026 年前沿工作，显示从以点击为主的基准向多模态、动态、视频引导和重复任务效率演进；跨年份趋势尚不充分。
  - 开放问题：界面与应用间的迁移、观察控制、基准到真实场景的有效性、存储技能和程序的安全复用仍缺乏充分证据。
  literature_review:
    line_of_work_matrix:
    - line: Comprehensive and fine-grained GUI task benchmarking
      what_it_solves: Evaluates real desktop, mobile-web, dynamic short-video, drag-based,
        and video-guided GUI tasks beyond aggregate success, using sub-goal, cost-accuracy,
        or task-type coverage signals.
      what_remains_open: Whether these benchmark signals transfer across operating
        systems, applications, and interaction modalities, and whether they predict
        real-world operational reliability.
    - line: External skill and experience reuse
      what_it_solves: Improves agent performance and repeated-task efficiency without
        retraining by retrieving multimodal skill artifacts or compiling successful
        runs into replayable state-machine programs.
      what_remains_open: Generalization to novel applications, interface drift, trustworthy
        store validation, and dependence on initial successful demonstrations or live
        application exploration.
    - line: Model-centric GUI grounding and action generation
      what_it_solves: Strengthens GUI element grounding and navigation by training
        vision-language models with large-scale referring-expression data plus distillation-to-reinforcement
        learning, or by adopting block-wise diffusion GUI agents.
      what_remains_open: Generalization from SFT beyond seen domains, sparse-reward
        RL reliability, closed-data comparability, and whether benchmark wins imply
        broader desktop/web/mobile task competence.
    - line: Video-aware interface comprehension
      what_it_solves: Connects video understanding to GUI agent tasks by extracting
        task-relevant and scene-aware keyframes, reducing video input burden for video-guided
        interactive tasks.
      what_remains_open: Whether improved keyframe extraction translates to closed-loop
        GUI action success and generalizes beyond the reported video question-answering
        and video-guided GUI benchmarks.
    consensus:
    - 'Current research treats GUI agents as needing more than generic click grounding:
      task-specific interfaces, dynamic state changes, multimodal artifacts, and repeated
      workflows materially affect performance.'
    - Evaluation is moving beyond Pass@1 to sub-goal completion, cost-accuracy, drag
      grounding, and replay speed, exposing behaviors hidden by aggregate task success.
    - Open agents still show clear capability gaps on dynamic or non-click interactions,
      especially observation control, drag-based manipulation, and generalization
      across interface types.
    disagreements:
    - 'Representation and memory differ: some works store external multimodal skill
      artifacts or compiled state-machine programs, while others change model internals
      through GUI-specific fine-tuning or diffusion-based decoding.'
    - 'Supervision and training signals differ: large-scale supervised fine-tuning
      plus distillation-to-reinforcement learning, two-stage model pre-training plus
      GUI fine-tuning, and training-free retrieval or replay all coexist as improvement
      strategies.'
    - 'Evaluation settings differ substantially: deterministic desktop rule-based
      scoring, browser-simulated cost-accuracy, drag interaction datasets, video-guided
      benchmarks, and cross-platform grounding suites each emphasize different capabilities
      and failure modes.'
    open_questions:
    - Can agents learn to decide how much observation is needed in continuously changing
      screens, rather than over-observing or under-observing?
    - What combination of external memory, replay, and model fine-tuning transfers
      most effectively across desktop, mobile, web, drag, and video-guided GUI tasks?
    - Do gains on static or simulated benchmarks predict real-world office, software-operation,
      mobile, and web task reliability?
    - How should stored skills and replay programs be kept current with application
      or interface updates without silently failing on outdated screen states?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 全面且细粒度的 GUI 任务基准评测
      解决的问题: 在真实桌面、移动网页、动态短视频、拖拽和视频引导任务中，超越总体成功率，使用子目标、成本准确率或任务类型覆盖信号评估智能体。
      尚未覆盖: 这些基准信号能否跨操作系统、应用和交互模态迁移，以及能否预测真实世界的运行可靠性，仍缺乏证据。
    - 路线: 外部技能与经验复用
      解决的问题: 通过检索多模态技能工件或将成功运行编译为可重放状态机程序，在不重训模型的情况下提升性能和重复任务效率。
      尚未覆盖: 对新颖应用、界面漂移的泛化，可靠的存储验证，以及对初始成功演示或实时应用探索的依赖问题尚未解决。
    - 路线: 以模型为中心的 GUI 定位与动作生成
      解决的问题: 通过大规模指代表达数据加蒸馏到强化学习，或采用块级扩散视觉语言 GUI 智能体，强化元素定位和导航能力。
      尚未覆盖: 监督微调在未见领域的泛化、稀疏奖励强化学习的可靠性、闭源数据可比性，以及基准提升是否代表更广泛的桌面/网页/移动任务能力。
    - 路线: 视频感知的界面理解
      解决的问题: 通过提取任务相关且场景感知的关键帧，连接视频理解与 GUI 智能体任务，降低视频引导交互任务的输入负担。
      尚未覆盖: 改进的关键帧提取能否转化为闭环 GUI 动作成功，以及能否泛化到所报告视频问答和视频引导 GUI 基准之外，仍不清楚。
    共识:
    - 当前研究认为 GUI 智能体需要超越通用点击定位：任务相关界面、动态状态变化、多模态工件和重复工作流对性能有实质影响。
    - 评测正从 Pass@1 转向子目标完成、成本准确率、拖拽定位和重放速度，从而暴露总体任务成功率抹平的行为差异。
    - 开放智能体在动态或非点击交互上仍存在明显能力缺口，尤其是观察控制、拖拽式操作和跨界面类型泛化。
