    研究路线矩阵:
    - 路线: 真实桌面 OS 任务评测
      解决的问题: 在多应用 GUI 与 CLI 任务上，用细粒度子目标评分衡量跨框架、跨模型的智能体行为。
      尚未覆盖: 未见局限性说明；测试桌面 OS 之外的泛化、长程可靠性以及对系统或应用更新的敏感性尚待验证。
    - 路线: 动态与交互特定 GUI 任务评测
      解决的问题: 在动态短视频界面和拖拽交互上测试智能体，暴露观察控制和交互定位缺口。
      尚未覆盖: 平台和领域范围有限，代码与数据工件可用性不一致；向其他动态界面或真实用户工作流的迁移仍开放。
    - 路线: 多模态技能与重放记忆
      解决的问题: 通过分层多模态技能检索提升准确率，并通过带屏幕检查回退的状态机重放降低重复任务延迟。
      尚未覆盖: 多数论文缺少局限性说明；技能构建成本、界面漂移下的维护和测试外的回退鲁棒性需证据支持。
    - 路线: 可扩展网页环境与轨迹生成
      解决的问题: 从真实 URL 重建可复用、有源头的网页环境和轨迹，减少逐站点人工实现并改善保真度与微调收益。
