  - 'Key differences: Training data scale (weak supervision vs. massive annotation),
    interaction abstraction (native screenshot vs. harness/API), evaluation target
    (end-to-end task success vs. fine-grained diagnostic steps), and safety scope
    (browser-only vs. cross-domain).'
  - 'Trend evolution: Within the 2024–2026 frontier, the field is shifting from offline
    benchmarks to online real-time training, from proprietary models to open frameworks,
    from single success metrics to multi-dimensional diagnostics, and toward explicit
    safety and failure-mode analysis.'
  - 'Open questions: Cross-platform and cross-application generalization, reliable
    error recovery in long-horizon tasks, domain-consistent safety hardening, automatic
    construction of multimodal skill libraries, resource cost of online training,
    and independent reproducibility across teams.'
  related_work_outline_zh:
  - 主流方向：构建可端到端训练的GUI代理系统，利用在线强化学习和大规模截图数据，并强调开源框架和可复现的部署栈。
  - 研究共性：所有工作都依赖视觉理解和多轮交互，以截图或视觉输入为基础，在真实或模拟环境中训练或评估代理，常结合监督初始化和强化学习。
  - 关键差异：训练数据规模（弱监督 vs 大规模标注）、交互抽象层（原生截图 vs 工具/API）、评估目标（端到端任务成功 vs 细粒度诊断）、安全关注范围（仅浏览器
    vs 跨领域）。
  - 趋势演进：在2024–2026年前沿，领域从离线基准转向在线实时训练，从专有模型转向开源框架，从单一成功指标转向多维度诊断，并开始显式分析安全性和失败模式。
  - 开放问题：跨平台和跨应用泛化、长时程任务中的可靠错误恢复、跨领域一致的安全加固、多模态技能库的自动构建、在线训练的资源成本、以及跨团队的独立可复现性。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end training frameworks and deployment stacks
      what_it_solves: Enables closed-loop training of GUI agents directly in real
        or simulated environments, bridging the gap between model development and
        deployment. Representative works include OpenForgeRL and OpenWebRL, which
        provide Kubernetes-based orchestration and proxy-based data recording for
        RL training without modifying agent harnesses.
      what_remains_open: Error recovery remains weak even after RL training; some
        harnesses are significantly harder to learn, implying that harness design
        strongly influences trainability and generalization across environments.
    - line: Multimodal skill libraries and knowledge injection
      what_it_solves: Improves agent performance by providing retrievable, hierarchical
        skill artifacts that retain visual figures alongside text, as demonstrated
        by VISUALSKILL. This helps UI element identification and workflow state verification.
      what_remains_open: Automated construction of skill libraries for new applications,
        dynamic updating during task execution, and generalization beyond the set
        of documented applications.
    - line: Weakly supervised and data-efficient training
      what_it_solves: Reduces reliance on expensive human annotations by leveraging
        massive unannotated screenshots and webpages for visual grounding, as shown
        by GUICrafter. It achieves competitive performance with only 0.1% of the data
        used by comparable methods.
      what_remains_open: Performance gap to fully unsupervised settings, coverage
        of complex multi-step tasks, and the quality of the automatically learned
        visual grounding signals.
    - line: Native computer-use agents
      what_it_solves: Interacts with the digital world using only screenshots and
        keyboard/mouse events, eliminating the need for DOM trees or accessibility
        metadata. Qwen-CUA demonstrates this approach scales to large mixture-of-experts
        models and achieves strong results on diverse benchmarks.
      what_remains_open: Safety remains domain-conditioned (attack success rate reduced
        but not eliminated), and long-horizon autonomous task execution still lacks
        robust error recovery.
    - line: Diagnostic benchmarks and fine-grained evaluation
      what_it_solves: Moves beyond end-task success to isolate specific failure dimensions
        such as state verification, source tracking, and context-aware control. Desktop-Delta
        Bench provides offline, step-level diagnostic tasks for GUI transition understanding.
      what_remains_open: Offline benchmarks cannot capture real-time dynamics, asynchronous
        timing, or live interaction delays; current scope is limited to Linux desktops
        and five action types, leaving other OS and interaction vocabularies unevaluated.
    - line: Security evaluation and red-teaming
      what_it_solves: Assesses the safety of computer-using agents against prompt
        injection and skill injection attacks. A 793-episode benchmark reveals that
        frontier CUAs resist hand-crafted browser attacks but fail on coding tasks,
        indicating domain-conditioned safety.
      what_remains_open: Reproducibility of RL-optimized injection strings from prior
        work has not been audited; safety hardening does not generalize across domains,
        and broader attack surfaces beyond browser and coding remain unexplored.
    - line: Failure-mode analysis and action-grounded memory
      what_it_solves: Diagnoses the root causes of GUI agent failures, such as hidden
        operation blindness and grounding errors, and proposes structured memory frameworks
        like AGMem that store action-grounded image crops instead of full screenshots.
      what_remains_open: Generalizability of the memory framework to diverse workflows
        and environments, and whether the observed failure distribution holds across
        different agent architectures and training paradigms.
    consensus:
    - Online multi-turn interaction and reinforcement learning are becoming the dominant
      paradigm for training capable GUI agents, moving beyond static supervised fine-tuning.
    - Visual input, particularly screenshots, is a necessary foundation, but the optimal
      level of abstraction (raw pixels vs. accessibility metadata) remains debated.
    - Open-source frameworks and reproducible training pipelines are increasingly
      prioritized to enable community-wide progress and independent verification.
    - Evaluation is expanding from single-dimension task success rates to include
      fine-grained diagnostics, safety, and failure-mode analysis.
    disagreements:
    - 'Training data scale: some methods rely on massive weakly or unannotated data
      (GUICrafter), while others still require large-scale high-quality annotations
      (Qwen-CUA).'
    - 'Interaction abstraction: native screenshot-based agents (Qwen-CUA) contrast
      with harness-mediated agents that use tools or APIs (OpenForgeRL, OpenWebRL),
      affecting portability and trainability.'
    - 'Evaluation setting: offline diagnostic benchmarks (Desktop-Delta Bench) provide
      controlled analysis but miss real-time dynamics, whereas online live benchmarks
      (Online-Mind2Web, DeepShop) capture real-world complexity but are harder to
      standardize.'
    - 'Safety scope: safety evaluations currently focus on browser tasks (CUA-HandCrafted)
      and show brittle cross-domain transfer, leaving open the question of how to
      build consistently safe agents across all application domains.'
    open_questions:
    - How can agents generalize across operating systems and applications without
      requiring extensive retraining or manual skill library construction?
    - What mechanisms can reliably recover from errors in long-horizon tasks, given
      that current RL-trained agents still exhibit weak error recovery?
    - How can safety hardening be made domain-consistent, so that improvements in
      browser safety do not leave coding or other domains vulnerable to simple injection
      attacks?
    - What are the trade-offs between online training resource consumption and agent
      performance, and can efficient training methods reduce the current need for
      tens of thousands of vCPUs?
    - To what extent do the reported results replicate across independent teams, datasets,
      and infrastructure environments, given that many systems lack publicly available
      code and standardized evaluation protocols?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端训练框架与部署栈
      解决的问题: 在真实或模拟环境中闭环训练GUI代理，弥合模型开发与部署之间的鸿沟。代表性工作如OpenForgeRL和OpenWebRL，通过Kubernetes编排和代理数据记录实现RL训练，无需修改代理工具。
      尚未覆盖: 即使经过RL训练，错误恢复仍然薄弱；某些工具比其他工具更难学习，表明工具设计对可训练性和跨环境泛化有显著影响。
    - 路线: 多模态技能库与知识注入
      解决的问题: 通过提供可检索的分层技能工件，在文本旁保留视觉图形，提升代理性能，如VISUALSKILL所示，有助于UI元素识别和工作流状态验证。
      尚未覆盖: 新应用的技能库自动构建、任务执行期间的动态更新，以及超出已记录应用集合的泛化能力。
    - 路线: 弱监督与数据高效训练
      解决的问题: 利用海量未标注截图和网页进行视觉定位，减少对昂贵人工标注的依赖，如GUICrafter仅用可比方法0.1%的数据即达到竞争性能。
      尚未覆盖: 完全无监督设置的性能差距、复杂多步任务的覆盖范围，以及自动学习的视觉定位信号的质量。
    - 路线: 原生计算机使用代理
      解决的问题: 仅通过截图和键盘/鼠标事件与数字世界交互，无需DOM树或可访问性元数据。Qwen-CUA展示该方法可扩展到大型混合专家模型，并在多个基准上取得强结果。
      尚未覆盖: 安全性仍是领域条件的（攻击成功率降低但未消除），长时程自主任务执行仍缺乏鲁棒的错误恢复。
    - 路线: 诊断基准与细粒度评估
      解决的问题: 超越端任务成功，隔离特定失败维度，如状态验证、源跟踪和上下文感知控制。Desktop-Delta Bench提供离线步骤级诊断任务，测试GUI过渡理解。
      尚未覆盖: 离线基准无法捕捉实时动态、异步时序或实时交互延迟；当前范围仅限于Linux桌面和五种动作类型，其他操作系统和交互词汇尚未评估。
    - 路线: 安全性评估与红队测试
      解决的问题: 评估计算机使用代理抵抗提示注入和技能注入攻击的能力。一个793轮次基准表明前沿CUA能抵抗手工制作的浏览器攻击，但在编码任务上失败，表明领域条件安全性。
      尚未覆盖: 此前工作的RL优化注入字符串的可复现性未经验证；安全加固不能跨领域泛化，且浏览器和编码之外的攻击面尚未探索。
    - 路线: 失败模式分析与动作接地记忆
      解决的问题: 诊断GUI代理失败的根本原因，如隐藏操作盲区和接地错误，并提出结构化记忆框架如AGMem，存储动作接地的图像裁剪而非完整截图。
      尚未覆盖: 记忆框架对多样化工作流和环境的通用性，以及观察到的失败分布是否在不同代理架构和训练范式下成立。
    共识:
    - 在线多轮交互和强化学习正成为训练强大GUI代理的主导范式，超越了静态监督微调。
    - 视觉输入，尤其是截图，是必要的基础，但最优抽象层次（原始像素 vs. 可访问性元数据）仍存在争议。
    - 开源框架和可复现的训练流水线越来越受到重视，以推动社区进步和独立验证。
    - 评估正从单一维度的任务成功率扩展到包括细粒度诊断、安全性和失败模式分析。
    分歧:
    - 训练数据规模：部分方法依赖海量弱标注或无标注数据（GUICrafter），而其他方法仍需要大规模高质量标注（Qwen-CUA）。
    - 交互抽象：原生基于截图的代理（Qwen-CUA）与使用工具或API的代理（OpenForgeRL、OpenWebRL）形成对比，影响可移植性和可训练性。
    - 评估设置：离线诊断基准（Desktop-Delta Bench）提供可控分析但缺失实时动态，而在线实时基准（Online-Mind2Web、DeepShop）捕捉真实复杂性但难以标准化。
    - 安全范围：安全性评估目前集中在浏览器任务（CUA-HandCrafted），并显示出脆弱的跨领域迁移，如何构建在所有应用领域一致安全的代理仍是开放问题。
    开放问题:
    - 代理如何在不同操作系统和应用间泛化，而无需大量重新训练或人工构建技能库？
    - 鉴于当前RL训练的代理仍表现出弱错误恢复，什么机制能在长时程任务中可靠地从错误中恢复？
    - 如何使安全加固在不同领域保持一致，从而避免浏览器安全改进后编码等其他领域仍易受简单注入攻击？
    - 在线训练资源消耗与代理性能之间的权衡是什么，高效训练方法能否减少当前对数万vCPU的需求？
    - 鉴于许多系统缺乏公开代码和标准化评估协议，已有结果在多大程度上能在独立团队、数据集和基础设施环境下复现？
