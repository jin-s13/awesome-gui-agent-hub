      what_remains_open: Evaluations are single-step or controlled shortcuts, with
        limited dataset sizes and weak cross-model or cross-interface transfer.
    consensus:
    - Most work evaluates on task completion or grounding benchmarks and reports gains
      relative to strong VLM or agent baselines.
    - There is convergence on using interaction evidence such as screenshots, accessibility
      trees, action outcomes, and repeated runs to supervise, diagnose, or score agent
      behavior.
    - Several approaches improve agents without solely scaling model size, by optimizing
      data, context, harness, keyframes, or action scoring around a backbone.
    - Reliability, calibration, and long-horizon behavior are increasingly treated
      as first-class evaluation targets, not only single-step accuracy.
    disagreements:
    - 'Action interface differs: latent action scoring, decoded action text, context-management
