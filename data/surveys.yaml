  literature_review:
    line_of_work_matrix:
    - line: Task and interface formalization for GUI evaluation
      what_it_solves: Defines GUI-agent capabilities across desktop, dynamic short-video,
        drag-based, and GUI+CLI tasks; introduces fine-grained executable checks and
        capability annotations, for example through MacAgentBench, DragOn, and LivingScreen.
      what_remains_open: Whether these formal task boundaries and scoring rules predict
        realistic model behavior outside the curated benchmark environments.
    - line: Scalable training, verifiable synthesis, and weak supervision
      what_it_solves: Lowers human annotation demand and improves sample efficiency
        through verifiable computer-use task synthesis, online RL, and weakly supervised
        visual grounding from unannotated screens, as in ScaleCUA and GUICrafter.
      what_remains_open: No direct evidence that policies trained this way remain
        calibrated or predict failure under interface distribution shift.
    - line: Multimodal skills and proactive context management
      what_it_solves: Organizes agent knowledge into hierarchical and retrievable
        artifacts that retain visual information or emit context-management actions,
        supporting long-horizon workflows, for example VISUALSKILL and MemGUI-Agent.
      what_remains_open: Whether these organizational schemes influence design beyond
        benchmark accuracy; boundaries between useful retrieval, overwriting, and
        observation control remain unformalized.
    - line: Uncertainty quantification and reliability framing
      what_it_solves: Benchmarks post-hoc uncertainty for GUI grounding and exposes
        failure modes such as over/under-observation and weak cross-tier uncertainty
        transfer, for example Argus and LivingScreen.
      what_remains_open: Single-step grounding uncertainty and task-specific failure
        taxonomies have not been connected to trajectory-level safety or formal reliability
        guarantees.
    consensus:
    - GUI competence is represented through task suites with fine-grained executable
      scoring rather than only end-to-end success.
    - Visual grounding and skill retrieval are treated as core mechanisms for improving
      computer-use agent reliability.
    - There is a shift toward reducing supervision cost and increasing sample efficiency
      via synthetic task generation, online RL, or weak supervision.
    - 'Dynamic and long-horizon reliability is separated into observable failure modes:
      observation control, context management, and uncertainty calibration.'
    disagreements:
    - 'Representation differs: one line uses hierarchical text topic skills, while
      another retains visual figures in skill artifacts, changing how UI localization
      and workflow state are verified.'
    - 'Training signal differs: verifiable synthetic tasks with online RL assume task
      executability and reward, while weakly supervised visual grounding assumes large
      unannotated screen evidence; these assumption sets do not align.'
    - 'Evaluation scope differs: some benchmark desktop/macOS or mobile workflows,
      others isolate dynamic short-video or drag-based interaction; coverage and deployment
      settings therefore disagree on what general GUI competence means.'
    - 'Reliability evaluation differs: post-hoc uncertainty quantification is evaluated
      on single-step GUI grounding, while context and observation control are evaluated
