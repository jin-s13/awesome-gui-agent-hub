  related_work_outline_zh:
  - 主流方向：2024-2026年的证据以原始GUI智能体方法和基准论文为主，而非独立综述文章；主导方向是通过可扩展任务合成、执行框架优化、密集监督和可靠性评测来提升泛化能力。
  - 研究共性：多数工作围绕冻结或可训练的视觉语言模型添加新数据、环境或控制机制，然后报告留出集、特定基准或迁移能力提升。
  - 关键差异：论文在监督信号、策略表示、评测目标和部署设置上存在差异；有的依赖在线RL或harness编辑，有的依赖监督微调、潜在评分或掩码欺诈基准。
  - 趋势演进：在2024-2026这一较窄前沿期内，研究从静态GUI定位基准逐步转向可验证任务生成、自改进、主动上下文管理和效率导向策略。
  - 开放问题：证据缺口包括缺少代码、数据集、局限性说明，跨设置迁移有限，以及不同基准协议之间的可比较性不明确。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark and evaluation construction for GUI tasks
      what_it_solves: Creates controlled settings for video-guided GUI tasks, desktop
        grounding, mobile long-horizon tasks, and SMS-to-webpage fraud detection;
        supplies task completion or grounding metrics.
      what_remains_open: Comparability across benchmarks is uncertain when protocols,
        masks, and metrics differ; some artifacts lack code or dataset release details.
    - line: Scalable training and self-improvement
      what_it_solves: Uses verifiable task synthesis, online RL, dense desktop annotations,
        or evidence-driven harness edits to improve frozen or open GUI agents on OSWorld,
        ScienceBoard, and related suites.
      what_remains_open: Reproducibility is partly unverified because several records
        omit limitations or artifact links, and transfer claims rely on selected benchmarks.
    - line: Efficient action and context control
      what_it_solves: Addresses long-horizon and inference constraints through decoder-free
        latent candidate scoring or proactive context management, reducing parameter
        and compute cost while retaining much of a fine-tuned VLM's accuracy.
      what_remains_open: Latent policy accuracy still trails fine-tuned 7B VLM baselines
        and is tested mainly on AndroidControl; context management evidence is limited
        to specific mobile benchmarks.
    - line: Reliability and safety evaluation
      what_it_solves: Measures post-hoc uncertainty calibration across models and
        GUI grounding datasets, and tests fraud judgment when URL and reputation shortcuts
        are hidden.
      what_remains_open: Uncertainty ranking transfers poorly across model classes
        and interfaces; fraud benchmark suppresses real-world shortcuts and covers
        a small case set, leaving deployment relevance unresolved.
    consensus:
    - GUI-agent contributions commonly add an external mechanism around a frozen or
      fine-tuned MLLM/VLM backbone rather than replacing it.
    - Progress is measured mainly by benchmark-specific task completion or grounding
      accuracy, often with held-out or out-of-distribution transfer claims.
    - Evaluation protocols are increasingly controlled by sanitizing evidence, suppressing
      shortcuts, or standardizing environment interactions.
    - Public release of data, code, or per-item records is treated as important but
      is unevenly reported.
    disagreements:
    - Supervision ranges from online RL with verifiable tasks to supervised fine-tuning
      from dense annotations to frozen-model harness optimization.
    - Policy representation varies between decoding textual actions and scoring candidate
      actions in a latent joint-embedding space.
    - 'Evaluation target differs: single-step GUI grounding, long-horizon task completion,
      video-guided interaction, and fraud judgment under masked reputation cues.'
    - Deployment setting differs across mobile, desktop, web and SMS-to-webpage, and
      closed-source versus open-weight models, with different interface assumptions.
    open_questions:
    - Which gaps in GUI-agent evaluation are most important when benchmarks differ
      in mask protocols and metrics?
    - Do improvements on OSWorld, ScienceBoard, AndroidControl, or MemGUI-Bench transfer
      to broader real-world or multi-step settings, given selective UQ transfer and
      limited out-of-distribution evidence?
    - What reproducibility standards are missing when papers report SOTA gains but
      omit code, dataset, or limitation details?
    - Can efficient latent policies close the remaining accuracy gap to fine-tuned
      7B VLM agents without sacrificing generalization beyond AndroidControl?
    - How should surveys and roadmaps synthesize a field when primary papers are fast-moving
      and unevenly documented?
  literature_review_zh:
    研究路线矩阵:
    - 路线: GUI任务基准与评测构建
      解决的问题: 为视频引导GUI任务、桌面定位、移动长程任务和短信到网页欺诈检测建立受控设置，并给出任务完成或定位指标。
      尚未覆盖: 不同基准在协议、掩码和指标上的可比性不确定；部分工件缺乏代码或数据集发布细节。
    - 路线: 可扩展训练与自改进
      解决的问题: 通过可验证任务合成、在线RL、密集桌面标注或证据驱动的harness编辑，提升冻结或开放的GUI智能体在OSWorld、ScienceBoard等套件上的表现。
      尚未覆盖: 若干记录缺少局限性或工件链接，可复现性未验证；迁移声明依赖选定基准。
    - 路线: 高效动作与上下文控制
      解决的问题: 通过无解码器潜在候选评分或主动上下文管理，缓解长程和推理约束，以较低参数与计算成本保留微调VLM的大部分精度。
      尚未覆盖: 潜在策略准确率仍低于微调7B VLM基线，且主要在AndroidControl测试；上下文管理证据限于特定移动基准。
    - 路线: 可靠性与安全评测
      解决的问题: 测量GUI定位上的后验不确定性校准，并在隐藏URL与信誉捷径时测试欺诈判断。
      尚未覆盖: 不确定性排序跨模型类别和接口迁移较弱；欺诈基准隐藏现实捷径且案例有限，部署相关性未解决。
    共识:
    - GUI智能体工作通常在冻结或微调的MLLM/VLM骨干之上添加外部机制，而非替换骨干。
    - 进展主要通过特定基准上的任务完成率或定位准确率衡量，并常附带留出集或分布外迁移声明。
    - 评测协议趋向受控化，包括净化证据、隐藏捷径或标准化环境交互。
    - 数据、代码或逐项记录的公开被视为重要，但报告程度不一。
    分歧:
    - 监督信号从基于可验证任务的在线RL，到密集标注的监督微调，再到冻结模型harness优化各不相同。
    - 策略表示分为解码文本动作和在联合嵌入潜空间中对候选动作评分两种。
    - 评测目标不同：单步GUI定位、长程任务完成、视频引导交互，以及隐藏信誉线索下的欺诈判断。
    - 部署设置跨移动、桌面、网页与短信到网页，以及闭源与开放权重模型存在差异，界面假设不同。
    开放问题:
    - 各基准在掩码协议和指标不同时，哪些GUI智能体评测缺口最值得优先解决？
    - 在OSWorld、ScienceBoard、AndroidControl或MemGUI-Bench上的改进，面对选择性UQ迁移和有限OOD证据，能否迁移到更广泛真实或多步场景？
    - 当论文报告SOTA提升但缺少代码、数据集或局限性细节时，哪些可复现性标准需要补齐？
    - 高效潜在策略能否在AndroidControl之外缩小与微调7B VLM智能体的精度差距并保持泛化？
    - 当原始论文快速变化且文档不均时，综述与路线图如何做系统综合？
