      across operating systems, applications, and interaction types without losing
      reliability?
    - What mechanism should agents use to decide how much screen observation is sufficient
      before acting in changing interfaces?
    - How should reusable skills, programs, or environments be updated when UI flows
      change, tasks shift, or screen states mismatch at runtime?
    - Which training or evaluation data formats such as drag trajectories, video-guided
      keyframes, web environment trajectories, or visual skill artifacts most improve
      generalization?
    - The packet leaves code, data, baselines, and limitations unspecified for some
      top methods, so reproducibility and robust comparison remain verification gaps.
