  literature_review:
    line_of_work_matrix:
    - line: Memory and skill reuse for computer-use agents
      what_it_solves: Encoding validated trajectories or multimodal procedural artifacts
        into reusable callable assets to reduce token/time cost and improve UI grounding.
      what_remains_open: Replay is constrained by deterministic applicability and
        rejection of ambiguous steps; generalization across applications and non-deterministic
        UI states remains lightly evidenced.
    - line: Annotation-efficient GUI agent training and generation paradigms
      what_it_solves: Reducing reliance on human-annotated GUI traces via weak supervision
        from unannotated screenshots or alternative diffusion-based generation.
      what_remains_open: Evidence is limited to selected baselines and benchmarks,
        explicit limitations are often missing, and real deployment or cross-platform
        transfer remains a verification gap.
    - line: Harness-native RL training and unified action orchestration
      what_it_solves: Training agents inside complex real-world inference harnesses
        and unifying GUI interaction with code execution in one action space.
      what_remains_open: Error recovery remains weak, trainability varies substantially
