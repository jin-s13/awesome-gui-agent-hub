  related_work_outline:
  - 'Mainstream direction: Building and benchmarking GUI agents that use vision-language
    models for real-world desktop and mobile tasks, with a shift from static click-based
    interactions to dynamic, drag-based, and long-horizon scenarios.'
  - 'Shared research pattern: Most works introduce a new benchmark or dataset to expose
    a capability gap (e.g., drag, dynamic screens, long-horizon memory), then propose
    a method or fine-tuning recipe that improves a VLM agent on that benchmark.'
  - 'Key differences: Papers differ in action space (click, drag, CLI), interface
    type (static vs. living-screen dynamic), supervision paradigm (weakly supervised,
    RL, supervised fine-tuning), and whether they focus on single-step grounding or
    multi-step planning.'
  - 'Trend evolution: Within 2024–2026, the frontier moved from broad desktop benchmarks
    towards more specialized, real-world interactive settings (macOS, short-video
    platforms) and from static demo tasks to online RL with verifiable task synthesis.'
  - 'Open questions: (1) How to transfer UQ and uncertainty-aware planning across
    model tiers and interfaces; (2) how to endow agents with observation control for
    dynamic screens; (3) how to scale drag and multi-modal action spaces without exhaustive
    annotation.'
  related_work_outline_zh:
  - 主流方向：构建和评估使用视觉语言模型的GUI代理，用于真实桌面和移动任务，趋势从静态点击交互转向动态、拖拽和长时程场景。
  - 研究共性：多数工作提出新基准或数据集来暴露能力缺口（如拖拽、动态屏幕、长时程记忆），然后提出改进VLM代理在该基准上表现的方法或微调方案。
  - 关键差异：论文在动作空间（点击、拖拽、CLI）、界面类型（静态 vs. 动态屏幕）、监督范式（弱监督、RL、监督微调）以及关注单步定位还是多步规划上存在差异。
  - 趋势演进：2024–2026年间，前沿从通用桌面基准转向更专业、真实世界交互设置（macOS、短视频平台），并从静态演示任务转向在线RL与可验证任务合成。
  - 开放问题：（1）如何跨模型层级和界面迁移不确定性量化与不确定性感知规划；（2）如何赋予代理对动态屏幕的观察控制能力；（3）如何在不依赖大量标注的前提下扩展拖拽及多模态动作空间。
  literature_review:
    line_of_work_matrix:
    - line: Method representation and objective design
      what_it_solves: Designing training objectives, data sources, and model architectures
        that turn visual observations into GUI actions, reducing reliance on expensive
        human annotations.
      what_remains_open: Whether weakly supervised, RL-based, or context-management
        methods generalize beyond the specific benchmark platforms and task templates
        used for training.
    - line: Planning and action-interface methods
      what_it_solves: Connecting learned grounding to multi-step planning, long-horizon
        memory, and diverse action spaces (click, drag, CLI) that reflect real-world
        computer use.
      what_remains_open: How much of the gain comes from the action interface design
        versus the underlying model capability, and how to handle observation control
        in dynamic interfaces.
    - line: Method evidence and ablation protocol
      what_it_solves: Establishing rigorous benchmarks and evaluation protocols that
        isolate method contributions from dataset, baseline, and metric effects.
      what_remains_open: Whether reported improvements transfer across model tiers,
        interfaces, and from single-step grounding to full multi-step trajectories,
        especially under distribution shift.
    consensus:
    - Vision-language models are the dominant backbone for GUI agents, and fine-tuning
      on task-specific data substantially improves performance.
    - Fine-grained, capability-annotated metrics (e.g., sub-goal completion, cost-accuracy)
      reveal model weaknesses that pass@1 alone obscures.
    - Real-world GUI tasks require handling diverse action types, dynamic content,
      and long interaction horizons, which existing agents do not yet master.
    disagreements:
    - 'Action space coverage: some works focus on click-only grounding while others
      push for drag, CLI, and context-management actions, leading to different evaluation
      protocols and dataset designs.'
    - 'Supervision strategy: approaches range from large-scale weakly supervised learning
      from unlabeled screenshots to online RL with verifiable task synthesis, with
      no consensus on the most sample-efficient path.'
    - 'Evaluation target: some benchmarks target single-step grounding accuracy, others
      multi-step task completion, and still others uncertainty quality, making cross-work
      comparison difficult.'
    open_questions:
    - How can post-hoc uncertainty quantification methods be extended from single-step
      grounding to sequential decision-making without recalibration?
    - What is the minimal annotation budget needed to train a GUI agent that generalizes
      across operating systems, action spaces, and dynamic interfaces?
    - How can agents learn to actively control their observation rate and information
      intake in living-screen environments where content changes between actions?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 方法表示与目标设计
      解决的问题: 设计将视觉观察转化为GUI动作的训练目标、数据源和模型架构，减少对昂贵人工标注的依赖。
      尚未覆盖: 弱监督、基于RL或上下文管理的方法是否能泛化到训练时使用的特定基准平台和任务模板之外。
    - 路线: 规划与动作接口方法
      解决的问题: 将学习到的定位能力与多步规划、长时程记忆和多样化的动作空间（点击、拖拽、CLI）连接，反映真实计算机使用。
      尚未覆盖: 收益有多少来自动作接口设计而非底层模型能力，以及如何处理动态界面中的观察控制。
    - 路线: 方法证据与消融协议
      解决的问题: 建立严格的基准和评估协议，隔离方法贡献与数据集、基线和指标效应。
      尚未覆盖: 报告的性能提升是否能在不同模型层级、接口以及从单步定位到完整多步轨迹之间迁移，尤其是在分布偏移下。
    共识:
    - 视觉语言模型是GUI代理的主要骨干，针对特定任务的数据进行微调可显著提升性能。
    - 细粒度、带能力标注的指标（如子目标完成度、成本-准确性）揭示了单纯的pass@1所掩盖的模型弱点。
    - 真实世界的GUI任务需要处理多样的动作类型、动态内容和长交互时程，现有代理尚未完全掌握。
    分歧:
    - 动作空间覆盖：一些工作侧重仅点击的定位，而另一些则推动拖拽、CLI和上下文管理动作，导致不同的评估协议和数据集设计。
    - 监督策略：方法范围从利用未标注截图的大规模弱监督学习，到具有可验证任务合成的在线RL，关于哪种路径在样本效率上最优尚无共识。
    - 评测目标：一些基准测试目标为单步定位准确率，另一些为多步任务完成，还有的为不确定性质量，使跨工作比较变得困难。
    开放问题:
    - 如何将后验不确定性量化方法从单步定位扩展到序列决策，而无需重新校准？
    - 训练一个能在操作系统、动作空间和动态界面间泛化的GUI代理的最小标注预算是多少？
    - 在内容在动作之间变化的动态屏幕环境中，代理如何学习主动控制其观察速率和信息摄入？
