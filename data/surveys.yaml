    agents, then improves agents through skills, context, weak supervision, or verifiable
    RL rather than standalone pure theory.'
  - 'Shared research pattern: Studies converge on executable environment-based evaluation
    with fine-grained intermediate scoring, frontier-model baselines, and failure
    attribution to observation, grounding, or context retention.'
  - 'Key differences: Interaction unit, training signal, and reliability target differ:
    drag/click/type/GUI+CLI/dynamic screens/mobile long horizon; weak screenshots,
    verifiable online RL, SFT context actions, multimodal skills; uncertainty calibration,
    cost-accuracy, or sub-goal success.'
  - 'Trend evolution: Within 2024–2026, the frontier shifts from static click/type
    benchmarks toward dynamic interfaces, multimodal skill artifacts, verifiable task
    synthesis, uncertainty quantification, and proactive long-horizon context management.'
  - 'Open questions: Benchmark-to-deployment transfer, multi-step reliability guarantees,
    uncertainty under distribution shift, and minimal-annotation regimes remain unproven;
    several sampled records have empty limitation fields or weak artifact evidence.'
  related_work_outline_zh:
  - 主流方向：理论标签下采样证据以基准和方法为中心：形式化GUI/计算机使用智能体的任务套件、交互模式与指标，并通过技能、上下文、弱监督或可验证RL改进智能体，而非独立纯理论。
  - 研究共性：研究汇聚于基于可执行环境的评测，使用细粒度中间评分和前沿模型基线，并将失败归因于观察、定位或上下文保留。
  - 关键差异：交互单元、训练信号与可靠性目标不同：拖拽/点击输入/GUI+CLI/动态屏幕/移动端长时域；弱监督截图、可验证在线RL、上下文动作SFT、多模态技能；不确定性校准、成本-准确率或子目标成功。
  - 趋势演进：2024–2026年前沿内，研究从静态点击/输入评测转向动态界面、多模态技能工件、可验证任务合成、不确定性量化和主动长时域上下文管理。
  - 开放问题：基准到部署迁移、多步可靠性保证、分布偏移下的不确定性以及最小标注机制仍未证明；部分采样记录局限为空或工件证据较弱。
  literature_review:
    line_of_work_matrix:
    - line: Task and interaction abstraction benchmarks
      what_it_solves: Define executable task suites and metrics for macOS GUI+CLI,
        drag interactions, dynamic short-video screens, and GUI grounding, exposing
        capability and observation gaps.
      what_remains_open: Evidence is platform/action-specific; sampled limitations
        often omit boundary conditions, and benchmark gains are not yet tied to real
        deployment reliability.
    - line: Reliability and uncertainty quantification
      what_it_solves: Formalizes post-hoc uncertainty for GUI grounding and constructs
        conformal click regions to quantify spatial safety of predictions.
      what_remains_open: Current evidence covers only single-step grounding; cross-model/interface
        transfer is weak and conformal coverage degrades under distribution or interface
        shift.
    - line: Skill and context management
      what_it_solves: Organizes multimodal skill artifacts and proactive context actions
        to reduce observation and history failures in long-horizon or complex computer-use
        tasks.
      what_remains_open: Evaluation is limited to selected benchmarks and model families;
        long-horizon generalization beyond reported tasks is not yet established.
    - line: Data-efficient training and verifiable RL
      what_it_solves: Reduces annotation dependence through unannotated screenshots,
        verifiable task synthesis, or frontier-sampled online RL to improve policy
        performance.
      what_remains_open: Limitations are often not reported; improvements depend on
        benchmark and framework choices, and comparable-budget robustness is not demonstrated.
    consensus:
    - Executable environments and fine-grained intermediate scoring are becoming the
      default evaluation practice instead of end-task success alone.
    - Task-specific structure—skills, context fields, or interaction abstractions—is
      repeatedly identified as necessary for stronger GUI agent behavior.
    - Observation control and context retention are shared failure modes across dynamic
      and long-horizon settings.
    disagreements:
    - 'Interaction abstraction differs: drag-only grounding, GUI+CLI multi-app tasks,
      dynamic living screens, and mobile long-horizon context actions.'
    - 'Training signal differs: weak visual supervision from unannotated screenshots,
      verifiable online RL with synthesized tasks, SFT with context actions, and retrieval
      of multimodal skills.'
    - 'Evaluation target differs: OSWorld/ScienceBoard success, cost-accuracy on short-video
      platforms, sub-goal completion, drag grounding accuracy, and uncertainty ranking
      stability/coverage.'
    - 'Reliability focus differs: single-step conformal spatial safety versus long-horizon
      context management versus benchmarking observation control gaps.'
    open_questions:
    - Can benchmark-specific improvements transfer to unseen interfaces and deployment
      conditions when distribution and interface shift occur?
    - Can uncertainty calibration and conformal coverage be extended from single-step
      grounding to multi-step trajectories?
    - Which training signal or interaction abstraction generalizes under equal data/annotation
      budgets across drag, dynamic, GUI+CLI, and long-horizon tasks?
    - Why do many sampled records lack limitation details or artifact evidence, and
      how much does that inflate apparent reproducibility?
