  literature_review:
    line_of_work_matrix:
    - line: Real-world desktop and dynamic GUI benchmarking
      what_it_solves: Defines task suites and scoring for reproducible evaluation
        of GUI agents on desktop, dynamic interface, video-guided, and drag-based
        tasks.
      what_remains_open: Coverage is constrained to selected platforms/domains; dynamic-interface
        agents still lack human-level cost-accuracy and active observation control.
    - line: Procedural memory and skill reuse
      what_it_solves: Captures reusable multimodal skills or compiles successful runs
        into state-machine programs to reduce repeated reasoning cost and speed up
        later execution.
      what_remains_open: Robustness to changing UI states, applications, and workflows,
        plus evidence of transfer beyond the evaluated benchmarks, is not yet established.
    - line: Scalable environment and data generation
      what_it_solves: Reconstructs source-grounded reusable web environments and interaction
        trajectories from real URLs, enabling agent fine-tuning and evaluation from
        wild web content.
      what_remains_open: Per-site setup and authorization are required, and alignment
        between reconstructed environments and live professional workflows is under-evidenced.
    - line: Model architecture and perception primitives for GUI grounding
      what_it_solves: Improves GUI grounding and navigation via diffusion vision-language
        agents, task-driven keyframe extraction, or drag-specific vision-language
        fine-tuning.
      what_remains_open: Cross-platform generality, efficiency-accuracy tradeoffs,
        and transfer to unseen applications or interaction primitives remain unresolved.
    consensus:
    - Evaluation increasingly moves beyond overall success to fine-grained sub-goal,
      multi-checkpoint, or cost-accuracy scoring.
    - Visual and multimodal inputs or artifacts such as screenshots, UI figures, and
      video frames are treated as necessary for grounding and workflow state verification.
    - Supplying reusable procedural knowledge, replay, or large training trajectories
      improves agent performance or efficiency over per-step model calls alone.
    - Similar overall success can hide substantial differences in sub-goal completion
      and observation efficiency.
    - No evaluated system reaches robust human-level performance across all covered
      interface types; limitations are often underreported.
    disagreements:
    - 'Evaluation target differs: real desktop GUI+CLI suites, dynamic short-video
      interfaces, video-guided tasks, drag-only interactions, and web tasks.'
    - 'Performance mechanism differs: external multimodal skill library, compiled
      state-machine replay, environment/data generation, or vision-language model
      architecture.'
    - 'Supervision and evaluation signal differs: deterministic rule-based scoring,
      task cost-accuracy, VideoQA metrics, grounding/navigation benchmarks, and fine-tuning
      transfer.'
    - 'Deployment setting differs: macOS desktop, browser-based dynamic platforms,
      real-URL website reconstructions, and mobile/desktop/web grounding benchmarks.'
    open_questions:
    - How do gains observed on one benchmark transfer across operating systems, applications,
      dynamic content, and professional tool workflows?
    - What architectural or policy changes give agents active observation control
      in living interfaces where content changes between actions?
    - How robust are stored skills and replayed state machines to UI layout changes,
      state changes, login walls, or workflow variations?
    - Do reconstructed web environments and generated trajectories preserve the failure
      modes and safety constraints of live real-world deployments?
    - Given that several papers omit code, datasets, baselines, or limitations, which
      reported gains are attributable to artifacts or training data rather than general
      agent capability?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 真实桌面与动态界面的GUI基准评测
      解决的问题: 定义任务套件和评分方式，从而可重复地评估桌面、动态界面、视频引导和拖拽类GUI代理。
      尚未覆盖: 覆盖范围受限于所选平台/领域；动态界面代理在成本-准确性上仍低于人类水平，且缺乏主动观察控制。
    - 路线: 程序性记忆与技能复用
      解决的问题: 捕获可复用的多模态技能，或将成功运行编译为状态机程序，以降低重复推理成本并加速后续执行。
      尚未覆盖: 对UI状态、应用和工作流变化的鲁棒性，以及跨评测基准的迁移证据尚未充分建立。
    - 路线: 可扩展环境与数据生成
      解决的问题: 从真实URL重建源对应的可复用网页环境和交互轨迹，支持从真实网页内容进行智能体评测和微调。
      尚未覆盖: 每个站点需要初始设置与授权；重建环境与线上真实工作流/专业工具的一致性证据不足。
    - 路线: 面向GUI grounding与导航的模型架构与感知原语
      解决的问题: 通过扩散视觉语言代理、任务驱动关键帧提取或拖拽特定视觉语言微调，改善GUI定位与导航能力。
      尚未覆盖: 跨平台泛化、效率与精度的权衡，以及向未见应用或交互原语的迁移仍未解决。
