  - 'Trend evolution: Evidence from 2024-2026, mostly 2026, shows movement from click-focused
    benchmarks toward dynamic and multimodal interactions, fine-grained sub-goal or
    cost-accuracy scoring, and early safety and reliability framing.'
  - 'Open questions: Whether fine-grained metrics, uncertainty estimates, and skill
    or harness gains transfer across platforms and multi-step trajectories; how verifiable
    or weakly supervised training predicts failures under distribution shift; how
    to formalize observation control and continuous actions comprehensively.'
  related_work_outline_zh:
  - 主流方向：2026年前沿集中在GUI/计算机使用代理的评测与能力提升，通过更丰富的任务集和外部技能或执行框架修改，保持视觉语言骨干冻结或采用数据高效、可验证信号训练。
  - 研究共性：论文通常先形式化任务或交互边界，构建基准或工件，再用成功或细粒度指标衡量；提升来自子目标评分、多模态技能、执行框架演进、弱监督或不确定性校准。
  - 关键差异：评测目标从静态桌面任务到动态短视频界面和拖拽交互不等；提升机制包括外部技能、执行框架编辑、在线强化学习、弱监督和后验不确定性，而不是统一方法。
  - 趋势演进：2024-2026年证据集中在2026年，显示从点击式基准转向动态与多模态交互、细粒度子目标或成本-准确性评分，以及早期安全与可靠性框架。
  - 开放问题：细粒度指标、不确定性估计和技能或框架收益能否跨平台及多步轨迹迁移；可验证或弱监督训练如何预测分布偏移下的失败；如何形式化观察控制与连续动作覆盖。
  literature_review:
    line_of_work_matrix:
    - line: Formalizing GUI task boundaries and fine-grained evaluation
      what_it_solves: Defines executable task suites, multi-application sub-goals,
        and scoring rules to compare GUI agents beyond binary success.
      what_remains_open: Coverage remains skewed toward selected desktop, short-video,
        or drag settings; cross-platform and cross-task generalization is not established.
    - line: Externalized capability through skill and harness artifacts
      what_it_solves: Improves frozen vision-language agents by adding multimodal
        skill libraries or evolving execution harnesses from observed failures.
      what_remains_open: Reported gains are benchmark-specific; transfer depends on
        repeated runs, application coverage, and whether harness edits hold across
        new backbones.
    - line: Data-efficient and verifiable training for GUI grounding
      what_it_solves: Reduces expensive annotation by using unannotated screenshots
        or synthesized verifiable tasks, often with reinforcement-learning calibration.
      what_remains_open: Limited evidence on predicting failure modes, transfer outside
        OSWorld/ScienceBoard, and robustness of synthesized task distributions.
    - line: Uncertainty and reliability quantification for grounding
      what_it_solves: Produces post-hoc confidence rankings and conformal click regions
        to support selective deployment and spatial safety for GUI grounding.
      what_remains_open: Benchmark evidence covers single-step grounding only; multi-step
        trajectories, closed-source transfer, and distribution-shift coverage remain
        unresolved.
    - line: Continuous and dynamic interaction formalization
      what_it_solves: Expands GUI-agent scope from clicks to drag-based actions and
        dynamic content where interfaces change between actions.
      what_remains_open: Observation-control capability is missing in current models;
        dynamic and continuous interaction coverage is not yet generalized across
        interface types.
    consensus:
    - GUI-agent research is converging on fine-grained, rule-based or cost-aware evaluation
      rather than only end-to-end binary success.
    - Frozen vision-language backbones can be improved by external artifacts such
      as multimodal skills, harness edits, or post-hoc uncertainty without always
      retraining.
    - 'Data and task coverage matter: large unannotated corpora, verifiable task synthesis,
      and multi-application benchmarks are treated as key scaling inputs.'
    - Reliability and safety appear as a distinct evaluation axis, but current evidence
      mostly addresses single-step grounding rather than full trajectories.
    disagreements:
    - 'Evaluation target: single-step GUI grounding versus multi-step desktop tasks
      versus dynamic short-video tasks versus drag-only interactions.'
    - 'Deployment mechanism: external skill retrieval versus executable harness optimization
      versus online reinforcement-learning updates versus weakly supervised fine-tuning.'
    - 'Supervision and scoring: deterministic rule-based checkpoints versus cost-accuracy
      against human performance versus verifiable reward signals versus confidence
      calibration.'
    - 'Representation of auxiliary knowledge: multimodal figures retained in skill
      artifacts versus text-only skills versus learned policies versus conformal click
      regions.'
    - 'Assumed bottleneck: annotation cost versus observation control versus failure
      diagnosis from repeated runs versus uncertainty transfer across model classes.'
    open_questions:
    - How should GUI-agent evaluation combine task success, sub-goal completion, information
      cost, and uncertainty into a reliable deployment score?
    - Which findings transfer beyond the specific desktop, short-video, or drag-based
      benchmarks used in the evidence?
    - Can harness or skill improvements remain stable across new backbones, applications,
      and interfaces without re-optimization?
    - How can verifiable or weakly supervised training predict failure modes under
      distribution shift rather than only improving average benchmark scores?
    - What formal guarantees or calibration methods are needed for multi-step computer-use
      trajectories, not just single-step grounding?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 形式化GUI任务边界与细粒度评测
      解决的问题: 定义可执行任务套件、多应用子目标和评分规则，以超越二元成功来比较GUI代理。
      尚未覆盖: 覆盖仍偏向特定桌面、短视频或拖拽设置；跨平台和跨任务泛化尚未建立。
    - 路线: 通过技能与执行框架工件外置能力
      解决的问题: 通过添加多模态技能库或从观测失败中演化执行框架，提升冻结视觉语言代理。
      尚未覆盖: 报告收益依赖特定基准；迁移取决于重复运行、应用覆盖以及框架编辑在新骨干上是否成立。
    - 路线: 面向GUI定位的数据高效与可验证训练
      解决的问题: 用未标注截图或合成可验证任务降低昂贵标注，常用强化学习校准。
      尚未覆盖: 预测失败模式、在OSWorld/ScienceBoard之外迁移、以及合成任务分布的鲁棒性证据有限。
    - 路线: 面向定位的不确定性与可靠性量化
      解决的问题: 产生后验置信度排序和共形点击区域，支持GUI定位的选择性部署与空间安全。
      尚未覆盖: 基准证据仅覆盖单步定位；多步轨迹、闭源迁移和分布偏移覆盖仍未解决。
    - 路线: 连续与动态交互形式化
      解决的问题: 将GUI代理范围从点击扩展到拖拽操作和动作间内容变化的动态界面。
      尚未覆盖: 当前模型缺乏观察控制能力；动态和连续交互覆盖尚未泛化到各类界面。
    共识:
    - GUI代理研究正在收敛到细粒度、基于规则或成本感知的评测，而不仅是端到端二元成功。
    - 冻结的视觉语言骨干可以通过外部工件改进，例如多模态技能、执行框架编辑或后验不确定性，无需总是重新训练。
    - 数据和任务覆盖很重要：海量未标注语料、可验证任务合成和多应用基准被视为关键扩展输入。
    - 可靠性与安全作为单独评测轴出现，但当前证据主要覆盖单步定位而非完整轨迹。
    分歧:
    - 评测目标：单步GUI定位对比多步桌面任务对比动态短视频任务对比纯拖拽交互。
    - 部署机制：外部技能检索对比可执行框架优化对比在线强化学习更新对比弱监督微调。
    - 监督与评分：确定性规则检查点对比与人类表现对比的成本-准确性对比可验证奖励信号对比置信度校准。
    - 辅助知识表示：保留在技能工件中的多模态图形对比纯文本技能对比学习策略对比共形点击区域。
    - 假设的瓶颈：标注成本对比观察控制对比基于重复运行的失败诊断对比不确定性跨模型类别迁移。
