  - 'Key differences: Representation varies between latent candidate scoring and text-decoding
    MLLM actions; supervision varies across online RL, dense desktop annotations,
    harness evolution, and context-action SFT; evaluation targets range from single-step
    grounding to long-horizon completion.'
  - 'Trend evolution: Across 2024-2026, work shifts from standalone model claims toward
