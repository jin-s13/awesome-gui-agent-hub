  related_work_outline_zh:
  - 主流方向：证据集中在计算机使用/GUI智能体的评测与改进，2026年工作转向可验证任务合成、自主强化学习奖励、长时程移动上下文、不确定性与安全审计，而非显式综述或分类体系写作。
  - 研究共性：多数论文构建受控基准或任务集，在屏蔽线索、受限交互或校正奖励下评测多模态智能体；读取优先与组件分数被视作热度信号，与方法、结果和工件证据分离。
  - 关键差异：评测目标分为单步GUI定位、长时程移动/网页任务、欺诈判断、教程驱动规划与安全；监督信号涵盖监督微调、人类演示、在线强化学习和自主视觉语言评估器奖励。
  - 趋势演进：证据集中在2024-2026年前沿，尤其2026；可见从孤立GUI定位扩展到可靠性、安全、记忆、数据生成等边缘问题。
  - 开放问题：缺少系统综述证据、跨域泛化不足、不确定性排序向闭源或多步设置迁移弱、自主评估器噪声未解、领域条件安全性仍开放。
  literature_review:
    line_of_work_matrix:
    - line: Taxonomy and roadmap synthesis for GUI agent capabilities
      what_it_solves: Organizes fragmented GUI-agent research into directions such
        as video-guided tasks, long-horizon mobile control, grounded uncertainty,
        safety, and data generation.
      what_remains_open: The packet lacks an explicit survey or systematic taxonomy;
        synthesis must be inferred from benchmark and method papers, so coverage and
        selection criteria are not evidenced.
    - line: Comparative evaluation synthesis across GUI benchmarks and protocols
      what_it_solves: Shows how masking cues, system-prompt changes, dataset shifts,
        and interface differences alter agent conclusions across VLM agents, GUI grounding,
        web, and mobile tasks.
      what_remains_open: Comparability is limited by single-step versus multi-step
        settings, closed-source internal access, and inconsistent artifact disclosure.
    - line: Open problem and gap mapping for reliability, safety, and deployment
      what_it_solves: Converts empirical results into gaps around uncertainty quantification
        transfer, domain-conditioned safety, long-horizon context, and autonomous
        evaluator noise.
      what_remains_open: Prioritization among gaps is not demonstrated; missing multi-step
        UQ, optimized attacks, and real-world reputation cues leave boundary conditions
        unclear.
    - line: Task and demonstration generation for scalable GUI-agent training
      what_it_solves: Creates verifiable tasks, human screen-recording tutorials,
        and synthetic context-management demonstrations for supervision and RL.
      what_remains_open: Evidence does not show whether generated tasks or tutorials
        preserve real-world complexity or avoid overfitting to success rates on a
        few benchmarks.
    - line: Safety and robustness auditing of computer-using agents
      what_it_solves: Controlled red-teaming with hand-crafted injections reveals
        browser-task robustness and coding-task failures, separating attack-class
        claims from optimized-string effects.
      what_remains_open: Only hand-crafted attacks are tested; RL-optimized injection
        strings and cross-domain defense generalization remain unverified.
    consensus:
    - The field is converging on multimodal GUI/computer-use agents evaluated by task
      success or benchmark metrics, but the evidence is dominated by narrow controlled
      settings rather than broad naturalistic deployment.
    - 'Benchmark design and protocol choices materially change conclusions: withholding
      URL or reputation cues, changing system prompts, and separating single-step
      grounding from multi-step trajectories expose different failure modes.'
    - Reliability is becoming a first-class evaluation target, with uncertainty quantification,
      safety audits, and noise-corrected autonomous rewards appearing as shared concerns.
    - Artifact and limitation reporting is uneven, creating verification gaps for
      reproducibility and cross-paper comparison.
    disagreements:
    - 'Evaluation scope: single-step GUI grounding, long-horizon mobile control, fraud
      detection, tutorial-driven planning, and browser safety are measured with incompatible
      metrics or task horizons.'
    - 'Supervision and training: supervised fine-tuning from human or synthetic demonstrations,
      online RL with verifiable tasks, and benchmark-only evaluation treat different
      signals as evidence of capability.'
    - 'Safety and deployment: browser tasks show strong resistance to hand-crafted
      prompt injection while coding tasks show high skill-injection success, indicating
      domain-conditioned rather than general safety.'
    - 'Uncertainty representation: logit-based, hidden-state/density, conformal, and
      verbalized confidence methods rank differently, with weak cross-model transfer.'
    - 'Evaluation conditions: some work removes real-world shortcuts such as URL or
      reputation cues to isolate reasoning, while other work uses real computer tasks
      and system prompts, leading to different failure distributions.'
    open_questions:
    - How can uncertainty quantification transfer across closed-source interfaces
      and from single-step grounding to multi-step GUI trajectories without target-specific
      reranking?
    - Which generated task or tutorial distributions preserve real-world complexity
      and avoid overfitting to benchmark success rates?
    - Why does browser-domain safety hardening fail in coding tasks, and what cross-domain
      or optimized attack protocols would establish general robustness?
    - How can noisy autonomous evaluator rewards be corrected without introducing
      benchmark-specific bias or masking true task failure?
    - Where is the systematic survey or taxonomy evidence for this topic? The packet
      shows method and benchmark papers, so survey-specific conclusions remain a verification
      gap.
