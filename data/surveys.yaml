  literature_review:
    line_of_work_matrix:
    - line: Real-world OS/desktop/web task benchmarks
      what_it_solves: Measures GUI-agent task completion across applications using
        deterministic or fine-grained scoring, including multi-app and GUI+CLI workflows.
      what_remains_open: Cross-platform generalization and whether fine-grained subgoal
        metrics align with real user outcomes beyond the benchmark environment.
    - line: Multimodal skill and reusable program memory
      what_it_solves: Improves computer-use performance and repeated-task speed by
        retrieving visual/text skill artifacts or replaying compiled state-machine
        programs.
      what_remains_open: Transfer to unseen applications or task distributions and
        robustness of fallback behavior under UI drift or environment change.
    - line: Specialized interaction benchmarks and datasets
      what_it_solves: Covers dynamic short-video interfaces, drag gestures, and video-guided
        GUI tasks that are underrepresented in click-focused evaluation.
      what_remains_open: Coverage beyond selected platforms, availability and scale
        of training data, and generalization across mixed interaction modes.
    - line: GUI grounding and agent model training
      what_it_solves: Improves grounding and navigation through large annotated screen-ref
        datasets, distillation-to-reinforcement training, or diffusion-based multimodal
        generation.
      what_remains_open: Generalization beyond reported benchmarks and real-world
        deployment stability; many limitation and open-data details are missing from
        the evidence.
    consensus:
    - Realistic GUI task assessment increasingly uses Pass@1 plus fine-grained subgoal
      or checkpoint metrics to separate models with similar overall success.
    - Multimodal screen understanding and external knowledge or skill reuse improve
      computer-use performance over no-skill or text-only baselines.
    - Current agents remain below human or strong baseline cost-accuracy on dynamic
      and specialized interactions, especially where observation control or drag grounding
      is required.
    - High-quality task-specific training data and fine-tuning can lift grounding
      and interaction performance, but the reported evidence is largely benchmark-bound.
    disagreements:
    - 'Improvement strategy differs: external skill/replay memory versus model fine-tuning
      or architecture change.'
    - 'Evaluation target differs: static desktop task completion, dynamic short-video
      cost-accuracy, video-guided agentic action, and drag-based GUI manipulation.'
    - 'Supervision signal differs: deterministic rule-based scoring, annotated grounding
      or interaction datasets, distillation-to-reinforcement learning, and compiled
      replay without per-step language-model calls.'
    - 'Interaction scope differs: some tasks require CLI plus GUI coordination, while
      others isolate particular GUI gestures or continuous observation in changing
      interfaces.'
    open_questions:
    - Can gains on macOS desktop or GUI grounding benchmarks transfer to dynamic short-video,
      video-guided, or mobile/web contexts?
    - What observation-control mechanisms would reduce over- and under-observation
      in living-screen interfaces?
    - Does training on drag-specific or screen-ref grounding data improve downstream
      computer-use beyond the reported held-out benchmarks?
    - How much of the reported improvement depends on unavailable code or data, empty
      limitation fields, or closed artifacts, and what would replication show?
