  - 'Mainstream direction: The visible 2026 frontier focuses on realistic GUI/computer-use
    benchmarks and on data-efficient or frozen-model adaptation, rather than on one
    new world-model architecture.'
  - 'Shared research pattern: Several works decouple the backbone model from the surrounding
    execution harness, task generation, action interface, or evaluation setting, then
    vary one component to measure gains.'
  - 'Key differences: Work splits by supervision signal, interaction scope such as
    click, drag, video-guided, dynamic screens, and evaluation target such as task
    success, grounding uncertainty, or observation efficiency.'
  - 'Trend evolution: Within the narrow 2024-2026 window, the topic is moving from
    static click-based app tasks toward multi-application, cross-interface, dynamic,
    and uncertainty-aware evaluation and toward lower-annotation training.'
  - 'Open questions: Reported gains may arise from the benchmark, harness, skill library,
    or framework rather than the proposed method; cross-model and cross-interface
    transfer and reusable observation or grounding training signals remain unresolved.'
  related_work_outline_zh:
  - 主流方向：可见的2026年前沿集中在更真实的GUI/计算机使用基准，以及数据高效或冻结模型适配，而不是提出单一的新世界模型架构。
  - 研究共性：多篇工作将骨干模型与执行harness、任务生成、动作接口或评测设置解耦，通过改变某一环节来测量收益。
  - 关键差异：监督信号、点击/拖拽/视频引导/动态屏幕等交互范围，以及任务成功率、grounding不确定性、观察效率等评测目标不同。
  - 趋势演进：在2024-2026窄窗口内，主题从静态点击任务走向多应用、跨接口、动态和不确定性感知评测，并走向低标注训练。
  - 开放问题：报告收益可能来自基准、harness、skill library或框架而非所提方法；跨模型与跨接口迁移、可复用的观察或grounding训练信号仍待解决。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark and evaluation design for GUI/computer-use agents
      what_it_solves: Creates task suites with real OS or app interaction, fine-grained
        success metrics, and broader coverage such as drag, video-guided, and dynamic
        screens.
      what_remains_open: Evidence is mostly limited to reported suites; cross-benchmark
        transfer, multi-step trajectories, and target-specific metrics remain under-verified.
    - line: Scalable training and self-improvement from weak or synthetic supervision
      what_it_solves: Reduces annotation cost and improves frozen or open agents through
        unannotated screenshots, verifiable task synthesis, online RL, or harness
        optimization.
      what_remains_open: Attribution among data, harness, task synthesis, sampling,
        and RL is not isolated; some works lack visible limitation analysis.
    - line: Action grounding and observation-interface methods
      what_it_solves: Connects screens to executable actions, selects informative
        frames, models click or drag grounding, and quantifies grounding uncertainty
        for safer decision-making.
      what_remains_open: Cross-model and cross-interface transfer is weak; observation
        control for dynamic content is unsolved; multi-step trajectory grounding is
        underexplored.
    - line: Method evidence and ablation protocol
      what_it_solves: Separates method contribution from framework, model, metric,
        and dataset effects through reproducibility signals and ablation-style comparisons.
      what_remains_open: Several high-ranked papers lack visible limitation analysis;
        code, dataset, and artifact signals vary, so reproducibility gaps remain.
    consensus:
    - Recent GUI agent work commonly treats the model as one component inside a larger
      system of environment, action adapter, task generator, and evaluator.
    - There is shared interest in reducing reliance on expensive annotations by using
      synthetic tasks, unannotated screenshots, or verifiable execution.
    - Evaluation is moving beyond final Pass@1 toward finer signals such as sub-goal
      completion, cost-accuracy, and grounding uncertainty.
    - Reported gains often depend on surrounding system choices, not only on the backbone
      model.
    disagreements:
    - 'Supervision source differs: weakly supervised visual grounding from unannotated
      screenshots versus online RL with verifiable synthesized tasks versus harness
      optimization over repeated executions.'
    - 'Evaluation focus differs: some target full task success on real OS or app suites,
      others target single-step action grounding uncertainty, and others target dynamic
      observation efficiency.'
    - 'Interaction granularity differs: click or drag action coverage versus temporal
      frame selection versus CLI plus GUI hybrid skills.'
    - 'Reproducibility posture differs: some works provide strong artifact signals,
      while others expose benchmark constraints or weak uncertainty transfer.'
    open_questions:
    - Which components in a GUI-agent pipeline best explain improvements once harness,
      task curation, model, and metric are varied independently?
    - Can action-grounding and training methods transfer across closed-source and
      open-weight models, application interfaces, and single-step to multi-step trajectories?
    - How can dynamic observation control, drag interaction, and video-guided grounding
      be converted from benchmark failures into reusable training objectives?
    - Do current benchmarks reward robust generalization or mostly reward fitting
      to platform-specific evaluation rules and skill libraries?
  literature_review_zh:
    研究路线矩阵:
    - 路线: GUI/计算机使用智能体的基准与评测设计
      解决的问题: 构建真实OS或应用交互、细粒度成功指标，以及拖拽、视频引导、动态屏幕等更广交互覆盖的任务套件
      尚未覆盖: 证据主要限于所报告套件；跨基准迁移、多步轨迹和目标特定指标仍未充分验证
    - 路线: 基于弱监督或合成监督的可扩展训练与自改进
      解决的问题: 通过未标注截图、可验证任务合成、在线RL或harness优化降低标注成本并提升冻结或开源智能体
      尚未覆盖: 数据、harness、任务合成、采样和RL的收益归因未隔离；部分工作缺少可见的局限性分析
    - 路线: 动作grounding与观察接口方法
      解决的问题: 把屏幕连接到可执行动作，选择信息量高的帧，建模点击或拖拽grounding，并量化grounding不确定性以支持更安全决策
      尚未覆盖: 跨模型和跨接口迁移弱；动态内容的观察控制未解决；多步轨迹grounding研究不足
    - 路线: 方法证据与消融协议
      解决的问题: 通过可复现性信号和消融式比较，区分方法贡献与框架、模型、指标和数据集影响
      尚未覆盖: 若干高排名论文未见局限分析；代码、数据集和工件信号不一，复现缺口仍在
    共识:
    - 近期GUI智能体工作普遍将模型视为环境、动作适配器、任务生成器和评测器组成的更大系统中的一个组件。
    - 共享兴趣在于通过合成任务、未标注截图或可验证执行来降低昂贵标注依赖。
    - 评测正从最终Pass@1转向子目标完成、成本-准确性和grounding不确定性等更细信号。
    - 报告收益通常依赖周边系统选择，而非仅由骨干模型决定。
    分歧:
    - 监督信号来源不同：未标注截图的弱监督视觉grounding、可验证合成任务的在线RL、重复执行上的harness优化。
    - 评测重点不同：真实OS或应用套件任务成功率、单步动作grounding不确定性、动态观察效率。
    - 交互粒度不同：点击或拖拽动作覆盖、时间帧选择、CLI加GUI混合技能。
    - 可复现性姿态不同：部分工作提供强工件信号，部分则暴露基准限制或不确定性迁移弱。
    开放问题:
    - 在独立改变harness、任务管理、模型和指标时，GUI智能体流水线中的哪些组件最能解释性能提升？
    - 动作grounding和训练方法能否在闭源与开源模型、不同应用接口、单步与多步轨迹之间迁移？
    - 如何将动态观察控制、拖拽交互和视频引导grounding从基准失败转化为可复用的训练目标？
    - 当前基准奖励的是鲁棒泛化，还是主要奖励对平台特定评测规则和skill library的适配？
