  related_work_outline:
  - 'Mainstream direction: Executable GUI/OS agent benchmarks are consolidating around
    real-world desktop/web tasks with fine-grained, verifiable scoring, while dynamic
    and video-guided interfaces are emerging as stress tests.'
  - 'Shared research pattern: Work couples benchmark environments with VLM-based agents,
    uses screenshot/UI state as observations, and adds sub-goal, cost, uncertainty,
    or trajectory-level signals beyond aggregate success.'
  - 'Key differences: Settings range from static macOS application suites to dynamic
    short-video/browser interfaces and video-guided tasks; metrics emphasize pass@1,
    cost-accuracy, uncertainty calibration, or RL task success; improvement paths
    split between skill/harness/weak-supervision and training-scaling methods.'
  - 'Trend evolution: Within the 2024-2026 evidence window, the topic is shifting
    from single-task success toward dynamic observation control, fine-grained evaluation,
    and using benchmark environments for self-improvement or verifiable reinforcement
    learning.'
  - 'Open questions: Do current task distributions and proxy metrics track real user
    utility? How transferable are agent gains and uncertainty rankings across platforms,
    models, and distribution shifts? Long-horizon and cross-platform coverage remain
    verification gaps.'
  related_work_outline_zh:
  - 主流方向：可执行的GUI/OS智能体基准正在围绕真实桌面/网页任务和可验证的细粒度评分收敛，动态界面与视频引导任务成为新的压力测试。
  - 研究共性：工作将基准环境与VLM智能体结合，以截图/界面状态作为观测，并在总体成功率之外引入子目标、成本、不确定性或轨迹层面信号。
  - 关键差异：评测设置涵盖静态macOS应用套件、动态短视频/浏览器界面和视频引导任务；指标侧重Pass@1、成本精度、不确定性校准或RL任务成功；改进路径分为技能/执行框架/弱监督与训练扩展。
  - 趋势演进：在2024-2026证据窗口内，主题正从单任务成功转向动态观测控制、细粒度评估，并利用基准环境进行自改进或可验证强化学习。
  - 开放问题：当前任务分布和代理指标是否跟踪真实用户效用？智能体增益与UQ排序能否跨平台、跨模型和分布偏移迁移？长程与跨平台覆盖证据仍然有限。
  literature_review:
    line_of_work_matrix:
    - line: Real-world desktop and OS task-suite benchmarking
      what_it_solves: Provides executable macOS/OS tasks across applications with
        rule-based or verifiable scoring for comparing GUI agents.
      what_remains_open: Coverage of cross-platform workflows, long-horizon tasks,
        and whether success rates reflect real user task utility.
    - line: Dynamic and video-guided interface benchmarking
      what_it_solves: Evaluates agents on living/dynamic screens and video-guided
        tasks where content changes and observation control matters.
      what_remains_open: Generalization beyond short-video platforms and alignment
        between information efficiency metrics and human task success.
    - line: Fine-grained metric and uncertainty stress-test design
      what_it_solves: Moves beyond aggregate pass rates to subgoal scoring, cost-accuracy
        trade-offs, uncertainty ranking, and conformal spatial calibration.
      what_remains_open: Transferability of rankings across model classes/interfaces
        and robustness under calibration-test distribution shift.
    - line: Benchmark-coupled agent training and self-improvement
      what_it_solves: Uses benchmark environments and verifiable feedback to improve
        skill libraries, harness logic, task synthesis, online RL, or weak supervision.
      what_remains_open: Whether benchmark gains transfer beyond the evaluation suite
        and remain stable across implementations and compute budgets.
    consensus:
    - Current evaluation converges on executable GUI/OS environments where agents
      act and are scored on task completion rather than static perception alone.
    - Aggregate success is treated as insufficient; several works introduce sub-goal,
      cost-accuracy, uncertainty, or trajectory-level signals.
    - Frontier VLM agents still lag human-level performance, with observation control
      and GUI grounding as recurring weak points.
    - Benchmark environments are increasingly used as verifiable feedback for skill
      retrieval, harness optimization, task synthesis, or reinforcement learning.
    disagreements:
    - 'Evaluation targets differ: multi-application desktop task suites, dynamic short-video
      browser interfaces, video-guided agentic tasks, and single-step GUI grounding
      datasets.'
    - 'Metric emphasis differs: pass@1 and sub-goal completion versus cost-accuracy
      under information constraints versus uncertainty ranking and conformal coverage
      versus RL task success.'
    - 'Improvement representations differ: visual skill artifacts versus text-only
      skills; frozen-harness optimization versus online RL scaling versus weak supervision
      from unannotated screenshots.'
    - Deployment and evaluation settings differ across real macOS apps, simulated
      browser platforms, docker/OS environments, and grounding datasets, limiting
      direct comparability.
    open_questions:
    - How well do current benchmark task distributions cover dynamic, cross-application,
      long-horizon workflows that users actually perform?
    - Which fine-grained, cost, or uncertainty metrics align with downstream user
      utility, safety, and deployment decisions?
    - Why is observation over- and under-use a dominant failure mode, and what evaluation
      signal can measure efficient information gathering?
    - How stable are agent rankings and uncertainty estimates across model classes,
      interfaces, and distribution shifts?
    - Can benchmark gains from skill libraries, harness optimization, weak supervision,
      or verifiable RL transfer without target-specific retuning or benchmark overfitting?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 真实桌面与操作系统任务套件基准
      解决的问题: 在多应用真实或可执行环境中提供可验证任务和规则/确定性评分，比较GUI智能体完成能力。
      尚未覆盖: 跨平台与长程工作流覆盖、真实用户效用对齐，以及基准结论在不同实现下的稳定性尚未充分验证。
    - 路线: 动态界面与视频引导任务基准
      解决的问题: 评估界面内容随机变化或视频引导场景下智能体的观察控制与信息效率。
      尚未覆盖: 短视频平台之外动态界面类型的泛化，以及信息效率指标与人类任务成功的一致性。
    - 路线: 细粒度指标与不确定性压力测试
      解决的问题: 在总分之外提供子目标完成、成本精度、UQ排序和共形空间校准信号。
      尚未覆盖: 跨模型层级和接口的排序迁移较弱，校准-测试或接口分布偏移下覆盖度下降。
    - 路线: 与基准耦合的智能体训练和自改进
      解决的问题: 利用基准环境中的可验证反馈改进技能库、执行框架、任务合成、在线RL或弱监督训练。
      尚未覆盖: 基准收益是否泛化到其他环境，以及训练/框架改进在算力和实现变化下是否稳定。
    共识:
    - 当前评测集中在可执行的GUI/OS环境，智能体执行动作并按任务完成情况评分，而非仅做静态感知。
    - 总体成功率被认为不足，多项工作引入子目标、成本精度、不确定性或轨迹级信号。
    - 前沿VLM智能体仍低于人类水平，观察控制和GUI grounding是反复出现的弱点。
    - 基准环境越来越多被用作可验证反馈，用于技能检索、执行框架优化、任务合成或强化学习。
    分歧:
    - 评测目标不同：多应用桌面任务套件、动态短视频浏览器界面、视频引导任务与单步GUI grounding数据集并存。
    - 指标侧重不同：Pass@1和子目标完成、信息约束下的成本精度、UQ排序与共形覆盖、RL任务成功分别被强调。
    - 表示与改进路径不同：视觉技能工件与纯文本技能、冻结执行框架优化与在线RL扩展、弱监督与可验证任务合成并存。
    - 部署与评测环境不同：真实macOS应用、模拟浏览器平台、docker/OS环境与grounding数据集限制直接可比性。
    开放问题:
    - 当前基准任务分布多大程度覆盖用户实际执行的动态、跨应用和长程工作流？
    - 哪些细粒度、成本或不确定性指标真正对齐下游用户效用、安全与部署决策？
    - 为何过度观察与观察不足是主要失败模式，何种评测信号能衡量信息获取效率？
    - 智能体排名和不确定性估计在模型类别、界面及分布偏移下能否保持稳定？
    - 技能库、执行框架优化、弱监督或可验证RL带来的基准提升能否避免过度拟合并跨环境迁移？
