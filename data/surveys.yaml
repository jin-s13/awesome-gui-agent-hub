    static tasks toward dynamic, video-guided, drag-based, and desktop CLI/GUI coverage,
    and from one-off model evaluation toward reusable skills, replayable execution
    traces, and diffusion-based GUI agents.'
  - 'Open questions: Cross-domain transfer, dynamic observation control, memory reliability
    under interface drift, generalization from fine-tuned interaction data, and reproducible
