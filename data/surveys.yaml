  related_work_outline:
  - 'Mainstream direction: Building comprehensive, multi-modal benchmarks for computer-use
    agents on real-world OS and dynamic GUI tasks, incorporating fine-grained evaluation
    metrics beyond pass/fail.'
  - 'Shared research pattern: Papers combine novel task datasets with evaluation frameworks
    that capture partial progress, observation control, and grounding quality, revealing
    systematic agent limitations.'
  - 'Key differences: Benchmarks vary in interface modality (static desktop, dynamic
    video, drag interactions), evaluation metrics (rule-based, cost-accuracy, uncertainty),
    and data source (manual annotation vs. weak/synthetic generation).'
  - 'Trend evolution: Within the 2024–2026 frontier, the field moves from static web
    benchmarks to dynamic, multimodal, real-world OS environments, with growing emphasis
    on agent training, robustness, and safety evaluation.'
  - 'Open questions: How to achieve cross-platform generalization, standardize fine-grained
    metrics, and ensure safety under uncertainty in open-ended tasks.'
  related_work_outline_zh:
  - 主流方向：构建面向真实操作系统和动态GUI任务的全面多模态基准，采用超越二元成败的细粒度评估指标。
  - 研究共性：各工作将新任务数据集与能捕捉部分进度、观察控制和定位质量的评估框架相结合，揭示代理的系统性不足。
  - 关键差异：基准在界面模态（静态桌面、动态视频、拖拽交互）、评估指标（基于规则、成本-准确率、不确定性）和数据来源（人工标注 vs. 弱监督/合成生成）上存在不同。
  - 趋势演进：在2024–2026前沿期内，领域从静态网页基准转向动态、多模态、真实OS环境，并日益重视代理训练、鲁棒性和安全性评估。
  - 开放问题：如何实现跨平台泛化、标准化细粒度指标，并在开放任务中确保不确定性下的安全性。
  literature_review:
    line_of_work_matrix:
    - line: Real-world OS and dynamic GUI benchmarks
      what_it_solves: Provides realistic task suites and environments that stress
        agent capabilities beyond static web navigation, including multi-app workflows,
        dynamic content, and diverse interaction types.
      what_remains_open: Generalization to unseen applications and dynamic interfaces,
        and coverage of all interaction modalities such as drag, scroll, and multi-touch.
    - line: Skill-augmented agent evaluation and multimodal grounding
      what_it_solves: Improves agent performance by incorporating visual skill libraries
        or keyframe extraction, and evaluates how agents leverage multimodal artifacts
        for UI identification and state verification.
      what_remains_open: Whether skill libraries transfer across domains and how to
        evaluate the faithfulness and efficiency of skill retrieval in varied environments.
    - line: Scalable data generation and training evaluation
      what_it_solves: Addresses the scarcity of annotated GUI data by generating verifiable
        synthetic tasks or using weak supervision from unannotated screenshots, enabling
        evaluation of agent learning paradigms.
      what_remains_open: Quality and diversity of synthetic data, and whether benchmarks
        built for training can serve as unbiased evaluation testbeds.
    - line: Safety and uncertainty quantification for GUI agents
      what_it_solves: Probes agent reliability through post-hoc uncertainty estimation
        and risk-aware metrics, adding spatial safety guarantees and selective prediction
        capabilities.
      what_remains_open: Transferability of uncertainty rankings across model families
        and interfaces, and integration of safety metrics into mainstream benchmarks
        without breaking coverage.
    consensus:
    - Binary pass/fail metrics are insufficient; fine-grained capability annotations,
      multi-step sub-goal scoring, and cost-aware metrics are necessary.
    - Current agents exhibit systematic failures in observation control and grounding,
      especially in dynamic or multimodal interfaces.
    - Benchmarks are converging on real-world OS environments, multi-application tasks,
      and diverse interaction types beyond simple click/type.
    - Training data scarcity is a bottleneck, and synthetic or weakly supervised data
      generation is a promising direction.
    disagreements:
    - 'Evaluation target: some benchmarks focus on single-step grounding, while others
      measure multi-step task completion over long trajectories.'
    - 'Interaction modality: static desktop tasks vs. dynamic video-based interfaces
      vs. drag-based interactions.'
    - 'Metric design: deterministic rule-based evaluation vs. information-efficiency
      metrics vs. uncertainty calibration.'
    - 'Data source: manually curated human annotations vs. automatically generated
      synthetic tasks with verifiable success criteria.'
    - 'Deployment setting: static, predictable interfaces vs. living-screen environments
      where content changes between agent actions.'
    open_questions:
    - How can benchmarks cover the full spectrum of GUI interactions (drag, scroll,
      multi-touch) without becoming overly complex or losing cross-task comparability?
    - What metric best balances task success with resource efficiency (e.g., number
      of actions, observations) and aligns with user-perceived utility?
    - To what extent do uncertainty quantification rankings transfer across different
      model families and interface styles, and how can robust safety wrappers be built?
    - Can synthetic task generation produce benchmarks as challenging and diverse
      as human-curated ones, and how do we validate that they do not leak hidden biases?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 真实操作系统与动态GUI基准
      解决的问题: 提供真实任务套件和环境，测试代理在静态网页之外的能力，包括多应用工作流、动态内容和多样化交互类型。
      尚未覆盖: 对未见应用和动态界面的泛化，以及拖拽、滚动、多点触控等完整交互模态的覆盖。
    - 路线: 技能增强型代理评估与多模态定位
      解决的问题: 通过引入视觉技能库或关键帧提取提升代理性能，并评估代理如何利用多模态工件进行UI识别和状态验证。
      尚未覆盖: 技能库是否跨领域迁移，以及如何在不同环境中评估技能检索的忠实度和效率。
    - 路线: 可扩展的数据生成与训练评估
      解决的问题: 通过生成可验证的合成任务或利用未标注截图的弱监督，缓解标注数据稀缺问题，并评估代理学习范式。
      尚未覆盖: 合成数据的质量与多样性，以及为训练构建的基准能否作为无偏的评估测试平台。
    - 路线: GUI代理的安全性与不确定性量化
      解决的问题: 通过后验不确定性估计和风险感知指标探测代理可靠性，提供空间安全保证和选择性预测能力。
      尚未覆盖: 不确定性排名在不同模型家族和界面间的可迁移性，以及如何在不破坏覆盖范围的前提下将安全指标集成到主流基准中。
    共识:
    - 二元成败指标不足，需要细粒度能力标注、多步子目标评分和成本感知指标。
    - 当前代理在观察控制与视觉定位上存在系统性失败，尤其在动态或多模态界面中。
    - 基准正趋向于真实OS环境、多应用任务和超越简单点击/输入的多样化交互。
    - 训练数据稀缺是瓶颈，合成或弱监督数据生成是有前景的方向。
    分歧:
    - 评估目标：有的基准聚焦单步定位，有的测量长轨迹的多步任务完成。
    - 交互模态：静态桌面任务 vs. 动态视频界面 vs. 拖拽交互。
    - 指标设计：确定性基于规则评估 vs. 信息效率指标 vs. 不确定性校准。
    - 数据来源：人工精心标注 vs. 自动生成具有可验证成功标准的合成任务。
    - 部署场景：静态可预测界面 vs. 内容在代理操作间变化的动态屏幕环境。
    开放问题:
    - 基准如何覆盖拖拽、滚动、多点触控等完整交互模态，而不致过于复杂或丧失跨任务可比性？
    - 何种指标能最佳平衡任务成功率与资源效率（如动作数、观察次数），并与用户感知效用一致？
    - 不确定性量化排名在不同模型家族和界面风格间的迁移程度如何，以及如何构建鲁棒的安全包装器？
    - 合成任务生成能否产出与人工策划同样具有挑战性和多样性的基准，且如何验证其不泄露隐藏偏差？
