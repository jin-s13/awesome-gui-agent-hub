  related_work_outline:
  - 'Mainstream direction: Building and evaluating GUI agents on real-world interaction
    surfaces such as macOS, mobile, short-video, video-guided, and drag-based tasks,
    with emphasis on fine-grained task success, grounding, and sample-efficient training
    or inference.'
  - 'Shared research pattern: Propose a task-specific benchmark or training/inference
    mechanism, evaluate frontier or fine-tuned VLM agents, and use metrics that capture
    sub-goal completion, cost-accuracy, uncertainty, or spatial coverage rather than
    only aggregate success.'
  - 'Key differences: Works split among evaluation-surface expansion, training-data
    synthesis or weak supervision, inference-time context/keyframe/observation control,
    and uncertainty calibration; they vary in interaction mode, dynamic vs static
    screens, and evidence for model-vs-framework attribution.'
  - 'Trend evolution: The available 2024–2026 evidence is concentrated in 2026, so
    the visible evolution is within the current frontier: from click-only benchmarking
    toward dynamic, video-guided, drag, and long-horizon settings, and toward verifiable
    synthetic RL, proactive context management, and calibration-aware evaluation.'
  - 'Open questions: Transfer across operating systems, interfaces, and model classes
    remains weakly evidenced; single-step grounding/UQ may not predict multi-step
    reliability; observation-control deficits and attribution of gains to skill libraries,
    task priors, or training data remain unresolved.'
  related_work_outline_zh:
  - 主流方向：在真实桌面、移动端、短视频、视频引导和拖拽等界面上构建并评测 GUI 代理，重点覆盖细粒度任务成功、动作定位和样本高效训练或推理。
  - 研究共性：提出任务特定基准或训练/推理机制，评估前沿或微调 VLM 代理，并用子目标、成本-准确性、不确定性或空间覆盖等指标补充总体成功率。
  - 关键差异：工作分别侧重评测面扩展、训练数据合成或弱监督、推理时上下文/关键帧/观察控制，以及不确定性校准；交互模式、屏幕动态性和模型-框架归因证据各异。
  - 趋势演进：2024–2026 的可见证据集中在 2026，趋势属于当前前沿：从点击型基准转向动态、视频引导、拖拽和长时域场景，并引入可验证合成 RL、主动上下文管理和校准感知评测。
  - 开放问题：跨操作系统、界面和模型类别的迁移证据仍弱；单步定位/不确定性结果能否预测多步可靠性未定；观察控制缺陷以及技能库、任务先验、训练数据的收益归因仍不清晰。
  literature_review:
    line_of_work_matrix:
    - line: GUI grounding and action-space benchmarks
      what_it_solves: Defines evaluation surfaces for action prediction and grounding
        across click, drag, GUI-plus-CLI, video-guided, and dynamic short-video interfaces.
      what_remains_open: Coverage is often single-platform or single-step; transfer
        to multi-step trajectories, unseen interfaces, and different model classes
        remains unevidenced.
    - line: Training-data synthesis and weak supervision for GUI policies
      what_it_solves: Reduces human annotation burden through verifiable synthetic
        task generation, unannotated screenshot learning, or interaction-specific
        supervised datasets.
      what_remains_open: Attribution among task synthesis, RL, data scale, and model
        capacity is unclear; several works lack explicit limitations or full reproducibility
        details.
    - line: Inference-time context and observation control
      what_it_solves: Improves long-horizon and dynamic interfaces by compacting context,
        selecting task-relevant keyframes, or jointly scoring accuracy and information
        efficiency.
      what_remains_open: Whether these mechanisms correct over-observation/under-observation
        deficits and generalize beyond benchmark-specific environments is not established.
    - line: Uncertainty and fine-grained evaluation for grounding
      what_it_solves: Measures sub-goal differences hidden by similar success rates
        and calibrates uncertainty or conformal click regions for reliability.
      what_remains_open: Findings are mostly limited to single-step grounding; cross-model/cross-interface
        UQ transfer is weak and coverage degrades under distribution or interface
        shift.
    consensus:
    - Current GUI agents still fall short of human-level reliability on dynamic or
      long-horizon tasks; aggregate success alone hides meaningful failure structure.
    - Grounding and action prediction are increasingly evaluated through task-specific
      environment metrics such as sub-goal completion, cost-accuracy, and calibrated
      spatial coverage.
    - Several works pursue sample or annotation efficiency, whether via synthetic
      verifiable tasks, weak supervision from screenshots, keyframe extraction, context
      compaction, or interaction-specific datasets.
    - 'The evidence base has verification gaps: many top papers report strong results
      but provide no limitation field or limited artifact/reproducibility signals.'
    disagreements:
    - 'Evaluation target differs: some works optimize task success and sub-goal completion;
      others optimize cost-accuracy under limited observation; others evaluate uncertainty
      ranking and conformal click safety.'
    - 'Interaction setting differs: static macOS desktop with mixed GUI and CLI, long-horizon
      mobile, dynamic short-video, video-guided, and drag-specific action spaces create
      different boundary conditions.'
    - 'Method of improvement differs: online RL with verifiable task generation, two-stage
      weak supervision from unannotated data, supervised fine-tuning on drag/interaction
      data, and inference-time context/keyframe management.'
    - 'Evaluation assumptions differ: deterministic rule-based scoring with task ground
      truth versus post-hoc uncertainty calibration with ranked UQ methods imply different
      generalization and deployment contracts.'
    open_questions:
    - Do reported gains on OSWorld, ScienceBoard, MemGUI-Bench, MacAgentBench, and
      short-video settings transfer to unseen operating systems, interfaces, or closed-source
      model tiers?
    - How much of the measured advantage on macOS and online RL tasks is attributable
      to skill libraries, task priors, framework design, or synthetic data rather
      than the proposed method?
    - Can over-observation and under-observation in dynamic interfaces be corrected
      by proactive context management or keyframe selection, or do they require new
      observation-control learning objectives?
    - Can single-step uncertainty and conformal grounding results extend to multi-step
      agent trajectories and models with inaccessible internal states?
  literature_review_zh:
    研究路线矩阵:
    - 路线: GUI 定位与动作空间评测
      解决的问题: 定义跨点击、拖拽、GUI+CLI、视频引导和动态短视频界面的动作预测与定位评测面
      尚未覆盖: 评测常限于单一平台或单步；向多步轨迹、未见界面和不同模型类别的迁移仍无证据
    - 路线: GUI 策略的训练数据合成与弱监督
      解决的问题: 通过可验证合成任务生成、未标注截图学习或交互特定监督数据降低人工标注成本
      尚未覆盖: 任务合成、RL、数据规模与模型能力的贡献未分离；部分工作缺少明确限制或完整可复现细节
    - 路线: 推理时上下文与观察控制
      解决的问题: 通过上下文压缩、任务相关关键帧选择或联合成本-准确性评分改善长时域与动态界面表现
      尚未覆盖: 这些机制能否纠正过度/不足观察缺陷并从特定基准环境泛化尚未被证明
    - 路线: 面向定位的不确定性与细粒度评估
      解决的问题: 揭示相似成功率掩盖的子目标差异，并校准不确定性或共形点击区域以支持可靠性判断
      尚未覆盖: 发现主要限于单步定位；跨模型/接口的不确定性排序迁移较弱，共形覆盖在分布或接口偏移下退化
    共识:
    - 当前 GUI 代理在动态或长时域任务上仍低于人类水平，仅看总体成功率会掩盖有意义的失败结构。
    - 动作定位与预测越来越多通过特定任务的子目标完成、成本-准确性、校准空间覆盖等指标来评估，而非只看聚合成功。
    - 多项工作都追求样本或标注效率，路径包括可验证合成任务、截图弱监督、关键帧提取、上下文压缩和交互特定数据集。
    - 证据基础存在验证缺口：不少高排名工作给出强结果，但未提供局限性说明，或工件与可复现信号有限。
    分歧:
    - 评测目标不同：一些工作优化任务成功和子目标完成；一些优化有限观察下的成本-准确性；另一些评估不确定性排序与共形点击安全。
    - 交互设置不同：静态 macOS 桌面并含 GUI+CLI、长时域移动端、动态短视频、视频引导和拖拽特定动作空间，构成不同边界。
    - 改进路径不同：在线 RL 加可验证任务生成、未标注数据弱监督、拖拽/交互数据监督微调，以及推理时上下文/关键帧管理。
    - 评测假设不同：基于规则的任务真值评分与事后不确定性校准、UQ 排序暗示不同的泛化与部署约定。
    开放问题:
    - 已报告的 OSWorld、ScienceBoard、MemGUI-Bench、MacAgentBench 和短视频场景提升，能否迁移到未见操作系统、界面类型或闭源模型层级？
    - macOS 与在线 RL 上测得优势中，多少来自技能库、任务先验、框架设计或合成数据，而非所述方法本身？
    - 动态界面中的过度观察与观察不足，能否被主动上下文管理或关键帧选择真正纠正，还是需要新的观察控制学习目标？
    - 单步不确定性排序和共形定位结果，能否扩展到多步代理轨迹以及内部状态不可访问的模型？
