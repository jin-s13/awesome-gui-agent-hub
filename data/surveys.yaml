  literature_review:
    line_of_work_matrix:
    - line: End-to-end training frameworks and harness-native orchestration
      what_it_solves: Turning policies into trainable, deployable computer-use agents
        across real environments without modifying complex inference harnesses.
      what_remains_open: Error recovery after RL remains weak; trainability varies
        with harness design, and independent cross-team deployment is not yet evidenced.
    - line: Efficient and structured action policies
      what_it_solves: Reducing decoding latency and parameter cost while producing
        grounded GUI actions, including latent candidate scoring and block-wise diffusion.
      what_remains_open: Efficiency-oriented policies do not fully match autoregressive
        baselines and are evaluated mainly on narrow in-distribution benchmarks.
    - line: Unified GUI and code action spaces
      what_it_solves: Coordinating GUI interaction and code execution in one agent,
        with environment-grounded supervision and online RL.
      what_remains_open: Reported gains are centered on OSWorld-Verified and WindowsAgentArena;
        explicit limitations and broader desktop/web generalization are underevidenced.
    - line: Multimodal skill libraries and retrieved knowledge
      what_it_solves: Storing visual and textual task knowledge so agents can load
        application-specific guidance on demand.
      what_remains_open: Coverage outside the evaluated benchmarks and live-application
        drift remain unverified; missing limitation details restrict boundary understanding.
    - line: Data-efficient and weakly supervised GUI training
      what_it_solves: Reducing expensive annotations by visual grounding from unannotated
        screenshots and calibration with small high-quality data.
      what_remains_open: Generalization beyond reported benchmarks and robustness
        of curriculum/RL calibration remain open.
    - line: Diagnostic evaluation frameworks for recovery and personalization
      what_it_solves: Measuring hidden capabilities and failure timing under controlled
        error injection or user preference probes.
      what_remains_open: Evidence shows current agents underuse recovery and personalization
        cues, but translating diagnostics into training objectives is not demonstrated.
    consensus:
    - Multimodal screen and action grounding is treated as central to improving GUI
      and computer-use agents.
    - Environment-grounded supervision, whether from rollouts, artifacts, or unannotated
      screenshots, outperforms prompting-only or naive tool composition baselines.
    - Existing agents fail on fine-grained execution properties such as recovery consistency,
      personalization timing, and ranking/process preferences even when final task
      completion is moderate.
    - System-level artifacts and code are unevenly available, so methodology claims
      are easier to read than independently reproduce.
    disagreements:
    - 'Action-generation paradigm differs: some use block-wise diffusion, some decoder-free
      latent candidate scoring, others unify GUI and code actions.'
    - 'Supervision sources differ: weak unannotated screenshot pretraining, application-artifact
      hybrid data, online environment RL, and retrieved multimodal skills.'
    - 'Evaluation targets differ: parameter/latency/accuracy tradeoffs, final benchmark
      success, recovery consistency, and stage-wise personalization probes.'
    - 'Deployment assumptions differ: some train within real harnesses via containerized
      rollouts, others train standalone multimodal models or attach a skill-retrieval
      layer.'
    open_questions:
    - Can efficient action policies close the remaining in-distribution accuracy gap
      while preserving latency and parameter advantages?
    - How can recovery and personalization diagnostic findings be converted into RL
      or supervised training objectives to improve weak error recovery and preference
      adherence?
    - Do current gains generalize across operating systems, harnesses, and out-of-distribution
      GUI applications beyond OSWorld-Verified, AndroidControl, WebVoyager, and similar
      suites?
    - What minimal artifact, code, and environment details are needed for independent
      reproduction across teams and infrastructure, especially when limitation details
      are missing?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端训练框架与原生 harness 编排
      解决的问题: 在真实环境中将策略训练为可部署的计算机使用智能体，且无需修改复杂推理 harness。
      尚未覆盖: RL 后的错误恢复仍弱；不同 harness 设计下可训练性差异大，跨团队独立部署证据不足。
    - 路线: 高效结构化动作策略
      解决的问题: 在保持 GUI 动作接地的前提下降低解码延迟和参数成本，包括潜空间候选评分和块级扩散。
      尚未覆盖: 高效策略未完全追平自回归基线，且评估主要集中在内分布基准。
    - 路线: 统一 GUI 与代码动作空间
      解决的问题: 在单一智能体中协调 GUI 交互与代码执行，并通过环境接地监督和在线 RL 优化。
      尚未覆盖: 报告收益集中在 OSWorld-Verified 和 WindowsAgentArena，更广桌面/网页泛化与明确局限仍缺乏证据。
    - 路线: 多模态技能库与按需知识检索
      解决的问题: 保存视觉和文本任务知识，使智能体按应用加载相关指导。
      尚未覆盖: 评估基准之外的覆盖范围和真实应用漂移尚未验证；缺失限制说明使边界不清。
    - 路线: 数据高效与弱监督 GUI 训练
      解决的问题: 利用未标注截图进行视觉接地，并用少量高质量标注校准，以降低人工标注成本。
      尚未覆盖: 超出报告基准的泛化、课程和 RL 校准的稳健性仍未充分验证。
    - 路线: 恢复与个性化诊断评测框架
      解决的问题: 通过受控错误注入或用户偏好探针，测量隐性能力和失败发生阶段。
      尚未覆盖: 证据显示当前智能体未能充分利用恢复与个性化信号，但如何将诊断结果转化为训练目标尚未证明。
    共识:
    - 多模态屏幕与动作接地被视为提升 GUI 和计算机使用智能体的核心。
    - 来自环境、工件或未标注截图的接地监督，优于仅提示或朴素工具组合基线。
    - 即使最终任务完成度尚可，智能体在恢复一致性、个性化生效时机以及排名/过程偏好等细粒度执行属性上仍表现不足。
    - 系统级代码和工件可获得性不均衡，方法论声明易于读取，但独立复现仍存在验证缺口。
    分歧:
    - 动作生成范式不同：块级扩散、无解码器潜空间候选评分、GUI 与代码统一动作空间并存。
    - 监督信号来源不同：未标注截图弱监督、应用-工件混合数据、在线环境 RL 和检索式多模态技能。
    - 评测目标不同：参数/延迟/精度权衡、最终基准成功率、恢复一致性以及分阶段个性化探针。
    - 部署假设不同：部分工作在真实 harness 中通过容器化回放训练，部分训练独立多模态模型或为智能体附加技能检索层。
    开放问题:
    - 高效动作策略能否在保持延迟和参数优势的同时弥合内分布精度差距？
    - 如何将恢复和个性化诊断发现转化为 RL 或监督训练目标，以改进当前较弱的错误恢复和偏好遵循？
    - 现有收益能否跨操作系统、harness 和分布外 GUI 应用泛化，而不局限于 OSWorld-Verified、AndroidControl、WebVoyager
      等基准？
    - 独立跨团队复现至少需要哪些代码、工件和环境细节？若干论文缺少明确限制说明，构成验证缺口。
