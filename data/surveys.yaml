  literature_review_zh:
    研究路线矩阵:
    - 路线: 领域特定基准构建
      解决的问题: 为macOS、短视频平台、拖拽界面、视频引导任务和欺诈检测构建真实的GUI智能体评估套件，覆盖多样化的交互模式和应用场景。
      尚未覆盖: 基准局限于特定平台和交互类型；跨领域泛化和对所有动态界面类型的覆盖尚未实现；缺乏跨基准的统一度量。
    - 路线: 面向智能体效率的技能与知识重用
      解决的问题: 通过编译为可重用程序（状态机）或分层多模态技能库，使智能体能够复用成功的任务执行，减少每步语言模型调用并加速重复任务。
      尚未覆盖: 积累的技能能否跨应用或模型迁移；开放世界中的存储时验证和回退鲁棒性；技能库对多样化任务的可扩展性。
    - 路线: 历史感知与视觉接地的执行纠错
      解决的问题: 通过将过去动作总结为宏观动作历史，并在执行前验证所提议动作与当前屏幕的一致性，改进智能体规划和执行，拦截错误。
      尚未覆盖: 对真实GUI轨迹的训练数据依赖；在未见环境中的泛化；与其他效率方法的集成；对安全关键应用的影响。
    - 路线: 面向动态内容的关键帧提取与观察控制
      解决的问题: 从视频或动态界面中选择代表性帧，以减少信息过载并提高任务准确性和成本效率。
      尚未覆盖: 观察频率与任务性能的平衡；对高度交互或快速变化内容的适应性；在短视频之外更广泛的动态领域中的评估。
    共识:
    - GUI智能体需要多模态感知（屏幕像素、视觉元素），并在技能表示中保留视觉信息能带来收益。
    - 真实世界应用需要超越简单点击任务的基准，包括拖拽、视频引导和动态内容交互。
    - 效率至关重要：减少每步模型调用或利用历史交互可以显著加速任务执行而不牺牲准确性。
    - 细粒度评估（子目标评分、成本-准确性、检查点验证）揭示了通过/失败指标所忽略的性能差异。
    分歧:
    - 如何表示可重用知识：一些工作将智能体运行编译为状态机，而另一些则构建带有视觉图形的分层多模态技能库。
    - 哪些交互模态至关重要：一个基准明确处理拖拽式交互，而其他基准假设仅点击或最小观察控制；完全观察控制的重要性存在争议。
    - 评估范围：一些基准侧重于平台特定真实性（macOS、短视频），另一些侧重于受控对抗场景（无URL线索的欺诈检测），这使得跨研究比较智能体能力变得困难。
    - 效率提升是否需要存储过去经验（PreAct）还是可以通过预构建技能实现（VISUALSKILL），以及存储、检索成本和泛化之间的权衡。
    开放问题:
    - 在一个GUI平台（如macOS桌面）上训练或微调的智能体能否将其技能迁移到移动或网页环境，而不需要大量重新训练？
    - 如何设计评估协议，以捕捉智能体在开放未知真实世界任务中的安全性、对对抗输入的鲁棒性和故障恢复能力？
    - 在动态、快速变化的界面中，观察频率与任务完成之间的最佳平衡是什么，智能体能否学会控制自己的观察节奏？
    - 当底层应用UI或工作流发生变化时，当前的技能重用和编译方法是否仍然有效，以及如何检测并适应这些变化？
