  related_work_outline:
  - 'Mainstream direction: large-scale GUI/OS/computer-use benchmarks that pair realistic
    tasks with multimodal agents, moving from aggregate success to fine-grained scoring,
    sub-goal checks, and cost-aware evaluation; representative examples include MacAgentBench,
    LivingScreen, and Argus.'
  - 'Shared research pattern: deterministic or rule-based task verification across
    multiple models and frameworks, grounded in screenshots and observed actions,
    with a deliberate effort to separate model ability from skill, harness, or scaffold
    design.'
  - 'Key differences: evaluation targets range from static desktop and browser workflows
    to dynamic short-video/video-guided tasks and single-step GUI grounding; metrics
    vary across Pass@1, cost-accuracy, sub-goal completion, and uncertainty calibration.'
  - 'Trend evolution: within the 2024-2026 frontier, work shifts from static task
    success toward observation control, self-improving harnesses, verifiable task
    synthesis for online reinforcement learning, and weak supervision from unannotated
    screenshots.'
  - 'Open questions: cross-platform and cross-interface generalization, alignment
    between proxy metrics and real user utility, and stability of reported gains without
    fully released artifacts or comparable compute budgets.'
  related_work_outline_zh:
  - 主流方向：构建大规模 GUI/OS/计算机使用自动化基准，用真实任务评估多模态智能体，并引入细粒度评分、子目标检查与成本感知指标；代表性例子包括 MacAgentBench、LivingScreen、Argus。
  - 研究共性：采用确定性或基于规则的验证，跨多个模型和框架评估，依赖截图与动作观察，并有意识地区分模型能力与技能库、执行框架或脚手架设计。
  - 关键差异：评测目标从静态桌面和浏览器工作流到动态短视频/视频引导任务及单步 GUI 定位；指标在 Pass@1、成本-准确率、子目标完成度和不确定性校准之间分化。
  - 趋势演进：在 2024-2026 前沿，研究从静态任务成功率转向观察控制、自改进执行框架、可验证任务合成加在线强化学习，以及利用海量未标注截图的弱监督。
  - 开放问题：跨平台和跨界面泛化、代理指标与真实用户效用的一致性，以及在代码、数据集、基线与算力预算未完全公开时结论的可复现性。
  literature_review:
    line_of_work_matrix:
    - line: OS/desktop task-suite design with fine-grained scoring
      what_it_solves: Creates realistic multi-application GUI and CLI workflows and
        captures sub-goal completion that aggregate success hides.
      what_remains_open: Coverage across operating systems and application ecosystems;
        deterministic scoring may not transfer to dynamic or open-ended tasks.
    - line: Dynamic and video-guided GUI task benchmarks
      what_it_solves: Evaluates agents when screen content changes between actions
        and when observation or information efficiency affects task completion.
      what_remains_open: Evidence is concentrated in short-video or browser-like settings
        and lacks multi-platform long-horizon generalization.
    - line: Uncertainty quantification and stress-test metric design
      what_it_solves: Measures post-hoc uncertainty for GUI grounding and constructs
        spatial safety/coverage metrics beyond task accuracy.
      what_remains_open: Current benchmark evidence is limited to single-step executable
        grounding; uncertainty ranking transfer across model tiers and interfaces
        is weak.
    - line: Agent capability improvement validated on GUI benchmarks
      what_it_solves: Uses skill libraries, harness optimization, verifiable task
        synthesis plus online reinforcement learning, or weak supervision to improve
        frozen or frontier agents on existing suites.
      what_remains_open: Conclusions depend on specific benchmarks such as OSWorld-Verified
        or ScienceBoard; missing full baseline, compute, and artifact details creates
        verification gaps.
    consensus:
    - Realistic GUI/computer-use tasks should be evaluated with rule-based or verifiable
      outcomes rather than unstructured human judgment.
    - 'Multimodal grounding is central: screenshots, visual artifacts, GUI plus CLI
      coordination, and observation behavior determine success.'
    - Researchers separate backbone model ability from external scaffolds, skills,
      or harnesses by testing multiple models, frameworks, or repeated runs.
    disagreements:
    - 'Evaluation environments differ: some focus on static desktop or browser workflows,
      while others target dynamic content or video-guided interaction, changing the
      required observation-control ability.'
    - 'Metrics are not aligned: pass/fail success, cost-accuracy, sub-goal completion,
      and uncertainty calibration can rank systems differently.'
    - 'Improvement strategies diverge: external skill or harness artifacts, online
      reinforcement learning with synthesized tasks, and weak supervision from unannotated
      screenshots make different assumptions about data and transfer.'
    open_questions:
    - How well do conclusions from desktop, browser, and dynamic-interface benchmarks
      transfer across operating systems and interface forms without target-specific
      re-evaluation?
    - Which evaluation proxies among aggregate success, cost-accuracy, sub-goal completion,
      and uncertainty ranking best predict real downstream user utility?
    - Can observation-control and fine-grained sub-goal gaps be systematically benchmarked
      beyond short-video or macOS settings?
    - How stable are reported improvements once code, datasets, baseline implementations,
      task splits, and compute budgets are fully released and independently re-run?
  literature_review_zh:
    研究路线矩阵:
    - 路线: OS/桌面任务套件与细粒度评分设计
      解决的问题: 构建真实多应用 GUI 与 CLI 工作流，捕获聚合成功率掩盖的子目标完成差异。
      尚未覆盖: 跨操作系统和应用生态覆盖不足；确定性评分不一定能迁移到动态或开放式任务。
    - 路线: 动态与视频引导 GUI 任务基准
      解决的问题: 评估屏幕内容在动作间变化时，以及观察或信息效率影响任务完成时的智能体表现。
      尚未覆盖: 证据集中在短视频或浏览器式环境，缺乏多平台长程泛化验证。
    - 路线: 不确定性量化与压力测试指标设计
      解决的问题: 衡量 GUI 定位的后验不确定性，并构建超越任务准确率的安全或覆盖率等空间指标。
      尚未覆盖: 现有证据仅限于单步可执行定位；不确定性排名跨模型层级和接口迁移较弱。
    - 路线: 在 GUI 基准上验证的智能体能力改进
      解决的问题: 通过技能库、执行框架优化、可验证任务合成加在线强化学习或弱监督，提升冻结或前沿智能体在现有套件上的表现。
      尚未覆盖: 结论依赖 OSWorld-Verified、ScienceBoard 等特定基准；缺少完整基线、算力和工件细节形成验证缺口。
    共识:
    - 真实 GUI/计算机使用任务应采用基于规则或可验证结果进行评估，而非仅依赖非结构化人工判断。
    - 多模态 grounding 是核心：截图、视觉工件、GUI 与 CLI 协同以及观察行为对成功至关重要。
    - 研究者通过多模型、多框架或重复运行，反复区分骨干模型能力与外部技能库、执行框架或脚手架的影响。
    分歧:
    - 评测环境不同：有的关注静态桌面或浏览器工作流，有的关注动态内容或视频引导交互，对观察控制能力提出不同要求。
    - 指标不一致：成功/失败、成本-准确率、子目标完成度和不确定性校准等代理指标可能给出不同系统排序。
    - 改进路线分化：外部技能或执行框架工件、在线强化学习加任务合成、未标注截图弱监督对数据和迁移作出不同假设。
    开放问题:
    - 桌面、浏览器与动态界面基准的结论在跨操作系统和跨界面形式上的泛化如何，是否需要目标场景重新评估？
    - 聚合成功率、成本-准确率、子目标完成度和不确定性排名等评测代理指标中，哪些能预测真实用户下游效用？
