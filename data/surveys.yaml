    methods.'
  - 'Shared research pattern: Ground agent behavior in multimodal screen or video
    evidence, use domain-specific artifacts or training to improve task completion,
    and evaluate via task-level metrics rather than isolated UI grounding.'
  - 'Key differences: Static versus dynamic deployment surfaces; GUI-only versus GUI-plus-code
    action spaces; skill retrieval versus supervised fine-tuning or online RL versus
    state-machine replay; task success versus cost-accuracy or speedup metrics.'
  - 'Trend evolution: The 2024-2026 evidence moves from click-focused and static benchmarks
    toward dynamic video, drag-based, OS-level, and code execution tasks, with efficiency
    and fine-grained checkpoint evaluation becoming first-class objectives.'
  - 'Open questions: Cross-platform generalization, observation control in dynamic
    interfaces, repeated-task reliability, and whether benchmark gains transfer to
    real professional workflows.'
