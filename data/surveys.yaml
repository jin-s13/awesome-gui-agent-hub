  - 主流方向：通过任务套件和评测指标，在 GUI+CLI、拖拽、动态界面等平台与交互模式上形式化 GUI 代理能力。
  - 研究共性：定义一个可操作抽象——如基准、技能工件、执行框架、合成训练循环或不确定性基准——并用成功率、细粒度完成度或校准指标验证。
