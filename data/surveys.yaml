    - 自主性与泛化不同：在一个基准上的成功并不一致地建立跨基准或跨领域泛化，欺诈与安全任务尤其明显。
    开放问题:
    - 在缺少标准化协议时，当前基准改进能否跨接口、任务时域和观测模态迁移？
    - 如何使有噪声的自动评估足够可靠，作为奖励信号而不掩盖评估器误差？
    - 单步不确定性量化和基础方法能否扩展到分布偏移下的多步智能体轨迹？
    - 安全红队如何报告，使手工、优化、开权重和闭源智能体的比较可复现且可比？
    - 基准设计去除或保留哪些真实线索，这会如何限定GUI智能体结果的外部有效性？
