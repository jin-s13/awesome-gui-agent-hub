    - line: Comparative evaluation synthesis
      what_it_solves: Summarizes how evaluation choices across OSWorld, ScienceBoard,
        ScreenSpot-Pro, WebArena-Infinity, MobileWorld, VG-GUIBench, and fraud/safety
