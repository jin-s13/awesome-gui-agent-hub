  related_work_outline:
  - 'Mainstream direction: The dominant focus is building and evaluating GUI/OS automation
    benchmarks on realistic desktop, browser, and video-guided tasks, with fine-grained
    or uncertainty-aware metrics. Representative examples include MacAgentBench for
    macOS, LivingScreen for dynamic short-video platforms, and OSWorld/ScienceBoard-based
    training methods.'
  - 'Shared research pattern: Work is moving beyond aggregate pass rate toward multi-checkpoint
    scoring, cost-accuracy efficiency, sub-goal completion, and uncertainty quantification.
    Results are treated as sensitive to environment, harness, skill library, and observation
    behavior, even when the underlying model backbone is similar.'
  - 'Key differences: Interaction mode differs across static desktop tasks, dynamic
    short-video interfaces, video-guided tasks, and single-step GUI grounding. Supervision
    and evaluation targets also differ: weakly supervised learning, verifiable online
    RL, frozen-harness optimization, or post-hoc uncertainty; and task success, efficiency,
    or calibration.'
  - 'Trend evolution: The visible top-ranked evidence is concentrated in 2026, so
    the trend is within the current frontier: tasks are becoming more dynamic and
    multimodal, metrics are moving beyond Pass@1 toward efficiency and uncertainty,
    and evaluation artifacts increasingly include synthesized tasks, skill libraries,
    and harnesses. Older-year evidence is not visible in this packet.'
  - 'Open questions: How well fine-grained metrics predict real user success; how
    to measure observation control beyond short-video platforms; whether uncertainty
    rankings transfer across model tiers and multi-step trajectories; and how stable
    benchmark conclusions remain across harness, skill, and compute variation, given
    missing limitation and artifact evidence.'
  related_work_outline_zh:
  - 主流方向：当前主流是构建真实桌面、浏览器和视频引导的GUI/OS自动化基准，并用细粒度或不确定性感知指标评估智能体。代表工作包括macOS上的MacAgentBench、动态短视频平台的LivingScreen，以及基于OSWorld/ScienceBoard的训练方法。
  - 研究共性：研究正从总分转向多检查点、成本-准确性、子目标完成或不确定性量化，并强调即使模型骨干相似，执行环境、harness、技能库和观察行为也会显著影响结果。
  - 关键差异：交互模式不同：静态桌面任务、动态短视频界面、视频引导任务或单步GUI基础；监督方式与评测目标也不同：弱监督、可验证在线RL、冻结harness优化或后验不确定性，以及任务成功率、效率与校准。
  - 趋势演进：可见的高排名证据集中在2026年，因此趋势处于当前前沿内部：任务更动态和多模态，指标从Pass@1转向效率和不确定性，评估工件更多包含合成任务、技能库和harness。较早年份证据在本包中不可见。
  - 开放问题：细粒度指标能否预测真实用户成功；如何在短视频平台外衡量观察控制；不确定性排序能否跨模型层级和多步轨迹迁移；在缺少局限性与工件证据时，基准结论对harness、技能和算力变化的稳定性。
  literature_review:
    line_of_work_matrix:
    - line: Real-world desktop and OS task benchmarking
      what_it_solves: Creates shared task suites and deterministic or multi-checkpoint
        scoring for comparing agents on realistic application workflows, such as macOS
        desktop tasks and OS-level GUI/CLI actions.
      what_remains_open: Coverage across operating systems, applications, and multi-app
        workflow variability is not established, and pass/sub-goal scores may not
        fully capture reliability.
    - line: Dynamic and multimodal interface benchmarking
      what_it_solves: Builds browser-based or video-guided environments and multimodal
        artifacts to evaluate agents on content-changing screens, visual grounding,
        and observation control.
      what_remains_open: Current dynamic evidence is limited to short-video platforms
        or video-guided tasks; transfer of visual keyframe or skill methods to other
        dynamic interfaces remains unresolved.
    - line: Metric and stress-test design
      what_it_solves: Develops cost-accuracy, sub-goal, uncertainty, and conformal-coverage
        metrics that probe agent behavior beyond aggregate success.
      what_remains_open: Proxy metrics are not yet tied to user decisions; uncertainty
        ranking transfer across model tiers/interfaces is weak, and multi-step trajectory
        evaluation is missing.
    - line: Comparable baselines and training/evaluation reporting
      what_it_solves: Provides common baselines, harnesses, verifiable task synthesis,
        and frozen-model wrappers to make agent improvements auditable across benchmarks.
      what_remains_open: Stability across implementations, skill/harness variants,
        and compute budgets is uncertain; many visible top papers omit limitation
        or artifact evidence.
    consensus:
    - Benchmark tasks increasingly span realistic GUI/OS workflows rather than isolated
      synthetic widgets, using real desktop apps, browser environments, or video-guided
      interactions.
    - Evaluation is moving past aggregate Pass@1 to include sub-goal checkpoints,
      cost-accuracy efficiency, uncertainty estimates, or visual-grounded verification.
    - Agent scores are sensitive to execution context such as harness, skill library,
      observation behavior, and task synthesis, even with similar model backbones.
    disagreements:
    - Static desktop settings assume stable screen content between actions, while
      dynamic short-video and video-guided settings require observation control under
      content changes.
    - One group learns or fine-tunes agents through weak supervision or online RL,
      while another keeps the backbone frozen and optimizes harnesses or post-hoc
      calibration instead.
    - 'Primary metrics diverge: OSWorld/ScienceBoard style success rates, Pass@1,
      cost-accuracy, sub-goal completion, and uncertainty ranking/coverage each define
      different notions of progress.'
    - Deployment scope differs from macOS desktop and OS-level tasks to single-step
      GUI grounding, limiting transferability of conclusions across settings.
    open_questions:
    - Which fine-grained signals best predict user-facing task success and avoid rubrics
      that can be gamed?
    - How can observation control be measured and improved across dynamic interfaces
      beyond short-video platforms?
    - What conditions make uncertainty rankings transfer across model tiers, interfaces,
      and multi-step trajectories?
    - How stable are benchmark conclusions across harness implementations, skill libraries,
      and compute budgets when many top entries lack visible limitation details?
