  related_work_outline_zh:
  - 主流方向：构建可运行的GUI和计算机使用智能体，以监督初始化结合真实环境或Harness原生强化学习，并叠加技能、记忆或编排层支持部署。
  - 研究共性：将交互轨迹、未标注截图或已验证工作流转化为可复用训练数据、技能工件或可调用记忆，并以OSWorld-Verified、Online-Mind2Web、CUA-World、OSExpert-Eval等交互基准评测。
