  literature_review:
    line_of_work_matrix:
    - line: Fine-grained and dynamic task evaluation
      what_it_solves: Defines GUI-agent task mixes beyond click-only success, including
        desktop GUI+CLI tasks, drag interactions, dynamic short-video interfaces,
        and multi-checkpoint or cost-accuracy scoring.
      what_remains_open: Whether these evaluation abstractions predict real-world
        task success and transfer outside the represented platforms, especially for
        dynamic content and observation control, remains unclear.
    - line: Scalable supervision and online reinforcement learning
      what_it_solves: Reduces dependence on costly human annotations through verifiable
        task synthesis, weak supervision from unannotated screenshots, and sample-efficient
        rollout allocation for computer-use training.
      what_remains_open: Direct evidence on generalization beyond OSWorld/ScienceBoard
        or small annotated calibration sets is limited; limitation and reproducibility
        details are often unreported.
    - line: Long-horizon skill and context management
      what_it_solves: Improves multi-step agent behavior by giving agents proactive
        context actions or multimodal skill retrieval instead of passive history accumulation.
      what_remains_open: Whether gains persist across frameworks, applications, and
        deployment domains beyond the evaluated mobile or desktop suites remains unresolved.
    - line: Reliability and uncertainty framing
      what_it_solves: Evaluates post-hoc uncertainty and spatial calibration for GUI
        grounding so confidence quality can be assessed separately from task success.
      what_remains_open: Single-step grounding evidence does not cover multi-step
        trajectories; cross-model and cross-interface uncertainty transfer is weak
        under distribution shift.
    consensus:
    - Recent work converges on moving beyond end-to-end success rates by measuring
      sub-goal completion, interaction coverage, cost or efficiency, and calibration
      quality.
    - Current GUI agents show observable capability gaps in observation control, long-horizon
      context handling, and fine-grained interaction types.
    - Synthetic, weakly supervised, or retrieved external knowledge is treated as
      a key lever for improving agents without relying only on manual annotation.
    - Several papers expose verification or reproducibility gaps through empty limitation
      fields, sparse artifact signals, or weak transfer beyond the evaluated setting.
    disagreements:
    - 'Evaluation target: success-oriented outcomes versus fine-grained sub-goal and
      multi-checkpoint metrics versus uncertainty or calibration quality versus cost-accuracy
      trade-offs.'
    - 'Interaction span: single-step executable grounding, multi-step long-horizon
      trajectories, and pre-action skill retrieval make different assumptions about
      what an agent must control.'
    - 'Supervision and training route: verifiable synthetic online RL tasks, weak
      supervision from unannotated screenshots, supervised fine-tuning with context-management
      annotations, and frozen external skill libraries.'
    - 'Deployment scope: static desktop and mobile settings, dynamic short-video interfaces,
      drag-specific interaction coverage, and GUI+CLI mixed environments create different
      assumptions about observation and action space.'
    open_questions:
    - Which fine-grained evaluation signals best predict deployment success and transfer
      across unseen interfaces?
    - How can observation control be designed and measured beyond a single dynamic
      platform?
    - Under what conditions do uncertainty ranking and calibration transfer from open-weight
      single-step grounding to closed-source multi-step agents?
    - What limitations are hidden by methods whose reproduced evidence is sparse or
      whose failure modes are not reported?
    - How well do skill and context-management methods generalize across applications,
      frameworks, and deployment domains?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 细粒度与动态任务评测
      解决的问题: 定义超出点击式成功率的 GUI 任务组合，包括桌面 GUI+CLI 任务、拖拽交互、动态短视频界面，以及多检查点或成本准确性评分。
      尚未覆盖: 这些评测抽象是否能预测真实任务成功并在非代表性平台和动态内容上迁移，仍不明确。
    - 路线: 可扩展监督与在线强化学习
      解决的问题: 通过可验证任务合成、未标注截图弱监督和面向学习前沿的采样分配，降低对人工标注和低效训练的依赖。
      尚未覆盖: 在 OSWorld/ScienceBoard 或少量标注校准集之外的泛化证据有限，局限性与可复现细节常未报告。
    - 路线: 长时域技能与上下文管理
      解决的问题: 通过主动上下文动作或多模态技能检索，而不是被动累积历史，改善多步骤代理行为。
      尚未覆盖: 这些收益能否跨框架、跨应用和跨部署域保持，仍未解决。
    - 路线: 可靠性与不确定性框架
      解决的问题: 评估 GUI 基础能力的后验不确定性和空间校准，以把置信度质量与任务成功率分开衡量。
      尚未覆盖: 单步基础证据未覆盖多步轨迹；跨模型和跨接口的不确定性迁移在分布偏移下较弱。
    共识:
    - 近来的工作一致从端到端成功率转向同时关注子目标完成、交互覆盖、成本或效率及校准质量。
    - 当前 GUI 代理在观察控制、长时域上下文处理和细粒度交互类型上存在明显能力缺口。
    - 合成、弱监督或检索式外部知识被视为减少对人工标注依赖的重要提升途径。
    - 多篇证据暴露验证或可复现缺口：局限字段为空、工件信号稀缺或跨设置迁移较弱。
    分歧:
    - 评测目标：成功导向结果与细粒度子目标/多检查点指标、不确定性或校准质量、成本准确性取舍。
