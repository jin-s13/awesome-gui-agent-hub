  related_work_outline:
  - 'Mainstream direction: Building GUI/OS agent benchmarks that target real-world
    application scenarios with multi-step, multi-application tasks and fine-grained
    evaluation beyond simple success rates.'
  - 'Shared research pattern: Benchmarks define task suites, automated evaluation
    metrics, and multi-model comparisons while increasingly probing deeper agent capabilities
    such as observation control, uncertainty, and interaction diversity.'
  - 'Key differences: Interaction modes (click, drag, video-guided, CLI), platform
    scope (macOS, web, short-video platforms), evaluation metrics (pass@1, cost-accuracy,
    UQ calibration), and whether auxiliary components like skills or online RL are
    introduced.'
  - 'Trend evolution: Within the 2024–2026 frontier, the field is rapidly expanding
    from static GUI tasks to dynamic video, drag-based interactions, and multimodal
    skill augmentation, accompanied by finer-grained metrics and uncertainty quantification.'
  - 'Open questions: How to evaluate observation control in dynamic environments,
    whether cross-platform uncertainty quantification is reliable, and how well synthetic-data-trained
    agents generalize to real-world benchmarks.'
  related_work_outline_zh:
  - 主流方向：构建面向真实应用场景的GUI/OS智能体基准，强调多步骤、多应用任务和超越简单成功率的细粒度评估。
  - 研究共性：基准均定义任务套件、自动化评估指标和多模型对比，并日益关注观察控制、不确定性和交互多样性等深层能力。
  - 关键差异：交互模式（点击、拖拽、视频引导、CLI）、平台范围（macOS、网页、短视频）、评估指标（pass@1、成本-精度、不确定性校准）以及是否引入技能或在线RL等辅助组件。
  - 趋势演进：在2024–2026前沿，领域从静态GUI任务快速扩展到动态视频、拖拽交互和多模态技能增强，伴随更细粒度指标和不确定性量化。
  - 开放问题：如何评估动态环境中的观察控制，跨平台不确定性量化是否可靠，合成数据训练的智能体对真实基准的泛化能力如何。
  literature_review:
    line_of_work_matrix:
    - line: Comprehensive desktop/OS agent benchmarks
      what_it_solves: Provides multi-application, multi-step realistic task suites
        with fine-grained capability scoring to compare GUI agents systematically.
      what_remains_open: Whether the task distribution covers all critical OS use
        cases and whether benchmark conclusions remain stable across different agent
        frameworks and compute budgets.
    - line: Dynamic and video-guided GUI benchmarks
      what_it_solves: Evaluates agents on time-varying interfaces and tasks requiring
        video understanding, revealing gaps in observation control and information
        efficiency.
      what_remains_open: Limited coverage of dynamic interface types, missing observation
        control metrics, and alignment between video-guided tasks and real user needs.
    - line: Interaction-type expansion benchmarks
      what_it_solves: Fills the evaluation gap for non-click interactions such as
        drag, resize, and slider manipulation, broadening the scope of GUI agent assessment.
      what_remains_open: Whether the diversity and complexity of drag-based tasks
        capture the full range of real-world fine-grained manipulations.
    - line: Uncertainty quantification and reliability benchmarks
      what_it_solves: Probes how well an agent's confidence aligns with correctness,
        enabling safer deployment through selective prediction and conformal calibration.
      what_remains_open: Weak cross-model and cross-interface transfer of UQ rankings,
        and integration of UQ into multi-step decision-making remains unexplored.
    - line: Auxiliary skills and training methods evaluated on benchmarks
      what_it_solves: Improves agent performance on existing benchmarks via multimodal
        skill libraries, weakly-supervised learning, or online RL, demonstrating the
        impact of external knowledge and adaptive training.
      what_remains_open: Generalization of skills, biases from unannotated or synthetic
        data, and safety of online RL in real environments.
    consensus:
    - Realistic, open-ended task scenarios are necessary for meaningful GUI agent
      evaluation.
    - Single success-rate metrics are insufficient; fine-grained, multi-dimensional
      evaluation is needed.
    - Current models exhibit significant weaknesses in complex interactions, motivating
      continuous benchmark innovation.
    - Standardization and reproducibility of benchmarks are essential for fair comparison
      across approaches.
    disagreements:
    - The choice of interaction modes to evaluate, ranging from click-only to drag,
      video, and CLI combinations.
    - Whether to augment agents with external multimodal skills or rely solely on
      end-to-end model capabilities.
    - The inclusion of uncertainty quantification as a core evaluation dimension versus
      a separate concern.
    - Underlying platform and task distribution vary significantly, leading to different
      conclusions about model capabilities.
    - 'Supervision signals differ: human annotations, weakly-supervised from unlabeled
      screenshots, or synthetically generated tasks.'
    open_questions:
    - How can observation control be quantified and evaluated in dynamic, living-screen
      environments?
    - To what extent do uncertainty quantification rankings transfer across platforms,
      interfaces, and model families?
    - What is the generalization boundary of agents trained on synthetic or weakly-supervised
      data when deployed on real-world benchmarks?
    - How can drag-based and video-guided benchmarks be scaled to cover the full diversity
      of real user workflows?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 综合性桌面/OS智能体基准
      解决的问题: 提供多应用、多步骤的真实任务集和细粒度能力评分，以系统比较GUI智能体。
      尚未覆盖: 任务分布是否覆盖所有关键OS用例，以及基准结论在不同智能体框架和算力预算下是否稳定。
    - 路线: 动态与视频引导的GUI基准
      解决的问题: 评估智能体在时变界面和需要视频理解的任务上的表现，揭示观察控制和信息效率的不足。
      尚未覆盖: 动态界面类型覆盖有限，缺少观察控制指标，视频引导任务与实际用户需求的一致性。
    - 路线: 交互类型扩展基准
      解决的问题: 填补拖拽、调整大小、滑块操作等非点击交互的评估空白，拓宽GUI智能体评估范围。
      尚未覆盖: 拖拽任务的多样性和复杂度是否捕捉了真实世界中精细操作的全部范围。
    - 路线: 不确定性量化与可靠性基准
      解决的问题: 探测智能体置信度与正确性的一致性，通过选择性预测和共形校准实现更安全的部署。
      尚未覆盖: 跨模型和接口的UQ排名迁移性弱，且UQ在多步决策中的集成尚未探索。
    - 路线: 在基准上评估的辅助技能与训练方法
      解决的问题: 通过多模态技能库、弱监督学习或在线RL提升智能体在现有基准上的表现，展示外部知识和自适应训练的影响。
      尚未覆盖: 技能的泛化性、未标注或合成数据引入的偏差，以及在线RL在真实环境中的安全性。
    共识:
    - 真实、开放式的任务场景对于有意义的GUI智能体评估是必要的。
    - 单一成功率指标不足，需要细粒度、多维度的评估。
    - 当前模型在复杂交互中表现出显著不足，推动了基准的持续创新。
    - 基准的标准化和可复现性对于公平比较不同方法至关重要。
    分歧:
    - 评估的交互模式选择不同，从纯点击到拖拽、视频和CLI组合。
    - 是否用外部多模态技能增强智能体，还是仅依赖端到端模型能力。
    - 是否将不确定性量化作为核心评估维度，还是独立关注。
    - 底层平台和任务分布差异显著，导致对模型能力的不同结论。
    - 监督信号不同：人工标注、从无标签截图的弱监督、或合成生成的任务。
    开放问题:
    - 如何在动态、实时屏幕环境中量化和评估观察控制？
    - 不确定性量化排名在不同平台、接口和模型家族间的迁移程度如何？
    - 在合成或弱监督数据上训练的智能体部署到真实基准时的泛化边界是什么？
    - 如何扩展拖拽和视频引导基准，以覆盖真实用户工作流的全部多样性？
