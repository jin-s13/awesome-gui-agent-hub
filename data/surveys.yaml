  related_work_outline:
  - 'Mainstream direction: building real-world GUI/OS automation benchmarks with dense
    tasks, fine-grained scoring, and diagnostic metrics across desktop, web, dynamic
    screen, and video-guided settings.'
  - 'Shared research pattern: pairs a task/dataset or harness with an evaluated set
    of frontier and open models, then reports not only aggregate success but sub-goal,
    cost-accuracy, or uncertainty signals.'
  - 'Key differences: evaluation targets range from single-step GUI grounding to long-horizon
    desktop workflows and dynamic living-screen tasks; improvement routes span skill
    libraries, harness optimization, RL synthesis, and weak supervision.'
  - 'Trend evolution: within the available 2024–2026 frontier window, work is shifting
    from static single-score GUI benchmarks toward dynamic, verifiable, and diagnostic
    settings, with growing attention to frozen-model scaffolds and data/training efficiency.'
  - 'Open questions: cross-platform and cross-tier transfer, metric alignment with
    user decisions, benchmark-specific overfitting, and missing limitation/artifact
    evidence remain unresolved.'
  related_work_outline_zh:
  - 主流方向：构建真实 GUI/OS 自动化基准，覆盖桌面、浏览器、动态短视频与视频引导任务，并采用细粒度评分与诊断性指标。
  - 研究共性：将任务或执行框架与多类前沿/开源模型评估结合，除总体成功率外报告子目标、成本-准确性或不确定性信号。
  - 关键差异：评测对象从单步 GUI 定位到长程桌面工作流和动态屏幕任务不等；改进路线包括技能库、harness 优化、RL 任务合成与弱监督。
  - 趋势演进：在可获得的 2024–2026 前沿窗口内，工作正从静态总分基准转向动态、可验证和诊断性设置，并关注冻结模型下的数据/训练效率。
  - 开放问题：跨平台与跨模型层级迁移、代理指标与用户决策的一致性、基准特定过拟合，以及缺失局限性与工件证据。
  literature_review:
    line_of_work_matrix:
    - line: Real-world GUI and OS task/dataset design
      what_it_solves: Introduces shared desktop, browser, dynamic short-video, and
        video-guided environments/tasks so agent capabilities can be compared on realistic
        settings rather than synthetic single-step screens.
      what_remains_open: Coverage across interface types, long-horizon multi-app workflows,
        observation-control dynamics, and human-level cost-accuracy remains incomplete.
    - line: Fine-grained metric and diagnostic/stress-test design
      what_it_solves: Probes sub-goal completion, Pass@1 vs sub-goal gaps, cost-accuracy,
        observation behavior, and calibrated uncertainty/conformal regions beyond
        aggregate scores.
      what_remains_open: Whether these proxy metrics align with downstream user decisions
        and whether uncertainty/diagnostic rankings transfer across model tiers and
        interfaces without re-evaluation.
    - line: Scaffold and training-based agent improvement
      what_it_solves: Raises agent performance through multimodal skill libraries,
        evidence-driven harness optimization, verifiable RL task synthesis, and weak
        supervision from unannotated screenshots.
      what_remains_open: Stability across implementations and compute budgets, benchmark-specific
        overfitting, and how much gains transfer outside the evaluated benchmarks.
    - line: Video-guided and dynamic-screen observation/keyframe methods
      what_it_solves: Addresses dynamic content changes between actions by formalizing
        observation control and task-aware keyframe extraction for video-guided GUI
        tasks.
      what_remains_open: Evidence is limited to short-video or VideoQA/GUI settings;
        broader dynamic interfaces and multi-step agentic trajectories require more
        validation.
    consensus:
    - Recent work treats aggregate success as insufficient and adds sub-goal, cost-accuracy,
      observation, or uncertainty diagnostics.
    - Real-world tasks and dynamic interface settings expose a gap between current
      agent behavior and human-level control.
    - Substantial gains can come from scaffolds, skills, harness changes, or training
      data rather than only replacing backbone models, but reported gains need transfer
      evidence.
    - Several benchmark artifacts provide datasets/environments and evaluation protocols,
      yet missing limitation details and cross-setting validation remain verification
      gaps.
    disagreements:
    - 'Evaluation target differs: single-step executable GUI grounding versus multi-step
      desktop workflows versus dynamic living-screen or video-guided tasks.'
    - 'Improvement signal differs: multimodal visual skill artifacts, executable harness
      edits, verifiable RL task synthesis, and weak supervision from unannotated screenshots
      represent different assumptions about data and supervision.'
    - 'Interaction/deployment setting differs: real macOS desktop, simulated browser
      short-video platforms, OSWorld/ScienceBoard/WindowsAgentArena-style environments,
      and video-guided GUI tasks are not interchangeable.'
    - 'Metric emphasis differs: task success/checkpoint scoring, cost-accuracy, uncertainty
      ranking/conformal coverage, and video QA/agentic benchmark gains optimize different
      evaluation targets.'
    open_questions:
    - Do fine-grained benchmark metrics predict the downstream decisions users care
      about when controllability and observation cost matter?
    - How stable are benchmark rankings and agent improvements across platforms, interfaces,
      model tiers, and repeated runs?
    - Can scaffold/training gains be separated from benchmark-specific tuning under
      different implementations and compute budgets?
    - How should dynamic-screen and long-horizon GUI benchmarks cover observation
      control without overfitting to one platform such as short-video?
    - What missing limitation and artifact evidence would be needed to audit reproducibility
      across the broader benchmark corpus?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 真实 GUI 与 OS 任务/数据集设计
      解决的问题: 引入共享的桌面、浏览器、动态短视频与视频引导环境和任务，使代理能力在真实设置而非合成单步屏幕上可比。
      尚未覆盖: 对界面类型、长程多应用工作流、观察控制动态和人类级成本-准确性的覆盖仍不完整。
    - 路线: 细粒度指标与诊断/压力测试设计
      解决的问题: 在总分之外检验子目标完成、Pass@1 与子目标差异、成本-准确性、观察行为及校准不确定性/共形区间。
      尚未覆盖: 这些代理指标是否与下游用户决策一致，以及不确定性/诊断排名能否不重新评估就跨模型层级和接口迁移。
    - 路线: 基于脚手架与训练的代理改进
      解决的问题: 通过多模态技能库、证据驱动的 harness 优化、可验证 RL 任务合成和来自未标注截图的弱监督提升代理表现。
      尚未覆盖: 跨实现与算力预算的稳定性、基准特定过拟合，以及这些收益在评测基准之外能迁移多少。
    - 路线: 视频引导与动态屏幕的观察/关键帧方法
      解决的问题: 通过形式化观察控制和任务感知关键帧提取处理动态内容变化，支持视频引导 GUI 任务。
      尚未覆盖: 证据主要限于短视频或 VideoQA/GUI 设置；更广泛的动态界面和多步代理轨迹仍缺乏验证。
    共识:
    - 近期工作认为总体成功率不够，增加子目标、成本-准确性、观察或不确定性诊断。
    - 真实任务和动态界面设置暴露当前代理行为与人类级控制之间的差距。
    - 显著提升可来自脚手架、技能、harness 或训练数据，而非仅更换骨干模型，但需要迁移证据。
    - 若干基准提供了数据集/环境和评测协议，但缺失局限性细节与跨设置验证，仍是核实性缺口。
    分歧:
    - 评测对象不同：单步可执行 GUI 定位、多步桌面工作流，以及动态屏幕或视频引导任务。
    - 改进信号不同：多模态视觉技能工件、可执行 harness 编辑、可验证 RL 任务合成和未标注截图弱监督代表不同数据与监督假设。
    - 交互/部署设置不同：真实 macOS 桌面、浏览器模拟短视频平台、OSWorld/ScienceBoard/WindowsAgentArena 类环境和视频引导
      GUI 任务不可直接互换。
    - 指标侧重不同：任务成功/检查点评分、成本-准确性、不确定性排名/共形覆盖，以及视频问答/代理增益分别优化不同评价目标。
    开放问题:
    - 细粒度基准指标是否预测用户在可控性和观察成本重要时真正关心的下游决策？
    - 基准排名和代理改进在平台、接口、模型层级与重复运行上的稳定性如何？
    - 在不同实现和算力预算下，脚手架/训练收益能否与基准特定调参区分开？
    - 动态屏幕与长程 GUI 基准如何在不过度绑定短视频等单一平台的情况下覆盖观察控制？
    - 需要补齐哪些局限性与工件证据，才能审计更广泛基准语料的复现性？
