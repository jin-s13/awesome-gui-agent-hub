    研究路线矩阵:
    - 路线: 真实多应用计算机使用基准
      解决的问题: 在真实桌面任务上测量GUI与CLI智能体能力，采用确定性多检查点评分和能力注释。
      尚未覆盖: 现有证据未展示跨操作系统版本或动态界面迁移，且缺少限制性说明。
    - 路线: 多模态技能检索与增强
      解决的问题: 通过检索分层文本加视觉技能工件，提升智能体在特定应用工作流中的场景理解。
      尚未覆盖: 超越已评测基准的泛化性、应用版本变化和技能维护成本仍未验证。
    - 路线: 专门交互与动态界面基准
      解决的问题: 覆盖拖拽操作和内容在动作间变化的动态界面，测量成本-准确率或细粒度交互成功度。
      尚未覆盖: 人类级观察控制以及超出短视频或四类拖拽交互的覆盖仍然不足。
    - 路线: 高效重复任务重放
      解决的问题: 将成功的智能体运行编译为带屏幕检查的状态机程序，减少逐步语言模型调用并加速重复任务。
      尚未覆盖: 对界面变化的鲁棒性以及与其他技能或检索机制的集成尚未建立证据。
    - 路线: 视觉语言GUI智能体架构
      解决的问题: 采用块级扩散MoE训练，结合多模态预训练与GUI监督微调，提升跨平台定位与导航能力。
      尚未覆盖: 报告收益集中在少量GUI基准；更广泛的真实部署与可复现证据仍然薄弱。
