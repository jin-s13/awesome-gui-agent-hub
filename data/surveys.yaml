  - 主流方向：将GUI智能体研究建立在可执行任务抽象、可验证评估和可靠性探测之上，而不是停留在观察性或定性判断；主导方向是对交互设置进行形式化并在受控基准下测量。
  - 研究共性：构建任务套件或环境，评估多个前沿/主干模型，用子目标完成、成本-准确率或不确定性排序等细粒度信号暴露失败，再通过训练、技能或执行框架调整加以改进。
