    or replay efficiency rather than only final success.'
  - 'Key differences: They differ in target interface dynamics, representation, supervision,
    and deployment assumptions, including static GUI, CLI+GUI, drag gestures, short-video
    feeds, video-guided tasks, text-only versus multimodal artifacts, and skill retrieval
    versus replay versus environment reconstruction.'
  - 'Trend evolution: The 2024-2026 evidence is frontier-current and moves from click-focused
    GUI tasks toward richer observation control, repeated-task efficiency, and automated
    creation of reusable web/app environments.'
  - 'Open questions: Cross-application and cross-platform transfer, human-level cost-accuracy
