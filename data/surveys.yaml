    研究路线矩阵:
    - 路线: 端到端GUI/计算机使用智能体训练与编排框架
      解决的问题: 把策略转化为可在网站、桌面和harness中执行多步任务的智能体；通过弱监督、在线RL或可验证奖励降低标注数据需求。
