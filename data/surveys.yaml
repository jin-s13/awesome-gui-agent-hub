    - Evaluation is expanding from simple click/type tasks to mixed GUI+CLI, code
      execution, drag, and dynamic content.
    - Fine-grained sub-goal or cost-aware metrics reveal capability differences hidden
      by pass-rate alone.
    - Reuse of past successful runs and control over observation frequency are seen
      as important for practical computer-use agents.
