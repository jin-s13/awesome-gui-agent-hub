  - 主流方向：可运行的计算机使用智能体系统栈，即在真实或实时 GUI/网页环境中训练、部署和评估智能体，而非仅看静态模型基准。证据涵盖框架原生强化学习、在线浏览器训练、技能/记忆服务以及基于执行的评测。
  - 研究共性：将感知、动作、记忆和训练模块组合为可运行智能体；使用监督或强化信号，并在基于执行的基准上比较；通过结构化技能、轨迹或记忆复用降低标注、token
    或运行成本。
  - 关键差异：训练信号不同（未标注截图弱监督、在线多轮强化学习、经 harness 的端到端 RL）；工件表示不同（多模态技能库 vs 可调用执行记忆）；模型范式不同（扩散
    vs 常规视觉语言模型）；评测目标不同（状态转换诊断、实时网页成功、专家科学任务）。
  - 趋势演进：现有高相关证据集中在 2026 年，趋势属于当前前沿：从单一 GUI 模型分数转向实时编排、端到端 RL 框架、可复用记忆/技能，以及基于执行的结果与工作流评测扩展。
  - 开放问题：错误恢复能否被显式训练或脚手架化；技能/记忆在运行环境、操作系统与 UI 变化下如何泛化；替代解码的延迟与交互权衡；弱监督和在线 RL 结果能否跨任务/平台迁移；哪一层评测最能预测真实可靠性。
  literature_review:
    line_of_work_matrix:
    - line: Runnable end-to-end agent training and deployment stacks
      what_it_solves: Turning GUI, web, and harness environments into closed-loop
        training workflows with small curated or weakly annotated data, reducing manual
        annotation and connecting to standard RL codebases.
      what_remains_open: Error recovery remains weak after training and trainability
        varies heavily by harness design; generalization beyond the validated benchmarks
        and environments is not yet established.
    - line: Reusable skill and memory orchestration layers
      what_it_solves: Capturing validated GUI trajectories or multimodal skill artifacts
        so agents can recall parameterized procedures, reducing token cost and execution
        time while improving grounding.
      what_remains_open: Reuse depends on deterministic runtime checks and rejects
        ambiguous or incompatible steps; adaptation to novel application states and
        live UI drift is still limited.
    - line: Efficient multimodal GUI agent modeling and training paradigms
      what_it_solves: Developing vision-language GUI agents with weak supervision
        from unannotated screenshots or block-wise diffusion decoding, reducing labeled
        data needs or preserving parallel decoding advantages.
      what_remains_open: Speed, control fidelity, and live interactivity trade-offs
        are underexplored; reported gains are bounded by specific grounding and navigation
        benchmarks.
    - line: Diagnostic and domain-specific evaluation environments
      what_it_solves: Creating execution-based benchmarks that isolate GUI transition
        understanding or expert scientific software workflows, moving beyond end-task
        success alone.
      what_remains_open: Offline diagnostics do not capture asynchronous live timing
        and delays, and current suites are limited to particular operating systems,
        action sets, or expert domains.
    - line: Reproducible agent infrastructure and artifacts
      what_it_solves: Providing open frameworks, harnesses, containers, and code or
        artifact links for training, serving, and evaluating GUI agents across heterogeneous
        environments.
      what_remains_open: Independent reproduction across teams, datasets, and infrastructure
        remains uncertain because artifact availability and verification signals are
        uneven.
    consensus:
    - Execution-based evaluation is replacing single-frame grounding or final accuracy
      alone as the core evidence for GUI agent progress.
    - Structured reusable artifacts such as skills, callable memories, or trajectories
      provide large efficiency gains without retraining the underlying model.
    - Training frameworks increasingly decouple the agent model from the harness and
      environment, enabling RL or weak supervision in real or live GUI settings.
    - Models still trail expert workflows in state verification, transition understanding,
      and recovery after action errors.
    - Open infrastructure and artifact signals vary across work, creating a verification
      gap for independent reproduction.
    disagreements:
    - 'Training signal differs: unannotated screenshot weak supervision versus online
      multi-turn RL on live websites versus end-to-end harness-native RL.'
    - 'Reuse representation differs: multimodal skill libraries retain visual figures,
      while callable execution memories rely on deterministic parameterized replay
      and reject unsafe or ambiguous steps.'
    - 'Primary evaluation target differs: offline step-level transition diagnostics,
      live website task success, or expert scientific software workflows.'
    - 'Modeling paradigm differs: block-wise diffusion decoding versus conventional
      vision-language models driving harness-based computer-use agents.'
    - 'Deployment setting differs: training-time policy optimization versus inference-time
      memory and skill reuse, with environments spanning Linux desktop, web, and specialized
      scientific software.'
    open_questions:
    - How can error recovery be explicitly trained or scaffolded when it remains weak
      after RL?
    - Can multimodal skills and callable memories generalize under asynchronous GUI
      timing, cross-application UI drift, and OS changes?
    - What latency and interactivity trade-offs do diffusion-based GUI agents create
      in live serving?
    - Do weak-supervision and online RL gains transfer beyond the reported desktop,
      web, and scientific software tasks?
    - Which evaluation layer—live task success, transition understanding, or expert
      artifact checking—best predicts real-world deployment reliability?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 可运行的端到端智能体训练与部署栈
      解决的问题: 将 GUI、网页和 harness 环境转化为闭环训练工作流，利用少量精选或弱标注数据，减少人工标注并接入标准 RL 代码库。
      尚未覆盖: 训练后错误恢复仍弱，且不同 harness 设计显著影响可训练性；超出已验证基准和环境的泛化能力尚未建立。
    - 路线: 可复用技能与记忆编排层
      解决的问题: 记录经过验证的 GUI 轨迹或多模态技能工件，使智能体可召回参数化流程，在改善 grounding 的同时降低 token 成本与执行时间。
      尚未覆盖: 复用依赖确定性运行状态检查，并会拒绝模糊或不兼容步骤；对新的应用状态和实时 UI 漂移的适应仍有限。
    - 路线: 高效多模态 GUI 智能体建模与训练范式
      解决的问题: 通过未标注截图弱监督或块级扩散解码开发视觉语言 GUI 智能体，减少标注数据需求或保持并行解码优势。
      尚未覆盖: 速度、控制保真度和实时交互之间的权衡尚未充分探索；报告增益受限于特定 grounding/导航基准。
    - 路线: 诊断性与领域专用评测环境
      解决的问题: 构建基于执行的基准，隔离 GUI 状态转换理解或专家科学软件工作流，超越仅看最终任务成功。
      尚未覆盖: 离线诊断无法捕获实时异步时序和延迟；当前任务集受限于特定操作系统、动作集或专家领域。
    - 路线: 可复现的智能体基础设施与工件
      解决的问题: 提供开放框架、harness、容器和代码/工件入口，用于在异构环境中训练、服务和评测 GUI 智能体。
      尚未覆盖: 由于工件可用性和验证信号不均衡，跨团队、跨数据集和跨基础设施的独立复现仍不确定。
    共识:
    - 基于执行的评测正在取代单帧 grounding 或仅最终准确率，成为 GUI 智能体进展的核心证据。
    - 结构化可复用工件（技能、可调用记忆或轨迹）无需重新训练模型即可显著降低 token 成本或执行时间。
    - 训练框架趋向于将智能体模型与 harness、环境解耦，以便在真实或实时 GUI 设置中应用强化学习或弱监督。
    - 模型在状态验证、转换理解和错误恢复方面仍明显落后于专家工作流。
    - 开放基础设施和工件信号不均衡，使独立复现存在验证缺口。
    分歧:
    - 训练信号不同：未标注截图弱监督、在线多轮强化学习，以及经 harness 的端到端 RL。
    - 复用表示不同：多模态技能库保留视觉图形，而可调用执行记忆按确定性和参数化步骤运行，并拒绝无法安全重放的轨迹。
    - 评测目标不同：离线步骤级转换诊断、实时网页任务成功，以及专家科学软件任务。
    - 建模范式不同：块级扩散解码与传统视觉语言模型驱动的 harness 式计算机使用智能体。
    - 部署方式不同：训练期策略优化与推理期记忆/技能复用，并覆盖 Linux 桌面、网页和专用科学软件等不同场景。
    开放问题:
    - 错误恢复如何在强化学习后仍较弱的情况下被显式训练或通过脚手架补偿？
    - 多模态技能和可执行记忆能否在异步 GUI 时序、跨应用和跨操作系统 UI 变化下持续泛化？
    - 扩散式 GUI 智能体在实时服务中的延迟与交互保真度权衡是什么？
    - 弱监督和在线 RL 的成果能否迁移到超出当前报告的桌面、网页和科学软件任务之外？
    - 实时任务成功、状态转换诊断和专家产物检查中，哪类评测最能预测真实部署可靠性？
