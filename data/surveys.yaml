  related_work_outline:
  - 'Mainstream direction: The field is converging on building comprehensive GUI-agent
    benchmarks and methods that scale agent performance through task synthesis, skill
    libraries, and context management, while starting to examine reliability via uncertainty
    quantification.'
  - 'Shared research pattern: Most works use vision-language models on multimodal
    screenshots, define fine-grained evaluation metrics, and propose either new benchmarks
    or new training pipelines to improve agent grounding and interaction accuracy.'
  - 'Key differences: Works differ in interaction types (click, drag, dynamic scrolling),
    platform (desktop vs. mobile vs. browser), training paradigm (weakly supervised,
    online RL, few-shot), and evaluation focus (end-to-end success vs. uncertainty
    calibration vs. sub-goal completion).'
  - 'Trend evolution: From 2024 to 2026, the frontier moved from broad desktop benchmarks
    to specialized interaction benchmarks (drag, dynamic screens) and to reliability
    analysis (uncertainty quantification), while scaling methods shifted from pure
    imitation to online RL with synthetic tasks.'
  - 'Open questions: How to provide formal guarantees for agent behavior under distribution
    shift, whether uncertainty estimates can improve multi-step decision-making, and
    how to unify representations across static and dynamic interfaces remain unresolved.'
  related_work_outline_zh:
  - 主流方向：研究集中在构建全面的GUI代理基准，以及通过任务合成、技能库和上下文管理来扩展代理性能，同时开始通过不确定性量化关注可靠性。
  - 研究共性：多数工作使用视觉语言模型处理多模态截图，定义细粒度评估指标，并提出新基准或新训练流程以提升代理的GUI定位和交互准确率。
  - 关键差异：交互类型（点击、拖拽、动态滚动）、平台（桌面 vs 移动端 vs 浏览器）、训练范式（弱监督、在线RL、少样本）和评估重点（端到端成功率 vs 不确定性校准
    vs 子目标完成度）各不相同。
  - 趋势演进：2024至2026年，前沿从广泛的桌面基准转向专门的交互基准（拖拽、动态屏幕）和可靠性分析（不确定性量化），而扩展方法从纯模仿学习转向结合合成任务的在线RL。
  - 开放问题：如何在分布偏移下为代理行为提供形式化保证，不确定性估计能否改进多步决策，以及如何统一静态与动态界面的表示，仍然悬而未决。
  literature_review:
    line_of_work_matrix:
    - line: Formal task definitions and interaction taxonomies
      what_it_solves: Clarifies what agent capabilities must be evaluated and under
        which environmental assumptions, covering click, drag, dynamic-screen, and
        multi-app interactions.
      what_remains_open: Whether the formal assumptions (e.g., deterministic rules,
        static screen semantics) hold in real-world stochastic interfaces, and how
        to align taxonomies across platforms.
    - line: Scaling agent performance via data, task synthesis, and context
      what_it_solves: Connects model size, data volume, and training objectives to
        improved agent success rates, using weak supervision, online RL with synthetic
        tasks, and proactive context management.
      what_remains_open: There is no theoretical guarantee that scaling laws will
        hold under distribution shift, and the reliability of learned policies degrades
        in long-horizon tasks without formal verification.
    - line: Reliability and safety framing through uncertainty quantification
      what_it_solves: Introduces post-hoc uncertainty estimation to assess grounding
        confidence, enabling selective trust and spatial safety regions for GUI actions.
      what_remains_open: UQ ranking transfer fails across model families and interfaces,
        and current methods are not integrated into multi-step agent trajectories,
        leaving the safety impact unvalidated.
    consensus:
    - Vision-language models are the backbone for GUI agents, but their raw grounding
      accuracy is insufficient for reliable deployment.
    - Fine-grained evaluation metrics (sub-goal scores, information efficiency, multi-checkpoint)
      expose capability gaps that aggregated success rates hide.
    - Task-specific data augmentation (skill libraries, interaction datasets, synthetic
      task generation) consistently lifts agent performance.
    - There is a growing consensus that agent evaluation must go beyond single-step
      success to include reliability and uncertainty awareness.
    disagreements:
    - 'Interaction abstraction: some works treat only click and type as primitives,
      while others argue for drag, dynamic scroll, and even context management as
      first-class actions.'
    - 'Training signal: whether to rely on cheap unannotated screenshots with weak
      supervision, or to invest in costly online RL with verifiable rewards.'
    - 'Evaluation target: some benchmarks target static desktop productivity, others
      target dynamic content consumption, leading to different assumptions about the
      observation model.'
    - 'Deployment setting: mobile long-horizon tasks require proactive memory management,
      while desktop benchmarks assume the agent can reprocess the full screen history,
      creating incompatible context representations.'
    open_questions:
    - Can uncertainty quantification be integrated into the agent's decision loop
      to trigger human intervention or autonomous exploration?
    - How do scaling laws derived from synthetic tasks transfer to real-world, open-ended
      GUI environments?
    - What is the minimal set of interaction primitives that can cover all GUI actions
      without losing the benefits of specialized taxonomies?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 形式化任务定义与交互分类
      解决的问题: 明确代理能力必须评估哪些维度，以及在何种环境假设下进行，涵盖点击、拖拽、动态屏幕和多应用交互。
      尚未覆盖: 形式化假设（如确定性规则、静态屏幕语义）在真实随机界面中是否成立，以及如何跨平台对齐分类法。
    - 路线: 通过数据、任务合成与上下文扩展代理性能
      解决的问题: 将模型规模、数据量和训练目标与代理成功率的提升联系起来，使用弱监督、基于合成任务的在线RL和主动上下文管理。
      尚未覆盖: 没有理论保证缩放规律在分布偏移下依然有效，且长时域任务中学习策略的可靠性会下降，缺乏形式化验证。
    - 路线: 基于不确定性量化的可靠性与安全框架
      解决的问题: 引入后验不确定性估计来评估GUI定位的置信度，实现选择性信任和空间安全区域。
      尚未覆盖: UQ排名迁移在模型族和接口之间失败，当前方法未集成到多步代理轨迹中，安全影响未经验证。
    共识:
    - 视觉语言模型是GUI代理的骨干，但其原始定位准确率不足以实现可靠部署。
    - 细粒度评估指标（子目标得分、信息效率、多检查点）揭示了聚合成功率所掩盖的能力差距。
    - 任务特定的数据增强（技能库、交互数据集、合成任务生成）能够持续提升代理性能。
    - 越来越多的工作认为代理评估必须超越单步成功，纳入可靠性和不确定性意识。
    分歧:
    - 交互抽象：部分工作仅将点击和键入视为基本动作，而另一些工作主张将拖拽、动态滚动甚至上下文管理作为一等动作。
    - 训练信号：是依赖廉价的未标注截图进行弱监督，还是投入成本进行具有可验证奖励的在线RL。
    - 评估目标：部分基准针对静态桌面生产力，另一些针对动态内容消费，导致对观察模型的假设不同。
    - 部署设置：移动端长时域任务需要主动记忆管理，而桌面基准假设代理可以重新处理整个屏幕历史，造成不兼容的上下文表示。
    开放问题:
    - 能否将不确定性量化集成到代理的决策循环中，以触发人工干预或自主探索？
    - 从合成任务推导出的缩放规律如何迁移到真实、开放的GUI环境？
    - 能够覆盖所有GUI动作的最小交互原语集合是什么，同时不失去专用分类法的优势？
