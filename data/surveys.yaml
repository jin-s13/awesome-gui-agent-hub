  literature_review_zh:
    研究路线矩阵:
    - 路线: 领域适配的 GUI 代理基准
      解决的问题: 在具有领域特定界面、动作空间和约束的真实任务上评估代理性能，例如 macOS 桌面、短视频平台、拖拽式 UI、视频引导任务和短信到网页欺诈检测。
      尚未覆盖: 动态、长尾和安全关键场景的覆盖；评估洞见跨平台的迁移性；可能夸大真实性能的评估捷径（如 URL 信誉）的缓解。
    - 路线: 代理执行优化与技能落地
      解决的问题: 通过分层多模态技能库、成功运行的状态机编译，以及在执行前拦截错误的历史感知视觉基础评判，提高代理的可靠性、速度和规划能力。
      尚未覆盖: 技能库和评判模型在未见应用和基础模型上的泛化；执行速度与适应性之间的权衡；动态环境中屏幕状态匹配和回退机制的鲁棒性。
    - 路线: 动态与多模态交互处理
      解决的问题: 使 GUI 代理能够处理视频输入、动作间实时屏幕内容变化，以及拖拽等需要超越点击推理和观察控制的细粒度交互。
      尚未覆盖: 代理缺乏观察控制（过度观察和观察不足）；关键帧提取对多样视频类型的鲁棒性；短视频平台之外动态界面类型的覆盖；动作接地与时间上下文的集成。
    共识:
    - 当前多模态 GUI 代理在真实任务上仍落后于人类水平，在长期规划、执行准确性和效率方面存在不足。
    - 基准驱动的评估揭示了常见瓶颈：代理在观察控制、历史利用和超越简单点击的交互保真度上挣扎。
    - 模块化增强（技能库、执行回放、评判模型）能在不改变底层模型架构的情况下显著提升代理性能。
    - 真实应用需要处理多样的模态（文本、图像、视频）和动态界面，但现有基准各自仅覆盖交互空间的一部分。
    分歧:
    - 评估指标不同：Pass@1 任务成功率 vs. 成本-准确性权衡 vs. 细粒度子目标完成分数，导致对代理能力的不同结论。
    - 交互模式各异：静态点击式任务 vs. 拖拽式交互 vs. 视频引导工作流 vs. 实时屏幕动态内容，各考验不同的代理技能。
    - 改进重点分歧：一些工作注入预编写技能，另一些通过回放优化重复执行，还有一些在规划时用评判器干预，目标不同的失败模式。
    - 部署场景从桌面生产力到社交媒体平台再到安全关键的欺诈检测，意味着不同的风险容忍度和成功标准。
    开放问题:
    - 在少量应用上训练的技能库和评判模型能否泛化到全新的领域和平台？
    - 代理如何学习在动态界面中自适应控制观察频率，以平衡成本与准确性？
    - 将代理运行编译成状态机程序是否会牺牲处理新任务变体的能力？
    - 需要哪些基准来评估超越单次会话任务的长期、安全关键的 GUI 代理部署？
