  - 主流方向：证据中未见独立的定理式形式化工作；理论主要通过任务形式化和基准设计推进，另一条路线通过训练、技能或上下文机制提升智能体能力。
  - 研究共性：多数工作以任务套件或数据集配基线比较，用细粒度或成功率指标评估，将GUI智能体视为基于屏幕状态的视觉语言策略，并强调超越点击式评测的覆盖。
