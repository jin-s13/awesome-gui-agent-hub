  literature_review:
    line_of_work_matrix:
    - line: Real-environment and multi-application desktop GUI benchmarking
      what_it_solves: Measures cross-application task completion on real desktop systems,
        including mixed GUI/CLI workflows and fine-grained sub-goal scoring.
      what_remains_open: Cross-platform and cross-framework transfer is not shown;
