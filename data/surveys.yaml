  - 'Mainstream direction: Building and evaluating GUI/computer-use agents in realistic
    or dynamic interactive environments, with 2026 work centered on grounding, action
    prediction, training efficiency, and self-improvement rather than only static
    screenshot benchmarks.'
  - 'Shared research pattern: Construct task suites or environments, evaluate frontier
    VLMs with fine-grained or verifiable metrics, then isolate failure modes such
    as observation control, weak grounding, or data inefficiency.'
  - 'Key differences: Evaluation targets range from single-step grounding to multi-application/multi-step
    tasks; supervision ranges from unannotated screenshots and synthesized verifiable
    tasks to weak labels and RL rewards; methods modify the model, the harness, or
    the observation pipeline.'
  - 'Trend evolution: The available frontier evidence is narrow (2024-2026, top papers
    all 2026). Work is moving from static click-focused benchmarks toward dynamic,
    multi-interaction, self-improving, and scalable training protocols, with growing
    attention to fine-grained process evidence.'
  - 'Open questions: How much gain comes from model vs harness or skill library, whether
    dynamic-observation and drag abilities generalize, and how to transfer uncertainty
    calibration across model classes and interactive deployment settings remain unresolved.'
  related_work_outline_zh:
  - 主流方向：构建并评估真实或动态交互环境中的 GUI/计算机使用智能体；2026 年重点集中在接地、动作预测、训练效率和自改进，而非仅静态截图基准。
  - 研究共性：先构建任务套件或环境，再用细粒度或可验证指标评测前沿 VLM，并定位观察控制、接地不足或数据低效等失败模式。
  - 关键差异：评测目标从单步接地到多应用/多步任务不等；监督信号包括未标注截图、合成可验证任务、弱标签和 RL 奖励；方法分别修改模型、执行框架或观察管线。
  - 趋势演进：现有前沿证据较窄（2024-2026，高排名论文均为 2026）。研究从静态点击基准转向动态、多交互、自改进和可扩展训练，并更重视过程性细粒度证据。
  - 开放问题：收益多少来自模型、执行框架或技能库；动态观察与拖拽能力是否泛化；不确定性校准如何在模型类别和部署设定间迁移，仍未得到答案。
  literature_review:
    line_of_work_matrix:
    - line: Interactive GUI and computer-use benchmarking
      what_it_solves: Defines task suites, environments, and metrics for real desktop,
        dynamic video-like, and drag-based interaction; exposes failures such as over/under-observation
        and pass-vs-subgoal gaps.
      what_remains_open: Platform and interaction generalization; many benchmark limitations
        are narrow or unreported, and multi-step trajectory evaluation is often missing.
    - line: Weakly supervised and data-efficient grounding
      what_it_solves: Uses unannotated screenshots or large synthesized drag tasks
        to train GUI grounding with minimal human labels and competitive data efficiency.
      what_remains_open: Evidence is sparse on out-of-distribution grounding, code/data
        availability, and whether gains survive stronger architectures.
    - line: Harness and action-interface optimization
      what_it_solves: Improves frozen agents by optimizing the execution harness through
        evidence-driven diagnosis and repeated-run comparison, or by covering dynamic
        observation and drag interaction.
      what_remains_open: Contribution is not fully disentangled from the backbone,
        skill library, or action interface; transfer beyond OSWorld, WindowsAgentArena,
        and dynamic short-video domains remains open.
    - line: Verifiable task synthesis and online RL
      what_it_solves: Scales computer-use policy training by generating verifiable
        tasks and allocating rollouts to the learning frontier, with visual context
        compression for efficiency.
      what_remains_open: Generalization beyond OSWorld and ScienceBoard is not established;
        limitation and safety/cost evidence is missing.
    - line: Uncertainty quantification for GUI grounding
      what_it_solves: Measures calibration and selective prediction for single-step
        click grounding, and provides conformal click regions to reduce spatial uncertainty.
      what_remains_open: Findings do not transfer well across model classes and interactive
        interfaces; multi-step agent trajectories and distribution-shift coverage
        remain uncovered.
    - line: Video-guided keyframe/observation selection
      what_it_solves: Selects task-relevant keyframes to connect video understanding
        to GUI action prediction, improving VideoQA and video-guided agentic benchmarks.
      what_remains_open: Only limited benchmark gains are reported; no limitations
        or failure analysis are available, so general usefulness for interactive GUI
        workflows is unverified.
    consensus:
    - 'Current work agrees that GUI agents need more than final success: fine-grained
      process, sub-goal, observation-efficiency, and grounding-confidence metrics
      reveal failures hidden by Pass@1.'
    - There is broad agreement that frontier VLMs are still below reliable computer-use
      levels, especially on dynamic, multi-application, and drag-based interfaces.
    - 'Multiple lines treat environment/task construction and method development as
      coupled: new benchmarks are used to expose grounding or observation-control
      deficits that then motivate training or harness interventions.'
    - Several works focus on reducing annotation or compute cost, whether through
      weakly supervised grounding, verifiable synthesis, or frozen-model self-improvement.
    disagreements:
    - Some methods improve the frozen executable context or harness around a model,
      while others tune the model backbone or representation, creating different assumptions
      about where performance gains should be allocated.
    - 'Supervision and reward signals differ: weakly labeled unannotated screenshots,
      task-family fine-tuning, online RL with verifiable rewards, and post-hoc uncertainty
      calibration each optimize different reliability targets.'
    - Evaluation targets differ from static single-step click grounding to multi-step
      desktop tasks, dynamic observation interfaces, GUI+CLI combinations, and drag
      interactions, making results not directly comparable.
    - Deployment settings differ across macOS, browser-based short-video platforms,
      and benchmark-specific environments, so rank order and failure modes may not
      transfer.
    open_questions:
    - Do observed Pass@1 improvements reflect model capability or surrounding harness/skill
      library effects, given that one result attributes advantage to a skill library
      rather than framework design?
    - Can observation control be learned or designed for dynamic interfaces where
      content changes between actions, since over- and under-observation is the dominant
      failure?
    - How can uncertainty quantification remain calibrated across closed-source/open-weight
      model tiers and interactive deployment shifts when cross-tier ranking transfer
      is weak?
    - Do drag-based and video-guided training gains transfer to multi-step computer-use
      tasks beyond the reported benchmark suites?
    - What would a common evaluation protocol need to separate method contribution
      from dataset, framework, and implementation choices across macOS, browser, and
      video-like environments?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 交互式 GUI 与计算机使用基准
      解决的问题: 定义真实桌面、动态视频式界面和拖拽交互的任务套件与指标，暴露过度/不足观察以及 Pass@1 与子目标完成不一致。
      尚未覆盖: 平台与交互泛化不明；许多限制未报告，且多步轨迹评估常缺失。
    - 路线: 弱监督与数据高效接地
      解决的问题: 利用未标注截图或大规模合成拖拽任务训练 GUI 接地，以更少人工标注获得竞争性能。
      尚未覆盖: 分布外接地、代码/数据可复现性以及对更强骨干模型的有效性证据不足。
    - 路线: 执行框架与动作接口优化
      解决的问题: 在冻结模型上通过证据驱动诊断和重复执行比较优化 harness；或覆盖动态观察与拖拽交互。
      尚未覆盖: 模型、技能库与动作接口的贡献未完全分离；OSWorld、WindowsAgentArena 和动态短视频场景之外的迁移未验证。
    - 路线: 可验证任务合成与在线 RL
      解决的问题: 通过可验证任务生成和前沿采样扩展计算机使用策略训练，并压缩视觉上下文来提高效率。
      尚未覆盖: OSWorld 和 ScienceBoard 之外的泛化未建立；局限性与安全性/成本证据缺失。
    - 路线: GUI 接地不确定性量化
      解决的问题: 对单步点击接地测量校准和选择性预测，并用共形点击区域压缩空间不确定性。
      尚未覆盖: 跨模型层级和交互接口的转移弱；多步智能体轨迹与分布偏移下的覆盖率仍是空白。
    - 路线: 视频引导关键帧/观察选择
      解决的问题: 选择任务相关关键帧，将视频理解与 GUI 动作预测连接，提升 VideoQA 与视频引导基准。
      尚未覆盖: 仅报告有限基准收益，缺少失败分析，对交互式 GUI 工作流的通用价值未证实。
    共识:
    - 多种工作一致认为最终成功率不足以反映 GUI 智能体能力，需要子目标、观察效率、接地置信度等细粒度过程指标。
    - 前沿 VLM 在动态、多应用、拖拽和真实桌面任务上仍低于可靠计算机使用水平。
    - 任务/环境构建与方法开发高度耦合：新基准暴露接地或观察控制缺陷，进而驱动训练、harness 或推理侧干预。
    - 多个路线都试图降低标注、计算或重复执行成本，包括弱监督、可验证合成和冻结模型自改进。
    分歧:
    - 方法干预层不同：有的修改冻结执行上下文或 harness，有的微调模型骨干或表示，反映对性能来源的不同假设。
    - 监督与奖励信号不同：未标注截图弱监督、任务族微调、可验证奖励在线 RL 和后验不确定性校准各自优化不同可靠性目标。
    - 评测对象不同：静态单步点击接地、多步桌面、动态观察界面、GUI+CLI 混合和拖拽交互之间结果不可直接比较。
    - 部署环境不同：macOS、浏览器短视频平台和特定基准环境导致排序和失败模式可能不可迁移。
    开放问题:
    - Pass@1 提升有多少来自模型能力，有多少来自执行框架或技能库？
    - 动态界面中如何在动作之间内容变化时学习或设计观察控制，以缓解过度观察与观察不足？
    - 跨闭源/开源模型层级和交互部署转移时，不确定性量化如何保持校准？
    - 拖拽和视频引导训练收益是否迁移到多步计算机使用任务？
    - 是否能有统一协议区分方法贡献与数据集、框架和实现因素？
