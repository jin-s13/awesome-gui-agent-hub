      解决的问题: 将广泛文献覆盖转化为安全、校准、记忆、欺诈识别和泛化等具体研究问题。
      尚未覆盖: 哪些缺口最值得优先推进仍缺乏排序依据。
    - 路线: 可验证任务合成与用于计算机使用智能体的在线强化学习
      解决的问题: 通过可验证任务和奖励信号扩展智能体训练，减少手工监督。
      尚未覆盖: 自主评估器带来的奖励噪声，以及OSWorld/ScienceBoard类环境之外的迁移仍未解决。
    - 路线: 基准驱动的能力与失效隔离
      解决的问题: 在受控设置中分离视频引导定位、短信到网页欺诈、提示注入安全和不确定性行为。
      尚未覆盖: 结论常依赖被屏蔽的捷径、窄域或单步交互面，多步轨迹评测不足。
    - 路线: 长时程GUI任务的上下文与感知管理
      解决的问题: 通过结构化上下文记忆或任务感知关键帧提取改进长时程移动或网页行为。
      尚未覆盖: 分布外泛化和感知-上下文联合方法的证据仍然不足。
    共识:
    - 前沿工作普遍将GUI和计算机使用智能体视为需要隔离具体失效模式的系统，而不是只报告单一总分。
    - 多数证据采用受控任务构造和智能体与基线对比，并以成功率或排序作为主要结果。
    - 研究者一致认为当前智能体在分布偏移、捷径被屏蔽或长时程上下文中存在明确鲁棒性边界。
    分歧:
    - 监督信号不同：有的采用标注轨迹的监督微调，有的采用可验证奖励或自评估器反馈进行在线强化学习。
    - 评测目标不同：能力、提示注入安全、不确定性校准、欺诈检测和视频引导规划分别被优先处理。
    - 交互粒度和领域不同：单步可执行定位与多步移动或网页轨迹使结果难以互换。
    - 表示方式不同：结构化上下文动作、关键帧提取与单纯基准观测各自针对不同失效模式。
    开放问题:
    - 报告的成功率提升在OSWorld、ScienceBoard、MobileWorld或浏览器安全基准之间能迁移多少？
    - 可验证任务合成和自评估器奖励能否足够可靠地用于强化学习，而不引入掩盖策略提升的奖励噪声？
    - 什么系统分类能协调单步定位与多步轨迹证据，调查应如何对待内部状态不可见的闭源证据？
    - 长时程记忆、不确定性校准、提示注入安全和类欺诈任务的良性召回之间，哪类缺口最优先？
    - 缺失代码、数据和局限说明应如何被视为可复现性审计缺口，而非模型能力证据？
