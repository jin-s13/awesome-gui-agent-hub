  - 主流方向：当前前沿通过基准驱动的形式化和方法研究，显式刻画GUI智能体的交互、可靠性与改进信号，而非独立理论。
  - 研究共性：引入任务抽象或评测指标，并比较前沿模型在该视角下的表现，以揭示聚合成功率掩盖的能力差异。
  - 关键差异：研究在改进模型、改进harness/技能层或改进评测视角之间选择不同；交互单位涵盖动态界面、GUI+CLI、拖拽和单步定位。
  - 趋势演进：可得顶级证据集中在2026年，跨度太窄，难以推断长期趋势；当前前沿内正从静态点击成功率转向细粒度、动态、多模态和不确定性感知评测。
