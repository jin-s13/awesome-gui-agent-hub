  related_work_outline_zh:
  - 主流方向：可运行 GUI 与计算机使用智能体系统正聚集到基于执行反馈、多轮交互和状态验证的开放框架与基准上。
  - 研究共性：系统将视觉定位、动作执行与状态/过渡检查或可复用技能记忆结合，以降低推理成本并提升可靠性。
  - 关键差异：监督信号、生成表示、部署场景和系统层次不同，涵盖弱监督、在线强化学习、扩散解码、执行记忆与诊断基准。
  - 趋势演进：从静态单帧定位向真实网页在线训练、容器化编排、执行级记忆和科学软件等专业场景演进。
  - 开放问题：错误恢复、框架可训练性、离线诊断到实时交互迁移及独立复现证据仍是缺口。
  literature_review:
    line_of_work_matrix:
    - line: Harness-native training and orchestration frameworks
      what_it_solves: Turns complex inference harnesses and models into end-to-end
        trainable or deployable agents through proxies, containerized rollouts, and
        multi-turn execution across GUI and web environments.
      what_remains_open: Error recovery remains weak after training, and harness design
        heavily influences trainability; independent reproduction across teams and
        infrastructure is not yet evidenced in the packet.
    - line: Weakly supervised and online reinforcement learning for visual GUI/web
        agents
      what_it_solves: Reduces dependence on costly demonstrations by learning visual
        grounding from massive unannotated screenshots or by training on live websites
        with trajectory-level success signals.
      what_remains_open: Current evidence relies on small high-quality calibration
        sets or specific benchmark sites; generalization to long-tail failure states
        and broader domains remains unclear.
    - line: Reusable multimodal skills and execution-level memory
      what_it_solves: Converts validated GUI trajectories into structured skill libraries
        or callable memories with visual evidence and parameter control, reducing
        token cost and execution time on repeated workflows.
      what_remains_open: Deterministic preconditions and ambiguous-step rejection
        limit open-ended use; adaptation to interface changes, cross-application workflows,
        and memory lifecycle is unresolved.
    - line: Alternative generation architectures for GUI agents
      what_it_solves: Explores block-wise diffusion as a multimodal GUI agent generation
        paradigm, aiming to preserve parallel decoding advantages while handling grounding
        and navigation.
      what_remains_open: Evidence is concentrated on selected grounding and navigation
        benchmarks; failure analysis and broader reproduction evidence are not fully
        visible in the packet.
    - line: Execution-based and transition-level benchmark environments
      what_it_solves: Measures computer-use capability through multi-step task execution,
        scientific software workflows, and GUI state transitions rather than only
        single-frame grounding or final task accuracy.
      what_remains_open: Offline benchmarks miss asynchronous timing and live interaction
        dynamics; current evidence is limited to particular operating systems, action
        vocabularies, and domain coverage.
    consensus:
    - Computer-use and GUI agents are increasingly evaluated through execution outcomes
      or state transitions, because single-frame grounding and final-task accuracy
      do not isolate state verification, source tracking, or workflow correctness.
    - Visual and multimodal evidence from screenshots or before-after GUI frames is
      central to grounding actions; retaining visual figures can improve UI element
      identification and workflow state verification.
    - Open, containerized, or live-environment frameworks are favored for multi-turn
      training and evaluation across websites, desktop environments, and scientific
      software.
    disagreements:
    - 'Supervision signals differ: weakly supervised learning from massive unannotated
      screenshots, online multi-turn trajectory-level reinforcement learning, and
      expert-designed execution-based tasks impose different data and reward assumptions.'
    - 'Representation choices differ: block-wise diffusion vision-language generation
      is advanced for parallel decoding, while other works build on conventional vision-language
      model agent pipelines.'
    - 'Evaluation settings differ: live websites, offline Linux desktop transitions,
      scientific software workflows, and step-level diagnostics vary in whether they
      capture asynchronous dynamics and domain-specific interfaces.'
    - 'System contribution layer differs: training/orchestration frameworks, reusable
      execution memory or skill libraries, and benchmark harnesses address different
      bottlenecks in a deployed agent stack.'
    open_questions:
    - How can reinforcement-learned GUI agents improve error recovery without over-constraining
      harness design or losing live-environment generality?
    - Do offline GUI-transition diagnostics transfer to live asynchronous interaction,
      and which evaluation signals predict real computer-use reliability?
    - What are the boundaries of reusable multimodal skills and replayable memories
      under interface changes, cross-application workflows, and ambiguous state preconditions?
    - How much annotated data is truly necessary once unannotated screenshots or online
      reward are available for general web, desktop, and scientific software tasks?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 可运行智能体训练与编排框架
      解决的问题: 通过代理、容器化回滚和多轮执行，把复杂推理框架与模型接入端到端训练或部署，覆盖 GUI、网页和工具环境。
      尚未覆盖: 训练后错误恢复仍较弱，框架设计显著影响可训练性，跨团队与基础设施的独立复现证据尚不充分。
    - 路线: 视觉 GUI/网页智能体的弱监督与在线强化学习
      解决的问题: 利用海量未标注截图学习视觉定位，或在真实网站上以轨迹级成功信号训练，降低对昂贵演示标注的依赖。
      尚未覆盖: 现有证据依赖少量高质量校准集或特定评测网站，对长尾失败状态和更广泛领域的泛化仍不明确。
    - 路线: 可复用多模态技能与执行级记忆
      解决的问题: 将已验证 GUI 轨迹转化为结构化技能库或可调用记忆，保留视觉证据并控制参数，降低重复工作流的 token 和执行时间。
      尚未覆盖: 确定性前提和歧义步骤拒绝限制了开放使用，界面变化、跨应用工作流和记忆生命周期仍未解决。
    - 路线: GUI 智能体的替代生成架构
      解决的问题: 探索块级扩散作为多模态 GUI 智能体生成范式，在完成定位和导航的同时尽量保留并行解码优势。
      尚未覆盖: 证据集中在选定的定位与导航基准上，失败分析和更广泛的复现证据在数据包中尚不完整。
    - 路线: 执行式与过渡级基准环境
      解决的问题: 通过多步任务执行、科学软件工作流和 GUI 状态过渡评测计算机使用能力，而不只关注单帧定位或最终任务正确率。
      尚未覆盖: 离线基准难以捕捉异步时序和实时交互动态，当前证据限于特定操作系统、动作词汇和领域覆盖。
    共识:
    - 计算机使用与 GUI 智能体研究正从单帧视觉定位转向执行结果和状态过渡评测，以覆盖状态验证、来源跟踪和工作流正确性。
    - 来自截图或前后 GUI 帧的视觉与多模态证据对动作定位很重要，保留视觉图形可以改善 UI 元素识别和工作流状态检查。
    - 开放、容器化或真实环境框架更受重视，用于在网页、桌面和科学软件中进行多轮训练与评测。
    分歧:
    - 监督信号不同：海量未标注截图弱监督、在线多轮轨迹级强化学习、专家设计执行式任务，对数据和奖励的假设不同。
    - 表示选择不同：块级扩散视觉语言生成强调并行解码，而其他工作沿用常规视觉语言模型智能体流程。
    - 评测设置不同：真实网页、离线 Linux 桌面过渡、科学软件工作流和步骤级诊断在是否捕获异步动态和领域接口上存在差异。
    - 系统贡献层次不同：训练/编排框架、可复用执行记忆或技能库、基准环境分别针对部署智能体栈中的不同瓶颈。
    开放问题:
    - 强化学习训练的 GUI 智能体如何在不限制框架设计或损失开放环境泛化能力的前提下改善错误恢复？
    - 离线 GUI 过渡诊断能否迁移到实时异步交互，哪些评测信号能预测真实计算机使用可靠性？
    - 可复用多模态技能和可回放记忆在界面变化、跨应用工作流和歧义状态前提下的边界在哪里？
    - 当未标注截图或在线奖励可用时，通用网页、桌面和科学软件任务究竟需要多少人工标注数据？
