  literature_review:
    line_of_work_matrix:
    - line: Benchmarking dynamic and long-horizon GUI interactions
      what_it_solves: Captures agent capabilities on tasks that require continuous
        observation control, drag-based actions, or multi-application workflows, which
        are missing from earlier static-screenshot benchmarks.
      what_remains_open: Most benchmarks still evaluate single-step or short-horizon
        success; generalization across platforms and the propagation of uncertainty
        in multi-step trajectories remain largely unmeasured.
    - line: Knowledge augmentation via multimodal skills and context management
      what_it_solves: Improves agent performance and consistency by providing structured,
        retrievable knowledge (skill libraries with visual figures) or by actively
        compressing and maintaining relevant context across long interactions.
      what_remains_open: The cross-application transferability of skill libraries
        and the scalability of active context management to extremely large state
        spaces have not been validated.
    - line: Scalable and data-efficient training of GUI agents
      what_it_solves: Reduces the reliance on expensive human annotations by leveraging
        massive unlabeled screenshots, verifiable synthetic task generation, and online
        RL with efficient sampling strategies.
      what_remains_open: The distributional match between synthetic/weakly-supervised
        training tasks and real user tasks is not guaranteed, and the safety implications
        of training on unverified interactions are unexplored.
    - line: Uncertainty quantification and safety framing for GUI grounding
      what_it_solves: Provides post-hoc confidence scores for action predictions,
        enabling risk-aware decision-making and spatial safety through conformal prediction
        regions.
      what_remains_open: Current UQ methods are evaluated only on single-step grounding;
        their calibration and usefulness over multi-step agent trajectories and in
        closed-loop human-AI collaboration remain unverified.
    consensus:
    - Current agents struggle with dynamic interfaces and long-horizon tasks due to
      poor observation control and context management, even when they achieve high
      single-step grounding accuracy.
    - Retaining visual information in skill artifacts or UI representations yields
      significant gains over text-only approaches, because it improves UI element
      identification and workflow state verification.
    - Fine-grained evaluation metrics (e.g., sub-goal completion, cost-accuracy, multi-checkpoint
      scoring) expose capability differences that are hidden by aggregate task success
      rates.
    - Uncertainty quantification methods are sensitive to the model tier and interface
      type, with stable rankings within open-weight models but weak transfer to closed-source
      systems.
    disagreements:
    - Some works inject task knowledge through explicit, human-authored multimodal
      skill libraries, while others train agents end-to-end via online RL, betting
      on environmental interaction to build the necessary skills.
    - Benchmarks target fundamentally different interaction surfaces (static desktop
      screenshots, dynamic short-video feeds, mobile long-horizon tasks) without a
      common evaluation protocol, making cross-paper performance comparisons fragile.
    - 'The choice of uncertainty quantification approach varies: hidden-state and
      density-based methods show the most stable open-weight rankings, but verbalized
      confidence and conformal prediction are preferred for closed-source settings
      where internal states are inaccessible, and there is no consensus winner across
      all regimes.'
    open_questions:
    - Can observation control be formalized as a learnable policy that decides when
      to stop observing and act, rather than being a fixed hyperparameter?
    - How can drag-based, continuous-interaction grounding be unified with discrete
      click-based grounding in a single action representation?
    - Do agents trained on verifiable synthetic tasks maintain their performance and
      safety guarantees when deployed on real-world, out-of-distribution tasks?
    - How can post-hoc uncertainty quantification be extended to full multi-step trajectories
      to support reliable human-in-the-loop decision-making and early termination?
