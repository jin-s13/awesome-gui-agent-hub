  related_work_outline_zh:
  - 主流方向：在真实计算机使用任务上构建、扩展和评估视觉语言GUI智能体，重点是基于截图的视觉定位、任务完成率和细粒度交互指标。
  - 研究共性：论文通常同时提出任务形式或基准，以及改善训练数据、强化学习采样、关键帧/场景选择或执行框架优化的方法。
  - 关键差异：监督与适应路径不同，包括未标注截图弱监督、可验证任务合成的在线强化学习、冻结模型执行框架编辑；评测在系统/界面、动作类型和指标上也不同。
  - 趋势演进：证据集中在2026年前沿，工作正从静态点击或最终得分评测，走向动态观察控制、成本-精度、拖拽/视频定位和逐步骤不确定性/证据分析。
  - 开放问题：跨基准与跨界面迁移、模型与框架/任务设计的收益归属、观察控制、不确定性迁移、动态与拖拽任务覆盖仍未有结论。
  literature_review:
    line_of_work_matrix:
    - line: Scalable training and supervision for GUI agents
      what_it_solves: Reduces reliance on costly human annotations and improves task
        success by combining unannotated screenshots or synthesized verifiable tasks
        with curriculum or RL.
      what_remains_open: Transfer outside OSWorld/ScienceBoard and whether gains are
        driven by task synthesis, reward design, or base model capability.
    - line: Grounding and interaction-action interfaces
      what_it_solves: Covers action types beyond click such as drag, video-guided
        keyframe selection, and dynamic observation control in GUI tasks.
      what_remains_open: Observation-control and dynamic/drag transfer beyond specific
        platforms, and cost-accuracy under changing content.
    - line: Execution-harness and planning optimization
      what_it_solves: Improves frozen GUI agents by optimizing the executable harness
        through evidence from repeated runs, screenshots, or skill libraries.
      what_remains_open: Attribution of gains between harness, skill library, and
        model; transfer to new benchmarks remains only partly tested.
    - line: Benchmarks, metrics, and evidence protocols
      what_it_solves: Provides fine-grained, deterministic or rule-based evaluation,
        sub-goal scoring, cost-accuracy, and uncertainty quantification for GUI grounding.
      what_remains_open: Single-step vs multi-step trajectory coverage, distribution-shift
        robustness, and missing limitation/reproducibility details in several reports.
    - line: Uncertainty and safe deployment for GUI grounding
      what_it_solves: Benchmarks post-hoc uncertainty quantification and conformal
        click regions to detect unreliable actions and reduce spatial risk.
      what_remains_open: Rankings transfer weakly across model tiers and interfaces;
        calibrated coverage degrades under mismatch.
    consensus:
    - Vision-language models are the dominant agent substrate; task success is measured
      on GUI grounding and computer-use benchmarks, often with Pass@1 or cost-accuracy.
    - Visual grounding from screenshots is treated as central, and fine-grained sub-goal
      or interaction completion reveals differences hidden by aggregate success.
    - Training/supervision is shifting from expensive annotations to unannotated screenshots
      or verifiable synthesized tasks, sometimes with RL or curriculum stages.
    - Several papers separate final score from evidence quality, such as deterministic
      rules, uncertainty, repeated runs, or fine-grained checkpoints.
    - Evaluation is increasingly dynamic, multi-application, or action-typed rather
      than static click-only.
    disagreements:
    - One line freezes the model and optimizes the execution harness, while another
      fine-tunes with weakly supervised data or online RL; these imply different claims
      about where intervention should occur.
    - Some evaluations target macOS desktop multi-app tasks, others target dynamic
      short-video interfaces, video-guided tasks, drag interactions, or single-step
      grounding; the action assumptions differ accordingly.
    - 'Metrics differ: deterministic Pass@1 versus cost-accuracy, fine-grained sub-goal
      scoring, training speedup, or post-hoc uncertainty ranking.'
    - Some methods depend on open-weight internal states for fine-tuning and uncertainty
      quantification, while harness-only approaches are compatible with closed-source
      models; transfer across these settings is weak.
    - Observation control is treated as a missing agent capability in one benchmark,
      but other methods focus on keyframe extraction, drag grounding, or task synthesis,
      leaving the boundary unclear.
    open_questions:
    - Do improvements on OSWorld, ScienceBoard, or specific platform benchmarks transfer
      across OS, app, and interaction types without re-optimization?
    - How much of reported performance comes from the model, harness, skill library,
      task synthesis, or reward design rather than the named method?
    - Can agents learn to regulate observation to avoid over- and under-observation
      in dynamic interfaces?
    - Which post-hoc uncertainty signals remain reliable when moving from open-weight
      to closed-source models or across GUI grounding datasets?
    - How should drag, CLI, and dynamic content interactions be combined in one evidence
      protocol without losing fine-grained attribution?
    - Several top papers lack visible limitation fields; what verification gaps remain
      for multi-step, cross-interface, and failure-mode robustness?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 面向GUI智能体的可扩展训练与监督方法
      解决的问题: 通过未标注截图或可验证合成任务，结合课程学习或在线强化学习，减少人工标注依赖并提升任务成功率。
      尚未覆盖: OSWorld/ScienceBoard之外的迁移，以及收益来自任务合成、奖励设计还是基座模型能力不明确。
    - 路线: 视觉定位与动作交互接口
      解决的问题: 覆盖点击以外的拖拽、视频引导关键帧选择和动态观察控制等GUI任务动作形式。
      尚未覆盖: 动态与拖拽能力在特定平台之外的迁移，以及内容变化下的成本-精度表现仍不充分。
    - 路线: 执行框架与规划优化
      解决的问题: 通过证据驱动地优化执行框架，利用重复运行、截图或技能库提升冻结模型的表现。
      尚未覆盖: 收益在模型、技能库与框架之间的归属不明，跨基准迁移测试仍有限。
    - 路线: 基准、指标与证据协议
      解决的问题: 提供细粒度、确定性或规则化评估、子目标评分、成本-精度和GUI定位的不确定性量化。
      尚未覆盖: 单步与多步轨迹覆盖、分布偏移鲁棒性，以及若干报告中可见的局限性/可复现证据缺口。
    - 路线: GUI定位的不确定性与安全部署
      解决的问题: 基准化后验不确定性量化与共形点击区域，用于识别不可靠动作并降低空间风险。
      尚未覆盖: 不确定性排序跨模型层级和界面迁移较弱，校准-测试或接口不匹配下覆盖度下降。
    共识:
    - 视觉语言模型是主导的智能体基座，任务成功率在GUI定位和计算机使用基准上以Pass@1或成本-精度等方式衡量。
    - 截图的视觉定位被普遍视为核心，细粒度子目标或交互完成能揭示总成功率掩盖的差异。
    - 训练与监督正从昂贵的人工标注转向未标注截图或可验证合成任务，并常与强化学习或课程学习结合。
    - 多个工作区分最终得分与证据质量，采用规则化检查、不确定性、重复运行或细粒度检查点。
    - 评估趋向动态、多应用或按动作类型区分，而不再只是静态点击任务。
    分歧:
    - 一条路线冻结模型并优化执行框架，另一条路线通过弱监督或在线强化学习更新模型；二者对干预位置的假设不同。
    - 评测目标覆盖macOS多应用任务、动态短视频界面、视频引导任务、拖拽交互或单步定位，动作假设相应不同。
    - 指标选择不同：确定性Pass@1、成本-精度、子目标得分、训练加速或后验不确定性排名并存。
    - 部分方法依赖开源权重内部状态进行微调和不确定性量化，而框架优化方法可适配闭源模型；跨设置迁移较弱。
    - 观察控制在一个基准中被视为缺失能力，但其他方法关注关键帧提取、拖拽定位或任务合成，边界仍不清晰。
    开放问题:
    - OSWorld、ScienceBoard或特定平台基准上的提升能否在系统、应用和交互类型间不经重新优化而迁移？
    - 报告性能中有多少来自模型、执行框架、技能库、任务合成或奖励设计，而不是名义方法本身？
    - 智能体能否学习调节观察，以避免动态界面中的过度观察与观察不足？
    - 哪些后验不确定性信号在从开源权重转向闭源模型或跨GUI定位数据集时仍然可靠？
    - 如何在一个证据协议中同时覆盖拖拽、CLI和动态内容交互，而不丢失细粒度归因？
    - 若干论文未提供可见局限性字段，多步、跨界面和失败模式鲁棒性还有哪些验证缺口？
