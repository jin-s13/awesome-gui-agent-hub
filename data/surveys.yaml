      尚未覆盖: 证据受平台/动作类型限制；采样记录的局限性常被省略，基准收益尚未与真实部署可靠性关联。
    - 路线: 可靠性与不确定性量化
      解决的问题: 形式化GUI定位的后验不确定性，并构建共形点击区域以量化预测的空间安全范围。
      尚未覆盖: 当前证据仅覆盖单步定位；跨模型/接口迁移弱，且分布或接口偏移下共形覆盖率下降。
    - 路线: 技能与上下文管理
      解决的问题: 组织多模态技能工件和主动上下文动作，以减少长时域或复杂计算机使用任务中的观察与历史失败。
      尚未覆盖: 评测限于选定基准和模型家族；超出报告任务的长时域泛化尚未建立。
    - 路线: 数据高效训练与可验证RL
      解决的问题: 通过未标注截图、可验证任务合成或前沿采样在线RL降低标注依赖并改进策略性能。
