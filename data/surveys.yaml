  - 主流方向：当前可见证据以GUI/计算机使用智能体的基准评测和训练方法为主，涵盖OSWorld、ScienceBoard、MobileWorld及浏览器、移动、编码等任务；综述主题需要从原始方法和基准论文中反推，而非来自正式综述论文。
  - 研究共性：通常以受控基准或任务集配合视觉语言模型骨干，衡量成功率、排名迁移或安全与可靠性结果；合成任务和自主评估器被跨研究复用。
  - 关键差异：研究在评测范围如单步基础与多步轨迹、监督信号如SFT与在线RL与零样本、状态表示如关键帧与结构化上下文与净化证据、以及可靠性目标如不确定性、欺诈、提示注入或奖励噪声等方面不同。
  - 趋势演进：在2024-2026窄时段内，研究正从静态GUI基础走向主动上下文管理、可验证任务合成、带噪声校正的在线RL和领域条件安全审计。
  - 开放问题：跨基准可比性、闭源迁移、真实线索可用性、代码与局限细节缺失，以及已诊断缺口的优先级仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: Taxonomy and roadmap synthesis from primary evidence
      what_it_solves: Organizes GUI-agent progress into directions, milestones, and
        gaps from method and benchmark papers rather than from dedicated surveys.
      what_remains_open: Systematic inclusion criteria and survey methodology are
        not visible; selective top-ranked papers may bias the resulting map.
    - line: Comparative evaluation synthesis
      what_it_solves: Summarizes how controlled evaluation choices such as masked
        cues, task domain, single-step versus multi-step trajectories, and model accessibility
        shape conclusions and rankings.
      what_remains_open: Compatibility of reported results across benchmarks and model
        tiers is unresolved; target-specific re-ranking suggests weak transfer across
        settings.
    - line: Open problem and gap mapping
      what_it_solves: Turns controlled audits of fraud recall, uncertainty calibration,
        safety domain conditioning, and reward noise into concrete next research questions.
      what_remains_open: Artificial cue suppression and narrow failure models may
        not generalize; gap prioritization is not empirically established.
    - line: Long-horizon context and experience distillation
      what_it_solves: Improves GUI-agent planning by extracting keyframes, structured
        context fields, or multimodal tutorials from trajectories and human demonstrations.
      what_remains_open: Cross-domain and long-horizon verification is limited; missing
        code or limitations and narrow benchmark breadth leave generalization open.
    consensus:
    - Vision-language models are the common backbone for GUI and computer-use agents
      in this evidence.
    - Controlled benchmarks and task sets are the main method for surfacing agent
      brittleness.
    - Success rate and ranking transfer are dominant metrics, with increasing attention
      to reliability and safety signals.
    - Synthetic tasks and autonomous or verifiable evaluation signals are used to
      scale training and assessment.
    - Long-horizon performance is addressed by compressing or selecting state, whether
      via keyframes, structured context, or tutorials.
    disagreements:
    - 'Evaluation scope: single-step executable grounding versus multi-step browser,
      mobile, or coding trajectories.'
    - 'Supervision signal: supervised fine-tuning on annotated trajectories versus
      online RL with verifiable rewards versus zero-shot or post-hoc evaluation.'
    - 'State representation: visual keyframes versus structured UI and action history
      versus sanitized webpage evidence.'
    - 'Reliability target: uncertainty calibration, fraud detection, prompt-injection
      safety, or reward noise; each assumes a different failure model.'
    - 'Deployment setting: open-weight models with internal-state access versus closed-source
      frontier APIs; cross-setting transfer is weak.'
    open_questions:
    - What standardized evaluation protocol would make GUI-agent results comparable
      across single-step, multi-step, browser, mobile, and coding settings?
    - Can uncertainty rankings and safety resistance transfer across model tiers without
      target-specific re-evaluation?
    - How well do active context management and human-experience distillation generalize
      beyond the reported mobile or GUI benchmarks?
    - What would a systematic survey synthesis change if missing code, datasets, limitation
      statements, and citation data were available?
    - Which diagnosed gaps, such as weak benign recall, domain-conditioned safety,
      reward noise, or context length, should the field prioritize?
