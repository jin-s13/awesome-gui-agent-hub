  related_work_outline:
  - 'Mainstream direction: building higher-fidelity GUI agent benchmarks (desktop,
    mobile, short-video platforms) that capture real-world complexity, and developing
    data-efficient training methods via weak supervision, verifiable task synthesis,
    and online RL.'
  - 'Shared research pattern: almost all works focus on improving visual grounding
    and action prediction; they evaluate on multi-step task completion, often using
    fine-grained metrics like sub-goal success or cost-accuracy to reveal model weaknesses
    beyond pass rates.'
  - 'Key differences: evaluation environments are fragmented (macOS desktop, browsing-based
    short-video, mobile) with distinct action spaces (click, drag, GUI+CLI, dynamic
    observation); training paradigms range from SFT with context management to online
    RL with synthetic tasks, while uncertainty quantification addresses only single-step
    grounding.'
  - 'Trend evolution: the frontier (2024–2026) is shifting from static GUI screens
    to dynamic, living-screen and video-guided tasks, from click-only to drag and
    mixed-mode interaction, and from fully human-annotated data to weak supervision
    and automated task generation pipelines.'
  - 'Open questions: how to transfer uncertainty quantification from single-step to
    multi-step agents, whether weak supervision generalizes to complex interaction
    types like drag, how to design adaptive context management for open-ended long-horizon
    tasks, and how to align evaluation across heterogeneous benchmarks.'
  related_work_outline_zh:
  - 主流方向：构建更高保真度的GUI代理基准（桌面、移动、短视频平台），捕捉真实世界的复杂性，并通过弱监督、可验证任务合成和在线强化学习开发数据高效的训练方法。
  - 研究共性：几乎所有工作都关注提升视觉定位和动作预测能力；它们评估多步任务完成情况，通常使用细粒度指标（如子目标成功率或成本-准确率）揭示模型在通过率之外的弱点。
  - 关键差异：评估环境碎片化（macOS桌面、基于浏览器的短视频、移动端），动作空间各异（点击、拖拽、GUI+CLI、动态观察）；训练范式从带上下文管理的SFT到合成任务的在线RL，而不确定性量化仅处理单步基础。
  - 趋势演进：前沿（2024–2026）正从静态GUI屏幕转向动态、实时屏幕和视频引导任务，从仅点击到拖拽和多模式交互，从完全人工标注数据到弱监督和自动化任务生成流程。
  - 开放问题：如何将不确定性量化从单步迁移到多步代理，弱监督能否推广到拖拽等复杂交互类型，如何为开放式长周期任务设计自适应上下文管理，以及如何在不同的基准之间进行对齐评估。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark construction and evaluation design
      what_it_solves: Provides standardized environments to measure GUI agent capabilities
        across real desktop, dynamic short-video, and drag-based tasks, uncovering
        failure modes like over- and under-observation.
      what_remains_open: Cross-benchmark comparability and correlation with real-world
        deployment performance remain weak; most benchmarks are limited to single-step
        or short-horizon tasks, and evaluation protocols often ignore calibration
        of model confidence.
    - line: Training paradigm and data efficiency
      what_it_solves: Reduces reliance on expensive human annotations through weak
        supervision from unannotated screenshots, verifiable task synthesis, and online
        RL with frontier sampling, achieving competitive performance with minimal
        annotated data.
      what_remains_open: Fair comparison across SFT, RL, and weak supervision is missing;
        generalization to new platforms and interaction types (e.g., drag, dynamic
        content) is not established beyond the reported settings.
    - line: Interaction space and action grounding
      what_it_solves: Expands agent action spaces to include drag, GUI+CLI hybrid,
        and dynamic observation control, addressing the gap left by click-only agents
        and enabling richer task execution.
      what_remains_open: Model performance on these extended actions remains far below
        human level; effective training strategies specifically for drag and dynamic
        observation are not yet developed, and current benchmarks are not sufficient
        to drive progress.
    - line: Uncertainty quantification and safety
      what_it_solves: Evaluates post-hoc UQ methods for single-step GUI grounding,
        identifying stable UQ families and demonstrating that conformal click regions
        can shrink safety radii with calibrated confidence.
      what_remains_open: Limited to single-step grounding; not integrated into multi-step
        agent trajectories. Cross-model UQ ranking transfer is weak, especially to
        closed-source models, and conformal coverage degrades under distribution shift.
    - line: Long-horizon context management
      what_it_solves: Maintains critical information in long-horizon tasks by treating
        context management as first-class actions (ConAct), avoiding context overflow
        and performance degradation seen in passive history accumulation.
      what_remains_open: Validation is limited to a mobile dataset; generalization
        to open-domain tasks and dynamic environments is not tested, and the trade-off
        between context compression and task fidelity needs further study.
    consensus:
    - Current GUI agents suffer from poor observation control on dynamic interfaces,
      leading to over-observation and under-observation as dominant failure modes.
    - Data efficiency is a critical bottleneck; weak supervision, synthetic task generation,
      and online RL are promising directions to reduce annotation cost.
    - Fine-grained evaluation metrics (e.g., sub-goal completion, cost-accuracy) are
      necessary to capture model differences that aggregate pass rates miss.
    disagreements:
    - 'Evaluation environments differ substantially: desktop (MacAgentBench), browser-based
      short-video (LivingScreen), and mobile (MemGUI-Bench), making direct performance
      comparison unreliable.'
    - 'Action spaces are defined differently across works: some focus on click-only,
      while others extend to drag, GUI+CLI, or dynamic observation, creating incomparable
      task difficulty.'
    - 'Training paradigms are heterogeneous: supervised fine-tuning, online RL with
      frontier sampling, and two-stage weak supervision with curriculum learning,
      without a consensus on which is most effective for generalization.'
    - Uncertainty quantification is studied only for single-step grounding, while
      other agent systems address multi-step planning and execution, leaving a gap
      between safety analysis and practical agent deployment.
    open_questions:
    - How can uncertainty quantification be integrated into multi-step agent loops
      to enable safe fallback or human intervention across diverse interfaces?
    - Can weak supervision methods scale to complex interaction types like drag and
      dynamic observation, which are not covered by current unannotated screenshot
      approaches?
    - What adaptive context management strategies allow long-horizon agents to maintain
      performance across heterogeneous tasks and environments without hand-crafted
      compression rules?
    - Is it possible to build a unified evaluation framework that maps progress across
      disparate GUI agent benchmarks and action spaces?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准构建与评估设计
      解决的问题: 提供标准化环境，衡量GUI代理在真实桌面、动态短视频和拖拽任务中的能力，揭示过度观察和观察不足等失败模式。
      尚未覆盖: 跨基准可比性及与真实部署性能的关联仍较弱；大多数基准限于单步或短周期任务，评估协议通常忽略模型置信度校准。
    - 路线: 训练范式与数据效率
      解决的问题: 通过未标注截图的弱监督、可验证任务合成和带前沿采样的在线强化学习，减少对昂贵人工标注的依赖，以最少标注数据取得竞争性性能。
      尚未覆盖: 缺乏SFT、RL和弱监督之间的公平比较；在新平台和交互类型（如拖拽、动态内容）上的泛化未超出报告设置。
    - 路线: 交互空间与动作基础
      解决的问题: 将代理动作空间扩展到拖拽、GUI+CLI混合和动态观察控制，弥补仅点击代理的不足，使更丰富的任务执行成为可能。
      尚未覆盖: 模型在这些扩展动作上的性能仍远低于人类；尚未开发专门针对拖拽和动态观察的有效训练策略，当前基准不足以推动进展。
    - 路线: 不确定性量化与安全性
      解决的问题: 评估单步GUI基础的后验UQ方法，识别稳定的UQ家族，并展示共形点击区域可通过校准置信度缩小安全半径。
      尚未覆盖: 仅限于单步基础；未集成到多步代理轨迹中。跨模型UQ排名迁移较弱，尤其是到闭源模型，且共形覆盖在分布偏移下下降。
    - 路线: 长周期上下文管理
      解决的问题: 通过将上下文管理视为第一类动作（ConAct），在长周期任务中保持关键信息，避免被动历史累积导致的上下文溢出和性能下降。
      尚未覆盖: 验证仅限于移动数据集；在开放域任务和动态环境中的泛化未经测试，上下文压缩与任务保真度之间的权衡需进一步研究。
    共识:
    - 当前GUI代理在动态界面上普遍存在观察控制能力不足，导致过度观察和观察不足成为主要失败模式。
    - 数据效率是一个关键瓶颈；弱监督、合成任务生成和在线强化学习是减少标注成本的有前景的方向。
    - 细粒度评估指标（如子目标完成度、成本-准确率）对于捕捉聚合通过率遗漏的模型差异是必要的。
    分歧:
    - 评估环境差异显著：桌面（MacAgentBench）、基于浏览器的短视频（LivingScreen）和移动端（MemGUI-Bench），使得直接性能比较不可靠。
    - 动作空间定义不同：有些聚焦点击，而另一些扩展到拖拽、GUI+CLI或动态观察，造成任务难度不可比。
    - 训练范式异构：有监督微调、带前沿采样的在线RL，以及带课程学习的两阶段弱监督，对于哪种范式最有利于泛化尚无共识。
    - 不确定性量化仅针对单步基础研究，而其他代理系统处理多步规划和执行，导致安全分析与实际代理部署之间存在鸿沟。
    开放问题:
    - 如何将不确定性量化集成到多步代理循环中，以便在多样界面中实现安全回退或人工干预？
    - 弱监督方法能否扩展到拖拽和动态观察等复杂交互类型，这些类型未被当前未标注截图方法覆盖？
    - 什么自适应上下文管理策略能让长周期代理在异构任务和环境中保持性能，而无需手工设计的压缩规则？
    - 能否构建一个统一的评估框架，映射不同GUI代理基准和动作空间之间的进展？
