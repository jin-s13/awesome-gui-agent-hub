  related_work_outline:
  - 'Mainstream direction: benchmark-driven task formalization and reliability/training
    for GUI agents, with representative examples such as MacAgentBench, LivingScreen,
    and DragOn for task surfaces; VISUALSKILL and GUI-HARVEST for external reliability;
    ScaleCUA and GUICrafter for scalable supervision.'
  - 'Shared research pattern: define or construct reproducible task surfaces, evaluate
    with metrics finer than pass rate, and use screenshots, before/after states, or
    repeated runs as ground evidence for diagnosis.'
  - 'Key differences: improvement locus spans training-time RL/weak supervision versus
    frozen-model external skills/harnesses; evaluation targets range from static desktop
    and drag to dynamic feeds and single-step grounding uncertainty; correctness signals
    vary from deterministic rules to cost-accuracy and conformal coverage.'
  - 'Trend evolution: within the current 2024–2026 frontier, work moves from static
    click/grounding tasks toward realistic multi-app, drag, GUI+CLI, and dynamic-screen
    settings, then adds reliability, uncertainty, observation control, and data/training
    efficiency.'
  - 'Open questions: transfer of task formalizations and metrics across platforms
    and long trajectories, weak cross-model/interface uncertainty transfer, how observation
    control arises, generalization of synthetic/weak supervision, and reproducibility
    gaps from missing artifacts or limitations in several records.'
  related_work_outline_zh:
  - 主流方向：围绕GUI代理的基准驱动任务形式化、外部可靠性层与可扩展训练/弱监督，而非纯形式证明。
  - 研究共性：定义或构建可复现任务表面，用比Pass@1更细的指标评测，并以截图、执行前后状态或重复运行作为诊断证据。
  - 关键差异：改进位置含训练时RL/弱监督与冻结模型外部技能/执行框架；评测目标覆盖静态桌面、拖拽、动态信息流和单步定位不确定性；正确性信号从确定性规则到成本准确率和共形覆盖不一。
  - 趋势演进：在2024–2026前沿内，从静态点击/定位扩展到真实多应用、拖拽、GUI+CLI和动态屏幕，再进入可靠性、不确定性、观察控制与数据/训练效率。
  - 开放问题：任务形式化与指标跨平台和长程迁移；UQ跨模型/接口迁移弱；观察控制如何产生；合成/弱监督泛化；若干论文缺失代码、数据、基线或局限性构成验证缺口。
  literature_review:
    line_of_work_matrix:
    - line: Task-surface formalization and benchmark construction
      what_it_solves: Turns GUI capabilities such as desktop workflows, drag interactions,
        dynamic content feeds, and single-step grounding into reproducible tasks with
        deterministic or cost-aware metrics.
      what_remains_open: Whether task-specific formalizations and scoring rules transfer
        across interfaces and multi-step trajectories remains unclear; several evidence
        records lack explicit limitation or artifact details behind the reported scoring.
    - line: Evidence-driven reliability layers around frozen agents
      what_it_solves: Improves frozen models through external skills, harness edits,
        or uncertainty estimates grounded in screenshots, repeated runs, and before/after
        interface states.
      what_remains_open: Cross-model and cross-interface transfer of reliability signals
        is weak; confidence coverage declines under distribution shift, and dynamic-interface
        observation control remains missing.
    - line: Scalable supervision and online training for GUI control
      what_it_solves: Reduces annotation cost or increases training efficiency via
        unannotated screenshots, verifiable synthetic tasks, frontier sampling, and
        multimodal skill artifacts.
      what_remains_open: There is a verification gap for whether weak or synthetic
        supervision gains reflect robust generalization rather than benchmark-specific
        overfitting; safety and verifiability boundaries are unclear.
    consensus:
    - Fine-grained or cost-aware evaluation reveals capability differences that pass-rate
      alone hides, especially for sub-goal completion and observation efficiency.
    - External grounding signals such as screenshots, visual figures, before/after
      states, and repeated runs improve diagnosis or performance without modifying
      backbone weights.
    - Current agents are not yet reliable across dynamic interfaces, class/interface
      transfer, and distribution shifts; observation control and confidence calibration
      remain weak.
    - Task-specific formalization is a prerequisite for reproducibility, but it tends
      to be tied to a particular interface or evaluation regime.
    disagreements:
    - 'Improvement locus: training-time RL or weak supervision versus frozen-model
      external artifacts such as skill libraries and harness optimization.'
    - 'Evaluation target: static multi-app desktop tasks, drag-only interactions,
      living-screen dynamic feeds, and single-step GUI grounding uncertainty emphasize
      different failure modes.'
    - 'Supervision or verification signal: deterministic rule-based scoring, cost-accuracy
      information efficiency, and conformal confidence coverage imply different assumptions
      about what makes an agent correct.'
    - 'Skill representation: visual-plus-text artifacts are shown to outperform text-only
      skills in matched settings, but the evidence for this advantage is still narrow.'
    open_questions:
    - How do benchmark formalizations transfer beyond their original interfaces, especially
      to multi-step trajectories and unseen platforms?
    - Can post-hoc uncertainty estimates be made transferable across open-weight and
