  literature_review:
    line_of_work_matrix:
    - line: Cross-application desktop and operating-system task benchmarking
      what_it_solves: Evaluates GUI agents on real macOS desktop tasks that require
        GUI and CLI actions across multiple applications, with fine-grained sub-goal
        scoring.
      what_remains_open: Whether macOS-specific pass@1 and sub-goal metrics transfer
        to other operating systems, dynamic interfaces, and long-horizon professional
        workflows.
    - line: Multimodal skill and reusable workflow memory for computer-use agents
      what_it_solves: Improves computer-use agent success and speed by retrieving
        hierarchical multimodal application skills or compiling successful runs into
        state-machine replays.
      what_remains_open: Robustness of stored skills and compiled programs to interface
        updates, new task variants, and cross-application transfer.
    - line: Dynamic and specialized GUI interaction benchmarking
      what_it_solves: Covers short-video living-screen tasks, video-guided GUI tasks,
        and drag-based interactions that are underrepresented in click-focused benchmarks;
        measures task accuracy and observation efficiency.
      what_remains_open: Generalization beyond the selected platforms and interaction
        types, and why current models lack observation control in dynamic content.
    - line: Efficient or generative GUI-agent model training
      what_it_solves: Trains a block-wise diffusion vision-language agent for GUI
        grounding and navigation, providing an alternative to autoregressive generation.
      what_remains_open: Whether diffusion-based training matches or exceeds strong
        frontier models on broader mobile, desktop, and web tasks under deployment
        latency constraints.
    - line: Scalable real-world web environment construction from wild URLs
      what_it_solves: Automatically reconstructs source-grounded, reusable website
        environments and interaction trajectories to fine-tune web agents and evaluate
        task success.
      what_remains_open: Initial site authorization and fidelity boundaries, plus
        transfer from reconstructed environments to live web task performance and
        safety.
    consensus:
    - Real-world GUI evaluation requires executable, application-grounded environments
      rather than static screenshots alone.
    - Frontier agents still fail on observation control, fine-grained grounding, or
      specialized interactions, so task success alone is insufficient as an evaluation
      target.
    - Reusable structured knowledge such as multimodal skills, compiled state-machine
      programs, or generated trajectories improves task success, speed, or downstream
      fine-tuning.
    - Evaluation is expanding to cover interaction types and efficiency dimensions
      beyond click-only actions, including drag, video-guided tasks, GUI+CLI, and
      dynamic content.
    disagreements:
    - 'Evaluation targets differ: one-shot Pass@1, cost-accuracy and observation efficiency,
      sub-goal completion, and repeated-task speed are not interchangeable.'
    - 'Environment scope differs: fixed macOS desktop applications, simulated short-video
      platforms, reconstructed wild websites, and video-guided interactions emphasize
      different failure modes.'
    - 'Remedy strategy differs: retrieval-augmented multimodal skill memory, run compilation
      to state machines, generative model training, and environment/trajectory construction
      address different bottlenecks.'
    - 'Interaction modality assumptions differ: some evaluations rely on static display
      assumptions, while others adopt dynamic, drag-based, video-guided, or combined
      GUI/CLI workflows.'
    open_questions:
    - Do gains on platform-specific benchmarks transfer to live professional workflows
      across operating systems and application versions?
    - How should observation control be learned or evaluated for dynamic interfaces
      where content changes between actions?
    - How robust are stored skills and compiled programs when application UI changes,
      tasks vary, or agents meet unseen workflows?
    - Do reconstructed wild-web environments preserve sufficient fidelity for agents
      fine-tuned on them to remain safe and effective on live sites?
    - What evidence gaps remain from missing public code, datasets, model checkpoints,
      or limitation reports for several methods in the packet?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 跨应用桌面与操作系统任务基准测试
      解决的问题: 评估GUI智能体在真实macOS桌面任务中跨多个应用的GUI与CLI操作能力，并提供细粒度子目标评分。
      尚未覆盖: macOS特定指标能否迁移到其他操作系统、动态界面和长周期专业工作流。
    - 路线: 面向计算机使用智能体的多模态技能与可复用工作流记忆
      解决的问题: 通过检索分层多模态应用技能或将成功运行编译为状态机重放，提升智能体的任务成功率和执行速度。
      尚未覆盖: 存储技能或程序在界面更新、新任务变体和跨应用迁移下的鲁棒性。
    - 路线: 动态与专门化GUI交互基准测试
      解决的问题: 覆盖短视频动态屏幕、视频引导GUI任务和拖拽交互，衡量任务准确性与观察效率。
      尚未覆盖: 超出所选平台和交互类型的泛化，以及当前模型缺乏观察控制的原因。
    - 路线: 高效或生成式GUI智能体模型训练
      解决的问题: 训练块级扩散视觉语言智能体完成GUI定位和导航，作为自回归生成的替代范式。
      尚未覆盖: 扩散范式在更广移动、桌面和网页任务及部署延迟约束下能否匹配或超过前沿模型。
    - 路线: 从真实网络规模化构建可复用智能体环境
      解决的问题: 自动从真实URL重建源对齐的网站环境和交互轨迹，用于微调网页智能体并评估任务成功率。
      尚未覆盖: 初始站点授权、保真度边界，以及从重建环境到真实网站任务表现和安全性的迁移。
    共识:
    - 真实GUI评估需要可执行、面向应用的环境，而不仅是静态截图。
    - 前沿智能体在观察控制、细粒度定位或专门化交互上仍失败，因此仅看任务成功并不足够。
    - 多模态技能、编译的状态机程序或生成轨迹等可复用结构化知识可以提升任务成功率、速度或下游微调效果。
    - 评估正在扩展到点击以外的交互类型与效率维度，包括拖拽、视频引导、GUI+CLI和动态内容。
    分歧:
    - 评测目标不同：一次性Pass@1、成本-准确率或观察效率、子目标完成和重复任务速度不能互换。
    - 环境范围不同：固定macOS桌面应用、模拟短视频平台、重建的真实网站和视频引导交互强调不同的失败模式。
    - 改进策略不同：检索增强的多模态技能记忆、运行编译为状态机、生成式模型训练以及环境或轨迹构建针对各自不同瓶颈。
