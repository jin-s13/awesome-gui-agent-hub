    ranking, or drag grounding.'
  - 'Key differences: Work splits between single-step grounding and multi-step OS/web
    trajectories; human-annotated, weak-supervised, verifiable-synthesized, or skill-library
    training; and aggregate success versus risk/calibration metrics.'
  - 'Trend evolution: Within the 2024–2026 frontier, evaluation is moving from static
