    how to jointly improve observation control and uncertainty, and whether scaling
    or harness gains transfer across interfaces and deployment settings.'
  related_work_outline_zh:
  - 主流方向：证据包中的高排名研究集中在对 GUI/计算机使用代理进行大规模基准测试与改进，采用可验证或弱监督训练以及技能/执行框架优化；形式分析主要体现在任务/交互定义和可靠性框架中。
  - 研究共性：论文通常先定义任务或界面状态，收集或合成任务与截图，用细粒度指标比较多类开放和闭源模型，并报告定位、观察控制或迁移方面的缺口。
  - 关键差异：研究在交互目标（点击、拖拽、动态内容、macOS/OS 工作流）、干预层（检索技能、执行框架代码、训练/合成）和评估重点（通过率、子目标、成本-准确性、不确定性校准）上不同。
  - 趋势演进：本证据包中的高排名论文均来自 2026 年，无法推断跨年趋势；在当前前沿内，领域正从静态点击基准转向动态、多应用设置、自改进循环和可靠性/不确定性感知评测。
  - 开放问题：细粒度任务抽象是否预测真实可靠性，如何联合改进观察控制与不确定性，以及扩展/执行框架收益能否跨界面和部署场景迁移。
  literature_review:
    line_of_work_matrix:
    - line: Task and interaction abstractions for GUI agents (MacAgentBench, LivingScreen,
        DragOn)
      what_it_solves: Defines measurable task spaces, interface regimes, interaction
        primitives, and fine-grained completion criteria so GUI agent capabilities
        can be compared beyond coarse pass rates.
      what_remains_open: Whether these abstractions generalize across applications
        and predict multi-step deployment failures, especially under dynamic content
        and precise manipulation.
    - line: Scalable supervision, RL, and harness optimization (ScaleCUA, GUICrafter,
        GUI-HARVEST)
      what_it_solves: Uses verifiable synthetic tasks, unannotated screenshots, or
        repeated execution evidence to improve computer-use agents while reducing
        annotation cost or keeping backbone models frozen.
      what_remains_open: Direct evidence that the claimed scaling or optimization
        gains transfer across interfaces and failure modes; guarantees for robustness
        and sample efficiency remain missing.
    - line: Skill representation and evidence-driven grounding (VISUALSKILL, GUI-HARVEST)
      what_it_solves: Organizes procedural knowledge or execution evidence as multimodal
        skills and executable harness changes to improve UI element identification
        and workflow verification.
      what_remains_open: Whether such representations generalize beyond the studied
        applications and whether they mitigate observation-control errors rather than
        only improving static grounding.
    - line: Uncertainty and reliability framing (Argus, LivingScreen)
      what_it_solves: Quantifies post-hoc uncertainty for GUI grounding and formalizes
        observation-control failure in dynamic interfaces, connecting reliability
        to spatial safety and information efficiency.
      what_remains_open: Most evidence covers single-step grounding or one dynamic
        platform; transfer to multi-step agent trajectories and across model classes
        or interfaces is not established.
    consensus:
    - Recent work shifts from aggregate task success to fine-grained, rule-based,
      or cost-sensitive evaluation that exposes capability gaps hidden by overall
      pass rates.
    - Multiple studies converge on improving the agent loop around a frozen or reused
      model through skills, harness edits, or data/task synthesis, rather than only
      retraining model weights.
    - Grounding, observation control, and uncertainty calibration are recurring reliability
      weaknesses, especially for dynamic content and spatially precise interactions.
    disagreements:
    - 'Researchers differ on where capability should reside: hierarchical multimodal
      skills, executable harness code, or model weights updated via weak/synthetic
      data and RL.'
    - 'They rely on different supervision assumptions: verifiable environment rewards,
      contextual signals in unannotated screenshots, or repeated-run evidence of stable
      failures.'
    - Evaluation targets vary from single-step grounding and drag primitives to multi-step
      desktop or dynamic short-video tasks, producing different cost, observation,
      and spatial-precision criteria.
    open_questions:
    - Which abstraction—fine-grained sub-goals, interaction primitives, cost-accuracy,
      or uncertainty metrics—best predicts deployment reliability for GUI agents?
    - Can observation control and uncertainty calibration be optimized jointly with
      task success, or do they require separate modeling and evaluation protocols?
    - Do gains from verifiable synthesis, weak supervision, and harness optimization
      transfer to dynamic interfaces and precise manipulation beyond the studied benchmarks?
    - What formal assumptions link data/harness scaling to failure guarantees, and
      which assumptions break under real application drift or interface variation?
  literature_review_zh:
    研究路线矩阵:
    - 路线: GUI 代理的任务与交互抽象（MacAgentBench、LivingScreen、DragOn）
      解决的问题: 定义可测量的任务空间、界面状态、交互原语和细粒度完成标准，使 GUI 代理能力能在粗粒度通过率之外被比较。
      尚未覆盖: 这些抽象是否跨应用泛化并预测多步部署失败仍未知，尤其在动态内容和精细操作下。
    - 路线: 可扩展监督、在线 RL 与执行框架优化（ScaleCUA、GUICrafter、GUI-HARVEST）
      解决的问题: 利用可验证合成任务、未标注截图或重复执行证据改进计算机使用代理，同时减少标注成本或冻结骨干模型。
      尚未覆盖: 所声称的扩展或优化收益是否跨界面和失败模式迁移缺乏直接验证；鲁棒性与样本效率保证仍然缺失。
    - 路线: 技能表示与证据驱动定位（VISUALSKILL、GUI-HARVEST）
      解决的问题: 将程序性知识或执行证据组织为多模态技能和可执行框架修改，以改进 UI 元素识别与工作流状态验证。
      尚未覆盖: 这类表示是否跨应用泛化，以及是否能减少观察控制错误而不仅仅是改善静态定位，仍未确定。
    - 路线: 不确定性与可靠性框架（Argus、LivingScreen）
      解决的问题: 量化 GUI 定位的后验不确定性，并形式化动态界面中的观察控制失败，将可靠性关联到空间安全与信息效率。
      尚未覆盖: 现有证据主要覆盖单步定位或单一动态平台；向多步代理轨迹及跨模型类别、跨接口迁移尚未建立。
    共识:
    - 研究从聚合任务成功率转向细粒度、基于规则或成本敏感的评估，以暴露总体通过率掩盖的能力差距。
    - 多项研究都聚焦在冻结或复用模型周围的代理循环上，通过技能、执行框架编辑或数据/任务合成来改进，而非只重训模型权重。
    - 定位、观察控制和不确定性校准是反复出现的可靠性短板，尤其在动态内容和空间精细交互中。
    分歧:
