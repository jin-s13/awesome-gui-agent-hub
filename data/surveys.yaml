  - 'Mainstream direction: Building diverse, dynamic GUI/environment benchmarks that
    evaluate agent capabilities beyond single-step success, with increasing emphasis
    on realistic multi-app workflows, video-guided tasks, drag interactions, and uncertainty
    quantification.'
  - 'Shared research pattern: Each work contributes a new task suite, dataset, or
    environment, accompanied by a custom evaluation protocol that probes specific
