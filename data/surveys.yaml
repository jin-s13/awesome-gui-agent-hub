  literature_review:
    line_of_work_matrix:
    - line: Executable task abstraction for GUI workflows
      what_it_solves: Moves beyond static click-only evaluation by formalizing multi-application
        desktop tasks and dynamic interface conditions.
      what_remains_open: Whether abstractions transfer across platforms and whether
        dynamic settings reveal observation-control mechanisms.
    - line: Reliability and uncertainty quantification for grounding
      what_it_solves: Measures confidence calibration and safety margins for UI element
        grounding under different VLM interfaces.
      what_remains_open: Current evidence covers only single-step grounding; cross-model
        and distribution-shift transfer remain weak.
    - line: Frozen-model adaptation through skills and harnesses
      what_it_solves: Improves GUI agents without retraining by injecting multimodal
        skill artifacts or optimizing execution harness evidence loops.
      what_remains_open: Transfer to unseen environments and dependence on specific
        frameworks/model families are not fully bounded.
    - line: Verifiable task synthesis and data-efficient training
      what_it_solves: Scales RL or weak supervision with verifiable tasks and unannotated
        screenshots to reduce annotation cost.
      what_remains_open: Coverage of real-world failure modes, long-horizon dependencies,
        and divergence between synthesized and natural task distributions.
    - line: Interaction-type boundary benchmarking
      what_it_solves: Makes underrepresented action types such as drag and dynamic
        scrolling observable and learnable.
      what_remains_open: Generalization across action types and whether fine-grained
        action coverage improves end-to-end downstream use.
    consensus:
    - Recent evidence converges on executable, rule-based or verifiable evaluation
      as a foundation for GUI-agent claims.
    - Fine-grained metrics expose differences that average task success hides, especially
      sub-goal completion, cost-accuracy, and uncertainty ranking.
    - External adaptation artifacts such as skills and harnesses can improve frozen
      models, shifting attention from weights to interaction-layer design.
    - Visual grounding and observation control are treated as central bottlenecks
      for dynamic and multimodal GUI tasks.
    - Unannotated or synthesized training signals are increasingly used to reduce
      human annotation in data-efficient methods.
    disagreements:
    - Whether improvements should come from training models with RL or weak supervision
      versus keeping backbone weights frozen and changing skills or harness.
    - 'Text-only versus multimodal skill representations: one line shows visual figures
      improve UI element identification and workflow verification, while matched text-only
      artifacts underperform.'
    - Evaluation target differs among end-to-end task completion, single-step grounding
      uncertainty, and information efficiency under dynamic observation.
    - 'Supervision assumptions differ: verifiable task synthesis, unannotated screenshots
      with weak labels, and small high-quality annotated calibration data.'
    - Action-space coverage differs across click, drag, GUI+CLI, and living-screen
      settings, creating separate boundary conditions.
    - Deployment environments differ from desktop macOS to browser-based dynamic platforms
      and docker/benchmark suites, which may not share failure modes.
    open_questions:
    - How can dynamic-screen agents learn observation control rather than over- or
      under-observing changing content?
    - Do harness- or skill-level gains transfer beyond their source environments and
      model families?
    - Can uncertainty rankings be made robust across model classes and interface shifts
      without target-specific reranking?
    - Does verifiable task synthesis cover realistic long-horizon failures, or does
      it overfit to solver-checkable artifacts?
    - How should evaluation account for missing limitation and reproducibility evidence
      seen in several top papers?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 可执行的GUI工作流任务抽象
      解决的问题: 将静态点击评测扩展到多应用桌面任务和动态界面条件的形式化。
      尚未覆盖: 抽象能否跨平台迁移；动态设置下是否真正暴露观察控制机制。
    - 路线: 基础定位的可靠性与不确定性量化
      解决的问题: 在不同VLM接口下度量UI元素定位的置信度校准和安全边界。
      尚未覆盖: 证据限于单步定位；跨模型、跨接口和分布偏移下的迁移仍然较弱。
    - 路线: 冻结模型的外部技能与执行框架适应
      解决的问题: 在不重训模型的情况下，通过多模态技能或执行框架证据回路改善GUI智能体。
      尚未覆盖: 对未见过环境的迁移，以及对特定框架和模型族的依赖尚不明确。
    - 路线: 可验证任务合成与数据高效训练
      解决的问题: 用可验证任务和未标注截图扩展在线RL或弱监督，降低人工标注成本。
      尚未覆盖: 真实失败模式、长程依赖，以及合成任务与自然任务分布之间的差距。
    - 路线: 交互类型边界基准
      解决的问题: 使拖拽、动态滚动等低覆盖动作类型可被观测和学习。
      尚未覆盖: 跨动作类型的泛化，以及细粒度动作覆盖能否提升下游端到端效果。
    共识:
    - 近期证据收敛到可执行、基于规则或可验证的评估，作为GUI智能体声明的基础。
    - 细粒度指标揭示了平均任务成功率隐藏的差异，尤其是子目标完成、成本-准确率和不确定性排序。
    - 技能和执行框架等外部适应工件可以改善冻结模型，将关注点从权重转向交互层设计。
    - 视觉定位和观察控制被视为动态多模态GUI任务的核心瓶颈。
    - 未标注或合成训练信号越来越多地被用于降低人工标注成本。
    分歧:
    - 一方通过在线RL或弱监督改变模型权重，另一方保持权重冻结并优化技能或执行框架。
