  related_work_outline:
  - 'Mainstream direction: 2026 frontier work centers on more realistic GUI and computer-use
    agents, including GUI+CLI desktop tasks, drag interactions, mobile long-horizon
    tasks, dynamic short-video content, and video-guided tasks, with emphasis on grounding,
    data efficiency, context management, and stronger evaluation.'
  - 'Shared research pattern: most work pairs VLM or MLLM agents with a benchmark
    or task suite, then exposes gaps in observation control, sub-goal completion,
    uncertainty, or action grounding that pass-level success hides.'
  - 'Key differences: action-space focus differs across drag, GUI+CLI, dynamic streaming,
    and mobile long-horizon; training routes differ among weak supervision, verifiable
    task synthesis with online RL, and context-action supervised fine-tuning; evaluation
    protocols differ from Pass@1 to cost-accuracy, UQ ranking, and fine-grained scoring.'
  - 'Trend evolution: although the packet spans 2024-2026, the strongest evidence
    is from 2026; the movement appears to be from static click or web evaluation toward
    dynamic, long-horizon, multimodal, and training-centric computer-use agents.'
  - 'Open questions: cross-benchmark generalization, learned observation control for
    dynamic interfaces, uncertainty transfer across model classes, isolating method
    contribution from scaffolds or skill libraries, and whether fine-grained benchmark
    metrics translate into reliable deployment remain unresolved.'
  related_work_outline_zh:
  - 主流方向：2026年前沿研究集中于更真实的GUI与计算机使用代理，包括GUI+CLI桌面任务、拖拽交互、移动长时域任务、动态短视频内容和视频引导任务，强调定位、数据效率、上下文管理与更强评测。
  - 研究共性：多数工作以VLM或MLLM代理为基础，结合基准或任务套件，暴露Pass@1等高层次成功指标掩盖的观察控制、子目标完成、不确定性或动作定位问题。
  - 关键差异：动作空间不同，如拖拽、GUI+CLI、动态流式、移动长时域；训练路线不同，如弱监督、可验证任务合成加在线RL、上下文动作监督微调；评测协议不同，如Pass@1、成本-精度、UQ排名和细粒度评分。
  - 趋势演进：证据包年份跨度为2024-2026，但主要证据来自2026年前沿；趋势是从静态点击或网页评测向动态、长时域、多模态和训练中心的计算机使用代理演进。
  - 开放问题：跨基准泛化、动态界面的可学习观察控制、不确定性跨模型类别迁移、区分方法与脚手架或技能库贡献，以及细粒度基准指标能否转化为真实可靠部署仍待解决。
  literature_review:
    line_of_work_matrix:
    - line: Data-efficient policy training from weak or generated supervision
      what_it_solves: Reduces reliance on costly human annotation by using unannotated
        screenshots, verifiable task synthesis, and online RL or small calibration
        sets to train GUI action policies.
      what_remains_open: Gains are mostly reported on web, OSWorld, ScienceBoard,
        or small annotated settings; the contribution of task generation and reward
        design versus the learned policy is not fully isolated.
    - line: Long-horizon and action-interface design
      what_it_solves: Extends GUI agents beyond click-only web tasks to drag primitives,
        GUI+CLI task flows, proactive context actions, and structured memory for long
        mobile sessions.
      what_remains_open: Generalization beyond MemGUI-Bench, MobileWorld, or drag-specific
        suites remains uncertain, and dynamic interfaces still lack learned observation
        control.
    - line: Video-guided and dynamic-screen grounding
      what_it_solves: Addresses keyframe selection and dynamic short-video interfaces
        so that GUI grounding is not limited to static screenshots or fixed web pages.
      what_remains_open: Evidence is limited to short-video or video-guided evaluations;
        over-observation and under-observation persist as failure modes without a
        clear learned observation-control mechanism.
    - line: Evaluation and uncertainty protocols for computer-use agents
      what_it_solves: Creates fine-grained multi-checkpoint scoring, cost-accuracy,
        drag datasets, UQ ranking, and conformal spatial safety to reveal behavior
        hidden by pass-level metrics.
      what_remains_open: Cross-model and cross-interface UQ transfer is weak, conformal
        coverage degrades under distribution or interface mismatch, and some benchmark
        limitation fields are unreported.
    consensus:
    - 'Recent evidence treats pass-level success as insufficient: fine-grained sub-goal
      scoring, cost-accuracy, drag, GUI+CLI, and uncertainty metrics expose different
      agent weaknesses.'
    - 'Grounding and data efficiency are important: weak supervision, generated verifiable
      tasks, and compact context can improve specialized GUI behaviors.'
    - Current agents share weaknesses in observation control and long-horizon context,
      tending to over-observe or under-observe and lose critical state.
    - Benchmarks are expanding action coverage from click-only static web tasks toward
      desktop, mobile, drag, dynamic content, and video-guided interactions.
    disagreements:
    - 'Interaction-mode emphasis differs: some work targets a single primitive such
      as drag, while others emphasize GUI+CLI, dynamic streaming, or mobile long-horizon
      interfaces, changing the required grounding and action-prediction assumptions.'
    - 'Supervision route differs: unannotated screenshot weak supervision, verifiable
      task synthesis with online RL, and supervised context-action signals each claim
      efficiency under different data and deployment conditions.'
    - 'Evaluation target differs: task success on OSWorld or ScienceBoard, cost-accuracy
      against human level, fine-grained capability scoring, and UQ calibration represent
      distinct success criteria.'
    - 'The source of gains is contested: one desktop benchmark attributes advantage
      mainly to a skill library, while training-centric methods emphasize model learning,
      making cross-paper comparison difficult.'
    - 'Uncertainty transfer evidence is split: within-model UQ ranking is strong,
      but cross-tier transfer to closed-source models is weak, so UQ findings do not
      generalize without target-specific reranking.'
    open_questions:
    - Which training signal or generated task distribution transfers beyond OSWorld,
      ScienceBoard, mobile, and web screenshot families?
    - Can agents learn when to observe, retain, or discard visual context in dynamic
      long-horizon interfaces rather than relying on fixed context rules?
    - How should fine-grained benchmark metrics and uncertainty calibration be mapped
      to real deployment risk?
    - What isolation protocols are needed to separate policy, scaffold, skill library,
      and framework contributions from reported gains?
    - Do drag-specific or GUI+CLI benchmarks transfer to general computer-use capability,
      or do they remain task-specific evaluations?
    - Several top papers leave limitation fields empty; without those, task boundaries,
      failure conditions, and reproducibility constraints remain verification gaps.
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基于弱监督或生成监督的数据高效策略训练
      解决的问题: 通过未标注截图、可验证任务合成、在线RL或少量校准数据，减少对昂贵人工标注的依赖，训练GUI动作策略。
      尚未覆盖: 证据主要集中在网页、OSWorld、ScienceBoard或少标注设置；任务生成与奖励设计相比策略学习的贡献尚未完全隔离。
    - 路线: 长时域与动作接口设计
      解决的问题: 将GUI代理从仅点击网页任务扩展到拖拽原语、GUI+CLI任务流、主动上下文动作和面向长移动会话的结构化记忆。
      尚未覆盖: 在MemGUI-Bench、MobileWorld或拖拽专用套件之外的泛化仍不确定，动态界面仍缺乏可学习的观察控制。
    - 路线: 视频引导与动态屏幕定位
      解决的问题: 通过关键帧选择和短视频动态界面建模，使GUI定位不再局限于静态截图或固定网页。
      尚未覆盖: 证据仅限短视频或视频引导评测；过度观察与观察不足仍是主要失败模式，缺少明确的可学习观察控制机制。
    - 路线: 计算机使用代理的评测与不确定性协议
      解决的问题: 构建细粒度多检查点评分、成本-精度、拖拽数据集、UQ排名和共形空间安全，揭示Pass@1等高层次指标掩盖的行为。
      尚未覆盖: 跨模型与跨接口的UQ迁移较弱，共形覆盖在分布或接口不匹配下退化，部分基准的局限性字段未报告。
    共识:
    - 近期证据认为Pass@1等高层次成功指标不足，细粒度子目标评分、成本-精度、拖拽、GUI+CLI和不确定性指标能暴露不同代理弱点。
    - 定位与数据效率很重要：弱监督、可验证生成任务和紧凑上下文可以改善专门GUI行为。
    - 现有代理在观察控制和长时域上下文上存在共同弱点，容易过度观察或观察不足并丢失关键状态。
    - 基准正从静态点击网页任务扩展到桌面、移动、拖拽、动态内容和视频引导交互。
    分歧:
    - 交互模式重点不同：有的工作聚焦拖拽等单一原语，另一些强调GUI+CLI、动态流式或移动长时域接口，导致所需定位和动作预测假设不同。
    - 监督路线不同：未标注截图弱监督、可验证任务合成加在线RL、以及上下文动作监督信号各自在不同数据和部署条件下声称更高效。
    - 评测目标不同：OSWorld或ScienceBoard上的任务成功率、相对人类的成本-精度、细粒度能力评分和UQ校准代表不同的成功标准。
    - 收益来源有分歧：一个桌面基准结果将优势主要归于技能库，而训练中心方法强调模型学习，使跨论文比较更困难。
    - 不确定性迁移证据不一致：模型内UQ排名迁移强，但跨层级向闭源模型迁移弱，因此不确定性结论需要目标特定重新排序。
    开放问题:
    - 哪种训练信号或生成任务分布能超越OSWorld、ScienceBoard、移动和网页截图家族进行泛化？
    - 智能体能否学会在动态长时域界面中何时观察、保留或丢弃视觉上下文，而不是依赖固定上下文规则？
    - 如何将细粒度基准指标和不确定性校准映射到真实部署风险？
    - 需要哪些隔离方案来区分策略、脚手架、技能库与框架对报告收益的贡献？
    - 拖拽专用或GUI+CLI基准能否迁移到通用计算机使用能力，还是仍为任务特定评测？
    - 若干论文未填写局限性字段；缺少这些说明时，任务边界、失败条件和可复现性约束仍是验证缺口。
