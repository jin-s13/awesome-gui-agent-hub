  related_work_outline:
  - 'Mainstream direction: Building comprehensive benchmarks and training methods
    for GUI agents that operate in diverse, dynamic, and long-horizon environments,
    with a growing emphasis on reliability and fine-grained evaluation.'
  - 'Shared research pattern: Leveraging large-scale data (synthetic tasks, unannotated
    screenshots) and online learning to improve agent performance, and introducing
    detailed metrics (multi-checkpoint scores, cost-accuracy) to capture nuanced capabilities.'
  - 'Key differences: Benchmarks target different platforms (desktop, mobile, short-video)
    and interaction types (click, drag, GUI+CLI), while training methods focus on
    distinct bottlenecks—skill libraries, RL, weak supervision, or context management—leading
    to incomparable results.'
  - 'Trend evolution: Movement from static single-app benchmarks to dynamic, multi-app,
    long-horizon setups; from pure model capability to agent–environment interaction
    optimization; and from black-box evaluation to reliability-aware frameworks (uncertainty
    quantification, observation control).'
  - 'Open questions: How to unify evaluation across heterogeneous platforms and interaction
    types; how to integrate uncertainty into agent decision loops for safe deployment;
    and how to design context management that scales to arbitrarily long tasks without
    manual tuning.'
  related_work_outline_zh:
  - 主流方向：构建面向多样化、动态和长时域环境的GUI代理基准与训练方法，同时日益关注可靠性和细粒度评估。
  - 研究共性：利用大规模数据（合成任务、未标注截图）和在线学习提升代理性能，并引入多检查点评分、成本-准确性等细粒度指标以捕捉细致能力。
  - 关键差异：基准覆盖不同平台（桌面、移动、短视频）和交互类型（点击、拖拽、GUI+CLI），训练方法则聚焦不同瓶颈（技能库、强化学习、弱监督、上下文管理），导致结果难以直接比较。
  - 趋势演进：从静态单应用基准向动态、多应用、长时域设置演进；从单纯依赖模型能力转向优化代理-环境交互；从黑盒评估转向可信框架（不确定性量化、观察控制）。
  - 开放问题：如何统一异构平台和交互类型的评估；如何将不确定性集成到代理决策循环中以确保安全部署；如何设计无需人工调整即可扩展至任意长任务的上下文管理策略。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark construction and evaluation frameworks
      what_it_solves: Provides standardized environments and metrics to measure GUI
        agent capabilities, including fine-grained success rates, cost-accuracy trade-offs,
        and specific interaction types (drag, GUI+CLI).
      what_remains_open: Benchmarks are limited to specific platforms or interaction
        types; cross-benchmark generalization of agent performance is unknown; uncertainty
        quantification metrics do not transfer well across model families or deployment
        settings.
    - line: Agent capability enhancement
      what_it_solves: Improves agent success rates on GUI tasks through skill libraries,
        online RL, weak supervision from unannotated screenshots, and proactive context
        management for long-horizon tasks.
      what_remains_open: Generalization to out-of-distribution apps and interfaces
        is not guaranteed; the cost of building skill libraries or collecting high-quality
        data is high; context management strategies may not scale to extremely long
        or complex workflows.
    - line: Reliability and safety analysis
      what_it_solves: Quantifies uncertainty in agent grounding decisions and diagnoses
        observation control failures (over-/under-observation) in dynamic interfaces.
      what_remains_open: Uncertainty estimates are not yet integrated into agent decision-making;
        observation control lacks a formal optimization framework; the impact of these
        reliability measures on end-to-end task success is not validated.
    consensus:
    - Fine-grained evaluation metrics are necessary because simple task success rates
      mask differences in agent behavior (e.g., sub-goal completion, information efficiency).
    - Current GUI agents struggle with long-horizon and dynamic environments, and
      require explicit mechanisms for context management or observation control.
    - Large-scale data (synthetic or unannotated) is a key enabler for training more
      capable agents, but data efficiency and generalization remain open challenges.
    disagreements:
    - Evaluation platforms range from desktop macOS (MacAgentBench) to mobile (MemGUI-Bench)
      to short-video browsers (LivingScreen), each with distinct interaction assumptions,
      making cross-platform comparison difficult.
    - 'Approaches to improving agent performance differ in their focus: some inject
      external multimodal skill libraries (VISUALSKILL), others use online RL with
      synthetic tasks (ScaleCUA), weak supervision from unlabeled screenshots (GUICrafter),
      or proactive context management (MemGUI-Agent), with no consensus on the dominant
      bottleneck.'
    - Reliability is addressed through different lenses—post-hoc uncertainty quantification
      (Argus) versus observation control analysis (LivingScreen)—without a unified
      framework for safe GUI interaction.
    open_questions:
    - How can we design a cross-platform evaluation framework that accounts for diverse
      interaction types and still yields comparable agent scores?
    - Can uncertainty signals be effectively used to trigger human intervention or
      adjust agent exploration, and will this improve safety in real-world deployments?
    - What is the minimal set of context information needed to maintain task performance
      in arbitrarily long mobile or desktop tasks, and can it be learned automatically?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准构建与评估框架
      解决的问题: 提供标准化环境和指标以衡量GUI代理能力，包括细粒度成功率、成本-准确性权衡以及特定交互类型（拖拽、GUI+CLI）。
      尚未覆盖: 基准仅限于特定平台或交互类型；代理性能的跨基准泛化未知；不确定性量化指标在不同模型族或部署环境间迁移性差。
    - 路线: 代理能力增强
      解决的问题: 通过技能库、在线强化学习、从未标注截图的弱监督训练以及主动上下文管理，提升GUI代理在长时间任务上的成功率。
      尚未覆盖: 对分布外应用和界面的泛化能力未经验证；构建技能库或收集高质量数据的成本高；上下文管理策略可能无法扩展到极长或复杂工作流。
    - 路线: 可靠性与安全性分析
      解决的问题: 量化代理在基础决策中的不确定性，并诊断动态界面中的观察控制失败（过度观察/观察不足）。
      尚未覆盖: 不确定性估计尚未集成到代理决策中；观察控制缺乏形式化优化框架；这些可靠性指标对端到端任务成功率的影响未经验证。
    共识:
    - 细粒度评估指标是必要的，因为简单的任务成功率掩盖了代理行为的差异（例如子目标完成度、信息效率）。
    - 当前GUI代理在长时域和动态环境中表现不佳，需要显式的上下文管理或观察控制机制。
    - 大规模数据（合成或未标注）是训练更强代理的关键推动力，但数据效率和泛化仍是开放挑战。
    分歧:
    - 评估平台从桌面macOS（MacAgentBench）到移动（MemGUI-Bench）再到短视频浏览器（LivingScreen）各不相同，交互假设不同，导致跨平台比较困难。
    - 提升代理性能的方法关注点不同：有的注入外部多模态技能库（VISUALSKILL），有的使用在线RL与合成任务（ScaleCUA），有的利用未标注截图进行弱监督（GUICrafter），或采用主动上下文管理（MemGUI-Agent），缺乏对主要瓶颈的共识。
    - 可靠性分析从不同角度切入——事后不确定性量化（Argus）与观察控制分析（LivingScreen）——缺乏统一的GUI安全交互框架。
    开放问题:
    - 如何设计一个跨平台评估框架，既能涵盖多样的交互类型，又能产生可比较的代理评分？
    - 不确定性信号能否有效用于触发人工干预或调整代理探索，从而提升真实部署中的安全性？
    - 在任意长移动或桌面任务中，维持任务性能所需的最小上下文信息集是什么，能否自动学习？
