  - 主流方向：形式化GUI智能体的评估与可靠性，通过任务/界面抽象、细粒度度量和可验证或不确定性感知信号，而非提出新模型架构。
  - 研究共性：论文引入结构化任务或工件（基准、技能库、harness编辑、合成RL任务），并在可执行结果上评估冻结或微调模型。
  - 关键差异：差异在于监督模式（弱/未标注 vs 可验证RL）、改进层（技能库/harness vs 模型训练）和可靠性目标（不确定性量化 vs 通过率）。
  - 趋势演进：在2024–2026前沿内，工作从单步点击定位转向多应用、动态界面、GUI+CLI、拖拽和不确定性感知评估；动态观察与跨模型迁移仍开放。
