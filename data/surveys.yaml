  related_work_outline:
  - 'Mainstream direction: Building richer, executable computer-use benchmarks that
    move beyond static click tasks toward real macOS desktop workflows, dynamic short-video
    environments, drag interactions, video-guided tasks, and uncertainty-aware evaluation.'
  - 'Shared research pattern: Works construct or use task suites with verifiable or
    fine-grained scoring, evaluate frontier vision-language agents against human or
    baseline performance, and report failure modes not visible in aggregate success.'
  - 'Key differences: They differ in interaction mode, supervision signal, and evaluation
    emphasis, such as GUI+CLI, drag, video observation, weak screenshot supervision,
    verifiable synthetic tasks, multimodal skill artifacts, post-hoc uncertainty calibration,
    Pass@1, sub-goal scoring, or cost-accuracy.'
  - 'Trend evolution: The available 2024-2026 evidence clusters at the 2026 frontier
    and shows a shift toward dynamic observation control, fine-grained multi-checkpoint
    scoring, verifiable synthetic task pipelines, and skill or training methods measured
    on OSWorld, ScienceBoard, and newer benchmarks.'
  - 'Open questions: Whether capabilities transfer across desktop, browser, mobile,
    and dynamic platforms; how cost-accuracy and uncertainty metrics align with deployment
    utility; and how far weak supervision or synthetic data can replace human-annotated
    GUI demonstrations.'
  related_work_outline_zh:
  - 主流方向：构建更丰富的可执行计算机使用基准，从静态点击任务扩展到真实macOS桌面工作流、动态短视频界面、拖拽交互、视频引导任务和不确定性评估。
  - 研究共性：各工作通常构建或使用带可验证或细粒度评分的任务集，评估前沿视觉语言代理与人类或基线，并报告模型在总分之外暴露的失败模式。
  - 关键差异：体现在交互方式、监督信号和评估指标上，例如GUI+CLI、拖拽和视频观察，弱监督截图、可验证合成任务、多模态技能库或后验不确定性校准，以及Pass@1、子目标完成、成本-准确率或排名迁移等。
  - 趋势演进：证据集中在2024-2026年的2026前沿，显示从单一成功率转向动态观察控制、多检查点评分、可验证合成任务和技能或训练管线，并在OSWorld、ScienceBoard等平台上验证。
  - 开放问题：能力是否在桌面、浏览器、移动和动态平台之间泛化；成本-准确率与不确定性指标是否匹配部署效用；弱监督或合成数据在多大程度上能替代人工标注的GUI示范。
  literature_review:
    line_of_work_matrix:
    - line: Real desktop and OS-level agent benchmarking
      what_it_solves: Creates multi-application macOS tasks with deterministic rule-based
        and fine-grained sub-goal scoring to expose capability differences hidden
        by Pass@1.
      what_remains_open: Cross-platform validity is unproven; available evidence is
        restricted to macOS desktop and does not yet address mobile, web, or OS heterogeneity
        and trajectory-level failure boundaries.
    - line: Interaction-mode and dynamic-interface benchmark design
      what_it_solves: Expands evaluation beyond click actions to drag interactions,
        video-guided tasks, and living-screen content where observation timing and
        control matter.
      what_remains_open: Benchmarks are platform- or mode-specific; evidence is missing
        on whether skills or scores transfer across interaction modes and rapidly
        changing interfaces.
    - line: Metric and reliability stress-testing
      what_it_solves: Probes uncertainty quantification ranking, sub-goal scoring,
        cost-accuracy efficiency, and conformal spatial safety beyond aggregate task
        success.
      what_remains_open: Most uncertainty evidence covers single-step grounding rather
        than multi-step agent trajectories; cross-model and cross-interface ranking
        transfer is weak and requires re-evaluation.
    - line: Training signal and task synthesis pipelines
      what_it_solves: Creates verifiable synthetic tasks, weak supervision from unannotated
        screenshots, or multimodal skill artifacts to improve sample efficiency and
        agent control.
      what_remains_open: Results are evaluated mainly on OSWorld, ScienceBoard, CUA-World,
        and OSExpert-Eval; generalization to newly proposed dynamic and drag-based
        benchmarks remains unverified.
    - line: Video-guided task bridging
      what_it_solves: Connects video understanding to GUI agent tasks by extracting
        task-relevant keyframes and benchmarking multimodal agents on video-guided
        interactive tasks.
      what_remains_open: VideoQA gains exist, but evidence is limited on whether keyframe
        extraction transfers to dynamic living-screen or multi-step desktop automation.
    consensus:
    - 'The field is shifting toward executable, verifiable task evaluation: rule-based
      checks, sub-goal scoring, and cost-accuracy metrics reveal failures that aggregate
      success hides.'
    - Multiple works agree that current agents have gaps in observation control and
      fine-grained grounding, especially for dynamic interfaces and richer interaction
      modes such as drag or video-guided tasks.
    - Evidence consistently shows that adding relevant visual, skill, or task-specific
      training context improves computer-use agent performance, but leaderboard gains
      may not separate model capability from task distribution fit.
    disagreements:
    - 'Evaluation setting: static single-step grounding datasets versus multi-step
      macOS desktop workflows versus live dynamic short-video platforms versus drag-based
      interaction benchmarks.'
    - 'Supervision assumption: unannotated screenshot weak supervision, verifiable
      synthetic RL task generation, human-authored multimodal skill libraries, and
      post-hoc uncertainty calibration make different data and label assumptions.'
    - 'Primary metric: Pass@1 or task success is common, but works emphasize different
      evidence such as sub-goal completion, fine-grained checkpoints, cost-accuracy
      information efficiency, uncertainty ranking transfer, or conformal coverage.'
    - 'Generalization claim: some treat OSWorld or ScienceBoard as the reference frontier,
      while others argue that desktop, dynamic platform, and grounding datasets are
      not interchangeable without re-evaluation.'
    open_questions:
    - Can fine-grained sub-goal scoring and observation-control diagnostics transfer
      from one benchmark to cross-platform mobile, web, and OS automation settings?
    - Which uncertainty quantification methods remain stable across model classes
      and interfaces when moving from single-step grounding to multi-step trajectories?
    - Do verifiable synthetic tasks and weakly supervised GUI training improve actual
      deployment robustness, or mainly leaderboard scores on current benchmarks?
    - What benchmark coverage is needed for cost-accuracy tradeoffs under dynamic
      observation, given that no evaluated model reached human-level cost-accuracy
      on living-screen tasks?
    - Can drag-based and video-guided task improvements generalize to real macOS desktop
      and short-video evaluation regimes simultaneously?
