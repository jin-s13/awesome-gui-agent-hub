  literature_review:
    line_of_work_matrix:
    - line: Survey and roadmap synthesis
      what_it_solves: Maps fragmented GUI-agent directions into taxonomies, benchmarks,
        and open research gaps.
      what_remains_open: Top-ranked evidence consists of primary method and benchmark
