  literature_review:
    line_of_work_matrix:
    - line: GUI skill and memory reuse for computer-use agents, for example VISUALSKILL
        and EchoPath
      what_it_solves: Encodes validated application workflows or multimodal skill
        artifacts so agents can reuse procedures, reduce token and execution time,
        and improve UI grounding at runtime.
      what_remains_open: Reuse depends on deterministic applicability or per-application
        authoring; evidence does not yet show generalization across applications,
        operating systems, live timing, or long-term artifact maintenance.
    - line: Harness-native and online training frameworks, for example OpenForgeRL,
        OpenWebRL, and GUICrafter
      what_it_solves: Trains GUI agents in real or harness-wrapped environments while
        reducing annotation cost through weak supervision, online multi-turn reinforcement
        learning, or interception of deployed harness calls.
      what_remains_open: Error recovery remains weak after training; harness design
        affects learnability; evaluations use hundreds to thousands of tasks, leaving
        cross-domain and cross-infrastructure generalization uncertain.
    - line: Agent model architectures for GUI generation, for example LLaDA-UI
      what_it_solves: Provides an alternative vision-language GUI generation paradigm
        based on block-wise diffusion while aiming to preserve parallel decoding and
        improve grounding and navigation.
      what_remains_open: Available evidence compares against selected Qwen baselines
        on six benchmarks and lacks limitation analysis on deployment latency, robustness,
        and broader reproducibility.
    - line: Diagnostic benchmarks and evaluation environments, for example Desktop-Delta
        Bench and OSWorld-Science
      what_it_solves: Evaluates computer-use agents beyond end-task success by testing
        GUI transition reconstruction, state verification, source tracking, action
        inference, and scientific software workflows with execution-based scoring.
      what_remains_open: Offline diagnostics do not capture asynchronous live dynamics;
        coverage is limited to Linux desktop action types or selected scientific domains,
        so real-time and cross-OS validity remains uncertain.
    consensus:
    - Runnable GUI systems benefit from separating the agent policy from the harness
      or orchestration layer so one policy can be reused across environments.
    - Training and evaluation increasingly rely on execution-level or trajectory-level
      success signals instead of only measuring single-frame action localization.
    - Memory, skill, or replay artifacts can reduce inference cost and improve grounding
      when they preserve visual and contextual information and are applied under checked
      preconditions.
    - Weakly supervised or online reinforcement learning can substantially reduce
      dependence on large annotated GUI datasets but requires careful initialization
      and success judging.
    disagreements:
    - 'Supervision strategy differs: some use massive unannotated screenshots with
      a small high-quality calibration set, while others use live online multi-turn
      RL or SFT plus RL, implying different data efficiency and infrastructure costs.'
    - 'Representation differs: block-wise diffusion for GUI generation versus harness-wrapped
      autoregressive or multimodal policies, with no matched training and deployment
      comparison in the visible evidence.'
    - 'Memory formulation differs: multimodal skill libraries organized by topic versus
      execution-level replayable trajectory memories with deterministic applicability
      checks and image-based reaiming.'
    - 'Evaluation target differs: offline step-level transition diagnostics and domain-specific
      scientific software tasks versus live web or desktop task success, making reported
      results non-interchangeable.'
    open_questions:
    - Can reusable memory and skill artifacts remain correct as applications, OS versions,
      and UI layouts change, and what validation or maintenance do they require?
    - How can live GUI timing, asynchronous events, and error recovery be incorporated
      into training and offline diagnostics without simplifying the deployment setting?
    - What minimum supervision and infrastructure budget is required to achieve strong
      GUI-agent performance across web, desktop, mobile, and scientific software environments?
    - Do available code, dataset, benchmark, and harness artifacts support independent
      reproduction, and are missing limitation or artifact details verification gaps?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 面向计算机使用智能体的GUI技能与记忆复用，例如 VISUALSKILL 和 EchoPath
      解决的问题: 将经过验证的应用工作流编码为多模态技能或可回放记忆，使智能体复用流程、降低 token 与执行时间，并在运行期改善 UI 定位。
      尚未覆盖: 复用依赖确定性适用条件或逐应用编写；证据尚未证明跨应用、跨操作系统、实时时序和长期工件维护上的泛化能力。
    - 路线: Harness 原生与在线训练框架，例如 OpenForgeRL、OpenWebRL 和 GUICrafter
      解决的问题: 在真实或 harness 包装环境中训练 GUI 智能体，通过弱监督、在线多轮强化学习或拦截已部署 harness 调用降低标注成本。
      尚未覆盖: 训练后错误恢复仍弱；harness 设计影响可学习性；评估只覆盖数百到数千任务，跨域和跨基础设施泛化尚不确定。
    - 路线: 面向 GUI 生成的智能体模型架构，例如 LLaDA-UI
      解决的问题: 提供基于块级扩散的视觉语言 GUI 生成范式，同时尽量保留并行解码并改善 grounding 与导航。
      尚未覆盖: 现有证据仅与选定的 Qwen 基线在六个基准上比较，缺少关于部署延迟、鲁棒性和更广泛可复现性的局限分析。
    - 路线: 诊断基准与评测环境，例如 Desktop-Delta Bench 和 OSWorld-Science
      解决的问题: 在最终任务成功之外评估 GUI 过渡重构、状态验证、源跟踪、动作推断和科学软件工作流，并采用执行式评分。
      尚未覆盖: 离线诊断未包含异步实时动态；覆盖主要限于 Linux 桌面动作类型或选定科学领域，实时和跨操作系统有效性仍不确定。
    共识:
    - 可运行 GUI 系统通常将智能体策略与 harness 或编排层分离，使同一策略可以在多个环境中复用。
    - 训练与评测越来越依赖执行级或轨迹级成功信号，而不是只测量单帧动作定位。
    - 记忆、技能或回放工件在保留视觉和上下文信息并经过条件适用性检查时，可以显著降低推理成本并改善 grounding。
    - 弱监督或在线强化学习可以显著减少对大规模 GUI 标注数据的依赖，但需要谨慎初始化和任务成功判定。
    分歧:
    - 监督策略不同：有的使用海量未标注截图加小规模高质量校准集，有的使用真实网站在线多轮强化学习或 SFT 加 RL，数据效率和基础设施成本不同。
    - 表示方式不同：面向 GUI 生成的块级扩散与 harness 包装的自回归或多模态策略在可见证据中缺少匹配训练和部署条件下的比较。
    - 记忆粒度不同：按主题组织的多模态技能库与带确定性适用检查和图像重瞄准的可回放轨迹记忆代表了不同复用假设。
    - 评测目标不同：离线步骤级过渡诊断和领域特定的科学软件任务与在线网页或桌面任务成功不等价，报告结果不可直接互换。
    开放问题:
    - 可复用记忆与技能工件在应用、操作系统版本和 UI 布局变化时是否仍正确，需要怎样的验证和维护？
    - 如何在不简化部署环境的前提下，将实时 GUI 时序、异步事件和错误恢复纳入训练与离线诊断？
    - 在网页、桌面、移动和科学软件环境中达到强 GUI 智能体性能所需的最小监督与基础设施预算是什么？
    - 现有代码、数据集、基准和 harness 工件是否支持独立复现，缺失的局限说明或工件信息是否构成验证缺口？
