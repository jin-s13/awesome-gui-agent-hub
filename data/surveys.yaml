  related_work_outline:
  - 'Mainstream direction: Scaling GUI agent training via verifiable task synthesis
    and online RL, combined with weakly-supervised visual grounding from massive unannotated
    screenshots, pushes state-of-the-art on realistic OS and web benchmarks. This
    direction is exemplified by methods like SCALECUA and GUICrafter.'
  - 'Shared research pattern: Most works introduce a new benchmark or dataset that
    exposes a capability gap in existing agents, then propose a method or training
    recipe that addresses that gap, and evaluate on the newly introduced testbed.
    The pattern pairs assessment with algorithmic improvement.'
  - 'Key differences: Papers differ in the supervision signal used (online RL with
    verifiable rewards vs. weak supervision from unlabeled data vs. full supervised
    fine-tuning), the interaction type targeted (click-based, drag-based, GUI+CLI,
    dynamic video interfaces), and the primary evaluation objective (task success,
    cost-accuracy, uncertainty calibration, or long-horizon consistency).'
  - 'Trend evolution: Within the 2024–2026 window, the field is moving from static,
    single-app click benchmarks toward dynamic, multi-app, multi-interaction settings
    that require agents to manage observation, context, and long-horizon memory. There
    is a growing emphasis on data efficiency and on verification of task completion
    without human evaluators.'
  - 'Open questions: Whether gains from task synthesis and RL transfer to unseen platforms
    and interaction modes; how to endow agents with observation control to avoid over-
    and under-observation in dynamic interfaces; and how to reliably quantify and
    transfer uncertainty estimates across model families and GUI grounding datasets.'
  related_work_outline_zh:
  - 主流方向：通过可验证任务合成与在线强化学习，以及从海量未标注截图中学习弱监督视觉定位，扩大GUI代理训练规模，在真实操作系统和网页基准上取得最优结果。代表性工作如
    SCALECUA 和 GUICrafter。
  - 研究共性：多数工作先提出新的基准或数据集来暴露现有代理的能力缺口，再提出解决该缺口的方法或训练配方，并在新测试床上评估。这种模式将评估与算法改进配对。
  - 关键差异：论文在所使用的监督信号（在线RL的可验证奖励 vs. 无标注数据的弱监督 vs. 全监督微调）、所针对的交互类型（点击、拖拽、GUI+CLI、动态视频界面）以及主要评估目标（任务成功率、成本-准确性、不确定性校准或长时域一致性）上存在差异。
  - 趋势演进：在 2024–2026 年窗口内，领域正从静态单应用点击基准向需要代理管理观察、上下文和长时域记忆的动态、多应用、多交互设置发展，并越来越强调数据效率以及无需人工评估即可验证任务完成的能力。
  - 开放问题：任务合成与RL带来的收益是否能迁移到未见过的平台和交互模式；如何赋予代理观察控制能力以避免动态界面中的过度观察与观察不足；以及如何在模型家族和GUI定位数据集之间可靠地量化并迁移不确定性估计。
  literature_review:
    line_of_work_matrix:
    - line: Training paradigm and data efficiency
      what_it_solves: Reducing reliance on expensive human-annotated GUI trajectories
        by generating verifiable tasks at scale or by exploiting weak supervision
        from unlabeled screenshots and web pages.
      what_remains_open: Whether the policies trained via online RL on synthetic Docker
        tasks transfer to real-world heterogeneous OS environments, and whether the
        visual grounding learned from unlabeled static screens generalizes to fully
        interactive, dynamic interfaces.
    - line: Long-horizon context management
      what_it_solves: Preventing context explosion and information loss in mobile
        GUI agents executing dozens of steps by treating context management as a first-class
        action and maintaining structured, compact history fields.
      what_remains_open: The approach has been demonstrated on a single 8B model and
        a specific mobile benchmark; its effectiveness when scaling to larger models,
        different device form factors, or non-mobile OS environments remains unverified.
    - line: Video-guided GUI interaction
      what_it_solves: Bridging video understanding and GUI action prediction by extracting
        task-relevant keyframes from video input, improving both VideoQA and video-guided
        agentic task performance.
      what_remains_open: The keyframe extraction algorithm is evaluated on a custom
        benchmark built for short video clips; its robustness to long, untrimmed screen
        recordings and to fully autonomous agent loops is not yet established.
    - line: Uncertainty quantification for GUI grounding
      what_it_solves: Measuring the reliability of GUI agent grounding predictions
        across models and datasets, and providing spatial safety regions via conformal
        prediction.
      what_remains_open: Ranking transfer of UQ methods breaks down across model tiers
        and interface types, and conformal coverage degrades under distribution shift,
        limiting deployment-time guarantees without per-target reranking.
    - line: Interaction modality expansion
      what_it_solves: Extending GUI agent capabilities beyond click-based actions
        to drag-based interactions such as text highlighting, resizing, and slider
        manipulation.
      what_remains_open: The current evaluation is limited to a held-out set of drag
        tasks; it is unclear whether improvements on drag grounding translate to higher
        success rates on full end-to-end computer-use tasks involving mixed click
        and drag operations.
    - line: Dynamic interface and observation control
      what_it_solves: Formalizing the challenge of living-screen GUI agents where
        content changes between actions, and highlighting the need for agents to regulate
        their own observation frequency.
      what_remains_open: No model has yet achieved human-level cost-accuracy on dynamic
        short-video platform tasks; the benchmark is restricted to one application
        domain, and no explicit observation-control method is proposed or evaluated.
    - line: Real-world multi-app OS benchmarking
      what_it_solves: Providing a comprehensive evaluation of agents on real macOS
        desktop tasks spanning many applications and mixing GUI and CLI interactions,
        with fine-grained sub-goal scoring.
      what_remains_open: The benchmark reveals that framework-level design contributes
        less to success than skill libraries, but it does not isolate which specific
        training or architectural choices lead to better sub-goal completion across
        diverse application types.
    consensus:
    - Modern GUI agents still underperform humans on tasks requiring dynamic observation
      control, long-horizon memory, and mixed interaction modes (GUI+CLI, click+drag).
    - Fine-grained evaluation metrics (sub-goal completion, cost-accuracy, uncertainty
      calibration) expose differences that coarse pass/fail rates hide.
    - 'Data efficiency is a cross-cutting concern: methods that reduce annotation
      requirements or generate verifiable tasks autonomously are seen as critical
      for scaling.'
    - Simple framework or model scaling alone is insufficient; auxiliary components
      such as skill libraries, memory management, and keyframe selection are necessary
      to tackle complex, multi-step tasks.
    disagreements:
    - 'Supervision strategy: some works advocate for online RL with verifiable environment
      rewards, while others pursue weak supervision from unlabeled static data or
      fully supervised fine-tuning. The relative effectiveness of each approach under
      the same task diversity and interaction complexity is not yet compared.'
    - 'Evaluation target: some benchmarks target task-level success on a single OS,
      while others measure information efficiency, uncertainty quality, or interaction-specific
      grounding. There is no unified protocol that spans all these axes.'
    - 'Interaction modality: most benchmarks focus on point-and-click actions, but
      emerging works argue that drag, CLI, and observation-control actions are equally
      important. The community has not settled on a standard interaction vocabulary
      for end-to-end GUI agents.'
    - 'Deployment setting: mobile, desktop, and browser-based platforms are treated
      independently, and it is unclear whether a single agent design can work across
      them, or whether platform-specific customization is necessary.'
    open_questions:
    - How can we design a unified GUI agent that handles click, drag, typing, CLI,
      and observation-control actions while maintaining state across heterogeneous
      applications and platforms?
    - To what extent do the gains reported from online RL and task synthesis reflect
      improved decision-making versus better reward engineering or more favorable
      environment dynamics?
    - Under what conditions do uncertainty-aware and conformal-prediction-based safety
      mechanisms remain reliable when the agent is deployed on previously unseen interface
      styles or operating systems?
    - What is the minimal set of supervision signals and interaction demonstrations
      needed to achieve robust generalization from a desktop agent to a mobile agent,
      or from a static-screen benchmark to a living-screen benchmark?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 训练范式与数据效率
      解决的问题: 通过大规模生成可验证任务或利用未标注截图和网页的弱监督，减少对昂贵人工标注GUI轨迹的依赖。
      尚未覆盖: 基于合成Docker任务在线RL训练的策略能否迁移到真实异构操作系统环境，以及从无标注静态截图学到的视觉定位能否泛化到完全交互的动态界面。
    - 路线: 长时域上下文管理
      解决的问题: 防止移动GUI代理在数十步操作中上下文爆炸和信息丢失，通过将上下文管理作为第一类动作并维护结构化、紧凑的历史字段。
      尚未覆盖: 该方法目前仅在单个8B模型和特定移动基准上得到验证；扩展到更大模型、不同设备形态或非移动OS环境时的有效性尚未被证实。
    - 路线: 视频引导的GUI交互
      解决的问题: 通过从视频输入中提取任务相关的关键帧，桥接视频理解与GUI动作预测，同时提升VideoQA和视频引导的代理任务性能。
      尚未覆盖: 关键帧提取算法在自定义的短视频基准上评估；其对长时、未修剪的屏幕录制和完全自主代理循环的鲁棒性尚未建立。
    - 路线: GUI定位的不确定性量化
      解决的问题: 衡量GUI代理定位预测在不同模型和数据集上的可靠性，并通过共形预测提供空间安全区域。
      尚未覆盖: UQ方法的排名迁移在跨模型层级和接口类型时失效，共形覆盖在分布偏移下退化，限制了部署时的保证，除非针对每个目标重新排名。
    - 路线: 交互模态扩展
      解决的问题: 将GUI代理的能力从基于点击的动作扩展到基于拖拽的交互，如文本高亮、元素调整大小和滑块操作。
      尚未覆盖: 当前评估仅限于保留的拖拽任务集；拖拽定位的提升是否能转化为在包含点击和拖拽混合操作的完整端到端计算机使用任务中更高的成功率尚不清楚。
    - 路线: 动态界面与观察控制
      解决的问题: 形式化动态屏幕GUI代理的挑战，即内容在动作间变化，并强调代理需要调节自身的观察频率。
      尚未覆盖: 尚无模型在动态短视频平台任务上达到人类水平的成本-准确性；基准仅限一个应用领域，且未提出或评估任何显式的观察控制方法。
    - 路线: 真实世界多应用OS基准测试
      解决的问题: 在覆盖大量应用并混合GUI与CLI交互的真实macOS桌面任务上对代理进行全面评估，并提供细粒度子目标评分。
      尚未覆盖: 基准揭示了框架设计的贡献小于技能库，但未隔离出哪些具体训练或架构选择能提升多样应用类型中的子目标完成度。
    共识:
    - 现代GUI代理在需要动态观察控制、长时域记忆和混合交互模式（GUI+CLI、点击+拖拽）的任务上仍远低于人类水平。
    - 细粒度评估指标（子目标完成度、成本-准确性、不确定性校准）能揭示粗粒度通过率所掩盖的差异。
    - 数据效率是一个跨领域的关注点：减少标注需求或自主生成可验证任务的方法被视为扩展的关键。
    - 仅靠简单的框架或模型扩展是不够的；需要技能库、记忆管理和关键帧选择等辅助组件来处理复杂的多步任务。
    分歧:
    - 监督策略：一些工作提倡使用可验证环境奖励的在线RL，而另一些则追求从无标注静态数据的弱监督或全监督微调。在相同任务多样性和交互复杂性下，每种方法的相对有效性尚未被比较。
    - 评估目标：部分基准针对单一操作系统上的任务级成功率，而其他基准则衡量信息效率、不确定性质量或交互特定定位。尚不存在覆盖所有这些维度的统一协议。
    - 交互模态：多数基准关注点击动作，但新兴工作认为拖拽、CLI和观察控制动作同等重要。社区尚未就端到端GUI代理的标准交互词汇达成一致。
    - 部署设置：移动、桌面和基于浏览器的平台被独立对待，尚不清楚单一代理设计能否跨平台工作，或是否需要特定平台的定制。
    开放问题:
    - 如何设计一个统一的GUI代理，既能处理点击、拖拽、键入、CLI和观察控制动作，又能在异构应用和平台间保持状态？
    - 在线RL和任务合成报告的收益在多大程度上反映了决策能力的提升，而非更好的奖励工程或更有利的环境动态？
    - 当代理部署在未见过的界面风格或操作系统上时，基于不确定性和共形预测的安全机制在什么条件下仍能保持可靠？
    - 从桌面代理泛化到移动代理，或从静态屏幕基准泛化到动态屏幕基准，所需的最小监督信号和交互演示集是什么？
