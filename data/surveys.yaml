  literature_review:
    line_of_work_matrix:
    - line: Realistic GUI and OS task/dataset construction
      what_it_solves: Creates reusable environments and task suites that reproduce
        desktop, dynamic-screen, drag, and video-guided interactions beyond static
        click-only web tasks.
      what_remains_open: Whether these task distributions generalize across unseen
        applications, platforms, and dynamic interface types, and whether artifacts
        can be verified outside the source benchmark.
    - line: Agent capability training and skill augmentation
      what_it_solves: Improves computer-use agents through multimodal skill libraries,
        verifiable task synthesis with online RL, or weakly supervised grounding from
        unannotated screenshots, reducing annotation burden while lifting benchmark
        success.
      what_remains_open: Transferability beyond reported benchmarks, data-efficiency
        claims across model scales, and whether gains come from skill content, framework
        design, or training distribution.
    - line: Fine-grained, uncertainty, and stress-test evaluation
      what_it_solves: Probes sub-goal completion, information/cost efficiency, post-hoc
        uncertainty calibration, conformal safety regions, and interaction-specific
        grounding beyond aggregate Pass@1.
      what_remains_open: Alignment of these metrics with downstream user decisions,
        stability under distribution or interface shift, and whether ranking transfer
        holds across open and closed model tiers.
    consensus:
    - Benchmark design is shifting from static click-only web tasks toward richer
      interaction surfaces such as desktop OS, GUI+CLI, drag, dynamic short-video,
      and video-guided workflows.
    - 'Aggregate success is treated as insufficient: several works add sub-goal, cost-accuracy,
      uncertainty, or interaction-specific metrics to expose capability gaps hidden
      by Pass@1.'
    - Agent-side training and knowledge artifacts, including skills, synthetic verifiable
      tasks, and weak supervision, are becoming central to improving computer-use
      performance.
    - Current agents still lack reliable observation control and grounding in dynamic
      or information-dense environments.
    disagreements:
    - 'Evaluation settings diverge: real macOS desktop tasks, simulated browser-based
      dynamic video environments, single-step GUI grounding datasets, and video-guided
      interactive tasks.'
    - 'Improvement strategies differ in supervision and data: curated multimodal skill
      artifacts, online RL over synthesized verifiable tasks, or weakly supervised
      grounding from unannotated screenshots.'
    - 'Metric emphasis differs: Pass@1 and sub-goal completion, cost-accuracy and
      observation efficiency, or post-hoc uncertainty calibration and conformal coverage.'
    - 'Interaction coverage differs: drag-only manipulation, GUI+CLI workflows, dynamic
      living-screen content, and video-guided GUI action are separately benchmarked
      rather than unified.'
    open_questions:
    - How well do current GUI/OS benchmark conclusions transfer across operating systems,
      applications, and dynamic or video-based interfaces when only within-model evidence
      is stable?
    - Which fine-grained or uncertainty metrics predict downstream user utility, given
      that similar Pass@1 agents can differ in sub-goal completion and calibration
      coverage degrades under interface mismatch?
    - Do agent training gains from skill libraries, verifiable task synthesis, or
      weak supervision persist beyond reported benchmark suites such as OSWorld, ScienceBoard,
      CUA-World, and OSExpert-Eval?
    - Can dynamic-screen and drag/video-guided interaction benchmarks be unified with
      deterministic or verifiable scoring without losing task fidelity?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 真实 GUI 与 OS 任务/数据集构建
      解决的问题: 构建可复用的环境和任务集，覆盖桌面、动态屏幕、拖拽与视频引导交互，超越静态点击式网页任务。
      尚未覆盖: 这些任务分布能否泛化到未见应用、平台和动态界面类型；工件能否在源基准之外被验证。
    - 路线: 代理能力训练与技能增强
      解决的问题: 通过多模态技能库、可验证任务合成与在线强化学习、或未标注截图的弱监督定位，提升计算机使用代理的成功率并降低标注成本。
      尚未覆盖: 训练后代理能否迁移到报告基准之外；数据效率结论是否跨模型规模成立；增益究竟来自技能内容、框架设计还是训练分布。
    - 路线: 细粒度、不确定性与压力测试评估
      解决的问题: 在聚合 Pass@1 之外检验子目标完成、信息/成本效率、后验不确定性校准、共形安全区域和特定交互定位。
      尚未覆盖: 这些指标与下游用户决策是否一致；在分布或界面偏移下是否稳定；排名迁移在开源与闭源模型层级间是否成立。
    共识:
    - 基准设计正从静态点击式网页任务转向更丰富的交互表面，包括桌面 OS、GUI+CLI、拖拽、动态短视频和视频引导工作流。
    - 聚合成功率被认为不够：多项工作加入子目标、成本-准确性、不确定性或交互特定指标，以暴露 Pass@1 掩盖的能力差距。
    - 代理侧训练与知识工件（技能、可验证合成任务、弱监督）正成为提升计算机使用性能的核心路径。
    - 当前代理在动态或信息密集环境中仍缺乏可靠的观察控制和定位能力。
    分歧:
    - 评测设置不同：真实 macOS 桌面任务、模拟浏览器动态视频环境、单步 GUI 定位数据集和视频引导交互任务并存。
    - 改进策略在监督与数据上不同：策展的多模态技能工件、基于可验证合成任务的在线强化学习、或来自未标注截图的弱监督定位。
    - 指标重点不同：Pass@1 与子目标完成、成本-准确性与观察效率、或后验不确定性校准与共形覆盖。
    - 交互覆盖不同：拖拽操作、GUI+CLI 工作流、动态屏幕内容和视频引导 GUI 动作被分别基准测试，尚未统一。
    开放问题:
    - 当只有模型内证据稳定时，当前 GUI/OS 基准结论在操作系统、应用和动态或视频界面之间的迁移性如何？
    - 哪些细粒度或不确定性指标能预测下游用户效用，考虑到相似 Pass@1 代理在子目标完成上可能不同，且校准覆盖在界面不匹配下会下降？
    - 来自技能库、可验证任务合成或弱监督的代理训练增益能否在 OSWorld、ScienceBoard、CUA-World 和 OSExpert-Eval 等已报告基准之外持续？
