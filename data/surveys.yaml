    line_of_work_matrix:
    - line: Taxonomy and roadmap synthesis
      what_it_solves: Maps fragmented GUI-agent work into directions, milestones,
        and gaps, including grounding, long-horizon memory, verifiable learning, uncertainty,
        and safety.
      what_remains_open: The packet lacks actual survey articles, so systematic coverage
