  literature_review:
    line_of_work_matrix:
    - line: Real-world multi-app computer-use benchmarking
      what_it_solves: Measures GUI and CLI agent capability on realistic desktop tasks
        with deterministic multi-checkpoint scoring and capability annotations.
      what_remains_open: Published evidence does not show transfer across OS versions
        or dynamic interfaces, and limitation reporting is absent.
    - line: Multimodal skill retrieval and augmentation
      what_it_solves: Improves application-specific workflow grounding by retrieving
        hierarchical text-plus-visual skill artifacts.
      what_remains_open: Generalization beyond the evaluated benchmarks, app version
        changes, and skill curation cost remain unverified.
    - line: Specialized interaction and dynamic-interface benchmarks
      what_it_solves: Covers drag actions and living screens where content changes
        between actions, measuring cost-accuracy or fine-grained interaction success.
      what_remains_open: Human-level observation control and coverage beyond short-video
        or four drag interaction types remain open.
    - line: Efficient repeated-task replay
      what_it_solves: Compiles successful agent runs into screen-checking state-machine
        programs to reduce per-step language-model calls and speed up repeated tasks.
      what_remains_open: Robustness to interface changes and integration with retrieval
        or skill mechanisms are not established.
    - line: Vision-language GUI agent architectures
      what_it_solves: Uses block-wise diffusion MoE training with multimodal pre-training
        and GUI supervised fine-tuning to improve grounding and navigation across
        platforms.
      what_remains_open: Reported gains cover a small set of GUI benchmarks; broader
        real-world deployment and reproducibility remain thin.
    - line: Scalable training and environment resources
      what_it_solves: Supports agents with task-driven keyframe extraction or source-grounded
        reusable web environments to improve video-guided performance and trajectory
        fine-tuning.
      what_remains_open: Video-to-GUI transfer beyond VideoQA and fully automated
        real-web operation across domains are not proven.
    consensus:
    - Frontier GUI agents still show clear capability gaps when measured beyond simple
      task accuracy, such as sub-goal completion, observation cost, or interaction
      type coverage.
    - Structured augmentations—retrieved multimodal skills, compiled replay programs,
      task-driven keyframes, or reconstructed environments—tend to improve downstream
      agent performance.
    - Evaluations use realistic application contexts and vision-language agents, but
      human-level or robust cross-setting performance is not reached.
    - Performance advantages can come from skill knowledge or task-specific data rather
      than agent framework design alone.
    disagreements:
    - 'Evaluation target differs: deterministic Pass@1 versus sub-goal scoring, cost-accuracy,
      repeated-task latency, or VideoQA gains.'
    - 'Interaction representation differs: GUI and CLI desktop actions, drag gestures,
      video-guided observation control, and dynamic screen observation are treated
      separately.'
    - 'Method of improvement differs: retrieval of multimodal skill artifacts, compiled
      state-machine replay, diffusion architecture, keyframe extraction, or generated
      training environments.'
    - 'Deployment setting differs: real macOS applications, browser-based short-video
      platforms, wild web environments, and mobile/desktop/web navigation benchmarks
      are evaluated separately.'
    open_questions:
    - Can observation-control failures seen in dynamic short-video interfaces be reduced
      without task-specific benchmarks?
    - Do skill retrieval, replay, and environment-generation gains transfer across
      OS versions, app updates, domains, and interaction types?
    - Which evaluation metric—Pass@1, sub-goal score, cost-accuracy, or latency—best
      predicts real user task success and reliability?
    - What are the missing limitation and reproducibility details for papers where
      limitation fields are empty or artifacts are not indicated?
