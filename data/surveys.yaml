  literature_review:
    line_of_work_matrix:
    - line: Realistic computer-use benchmark task and environment design
      what_it_solves: Creates shared executable tasks across desktop, OS, browser,
        and video-based interfaces to compare agent behavior under realistic interactions.
      what_remains_open: Coverage is concentrated on specific platforms or interface
        classes; transfer across unseen apps, operating systems, and dynamic content
        settings remains under-evidenced.
    - line: Diagnostic metric and stress-test design
      what_it_solves: Moves beyond aggregate success to measure sub-goal completion,
        observation-control or cost-accuracy balance, and post-hoc uncertainty calibration.
      what_remains_open: Alignment between diagnostic metrics and downstream task
        utility is not established; ranking and calibration transfer weakens across
        model tiers and interfaces.
    - line: Comparable baselines and reporting substrate
      what_it_solves: Uses shared benchmarks such as OSWorld, ScienceBoard, OSExpert-Eval,
        CUA-World, and WindowsAgentArena as common evaluation backbones for agents
        and methods.
      what_remains_open: Implementation and compute-budget stability, limitation reporting,
        and artifact availability vary; absent OpenAlex records or missing code, datasets,
        and limitation fields limit auditability.
    - line: Agent improvement methods evaluated on these benchmarks
      what_it_solves: Develops multimodal skill libraries, self-improving harnesses,
        verifiable RL task synthesis, or weakly supervised training to raise frozen-model
        or trained agent performance on GUI/OS tasks.
      what_remains_open: Generalization beyond the evaluated benchmarks, validity
        of synthesized tasks, training data scale claims, and transfer to dynamic
        or unseen interfaces remain open.
    consensus:
    - Realistic executable benchmarks increasingly replace synthetic or single-page
      GUI success tests.
    - Coarse Pass@1 hides meaningful sub-goal or efficiency differences; fine-grained
      scoring and cost-accuracy or uncertainty diagnostics are becoming common.
    - Current frontier agents remain below strong human-level reliability, especially
      on dynamic screens and observation-control tasks.
    - Evaluation conclusions are sensitive to task distribution, framework or harness
      choice, and model accessibility, so cross-setting comparison requires caution.
    disagreements:
    - Static desktop or CLI tasks assume relatively stable interfaces, while living-screen
      and video-guided tasks assume content changes between observations and actions.
    - Some studies target single-step grounding or short evaluation trajectories,
      whereas others target full multi-step computer-use workflows.
    - Some contributions measure existing models via benchmarks only, while others
      intervene through multimodal skills, harness optimization, RL task synthesis,
      or weak supervision.
    - 'Metric focus differs: success or Pass@1, cost-accuracy observation efficiency,
      sub-goal completion, and uncertainty or conformal coverage are optimized for
      different failure modes.'
    open_questions:
    - How well do benchmark rankings and uncertainty calibration transfer across operating
      systems, interface types, and model tiers without target-specific re-evaluation?
    - How can observation-control and cost-accuracy metrics be aligned with the downstream
      decisions users actually care about?
    - Can current single-step UQ and grounding diagnostics be extended to multi-step
      agent trajectories and dynamic screen changes without losing calibration?
    - How stable are conclusions from synthesized RL tasks, skill libraries, or frozen-harness
      optimization under different implementations, compute budgets, and unseen applications?
    - Where are missing code, dataset, limitation, and artifact details limiting reproducibility
      of reported benchmark gains?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 真实计算机使用基准的任务与环境设计
      解决的问题: 在桌面、OS、浏览器和视频相关界面中提供可执行任务，让智能体的真实交互行为可比较。
      尚未覆盖: 覆盖范围集中于特定平台或界面类别；跨未见应用、操作系统和动态内容设置的迁移证据不足。
    - 路线: 诊断性指标与压力测试设计
      解决的问题: 超越总体成功率，衡量子目标完成、观察控制或成本-准确性权衡，以及后验不确定性校准。
      尚未覆盖: 诊断指标与下游任务效用的一致性尚未建立；在不同模型层级和界面之间，排序和校准迁移会变弱。
    - 路线: 可比基线与报告基础
      解决的问题: 借助 OSWorld、ScienceBoard、OSExpert-Eval、CUA-World、WindowsAgentArena 等共享基准，为智能体和方法提供共同评测骨架。
      尚未覆盖: 实现和算力预算稳定性、限制声明与工件可用性不一致；缺少 OpenAlex 记录、代码、数据集或 limitations 会影响可审计性。
    - 路线: 在这些基准上评测的智能体改进方法
      解决的问题: 通过多模态技能库、自改进 harness、可验证 RL 任务合成或弱监督训练，提升冻结或训练后的智能体在 GUI/OS 任务上的表现。
      尚未覆盖: 超出评测基准的泛化、合成任务有效性、训练数据规模声明以及向动态或未见界面的迁移仍然开放。
    共识:
    - 真实可执行基准正逐步取代合成或单页 GUI 成功测试。
    - 粗粒度 Pass@1 会掩盖子目标或效率差异；细粒度评分、成本-准确性或不确定性诊断越来越常见。
    - 当前前沿智能体在动态屏幕和观察控制任务上仍明显低于强人类表现。
    - 评测结论受任务分布、框架或 harness 选择和模型可访问性影响，跨设置比较需谨慎。
    分歧:
    - 静态桌面或 CLI 任务假设界面相对稳定，而动态屏幕和视频引导任务假设观察与操作之间内容会变化。
    - 有的研究针对单步 grounding 或短轨迹，而另一些针对完整多步计算机使用工作流。
    - 有的贡献只对现有模型进行基准测评，另一些通过多模态技能、harness 优化、RL 任务合成或弱监督进行干预。
    - 指标重点不同：成功或 Pass@1、成本-准确性观察效率、子目标完成和不确定性或共形覆盖各自针对不同失败模式。
    开放问题:
    - 基准排序和不确定性校准在跨操作系统、界面类型和模型层级之间，能在多大程度上不依赖目标特定重评而迁移？
    - 观察控制和成本-准确性指标如何与用户真正关心的下游决策对齐？
    - 当前单步 UQ 和 grounding 诊断能否扩展到多步智能体轨迹与动态屏幕变化，同时保持校准？
    - 合成 RL 任务、技能库或冻结 harness 优化得到的结论，在不同实现、算力预算和未见应用中是否稳定？
    - 哪些缺失的代码、数据集、限制声明和工件细节正在限制已报告基准提升的可复现性？
