    with increasing emphasis on multimodal skills, execution efficiency, and dynamic
    interface handling.'
  - 'Shared research pattern: Evaluate multimodal agents on task suites that simulate
    real application workflows, use screen-grounded visual understanding, and measure
    success through task completion or fine-grained sub-goal metrics, often revealing
    brittle observation control or planning failures.'
  - 'Key differences: Benchmarks diverge by interaction type (click, drag, dynamic
