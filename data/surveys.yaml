  literature_review_zh:
    研究路线矩阵:
    - 路线: 真实应用基准构建，如MacAgentBench、DragOn、LivingScreen
      解决的问题: 覆盖此前测试不足的GUI应用任务，包括多应用桌面流程、拖拽操作和动态短视频界面，并提供细粒度评分或数据集。
      尚未覆盖: 评测常局限于单一平台或人工环境；跨平台迁移、真实用户工作流和完整局限性说明仍不明确。
    - 路线: 动态与视频引导交互评测，如LivingScreen和视频引导GUI基准
      解决的问题: 处理动作之间内容变化的界面和由视频参考引导的任务，同时衡量准确性和信息成本。
      尚未覆盖: 尚无模型达到人类级成本-准确性，说明观察控制能力不足；覆盖范围局限于特定动态平台或视频任务格式。
    - 路线: 可复用技能、记忆与编译重放，如VISUALSKILL和PreAct
      解决的问题: 通过保留多模态技能、分层主题索引或将成功运行编译为状态机程序，提升重复任务速度和完成率。
      尚未覆盖: 应用布局、任务目标或界面状态变化时的泛化能力，以及回退和失配处理的鲁棒性仍未解决。
    - 路线: 运行时验证与视觉基础评判，如HiViG
      解决的问题: 在执行前总结动作历史，并将原始执行坐标与当前屏幕比对，从而拦截执行错误。
      尚未覆盖: 证据仅限于特定基础策略和基准；长期可靠性和跨策略部署边界尚未建立。
    - 路线: GUI grounding与导航的生成式模型训练，如LLaDA-UI
      解决的问题: 训练多模态GUI智能体，在移动、桌面、网页和grounding基准上直接生成定位与导航动作。
      尚未覆盖: 模型规模、推理效率、跨平台鲁棒性以及可见代码或检查点证据仍是验证缺口。
    共识:
    - GUI智能体主要通过策展应用基准上的任务成功率评估，常使用规则或参考答案评分。
    - 显式保留的知识，无论是多模态技能、历史摘要还是编译程序，都能比无记忆基线提升完成率或效率。
    - 视觉grounding和屏幕状态检查有助于发现仅看通过率或成功率可能隐藏的执行错误。
    - 即使强模型在动态界面、不常见交互和子目标完成上仍有明显差距。
    - 可复现性不均：多项工作报告了基准和训练工件，但可见代码、数据划分、检查点或局限性声明常不完整。
    分歧:
    - 交互范围不同：静态桌面、移动和网页点击；动态屏幕；拖拽操作；GUI+CLI多应用流程；以及视频引导参考任务。
    - 改进机制不同：多模态技能库、状态机重放、历史感知评判器和块级扩散架构分别针对知识复用、速度、执行错误或动作生成等不同瓶颈。
    - 评测目标不同：有些优化Pass@1或成功率，有些加入成本-准确性、子目标完成或重放速度，可能带来不同的系统排序。
    - 监督信号不同：合成或生成的GUI数据微调、冻结模型提示加检索技能，以及基于真实轨迹的评判器训练，对训练和部署假设不同。
    - 部署设置不同：有的需要运行时回退到智能体，有的需要按应用构建技能，有的需要平台特定轨迹进行离线训练。
    开放问题:
    - 在单一平台或合成交互基准上的提升能否迁移到未见应用和真实用户工作流？
    - 何种机制能让智能体在动态界面中获得更好的观察控制，并如何平衡信息成本与任务准确性？
    - 当应用布局、内容或任务目标变化时，可复用技能或编译程序如何保持有效？
    - 评判器、屏幕检查和重放回退机制在报告基准之外的可靠性如何？
    - 当代码、数据划分、模型检查点或显式局限性不可见时，已有进展有多少能被独立验证？
