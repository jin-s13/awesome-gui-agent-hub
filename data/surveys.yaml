  related_work_outline_zh:
  - 主流方向：证据集中呈现GUI/计算使用智能体的评测与改进，而非显式综述——包括可验证任务合成、环境密集监督、harness/上下文优化、定位与不确定性基准、安全红队审计；真正路线图式综合仍是证据缺口。
  - 研究共性：把缺失的评测或训练条件转化为基准、数据集或优化回路，再跨模型或跨环境测量迁移；例如关键帧提取、桌面密集观测、可验证RL任务、上下文即动作、UQ排名、净化后的欺诈/安全设定。
  - 关键差异：差异集中在瓶颈（数据/任务稀缺、上下文长度、不确定性校准、安全）、交互界面（视频、桌面、移动、浏览器/编码）、监督信号（密集标注、RL验证器、执行证据、人工标注案例）以及是否检验跨分布/跨界面迁移。
  - 趋势演进：2024–2026证据显示从单步定位走向长程智能体轨迹、在线与合成任务规模化、冻结模型与harness自改进、主动记忆以及显式不确定性与安全评测；时间跨度窄，属当前前沿趋势而非历史变化。
  - 开放问题：这些方法与基准是否足以支撑系统分类仍未经完整综述证据验证；跨基准结果兼容性、缺失代码/数据、空白的局限性字段构成验证缺口；应优先解决哪一瓶颈尚无共识。
  literature_review:
    line_of_work_matrix:
    - line: Verifiable task and environment synthesis
      what_it_solves: Scarce supervision and non-reproducible agent tasks by generating
        verifiable or densely annotated desktop/video tasks.
      what_remains_open: Whether synthesized conditions cover real deployment surfaces
        and whether generated tasks remain compatible across benchmarks.
    - line: Harness, context, and policy optimization
      what_it_solves: Improving long-horizon or frozen-model GUI agents by optimizing
        execution harness, memory fields, or rollout allocation instead of only fine-tuning.
      what_remains_open: Transfer claims rely on selected benchmarks; limitation fields
        are empty or truncated, leaving failure boundaries unquantified.
    - line: Grounding and uncertainty evaluation
      what_it_solves: Measuring GUI grounding and post-hoc uncertainty calibration
        across vision-language models and datasets.
      what_remains_open: Rankings transfer well within model tiers but weakly across
        interfaces and model classes; single-step grounding does not cover multi-step
        agent trajectories.
    - line: Safety and risk benchmarking
      what_it_solves: Evaluating fraud judgment and prompt-injection or skill-injection
        safety in web and coding computer-using agents.
      what_remains_open: Sanitized or domain-specific conditions may not generalize;
        prior RL-optimized attacks were not reproduced, so safety claims are bounded
        by hand-crafted evidence.
    consensus:
    - 'GUI and computer-use agents require more than model scaling: task data, execution
      feedback, memory, grounding confidence, and safety evaluation are treated as
      first-class research objects.'
    - Controlled benchmarks and dense supervision are preferred for measuring improvement,
      but there is no common transfer metric across desktop, mobile, video, web, and
      coding settings.
    - Evidence in this packet agrees that evaluation conditions shape conclusions,
      so papers introduce altered conditions—sanitized cues, verifiable rewards, or
      held-out environments—rather than assuming existing leaderboard ranks transfer.
    disagreements:
    - 'Where improvement should come from differs: some optimize the surrounding harness
      or context while keeping the backbone frozen, while others synthesize tasks
      for online RL or supervised fine-tuning.'
    - Evaluation target differs across single-step GUI grounding uncertainty, long-horizon
      mobile or desktop task completion, video-guided GUI tasks, and fraud or safety
      judgment, making results non-interchangeable.
    - 'Safety and robustness interpretations differ by domain: browser prompt-injection
      resistance can be strong while coding skill-injection remains vulnerable, so
      a single safety conclusion is not supported.'
    open_questions:
    - Can the method and benchmark findings in this packet be converted into a validated
      taxonomy and prioritized roadmap without the full 90-paper survey corpus?
    - Which evaluation setting—verifiable task success, grounding accuracy, uncertainty
      calibration, or domain-conditioned safety—best predicts real deployment reliability?
    - What are the failure boundaries for harness/context optimization and synthesized
      supervision when transferred to unseen applications, interfaces, or languages?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 可验证任务与环境合成
      解决的问题: 生成可验证或密集标注的桌面/视频任务，缓解监督稀缺和评测不可复现。
      尚未覆盖: 合成条件是否覆盖真实部署界面，以及生成任务跨基准是否兼容。
    - 路线: harness、上下文与策略优化
      解决的问题: 通过优化执行harness、记忆字段或rollout分配，在冻结骨干下提升长程GUI智能体。
      尚未覆盖: 迁移证据依赖选定基准；局限性字段空白或截断，失败边界未量化。
    - 路线: 定位与不确定性评测
      解决的问题: 在视觉语言模型和GUI定位数据集上测量接地能力与后验不确定性校准。
      尚未覆盖: 排名在同类模型内可迁移，但跨界面和模型类较弱；单步定位不覆盖多步智能体轨迹。
    - 路线: 安全与风险基准
      解决的问题: 评测网页或编码计算机使用智能体的欺诈判断、提示注入与技能注入安全。
      尚未覆盖: 净化或领域特定条件可能不泛化；既往RL优化攻击未复现，安全结论边界有限。
    共识:
    - GUI和计算使用智能体不能只靠模型规模扩展：任务数据、执行反馈、记忆、定位置信度与安全评测都被视为一等问题。
    - 受控基准和密集监督是主要改进证据来源，但桌面、移动、视频、网页与编码场景之间缺少共同迁移指标。
    - 证据一致表明评测条件会影响结论，因此论文通过净化线索、可验证奖励或留出环境来改变条件，而不是默认现有榜单排名可迁移。
    分歧:
    - 改进来源不同：有的冻结骨干并优化外围harness或上下文，有的合成任务用于在线RL或监督微调。
    - 评测目标不同：包括单步定位不确定性、长程移动/桌面任务完成、视频引导GUI任务以及欺诈或安全判断，因此结果不可直接互换。
    - 安全与鲁棒性解释按领域不同：浏览器提示注入可较强抵抗，但编码技能注入仍脆弱，不能得出单一安全结论。
    开放问题:
    - 在没有完整90篇综述语料的情况下，本包中的方法与基准发现能否转化为经过验证的分类体系与优先路线图？
    - 哪种评测设置——可验证任务成功、定位准确率、不确定性校准或领域条件安全——最能预测真实部署可靠性？
    - harness/上下文优化与合成监督在迁移到未见应用、界面或语言时，其失败边界是什么？
