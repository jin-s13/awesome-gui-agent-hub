  related_work_outline_zh:
  - 主流方向：证据集中在通过任务抽象和可验证评测刻画GUI代理能力，尤其是细粒度评分、动态观察效率、拖拽交互与不确定性校准。
  - 研究共性：多篇工作超越总体成功率，把代理行为分解为子目标、交互原语、观察成本或置信度，并用视觉与执行证据诊断失败。
  - 关键差异：它们覆盖桌面、动态视频、拖拽或单步grounding等不同交互面，并在技能、harness、弱监督、在线RL或不确定性层面进行适配。
  - 趋势演进：高排名证据集中在2026年前沿，趋势表现为从静态点击式评测向动态、多模态、可验证且重视可靠性的评测扩展。
  - 开放问题：细粒度指标能否预测部署可靠性，UQ排序能否跨模型类迁移，何种观察控制策略适应动态界面，拖拽与动态任务是否覆盖完整动作空间，适应提升能否跨套件泛化。
  literature_review:
    line_of_work_matrix:
    - line: Task and interaction abstraction for evaluation
      what_it_solves: Clarifies GUI agent capabilities beyond aggregate success by
        modeling dynamic content, drag primitives, fine-grained subgoals, and observation
        cost.
      what_remains_open: These abstractions are tied to specific platforms and suites;
        there is no evidence that the chosen task decompositions cover the full interaction
        space or transfer across deployment settings.
    - line: Evidence-driven skill and harness adaptation
      what_it_solves: Improves frozen GUI models by grounding diagnosis in before-and-after
        screenshots and repeated execution, then editing skills or harness code.
      what_remains_open: Transfer is shown on limited benchmarks, and the approach
        depends on source-level harness changes; failure modes outside the edited
        patterns remain unverified.
    - line: Weakly supervised and RL-based policy learning
      what_it_solves: Reduces annotation cost and sample inefficiency by using unannotated
        screenshots, verifiable task synthesis, and online RL.
      what_remains_open: Evidence mainly covers task success and training speed; reliability,
        safety, and behavior under distribution shift remain under-reported.
    - line: Uncertainty quantification and reliability framing
      what_it_solves: Benchmarks post-hoc confidence and spatial calibration for GUI
        grounding, connecting model outputs to risk-aware click regions.
      what_remains_open: Current evaluation is limited to single-step grounding, and
        UQ rankings transfer weakly across model classes and interfaces.
    consensus:
    - Verifiable or fine-grained evaluation signals are increasingly preferred over
      coarse task success because they reveal capability differences hidden by aggregate
      pass rates.
    - Visual and execution evidence, including screenshots and repeated runs, helps
      localize failures in UI understanding and workflow verification.
    - Current GUI agents still show notable reliability gaps in dynamic settings,
      observation control, drag interactions, and calibrated confidence.
    - Frozen-model adaptation and data-efficient training can improve performance,
      but generalization and safety evidence remain narrow.
    disagreements:
    - 'Evaluation target differs: real desktop multi-app completion, dynamic short-video
      interaction, drag-based actions, or single-step grounding calibration.'
    - 'Adaptation layer differs: modifying multimodal skill artifacts, optimizing
      the executable harness, fine-tuning or RL on synthesized tasks, or learning
      from unannotated screenshots.'
    - 'Supervision and objective differ: deterministic rule-based metrics, cost-accuracy
      optimization, verifiable RL reward, weak visual supervision, or post-hoc uncertainty
      calibration.'
    - 'Reliability framing differs: some work treats deployment risk as observation
      cost, others as spatial click uncertainty; no unified safety metric connects
      them.'
    open_questions:
    - Do fine-grained benchmark metrics predict real-world GUI agent reliability and
      recovery from failure?
    - Can uncertainty ranking transfer be made robust across model classes and observable
      interfaces without target-specific recalibration?
    - What observation-control policy should a GUI agent use to avoid over- or under-observation
      on dynamic interfaces?
    - Are drag, dynamic content, and multi-application abstractions sufficient to
      cover the full GUI action space and failure modes?
    - Do skill/harness and weak-supervision gains persist outside the specific benchmark
      environments used for validation?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 面向评测的任务与交互抽象
      解决的问题: 通过建模动态内容、拖拽原语、细粒度子目标与观察成本，揭示聚合成功率无法反映的代理能力差异。
      尚未覆盖: 抽象与平台和套件绑定，缺少证据表明所选任务分解覆盖完整交互空间或能在部署环境间迁移。
    - 路线: 基于证据的技能与harness自适应
      解决的问题: 利用操作前后截图和重复执行进行诊断，在冻结模型外部修改技能或harness以提升GUI表现。
      尚未覆盖: 迁移验证仅限少数基准，且依赖源码级harness变更；未被编辑模式覆盖的失败仍缺乏验证。
    - 路线: 弱监督与在线强化学习策略训练
      解决的问题: 利用未标注截图、可验证任务合成和在线RL降低标注成本与采样低效问题。
      尚未覆盖: 证据主要集中在任务成功与训练速度，分布偏移下的可靠性、安全性与失败模式尚不明确。
    - 路线: 不确定性量化与可靠性框架
      解决的问题: 评估GUI grounding的后验置信度与空间校准，将模型输出连接到风险感知的点击区域。
      尚未覆盖: 当前评测限于单步grounding，UQ排序跨模型类别和接口迁移较弱。
    共识:
    - 可验证或细粒度评测信号正取代粗粒度任务成功，因为它们揭示聚合通过率掩盖的能力差异。
    - 视觉与执行证据，包括截图和重复运行，有助于定位UI理解与工作流验证中的失败。
