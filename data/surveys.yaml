    consensus:
    - 'A shared focus on executable, interaction-grounded evaluation signals: task
      completion is judged from interface state, screenshots, repeated runs, or sanitized
      web evidence rather than only language output.'
    - 'Improvement is often decoupled from rebuilding the backbone model: edit the
      harness, synthesize verifiable tasks, manage context, or correct noisy rewards
      around a frozen or partially frozen model.'
    - 'Evaluation is becoming more adversarial and regime-specific: safety, uncertainty,
      fraud, and long-horizon settings expose capability boundaries that aggregate
      success rates can hide.'
    disagreements:
    - 'Optimization target differs: one line optimizes the executable harness around
      a frozen policy, another applies online reinforcement learning to the policy,
      and another treats autonomous evaluator feedback as reward.'
    - 'Evaluation setting differs: desktop/web, mobile, video-guided, browser security,
      and SMS-to-web fraud produce success-rate scales that are not directly comparable.'
    - 'Supervision and evaluation grain differ: single-step executable grounding,
      multi-step agent trajectories, and repeated-run evidence units lead to different
      conclusions about reliability.'
    - 'Safety and trust claims conflict by domain: browser prompt-injection resistance
      can coexist with coding-domain vulnerability, so a single safety score is not
      meaningful.'
    open_questions:
    - Can uncertainty and safety rankings transfer across interfaces or model classes
      without target-specific re-evaluation?
    - Which verifiable reward or harness-editing signals generalize across unseen
      interfaces, and which only overfit to task-specific success criteria?
    - Do omitted limitations and reproducibility details hide systematic failure modes
      in long-horizon, safety, and uncertainty research?
