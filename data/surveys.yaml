  related_work_outline:
  - 'Mainstream direction: The frontier is scaling GUI agents through training and
    evaluation: verifiable task synthesis with online RL, weak supervision from unannotated
    screenshots, proactive context/observation management, and benchmarks that add
    fine-grained scoring for real desktop, dynamic, drag-based, and video-guided interaction.'
  - 'Shared research pattern: Works pair a specialized dataset or environment with
    a model intervention such as curriculum pretraining, RL calibration, keyframe
    selection, context actions, or uncertainty calibration, and evaluate beyond overall
    pass rate.'
  - 'Key differences: They differ in supervision signal, interaction mode, evaluation
    target, and deployment setting—verifiable RL versus weak screenshot supervision
    versus SFT trajectories; click/type versus drag/GUI+CLI; task success versus cost-accuracy
    versus calibration transfer.'
  - 'Trend evolution: Within the 2024–2026 span and this packet''s 2026 evidence,
    the trend is moving from single-step static GUI grounding toward long-horizon,
    dynamic, multi-application, multi-interface agents and from pass/fail evaluation
    toward fine-grained capability and reliability metrics.'
  - 'Open questions: Whether gains come from model, task synthesis, or RL allocation;
    whether context/observation-control and uncertainty-calibration methods transfer
    across platforms; and whether reported benchmark improvements are supported by
    missing ablation and limitation evidence.'
  related_work_outline_zh:
  - 主流方向：当前前沿集中在扩大GUI智能体的训练与评估覆盖，从静态点击任务扩展到真实桌面、动态短视频、拖拽、视频引导等多界面/多动作场景，并用合成任务、在线强化学习、弱监督和主动上下文管理提升数据效率与长程稳定性。
  - 研究共性：工作通常将专门数据集或环境与模型干预配对，例如课程预训练、强化学习校准、关键帧选择、上下文动作或不确定性校准，并在总体通过率之外评估更细粒度能力。
  - 关键差异：差异体现在监督信号、交互模式、评测目标和部署场景上——可验证强化学习、弱监督截图训练与监督轨迹训练；点击/输入、拖拽与GUI+CLI；任务成功率、成本-准确性与校准迁移。
  - 趋势演进：在2024–2026年跨度且本证据集中于2026年的条件下，趋势从单步静态GUI定位走向长时程、动态、多应用、多界面的代理，并从通过率走向细粒度能力和可靠性指标。
  - 开放问题：方法收益来自模型、任务合成还是强化学习分配尚不明确；上下文/观察控制与不确定性校准能否跨平台迁移；现有基准提升是否被缺失的消融和局限性证据充分支持。
  literature_review:
    line_of_work_matrix:
    - line: Verifiable task synthesis and online RL for computer-use agents
      what_it_solves: Converts interactive docker rollouts into verifiable RL training
        tasks and allocates rollouts to frontier capabilities for sample-efficient
        improvement on OSWorld and ScienceBoard.
      what_remains_open: Whether the reported gains isolate the RL/training method
        rather than task-generation scale, multi-agent feedback, or environment priors;
        no ablation or limitation evidence is visible.
    - line: Weakly supervised and curriculum grounding from unannotated screenshots
      what_it_solves: Reduces annotation dependence by learning visual grounding from
        large-scale unannotated screenshots then calibrating with small high-quality
        data via RL.
      what_remains_open: Transfer of contextual grounding signals beyond evaluated
        tasks and the source of data-efficiency gains remain open; limitations are
        not reported.
    - line: Proactive context management for long-horizon mobile agents
      what_it_solves: Treats context management as policy actions and maintains compact
        structured context fields to preserve facts in long trajectories.
      what_remains_open: Generalization beyond MemGUI-Bench and MobileWorld, interaction
        with non-SFT training, and failure modes are not yet evidenced.
    - line: Benchmarks for real-world, dynamic, and non-click action spaces
      what_it_solves: Covers macOS desktop tasks, dynamic short-video interfaces,
        drag interactions, and GUI+CLI settings to reveal capability gaps beyond static
        click grounding.
      what_remains_open: Each benchmark is platform- or action-type-limited; fine-grained
        metrics do not yet show how to close observed observation-control or action-grounding
        gaps.
    - line: Post-hoc uncertainty quantification for GUI grounding
      what_it_solves: Evaluates UQ method ranking transfer and uses conformal click
        regions to support spatial safety in single-step grounding.
      what_remains_open: Only single-step executable grounding is covered; cross-model
        and cross-interface transfer is weak, and conformal coverage degrades under
        distribution shift.
    - line: Video-guided keyframe extraction for GUI agents
      what_it_solves: Selects task-relevant and scene-aware keyframes to bridge video
        observation and GUI interactive tasks with MLLM agents.
      what_remains_open: Evidence mainly supports VideoQA gains; video-guided GUI
        action prediction, longer-horizon effects, and limitations remain underspecified.
    consensus:
    - Scaling agent training/evaluation data is viewed as necessary for better GUI
      grounding and long-horizon action prediction.
    - Fine-grained evaluation beyond overall pass rate is needed to separate surface
      task completion from sub-goal, observation, and reliability differences.
    - Current GUI agents still lack robust observation control and context management
      in dynamic or long-horizon settings.
    - Non-click action spaces and multi-interface settings are underexplored relative
      to click/type-focused evaluation.
    disagreements:
    - 'Supervision and training recipes differ: verifiable online RL, weak supervision
      from unannotated screenshots, and SFT on human trajectories each trade data
      scale against annotation or reward specificity.'
    - Interaction coverage differs across click/type, drag, GUI+CLI, dynamic screen,
      and video-guided settings, leading to distinct action grounding and evaluation
      requirements.
    - 'Evaluation targets differ: pass/fail task success, cost-accuracy/observation
      efficiency, and UQ ranking/spatial calibration capture different reliability
      properties.'
    - 'Context/observation handling differs: explicit context-management actions,
      keyframe selection, and post-hoc spatial uncertainty calibration operate at
      different stages of the agent pipeline.'
    - Deployment scope differs across desktop, mobile, short-video, and video-guided
      tasks; some works target in-distribution benchmarks while others emphasize out-of-distribution
      generalization.
    open_questions:
    - Which components in scalable computer-use training—task synthesis, verifiability,
      frontier rollout allocation, or visual context segmentation—contribute most
      to OSWorld and ScienceBoard gains?
    - Can proactive context management and observation-control strategies transfer
      beyond mobile or short-video settings to general multi-application GUI agents?
    - Do fine-grained metrics such as multi-checkpoint scoring, cost-accuracy, and
      calibrated click regions align with end-to-end task reliability?
    - How can GUI grounding uncertainty remain calibrated under cross-model, cross-interface,
      and distribution-shift deployment conditions?
    - What evidence supports video-guided keyframe extraction for GUI action prediction
      beyond VideoQA improvement, and what limitations apply?
    - Does weak supervision from unannotated screenshots preserve grounding quality
      and safety across unseen interfaces and task families?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 可验证任务合成与在线强化学习
      解决的问题: 将交互式Docker轨迹转化为可验证强化学习任务，并把rollout分配到学习前沿，以提升OSWorld和ScienceBoard上的样本效率。
      尚未覆盖: 报告增益是否来自训练方法本身，而非任务生成规模、多代理反馈或环境先验，尚无消融和局限性证据。
    - 路线: 基于未标注截图的弱监督与课程定位
      解决的问题: 从大规模未标注截图学习视觉定位，再用少量高质量数据通过强化学习校准，减少对人工标注的依赖。
      尚未覆盖: 上下文定位信号能否迁移到评估任务之外，以及数据效率收益来源仍不清楚；局限性未报告。
    - 路线: 长时程移动智能体的主动上下文管理
      解决的问题: 把上下文管理作为策略动作，并保持紧凑的结构化上下文字段，以在长轨迹中保留关键事实。
      尚未覆盖: 在MemGUI-Bench和MobileWorld之外的泛化能力、与监督微调之外训练方式的交互以及失效模式尚无证据。
    - 路线: 面向真实、动态和非点击动作空间的基准测试
      解决的问题: 覆盖macOS桌面、动态短视频、拖拽交互和GUI+CLI设置，以揭示静态点击定位之外的智能体能力缺口。
      尚未覆盖: 各基准受平台或动作类型限制；细粒度指标尚未显示如何消除观察控制或动作定位缺口。
    - 路线: GUI定位的事后不确定性量化
      解决的问题: 评估不同UQ方法的排名可迁移性，并用共形点击区域支持单步定位的空间安全。
      尚未覆盖: 仅覆盖单步可执行定位；跨模型和跨界面迁移较弱，且共形覆盖在分布偏移下下降。
    - 路线: 面向视频引导GUI代理的关键帧提取
      解决的问题: 选择任务相关且场景感知的关键帧，以桥接视频观察与GUI交互任务。
      尚未覆盖: 证据主要支持VideoQA提升；视频引导GUI动作预测、长时程影响和局限性仍缺乏说明。
    共识:
    - 扩大训练或评估数据的规模被视为改善GUI定位和长时程动作预测的重要路径。
    - 需要超出总体通过率的细粒度评测，以区分表面任务完成与子目标、观察和可靠性差异。
    - 当前GUI智能体在动态或长时程场景中仍缺乏稳健的观察控制和上下文管理能力。
    - 相对于点击/输入式评估，非点击动作空间和多界面设置仍然探索不足。
    分歧:
    - 监督信号与训练配方不同：可验证在线强化学习、未标注截图弱监督和人类轨迹监督微调在数据规模、标注成本与奖励特异性之间权衡不同。
    - 交互覆盖不同：点击/输入、拖拽、GUI+CLI、动态屏幕和视频引导场景导致不同的动作定位与评估要求。
    - 评测目标不同：通过率任务成功、成本-准确性/观察效率、UQ排名与空间校准分别捕捉不同的可靠性属性。
    - 上下文与观察处理方式不同：显式上下文管理动作、关键帧选择与事后空间不确定性校准作用于智能体管线的不同阶段。
    - 部署范围不同：桌面、移动、短视频和视频引导任务之间存在差异；部分工作关注分布内基准，部分工作强调分布外泛化。
    开放问题:
    - 可扩展计算机使用训练中，任务合成、可验证性、前沿rollout分配和视觉上下文分割各自对OSWorld与ScienceBoard收益贡献多大？
    - 主动上下文管理和观察控制策略能否从移动或短视频设置迁移到更一般的多应用GUI智能体？
    - 多检查点评分、成本-准确性和校准点击区域等细粒度指标是否与端到端任务可靠性一致？
    - GUI定位不确定性在跨模型、跨接口和分布偏移部署条件下如何保持校准？
    - 视频引导关键帧提取超出VideoQA提升之外的GUI动作预测证据及局限性是什么？
    - 未标注截图弱监督能否在未见界面和任务族中保持定位质量与安全性？
