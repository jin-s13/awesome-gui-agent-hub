  - 'Open questions: Whether benchmark gains transfer across interfaces and horizons,
    how to correct noisy autonomous rewards, how to scale single-step uncertainty
    to multi-step trajectories, how domain-conditioned safety generalizes, and how
    benchmark shortcuts affect real-world validity.'
  related_work_outline_zh:
  - 主流方向：证据包虽以survey为主题，但可见主流并非综述论文，而是GUI/计算机使用智能体的实证基准与方法构建，尤其集中在任务合成、训练信号、安全与不确定性。
  - 研究共性：多篇工作汇聚在视觉语言或多模态智能体框架：感知界面帧或视频、执行动作并以成功或排序为证据；许多工作还使用可验证任务、自动评估器、人类演示或上下文动作作为可扩展信号。
  - 关键差异：任务时域有单步基础与长时域移动/浏览器/视频工作流之分；监督模式有在线强化、噪声评估奖励、监督微调、关键帧或演示变换之分；部署面覆盖网页、移动、桌面、编码与安全。
  - 趋势演进：在2024-2026前沿窗口内，研究从干净成功基准转向鲁棒性、不确定性、安全迁移和可扩展训练；由于时间跨度过窄，难以确立长期演进。
