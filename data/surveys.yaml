  literature_review:
    line_of_work_matrix:
    - line: Taxonomy and roadmap synthesis
      what_it_solves: Organizes scattered evidence from GUI-agent methods, benchmarks,
        safety tests, and evaluation protocols into directions, milestones, and research
        gaps.
      what_remains_open: The current packet lacks actual survey/taxonomy papers, so
        synthesis is based on selective 2026 primary evidence rather than a systematic
        literature search protocol.
    - line: Comparative evaluation synthesis
      what_it_solves: Reveals how benchmark choice, task horizon, observation modality,
        and evaluation protocol shape conclusions about agent competence.
      what_remains_open: 'Compatibility across settings is unresolved: single-step
        grounding, long-horizon mobile/web tasks, masked security settings, and open/closed-source
        interfaces are not directly comparable.'
    - line: Open problem and gap mapping
      what_it_solves: Converts current evidence into concrete next questions such
        as noisy evaluator correction, safety transfer, uncertainty transfer, and
        long-horizon context management.
      what_remains_open: Which gaps matter most for progress remains unprioritized;
        evidence is thin on multi-step trajectories, optimized attacks, and deployed
        real-world distributions.
    consensus:
    - Recent work uses vision-language or multimodal models as GUI/computer-use agents
      and judges progress by benchmark success rates or ranking metrics.
    - 'There is a common move toward scalable signals: verifiable task generation,
      autonomous evaluators, trajectory demonstrations, or inferred context actions
      reduce reliance on hand-built examples.'
    - Evaluation is becoming more robustness-aware, covering uncertainty, safety attacks,
      and out-of-distribution generalization rather than only clean task success.
    - Reproducibility evidence is uneven; some papers expose code or datasets while
      others only describe artifacts, so methodological quality and reproducibility
      signals should be separated from citation impact.
    disagreements:
    - 'Task horizon and observation differ: some evaluate single-step grounding, while
      others evaluate long-horizon trajectories across mobile, desktop, browser, or
      video-guided workflows, leading to different success definitions.'
    - 'Training signal differs: approaches split among online reinforcement with verifiable
      outcomes, noisy evaluator reward modeling, supervised fine-tuning with annotated
      context actions, and non-parametric keyframe or demonstration transforms.'
    - 'Security scope differs: safety conclusions vary because one focuses on hand-crafted
      prompts in browser versus coding skill-injection, while another suppresses URL/reputation
      shortcuts; optimized attack strings are not directly tested across all cases.'
    - 'Uncertainty transfer differs: ranking stability is higher within a model and
      dataset but weaker across model tiers and interfaces; closed-source internal
      states force different post-hoc methods than open-weight models.'
    - 'Autonomy and generalization differ: success on one benchmark does not consistently
      establish cross-benchmark or cross-domain generalization, especially for fraud
      and safety tasks.'
    open_questions:
    - Do current benchmark improvements transfer across interfaces, task horizons,
      and observation modalities when standardized protocols are absent?
    - How can noisy autonomous evaluation be made reliable enough to serve as reward
      without hiding reward-model errors?
    - Can single-step uncertainty quantification and grounding be extended to multi-step
      agent trajectories under distribution shift?
    - How should safety red-teaming be reported so hand-crafted, optimized, open-weight,
      and closed-source agent comparisons are reproducible and comparable?
    - What real-world cues are being stripped or kept in benchmark design, and how
      do those choices bound the external validity of GUI-agent results?
