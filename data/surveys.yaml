    - 路线: 多维任务抽象与评估框架
      解决的问题: 定义新任务类型（多应用、动态界面、拖拽）和评估维度（细粒度子目标评分、信息效率、不确定性），以捕捉超越成功率的代理能力。
      尚未覆盖: 这些基准大多是静态的，不评估在线适应；跨基准泛化以及单步接地失败与多步任务成功之间的关系尚未建立。
    - 路线: 知识表示与技能学习
      解决的问题: 通过构建多模态技能库（如VISUALSKILL）或从海量无标注截图学习视觉定位（如GUICrafter），减少对昂贵人工标注的依赖，使代理能识别UI元素并验证工作流状态。
      尚未覆盖: 技能库构建仍需人工编写文档或探索；弱监督仅在一组有限应用上验证，尚未见其迁移到未见界面范式的实验。
    - 路线: 训练范式与长时域效率
      解决的问题: 通过可验证任务合成与在线RL（如ScaleCUA）或主动上下文管理（如MemGUI-Agent）提升代理在复杂任务上的表现，解决样本效率和长轨迹连贯性问题。
      尚未覆盖: 训练管道紧耦合特定环境；上下文管理策略仅在一个分布外基准上评估，与在线RL或多应用工作流的交互未被研究。
    - 路线: GUI代理的可靠性量化
      解决的问题: 为GUI接地提供后验不确定性量化，通过共形预测实现选择性信任和空间安全边际（如Argus基准）。
      尚未覆盖: 仅限于单步接地；UQ排名不能跨模型家族或界面模态迁移，且尚未集成到多步代理决策循环中。
    共识:
    - 当前GUI代理远未达到人类水平，需要超越原子点击正确性的评估。
    - 视觉语言模型是基础架构，但其原始零样本输出若没有任务特定适配、技能库或训练则不足。
    - 细粒度指标（子目标完成度、成本-准确性、不确定性）揭示了聚合成功率所掩盖的能力差异。
    - 真实界面的复杂性——动态内容、CLI交互、拖拽——要求形式化的基准和新的交互原语。
    分歧:
    - 评估设置：部分工作关注单步接地或静态截图，而其他工作坚持在真实动态环境中评估多步轨迹。
    - 训练信号：方法从零样本提示到弱监督再到在线RL，暗示了对标注成本和可用性的不同假设。
    - 技能表示：纯文本技能描述与保留视觉图形的多模态工件形成对比，证据表明视觉信息改善UI识别但增加复杂性。
    - 可靠性处理：不确定性量化仅在一个基准中被专门关注，其他工作大多假设代理输出确定性，不报告置信度。
    开放问题:
