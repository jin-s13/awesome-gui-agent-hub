      解决的问题: 评估GUI代理在真实应用场景（桌面、动态视频、拖拽、欺诈检测）中的细粒度能力，揭示观察控制差、良性召回低、多应用任务完成弱等不足。
      尚未覆盖: 基准间缺乏统一评估协议；增强方法仅在孤立基准上测试，跨基准泛化性未知；部分基准（如欺诈检测）移除了现实中的信誉信号，真实部署表现未经验证。
    - 路线: 基于知识与记忆的代理能力增强
      解决的问题: 通过注入预定义多模态技能、将成功运行编译为可重放状态机、或增加历史感知与视觉基础的批评模型，提升代理成功率、执行效率或规划稳健性。
      尚未覆盖: 这些增强与特定环境或任务深度绑定，缺乏跨领域迁移证据；技能库的构建与更新成本、编译程序的泛化能力、批评模型的训练数据偏差等依然未被探索。
