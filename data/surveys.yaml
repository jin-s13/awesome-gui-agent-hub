    the uncovered gap.'
  - 'Key differences: Papers differ in evaluation target (task completion vs. safety
    vs. uncertainty quantification), interaction modality (video-guided, browser,
    mobile, coding), supervision signal (verifiable rewards, human demonstrations,
    self-evaluation), and deployment setting (open-weight vs. closed-source models).'
  - 'Trend evolution: All included papers fall within 2025–2026, indicating a rapid
    frontier expansion with concurrent emergence of benchmarks, training recipes,
    and safety audits; the trend is toward domain-conditioned, verifiable, and uncertainty-aware
    agent evaluation rather than monolithic task-success metrics.'
  - 'Open questions: How to transfer safety and uncertainty findings across model
    classes and interfaces; whether synthesized benchmarks generalize to real-world
    deployment; how to prioritize among the many identified gaps (long-horizon context,
    reward noise, domain-specific safety) for the next leap in agent capability.'
  related_work_outline_zh:
  - 主流方向：基于大型视觉语言模型构建和评估 GUI 智能体，侧重于多样化评估协议（安全性、不确定性、长时域、多领域）以及通过强化学习和上下文管理实现可扩展训练。
  - 研究共性：多数工作引入一个新的基准或任务设计，用于隔离特定的 GUI 智能体能力，然后评估多个最先进的智能体以揭示系统性失败，并通常提出一种方法或指标来应对发现的缺口。
  - 关键差异：论文在评估目标（任务完成 vs. 安全性 vs. 不确定性量化）、交互模态（视频引导、浏览器、移动端、编程）、监督信号（可验证奖励、人类演示、自评估）和部署设置（开源权重
    vs. 闭源模型）上存在差异。
  - 趋势演进：所有纳入论文集中在 2025–2026 年，表明前沿快速扩展，基准、训练方法和安全审计同时涌现；趋势是转向领域条件化、可验证和不确定性敏感的智能体评估，而非单一的任务成功率指标。
  - 开放问题：安全性和不确定性发现如何跨模型类别和接口迁移；合成基准是否泛化到真实部署；在众多已识别缺口（长时域上下文、奖励噪声、领域特定安全）中如何优先排序以推动智能体能力的下一次飞跃。
  literature_review:
    line_of_work_matrix:
    - line: Comparative evaluation synthesis
      what_it_solves: Summarizes how different evaluation choices (e.g., attack templates,
        reward design, UQ estimators) shape conclusions across GUI agent papers, exposing
        systematic weaknesses such as domain-conditioned safety or selective UQ transfer.
      what_remains_open: Compared results are often incompatible due to different
        interfaces, model access, and task granularity; no unified framework exists
        to harmonize evaluation dimensions (e.g., safety, completion, uncertainty)
        into a single reliability profile.
    - line: Taxonomy and roadmap synthesis
      what_it_solves: Implicitly partitions the GUI agent landscape into capability
        axes (video grounding, long-horizon planning, safety, fraud detection) through
        the introduction of targeted benchmarks, but does not yet offer an explicit,
        evidence-backed taxonomy of agent sub-problems.
      what_remains_open: Whether the emerging capability clusters are comprehensive
        and stable, and whether a systematic synthesis can prioritize which capability
        gaps block downstream progress, remains unaddressed.
    - line: Open problem and gap mapping
      what_it_solves: 'Each benchmark highlights concrete failure modes: benign recall
        collapse in fraud detection, domain-conditioned safety brittleness, noise-induced
        reward degradation, and weak cross-model UQ transfer, effectively converting
        broad literature into actionable research questions.'
      what_remains_open: Prioritization of these gaps is absent; it is unclear whether
        improving one aspect (e.g., noise correction in RL) yields more overall progress
        than solving another (e.g., long-horizon context management) without a cost-benefit
        model or a shared meta-evaluation.
    consensus:
    - GUI agents still exhibit systematic failures under distribution shift, making
      them unsafe for high-stakes deployment without domain-specific hardening.
    - Autonomous or verifiable evaluation is essential for scaling agent training
      and benchmarking, but current evaluators are noisy and their feedback must be
      calibrated.
    - Uncertainty quantification is a promising safety layer, yet its effectiveness
      is highly sensitive to model architecture and interface, and does not transfer
      robustly across model tiers.
    - Long-horizon and video-guided tasks require better context management beyond
      passive history accumulation, as demonstrated by the gain from proactive context
      actions.
    disagreements:
    - 'The safety mechanism is evaluated on different threat models: hand-crafted
      prompt injection vs. skill-injection, leading to opposite conclusions about
      agent robustness.'
    - 'Reward granularity differs: some works use terminal binary task-success feedback,
      while others rely on per-step or verifiable execution results, affecting the
      type of exploration and credit assignment possible.'
    - 'Interaction modality: browser-based agents, mobile GUI agents, and video-guided
      agents are treated as separate settings, with no cross-modality benchmark that
      tests whether advances in one transfer to another.'
    - 'Evaluation granularity: some benchmarks focus on single-step grounding accuracy,
      while others measure multi-step task completion, making direct comparison of
      agent capabilities ambiguous.'
    open_questions:
    - Can a unified evaluation protocol be designed that simultaneously measures task
      completion, safety, and uncertainty, and is applicable across open-weight and
      closed-source agents?
    - How do the identified failure modes (e.g., benign recall collapse, domain-conditioned
      safety) evolve as underlying models scale up or are fine-tuned with RL?
    - What is the minimal set of benchmark tasks that guarantees generalization to
      real-world GUI agent deployment, given the observed fragility of current evaluations?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 对比评测综合
      解决的问题: 总结不同评测选择（如攻击模板、奖励设计、UQ 估计器）如何影响跨 GUI 智能体论文的结论，揭示系统性弱点，例如领域条件化安全性或选择性
        UQ 迁移。
      尚未覆盖: 由于接口、模型访问和任务粒度不同，比较结果常常不兼容；尚无统一框架将安全性、完成度和不确定性等评测维度整合为单一的可靠性画像。
    - 路线: 分类体系与路线图综合
      解决的问题: 通过引入针对性基准，隐式地将 GUI 智能体领域划分为多个能力轴（视频定位、长时域规划、安全性、欺诈检测），但尚未提供基于证据的明确智能体子问题分类。
      尚未覆盖: 新出现的能力聚类是否全面且稳定，以及系统综合能否优先排序哪些能力缺口阻碍了下游进展，仍然未解决。
    - 路线: 开放问题与缺口映射
      解决的问题: 每个基准都凸显了具体失败模式：欺诈检测中的良性召回崩溃、领域条件化安全脆弱性、噪声诱导的奖励退化、跨模型 UQ 迁移弱，有效将广泛文献转化为可操作的研究问题。
      尚未覆盖: 缺口的优先排序缺失；缺乏成本-收益模型或共享元评测，无法判断改进某一方面（如 RL 中的噪声校正）是否比解决另一问题（如长时域上下文管理）带来更多整体进展。
    共识:
    - GUI 智能体在分布偏移下仍表现出系统性失败，没有领域特定的加固，它们对于高风险部署不安全。
    - 自主或可验证评估对于扩展智能体训练和基准测试至关重要，但当前评估器存在噪声，其反馈必须经过校准。
    - 不确定性量化是一种有前景的安全层，但其有效性高度依赖于模型架构和接口，在模型层级之间不能稳健迁移。
    - 长时域和视频引导任务需要超越被动历史累积的更好上下文管理，主动上下文动作带来的收益证明了这一点。
    分歧:
    - 安全机制在不同威胁模型上被评估：手工提示注入与技能注入，导致对智能体鲁棒性得出相反的结论。
    - 奖励粒度不同：一些工作使用终端二元任务成功反馈，而另一些依赖每步或可验证的执行结果，影响探索和信用分配的类型。
    - 交互模态：基于浏览器的智能体、移动 GUI 智能体和视频引导智能体被作为独立设置处理，尚无跨模态基准测试以验证一个模态的进展是否能迁移到另一个。
    - 评估粒度：一些基准专注于单步基础精度，而另一些衡量多步任务完成情况，使得对智能体能力的直接比较模糊。
    开放问题:
    - 能否设计一个统一的评估协议，同时衡量任务完成、安全性和不确定性，并适用于开源权重和闭源智能体？
    - 已识别的失败模式（如良性召回崩溃、领域条件化安全）会如何随着底层模型规模扩大或通过 RL 微调而演变？
    - 鉴于当前评估的脆弱性，保证泛化到真实世界 GUI 智能体部署所需的最小基准任务集是什么？
