  literature_review:
    line_of_work_matrix:
    - line: Domain-adapted GUI agent benchmarks
      what_it_solves: Evaluating agent performance on real-world tasks with domain-specific
        interfaces, action spaces, and constraints, such as macOS desktop, short-video
        platforms, drag-based UI, video-guided tasks, and SMS-to-webpage fraud detection.
      what_remains_open: Coverage of dynamic, long-tail, and safety-critical scenarios;
        transferability of evaluation insights across platforms; mitigation of evaluation
        shortcuts (e.g., URL reputation) that may inflate real-world performance.
    - line: Agent execution optimization and skill grounding
      what_it_solves: Improving agent reliability, speed, and planning through hierarchical
        multimodal skill libraries, state-machine compilation of successful runs,
        and history-aware visually grounded critics that intercept errors before execution.
      what_remains_open: Generalization of skill libraries and critic models to unseen
        applications and base models; trade-off between execution speed and adaptability;
        robustness of screen-state matching and fallback mechanisms in dynamic environments.
    - line: Dynamic and multimodal interaction handling
      what_it_solves: Enabling GUI agents to handle video inputs, live-screen content
        changes between actions, and fine-grained interactions like drag-and-drop,
        which require beyond-click reasoning and observation control.
      what_remains_open: Agents lack observation control (over- and under-observation);
        keyframe extraction robustness for diverse video types; coverage of all dynamic
        interface types beyond short-video platforms; integration of action grounding
        with temporal context.
    consensus:
    - Current multimodal GUI agents still fall short of human-level performance on
      real-world tasks, with failures in long-horizon planning, execution accuracy,
      and efficiency.
    - 'Benchmark-driven evaluation reveals common bottlenecks: agents struggle with
      observation control, history utilization, and interaction fidelity beyond simple
      clicks.'
    - Modular enhancements (skill libraries, execution replay, critic models) can
      significantly boost agent performance without modifying the underlying model
      architecture.
    - Real-world application requires handling diverse modalities (text, image, video)
      and dynamic interfaces, but existing benchmarks each cover only a slice of the
      interaction space.
    disagreements:
    - 'Evaluation metrics differ: Pass@1 task success vs. cost-accuracy trade-offs
      vs. fine-grained sub-goal completion scores, leading to different conclusions
      about agent capability.'
