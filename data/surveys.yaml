  related_work_outline:
  - 'Mainstream direction: Building realistic multi-step GUI agent benchmarks across
    desktop, web, and mobile environments, with finer-grained metrics beyond pass/fail
    and automated task synthesis to reduce annotation cost.'
  - 'Shared research pattern: Most works design a new task set or evaluation protocol,
    test frontier VLMs and agent frameworks, and reveal a specific failure mode (e.g.,
    over-observation, lack of drag support, uncertainty miscalibration) that current
    aggregate scores hide.'
  - 'Key differences: Task environments range from static desktops (MacAgentBench)
    to dynamic video-like interfaces (LivingScreen, VG-GUIBench); interaction modalities
    span click, drag, and video-guided actions; evaluation metrics diverge into pass
    rates, cost-accuracy, sub-goal scores, and uncertainty quality.'
  - 'Trend evolution: Within the 2024–2026 frontier, benchmarks are moving from single-platform,
    click-only tasks toward multi-platform, multi-modal, and live-screen scenarios,
    and from simple success metrics toward diagnostic, cost-aware, and uncertainty-aware
    evaluation.'
  - 'Open questions: Whether task distributions cover the real-world diversity of
    applications and user workflows; how to align proxy metrics (e.g., UQ scores,
    cost-accuracy) with downstream user decisions; whether synthetic task generation
    can maintain benchmark quality without distributional leakage.'
  related_work_outline_zh:
  - 主流方向：构建横跨桌面、Web、移动端的真实多步 GUI 智能体基准，并引入细粒度多维指标与自动化任务合成，以降低标注成本并暴露隐藏能力缺陷。
  - 研究共性：多数工作设计新任务集或评估协议，评测前沿 VLM 与智能体框架，揭示当前聚合指标掩盖的失败模式，如过度观察、缺少拖拽支持、不确定性校准不良等。
  - 关键差异：任务环境从静态桌面（MacAgentBench）到类短视频的动态界面（LivingScreen、VG-GUIBench）；交互模式覆盖点击、拖拽与视频引导；评估指标分化出通过率、成本-准确率、子目标完成度与不确定性质量。
  - 趋势演进：在 2024–2026 的前沿窗口内，基准从单平台、仅点击任务向多平台、多模态和动态屏幕演进，从单一成功率指标转向诊断性、成本感知和不确定性感知的评估。
  - 开放问题：任务分布是否覆盖真实应用与用户工作流的多样性；代理指标（如 UQ 分数、成本-准确率）如何与下游用户决策对齐；合成任务生成能否保持基准质量而不引入分布泄漏。
  literature_review:
    line_of_work_matrix:
    - line: Realistic multi-app desktop/mobile benchmarks
      what_it_solves: Provides shared tasks on real OS environments with multi-step,
        cross-app workflows and fine-grained scoring, making agent capabilities comparable
        beyond simple pass rates.
      what_remains_open: Coverage is limited to specific platforms (e.g., macOS, short-video
        platforms) and interaction types; dynamic content changes and observation
        control are not systematically tested; task diversity may not capture the
        full tail of real user workflows.
    - line: Interaction-modality-specific benchmarks
      what_it_solves: Extends evaluation beyond click-pointing to drag-based interactions
        and video-guided tasks, addressing blind spots in existing agent benchmarks.
      what_remains_open: Each modality is evaluated in isolation; no unified framework
        integrates drag, click, and video understanding into a single coherent agent
        scenario; drag tasks have not yet been combined with multi-step agent trajectories.
    - line: Verifiable task synthesis and data-efficient agent training
      what_it_solves: Reduces the need for expensive human annotations by generating
        verifiable tasks via RL or mining unannotated screenshots, and uses the resulting
        benchmarks to train and assess agents.
      what_remains_open: Synthetic task quality and diversity may not match real user
        intent; risk of overfitting to the synthesized distribution; the generated
        benchmarks have not been validated against human-annotated gold standards
        for difficulty and coverage.
    - line: Diagnostic and uncertainty-aware metrics
      what_it_solves: Moves beyond aggregate success rates to measure sub-goal completion,
        cost-accuracy trade-offs, and uncertainty calibration, offering richer diagnostics
        for GUI grounding and agent decisions.
      what_remains_open: Uncertainty metrics transfer poorly across model families
        and interfaces; conformal coverage degrades under distribution shift; no established
        link between these proxy metrics and actual deployment safety or user satisfaction.
    consensus:
    - Current GUI agents are far from human-level performance on real-world, multi-step
      tasks, and aggregate success metrics hide important failure modes such as over-observation,
      under-observation, and incorrect element identification.
    - Fine-grained evaluation (sub-goal scores, cost-accuracy, uncertainty) provides
      more actionable insights than single pass-rate numbers and helps diagnose specific
      weaknesses like observation control, drag grounding, and UI element localization.
    - Realistic environments that include authentic applications, dynamic content,
      and diverse interaction modes are necessary to stress-test agents, but no single
      existing benchmark covers all these dimensions.
    disagreements:
    - 'Task environment design: static desktop screenshots (MacAgentBench) versus
      dynamic live-screen interfaces with content changing between actions (LivingScreen),
      leading to different assumptions about agent observation control and evaluation
      timing.'
    - 'Evaluation metric focus: some works emphasize end-to-end task success (MacAgentBench,
      DragOn), others prioritize cost-accuracy or information efficiency (LivingScreen),
      and still others focus on uncertainty calibration and spatial safety (Argus),
      with no consensus on which metric best predicts real-world utility.'
    - 'Data and annotation philosophy: the field splits between using human-annotated
      task sets to guarantee quality and using automated synthesis or weak supervision
      (GUICrafter, SCALECUA) to scale, with disagreement on whether synthetic tasks
      can fully replace human-curated benchmarks.'
    open_questions:
    - How can we construct a cross-platform, cross-modality benchmark that covers
      desktop, web, and mobile, and integrates click, drag, and video-based interactions
      without losing evaluation depth?
    - Under what conditions do fine-grained proxy metrics (sub-goal scores, uncertainty,
      cost-accuracy) align with downstream user satisfaction and deployment safety,
      and how can we validate this alignment?
    - What is the quality boundary of synthetic task generation for benchmark creation,
      and how can we prevent distributional leakage that inflates agent performance
      on generated benchmarks while failing on real human tasks?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 真实多应用桌面/移动平台基准
      解决的问题: 提供真实 OS 环境下多步、跨应用工作流的共享任务与细粒度评分，使智能体能力在简单通过率之外具备可比性。
      尚未覆盖: 覆盖范围局限在特定平台（如 macOS、短视频平台）和交互类型；动态内容变化与观察控制未被系统测试；任务多样性可能未捕捉真实用户工作流的完整长尾。
    - 路线: 特定交互模态基准
      解决的问题: 将评估从点击拓展到拖拽和视频引导任务，弥补现有智能体基准的盲区。
      尚未覆盖: 各模态独立评估，缺少统一框架将拖拽、点击和视频理解整合为单一连贯智能体场景；拖拽任务尚未与多步智能体轨迹结合。
    - 路线: 可验证任务合成与数据高效智能体训练
      解决的问题: 通过 RL 生成可验证任务或挖掘未标注截图，减少对昂贵人工标注的依赖，并利用所得基准训练和评估智能体。
      尚未覆盖: 合成任务的质量和多样性可能无法匹配真实用户意图；存在对合成分布过拟合的风险；生成的基准尚未在难度和覆盖度上与人工标注金标准进行验证。
    - 路线: 诊断性和不确定性感知指标
      解决的问题: 超越总体成功率，衡量子目标完成度、成本-准确率权衡和不确定性校准，为 GUI 基础定位和智能体决策提供更丰富的诊断。
      尚未覆盖: 不确定性指标跨模型族和接口迁移性差；共形覆盖在分布偏移下下降；这些代理指标与实际部署安全或用户满意度之间尚未建立联系。
    共识:
    - 当前 GUI 智能体在真实世界多步任务上与人类表现相距甚远，聚合成功率指标掩盖了过度观察、观察不足和元素识别错误等重要失败模式。
    - 细粒度评估（子目标得分、成本-准确率、不确定性）比单一通过率更能提供可操作的洞察，帮助诊断观察控制、拖拽定位和 UI 元素识别等具体弱点。
    - 包含真实应用、动态内容和多种交互模式的真实环境对于压力测试智能体必不可少，但现有任一基准都未能覆盖所有这些维度。
    分歧:
    - 任务环境设计：静态桌面截图（如 MacAgentBench）与内容在操作间变化的动态动态屏幕界面（如 LivingScreen）导致对智能体观察控制和评估时机的不同假设。
    - 评估指标侧重：部分工作强调端到端任务成功率（MacAgentBench、DragOn），另一些优先考虑成本-准确率或信息效率（LivingScreen），还有工作关注不确定性校准和空间安全（Argus），对哪种指标最能预测真实世界效用尚无共识。
    - 数据与标注哲学：领域分裂为使用人工标注任务集以保证质量，与使用自动化合成或弱监督（GUICrafter、SCALECUA）以实现规模化，对于合成任务是否能完全替代人工精选基准存在分歧。
    开放问题:
    - 如何构建一个覆盖桌面、Web 和移动端，并整合点击、拖拽和视频交互的跨平台、跨模态基准，同时不牺牲评估深度？
    - 在何种条件下，细粒度代理指标（子目标得分、不确定性、成本-准确率）能与下游用户满意度和部署安全对齐，我们如何验证这种对齐？
    - 用于基准创建的合成任务生成的质量边界在哪里，如何防止分布泄漏导致智能体在生成基准上表现膨胀，而在真实人类任务上失败？
