  - 'Shared research pattern: Reliance on large multimodal models as base policies;
    use of step-wise or terminal success signals for training or evaluation; focus
    on real-world interactive tasks across web, mobile, and desktop interfaces.'
  - 'Key differences: Single-step grounding benchmarks versus multi-step trajectory
    completion; hand-crafted safety attacks versus domain-conditioned hardening; supervised
    fine-tuning with human demonstrations versus autonomous RL with noisy evaluators.'
  - 'Trend evolution: From static benchmark suites to dynamic, multi-step interactive
    tasks; broadening from computer-use tasks to video-guided GUI and mobile domains;
    increasing attention to safety, uncertainty, and reproducibility in agent evaluation.'
  - 'Open questions: How to design a unified evaluation protocol that spans single-step
    grounding, multi-step trajectories, and safety under distribution shift; how to
    prioritize among the many identified gaps when training data, evaluation, and
    safety interact.'
  related_work_outline_zh:
  - 主流方向：通过可验证任务合成的在线强化学习扩展GUI智能体，并构建覆盖基础、安全、不确定性、长时域任务的综合基准。
  - 研究共性：依赖大型多模态模型作为基础策略；使用步骤级或终端成功信号进行训练或评估；聚焦于跨网页、移动和桌面界面的真实交互任务。
  - 关键差异：单步基础基准与多步轨迹完成；手工攻击与领域条件安全加固；基于人类演示的监督微调与基于噪声评估器的自主强化学习。
  - 趋势演进：从静态基准套件转向动态多步交互任务；从计算机使用任务扩展到视频引导GUI和移动领域；在智能体评估中越来越关注安全、不确定性和可重复性。
  - 开放问题：如何设计一个统一的评估协议，覆盖单步基础、多步轨迹以及分布偏移下的安全；在训练数据、评估和安全相互影响时，如何对众多已识别的缺口进行优先级排序。
  literature_review:
    line_of_work_matrix:
    - line: Taxonomy and roadmap synthesis
      what_it_solves: Maps the fragmented GUI agent research into coherent directions—such
        as grounding, multi-step planning, safety, training paradigm—and identifies
        milestones and research gaps.
      what_remains_open: Whether the taxonomy is backed by systematic evidence rather
        than selective examples; the papers in this packet span diverse tasks and
        modalities, but no work provides a unified, evidence-based taxonomy.
    - line: Comparative evaluation synthesis
      what_it_solves: Summarizes how different evaluation benchmarks (OSWorld, ScienceBoard,
        MemGUI-Bench, VG-GUIBench, FraudSMSWalker, etc.) and metrics shape conclusions
        about agent capabilities and limitations.
      what_remains_open: 'Cross-benchmark compatibility: the papers evaluate agents
        under different task definitions, interface modalities, and scoring rules,
        making it unclear whether reported improvements transfer across settings.'
    - line: Open problem and gap mapping
      what_it_solves: Identifies under-explored areas such as long-horizon context
        management, uncertainty quantification for safety, domain-conditioned robustness,
        and training from human screen recordings.
      what_remains_open: Prioritization of which gaps matter most for progress; each
        paper highlights its own limitation, but there is no global ranking of open
        problems grounded in shared evaluation criteria.
    consensus:
    - Large multimodal models are the de facto backbone for GUI agents, and their
      performance improves with task-specific training (RL or SFT) rather than zero-shot
      prompting.
    - Benchmarking is essential for measuring progress, and multiple new benchmarks
      have been introduced to cover grounding, long-horizon tasks, safety, and uncertainty.
    - Safety and reliability are emerging as critical concerns, with papers addressing
      both attack resistance and uncertainty quantification.
    - Autonomous or verifiable reward signals are gaining traction as a scalable alternative
      to manual labeling for training computer-use agents.
    disagreements:
    - 'Evaluation scope: some works focus on single-step executable grounding (e.g.,
      Argus), while others evaluate over multi-step task trajectories (e.g., MemGUI-Agent,
      ScaleCUA), leading to different conclusions about agent robustness.'
    - 'Safety approach: one paper shows frontier agents resist hand-crafted browser
      attacks but fail on coding tasks, revealing domain-conditioned safety; others
      do not test cross-domain safety, so the generalizability of safety mechanisms
      remains contested.'
    - 'Training paradigm: ScaleCUA uses online RL with synthetic verifiable tasks,
      MemGUI-Agent uses SFT with human-annotated context actions, and another paper
      uses RL with noisy autonomous evaluators—these differ in data source, reward
      quality, and sample efficiency.'
    open_questions:
    - How can a unified evaluation suite be designed to capture both single-step grounding
      accuracy and multi-step task completion, while also probing safety under distribution
      shift?
    - To what extent can safety hardening observed in browser tasks transfer to other
      domains such as coding or mobile, given the evidence of domain-conditioned failure?
    - What is the optimal trade-off between using autonomous noisy evaluators for
      RL training and relying on human demonstrations, and how can the reliability
      of evaluator signals be improved across diverse GUI interfaces?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 分类体系与路线图综合
      解决的问题: 将碎片化的GUI智能体研究整理为一致的方向（如基础、多步规划、安全、训练范式），并识别里程碑和研究缺口。
      尚未覆盖: 该分类是否由系统证据支撑，而非选择性举例；本数据包中的论文跨越不同任务和模态，但没有任何工作提供统一的、基于证据的分类体系。
    - 路线: 对比评测综合
      解决的问题: 总结不同评测基准（OSWorld、ScienceBoard、MemGUI-Bench、VG-GUIBench、FraudSMSWalker等）和指标如何影响关于智能体能力和局限性的结论。
      尚未覆盖: 跨基准兼容性：这些论文在不同任务定义、界面模态和评分规则下评估智能体，报告的改进是否能跨设置迁移尚不明确。
    - 路线: 开放问题与缺口映射
      解决的问题: 识别研究不足的领域，如长时域上下文管理、面向安全的不确定性量化、领域条件鲁棒性以及从人类屏幕录制中训练。
      尚未覆盖: 哪些缺口对进步最重要需要优先级排序；每篇论文都强调自身局限性，但缺少基于共享评估准则的全局开放问题排序。
    共识:
    - 大型多模态模型是GUI智能体的事实骨干，经过任务特定训练（RL或SFT）后性能提升，而非零样本提示。
    - 基准测试对于衡量进展至关重要，多篇论文引入了覆盖基础、长时域任务、安全性和不确定性的新基准。
    - 安全性和可靠性正成为关键关注点，论文同时涉及攻击抵抗和不确定性量化。
    - 自主或可验证的奖励信号作为训练计算机使用智能体的可扩展替代方案正在获得关注。
    分歧:
    - 评测范围：有些工作聚焦于单步可执行基础，而另一些则在多步任务轨迹上评估，导致对智能体鲁棒性的结论不同。
    - 安全方法：一篇论文显示前沿智能体在浏览器攻击上表现抵抗，但在编码任务上失败，揭示了领域条件安全性；其他论文未测试跨领域安全，因此安全机制的泛化性仍存在争议。
    - 训练范式：不同论文分别采用基于合成可验证任务的在线RL、基于人类标注上下文动作的SFT以及基于噪声自主评估器的RL，它们在数据来源、奖励质量和样本效率上存在差异。
    开放问题:
    - 如何设计一个统一的评测套件，既能捕捉单步基础准确性，又能衡量多步任务完成，同时探测分布偏移下的安全性？
    - 鉴于领域条件失效的证据，在浏览器任务中观察到的安全加固在多大程度上能迁移到编码或移动等其他领域？
    - 在使用自主噪声评估器进行RL训练和依赖人类演示之间，最佳权衡是什么？如何在不同GUI界面下提高评估器信号的可靠性？
