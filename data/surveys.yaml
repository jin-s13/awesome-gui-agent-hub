  related_work_outline_zh:
  - 主流方向：本证据包最强的路线是将GUI智能体理论操作化为正式任务抽象和面向可靠性的基准，而非纯定理式分析。
  - 研究共性：工作将GUI行为分解为可执行或可检查的任务单元，并区分表面Pass@1与更细的子目标、成本效率或不确定性证据。
  - 关键差异：差异体现在交互表示、适应路线和评测目标上，例如静态与动态屏幕、冻结骨干技能/执行框架与弱监督或RL、成功与校准。
  - 趋势演进：2026年前沿正从静态桌面和点击/拖拽基准扩展到动态流动屏幕、多模态技能工件、可验证RL和不确定性/可靠性覆盖。
