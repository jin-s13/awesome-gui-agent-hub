  related_work_outline:
  - 'Mainstream direction: The evidence centers on building, scaling, and benchmarking
    GUI/computer-use agents through verifiable task synthesis, online RL, weak supervision
    from unannotated screenshots, and executable-harness optimization, with evaluation
    across desktop, dynamic video, drag, and GUI+CLI settings.'
  - 'Shared research pattern: Papers combine environment/task design with an agent
    intervention and emphasize fine-grained metrics beyond Pass@1, evidence-grounded
    diagnosis from screenshots and repeated runs, and grounding or action prediction
    as the core capability.'
  - 'Key differences: The main splits are intervention point, interaction coverage,
    and evaluation target: training-time RL or weak supervision versus decision-time
    harness optimization versus evaluation/uncertainty protocols; click, drag, GUI+CLI,
    and dynamic-video interfaces; success rate, sub-goal, cost-accuracy, and uncertainty
    calibration.'
  - 'Trend evolution: Available top evidence is concentrated in 2026, so the trend
    is best read as a current-frontier shift from static click-based benchmarks toward
    dynamic/living interfaces, interaction-diverse tasks, weak or verifiable supervision,
    and self-improving agent pipelines.'
  - 'Open questions: Attribution among backbone, harness, data, and evaluation remains
    unresolved; observation control and drag/dynamic capabilities need cross-platform
    evidence; uncertainty calibration under multi-step and shifted settings is still
    weak.'
  related_work_outline_zh:
  - 主流方向：证据集中于构建、扩展和评估GUI/计算机使用代理，方法包括可验证任务合成、在线RL、未标注截图的弱监督执行和harness优化，并在桌面、动态视频、拖拽及GUI+CLI设置中评测。
  - 研究共性：论文普遍将环境/任务设计与代理干预结合，强调超越Pass@1的细粒度指标，并基于截图、动作效果和重复运行证据进行诊断，以定位和动作预测为核心能力。
  - 关键差异：主要分歧在于干预点、交互覆盖和评测目标：训练期RL或弱监督、决策期harness优化还是评测/不确定性协议；点击、拖拽、GUI+CLI和动态视频接口；成功率、子目标、成本精度和不确定性校准。
  - 趋势演进：可用的高证据集中在2026年，因此趋势应理解为当前前沿正从静态点击基准转向动态/活屏界面、多样交互、弱监督或可验证监督以及自改进代理流程。
  - 开放问题：骨干模型、harness、数据和评测之间的收益归因仍未解决；观察控制和拖拽/动态能力需要跨平台证据；多步和分布偏移下的不确定性校准仍较弱。
  literature_review:
    line_of_work_matrix:
    - line: Large-scale GUI benchmark and task design
      what_it_solves: Provides measurable coverage of desktop, dynamic-video, and
        drag interactions through fine-grained scoring, capability annotations, and
        interaction-specific task suites.
      what_remains_open: Coverage remains platform- or interaction-specific; multi-step
        trajectories and distribution shift are underexplored in the available evidence.
    - line: Training and data-efficiency methods
      what_it_solves: Reduces annotation dependence and scales GUI action grounding
        using verifiable synthetic tasks, online RL, and weakly supervised visual
        grounding from unannotated screenshots.
      what_remains_open: Reported gains are tied to OSWorld, ScienceBoard, selected
        VLM backbones, or specific interaction datasets; transfer evidence and systematic
        ablations are partial.
    - line: Execution-harness and planning-interface optimization
      what_it_solves: Improves frozen GUI agents by grounding diagnosis in before-and-after
        screenshots and repeated runs, then optimizing the executable harness around
        the model.
      what_remains_open: Attribution between harness and model benefit is not fully
        isolated, and generalization beyond the tested task families and platforms
        remains open.
    - line: Observation representation for dynamic and video-guided interfaces
      what_it_solves: Selects task-relevant frames and formalizes observation control
        for interfaces whose content changes between actions.
      what_remains_open: Current agents still exhibit over- and under-observation,
        and evaluation is limited to short-video or video-guided task settings.
    - line: Uncertainty and evidence protocols for grounding
      what_it_solves: Benchmarks post-hoc uncertainty quantification and spatial safety
        for GUI grounding across vision-language models and datasets.
      what_remains_open: Evidence covers single-step executable grounding; cross-tier
        UQ transfer is weak and conformal coverage degrades under calibration-test
        or interface shift.
    consensus:
    - Pass@1 alone is insufficient; fine-grained, rule-based, or checkpoint-level
      evaluation better reveals sub-goal and capability differences.
    - Agent performance is jointly determined by model, data, environment or harness,
      and evaluation protocol rather than by the model alone.
    - There is a shared move toward grounding supervision and diagnosis from screenshots,
      action effects, and repeated interaction evidence.
    - Benchmarks need to cover interaction diversity beyond classic click-based tasks,
      including dragging, CLI, and dynamic interfaces.
    disagreements:
    - 'Where to intervene: training signals and data scaling versus frozen-model execution-harness
      optimization versus evaluation and uncertainty protocols.'
    - 'Which supervision signal is most useful: verifiable synthetic RL tasks, unannotated
      screenshots with weak supervision, or task-specific interaction datasets.'
    - 'Which evaluation regime matters: real desktop suites, dynamic video or living-screen
      benchmarks, drag interaction suites, or uncertainty calibration under interface
      shift.'
    - 'How to define transfer: held-out tasks within a suite, frozen-harness transfer
      across benchmarks, or cross-dataset and cross-model uncertainty ranking stability.'
    open_questions:
    - How much of the reported gain comes from backbone models, training data or task
      synthesis, or execution-harness changes rather than the named method?
    - Can observation-control and drag or dynamic-interface capabilities transfer
      beyond the specific short-video, desktop, and drag benchmarks present in this
      evidence?
    - How can uncertainty quantification remain reliable in multi-step trajectories
      and under deployment distribution shift when current evidence shows cross-tier
      and calibration degradation?
    - What minimal supervision or verification signal is sufficient for robust GUI
      grounding and action prediction without overfitting to a benchmark?
    - Several papers show absent limitation or ablation fields in the evidence packet,
      leaving verification gaps rather than proving absence, especially for generalization
      and attribution claims.
  literature_review_zh:
    研究路线矩阵:
    - 路线: 大规模GUI基准与任务设计
      解决的问题: 通过细粒度评分、能力注释和针对特定交互的任务套件，提供桌面、动态视频和拖拽交互的可量化覆盖。
      尚未覆盖: 覆盖仍局限于平台或交互类型；多步轨迹和分布偏移在现有证据中探索不足。
    - 路线: 训练与数据效率方法
      解决的问题: 通过可验证合成任务、在线RL和基于未标注截图的弱监督视觉定位，降低标注依赖并扩展GUI动作基础。
      尚未覆盖: 报告收益多与OSWorld、ScienceBoard、选定VLM骨干或特定交互数据集绑定；迁移证据和系统性消融有限。
    - 路线: 执行harness与规划接口优化
      解决的问题: 通过前后截图和重复运行中的证据驱动诊断，优化冻结GUI代理的可执行harness。
      尚未覆盖: harness与模型收益的归因未完全隔离，在已测任务族和平台之外的泛化仍开放。
    - 路线: 动态与视频引导界面的观察表示
      解决的问题: 为动作间内容变化的界面选择任务相关帧，并形式化观察控制。
      尚未覆盖: 当前代理仍存在过度观察和观察不足，评估仅限于短视频或视频引导任务环境。
    - 路线: 定位的不确定性与证据协议
      解决的问题: 跨视觉语言模型和数据集基准测试GUI定位中的后验不确定性量化和空间安全性。
      尚未覆盖: 证据仅覆盖单步可执行定位；跨层级UQ迁移弱，共形覆盖在校准-测试或接口偏移下下降。
    共识:
    - 仅看Pass@1不足；细粒度、规则化或按检查点评分更能揭示子目标和能力差异。
    - 代理表现由模型、数据、环境或harness以及评测协议共同决定，而非仅由模型决定。
    - 领域正共同转向基于截图、动作效果和重复交互证据进行定位监督和诊断。
    - 基准需要覆盖经典点击任务之外的交互多样性，包括拖拽、CLI和动态界面。
    分歧:
    - 改进重点不同：训练信号与数据扩展，还是冻结模型的执行harness优化，还是评测与不确定性协议。
    - 最有用的监督信号不同：可验证合成RL任务、未标注截图的弱监督，或任务特定的交互数据集。
    - 评测场景不同：真实桌面套件、动态视频或活屏基准、拖拽交互套件，或面向界面偏移的不确定性校准。
    - 对迁移定义不同：同套件留出任务、跨基准冻结harness迁移，或跨数据集和跨模型的不确定性排名稳定性。
    开放问题:
    - 报告收益中有多少来自骨干模型、训练数据或任务合成，或执行harness变化，而不是所提方法本身？
    - 观察控制和拖拽或动态界面能力能否迁移到本证据中特定短视频、桌面和拖拽基准之外？
    - 在多步轨迹和部署分布偏移下，不确定量化如何保持可靠，当前证据显示跨层级迁移和校准下降？
    - 最少需要多少监督或验证信号，才能在不绑定基准的情况下获得鲁棒的GUI定位与动作预测？
    - 若干论文在证据包中缺少限制说明或消融字段，这构成验证缺口而不是证明不存在，尤其影响泛化和归因判断。
