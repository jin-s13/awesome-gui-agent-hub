  related_work_outline_zh:
  - 主流方向：构建面向GUI代理的开源端到端训练框架与服务栈，在线强化学习在真实环境中的训练成为主导范式。
  - 研究共性：系统结合视觉定位、多轮交互和任务级监督；多数工作强调在代理记忆或技能中保留视觉信息（截图、局部裁剪）。
  - 关键差异：训练方式在离线/在线数据收集、弱监督/全监督间存在差异，系统目标覆盖浏览器、桌面或多环境。安全与评估基准分为离线诊断任务和在线红队测试，攻击面与泛化假设不同。
  - 趋势演进：所有证据集中在2024–2026年，处于当前前沿。趋势是走向开放、可复现的RL训练框架、更丰富的多模态技能库，以及用显式失败模式诊断补充端到端成功指标。
  - 开放问题：如何在多样化框架和环境中实现稳健的错误恢复；如何将安全加固泛化到训练域之外；如何将离线诊断发现转化为部署代理的系统性改进。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end training pipelines and deployment stacks
      what_it_solves: Turning model capabilities into complete, reproducible workflows
        for GUI agent training, inference, and evaluation, exemplified by frameworks
        like OpenForgeRL and OpenWebRL.
      what_remains_open: Error recovery remains weak after RL training; some harness
        designs are substantially harder to learn, limiting the generality of the
        stack across different agent frameworks.
    - line: Skill and memory representations for agents
      what_it_solves: Improving GUI agent performance by structuring knowledge into
        retrievable, multimodal skill artifacts (VISUALSKILL) or action-grounded visual
        memory (AGMem), reducing state-level and action-level errors.
      what_remains_open: How to maintain these representations under dynamic UI changes
        and across diverse applications; the trade-off between full-image and local-crop
        memory is not fully resolved.
    - line: Data-efficient and weakly-supervised learning
      what_it_solves: Reducing reliance on expensive human annotations by leveraging
        massive unannotated screenshots and curriculum learning (GUICrafter), enabling
        competitive performance with minimal labeled data.
      what_remains_open: The quality and coverage of automatically extracted visual
        grounding signals; how well such models transfer to completely unseen application
        domains.
    - line: Safety and user-sensitive interaction
      what_it_solves: Diagnosing and hardening agents against prompt injection attacks
        (Domain-Conditioned Safety) and preventing exposure of user-sensitive screens
        through guided exploration.
      what_remains_open: Safety hardening is domain-conditional and does not generalize
        beyond the browser surface; exploration strategies for user-sensitive states
        lack rigorous evaluation.
    - line: Diagnostic benchmarks and failure analysis
      what_it_solves: Isolating specific GUI understanding capabilities such as transition
        reasoning (Desktop-Delta Bench) and categorizing failure modes (AGMem's taxonomy),
        providing finer-grained feedback than end-to-end success rates.
      what_remains_open: Benchmarks are offline and do not capture real-time interaction
        dynamics; findings have not yet been systematically connected to improvements
        in online agent training.
    consensus:
    - 'Visual information is essential for GUI agents: retaining screenshots, crops,
      or visual figures alongside text improves grounding and action accuracy.'
    - Online, multi-turn reinforcement learning on live environments is a highly effective
      training paradigm, outperforming static supervised approaches when combined
      with proper infrastructure.
    - Open-source frameworks and benchmarks are critical for reproducible progress;
      several works explicitly release code, data, and environment setups to enable
      independent verification.
    - Current agents still suffer from systematic failures in error recovery, temporal
      reasoning about GUI transitions, and generalization to new domains or attack
      surfaces.
    disagreements:
    - 'Training data collection: some works rely on massive unannotated screenshots
      and weak supervision, while others require small amounts of high-quality supervised
      trajectories for initialization.'
    - 'Memory design: full-image visual memory can worsen action-level errors, whereas
      action-grounded local crops improve performance, indicating a trade-off between
      global context and precise grounding.'
    - 'Safety evaluation: one benchmark shows near-zero attack success on hand-crafted
      browser injections, but the same models fail on coding-domain skill injections,
      suggesting that safety conclusions depend heavily on the evaluation domain and
      attack type.'
    - 'Benchmark scope: offline diagnostic benchmarks (e.g., Desktop-Delta Bench)
      focus on isolated capabilities, while online evaluation on live websites captures
      deployment dynamics but is harder to standardize and reproduce.'
    open_questions:
    - How can we design training algorithms and harnesses that jointly improve error
      recovery and robustness across diverse GUI environments?
    - What mechanisms would allow safety hardening to transfer from browser tasks
      to other computer-use domains, such as coding or system administration?
    - To what extent do findings from offline diagnostic benchmarks (e.g., transition
      reasoning, failure taxonomies) predict or improve real-world agent performance?
    - How can we efficiently explore the space of user-sensitive states without relying
      on single-demonstration heuristics, and validate exploration strategies experimentally?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端训练流水线与部署栈
      解决的问题: 将模型能力转化为可复现的完整工作流，覆盖GUI代理训练、推理和评估，如OpenForgeRL和OpenWebRL等框架。
      尚未覆盖: RL训练后错误恢复仍弱；某些框架设计更难学习，限制了栈在不同代理框架间的通用性。
    - 路线: 代理技能与记忆表示
      解决的问题: 通过将知识组织为可检索的多模态技能工件（VISUALSKILL）或动作接地视觉记忆（AGMem），提升GUI代理性能，减少状态级和动作级错误。
      尚未覆盖: 如何在动态UI变化和多样化应用中保持这些表示；全图记忆与局部裁剪记忆之间的权衡尚未完全解决。
    - 路线: 数据高效与弱监督学习
      解决的问题: 减少对昂贵人工标注的依赖，利用海量未标注截图和课程学习（GUICrafter），以极少量标注数据达到竞争性能。
      尚未覆盖: 自动提取的视觉定位信号的质量和覆盖范围；此类模型在完全未见过的应用领域上的迁移能力。
    - 路线: 安全与用户敏感交互
      解决的问题: 诊断并加固代理，抵御提示注入攻击（Domain-Conditioned Safety），并通过引导式探索防止暴露用户敏感屏幕。
      尚未覆盖: 安全加固是领域条件的，无法泛化到浏览器表面之外；用户敏感状态的探索策略缺乏严格评估。
    - 路线: 诊断基准与失败分析
      解决的问题: 隔离特定GUI理解能力，如过渡推理（Desktop-Delta Bench）和失败模式分类（AGMem分类法），提供比端到端成功率更细粒度的反馈。
      尚未覆盖: 基准为离线形式，无法捕捉实时交互动态；相关发现尚未系统性地连接到在线代理训练的改进中。
    共识:
    - 视觉信息对GUI代理至关重要：保留截图、裁剪或视觉图形与文本一起，可改善接地和动作准确性。
    - 在线、多轮强化学习在真实环境中是一种高效的训练范式，配合适当基础设施时优于静态监督方法。
    - 开源框架和基准对可复现进展至关重要；多项工作明确发布代码、数据和环境设置，以支持独立验证。
    - 当前代理仍存在系统性失败：错误恢复、GUI过渡的时间推理、向新领域或攻击面的泛化。
    分歧:
    - 训练数据收集：一些工作依赖海量未标注截图和弱监督，另一些则需要少量高质量监督轨迹进行初始化。
    - 记忆设计：全图视觉记忆可能加剧动作级错误，而动作接地局部裁剪提升性能，揭示全局上下文与精确定位之间的权衡。
    - 安全评估：一个基准显示手工浏览器注入攻击成功率接近零，但相同模型在编码领域技能注入上失败，表明安全结论高度依赖评估领域和攻击类型。
    - 基准范围：离线诊断基准（如Desktop-Delta Bench）聚焦孤立能力，而在线网站评估捕捉部署动态，但更难以标准化和复现。
    开放问题:
    - 如何设计训练算法和框架，以共同提升跨多样化GUI环境的错误恢复能力和鲁棒性？
    - 何种机制可使安全加固从浏览器任务迁移到其他计算机使用领域，如编码或系统管理？
    - 离线诊断基准（如过渡推理、失败分类法）的发现能在多大程度上预测或改善真实世界代理性能？
    - 如何在不依赖单一演示启发式的前提下，高效探索用户敏感状态空间，并通过实验验证探索策略？
