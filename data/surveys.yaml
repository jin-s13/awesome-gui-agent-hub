    研究路线矩阵:
    - 路线: 分类体系与路线图综合
      解决的问题: 将碎片化的GUI智能体证据整理为方向：定位、长程执行、自改进、不确定性、安全性和数据生成。
      尚未覆盖: 该综合是否由系统纳入标准支撑；证据包缺少调查级方法细节，且仅可见2026年排名示例。
    - 路线: 对比评测综合
      解决的问题: 总结OSWorld、ScienceBoard、ScreenSpot-Pro、WebArena-Infinity、MobileWorld、VG-GUIBench和欺诈/安全基准等评测选择如何影响GUI智能体结论。
      尚未覆盖: 跨协议、模型层级、界面和指标的兼容性仍不确定；部分论文缺少局限性与工件证据。
    - 路线: 开放问题与缺口映射
      解决的问题: 将广泛覆盖转化为具体缺口，如选择性不确定性迁移、领域条件安全性、净化线索下的良性召回和长程上下文管理。
      尚未覆盖: 哪些缺口应优先解决；缺少系统优先级排序和真实部署边界证据。
    共识:
    - 评测已转向可执行的GUI基准，能够在真实界面条件下暴露定位、规划和安全问题。
    - 从环境交互中获取监督，例如截图、无障碍树、重复运行或可验证任务完成，被广泛视为改进智能体的必要手段。
    - 单一基准或协议不够；论文使用多个外部基准来支持迁移和鲁棒性主张。
    - 不确定性和安全性对模型层级、界面和领域敏感，较强的结论需要针对目标重新评估。
    分歧:
    - 评测范围从单步定位到多步桌面、移动、网页、视频、欺诈和安全任务不等，难以直接比较。
    - 监督方式不同：密集环境标注、可验证RL任务合成、证据驱动harness优化和主动上下文管理各自针对不同瓶颈。
    - 安全与不确定性结果在领域和模型类别间冲突：浏览器领域注入抵抗可能与编码领域脆弱性并存，不确定性排名跨层级迁移弱。
    - 部分工作假设冻结骨干模型通过harness或上下文编辑改进，另一些则微调或在线RL训练，改变了智能体改进的含义。
    开放问题:
    - 什么样的最低基准协议和报告标准能使OSWorld、ScienceBoard、ScreenSpot-Pro、WebArena-Infinity、MobileWorld和VG-GUIBench的结果可比较？
    - 为什么不确定性排名和安全加固在数据集、界面、领域和开闭源模型层级之间选择性迁移？
    - 密集监督、可验证任务合成、harness优化和上下文管理是否解决互补的失败模式，还是存在重叠？
    - 如何在长程记忆、定位不确定性、欺诈良性召回、领域条件安全和基准泛化之间确定开放缺口的优先级？
    - 证据包未提供系统调查纳入标准，若干部论文缺少局限性细节；还需要哪些证据才能形成可审计的分类体系或路线图？
