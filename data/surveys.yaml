    研究路线矩阵:
    - 路线: 应用场景GUI基准构建
      解决的问题: 在桌面任务、动态短视频平台、拖拽交互和视频引导任务中评测代理定位能力，暴露过度/不足观察和拖拽错误等失效模式。
      尚未覆盖: 基准受平台限制；向专业软件操作和安全关键工作流的迁移，以及细粒度指标是否预测真实部署效果仍未被证实。
    - 路线: 可复用技能、记忆与重放系统
      解决的问题: 将经过验证的GUI轨迹或多模态技能工件编译为可重放或可加载资源，以降低token成本、执行时间和重复任务开销，并进行前提检查。
      尚未覆盖: 对UI变化、动态内容、模糊状态和工件生命周期/积累的鲁棒性仍未解决；确定性重放仅在兼容运行时状态下有效。
    - 路线: GUI智能体的多模态定位与训练
      解决的问题: 通过扩散视觉语言模型、交互数据微调或任务驱动关键帧提取，改善视觉元素识别、导航、拖拽定位或视频引导交互。
      尚未覆盖: 跨平台跨应用泛化、闭源/开源模型差距以及代码、数据集和局限说明等可复现证据在本证据包中不完整。
    共识:
    - 应用场景基准使用真实或基于浏览器的界面和多步任务，表明GUI代理需要超越静态点击成功的能力。
    - 效率和细粒度诊断很重要：若干工作报告子目标完成度、成本准确率、token成本、执行时间或失效模式分析，而非仅看Pass@1。
    - 可复用工件能改善重复任务表现，但只有在运行时验证、前提检查或回退机制防止错误复用时才可靠。
    - 当前模型在动态观察控制、拖拽交互或跨应用工作流上仍有明显差距，需要领域特定训练和基准压力测试。
    分歧:
    - 评测目标不同：有的优化Pass@1或平均分，有的强调成本准确率、细粒度子目标检查点或视频引导定位。
