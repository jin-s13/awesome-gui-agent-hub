  related_work_outline_zh:
  - 主流方向：构建面向更丰富真实交互的 GUI/OS 自动化基准与代理训练方法，涵盖桌面 OS、GUI+CLI、拖拽、动态屏幕和视频引导任务。
  - 研究共性：构建环境或数据集，定义任务和指标，评估前沿模型或代理，再通过细粒度或不确定性感知评分暴露聚合指标掩盖的缺口。
  - 关键差异：任务覆盖从静态单步定位、多步桌面与动态屏幕任务、拖拽操作到视频引导工作流；改进路径分为技能库、基于合成任务的在线强化学习和弱监督定位。
  - 趋势演进：2024–2026 证据集中在当前前沿，正从聚合成功率转向子目标、成本与不确定性指标，并从纯基准测试转向以基准驱动的代理训练。
