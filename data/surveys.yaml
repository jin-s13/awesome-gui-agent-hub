  literature_review_zh:
    研究路线矩阵:
    - 路线: 可复用的多模态技能与可重放记忆库
      解决的问题: 将已验证的 GUI 工作流转化为可调用工件，减少重复规划、token 消耗和执行时间。
      尚未覆盖: 工件在应用更新、运行时状态变化或用户特定设置下的泛化；确定性适用条件仍然较窄。
    - 路线: 弱监督与表示高效的 GUI 智能体训练
      解决的问题: 降低对昂贵 GUI 轨迹标注的依赖，并探索用于定位和导航的替代生成范式。
      尚未覆盖: 已有提升依赖选定基准；跨平台鲁棒性、推理延迟以及未标注截图泛化仍需独立验证。
    - 路线: 框架原生的端到端强化学习与统一动作编排
      解决的问题: 在实际部署框架或桌面环境中训练智能体，包括 GUI 点击和代码执行，并使用可验证奖励或状态检查。
      尚未覆盖: 错误恢复仍然薄弱，框架设计强烈影响可训练性，跨操作系统的容器化回放扩展性尚未解决。
    - 路线: 诊断与恢复评估框架
      解决的问题: 通过受控探针和基于重放的一致性检查，衡量智能体能否从状态偏离中恢复并遵循个性化偏好。
      尚未覆盖: 长时程重放代价高，恢复指标未必跨设置迁移，个性化证据集中在移动 GUI 场景。
    - 路线: 可运行流水线、沙箱与工件可复现工程
      解决的问题: 提供开源代码、数据集、基准或编排工件，以便在可复现环境中训练和评估智能体。
      尚未覆盖: 若干论文缺少代码、数据集或工件证据；跨团队和基础设施的独立复现仍是验证缺口。
    共识:
    - 论文共同采用可运行的 GUI 或计算机使用智能体框架，在真实或仿真环境中评估屏幕感知、动作落地和任务完成。
    - 研究共同从静态单步提示转向闭环工作流，包括技能检索、记忆重放、代码执行或强化学习回放。
    - 常用评估环境如 OSWorld-Verified、WebVoyager 以及平台特定 GUI 基准被用于报告成功率或相对开放基线的效率提升。
    分歧:
    - 动作空间表示不同：有的智能体仅输出 GUI 操作，有的将 GUI 操作和代码执行统一到同一动作空间，还有的采用扩散生成。
    - 监督策略不同：来自未标注截图的弱监督、来自工件验证轨迹的监督微调，以及在线强化学习依赖不同的数据和奖励假设。
    - 评测目标不同：一条路线关注整体任务成功，另一条隔离恢复一致性，另一条诊断个性化偏好，还有一条优化 token 或时间成本。
    - 部署耦合方式不同：有的系统通过框架代理和容器化回放训练，有的在运行时调用确定性记忆或技能工件，反映不同的集成假设。
    开放问题:
    - 当确定性前提、屏幕坐标或平台 API 发生变化时，这些系统在已报告的手机、网页或 Ubuntu 设置之外的迁移表现如何？
    - 恢复和个性化能力能否通过提升任务成功率的同一 RL 或记忆机制改善，还是需要单独的训练和评测信号？
    - 框架原生 RL 和可重放记忆在实际实时部署中的延迟、成本和基础设施需求是什么？
    - 在可用证据中代码、数据和工件链接缺失或不全的情况下，哪些已报告改进能够被独立复现？
