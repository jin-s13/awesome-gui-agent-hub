  related_work_outline_zh:
  - 主流方向：端到端训练与编排多模态GUI/计算机使用智能体，越来越多地融合GUI操作与代码执行，并在OSWorld-Verified、AndroidControl、Online-Mind2Web和WebVoyager等可验证环境中评测。
  - 研究共性：将感知、动作选择与任务执行统一到单一模型或框架，并通过受控基准和消融分离视觉定位、动作表示、恢复或个性化能力。
  - 关键差异：动作表示包括生成式解码、块级扩散和无解码器潜空间候选评分；监督信号包括无标注截图、可验证混合任务和在线RL；评测目标涵盖总体成功率、恢复与个性化诊断。
  - 趋势演进：证据集中在2024–2026前沿，从独立智能体策略转向可运行训练/部署栈和高效服务，评测从总体成功率扩展至失败模式与能力诊断。
  - 开放问题：跨基础设施独立复现、分布外GUI泛化、RL后可靠错误恢复，以及速度/保真度/可控性权衡仍待解决。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end agent training and orchestration stacks
      what_it_solves: Training and deploying harness-native or unified GUI/code agents
        by intercepting rollout model calls and applying online RL, rather than optimizing
        isolated model outputs.
      what_remains_open: Error recovery remains weak after RL; harness design heavily
        affects trainability; independent deployment across proprietary environments
        and infrastructure is not established.
    - line: Efficient and interactive multimodal action policies
      what_it_solves: Reducing GUI action latency and parameter cost through decoder-free
        latent candidate scoring or block-wise diffusion instead of token-by-token
        autoregressive decoding.
      what_remains_open: In-distribution accuracy can trail fine-tuned VLM baselines;
        evaluation is often limited to AndroidControl or selected GUI benchmarks,
        leaving cross-platform and out-of-distribution generalization open.
    - line: Reusable skill, memory, and weak-supervision layers
      what_it_solves: Lowering annotation or documentation cost and supplying retrievable
        multimodal skill artifacts or visual grounding learned from unannotated screenshots.
      what_remains_open: Evidence is concentrated on a few benchmarks or applications;
        transfer across evolving UIs, applications, and user-specific settings lacks
        broad validation.
    - line: Diagnostic evaluation and recovery frameworks
      what_it_solves: Measuring failure modes such as transition-consistent recovery
        and preference-timing errors instead of reporting only aggregate task success.
      what_remains_open: Frameworks rely on controlled error injection or probes,
        so their ability to predict live deployment reliability and long-horizon behavior
        remains uncertain.
    - line: Artifact-centric reproducibility and benchmark scaffolding
      what_it_solves: Providing code, skill libraries, datasets, and evaluation suites
        that make agent behavior inspectable and reusable.
      what_remains_open: Several systems have weak or unstated code/artifact signals;
        independent reproduction across teams, datasets, and infrastructure remains
        a verification gap.
    consensus:
    - Multimodal visual grounding is critical for GUI and computer-use tasks, supported
      by evidence from retained visual skill artifacts, unannotated screenshot pretraining,
      and native-resolution vision encoders.
    - Evaluation should use executable, state-verifiable benchmarks such as OSWorld-Verified,
      AndroidControl, Online-Mind2Web, and WebVoyager rather than only static or text-based
      measures.
    - Supervised fine-tuning or reinforcement learning on environment interactions
      improves GUI agents over zero-shot or prompting baselines.
    - Action representations are converging toward unified spaces that can include
      GUI operations, code execution, tool calls, and latent candidate scoring.
    disagreements:
    - 'Speed-accuracy trade-off: one line prioritizes low latency and small parameter
      counts while accepting 86-92% of a fine-tuned VLM baseline in-distribution;
      another pursues generative multimodal decoding to surpass Qwen baselines.'
    - 'Supervision strategy: weak supervision from unannotated screenshots competes
      with hybrid verifiable task generation and online RL, differing in label cost,
      environment realism, and evaluator construction.'
    - 'Action-space design: some systems unify GUI interaction with code execution,
      while others stay GUI-only or use skill/tool retrieval; simple code-tool addition
      can degrade GUI-agent performance in some settings.'
    - 'Evaluation target: aggregate task success, recovery consistency, and personalization
      failure diagnosis are used as different signals, making direct comparison across
      these evaluations difficult.'
    open_questions:
    - Can efficient latent-space or block-wise diffusion policies close the accuracy
      gap and generalize beyond in-distribution mobile benchmarks to desktop, web,
      and evolving interfaces?
    - Which harness and orchestration designs enable reliable error recovery, given
      that post-RL error recovery remains weak and harness trainability varies substantially?
    - Do diagnostic benchmarks such as recovery replay and preference-timing probes
      predict live deployment reliability, or are their controlled conditions too
      artificial to transfer?
    - Can these systems be independently reproduced across teams, datasets, and infrastructure
      when code and artifact signals are absent or incomplete?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端智能体训练与编排栈
      解决的问题: 通过拦截回放模型调用并应用在线强化学习，训练和部署Harness原生或GUI+代码统一智能体，而非仅优化孤立模型输出。
      尚未覆盖: RL后错误恢复仍然较弱；Harness设计显著影响可训练性；跨专有环境和基础设施的独立部署尚未得到验证。
    - 路线: 高效交互式多模态动作策略
      解决的问题: 通过无解码器潜空间候选评分或块级扩散降低GUI动作延迟和参数量，替代逐token自回归解码。
      尚未覆盖: 分布内准确率可能落后于微调VLM基线；评测多限于AndroidControl或少量GUI基准，跨平台和分布外泛化仍未充分验证。
    - 路线: 可复用技能、记忆与弱监督适配层
      解决的问题: 降低标注或文档成本，提供可检索多模态技能工件，或从无标注截图中学习视觉定位。
      尚未覆盖: 证据集中在少量基准或应用；在动态UI、跨应用和用户特定设置下的迁移缺乏广泛验证。
    - 路线: 诊断评测与恢复框架
      解决的问题: 测量恢复一致性和偏好生效时机等失败模式，而非仅报告总体任务成功率。
      尚未覆盖: 框架依赖受控错误注入或探针，能否预测真实部署可靠性和长时程行为仍不确定。
    - 路线: 面向可复现工程的工件与基准
      解决的问题: 提供代码、技能库、数据集和评测套件，使智能体行为可检查、可复用。
      尚未覆盖: 部分系统代码/工件信号不足或未说明；跨团队、数据集和基础设施的独立复现仍是验证缺口。
    共识:
    - 多模态视觉定位对GUI和计算机使用任务至关重要，证据来自保留视觉技能工件、无标注截图预训练和原生分辨率视觉编码器。
    - 应使用可执行、可验证状态的基准，如OSWorld-Verified、AndroidControl、Online-Mind2Web和WebVoyager，而非仅使用静态或纯文本评测。
    - 在环境交互上进行监督微调或强化学习通常比零样本或提示方法更能提升GUI智能体表现。
    - 动作表示正趋向统一空间，可同时包含GUI操作、代码执行、工具调用和潜空间候选评分。
    分歧:
    - 速度与精度权衡：一条路线优先低延迟和低参数量，接受达到微调VLM基线的86–92%分布内准确率；另一条路线追求生成式多模态解码以超越Qwen基线。
    - 监督策略差异：无标注截图弱监督与可验证混合任务生成、在线RL在标注成本、环境真实度和评估器构建上存在路线差异。
    - 动作空间设计差异：部分系统统一GUI交互与代码执行，部分保持GUI-only或技能/工具检索；简单加入代码工具在部分场景下可能反而降低GUI智能体性能。
    - 评测目标不同：总体任务成功率、恢复一致性和个性化失败诊断分别作为不同信号，导致这些评测之间难以直接比较。
    开放问题:
    - 高效潜空间或块级扩散策略能否缩小精度差距，并从分布内移动基准泛化到桌面、网页和动态界面？
    - 哪种Harness和编排设计能实现可靠错误恢复？当前RL后错误恢复仍较弱，且不同Harness可训练性差异明显。
    - 恢复重放和偏好时机探针等诊断基准能否预测真实部署可靠性，还是因受控条件过强而难以迁移？
    - 在代码和工件信号缺失或不完整时，这些系统能否跨团队、数据集和基础设施被独立复现？
