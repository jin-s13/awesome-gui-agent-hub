  related_work_outline_zh:
  - 主流方向：证据集中在桌面、移动、网页与短视频平台的应用级GUI代理，使用细粒度成功、子目标与成本指标评测。
  - 研究共性：构建或扩展GUI基准/数据集，将模型输出定位到界面元素与动作，并比较前沿多模态或LLM代理的任务完成表现。
  - 关键差异：任务范围从静态macOS任务到动态屏幕与视频引导交互；动作类型包括点击、拖拽和GUI/CLI混合；改进机制分为技能库、重放记忆、数据微调和生成架构变化。
