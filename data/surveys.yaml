    rate, and identify a specific capability gap (e.g., context management, reward
    noise, domain safety).'
  - 'Key differences: Evaluation targets diverge (grounding uncertainty, fraud detection,
    prompt injection safety, step-by-step tutorial accuracy); training paradigms differ
    (supervised fine-tuning, RL with verifiable synthesis, RL with noisy evaluator);
    action spaces span mobile GUI, browser, code execution, and video interaction.'
  - 'Trend evolution: Within the 2024–2026 frontier, work is shifting from static
    offline benchmarks to online RL with synthetic task generation, from single-step
    to multi-step trajectories, and from task success alone to trustworthiness dimensions
    like uncertainty and safety.'
  - 'Open questions: Whether uncertainty quantification rankings transfer across model
    families, how to balance online RL exploration with safety constraints, whether
    context management can scale to dynamic interfaces, and how to cover the full
    attack surface in safety evaluations.'
  related_work_outline_zh:
  - 主流方向：将GUI代理评估从单任务基准扩展到覆盖不确定性、安全、长时域规划和视频引导任务的多维评估，同时通过在线RL和自主评估扩展代理能力。
  - 研究共性：每项工作几乎都提出新基准或数据集并伴随方法改进，以视觉语言模型为底座，用任务成功率衡量，并识别特定能力缺口（如上下文管理、奖励噪声、领域安全）。
  - 关键差异：评测目标不同（grounding不确定性、欺诈检测、提示注入安全、教程准确性）；训练范式不同（监督微调、可验证合成RL、噪声评估器RL）；动作空间覆盖移动GUI、浏览器、代码执行和视频交互。
  - 趋势演进：在2024-2026前沿窗口内，工作从静态离线基准转向在线RL与合成任务生成，从单步到多步轨迹，从仅关注任务成功到纳入不确定性和安全等可信维度。
  - 开放问题：不确定性量化排名能否跨模型族迁移，如何平衡在线RL探索与安全约束，上下文管理能否适应动态界面，安全评估能否覆盖全部攻击面。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark-driven capability evaluation
      what_it_solves: Systematically assess GUI agents on specific, previously under-evaluated
        dimensions such as video-guided tasks, grounding uncertainty, SMS-to-webpage
        fraud, and prompt-injection safety.
      what_remains_open: Comparability of results across benchmarks with different
        protocols, generalization from controlled settings to real-world deployment,
        and evaluation of multi-step trajectories rather than single-step actions.
    - line: Reinforcement learning and online adaptation
      what_it_solves: Improve GUI agent task completion through verifiable task synthesis
        for online RL or autonomous evaluation as a noisy reward, addressing data
        scarcity and reward engineering.
      what_remains_open: Robustness of noise-corrected reward models across diverse
        task distributions, coverage of synthesized tasks for long-tail scenarios,
        and safety implications of online exploration in live environments.
    - line: Context management and long-horizon planning
      what_it_solves: Mitigate history overflow and loss of critical information in
        long mobile GUI tasks by treating context management as first-class actions
        and structuring memory.
      what_remains_open: Transferability of structured context fields to tasks with
        rapidly changing UI states, and the computational overhead of proactive context
        management in resource-constrained settings.
    - line: Human demonstration to agent guidance
      what_it_solves: Automatically convert raw human screen recordings and logs into
        multimodal tutorials that improve both human learning and GUI agent planning
        and generalization.
      what_remains_open: Adaptation of tutorial generation to highly dynamic or personalized
        interfaces, and the long-term effect of tutorial-induced biases on agent exploration.
    - line: Agent safety and robustness evaluation
      what_it_solves: Expose domain-conditioned vulnerabilities of computer-using
        agents to hand-crafted prompt injections, and audit the reproducibility of
        prior red-teaming results.
      what_remains_open: Generalization of safety hardening across domains (browser
        vs. coding), coverage of RL-optimized injection strings, and integration of
        adaptive attack mitigation during agent execution.
    consensus:
    - Vision-language models serve as the backbone for GUI agents, enabling perception
      and action grounding from screenshots and instructions.
    - Task success rate remains the primary metric, but there is growing recognition
      that it must be complemented by uncertainty, safety, and robustness measures.
    - High-quality benchmarks are essential for driving progress, and papers frequently
      pair a new benchmark with a method contribution.
    - Learning from human experience or autonomous feedback is a promising direction
      to reduce manual annotation and improve generalization.
    disagreements:
    - 'Evaluation granularity: some works focus on single-step grounding accuracy,
      while others emphasize multi-step task completion.'
    - 'Training signal: approaches vary between supervised fine-tuning on curated
      trajectories, online RL with environment rewards, and RL with noisy autonomous
      evaluators.'
    - 'Safety scope: safety is evaluated in browser-based tasks in one work but shown
      to fail in coding domains, revealing a rift between domain-specific and cross-domain
      safety claims.'
    - 'Uncertainty handling: one benchmark explicitly quantifies grounding uncertainty,
      while other methods do not incorporate uncertainty estimation into agent decision-making.'
    open_questions:
    - Can uncertainty quantification methods that rank well on open-weight models
      transfer to closed-source agents without re-evaluation?
    - How can online RL for GUI agents be scaled while maintaining safety constraints,
      especially when the synthesized tasks may not cover all critical failure modes?
    - What mechanisms enable proactive context management to generalize beyond the
      mobile domain to dynamic web or desktop environments?
    - How complete are current safety benchmarks in covering the full attack surface,
      and what is the impact of optimized adversarial strings that were not reproduced?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准驱动的能力评估
      解决的问题: 在视频引导任务、grounding不确定性、短信到网页欺诈、提示注入安全等先前评估不足的维度上系统评估GUI代理。
      尚未覆盖: 不同协议下基准结果的可比性，从受控环境到真实部署的泛化，以及多步轨迹而非单步动作的评估。
    - 路线: 强化学习与在线适应
      解决的问题: 通过可验证任务合成进行在线RL，或以自主评估作为噪声奖励来提升GUI代理任务完成率，解决数据稀缺和奖励工程问题。
      尚未覆盖: 噪声校正奖励模型在多样化任务分布上的鲁棒性，合成任务对长尾场景的覆盖，以及在线探索在真实环境中的安全影响。
    - 路线: 上下文管理与长时域规划
      解决的问题: 通过将上下文管理作为一等动作并结构化记忆，缓解长时域移动GUI任务中的历史信息溢出和关键信息丢失问题。
      尚未覆盖: 结构化上下文字段在UI状态快速变化的任务中的迁移性，以及主动上下文管理在资源受限环境中的计算开销。
    - 路线: 人类演示到代理指导
      解决的问题: 将原始人类屏幕录制和日志自动转化为多模态教程，同时提升人类学习和GUI代理的规划与泛化能力。
      尚未覆盖: 教程生成对高度动态或个性化界面的适应能力，以及教程引入的偏差对代理探索的长期影响。
    - 路线: 代理安全与鲁棒性评估
      解决的问题: 揭露计算机使用代理在手工提示注入下的领域条件漏洞，并审计先前红队结果的可重复性。
      尚未覆盖: 安全加固跨领域（浏览器与编码）的泛化，RL优化注入字符串的覆盖，以及代理执行期间自适应攻击缓解的集成。
    共识:
    - 视觉语言模型是GUI代理的基座，负责从截图和指令中进行感知和动作grounding。
    - 任务成功率仍是主要指标，但越来越多工作认识到需要结合不确定性、安全性和鲁棒性度量。
    - 高质量基准对推动进展至关重要，论文通常同时提出新基准和方法贡献。
    - 从人类经验或自主反馈中学习是减少人工标注并提升泛化能力的有前景方向。
    分歧:
    - 评估粒度：部分工作关注单步grounding准确性，而另一些注重多步任务完成。
    - 训练信号：方法在精选轨迹的监督微调、利用环境奖励的在线RL和噪声自主评估器RL之间分化。
    - 安全范围：一项工作在浏览器任务中评估安全，但另发现编码领域安全脆弱，揭示领域特定与跨领域安全主张之间的裂痕。
    - 不确定性处理：一项基准显式量化grounding不确定性，而其他方法未将不确定性估计融入代理决策。
    开放问题:
    - 在开源权重模型上表现良好的不确定性量化方法能否不经重新评估就迁移到闭源代理？
    - 在合成任务可能未覆盖所有关键失败模式的情况下，如何安全地扩展GUI代理的在线RL？
    - 主动上下文管理如何泛化到移动领域之外的动态网页或桌面环境？
    - 当前安全基准在覆盖全部攻击面方面有多完整？未复现的优化对抗字符串会产生何种影响？
