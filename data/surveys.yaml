    - 路线: 运行时技能库与可回放记忆基础设施
      解决的问题: 复用经过验证的GUI流程和多模态视觉工件，以降低token成本、执行时间与UI定位错误。
      尚未覆盖: 复用受确定性适用性限制；模糊或不兼容步骤会被拒绝；跨应用覆盖与长期维护尚未证明。
    - 路线: 数据高效与替代生成式GUI智能体
      解决的问题: 减少昂贵人工标注，通过弱监督、课程校准或块级扩散扩展GUI定位与导航的模型选择。
      尚未覆盖: 样本效率、生成速度或保真度与跨平台鲁棒性之间的权衡未解决；若干局限未明确报告。
    - 路线: GUI状态过渡的诊断评测
      解决的问题: 隔离测试模型是否理解状态验证、来源追踪与上下文感知控制，而不只看单帧定位或最终任务成功。
      尚未覆盖: 离线、仅Linux、仅五种动作类型；无法捕捉异步时序或实时交互动态。
    共识:
    - 主流焦点是把环境交互到模型改进的闭环打通，使用任务成功或工件验证轨迹，而不是静态指令跟随。
    - 多模态视觉被视为一等信息：保留图形或截图可改善UI元素识别与工作流状态验证。
    - 多个框架都倾向把策略学习与执行基础设施解耦：代理、容器、实时浏览器或Harness适配器记录交互供SFT/RL使用。
    - 降低成本是共同关切：弱监督、少量初始化轨迹和可回放记忆都指向更便宜的数据复用或更低的token/时间消耗。
    分歧:
    - 表示方式不同：块级扩散生成GUI动作，相对于在Harness/API代理内进行策略优化。
    - 监督信号不同：未标注截图弱监督、在线任务成功RL、工件验证轨迹和离线人工标注过渡诊断并存。
    - 交互模式不同：运行时技能/记忆复用与训练新的端到端GUI/代码策略。
    - 评测目标不同：桌面/网页基准上的最终任务成功率，相对于步骤级GUI过渡理解。
    - 部署场景不同：实时网站、Linux/Windows桌面环境和容器化Harness。
    开放问题:
    - 经过RL训练后错误恢复仍较弱，如何系统改进？
    - 报告中的Linux或网页桌面设置和预定义动作类型之外，泛化能力如何？
    - 确定性、预先验证轨迹之外，运行时技能/记忆复用还能否保持可靠并规模化？
    - 哪些设计选择使某些Harness明显更容易训练？
    - 许多2026年系统缺少明确局限声明或独立复现细节，如何补足验证缺口？
