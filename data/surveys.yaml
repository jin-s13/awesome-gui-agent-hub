    - line: Open problem and gap mapping
      what_it_solves: Converts broad coverage into concrete gaps such as selective
        uncertainty transfer, domain-conditioned safety, benign recall under sanitized
        cues, and long-horizon context management.
      what_remains_open: Which gaps should be prioritized; missing systematic prioritization
