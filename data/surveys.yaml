    - GUI/计算机使用智能体普遍以截图或界面状态为观测，并以视觉-语言模型为骨干生成交互动作。
    - 任务成功或可执行验证是主要评测信号，常见平台包括OSWorld、ScienceBoard、MobileWorld、MemGUI-Bench及自定义浏览器/欺诈任务。
    - 近期工作越来越重视可靠性：上下文管理、harness优化、奖励校正、不确定性估计和安全红队审计都聚焦于提升智能体可信度。
