  related_work_outline:
  - 'Mainstream direction: Building task suites and environments for GUI/computer-use
    agents beyond static web pages, including real desktop OS, dynamic short-video,
    and video-guided interactions, alongside verifiable task synthesis, harness optimization,
    and uncertainty-aware evaluation.'
  - 'Shared research pattern: Each line uses executable tasks with baseline VLM agents
    and human or rule-based scoring; fine-grained metrics expose sub-goal, observation
    efficiency, and grounding reliability gaps hidden by aggregate success.'
  - 'Key differences: The assessed setting ranges from desktop GUI+CLI workflows to
    dynamic browser/video-guided tasks and single-step GUI grounding; task creation,
    supervision, and metric focus differ accordingly.'
  - 'Trend evolution: The available evidence is concentrated in 2026, so the trend
    is within the current frontier: expanding from static GUI benchmarks toward dynamic,
    verifiable, and reliability-aware evaluations of computer-use agents.'
  - 'Open questions: Cross-platform and multi-step trajectory generalization, metric-to-decision
    alignment, observation control, and uncertainty transfer remain unresolved; missing
    limitation details for several top papers are verification gaps.'
  related_work_outline_zh:
  - 主流方向：从静态网页任务扩展到真实桌面、动态短视频与视频引导的GUI自动化评测，并引入可验证任务合成、harness优化和不确定性感知评估。
  - 研究共性：使用可执行任务套件、VLM代理基线与规则或人类评分；细粒度指标揭示子目标、观察效率与grounding可靠性等总分掩盖的失败模式。
  - 关键差异：评测环境从桌面GUI+CLI到动态浏览器/视频引导任务和单步GUI grounding；任务来源、监督信号与指标侧重不同。
  - 趋势演进：证据集中在2026年，趋势位于当前前沿；从静态GUI基准向动态、可验证和可靠性感知的计算机使用代理评测扩展。
  - 开放问题：跨平台与多步轨迹泛化、指标与决策对齐、观察控制、不确定性迁移仍未解决；若干论文缺少局限性说明，构成验证缺口。
  literature_review:
    line_of_work_matrix:
    - line: Real-world and dynamic GUI task suite design
      what_it_solves: Creates desktop, dynamic short-video, and video-guided interactive
        tasks that test agents beyond static pages, with rule-based checkpoints, human
        comparisons, and information-cost metrics.
      what_remains_open: Task coverage is bounded by specific platforms and interaction
        modes; multi-step trajectories and cross-platform transfer are not established.
    - line: Verifiable task synthesis and harness control
      what_it_solves: Produces verifiable training/evaluation tasks, optimizes execution
        harnesses, and uses weak supervision or self-improvement to reduce annotation
        cost and improve frozen/open models.
      what_remains_open: Held-out ranking stability and gains across implementations,
        compute budgets, and benchmark transfers remain only partially demonstrated.
    - line: Fine-grained and uncertainty-aware evaluation
      what_it_solves: Probes sub-goal completion, observation control, grounding uncertainty,
        conformal click regions, and ranking transfer beyond aggregate success.
      what_remains_open: UQ transfer weak across model classes/interfaces; current
        benchmarks often stop at single-step grounding, so decision-level and multi-step
        value is not covered.
    consensus:
    - Realistic GUI automation benchmarks are moving toward multi-step, executable
      environments with deterministic or verifiable scoring rather than static single-action
      labels.
    - Fine-grained metrics and uncertainty/verification signals are necessary because
      aggregate success can conceal observation inefficiency, sub-goal gaps, and grounding
      failures.
    - 'Visual grounding and observation control are central axes: visual artifacts
      improve UI identification, while dynamic screen tasks reveal systematic over/under-observation.'
    disagreements:
    - 'Task environments differ: desktop OS workflows with CLI plus GUI, browser-based
      dynamic short-video platforms, video-guided interactive tasks, and single-step
      GUI grounding.'
    - 'Supervision and task construction differ: human-authored desktop tasks, synthesized
      verifiable RL tasks, weakly supervised use of unannotated screenshots, and post-hoc
      UQ over existing datasets.'
    - 'Metric focus differs: success or pass rate, sub-goal completion, cost-accuracy
      and information efficiency, keyframe QA accuracy, and uncertainty ranking/coverage
      calibration.'
    - 'Evaluation levels differ: multi-step agent trajectories are benchmarked in
      some settings, while uncertainty evaluation is currently limited to single-step
      executable grounding.'
    open_questions:
    - Can findings from desktop, short-video, and video-guided tasks transfer across
      web, mobile, and other OS automation settings?
    - Which fine-grained metrics predict downstream user utility in multi-step agent
      trajectories and closed-source deployment?
    - Can observation control and uncertainty transfer be improved without target-specific
      reranking or interface-specific calibration?
    - Are verifiable task synthesis and harness optimization gains stable across different
      implementations, compute budgets, and held-out benchmarks?
    - Several top papers omit detailed limitations, code, or dataset artifacts in
      the evidence packet, so broader robustness remains a verification gap.
  literature_review_zh:
    研究路线矩阵:
    - 路线: 真实与动态GUI任务套件设计
      解决的问题: 构建桌面、动态短视频和视频引导的交互任务，超出静态页面，使用规则检查点、人类对比与信息成本指标。
      尚未覆盖: 任务覆盖受特定平台与交互模式限制；多步轨迹与跨平台迁移尚未确立。
    - 路线: 可验证任务合成与harness控制
      解决的问题: 生成可验证训练/评测任务，优化执行harness，利用弱监督或自改进降低标注成本并改善冻结或开源模型。
      尚未覆盖: 保留集排名稳定性和跨实现、算力预算、基准迁移的收益仅被部分验证。
    - 路线: 细粒度与不确定性感知评测
      解决的问题: 在总分之外考察子目标完成、观察控制、grounding不确定性、共形点击区域和排名迁移。
      尚未覆盖: UQ跨模型类/接口迁移弱；当前不确定性评测通常停在单步grounding，未覆盖决策级和多步价值。
    共识:
    - 现实GUI自动化基准正在转向可执行、多步的环境，并使用确定性或可验证评分，而非静态单动作标签。
    - 细粒度指标与不确定性/验证信号是必要的，因为总分可能掩盖观察低效、子目标差距和grounding失败。
    - 视觉grounding与观察控制是核心轴：视觉工件改善UI识别，而动态屏幕任务暴露系统性过度/不足观察。
    分歧:
    - 任务环境不同：桌面OS中GUI与CLI结合的工作流、基于浏览器的动态短视频平台、视频引导交互任务以及单步GUI grounding。
    - 监督与任务构建不同：人工编写的桌面任务、合成可验证RL任务、利用未标注截图的弱监督，以及在已有数据集上的后验UQ。
    - 指标侧重不同：成功率或通过率、子目标完成、成本-准确性与信息效率、关键帧QA准确率、不确定性排名与覆盖校准。
    - 评测层级不同：部分设置覆盖多步代理轨迹，而不确定性评测当前仅限于单步可执行grounding。
    开放问题:
    - 桌面、短视频和视频引导任务的发现能否迁移到web、移动端和其他OS自动化设置？
    - 哪些细粒度指标能预测多步代理轨迹和闭源部署中的下游用户效用？
    - 观察控制与不确定性迁移能否在不依赖目标特定重排名或接口特定校准的情况下得到改善？
    - 可验证任务合成和harness优化的收益在不同实现、算力预算与保留基准上是否稳定？
    - 证据包中若干论文缺少详细局限、代码或数据集工件，因此更广泛鲁棒性仍属验证缺口。
