  literature_review:
    line_of_work_matrix:
    - line: Real-world desktop task benchmarking
      what_it_solves: Provides large-scale multi-application tasks mixing GUI and
        CLI with deterministic fine-grained scoring to reveal sub-goal differences
        hidden by Pass@1.
      what_remains_open: Whether findings transfer to other operating systems, platforms,
        or application sets; limitation evidence is not reported.
    - line: Multimodal skill libraries for computer use
      what_it_solves: Improves GUI grounding and workflow state verification by retrieving
        visual and textual procedural knowledge at task time.
      what_remains_open: Whether skill gains transfer across applications, remain
        stable without heavy manual upkeep, or extend beyond the reported evaluation
        distribution.
    - line: Dynamic living-screen benchmarks
      what_it_solves: Evaluates agents on short-video-style interfaces where content
        changes between actions and information acquisition has cost.
      what_remains_open: Observation-control capability under cost constraints and
        generalization to other dynamic interface types.
    - line: Interaction-space grounding datasets
      what_it_solves: Fills the missing drag-based GUI interaction coverage with large-scale
        screenshot-task data and fine-tuning.
      what_remains_open: Evidence that fine-tuned models improve downstream computer-use
        tasks beyond held-out evaluation is still limited.
    - line: Efficient repeated-task replay
      what_it_solves: Reduces recurring-task latency and per-step language model calls
        by compiling verified successful runs into screen-checked state-machine programs.
      what_remains_open: Robustness to interface drift, long-term program maintenance,
        and user-specific workflow variation.
    - line: Diffusion-based GUI agent architectures
      what_it_solves: Trains block-wise diffusion vision-language agents for GUI grounding
        and navigation as an alternative to autoregressive generation.
      what_remains_open: Scaling and deployment cost, generalization beyond reported
        benchmarks, and absence of documented limitations.
    - line: Automated web environment reconstruction
      what_it_solves: Builds source-grounded, reusable web task environments and interaction
        trajectories from real URLs for evaluation and fine-tuning.
      what_remains_open: Per-site initial setup and authorization remain; fidelity
        and downstream transfer across wild web sites need more evidence.
    consensus:
    - Real application coverage is expanding beyond static or click-only tasks to
      multi-application, GUI+CLI, dynamic, drag, and video-guided settings.
    - Fine-grained and cost-aware evaluation reveals capability differences that a
      single success rate or Pass@1 would hide.
    - Multimodal or procedural knowledge, whether retrieved as skills, extracted as
      keyframes, or compiled as replay programs, improves task success over text-only
      or unassisted baselines.
    - Frontier agents still fall short of human-level reliability, especially in dynamic
      observation and information-efficiency settings.
    - Task-specific training data, interaction trajectories, or skill artifacts can
      improve downstream GUI agent performance.
    disagreements:
    - 'Evaluation target: broad desktop task success with sub-goal scoring versus
      cost-accuracy on dynamic interfaces versus grounding/navigation benchmarks versus
      reconstructed environment fidelity.'
    - 'Representation: explicit multimodal skill libraries, compiled state-machine
      replay, block-wise diffusion models, and source-grounded environment reconstruction
      encode knowledge and generate actions in different ways.'
    - 'Interaction scope: some work covers drag or GUI+CLI, while others focus on
      click-oriented, short-video, or video-guided workflows.'
    - 'Supervision: zero-shot frontier-model evaluation coexists with fine-tuning
      on generated interaction trajectories or task datasets.'
    - 'Deployment setting: online step-by-step language-model reasoning differs from
      precompiled fast replay, with some work optimizing latency and others optimizing
      completion accuracy.'
    open_questions:
    - On dynamic interfaces, what observation-control mechanism would reduce over-
      and under-observation without violating cost budgets?
    - Do multimodal skills, replay programs, and fine-tuned trajectories generalize
      to unseen applications, OS versions, or interaction patterns?
    - Several limitation fields and reproducibility signals are missing; what assumptions
      and failure modes remain undocumented in the current evidence?
    - Can source-grounded environment reconstruction lower per-site authorization
      and maintenance while preserving task fidelity at scale?
    - Are efficiency gains from replay or diffusion-based decoding robust to interface
      drift, unexpected states, and user-specific workflows?
  literature_review_zh:
