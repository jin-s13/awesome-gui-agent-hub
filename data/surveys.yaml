  related_work_outline_zh:
  - 主流方向：构建真实世界GUI智能体与基准，超越静态点击任务，覆盖桌面、移动、网页以及GUI+CLI、拖拽、动态屏幕和视频引导交互，并采用细粒度与效率感知评测。
  - 研究共性：先构建应用、数据或环境，评测多模态智能体，识别定位、观察控制、重复任务延迟或平台保真度等缺口，再提出技能库、关键帧提取、重放、扩散模型或环境重建等干预。
  - 关键差异：目标场景不同，包含桌面OS、短视频动态界面、拖拽、视频引导任务和真实网页重建；方案从显式多模态技能、重放程序到架构变化和生成训练数据；评测分别侧重Pass@1、子目标、成本-准确性、grounding/navigation和环境保真度。
  - 趋势演进：证据集中在2026年，趋势属于当前前沿：任务从单应用点击扩展到多应用、多模态、动态和视频引导应用；指标从二元成功转向细粒度和效率；方法从一次性代理运行转向可复用技能、重放程序和轨迹微调。
