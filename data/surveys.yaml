  literature_review:
    line_of_work_matrix:
    - line: Real-world GUI task benchmarking
      what_it_solves: Provides standardized, multi-application evaluation suites (e.g.,
        macOS, short-video, drag-based) to measure agent capabilities beyond simple
        click accuracy.
      what_remains_open: Benchmarks are often limited to specific platforms or interaction
        types; cross-application generalization and alignment with human performance
        on open-ended tasks are unverified.
    - line: Multimodal skill libraries for computer use
      what_it_solves: Enhances task success and efficiency by reusing visual-textual
        skill artifacts, reducing the need for agents to re-discover UI workflows.
      what_remains_open: Skill construction currently requires manual authoring or
        UI exploration; automatic skill discovery, maintenance, and transfer across
        applications remain open.
    - line: Execution optimization via program replay
      what_it_solves: Compiles successful agent runs into state-machine programs,
        enabling 8–13× faster task repetition without per-step language model calls.
      what_remains_open: Replay robustness under UI changes, and generalization to
        unseen tasks or environments, are not yet demonstrated; store-time verification
        adds overhead.
    - line: History-aware and visually grounded action critique
      what_it_solves: Mitigates short-sighted planning and coordinate errors by summarizing
        past achievements and verifying actions against the current screenshot.
      what_remains_open: Integration with diverse agent architectures and scaling
        to multi-step reasoning chains are not evaluated; reliance on trajectory training
        data may limit adaptability.
    - line: Dynamic and video-guided GUI interaction
      what_it_solves: Extends GUI agents to interfaces where content changes between
        actions, and to tasks specified by video demonstrations, using keyframe extraction
        or live observation.
      what_remains_open: Observation control (over- and under-observation) remains
        a critical failure mode; real-time video understanding and long-form task
        grounding are still challenging.
    consensus:
    - Vision-language models form the backbone of current GUI agents, but their raw
      performance is insufficient for complex, multi-step real-world tasks.
    - Standardized benchmarks are essential for reproducible progress; however, benchmark
      design choices (static vs. dynamic, click vs. drag) heavily influence observed
      agent capabilities.
    - Efficiency and accuracy can be improved by external knowledge (skills) or by
      reusing past experiences, yet the cost of constructing and maintaining such
      knowledge is non-trivial.
    - Foregrounding visual information (screenshots, figures) is consistently more
      effective than text-only representations for UI grounding and action verification.
    disagreements:
    - 'Evaluation granularity: some works use binary task success, while others employ
      fine-grained multi-checkpoint scoring or cost-accuracy curves.'
    - 'Interaction modality: the field is split between click-only, drag-and-drop,
      GUI+CLI, and video-guided task definitions, with no unified interaction model.'
    - 'Efficiency approach: one line compiles runs into deterministic programs, another
      uses retrievable skill artifacts; the trade-off between speed and flexibility
      is unresolved.'
    - 'Dynamic interface handling: static-screenshot agents assume a stable screen,
      while living-screen agents model continuous content change; the necessity of
      real-time observation control is debated.'
    open_questions:
    - How can GUI agents generalize across diverse applications and platforms without
      per-task fine-tuning or manual skill authoring?
    - What is the optimal observation frequency for dynamic interfaces, and how can
      agents learn to request information efficiently rather than over- or under-observe?
    - Can safety and trustworthiness be guaranteed when agents interact with real
      financial, authentication, or system-level UIs, as highlighted by fraud detection
      scenarios?
    - How can long-horizon task progress be tracked and verified without relying on
      brittle, hand-crafted state-machine checks?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 真实世界 GUI 任务基准测试
      解决的问题: 提供标准化、多应用评估套件（如 macOS、短视频、拖拽），衡量代理在简单点击准确率之外的能力。
      尚未覆盖: 基准通常限于特定平台或交互类型；跨应用泛化及在开放式任务中与人类表现的对齐尚未验证。
    - 路线: 面向计算机使用的多模态技能库
      解决的问题: 通过复用视觉-文本技能工件提升任务成功率和效率，减少代理重新探索 UI 工作流的需求。
      尚未覆盖: 技能构建目前依赖人工编写或 UI 探索；自动发现、维护及跨应用迁移技能仍为开放问题。
    - 路线: 基于程序重放的执行优化
      解决的问题: 将成功的代理运行编译为状态机程序，实现 8–13 倍的任务重复加速，无需每步调用语言模型。
      尚未覆盖: UI 变化下的重放鲁棒性，以及对未见任务或环境的泛化尚未验证；存储时验证增加额外开销。
    - 路线: 历史感知与视觉基础的动作评判
      解决的问题: 通过总结过去成就并对照当前截图验证动作，缓解短视规划和坐标错误。
      尚未覆盖: 与多样化代理架构的集成及多步推理链的扩展未评估；依赖轨迹训练数据可能限制适应性。
    - 路线: 动态与视频引导的 GUI 交互
      解决的问题: 将 GUI 代理扩展到内容在动作间变化的界面，以及通过关键帧提取或实时观察处理视频指定任务。
      尚未覆盖: 观察控制（过度与不足观察）仍是关键失败模式；实时视频理解和长程任务基础仍然是挑战。
    共识:
    - 视觉语言模型是当前 GUI 代理的骨干，但其原始性能不足以完成复杂的多步真实世界任务。
    - 标准化基准对可复现进展至关重要；然而，基准设计选择（静态 vs. 动态，点击 vs. 拖拽）严重影响观察到的代理能力。
    - 通过外部知识（技能）或复用过往经验可以提升效率与准确性，但构建和维护此类知识的成本不可忽视。
    - 视觉信息（截图、图形）在 UI 定位和动作验证中始终比纯文本表示更有效。
    分歧:
    - 评估粒度：部分工作使用二元任务成功，另一些采用细粒度多检查点评分或成本-准确性曲线。
    - 交互模态：领域在仅点击、拖拽、GUI+CLI 和视频引导任务定义之间分裂，缺少统一的交互模型。
    - 效率途径：一条路线将运行编译为确定性程序，另一条使用可检索技能工件；速度与灵活性之间的权衡尚未解决。
    - 动态界面处理：静态截图代理假设屏幕稳定，而动态屏幕代理建模持续内容变化；实时观察控制的必要性存在争议。
