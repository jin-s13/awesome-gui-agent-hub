  related_work_outline_zh:
  - 主流方向：构建并评测面向真实桌面、网页、移动、短视频、拖拽及安全场景的GUI/计算机使用智能体，基准强调细粒度子目标与任务级证据。
  - 研究共性：以前沿VLM/LLM智能体为基线，设计新任务套件，并通过可复用技能记忆、关键帧选择、重放编译或视觉校验进行改进。
  - 关键差异：评测目标从静态桌面任务到动态界面、视频引导任务、拖拽交互和安全判断不等；干预层次也包括基准、技能库、状态机编译和评判模型等不同路线。
