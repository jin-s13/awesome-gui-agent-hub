  literature_review:
    line_of_work_matrix:
    - line: End-to-end GUI/computer-use agent training and orchestration frameworks
      what_it_solves: Turns policies into runnable agents that execute multi-step
        computer tasks across websites, desktops, and harnesses; reduces annotated
        data needs through weak supervision, online RL, or verifiable rewards.
      what_remains_open: Error recovery remains weak after training; harness design
        affects trainability; cross-environment deployment and independent reproduction
        outside reported benchmarks are not yet demonstrated.
    - line: Multimodal skill and memory augmentation for GUI agents
      what_it_solves: Improves UI grounding and workflow verification by storing structured
        visual/text skill artifacts or action-grounded image crops rather than relying
        only on full screenshots.
      what_remains_open: Generalization across applications and operating systems;
        differences between offline evaluation and live interaction; independent comparison
        of memory representations is missing.
    - line: Diagnostic evaluation of GUI transitions and failure modes
      what_it_solves: Measures whether models understand action-induced state changes,
        source tracking, and task-relevant GUI transitions instead of evaluating only
        end-task success.
      what_remains_open: Benchmarks are offline and limited to Linux or predefined
        action types; step-level diagnostics do not yet establish predictive validity
        for asynchronous, real-time GUI interaction.
    - line: Safety and red-teaming infrastructure for computer-using agents
      what_it_solves: Audits prompt injection and skill injection resistance across
        browser and coding surfaces, and checks whether previously published attack
        results are reproducible.
      what_remains_open: Only hand-crafted attack templates were tested; RL-optimized
        injection strings were not reproduced; safety hardening appears domain-conditioned
        and does not generalize across surfaces.
    consensus:
    - Current systems emphasize multimodal visual grounding, using screenshots and
      image-derived representations rather than relying only on DOM or accessibility
      metadata.
    - 'Training and evaluation are shifting toward executable agent loops: policy
      rollouts, trajectory-level rewards, and live environment interaction instead
      of static single-step prediction.'
    - Memory, context management, and skill/tool retrieval are recognized as core
      components for multi-step GUI task performance.
    - Open-source frameworks aim to lower data and infrastructure cost while matching
      larger proprietary agents, but verification remains mostly benchmark-limited.
    disagreements:
    - 'Interaction representation differs: some systems act via native screenshots
      and keyboard/mouse only, while others wrap harnesses or call tools, affecting
      controllability and trainability.'
    - 'Supervision and data scale differ: weak supervision from unannotated screenshots
      and tiny annotation budgets versus cloud-scale verifiable rollouts and online
      RL.'
    - 'Evaluation emphasis differs: end-task success metrics, step-level transition
      understanding, and adversarial attack success rates are not directly comparable.'
    - 'Memory design differs: full-image visual memory, action-grounded local crops,
      and hierarchical multimodal skill libraries make different assumptions about
      which visual context should be retained.'
    open_questions:
    - Can RL-trained GUI agents substantially improve error recovery, given evidence
      that recovery remains weak after training?
    - Does safety hardening transfer across application domains, especially from browser
      tasks to coding or tool-use tasks?
    - Do offline step-level diagnostics of GUI transition understanding predict live
      end-task reliability under asynchronous timing and delays?
    - How do these systems generalize across operating systems, action vocabularies,
      and independently reproduced infrastructure settings?
