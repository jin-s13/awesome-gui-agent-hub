      解决的问题: 构建多应用macOS任务，使用确定性规则和细粒度子目标评分，揭示Pass@1掩盖的能力差异。
      尚未覆盖: 跨平台有效性未验证；证据限于macOS桌面，尚未覆盖移动、网页和OS异质性以及轨迹级失败边界。
    - 路线: 交互方式与动态界面基准设计
      解决的问题: 将评估从点击扩展到拖拽、视频引导任务和动态短视频界面，考察观察时序与控制能力。
      尚未覆盖: 基准具有平台或模态特异性；缺少技能或分数在交互方式和快速变化界面之间迁移的证据。
    - 路线: 指标与可靠性压力测试
      解决的问题: 在任务总分之外检验不确定性排序、子目标完成、成本-准确率和共形空间安全。
      尚未覆盖: 不确定性量化证据主要覆盖单步grounding，而非多步代理轨迹；跨模型和跨界面排名迁移弱，需重新评估。
    - 路线: 训练信号与任务合成流水线
      解决的问题: 通过可验证合成任务、未标注截图弱监督或多模态技能工件提升样本效率和代理控制。
      尚未覆盖: 主要在OSWorld、ScienceBoard、CUA-World和OSExpert-Eval上验证；对新提出的动态与拖拽基准泛化性未证实。
    - 路线: 视频引导任务的桥接
      解决的问题: 通过任务相关关键帧提取，把视频理解连接到GUI代理的交互任务。
      尚未覆盖: VideoQA表现有提升，但关键帧提取是否迁移到动态短视频或多步桌面自动化仍缺少证据。
    共识:
    - 领域正在转向可执行、可验证的任务评估：规则检查、子目标评分和成本-准确率指标被用来揭示总分掩盖的失败。
    - 多项工作一致认为当前代理在观察控制和细粒度定位上存在差距，尤其在动态界面和拖拽、视频引导等更丰富交互方式下。
    - 证据一致显示加入相关视觉、技能或任务特定训练上下文能提升计算机使用代理性能，但榜单提升未必区分模型能力与任务分布拟合。
    分歧:
    - 评测设置不同：静态单步grounding数据集、多步macOS桌面工作流、动态短视频平台和拖拽交互基准各有不同假设。
    - 监督假设不同：未标注截图弱监督、可验证合成RL任务、人工编写多模态技能库和后验不确定性校准依赖不同的数据与标注条件。
