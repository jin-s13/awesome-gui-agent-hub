  literature_review:
    line_of_work_matrix:
    - line: End-to-end training frameworks for GUI agents
      what_it_solves: Providing reproducible RL infrastructure for training visual
        agents online in live environments (browsers, desktops) with scalable rollout
        management.
      what_remains_open: Trained agents still exhibit weak error recovery; some inference
        harnesses are substantially harder to learn, and generalization to different
        operating systems and task domains is limited.
    - line: Multimodal skill and memory augmentation
      what_it_solves: Enhancing agent understanding of GUI state transitions and long-horizon
        tasks by storing multi-modal skill artifacts or action-grounded visual memory
        crops.
      what_remains_open: The trade-offs between full-image memory and local crops
        are not fully understood; constructing skill libraries requires manual authoring
        or live exploration, and scalability beyond a few applications is unproven.
    - line: Data-efficient agent training
      what_it_solves: Reducing dependence on expensive human annotations by leveraging
        weakly supervised signals from unlabeled screenshots and curriculum learning.
      what_remains_open: Whether the weak supervision quality transfers to complex,
        dynamic GUI scenarios remains unclear; validation is limited to a narrow set
        of benchmarks.
    - line: Diagnostic and safety benchmarks
      what_it_solves: Evaluating fine-grained understanding of GUI transitions (temporal
        ordering, action inference) and safety vulnerabilities, filling blind spots
        left by end-to-end success metrics.
      what_remains_open: Offline benchmarks miss real-time dynamics; safety evaluations
        are domain-conditioned and do not reproduce optimized red-teaming strings,
        leaving cross-domain robustness unverified.
    consensus:
    - Visual input is essential for GUI agents, but raw full-image history alone can
      worsen action-level errors, so memory must be carefully managed.
    - Online RL training on live websites or desktops is a highly effective way to
      improve agent performance, often surpassing static demonstration-based approaches.
    - Diagnostic benchmarks that isolate specific capabilities (e.g., temporal ordering,
      action recognition) are needed to complement end-to-end task success evaluation.
    - 'Safety hardening is domain-conditioned: agents robust against browser prompt
      injection may remain vulnerable to skill injection in coding tasks, indicating
      no universal safety guarantee.'
    disagreements:
    - 'Visual memory representation: full-image history vs. action-grounded local
      crops vs. multi-modal skill artifacts that retain figures alongside text.'
    - 'Training paradigm: some works use online multi-turn RL with minimal supervised
      initialization, while others employ large-scale offline supervised pre-training
      only then fine-tune with RL, and another uses a two-stage curriculum from unlabeled
      data to RL calibration.'
    - 'Evaluation of safety: hand-crafted attack templates show zero attack success
      rate on frontier agents, but prior work reported high success with RL-optimized
      injection strings, and the same hardened agents fail on coding tasks, suggesting
      disagreement on the true threat surface.'
    open_questions:
    - How can GUI agents be trained to robustly recover from errors without extensive
      human intervention or environment resets?
    - What is the optimal visual memory design that balances state tracking with action
      grounding, and can it be learned automatically rather than hand-crafted?
    - Can safety hardening be made domain-agnostic so that resilience learned in one
      application context transfers to others without catastrophic forgetting of defenses?
    - Do the current offline diagnostic benchmarks correlate with real-world online
      agent performance, or do they miss critical dynamic interaction failures?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端GUI代理训练框架
      解决的问题: 提供可复现的RL基础设施，支持在真实环境（浏览器、桌面）中在线训练视觉代理，并管理可扩展的部署回滚。
      尚未覆盖: 训练后的代理错误恢复能力仍然较弱；某些推理框架更难学习，且向不同操作系统和任务领域的泛化有限。
    - 路线: 多模态技能与记忆增强
      解决的问题: 通过存储多模态技能工件或动作接地的视觉记忆裁剪，增强代理对GUI状态转换和长程任务的理解。
      尚未覆盖: 全图记忆与局部裁剪之间的权衡尚未完全理解；构建技能库需要人工编写或实时探索，且向少数应用之外的扩展性未经验证。
    - 路线: 数据高效代理训练
      解决的问题: 利用未标注截图的弱监督信号和课程学习，减少对昂贵人工标注的依赖。
      尚未覆盖: 弱监督质量是否能在复杂、动态的GUI场景中保持迁移效果尚不明确；验证仅限于少数基准。
    - 路线: 诊断与安全基准
      解决的问题: 评估GUI转换的细粒度理解（时序排序、动作推断）和安全漏洞，填补端到端成功指标留下的盲区。
      尚未覆盖: 离线基准无法捕捉实时动态；安全评估是领域条件的，且未复现优化红队字符串，导致跨领域鲁棒性未经验证。
    共识:
    - 视觉输入对GUI代理至关重要，但单纯的全图像历史可能加剧动作级错误，因此记忆必须精心管理。
    - 在真实网站或桌面上进行在线RL训练是提升代理性能的高效方法，通常优于基于静态演示的方法。
    - 需要能够隔离特定能力（如时序排序、动作识别）的诊断基准，以补充端到端任务成功率评估。
    - 安全加固是领域条件的：在浏览器提示注入上鲁棒的代理，在编码任务中仍可能对技能注入脆弱，表明不存在通用安全保障。
    分歧:
    - 视觉记忆表示：全图像历史 vs. 动作接地的局部裁剪 vs. 同时保留图形和文本的多模态技能工件。
    - 训练范式：一些工作使用极少监督初始化的在线多轮RL，另一些采用大规模离线监督预训练再微调，还有使用从未标注数据到RL校准的两阶段课程学习。
    - 安全评估：手工攻击模板在前沿代理上成功率为零，但先前工作使用RL优化注入字符串报告高成功率，且同一加固代理在编码任务上失败，表明对真实威胁面存在分歧。
    开放问题:
    - 如何训练GUI代理在没有大量人工干预或环境重置的情况下，从错误中鲁棒恢复？
    - 最优视觉记忆设计如何平衡状态追踪与动作接地，且能否自动学习而非手工设计？
    - 能否使安全加固领域无关，使得在一个应用上下文中学习的鲁棒性能够迁移到其他应用，而不会灾难性遗忘防御？
    - 当前的离线诊断基准是否与真实在线代理性能相关，还是它们遗漏了关键的动态交互失败？
