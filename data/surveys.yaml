  related_work_outline:
  - 'Mainstream direction: Real-world GUI/desktop/OS automation benchmarks are moving
    toward executable, app-rich task suites with fine-grained diagnostic scoring instead
    of only aggregate success.'
  - 'Shared research pattern: Work couples a new environment or task set with evaluation
    metrics that decompose task success into sub-goal, observation, grounding, or
    uncertainty signals.'
  - 'Key differences: Papers diverge in target setting (static desktop, dynamic short-video,
    video-guided tasks, single-step grounding), improvement locus (frozen-model harness/skill
    changes vs RL/weak supervision), and evaluation objective (pass rate, cost-accuracy,
    uncertainty coverage).'
  - 'Trend evolution: Available evidence is concentrated in the current frontier;
    the visible shift is from static GUI grounding benchmarks to dynamic, video-native,
    uncertainty-aware, and self-improving agent evaluation.'
  - 'Open questions: Do benchmark gains transfer to unseen interfaces and real user
    workflows, which metrics best track user utility, and how can evaluation avoid
    overfitting to specific suites?'
  related_work_outline_zh:
  - 主流方向：真实GUI/桌面/操作系统自动化基准正转向可执行、多应用任务集，并以细粒度诊断评分替代只报告总体成功率。
  - 研究共性：工作通常将新环境或任务集与评估指标结合，把成功率分解为子目标、观察、基础定位或不确定性信号。
  - 关键差异：目标设定（静态桌面、动态短视频、视频引导任务、单步基础定位）、改进方式（冻结模型的外部harness/技能 vs 强化学习/弱监督）和评估目标（通过率、成本-准确率、不确定性覆盖）存在差异。
  - 趋势演进：现有证据集中在当前前沿；可见变化是从静态GUI基础定位基准转向动态、视频原生、不确定性感知和自我改进的代理评估。
  - 开放问题：基准提升是否能迁移到未见过界面和真实用户工作流，哪种指标最能反映用户效用，以及如何避免对特定套件过拟合。
  literature_review:
    line_of_work_matrix:
    - line: Executable desktop/OS task suites with fine-grained success diagnostics
      what_it_solves: Comparable evaluation of multi-application, GUI-CLI desktop
        workflows beyond aggregate pass rates.
      what_remains_open: Coverage across operating systems and interface types, long-horizon
        reliability, and whether sub-goal diagnostics predict real user utility.
    - line: Dynamic and video-guided interface benchmarks
      what_it_solves: Evaluation of agents on interfaces that change between actions
        and require observation control or temporal keyframe understanding.
      what_remains_open: Current evidence is limited to short-video and curated browser
        settings; cost-accuracy metrics and generalization to other dynamic environments
        remain unproven.
    - line: Benchmark-driven agent improvement via harness, skill, or learning
      what_it_solves: Improving frozen or trained agents on existing suites through
        external skill/harness optimization, verifiable task synthesis, online RL,
        or weak supervision.
      what_remains_open: Held-out and cross-benchmark transfer stability, possible
        benchmark overfitting, and reliance on verifiable or annotated tasks.
    - line: Grounding uncertainty and calibration benchmarks
      what_it_solves: Measuring post-hoc uncertainty quality and spatial calibration
        for GUI grounding decisions.
      what_remains_open: Single-step grounding setup does not cover multi-step trajectory
        decision-making; cross-model and cross-interface transfer of uncertainty rankings
        is weak.
    consensus:
    - 'Aggregate success is insufficient: fine-grained sub-goal, observation, grounding,
      or uncertainty metrics reveal capability differences that pass rates hide.'
    - Realistic executable environments are central for GUI/OS agent evaluation, often
      with deterministic or verifiable scoring.
    - Current agents still show brittle observation control, weak cross-setting transfer,
      and imperfect calibration, leaving room for harness/skill and training improvements.
    - Frozen-model external improvements can yield substantial gains, suggesting evaluation
      should separate model capability from surrounding execution scaffolding.
    disagreements:
    - 'Evaluation target differs: static desktop task completion versus dynamic video-native
      observation control versus single-step grounding uncertainty.'
    - 'Improvement locus differs: external harness or skill modifications versus agent
      training via online RL or weak supervision from unannotated screenshots.'
    - 'Metric choice differs: pass@1 and task success versus cost-accuracy and information
      efficiency versus uncertainty ranking and conformal coverage.'
    - 'Deployment domain differs: macOS desktop applications, short-video browser
      environments, video-guided GUI tasks, and grounded GUI datasets create different
      assumptions about interactivity.'
    open_questions:
    - To what extent do benchmark gains transfer to unseen operating systems, applications,
      and real user workflows?
    - Which evaluation metric best aligns with downstream user utility when trading
      off success, observation cost, calibration, and action risk?
    - Can fine-grained diagnostic and uncertainty-aware scoring become standard without
      making benchmarks too narrow or expensive?
    - How do self-improvement harness or RL-synthesis methods avoid overfitting to
      the specific task distributions and verifiers used for optimization?
    - Several top-paper evidence entries omit limitation details or public artifact
      information; how should benchmark conclusions be treated under these reproducibility
      verification gaps?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 可执行桌面/操作系统任务套件与细粒度成功诊断
      解决的问题: 在多应用、GUI-CLI桌面工作流中提供可比的评测，超越总体通过率。
      尚未覆盖: 跨操作系统和界面类型的覆盖、长程可靠性，以及子目标诊断能否预测真实用户效用。
    - 路线: 动态与视频引导的界面基准
      解决的问题: 评估可在操作间变化界面中工作、需要观察控制或时序关键帧理解的代理。
      尚未覆盖: 现有证据集中于短视频和策划浏览器环境；成本-准确率指标及向其他动态环境的泛化仍不明确。
    - 路线: 通过harness、技能或学习进行基准驱动的代理改进
      解决的问题: 在现有套件上通过外部技能/harness优化、可验证任务合成、在线强化学习或弱监督提升冻结或训练后的代理。
      尚未覆盖: 保留集与跨基准迁移稳定性、可能的基准过拟合，以及对可验证或标注任务的依赖。
    - 路线: 基础定位不确定性与校准基准
      解决的问题: 衡量GUI基础定位决策的后验不确定性质量与空间校准。
      尚未覆盖: 单步基础定位设定未覆盖多步轨迹决策；跨模型和跨接口的不确定性排序迁移较弱。
    共识:
    - 单一成功率不够：细粒度的子目标、观察、基础定位或不确定性指标能揭示总体通过率掩盖的能力差异。
    - 真实可执行环境是GUI/OS代理评估的核心，通常配合确定性或可验证评分。
    - 当前代理仍表现出生脆的观察控制、较弱的跨设定迁移和不完善的校准，为harness/技能及训练改进留出空间。
    - 冻结模型的外部改进可以带来显著提升，说明评估需区分模型能力与周围执行脚手架。
    分歧:
    - 评估目标不同：静态桌面任务完成、动态视频原生观察控制、单步基础定位不确定性。
    - 改进方式不同：外部harness或技能修改，与通过在线强化学习或未标注截图弱监督进行代理训练。
    - 指标选择不同：pass@1和任务成功、成本-准确率与信息效率、不确定性排序与共形覆盖。
    - 部署领域不同：macOS桌面应用、短视频浏览器环境、视频引导GUI任务和基础定位GUI数据集对交互性有不同假设。
    开放问题:
    - 基准提升在多大程度上能迁移到未见操作系统、应用和真实用户工作流？
    - 在成功、观察成本、校准和行动风险之间权衡时，哪种评测指标最符合下游用户效用？
    - 细粒度诊断和不确定性感知评分能否标准化，而不会让基准过于狭窄或昂贵？
    - 自我改进harness或强化学习合成方法如何避免对特定任务分布和验证器过拟合？
    - 若干高排名论文的证据条目未提供限制说明或公开工件信息；在可复现性验证缺口下应如何看待基准结论？
