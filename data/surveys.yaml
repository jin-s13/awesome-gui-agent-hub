  related_work_outline:
  - 'Mainstream direction: Benchmarking and method development for GUI agents are
    converging on finer-grained evaluation, broader interaction modalities (drag,
    dynamic screens, CLI+GUI), and safety-awareness via uncertainty quantification.'
  - 'Shared research pattern: All works decompose complex computer-use tasks into
    sub-goals, action steps, or skill primitives, and evaluate agents with multi-dimensional
    metrics beyond task success rate.'
  - 'Key differences: Papers differ in what interaction primitive they model (click
    vs. drag vs. dynamic content), how they supervise training (weak supervision from
    screenshots, online RL with verifiable rewards, or supervised fine-tuning on expert
    traces), and whether they explicitly quantify prediction uncertainty.'
  - 'Trend evolution: Within the 2024–2026 frontier, the field is moving from static
    GUI benchmarks toward dynamic, long-horizon, multi-application, and safety-critical
    scenarios, with growing emphasis on sample efficiency and agent self-assessment.'
  - 'Open questions: How well uncertainty estimates transfer across model families
    and interfaces, whether weak supervision or RL scaling laws hold under distribution
    shift, and how to formally define observation-control for agents in ever-changing
    environments.'
  related_work_outline_zh:
  - 主流方向：GUI agent的基准测试与方法开发正在向更细粒度的评估、更广泛的交互模态（拖拽、动态屏幕、CLI+GUI）以及通过不确定性量化实现的安全意识汇聚。
  - 研究共性：所有工作都将复杂的计算机使用任务分解为子目标、动作步骤或技能原语，并使用超越任务成功率的多元指标评估agent。
  - 关键差异：论文在建模的交互原语（点击 vs. 拖拽 vs. 动态内容）、训练监督方式（截图弱监督、可验证奖励的在线强化学习、专家轨迹的监督微调）以及是否显式量化预测不确定性方面存在差异。
  - 趋势演进：在2024–2026年这一前沿窗口内，领域正从静态GUI基准向动态、长时域、多应用和安全关键场景转移，并越来越重视样本效率和agent的自我评估。
  - 开放问题：不确定性估计在不同模型家族和界面间的迁移能力、弱监督或强化学习的缩放律在分布偏移下是否成立、以及如何为不断变化环境中的agent形式化定义观察控制。
  literature_review:
    line_of_work_matrix:
    - line: Formalizing interaction modes and task scope
      what_it_solves: Defines the boundaries of agent capabilities by modeling specific
        interaction types (drag, dynamic screen, CLI+GUI) and identifying failure
        modes like over- and under-observation.
      what_remains_open: Lack of a unified formal model that spans multiple interaction
        primitives and explains why observation-control degrades on out-of-distribution
        interfaces.
    - line: Scaling agent training with verifiable feedback and weak supervision
      what_it_solves: Reduces reliance on expensive human annotations by using unannotated
        screenshots, online RL with synthesized verifiable tasks, and curriculum learning
        to improve sample efficiency.
      what_remains_open: No direct validation that the scaling laws derived from these
        methods predict agent performance or failure modes under realistic, evolving
        application distributions.
    - line: Uncertainty quantification and safety guarantees for GUI grounding
      what_it_solves: Provides post-hoc prediction confidence and conformal prediction
        sets for single-step GUI grounding, enabling safer autonomous decisions.
      what_remains_open: Transfer of UQ rankings across model tiers and screen interfaces
        is weak; conformal coverage degrades under calibration-test or interface shift,
        and multi-step trajectory safety remains unaddressed.
    consensus:
    - Fine-grained, multi-dimensional evaluation (e.g., sub-goal completion, information
      efficiency, uncertainty-aware metrics) is necessary to reveal performance differences
      that coarse success rates hide.
    - Agents benefit from decomposing tasks into structured skills, contexts, or sub-goals,
      but designing the decomposition is still an open engineering challenge.
    - Current GUI agents lack robust self-assessment and observation-control, leading
      to failures in dynamic or long-horizon settings.
    disagreements:
    - 'Supervision signal: approaches range from using only massive unannotated screenshots
      (weak supervision) to online RL with verifiable task rewards, to traditional
      supervised fine-tuning on limited expert demonstrations.'
    - 'Interaction scope: some benchmarks focus on click-only pixel grounding, while
      others extend to drag, CLI+GUI, and dynamically changing content, indicating
      no agreed-upon coverage of real-world computer use.'
    - 'Safety mechanism: only one work explicitly integrates uncertainty quantification
      for deciding when to trust predictions; others rely on agent architecture or
      skill libraries without runtime confidence calibration.'
    open_questions:
    - How can uncertainty estimates be reliably transferred across different VLM backbones
      and screen interfaces without target-specific re-evaluation?
    - Do the scaling efficiencies observed in weak supervision and online RL transfer
      to failure prediction and safety guarantees on long-horizon, multi-application
      tasks?
    - What formal definition of observation-control can unify the failure patterns
      of over- and under-observation seen in dynamic environments?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 形式化交互模式与任务范围
      解决的问题: 通过建模特定交互类型（拖拽、动态屏幕、CLI+GUI）并识别过度观察和观察不足等失败模式，定义agent能力的边界。
      尚未覆盖: 缺少一个统一的形式化模型，能够跨越多种交互原语，并解释为什么观察控制在分布外界面上会退化。
    - 路线: 通过可验证反馈与弱监督扩展agent训练
      解决的问题: 通过利用未标注截图、带有合成可验证任务的在线强化学习以及课程学习，减少对昂贵人工标注的依赖，提高样本效率。
      尚未覆盖: 没有直接验证从这些方法中得出的缩放律能否预测agent在真实、不断变化的应用分布下的表现或失败模式。
    - 路线: GUI grounding的不确定性量化与安全保证
      解决的问题: 为单步GUI grounding提供后验预测置信度和共形预测集，使得自主决策更安全。
      尚未覆盖: 不确定性量化排名在模型层级和屏幕界面间的迁移能力较弱；共形覆盖在校准-测试或界面偏移下下降；多步轨迹的安全性问题尚未涉及。
    共识:
    - 细粒度、多维度评估（如子目标完成度、信息效率、不确定性感知指标）对于揭示粗糙成功率所掩盖的性能差异是必要的。
    - Agent通过将任务分解为结构化技能、上下文或子目标而受益，但设计该分解仍然是一个开放的工程挑战。
    - 当前的GUI agent缺乏鲁棒的自我评估和观察控制，导致在动态或长时域场景中出现失败。
    分歧:
    - 监督信号：方法从仅使用海量未标注截图（弱监督），到带有可验证任务奖励的在线强化学习，再到基于有限专家演示的传统监督微调，各不相同。
    - 交互范围：一些基准测试仅关注点击式像素级定位，而另一些则扩展到拖拽、CLI+GUI和动态变化内容，表明对真实计算机使用的覆盖范围尚未达成共识。
    - 安全机制：仅有一项工作显式集成不确定性量化来决定何时信任预测；其他工作依赖agent架构或技能库，而缺乏运行时的置信度校准。
    开放问题:
    - 如何将不确定性估计可靠地迁移到不同的VLM骨干和屏幕界面，而无需目标特定的重新评估？
    - 在弱监督和在线强化学习中观察到的缩放效率，能否迁移到长时域、多应用任务上的失败预测和安全保证？
    - 什么样的观察控制形式化定义能够统一动态环境中出现的过度观察和观察不足的失败模式？
