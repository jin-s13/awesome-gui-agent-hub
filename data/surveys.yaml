  - 'Key differences: They diverge in interaction focus (drag, video-guided, living-screen,
    GUI/CLI hybrid), training signal (weak screenshots, verifiable tasks plus online
    RL, supervised context actions), and evaluation target (Pass@1, cost-accuracy,
    uncertainty calibration).'
  - 'Trend evolution: The visible top papers are concentrated in 2026, so the trend
    is within the current frontier: from passive static grounding toward controlled
    observation, long-horizon context, verifiable task synthesis, and reliability-aware
    benchmarking.'
  - 'Open questions: How to learn observation control, whether uncertainty rankings
    transfer across models/interfaces, how to isolate training ingredient contributions,
    and how well benchmarks generalize beyond curated application sets.'
  related_work_outline_zh:
  - 主流方向：当前GUI智能体研究聚焦于真实化、多模态的桌面/移动/短视频任务，并以细粒度、成本感知或不确定性感知评测替代静态单步点击定位。
  - 研究共性：论文通常将任务特定的交互数据或合成训练任务与开源视觉语言模型代理结合，并与闭源前沿模型对比，强调泛化与样本效率。
  - 关键差异：交互焦点不同（拖拽、视频引导、动态屏幕、GUI/CLI混合），训练信号不同（未标注截图弱监督、可验证任务加在线强化学习、监督上下文动作），评测目标不同（Pass@1、成本-准确性、不确定性校准）。
  - 趋势演进：可见高排名论文集中在2026年，因此趋势处于当前前沿：从被动静态定位走向观察控制、长时程上下文、可验证任务合成与可靠性感知评测。
  - 开放问题：如何学习观察控制，不确定性排序能否跨模型与接口迁移，如何隔离训练成分贡献，以及基准在策展应用集之外的泛化程度。
  literature_review:
    line_of_work_matrix:
    - line: Dynamic and multi-interface action grounding
      what_it_solves: Extends GUI agents beyond static click/type grounding to drag
        interactions, video-guided frames, living-screen dynamics, and mixed GUI/CLI
        control.
      what_remains_open: Observation control, interface transfer, and benchmark coverage
        are still narrow or unreported across dynamic settings.
    - line: Training-data and objective scaling
      what_it_solves: Reduces annotation cost or sample inefficiency through unannotated
        screenshot pretraining, verifiable task synthesis with online RL, and keyframe-level
        input selection.
      what_remains_open: The marginal contribution of task synthesis, RL sampling,
        visual segmentation, and base model selection is not isolated across studies.
    - line: Long-horizon context and memory management
      what_it_solves: Makes long mobile and desktop trajectories tractable by treating
        context compaction as policy actions and maintaining structured history fields.
      what_remains_open: Evidence is mostly limited to an 8B open-data supervised
        model and selected long-horizon benchmarks; out-of-distribution breadth is
        not fully established.
    - line: Evaluation and uncertainty evidence
      what_it_solves: Creates fine-grained, rule-based, cost-aware, and post-hoc uncertainty
        benchmarks to reveal capabilities hidden by aggregate success rate.
      what_remains_open: Single-step uncertainty evidence transfers weakly across
        model classes; conformal coverage degrades under distribution shift, and many
        limitation fields are missing.
    consensus:
    - Recent work converges on evaluating and improving GUI agents beyond static single-step
      click tasks, including dynamic, video-guided, drag, and long-horizon settings.
    - Fine-grained metrics and cost-aware or uncertainty-aware evaluation expose weaknesses
      that aggregate Pass@1 hides, such as sub-goal completion gaps and over- or under-observation.
    - Targeted training data or synthesized tasks can improve open-weight GUI agents,
      whether via weakly supervised screenshots, verifiable online RL tasks, or supervised
      context-action trajectories.
    - Observation and context management are becoming first-class agent components
      instead of passive screenshot history or fixed input frames.
    disagreements:
    - 'Evaluation settings differ materially: deterministic rule-based desktop Pass@1,
      cost-accuracy on dynamic screens, single-step uncertainty calibration, and drag-specialized
      benchmarks measure different capabilities.'
    - Interaction scope ranges from click/type to drag, video-guided, living-screen,
      GUI/CLI hybrid, and long-horizon mobile control, changing action representation
      and failure modes.
    - 'Training recipes differ in supervision and reward: weak visual grounding from
      unannotated data, verifiable task synthesis plus online RL, or supervised context-action
      data.'
    - 'Attribution of performance varies: one result emphasizes skill libraries over
      framework design, while others credit training objectives, context policies,
      or targeted interaction data without direct ablation across alternatives.'
    open_questions:
    - Can agents learn observation control that balances information gain with interaction
      cost on dynamic and video-based interfaces?
    - Does uncertainty ranking transfer robustly across model families, interfaces,
      and multi-step agent trajectories without target-specific recalibration?
    - What is the marginal contribution of each training ingredient when task synthesis,
      RL sampling, visual context segmentation, and base model selection are varied
      together?
    - How well do current benchmarks represent unseen application layouts and out-of-distribution
      long-horizon tasks when many limitation fields and artifact signals are missing?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 动态与多接口动作定位
      解决的问题: 将GUI代理从静态点击/输入定位扩展到拖拽交互、视频引导帧选择、动态屏幕和GUI/CLI混合控制。
      尚未覆盖: 动态场景中的观察控制、接口迁移和基准覆盖仍较窄，或未报告边界。
    - 路线: 训练数据与目标规模化
      解决的问题: 通过未标注截图预训练、可验证任务合成加在线强化学习、关键帧输入选择降低标注成本或样本低效。
      尚未覆盖: 任务合成、强化学习采样、视觉上下文分割和基座模型选择的边际贡献在各研究中未被隔离。
    - 路线: 长时程上下文与记忆管理
      解决的问题: 通过把上下文压缩建模为策略动作并维护结构化历史字段，使长移动/桌面轨迹更可处理。
      尚未覆盖: 证据主要来自8B开源数据监督模型和选定长时程基准，分布外广度和生态位覆盖仍未充分验证。
    - 路线: 评估与不确定性证据
      解决的问题: 建立细粒度、规则化、成本感知和后验不确定性基准，揭示总体成功率掩盖的能力差异。
      尚未覆盖: 单步不确定性证据跨模型类别迁移弱；共形覆盖在分布偏移下下降，且许多论文的局限性字段缺失。
    共识:
    - 近期工作趋同于评估和改进超越静态单步点击任务的GUI代理，包括动态、视频引导、拖拽和长时程设置。
    - 细粒度指标与成本感知或不确定性感知评测暴露了汇总Pass@1所隐藏的弱点，例如子目标完成差距和过度/不足观察。
    - 目标任务数据或合成任务可以提升开源GUI代理，途径包括弱监督截图、可验证在线强化学习任务或监督上下文动作轨迹。
    - 观察和上下文管理正成为代理的一等组件，而非被动截图历史或固定输入帧。
    分歧:
    - 评测设置在内容层面差异明显：确定性规则桌面Pass@1、动态屏幕成本-准确性、单步不确定性校准和拖拽专项基准分别衡量不同能力。
    - 交互范围从点击/输入扩展到拖拽、视频引导、动态屏幕、GUI/CLI混合和长时程移动控制，改变动作表示与失败模式。
    - 训练配方在监督和奖励上不同：未标注数据弱视觉定位、可验证任务合成加在线强化学习，或监督上下文动作数据。
    - 性能归因不一致：一项结果强调技能库而非框架设计，另一些研究则归于训练目标、上下文策略或专项交互数据，未直接横向消融。
    开放问题:
    - 代理能否学习在动态和视频接口上平衡信息增益与交互成本的观察控制？
    - 不确定性排序能否在模型族、接口和多步代理轨迹之间无需目标特定重校准而稳健迁移？
    - 当任务合成、强化学习采样、视觉上下文分割和基座模型选择同时变化时，每个训练成分的边际贡献是什么？
    - 在大量局限性字段和构件信号缺失的情况下，当前基准对未见应用布局和分布外长时程任务的代表性如何？
