    line_of_work_matrix:
    - line: Taxonomy and roadmap synthesis
      what_it_solves: Maps fragmented GUI-agent research into directions such as supervision
        generation, harness self-improvement, long-horizon context management, and
        uncertainty benchmarking.
      what_remains_open: Whether this mapping is based on systematic review evidence
