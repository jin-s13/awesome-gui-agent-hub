  related_work_outline:
  - 'Mainstream direction: Building real-world GUI agent benchmarks with fine-grained
    metrics and uncertainty quantification to push reliable and safe agent deployment.'
  - 'Shared research pattern: All works create or leverage task suites that go beyond
    single success rates, introducing sub-goal completion, cost-accuracy, or uncertainty-aware
    evaluation.'
  - 'Key differences: They diverge in task environment (macOS desktop vs. dynamic
    short-video platforms), interaction granularity (click, drag, video-guided), evaluation
    philosophy (rule-based scoring vs. cost-accuracy vs. uncertainty quantification),
    and whether they focus on benchmark design or on comparing skill representations
    and training efficiency.'
  - 'Trend evolution: Across 2024–2026, benchmarks expanded from static desktop tasks
    to dynamic and video-guided settings, introduced multi-checkpoint scoring and
    uncertainty benchmarks, and began integrating skill and data-efficiency comparisons.'
  - 'Open questions: Cross-platform generalization, alignment of proxy metrics with
    user satisfaction, robustness of uncertainty quantification across model families,
    observation control in dynamic interfaces, and scaling laws for training data
    versus benchmark performance.'
  related_work_outline_zh:
  - 主流方向：构建真实世界GUI代理基准，并引入细粒度指标与不确定性量化，推动可靠且安全的代理评估。
  - 研究共性：所有工作都通过更精细的任务设计和评估维度来超越单一成功率，关注子目标完成度、信息效率或不确定性。
  - 关键差异：在任务环境（macOS桌面 vs 动态短视频平台）、交互粒度（点击、拖拽、视频引导）、评估理念（基于规则评分 vs 成本-准确性 vs 不确定性量化）以及是否专注于基准设计或技能/训练效率对比上存在分歧。
  - 趋势演进：2024–2026年间，基准从静态桌面任务扩展到动态和视频引导场景，引入了多检查点评分和不确定性基准，并开始整合技能表示与数据效率的比较。
  - 开放问题：跨平台泛化、代理指标与用户满意度对齐、不确定性量化跨模型鲁棒性、动态界面的观察控制、以及训练数据规模与基准性能的扩展规律。
  literature_review:
    line_of_work_matrix:
    - line: Real-world GUI task and dataset construction
      what_it_solves: Creating platform-specific (macOS, short-video platforms) and
        interaction-type-specific (drag, video-guided) benchmarks that make agent
        capabilities comparable under realistic conditions.
      what_remains_open: Whether the task distribution covers all critical user workflows;
        cross-platform and cross-application generalization is not evaluated; dynamic
        environments lack observation-control requirements in benchmark design.
    - line: Fine-grained evaluation metrics and uncertainty quantification
      what_it_solves: Providing sub-goal completion rates, cost-accuracy trade-offs,
        and post-hoc uncertainty estimates to assess agent robustness, safety, and
        information efficiency beyond aggregate success.
      what_remains_open: Alignment between these proxy metrics and downstream user
        satisfaction or decision quality is unverified; uncertainty quantification
        ranking transfer across model families and interfaces is weak.
    - line: Comparable baselines and skill/training-efficiency comparisons
      what_it_solves: Systematically comparing multimodal vs. text-only skills, online
        RL vs. weak supervision, and data efficiency on established benchmarks, revealing
        the impact of design choices on agent performance.
      what_remains_open: Experimental setups are not standardized across studies;
        the stability of benchmark conclusions under different implementations and
        compute budgets is unevaluated; training-cost vs. performance trade-offs are
        missing.
    consensus:
    - Moving beyond single task success rates to fine-grained metrics (sub-goal completion,
      information efficiency) is necessary for comprehensive agent evaluation.
    - Dynamic and real-world interfaces (e.g., short-video platforms, drag interactions)
      expose critical weaknesses in current agents, particularly in observation control
      and interaction granularity.
    - Multimodal skill representations that retain visual information outperform text-only
      skills in GUI grounding and workflow verification.
    - Uncertainty quantification is important for safe deployment, but its effectiveness
      degrades when transferring across model families or interface types.
    disagreements:
    - 'Task environment scope: some benchmarks target desktop OS, others browser-based
      dynamic platforms, with no consensus on what constitutes a representative real-world
      GUI environment.'
    - 'Evaluation philosophy: rule-based deterministic scoring vs. cost-accuracy joint
      metrics vs. uncertainty-aware calibration—no single protocol dominates.'
    - 'Interaction modality coverage: benchmarks emphasize different subsets (click,
      drag, keyboard, video-guided), leaving a unified multi-modal interaction suite
      unaddressed.'
    - 'Training paradigm efficiency: weak supervision, online RL, and skill libraries
      show different data efficiency profiles, but no benchmark-standardized training
      protocol exists to compare them fairly.'
    open_questions:
    - How can cross-platform and cross-application generalization be systematically
      evaluated? Existing benchmarks are largely limited to a single OS or platform.
    - Do fine-grained proxy metrics (sub-goal completion, cost-accuracy) align with
      real user satisfaction and task success as perceived by humans?
    - Why does uncertainty quantification ranking transfer poorly across model families,
      and what would a robust, deployment-ready UQ protocol look like?
    - How should agents learn observation control—deciding when to stop observing—in
      dynamic interfaces where content changes between actions?
    - What are the scaling relationships between training data volume, training method,
      and benchmark performance, and can they be predicted from small-scale experiments?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 真实场景GUI任务与数据集构建
      解决的问题: 创建特定平台（macOS、短视频平台）和交互类型（拖拽、视频引导）的基准，使代理能力在真实条件下可比。
      尚未覆盖: 任务分布是否覆盖所有关键用户工作流；跨平台、跨应用泛化未评估；动态环境未在基准设计中纳入观察控制要求。
    - 路线: 细粒度评估指标与不确定性量化
      解决的问题: 提供子目标完成率、成本-准确性权衡、事后不确定性估计，以超越总分评估代理的鲁棒性、安全性和信息效率。
      尚未覆盖: 这些代理指标与下游用户满意度或决策质量的一致性未验证；不确定性量化排名跨模型家族和接口迁移性弱。
    - 路线: 可比基线与技能/训练效率对比
      解决的问题: 在已有基准上系统比较多模态与纯文本技能、在线RL与弱监督及其数据效率，揭示设计选择对代理性能的影响。
      尚未覆盖: 实验中设置不统一；基准结论在不同实现和算力预算下的稳定性未评估；训练成本与性能的权衡分析缺失。
    共识:
    - 单一任务成功率不足以全面评估代理，需引入子目标完成度、信息效率等细粒度指标。
    - 动态和真实界面（如短视频平台、拖拽交互）暴露了当前代理在观察控制和交互粒度上的关键弱点。
    - 保留视觉信息的多模态技能表示在GUI基础和流程验证中优于纯文本技能。
    - 不确定性量化对安全部署重要，但其在跨模型家族和接口间迁移时效果下降。
    分歧:
    - 任务环境范围：桌面OS vs 浏览器动态平台，未就何种环境代表真实世界GUI达成共识。
    - 评估理念：基于规则的确定性评分 vs 成本-准确性联合指标 vs 不确定性校准，尚无统一主导协议。
    - 交互模态覆盖：各基准侧重不同子集（点击、拖拽、键盘、视频引导），缺少统一的多模态交互套件。
    - 训练范式效率：弱监督、在线RL和技能库在数据效率上表现不同，但缺乏基准标准化的训练协议以公平比较。
    开放问题:
    - 如何系统评估跨平台和跨应用的泛化能力？现有基准大多局限于单一操作系统或平台。
    - 细粒度代理指标（子目标完成度、成本-准确性）是否与人类感知的真实用户满意度和任务成功一致？
    - 为何不确定性量化排名跨模型家族迁移性差，如何设计鲁棒且可部署的UQ协议？
    - 在动作间内容变化的动态界面中，代理应如何学习观察控制——何时停止观察？
    - 训练数据量、训练方法与基准性能之间的扩展关系是什么，能否从小规模实验预测？
