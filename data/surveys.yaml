  literature_review:
    line_of_work_matrix:
    - line: Real-world OS and desktop task benchmarking
      what_it_solves: Capturing heterogeneous GUI and CLI workflows across applications
        with deterministic, fine-grained sub-goal scoring instead of only final success.
      what_remains_open: Coverage is limited to specific desktop, mobile, or short-video
        settings; transfer to unobserved applications and real user workloads is not
        established.
    - line: Multimodal skill and replay memory construction
      what_it_solves: Reusing validated trajectories or visual documentation to raise
        success and reduce token/latency cost on repeated computer-use tasks.
      what_remains_open: Maintenance under UI drift, ambiguous preconditions, and
        cross-application generalization are not fully verified.
    - line: Dynamic, video-guided, and drag-based interaction grounding
      what_it_solves: Grounding agents beyond static click-only GUI actions, including
        moving short-video interfaces, keyframe-guided tasks, and drag manipulations.
      what_remains_open: Observation control and generalization across dynamic interface
        types, especially beyond the studied short-video and drag domains, are missing.
    - line: Specialized vision-language GUI agent architectures
      what_it_solves: Training or pretraining multimodal models for GUI grounding
        and navigation with alternative decoding such as block-wise diffusion.
      what_remains_open: Comparative evidence is limited to selected grounding/navigation
        benchmarks; robustness, interactive reliability, and deployment trade-offs
        remain underreported.
    consensus:
    - Fine-grained evaluation beyond final success is needed; sub-goal completion,
      cost-accuracy, and token/latency efficiency reveal differences that Pass@1 alone
      hides.
    - Reusable multimodal skills or replay memories improve agent performance and
      efficiency over no-memory or text-only baselines.
    - Current GUI agents remain below human-level reliability on dynamic, drag-based,
      or mixed GUI/CLI tasks, with observation control and UI grounding being weak
      points.
    - Deterministic, rule-based or artifact-validated checks support reproducible
      benchmark evaluation.
    disagreements:
    - 'Task focus differs substantially: static desktop workflows versus continuous
      living-screen or short-video dynamics, implying different state representations
      and observation requirements.'
    - 'Reuse mechanisms differ: hierarchical multimodal skill library with visual
      figures versus compiled state-machine replay versus parameter-controlled callable
      memory.'
    - 'Improvement strategy differs: some works change data or fine-tuning, others
      change runtime memory/frameworks, and another changes the generative model architecture.'
    - 'Evaluation objective differs: passing tasks, minimizing cost/time, or improving
      grounding/navigation scores are not treated as one common objective.'
    open_questions:
    - Do gains on the studied benchmarks transfer to real office, mobile, or professional
      workflows outside the benchmark applications and platforms?
    - How should skill and replay memories be invalidated or repaired when application
      UIs, workflows, or user goals change?
    - How can observation control be explicitly modeled and evaluated beyond short-video
      cost-accuracy settings?
    - What is the cross-benchmark generalization of drag-based and video-guided grounding
      when combined with memory, skill, or diffusion-based agent backbones?
    - The packet lacks code, dataset, and limitation details for several methods;
      which reported improvements are reproducible across independent deployments?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 真实桌面与操作系统任务评测
      解决的问题: 跨应用捕获异构GUI与CLI工作流，并通过确定性、细粒度子目标评分替代仅最终成功。
      尚未覆盖: 覆盖范围限于特定桌面、移动或短视频场景，向未见应用和真实用户工作负载迁移尚未建立。
    - 路线: 多模态技能与重放记忆构建
      解决的问题: 复用已验证轨迹或视觉文档，提升重复计算机使用任务的成功率并降低token/时延成本。
      尚未覆盖: UI漂移下的维护、模糊前提条件与跨应用泛化尚未充分验证。
    - 路线: 动态、视频引导与拖拽交互定位
      解决的问题: 将代理从静态点击式GUI动作扩展到短视频动态界面、关键帧引导任务和拖拽操作。
      尚未覆盖: 观察控制以及在动态界面类型上的泛化仍缺失，尤其超出所研究的短视频/拖拽领域。
    - 路线: 专用视觉语言GUI代理架构
      解决的问题: 通过预训练或微调多模态模型实现GUI定位与导航，并探索块级扩散等替代解码方式。
      尚未覆盖: 对比证据限于选定的定位/导航基准；鲁棒性、交互可靠性与部署权衡仍报告不足。
    共识:
    - 需要超越最终成功的细粒度评测；子目标完成、成本准确率、token/时延效率能揭示Pass@1掩盖的差异。
    - 可复用的多模态技能或重放记忆相比无记忆或纯文本基线提升代理表现与效率。
    - 当前GUI代理在动态、拖拽式或GUI/CLI混合任务上仍未达到人类水平，观察控制与UI定位是薄弱点。
    - 确定性、基于规则或经工件验证的检查有助于可复现的基准评测。
    分歧:
