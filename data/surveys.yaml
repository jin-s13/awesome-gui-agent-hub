  literature_review:
    line_of_work_matrix:
    - line: 'Task and interaction formalization for GUI evaluation (short examples:
        MacAgentBench, LivingScreen, DragOn)'
      what_it_solves: Defines executable GUI task suites, interaction types, and fine-grained
        scoring to measure agent capability beyond aggregate accuracy, including GUI
        plus CLI use, dynamic content, and drag operations.
      what_remains_open: Benchmarks remain tied to specific platforms or interaction
        subsets; dynamic interfaces expose observation-control gaps, and cross-benchmark
        validity is not established.
    - line: 'Post-hoc uncertainty quantification and reliability framing for GUI grounding
        (short example: Argus)'
      what_it_solves: Compares ranking and calibration methods for confidence and
        spatial conformal click regions in single-step GUI grounding across open-weight
        and closed-source models.
      what_remains_open: Cross-tier transfer is weak, trajectory-level uncertainty
        is not covered, and conformal coverage degrades under calibration-test or
        interface mismatch.
    - line: 'Frozen-model and harness/skill augmentation improvement (short examples:
        GUI-HARVEST, VISUALSKILL)'
      what_it_solves: Improves GUI agents without retraining the backbone by using
        evidence-driven harness edits and multimodal skill retrieval grounded in screenshots
        and repeated execution.
      what_remains_open: Validation is narrow, several limitation fields are empty,
        and robustness across unseen applications or stochastic execution variability
        is not fully shown.
    - line: 'Data-scalable training and verifiable task synthesis (short examples:
        ScaleCUA, GUICrafter)'
      what_it_solves: Reduces annotation cost or increases verifiable training tasks
        to scale computer-use agents through weak supervision and efficient online
        reinforcement learning.
      what_remains_open: Reported gains are benchmark-specific; direct evidence on
        failure prediction, transfer, and safety under distribution shift is missing.
    consensus:
    - GUI evaluation should move beyond simple task success to fine-grained, cost-aware,
      or capability-attributed scoring.
    - Aggregate success masks important differences because models with similar success
      rates can differ in subgoal completion, observation efficiency, or grounding
      confidence.
    - Expanding interaction coverage to GUI plus CLI, dynamic content, or drag is
      necessary because click-only benchmarks miss material agent capabilities.
    - External scaffolding such as skills, harness edits, or data/task augmentation
      can improve frozen or open models without changing backbone weights.
    disagreements:
    - Whether supervision should come from small annotated sets, massive unannotated
      screenshots, or verifiable synthetic tasks rather than human demonstrations.
    - Whether evaluation should prioritize single-step grounding uncertainty, multi-step
      desktop success, dynamic cost-accuracy, or interaction-type-specific drag metrics.
    - Whether improvement should be placed in the model, the execution harness or
      skill library, or the benchmark and task distribution.
    - Whether reliability should be framed as calibrated confidence regions or as
      observed failure modes and observation-control gaps.
    open_questions:
    - Do fine-grained, benchmark-specific improvements transfer across platforms,
      dynamic interfaces, and closed-source model tiers?
    - How can uncertainty quantification be extended from single-step grounding to
      multi-step action trajectories and sequential risk?
    - Are skill- and harness-based gains robust to stochastic execution variability
      and distribution shift beyond the evaluated suites?
    - Which verification gaps, such as empty limitation fields, weak reproducibility
      signals, or missing failure analyses, most affect confidence in reported gains?
  literature_review_zh:
    研究路线矩阵:
    - 路线: GUI 评估的任务与交互形式化（短例：MacAgentBench、LivingScreen、DragOn）
      解决的问题: 定义可执行的 GUI 任务套件、交互类型和细粒度评分，衡量超出总体准确率的智能体能力，包括 GUI 与 CLI 混合、动态内容和拖拽操作。
      尚未覆盖: 各基准仍绑定特定平台或交互子集；动态界面暴露观察控制缺口，跨基准有效性尚未建立。
    - 路线: 面向 GUI grounding 的后验不确定性与可靠性框架（短例：Argus）
      解决的问题: 在单步 GUI grounding 中比较多类置信度排序与校准方法，并在开源权重和闭源模型上评估空间共形点击区域。
      尚未覆盖: 跨层级迁移较弱，尚未覆盖轨迹级不确定性，且共形覆盖在校准-测试或接口不匹配时会下降。
    - 路线: 冻结模型与 harness/技能增强改进（短例：GUI-HARVEST、VISUALSKILL）
      解决的问题: 通过基于证据的 harness 修改和以截图为依据的多模态技能检索，在不重训骨干模型的情况下提升 GUI 智能体表现。
      尚未覆盖: 验证范围较窄，多篇局限性字段为空，未充分证明在未见应用或随机执行变异下的稳健性。
    - 路线: 可扩展数据训练与可验证任务合成（短例：ScaleCUA、GUICrafter）
      解决的问题: 通过弱监督和高效在线强化学习降低标注成本或增加可验证训练任务，以扩展计算机使用智能体的数据与训练规模。
      尚未覆盖: 报告提升多为基准特定；失败预测、迁移和分布偏移下安全性的直接证据仍缺失。
    共识:
    - GUI 评测应超越简单任务成功率，引入细粒度、成本感知或能力归因的评分。
    - 总体成功会掩盖重要差异：成功率相近的模型可能在子目标完成、观察效率或 grounding 置信度上明显不同。
    - 扩展交互覆盖至 GUI 与 CLI 混合、动态内容或拖拽是必要的，仅点击类基准会遗漏关键能力。
    - 通过技能、harness 修改或数据/任务增强等外部脚手架，可以在不改动骨干权重的情况下提升冻结或开源模型。
    分歧:
    - 监督来源应选择少量标注、海量未标注截图，还是可验证合成任务而非人类演示，存在不同路线。
    - 评测目标应侧重单步 grounding 不确定性、多步桌面成功率、动态成本准确率，还是特定于拖拽的指标。
    - 改进应放在模型内部、执行 harness 或技能库，还是基准与任务分布上。
