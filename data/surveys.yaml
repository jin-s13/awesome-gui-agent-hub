  related_work_outline_zh:
  - 主流方向：构建覆盖多样化平台、交互模式和动态环境的综合GUI自动化基准，并配备细粒度、多维度评估指标。
  - 研究共性：超越通过/失败，探索子目标完成度、成本-准确性权衡和可靠性；同时利用真实任务和合成数据生成。
  - 关键差异：基准针对不同的交互原语（点击、拖拽、视频引导）、界面类型（桌面、网页、短视频）和评估维度（准确性、效率、不确定性）。
  - 趋势演进：2024–2026年间，前沿从静态桌面/网页任务转向动态、多模态和专业化交互，越来越强调鲁棒性、校准和数据高效的代理训练。
  - 开放问题：基准分布是否覆盖长周期和开放式使用；指标排名在不同模型族和部署环境中的稳定性；安全关键和多步协调场景的覆盖。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design
      what_it_solves: Creates diverse, realistic GUI automation tasks and datasets—covering
        desktop (MacAgentBench), dynamic video platforms (LivingScreen), drag interactions
        (DragOn), and video-guided tasks (VG-GUIBench)—to standardize evaluation of
        agent capabilities across interaction types and environments.
      what_remains_open: Limited coverage of long-horizon, open-ended tasks and safety-critical
        scenarios; benchmarks are often restricted to single platforms or interaction
        modes, and the task distribution may not fully represent real-world challenges
        such as observation control in dynamic content.
    - line: Metric and stress-test design
      what_it_solves: Develops fine-grained, multi-dimensional metrics (e.g., sub-goal
        completion scores, cost-accuracy trade-offs, post-hoc uncertainty quantification)
        that probe agent robustness, observation control, and decision reliability
        beyond aggregate success rates, as demonstrated by MacAgentBench's multi-checkpoint
        scoring and Argus's UQ benchmark.
      what_remains_open: Proxy metrics often do not align with downstream user value;
        uncertainty quantification rankings transfer poorly across model families
        and interfaces; stress tests for multi-step trajectories and safety guarantees
        remain under-explored.
    - line: Comparable baselines and reporting
      what_it_solves: Establishes strong, reproducible baselines and efficient training
        paradigms (e.g., online RL with verifiable synthesized tasks in ScaleCUA,
        weak supervision from unlabeled screenshots in GUICrafter) to enable fair
        comparison and auditability, while demonstrating that data-efficient methods
        can approach or surpass fully supervised performance.
      what_remains_open: Benchmark conclusions may be unstable across different implementations
        and compute budgets; data efficiency gains may overfit to specific benchmark
        distributions; open-source reproducibility and artifact sharing remain inconsistent.
    consensus:
    - Fine-grained evaluation beyond pass/fail is necessary to reveal true agent capabilities,
      as models with similar success rates can differ substantially in sub-goal completion
      and efficiency.
    - Current GUI agents lack adequate observation control, leading to over- or under-observation
      in dynamic interfaces, which limits their real-world deployment.
    - Multimodal information (especially visual layouts) is critical for accurate
      UI grounding and task completion, and purely text-based approaches are insufficient.
    - Data-efficient learning methods (weak supervision, RL with synthesized tasks)
      can match or exceed performance of fully supervised agents, reducing annotation
      costs.
    disagreements:
    - 'Benchmarks vary in the interaction primitives they prioritize: some focus on
      point-and-click actions, while others target drag, video-guided, or CLI-integrated
      interactions, leading to different evaluation protocols and agent skill requirements.'
    - Uncertainty quantification methods show strong within-model stability but weak
      cross-model transferability, especially between open-weight and closed-source
      models, indicating that UQ techniques must be validated per model family rather
      than assumed universal.
    - The choice of evaluation environment (static desktop vs. dynamic short-video
      platforms) significantly changes the failure modes of agents, creating a divide
      in whether the primary challenge is grounded UI understanding or real-time observation
      control.
    open_questions:
    - How can benchmark task distributions be designed to cover long-horizon, multi-step
      coordination and safety-critical scenarios without becoming prohibitively expensive
      to annotate?
    - What metrics or evaluation protocols can reliably predict downstream user satisfaction
      and task success in open-ended real-world deployments?
    - Under what conditions do UQ rankings and calibration methods transfer across
      different model architectures and interface modalities, and how should deployment-specific
      recalibration be performed?
    - To what extent do data-efficient training methods (synthetic task generation,
      weak supervision) introduce biases that inflate benchmark scores but fail to
      generalize to unseen, real-world tasks?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计
      解决的问题: 创建多样化、真实的GUI自动化任务和数据集——覆盖桌面（MacAgentBench）、动态短视频平台（LivingScreen）、拖拽交互（DragOn）和视频引导任务（VG-GUIBench）——以标准化评估代理在不同交互类型和环境中的能力。
      尚未覆盖: 对长周期、开放式任务和安全关键场景的覆盖有限；基准通常局限于单一平台或交互模式，任务分布可能无法完全反映现实挑战，如动态内容中的观察控制。
    - 路线: 指标与压力测试设计
      解决的问题: 开发细粒度、多维度的指标（如子目标完成度评分、成本-准确性权衡、后验不确定性量化），以超越聚合成功率，探测代理的鲁棒性、观察控制和决策可靠性，如MacAgentBench的多检查点评分和Argus的UQ基准所示。
      尚未覆盖: 代理指标常与下游用户价值不一致；不确定性量化排名在不同模型族和接口间迁移性差；多步轨迹和安全性保障的压力测试仍探索不足。
    - 路线: 可比基线与报告规范
      解决的问题: 建立强健、可复现的基线和高效训练范式（如ScaleCUA中基于可验证合成任务的在线RL，GUICrafter中利用未标注截图的弱监督），以实现公平比较和可审计性，同时证明数据高效方法可接近或超越全监督性能。
      尚未覆盖: 基准结论在不同实现和计算预算下可能不稳定；数据效率增益可能过拟合到特定基准分布；开源可复现性和工件共享仍不一致。
    共识:
    - 超越通过/失败的细粒度评估对于揭示真实代理能力是必要的，因为成功率相似的模型在子目标完成度和效率上可能差异显著。
    - 当前GUI代理缺乏足够的观察控制，在动态界面中易出现过度或不足观察，限制了其现实部署。
    - 多模态信息（尤其是视觉布局）对准确的UI定位和任务完成至关重要，纯文本方法不足。
    - 数据高效学习方法（弱监督、合成任务RL）可以匹配或超越全监督代理的性能，降低标注成本。
    分歧:
    - 基准在优先的交互原语上存在差异：有些专注点击操作，有些则针对拖拽、视频引导或CLI集成交互，导致不同的评估协议和代理技能要求。
    - 不确定性量化方法在模型内表现出强稳定性，但跨模型迁移性差，尤其是在开源和闭源模型之间，表明UQ技术需按模型族验证，而非假设通用。
    - 评估环境的选择（静态桌面 vs. 动态短视频平台）显著改变了代理的失败模式，造成主要挑战是接地UI理解还是实时观察控制的分歧。
    开放问题:
    - 如何设计基准任务分布以覆盖长周期、多步协调和安全关键场景，同时避免标注成本过高？
    - 哪些指标或评估协议能可靠预测下游用户满意度和开放式现实部署中的任务成功？
    - 在什么条件下UQ排名和校准方法能跨不同模型架构和界面模态迁移，以及如何进行部署特定的重新校准？
