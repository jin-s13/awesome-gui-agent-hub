  related_work_outline:
  - 'Mainstream direction: Expanding GUI agent evaluation and training from static
    click-based tasks to dynamic, multi-modal, and long-horizon interactions, with
    a focus on reducing annotation cost and improving observation control.'
  - 'Shared research pattern: Proposing benchmarks with fine-grained metrics (sub-goal
    completion, cost-accuracy, UQ) to isolate agent capabilities, and developing training
    methods (online RL, weak supervision, curriculum learning) that leverage synthetic
    or unlabeled data.'
  - 'Key differences: Benchmarks target different platforms (macOS, mobile, short-video)
    and interaction types (drag, CLI+GUI, video-guided), while methods diverge in
    supervision paradigm and context management strategies.'
  - 'Trend evolution: Rapid shift from single-app click tasks to multi-app, dynamic,
    drag, and video-guided scenarios, with a parallel push toward data-efficient training,
    all within the 2026 frontier.'
  - 'Open questions: How to unify diverse action spaces and observation strategies?
    Can synthetic/weakly-supervised training generalize to real-world interfaces?
    How to design cross-benchmark-aligned evaluations? How to integrate uncertainty
    for safer deployment?'
  related_work_outline_zh:
  - 主流方向：将GUI智能体评估与训练从静态点击任务扩展到动态、多模态和长时域交互，重点降低标注成本并改善观察控制。
  - 研究共性：提出细粒度指标基准（子目标完成度、成本-准确率、不确定性量化）以隔离能力，并开发利用合成或无标注数据的训练方法（在线RL、弱监督、课程学习）。
  - 关键差异：基准针对不同平台（macOS、移动端、短视频）和交互类型（拖拽、CLI+GUI、视频引导），方法在监督范式和上下文管理策略上存在分歧。
  - 趋势演进：从单应用点击任务快速转向多应用、动态、拖拽和视频引导场景，同时推动数据高效训练，均在2026年前沿内。
  - 开放问题：如何统一多样化动作空间与观察策略？合成/弱监督训练能否泛化到真实界面？如何设计跨基准对齐的评估？如何集成不确定性以保障安全部署？
  literature_review:
    line_of_work_matrix:
    - line: Method representation and objective design for GUI agents
      what_it_solves: Designing training objectives, representations, and curriculum
        learning that reduce annotation cost and improve long-horizon task completion,
        leveraging synthetic task generation, unlabeled screenshots, and structured
        context management.
      what_remains_open: Generalizability of weakly-supervised and RL-based training
        beyond curated benchmarks, and the need for real-time adaptation to dynamic,
        multi-step environments.
    - line: Planning and action-interface methods
      what_it_solves: Expanding the action space to include drag, CLI, and observation
        control actions, and enabling proactive context management as first-class
        actions.
      what_remains_open: Integrating diverse action types into a unified agent architecture,
        and evaluating performance across heterogeneous interfaces with consistent
        metrics.
    - line: Method evidence and ablation protocol
      what_it_solves: Providing fine-grained, multi-dimensional benchmarks that isolate
        agent capabilities (e.g., sub-goal completion, cost-accuracy, UQ) and reveal
        failure modes beyond overall success rate.
      what_remains_open: Benchmark coverage of dynamic, real-world variability and
        cross-benchmark transferability of method rankings, especially when internal
        model states are inaccessible.
    consensus:
    - GUI agents must move beyond simple click-and-type actions to support drag, scroll,
      CLI, and video-guided interactions.
    - Fine-grained evaluation metrics (sub-goal completion, cost-accuracy, uncertainty
      calibration) are essential to understand agent capabilities beyond Pass@1.
    - Training with synthetic or weakly-supervised data can reduce reliance on expensive
      human annotations.
    - Context management is a critical challenge for long-horizon agent performance.
    disagreements:
    - 'The optimal supervision paradigm: online RL with verifiable tasks, weakly-supervised
      learning from unannotated screenshots, or supervised fine-tuning on curated
      datasets.'
    - Evaluation settings differ in platform and interaction type, making direct method
      comparison difficult.
    - 'Metrics vary: some prioritize task success, others cost-efficiency or uncertainty
      calibration, leading to different agent rankings.'
    - Observation control is treated as a separate capability in some benchmarks,
      while others integrate it into action selection.
    open_questions:
    - How can a unified agent dynamically select among diverse action types and observation
      strategies?
    - Can training methods that rely on synthetic or unlabeled data generalize to
      real-world, unseen interfaces?
    - How to design benchmarks that capture the full complexity of human-computer
      interaction with provable cross-benchmark alignment?
    - What is the best way to integrate uncertainty quantification into agent decision-making
      to improve robustness and safety?
  literature_review_zh:
    研究路线矩阵:
    - 路线: GUI智能体的方法表示与目标设计
      解决的问题: 设计训练目标、表示和课程学习，降低标注成本并提升长时域任务完成度，利用合成任务生成、无标注截图和结构化上下文管理。
      尚未覆盖: 弱监督和基于RL的训练在精心策划的基准之外的泛化能力，以及实时动态适应需求。
    - 路线: 规划与动作接口方法
      解决的问题: 扩展动作空间以包含拖拽、CLI和观察控制动作，并将主动上下文管理作为一等动作实现。
      尚未覆盖: 将多种动作类型集成到统一智能体架构中，并在异构接口上以一致指标评估性能。
    - 路线: 方法证据与消融协议
      解决的问题: 提供细粒度、多维度的基准，隔离智能体能力（如子目标完成度、成本-准确率、不确定性量化），并揭示超越整体成功率的失败模式。
      尚未覆盖: 基准覆盖动态现实世界的变异性，以及方法排名在跨基准间的可迁移性，尤其在内部状态不可访问时。
    共识:
    - GUI智能体需超越简单的点击和输入操作，支持拖拽、滚动、CLI和视频引导交互。
    - 细粒度评估指标（子目标完成度、成本-准确率、不确定性校准）对于理解智能体超出Pass@1的能力至关重要。
    - 使用合成或弱监督数据进行训练可减少对昂贵人工标注的依赖。
    - 上下文管理是长时域智能体性能的关键挑战。
    分歧:
    - 最优监督范式：在线RL与可验证任务、基于无标注截图的弱监督学习，或在人工整理数据集上的监督微调。
    - 评估设置因平台和交互类型不同而差异显著，导致方法直接比较困难。
    - 指标各异：有的侧重任务成功率，有的侧重成本效率或不确定性校准，导致智能体排名不一致。
    - 观察控制在部分基准中被视为独立能力，而其他方法将其融入动作选择。
    开放问题:
    - 如何构建一个能动态选择多样化动作类型和观察策略的统一智能体？
    - 依赖合成或无标注数据的训练方法能否泛化到真实、未见过的界面？
    - 如何设计能捕捉人机交互完整复杂性并具有可证明跨基准对齐的基准？
    - 将不确定性量化集成到智能体决策中的最佳方式是什么，以提高鲁棒性和安全性？
