  literature_review_zh:
    研究路线矩阵:
    - 路线: 真实世界GUI代理基准与多应用桌面任务评测
      解决的问题: 为在真实桌面应用中操作、包含GUI+CLI工作流的计算机使用代理提供任务套件和细粒度评分，并引入能力标注。
      尚未覆盖: 覆盖集中於特定操作系统和应用；跨平台泛化及缺失的局限性分析使边界条件尚不清楚。
    - 路线: 交互特化的GUI评测
      解决的问题: 针对点击式基准覆盖不足的动态、拖拽和视频引导交互，提供基于浏览器或视频的任务套件以及成本-准确率或grounding指标。
      尚未覆盖: 变化界面中的观察控制、对所有动态交互类型的覆盖，以及向真实生产环境的迁移仍未解决。
    - 路线: 计算机使用代理的可复用技能与重放编译
      解决的问题: 通过检索多模态技能工件或将成功运行编译为带屏幕检查的状态机程序，提高代理任务表现或重复任务效率。
      尚未覆盖: 当UI状态、工作流或应用版本变化时的鲁棒性，以及技能/程序能否跨任务和平台迁移尚未建立。
    - 路线: 从真实网页构建可扩展环境
      解决的问题: 从真实URL自动重建可复用、基于源环境的网页环境，以支持大规模代理训练和评测，减少逐站点手动实现。
      尚未覆盖: 需要逐站点初始设置和授权；在覆盖领域之外的保真度及下游真实运行影响未充分测量。
    - 路线: 面向GUI grounding与视频引导输入的模型层方法
      解决的问题: 开发多模态代理模型或关键帧选择方法，以改进grounding、导航和视频引导GUI任务表现。
      尚未覆盖: 跨平台和跨基准的直接比较较少，延迟、可扩展性和对未见交互任务的泛化仍待研究。
    共识:
    - 视觉界面接地是GUI代理进展的核心，无论通过屏幕状态验证、技能中的视觉图形还是关键帧选择。
    - 任务成功通常以Pass@1或综合得分报告，并逐步转向细粒度子目标、成本-准确率或任务类型指标。
    - 构建可复用工件（如基准任务套件、技能库、重放程序、训练数据集或重建环境）是改进或评测代理的常见策略。
    - 静态点击式设置被认为不够充分；领域正扩展到拖拽、动态、视频引导和多应用计算机使用任务。
    分歧:
    - 改进策略不同：部分工作对构建的交互数据进行监督微调，另一些通过技能检索或编译重放在推理期改进，无需每步语言模型调用。
    - 评测目标不同：真实桌面多应用任务、基于浏览器的动态短视频平台、拖拽特化交互、视频引导GUI任务和真实网页环境使用不同成功标准。
    - 表示方式不同：一些方法在技能工件中保留视觉图形，另一些使用纯文本或关键帧选择输入，还有方法采用块级扩散生成。
    - 主要目标不同：部分论文优化任务准确率，另一些优化重复任务速度或成本-准确率，使直接比较困难。
    开放问题:
    - 当应用UI、工作流或平台规则变化时，技能、重放程序或环境重建收益如何迁移？
    - 在内容随动作变化的动态界面中，GUI代理能否达到人类水平的观察控制？
    - 基准任务套件或重建网页环境上的改进能否转化为真实运行可靠性和安全性？
    - 在真实计算机使用部署中，任务准确率、信息效率、动作延迟与重复任务速度之间的合理权衡是什么？
    - 哪些模型或输入选择方法最能支持拖拽操作和视频引导工作流等覆盖不足的交互？
    - 若干顶部论文缺少可见的局限性说明或代码/数据集发布信号，形成负面结果和失败条件的验证缺口。
