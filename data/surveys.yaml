    研究路线矩阵:
    - 路线: 可执行GUI评测的任务抽象与基准形式化
      解决的问题: 将真实GUI工作转化为可测量的任务套件、评分规则以及跨应用或动态信息流的界面/动作假设。
      尚未覆盖: 覆盖范围限于选定平台和交互类型；形式假设尚未在更广泛的代理行为上得到验证。
    - 路线: 动态GUI代理的形式化交互假设
      解决的问题: 澄清内容在动作之间变化的界面中，代理应如何观察和控制，使评测主张更精确。
      尚未覆盖: 证据中只形式化了短视频动态场景；缺少跨场景理论或经验验证。
    - 路线: 冻结模型的技能与执行框架适配
      解决的问题: 通过组织多模态技能或基于动作效果优化执行框架，在不重新训练骨干的情况下提升执行可靠性。
      尚未覆盖: 已报告基准之外的迁移证据较少；缺少局限性和工件细节，留下可复现性缺口。
    - 路线: 数据高效训练与可验证/弱监督
      解决的问题: 通过可验证合成任务、在线RL和未标注截图视觉定位，减少对昂贵人工标注的依赖。
      尚未覆盖: 局限大多缺失；这些训练方式能否预测失败模式或迁移到未见界面未被直接验证。
    - 路线: GUI grounding的不确定性量化与空间安全
      解决的问题: 对可执行grounding决策的后验不确定性及校准点击区域进行基准测试。
      尚未覆盖: 证据仅限于单步grounding；跨模型和跨界面迁移弱，分布偏移下覆盖度下降。
    - 路线: 拖拽与动态屏幕交互分类的扩展
      解决的问题: 将GUI评测从点击为中心扩展到拖拽动作和动态变化界面。
