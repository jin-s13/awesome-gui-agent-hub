  related_work_outline:
  - 'Mainstream direction: Building executable real-world GUI/OS automation benchmarks
    with large task suites, multi-app coverage, and fine-grained or verifiable scoring,
    including dynamic and video-guided settings.'
  - 'Shared research pattern: Papers pair new tasks or environments with multiple
    model baselines and diagnostic metrics to expose failures beyond aggregate success,
    such as sub-goal completion and observation cost.'
  - 'Key differences: Evaluation targets span macOS desktop, browser-based short-video,
    video-guided GUI tasks, and OSWorld/ScienceBoard container tasks; metrics range
    from Pass@1 to cost-accuracy and uncertainty transfer.'
  - 'Trend evolution: Within 2024-2026, work moves from aggregate task success toward
    verifiable task synthesis, fine-grained process diagnostics, uncertainty calibration,
    dynamic interfaces, and frozen-model harness or RL improvements.'
  - 'Open questions: Cross-benchmark and cross-interface generalization, alignment
    of proxy metrics with user decisions, and missing limitation or artifact details
    remain verification gaps.'
  related_work_outline_zh:
  - 主流方向：构建可执行的真实GUI/OS自动化基准，覆盖多应用、细粒度或可验证评分，并向动态与视频引导场景扩展。
  - 研究共性：将新任务或环境与多模型基线及诊断指标结合，揭示总分之外的失败，如子目标完成和观察成本。
  - 关键差异：评测目标涵盖macOS桌面、浏览器短视频、视频引导任务以及OSWorld/ScienceBoard容器任务；指标从Pass@1到成本-准确性和不确定性迁移。
  - 趋势演进：2024-2026年间，研究从聚合成功率转向可验证任务合成、细粒度过程诊断、不确定性校准、动态界面及冻结模型harness或RL改进。
  - 开放问题：跨基准与跨界面泛化、代理指标与用户决策的一致性，以及缺失的局限性与工件信息仍是验证缺口。
  literature_review:
    line_of_work_matrix:
    - line: Real-world desktop and OS task construction
      what_it_solves: Provides executable macOS and OS tasks with deterministic rule-based
        scoring and fine-grained sub-goal checkpoints.
      what_remains_open: Coverage across apps, OS versions, and dynamic workflows
        is not established; limitation evidence is often absent.
    - line: Dynamic and video-guided benchmark environments
      what_it_solves: Introduces changing interfaces and video-guided tasks to test
        observation control and information efficiency.
      what_remains_open: LivingScreen is limited to short-video platforms; video-guided
        benchmark limitation details are missing, so broader dynamic-interface coverage
        is unverified.
    - line: Uncertainty and metric stress-testing
      what_it_solves: Benchmarks post-hoc uncertainty estimation and spatial calibration
        for GUI grounding across many models and datasets.
      what_remains_open: Evidence covers single-step grounding, not multi-step trajectories;
        cross-model and cross-interface transfer is weak and coverage degrades under
        shift.
    - line: Agent and harness improvement on benchmark suites
      what_it_solves: Uses skill libraries, harness optimization, verifiable task
        synthesis, and weak supervision to improve frozen or open agents on benchmark
        tasks.
      what_remains_open: Transfer evidence is limited to selected suites; most limitation
        sections are empty, so robustness and boundary conditions remain open.
    - line: Comparable baselines and reporting practices
      what_it_solves: Standardizes multi-framework and multi-model comparisons and
        reproducible artifact release on benchmark suites.
      what_remains_open: Conclusion stability across implementations, compute budgets,
        and unreported failure modes is not established.
    consensus:
    - Executable benchmark tasks are evaluated across several open and proprietary
      models, with deterministic or verifiable scoring as the main target.
    - Aggregate success is treated as insufficient; fine-grained sub-goal, cost-accuracy,
      observation, and uncertainty diagnostics are used to reveal hidden failure modes.
    - Current agents remain below human-level in dynamic or multi-step settings and
      show weak cross-setting transfer or calibration.
    - Several papers provide code, dataset, or artifact signals, but missing limitation
      sections leave methodology boundaries unverified.
    disagreements:
    - 'They evaluate different deployment settings: desktop macOS GUI+CLI, browser-based
      short-video, video-guided GUI interaction, containerized OS tasks, and single-step
      GUI grounding.'
    - 'They optimize different levers: benchmark design, multimodal skill retrieval,
      execution-harness editing, verifiable RL task synthesis, weakly-supervised grounding,
      or uncertainty calibration.'
    - Metric emphasis varies from Pass@1 and sub-goal completion to cost-accuracy
      information efficiency and uncertainty-ranking or coverage.
    - Some contributions are benchmark-only observations, while others directly change
      agent training or execution, making comparability across contributions indirect.
    open_questions:
    - Can fine-grained and uncertainty diagnostics be standardized so benchmark conclusions
      transfer without target-specific reranking?
    - Do harness, skill, and RL gains persist across unseen OS versions, dynamic interfaces,
      and longer multi-step workflows?
    - Which proxy metrics best align with user decision quality when observation cost,
      calibration shift, and execution variability are present?
    - What reporting and artifact requirements are needed given that several limitation
      sections are absent and reproducibility signals are uneven?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 真实桌面与OS任务构建
      解决的问题: 提供可执行macOS与OS任务、确定性规则评分和细粒度子目标检查点。
      尚未覆盖: 应用、OS版本与动态工作流的覆盖未验证，局限性信息常常缺失。
    - 路线: 动态与视频引导基准环境
      解决的问题: 引入界面变化和视频引导任务，检验观察控制与信息效率。
      尚未覆盖: LivingScreen局限于短视频平台；视频引导基准局限细节缺失，更广动态界面覆盖未验证。
    - 路线: 不确定性与指标压力测试
      解决的问题: 跨多模型多数据集评估GUI grounding的后验不确定性与空间校准。
      尚未覆盖: 证据仅限于单步grounding，未覆盖多步轨迹；跨模型与跨接口迁移弱，分布偏移下覆盖下降。
    - 路线: 基于基准套件的智能体与harness改进
      解决的问题: 通过技能库、harness优化、可验证任务合成和弱监督提升冻结或开源智能体。
      尚未覆盖: 迁移证据限于选定套件；多数局限性为空，鲁棒性与边界条件未明。
    - 路线: 可比基线与报告实践
      解决的问题: 标准化多框架、多模型比较和可复现工件发布。
      尚未覆盖: 不同实现、算力预算和未报告失败模式下的结论稳定性未建立。
    共识:
    - 可执行基准任务在多个开源与闭源模型上评测，确定性或可验证评分是主要目标。
    - 总分不足以反映能力；细粒度子目标、成本-准确性、观察与不确定性诊断被用于揭示隐藏失败。
    - 当前智能体在动态或多步设置下尚未达到人类水平，跨设置迁移或校准较弱。
    - 多数论文提供代码、数据或工件线索，但局限性部分常缺失，方法边界难以审计。
    分歧:
    - 评测场景不同：macOS桌面GUI+CLI、浏览器短视频、视频引导GUI交互、容器化OS任务与单步GUI grounding。
    - 优化手段不同：基准设计、多模态技能检索、执行harness编辑、可验证RL任务合成、弱监督grounding或不确定性校准。
    - 指标侧重不同：Pass@1与子目标完成、成本-准确性信息效率、不确定性排序与覆盖率。
    - 部分工作仅观察基准表现，部分直接改变训练或执行，导致贡献之间的可比性间接。
    开放问题:
    - 细粒度与不确定性诊断能否标准化，使基准结论无需目标特定重排即可迁移？
    - harness、技能和RL的提升能否在未见OS版本、动态界面和更长多步工作流中保持？
    - 当观察成本、校准偏移和执行变异性存在时，哪些代理指标更符合用户决策质量？
    - 鉴于部分局限性缺失、复现信号不均，需要哪些报告与工件要求？
