  literature_review:
    line_of_work_matrix:
    - line: Benchmarking and evaluation frameworks for GUI agents
      what_it_solves: Defines task suites and metrics for desktop, dynamic short-video,
        and drag-based interactions, exposing failure modes beyond click-only static
        screens.
      what_remains_open: No formal theory of interaction is provided; platform-specific
        coverage leaves cross-application and cross-interface generalization unresolved.
    - line: Multimodal skill and knowledge reuse
      what_it_solves: Organizes per-application procedural knowledge with visual figures
        for on-demand retrieval, improving UI element identification and workflow
        state verification.
      what_remains_open: Evidence is limited to a few benchmarks; scalability, freshness,
        and safety boundaries of skill artifacts across unseen applications remain
        unmeasured.
    - line: Self-improvement and data-efficient learning
      what_it_solves: Reduces reliance on human annotation or frozen-model limitations
        through harness optimization, verifiable task synthesis with online RL, and
        weak supervision from unannotated screenshots.
      what_remains_open: Transfer and failure prediction outside OSWorld and ScienceBoard
        are only partially tested; formal guarantees about behavior change are absent.
    - line: Uncertainty quantification and safe grounding
      what_it_solves: Benchmarks post-hoc uncertainty methods for GUI grounding across
        models and datasets, including conformal spatial safety regions.
      what_remains_open: Ranking transfer across model classes and interfaces is weak;
        multi-step agent trajectories and distribution-shift robustness are not covered.
    consensus:
    - Evaluation is moving toward fine-grained, multi-step, multi-application tasks
      rather than single screenshot grounding.
    - Systems often pair a frozen or lightly adapted vision-language model with external
      skills, harness, or reinforcement-learning-generated tasks, keeping model changes
      minimal.
    - Researchers distinguish coarse Pass@1 from finer signals such as sub-goal completion,
      cost accuracy, or confidence calibration.
    disagreements:
    - Auxiliary knowledge can be text-only or multimodal with visual figures; the
      multimodal form is claimed to improve UI identification but is tested on fewer
      settings.
    - Improvement can come from harness-level source edits, weak supervision over
      unannotated screenshots, or online RL over synthesized verifiable tasks, implying
      different data and compute assumptions.
    - Evaluation scope varies from single-step grounding uncertainty to full desktop
      workflows, dynamic short-video interfaces, and drag interactions, so evidence
      is not directly comparable.
    - Reliability methods differ for open-weight models where hidden states are available
      versus closed-source APIs where only outputs can be observed.
    open_questions:
    - Which formal interaction assumptions about observation control and dynamic content
      are necessary for reliable GUI agent behavior?
    - Can uncertainty rankings transfer across model classes and interfaces, or should
      deployment-specific calibration be required?
    - How well do skill libraries and optimized harnesses generalize beyond the benchmark
      applications and interaction modes used here?
    - Since several papers omit limitations or code/dataset details, what reproducibility
      checks are needed to validate reported gains?
