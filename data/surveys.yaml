  related_work_outline:
  - 'Mainstream direction: The field is shifting from static click-only GUI agents
    toward dynamic, long-horizon tasks that require diverse interactions (drag, context
    management) and new training paradigms (weakly supervised, online RL), while evaluation
    protocols become more granular and multi-dimensional.'
  - 'Shared research pattern: All works aim to expand GUI agent capabilities through
    improved representation, training, or evaluation, emphasizing end-to-end or bridging
    approaches from visual perception to action.'
  - 'Key differences: Training supervision diverges into weakly supervised (unannotated
    screenshots) versus online RL (verifiable task synthesis); action spaces are extended
    with context management, drag, or video keyframe extraction; evaluation targets
    differ in task completion, observation efficiency, or uncertainty quantification.'
  - 'Trend evolution: Within the 2024–2026 frontier, the field has rapidly moved from
    simple benchmarks to comprehensive ones covering dynamic interfaces, long horizons,
    and multiple interaction types, while methods shift from imitation learning to
    scalable training and richer evaluation granularity.'
  - 'Open questions: How to unify observation control, uncertainty quantification,
    and diverse interaction types into a single agent framework; the generalization
    boundaries of weak supervision and RL methods; and whether evaluation protocols
    truly isolate method contributions from system components.'
  related_work_outline_zh:
  - 主流方向：从静态点击型GUI代理扩展到动态界面、长时程任务和多样化交互（拖拽、上下文管理），并采用弱监督、在线RL等新训练范式，同时发展细粒度评估协议以捕获观察控制、不确定性等能力。
  - 研究共性：所有工作都旨在提升GUI代理在复杂、真实场景中的能力，通过改进表示、训练或评估方法，强调从视觉感知到动作的端到端或桥接方法。
  - 关键差异：在训练监督信号上，分为弱监督（利用未标注数据）与在线RL（利用可验证任务合成）；在动作空间上，分别扩展了上下文管理动作、拖拽交互或视频关键帧提取；在评估目标上，有的关注任务完成精度，有的关注观察效率或不确定性量化。
  - 趋势演进：2024-2026年间，领域从相对简单的基准快速转向涵盖动态界面、长时程和多种交互的全面基准，方法从纯模仿学习转向可扩展训练范式，并开始重视评估的粒度和可靠性。
  - 开放问题：如何将观察控制、不确定性量化和多种交互类型统一到一个代理框架中；弱监督和RL方法的泛化边界；以及评估协议是否能真正隔离方法贡献而非系统组件。
  literature_review:
    line_of_work_matrix:
    - line: 'Training paradigms: weak supervision and online RL'
      what_it_solves: Reduces reliance on expensive human annotations by exploiting
        unlabeled screenshots (e.g., GUICrafter) or synthesizing verifiable tasks
        for online RL (e.g., ScaleCUA), enabling scalable GUI agent training.
      what_remains_open: Cross-platform generalization (desktop, mobile, web) and
        trade-offs between data efficiency and final performance remain unquantified;
        training recipes are not yet compared under a unified evaluation.
    - line: Action space and context management
      what_it_solves: Extends agent actions beyond simple clicks to include drag interactions
        (DragOn) and proactive context management actions (MemGUI-Agent), supporting
        long-horizon and complex interaction tasks.
      what_remains_open: Integrating context management with uncertainty awareness,
        and balancing expanded action spaces with planning efficiency in multi-step
        tasks; evidence is limited to specific platforms.
    - line: Evaluation protocols and benchmarks
      what_it_solves: Introduces fine-grained, multi-dimensional metrics that capture
        observation control (LivingScreen), uncertainty quantification (Argus), and
        drag capabilities (DragOn), moving beyond single success rates to better isolate
        method contributions.
      what_remains_open: Applicability to multi-step trajectories, consistency across
        benchmarks, and whether the protocols truly isolate method effects from surrounding
        system choices (e.g., skill library in MacAgentBench).
    consensus:
    - Current GUI agents still fall well below human performance on complex, dynamic,
      and long-horizon tasks, requiring capabilities beyond simple click-based interaction.
    - Evaluation should decompose success into finer-grained ability dimensions (sub-goal
      completion, observation efficiency, uncertainty) to identify failure modes,
      rather than relying solely on aggregate Pass@1.
    - Scalability of training data or tasks, either through weak supervision or automated
      synthesis, is a critical direction for improving agent performance.
    disagreements:
    - 'Training supervision: one line uses weak supervision from unannotated screenshots
      to minimize data cost, while another uses online RL with verifiable reward to
      maximize performance, leading to different data efficiency–accuracy trade-offs.'
    - 'Action space extension: works differ in which interaction types they prioritize—explicit
      context-management actions, drag-based manipulation, or video keyframe extraction—each
      targeting different task families and deployment assumptions.'
    - 'Evaluation focus: benchmarks emphasize different aspects such as task completion
      vs. observation cost, uncertainty calibration, or coverage of drag interactions,
      making cross-benchmark comparison difficult.'
    open_questions:
    - How can observation control (over/under-observation) be internalized as a capability
      of the agent model, rather than only observed as an evaluation metric?
    - Can post-hoc uncertainty quantification methods remain effective over multi-step
      trajectories and guide safe exploration or fallback during deployment?
    - What are the main causes of performance degradation when weak-supervision and
      RL training methods are transferred across applications and platforms?
    - How can a unified evaluation framework be built that simultaneously covers click,
      drag, context management, and dynamic interfaces while isolating method contributions
      from system-level confounds?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 训练范式：弱监督与在线强化学习
      解决的问题: 通过利用未标注截图（如GUICrafter）或可验证任务合成（如ScaleCUA）减少对昂贵人工标注的依赖，实现可扩展的GUI代理训练。
      尚未覆盖: 跨平台（桌面、移动、Web）泛化能力，以及数据效率与最终性能之间的权衡尚未量化；不同训练配方缺乏统一评估对比。
    - 路线: 动作空间与上下文管理
      解决的问题: 将代理动作从简单点击扩展到拖拽交互（DragOn）和主动上下文管理动作（MemGUI-Agent），以支持长时程和复杂任务。
      尚未覆盖: 如何将上下文管理与不确定性感知结合，以及在多步任务中平衡扩展的动作空间与规划效率；现有证据仅限于特定平台。
    - 路线: 评估协议与基准
      解决的问题: 引入细粒度、多维度的指标，捕获观察控制（LivingScreen）、不确定性量化（Argus）和拖拽能力（DragOn），超越单一成功率，以更好地区分方法贡献。
      尚未覆盖: 在多步轨迹上的适用性，不同基准间的一致性，以及评估协议是否真正隔离了方法效果与系统组件（如MacAgentBench中的技能库）。
    共识:
    - 当前GUI代理在复杂、动态和长时程任务上仍远未达到人类水平，需要超越简单点击的能力。
    - 评估应分解为更细粒度的能力维度（子目标完成、观察效率、不确定性），以识别失败模式，而非仅依赖总体Pass@1。
    - 通过弱监督或自动合成实现训练数据或任务的可扩展性，是提升代理性能的关键方向。
    分歧:
    - 训练监督：一方利用未标注截图进行弱监督以最小化数据成本，另一方使用可验证奖励的在线RL以最大化性能，导致数据效率与准确性的不同权衡。
    - 动作空间扩展：各工作优先支持的交互类型不同——显式上下文管理动作、基于拖拽的操作或视频关键帧提取——各自针对不同的任务族和部署假设。
    - 评估重点：不同基准强调的维度不同，如任务完成与观察成本、不确定性校准或拖拽覆盖，使得跨基准比较困难。
    开放问题:
    - 观察控制（过度/不足观察）的能力如何内化到代理模型中，而非仅作为评估指标被观测？
    - 后验不确定性量化方法能否在多步轨迹中保持有效，并指导代理在部署中的安全探索或回退？
    - 弱监督和RL训练方法在跨应用和跨平台迁移时，性能下降的主要原因是什么？
    - 如何构建一个统一评估框架，同时覆盖点击、拖拽、上下文管理和动态界面，并隔离方法贡献与系统级混淆因素？
