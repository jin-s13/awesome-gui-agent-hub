  literature_review_zh:
    研究路线矩阵:
    - 路线: 真实桌面与网页基准测试
      解决的问题: 评估多应用、GUI+CLI混合工作流中的端到端智能体表现，并用规则化或成本感知指标衡量。
      尚未覆盖: 跨OS与跨领域覆盖；基准成功是否对应真实专业工作流；多个基准缺少局限性说明。
    - 路线: 可复用多模态技能与执行记忆
      解决的问题: 通过存储视觉或文本技能，或编译状态机程序，在重复计算机任务上提升准确率与速度，降低逐步推理成本。
      尚未覆盖: 向未见应用的迁移；对UI变化的鲁棒性；防止陈旧或错误存储程序的验证。
    - 路线: 多模态智能体统一训练与动作空间
      解决的问题: 训练端到端GUI智能体，统一视觉定位、导航、代码执行或扩散解码，覆盖移动、桌面和网页平台。
      尚未覆盖: 跨平台泛化与推理成本；统一动作空间是否始终优于提示级工具组合。
    - 路线: 动态与非点击交互的接地
      解决的问题: 处理拖拽操作、动态短视频界面以及动作之间屏幕状态发生变化的GUI任务。
      尚未覆盖: 观察控制与成本-准确率权衡；平台覆盖有限；向其他动态界面的泛化。
    - 路线: 视频引导的GUI任务感知
      解决的问题: 通过任务相关关键帧提取连接视频理解与GUI智能体执行，提升视频引导交互任务的性能。
      尚未覆盖: 基准广度与真实指令复杂度；可见证据中未报告局限性。
    共识:
    - 视觉与屏幕状态接地是提升GUI智能体成功率的关键。
    - 评估正从简单点击/输入任务扩展到GUI+CLI、代码执行、拖拽和动态内容。
    - 细粒度子目标或成本-准确率指标能揭示通过率掩盖的能力差异。
    - 复用成功历史和控制观察频率被认为是实际计算机使用智能体的重要方向。
    分歧:
    - 技能表示与复用方式不同：显式多模态技能库、纯文本技能和编译状态机重放程序并存。
    - 监督与优化方式不同：规则或奖励驱动评测、监督微调、在线RL和提示级框架路径各被采用。
    - 评估对象与指标不同：静态桌面/网页、动态短视频、拖拽和视频引导任务分别采用Pass@1、成本-准确率或子目标完成度。
    - 交互模式与生成范式不同：GUI与CLI分离工具调用、GUI+代码统一动作空间、自回归与块级扩散生成均有体现。
    开放问题:
    - MacAgentBench、OSWorld-Verified或LivingScreen上的提升能否迁移到真实办公、移动和专业工具工作流？
    - 动态界面中应如何控制观察频率，使智能体在准确率和信息成本上接近人类表现？
    - 当UI布局和应用工作流变化时，存储的技能或重放程序如何保持正确，避免陈旧或错误积累？
    - 在什么条件下增加代码执行对GUI智能体有益而非有害？
    - 由于部分论文未报告局限且工件信号有限，报告结果的可复现性和归因可信度如何？
