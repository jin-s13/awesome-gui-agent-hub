  related_work_outline:
  - 'Mainstream direction: GUI agent research is moving from static click-based benchmarks
    to richer, more realistic environments that include dynamic interfaces, long-horizon
    tasks, and diverse interaction types such as drag and GUI+CLI. Training methods
    are shifting from large-scale supervised fine-tuning toward data-efficient paradigms
    like online RL and weakly-supervised curriculum learning, while evaluation increasingly
    emphasizes fine-grained, multi-checkpoint metrics and uncertainty quantification.'
  - 'Shared research pattern: Each line of work addresses a specific bottleneck—data
    scarcity, context management, interaction coverage, or evaluation fidelity—by
    constructing a specialized benchmark or training recipe. Vision-language models
    are the universal backbone, and the core contribution is often a novel training
    objective or data pipeline that improves performance on a targeted set of realistic
    computer-use tasks.'
  - 'Key differences: Training paradigms diverge: online RL with verifiable task synthesis,
    weakly-supervised visual grounding with minimal annotation, and supervised fine-tuning
    with explicit context management actions. The interaction interfaces studied also
    differ, ranging from drag operations and dynamic video-guided observation to desktop
    GUI+CLI tasks. Evaluation metrics and deployment platforms (macOS, mobile, short-video
    browsers) further separate the works, making direct comparisons difficult.'
  - 'Trend evolution: From 2024 to 2026, the field has rapidly expanded from single-step
    click tasks to long-horizon, multi-application scenarios. The emergence of uncertainty
    quantification and conformal prediction for GUI agents is a 2026 frontier. Data
    efficiency has become a central concern, with a clear shift toward leveraging
    unlabeled visual data and online interaction. The evidence suggests the community
    is converging on the need for fine-grained evaluation that isolates model capability
    from framework design.'
  - 'Open questions: Can online RL and task-synthesis pipelines be safely deployed
    on real devices without catastrophic failures? Do weakly-supervised visual grounding
    methods generalize to precise, continuous interactions like drag? How should context
    management strategies adapt to diverse application workflows and task lengths?
    Is the strong UQ ranking transfer observed within a single model class robust
    to cross-model and cross-interface scenarios, and can it be integrated into agent
    decision loops to improve safety?'
  related_work_outline_zh:
  - 主流方向：GUI代理研究正从静态点击基准测试转向更丰富、更真实的环境，包括动态界面、长时域任务和拖拽、GUI+CLI等多样化交互类型。训练方法从大规模监督微调转向数据高效范式，如在线强化学习和弱监督课程学习，评估则越来越强调细粒度多检查点评分和不确定性量化。
  - 研究共性：每条路线都针对特定瓶颈——数据稀缺、上下文管理、交互覆盖或评估保真度——通过构建专门的基准或训练配方来解决。视觉语言模型是通用骨干，核心贡献通常是针对一组真实计算机使用任务的新颖训练目标或数据流水线，以提升性能。
  - 关键差异：训练范式存在分歧：利用可验证任务合成的在线RL、使用极少标注的弱监督视觉定位，以及具有显式上下文管理动作的监督微调。所研究的交互接口也不同，从拖拽操作和动态视频引导观察到桌面GUI+CLI任务。评估指标和部署平台（macOS、移动端、短视频浏览器）进一步区分了这些工作，使得直接比较困难。
  - 趋势演进：从2024年到2026年，该领域迅速从单步点击任务扩展到长时域、多应用场景。针对GUI代理的不确定性量化和共形预测在2026年成为前沿。数据效率已成为核心关注点，明显转向利用未标记视觉数据和在线交互。证据表明，学界正汇聚于需要细粒度评估，以将模型能力与框架设计分离。
  - 开放问题：在线RL和任务合成流水线能否在真实设备上安全部署而不发生灾难性失败？弱监督视觉定位方法能否泛化到拖拽等精确连续交互？上下文管理策略应如何适应多样化的应用工作流和任务长度？在单个模型类内观察到的强UQ排名迁移是否对跨模型和跨接口场景稳健，并且能否集成到代理决策循环中以提升安全性？
  literature_review:
    line_of_work_matrix:
    - line: Online RL and verifiable task synthesis for computer-use agents
      what_it_solves: Trains agents on real-world computer tasks without human annotation
        by generating verifiable tasks in simulated environments and applying efficient
        online RL, achieving state-of-the-art on OSWorld and ScienceBoard.
      what_remains_open: Whether the synthetic task distribution covers the full diversity
        of real user workflows, and how to ensure safe exploration on physical devices
        without irreversible side effects.
    - line: Weakly-supervised and data-efficient visual grounding
      what_it_solves: Reduces reliance on expensive human annotations by pre-training
        GUI agents on massive unannotated screenshots using contextual signals, then
        calibrating with a small amount of high-quality data via RL.
      what_remains_open: The quality of the weak supervision signal for tasks requiring
        precise spatial manipulation, and the lower bound of annotated data needed
        to achieve reliable performance across diverse applications.
    - line: Proactive context management for long-horizon tasks
      what_it_solves: Addresses the context-window limitation in long-horizon mobile
        GUI tasks by treating context management as first-class policy actions, compressing
        history while preserving critical facts.
      what_remains_open: Generalization of context management strategies to unseen
        applications and workflows, and whether the optimal compression policy can
        be learned from data rather than heuristically designed.
    - line: Interaction-specific benchmarks and methods (drag, dynamic observation)
      what_it_solves: Fills the gap in existing GUI agent research by providing datasets
        and environments for underrepresented interaction types such as drag-based
        manipulation and observation control in dynamic short-video interfaces.
      what_remains_open: Unifying multiple interaction modalities into a single agent,
        and transferring models trained on one interaction type to others without
        retraining.
    - line: Uncertainty quantification and evaluation methodology
      what_it_solves: Provides tools to benchmark the reliability of GUI grounding
        agents through post-hoc uncertainty quantification and conformal prediction,
        enabling selective deployment and spatial safety margins.
      what_remains_open: Whether UQ rankings transfer across model tiers and observation
        interfaces, and how to integrate uncertainty estimates into closed-loop agent
        decision-making to prevent cascading errors.
    consensus:
    - Vision-language models are the dominant backbone for GUI agents, and all methods
      evaluate on realistic computer-use tasks that go beyond simple web navigation.
    - Fine-grained, multi-checkpoint evaluation is necessary to diagnose model capabilities,
      as Pass@1 alone can mask significant differences in sub-goal completion.
    - Data scarcity is a universal challenge; the community is moving toward training
      paradigms that leverage unlabeled visual data or online interaction to reduce
      annotation costs.
    - Real-world deployment requires handling dynamic interfaces, long-horizon dependencies,
      and diverse interaction types, which are not captured by static click-only benchmarks.
    disagreements:
    - 'Training paradigm: online RL with verifiable synthetic tasks (SCALECUA) versus
      weakly-supervised curriculum learning from unannotated screenshots (GUICrafter)
      versus supervised fine-tuning with explicit context actions (MemGUI-Agent).'
    - 'Interaction focus: dedicated drag-based manipulation (DragOn) versus observation
      control in dynamic interfaces (LivingScreen) versus mixed GUI+CLI (MacAgentBench),
      with no single agent yet evaluated across all modalities.'
    - 'Evaluation metric: task success rate (Pass@1) versus cost-accuracy efficiency
      versus sub-goal completion rate versus UQ ranking stability, reflecting different
      priorities in reliability, efficiency, and safety.'
    - 'Deployment platform: macOS desktop, mobile devices, and browser-based short-video
      platforms, with limited cross-platform generalization evidence.'
    open_questions:
    - How can online RL be safely deployed on real devices, and what are the failure
      modes of synthetic-to-real task transfer?
    - Can weakly-supervised visual grounding achieve the precision required for continuous
      interactions like drag and slider manipulation?
    - What is the optimal strategy for proactive context management that generalizes
      across applications and task lengths?
    - How can uncertainty quantification be integrated into agent decision loops to
      improve safety and prevent cascading errors?
    - Is there a unified agent architecture that can handle click, drag, dynamic observation,
      and GUI+CLI interactions without sacrificing performance on any single modality?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 计算机使用代理的在线强化学习与可验证任务合成
      解决的问题: 通过生成可验证的模拟环境任务并应用高效在线RL，在无需人类标注的情况下训练代理完成真实计算机使用任务，在OSWorld和ScienceBoard上达到最优。
      尚未覆盖: 合成任务分布是否覆盖真实用户工作流的全部多样性，以及如何在物理设备上安全探索而不产生不可逆副作用。
    - 路线: 弱监督与数据高效视觉定位
      解决的问题: 通过利用上下文信号在大规模未标注截图上预训练GUI代理，然后用少量高质量数据通过RL校准，减少对昂贵人工标注的依赖。
      尚未覆盖: 弱监督信号在需要精确空间操作的任务中的质量，以及在不同应用中达到可靠性能所需的最少标注数据量。
    - 路线: 长时域任务的主动上下文管理
      解决的问题: 通过将上下文管理视为第一类策略动作，压缩历史并保留关键信息，解决长时域移动GUI任务中的上下文窗口限制。
      尚未覆盖: 上下文管理策略对未见应用和工作流的泛化，以及最优压缩策略能否从数据中学习而非启发式设计。
    - 路线: 交互特定基准与方法（拖拽、动态观察）
      解决的问题: 通过为拖拽操作和动态短视频界面中的观察控制等代表性不足的交互类型提供数据集和环境，填补现有GUI代理研究的空白。
      尚未覆盖: 将多种交互模态统一到单个代理中，以及将在一种交互类型上训练的模型迁移到其他类型而无需重新训练。
    - 路线: 不确定性量化与评估方法
      解决的问题: 通过后验不确定性量化和共形预测，为GUI定位代理的可靠性评估提供基准，支持选择性部署和空间安全边界。
      尚未覆盖: UQ排名是否能在模型层级和观察接口间迁移，以及如何将不确定性估计集成到闭环代理决策中以防止级联错误。
    共识:
    - 视觉语言模型是GUI代理的主导骨干，所有方法均在超越简单网页导航的真实计算机使用任务上进行评估。
    - 细粒度、多检查点评分对于诊断模型能力是必要的，因为仅凭Pass@1可能掩盖子目标完成度上的显著差异。
    - 数据稀缺是普遍挑战；学界正转向利用未标注视觉数据或在线交互的训练范式，以降低标注成本。
    - 真实部署需要处理动态界面、长时域依赖和多样化交互类型，这些是静态纯点击基准无法捕捉的。
    分歧:
    - 训练范式：使用可验证合成任务的在线RL（SCALECUA）与从未标注截图的弱监督课程学习（GUICrafter）与带有显式上下文动作的监督微调（MemGUI-Agent）。
    - 交互焦点：专用的拖拽操作（DragOn）与动态界面中的观察控制（LivingScreen）与混合GUI+CLI（MacAgentBench），尚无单一代理在所有模态上进行评估。
    - 评估指标：任务成功率（Pass@1）与成本-准确性效率与子目标完成率与UQ排名稳定性，反映了在可靠性、效率和安全方面的不同侧重。
    - 部署平台：macOS桌面、移动设备和基于浏览器的短视频平台，跨平台泛化证据有限。
    开放问题:
    - 在线RL如何安全地部署在真实设备上，合成到真实任务迁移的失败模式是什么？
    - 弱监督视觉定位能否达到拖拽和滑块操作等连续交互所需的精度？
    - 能够跨应用和任务长度泛化的主动上下文管理最优策略是什么？
    - 如何将不确定性量化集成到代理决策循环中以提高安全性并防止级联错误？
    - 是否存在统一的代理架构，能够处理点击、拖拽、动态观察和GUI+CLI交互，而不牺牲任何单一模态的性能？
