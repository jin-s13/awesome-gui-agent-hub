  related_work_outline_zh:
  - 主流方向：当前工作集中于真实桌面、网页、移动与动态界面场景中GUI/计算机使用代理的评测与能力增强，代表如MacAgentBench、LivingScreen、WebAnything等。
  - 研究共性：论文通常将环境/任务套件与细粒度评估或训练信号结合，并将视觉/多模态状态作为界面定位与工作流验证的核心。
