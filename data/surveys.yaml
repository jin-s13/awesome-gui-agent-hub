  literature_review:
    line_of_work_matrix:
    - line: Real-world and dynamic GUI task-suite benchmarking
      what_it_solves: Expands evaluation coverage for computer-use agents across desktop
        multi-app GUI/CLI tasks, dynamic short-video interfaces, and drag-based interactions;
        provides fine-grained pass, sub-goal, cost-accuracy, and grounding signals.
      what_remains_open: Most evidence is platform-specific or single-step; cross-interface
        and multi-step trajectory transfer is weak, and the benchmarks do not cover
        all dynamic interface types.
    - line: Post-hoc skill and harness adaptation for frozen agents
      what_it_solves: Improves frozen GUI backbone models without retraining by adding
        hierarchical multimodal skill libraries or automatically optimizing the executable
        harness from observed action effects.
      what_remains_open: Cross-task and cross-benchmark transfer of skills or harness
        edits remains underevidenced; repeated-run diagnosis assumptions and bounded
        source edits may limit deployment generalization.
    - line: Scalable training through weak supervision and online RL
      what_it_solves: Reduces human annotation dependence and scales reinforcement
        learning for computer-use agents by using unannotated screenshots, verifiable
        task synthesis, and efficient rollout allocation.
      what_remains_open: Synthetic-to-real gap, verifier quality, and whether sample-efficiency
        gains transfer to unseen dynamic or multi-application environments remain
        open.
    - line: Uncertainty and reliability quantification
      what_it_solves: Evaluates post-hoc uncertainty ranking and conformal spatial
        safety for GUI grounding; also diagnoses over/under-observation and capability
        differences hidden by similar aggregate success rates.
      what_remains_open: Cross-model and cross-interface uncertainty ranking transfer
        is weak, and existing evidence mainly covers single-step executable grounding
        rather than multi-step agent trajectories.
    consensus:
    - Frontier models still fall short of reliable human-level performance on realistic
      GUI tasks, with failures often concentrated in sub-goal completion, information
      efficiency, or uncertainty calibration rather than aggregate pass rate.
    - Focused evaluation instruments uncover capability boundaries that aggregate
      metrics hide, including multimodal visual grounding, drag interaction, and observation
      control.
    - Improving the surrounding skills, execution harness, data, or evaluation while
      keeping the backbone model frozen is a recurring route and can yield measurable
      gains.
    disagreements:
    - 'Optimization target differs: some work modifies context or executable harness
      at inference time, while other work fine-tunes or applies online RL to model
      parameters; evidence does not agree on which level should be optimized.'
    - 'Reliability is operationalized differently: deterministic desktop task completion,
      cost-accuracy on dynamic screens, drag grounding, and post-hoc uncertainty each
      define the problem in distinct ways.'
    - 'Supervision and task generation assumptions vary: unannotated screenshots with
      small annotated calibration, verifiable docker-synthesized RL tasks, and rule-based
      benchmark scoring depend on different label or verifier quality assumptions.'
    - 'Interaction and deployment coverage differ: GUI-only, GUI+CLI, dynamic content,
      and drag settings are evaluated separately, so findings may not transfer across
      these interaction modes.'
    open_questions:
    - Can skill or harness optimization transfer beyond the tested benchmarks to unseen
      applications and interfaces without handcrafted re-adaptation?
    - Does training on verifiable synthetic tasks predict real deployment failure
      modes, or only benchmark pass-rate improvements?
    - How can uncertainty quantification and failure diagnosis extend from single-step
      GUI grounding to multi-step trajectories with changing observations?
    - What task abstractions or formal conditions would align observation control,
      information efficiency, and safety metrics with real-world computer-use reliability?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 真实与动态GUI任务套件基准测试
      解决的问题: 扩展计算机使用智能体在桌面多应用GUI/CLI任务、短视频动态界面和拖拽交互上的评测覆盖，提供细粒度的通过、子目标、成本准确率和定位信号。
      尚未覆盖: 现有证据多局限于特定平台或单步定位；跨界面和多步轨迹的迁移较弱，基准也无法覆盖所有动态界面类型。
    - 路线: 基于技能与执行框架的冻结智能体适配
      解决的问题: 在不重训骨干模型的情况下，通过分层多模态技能库或依据观察到的动作效果自动优化执行框架，提升GUI智能体表现。
      尚未覆盖: 技能或框架编辑的跨任务、跨基准迁移仍缺少证据；重复运行诊断假设和有界源码编辑可能限制部署泛化。
    - 路线: 弱监督与在线强化学习驱动的训练扩展
      解决的问题: 利用未标注截图、可验证任务合成和高效rollout分配，减少人工标注依赖并扩大计算机使用智能体的强化学习训练规模。
      尚未覆盖: 合成到真实环境的差距、验证器质量，以及样本效率提升能否迁移到未见动态或多应用场景仍未解决。
    - 路线: 不确定性与可靠性量化
      解决的问题: 评估GUI定位中的后验不确定性排名和共形空间安全，同时诊断过度观察/观察不足以及相似总体成功率下被隐藏的能力差异。
