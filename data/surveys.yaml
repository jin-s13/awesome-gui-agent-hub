  literature_review:
    line_of_work_matrix:
    - line: Benchmark and evaluation design for GUI capabilities
      what_it_solves: Captures sub-goal completion, information efficiency, interaction-type
        coverage, and grounding reliability that aggregate success rates miss.
      what_remains_open: Coverage is bounded to specific platforms or interaction
        types; some limitation fields are missing; multi-step reliability is not fully
        evaluated.
    - line: Data-efficient training and self-improvement methods
      what_it_solves: Reduces dependence on dense human annotations by using large
        unannotated screenshots, verifiable synthesized tasks, or evidence-driven
        harness edits around frozen models.
      what_remains_open: Generalization beyond reported benchmarks is not established;
        gains may depend on harness, task synthesis quality, or calibration data;
        method contribution versus surrounding system choices is not fully isolated.
    - line: Observation and action-grounding methods for dynamic or non-click interfaces
      what_it_solves: Addresses changing screen content, video frame selection, and
        drag interactions beyond click-only grounding.
      what_remains_open: Observation control failure remains unsolved; evidence is
        limited to short-video platforms and selected drag categories; broader dynamic
        interface types are unverified.
    - line: Uncertainty and reliability estimation for grounding
      what_it_solves: Ranks and calibrates post-hoc uncertainty for grounding and
        creates spatial conformal click regions for safety.
      what_remains_open: Transfer of UQ rankings across model tiers and interfaces
        is weak; evaluation is single-step only; coverage degrades under distribution
        shift, and training-time methods are not examined.
    consensus:
    - Fine-grained evaluation reveals capability differences that aggregate success
      or pass rates hide, such as sub-goal progress, information cost, and action-type
      competence.
    - 'Research is converging on reducing annotation cost and model retraining: methods
      exploit unannotated screenshots, synthesized verifiable tasks, repeated-run
      evidence, and frozen-harness edits.'
    - Dynamic or non-click grounding remains a weak spot, with evidence showing failures
      in observation control, drag action coverage, and uncertainty transfer.
    disagreements:
    - 'Intervention point differs: model-parameter training or fine-tuning versus
      frozen-model harness evolution, input keyframe selection, or post-hoc uncertainty
      calibration.'
    - 'Evaluation target differs: static desktop goal completion, dynamic cost-accuracy,
      video-guided task success, drag-based manipulation, or single-step grounding
      reliability define different capability notions.'
    - 'Supervision and verification differ: unannotated screenshots with small annotated
      calibration, multi-agent synthesized verifiable tasks, repeated-run evidence,
      and post-hoc benchmark-based UQ adopt distinct signals.'
    - 'Generalization strategy differs: some studies aim for cross-platform or frozen-harness
      transfer, while others remain within a single platform or action family, changing
      which risks are tested.'
    open_questions:
    - What observation-control mechanism would prevent over- and under-observation
      in dynamic interfaces?
    - How far do harness, training-efficiency, and uncertainty methods transfer across
      model tiers, operating systems, applications, and interaction modes?
    - Can evaluation metrics isolate model capability from framework skill libraries,
      harness code, and input-preprocessing choices?
    - How should uncertainty calibration extend beyond single-step grounding to full
      multi-step agent trajectories?
    - What evaluation can cover the under-tested boundary of dynamic video, drag,
      and GUI+CLI interactions in a common protocol?
  literature_review_zh:
    研究路线矩阵:
    - 路线: GUI能力基准与评估设计
      解决的问题: 捕捉总体成功率遗漏的子目标进展、信息效率、交互类型覆盖和定位可靠性差异。
      尚未覆盖: 仅覆盖特定平台或交互类型；部分证据缺少局限性说明；多步可靠性仍未充分检验。
    - 路线: 数据高效训练与自改进方法
      解决的问题: 通过未标注截图、可验证合成任务或围绕冻结模型的harness证据，减少对密集人工标注和重新训练的依赖。
      尚未覆盖: 跨基准泛化未证实；收益可能依赖harness或数据质量；方法与周边系统的贡献未完全隔离。
    - 路线: 动态或非点击接口的观察与动作定位方法
      解决的问题: 处理界面动态变化、视频关键帧选取和拖拽类动作，扩展纯点击定位。
      尚未覆盖: 观察控制失败仍未解决；证据限于短视频与部分拖拽类别；更广泛动态界面未验证。
    - 路线: 定位的不确定性与可靠性估计
      解决的问题: 对后验不确定性进行排名与校准，并构造空间共形点击区域以支持安全操作。
      尚未覆盖: 跨模型层级和接口的UQ排名迁移较弱；仅覆盖单步定位；分布变化下覆盖度下降，训练期方法未涉及。
    共识:
    - 细粒度评估揭示总体成功率掩盖的差异，包括子目标进展、信息成本和动作类型能力。
    - 研究共同关注降低人工标注与再训练成本：利用未标注截图、可验证合成任务、重复运行证据或冻结harness改进。
    - 动态界面与非点击操作仍是薄弱环节，证据显示观察控制、拖拽覆盖和不确定性迁移均有缺口。
    分歧:
    - 干预点不同：模型参数训练或微调与冻结模型harness进化、关键帧选择、后验不确定性校准。
    - 评估目标不同：桌面目标完成、动态成本-准确性、视频引导任务、拖拽操作或单步定位可靠性定义不同能力。
    - 监督与验证来源不同：未标注截图加少量标注、多智能体合成可验证任务、重复运行证据与后验UQ分别采纳不同信号。
    - 泛化方式不同：一些研究强调跨平台迁移，另一些固定在单平台或单动作族内，导致测试风险不同。
    开放问题:
    - 何种观察控制机制能抑制动态界面中的过度观察与观察不足？
    - harness、训练效率和不确定性方法在模型层级、操作系统、应用与交互模式间的迁移边界在哪里？
    - 评估指标如何隔离模型能力与技能库、harness代码和输入预处理的影响？
    - 不确定性校准如何从单步定位扩展到完整多步智能体轨迹？
    - 如何用统一协议覆盖动态视频、拖拽和GUI+CLI等尚未充分测试的界面边界？
