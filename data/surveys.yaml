  - 'Trend evolution: Within the 2026 frontier, work shifts from static single-app
    benchmarks to multi-app, dynamic, and drag-based tasks, and from monolithic agents
    to modular systems with skill libraries, compiled replays, and history-aware critics.'
  - 'Open questions: Whether gains on specific benchmarks transfer across platforms
    and interaction types; how to balance observation control with action accuracy;
    whether compiled replays degrade on novel tasks; and how to maintain benign recall
    in fraud detection without reputation shortcuts.'
  related_work_outline_zh:
  - 主流方向：构建面向真实桌面、移动、网页和短视频平台的领域特定GUI代理基准与方法，重点关注多模态技能、执行效率和动态界面处理。
  - 研究共性：在模拟真实应用工作流的任务集上评估多模态代理，利用屏幕视觉理解和任务完成度或细粒度子目标指标衡量成功，往往暴露出脆弱的观察控制或规划失败。
  - 关键差异：基准在交互类型（点击、拖拽、动态内容）、评估指标（通过率、多检查点、成本-准确性）和目标应用（macOS、短视频、欺诈检测）上分化；方法则在优化目标（速度、准确性、技能复用）上分化。
  - 趋势演进：在2026年前沿中，工作从静态单应用基准转向多应用、动态和拖拽任务，从单体代理转向包含技能库、编译重放和历史感知评判的模块化系统。
  - 开放问题：特定基准的收益能否跨平台和交互类型迁移；如何在观察控制与动作准确性间取得平衡；编译重放面临新任务时是否退化；在无信誉捷径的欺诈检测中如何保持良性召回率。
  literature_review:
    line_of_work_matrix:
    - line: Domain-specific GUI agent benchmarks
      what_it_solves: Captures the unique challenges of diverse real-world applications—macOS
        desktop workflows, short-video platform dynamics, drag-based interactions,
        video-guided tasks, and SMS-to-web fraud—that existing generic benchmarks
        miss.
      what_remains_open: Coverage is limited to specific platforms or interaction
        types; performance remains far from human-level, especially on dynamic content
        and benign-case fraud recall; evaluation metrics are not standardized across
        tasks.
    - line: Agent capability enhancement via multimodal skills, history, and compiled
        replays
      what_it_solves: Improves accuracy, speed, and planning depth by equipping agents
        with hierarchical multimodal skill artifacts, history-aware visual critics,
        and state-machine programs that replay successful runs without per-step model
        calls.
      what_remains_open: Evidence that these methods transfer across different agent
        backbones and benchmarks is missing; compiled replays may fail on novel tasks
        requiring exploration; the impact of skill library design choices on generalization
        is not tested.
    consensus:
    - All works rely on multimodal foundation models (VLM-based agents) that interpret
      screenshots and generate grounded actions.
    - Evaluation is conducted on task suites that simulate real application use, revealing
      that agents struggle with multi-step planning, observation control, and handling
      dynamic or non-click interactions.
    - There is a shared recognition that current agents lack robust observation regulation,
      leading to over- or under-observation and weak performance on cost-accuracy
      metrics.
    disagreements:
    - 'Interaction granularity: some focus on traditional click-based tasks, while
      others extend to drag operations, video-guided navigation, and dynamic content
      that changes between actions.'
    - 'Success measure: works use different metrics—pass@1, multi-checkpoint sub-goal
      completion, or cost-accuracy—making direct comparison difficult.'
