  related_work_outline_zh:
  - 主流方向：端到端多模态GUI与计算机使用智能体，在接近部署的设置中统一视觉定位、GUI操作以及代码或工具执行，例如 OS-Helix 和 LLaDA-UI。
  - 研究共性：工作正从昂贵的人工标注转向弱监督、合成、混合或强化学习生成的监督信号，以扩展数据和任务规模。
  - 关键差异：一个分支优化完整多模态生成；另一个以少量准确率换取低延迟潜空间动作评分；其他工作专注技能库、Harness原生训练或诊断式评测。
  - 趋势演进：证据集中在2024–2026年，且以2026年为主，属于当前前沿：环境更可验证、训练更接近RL原生，并从成功率转向行为诊断。
  - 开放问题：错误恢复、跨平台迁移、个性化任务执行以及速度与准确率权衡仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end native computer-use policies
      what_it_solves: Learning to coordinate visual grounding, GUI actions, and code
        execution as a single multimodal control problem across desktop, web, and
        mobile tasks.
      what_remains_open: Cross-platform generalization and recovery behavior; several
        works omit explicit limitations and independent reproduction evidence.
    - line: Data-efficient GUI-agent learning
      what_it_solves: Reducing dependence on expensive human-annotated screenshots
        via unannotated screenshot pretraining, curriculum calibration, or synthetic
        verifiable task generation.
      what_remains_open: How far weak and synthetic supervision scales across applications,
        languages, and long-horizon workflows.
    - line: Fast latent-space action scoring
      what_it_solves: Meeting mobile latency and parameter constraints by scoring
        candidate actions in a joint-embedding latent space rather than decoding full
        action text.
      what_remains_open: Reported accuracy reaches only 86–92% of a fine-tuned VLM
        baseline, and evaluation is mostly limited to AndroidControl.
    - line: Reusable multimodal skill and tool libraries
      what_it_solves: Providing agents with on-demand procedural knowledge and visual
        figures through hierarchical skill artifacts and MCP-style tools.
      what_remains_open: Skill construction cost, app-to-app portability, and whether
        visual artifacts remain reliable across UI changes.
    - line: Harness-native training and orchestration
      what_it_solves: Enabling end-to-end reinforcement learning of agents that use
        real complex harnesses in stateful, multi-process environments.
      what_remains_open: Trained agents still show weak error recovery, and some harnesses
        are much harder to learn than others.
    - line: Diagnostic evaluation for recovery and personalization
      what_it_solves: Moving beyond overall task success to measure transition-consistent
        recovery and stage-wise preference failures.
      what_remains_open: Replay-based recovery evaluation is costly, environment resets
        may be unavailable, and preference-failure interventions only partially close
        gaps.
    consensus:
    - Recent work converges on unifying GUI control with code or tool execution rather
      than treating clicks and commands as separate actions.
    - There is shared effort to replace expensive human annotation with weak, synthetic,
      hybrid, or RL-collected supervision.
    - Evaluation is increasingly behavioral and diagnostic, probing error recovery,
      personalization timing, and action-outcome consistency in addition to benchmark
      success.
    - Deployment-oriented constraints such as latency, harness compatibility, and
      reproducibility receive growing attention.
    disagreements:
    - 'Policy form differs: full multimodal generation, block-wise diffusion generation,
      and decoder-free latent scoring make different speed-accuracy trade-offs.'
    - 'Supervision settings differ: unannotated screenshots with RL calibration, synthetic
      application-artifact tasks with verifiable outcomes, and real harness-rollout
      training imply different coverage and reproducibility assumptions.'
    - 'Evaluation emphasis differs: aggregate success, recovery consistency, preference-following
      stage probes, and throughput measure different failure modes.'
    - The value of some pretraining components is disputed; one result shows screen-dynamics
      pretraining of a predictor does not outperform random initialization.
    open_questions:
    - Can low-latency latent policies close the reported accuracy gap to full VLM
      agents while retaining parameter and speed advantages?
    - What supervisory strategy most improves error recovery in harness-trained agents
      when replay and resets are expensive or unavailable?
    - How do hierarchical skill libraries transfer across different applications and
      sustained UI evolution without manual rebuilding?
    - 'Which behavioral diagnostics best predict real-world reliability: recovery
      consistency, preference timing, or static task success?'
    - Are current reproducibility signals sufficient, given several evidence entries
      have missing limitation details and no independent verification?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端原生计算机使用策略
      解决的问题: 将视觉定位、GUI操作和代码执行统一为跨桌面、网页和移动任务的多模态控制问题。
      尚未覆盖: 跨平台泛化与恢复行为；部分工作未提供明确局限性，独立复现证据不足。
    - 路线: 数据高效的GUI智能体学习
      解决的问题: 通过未标注截图预训练、课程校准或可验证合成任务，减少对昂贵人工标注的依赖。
      尚未覆盖: 弱监督与合成监督在跨应用、跨语言和长流程任务中的可扩展性尚不明确。
    - 路线: 快速潜空间动作评分
      解决的问题: 通过在联合嵌入潜空间中评分候选动作，而非逐token解码动作文本，满足移动端延迟和参数约束。
      尚未覆盖: 报告准确率仅达到微调VLM基线的86–92%，且评估主要覆盖 AndroidControl。
    - 路线: 可复用多模态技能与工具库
      解决的问题: 通过分层技能工件和 MCP 风格工具，为智能体提供按需的过程性知识和视觉图形。
      尚未覆盖: 技能构建成本、跨应用可移植性，以及 UI 变化后视觉工件是否仍然可靠。
    - 路线: Harness原生训练与编排
      解决的问题: 在有状态、多进程环境中，对使用真实复杂 Harness 的智能体进行端到端强化学习。
      尚未覆盖: 训练后的智能体错误恢复仍较弱，且不同 Harness 的可学习难度差异显著。
    - 路线: 针对恢复与个性化的诊断式评测
      解决的问题: 超越整体任务成功率，测量转移一致性恢复和分阶段偏好失败。
      尚未覆盖: 基于重放的恢复评测成本高，环境重置可能不可用，个性化干预只能部分缩小差距。
    共识:
    - 近期工作趋向于将 GUI 控制与代码或工具执行统一，而不是把点击和命令当作独立动作。
    - 普遍尝试用弱监督、合成、混合或强化学习采集的监督替代昂贵的人工标注。
    - 评测越来越行为和诊断化，除基准成功率外还探测错误恢复、个性化时机和动作结果一致性。
    - 延迟、Harness 兼容性和可复现性等部署相关约束开始受到更多关注。
    分歧:
    - 策略形式不同：完整多模态生成、块级扩散生成和无解码器潜评分在速度与准确率之间做出不同取舍。
    - 监督设置不同：未标注截图加强化校准、合成应用工件与可验证结果、以及真实 Harness 回放训练分别具有不同的覆盖与复现假设。
    - 评测重点不同：总体成功、恢复一致性、偏好遵循的阶段探针和吞吐量衡量了不同的失效模式。
    - 部分预训练组件的价值存在争议；一项结果表明预测器的屏幕动态预训练并未优于随机初始化。
    开放问题:
    - 低延迟潜空间策略能否在保持参数优势与速度优势的同时，缩小与完整 VLM 智能体之间的准确率差距？
    - 当重放和重置昂贵或不可用时，哪种监督策略最能改善 Harness 训练智能体的错误恢复？
    - 分层技能库如何在不同应用和持续 UI 变化中迁移，而无需人工重建？
    - 哪种行为诊断最能预测实际部署可靠性：恢复一致性、偏好时机还是静态任务成功率？
    - 当前复现信号是否足够？鉴于若干证据条目缺少局限性细节，缺失负面结果是验证缺口。
