  related_work_outline:
  - 'Mainstream direction: GUI-agent research is formalizing capabilities through
    benchmark task abstractions, sub-goal scoring, and reliability metrics rather
    than purely mathematical theory.'
  - 'Shared research pattern: Papers decompose tasks into executable checkpoints and
    improve agents through external artifacts, harness edits, synthetic data, or weakly
    supervised grounding, often with a frozen backbone.'
  - 'Key differences: Evaluation targets diverge between pass rate, cost-accuracy,
    and uncertainty calibration; interaction modes span desktop GUI+CLI, dynamic short-video,
    click, and drag; training/supervision ranges from manual benchmarks to unannotated
    screenshots and verifiable synthetic RL tasks.'
  - 'Trend evolution: With top evidence from 2026, the frontier is moving from static
    click-based success rates toward dynamic interfaces, fine-grained multi-checkpoint
    and cost-aware metrics, self-improving harnesses, and reliability quantification.'
  - 'Open questions: The field lacks a shared formal abstraction across static, dynamic,
    and drag interactions; cross-domain transfer and calibration of uncertainty methods
    remain weakly evidenced.'
  related_work_outline_zh:
  - 主流方向：GUI智能体研究正在通过基准任务抽象、子目标评分和可靠性指标进行能力形式化，而非纯数学理论。
  - 研究共性：论文将任务拆解为可执行检查点，并通过外部技能、执行框架编辑、合成数据或弱监督视觉 grounding 改进智能体，常保持骨干模型冻结。
  - 关键差异：评测目标在通过率、成本-准确性和不确定性校准之间分化；交互模式覆盖桌面 GUI+CLI、动态短视频、点击和拖拽；训练监督从人工基准到未标注截图与可验证合成任务不等。
  - 趋势演进：主要证据集中在2026年前沿，从静态点击式成功率转向动态界面、细粒度多检查点/成本感知指标、自改进执行框架和可靠性量化。
  - 开放问题：缺少跨静态、动态和拖拽交互的共享形式化抽象；不确定性方法的跨域迁移和校准证据不足，多项局限性尚未披露。
  literature_review:
    line_of_work_matrix:
    - line: Real-world desktop and drag interaction benchmarks
      what_it_solves: Define multi-application desktop tasks and drag interaction
        types with deterministic rules and sub-goal scoring; expose differences that
        aggregate pass rate hides.
      what_remains_open: Coverage transfer to dynamic interfaces and broader drag-based
        workflows remains untested; limitation details are often absent.
    - line: Dynamic living-screen interface formalization
      what_it_solves: Models GUI tasks where content changes between actions and evaluates
        task accuracy jointly with information cost.
      what_remains_open: Evidence is limited to short-video platforms; current agents
        show over- and under-observation without explicit control mechanisms.
    - line: Skill and harness augmentation for frozen agents
      what_it_solves: Improves GUI agents without updating model weights by storing
        multimodal task knowledge or automatically editing the execution harness from
        repeated-run evidence.
      what_remains_open: Formal guarantees and broad cross-benchmark transfer are
        not established; improvements may not change underlying model capabilities.
    - line: Scalable training and task synthesis
      what_it_solves: Reduces reliance on manual annotations via large-scale unannotated
        screenshots or verifiable synthetic tasks and online RL.
      what_remains_open: Generalization to real dynamic, drag-based, or multi-application
        workflows is not directly evidenced; limitations are missing.
    - line: Uncertainty quantification for GUI grounding
      what_it_solves: Evaluates post-hoc uncertainty methods for GUI grounding and
        spatial safety via conformal click regions.
      what_remains_open: Only single-step grounding is covered; cross-model and cross-interface
        transfer is weak, and coverage degrades under distribution shift.
    consensus:
    - Capability claims are increasingly supported by decomposed executable checkpoints
      rather than aggregate success alone; sub-goal completion can differ substantially
      among models with similar pass rates.
    - Frozen models can be improved through external knowledge, harness changes, or
      data efficiency methods; multiple routes report gains without updating the backbone.
    - 'Visual grounding is a shared bottleneck: preserving visual evidence or learning
      from screenshots improves UI element identification and workflow verification.'
    - 'Evaluation must account for information cost and reliability: dynamic interfaces
      and uncertainty quantification expose failures invisible to success-rate-only
      metrics.'
    - Current agents still lack robust observation control and reliable uncertainty
      transfer, especially across model classes and interface regimes.
    disagreements:
    - 'Interaction coverage differs: some works target static desktop GUI and CLI,
      others dynamic content, drag interactions, or single-step grounding.'
    - 'Supervision and training signals differ: manual benchmark annotations versus
      unannotated screenshots versus synthetically generated verifiable tasks with
      online RL.'
    - 'Evaluation targets differ: pass-rate, cost-accuracy, sub-goal scoring, and
      uncertainty ranking/calibration each lead to incomparable claims.'
    - 'Improvement locus differs: benchmark-driven diagnosis versus external skill
      libraries versus automatic harness optimization versus model training.'
    - Deployment assumptions differ across macOS, browser-based living screens, OSWorld/Windows
      transfer, and single-step grounding, so failure modes do not transfer cleanly.
    open_questions:
    - What formal task abstraction can unify static desktop, dynamic living-screen,
      and drag-based GUI interactions without losing measurable sub-goal information?
    - Do fine-grained sub-goal and cost-accuracy metrics predict real-world reliability
      and safety, or only benchmark-specific behavior?
    - How should uncertainty quantification be selected and recalibrated when rankings
      fail to transfer across model tiers and observable interfaces?
    - Do improvements from unannotated or synthetic training transfer to real desktop
      and dynamic tasks, and where are the boundary conditions?
    - What missing limitations and assumptions in current benchmarks affect the validity
      of reliability claims?
