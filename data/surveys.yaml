  related_work_outline:
  - 'Mainstream direction: Benchmark-driven formalization of GUI agent capabilities,
    with a focus on defining task abstractions, interaction types, and evaluation
    metrics rather than on developing theoretical guarantees or scaling laws.'
  - 'Shared research pattern: Revealing agent limitations through new benchmarks or
    task definitions, then proposing taxonomies or evaluation frameworks to capture
    previously unmodeled dimensions of interaction.'
  - 'Key differences: The papers differ in the interaction dimension they formalize
    (dynamic content, drag, multi-step, multi-application), the evaluation target
    (task completion, uncertainty, efficiency), and the method used to address the
    gap (skill libraries, RL, weak supervision, context management).'
  - 'Trend evolution: Within the 2024–2026 frontier, work is moving from broad desktop
    benchmarks toward finer-grained interaction types (drag, living-screen) and deeper
    reliability/efficiency analysis, indicating a shift from aggregate performance
    to structurally richer evaluation.'
  - 'Open questions: Whether the proposed formalizations translate into different
    agent designs, how to unify interaction theories across platforms, and whether
    training efficiency gains hold under distribution shift.'
  related_work_outline_zh:
  - 主流方向：以基准测试为驱动的GUI代理能力形式化，主要聚焦于定义任务抽象、交互类型和评估指标，而非发展理论保证或缩放规律。
  - 研究共性：通过新基准或任务定义揭示代理的局限性，然后提出分类法或评估框架来捕捉先前未被建模的交互维度。
  - 关键差异：论文在所形式化的交互维度（动态内容、拖拽、多步、多应用）、评估目标（任务完成、不确定性、效率）以及解决问题的方法（技能库、强化学习、弱监督、上下文管理）上存在差异。
  - 趋势演进：在2024–2026年前沿内，工作正从宏观桌面基准转向更细粒度的交互类型（拖拽、动态屏幕）和更深入的可靠性/效率分析，表明从聚合性能向结构更丰富的评估转变。
  - 开放问题：所提出的形式化定义能否转化为不同的代理设计，如何统一跨平台的交互理论，以及训练效率提升在分布偏移下是否依然成立。
  literature_review:
    line_of_work_matrix:
    - line: Task and interaction formalization
      what_it_solves: Defines and classifies GUI agent tasks and interaction primitives
        beyond simple clicks, including multi-checkpoint scoring, living-screen dynamics,
        and drag-based operations, clarifying what success means in each setting.
      what_remains_open: The formalizations are benchmark-specific; it is unclear
        whether they generalize to unseen application domains or whether they change
        how agents are actually designed and deployed.
    - line: Agent reliability and uncertainty quantification
      what_it_solves: Provides a systematic evaluation of post-hoc uncertainty quantification
        methods for GUI grounding, introducing spatial safety via conformal click
        regions and identifying which UQ families transfer across models and datasets.
      what_remains_open: Cross-model and cross-interface UQ ranking transfer is weak,
        and the findings are limited to single-step grounding; coverage degrades under
        distribution shift, and multi-step trajectory-level reliability is not addressed.
    - line: Data and training efficiency
      what_it_solves: Reduces reliance on expensive human annotations by using weak
        supervision from unannotated screenshots or by synthesizing verifiable tasks
        for online RL, demonstrating competitive performance with far less annotated
        data.
      what_remains_open: The quality and coverage of synthetic tasks are not fully
        characterized, and the generalization of these efficiency gains to diverse,
        real-world tasks beyond the evaluated benchmarks is not established.
    - line: Context and state management for long-horizon tasks
      what_it_solves: Formalizes context management as a first-class action within
        the agent policy, using structured context fields to preserve critical information
        over long trajectories without passive context accumulation.
      what_remains_open: The approach is validated on a single model and two benchmarks;
        its robustness to more complex, interleaved multi-app workflows and its interaction
        with reliability or safety monitoring remain unexplored.
    consensus:
    - Current GUI agents exhibit significant gaps in handling dynamic interfaces,
      non-standard interaction types, and long-horizon tasks, and these gaps are best
      exposed through carefully designed task definitions and evaluation protocols.
    - Fine-grained evaluation metrics (e.g., sub-goal completion, cost-accuracy, drag
      success) provide a more discriminating signal than pass/fail rates alone, revealing
      performance differences hidden by aggregate scores.
    - Improving agent performance requires not only larger models but also structured
      external knowledge (skills, context fields) or training procedures that explicitly
      address the identified interaction dimensions.
    disagreements:
    - 'Interaction modality: Some works emphasize the necessity of retaining visual
      figures in skill artifacts (multimodal skills), while others focus on learning
      visual grounding from raw screenshots without explicit figure retention, implying
      different assumptions about what visual information is critical.'
    - 'Evaluation target: Benchmarks differ in whether they optimize for task completion
      accuracy alone, joint cost-accuracy, or spatial reliability, leading to divergent
      claims about what the primary failure mode of GUI agents is (observation control
      vs. grounding uncertainty vs. context loss).'
    - 'Training paradigm: GUICrafter advocates for weak supervision with a small amount
      of high-quality data, ScaleCUA relies on online RL with verifiable synthetic
      tasks, and MemGUI-Agent uses supervised fine-tuning with explicitly annotated
      context actions, reflecting different bets on how to achieve efficient and robust
      learning.'
    open_questions:
    - Do the proposed interaction formalizations (e.g., living-screen, drag) cover
      all real-world GUI operations, and can they be composed into a unified interaction
      theory?
    - How can uncertainty quantification be extended from single-step grounding to
      full agent trajectories, and how does it interact with long-horizon context
      management?
    - Under what conditions do training efficiency gains from weak supervision or
      synthetic RL transfer to entirely new applications and interfaces beyond the
      evaluated benchmarks?
  literature_review_zh:
