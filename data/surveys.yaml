  literature_review:
    line_of_work_matrix:
    - line: Benchmark-driven task and interaction abstraction
      what_it_solves: Defines realistic GUI task suites and metrics for dynamic, multi-app,
        drag-based, and long-horizon interaction, exposing fine-grained capability
        gaps beyond binary success.
      what_remains_open: Coverage is limited to selected platforms and interaction
