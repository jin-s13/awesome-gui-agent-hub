  literature_review:
    line_of_work_matrix:
    - line: Action-grounded visual memory and multimodal skill scaffolds for GUI agents
      what_it_solves: Reduces UI grounding and state-verification errors by retaining
        task-relevant visual crops or multimodal skill artifacts instead of complete
        screenshots or text-only instructions.
      what_remains_open: Whether these scaffolds generalize across operating systems
        and predefined action types, and how to avoid action-level errors introduced
        by overloaded visual memory.
    - line: Weakly supervised visual grounding for data-efficient GUI agent training
      what_it_solves: Lowers human annotation burden by learning visual grounding
        from large unannotated screenshots, then calibrating with small high-quality
        data.
      what_remains_open: Generalization from static screenshots and webpages to live,
        asynchronous GUI dynamics and broader action spaces outside evaluated settings
        is not demonstrated.
    - line: End-to-end RL and harness-native training frameworks
      what_it_solves: Enables training agents inside complex inference harnesses or
        live browser/desktop environments by recording model calls or rollout data
        for policy optimization.
      what_remains_open: Error recovery remains weak after RL; harness design strongly
        affects trainability, and live rollout diversity plus infrastructure cost
        are unresolved.
    - line: Native screenshot-only computer-use agents and large-scale deployment
        scaffolds
      what_it_solves: Removes dependence on DOM or accessibility metadata by consuming
        screenshots and emitting keyboard/mouse actions, with history compression
        and verifiable rollout training.
      what_remains_open: Cross-platform generality, long-horizon reliability, and
        safety under adaptive attacks beyond the reported benchmarks remain open.
    - line: Step-level diagnostic and safety benchmarks for computer-use agents
      what_it_solves: Measures GUI transition understanding, action localization,
        and prompt-injection or skill-injection robustness rather than only end-task
        success.
      what_remains_open: Offline settings do not capture live timing; safety results
        are domain-conditioned and may not transfer across browser, coding, or desktop
        surfaces.
    consensus:
    - Visual grounding and task-relevant visual context improve GUI state identification
      and workflow verification.
    - Open training frameworks with modest trajectory budgets can reach competitive
      GUI-agent performance when combined with supervised initialization or weak supervision.
    - End-task success alone hides important failure modes; step-level transitions,
      error recovery, and adversarial robustness need separate evaluation.
    - 'Scaffold and memory design is a central lever: compressed history, skill retrieval,
      and local crops affect both accuracy and failure distribution.'
    disagreements:
    - Input representation varies from screenshot-only pixels to multimodal visual
      artifacts to action-grounded local crops, with different trade-offs between
      grounding and action-level errors.
    - Training supervision varies from weakly supervised visual grounding on unannotated
      data to online multi-turn RL on live sites, harness-recorded RL, and large-scale
      verifiable rollouts.
    - 'Evaluation focus differs: offline step-level transition diagnostics, live end-to-end
      task success, and adversarial safety auditing target different validity conditions.'
    - 'Deployment setting differs: native keyboard/mouse interaction, harness or tool
      orchestration, and browser/desktop-specific scaffolds make different assumptions
      about runtime control and state observability.'
    - Safety evidence differs on whether hand-crafted injection templates are representative;
      browser-hardened agents can still fail on coding-domain skill injection.
    open_questions:
    - How can visual memory and skill scaffolds be designed to reduce both state-level
      and action-level errors across operating systems and applications?
    - What training recipe improves error recovery after RL without making agents
      dependent on a specific harness design?
    - Can domain-conditioned safety hardening be extended from browser tasks to coding
      and desktop computer-use surfaces, including RL-optimized injection strings?
    - How well do offline transition-diagnostic metrics predict live asynchronous
      deployment reliability?
    - How can weakly supervised visual grounding scale beyond static screenshots and
      webpages to diverse interactive applications while retaining low annotation
      cost?
    - What are the reproducibility conditions for these frameworks and benchmarks
      when code, rollout infrastructure, or optimized attack strings are not released?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 动作接地的视觉记忆与多模态技能脚手架（用于GUI代理）
      解决的问题: 通过保留任务相关的局部图像裁剪或多模态技能工件，而非完整截图或纯文本指令，降低UI接地和状态验证错误。
      尚未覆盖: 这些脚手架是否跨操作系统和预定义动作类型泛化，以及如何避免视觉记忆过载加剧动作级错误。
    - 路线: 弱监督视觉接地与数据高效GUI代理训练
      解决的问题: 通过从大规模未标注截图学习视觉接地，再用少量高质量数据校准，降低人工标注负担。
      尚未覆盖: 从静态截图和网页到实时异步GUI动态以及更广泛动作空间的泛化尚未被证明。
    - 路线: 端到端强化学习与harness原生训练框架
      解决的问题: 通过记录模型调用或rollout数据，在复杂推理harness或在线浏览器/桌面环境中训练代理。
      尚未覆盖: RL后的错误恢复仍弱；harness设计显著影响可训练性，在线rollout多样性和基础设施成本仍未解决。
    - 路线: 原生仅截图计算机操作代理与大规模部署脚手架
      解决的问题: 仅依赖截图输入并输出键盘鼠标动作，无需DOM或可访问性元数据，结合历史压缩和可验证rollout训练。
      尚未覆盖: 跨平台泛化、长程可靠性，以及超出已报告基准的自适应攻击下的安全性仍开放。
    - 路线: 步骤级诊断与安全基准（用于计算机操作代理）
      解决的问题: 测量GUI迁移理解、动作定位以及提示注入或技能注入鲁棒性，而非仅看端到端任务成功。
      尚未覆盖: 离线设置无法捕捉实时时序；安全性是领域条件的，可能无法在浏览器、编码或桌面表面之间迁移。
    共识:
    - 视觉接地和任务相关的视觉上下文可以改善GUI状态识别与工作流验证。
    - 在结合监督初始化或弱监督时，轨迹预算适度的开放训练框架可以达到有竞争力的GUI代理表现。
    - 仅看端到端任务成功会掩盖重要失败模式；步骤级迁移、错误恢复和对抗鲁棒性需要单独评估。
    - 脚手架与记忆设计是核心变量：历史压缩、技能检索和局部裁剪会同时影响准确率与失败分布。
    分歧:
    - 输入表示不同：纯截图像素、多模态视觉工件、动作接地局部裁剪之间的接地效果与动作级错误权衡不同。
    - 监督信号不同：未标注数据弱监督、在线多轮RL、harness记录RL和大规模可验证rollout训练各有侧重。
    - 评估目标不同：离线步骤级迁移诊断、在线端到端任务成功和对抗安全审计对有效性的假设不同。
    - 部署方式不同：原生键鼠交互、harness或工具编排、浏览器/桌面专用脚手架对运行时控制和状态可观测性的假设不同。
    - 安全证据存在分歧：手工注入模板是否具有代表性尚无共识；浏览器加固的模型在编码域技能注入中仍可能失败。
    开放问题:
    - 视觉记忆和技能脚手架如何同时降低状态级与动作级错误，并跨操作系统和应用泛化？
    - 何种训练方法能在不依赖特定harness设计的情况下改善RL后的错误恢复？
    - 领域条件安全硬化能否从浏览器任务扩展到编码与桌面操作场景，包括RL优化的注入字符串？
    - 离线迁移诊断指标在多大程度上能预测在线异步部署可靠性？
    - 弱监督视觉接地如何从静态截图和网页扩展到多样交互应用，同时保持低标注成本？
    - 当代码、rollout基础设施或优化攻击字符串未发布时，这些框架和基准的可复现条件是什么？
