    - 路线: 形式化智能体交互域和评估协议
      解决的问题: 为新型GUI交互类型（拖拽、动态屏幕、长时域）提供精确定义和相应指标，使系统比较智能体能力超越简单任务成功率。
      尚未覆盖: 形式化与特定基准绑定；尚不清楚定义的属性（如观察控制、主动上下文管理）是否迁移到真实部署或影响模型架构设计。
    - 路线: GUI智能体的不确定性量化和可靠性基准测试
      解决的问题: 通过后验不确定性方法刻画智能体动作的可信度，揭示模型内排名稳定但跨模型迁移弱，共形预测可提供空间安全保证。
      尚未覆盖: 分析仅限于单步基础；没有证据表明UQ排名或共形保证在多步轨迹或分布偏移下成立，这对安全关键部署至关重要。
    - 路线: 通过强化学习和弱监督实现GUI智能体的缩放与样本高效训练
      解决的问题: 证明通过可验证任务合成的在线RL和来自未标注截图的弱监督，可以在较少标注下实现最先进性能，解决数据稀缺和训练效率问题。
      尚未覆盖: 连接模型规模、数据和RL目标与预期行为的缩放定律尚未形式化推导；观察到的改进是经验性的，缺乏对失败预测或跨平台迁移的保证。
    共识:
    - 当前GUI智能体在细微交互维度上缺乏可靠性：它们无法控制观察频率、量化不确定性，并在没有显式机制的情况下管理长时域上下文。
    - 基准驱动的方法是揭示智能体局限性的主要方法；每个基准隔离一个特定的形式属性（如成本-准确性权衡、不确定性排名、拖拽基础），并显示前沿模型在该维度上表现不佳。
    - 引入结构化表示（分层技能库、上下文字段、不确定性分数）相较于非结构化基线始终提升性能，表明当前端到端模型缺乏对复杂GUI任务的内在组织。
    分歧:
    - 研究的主要交互原语不同：基于点击的基础（Argus） vs. 拖拽动作（DragOn） vs. 动态UI观察（LivingScreen） vs. 多模态技能检索（VISUALSKILL），导致评估标准互不兼容。
    - 一些工作通过后验校准（不确定性量化）改进智能体，而另一些聚焦于改变训练机制（在线RL、弱监督），暗示对当前模型是根本上受限还是仅训练不足的假设不同。
    - 上下文管理的角色处理方式不同：MemGUI-Agent将上下文动作作为第一类策略输出，而其他工作将上下文视为被动输入历史，揭示了上下文管理应该是学习获得还是架构强加的分歧。
    开放问题:
    - 这些基准提出的形式属性和分类体系能否被操作为训练目标或架构约束，而不仅仅是评估指标？
    - 不确定性校准和观察控制在多步智能体轨迹中如何相互作用，某一维度的改进是否会降低另一维度？
