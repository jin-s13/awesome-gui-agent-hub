  literature_review:
    line_of_work_matrix:
    - line: Real-world GUI benchmarking across desktop, web, mobile, and dynamic media
      what_it_solves: Provides application-grounded task suites with rule-based, sub-goal,
        grounding, or cost-accuracy metrics for comparing GUI agents.
      what_remains_open: Coverage remains uneven across platforms and interaction
        primitives; dynamic observation control and real-world reliability are still
        unresolved.
    - line: Multimodal skill and procedural knowledge libraries
      what_it_solves: Encodes workflows and visual references into hierarchical multimodal
        skills or compiled state-machine programs to improve accuracy or repeated-task
        speed.
      what_remains_open: Transfer across applications, updates, and non-repeated tasks
        is not demonstrated; visual-skill evidence is limited to reported benchmarks.
    - line: Large-scale grounding datasets and model training recipes
      what_it_solves: Improves element grounding and navigation by pairing large screenshot/referring-expression
        datasets with supervised fine-tuning, D2RL, or diffusion-based VLM training.
      what_remains_open: Cross-platform and cross-scale generalization, and the relative
        contribution of data versus training algorithm, remain open.
    - line: Dynamic and video GUI perception with observation control
      what_it_solves: Extracts task-relevant visual evidence from dynamic or video
        interfaces and measures information efficiency.
      what_remains_open: Identified over- and under-observation failure lacks a generalized
        solution beyond short-video and video-guided benchmarks.
    - line: Compiling and replaying successful GUI task runs
      what_it_solves: Turns completed agent trajectories into screen-checked state-machine
        programs to remove per-step language model calls and speed up repeated tasks.
      what_remains_open: Evidence does not show robustness to interface drift, task
        variation, or long-horizon professional workflows; fallback behavior is only
        benchmark-level.
    consensus:
    - Application-grounded evaluation increasingly reports sub-goal progression, grounding
      accuracy, or information cost rather than only final success, revealing failures
      hidden by coarse pass rates.
    - 'Domain-specific visual or procedural grounding helps: retaining visual figures,
      collecting drag or screenshot grounding data, and fine-tuning with application
      data improve agent performance.'
    - Frontier GUI agents still trail human-like reliability in dynamic media, drag
      interactions, and multitasking observation control.
    - Desktop, web, mobile platforms, and GUI+CLI interactions are being treated as
      connected agent capability surfaces, not isolated evaluation tags.
    disagreements:
    - 'Improvement strategy differs: inference-time skills or replay, training-time
      grounding datasets and D2RL, or model-level diffusion decoding.'
    - 'Evaluation target differs: final Pass@1, sub-goal completion, grounding accuracy,
      cost-accuracy/information efficiency, or repeated-task speedup.'
    - 'Interaction mode differs: static desktop/CLI, dynamic short-video observation,
      drag manipulations, video-guided tasks, and repeated workflows.'
    - 'Representation and supervision differ: multimodal visual-text skills versus
      text-only skills, deterministic rule-based scoring versus benchmark-specific
      metrics, and fine-tuning versus compiled state-machine memory.'
    open_questions:
    - Can observation-control failures in dynamic interfaces be corrected while preserving
      task accuracy and information efficiency?
    - Do drag grounding gains from large interaction datasets transfer to downstream
      computer-use tasks beyond the held-out benchmark?
    - How robust are compiled replay programs to application UI updates and slight
      task wording changes?
    - What is the relative contribution of large grounding datasets versus D2RL-style
      training to cross-platform generalization?
    - Are multimodal skill libraries effective beyond the reported CUA-World and OSExpert-Eval
