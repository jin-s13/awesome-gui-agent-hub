  literature_review:
    line_of_work_matrix:
    - line: Real-world desktop OS task benchmarking
      what_it_solves: Covers multi-application macOS workflows mixing GUI and CLI
        interaction, with deterministic checks and fine-grained sub-goal metrics.
      what_remains_open: Whether performance transfers across operating systems, application
        versions, or framework choices; no visible limitation analysis is present
        in the packet.
    - line: Dynamic and interaction-specific GUI task benchmarking
      what_it_solves: Evaluates GUI agents on short-video dynamic screens and drag-based
        interactions that are underrepresented in click-centric benchmarks.
      what_remains_open: Coverage beyond a single platform or interaction type and
        the gap to human-level cost-accuracy or grounding in more varied interfaces.
    - line: Multimodal skill libraries for computer-use agents
      what_it_solves: Provides application-specific visual and textual procedure knowledge
        that improves UI element identification and workflow state verification.
      what_remains_open: Maintenance and transfer as applications change; evidence
        is limited to specific computer-use benchmarks and one evaluation setup.
    - line: Replayable execution memory and acceleration
      what_it_solves: Compiles validated trajectories into state-machine programs
        or callable memories, cutting token cost and execution time on repeated tasks.
      what_remains_open: Safe fallback and error recovery when screen state or task
        parameters differ; reproducible artifacts are sparsely present in the evidence.
    - line: Model-level GUI agent architectures and training
      what_it_solves: Trains or adapts vision-language models for GUI grounding and
        navigation across mobile, desktop, and web platforms.
      what_remains_open: Comparability with frontier proprietary agents and transfer
        from fine-tuned benchmarks to real user tasks.
    - line: Video-guided keyframe extraction
      what_it_solves: Reduces video input for MLLM-based agents by selecting task-relevant,
        scene-aware keyframes for video question answering and GUI interaction.
      what_remains_open: Whether keyframe-selection improvements transfer to long-horizon
        GUI control and interactive observation decisions.
    consensus:
    - Real GUI application tasks expose gaps that aggregate accuracy alone masks;
      sub-goal, cost-accuracy, grounding, and replay metrics are used to reveal those
      gaps.
    - Multimodal visual grounding of interface elements and workflow states is a recurring
      requirement across desktop, web, mobile, and dynamic-screen tasks.
    - Reusing validated task patterns or skills improves execution efficiency and
      repeated-task performance over purely model-driven one-off action generation.
    - Current agents still lag human-level behavior in dynamic, cost-sensitive, or
      interaction-rich settings.
    disagreements:
    - Some evaluations assume observable static screens or discrete click actions;
      others require agents to manage observation timing on dynamically changing living
      screens.
    - One branch addresses deficiencies by adding external multimodal skills or replayable
      memory, while another branch trains or changes the underlying vision-language
      model.
    - 'Evaluation targets differ: deterministic Pass@1 completion, cost-accuracy or
      information efficiency, speed/token reduction, and fine-grained sub-goal completion
      are not treated as equivalent.'
    - 'Interaction scope differs: broad multi-app OS coverage versus a single interaction
      primitive or platform-specific dynamic environment.'
    open_questions:
    - To what extent do gains on one GUI application benchmark transfer to other operating
      systems, apps, or interaction modes?
    - How should agents decide when and how much to observe in continuously changing
      interfaces without over- or under-observing?
    - What evidence is needed to reproduce these methods when code, datasets, or model
      artifacts are not publicly available or are omitted from the packet?
    - Can stored multimodal skills and replayable memories remain valid as application
      UIs or task constraints change over time?
