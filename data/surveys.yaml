    screenshots/annotated trajectories, and visual skills versus structured context.'
  - 'Trend evolution: The 2024–2026 frontier is moving from static click-only desktop/mobile
    benchmarks toward dynamic interfaces, drag manipulation, long-horizon context
    management, and reliability-aware evaluation; formal theory remains mostly embedded
    in task formalizations.'
  - 'Open questions: Whether these formalizations transfer across interfaces and model
