      尚未覆盖: 这些形式化假设是否在所有真实界面类型和跨平台部署中成立，以及是否直接影响代理的设计选择。
    - 路线: 缩放驱动的代理能力扩展
      解决的问题: 通过大规模合成任务生成、弱监督、在线RL和多模态技能库，将代理性能与训练资源和数据规模关联，提升长程任务成功率。
      尚未覆盖: 直接验证缩放规律能否预测分布外任务的失败模式，以及性能提升是否带来可靠的安全保证。
    - 路线: 评估维度的分类与不确定性量化
      解决的问题: 将代理评估从单一成功率扩展到细粒度子目标完成度、成本-准确性平衡和事后不确定性校准，组织关于代理可靠性的主张。
      尚未覆盖: 这些分类方法是否改变了研究者的模型设计，以及跨模型、跨接口的UQ排名迁移性弱的问题。
    共识:
    - 单一点击动作无法覆盖真实GUI交互，需扩展至拖拽、动态内容和多应用协作。
    - 评估指标趋向细粒度，从Pass@1转向子目标完成度、成本-准确性权衡和不确定性估计。
    - 大规模自动生成或未标注截图数据是降低昂贵人工标注依赖的关键路径。
    - 在线RL和结构化技能库是提升代理在长程任务中表现的有效手段。
    分歧:
    - 评估目标侧重：有的以任务成功率为核心，有的强调信息获取效率，有的引入不确定性校准作为安全度量。
    - 训练范式差异：监督微调依赖高质量标注轨迹，在线RL利用可验证奖励探索，弱监督与技能库则从非结构化数据中提取知识。
    - 交互模态覆盖范围从静态桌面/移动到动态短视频界面，再到拖拽操作，假设和评估环境各不相同。
    - 不确定性建模：少数工作将UQ作为核心组件，多数工作仅关注性能提升，未考虑安全边界。
    开放问题:
    - 现有形式化交互假设能否泛化到非标准或混合现实的GUI场景？
    - 当在线RL和数据规模扩大时，代理性能是否会饱和，如何保证行为可预测性与安全性？
    - 跨平台、跨模型的评估及UQ方法迁移性弱，如何建立统一的评估理论？
    - 长程任务中上下文管理的最优策略缺乏理论证明，主动管理与被动遗忘的边界在哪里？
