      解决的问题: 通过分层组织知识（VISUALSKILL）或主动管理长时域上下文（MemGUI-Agent）来提升代理性能，减少因缺失视觉线索或上下文溢出导致的错误。
      尚未覆盖: 这些方法假设技能库或上下文字段保持准确且最新；它们在面对新应用或对抗性UI变化时的鲁棒性尚未验证。
    - 路线: 数据高效与可扩展的训练方法
      解决的问题: 通过利用未标注截图的弱监督（GUICrafter）或合成可验证任务配合在线RL（ScaleCUA），大幅减少对昂贵人工标注的依赖，以极少量数据实现强性能。
      尚未覆盖: 合成流水线在不同操作系统环境下的可扩展性，以及RL训练策略能否泛化到合成任务集之外，尚未确立；分布偏移下的行为变化同样未被检验。
    - 路线: 代理动作的可靠性与不确定性量化
      解决的问题: 提供一个框架来测量和比较不同模型和UQ方法在GUI基础任务上的置信度，通过标记不确定动作来支持更安全的部署。
      尚未覆盖: UQ排名跨模型层级和接口的迁移较弱，且共形覆盖度在分布偏移下退化，当前方法在没有任务特定重校准的情况下尚不能提供鲁棒的部署时安全。
    共识:
    - 当前GUI代理在动态、长时域和多模态场景中表现脆弱，基于基准的分析是揭示系统性弱点的首要工具。
    - 扩展交互空间（如拖拽、上下文管理）和提高样本效率，对于使代理在真实计算机使用中实用化都是必要的。
    - 向代理提供结构化的先验知识（如技能库或紧凑的上下文表示）相比纯端到端方法能持续提升任务完成效果。
    - 可靠性问题（包括不确定性量化和观察控制）正成为超越原始任务成功率的关键维度。
    分歧:
    - 评测重点：部分工作优先考虑任务级Pass@1或得分，另一些则强调细粒度子目标指标、成本-准确性权衡或不确定性校准，导致对代理行为最重要方面的不同结论。
    - 交互表示：一条路线将新交互原语（拖拽、上下文作为动作）作为一等动作，另一条路线则依赖隐式多模态理解而不显式扩展动作空间。
    - 训练范式：方法涵盖从少量标注数据的有监督微调，到海量无标注数据的弱监督，再到自生成任务的在线RL；对于最有效或最安全的训练方案尚无共识。
    - 部署领域：静态桌面/移动基准、动态短视频平台和拖拽专用接口各自定义了不同的环境假设，一个领域的发现并未明显迁移到其他领域。
    开放问题:
    - UQ方法和合成训练任务在多大程度上可以跨操作系统、应用界面和模型家族迁移，而无需重校准或重训练？
    - 如何将动态屏幕、拖拽等形式化交互模型整合到一个统一的代理框架中，从而在分布偏移下提供行为保证？
    - 覆盖绝大多数真实GUI任务所需的最小交互原语和上下文表示集合是什么，如何通过实证验证？
