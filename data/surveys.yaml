  - 主流方向：研究集中在现实GUI/计算机使用评测，以及可复用技能、记忆或环境工件，以提升桌面、网页、移动和动态媒体任务中的代理可靠性。
  - 研究共性：论文构建面向特定应用的基准或工件，并以细粒度任务完成、子目标准确性、定位或重放效率来度量，而非只看最终成功。
