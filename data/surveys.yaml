  - 主流方向：构建针对真实桌面、移动和网络应用的 GUI 代理的全面基准和增强方法，重点关注任务完成准确性、效率以及多样化交互方式的处理。
  - 研究共性：所有工作都使用视觉语言模型（VLM）作为核心代理骨干，基于任务成功率（Pass@1、准确率或成本-准确率）进行评估，并依赖屏幕或 UI 输入，而非显式的领域特定世界模型。
  - 关键差异：部分基准针对静态界面（macOS 桌面、网页），而其他基准则处理动态内容（短视频平台、视频引导任务）或未充分探索的交互原语（拖拽）。增强方法分化为技能库、编译状态机和历史感知评判模型，各自优化代理性能的不同方面。
  - 趋势演进：2024 至 2026 年，前沿从通用桌面/移动 GUI 基准转向专门的交互方式（拖拽、动态屏幕、视频引导），并从原始 VLM 代理发展到分层增强技术，以提升速度、错误恢复和长期规划能力，同时开始关注欺诈检测等安全关键应用。
  - 开放问题：如何在动态界面中泛化观察控制；如何在用编译程序替代实时模型调用时平衡效率与准确性；如何跨不同应用和平台迁移所学技能；以及如何在不依赖信誉捷径的情况下评估安全领域中的代理。
  literature_review:
    line_of_work_matrix:
    - line: Comprehensive GUI agent benchmarking
      what_it_solves: Establishes standardized evaluation suites covering diverse
        tasks, apps, and interaction modes (GUI+CLI, dynamic content, drag) to measure
        agent capabilities and diagnose failure modes.
      what_remains_open: Benchmarks are limited to specific platforms (macOS, short-video,
        web) and may not transfer to other OS or dynamic interfaces; missing standardized
        metrics for observation efficiency and safety.
    - line: Skill and knowledge augmentation for agents
      what_it_solves: Enhances agent success by providing retrievable multimodal skill
        libraries (VISUALSKILL) or compiling successful runs into fast-replay state
        machines (PreAct), reducing per-step LLM calls and improving accuracy.
      what_remains_open: Unclear whether skill libraries transfer across apps or OS
        versions; compiled programs rely on screen-state matching that may break under
        UI updates; fallback mechanisms still require live agent calls.
    - line: History-aware planning and execution critique
      what_it_solves: Mitigates short-sighted planning and execution errors by summarizing
        past actions into macro-history and visually verifying coordinates before
        execution (HiViG), improving success rates across diverse benchmarks.
      what_remains_open: Training on real GUI trajectories may not cover all possible
        failure modes; the critic's performance when integrated with different agent
        policies is not fully explored.
    - line: Domain-specific agent safety and fraud detection
      what_it_solves: Evaluates how web agents perform SMS-to-webpage fraud detection
        without URL/reputation shortcuts, revealing that models can spot suspicious
        cues but struggle with benign recall.
      what_remains_open: Suppressing reputation cues may not reflect real-world deployment;
        only 9 agents tested; cross-domain generalization of fraud detection to other
        scam types is unknown.
    consensus:
    - All papers evaluate GUI agents using task completion metrics, often with fine-grained
      or multi-checkpoint scoring to capture partial progress beyond binary pass/fail.
    - Vision-language models are the default agent architecture, and no work relies
      on explicit world models or domain-specific simulators; agents operate directly
      on screenshots or UI hierarchies.
    - There is a shared recognition that current agents lack robust observation control
      and planning, leading to failures such as over-observation, under-observation,
      or short-sighted action sequences.
    - 'Reproducibility and benchmarking are emphasized: most works release datasets,
      benchmarks, or code, though some lack full artifact availability.'
    disagreements:
    - 'Interaction scope: some benchmarks focus on static, discrete-action interfaces
      (MacAgentBench, DragOn), while others target dynamic, continuously changing
      content (LivingScreen, video-guided tasks) where the agent must manage information
      flow.'
    - 'Augmentation strategy: VISUALSKILL enriches the agent with static multimodal
      documentation, PreAct compiles past runs into deterministic programs, and HiViG
      adds a learned critic—reflecting different trade-offs between generality, speed,
      and error recovery.'
    - 'Evaluation target: the majority benchmark task success, but PreAct additionally
      measures speedup, LivingScreen introduces cost-accuracy, and FraudSMSWalker
      evaluates recall/precision in a safety context, indicating divergent priorities.'
    - 'Deployment assumption: MacAgentBench and VISUALSKILL assume a stationary desktop
      environment, whereas LivingScreen and FraudSMSWalker assume a browser-based
      or web scenario, revealing disagreement on the primary deployment platform for
      GUI agents.'
    open_questions:
    - How can agents be equipped with explicit observation control to decide when
      to gather more information versus acting, especially in dynamic interfaces?
    - What is the trade-off between compiling agent runs for speed and maintaining
      robustness when UI layouts or task contexts change?
    - Can multimodal skill libraries or history-aware critics generalize across different
      operating systems, application versions, or even domains (e.g., from desktop
      to fraud detection)?
    - How should safety-critical agent applications be evaluated without relying on
      reputation shortcuts (URLs, domains) that are unavailable in a real-time, zero-trust
      setting?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 综合 GUI 代理基准测试
      解决的问题: 建立涵盖多样化任务、应用和交互模式（GUI+CLI、动态内容、拖拽）的标准化评估套件，以衡量代理能力并诊断失败模式。
      尚未覆盖: 基准限于特定平台（macOS、短视频、网页），可能无法迁移到其他操作系统或动态界面；缺少评估观察效率和安全性的一致指标。
    - 路线: 代理技能与知识增强
      解决的问题: 通过提供可检索的多模态技能库（VISUALSKILL）或将成功运行编译为快速重放状态机（PreAct），提升代理成功率，减少每步大模型调用，提高准确性。
      尚未覆盖: 技能库能否跨应用或操作系统版本迁移尚不明确；编译程序依赖屏幕状态匹配，可能因 UI 更新而失效；回退机制仍需实时代理调用。
    - 路线: 历史感知规划与执行评判
      解决的问题: 通过将过去动作总结为宏观历史并在执行前视觉验证坐标（HiViG），缓解短视规划和执行错误，跨基准提高成功率。
      尚未覆盖: 在真实 GUI 轨迹上训练可能无法覆盖所有失败模式；评判模型与不同代理策略集成时的性能未充分探索。
    - 路线: 领域特定的代理安全与欺诈检测
      解决的问题: 评估网络代理在无 URL/信誉捷径的情况下进行短信到网页欺诈检测的能力，揭示模型能发现可疑线索但良性召回率低。
      尚未覆盖: 抑制信誉线索可能不反映真实部署；仅测试了 9 个代理；欺诈检测跨诈骗类型的泛化未知。
    共识:
    - 所有论文均使用任务完成指标评估 GUI 代理，常采用细粒度或多检查点评分以捕捉部分进展，而非仅二元通过/失败。
    - 视觉语言模型是默认的代理架构，没有工作依赖显式世界模型或领域特定模拟器；代理直接基于截图或 UI 层次结构操作。
    - 普遍认识到当前代理缺乏鲁棒的观察控制和规划，导致过度观察、观察不足或短视动作序列等失败。
    - 可复现性和基准测试受到重视：多数工作发布了数据集、基准或代码，尽管部分仍缺少完整工件。
    分歧:
    - 交互范围：部分基准聚焦静态、离散动作界面（MacAgentBench、DragOn），其他则针对动态、持续变化的内容（LivingScreen、视频引导任务），要求代理管理信息流。
    - 增强策略：VISUALSKILL 用静态多模态文档丰富代理，PreAct 将过去运行编译成确定性程序，HiViG 添加学习型评判模型——反映了通用性、速度和错误恢复之间的不同权衡。
    - 评估目标：大多数基准评估任务成功率，但 PreAct 额外测量加速比，LivingScreen 引入成本-准确率，FraudSMSWalker 在安全上下文中评估召回/精确率，表明优先级的差异。
    - 部署假设：MacAgentBench 和 VISUALSKILL 假设静态桌面环境，而 LivingScreen 和 FraudSMSWalker 假设基于浏览器或网页的场景，揭示了对
      GUI 代理主要部署平台的分歧。
    开放问题:
    - 如何赋予代理明确的观察控制能力，使其在动态界面中决定何时收集更多信息与何时行动？
    - 当 UI 布局或任务上下文变化时，编译代理运行以提升速度与保持鲁棒性之间的权衡是什么？
    - 多模态技能库或历史感知评判模型能否跨不同操作系统、应用版本甚至领域（例如从桌面到欺诈检测）泛化？
    - 在无法依赖信誉捷径（URL、域名）的实时零信任环境中，如何评估安全关键型代理应用？
