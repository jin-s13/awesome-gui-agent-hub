  related_work_outline:
  - 'Mainstream direction: benchmark-driven diagnosis of GUI agents, with method work
    focused on training and task synthesis, weakly supervised grounding, and frozen-model
    harness optimization across macOS, dynamic-screen, video-guided, and drag-based
    settings.'
  - 'Shared research pattern: multiple papers pair new task suites or evaluation protocols
    with method improvements; fine-grained scoring, verifiable rewards, and evidence-driven
    diagnosis are used to separate gaps in observation control, drag grounding, and
    uncertainty.'
  - 'Key differences: improvement locus differs among training/curriculum design,
    online RL and task synthesis, execution-harness evolution, keyframe extraction,
    and post-hoc uncertainty; evaluation targets range from static macOS tasks to
    dynamic video and drag interactions.'
  - 'Trend evolution: all dated evidence is from 2026, so the trend is within the
    current frontier: movement toward real-world, dynamic, multi-step computer-use
    tasks and toward data efficiency and frozen-model self-improvement.'
  - 'Open questions: cross-platform and cross-tier transfer, contribution isolation
    from backbone/framework/harness, and extension from single-step grounding to multi-step
    trajectories remain unresolved.'
  related_work_outline_zh:
  - 主流方向：基准驱动诊断GUI智能体，方法工作集中在任务合成、弱监督定位、在线强化学习和冻结模型执行框架优化，覆盖macOS、动态屏幕、视频引导和拖拽交互等场景。
  - 研究共性：多篇工作同时引入任务套件或评测协议并配套方法改进；细粒度评分、可验证奖励和证据驱动诊断被用来区分观察控制、拖拽定位和不确定性等能力缺口。
  - 关键差异：改进位置不同，包括训练/课程设计、在线RL与任务合成、执行harness演进、关键帧提取和后验UQ；评测对象从静态macOS任务到动态视频和拖拽交互。
  - 趋势演进：现有证据均为2026年，属于当前前沿窗口；方向是向真实、动态、多步计算机使用任务以及数据效率和冻结模型自改进演进。
  - 开放问题：跨平台与跨层级迁移、方法增益是否来自骨干/框架/harness，以及单步定位结论能否扩展到多步轨迹。
  literature_review:
    line_of_work_matrix:
    - line: Evaluation and evidence protocol design
      what_it_solves: defines task suites with executable checks and fine-grained
        metrics to expose grounding, observation control, action coverage, and uncertainty
        gaps
      what_remains_open: evaluation is often platform- or interaction-specific; multiple
        papers lack limitation details, and metric-to-deployment transfer is not yet
        shown
    - line: Data-efficient training and task synthesis for GUI grounding
      what_it_solves: reduces annotation and sample inefficiency through unannotated
        screenshots, verifiable task generation, and online RL curricula
      what_remains_open: contribution isolation is weak because data scale, reward,
        sampling, and base model are varied together; generalization beyond evaluated
        benchmarks is uncertain
    - line: Harness and observation-interface adaptation for frozen agents
      what_it_solves: improves GUI agents without retraining backbones by optimizing
        execution harness, keyframe extraction, and observation control
      what_remains_open: gain attribution among model, harness, and planner is unresolved;
        transfer evidence is limited to specific OSWorld and WindowsAgentArena cases
    - line: Uncertainty quantification and reliability methods for GUI grounding
      what_it_solves: ranks grounding confidence and constructs conformal click regions
        for spatial safety
      what_remains_open: evidence covers single-step grounding only; cross-tier transfer
        is weak and conformal coverage degrades under distribution shift
    consensus:
    - Fine-grained executable evaluation is replacing coarse outcome-only or single-action
      accuracy; multiple works use sub-goal, multi-checkpoint, or cost-accuracy scoring
      to reveal capability differences.
    - Large-scale generated or weakly supervised data, with verifiable rewards or
      RL calibration, is becoming central for GUI action grounding and training efficiency.
    - Current GUI agents still fall short on dynamic observation control, drag-based
      actions, and reliable uncertainty across model families and interfaces.
    disagreements:
    - 'Improvement strategy differs: some train or fine-tune the agent, others optimize
      the execution harness or keyframe extraction around a frozen model, and others
      apply post-hoc uncertainty methods.'
    - Evaluation setting differs across macOS desktop, short-video streams, video-guided
      tasks, drag-only interactions, and single-step grounding; interaction mode and
      task distribution change which capabilities are stressed.
    - 'Supervision signal differs: unannotated screenshots with weak calibration,
      verifiable synthesized tasks with online RL, human-authored task suites, and
      uncertainty rankings provide different optimization targets.'
    open_questions:
    - Which method choices transfer beyond OSWorld, ScienceBoard, macOS, and short-video
      platforms, and what evidence would isolate method contribution from backbone,
      framework, or harness?
    - How do observation-control failures and drag-action grounding affect multi-step
      trajectories, and can dynamic-interface findings generalize outside their source
      platforms?
    - What verification gaps remain from unreported limitations and uneven artifact
      availability, especially for reproducibility and metric robustness across model
      tiers?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 评测与证据协议设计
      解决的问题: 定义带有可执行检查和细粒度指标的任务套件，以暴露定位、观察控制、动作覆盖和不确定性缺口
      尚未覆盖: 评测常局限于特定平台或交互类型；多篇论文缺少局限性说明，指标到部署的迁移尚未建立
    - 路线: 面向GUI定位的数据高效训练与任务合成
      解决的问题: 通过未标注截图、可验证任务生成和在线RL课程减少标注依赖与采样低效
      尚未覆盖: 数据规模、奖励、采样和基础模型常同时变化，贡献隔离较弱；在已评测基准之外的泛化仍不确定
    - 路线: 面向冻结代理的执行harness与观察接口适配
      解决的问题: 在不重训骨干模型的情况下，通过优化执行harness、关键帧提取和观察控制提升GUI代理
      尚未覆盖: 模型、harness与规划器之间的增益归因不清；迁移证据仅限于OSWorld与WindowsAgentArena的特定案例
    - 路线: GUI定位的不确定性量化与可靠性方法
      解决的问题: 对定位置信度进行排序，并构造用于空间安全的共形点击区域
      尚未覆盖: 证据仅限于单步定位；跨层级迁移较弱，共形覆盖在分布偏移下会下降
    共识:
    - 细粒度可执行评估正在取代仅看最终结果或单动作准确率；多项工作使用子目标、多检查点或成本-准确率指标揭示能力差异。
    - 大规模生成或弱监督数据配合可验证奖励或RL校准，正在成为GUI动作定位与训练效率的关键路径。
    - 当前GUI代理在动态观察控制、拖拽动作和跨模型可靠不确定性方面仍存在明显能力缺口。
    分歧:
    - 改进策略不同：有的训练或微调代理，有的围绕冻结模型优化执行harness或关键帧提取，有的采用后验不确定性方法。
    - 评测环境不同：macOS桌面、短视频流、视频引导任务、拖拽专用交互和单步定位各自强调不同的交互模式与能力。
    - 监督信号不同：未标注截图弱校准、可验证合成任务在线RL、人工任务套件和不确定性排序提供不同的优化目标。
    开放问题:
    - 哪些方法选择能从OSWorld、ScienceBoard、macOS和短视频平台迁移，什么证据能把方法贡献与骨干、框架或harness隔离开？
    - 观察控制失败和拖拽动作定位如何影响多步轨迹，动态界面发现能否在来源平台之外推广？
    - 由于局限性未报告和工件可得性不均，哪些可复现性与指标稳健性验证缺口仍未关闭？
