  literature_review:
    line_of_work_matrix:
    - line: Formal task definitions and interaction assumptions
      what_it_solves: Clarifying the behavioral assumptions and capability boundaries
        of GUI agents in dynamic interfaces, drag-based interactions, and multi-application
        workflows, laying the foundation for benchmark design.
      what_remains_open: Whether these formalized assumptions hold across all real
        interface types and cross-platform deployments, and whether they directly
        influence agent design choices.
    - line: Scaling-driven agent capability extension
      what_it_solves: Connecting agent performance to training resources and data
        scale via large-scale synthetic task generation, weak supervision, online
        RL, and multimodal skill libraries, improving long-horizon task success.
      what_remains_open: Direct validation that scaling laws predict failure modes
        in out-of-distribution tasks, and whether performance gains come with reliable
        safety guarantees.
    - line: Evaluation taxonomy and uncertainty quantification
      what_it_solves: Expanding agent evaluation from single success metrics to fine-grained
        sub-goal completion, cost-accuracy balance, and post-hoc uncertainty calibration,
        organizing claims about agent reliability.
      what_remains_open: Whether such taxonomies change how researchers design models,
        and the weak cross-model, cross-interface transferability of UQ rankings.
    consensus:
    - Single click actions are insufficient for real GUI interaction; extending to
      drag, dynamic content, and multi-app collaboration is necessary.
    - Evaluation metrics are becoming finer-grained, moving beyond Pass@1 to sub-goal
      completion, cost-accuracy trade-offs, and uncertainty estimation.
    - Large-scale automatically generated or unannotated screenshot data is a key
      path to reduce reliance on expensive manual annotations.
    - Online RL and structured skill libraries are effective means to improve agent
      performance on long-horizon tasks.
    disagreements:
    - 'Evaluation focus: some prioritize task success rate, others emphasize information
      efficiency, and a third group introduces uncertainty calibration as a safety
      metric.'
    - 'Training paradigm: supervised fine-tuning relies on high-quality annotated
      trajectories, online RL exploits verifiable reward exploration, while weak supervision
      and skill retrieval extract knowledge from unstructured data.'
    - Interaction modality coverage spans static desktop/mobile, dynamic short-video
      interfaces, and drag operations, with different assumptions and evaluation environments.
    - 'Explicit uncertainty modeling: a few works treat UQ as a core component; most
      focus solely on performance improvement without addressing safety boundaries.'
    open_questions:
    - Can existing formal interaction assumptions generalize to non-standard or mixed-reality
      GUI scenarios?
    - Will agent performance saturate as online RL and data scale grow, and how can
      behavioral predictability and safety be guaranteed?
    - Cross-platform and cross-model evaluation and UQ transferability is weak; how
      to build a unified evaluation theory?
    - Optimal long-horizon context management strategies lack theoretical justification;
      what are the boundaries between proactive management and passive forgetting?
