  literature_review:
    line_of_work_matrix:
    - line: Data-efficient training and open orchestration
      what_it_solves: Turns GUI/web/computer-use tasks into trainable agent workflows
        by reducing dependence on annotated GUI trajectories and closed training stacks,
        using unannotated screenshots, live multi-turn RL, or harness-native proxies.
      what_remains_open: Error recovery remains weak after RL, harness design heavily
        affects trainability, and independent replication across environments is not
        yet established.
    - line: Reusable execution memory and multimodal skill libraries
      what_it_solves: Converts validated trajectories and application UI knowledge
        into callable, parameter-controlled memory or hierarchical multimodal skill
        artifacts, reducing token/execution cost and improving UI state verification.
      what_remains_open: Applicability is bounded by deterministic replay preconditions,
        current runtime compatibility, and limited evidence across unseen applications
        and platforms.
    - line: Efficient model architectures and decoding strategies
      what_it_solves: Improves GUI agent performance and inference efficiency by exploring
        diffusion-based or non-autoregressive vision-language backbones with native-resolution
        visual encoders.
      what_remains_open: The packet provides no visible limitation or artifact detail,
        so validation beyond selected grounding/navigation benchmarks is a verification
        gap.
    - line: Diagnostic benchmarks and safety/reproducibility audits
      what_it_solves: Tests step-level GUI transition understanding and prompt-injection
        or skill-injection safety across browser and desktop settings, including audits
        of prior red-teaming claims.
      what_remains_open: Offline diagnostics omit live asynchronous timing; security
        audits only reproduce hand-crafted attacks and do not test RL-optimized injection
        strings; OS, action, and task coverage is narrow.
    consensus:
    - Evaluation is moving beyond single-frame grounding toward trajectory-level success,
      state verification, and transition understanding.
    - Visual grounding remains a central bottleneck, with multimodal skill/memory
      reuse and RL training both trying to improve UI state verification.
    - Open frameworks and benchmarks are increasingly paired with artifacts, but reproducibility
      signals vary and some packet entries lack code, data, or limitation details.
    - 'Cost and latency matter: replayable memory and parallel decoding attempt to
      reduce token usage and execution overhead.'
    disagreements:
    - 'Improvement location differs: some change the vision-language generation backbone,
      others wrap existing harnesses with RL, and still others retrieve validated
      experience or only introduce evaluation.'
    - 'Supervision and evaluation signals differ: unannotated screenshot weak supervision,
      online trajectory-level RL, offline action/transition pairs, and security attack
      success metrics coexist.'
    - 'Interaction mode differs: live browser/desktop rollouts, offline image-pair
      diagnosis, and deterministic replayable memories make different deployment assumptions.'
    - 'Safety evidence is domain-conditioned: browser prompt-injection resistance
      does not transfer to coding-domain skill injection.'
    - 'Reproducibility assumptions differ: some work provides only repository signals,
      while the safety audit explicitly reports that RL-optimized red-teaming strings
      are not reproducible from published data.'
    open_questions:
    - Which training objectives or harness designs can improve error recovery, which
      remains weak even after RL training?
    - Can replayable memories handle ambiguous, asynchronous, or cross-application
      state changes outside their deterministic preconditions?
    - Do offline GUI transition benchmarks predict live end-task success and realistic
      failure recovery?
    - How can security audits incorporate RL-optimized injection strings and more
      operating systems to test whether hardening is domain-general?
    - Which reproducibility signals, such as code, data, metrics, and baselines, are
      sufficient for independent verification across teams and infrastructure?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 数据高效训练与开放编排
      解决的问题: 通过未标注截图、在线多轮 RL 或 harness 原生代理，减少对标注 GUI 轨迹和封闭训练栈的依赖，端到端训练 GUI/网页/计算机使用智能体。
      尚未覆盖: 错误恢复在 RL 后仍然薄弱；不同 harness 可训练性差异大；跨环境独立复现尚未建立。
    - 路线: 可复用执行记忆与多模态技能库
      解决的问题: 将已验证轨迹和应用 UI 知识转化为可调用的参数化记忆或分层多模态技能，降低 token 与执行时间并改善 UI 状态验证。
      尚未覆盖: 适用性受确定性重放前置条件、运行时兼容性和未见应用/平台泛化证据限制。
    - 路线: 高效模型架构与解码策略
      解决的问题: 通过扩散式视觉语言骨干和原生分辨率视觉编码器改善 GUI 智能体的性能或推理效率。
      尚未覆盖: 证据中缺少局限性与代码/工件信息，其在真实动态应用中的覆盖仍是验证缺口。
    - 路线: 诊断基准与安全可复现审计
      解决的问题: 在桌面和浏览器场景中测试逐步 GUI 过渡理解和提示注入/技能注入安全边界，并审计先前红队结论的可复现性。
      尚未覆盖: 离线诊断不覆盖实时异步时序；安全审计仅覆盖手工模板，未复现 RL 优化注入；OS、动作类型和任务覆盖有限。
    共识:
    - 评估正在从单帧定位转向轨迹级成功、状态验证和过渡理解。
    - 视觉定位仍是核心瓶颈，多模态技能/记忆和 RL 训练都在尝试改善 UI 状态验证。
    - 开放框架与基准越来越常伴随工件发布，但可复现信号不一，部分论文缺少代码、数据或局限性说明。
    - 成本和延迟受到关注，重放记忆和并行解码尝试降低 token 与执行开销。
    分歧:
    - 改进层级不同：有的改变视觉语言生成范式，有的围绕现有 harness 做 RL，有的检索已验证经验或只提供评测。
    - 监督与评测信号不同：未标注截图弱监督、在线轨迹级 RL、离线动作/过渡对、安全攻击成功指标并存。
    - 交互模式不同：实时浏览器/桌面 rollout、离线图像对诊断和确定性重放记忆之间存在不同部署假设。
    - 安全证据具有领域条件性：浏览器提示注入抵抗力不迁移到编码领域技能注入。
    - 可复现假设不同：部分工作只给出仓库信号，而安全审计明确指出 RL 优化红队字符串无法从已发表数据复现。
    开放问题:
    - 哪些训练目标或 harness 设计能够改善 RL 训练后仍然薄弱的错误恢复能力？
    - 重放记忆能否在其确定性前置条件之外处理模糊、异步和跨应用状态变化？
    - 离线 GUI 过渡诊断基准能否预测真实端任务成功和失败恢复？
    - 安全审计如何纳入 RL 优化注入字符串和更多操作系统，以检验安全加固是否跨领域通用？
    - 哪些可复现信号（代码、数据、指标、基线）足以支持跨团队和基础设施的独立验证？
