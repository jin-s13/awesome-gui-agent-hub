  related_work_outline:
  - 'Mainstream direction: The dominant direction is building large, application-spanning
    GUI/computer-use benchmarks with fine-grained scoring rather than only final success,
    expanding from static webpages to real OS desktops, video-guided tasks, and dynamic
    short-video interfaces.'
  - 'Shared research pattern: Papers pair human-designed or synthesized tasks with
    deterministic or rule-based checks, multi-checkpoint or cost-aware metrics, and
    multi-model/framework comparisons; adjacent methods are validated on existing
    suites such as OSWorld, OSWorld-Verified, ScienceBoard, CUA-World, OSExpert-Eval,
    and WindowsAgentArena.'
  - 'Key differences: The evidence splits between static multi-step desktop tasks,
    dynamic interfaces where observation control matters, video-guided grounding tasks,
    and single-step uncertainty and grounding benchmarks; some works report aggregate
    Pass@1 while others report sub-goal, cost-accuracy, calibration, or cross-benchmark
    transfer metrics.'
  - 'Trend evolution: The available years are narrow and dominated by 2026; within
    the current frontier, the trend is moving toward richer observation settings,
    fine-grained and auxiliary metrics, uncertainty quantification, and transfer-focused
    evaluation across model families and execution harnesses.'
  - 'Open questions: It remains unclear how well benchmark improvements transfer across
    platforms, model families, and interface dynamics, and whether fine-grained rule-based
    metrics align with user-relevant success; missing limitation, code, dataset, or
    citation details for several entries are verification gaps.'
  related_work_outline_zh:
  - 主流方向：构建覆盖多应用、多步骤的 GUI/计算机使用基准，并从只看最终成功率转向细粒度评分；评测范围从静态网页扩展到真实桌面、视频引导任务和动态短视频界面。
  - 研究共性：工作通常结合人工设计或自动生成的任务、确定性规则校验、多检查点或成本感知指标，并进行多模型/框架对比；相邻方法常以 OSWorld、OSWorld-Verified、ScienceBoard、CUA-World、OSExpert-Eval、WindowsAgentArena
    等作为验证平台。
  - 关键差异：证据分为静态多步桌面任务、需要观测控制的动态界面、视频引导任务和单步不确定性/grounding 基准；有的报告 Pass@1，有的报告子目标、成本-精度、校准或跨基准迁移指标。
  - 趋势演进：可用年份较窄且以 2026 年为主；在当前前沿内，趋势是引入更丰富的观测设置、细粒度与辅助指标、不确定性量化，以及跨模型家族和执行 harness
    的迁移评测。
  - 开放问题：基准提升在平台、模型家族和界面动态性之间的迁移仍不明确；细粒度规则指标是否与用户关心的成功一致也未解决；若干条目的局限、代码、数据集或引用细节缺失属于验证缺口。
  literature_review:
    line_of_work_matrix:
    - line: Real-world OS and desktop task benchmarks
      what_it_solves: Creates shared multi-app, multi-step GUI tasks with deterministic
        or rule-based checks to make computer-use agent performance comparable beyond
        toy webpages.
      what_remains_open: Reported evidence focuses on selected suites such as macOS
        desktop, OSWorld, OSWorld-Verified, ScienceBoard, and WindowsAgentArena; cross-suite
        stability and dynamic interface coverage remain uncertain.
    - line: Dynamic and video-guided interface benchmarks
      what_it_solves: Evaluates agents under changing visual content and video-specified
        goals, adding observation-cost or keyframe-quality dimensions to pure task
        accuracy.
      what_remains_open: Current evidence is limited to short-video platforms and
        video-guided GUI tasks; over-observation and under-observation are identified
        but not yet standardized as general scoring dimensions.
    - line: Fine-grained and uncertainty-aware evaluation
      what_it_solves: Exposes sub-goal completion differences hidden by aggregate
        Pass@1 and measures post-hoc uncertainty for GUI grounding and selective prediction
        safety.
      what_remains_open: Uncertainty benchmark evidence covers single-step grounding
        only; cross-model and cross-interface ranking transfer is weak and requires
        target-specific re-evaluation.
    - line: Agent-improvement methods validated on benchmarks
      what_it_solves: Tests whether skill libraries, harness optimization, verifiable
        task synthesis with online RL, or weak supervision from unannotated screenshots
        can raise benchmark performance.
      what_remains_open: Gains are often shown on specific benchmark suites with different
        training budgets, artifacts, and execution harnesses; transfer evidence beyond
        the reported settings is limited.
    - line: Comparable baselines and reporting conventions
      what_it_solves: Supports auditability through multi-model or multi-framework
        comparisons, held-out transfers, and public artifacts or scoring scripts.
      what_remains_open: Several entries in this packet lack complete limitation,
        dataset, code, or citation metadata; evidence on implementation and compute-budget
        stability is incomplete.
    consensus:
    - Fine-grained, rule-based, or multi-checkpoint evaluation is replacing or supplementing
      a single end-to-end success metric.
    - Current agents remain below human-level on dynamic interfaces, especially when
      observation efficiency is part of the score.
    - Benchmark progress is reported through multi-model and multi-framework comparisons
      rather than single-model claims.
    - Adjacent method work treats existing GUI benchmark suites as the main evaluation
      substrate for skill, harness, RL, and weak-supervision improvements.
    - Benchmark work commonly reports multiple model or framework comparisons, but
      reporting completeness and artifact availability vary across entries.
    disagreements:
    - Some lines target static multi-step desktop task completion, while others require
      dynamic observation control or video-guided grounding; this changes the underlying
      task distribution and metric design.
    - There is a content-level split between single-step grounding and uncertainty
      evaluation versus full multi-step agent trajectory evaluation, limiting direct
      comparability.
    - 'Works differ on how to handle visual context: retaining visual skill artifacts
      or extracting task-aware keyframes can improve results, implying different assumptions
      about observation cost.'
    - Reported gains are attributed to different levers such as skill libraries, harness
      optimization, online RL, or weak supervision, under different codebases and
      compute budgets, so the source of improvement is not yet isolated.
    open_questions:
    - Do fine-grained multi-checkpoint and cost-accuracy metrics align with real user
      or enterprise success outside current leaderboards?
    - How should over-observation and under-observation be scored and transferred
      to OS/web benchmarks beyond short-video platforms?
    - Why is uncertainty-ranking transfer weak across model families and interfaces,
      and can it be improved for multi-step GUI trajectories?
    - Do benchmark gains from skill, harness, RL, and weak supervision hold under
      reproducible datasets, code releases, and comparable compute budgets?
  literature_review_zh:
