    研究路线矩阵:
    - 路线: 在线强化学习与Harness原生训练框架
      解决的问题: 在实时浏览器、桌面或容器化Harness环境中端到端训练GUI/计算机使用智能体，使用任务成功或可验证轨迹作为反馈。
