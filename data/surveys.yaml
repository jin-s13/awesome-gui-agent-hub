    - 路线: GUI评测的任务与界面形式化
      解决的问题: 通过桌面、动态短视频、拖拽及GUI+CLI任务定义GUI智能体能力；引入细粒度可执行校验与能力注释，例如MacAgentBench、DragOn和LivingScreen。
      尚未覆盖: 这些形式边界和评分规则能否预测在精选基准环境之外的真实模型行为。
    - 路线: 可扩展训练、可验证合成与弱监督
      解决的问题: 通过可验证计算机使用任务合成、在线RL和基于未标注截图的弱监督视觉定位降低人工标注需求、提升样本效率，例如ScaleCUA和GUICrafter。
      尚未覆盖: 没有直接证据表明这类策略在界面分布偏移下仍保持校准或能预测失败。
    - 路线: 多模态技能与主动上下文管理
      解决的问题: 把智能体知识组织为保留视觉信息或发出上下文管理动作的分层可检索工件，以支持长程工作流，例如VISUALSKILL和MemGUI-Agent。
      尚未覆盖: 这些组织机制是否在基准准确率之外影响设计；检索、覆盖和观察控制之间的边界尚未形式化。
    - 路线: 不确定性量化与可靠性框架
      解决的问题: 对GUI定位的后验不确定性进行基准测试，暴露过度/不足观察、跨层级不确定性迁移弱等失败模式，例如Argus和LivingScreen。
      尚未覆盖: 单步定位不确定性与任务特定失败分类尚未关联到轨迹级安全或形式化可靠性保证。
    共识:
    - 将GUI能力表示为带有细粒度可执行评分的任务套件，而不只是端到端成功率。
