  related_work_outline:
  - 'Mainstream direction: Extending GUI agents from static click-based tasks to dynamic,
    long-horizon, multi-modal interaction (drag, CLI, video-guided) via novel training
    recipes such as weakly-supervised learning, online RL, and proactive context management,
    while simultaneously exposing method gaps through richer benchmarks.'
  - 'Shared research pattern: Work typically introduces a new benchmark that reveals
    a capability gap, then proposes a training or representation method to address
    it, almost always using vision-language models as the backbone and evaluating
    on real or simulated environments.'
  - 'Key differences: Supervision type (weak labels from unannotated screenshots vs.
    verifiable task synthesis for RL vs. SFT on collected demonstrations); interaction
    granularity (click, drag, CLI, dynamic screen observation); context handling (passive
    history vs. explicit context management actions); and whether uncertainty quantification
    is integrated.'
  - 'Trend evolution: The topic is concentrated at the 2026 frontier, moving from
    controlled static benchmarks toward faithfully simulated dynamic environments,
    with a strong push toward data efficiency and longer task horizons.'
  - 'Open questions: Whether components like skill libraries, framework design, or
    sampling strategies are the true drivers of gains; cross-platform and cross-model
    generalization of training recipes; and how to combine multiple interaction types
    (click, drag, CLI, observation control) without sacrificing performance.'
  related_work_outline_zh:
  - 主流方向：通过弱监督、在线RL、主动上下文管理等新训练配方，将GUI代理从静态点击任务扩展到动态、长时域、多模态交互（拖拽、CLI、视频引导），同时通过更丰富的基准暴露方法缺陷。
  - 研究共性：工作通常先提出一个揭示能力缺口的新基准，然后提出一种训练或表示方法来解决它，几乎总是以视觉语言模型为骨干，并在真实或模拟环境中评估。
  - 关键差异：监督类型（来自未标注截图的弱标签 vs 可验证任务合成的RL vs 基于收集演示的SFT）；交互粒度（点击、拖拽、CLI、动态屏幕观察）；上下文处理（被动历史
    vs 显式上下文管理动作）；以及是否集成不确定性量化。
  - 趋势演进：该主题集中在2026年前沿，从受控静态基准向忠实模拟的动态环境转移，并大力推动数据效率和更长任务时域。
  - 开放问题：技能库、框架设计或采样策略等组件是否真正驱动收益；训练配方的跨平台和跨模型泛化；以及如何在不牺牲性能的情况下组合多种交互类型（点击、拖拽、CLI、观察控制）。
  literature_review:
    line_of_work_matrix:
    - line: Method representation and objective design
      what_it_solves: 'Transforms the problem of data scarcity and long-horizon planning
        into concrete training recipes: weakly-supervised curricula that exploit unannotated
        screenshots, online RL with verifiable synthetic tasks, and action-space extensions
        that treat context management as a first-class action.'
      what_remains_open: Which components (e.g., skill library, curriculum stage,
        sampling strategy) drive performance; whether the same recipe transfers to
        distinctly different interfaces such as video-guided or drag-based tasks;
        and how sensitive the methods are to the quality of unannotated or synthetic
        data.
    - line: Planning and action-interface methods
      what_it_solves: Connects learned representations to intervention by expanding
        the action space beyond clicks to include drag, CLI, observation control,
        and multi-step video-guided execution, and by structuring context to maintain
        task coherence over long horizons.
      what_remains_open: How much of the gain comes from the expanded action interface
        versus the underlying model capability; the lack of integrated solutions that
        jointly handle click, drag, CLI, and dynamic observation control; and whether
        proactive context management generalizes across mobile and desktop platforms.
    - line: Method evidence and ablation protocol
      what_it_solves: Separates method contribution from surrounding system choices
        by introducing fine-grained metrics (sub-goal completion, cost-accuracy, UQ
        ranking transferability) and by testing agent performance under distribution
        shifts and across model families.
      what_remains_open: Isolation of the proposed method from framework scaffolding
        and skill libraries remains incomplete; UQ rankings transfer poorly across
        model tiers, so target-specific re-evaluation is required; and most benchmarks
        are limited to single-step or single-platform settings, leaving multi-step,
        cross-platform ablation evidence scarce.
    consensus:
    - Vision-language models are the default backbone for GUI agents, and their performance
      is heavily influenced by the auxiliary components (skill libraries, context
      management, keyframe selection) rather than model architecture alone.
    - Static click-based benchmarks are insufficient to capture real-world agent failures;
      dynamic, long-horizon, and multi-modal benchmarks are necessary to reveal observation
      control, drag, and context management gaps.
    - Data efficiency is a shared concern, with multiple works exploring how to reduce
      reliance on expensive human annotations through weak supervision, synthetic
      task generation, or fine-tuning on targeted interaction data.
    disagreements:
    - 'Supervision strategy: Some methods rely on weak supervision from unannotated
      screenshots (GUICrafter), while others use online RL with verifiable reward
      synthesis (SCALECUA), creating a tension between data coverage and reward reliability.'
    - 'Context management: One line treats context as a passive accumulation of history,
      while another (MemGUI-Agent) promotes context management to a first-class action,
      which leads to different assumptions about what the policy must learn.'
    - 'Evaluation target: Some benchmarks focus on end-to-end task success (MacAgentBench,
      SCALECUA), while others emphasize fine-grained metrics like sub-goal completion,
      cost-accuracy, or UQ ranking stability, making cross-comparison difficult.'
    - 'Interaction scope: The community is split between expanding action spaces to
      include drag, CLI, and dynamic observation, and optimizing the dominant click-based
      paradigm, with no clear consensus on the priority of interaction types.'
    open_questions:
    - What is the minimal set of interaction primitives (click, drag, CLI, observation
      control) that a GUI agent must master to be considered generally capable, and
      how should they be combined in a single training recipe?
    - Can the gains observed in online RL training with synthetic tasks transfer to
      real-world deployment without catastrophic forgetting or safety issues, given
      the distribution shift between synthetic and real environments?
    - How can we disentangle the contribution of a proposed method from the framework,
      skill library, and base model used, especially when these components are not
      open-sourced or ablated?
    - Under what conditions does proactive context management improve long-horizon
      performance, and can the same context management policy generalize across heterogeneous
      platforms (mobile, desktop, browser)?
    - Given that post-hoc UQ ranking fails to transfer across model tiers, what is
      the practical path to deploying uncertainty-aware GUI agents that can safely
      refuse or request human help?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 方法表示与目标设计
      解决的问题: 将数据稀缺和长时域规划问题转化为具体训练配方：利用未标注截图的弱监督课程、可验证合成任务的在线RL，以及将上下文管理作为第一类动作的动作空间扩展。
      尚未覆盖: 哪些组件（例如技能库、课程阶段、采样策略）驱动性能；同一配方是否能迁移到视频引导或拖拽等明显不同的交互界面；方法对未标注或合成数据质量的敏感程度。
    - 路线: 规划与动作接口方法
      解决的问题: 通过将动作空间从点击扩展到拖拽、CLI、观察控制和多步视频引导执行，并通过结构化上下文在长时域中保持任务连贯性，将学习到的表示连接到干预层。
      尚未覆盖: 收益有多少来自扩展的动作接口而非底层模型能力；缺乏联合处理点击、拖拽、CLI和动态观察控制的集成方案；主动上下文管理是否能在移动和桌面平台间泛化。
    - 路线: 方法证据与消融协议
      解决的问题: 通过引入细粒度指标（子目标完成度、成本-准确性、UQ排名可迁移性），并在分布偏移和跨模型族上测试代理性能，将方法贡献与周边系统选择相分离。
      尚未覆盖: 方法贡献与框架脚手架和技能库的隔离仍不完整；UQ排名跨模型层级迁移差，需要目标特定重评估；多数基准仅限于单步或单平台设置，导致多步、跨平台消融证据稀缺。
    共识:
    - 视觉语言模型是GUI代理的默认骨干，其性能受辅助组件（技能库、上下文管理、关键帧选择）的影响远大于模型架构本身。
    - 静态点击基准不足以捕捉真实世界代理失败；需要动态、长时域、多模态基准来揭示观察控制、拖拽和上下文管理方面的缺陷。
    - 数据效率是共同关注点，多项工作探索通过弱监督、合成任务生成或在目标交互数据上微调来减少对昂贵人工标注的依赖。
    分歧:
    - 监督策略：一些方法依赖未标注截图的弱监督（GUICrafter），另一些使用带有可验证奖励合成的在线RL（SCALECUA），在数据覆盖与奖励可靠性之间存在张力。
    - 上下文管理：一种路线将上下文视为被动历史累积，另一种（MemGUI-Agent）将上下文管理提升为第一类动作，这导致对策略必须学习的内容有不同的假设。
    - 评测目标：部分基准关注端到端任务成功率（MacAgentBench、SCALECUA），另一些强调子目标完成度、成本-准确性或UQ排名稳定性等细粒度指标，使交叉比较困难。
    - 交互范围：社区在扩展动作空间（包括拖拽、CLI、动态观察）和优化主导的点击范式之间分裂，对交互类型的优先级缺乏明确共识。
    开放问题:
    - GUI代理必须掌握的最小交互原语集（点击、拖拽、CLI、观察控制）是什么，以及如何在单一训练配方中组合它们才能被视为通用能力？
    - 在合成任务上的在线RL训练所观察到的增益，是否能迁移到真实部署而不发生灾难性遗忘或安全问题，考虑到合成环境与真实环境之间的分布偏移？
    - 我们如何将所提方法的贡献与所使用的框架、技能库和基座模型分离，尤其当这些组件未开源或未经过消融时？
    - 在什么条件下主动上下文管理能提升长时域性能，以及同一上下文管理策略能否跨异构平台（移动、桌面、浏览器）泛化？
    - 鉴于后验UQ排名无法跨模型层级迁移，部署能安全拒绝或请求人类帮助的、具有不确定性感知的GUI代理的现实路径是什么？
