  literature_review_zh:
    研究路线矩阵:
    - 路线: 领域特定的GUI智能体基准测试
      解决的问题: 在具有不同交互模态（拖拽、视频、短信欺诈）和应用场景（macOS、短视频平台、欺诈检测）的真实任务上评估智能体性能。
      尚未覆盖: 跨基准的泛化能力、罕见错误模式的覆盖度，以及评估指标与真实可用性的一致性。
