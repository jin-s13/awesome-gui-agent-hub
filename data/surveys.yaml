  related_work_outline:
  - 'Mainstream direction: Building comprehensive benchmarks for GUI agents on real-world
    platforms (macOS, short-video, drag-based) with fine-grained metrics and multi-modal
    interaction coverage.'
  - 'Shared research pattern: Each paper introduces a new task suite or dataset that
    exposes a previously underexamined aspect of agent behavior, such as dynamic content,
    drag operations, or uncertainty calibration.'
  - 'Key differences: Evaluated platforms range from desktop OS to short-video apps;
    interaction types span click, drag, CLI, and video-guided tasks; learning paradigms
    include online RL, weak supervision, and skill retrieval.'
  - 'Trend evolution: From 2024 to 2026, benchmarks shift from static single-step
    GUI grounding to multi-step, dynamic, and video-guided tasks, while training methods
    move toward sample-efficient RL and large-scale weak supervision.'
  - 'Open questions: Cross-platform generalization of UI understanding, integration
    of uncertainty quantification into multi-step agent policies, and coverage of
    long-tail interactive patterns in open-ended environments.'
  related_work_outline_zh:
  - 主流方向：在真实平台（macOS、短视频、拖拽交互）上构建GUI智能体基准，引入细粒度指标与多模态任务覆盖。
  - 研究共性：每项工作都提出新任务集或数据集，揭示智能体行为中先前被忽视的方面，如动态内容、拖拽操作或不确定性校准。
  - 关键差异：评估平台从桌面OS到短视频应用不等，交互类型涵盖点击、拖拽、CLI和视频引导，学习范式包括在线RL、弱监督和技能检索。
  - 趋势演进：2024至2026年间，基准从静态单步GUI定位转向多步、动态和视频引导任务，训练方法趋向样本高效RL和大规模弱监督。
  - 开放问题：UI理解的跨平台泛化、不确定性量化在多步智能体策略中的集成、以及开放环境中长尾交互模式的覆盖。
  literature_review:
    line_of_work_matrix:
    - line: Real-world desktop/OS task benchmarks
      what_it_solves: Captures multi-app, multi-step GUI and CLI interactions on real
        operating systems with deterministic rule-based scoring.
      what_remains_open: Cross-platform transfer and robustness to OS updates are
        not tested; benchmark covers only a fixed set of 25 applications.
    - line: Dynamic and video-guided GUI benchmarks
      what_it_solves: Evaluates agents on interfaces where content changes between
        actions or requires video understanding, exposing observation-control failures.
      what_remains_open: Limited to a single platform (short-video) or specific video
        types; keyframe extraction methods may not generalize to all video tasks.
    - line: Multimodal skill retrieval for computer-use agents
      what_it_solves: Retains visual figures alongside text to improve UI element
        identification and workflow state verification, reducing reliance on text-only
        instruction.
      what_remains_open: Skill construction is per-application and requires manual
        documentation; generalization to unseen applications is not evaluated.
    - line: Online RL with verifiable task synthesis
      what_it_solves: Scales agent training by generating verifiable tasks via docker
        interactions and applying frontier sampling for efficient RL, improving open-source
        agent performance.
      what_remains_open: Synthetic task distribution may not fully match real-world
        edge cases; long-horizon task completion beyond the given benchmarks is unverified.
    - line: Weakly-supervised GUI grounding from unannotated screenshots
      what_it_solves: Reduces the need for expensive human annotations by learning
        visual grounding from large-scale unlabeled screenshots, then fine-tuning
        with minimal labeled data.
      what_remains_open: Weak supervision signals may introduce noise and require
        careful calibration; performance on tasks requiring precise spatial reasoning
        is not fully explored.
    - line: Uncertainty quantification for GUI grounding
      what_it_solves: Provides post-hoc confidence estimates for single-step GUI element
        selection, enabling safer deployment by shrinking prediction regions.
      what_remains_open: UQ ranking transfer across model families is weak; methods
        are validated only on single-step grounding, not on multi-step agent trajectories.
    - line: Drag-based interaction benchmarks
      what_it_solves: Fills the gap in click-focused agent evaluation by covering
        text highlighting, cell selection, resizing, and slider manipulation.
      what_remains_open: Performance gains on drag tasks have not been shown to translate
        to improved end-to-end computer-use success rates.
    consensus:
    - Fine-grained, multi-dimensional metrics (e.g., sub-goal completion, cost-accuracy,
      capability annotations) are necessary to capture differences that aggregate
      success rates miss.
    - Current GUI agents, including frontier models, fail on dynamic interfaces and
      tasks requiring controlled observation, indicating a lack of robust state tracking.
    - Visual information (screenshots, figures) is crucial for accurate UI grounding,
      and purely text-based representations are insufficient.
    disagreements:
    - 'Evaluation platforms differ: desktop OS environments (macOS, Linux) versus
      web-based dynamic platforms (short-video) versus mobile-adjacent interfaces,
      each stressing different interaction primitives.'
    - 'Learning paradigms vary: some advocate online RL with synthetic tasks, others
      prefer weak supervision from unlabeled screenshots, and yet others rely on curated
      skill libraries without model training.'
    - 'The role of uncertainty: one line of work treats UQ as a standalone post-hoc
      module for safety, while others integrate it implicitly into agent architectures
      or ignore it entirely.'
    open_questions:
    - How can benchmarks be designed to evaluate cross-platform and cross-application
      generalization without overfitting to specific OS versions or app layouts?
    - Can uncertainty quantification be embedded into multi-step agent policies to
      improve decision-making under ambiguity, rather than only applied to single-step
      grounding?
    - What is the minimal set of interaction types (click, drag, scroll, CLI, etc.)
      that a benchmark must cover to guarantee real-world GUI agent robustness?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 真实世界桌面/OS任务基准
      解决的问题: 在真实操作系统上捕获多应用、多步骤的GUI与CLI交互，并采用确定性规则评分。
      尚未覆盖: 跨平台迁移和OS更新鲁棒性未测试；基准仅覆盖固定的25个应用。
    - 路线: 动态与视频引导的GUI基准
      解决的问题: 评估智能体在内容随操作变化或需要视频理解的界面上的表现，暴露观察控制缺陷。
      尚未覆盖: 仅限单一平台（短视频）或特定视频类型；关键帧提取方法可能不适用于所有视频任务。
    - 路线: 面向计算机使用智能体的多模态技能检索
      解决的问题: 在文本旁保留视觉图形以改善UI元素识别和工作流状态验证，减少对纯文本指令的依赖。
      尚未覆盖: 技能构建需逐应用进行且依赖人工文档；在未见应用上的泛化能力未评估。
    - 路线: 基于可验证任务合成的在线强化学习
      解决的问题: 通过Docker交互生成可验证任务并应用前沿采样实现高效RL，提升开源智能体性能。
      尚未覆盖: 合成任务分布可能不完全匹配真实世界边缘情况；给定基准之外的长期任务完成未验证。
    - 路线: 从无标注截图中进行弱监督GUI定位
      解决的问题: 利用大规模未标注截图学习视觉定位，减少对昂贵人工标注的需求，再用少量标注数据微调。
      尚未覆盖: 弱监督信号可能引入噪声，需仔细校准；在需要精确空间推理的任务上的性能未充分探索。
    - 路线: GUI定位的不确定性量化
      解决的问题: 为单步GUI元素选择提供后验置信度估计，通过收缩预测区域实现更安全的部署。
      尚未覆盖: UQ排名跨模型家族迁移性弱；方法仅验证于单步定位，未用于多步智能体轨迹。
    - 路线: 拖拽式交互基准
      解决的问题: 填补点击型智能体评估的空白，覆盖文本高亮、单元格选择、调整大小和滑块操作。
      尚未覆盖: 拖拽任务上的性能提升是否转化为端到端计算机使用成功率提高尚未得到证实。
    共识:
    - 细粒度、多维度的指标（如子目标完成度、成本-准确性、能力注释）对于捕捉聚合成功率忽略的差异是必要的。
    - 当前GUI智能体，包括前沿模型，在动态界面和需要受控观察的任务上失败，表明缺乏鲁棒的状态跟踪。
