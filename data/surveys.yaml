  related_work_outline:
  - 'Mainstream direction: Building comprehensive GUI agent benchmarks that cover
    diverse interaction modalities (click, drag, CLI, dynamic video) and incorporate
    fine-grained metrics beyond task-level pass rates.'
  - 'Shared research pattern: Using vision-language models as agents, evaluating task
    completion, and shifting from aggregate scores to multi-dimensional assessments
    (checkpoint-level, cost-accuracy, uncertainty).'
  - 'Key differences: Benchmarks vary in action space (click-only vs. drag/dynamic),
    evaluation metric (Pass@1 vs. cost-accuracy vs. uncertainty calibration), environment
    fidelity (real desktop vs. simulated browser), and supervision for training data
    (manual annotation vs. weak supervision vs. synthetic generation).'
  - 'Trend evolution: Within the 2024–2026 frontier, the community moves from static
    desktop benchmarks (MacAgentBench) to dynamic, multimodal, and multi-platform
    settings (LivingScreen, video-guided tasks), and from pure evaluation to methods
    that improve agent performance through skill libraries, online RL, and weak supervision.'
  - 'Open questions: How well current benchmarks cover the full range of real-world
    GUI interactions (e.g., drag, observation control), how to design robust metrics
    that correlate with downstream user value, and how to ensure uncertainty quantification
    and cross-model generalization without costly re-evaluation.'
  related_work_outline_zh:
  - 主流方向：构建覆盖多种交互模态（点击、拖拽、命令行、动态视频）的全面 GUI 代理基准，并引入超越任务级通过率的细粒度评估指标。
  - 研究共性：普遍采用视觉语言模型作为代理，评估任务完成情况，并从单一总分转向多维度评估（检查点级别、成本-准确性、不确定性量化）。
  - 关键差异：基准在动作空间（仅点击 vs. 拖拽/动态）、评估指标（Pass@1 vs. 成本-准确性 vs. 不确定性校准）、环境保真度（真实桌面 vs.
    模拟浏览器）和训练数据监督方式（人工标注 vs. 弱监督 vs. 合成生成）上存在分歧。
  - 趋势演进：在 2024–2026 前沿内，领域从静态桌面基准（如 MacAgentBench）向动态、多模态、多平台设置（如 LivingScreen、视频引导任务）演进，并从纯评估转向通过技能库、在线强化学习和弱监督提升代理性能的方法。
  - 开放问题：当前基准在多大程度上覆盖了真实 GUI 交互的完整范围（如拖拽、观察控制），如何设计与下游用户价值相关的稳健指标，以及如何在不进行昂贵重评估的情况下实现不确定性量化和跨模型泛化。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design
      what_it_solves: Creating shared tasks and environments that enable systematic
        comparison of GUI agents across diverse applications, interaction modalities
        (click, drag, CLI, dynamic video), and platforms.
      what_remains_open: Whether the benchmark task distribution fully captures the
        action space and dynamic conditions where agents are expected to operate (e.g.,
        long-horizon workflows, observation control, and drag-based manipulations).
    - line: Metric and stress-test design
      what_it_solves: Probing agent capabilities beyond aggregate pass rates through
        fine-grained scoring (multi-checkpoint, cost-accuracy) and uncertainty quantification,
        revealing hidden failure modes such as over- and under-observation.
      what_remains_open: Alignment between these proxy metrics and the actual downstream
        decision quality users care about, and whether the metric rankings remain
        stable across model tiers and deployment interfaces.
    - line: Comparable baselines and training-efficiency methods
      what_it_solves: Providing reproducible baselines and training recipes (weak
        supervision, online RL, skill libraries) that improve agent performance on
        established benchmarks, enabling fair comparison.
      what_remains_open: Whether the conclusions from synthetic or weakly-supervised
        training generalize to real-world variability, and whether benchmark gains
        translate to robust real-world deployment without overfitting to the synthetic
        task distribution.
    consensus:
    - GUI agents must handle a wide range of interaction modalities (click, drag,
      CLI, dynamic content) and are predominantly built on vision-language models.
    - Aggregate task success is insufficient for diagnosis; fine-grained evaluation
      metrics (e.g., sub-goal completion, observation cost, uncertainty estimates)
      are necessary to expose capability gaps.
    - Current state-of-the-art agents still struggle with dynamic or observation-heavy
      interfaces, showing a need for better observation control and action grounding.
    - Task and data diversity (real-world desktop, short-video, drag operations) is
      crucial to prevent overfitting to narrow interaction patterns.
    disagreements:
    - 'Evaluation metric design: some benchmarks use Pass@1 with deterministic rules
      (MacAgentBench), others use cost-accuracy trade-offs (LivingScreen), and yet
      others use uncertainty calibration (Argus), reflecting different priorities
      for agent success.'
    - 'Interaction modality coverage: while most benchmarks include click-based interactions,
      DragOn argues for dedicated drag-based tasks, and LivingScreen focuses on dynamic
      video interfaces, leaving unclear whether a single benchmark can cover all modalities.'
    - 'Supervision source for training data: methods like GUICrafter rely on weak
      supervision from unannotated screenshots, SCALECUA uses synthetic task generation,
      and VISUALSKILL employs authored documentation plus live UI exploration, indicating
      no consensus on the best way to acquire training signals.'
    - 'Deployment environment: real desktop (MacAgent) versus simulated browser (LivingScreen)
      versus Docker-based environments (SCALECUA) affect the realism and reproducibility
      of results, and the field lacks a standard for environment fidelity.'
    open_questions:
    - How can we design benchmarks that systematically cover dynamic interfaces where
      content changes between actions, and evaluate agents' observation control capabilities?
    - To what extent do fine-grained metrics (e.g., cost-accuracy, UQ) transfer across
      different model families and deployment settings, and what calibration is needed
      for reliable cross-model comparison?
    - What is the minimal annotation budget required to train a competitive GUI agent,
      and can synthetic or weakly-supervised data fully replace human-annotated trajectories?
    - How can we ensure that advances in benchmark scores (e.g., on OSWorld or ScienceBoard)
      translate to measurable improvements in real-world desktop automation, given
      the gap between curated tasks and open-ended user workflows?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计
      解决的问题: 构建共享任务和环境，使 GUI 代理能够在多样化应用、交互模态（点击、拖拽、命令行、动态视频）和平台之间进行系统比较。
      尚未覆盖: 基准任务分布是否充分覆盖了代理预期操作的动作空间和动态条件（例如长时程工作流、观察控制和拖拽操作）仍然未知。
    - 路线: 指标与压力测试设计
      解决的问题: 通过细粒度评分（多检查点、成本-准确性）和不确定性量化，超越总体通过率来探测代理能力，揭示隐藏的失败模式（如过度观察或观察不足）。
      尚未覆盖: 这些代理指标与用户真正关心的下游决策质量之间的一致性，以及指标排名在不同模型层级和部署接口之间是否保持稳定。
    - 路线: 可比基线与训练效率方法
      解决的问题: 提供可复现的基线和方法（弱监督、在线强化学习、技能库），在现有基准上提升代理性能，实现公平比较。
      尚未覆盖: 合成或弱监督训练得出的结论能否推广到真实世界的多样性，基准分数提升能否转化为稳健的真实部署，而不会过拟合到合成任务分布。
    共识:
    - GUI 代理必须处理广泛的交互模态（点击、拖拽、命令行、动态内容），且主要基于视觉语言模型构建。
    - 仅靠总体任务成功不足以进行诊断；细粒度评估指标（如子目标完成度、观察成本、不确定性估计）对于暴露能力差距是必要的。
    - 当前最先进的代理在动态或观察密集的界面上仍然存在困难，表明需要更好的观察控制和动作定位能力。
    - 任务和数据的多样性（真实桌面、短视频、拖拽操作）对于防止过拟合到狭窄的交互模式至关重要。
    分歧:
    - 评估指标设计：一些基准使用确定性规则下的 Pass@1（如 MacAgentBench），另一些使用成本-准确性权衡（如 LivingScreen），还有的采用不确定性校准（如
      Argus），反映了对代理成功标准的不同侧重。
    - 交互模态覆盖：多数基准包含点击交互，但 DragOn 强调需要专门的拖拽任务，LivingScreen 聚焦于动态视频界面，这留下了一个悬而未决的问题：单个基准能否覆盖所有模态。
    - 训练数据的监督来源：像 GUICrafter 依赖未标注截图的弱监督，SCALECUA 使用合成任务生成，VISUALSKILL 采用编写文档加实时 UI
      探索，表明在获取训练信号的最佳方式上尚未达成共识。
    - 部署环境：真实桌面（MacAgent）与模拟浏览器（LivingScreen）与基于 Docker 的环境（SCALECUA）影响结果的实际性和可复现性，领域缺乏环境保真度的标准。
    开放问题:
    - 如何设计系统性地覆盖动态界面的基准，其中内容在动作之间变化，并评估代理的观察控制能力？
    - 细粒度指标（如成本-准确性、不确定性量化）在不同模型家族和部署场景中的迁移程度如何，需要进行何种校准才能实现可靠的跨模型比较？
    - 训练一个具有竞争力的 GUI 代理所需的最低标注预算是多少，合成或弱监督数据能否完全替代人工标注的轨迹？
    - 如何确保在 OSWorld 或 ScienceBoard 等基准上的分数提升，能够转化为真实桌面自动化中可衡量的改进，考虑到精心策划的任务与开放式用户工作流之间的差距？
