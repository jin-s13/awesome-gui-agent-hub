  related_work_outline:
  - 'Mainstream direction: Building comprehensive GUI agent benchmarks covering diverse
    real-world interfaces (desktop, dynamic short-video, drag) with fine-grained metrics
    and uncertainty quantification.'
  - 'Shared research pattern: Evaluating vision-language models on screen-based tasks
    using detailed outcome metrics; sharing code and datasets to support reproducibility.'
  - 'Key differences: Task coverage (static vs. dynamic, GUI-only vs. CLI+GUI), evaluation
    granularity (Pass@1 vs. multi-checkpoint vs. cost-accuracy), and integration of
    uncertainty quantification.'
  - 'Trend evolution: Moving from static mobile/web benchmarks to dynamic, real-world
    desktop and multimodal interaction benchmarks; growing focus on observation control
    and reliability metrics.'
  - 'Open questions: Cross-benchmark generalization, robustness of uncertainty quantification
    across model tiers, and alignment of proxy metrics with real user satisfaction
    and decision quality.'
  related_work_outline_zh:
  - 主流方向：构建覆盖桌面、动态短视频、拖拽等多样化真实界面的GUI代理综合基准，强调细粒度指标和不确定性量化。
  - 研究共性：使用视觉语言模型作为代理，在基于屏幕的任务上评估，采用详细结果指标；共享代码和数据集以促进可复现性。
  - 关键差异：任务覆盖（静态 vs 动态，纯GUI vs CLI+GUI），评估粒度（Pass@1 vs 多检查点 vs 成本-准确性），以及是否整合不确定性量化。
  - 趋势演进：从静态移动/网页基准转向动态、真实桌面和多模态交互基准；越来越关注观察控制和可靠性指标。
  - 开放问题：跨基准泛化，不确定性量化在不同模型层级间的鲁棒性，基准指标与真实用户满意度和决策质量的一致性。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design
      what_it_solves: Creating shared tasks and datasets that make GUI agent capabilities
        comparable across diverse interfaces such as desktop, dynamic video, and drag-based
        interactions.
      what_remains_open: Whether the task distribution covers the full range of real-world
        settings, including complex multi-app workflows, accessibility constraints,
        and observation control in dynamic environments.
    - line: Metric and stress-test design
      what_it_solves: Probing agent reliability beyond aggregate success rates, through
        fine-grained checkpoints, cost-accuracy trade-offs, and post-hoc uncertainty
        quantification for GUI grounding.
      what_remains_open: Alignment between proxy metrics and the downstream decisions
        users actually care about; robustness of uncertainty quantification under
        distribution shift and across model interfaces.
    - line: Comparable baselines and reporting
      what_it_solves: Making results auditable via common baselines, code artifacts,
        and structured reporting conventions, as seen in skill-library, weakly-supervised,
        and RL-based agent evaluations.
      what_remains_open: Whether benchmark conclusions remain stable across implementations,
        compute budgets, and model versions; generalization of reported gains to other
        benchmarks.
    consensus:
    - GUI agent evaluation relies heavily on vision-language models operating on screenshots,
      and benchmarks are moving toward more realistic, multi-application environments.
    - Fine-grained metrics beyond binary success are necessary to capture subtle capability
      differences, such as sub-goal completion and information efficiency.
    - Open-sourcing code and datasets is a common practice to support reproducibility
      and comparative analysis.
    - There is a shared recognition that current agents lack reliable observation
      control and uncertainty awareness, limiting their trustworthiness in dynamic
      settings.
    disagreements:
    - 'Evaluation granularity: some benchmarks use Pass@1 or simple task completion,
      while others adopt multi-checkpoint scoring, cost-accuracy metrics, or uncertainty
      quantification.'
    - 'Interface coverage: desktop environments with CLI+GUI coexist with smartphone-like
      short-video platforms and single-interface drag tasks, causing incomparable
      settings.'
    - 'Interaction modes: click-based, drag-based, and multimodal skill retrieval
      are explored separately, without a unified evaluation framework.'
    - 'Uncertainty quantification: approaches range from hidden-state density methods
      to conformal prediction, and their transferability across model tiers and interfaces
      is poor.'
    - 'Deployment fidelity: some benchmarks use real operating systems or browser-based
      simulators, while others rely on synthetic task generation, affecting ecological
      validity.'
    open_questions:
    - How well do benchmark tasks represent the long-tail of real-world GUI workflows,
      especially those involving multi-step, inter-application coordination?
    - Can uncertainty quantification methods designed for single-step grounding generalize
      to multi-step agent trajectories in deployment?
    - To what extent do gains from skill libraries or weak supervision transfer across
      different benchmarks and interface paradigms?
    - Are current metrics aligned with end-user satisfaction and task completion efficiency,
      or do they over-optimize for superficial success?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计
      解决的问题: 构建共享任务和数据集，使GUI代理在桌面、动态视频、拖拽等多样化界面上的能力具有可比性。
      尚未覆盖: 任务分布是否覆盖真实世界的全部场景，包括复杂多应用工作流、无障碍约束以及动态环境中的观察控制。
    - 路线: 指标与压力测试设计
      解决的问题: 通过细粒度检查点、成本-准确性权衡和GUI基础的后验不确定性量化，在总成功率之外检验代理的可靠性。
      尚未覆盖: 这些代理指标与用户真正关心的下游决策是否一致；不确定性量化在分布偏移和跨模型接口下的鲁棒性。
    - 路线: 可比基线与报告规范
      解决的问题: 通过统一基线、代码工件和结构化报告惯例（如技能库、弱监督和基于RL的代理评估）使结果可审计。
      尚未覆盖: 基准结论在不同实现、算力预算和模型版本下是否稳定；所报告的增益是否泛化到其他基准。
    共识:
    - GUI代理评估高度依赖基于截图的视觉语言模型，基准正朝着更真实、多应用环境的方向发展。
    - 需要超越二元成功率的细粒度指标来捕捉微妙的性能差异，例如子目标完成度和信息效率。
    - 开源代码和数据集是支持可复现性和比较分析的常见做法。
    - 研究者普遍认识到当前代理缺乏可靠的观察控制和不确定性意识，限制了它们在动态环境中的可信度。
    分歧:
    - 评估粒度：一些基准采用Pass@1或简单任务完成，而另一些采用多检查点评分、成本-准确性指标或不确定性量化。
    - 界面覆盖：桌面环境包含CLI和GUI，与类似智能手机的短视频平台和单一界面的拖拽任务并存，导致设置不可比。
    - 交互模式：点击、拖拽和多模态技能检索被分别探索，缺乏统一的评估框架。
    - 不确定性量化：方法从隐藏状态密度方法到共形预测各不相同，且在不同模型层级和接口间的可迁移性较差。
    - 部署逼真度：一些基准使用真实操作系统或基于浏览器的模拟器，而另一些依赖合成任务生成，影响生态效度。
    开放问题:
    - 基准任务在多大程度上代表真实世界GUI工作流的长尾，特别是那些涉及多步骤、跨应用协调的工作流？
    - 为单步基础设计的不确定性量化方法能否推广到部署中的多步代理轨迹？
    - 技能库或弱监督带来的增益在多大程度上能迁移到不同的基准和界面范式？
    - 当前指标是否与最终用户满意度和任务完成效率对齐，还是过度优化于表面成功？
