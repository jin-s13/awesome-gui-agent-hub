  related_work_outline:
  - 'Mainstream direction: The dominant research activity focuses on building richer
    benchmarks and training methods for GUI agents, rather than on formal theory.
    Benchmarks are expanding to dynamic interfaces, drag interactions, and long-horizon
    tasks, while training methods emphasize online RL, weak supervision, and skill
    libraries.'
  - 'Shared research pattern: Most works introduce a new dataset or benchmark and
    evaluate multiple vision-language models. They reveal that multimodal input (screenshots
    + text) is crucial, and standard Pass@1 metrics often mask fine-grained capability
    differences. Performance gains are achieved by injecting external knowledge (skills)
    or learning from unlabeled data.'
  - 'Key differences: Evaluation targets differ significantly—static desktop, dynamic
    short-video feeds, drag-based widgets, and single-step grounding vs. multi-step
    trajectories. Improvement strategies diverge: skill-based augmentation, online
    RL with verifiable task synthesis, weak supervision from unannotated screenshots,
    and proactive context management.'
  - 'Trend evolution: From 2024–2026, the field moves from simple click-based interactions
    toward dynamic, continuous interfaces and drag operations. There is a shift from
    pure supervised fine-tuning to online RL and weak supervision, and from coarse
    success rates to fine-grained, multi-dimensional evaluation including uncertainty
    quantification.'
  - 'Open questions: How to integrate uncertainty estimates into agent decisions for
    safety; how to formally characterize observation control in dynamic interfaces;
    how to guarantee safety and stability during online RL training; how to automatically
    build and transfer skill libraries across applications; and how to ensure cross-platform
    robustness of evaluation.'
  related_work_outline_zh:
  - 主流方向：研究活动集中在构建更丰富的基准和训练方法，而非形式化理论。基准正在扩展到动态界面、拖拽交互和长时域任务，训练方法强调在线强化学习、弱监督和技能库。
  - 研究共性：多数工作引入新数据集或基准，并评估多个视觉语言模型。它们揭示多模态输入（截图+文本）至关重要，且标准Pass@1指标常掩盖细粒度能力差异。性能提升通过注入外部知识（技能）或从无标注数据学习实现。
  - 关键差异：评估目标显著不同——静态桌面、动态短视频信息流、基于拖拽的控件，以及单步基础与多步轨迹。改进策略分化：基于技能的增强、可验证任务合成的在线强化学习、无标注截图的弱监督，以及主动上下文管理。
  - 趋势演进：2024–2026年，领域从简单点击交互转向动态、连续界面和拖拽操作。从纯监督微调转向在线强化学习和弱监督，从粗粒度成功率转向包含不确定性量化的细粒度、多维评估。
  - 开放问题：如何将不确定性估计集成到代理决策中以保障安全；如何形式化描述动态界面中的观察控制；如何保证在线强化学习训练的安全与稳定性；如何自动构建并在应用间迁移技能库；以及如何确保评估的跨平台鲁棒性。
