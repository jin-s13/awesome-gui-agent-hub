  literature_review:
    line_of_work_matrix:
    - line: Real-world desktop and cross-application GUI task benchmarking
      what_it_solves: Measures multimodal agent performance on multi-application desktop
        tasks that mix GUI and CLI, using fine-grained sub-goal scoring rather than
        only final success.
      what_remains_open: Evidence is limited to one OS and selected apps; no limitation
        statement is visible, and transfer to other desktop environments remains unverified.
    - line: Multimodal skill, history-grounded critique, and replay for computer-use
        agents
      what_it_solves: Improves grounding and efficiency by retaining visual skill
        artifacts, summarizing macro-action history, verifying coordinates against
        screenshots, and compiling successful runs into replayable state-machines.
      what_remains_open: Generalization beyond evaluated apps and tasks is not established;
        several methods lack visible code or artifacts, and robustness to unseen layouts
        or screen mismatch remains open.
    - line: Dynamic, interaction-specific, and video-guided GUI task evaluation
      what_it_solves: Covers dynamic short-video interfaces, drag-based interactions,
        and video-guided operations, and formulates metrics for accuracy plus information
        cost or sub-task coverage.
      what_remains_open: Scope is limited to short-video platforms, drag interaction
        types, or selected video tasks; no model reaches human-level cost-accuracy,
        and cross-domain transfer is unproven.
    - line: Safety-oriented web task evaluation under sanitized evidence
      what_it_solves: Tests web agents on SMS-to-webpage fraud judgment while suppressing
        URL, domain, and reputation shortcuts, exposing weak evidence use and benign
        recall loss.
      what_remains_open: The sanitized setting may not reflect real fraud detection
        where reputation cues exist; dataset size, scenario coverage, and real-world
        deployment generalizability are limited.
    consensus:
    - Current evaluations converge on multimodal frontier models as GUI agents, using
      real or simulated interface tasks with fine-grained success and diagnosis metrics.
    - 'Visual grounding and historical context improve execution: retaining visual
      artifacts, visually checking coordinates, or extracting task-relevant keyframes
      reduces short-sighted errors.'
    - Repeated interactions and specialized actions are treated as first-class problems,
      from drag operations to replay of prior successful runs.
    - Benchmarks increasingly report sub-goal, cost-accuracy, or recall trade-offs
      instead of only final task completion.
    disagreements:
    - 'Representation choices differ: visual skill artifacts, macro-action history
      with coordinate critique, state-machine programs, and task-driven keyframe extraction
      encode different execution knowledge.'
    - 'Supervision and evaluation targets differ: final Pass@1, sub-goal completion,
      accuracy-cost trade-off, drag coverage, and benign recall receive different
      emphasis.'
    - 'Interaction mode differs: GUI plus CLI, dynamic content that changes between
      actions, drag-only actions, video-guided actions, and sanitized web navigation.'
    - 'Deployment setting differs: desktop applications, short-video platforms, mobile/web-style
      interactive tasks, and SMS-to-webpage fraud chains impose different constraints.'
    open_questions:
    - How do visual grounding, skill libraries, critics, and replay mechanisms transfer
      across operating systems, applications, languages, and unseen interface layouts?
    - Does improved benchmark performance on curated tasks predict real-world agent
