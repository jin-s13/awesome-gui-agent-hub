  literature_review:
    line_of_work_matrix:
    - line: Taxonomy and roadmap synthesis from primary evidence
      what_it_solves: Organizes GUI-agent progress into directions, milestones, and
        gaps from method and benchmark papers rather than from dedicated surveys.
      what_remains_open: Systematic inclusion criteria and survey methodology are
