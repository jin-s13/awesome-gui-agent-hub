    研究路线矩阵:
    - 路线: 基准测试与任务抽象
      解决的问题: 形式化更广的GUI代理评测空间：多应用桌面GUI+CLI任务、拖拽交互和动态屏幕观察控制。
      尚未覆盖: 各基准领域受限，跨界面迁移、局限性记录和指标泛化尚未验证。
    - 路线: 基于技能或执行框架的冻结模型增强
      解决的问题: 在不更新骨干权重的情况下，通过多模态技能检索或基于重复运行的执行框架代码修改来提升执行能力。
      尚未覆盖: 所报告的基准特定提升缺乏可见的局限性分析，也缺少跨代理设置的安全与鲁棒边界。
    - 路线: 可扩展监督与可验证训练
      解决的问题: 通过未标注截图、可验证Docker任务合成和在线RL减少人工标注依赖或提升样本效率。
      尚未覆盖: 超出所选基准的泛化、失败模式以及成本/训练假设尚未建立。
    - 路线: 不确定性量化与可靠性框架
      解决的问题: 评估GUI定位的后验UQ排序迁移，并研究共形空间点击区域以更安全地使用不确定性。
      尚未覆盖: 仅覆盖单步定位；多步轨迹和分布偏移鲁棒性尚未涉及。
    共识:
    - 可执行环境中的规则性或细粒度评分正成为中心，因为只看最终成功率会忽略子目标和成本差异。
    - 冻结模型可以通过外部技能、执行框架或上下文增强，而不只依赖权重更新。
    - 当前GUI代理在观察控制、拖拽操作和不确定性校准方面存在明显能力缺口。
    - 弱监督和可验证合成任务在降低标注依赖或扩展RL数据方面显示出前景。
    分歧:
    - 评测目标不同：有的衡量整体任务完成，有的看子目标检查点与能力注释，有的看成本-准确性或信息效率，有的看不确定性排序和空间覆盖。
    - 交互模式不同：静态点按、拖拽操作、动态内容变化界面，以及GUI+CLI多界面工作流。
    - 表示方式不同：多模态技能工件保留视觉图形；一些训练方法使用未标注截图；另一些依赖多次运行的前后截图。
    - 监督/更新路径不同：通过技能或执行框架不改权重、弱监督课程加RL、可验证在线RL，或纯后验UQ加共形校准。
    - 可靠性范围不同：UQ证据只覆盖单步GUI定位，其他证据覆盖多步任务执行但不量化不确定性。
    开放问题:
    - 在某一基准族上的增益，是否能在不同操作系统、界面类型或动态环境中无需重新调整技能或执行框架即可迁移？
    - 后验UQ排序能否在没有目标特定重排的情况下，跨模型层级、接口和分布偏移保持可靠？
    - 可验证任务合成和自动执行框架编辑在优化冻结模型时，需要哪些安全与边界条件？
    - 在动态平台上发现的观察控制不足，是否会泛化到桌面、拖拽或多应用工作流？
