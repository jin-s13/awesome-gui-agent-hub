  literature_review:
    line_of_work_matrix:
    - line: Realistic desktop and web benchmarking
      what_it_solves: Measures end-to-end GUI agent performance in multi-application
        and mixed GUI/CLI workflows using rule-based or cost-aware metrics.
      what_remains_open: Cross-OS and cross-domain coverage; whether benchmark success
        aligns with professional workflow utility; several benchmarks lack stated
        limitations.
    - line: Reusable multimodal skills and execution memory
      what_it_solves: Improves accuracy and speed on repeated computer tasks by storing
        visual or textual skills, or compiled state-machine programs, reducing per-step
        inference.
      what_remains_open: Transfer to unseen applications; robustness to UI changes;
        verification against stale or faulty stored programs.
    - line: Unified multimodal agent training and action spaces
      what_it_solves: Trains end-to-end GUI agents that unify visual grounding, navigation,
        code execution, or diffusion decoding across mobile, desktop, and web platforms.
      what_remains_open: Cross-platform generalization and inference cost; whether
        a unified action space consistently beats prompt-level tool combination.
    - line: Grounding for dynamic and non-click interactions
      what_it_solves: Addresses drag-based manipulation, living-screen dynamic content,
        and short-video platforms where screen state changes between actions.
      what_remains_open: Observation control and cost-accuracy trade-offs; restricted
        platform coverage; generalization to other dynamic interfaces.
    - line: Video-guided GUI task perception
