  - 趋势演进：2024至2026年，领域从少样本智能体演示转向可扩展RL训练栈、模块化可复用组件，以及针对状态验证、安全性等特定失败模式的细粒度诊断基准。
  - 开放问题：错误恢复能力在RL训练后仍薄弱；安全性为领域条件，跨界面不迁移；离线基准无法捕捉实时动态；跨应用构建与维护技能库或记忆组件的成本与可行性未知。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end online RL training frameworks for GUI agents
      what_it_solves: Enable agents to improve through live interaction and multi-turn
        policy optimization, moving beyond static model inference.
      what_remains_open: Error recovery remains weak after RL training; harness design
        heavily influences trainability; generalizability across diverse environments
        is not yet shown.
    - line: Data-efficient visual grounding via weak supervision and curriculum learning
      what_it_solves: Reduce reliance on expensive human-annotated demonstrations
        by leveraging unlabeled screenshots and webpages to learn UI element grounding.
      what_remains_open: Scaling to complex multi-step tasks and combining with interactive
        online learning is unexplored; verification on open-ended real-world tasks
        is missing.
    - line: Reusable agent skill and memory components
      what_it_solves: Provide plug-and-play multimodal skill libraries or action-grounded
        memory to improve task success rates and reduce state-level failures.
      what_remains_open: Cross-application transfer and maintenance cost of skill
        artifacts are not addressed; memory components were tested on limited benchmarks,
        and their effect on dynamic environments is unknown.
    - line: Diagnostic and safety benchmarks for GUI interaction understanding
      what_it_solves: Evaluate fine-grained abilities such as GUI transition prediction,
        state verification, and resistance to prompt injection beyond end-task success.
      what_remains_open: Offline benchmarks do not capture asynchronous timing, real-time
        dynamics, or live context; domain-conditioned safety means hardening does
        not generalize to coding agents or other interfaces.
    consensus:
    - Visual grounding and interaction with real or simulated environments are essential
      for GUI agents; purely text-based or static approaches underperform.
    - Online interaction and multi-turn optimization (e.g., RL) are critical for improving
      agent robustness and closing the gap to proprietary systems.
    - Open-source frameworks, reproducible artifacts, and public benchmarks are necessary
      to accelerate progress and enable independent verification.
    - Safety and privacy are non-negligible concerns for deployed computer-use agents,
      requiring explicit evaluation and mitigation strategies.
    disagreements:
    - 'Training signal: weak supervision from unlabeled static data vs. interactive
      RL from live environment feedback.'
    - 'Evaluation depth: step-level diagnostic accuracy (e.g., temporal ordering,
      action inference) vs. end-to-end task success rate.'
    - 'System architecture: modular skill-library retrieval vs. end-to-end policy
      training without explicit skill decomposition.'
    - 'Interaction mode: harness-based orchestration with containerized rollouts vs.
      direct browser manipulation without intermediate harnesses.'
    open_questions:
    - Why does error recovery remain weak even after multi-turn RL training, and what
      architectural changes can improve it?
    - How can safety hardening be made domain-agnostic so that browser-trained agents
      are not vulnerable to injection attacks in coding or other interfaces?
    - What is the gap between offline diagnostic metrics and online interactive performance,
      and how can benchmarks be designed to better predict real-world behavior?
    - What is the cost and feasibility of building and maintaining application-specific
      skill libraries or memory systems across diverse, evolving software ecosystems?
