  literature_review:
    line_of_work_matrix:
    - line: Real-world desktop/mobile/web GUI agent benchmarks, e.g., MacAgentBench,
        DragOn, LivingScreen
      what_it_solves: Defines tasks, environments, and scoring for computer-use agents
        across applications and interaction types, revealing model strengths and failure
        modes.
      what_remains_open: 'Coverage is fragmented: desktop CLI/GUI, drag interactions,
        and short-video dynamics are tested separately; cross-platform transfer and
        missing limitation evidence remain unresolved.'
    - line: Multimodal skill and reusable behavior libraries, e.g., VISUALSKILL, PreAct
      what_it_solves: Encodes application-specific procedures or compiled successful
        runs so agents can retrieve visual/text skills or replay repeated tasks faster.
      what_remains_open: Artifacts depend on stable UI flows; maintenance, transfer
        across app/task variants, and full reproducibility of skill or program construction
        are not fully demonstrated.
    - line: Dynamic and video-guided GUI tasks, e.g., LivingScreen, VG-GUIBench with
        TASKER
      what_it_solves: Covers interfaces that change between actions and video-guided
        interactive tasks, using cost-accuracy scoring or task-driven keyframe extraction.
      what_remains_open: Observation control remains weak; evaluation is limited to
        short-video or video-QA-style settings, and generalization to other dynamic
        media is not shown.
    - line: Scalable web environment and trajectory generation, e.g., WebAnything
      what_it_solves: Reconstructs source-grounded web applications and interaction
        trajectories from real URLs for training and benchmarking web agents.
      what_remains_open: Requires per-site setup and authorization; evidence focuses
        on web fidelity and fine-tuning gains, with limited cross-domain operational
        or safety outcomes.
    - line: GUI-oriented vision-language model architectures and fine-tuning, e.g.,
        LLaDA-UI, DragOn fine-tuning
      what_it_solves: Improves grounding and navigation across mobile/desktop/web
        by block-wise diffusion generation or interaction-specific training data.
      what_remains_open: Comparisons are mostly against Qwen-class baselines; cross-platform
        deployment and drag-specific improvements are not fully established, and replication
        artifacts are unclear for some methods.
    consensus:
    - Current agents still fall short of reliable human-level performance on many
      real application tasks.
    - Evaluation should go beyond final task success to sub-goal completion, cost-accuracy,
      or interaction-specific grounding because similar success rates can hide different
      capabilities.
    - Screen observation, dynamic interface changes, and interaction variety are central
      obstacles for GUI agents.
    - Reusable artifacts or training trajectories such as skills, state-machine programs,
      and web environments can improve downstream capability or efficiency.
    - Evidence treats multimodal LLM/VLM agents as the base system and adds application-specific
      data or procedures rather than replacing the general model.
    disagreements:
    - 'Evaluation target differs: deterministic desktop task success versus cost-accuracy
      on dynamic screens versus drag grounding versus video-guided interactive success.'
    - 'Representation differs: hierarchical multimodal skill files versus compiled
      state-machine programs versus fine-tuned model weights versus automatically
      reconstructed web environments.'
    - 'Interaction mode differs: some work focuses on click and text entry, while
      others target drag, dynamic short-video browsing, or combined GUI+CLI desktop
      workflows.'
    - 'Deployment setting differs: a real macOS benchmark, browser-based simulations,
      and per-site authorized web reconstructions imply different fidelity and control
      assumptions.'
    open_questions:
