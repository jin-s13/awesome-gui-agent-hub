  related_work_outline_zh:
  - 主流方向：构建端到端多模态GUI/计算机使用智能体，统一GUI操作与代码执行动作空间，并通过监督微调后接在线强化学习进行训练。
  - 研究共性：将视觉语言模型落地到计算机使用任务，在GUI/计算机使用基准上评估，并引入技能、候选评分或harness原生训练等结构来提升成功率或效率。
