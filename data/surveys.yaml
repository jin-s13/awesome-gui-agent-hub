    研究路线矩阵:
    - 路线: 分类体系与路线图综合
      解决的问题: 把碎片化的GUI智能体方向整理为研究缺口和优先路径。
      尚未覆盖: 综合是否由系统证据支撑，而非选择性的方法或基准示例。
    - 路线: 对比评测与基准设计
      解决的问题: 为网页、移动和视频引导GUI智能体建立受控任务和可比较的量化指标。
      尚未覆盖: 跨设置结果兼容性、多步轨迹覆盖，以及目标特定的重新校准。
    - 路线: 可验证任务合成与强化学习
      解决的问题: 通过可验证任务和在线强化学习扩展训练信号与rollout效率。
      尚未覆盖: 基准到真实部署的偏差，以及对验证器或奖励校准的依赖。
    - 路线: GUI grounding与不确定性估计
      解决的问题: 量化GUI grounding可靠性，并构建共形点击区域等空间安全机制。
      尚未覆盖: 跨模型层级与接口的迁移，以及分布偏移下的校准。
    - 路线: 长时程上下文与记忆管理
      解决的问题: 在保持关键事实的同时压缩动作历史和界面状态。
      尚未覆盖: 分布外泛化和可见局限信息的缺失。
    - 路线: 安全与可重复性审计
      解决的问题: 在受控协议下评估提示注入、欺诈判断和已发布结果的复现性。
      尚未覆盖: 优化攻击、真实世界线索可用性，以及超出已测家族的攻击面。
    - 路线: 人类演示到教程或规划迁移
      解决的问题: 从人类屏幕录制中提取结构化程序知识以改善规划和泛化。
      尚未覆盖: 领域多样性、可扩展性和量化局限证据。
    共识:
    - 进展大多以基准-方法配对贡献呈现，并使用定量成功率、排序或安全指标。
    - 自主或可验证评估信号被广泛采用，但通常被视为有噪声，需要校正或领域特定再验证。
    - 泛化声明依赖分布外设置上的迁移，但证据显示迁移是选择性的，而非统一的。
    分歧:
    - 评测目标不同：单步grounding和视频引导任务，与多步桌面、移动、欺诈检测和安全红队轮次不同。
    - 监督信号不同：可验证任务完成、带噪声的自主奖励、监督轨迹或人类演示。
    - 表示与控制选择不同：关键帧提取、结构化上下文动作、不确定性分数族和教程图。
    - 部署场景不同：开源与闭源模型，以及浏览器、编程、移动和桌面界面。
    开放问题:
    - 哪些基准间结果足够兼容以支持聚合综合，哪些需要目标特定校准或重新排序？
    - 在证据包中未见显式综述文本的情况下，可得出哪些系统分类或路线图结论？
    - 合成或可验证任务与自主奖励信号如何从基准类计算机使用设置迁移到真实GUI工作流？
    - 哪些上下文、不确定性和安全机制能在分布偏移及已测任务族之外保持稳健？
    - 缺失的局限、代码、数据集和指标细节中，哪些会实质影响可重复性，应记录为验证缺口？
