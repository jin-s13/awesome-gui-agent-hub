    - 训练信号不同：可验证在线强化、噪声评估奖励、带上下文动作的监督微调、关键帧或演示变换。
    - 安全范围不同：浏览器领域手工提示攻击与编码技能注入的结论有条件；是否测试优化攻击字符串不同；信誉线索抑制也可能改变结论。
