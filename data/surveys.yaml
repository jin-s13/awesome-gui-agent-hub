      results?
    - Which evaluation signal beyond Pass@1—sub-goal completion, cost-accuracy, benign
      recall—is most predictive of real desktop, mobile, and professional workflow
      reliability?
    - How robust are current specialized benchmarks to unseen apps, languages, adversarial
