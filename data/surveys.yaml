  related_work_outline_zh:
  - 主流方向：围绕真实GUI应用开展基准测试与智能体改进，重点覆盖桌面系统、移动/网页和动态媒体界面，并衡量任务完成、界面定位和执行效率。
  - 研究共性：各路线都围绕具体应用构建任务套件或工件，评测多模态模型或框架，并报告准确率、观察行为或重用效率方面的缺口。
  - 关键差异：评测环境分为静态离散屏幕与动态变化屏幕；方法分为外部技能/记忆工件、训练或模型架构改进、输入关键帧压缩。
