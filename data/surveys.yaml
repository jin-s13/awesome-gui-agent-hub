    - 路线: 长时域上下文与经验蒸馏
      解决的问题: 从轨迹和人类演示中提取关键帧、结构化上下文字段或多模态教程，提高GUI智能体规划能力。
      尚未覆盖: 跨域和长时域验证有限；代码或局限缺失及基准广度不足使泛化性存疑。
    共识:
    - 视觉语言模型是当前GUI与计算机使用智能体的共同骨干。
    - 受控基准和任务集是揭示智能体脆弱性的主要方法。
