  related_work_outline:
  - 'Mainstream direction: The current frontier centers on system-level evaluation
    and improvement of GUI/computer-use agents: broader real-world task suites spanning
    macOS desktop, dynamic short-video interfaces, drag interactions, plus training
    and harness methods for grounding, data-efficient adaptation, and verifiable reinforcement
    learning.'
  - 'Shared research pattern: Papers treat GUI agents as model-plus-environment or
    model-plus-harness systems, use rule-based or executable metrics, and identify
    action grounding, observation control, and interaction-type coverage as core bottlenecks.'
  - 'Key differences: Some works keep backbone models frozen and optimize the execution
    harness or observation inputs; others train with weak supervision or online RL.
    Evaluation targets differ across static desktop tasks, dynamic living screens,
    drag-only interactions, video-guided tasks, and single-step grounding uncertainty.'
  - 'Trend evolution: Available evidence is concentrated in 2026, so the visible trend
    is a current-frontier consolidation from click-only browser tasks toward real
    OS, dynamic interfaces, non-click actions, and self-improvement through harness
    evolution, RL, or weak supervision; earlier historical trajectory is not covered
    by this packet.'
  - 'Open questions: How much gain comes from the model versus harness, skill library,
    or observation policy; whether benchmark-specific gains transfer across platforms
    and interaction regimes; how to learn observation control; and how to verify data-efficient
    methods beyond reported suites.'
  related_work_outline_zh:
  - 主流方向：当前前沿集中在系统级评估与改进 GUI/计算机使用代理：扩展真实任务套件，覆盖 macOS 桌面、动态短视频界面、拖拽交互，并发展 grounding、数据高效适配与可验证强化学习或执行框架方法。
  - 研究共性：论文多将 GUI 代理视为“模型+环境/执行框架”系统，采用规则或可执行指标，并普遍把动作 grounding、观察控制和交互类型覆盖视为核心瓶颈。
  - 关键差异：方法干预层次不同：有的冻结模型优化执行框架或观察输入，有的通过弱监督或在线强化学习训练模型；评测目标从静态桌面、拖拽交互到动态界面、视频引导任务和单步
    grounding 不确定性。
  - 趋势演进：目前证据集中在 2026 年，可辨识的是当前前沿整合趋势：从点击式浏览器任务走向真实 OS、动态界面、非点击交互和自改进；更早历史趋势未见证据。
  - 开放问题：收益多少来自模型而非执行框架/技能库或观察策略；评测增益能否跨平台和交互场景迁移；如何学习观察控制；数据高效方法能否在已报告套件之外验证。
  literature_review:
    line_of_work_matrix:
    - line: Benchmarking GUI-agent competence across operating systems, dynamic interfaces,
        and interaction types
      what_it_solves: 'Evaluates action grounding and task completion beyond click-only
        web tasks: macOS desktop tasks, dynamic short-video screens, drag interactions,
        and uncertainty in single-step grounding.'
      what_remains_open: Each benchmark covers a limited interface or platform; observed
        capabilities and ranking transfer may not generalize across OS, interface
        dynamics, interaction type, or model tier without re-evaluation.
    - line: Training and data-efficiency methods for GUI grounding and computer-use
        policy learning
      what_it_solves: Reduces dependence on expensive action annotations and static
        instruction data through weak supervision from unannotated screenshots, verifiable
        task synthesis, and online reinforcement learning.
      what_remains_open: Limitation reporting is sparse across several papers; generalization
        outside the reported suites, data contamination, and the separation of representation
        learning from RL or task-generation effects remain unverified.
    - line: Execution-harness optimization and observation-control methods
      what_it_solves: Improves frozen agents by optimizing the executable harness,
        diagnosing failures from before-and-after screenshots, and addressing over-
        and under-observation in changing interfaces.
      what_remains_open: Contribution attribution among harness, skill library, and
        observation policy is not fully isolated; frozen-harness transfer is shown
        on one secondary benchmark but not across broader dynamic-interface regimes.
    - line: Keyframe and observation selection for video-guided GUI and agentic tasks
      what_it_solves: Connects video understanding to GUI action by selecting task-relevant,
        scene-aware keyframes to improve both VideoQA and video-guided agentic benchmarks.
      what_remains_open: Evidence for GUI interactive task improvement is narrower
        than for VideoQA; applicability beyond the proposed frame selector and VG-GUIBench
        setting remains unproven.
    consensus:
    - GUI/computer-use agents are evaluated as system-level pipelines combining perception,
      grounding, action execution, and environment feedback, so evaluation must capture
      more than single-step UI grounding.
    - Current agents still fail at observation control and non-click or dynamic interactions,
      with observed failures such as over- and under-observation, weak drag execution,
      and unstable uncertainty transfer.
    - 'Self-improvement without fully supervised trajectories is gaining evidence:
      weak supervision, verifiable reinforcement learning, and harness evolution can
      improve frozen or lightly annotated agents on reported benchmarks.'
    - Rule-based or executable metrics are common, but fine-grained scoring reveals
      capability differences hidden by aggregate Pass@1 or accuracy.
    disagreements:
    - 'Evaluation targets and deployment settings differ widely: real macOS desktop
      tasks, dynamic short-video feeds, drag interactions, video-guided GUI tasks,
      and single-step grounding uncertainty are each emphasized differently.'
    - 'Intervention level differs: some methods train the model through weak supervision
      or online RL, some keep the backbone frozen and optimize the execution harness,
      and others improve keyframe input selection.'
    - 'Supervision and data assumptions differ: unannotated screenshot calibration,
      verifiable task synthesis for RL, and evidence-driven harness edits rely on
      different forms of available feedback and different amounts of annotation.'
    - 'Metrics emphasize different objectives: Pass@1 with multi-checkpoint completion,
      cost-accuracy, uncertainty ranking transfer with conformal radius, or VideoQA
      accuracy; this makes cross-benchmark comparison fragile.'
    open_questions:
    - How much of the reported improvement is attributable to the backbone model versus
      the harness, skill library, task-generation distribution, or observation input?
    - Do gains on OSWorld, ScienceBoard, WindowsAgentArena, and benchmark-specific
      suites transfer to dynamic living-screen, drag-based, or cross-platform interfaces?
    - How should agents learn or explicitly control observation frequency to avoid
      over- and under-observation in changing interfaces?
    - Can weak-supervision and verifiable RL approaches scale beyond reported suites
      without hidden annotation, contamination, or evaluation overfitting?
    - Given weak cross-model and cross-interface transfer of post-hoc uncertainty
      rankings, what uncertainty or calibration evidence is sufficient for deployment?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 跨操作系统、动态界面与交互类型的 GUI 代理能力评估
      解决的问题: 评测点击式网页任务以外的动作 grounding 与任务完成，覆盖 macOS 桌面、动态短视频屏幕、拖拽交互和单步 grounding
        不确定性。
      尚未覆盖: 各基准仅覆盖有限平台或界面；观察到的能力与排名迁移不能保证跨 OS、界面动态、交互类型或模型层级成立。
    - 路线: 面向 GUI grounding 与计算机使用策略的训练与数据高效方法
      解决的问题: 通过未标注截图弱监督、可验证任务合成和在线强化学习，减少对昂贵动作标注和静态指令数据的依赖。
      尚未覆盖: 多篇论文限制字段缺失或较简；已报告套件之外的泛化、数据污染、以及表示学习与 RL/任务生成贡献的隔离尚未验证。
    - 路线: 执行框架优化与观察控制方法
      解决的问题: 通过优化冻结模型周围的执行框架、基于操作前后截图诊断失败，并处理动态界面中的观察不足与过度观察，提升代理表现。
      尚未覆盖: 执行框架、技能库和观察策略的贡献归因尚未完全隔离；冻结框架迁移仅在单一次要基准上展示，未覆盖更广动态界面场景。
    - 路线: 视频引导 GUI 与代理任务的关键帧或观察选择
      解决的问题: 通过任务相关、场景感知的关键帧选择连接视频理解与 GUI 动作，提升 VideoQA 与视频引导代理任务表现。
      尚未覆盖: GUI 交互任务的证据窄于 VideoQA；该选择器与 VG-GUIBench 设定之外的适用性尚未证明。
    共识:
    - GUI/计算机使用代理应被视为感知、grounding、动作执行与环境反馈组成的系统，评估不能只看单步 UI grounding。
    - 当前代理在观察控制和非点击或动态交互上仍存在失败，如过度/不足观察、拖拽执行弱和不确定性迁移不稳定。
    - 无完全监督轨迹的自改进方法开始获得证据：弱监督、可验证强化学习和执行框架演化能在已报告基准上提升冻结或低标注代理。
    - 基于规则或可执行指标被广泛使用，但细粒度评分显示总 Pass@1 或准确率可能掩盖子能力差异。
    分歧:
    - 评测目标与部署场景差异大：真实 macOS 桌面、动态短视频、拖拽交互、视频引导 GUI 和单步 grounding 不确定性各有侧重。
    - 干预层次不同：有方法通过弱监督或在线 RL 训练模型，有方法冻结骨干并优化执行框架，还有方法改进关键帧输入选择。
    - 监督与数据假设不同：未标注截图校准、可验证任务合成强化学习、以及基于证据的 harness 编辑依赖不同的反馈可用性和标注量假设。
    - 指标强调不同目标：Pass@1 加多检查点完成、成本-准确率、UQ 排名迁移与共形半径或 VideoQA 准确率，导致跨基准比较脆弱。
    开放问题:
    - 已报告提升中多少来自骨干模型，多少来自执行框架、技能库、任务生成分布或观察输入？
    - OSWorld、ScienceBoard、WindowsAgentArena 与各基准任务上的增益能否迁移到动态屏幕、拖拽或跨平台界面？
    - 代理应如何学习或显式控制观察频率，以避免界面变化中的过度观察和观察不足？
    - 弱监督与可验证强化学习方法能否在已报告套件之外扩展，而不引入隐藏标注、污染或评测过拟合？
    - 鉴于后验不确定性排名跨模型和跨界面迁移弱，部署中需要哪些不确定性或校准证据？
