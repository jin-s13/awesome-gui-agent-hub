  related_work_outline:
  - 'Mainstream direction: Building VLM-based computer-use agents that execute GUI
    tasks, with a focus on scaling via reinforcement learning and benchmarking across
    diverse interactive environments.'
  - 'Shared research pattern: Proposing a new method or benchmark that improves agent
    performance on GUI tasks, then evaluating with success rate on an established
    or newly introduced benchmark.'
  - 'Key differences: Some works target safety and robustness (prompt injection, fraud
    detection), others focus on training efficiency (RL with synthetic/noisy rewards),
    while yet others address uncertainty quantification or tutorial generation.'
  - 'Trend evolution: The 2024–2026 frontier shows rapid progression from zero-shot
    evaluation to online RL fine-tuning, and from basic task success to analyses of
    safety, uncertainty, and domain-conditioned behavior.'
  - 'Open questions: How to achieve cross-domain safety, how to correct noisy reward
    signals without human verification, how to handle long-horizon memory, and how
    to make uncertainty calibration transferable across model tiers.'
  related_work_outline_zh:
  - 主流方向：构建基于视觉语言模型的计算机使用智能体来执行图形界面任务，重点通过强化学习进行规模化训练，并在多样化的交互环境中进行基准评测。
  - 研究共性：提出新方法或新基准以提升智能体在图形界面任务上的表现，并在现有或新构建的基准上以成功率来评估效果。
  - 关键差异：部分工作关注安全与鲁棒性（提示注入、欺诈检测），部分关注训练效率（合成/噪声奖励的强化学习），另有工作聚焦不确定性量化或教程生成。
  - 趋势演进：2024–2026年的前沿进展显示，从零样本评估快速转向在线强化学习微调，并从基本任务成功拓展到对安全性、不确定性及领域条件行为的分析。
  - 开放问题：如何实现跨领域安全，如何在不依赖人工验证的情况下校正噪声奖励信号，如何处理长时程记忆，以及如何使不确定性校准在不同模型层级之间可迁移。
  literature_review:
    line_of_work_matrix:
    - line: Benchmarking GUI agents on diverse interactive tasks
      what_it_solves: Provides standardized evaluation of agent capabilities on web,
        mobile, video-guided, and safety-critical tasks, highlighting model strengths
        and weaknesses.
      what_remains_open: Many benchmarks use handcrafted tasks that may not reflect
        real-world distribution shifts; reproducibility and cross-setting compatibility
        are limited.
    - line: Training paradigms for computer-use agents
      what_it_solves: Improves agent performance through supervised fine-tuning, online
        RL with verifiable or noisy rewards, and proactive context management for
        long-horizon tasks.
      what_remains_open: Scaling RL with imperfect reward signals remains challenging;
        long-horizon memory management without context bloat is not fully solved;
        reliance on task-specific annotations is still high.
    - line: Safety, uncertainty, and reliability of GUI agents
      what_it_solves: Characterizes vulnerabilities such as prompt injection and SMS-to-webpage
        fraud, and quantifies prediction uncertainty to improve trustworthiness and
        spatial safety.
      what_remains_open: Safety properties are domain-conditioned and do not transfer
        across interfaces; uncertainty quantification methods need target-specific
        recalibration; real-world adversarial robustness is under-evaluated.
    - line: Learning from human demonstrations for GUI agents
      what_it_solves: Transforms human screen recordings into structured multimodal
        tutorials that accelerate human learning and improve agent planning and generalization.
      what_remains_open: The approach depends on human recording quality and may not
        cover all edge cases; integration with RL training and adaptation to new domains
        remain unexplored.
    consensus:
    - VLM-based architectures are the dominant paradigm for GUI agents.
    - Evaluation must move beyond simple accuracy to task completion success rates
      on realistic, multi-step benchmarks.
    - Reward signals for training can be derived from VLMs, but noise in those signals
      must be explicitly modeled and corrected.
    - Safety is a critical concern, but current solutions are insufficient for deployment.
    disagreements:
    - 'How to manage long-horizon context: proactive structured memory vs. full history
      accumulation.'
    - Whether RL training should rely on verifiable synthetic tasks or on noisy autonomous
      evaluation signals.
    - Whether safety evaluation should focus on hand-crafted attacks or on RL-optimized
      injection strings.
    - The importance of video-guided tasks versus static screenshot-based tasks in
      agent evaluation.
    open_questions:
    - How can safety improvements on browser tasks be transferred to coding or other
      domains?
    - What is the best strategy to reduce reward noise in RL without manual verification?
    - How should long-horizon task completion be evaluated to capture strategic planning
      beyond step-by-step accuracy?
    - Can uncertainty calibration be made robust across different model architectures
      and observation interfaces?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 对多样化交互任务的图形界面智能体进行基准评测
      解决的问题: 在网页、移动端、视频引导及安全关键任务上提供标准化的智能体能力评估，揭示模型的优势与不足。
      尚未覆盖: 许多基准采用手工设计的任务，可能无法反映真实世界的分布偏移；不同评测设置下的可复现性和兼容性仍然有限。
    - 路线: 计算机使用智能体的训练范式
      解决的问题: 通过监督微调、基于可验证或噪声奖励的在线强化学习以及主动上下文管理，提升智能体在长时程任务上的表现。
      尚未覆盖: 利用不完美奖励信号进行规模化强化学习仍具挑战性；长时程记忆管理尚未完全解决上下文膨胀问题；对任务特定人工标注的依赖依然较高。
    - 路线: 图形界面智能体的安全性、不确定性与可靠性
      解决的问题: 刻画提示注入和短信到网页欺诈等漏洞，并量化预测不确定性，以提升可信度和空间安全性。
      尚未覆盖: 安全属性具有领域条件性，无法跨界面迁移；不确定性量化方法需要针对特定目标重新校准；真实世界中的对抗鲁棒性尚未得到充分评估。
    - 路线: 从人类演示中学习用于图形界面智能体
      解决的问题: 将人类屏幕录制转化为结构化的多模态教程，从而加速人类学习并提升智能体的规划与泛化能力。
      尚未覆盖: 该方法依赖于人类录制的质量，可能无法覆盖所有边缘情况；与强化学习训练的整合以及向新领域的适应尚未被探索。
    共识:
    - 基于视觉语言模型的架构是图形界面智能体的主流范式。
    - 评估必须超越简单的准确率，转向在真实、多步骤基准上的任务成功率。
    - 训练中的奖励信号可以从视觉语言模型中获得，但必须显式建模并校正其中的噪声。
    - 安全性是至关重要的关注点，但当前方案尚不足以支撑实际部署。
    分歧:
    - 如何管理长时程上下文：是采用主动结构化记忆，还是保留完整的历史记录。
    - 强化学习训练应依赖可验证的合成任务，还是依赖带噪声的自主评估信号。
    - 安全性评估应该聚焦于手工制作的攻击，还是聚焦于经过强化学习优化的注入字符串。
    - 视频引导任务与基于静态截图的测试在智能体评估中的重要性争议。
    开放问题:
    - 如何将浏览器任务上的安全改进迁移到编程或其他领域？
    - 在不依赖人工验证的情况下，降低强化学习中奖励噪声的最优策略是什么？
    - 应如何评估长时程任务完成情况，才能捕捉到超越逐步正确率的策略性规划？
    - 不确定性校准能否在不同模型架构和观察接口之间保持鲁棒性？
