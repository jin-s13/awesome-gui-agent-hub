  related_work_outline_zh:
  - 主流方向：以 GUI agent 可靠性/安全框架为前沿，主要通过基准形式化（MacAgentBench、LivingScreen、DragOn）、可验证或弱监督训练（ScaleCUA、GUICrafter）和不确定性校准（Argus）展开，而非纯理论证明。
  - 研究共性：从粗粒度成功率转向更细的可靠性证据，如子目标完成、观察效率、交互覆盖、上下文维护和校准安全性。
  - 关键差异：监督信号、表示选择、评测目标和部署场景不同；有的保留视觉图形或结构化上下文，有的折叠压缩；基准覆盖桌面、移动端、动态短视频和拖拽交互。
  - 趋势演进：2024-2026 处于当前前沿，从静态单击成功向动态屏幕、长时域 GUI/CLI 行为、可验证 RL 数据和不确定性安全校准演进。
  - 开放问题：单步 UQ 如何迁移到多步轨迹、结构技能或记忆能否跨应用泛化、观察控制策略、合成任务真实性，以及缺失代码、数据切分和 limitation 说明带来的复现缺口。
  literature_review:
    line_of_work_matrix:
    - line: Formal task assumptions and evaluation boundaries
      what_it_solves: Turns diverse computer-use tasks into measurable benchmarks,
        covering desktop GUI/CLI, dynamic short-video interfaces, and drag-based interactions;
        exposes subgoal completion, observation control, and interaction coverage.
      what_remains_open: Evaluations often stop at single-task success or single-step
        grounding; dynamic and multi-step trajectory coverage remains narrow, and
        cross-platform generalization is not established.
    - line: Structured knowledge, memory, and context management
      what_it_solves: Reduces long-horizon context loss and workflow errors by giving
        agents explicit visual skills or structured context fields instead of passive
        screen/history accumulation.
      what_remains_open: Evidence is concentrated on a few benchmarks and model versions;
        it is unclear whether learned structures transfer across unseen UI patterns,
        longer sessions, and new applications.
    - line: Scalable supervision and verifiable reinforcement learning
      what_it_solves: Lowers annotation dependence through weak supervision from unannotated
        screenshots or verifiable synthetic tasks, then calibrates policies with reinforcement
        learning to improve open-source agent performance on OSWorld and ScienceBoard.
      what_remains_open: Synthetic or weak supervision may not cover real-world failure
        modes, distribution shifts, and safety-critical edge cases; several limitation
        analyses are missing.
    - line: Uncertainty quantification and spatial safety calibration
      what_it_solves: Benchmarks post-hoc uncertainty methods for GUI grounding and
        uses conformal action regions to produce smaller, safer click regions when
        calibration holds.
      what_remains_open: Only single-step executable grounding is evaluated; cross-model
        and cross-interface uncertainty transfer is weak, and conformal coverage degrades
        under distribution or interface mismatch.
    consensus:
    - 'The field is shifting from coarse task success to finer reliability signals:
      subgoal completion, cost-accuracy or observation control, interaction coverage,
      context management, and uncertainty calibration.'
    - Structured augmentation, such as visual skill artifacts, proactive context fields,
      verifiable task synthesis, or uncertainty-aware action regions, improves behavior
      over unstructured end-to-end baselines.
    - Current agents still fall short on dynamic, long-horizon, and cross-interface
      tasks, indicating that both benchmark construction and training methods are
      needed to close the reliability gap.
    disagreements:
    - 'Representation differs: one line retains visual figures in skill artifacts,
      while another folds or summarizes visual and action history into structured
      context fields.'
    - 'Supervision signal differs: weak grounding from unannotated screenshots contrasts
      with verifiable task synthesis and online reinforcement learning.'
    - 'Evaluation target differs: desktop Pass@1, dynamic-platform cost-accuracy,
      drag interaction grounding, mobile long-horizon generalization, and single-step
      uncertainty transfer emphasize different capability boundaries.'
    - Deployment and interaction settings differ across desktop, mobile, browser-based
      dynamic screens, and drag-based actions, so shared task assumptions are not
      unified.
    open_questions:
    - Can post-hoc uncertainty rankings calibrated on single-step GUI grounding transfer
      to multi-step computer-use trajectories across model classes and interfaces?
    - Do visual skill libraries and structured context fields remain effective outside
      fixed benchmarks when UI layouts, task durations, and application domains shift?
    - What observation-control mechanism selects enough screen information while preventing
      over-observation on dynamic interfaces?
    - Does verifiable task synthesis generate tasks whose failure modes match real-world
      desktop and mobile use, especially under distribution shift or safety-critical
      conditions?
    - Several method papers lack visible limitation statements or artifact details,
      leaving reproducibility and boundary claims as verification gaps.
  literature_review_zh:
    研究路线矩阵:
    - 路线: 形式化任务假设与评测边界
      解决的问题: 将多样化计算机使用任务转化为可量化基准，覆盖桌面 GUI/CLI、动态短视频界面和拖拽交互，揭示子目标完成、观察控制和交互覆盖等问题。
      尚未覆盖: 评测多集中在单任务或单步 grounding；动态、多步轨迹和跨平台泛化不足。
    - 路线: 结构化知识、记忆与上下文管理
      解决的问题: 通过多模态技能或主动上下文管理减少长时域信息丢失，改善 UI 元素识别与工作流状态校验。
      尚未覆盖: 证据集中在少量基准和模型版本，跨应用、长会话和未见 UI 模式的迁移证据不足。
    - 路线: 可扩展监督与可验证在线强化学习
      解决的问题: 利用未标注截图弱监督或可验证任务合成降低标注依赖，并用 RL 校准提升开源 agent 在 OSWorld、ScienceBoard 等上的性能。
      尚未覆盖: 合成或弱监督任务是否覆盖真实失败模式与安全关键边缘情况不明，且多篇论文缺少 limitation 说明。
    - 路线: 不确定性量化与空间安全校准
      解决的问题: 在 GUI grounding 上基准化后验 UQ 方法，并用共形动作区域在校准成立时提供更小更安全的点击范围。
      尚未覆盖: 仅评估单步 grounding；跨模型和接口 UQ 迁移弱，分布偏移下覆盖度下降。
    共识:
    - 领域从粗粒度成功率转向更细的可靠性信号：子目标完成、成本-准确性或观察控制、交互覆盖、上下文维护和不确定性校准。
    - 结构化增强（视觉技能工件、主动上下文字段、可验证任务合成或不确定性感知动作区域）相比无结构端到端基线更能提升行为表现。
    - 当前代理在动态、长时域和跨接口任务上仍不足，说明仅靠评测或仅靠训练都难以单独弥合可靠性差距。
    分歧:
    - 表示选择不同：一路保留视觉图形，另一路将视觉与动作历史折叠为结构化上下文字段。
    - 监督信号不同：未标注截图的弱监督与可验证任务合成加在线 RL 形成对比。
    - 评测目标不同：桌面 Pass@1、动态平台成本-准确性、拖拽交互、移动长时域泛化和单步不确定性迁移强调不同的能力边界。
    - 部署与交互设置不同：桌面、移动端、浏览器动态屏幕和拖拽操作并存，缺乏统一的任务假设。
