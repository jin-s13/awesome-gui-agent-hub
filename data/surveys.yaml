  related_work_outline:
  - 'Mainstream direction: GUI agents are converging on vision-language model (VLM)
    backbones for grounding and interaction, supplemented by benchmarks that stress
    real-world tasks, safety, and robustness.'
  - 'Shared research pattern: Each contribution constructs a targeted benchmark or
    evaluation protocol, then uses it to expose a capability gap—such as context length,
    distribution shift, or evaluation noise—and proposes a corrective method.'
  - 'Key differences: Works differ in the granularity of agent evaluation (single-step
    grounding vs. multi-step trajectories), the domain of the user interface (mobile,
    browser, desktop OS), the supervision signal used for training (offline SFT, online
    RL with handcrafted or autonomous rewards), and whether safety is treated as a
    cross-domain or domain-conditioned property.'
  - 'Trend evolution: The short 2024–2026 window shows a shift from static benchmarks
    toward interactive, multi-step evaluation; from offline imitation to online RL
    with verifiable tasks; and from monolithic safety claims to fine-grained, domain-conditioned
    safety audits.'
  - 'Open questions: How to achieve reliable cross-domain transfer of model performance,
    safety, and uncertainty estimates; how to scale autonomous evaluation without
    noise overfitting; and how to design benchmarks that capture the full decision
    cycle of GUI agents rather than isolated steps.'
  related_work_outline_zh:
  - 主流方向：GUI智能体正以视觉语言模型（VLM）为骨干，实现界面定位与交互，并通过强调真实任务、安全性和鲁棒性的基准测试推动发展。
  - 研究共性：每项工作都构建一个针对性的基准或评估协议，用以暴露一个能力缺口（如上下文长度、分布偏移、评估噪声），然后提出一种修正方法。
  - 关键差异：工作在智能体评估的粒度（单步定位 vs. 多步轨迹）、用户界面的领域（移动端、浏览器、桌面操作系统）、训练所用的监督信号（离线SFT、基于手工或自主奖励的在线RL）以及安全是作为跨域属性还是领域条件属性方面存在差异。
  - 趋势演进：在2024–2026年的短暂窗口内，观察到从静态基准向交互式多步评估的转变；从离线模仿到具有可验证任务的在线RL的转变；以及从单一安全声明到细粒度领域条件安全审计的转变。
  - 开放问题：如何实现模型性能、安全性和不确定性估计的可靠跨域迁移；如何在不陷入噪声过拟合的情况下扩展自主评估；以及如何设计能捕捉GUI智能体完整决策循环而非孤立步骤的基准。
  literature_review:
    line_of_work_matrix:
    - line: Taxonomy and roadmap synthesis
      what_it_solves: Structures the design space of GUI agents by proposing new task
        decompositions, context management strategies, and training paradigms that
        map out possible directions for future systems.
      what_remains_open: The proposed taxonomies are often induced from a single system
        or dataset; their completeness and coverage of edge cases (e.g., multi-app,
        multi-modal interruptions) remain unverified.
    - line: Comparative evaluation synthesis
      what_it_solves: Quantifies performance differences across models, methods, and
        domains under controlled protocols, thereby revealing where current agents
        fail and how evaluation choices shape conclusions.
      what_remains_open: Compared results are frequently not compatible across settings
        because of mismatched metrics, interface assumptions, or distribution shifts,
        and the transferability of rankings across model classes is weak.
    - line: Open problem and gap mapping
      what_it_solves: Translates a body of empirical findings into a set of concrete,
        prioritized research gaps, such as domain-conditioned safety, noisy autonomous
        rewards, and long-horizon context degradation.
      what_remains_open: Prioritization of these gaps is implicit; there is no systematic
        methodology to decide which open problem, once solved, would most improve
        the overall reliability of GUI agents.
    consensus:
    - Vision-language models are the predominant backbone for GUI grounding and task
      execution.
    - Benchmark-driven evaluation is the primary method for identifying agent weaknesses,
      and new benchmarks are designed to suppress shortcuts (e.g., reputation cues,
      action-history cues) that would otherwise inflate performance.
    - Online reinforcement learning, often combined with verifiable or autonomous
      reward signals, is emerging as a key technique to push beyond static imitation.
    - Safety and uncertainty awareness are recognized as critical, but current solutions
      are typed by domain and degrade under distribution shift.
    disagreements:
    - 'Granularity of evaluation: some works evaluate single-step GUI grounding, while
      others insist on multi-step, end-to-end trajectories, leading to different conclusions
      about model robustness.'
    - 'Domain of safety: one line of work treats safety as a general property of the
      model, while domain-conditioned studies show that safety hardening in the browser
      does not transfer to coding tasks, causing a split on whether safety is a unified
      or per-domain problem.'
    - 'Reward design for RL: handcrafted verifiable rewards are contrasted with autonomous
      VLM-based evaluation, with the latter introducing noise that must be corrected,
      but no consensus exists on the best trade-off between scalability and signal
      quality.'
    - 'Context management: approaches range from passive history accumulation to proactive
      context-as-action, and the field lacks a standard for what constitutes a minimal,
      sufficient context representation for long-horizon tasks.'
    open_questions:
    - How can safety and uncertainty estimates be made to transfer across different
      GUI domains without per-domain recalibration?
    - What is the minimal set of evidence needed to evaluate a multi-step GUI agent
      reliably, and how can we prevent evaluator noise from driving policy optimization
      into spurious behaviors?
    - Under what conditions do the rankings produced by comparative benchmarks remain
      valid when the model family, interface, or task distribution changes, and how
      can we design benchmarks that are robust to these shifts?
    - How can proactive context management be formalized and evaluated independently
      of the policy model, so that its contribution to long-horizon success can be
      isolated and compared across architectures?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 分类体系与路线图综合
      解决的问题: 通过提出新的任务分解、上下文管理策略和训练范式，构建GUI智能体的设计空间，为未来系统指明可能的方向。
      尚未覆盖: 所提出的分类体系通常源于单一系统或数据集，其完整性和对边缘案例（如多应用、多模态干扰）的覆盖范围尚未得到验证。
    - 路线: 对比评测综合
      解决的问题: 在受控协议下量化模型、方法和领域之间的性能差异，从而揭示当前智能体在何处失败，以及评测选择如何影响结论。
      尚未覆盖: 由于指标不匹配、界面假设差异或分布偏移，被比较的结果在不同设置下往往不兼容，且排名在不同模型类别间的可迁移性较弱。
    - 路线: 开放问题与缺口映射
      解决的问题: 将一系列实证发现转化为一组具体的、需优先解决的研究缺口，例如领域条件安全、带有噪声的自主奖励以及长时域上下文退化。
      尚未覆盖: 这些缺口的优先级排序是隐式的；缺乏系统化的方法来判断解决哪一个开放问题能最大程度地提升GUI智能体的整体可靠性。
    共识:
    - 视觉语言模型是GUI定位与任务执行的主要骨干。
    - 基准驱动的评测是识别智能体缺陷的主要方法，新的基准被设计用于抑制可能虚增性能的捷径（如信誉线索、动作历史线索）。
    - 在线强化学习，通常与可验证或自主奖励信号结合，正成为超越静态模仿的关键技术。
    - 安全性和不确定性意识被视为至关重要，但当前的解决方案因领域而异，并在分布偏移下退化。
    分歧:
    - 评估粒度：部分工作评估单步GUI定位，而其他工作则坚持多步端到端轨迹，导致对模型鲁棒性产生不同结论。
    - 安全领域：一种工作路线将安全视为模型的通用属性，而领域条件研究表明浏览器中的安全加固无法迁移到编码任务，在安全是统一问题还是按领域划分的问题上存在分歧。
    - 强化学习的奖励设计：手工设计的可验证奖励与基于VLM的自主评估形成对比，后者引入了必须进行校正的噪声，但在可扩展性与信号质量之间的最佳权衡上尚未达成共识。
    - 上下文管理：方法涵盖从被动历史累积到主动的“上下文即动作”，对于长时域任务中最小且充分的上下文表示应为何，领域缺乏标准。
    开放问题:
    - 如何使安全性和不确定性估计能够在不同的GUI领域之间迁移，而无需逐领域重新校准？
    - 可靠评估多步GUI智能体所需的最小证据集是什么？如何防止评估器噪声将策略优化推向虚假行为？
    - 当模型族、界面或任务分布发生变化时，对比基准产生的排名在何种条件下仍然有效？如何设计对这些变化鲁棒的基准？
    - 如何形式化并独立于策略模型评估主动上下文管理，以便将其对长时域成功的贡献隔离出来，并在不同架构间进行比较？
