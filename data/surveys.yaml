  related_work_outline:
  - 'Mainstream direction: The dominant research direction is building comprehensive
    benchmarks for GUI agents that span multiple applications, interaction modalities
    (click, drag, video-guided), and operating systems, with fine-grained evaluation
    metrics going beyond binary task success rates.'
  - 'Shared research pattern: Constructing task suites with deterministic or rule-based
    scoring, comparing multiple state-of-the-art vision-language models, and identifying
    capability gaps such as observation control, multimodal grounding, and uncertainty
    management.'
  - 'Key differences: Benchmarks differ in environment scope (desktop macOS vs. browser-based
    dynamic web), interaction type emphasis (drag vs. general GUI actions), evaluation
    metric focus (accuracy vs. cost-efficiency vs. uncertainty quantification), and
    the degree to which agent scaffolding (skills, RL training) is incorporated into
    the evaluation.'
  - 'Trend evolution: The field has rapidly shifted from static, single-task GUI benchmarks
    to multi-app, dynamic, real-world OS environments, increasingly incorporating
    fine-grained metrics, cost-awareness, and uncertainty estimation, while also exploring
    the influence of agent-external skills and training data.'
  - 'Open questions: How to design benchmarks that capture long-horizon, cross-app
    workflows and real user intent; can uncertainty quantification metrics reliably
    predict deployment failures; and what is the impact of agent scaffolding and training
    data on benchmark conclusions, and how should it be controlled.'
