  - 'Mainstream direction: Building and evaluating GUI agents via multimodal models
    and reinforcement learning, with growing emphasis on safety, uncertainty, and
    long-horizon tasks.'
  - 'Shared research pattern: Proposing new benchmarks to isolate specific agent capabilities
    (video grounding, fraud detection, safety) and training agents using scalable
    or verifiable reward signals.'
  - 'Key differences: Whether to suppress real-world shortcuts (e.g., URL) during
    evaluation, use of hand-crafted vs. RL-optimized attacks for safety, single-step
    vs. multi-step trajectory evaluation, and choice of training paradigm (SFT vs.
    online RL).'
  - 'Trend evolution: From isolated task success rates toward multi-dimensional evaluation
    covering safety, uncertainty, and domain-conditioned robustness; increasing use
    of autonomous evaluation and synthetic task generation for RL.'
  - 'Open questions: Generalization across domains/model tiers, robust correction
    of noisy rewards, standardizing safety red-teaming, and scaling context management
    for long-horizon tasks without losing critical information.'
  related_work_outline_zh:
  - 主流方向：基于多模态模型和强化学习的GUI代理构建与评估，重点日益转向安全性、不确定性和长时域任务。
  - 研究共性：提出新基准以隔离特定代理能力（视频基础、欺诈检测、安全性），并使用可扩展或可验证的奖励信号训练代理。
  - 关键差异：评估时是否抑制现实世界捷径（如URL），使用手工攻击还是RL优化攻击测试安全性，单步评估与多步轨迹评估，以及训练范式选择（SFT vs 在线RL）。
  - 趋势演进：从孤立的成功率指标转向覆盖安全性、不确定性和领域条件鲁棒性的多维评估；在RL中越来越多地采用自主评估和合成任务生成。
  - 开放问题：跨领域/模型层级的泛化，噪声奖励的鲁棒校正，标准化安全红队测试，以及在不丢失关键信息的前提下扩展长时域任务的上下文管理。
  literature_review:
    line_of_work_matrix:
    - line: Benchmarking GUI agents for specific capabilities
      what_it_solves: Provides controlled testbeds to evaluate video-guided grounding,
        SMS-to-webpage fraud detection, uncertainty quantification, and safety against
        prompt injection.
      what_remains_open: Comparability across benchmarks, coverage of real-world distribution
        shifts, and integration of multi-step trajectory evaluation beyond single-step
        grounding.
    - line: Training via reinforcement learning with autonomous or verifiable rewards
      what_it_solves: Reduces reliance on manual labels by using vision-language model
        evaluators or docker-based task synthesis to generate scalable training signals.
      what_remains_open: Robustness to noisy evaluator feedback, sample efficiency,
        and transfer of learned policies to domains beyond the training distribution.
    - line: Long-horizon context management
      what_it_solves: Addresses context window overflow and history forgetting in
        multi-step GUI tasks by treating context management as a first-class action.
      what_remains_open: Generalization of context management strategies to other
        agent architectures and integration with training paradigms beyond supervised
        fine-tuning.
    - line: Safety and security evaluation
      what_it_solves: Exposes vulnerabilities of GUI agents to prompt injection and
        demonstrates domain-conditioned safety hardening.
      what_remains_open: Extending safety hardening beyond browser tasks to coding
        and other domains, and standardizing red-teaming protocols with reproducible
        attack strings.
    consensus:
    - GUI agents require evaluation beyond task success, covering safety, uncertainty,
      and long-horizon consistency.
    - Reinforcement learning is a promising path to improve agent performance, but
      needs scalable reward sources that do not rely on handcrafted signals.
    - Safety and reliability are emerging as non-negotiable dimensions for deploying
      computer-use agents.
    disagreements:
    - Whether evaluation should suppress real-world shortcuts like URL reputation
      (FraudSMSWalker) or retain them as available cues for detection.
    - Whether safety red-teaming should use hand-crafted attack templates (CUA-HandCrafted)
      or rely on RL-optimized injection strings, leading to different reproducibility
      claims.
    - Whether to focus on single-step executable grounding (Argus) or multi-step agent
      trajectories when measuring capability and uncertainty.
    open_questions:
    - How to build a unified evaluation framework that generalizes across different
      model tiers, interfaces, and task domains.
    - How to design noise-correction mechanisms for autonomous evaluators that are
      robust enough for online RL at scale.
    - How to transfer safety hardening from browser agents to other application domains
      without sacrificing task performance.
    - How to standardize context management for long-horizon GUI agents so that critical
      information is preserved without exceeding context windows.
  literature_review_zh:
    研究路线矩阵:
    - 路线: 针对特定能力的GUI代理基准测试
      解决的问题: 提供受控测试环境，评估视频引导基础、短信到网页欺诈检测、不确定性量化和对抗提示注入的安全性。
      尚未覆盖: 基准间的可比性，真实世界分布偏移的覆盖，以及超越单步基础的多步轨迹评估集成。
    - 路线: 基于自主或可验证奖励的强化学习训练
      解决的问题: 通过使用视觉-语言模型评估器或基于Docker的任务合成，生成可扩展的训练信号，从而减少对手工标注的依赖。
      尚未覆盖: 对噪声评估器反馈的鲁棒性，样本效率，以及将习得策略迁移到训练分布之外的领域。
    - 路线: 长时域上下文管理
      解决的问题: 通过将上下文管理作为一等动作，解决多步GUI任务中的上下文窗口溢出和历史遗忘问题。
      尚未覆盖: 上下文管理策略对其他代理架构的泛化，以及超越监督微调的训练范式集成。
    - 路线: 安全与安全性评估
      解决的问题: 揭示GUI代理对提示注入的脆弱性，并展示领域条件安全加固。
      尚未覆盖: 将安全加固从浏览器任务扩展到编码和其他领域，以及使用可复现的攻击字符串标准化红队测试协议。
    共识:
    - GUI代理需要超越任务成功率的评估，涵盖安全性、不确定性和长时域一致性。
    - 强化学习是提升代理性能的有前途路径，但需要不依赖手工设计信号的可扩展奖励来源。
    - 安全性和可靠性正成为部署计算机使用代理时不可忽视的维度。
    分歧:
    - 评估时应抑制现实世界捷径（如URL声誉，FraudSMSWalker）还是保留它们作为可用线索。
    - 安全红队测试应使用手工制作的攻击模板（CUA-HandCrafted）还是依赖RL优化的注入字符串，这导致不同的可复现性主张。
    - 在衡量能力和不确定性时，应聚焦于单步可执行基础（Argus）还是多步代理轨迹。
    开放问题:
    - 如何构建一个统一评估框架，能够跨不同模型层级、接口和任务领域泛化。
    - 如何设计对噪声足够鲁棒的校正机制，以支持大规模在线RL中的自主评估器。
    - 如何将安全加固从浏览器代理迁移到其他应用领域，而不牺牲任务性能。
    - 如何标准化长时域GUI代理的上下文管理，以在保留关键信息的同时不超出上下文窗口。
