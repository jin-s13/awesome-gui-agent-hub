  related_work_outline:
  - 'Mainstream direction: Scaling GUI agent training and evaluation to handle realistic,
    dynamic, and long-horizon tasks through improved training paradigms (online RL,
    weak supervision, context management) and comprehensive benchmarks that expose
    failure modes beyond simple click success.'
  - 'Shared research pattern: Moves beyond static, click-based tasks; introduces fine-grained
    metrics and diverse interaction types (drag, video, multi-step) to reveal agent
    limitations; leverages large-scale data generation or unlabeled data to reduce
    annotation cost.'
  - 'Key differences: Training methods differ in supervision (RL vs. weak supervision
    vs. SFT with context actions); evaluation targets range from desktop and mobile
    to video and drag; some focus on task success, others on information efficiency,
    uncertainty, or observation control.'
  - 'Trend evolution: Within the 2024–2026 frontier, the trend is toward more complex,
    dynamic benchmarks and training methods that incorporate curriculum learning,
    online RL, and context management, with growing attention to agent robustness
    and uncertainty quantification.'
  - 'Open questions: How to unify evaluation across diverse interfaces; whether training
    gains from synthetic or weakly supervised data generalize to dynamic, observation-sensitive
    environments; how to integrate uncertainty awareness into multi-step agent loops;
    and the scalability of context management to very long horizons.'
  related_work_outline_zh:
  - 主流方向：通过改进的训练范式（在线RL、弱监督、上下文管理）和全面的基准测试，将GUI代理训练和评估扩展到处理现实、动态和长时域任务，暴露简单点击成功之外的失败模式。
  - 研究共性：超越静态点击任务，引入细粒度指标和多样化交互类型（拖拽、视频、多步骤）以揭示代理局限性，并利用大规模数据生成或未标注数据降低标注成本。
  - 关键差异：训练方法在监督信号上不同（RL、弱监督、带上下文动作的SFT）；评估目标涵盖桌面、移动、视频和拖拽；有的关注任务成功率，有的关注信息效率、不确定性或观察控制。
  - 趋势演进：在2024-2026年前沿内，趋势是构建更复杂、动态的基准和训练方法，融合课程学习、在线RL和上下文管理，并越来越关注代理鲁棒性和不确定性量化。
  - 开放问题：如何统一跨界面评估；合成或弱监督数据带来的训练收益能否泛化到动态、观察敏感的环境；如何将不确定性意识融入多步代理循环；以及上下文管理在极长时域上的可扩展性。
  literature_review:
    line_of_work_matrix:
    - line: Online RL with verifiable task synthesis
      what_it_solves: Scaling agent training by generating diverse, verifiable tasks
        and using RL to improve policy without human annotation.
      what_remains_open: Generalization of RL-trained policies to unseen dynamic interfaces
        and the reliance on environment-specific verifier signals.
    - line: Weakly-supervised curriculum learning from unlabeled screenshots
      what_it_solves: Reducing dependence on expensive human annotations by learning
        visual grounding from large-scale unlabeled data, then fine-tuning with minimal
        labeled data.
      what_remains_open: Quality of initial grounding and robustness to diverse UI
        layouts and styles outside the training distribution.
    - line: Proactive context management via action space
      what_it_solves: Enabling long-horizon mobile GUI agents to manage their own
        context history, preventing context explosion while preserving task-critical
        information.
      what_remains_open: Scalability to extremely long or multi-application tasks
        and the transferability of context management actions to non-mobile platforms.
    - line: Benchmarking and evaluation of dynamic GUI interactions
      what_it_solves: Providing rigorous evaluation protocols for diverse interfaces
        (macOS desktop, short-video platforms, drag-based interactions, video-guided
        tasks) and revealing failure modes like observation control, sub-goal completion,
        and interaction efficiency.
      what_remains_open: Coverage of real-world task diversity and the lack of unified
        metrics across benchmarks; whether benchmarks can predict real-world deployment
        performance.
    - line: Post-hoc uncertainty quantification for GUI grounding
      what_it_solves: Estimating the reliability of GUI grounding actions to improve
        safety and enable selective deployment, with methods like conformal prediction
        providing spatial safety margins.
      what_remains_open: Transferability of UQ methods across model architectures
        and deployment scenarios; integration into multi-step agent loops where distribution
        shift degrades coverage.
    consensus:
    - Fine-grained evaluation metrics reveal significant differences between agents
      that are masked by aggregate success rates.
    - Current GUI agents exhibit fundamental limitations in dynamic and long-horizon
      settings, particularly in observation control and context management.
    - Large-scale data generation or unlabeled data is crucial for reducing annotation
      costs and scaling agent training.
    - Realistic, diverse benchmarks are necessary to advance beyond simple click-based
      tasks.
    disagreements:
    - 'Training paradigms differ: online RL with synthetic tasks versus weak supervision
      from unlabeled screenshots versus supervised fine-tuning with context-action
      annotations.'
    - Evaluation targets vary across desktop, mobile, video, and drag-based interfaces,
      each emphasizing different aspects of agent capability (task success, information
      efficiency, drag grounding, observation control).
    - Some works focus on optimizing the agent's action policy, while others emphasize
      the agent's ability to manage its own observation and context or to quantify
      uncertainty.
    - 'The definition of a successful agent varies: pass@1 task completion, cost-accuracy
      trade-off, or uncertain-aware safe interaction.'
    open_questions:
    - How do training methods like online RL and weak supervision compare when evaluated
      on the same dynamic benchmarks such as those involving short-video platforms?
    - Can the observation control problem identified in dynamic video benchmarks be
      mitigated by integrating uncertainty-aware decision-making from uncertainty
      quantification studies?
    - Do the context management actions proposed for mobile agents generalize to desktop
      or web-based GUI agents, and can they scale to hundreds of steps?
    - What is the trade-off between training on specialized interaction types (e.g.,
      drag) and maintaining general agent performance across diverse tasks?
    - How can the evaluation frameworks be unified to enable cross-benchmark comparison
      and real-world deployment prediction?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基于可验证任务合成的在线强化学习
      解决的问题: 通过生成多样化、可验证的任务并使用RL改进策略，无需人工标注，从而扩展代理训练。
      尚未覆盖: RL训练策略对未见动态界面的泛化能力，以及对环境特定验证信号的依赖。
    - 路线: 基于未标注截图的弱监督课程学习
      解决的问题: 通过从大规模未标注数据中学习视觉定位，然后用少量标注数据微调，降低对昂贵人工标注的依赖。
      尚未覆盖: 初始定位质量及对训练分布外多样化UI布局和风格的鲁棒性。
    - 路线: 通过动作空间的主动上下文管理
      解决的问题: 使长时域移动GUI代理能够管理自身上下文历史，防止上下文爆炸，同时保留任务关键信息。
      尚未覆盖: 在极长或多应用任务上的可扩展性，以及上下文管理动作向非移动平台的可迁移性。
    - 路线: 动态GUI交互的基准测试与评估
      解决的问题: 为多样化界面（macOS桌面、短视频平台、拖拽交互、视频引导任务）提供严格的评估协议，揭示观察控制、子目标完成和交互效率等失败模式。
      尚未覆盖: 真实世界任务多样性的覆盖程度，以及跨基准统一指标的缺乏；基准能否预测实际部署性能。
    - 路线: GUI基础的后验不确定性量化
      解决的问题: 估计GUI基础动作的可靠性，以提升安全性并支持选择性部署，共形预测等方法提供空间安全裕度。
      尚未覆盖: UQ方法跨模型架构和部署场景的可迁移性；在分布偏移导致覆盖度下降的多步代理循环中的集成。
    共识:
    - 细粒度评估指标揭示了被聚合成功率掩盖的代理间显著差异。
    - 当前GUI代理在动态和长时域场景中存在根本性局限，尤其在观察控制和上下文管理方面。
    - 大规模数据生成或未标注数据对于降低标注成本和扩展代理训练至关重要。
    - 需要真实、多样的基准测试才能超越简单的点击任务。
    分歧:
    - 训练范式不同：在线RL联合合成任务，对比基于未标注截图的弱监督，对比带上下文动作标注的监督微调。
    - 评估目标涵盖桌面、移动、视频和拖拽界面，各自强调代理能力的不同方面（任务成功率、信息效率、拖拽基础、观察控制）。
    - 部分工作聚焦于优化代理的动作策略，而其他工作则强调代理管理自身观察和上下文的能力或量化不确定性。
    - 对成功代理的定义不同：pass@1任务完成率、成本-准确性权衡或不确定性感知的安全交互。
    开放问题:
    - 在线RL和弱监督等训练方法在相同的动态基准（如短视频平台）上如何比较？
    - 动态视频基准中发现的观察控制问题能否通过集成不确定性量化研究中的不确定性感知决策来缓解？
    - 为移动代理提出的上下文管理动作能否泛化到桌面或网页GUI代理，并能扩展到数百步？
    - 在专门交互类型（如拖拽）上训练与在多样化任务上保持通用代理性能之间的权衡是什么？
    - 如何统一评估框架以实现跨基准比较和真实部署预测？
