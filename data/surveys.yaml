    研究路线矩阵:
    - 路线: 桌面多应用基准与原生智能体训练
      解决的问题: 衡量并改进真实操作系统环境中的端到端计算机使用能力，包括 GUI 与 CLI 操作以及可验证的最终环境状态。
      尚未覆盖: 跨平台迁移、显式局限性、真实安全结果和可复现信号仍缺少充分证据。
    - 路线: 多模态技能与程序重用
      解决的问题: 通过存储、检索或重放成功的视觉/文本技能或状态机程序，提升任务成功率和重复任务执行效率。
      尚未覆盖: 跨应用或界面变化时的迁移、动态变化下的恢复，以及长期程序库维护尚未解决。
    - 路线: 动态与视频引导的 GUI 评测与观察控制
      解决的问题: 覆盖视觉上下文在动作之间变化的界面，用准确性加信息成本等方式联合评估视频引导或动态任务。
      尚未覆盖: 智能体缺乏观察控制；评测集中在短视频平台等特定环境，尚未扩展到所有动态界面类型。
    - 路线: 面向低覆盖交互类型的动作定位数据集
      解决的问题: 为点击式任务之外的低覆盖交互（如拖拽）提供训练与评测数据，支持视觉语言模型的细粒度动作定位。
      尚未覆盖: 拖拽定位能否迁移到下游计算机使用任务，以及数据集/工件是否完全可用仍是验证缺口。
    - 路线: 替代式视觉语言模型训练与动作空间统一
      解决的问题: 引入块级扩散生成或统一 GUI 与代码执行动作空间，以改善定位、导航和桌面任务完成。
      尚未覆盖: 扩展性、更广基线比较、跨平台验证以及异构动作之间的协调仍只有部分证据。
    共识:
    - 应用型 GUI 智能体研究正从单一成功率转向细粒度、可验证评测，包括子目标检查点、最终环境状态和信息成本。
    - 技能或过程记忆能提升智能体表现和重复任务效率，仅保留文本知识通常不如保留视觉或程序工件有效。
    - 当前智能体在动态或多应用任务上仍低于人类水平，观察控制和 GUI/代码协调是突出弱点。
    分歧:
    - 一类方法把成功轨迹编译成可执行状态机程序用于快速重放，另一类按需检索分层视觉-文本技能文件；两者在表示、执行和新情况处理上不同。
    - 动作空间不同：部分研究只聚焦 GUI 动作定位，另一类将 GUI 操作与代码执行统一并端到端训练。
    - 评测场景不同：真实桌面 OS、动态短视频界面、视频引导任务、拖拽交互和跨平台 grounding/导航各自强调不同失败模式。
    - 适配方式不同：监督微调、在线 RL、扩散模型预训练和运行时回退提示复用被分别采用，假定不同的模型更新需求。
    开放问题:
    - 技能库或程序能否跨应用、跨操作系统或界面更新迁移，而不必为每个应用存储专属工件？
    - 智能体应如何决定再次观察屏幕或视频，以在动态环境中平衡任务准确性与信息成本？
    - 拖拽或视频引导等专项基准上的提升是否能迁移到办公室或专业工作流中的通用计算机使用可靠性？
    - 跨平台迁移、代码/数据可用性和真实安全结果的验证缺口还有哪些？
