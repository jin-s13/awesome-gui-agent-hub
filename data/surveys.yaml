  literature_review:
    line_of_work_matrix:
    - line: Taxonomy and roadmap synthesis
      what_it_solves: 'Organizes fragmented GUI-agent work into candidate directions:
        training and scaling, evaluation benchmarks, safety, uncertainty, long-horizon
        interaction, and tutorial generation.'
      what_remains_open: The packet does not include formal survey papers or systematic
        inclusion criteria, so taxonomy coverage and representativeness cannot be
        verified.
    - line: Comparative evaluation synthesis
      what_it_solves: Summarizes how evaluation choices such as masked reputation
        cues, domain-specific tasks, full trajectories, and final-screenshot reward
        shape conclusions across GUI agent studies.
      what_remains_open: Results are not clearly compatible across benchmarks because
        tasks, interfaces, metrics, baselines, and reward conditions differ, while
        several limitation details are missing.
    - line: Open problem and gap mapping
      what_it_solves: 'Turns broad evidence into concrete gaps: weak UQ transfer across
        model tiers, low benign recall under sanitized fraud cues, domain-conditioned
        safety failures, evaluator reward noise, and long-horizon context management.'
      what_remains_open: Gap prioritization is not established; evidence is concentrated
        in 2024-2026 and often limited to single-step, browser, mobile, or video-specific
        settings.
    consensus:
    - Benchmark-driven evaluation is the dominant evidence model; success rate, ranking
      transfer, or attack success are used to judge GUI/computer-use agents.
    - VLM-based agents and evaluators are central, but their reliability degrades
      under domain, interface, or distribution shift.
    - Training-oriented work increasingly relies on verifiable or synthetic tasks
      and autonomous reward signals rather than only manually labeled demonstrations.
    - 'Robust generalization remains difficult: findings from one benchmark, model
      tier, or domain often do not transfer to another.'
    - The packet separates popularity and read-first signals from methodology and
      reproducibility signals; several high-scoring papers lack limitation details
      or artifact evidence, which is a verification gap.
    disagreements:
    - 'Evaluation object differs: single-step executable grounding, multi-step browser
      or mobile tasks, fraud judgment, or video-guided GUI control.'
    - 'Supervision and training differ: verifiable task synthesis with online RL,
      supervised context management, RL with noise-corrected evaluator feedback, or
      no training at all.'
    - 'Interaction modes differ: static screenshot grounding, long-horizon mobile
      UI, browser-domain safety, video keyframes, and multimodal tutorial generation.'
    - 'Safety and uncertainty conclusions conflict: UQ ranking transfer is strong
      within model but weak across model tiers; browser prompt-injection resistance
      contrasts with coding-domain skill-injection vulnerability.'
    - 'Benchmark protocols impose different information constraints: sanitized URL
      and reputation cues for fraud, masked protocols for safety audits, and final-screenshot
      reward for RL.'
    open_questions:
    - 'Which gap should be prioritized first for deployment: uncertainty transfer,
      long-horizon context, domain-conditioned safety, or reward noise?'
    - Can UQ ranking and safety-resistance findings transfer across model tiers and
      interfaces without target-specific re-evaluation?
    - How comparable are success rates across OSWorld, ScienceBoard, MemGUI-Bench,
      MobileWorld, and video-guided benchmarks when tasks and metrics differ?
    - Do conclusions based on single-step grounding or browser-only safety generalize
      to multi-step, cross-domain, and real-world GUI workflows?
    - What systematic inclusion and quality criteria should a formal GUI-agent survey
      use, given that the available evidence packet contains primary studies rather
      than full survey texts?
