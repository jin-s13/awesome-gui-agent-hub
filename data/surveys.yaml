  - 主流方向：当前前沿集中在真实GUI代理的动作与评估，从静态点击屏幕扩展到macOS桌面、动态短视频、拖拽和视频引导任务。
  - 研究共性：论文通常将基准或数据集与某种方法或协议配对，评估前沿和开源视觉语言模型，并在总体成功率之外报告细粒度指标。
