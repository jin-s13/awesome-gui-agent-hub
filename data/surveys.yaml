  related_work_outline:
  - 'Mainstream direction: Benchmark-driven development of GUI and computer-use agents,
    with emphasis on scalable training, evidence-driven self-improvement, and finer
    evaluation beyond aggregate success rates.'
  - 'Shared research pattern: VLM-based agents map visual observations to grounded
    actions, evaluated on structured GUI tasks with success, sub-goal, cost-accuracy,
    or uncertainty metrics.'
  - 'Key differences: Lines split between frozen-harness/system improvement, data-efficient
    supervised or RL training, benchmark-only evaluation, and uncertainty quantification;
    interaction targets range from desktop and drag to dynamic short-video and video-guided
    tasks.'
  - 'Trend evolution: Available top evidence is concentrated in 2026, so the visible
    trend is within the current frontier: from static click-oriented benchmarks toward
    dynamic, drag, GUI+CLI, and observation-sensitive settings, plus more explicit
    training, harness, and UQ interventions.'
  - 'Open questions: Transfer across OS and interface boundaries, separation of gains
    from data, verification, harness, and backbone; observation control in dynamic
    interfaces; and safe uncertainty for multi-step deployment remain open.'
  related_work_outline_zh:
  - 主流方向：围绕GUI/计算机使用智能体开展基准驱动开发，重点是可扩展训练、证据驱动的自改进，以及超越总体成功率的细粒度评测。
  - 研究共性：视觉语言模型从屏幕观测到动作的落地；近期工作把任务环境与成功率、子目标、成本-准确率或不确定性指标结合。
  - 关键差异：路线分为冻结执行框架/系统优化、数据高效监督或RL训练、纯基准评测和不确定性量化；界面覆盖桌面、拖拽、动态短视频和视频引导。
  - 趋势演进：可见高相关证据集中在2026年，趋势在当前前沿内：从静态点击基准转向动态、拖拽、GUI+CLI和观察敏感设置，并更强调训练、harness与UQ干预。
  - 开放问题：跨操作系统/界面迁移、收益来源分离、动态界面观察控制、多步部署的不确定性安全等仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: GUI benchmark and evaluation protocol design
      what_it_solves: Creates structured real-world and simulated GUI tasks with deterministic
        or fine-grained scoring to compare agents across interfaces, applications,
        and action types.
      what_remains_open: Benchmark coverage remains limited to selected OS/app/interaction
        families, and many evaluations do not report whether human or cross-benchmark
        transfer holds.
    - line: Data-efficient training and verifiable task synthesis
      what_it_solves: Reduces dependence on costly human annotations by generating
        verifiable computer-use tasks, using unannotated screenshots, and applying
        curriculum or online RL.
      what_remains_open: Ablations often do not separate gains from data scale, reward
        verification, visual grounding pretraining, and RL, nor test transfer outside
        reported benchmarks.
    - line: Execution-harness and self-improvement methods
      what_it_solves: Improves frozen GUI agents by editing the execution harness
        from observed interface transitions and repeated task evidence.
      what_remains_open: Evidence is mostly limited to OSWorld-Verified and one transfer
        benchmark; generalization of harness edits across interface families and failure
        modes is unproven.
    - line: Uncertainty quantification and selective action
      what_it_solves: Identifies unreliable GUI grounding and produces calibrated
        conformal click regions for safer action selection.
      what_remains_open: Evaluated on single-step grounding rather than multi-step
        trajectories; cross-model and cross-interface uncertainty transfer is weak
        and distribution-shift coverage degrades.
    - line: Dynamic and video-guided interface grounding
      what_it_solves: Addresses changing content and video-conditioned tasks through
        dynamic-environment benchmarks and task-aware keyframe extraction.
      what_remains_open: Current agents lack observation control; evidence is restricted
        to short-video or selected video-guided tasks, with open questions about general
        dynamic interfaces.
    consensus:
    - GUI/computer-use agents are predominantly VLM-based systems that map visual
      observations to grounded actions and are evaluated by task success or related
      metrics.
    - Fine-grained metrics can expose capability differences that aggregate Pass@1
      hides, such as sub-goal completion or observation behavior.
    - Human annotation is viewed as a bottleneck, leading to weak supervision, synthetic
      task generation, or frozen-model adaptation.
    - Method and evaluation work is increasingly tied to verifiable, executable environments
      rather than static language-only or isolated visual judgments.
    - Reported limitations often omit transfer and robustness details, making cross-benchmark
      generalization a verification gap.
    disagreements:
    - 'Research targets differ: some improve frozen systems by optimizing the execution
      harness, while others train model weights with weakly supervised or online RL
      data.'
    - 'Interaction coverage differs: desktop GUI, GUI+CLI, drag-based, dynamic short-video,
      and video-guided tasks are treated as separate evidence regimes.'
    - 'Evaluation focus differs: aggregate task success, fine-grained sub-goal scoring,
      cost-accuracy efficiency, and calibration/coverage are used as primary signals.'
    - 'Supervision assumptions differ: one line uses massive unannotated screenshots;
      another synthesizes verifiable tasks for RL; another avoids training entirely.'
    - 'Evidence granularity differs: some results are single-step grounding, while
      others evaluate multi-step agent trajectories; this changes what conclusions
      can be drawn.'
    open_questions:
    - Can observation-control behavior be learned or harness-engineered to reduce
      over- and under-observation in dynamic interfaces?
    - How much of reported computer-use improvement comes from backbone choice, training
      data, reward verification, planner/action interface, or execution harness?
    - Are drag, video-guided, and desktop agent gains transferable across operating
      systems, applications, and interaction modalities?
    - Can uncertainty quantification be made stable across model classes and calibration-test
      distribution shifts for multi-step computer-use deployment?
    - What failure modes remain outside current benchmark coverage, especially for
      dynamic interfaces, CLI-joined workflows, and real-world task variability?
  literature_review_zh:
    研究路线矩阵:
    - 路线: GUI基准与评估协议设计
      解决的问题: 建立结构化真实或模拟GUI任务，并用确定性或细粒度评分比较不同界面、应用和动作类型上的智能体。
      尚未覆盖: 基准覆盖仍限于特定OS/应用/交互族，很多评估未报告人类基线和跨基准迁移是否成立。
    - 路线: 数据高效训练与可验证任务合成
      解决的问题: 通过可验证计算机使用任务生成、未标注截图和课程或在线RL，降低对昂贵人工标注的依赖。
      尚未覆盖: 消融常不区分数据规模、奖励验证、视觉定位预训练和RL的增益，也未必在报告基准外测试迁移。
    - 路线: 执行harness与自改进方法
      解决的问题: 通过观测界面变化和重复任务证据编辑执行harness，在冻结模型条件下改进GUI智能体。
      尚未覆盖: 证据主要限于OSWorld-Verified和单个迁移基准，harness编辑跨界面家族和失败模式的泛化性未证实。
    - 路线: 不确定性量化与选择性动作
      解决的问题: 识别不可靠的GUI定位，并生成校准的共形点击区域，以支持更安全的动作选择。
      尚未覆盖: 仅在单步定位而非多步轨迹上评估；跨模型和跨界面不确定性迁移弱，分布偏移下覆盖度会下降。
    - 路线: 动态与视频引导的界面落地
      解决的问题: 通过动态环境基准和任务感知关键帧提取，处理操作间内容变化和视频条件任务。
      尚未覆盖: 当前智能体缺乏观察控制；证据限于短视频或选定视频引导任务，通用动态界面问题仍开放。
    共识:
    - GUI/计算机使用智能体大多是基于视觉语言模型的系统，负责对屏幕观测进行动作落地，并以任务成功率或相关指标进行评测。
    - 细粒度指标可暴露总体Pass@1所掩盖的能力差异，例如子目标完成或观察行为差异。
    - 人工标注被视为瓶颈，研究路线转向弱监督、合成任务生成或冻结模型适配。
    - 方法评测越来越多地与可执行、可验证环境绑定，而非仅依赖静态语言判断或孤立视觉判断。
    - 许多报告未提供转移和鲁棒性细节，使跨基准泛化成为验证缺口。
    分歧:
    - 研究目标不同：有的优化执行harness以改进冻结系统，有的通过弱监督或在线RL训练模型权重。
    - 交互覆盖不同：桌面GUI、GUI+CLI、拖拽、动态短视频和视频引导任务被当作不同证据场景。
    - 评测重点不同：分别以总体任务成功、细粒度子目标评分、成本-准确率和校准/覆盖率为主要信号。
    - 监督假设不同：一条路线使用海量未标注截图，另一条合成可验证RL任务，还有路线不做训练。
    - 证据粒度不同：部分结果来自单步定位，部分来自多步智能体轨迹，结论可推广范围因此不同。
    开放问题:
    - 能否学习或通过harness工程获得观察控制能力，以减少动态界面中的过度观察与观察不足？
    - 所报告的计算机使用改进中，有多少来自骨干模型、训练数据、奖励验证、规划/动作接口或执行harness？
    - 拖拽、视频引导和桌面智能体的增益能否在操作系统、应用和交互模态之间迁移？
    - 不确定性量化能否在模型类别变化、校准-测试分布偏移下保持稳定，并支撑多步计算机使用部署？
    - 当前基准之外还存在哪些失败模式，尤其是动态界面、GUI+CLI工作流和真实任务变化下的失败模式？
