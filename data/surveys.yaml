    - 路线: 真实操作系统与桌面任务基准
      解决的问题: 构建多应用、多步骤的共享 GUI 任务，并用确定性或规则化检查让计算机使用代理的性能可比。
      尚未覆盖: 现有证据集中在 macOS 桌面、OSWorld、OSWorld-Verified、ScienceBoard、WindowsAgentArena
        等特定套件；跨套件稳定性和动态界面覆盖仍不确定。
    - 路线: 动态与视频引导界面基准
