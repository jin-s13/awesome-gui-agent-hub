  related_work_outline_zh:
  - 主流方向：构建真实多应用 GUI 代理基准，并通过多模态技能库、历史感知规划与执行优化提升代理性能。
  - 研究共性：所有工作均依赖视觉语言模型，在真实或模拟 GUI 环境中评估，衡量任务完成准确率与效率。
  - 关键差异：部分聚焦静态点击任务，另一些处理动态界面、拖拽交互或视频引导任务；效率提升手段从技能检索到程序重放各异。
  - 趋势演进：在 2024–2026 年前沿窗口内，研究从简单点击基准快速转向复杂、动态、特定领域场景（短视频、欺诈检测、macOS 自动化）。
