  literature_review:
    line_of_work_matrix:
    - line: Domain-specific GUI agent benchmarking
      what_it_solves: Evaluating agent performance on real-world tasks with distinct
        interaction modalities (drag, video, SMS fraud) and application contexts (macOS,
        short-video platforms, fraud detection).
      what_remains_open: Generalization across benchmarks, coverage of rare error
        modes, and alignment of evaluation metrics with real-world usability.
