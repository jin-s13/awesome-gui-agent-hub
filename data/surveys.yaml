  related_work_outline_zh:
  - 主流方向：构建更真实的 GUI 与计算机使用基准，覆盖 macOS 桌面、动态短视频、拖拽交互和视频引导任务，并以细粒度和确定性评分超越简单通过率。
  - 研究共性：多数工作将任务/数据集或任务合成工件与压力指标结合，如子目标评分、成本-准确性、不确定性排序或拖拽定位。
  - 关键差异：研究在单步定位与多步轨迹、人工标注/弱监督/可验证合成/技能库、总体成功率与风险/校准指标之间存在不同侧重。
  - 趋势演进：在 2024–2026 前沿窗口内，评测正从静态点击界面转向动态、多模态、跨应用、交互式和成本/不确定性感知的协议。
