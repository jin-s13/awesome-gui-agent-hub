  related_work_outline:
  - 'Mainstream direction: The current frontier is building GUI/computer-use benchmarks
    that move beyond static click-only tasks toward real desktop OS, dynamic short-video/live
    interfaces, video-guided workflows, drag manipulation, and uncertainty-aware evaluation.'
  - 'Shared research pattern: Papers construct shared task suites, datasets, or controlled
    environments; evaluate frontier vision-language agents against human or rule-based
    references; and report fine-grained metrics rather than only aggregate success.'
  - 'Key differences: They differ in interaction surface (desktop GUI+CLI, dynamic
    browser content, drag actions, single-step grounding), supervision source (verifiable
    RL tasks, weakly labeled screenshots, multimodal skill artifacts), and evaluation
    target (task success, observation efficiency, uncertainty transfer, drag grounding).'
  - 'Trend evolution: Available years are 2024-2026 and the top evidence clusters
    in 2026; within this current frontier, evaluation is expanding from static click/tap
    automation to dynamic, multimodal, long-horizon, and diagnostic settings while
    agent methods are co-trained or fine-tuned against these benchmarks.'
  - 'Open questions: Cross-domain generalization, long-horizon coverage, metric alignment
    with deployment reliability, stability across frameworks and compute budgets,
    and public artifact/verification details for several systems remain verification
    gaps.'
  related_work_outline_zh:
  - 主流方向：当前前沿正在构建超越静态点击任务的GUI/计算机使用基准，覆盖真实桌面OS、动态短视频/实时界面、视频引导流程、拖拽操作和不确定性感知评测。
  - 研究共性：论文构建共享任务套件、数据集或受控环境；用前沿视觉语言代理与人类或规则基线对比；在总体成功率之外报告细粒度指标。
  - 关键差异：差异体现在交互面（桌面GUI+CLI、动态浏览器内容、拖拽动作、单步定位）、监督来源（可验证RL任务、弱标注截图、多模态技能工件）和评测目标（任务成功、观察效率、不确定性迁移、拖拽定位）。
  - 趋势演进：证据年份集中在2026年，属于当前前沿内演进；从静态点击/点按自动化扩展至动态、多模态、长程与诊断性设置，代理方法同时在基准上联合训练或微调。
  - 开放问题：跨域泛化、长程覆盖、指标与部署可靠性的一致性、框架与算力预算下结论稳定性，以及若干系统的公开工件和可验证细节仍属证据缺口。
  literature_review:
    line_of_work_matrix:
    - line: Realistic GUI/computer-use task suites and datasets (e.g., MacAgentBench,
        LivingScreen, DragOn, VG-GUIBench)
      what_it_solves: Creates shared tasks and environments that make agent capabilities
        comparable across desktop, browser, dynamic content, video-guided, and drag-based
        interactions.
      what_remains_open: Whether these task distributions cover long-horizon multi-application
        workflows, unseen OS/app configurations, and dynamic-interface variants; the
        provided evidence lacks full limitation or artifact detail for some suites.
    - line: Fine-grained metrics and stress-test design (e.g., multi-checkpoint scoring,
        cost-accuracy, uncertainty quantification, drag grounding evaluation)
      what_it_solves: 'Probes agent behavior beyond aggregate success: sub-goal completion,
        observation efficiency, selective uncertainty ranking transfer, conformal
        click coverage, and interaction-type-specific grounding.'
      what_remains_open: Alignment between these diagnostic metrics and downstream
        deployment reliability is not established; uncertainty ranking transfers weakly
        across model classes and interfaces, and conformal coverage degrades under
        distribution shift.
    - line: Benchmark-driven baselines, training, and reporting (e.g., VISUALSKILL,
        ScaleCUA, GUICrafter using OSWorld, ScienceBoard, CUA-World, OSExpert-Eval)
      what_it_solves: Makes progress comparable by using shared benchmark scores,
        rule-based or verifiable rewards, and common baselines for skill libraries,
        online RL, and weak supervision.
      what_remains_open: Benchmark conclusion stability across implementations, frameworks,
        and compute budgets is mostly untested; several systems report strong scores
        but the provided evidence does not show full artifact or reporting details.
    consensus:
    - Aggregate task success alone is insufficient; fine-grained sub-goal, efficiency,
      or diagnostic metrics reveal meaningful model differences.
    - Realistic, application-grounded environments are favored over synthetic static
      settings, with rule-based or human references used for scoring.
    - Frontier visual-language agents still fall below reliable human-level performance
      on dynamic or long-horizon computer-use tasks, especially in observation control
      and uncertainty transfer.
    disagreements:
    - 'Interaction scope: some benchmark static desktop or drag actions, while others
      target dynamic living-screen content or video-guided sequences.'
    - 'Supervision and data: some use verifiable rule-based task synthesis, others
      use massive unannotated screenshots, and others use multimodal skill artifacts.'
    - 'Evaluation target: some focus on task success and sub-goal progress, others
      on observation cost-accuracy, single-step grounding uncertainty, or drag completion.'
    open_questions:
    - Do current GUI/computer-use benchmark tasks transfer to unseen OS/app configurations
      and long-horizon multi-application workflows?
    - Which fine-grained metrics best predict deployment reliability when uncertainty
      ranking transfer is weak across model classes and interfaces?
    - Can verifiable task synthesis and weak-supervision pipelines produce stable
      benchmark conclusions across frameworks and compute budgets without overfitting
      benchmark-specific reward signals?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 真实GUI/计算机使用任务套件与数据集（如 MacAgentBench、LivingScreen、DragOn、VG-GUIBench）
      解决的问题: 构建共享任务和环境，使桌面、浏览器、动态内容、视频引导和拖拽交互中的代理能力具有可比性。
      尚未覆盖: 这些任务分布是否覆盖长程多应用工作流、未见过的OS/应用配置及动态界面变体；部分套件在证据中缺少完整局限或工件细节。
    - 路线: 细粒度指标与压力测试设计（如多检查点评分、成本-准确性、不确定性量化、拖拽定位评测）
      解决的问题: 在总体成功率之外检验子目标完成、观察效率、选择性不确定性排名迁移、共形点击覆盖和交互类型定位。
      尚未覆盖: 这些诊断指标与下游部署可靠性的对齐尚未建立；不确定性排名跨模型类别和接口迁移较弱，分布偏移下覆盖率下降。
    - 路线: 基准驱动的基线、训练与报告（如 VISUALSKILL、ScaleCUA、GUICrafter 使用 OSWorld、ScienceBoard、CUA-World、OSExpert-Eval）
      解决的问题: 通过共享基准分数、规则或可验证奖励和共同基线，使技能库、在线RL和弱监督的进展可比。
      尚未覆盖: 基准结论在实现、框架和算力预算下的稳定性大多未被检验；若干系统报告强结果，但证据中未显示完整工件或报告细节。
    共识:
    - 领域一致认为仅看总体任务成功率不足；细粒度子目标、效率或诊断指标能揭示模型差异。
    - 更偏好真实、应用驱动的环境，并用规则基线或人工参考进行评分。
    - 前沿视觉语言代理在动态或长程计算机使用任务上仍低于可靠的人类水平，尤其在观察控制和不确定性迁移方面。
    分歧:
    - 交互范围：有的评估静态桌面或拖拽动作，有的针对动态短视频/实时界面或视频引导序列。
    - 监督与数据：有的使用可验证规则任务合成，有的使用海量未标注截图，有的使用多模态技能工件。
    - 评测目标：有的关注任务成功和子目标进展，有的关注观察成本-准确性、单步定位不确定性或拖拽完成情况。
    开放问题:
