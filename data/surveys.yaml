  - 'Mainstream direction: Building domain-specific benchmarks (desktop, dynamic video,
    drag, fraud detection) and developing augmentation methods (skill libraries, replay
    compilation, online critics) to improve GUI agent capability and efficiency in
    real applications.'
  - 'Shared research pattern: Most works construct a new benchmark to expose agent
    weaknesses in a specific interaction or task, then propose a targeted improvement
    evaluated on that same benchmark, but cross-benchmark generalization is rarely
    examined.'
  - 'Key differences: Interaction primitives (click, drag, dynamic content, video-guided),
    augmentation strategies (predefined multimodal skills, run compilation, history-aware
    critique), evaluation protocols (rule-based, model-based, cost-accuracy), and
    application domains (desktop, mobile, web, short-video, fraud detection).'
  - 'Trend evolution: Within the 2024–2026 frontier, the focus shifts from general
    GUI benchmarks to fine-grained, application-specific evaluations, with emerging
    work on efficiency (replay) and error correction (critics), though long-term evolution
    is not yet visible from this narrow window.'
  - 'Open questions: Can augmentation methods transfer across benchmarks and interaction
    types? How to optimize observation control and termination decisions? What is
    the maintenance cost and cross-app generality of multimodal skill libraries? How
    to guarantee safety and reliability in real deployment?'
  related_work_outline_zh:
  - 主流方向：构建面向特定应用场景（桌面、动态视频、拖拽、欺诈检测）的基准，并开发技能库、重放编译、在线批评等增强方法，提升GUI代理在真实应用中的能力与效率。
  - 研究共性：多数工作先构建新基准以暴露代理在特定交互或任务上的不足，再提出针对性改进并在同一基准上验证，但跨基准泛化很少被检验。
  - 关键差异：交互原语（点击、拖拽、动态、视频引导）、增强策略（预定义多模态技能、运行编译、历史感知批评）、评估协议（规则、模型、成本-准确性）和应用领域（桌面、移动、网页、短视频、欺诈）不同。
  - 趋势演进：在2024-2026年这一前沿窗口中，研究从通用GUI基准转向细粒度、面向特定应用的评估，并开始出现效率提升（重放）和错误修正（批评）等工作，但长期趋势尚不清晰。
  - 开放问题：增强方法能否跨基准和交互类型迁移？如何优化观察控制与终止决策？多模态技能库的维护成本和跨应用泛化性如何？真实部署中的安全与可靠性如何保证？
  literature_review:
    line_of_work_matrix:
    - line: Domain-specific GUI agent benchmarking
      what_it_solves: Evaluates fine-grained capabilities of GUI agents in real application
        scenarios (desktop, dynamic video, drag, fraud detection) and reveals deficiencies
        such as poor observation control, low benign recall, and weak multi-app task
        completion.
      what_remains_open: Lack of unified evaluation protocols across benchmarks; augmentation
        methods are tested only on isolated benchmarks, leaving cross-benchmark generality
        unknown; some benchmarks strip real-world cues (e.g., URL reputation) so true
        deployment performance is unverified.
    - line: Agent capability augmentation via knowledge and memory
      what_it_solves: Improves agent success rate, execution efficiency, or planning
        robustness by injecting predefined multimodal skills, compiling successful
        runs into replayable state machines, or adding history-aware and visually
        grounded critics.
      what_remains_open: These augmentations are environment- or task-specific; evidence
        of cross-domain transfer is missing; the cost of building and updating skill
        libraries, the generalization of compiled programs, and the bias in critic
        training data remain unexplored.
    consensus:
    - GUI agents still fall far short of human performance in real applications, requiring
      visual information, historical context, and fine-grained feedback for improvement.
    - Evaluation metrics must move beyond task-level success rates to include sub-goal
      completion, cost-accuracy, and execution efficiency to capture nuanced agent
      behavior.
    disagreements:
    - 'Focus differs: some works target interaction primitives (drag vs. click vs.
      dynamic content), while others target task types (office automation vs. fraud
      detection vs. video-guided tasks).'
    - 'Improvement strategies diverge: offline knowledge injection through skill libraries
      versus online learning from successful runs (replay compilation) or real-time
      critique.'
    - Evaluation environments vary from real macOS desktops and mobile devices to
      browser-based simulators, affecting the realism and reproducibility of the results.
    open_questions:
    - Can augmentation methods such as skill libraries, replay compilation, and online
      critics transfer across different benchmarks and interaction types?
    - How can observation control (when to stop observing, when to fallback) be optimized,
      possibly through meta-learning or reinforcement learning, rather than hard-coded
      heuristics?
    - Is automatic construction and cross-application generalization of multimodal
      skill libraries feasible without extensive manual authoring?
    - In safety-critical applications like fraud detection, how can benign recall
      be improved without relying on reputation shortcuts that are artificially removed
      in current benchmarks?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 领域特定GUI代理基准构建
      解决的问题: 评估GUI代理在真实应用场景（桌面、动态视频、拖拽、欺诈检测）中的细粒度能力，揭示观察控制差、良性召回低、多应用任务完成弱等不足。
      尚未覆盖: 基准间缺乏统一评估协议；增强方法仅在孤立基准上测试，跨基准泛化性未知；部分基准（如欺诈检测）移除了现实中的信誉信号，真实部署表现未经验证。
    - 路线: 基于知识与记忆的代理能力增强
      解决的问题: 通过注入预定义多模态技能、将成功运行编译为可重放状态机、或增加历史感知与视觉基础的批评模型，提升代理成功率、执行效率或规划稳健性。
      尚未覆盖: 这些增强与特定环境或任务深度绑定，缺乏跨领域迁移证据；技能库的构建与更新成本、编译程序的泛化能力、批评模型的训练数据偏差等依然未被探索。
    共识:
    - GUI代理在真实应用中的表现仍远未达到人类水平，需要结合视觉信息、历史上下文和细粒度反馈来改进。
    - 评估指标应从简单的任务成功率扩展到子目标完成度、成本-准确性以及执行效率，以捕捉代理行为的细微差别。
    分歧:
    - 关注点不同：有的聚焦交互原语（拖拽 vs. 点击 vs. 动态内容），有的聚焦任务类型（办公自动化 vs. 欺诈检测 vs. 视频引导任务）。
    - 改进策略不同：通过技能库进行离线知识注入，与基于成功运行进行在线学习（重放编译）或实时批评形成对比。
    - 评估环境不同：从真实macOS桌面、移动设备到基于浏览器的模拟器，影响了结果的真实性和可复现性。
    开放问题:
    - 技能库、重放编译和在线批评等增强方法能否跨不同基准和交互类型迁移？
    - 观察控制（何时停止观察、何时回退）能否通过元学习或强化学习优化，而非依赖硬编码启发式？
    - 多模态技能库的自动构建和跨应用泛化在缺乏大量人工编写的情况下是否可行？
    - 在欺诈检测等安全关键应用中，如何在不依赖当前基准中被人为移除的信誉捷径的情况下，提高良性召回率？
