  literature_review:
    line_of_work_matrix:
    - line: Real-world GUI task and interaction benchmarking
      what_it_solves: Defines task suites and metrics for static multi-app desktop,
        dynamic short-video, and drag-based GUI interactions.
      what_remains_open: Coverage beyond tested platforms and whether fine-grained
        metrics correspond to deployed failure reduction.
    - line: Data-efficient and verifiable training pipelines
      what_it_solves: Reduces human annotation dependence through unannotated screenshots,
        synthetic verifiable tasks, or online RL for GUI grounding.
      what_remains_open: Cross-platform transfer and whether training gains preserve
        reliability and safety beyond OSWorld/ScienceBoard-style benches.
    - line: Structured skill and context organization
      what_it_solves: Compacts long-horizon history or reusable multimodal procedures
        to improve multi-step agent performance.
      what_remains_open: How context/skill selection affects failure modes and whether
        visual artifacts transfer across interfaces.
    - line: Uncertainty and reliability framing for grounding
      what_it_solves: Measures post-hoc confidence and constructs calibrated spatial
        regions for GUI grounding predictions.
      what_remains_open: Multi-step trajectory uncertainty and transfer across model
        tiers/interfaces remain weakly supported.
    consensus:
    - Real-world GUI evaluation is moving toward multi-application, long-horizon,
      and dynamic-interface settings rather than single-step controlled tasks.
    - Fine-grained metrics such as sub-goal completion, cost-accuracy, and calibrated
      uncertainty are treated as more informative than success-only scores.
    - Structured artifacts—skills, context fields, verifiable tasks, uncertainty regions—consistently
      improve over passive or text-only baselines in the evaluated settings.
    - Training approaches increasingly use weak supervision, synthetic verified tasks,
      or online RL to reduce annotation cost.
    disagreements:
    - 'Interaction assumptions differ: dynamic living-screen tasks, drag-only interactions,
      hybrid GUI+CLI workflows, and long-horizon mobile tasks impose different observation
      and action models.'
    - 'Supervision and optimization differ: unannotated screenshot pretraining with
      small RL calibration versus verifiable synthetic-task online RL versus supervised
      fine-tuning on curated trajectory data.'
    - 'Reliability emphasis differs: single-step post-hoc uncertainty calibration
      versus multi-step observation control versus proactive context management.'
    - Evaluation scope differs by environment, from desktop OS and short-video platforms
      to mobile, with different metrics and human baselines.
    open_questions:
    - Does strong within-model UQ ranking transfer in single-step grounding hold for
      multi-step agent trajectories and interface changes?
    - Can synthetic verifiable RL tasks generalize across operating systems, applications,
      and dynamic content, or are gains benchmark-specific?
    - How should observation control be formalized for living-screen-native agents
      to avoid over- and under-observation?
    - Do fine-grained benchmark improvements predict safer or more reliable deployed
      GUI agents?
    - Several top papers leave limitations blank, so negative results and boundary
      conditions may be underreported.
