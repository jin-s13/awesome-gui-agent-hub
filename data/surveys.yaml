  related_work_outline:
  - 'Mainstream direction: Building application-specific benchmarks and methods for
    GUI agents across desktop, mobile, web, and short-video platforms, with emphasis
    on realistic tasks, multimodal grounding, and efficiency.'
  - 'Shared research pattern: Designing task suites that capture real-world interaction
    complexity (dragging, dynamic content, video-guided tasks) and improving agent
    performance through skill libraries, history-aware critics, or compilation into
    reusable programs.'
  - 'Key differences: Interaction modality (click-only vs. drag vs. observation control),
    skill representation (text-only vs. multimodal with visual figures), efficiency
    approach (runtime compilation vs. skill retrieval), and evaluation granularity
    (pass/fail vs. sub-goal scoring vs. cost-accuracy).'
  - 'Trend evolution: From 2024 to 2026, the field moves from static click-based benchmarks
    to dynamic, multimodal, and efficiency-oriented tasks, with growing attention
    to fine-grained evaluation and real-world application robustness; the available
    evidence concentrates on the 2026 frontier.'
  - 'Open questions: How well do agents generalize across applications and platforms?
    Can observation control and dynamic content handling be reliably learned? What
    are the safety and verification gaps in real-world deployment, and how to create
    unified cross-domain benchmarks?'
  related_work_outline_zh:
  - 主流方向：针对桌面、移动、网页和短视频等平台构建面向应用的GUI智能体基准和方法，强调真实任务、多模态接地和效率。
  - 研究共性：设计捕捉真实交互复杂性（拖拽、动态内容、视频引导任务）的任务集，并通过技能库、历史感知评判或编译为可重用程序来提升智能体性能。
  - 关键差异：交互模态（仅点击 vs 拖拽 vs 观察控制）、技能表示（纯文本 vs 多模态含视觉图形）、效率策略（运行时编译 vs 技能检索）和评估粒度（通过/失败
    vs 子目标评分 vs 成本-准确性）。
  - 趋势演进：2024至2026年，领域从静态点击基准转向动态、多模态和效率导向的任务，细粒度评估和真实应用鲁棒性日益受到关注；现有证据集中于2026年前沿。
  - 开放问题：智能体跨应用和跨平台的泛化能力如何？观察控制和动态内容处理能否可靠学习？实际部署中的安全性和验证缺口，以及如何创建统一的跨领域基准？
  literature_review:
    line_of_work_matrix:
    - line: Domain-specific benchmark construction
      what_it_solves: Creating realistic evaluation suites for GUI agents on macOS,
        short-video platforms, drag-based interfaces, video-guided tasks, and fraud
        detection, covering diverse interaction modes and application contexts.
      what_remains_open: Benchmarks are limited to specific platforms and interaction
        types; cross-domain generalization and coverage of all dynamic interface types
        are not yet achieved; unified metrics across benchmarks are missing.
    - line: Skill and knowledge reuse for agent efficiency
      what_it_solves: Enabling agents to reuse successful task executions via compiled
        programs (state machines) or hierarchical multimodal skill libraries, reducing
        per-step language model calls and speeding up repeated tasks.
      what_remains_open: Whether accumulated skills transfer across applications or
        models; store-time verification and fallback robustness in open-world settings;
        scalability of skill libraries to diverse tasks.
    - line: History-aware and visually grounded execution correction
      what_it_solves: Improving agent planning and execution by summarizing past actions
        into macro-action history and verifying proposed actions against the current
        screen to intercept errors before execution.
      what_remains_open: Training data dependency on real GUI trajectories; generalization
        to unseen environments; integration with other efficiency methods; effect
        on safety-critical applications.
    - line: Keyframe extraction and observation control for dynamic content
      what_it_solves: Selecting representative frames from videos or dynamic interfaces
        to reduce information overload and improve task accuracy and cost-efficiency.
      what_remains_open: Balancing observation frequency and task performance; adaptability
        to highly interactive or fast-changing content; evaluation across broader
        dynamic domains beyond short videos.
    consensus:
    - GUI agents require multimodal perception (screen pixels, visual elements) and
      benefit from retaining visual information in skill representations.
    - Real-world applications demand benchmarks beyond simple click-based tasks, including
      drag, video-guided, and dynamic content interactions.
    - 'Efficiency matters: reducing per-step model calls or leveraging historical
      interactions can significantly speed up task execution without sacrificing accuracy.'
    - Fine-grained evaluation (sub-goal scoring, cost-accuracy, checkpoint verification)
      reveals performance differences that pass/fail metrics miss.
    disagreements:
    - 'How to represent reusable knowledge: some works compile agent runs into state
      machines, while others build hierarchical multimodal skill libraries with visual
      figures.'
    - 'What interaction modalities are critical: drag-based interaction is explicitly
      addressed in one benchmark, while others assume click-only or minimal observation
      control; the importance of full observation control is debated.'
    - 'Evaluation scope: some benchmarks focus on platform-specific realism (macOS,
      short-video), others on controlled adversarial scenarios (fraud detection without
      URL cues), making it hard to compare agent capabilities across studies.'
    - Whether efficiency gains require storing past experiences (PreAct) or can be
      achieved through pre-built skills (VISUALSKILL), and the trade-offs between
      storage, retrieval cost, and generalization.
    open_questions:
    - Can agents trained or fine-tuned on one GUI platform (e.g., macOS desktop) transfer
      their skills to mobile or web environments without extensive retraining?
    - How to design evaluation protocols that capture agent safety, robustness to
      adversarial inputs, and failure recovery in open-ended real-world tasks?
    - What is the optimal balance between observation frequency and task completion
      in dynamic, fast-changing interfaces, and can agents learn to control their
      own observation cadence?
    - Are current skill reuse and compilation methods effective when the underlying
      application UI or workflow changes, and how to detect and adapt to such changes?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 领域特定基准构建
      解决的问题: 为macOS、短视频平台、拖拽界面、视频引导任务和欺诈检测构建真实的GUI智能体评估套件，覆盖多样化的交互模式和应用场景。
      尚未覆盖: 基准局限于特定平台和交互类型；跨领域泛化和对所有动态界面类型的覆盖尚未实现；缺乏跨基准的统一度量。
    - 路线: 面向智能体效率的技能与知识重用
      解决的问题: 通过编译为可重用程序（状态机）或分层多模态技能库，使智能体能够复用成功的任务执行，减少每步语言模型调用并加速重复任务。
