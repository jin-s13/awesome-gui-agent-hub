  literature_review:
    line_of_work_matrix:
    - line: Real-world GUI benchmark and interaction suites
      what_it_solves: Defines task sets and metrics for desktop, drag, dynamic short-video,
        and video-guided GUI interactions to expose failure modes beyond final success.
      what_remains_open: Coverage is platform- or interaction-specific; dynamic environments
        still exceed model cost-accuracy, and some benchmarks lack clear code, data,
        or limitation evidence.
    - line: Skill, memory, and replay reuse for computer-use agents
      what_it_solves: Improves accuracy or latency by retrieving multimodal skills
        or compiling successful runs into screen-checked state machines for repeated
        tasks.
      what_remains_open: Transfer across applications, platforms, and task variants,
        plus robustness under screen-state mismatch, are not established; visual,
        text, and programmatic artifacts lack unified comparison.
    - line: End-to-end model training and unified action spaces for GUI agents
      what_it_solves: Trains multimodal agents to generate GUI actions, and in some
        cases unifies GUI and code execution, reducing dependence on brittle tool
        composition.
      what_remains_open: Real-world generality beyond reported benchmarks, cross-platform
        transfer, and the boundary between unified training and modular tool or skill
        composition remain open.
    - line: Observation and interaction grounding beyond click
      what_it_solves: Represents drag operations, dynamic content, and video-guided
        tasks using datasets, keyframes, or browser-based dynamic environments to
        improve visual grounding and action coverage.
      what_remains_open: Current agents over- or under-observe dynamic screens; keyframe
        extraction gains are shown mainly on VideoQA or agentic benchmarks, not broad
        professional applications.
    consensus:
    - Fine-grained evaluation beyond final success is necessary because agents with
      similar pass rates differ in sub-goal or interaction-level behavior.
    - Reusable task artifacts, whether multimodal skills, compiled state-machine programs,
      or extracted keyframes, improve accuracy or latency over one-shot generation.
    - Current frontier agents still lack robust observation and interaction control
      for dynamic screens, drag actions, and video-guided tasks.
    - End-to-end training or unified action spaces can improve GUI performance compared
      with simple tool-composition or no-skill baselines.
    disagreements:
    - Some methods store multimodal visual-plus-text skills, while others compile
      successful runs into executable state machines or extract task-relevant keyframes;
      these reflect different assumptions about which artifact should persist.
    - Some approaches adapt through end-to-end training and online reinforcement learning,
      while others adapt at inference via retrieval or replay, implying different
      supervision costs and generalization expectations.
    - 'Evaluation settings differ substantially: real desktop GUI+CLI tasks, browser-based
      short-video dynamics, drag interactions, video-guided tasks, and cross-platform
      navigation or grounding benchmarks.'
    - 'Success criteria differ: final success, fine-grained checkpoints, cost-accuracy
      or information efficiency, latency speedup, and relative benchmark gains all
      complicate direct comparison.'
    - 'Action-space design differs: some methods output GUI clicks or coordinates,
      others unify GUI actions with code execution, and others focus on drag or observation
      control rather than click-only actions.'
    open_questions:
    - How well do skill libraries and compiled replay programs transfer across applications,
      operating systems, and changed screen states without brittle fallback?
    - Can agents learn observation control policies that reduce over- and under-observation
      on dynamic short-video or live interfaces?
    - Do improvements on video-guided keyframes, drag grounding, and OS-level benchmarks
      translate to professional or office workflows outside the evaluated platforms?
    - What is the right boundary between end-to-end trained agents and modular retrieval
      or replay components when action spaces include both GUI manipulation and code
      execution?
    - Several top papers lack explicit limitation sections or code and dataset signals,
      so reproducibility and negative results remain verification gaps.
  literature_review_zh:
    研究路线矩阵:
    - 路线: 真实GUI基准与交互评测套件
      解决的问题: 定义桌面、拖拽、动态短视频和视频引导GUI任务及指标，暴露最终成功率之外的失败模式。
      尚未覆盖: 覆盖通常局限于特定平台或交互类型；动态环境中的成本精度仍未达到人类水平，部分基准缺少代码、数据或局限性说明。
    - 路线: 面向电脑使用智能体的技能、记忆与重放复用
      解决的问题: 通过检索多模态技能或将成功运行编译为带屏幕检查的状态机，提升准确率或重复任务执行速度。
      尚未覆盖: 跨应用、跨平台和任务变体的迁移，以及屏幕状态不匹配时的鲁棒性尚未建立；视觉、文本和程序化工件缺乏统一比较。
    - 路线: 端到端模型训练与统一动作空间
      解决的问题: 训练多模态智能体生成GUI动作，部分方法统一GUI与代码执行，减少对脆弱工具组合的依赖。
      尚未覆盖: 除了报告基准之外的真实泛化、跨平台迁移，以及统一训练与模块化工具或技能组合之间的边界仍不清晰。
    - 路线: 点击之外的观察与交互接地
      解决的问题: 用数据集、关键帧或动态浏览器环境表示拖拽、动态内容和视频引导任务，以改善视觉接地和动作覆盖。
      尚未覆盖: 动态屏幕上的过度观察和观察不足问题未解决；关键帧提取收益主要在VideoQA或agentic基准中展示，缺乏广泛专业应用验证。
    共识:
    - 仅看最终成功率不够，需要通过子目标完成度、成本效率或信息效率等更细粒度指标反映行为差异。
    - 可复用任务工件，如多模态技能、编译后的状态机或关键帧，相比一次性生成能提升准确率或速度。
    - 当前前沿智能体在动态屏幕、拖拽操作和视频引导任务中的观察与交互控制仍然不足。
    - 端到端训练或统一动作空间相对简单工具组合或无技能基线能带来GUI表现提升。
    分歧:
    - 在应持久化什么工件上存在分歧：有的保留视觉加文本技能，有的编译为状态机程序，有的提取任务相关关键帧。
    - 适应方式不同：有的通过端到端训练和在线强化学习，有的在推理时检索或重放，监督成本和泛化预期不同。
    - 评测场景不同：真实桌面GUI与CLI、浏览器动态短视频、拖拽交互、视频引导任务以及多平台导航与接地基准各自强调不同约束。
    - 成功标准不同：最终成功率、细粒度检查点、成本精度、延迟加速或相对基准提升，导致直接比较困难。
    - 动作空间设计不同：有的输出GUI点击或坐标，有的统一GUI与代码执行，有的专门处理拖拽或观察控制。
    开放问题:
    - 技能库和编译后的重放程序在跨应用、跨操作系统和屏幕状态变化时能否稳健迁移，而不依赖脆弱的回退？
    - 智能体能否学习观察控制策略，在动态短视频或实时界面上避免过度观察和观察不足？
    - 视频引导关键帧、拖拽接地和操作系统级基准上的收益是否转化为真实办公和专业工作流中的能力？
    - 当动作空间同时包含GUI操作和代码执行时，端到端训练与模块化检索或重放之间的边界应如何划定？
    - 若干论文缺少明确局限性或代码、数据集信号，因此可复现性和负面结果仍是证据缺口。
