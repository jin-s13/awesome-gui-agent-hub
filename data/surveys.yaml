    研究路线矩阵:
    - 路线: 领域特定GUI代理基准测试
      解决的问题: 捕捉现有通用基准忽略的多样化真实应用挑战，包括macOS桌面工作流、短视频平台动态、拖拽交互、视频引导任务和短信到网页欺诈。
      尚未覆盖: 覆盖范围局限于特定平台或交互类型；性能远未达到人类水平，尤其在动态内容和良性欺诈案例召回上；评估指标未跨任务标准化。
    - 路线: 通过多模态技能、历史感知和编译重放增强代理能力
      解决的问题: 通过配备分层多模态技能工件、历史感知视觉评判和无需每步模型调用的状态机重放程序，提高代理的准确性、速度和规划深度。
      尚未覆盖: 这些方法能否在不同代理骨干和基准间迁移，缺乏证据；编译重放可能在新任务探索时失败；技能库设计选择对泛化性的影响未测试。
    共识:
    - 所有工作都依赖基于多模态基础模型（VLM）的代理，通过解释屏幕截图生成相应动作。
    - 评估在模拟真实应用的任务集上进行，揭示代理在多步规划、观察控制和动态或非点击交互方面存在困难。
    - 普遍认为当前代理缺乏稳健的观察调节能力，导致过度观察或观察不足，并在成本-准确性指标上表现不佳。
    分歧:
    - 交互粒度：部分工作聚焦传统点击任务，另一些扩展至拖拽操作、视频引导导航和操作间内容变化的动态界面。
    - 成功度量：各工作采用不同指标，如一次通过率、多检查点子目标完成度或成本-准确性，难以直接比较。
    - 优化目标：PreAct通过编译重放优先提升速度，VISUALSKILL和HiViG通过技能复用和历史感知评判追求准确性，TASKER则通过更好的关键帧选择改善输入质量。
    开放问题:
    - 当底层代理架构改变时，某个基准（如macOS桌面）上的改进如何迁移到另一个基准（如短视频平台）？
    - 代理能否在没有人工指定阈值的情况下，根据任务复杂度自动调整观察频率？
    - 在何种条件下，来自成功运行的编译重放会在略有不同的任务实例上失败，回退机制能否优雅恢复？
