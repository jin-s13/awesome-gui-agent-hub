    - 路线: 弱监督或可验证监督下的数据与强化学习扩展
      解决的问题: 利用未标注截图加 RL 校准，或可验证生成任务加在线 RL，降低标注依赖并提升开源 GUI 代理成绩。
      尚未覆盖: 证据集中在 OSWorld/ScienceBoard 及相近模型族；任务合成有效性和对未知界面的迁移仍缺少直接验证。
    - 路线: GUI 定位的不确定性量化与空间安全
      解决的问题: 对后验不确定性方法和共形点击区域进行基准测试，识别稳定的 UQ 方法族及校准敏感的半径收缩。
      尚未覆盖: 仅覆盖单步定位，不能代表多步代理轨迹；跨模型/界面迁移弱，分布偏移下覆盖度下降。
    共识:
    - 评测正从总体成功率转向细粒度信号，如子目标完成、交互特定定位、成本-准确率和不确定性校准。
    - GUI 代理提升不再只依赖更大骨干模型；外部技能、执行框架编辑、可验证或弱监督数据以及微调提供互补增益。
    - 视觉截图证据和空间定位对动作验证与 UI 元素识别至关重要。
    - 当前证据一致显示观察控制、跨模型迁移和超出测试平台的泛化仍存在明显弱点。
    分歧:
    - 优化层级不同：后验不确定性校准、执行框架层编辑、技能检索、在线 RL 或弱监督微调分别在不同位置介入。
    - 监督假设不同：人工编写的多模态技能、未标注截图、可验证合成任务和标注基准数据带来不同的成本与覆盖权衡。
    - 评测目标不同：静态桌面 GUI+CLI 任务、动态内容变化界面、拖拽交互和多步 OS 任务不可直接比较。
    - 迁移结论不同：部分方法展示冻结执行框架的跨基准迁移，而不确定性排序跨模型类别和界面迁移较弱。
