  related_work_outline_zh:
  - 主流方向：面向真实应用的 GUI 智能体评测与效率层，覆盖桌面、移动/网页、动态视频和拖拽任务，强调细粒度评分与可复用行为。
  - 研究共性：论文通常引入新任务或交互缺口，评估前沿 GUI 智能体，发现子目标完成、观察控制或非点击交互的不足，再提出结构化技能、回放记忆、关键帧提取或模型训练来弥补。
  - 关键差异：目标平台与界面、评测指标（任务成功率、成本-准确率、grounding/导航、子目标完成）、改进方式（外部记忆、模型训练、输入条件化）以及代码/数据透明度不同。
  - 趋势演进：在 2024-2026 前沿窗口内，研究从点击式静态任务转向动态视频、视频引导、拖拽和桌面 CLI/GUI 覆盖，并从单次模型评测转向可复用技能、可回放执行轨迹和扩散式
    GUI 智能体。
  - 开放问题：跨域迁移、动态观察控制、界面漂移下的记忆可靠性、交互数据微调的泛化以及可复现评测仍待解决。
  literature_review:
    line_of_work_matrix:
    - line: Realistic GUI task benchmarking across desktop, dynamic video, and drag
        interactions
      what_it_solves: Covers domain-specific task breadth, fine-grained sub-goal scoring,
        dynamic content behavior, and non-click interactions that single click-focused
        benchmarks miss.
      what_remains_open: Generalization across operating systems, application versions,
        platform dynamics, and languages; several benchmarks lack visible code or
        dataset artifacts for independent verification.
    - line: Skill-library and execution-memory methods for reusable GUI agent behavior
      what_it_solves: Encodes validated trajectories or multimodal application knowledge
        into callable skills, state-machine programs, or memory to reduce token/time
        cost and improve task completion on repeated workflows.
      what_remains_open: Reliability and fallback when UI elements, application states,
        or task inputs change; deterministic replay boundaries and long-term memory
        maintenance are not fully tested.
    - line: Multimodal agent model training and architecture for GUI grounding and
        navigation
      what_it_solves: Trains or fine-tunes vision-language agents to ground elements
        and act across mobile, desktop, and web interfaces; diffusion-based generation
        offers an alternative to autoregressive GUI policies.
      what_remains_open: Cross-platform and unseen-app generalization, inference cost,
        and deployment safety are not resolved by reported grounding/navigation benchmark
        gains alone.
    - line: Video-guided observation and keyframe extraction for agentic GUI tasks
      what_it_solves: Bridges video understanding and GUI interaction by selecting
        task-relevant scene-aware keyframes and evaluating cost-aware accuracy on
        dynamic content.
      what_remains_open: No evaluated model reached human-level cost-accuracy, and
        videoQA keyframe improvements are not yet proven to transfer into robust interactive
        GUI task success.
    consensus:
    - Current GUI agents are benchmarked on realistic multi-application desktop and
      dynamic interfaces, but fine-grained or cost-aware metrics expose failures hidden
      by aggregate success scores.
    - Structured reuse—visual/text skills, state-machine programs, or callable memory—provides
      substantial efficiency gains and sometimes improves task completion compared
      with per-step language-model control.
    - 'Interaction breadth matters: drag, video-guided, and dynamically changing screen
      content reveal weaknesses in agents built primarily for click-oriented static
      interfaces.'
    - Visual grounding information, such as screenshots, UI figures, or selected keyframes,
      improves element identification and workflow state verification.
    disagreements:
    - 'Improvement paths differ: external skill or memory wrappers, model architecture
      training, and input conditioning through keyframe extraction make different
      assumptions about where gains should come from.'
    - 'Evaluation targets differ: task success, cost-accuracy, grounding/navigation,
      sub-goal completion, and videoQA-adjacent metrics are not directly comparable
      across studies.'
    - 'Interface and platform coverage differs: desktop office apps with CLI/GUI,
      dynamic short-video platforms, drag interactions, and mobile/web grounding each
      receive separate focus.'
    - 'Reproducibility evidence differs: some methods report strong results while
      code, dataset, or artifact signals are missing or weak in the bounded evidence.'
