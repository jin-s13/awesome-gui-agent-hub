  literature_review:
    line_of_work_matrix:
    - line: Task and interaction benchmark construction
      what_it_solves: 'Defines measurable GUI-agent tasks beyond click-only automation:
        desktop GUI+CLI, dynamic short-video interfaces, drag interactions, and fine-grained
        sub-goal or efficiency scoring.'
      what_remains_open: Coverage remains limited by platform/application scope; trajectory-level
        reliability and observation-control metrics are not yet standardized.
    - line: External artifacts and training for agent improvement
      what_it_solves: Improves GUI agents through multimodal skill retrieval, evidence-driven
        harness edits, verifiable RL task synthesis, or weakly supervised grounding
        from unannotated screenshots.
      what_remains_open: Transfer beyond selected benchmarks and operating systems
        is partially shown but not broadly validated; mechanisms are not unified and
        failure prediction is underreported.
    - line: Uncertainty quantification and safe grounding
      what_it_solves: Measures post-hoc grounding confidence and constructs conformal
        click regions to support selective prediction and spatial safety for single-step
        GUI grounding.
      what_remains_open: Multi-step agent trajectories, cross-model/interface ranking
        transfer, and distribution-shift coverage remain unsolved.
    - line: Interaction abstraction and observation formalization
      what_it_solves: Formalizes interaction units and evaluation targets for dynamic
        living-screen agents and drag-based controls that are missing in prior click-centric
        work.
      what_remains_open: Formal descriptions are not yet connected to policy learning,
        safety guarantees, or validated assumptions about agent observation control.
    consensus:
    - The evidence agrees that GUI agent performance cannot be attributed only to
      the backbone model; surrounding harness, skill memory, training data, and evaluation
      design materially affect measured success.
    - All included studies use task completion or grounding accuracy metrics, and
      most pair aggregate success with finer signals such as sub-goal completion,
      cost-accuracy, or calibrated confidence.
    - 'Several works converge on identifying failure modes that aggregate scores hide:
      observation overuse/underuse, UI-element grounding errors, or interaction-type
      blind spots.'
    - The packet consistently treats 2026 as a frontier where reproducibility signals
      vary, but visible code/dataset/artifact links are common while explicit limitation
      statements are often sparse.
    disagreements:
    - 'Supervision and improvement signal differ: weak supervision from unannotated
      screenshots, verifiable synthesized tasks for online RL, harness optimization,
      and multimodal skill retrieval represent distinct routes.'
    - 'Knowledge representation differs: some approaches retain visual figures in
      skill artifacts, while others align model outputs with screenshot-action evidence
      or use text-only indexed skill files.'
    - 'Evaluation granularity differs: one line scores single-step grounding uncertainty,
      another scores multi-step task trajectories, and task metrics range from deterministic
      rule-based Pass@1 to cost-accuracy.'
    - 'Deployment and interaction scope differs: desktop GUI with CLI, dynamic short-video
      browsers, drag interactions, and cross-benchmark frozen-harness transfer imply
      different generalization claims.'
    open_questions:
    - Can post-hoc uncertainty ranking be extended from single-step grounding to multi-step
      GUI trajectories without target-specific reranking?
    - What assumptions explain observation-control failures on dynamic interfaces,
      and how can they be tested in real deployments?
    - Do gains from skill libraries, harness edits, and RL/weak-supervision transfer
      across operating systems, applications, and unseen benchmark distributions?
    - Which combination of task success, sub-goal completion, information efficiency,
      and calibrated confidence should define reliable GUI-agent behavior?
