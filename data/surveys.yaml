  literature_review:
    line_of_work_matrix:
    - line: Real-world OS desktop agent benchmarking
      what_it_solves: Measures multi-application computer-use capability on real macOS
        desktops through GUI+CLI tasks and fine-grained sub-goal scoring.
      what_remains_open: Transfer beyond the reported frameworks and models is unverified;
        limitation and artifact availability details are largely missing.
    - line: Multimodal skill libraries for application-specific computer use
      what_it_solves: Provides hierarchical text-plus-visual skill artifacts to improve
        UI element identification and workflow state verification.
      what_remains_open: Evidence is limited to CUA-World and OSExpert-Eval with a
        single agent stack; cross-application transfer and skill maintenance remain
        open.
    - line: Dynamic and video-guided interface grounding
      what_it_solves: Benchmarks agents on interfaces that change between actions
        and on video-guided tasks, including keyframe extraction to reduce visual
        input burden.
      what_remains_open: Current models lack observation control; whether gains transfer
        to real dynamic UIs beyond the tested platforms is unclear.
    - line: Interaction primitive coverage beyond click, especially drag grounding
      what_it_solves: Creates evaluation and training data for drag-based GUI interactions
        such as text highlighting, cell selection, resizing, and slider manipulation.
      what_remains_open: Downstream production impact beyond the held-out suite and
        fine-tuning one VLM is not demonstrated; limitation details are absent.
    - line: Reuse and replay of validated GUI trajectories
      what_it_solves: Compiles successful agent runs into state-machine programs or
        callable memories to reduce language-model calls, token cost, and execution
        time on repeated tasks.
      what_remains_open: Replay is invoked mainly when deterministic applicability
        holds, so generalization to novel states and fragile UI changes remains bounded.
    - line: Alternative policy architectures for GUI agents
      what_it_solves: Trains a block-wise diffusion vision-language agent for grounding
        and navigation across mobile, desktop, and web benchmarks.
      what_remains_open: Generalization beyond the six reported GUI benchmarks and
        practical latency or cost implications of diffusion decoding are not established.
    consensus:
    - GUI agent research in this topic is organized around application-grounded task
      benchmarks with deterministic or rule-based scoring.
    - Visual grounding, UI element identification, and workflow state verification
      remain central bottlenecks across desktop, web, and dynamic platforms.
    - Fine-grained evaluation beyond final completion, such as sub-goal checkpoints
      or cost-accuracy, reveals capability gaps that overall success masks.
    - Reusing prior validated knowledge or trajectories, whether as skill artifacts
      or replayable memory, improves accuracy and/or reduces token and time cost.
    - Current models most clearly fail when they must manage observation over dynamic
      interfaces or perform low-level interactions such as drag.
    disagreements:
    - 'Benchmark scope differs substantially: macOS desktop multi-app tasks, short-video
      dynamic interfaces, video-guided tasks, drag interactions, and cross-platform
      grounding or navigation suites.'
    - 'Evaluation objectives differ: final task success, fine-grained sub-goal completion,
      cost-accuracy efficiency, grounding accuracy, and execution efficiency are prioritized
      differently.'
    - 'Improvement strategy differs: some works supply external skill libraries or
      memory, while others train a new policy such as a diffusion vision-language
      agent.'
    - 'Interaction assumptions differ: some assume click/type or GUI+CLI actions,
      while others explicitly model drag or dynamic visual observation between actions.'
    - 'Reuse formalism differs: hierarchical topic retrieval, state-machine replay
      with screen checks, and parameter-controlled callable memories use different
      guardrails and fallback behavior.'
    open_questions:
    - How well do current application-specific benchmarks transfer across OS versions,
      application updates, and unseen workflows when code and artifacts are not fully
      disclosed?
    - What observation-control policy would allow agents to match human-level cost-accuracy
      on living-screen or other dynamic interfaces?
    - Can gains from low-level interaction datasets such as drag grounding transfer
      from fine-tuned models to production computer-use tasks?
    - How should multimodal skill libraries be kept fresh when applications change,
