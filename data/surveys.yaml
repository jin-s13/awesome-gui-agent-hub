  related_work_outline:
  - 'Mainstream direction: Building and benchmarking GUI agents that ground screen
    observations into actions across desktop, mobile, short-video, and video-guided
    interfaces, with growing emphasis on dynamic, long-horizon, and non-click interaction.'
  - 'Shared research pattern: Papers couple an interface/task suite with fine-grained
    metrics beyond Pass@1 and expose a training or decision-time bottleneck such as
    observation control, context accumulation, annotation scarcity, or grounding reliability.'
  - 'Key differences: They differ in supervision signal, evaluation setting, and interaction
    assumption, including weak supervision from unannotated screenshots, verifiable
    online RL, human-annotated SFT, drag-based tasks, GUI+CLI, context actions, and
    uncertainty-aware grounding.'
  - 'Trend evolution: The year span is 2024-2026 but visible evidence clusters in
    2026; the frontier is moving from static click-oriented benchmarks toward dynamic
    screens, long-horizon context management, training efficiency, and reliability
    evaluation.'
  - 'Open questions: Observation control, cross-platform generalization, calibration
    transfer, reward and coverage gaps in synthesized tasks, and separating model
    gains from framework or skill-library effects remain unresolved.'
  related_work_outline_zh:
  - 主流方向：构建并评测GUI智能体，将屏幕观察映射为动作，覆盖桌面、移动、短视频和视频引导界面，并越来越重视动态、长时域和非点击交互。
  - 研究共性：论文通常配合界面/任务集与细粒度指标，超越Pass@1，暴露观察控制、上下文累积、标注稀缺或定位可靠性等训练/决策瓶颈。
  - 关键差异：监督信号、评测场景和交互假设不同，包括未标注截图弱监督、可验证在线RL、人工标注SFT、拖拽任务、GUI+CLI、上下文动作和不确定性感知定位。
  - 趋势演进：年跨度为2024-2026，但现有证据集中在2026；前沿正从静态点击基准转向动态屏幕、长时域上下文管理、训练效率和不确定性评测。
  - 开放问题：观察控制、跨平台泛化、校准迁移、合成任务的奖励与覆盖缺口，以及区分模型收益与框架/技能库效果等问题仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: Static and dynamic GUI-action grounding benchmarks
      what_it_solves: Establishes task suites and fine-grained scoring for screen-to-action
        grounding across desktop, short-video, video-guided, and drag-based interfaces.
      what_remains_open: Whether benchmark-specific gains transfer to downstream computer-use
        tasks and to dynamic interfaces beyond the simulated domain.
    - line: Weakly supervised and verifiable-RL training for computer-use agents
      what_it_solves: Reduces annotation cost or scales online training by using unannotated
        screenshots, curriculum calibration, verifiable synthesized tasks, and frontier
        sampling.
      what_remains_open: Whether synthesized task coverage and verification prevent
        reward hacking or distribution gaps; limitation details are largely missing.
    - line: Long-horizon context and observation control methods
      what_it_solves: Keeps long trajectories compact and prevents over- or under-observation
        by making context management an explicit policy action or scoring information
        efficiency.
      what_remains_open: How well these mechanisms generalize outside mobile or short-video
        settings and whether gains come from context actions rather than base model
        quality.
    - line: Uncertainty and calibration for GUI grounding
      what_it_solves: Benchmarks post-hoc uncertainty quantification across VLM agents
        and datasets, and tests conformal click regions for spatial safety.
      what_remains_open: Transfer of uncertainty ranking across model tiers and interfaces
        is weak, and single-step grounding evidence leaves multi-step trajectory uncertainty
        uncovered.
    - line: Evidence and attribution protocols for GUI agent systems
      what_it_solves: Uses multi-framework, multi-model evaluation and capability
        annotations to separate model, framework, and skill-library contributions.
      what_remains_open: Several top papers omit limitation fields; sub-goal scoring
        and cost-accuracy measurements need standardized adoption to make comparisons
        comparable.
    consensus:
    - GUI agent evaluation is moving beyond single Pass@1 metrics toward fine-grained
      sub-goal, cost-accuracy, or capability-level measurement.
    - Agents still fail on dynamic, long-horizon, multimodal, or non-click interactions,
      with observation and context management as common bottlenecks.
    - Training efficiency and annotation cost matter, so multiple approaches use large-scale
      synthesized or unannotated data with a small calibration step.
    - Screen grounding and action prediction are treated as core capabilities, but
      reliable uncertainty and cross-setting generalization remain weak.
    disagreements:
    - 'Supervision signals differ: weak supervision from unannotated screenshots,
      online RL with verifiable tasks, human-annotated SFT with context actions, and
      post-hoc uncertainty calibration each target different failure modes.'
    - Evaluation targets differ across desktop, mobile short-video, video-guided,
      and drag-based interfaces, so assumptions about static versus dynamic screens
      diverge.
    - 'Interaction assumptions differ: some methods model click-only grounding, while
      others add drag, GUI+CLI, context-management actions, or explicit observation
      control.'
    - 'Reliability evaluation is isolated: one benchmark treats uncertainty as single-step
      grounding, while other methods evaluate multi-step task success without calibration
      evidence.'
    open_questions:
    - Can agents learn observation control that transfers beyond short-video-style
      dynamic interfaces?
    - How should verifiable task synthesis be checked for coverage and reward gaps
      before online RL?
    - Which grounding improvements persist in downstream desktop or mobile computer-use
      tasks after fine-tuning?
    - How can uncertainty and calibration transfer across open-weight and closed-source
      models and across GUI interfaces?
    - What portion of reported gains is due to framework, skill library, base model,
      or proposed method rather than benchmark artifacts?
    - Several top papers omit limitation details, leaving negative results and boundary
      conditions as a verification gap.
  literature_review_zh:
    研究路线矩阵:
    - 路线: 静态与动态GUI动作定位基准
      解决的问题: 为桌面、短视频、视频引导和拖拽界面的屏幕到动作定位建立任务集和细粒度评分。
      尚未覆盖: 基准特定收益是否能迁移到下游计算机使用任务，以及能否覆盖仿真域之外的真实动态界面。
    - 路线: 弱监督与可验证RL训练
      解决的问题: 通过未标注截图、课程校准、可验证合成任务和前沿采样降低标注成本或扩大在线训练规模。
      尚未覆盖: 合成任务覆盖和验证能否防止奖励黑客或分布缺口；多数论文缺少局限性说明。
    - 路线: 长时域上下文与观察控制
      解决的问题: 通过把上下文管理显式化为策略动作或评分信息效率，保持长轨迹紧凑并避免过度或不足观察。
      尚未覆盖: 这些机制在移动端或短视频之外的泛化性，以及收益是否来自上下文动作而非基座模型质量。
    - 路线: GUI定位的不确定性与校准
      解决的问题: 跨VLM代理和数据集评测后验不确定性量化，并测试共形点击区域的空间安全性。
      尚未覆盖: 不确定性排名跨模型层级和接口迁移很弱；单步定位证据未覆盖多步轨迹不确定性。
    - 路线: GUI代理系统的证据与归因协议
      解决的问题: 使用多框架、多模型评测和能力注释，区分模型、框架和技能库贡献。
      尚未覆盖: 部分论文缺失局限性字段；子目标评分与成本-准确率等复合指标尚未标准化，比较困难。
    共识:
    - GUI代理评测正从单一Pass@1指标转向细粒度子目标、成本-准确率或能力级测量。
    - 代理在动态、长时域、多模态或非点击交互中仍会失败，观察和上下文管理是共同瓶颈。
    - 训练效率与标注成本受到共同关注；多种方法使用大规模合成或未标注数据加小规模校准。
    - 屏幕定位和动作预测被视作核心能力，但可靠不确定性和跨场景泛化仍较弱。
    分歧:
    - 监督信号不同：未标注截图弱监督、可验证任务在线RL、人工标注SFT与上下文动作、后验不确定性校准各自优化不同失败模式。
    - 评测目标不同：涉及桌面、移动短视频、视频引导和拖拽界面，因此对静态与动态屏幕的失败假设存在分歧。
    - 交互假设不同：有的只建模点击定位，有的加入拖拽、GUI+CLI、上下文管理动作或显式观察控制。
    - 可靠性评测孤立：一个基准将不确定性视为单步定位，而其他方法评估多步任务成功但缺少校准证据。
    开放问题:
    - 智能体能否学习可迁移到短视频之外动态界面的观察控制？
    - 可验证任务合成在用于在线RL之前，如何检查覆盖性和奖励漏洞？
    - 微调带来的定位提升是否能保留到下游桌面或移动计算机使用任务中？
    - 不确定性和校准如何跨开源/闭源模型及GUI接口迁移？
    - 报告中的收益有多少来自框架、技能库、基座模型或所提方法，而非基准伪影？
    - 多篇证据缺少局限性字段，导致负结果和边界条件构成验证缺口。
