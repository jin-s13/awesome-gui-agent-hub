  related_work_outline:
  - 'Mainstream direction: Developing more realistic, dynamic, and multi-modal benchmarks
    for GUI agents while reducing data requirements through RL or weakly-supervised
    training, improving long-horizon and complex interaction capabilities, and introducing
    uncertainty quantification for safety.'
  - 'Shared research pattern: All works ground agents in visual-language models, focus
    on data efficiency or task generalization, but evaluation protocols and training
    objectives remain unstandardized.'
  - 'Key differences: Evaluation metrics (rule-based scoring, cost-accuracy, UQ),
    training paradigms (online RL, weakly-supervised, keyframe selection), interaction
    coverage (click, drag, observation control), and context management strategies
    (passive vs. proactive) differ significantly.'
  - 'Trend evolution: From 2024 to 2026, research rapidly shifts from static desktop
    benchmarks to dynamic, long-horizon, multi-interaction real-world scenarios, while
    increasingly emphasizing training efficiency and safety, reflecting a fast-iterating
    frontier.'
  - 'Open questions: How to integrate heterogeneous interaction modes, training objectives,
    and evaluation metrics; generalization of UQ across models and tasks; bridging
    the gap between benchmarks and real-world deployment.'
  related_work_outline_zh:
  - 主流方向：构建更真实、动态、多模态的GUI代理基准，同时通过RL或弱监督训练降低数据需求，提升长时域和复杂交互能力，并引入不确定性量化以增强安全性。
  - 研究共性：所有工作都将代理建立在视觉-语言模型上，关注数据效率或任务泛化，但评估协议和训练目标尚未统一。
  - 关键差异：评估指标（规则评分、成本-准确性、UQ）、训练范式（在线RL、弱监督、关键帧选择）、交互覆盖（点击、拖拽、观察控制）和上下文管理策略（被动 vs
    主动）存在显著差异。
  - 趋势演进：从2024到2026年，研究从静态桌面基准快速转向动态、长时域、多交互的真实场景，同时越来越强调训练效率和安全性，反映了快速迭代的前沿趋势。
  - 开放问题：如何整合异构交互模式、训练目标和评估指标；UQ在跨模型和跨任务中的泛化；弥合基准与真实世界部署之间的差距。
  literature_review:
    line_of_work_matrix:
    - line: GUI agent benchmarking and evaluation protocols
      what_it_solves: Provides standardized environments, tasks, and metrics to measure
        agent capabilities across diverse interactions and scenarios, including dynamic
        content, drag, and long-horizon tasks.
      what_remains_open: Metrics lack unification, making cross-benchmark comparison
        difficult; real-world deployment dynamics and safety are not fully covered;
        most benchmarks only cover partial interaction types.
    - line: Training methods for GUI agents (data efficiency and task synthesis)
      what_it_solves: Reduces reliance on expensive annotations through RL, weakly-supervised,
        or curriculum learning, and improves performance with limited data by generating
        synthetic tasks or leveraging unannotated data.
      what_remains_open: Fair comparison between training paradigms (RL vs. SFT vs.
        weakly-supervised) is missing; RL sample efficiency and safe exploration need
        improvement; distribution shift between synthetic and real tasks is underexplored.
    - line: Interaction and context management for long-horizon tasks
      what_it_solves: Addresses context forgetting, observation control, and complex
        interactions (drag, dynamic interfaces) in long sequences via proactive context
        management, observation strategies, or keyframe extraction.
      what_remains_open: Combining proactive context management with other methods
        (e.g., RL) is unexplored; observation control is not optimized in training;
        drag interactions are not integrated into existing training frameworks.
    - line: Uncertainty quantification and safety in GUI grounding
      what_it_solves: Quantifies prediction uncertainty of GUI agents, provides safe-calibrated
        click regions for high-risk decisions, and evaluates cross-model transferability
        of UQ methods.
      what_remains_open: UQ is limited to single-step grounding, not multi-step trajectories;
        cross-model and cross-interface transferability is weak, requiring target-specific
        recalibration; safety constraints are not yet integrated into training objectives.
    consensus:
    - VLM-based agents are the dominant architecture for GUI grounding and task execution.
    - Data efficiency and scalable training remain critical bottlenecks, with synthetic
      task generation and unannotated data leveraged to reduce annotation cost.
    - Existing agents struggle with dynamic, long-horizon, and diverse interaction
      types (beyond click), revealing gaps in observation control and context management.
    - Evaluation must move beyond simple task success to capture fine-grained, interaction-specific,
      and safety-aware metrics.
    disagreements:
    - 'Evaluation metrics vary: rule-based pass@1 versus cost-accuracy versus UQ-calibrated
      scores, leading to incomparable progress claims.'
    - 'Training paradigms differ: online RL with task synthesis versus weakly-supervised
      curriculum learning versus keyframe extraction for video-guided tasks, each
      targeting a different data regime and interaction type.'
    - 'Interaction coverage is fragmented: drag-based manipulation, dynamic content
      observation, and proactive context management are addressed in isolation, with
      no unified agent that handles all.'
    - Uncertainty quantification is treated as a separate post-hoc benchmark rather
      than integrated into training or decision-making, creating a gap between safety
      research and agent design.
    open_questions:
    - How can we design a unified evaluation framework that fairly compares agents
      across heterogeneous interaction types and training objectives?
    - Can uncertainty quantification be incorporated into the training loop of GUI
      agents to improve both safety and task completion?
    - What are the effective strategies to bridge the distribution gap between synthetic
      training tasks and real-world user scenarios?
    - How can observation control, drag interactions, and context management be jointly
      optimized in an end-to-end agent architecture?
  literature_review_zh:
    研究路线矩阵:
    - 路线: GUI代理基准测试与评估协议
      解决的问题: 提供标准化环境、任务和指标，衡量代理在多样化交互和场景下的能力，包括动态内容、拖拽和长时域任务。
      尚未覆盖: 指标缺乏统一性，跨基准比较困难；真实世界部署的动态变化和安全性未完全覆盖；多数基准仅覆盖部分交互类型。
    - 路线: GUI代理的训练方法（数据效率与任务合成）
      解决的问题: 通过RL、弱监督或课程学习降低对昂贵标注的依赖，通过生成合成任务或利用未标注数据提升有限数据下的性能。
      尚未覆盖: 不同训练范式（RL vs SFT vs 弱监督）间缺乏公平比较；RL的样本效率和安全探索需改进；合成任务与真实场景的分布偏移未充分研究。
    - 路线: 长时域任务的交互与上下文管理
      解决的问题: 通过主动上下文管理、观察策略或关键帧提取，解决长序列中的上下文遗忘、观察控制和复杂交互（拖拽、动态界面）问题。
      尚未覆盖: 主动上下文管理与其他方法（如RL）的结合未探索；观察控制未在训练中优化；拖拽交互未集成到现有训练框架。
    - 路线: GUI基础中的不确定性量化与安全
      解决的问题: 量化GUI代理的预测不确定性，为高风险决策提供安全校准的点击区域，并评估UQ方法的跨模型迁移性。
      尚未覆盖: UQ限于单步基础，未扩展到多步轨迹；跨模型和跨接口迁移性弱，需目标特定重新校准；安全约束尚未集成到训练目标。
    共识:
    - 基于VLM的代理是GUI grounding和任务执行的主流架构。
    - 数据效率和可扩展训练仍是关键瓶颈，通过合成任务生成和未标注数据来降低标注成本。
    - 现有代理在动态、长时域和多样化交互类型（超越点击）上表现挣扎，暴露出观察控制和上下文管理的不足。
    - 评估必须超越简单的任务成功，转向细粒度、交互特定和安全性感知的指标。
    分歧:
    - 评估指标不同：基于规则的pass@1、成本-准确性指标和UQ校准分数，导致进展声明的不可比较。
    - 训练范式不同：在线RL与任务合成、弱监督课程学习、视频引导任务的关键帧提取，各自针对不同的数据体制和交互类型。
    - 交互覆盖碎片化：拖拽操作、动态内容观察和主动上下文管理被孤立处理，尚无统一代理能处理所有。
    - 不确定性量化被视为独立的后验基准，而非集成到训练或决策中，造成安全研究与代理设计之间的鸿沟。
    开放问题:
    - 如何设计一个统一的评估框架，以公平比较异构交互类型和训练目标下的代理？
    - 能否将不确定性量化融入到GUI代理的训练循环中，以同时提高安全性和任务完成度？
    - 弥合合成训练任务与真实用户场景之间分布差距的有效策略是什么？
    - 如何在端到端代理架构中联合优化观察控制、拖拽交互和上下文管理？
