  related_work_outline:
  - 'Mainstream direction: Building and evaluating GUI agents powered by VLMs, with
    strong emphasis on benchmarks that expose overlooked capabilities (drag interaction,
    dynamic screens, observation control, long-horizon context management) and on
    training methods that reduce annotation cost (weak supervision, synthetic RL tasks).'
  - 'Shared research pattern: Each work identifies a specific capability gap in current
    GUI agents, constructs a dedicated benchmark or dataset to quantify it, and often
    proposes a method (keyframe extraction, ConAct, VeriGen, Frontier Sampling, GUICrafter
    curriculum) to improve that gap, followed by fine-tuning or RL.'
  - 'Key differences: Supervision strategy diverges sharply—some use massive unlabeled
    screenshots, others generate verifiable synthetic tasks, while others rely on
    manually annotated trajectories; evaluation targets range from task success rate
    to cost-accuracy and uncertainty reliability; interaction modes span click, drag,
    CLI, and video-guided actions.'
  - 'Trend evolution: Within the 2024–2026 frontier, the field moves from static,
    short-horizon, click-only benchmarks toward dynamic, long-horizon, multi-modal
    interaction evaluation, and from fully supervised imitation to weak supervision,
    online RL, and verifiable task synthesis that scales training.'
  - 'Open questions: Cross-benchmark and cross-model generalization of rankings and
    methods remains largely unverified; the scalability and safety of online RL and
    context management in real-world deployments are unclear; many interaction types
    (drag, CLI, dynamic content) are not yet integrated into training pipelines.'
  related_work_outline_zh:
  - 主流方向：建造和评估基于VLM的GUI代理，重点关注基准测试以暴露被忽视的能力（拖拽交互、动态屏幕、观察控制、长时程上下文管理），并注重降低标注成本的训练方法（弱监督、合成RL任务）。
  - 研究共性：每项工作都识别当前GUI代理的特定能力缺口，构建专用基准或数据集来量化该缺口，并通常提出一种方法（关键帧提取、ConAct、VeriGen、Frontier
    Sampling、GUICrafter课程）加以改进，然后进行微调或RL。
  - 关键差异：监督策略分歧明显——有的利用海量未标注截图，有的生成可验证的合成任务，有的依赖人工标注轨迹；评测目标从任务成功率到成本-准确性和不确定性可靠性不等；交互模式涵盖点击、拖拽、CLI和视频引导操作。
  - 趋势演进：在2024-2026前沿内，领域从静态、短时程、仅点击的基准向动态、长时程、多模态交互评估发展，从完全监督模仿转向弱监督、在线RL和可扩展训练的可验证任务合成。
  - 开放问题：方法和排名的跨基准、跨模型泛化性大多未经验证；在线RL和上下文管理在真实部署中的可扩展性和安全性不明确；许多交互类型（拖拽、CLI、动态内容）尚未集成到训练管线中。
  literature_review:
    line_of_work_matrix:
    - line: Method representation and objective design
      what_it_solves: Translating GUI agent capabilities into learnable representations,
        loss functions, and training recipes, including weakly-supervised grounding
        from unlabeled screenshots, keyframe extraction for video-guided tasks, drag-based
        action representation, and structured context fields for long-horizon memory.
      what_remains_open: Cross-platform and cross-task transferability of these representations;
        the limits of weak supervision when task diversity grows; whether keyframe
        extraction generalizes beyond videoQA settings.
    - line: Planning and action-interface methods
      what_it_solves: Connecting learned policies to decision-time interfaces such
        as online RL with efficient rollout allocation (Frontier Sampling), proactive
        context management as first-class actions (ConAct), and verifiable task synthesis
        that generates training signals.
      what_remains_open: How much of the gain comes from the model versus the planner
        or context manager; robustness of context management policies across unseen
        app domains; safety and exploration cost of online RL in real GUI environments.
    - line: Method evidence and ablation protocol
      what_it_solves: Separating method contribution from dataset, baseline, and implementation
        effects through targeted benchmarks that reveal observation control failure
        modes, skill-library-versus-framework decompositions, drag interaction gaps,
        and post-hoc uncertainty quantification transferability across models and
        datasets.
      what_remains_open: Stability of UQ rankings when transferring across model tiers
        and interfaces; completeness of evaluation for non-click interactions; whether
        benchmark-specific findings hold under distribution shift.
    consensus:
    - GUI agents are predominantly built on vision-language models and evaluated via
      task completion metrics on newly introduced benchmarks.
    - 'There is a shared recognition that current agents lack critical capabilities:
      observation control, long-horizon context management, and support for drag or
      dynamic interfaces.'
    - Training improvements are sought through minimizing human annotation effort,
      either by leveraging unlabeled data, synthetic task generation, or curriculum
      learning.
    - Evaluation must go beyond Pass@1 to include fine-grained sub-goal scoring, cost-accuracy
      trade-offs, and uncertainty quality.
    disagreements:
    - 'Supervision signal: some works rely on massive unannotated screenshots with
      weak supervision, others generate verifiable synthetic tasks via RL, while others
      use fully annotated trajectories.'
    - 'Evaluation target: task success rate (MacAgentBench) versus cost-accuracy (LivingScreen)
      versus uncertainty reliability (Argus) versus drag-specific accuracy (DragOn).'
    - 'Interaction modality: benchmark coverage varies from desktop GUI+CLI mixtures
      to mobile long-horizon tasks, dynamic short-video platforms, and drag-only interactions.'
    - 'Training regime: offline supervised fine-tuning (MemGUI) versus online RL with
      frontier sampling (SCALECUA) versus two-stage curriculum with RL calibration
      (GUICrafter).'
    open_questions:
    - Can the gains from weak supervision or synthetic task generation transfer to
      real-world GUI tasks outside the training distribution?
    - How do context management and online RL policies scale to safety-critical applications
      with irreversible actions?
    - What is the minimal set of interaction types that a benchmark must cover to
      reliably predict real-world agent performance?
    - Does uncertainty quantification ranking remain stable across closed-source model
      tiers when internal states are inaccessible, and how should it inform agent
      design?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 方法表示与目标设计
      解决的问题: 将GUI代理能力转化为可学习的表示、损失函数和训练配方，包括从未标注截图学习弱监督定位、为视频引导任务提取关键帧、拖拽动作表示以及用于长时程记忆的结构化上下文字段。
      尚未覆盖: 这些表示在跨平台和跨任务下的迁移性；当任务多样性增加时弱监督的极限；关键帧提取是否能泛化到视频问答之外。
    - 路线: 规划与动作接口方法
      解决的问题: 将学习到的策略连接到决策时接口，如使用高效rollout分配（Frontier Sampling）的在线RL、作为第一类动作的主动上下文管理（ConAct）以及生成训练信号的可验证任务合成。
      尚未覆盖: 收益有多少来自模型本身而非规划器或上下文管理器；上下文管理策略在未见应用领域中的鲁棒性；在线RL在真实GUI环境中的安全性和探索成本。
    - 路线: 方法证据与消融协议
      解决的问题: 通过针对性基准测试分离方法贡献与数据集、基线和实现因素，揭示观察控制失败模式、技能库与框架效应分解、拖拽交互缺口以及跨模型和数据集的后验不确定性量化迁移性。
      尚未覆盖: 跨模型层级和接口迁移时UQ排名的稳定性；非点击交互评估的完备性；基准特定发现是否在分布偏移下仍然成立。
    共识:
    - GUI代理主要基于视觉语言模型构建，并通过新引入的基准测试上的任务完成指标进行评估。
    - 普遍认识到当前代理缺乏关键能力：观察控制、长时程上下文管理以及对拖拽或动态界面的支持。
    - 通过利用未标注数据、合成任务生成或课程学习，追求最小化人工标注量来改善训练。
    - 评估必须超越Pass@1，包括细粒度子目标评分、成本-准确性权衡和不确定性质量。
    分歧:
    - 监督信号：一些工作依赖海量未标注截图进行弱监督，另一些通过RL生成可验证的合成任务，还有一些使用完全标注的轨迹。
    - 评测目标：任务成功率（MacAgentBench）对成本-准确性（LivingScreen）对不确定性可靠性（Argus）对拖拽专用准确率（DragOn）。
    - 交互模态：基准测试覆盖范围从桌面GUI+CLI混合到移动长时程任务、动态短视频平台和仅拖拽交互。
    - 训练体制：离线监督微调（MemGUI）对在线RL加前沿采样（SCALECUA）对两阶段课程加RL校准（GUICrafter）。
    开放问题:
    - 弱监督或合成任务生成带来的收益能否迁移到训练分布之外的真实GUI任务？
    - 上下文管理和在线RL策略如何扩展到具有不可逆操作的安全关键应用？
    - 基准测试必须覆盖的最小交互类型集是什么，才能可靠预测真实世界代理性能？
    - 当内部状态不可访问时，不确定性量化排名在闭源模型层级间是否保持稳定，应如何指导代理设计？
