  literature_review:
    line_of_work_matrix:
    - line: Task and interaction abstractions for GUI agents
      what_it_solves: Moves GUI-agent formalization beyond static click-only tasks
        by making dynamic screen changes, GUI+CLI mixing, and drag interactions explicit
        as evaluation targets.
      what_remains_open: These abstractions are mostly inferred from benchmark results;
        no formal conditions link them to guaranteed agent competence or safe transfer
        across environments.
    - line: Reliability and uncertainty framing for grounding and evaluation
      what_it_solves: Separates end-to-end success from sub-goal completion, cost-accuracy,
        and confidence calibration, exposing failures that aggregate metrics hide.
      what_remains_open: Evidence is limited to single-step grounding or specific
        benchmarks; cross-model, cross-interface, and trajectory-level reliability
        transfer is not established.
    - line: Externalized skill, harness, and evidence reuse
      what_it_solves: Shows frozen backbone models can improve through structured
        skills, harness edits, or evidence-driven diagnosis without retraining the
        core model.
      what_remains_open: How well these gains generalize beyond tested OS and benchmark
        suites, and whether skill/harness assumptions hold under dynamic or safety-critical
        tasks, remains unverified.
    - line: Scalable training-signal construction
      what_it_solves: Reduces reliance on costly human demonstrations through verifiable
        synthetic tasks, unannotated screenshots, and large drag interaction datasets.
      what_remains_open: The theoretical conditions under which weak or synthetic
        supervision aligns with real GUI competence are not yet stated or tested across
        regimes.
    consensus:
    - 'End-to-end success alone is insufficient: fine-grained sub-goal scoring, cost-accuracy,
      and confidence metrics reveal material differences among similarly successful
      agents.'
    - GUI-agent evaluation needs to treat interaction as more than static pointing
      and clicking; dynamic content, observation behavior, GUI+CLI, and drag actions
      are part of the task space.
    - Improvement can come from outside the frozen model, such as reusable skills,
      harness optimization, or large-scale weak/synthetic supervision, but transfer
      evidence is incomplete.
    disagreements:
    - Some work changes the model through reinforcement learning or weak visual supervision,
      while others keep the backbone fixed and change the skill library or execution
      harness.
    - 'Evaluation focus differs: broad desktop task completion, dynamic short-video
      observation control, single-step grounding uncertainty, and drag interaction
      grounding each use different task units and success criteria.'
    - 'Methods differ in what signal is trusted: verifiable docker-based task synthesis,
      unannotated screenshots, authored documentation plus live UI exploration, or
      repeated execution evidence.'
    - 'Claims differ on transfer: harness and skill gains are reported across some
      benchmarks, while uncertainty rankings transfer weakly across model tiers and
      interfaces.'
    open_questions:
    - Can uncertainty estimates calibrated on open-weight agents retain coverage under
      closed-source or interface distribution shifts?
    - What formal assumptions connect task abstractions such as dynamic-screen or
      drag-based interaction to agent reliability and safety guarantees?
    - Do fine-grained benchmark metrics predict real-world user-perceived reliability,
      or only relative model ranking?
    - How far do frozen-harness or skill-library improvements transfer beyond the
      specific OS and benchmark suites in the evidence?
    - What conditions make verifiable or weak supervision sufficient for multi-step
      GUI competence rather than single-step grounding?
  literature_review_zh:
    研究路线矩阵:
    - 路线: GUI任务与交互抽象
      解决的问题: 将动态屏幕变化、GUI+CLI混合、拖拽等交互显式纳入任务定义与评测，超越静态点击假设。
      尚未覆盖: 这些抽象大多来自基准结果推断，尚缺形式条件将它们与能力保证或安全迁移相连。
    - 路线: 可靠性与不确定性框架
      解决的问题: 区分端到端成功与子目标完成、成本准确率和置信度校准，暴露聚合指标掩盖的失败。
      尚未覆盖: 证据主要限于单步定位或特定基准；跨模型、跨界面和轨迹级可靠性迁移未建立。
    - 路线: 外部技能、harness与证据复用
      解决的问题: 在冻结骨干模型下通过结构化技能、harness编辑或证据驱动诊断提升表现。
      尚未覆盖: 在测试OS/基准套件之外的泛化，以及动态或安全关键任务下假设是否成立仍缺少验证。
    - 路线: 可扩展训练信号构建
      解决的问题: 通过可验证合成任务、未标注截图和大规模拖拽数据减少对昂贵人工演示的依赖。
      尚未覆盖: 弱监督或合成监督与真实GUI能力一致的理论条件尚未给出，也缺少跨场景测试。
    共识:
    - 仅看端到端成功率不够；细粒度子目标评分、成本准确率和置信度指标能揭示相似成功率下模型的重要差异。
    - GUI智能体评测需要超越静态点击：动态内容、观察行为、GUI+CLI和拖拽都属于任务空间。
    - 性能提升可以来自冻结模型之外，例如可复用技能、harness优化或大规模弱/合成监督，但迁移证据仍不完整。
