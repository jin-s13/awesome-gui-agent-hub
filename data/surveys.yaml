  related_work_outline:
  - 'Mainstream direction: The frontier is shifting from static, click-only GUI grounding
    toward executable agents trained and evaluated with verifiable tasks, weak supervision,
    richer action interfaces, and task-completion metrics.'
  - 'Shared research pattern: Work couples a benchmark or training recipe to a faithful
    GUI environment, then measures task success, grounding quality, or efficiency
    across multiple model tiers.'
  - 'Key differences: Improvement levers differ between policy training, frozen-harness
    optimization, and observation or keyframe selection; evaluation ranges from single-step
    grounding to multi-step real and dynamic interfaces.'
  - 'Trend evolution: Available years span 2024–2026 but the top evidence concentrates
    in 2026, so the visible trend is within the current frontier: more verifiable,
    interaction-rich, and reliability-aware methods.'
  - 'Open questions: Cross-environment transfer, observation-control learning, uncertainty-grounded
    multi-step execution, and separating model, framework, and dataset contributions
    remain unresolved; missing code or limitation fields are verification gaps.'
  related_work_outline_zh:
  - 主流方向：前沿正从静态、仅点击的GUI接地转向可执行智能体，强调可验证任务、弱监督、更丰富动作接口和任务完成型评测。
  - 研究共性：工作通常将基准或训练配方与真实或仿真GUI环境绑定，并通过多模型层级上的任务成功率、接地质量或效率进行衡量。
  - 关键差异：提升路径在策略训练、冻结执行框架优化和观察或关键帧选择之间分化；评测从单步接地延伸到多步真实或动态界面。
  - 趋势演进：证据年份跨度含2024–2026，但高排名论文集中在2026，可见趋势处于当前前沿内部：更可验证、交互更丰富、更关注可靠性。
  - 开放问题：跨环境迁移、观察控制学习、不确定性接地多步执行，以及分离模型、框架和数据贡献仍待解决；部分代码和局限性信息缺失构成验证缺口。
  literature_review:
    line_of_work_matrix:
    - line: Training and supervision scaling
      what_it_solves: Learning executable GUI action policies with lower annotation
        cost through unannotated screenshot pretraining, verifiable task synthesis,
        online RL, or frozen-harness evolution.
      what_remains_open: Evidence does not fully isolate transfer beyond reported
        tasks, operating systems, and interface setups, nor how much gain comes from
        data scale versus reward or task design.
    - line: Planning, observation, and action-interface methods
      what_it_solves: Connecting model outputs to interventions in richer settings,
        including drag interactions, GUI plus CLI, dynamic short-video content, video-guided
        keyframe selection, and observation efficiency.
      what_remains_open: Dynamic-interface failure is driven by over- and under-observation,
        but current work mostly scores this rather than learning explicit observation
        control; gains from planner or harness versus model remain unseparated.
    - line: Method evidence and evaluation protocol
      what_it_solves: Separating method contributions from dataset, baseline, metric,
        and implementation effects through rule-based checks, fine-grained checkpoints,
        uncertainty quantification, and conformal click regions.
      what_remains_open: Evidence is often single-step or single-interface; cross-model
        and cross-interface transfer is weak, and several top papers have missing
        limitation or reproducibility details.
    consensus:
    - Recent methods treat GUI competence as multimodal perception plus executable
      action grounding, scored by task completion rather than static answer accuracy.
    - A shared direction is reducing human annotation and increasing verifiability
      through rule-based checks, synthesized tasks, repeated runs, and weak supervision
      from unannotated screens.
    - Evaluation is expanding beyond click-only prediction toward multi-step, multi-application,
      drag, GUI+CLI, and dynamic content settings.
    disagreements:
    - 'Improvement locus differs: some lines train the policy from synthetic or weak
      data, others optimize the frozen harness, and others select observations or
      keyframes before action prediction.'
    - 'Evaluation targets differ: single-step grounding and uncertainty calibration
      versus multi-step real-desktop or dynamic-interface task completion, making
      results hard to compare.'
    - 'Reliability treatment differs: uncertainty-related work proposes conformal
      click regions and post-hoc ranking, while most agent evaluations report only
      task success and leave uncertainty-grounded execution untested.'
    - 'Action-interface coverage differs: benchmarks emphasize drag, GUI+CLI, or dynamic
      content separately, so no shared protocol spans all interaction modes.'
    open_questions:
    - Do verifiable task synthesis, weak screenshot supervision, and harness optimization
      transfer to unseen operating systems, applications, and dynamic interfaces?
    - Can observation control be learned as part of agent planning instead of only
      being reported as a failure mode?
    - How can uncertainty quantification be integrated into multi-step GUI execution
      and action selection beyond single-step grounding?
    - Which evaluation protocol can separate model ability from framework, task prior,
      data scale, and metric choices across interaction modes?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 训练与监督信号扩展
      解决的问题: 通过未标注截图预训练、可验证任务合成、在线强化学习或冻结执行框架演化，在较低标注成本下学习可执行的GUI动作策略。
      尚未覆盖: 证据未完全隔离这些方法在报告任务、操作系统和界面设置之外的可迁移性，以及数据规模与奖励或任务设计各自贡献。
    - 路线: 规划、观察与动作接口方法
      解决的问题: 将模型输出连接到更丰富设置中的干预，包括拖拽、GUI与CLI混合、动态短视频内容、视频引导关键帧选择和观察效率。
      尚未覆盖: 动态界面失败主要来自过度观察与观察不足，但当前多被评分而非学习显式观察控制；规划器或执行框架与模型本身的收益尚未分离。
    - 路线: 方法证据与评测协议
      解决的问题: 通过规则检查、细粒度检查点、不确定性量化和共形点击区域，区分方法贡献与数据集、基线、指标和实现因素的影响。
      尚未覆盖: 证据通常限于单步或单接口；跨模型与跨接口迁移较弱，且若干部论文缺乏局限性或可复现性细节。
    共识:
    - 近期方法普遍将GUI能力视为多模态感知与可执行动作接地的组合，并以任务完成度而非静态答案准确率作为主要评分。
    - 共同方向是减少人工标注并增强可验证性：采用规则检查、任务合成、重复运行和未标注截图弱监督等方式。
    - 评测从仅点击动作预测扩展至多步、多应用、拖拽、GUI+CLI和动态内容等更丰富设置。
    分歧:
    - 提升来源不同：有的从合成或弱监督数据训练策略，有的优化冻结执行框架，有的在动作预测前筛选观察或关键帧。
    - 评测目标不同：单步接地与不确定性校准对比多步真实桌面或动态界面任务完成，结果难以横向比较。
    - 可靠性处理不同：不确定性量化工作提出共形点击区域和后验排名，而多数智能体评测只报告任务成功率，未验证不确定性接入执行。
    - 动作接口覆盖不同：拖拽、GUI+CLI和动态内容被分别强调，缺乏跨交互模式的统一协议。
    开放问题:
    - 可验证任务合成、截图弱监督和执行框架优化能否迁移到未见操作系统、应用和动态界面？
    - 观察控制能否作为智能体规划的一部分被学习，而不只是作为失败模式被报告？
    - 不确定性量化能否从单步接地扩展到多步GUI执行与动作选择？
    - 何种评测协议能跨交互模式分离模型能力、框架、任务先验、数据规模和指标选择的影响？
