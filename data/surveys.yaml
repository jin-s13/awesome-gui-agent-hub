  - 趋势演进：证据集中在2025-2026前沿，从静态监督GUI策略走向在线或Harness原生强化学习，并在部署后叠加记忆、技能、恢复诊断和效率层。
  - 开放问题：强化学习后错误恢复仍弱；Harness与环境变化下的部署可复现性不确定；确定性记忆重放边界和替代解码范式的实时服务代价仍需证据。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end harness-native and online training frameworks
      what_it_solves: Training agents in live or harness environments by intercepting
        model calls or running browser/desktop rollouts for RL.
      what_remains_open: Error recovery remains weak after training; harness complexity
        affects trainability; evidence is concentrated in specific web and desktop
        benchmarks.
    - line: Multimodal skills and execution-level memory
      what_it_solves: Reusing validated GUI workflows and visual artifacts to reduce
        token/time cost and improve UI grounding.
      what_remains_open: Applicability appears limited to deterministic replayable
        steps; ambiguous or incompatible steps still require grounding repair or fresh
        planning.
    - line: Data-efficient weak supervision for GUI agents
      what_it_solves: Reducing human annotation by learning visual grounding from
        unannotated screenshots before calibrating with small high-quality data.
      what_remains_open: Still requires some high-quality calibration data; no available
        limitation evidence for robustness beyond reported grounding settings.
    - line: Unified GUI and code action agents
      what_it_solves: Coordinating GUI interaction and code execution in one end-to-end
        action space with environment-verifiable tasks.
      what_remains_open: Cross-platform evidence is partial; no explicit limitation
        is reported, leaving deployment boundaries unclear.
    - line: Recovery evaluation and diagnostic frameworks
      what_it_solves: Formalizing and measuring transition-consistent recovery through
        controlled error injection and goal-oriented action replay.
      what_remains_open: Environment reset feasibility, long-horizon replay cost,
        and API-only rollback limit adoption; actual recovery improvement remains
        open.
    - line: Alternative decoding GUI agent models
      what_it_solves: Bringing block-wise diffusion to multimodal GUI grounding and
        navigation while aiming to preserve parallel decoding advantages.
      what_remains_open: Latency/quality trade-offs and interactive serving behavior
        are not evidenced in the packet.
    consensus:
    - Supervised initialization followed by reinforcement learning or calibration
      appears as a common training pattern across online and harness-native agent
      systems.
    - Evaluation relies on grounded interactive benchmarks, often reporting task success
      on OSWorld-Verified, Online-Mind2Web, CUA-World, or OSExpert-Eval.
    - Reusable trajectories, skill libraries, and memory artifacts are treated as
      deployable components that improve grounding or reduce execution cost.
    - Native computer use is increasingly treated as coordinated interface interaction
      plus executable actions rather than isolated GUI clicking.
    disagreements:
    - 'Action representation differs: some systems retain GUI-only actions, while
      others unify GUI and code execution in one action space.'
    - 'Training signal differs: weak supervision from unlabeled screenshots, online
      multi-turn RL on live sites or harnesses, and diffusion-based supervised fine-tuning
      reflect distinct optimization choices.'
    - 'Memory and skill integration differs: context retrieval as a skill library,
      deterministic callable replay of validated trajectories, and end-to-end learned
      policy memory are separate mechanisms.'
    - 'Primary evaluation targets differ: end-to-end task success, recovery consistency,
      token/time efficiency, or cross-platform transfer.'
    - 'Deployment settings differ: web-specific live-browser training, desktop/OS
      environments, and harness-native multi-environment orchestration create different
      reproducibility conditions.'
    open_questions:
    - Can post-training or memory mechanisms improve error recovery, given evidence
      that recovery remains weak after RL?
    - What are the safe applicability boundaries for deterministic replayable memory
      when GUI states are ambiguous or non-reproducible?
    - How do changes in harness design or infrastructure affect agent trainability
