  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design
      what_it_solves: Creates shared tasks and datasets that cover diverse GUI environments
        and interaction types, such as macOS desktop automation (MacAgentBench), dynamic
        short-video platforms (LivingScreen), drag-based interactions (DragOn), and
        video-guided GUI tasks (VG-GUIBench), enabling comparable evaluation of agent
        capabilities.
      what_remains_open: Whether the task distribution covers the long tail of real-world
        GUI workflows, including cross-app, long-horizon scenarios and rapidly evolving
        interfaces; the representativeness of the chosen applications and actions
        for the broader space of GUI automation.
    - line: Metric and stress-test design
      what_it_solves: Probes agent performance beyond aggregate success rates via
        fine-grained sub-goal scoring (MacAgentBench), cost-accuracy and information
        efficiency (LivingScreen), uncertainty quantification for grounding (Argus),
        and spatial safety through conformal click regions, revealing strengths and
        weaknesses that binary metrics hide.
      what_remains_open: Alignment between these proxy metrics and the downstream
        user-perceived utility or task completion quality; the cross-model and cross-interface
        transferability of uncertainty rankings, and the sensitivity of metrics to
        subtle failures like over-observation and under-observation in dynamic environments.
    - line: Comparable baselines and reporting
      what_it_solves: Makes results auditable and reproducible by establishing common
        evaluation frameworks, comparing multiple model families and agent scaffolding
        configurations (e.g., 16 models over 3 frameworks in MacAgentBench; 27+8 UQ
        methods in Argus), and providing deterministic rule-based scoring or open-source
        environments.
      what_remains_open: Whether benchmark conclusions remain stable across different
        implementations, compute budgets, and training data regimes; the extent to
        which agent-external components (skill libraries, RL training, keyframe extraction)
        confound the measurement of model capability, and the reproducibility gaps
        due to missing artifacts (low reproducibility scores for some benchmarks).
    consensus:
    - Fine-grained, sub-goal-level metrics consistently reveal performance differences
      that aggregate success rates hide, indicating that task completion alone is
      insufficient for characterizing GUI agent capability.
    - Current GUI agents suffer from deficient observation control, manifesting as
      over-observation or under-observation in dynamic environments, which limits
      their efficiency and robustness.
    - Multimodal skill artifacts that retain visual figures improve UI element identification
      and workflow verification, demonstrating that pure text-based skills are insufficient
      for computer-use agents.
    - Evaluating with multiple model families and frameworks is necessary to separate
      the effect of agent scaffolding from the underlying model's ability, as demonstrated
      by the skill-library advantage over framework design in some benchmarks.
    disagreements:
    - 'Benchmarks differ in the environment scope they target: some focus on desktop
      operating systems (macOS) while others are built on browser-based dynamic web
      platforms (short-video), leading to different assumptions about interface stability
      and action space.'
    - 'The evaluation metric emphasis varies: some benchmarks prioritize static task
      completion accuracy, while others introduce cost-efficiency and information
      efficiency, shifting the definition of success from raw accuracy to resource-aware
      performance.'
    - Uncertainty quantification is treated as a separable evaluation dimension in
      Argus but is not explicitly measured in other GUI benchmarks, creating a divergence
      in whether calibration and safety are considered part of agent evaluation.
    - 'Interaction type coverage is uneven: DragOn focuses exclusively on drag-based
      actions (text highlighting, resizing, sliders), while most other benchmarks
      concentrate on click-and-tap interactions, leaving a gap in comprehensive action
      space representation.'
    - Agent scaffolding—such as skill libraries (VISUALSKILL), online RL training
      (ScaleCUA), and keyframe extraction (TASKER)—is evaluated alongside raw models,
      making it difficult to disentangle the contribution of the agent's inherent
      capabilities from the external components.
    open_questions:
    - How can benchmark metrics be aligned with user-perceived utility and task completion
      quality in long-horizon, real-world GUI workflows, beyond the proxy of task
      success or cost?
    - What is the cross-platform and cross-model transferability of uncertainty quantification
      rankings, and how can they be made reliable enough to predict deployment failures
      without per-target re-evaluation?
    - What is the minimal set of interaction types and application domains that must
      be included in a benchmark to ensure comprehensive coverage of the GUI automation
      problem space?
    - How can benchmarks remain valid and up-to-date as interfaces evolve dynamically,
      and what mechanisms can detect and adapt to distributional shifts in real-world
      GUI environments?
    - To what extent do agent-external components (skill libraries, training data,
      frameworks) confound benchmark comparisons, and what standardized protocols
      can isolate the model's native capability from its scaffolding?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计
      解决的问题: 构建覆盖多样化GUI环境和交互类型的共享任务与数据集，如macOS桌面自动化（MacAgentBench）、动态短视频平台（LivingScreen）、拖拽交互（DragOn）和视频引导的GUI任务（VG-GUIBench），使智能体能力具备可比性。
      尚未覆盖: 任务分布是否覆盖了现实世界GUI工作流的真实长尾场景，包括跨应用、长周期任务和快速演变的界面；所选应用与操作对更广泛GUI自动化空间的代表性。
    - 路线: 指标与压力测试设计
      解决的问题: 在总分之外通过细粒度子目标评分（MacAgentBench）、成本-准确率与信息效率（LivingScreen）、定位不确定性量化（Argus）以及共形点击区域的空间安全性检验，揭示二值指标所掩盖的强弱项。
      尚未覆盖: 这些代理指标与下游用户感知效用或任务完成质量的一致性；不确定性排名跨模型和跨接口的可迁移性，以及指标对动态环境中过度观察与观察不足等细微故障的敏感性。
    - 路线: 可比基线与报告规范
      解决的问题: 通过建立统一评估框架、比较多个模型家族和智能体脚手架配置（如 MacAgentBench 在 3 个框架上比较 16 个模型，Argus
        评估 27+8 种 UQ 方法），并提供确定性规则评分或开源环境，使结果可审计和可复现。
      尚未覆盖: 基准结论在不同实现、算力预算和训练数据方案下是否稳定；智能体外部组件（技能库、RL 训练、关键帧提取）在多大程度上混淆了模型能力的测量，以及部分基准因缺少工件（低复现性评分）导致的复现缺口。
    共识:
    - 细粒度、子目标层级的指标能够持续揭示聚合成功率所掩盖的性能差异，表明仅靠任务完成不足以刻画GUI智能体能力。
    - 当前GUI智能体普遍存在观察控制缺陷，在动态环境中表现为过度观察或观察不足，限制了其效率和鲁棒性。
    - 保留视觉图形的多模态技能工件可以改善UI元素识别和工作流状态验证，证明纯文本技能对计算机使用智能体不够充分。
    - 有必要使用多个模型家族和框架进行评估，以分离智能体脚手架的影响与模型本身能力，如某些基准中技能库的优势超过框架设计。
    分歧:
    - 基准在环境范围上存在差异：一些聚焦桌面操作系统（macOS），另一些基于浏览器动态Web平台（短视频），导致对界面稳定性和动作空间的假设不同。
    - 评估指标的侧重点不同：部分基准优先考虑静态任务完成准确率，另一些引入成本效率和信息效率，将成功的定义从准确率转向资源感知性能。
    - 不确定性量化在 Argus 中被作为独立的评估维度，但在其他GUI基准中未明确测量，导致对校准和安全是否属于智能体评测的范畴产生分歧。
    - 交互类型覆盖不均：DragOn 专注于拖拽操作（文本高亮、调整大小、滑块），而大多数其他基准集中于点击和触控，使得全面动作空间表征存在缺口。
    - 智能体脚手架——如技能库（VISUALSKILL）、在线RL训练（ScaleCUA）和关键帧提取（TASKER）——与原始模型一同被评估，难以分清智能体原生能力与外部组件的贡献。
    开放问题:
    - 基准指标如何与长周期、真实世界GUI工作流中用户感知的效用和任务完成质量对齐，而不仅仅是任务成功或成本的代理？
    - 不确定性量化排名在跨平台和跨模型上的可迁移性如何，以及如何使其足够可靠以预测部署失败，而无需对每个目标重新评估？
    - 为全面覆盖GUI自动化问题空间，基准必须包含的最小交互类型和应用领域集合是什么？
    - 随着界面动态演变，基准如何保持有效且不过时，有何机制可以检测并适应现实世界GUI环境中的分布偏移？
    - 智能体外部组件（技能库、训练数据、框架）在多大程度上混淆了基准比较，什么标准化协议可以将模型原生能力与脚手架分离开来？
