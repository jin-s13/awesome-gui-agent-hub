    研究路线矩阵:
    - 路线: 真实桌面GUI基准测试（例如 MacAgentBench）
      解决的问题: 在多应用桌面任务中评估计算机使用智能体，覆盖GUI与CLI，并使用确定性细粒度子目标评分来揭示被Pass@1掩盖的能力差异。
      尚未覆盖: 证据仅限于macOS且基于规则；语义任务成功、跨操作系统迁移以及对应用或界面变化的敏感性尚未测量。
    - 路线: 面向重复计算机任务的技能与记忆复用（例如 VISUALSKILL、PreAct、EchoPath）
      解决的问题: 将经过验证的GUI轨迹或多模态应用知识压缩为可检索技能、状态机程序或可调用记忆，以改善UI定位并降低重复任务的token和时间成本。
      尚未覆盖: 重放与检索假设状态是确定的或已预先验证；对界面变化、模糊工作流和新任务参数的泛化尚未建立。
    - 路线: 动态与视频引导的GUI交互基准测试（例如 LivingScreen、VG-GUIBench）
      解决的问题: 通过形式化观察控制、信息效率和任务感知的关键帧提取，测试并改善智能体在动态内容和视频引导GUI任务上的能力。
      尚未覆盖: 动态界面覆盖仅限于短视频平台；尚未达到人类水平的成本-准确性；视频引导关键帧收益仅在选定的VideoQA数据集和一个GUI基准上报告。
    - 路线: 专用交互原语与GUI模型架构（例如 DragOn、LLaDA-UI）
      解决的问题: 覆盖基于拖拽的定位与交互数据，并将块级扩散视觉语言模型扩展到移动、桌面和网页平台的GUI定位与导航。
      尚未覆盖: 拖拽覆盖仅代表一种交互原语；扩散智能体的可复现性和真实部署在已报告基准比较之外仍是验证缺口。
    共识:
    - 基准测试正从粗粒度点击成功转向细粒度子目标、能力和成本-准确性指标，因为综合成功掩盖了重要的过程差异。
    - 视觉定位与多模态UI理解是核心瓶颈；保留视觉证据或对齐原生分辨率视觉编码器可以改善UI元素识别和工作流状态验证。
    - 复用成功轨迹、技能或记忆可以显著降低重复任务的成本与延迟，无需每步语言模型规划。
    - 当前智能体仍难以应对动态或变化的屏幕内容，特别是过度观察与观察不足，因此观察控制仍是未解决的能力。
    - 基准特定证据占主导；性能声明依赖构建的或平台特定的任务套件，而不是广泛的真实专业工具部署。
    分歧:
    - 评测设置不同：静态多应用桌面任务套件采用确定性规则评分，动态屏幕界面强调成本-准确性指标，视频引导和拖拽特定任务套件则强调不同的效度标准。
    - 改进机制不同：有的通过多模态技能工件增强智能体上下文，有的将轨迹编译为可重放记忆，有的改变底层视觉语言生成范式，还有的通过关键帧提取预处理视频帧。
    - 交互模式重点不同：GUI加CLI操作、仅拖拽交互、重复任务重放以及视频引导或动态内容观察被作为不同的交互问题处理。
    - 证据与可复现性不同：部分工作报告了基准和数据集构建及模型比较，而代码、数据集和工件可得性信号不均或缺失，使部分声明成为验证缺口而非已确立的迁移能力。
    开放问题:
    - 当界面布局、任务参数或应用状态超出已验证的重放前提时，轨迹或技能记忆是否能迁移？
    - 如何让智能体学习对动态屏幕界面的观察控制，而不是对动态内容过度观察或观察不足？
    - 基于规则的Pass@1和子目标指标是否足以刻画真实桌面自动化中的语义任务成功与安全性？
    - 在合成拖拽、视频引导或基准特定GUI套件上的收益是否能迁移到专业工具和跨操作系统部署？
    - 在若干方法缺少代码、数据集或工件细节的情况下，所报告GUI智能体收益的可复现性边界在哪里？
