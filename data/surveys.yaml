  related_work_outline:
  - 'Mainstream direction: The 2026 frontier centers on benchmarking and adapting
    GUI/computer-use agents across real desktops, dynamic feeds, video-guided tasks,
    and drag interactions, with metrics moving beyond Pass@1 to sub-goal completion,
    cost-accuracy, and grounding uncertainty.'
  - 'Shared research pattern: Works create or reuse large interaction datasets/task
    suites, evaluate frontier vision-language models, and identify gaps around observation
    control, sub-goal resolution, transfer stability, or data efficiency; several
    methods improve frozen or open agents via harness evolution, online RL, weak supervision,
    or keyframe extraction.'
  - 'Key differences: Task assumptions vary from static macOS GUI+CLI and drag interactions
    to living-screen dynamic content; improvement targets differ among execution-harness
    optimization, model training/task synthesis, input keyframe selection, and uncertainty
    calibration. Evaluation objectives also differ: Pass@1, cost-accuracy, UQ ranking,
    or spatial conformal safety.'
  - 'Trend evolution: Within this 2024-2026 window, the visible 2026 evidence shifts
    from simple click-based static success toward dynamic observation, interaction-type
    coverage, scalable task/data generation, and transfer of harness or uncertainty
    improvements across benchmarks.'
  - 'Open questions: How to give agents observation control, isolate model gains from
    harness/skill/data effects, make fine-grained and uncertainty metrics robust under
    distribution shift, and extend evidence from single-step grounding or platform-specific
    benchmarks to multi-step deployment.'
  related_work_outline_zh:
  - 主流方向：2026年前沿集中在真实桌面、动态信息流、视频引导任务与拖拽交互上的GUI/计算机使用代理基准测试与适配；评估从Pass@1走向子目标完成、成本-准确率和接地不确定性。
  - 研究共性：工作创建或复用大规模交互任务/截图，评估前沿视觉语言模型，并暴露观察控制、子目标分辨率、迁移稳定性或数据效率缺口；部分方法通过harness演化、在线RL、弱监督或关键帧提取改进冻结或开源代理。
  - 关键差异：任务假设从静态macOS GUI+CLI与拖拽交互到动态短视频变化；改进目标在harness优化、模型训练/任务合成、输入关键帧选择与不确定性校准之间不同；评估目标也分为Pass@1、成本-准确率、UQ排序或空间共形安全。
  - 趋势演进：在2024-2026窗口内，可见的2026证据从点击式静态成功转向动态观察、交互类型覆盖、可扩展任务/数据生成，以及harness或不确定性改进的跨基准迁移。
  - 开放问题：如何赋予代理观察控制，如何隔离模型收益与harness/技能库/数据效应，如何让细粒度与不确定性指标在分布偏移下稳健，以及如何将单步接地或平台特定基准证据扩展到多步部署。
  literature_review:
    line_of_work_matrix:
    - line: Real-world, dynamic, and interaction-specific GUI benchmarks
      what_it_solves: 'Covers evaluation gaps beyond click-only static tasks: macOS
        desktop GUI+CLI tasks, living-screen short-video observation, drag interactions,
        and video-guided GUI grounding.'
      what_remains_open: Dyadic metrics reveal sub-goal and observation-control gaps,
        but several benchmarks remain platform- or single-step-specific; limitations
        are often unreported, and transfer to other interfaces is unproven.
    - line: Agent adaptation through training, task synthesis, and execution-harness
        evolution
      what_it_solves: Improves GUI/computer-use agents by optimizing the frozen execution
        harness, scaling verifiable online RL, exploiting unannotated screenshots,
        or selecting task-relevant keyframes.
      what_remains_open: Attribution remains unclear across backbone model, harness/skill
        library, task data, and planner effects; transfer evidence is narrow, and
        data/annotation efficiency gains are not fully bounded.
    - line: Uncertainty quantification and evidence protocols for GUI grounding
      what_it_solves: Benchmarks post-hoc UQ methods and conformal click regions to
        measure ranking stability and spatial safety for single-step GUI grounding.
      what_remains_open: Cross-model and cross-interface UQ transfer is weak, conformal
        coverage degrades under distribution shift, and multi-step agent trajectories
        are not yet covered.
    consensus:
    - 'Evaluation is moving beyond aggregate success to finer signals: sub-goal completion,
      information efficiency or cost-accuracy, drag grounding, and uncertainty ranking.'
    - Current GUI agents still show a clear gap below human-level or stable deployment;
      gains are often tied to task-specific data, skill libraries, harnesses, or evaluation
      settings rather than purely to backbone capability.
    - Scalable synthesis, unannotated screenshots, online RL, harness evolution, and
      keyframe extraction are emerging as repeated ways to reduce annotation cost
      or improve frozen and open agents.
    disagreements:
    - Some work defines success as Pass@1 on desktop-style tasks, while other work
      scores cost-accuracy on dynamic feeds, drag grounding, or uncertainty-calibrated
      click regions; these choices change what is optimized and reported.
    - 'Improvement targets differ: some methods keep the model frozen and optimize
      the execution harness, others train the model with online RL or weak supervision,
      and still others alter input keyframes or post-hoc uncertainty rather than model
      parameters.'
    - 'Interface assumptions differ: static desktop GUI+CLI, dynamic living-screen
      content, drag interactions, and video-guided tasks require different observation,
      grounding, and action representations; transfer across these settings is not
      established.'
    open_questions:
    - How can agents learn or be steered to control over- and under-observation in
      dynamic interfaces?
    - Which gains are attributable to the model, the harness or skill library, the
      task synthesis/data, and the evaluation protocol?
    - Can fine-grained and UQ metrics remain reliable across platforms, distribution
      shifts, and multi-step trajectories?
    - How far do harness, training, keyframe, and uncertainty improvements transfer
      without target-specific re-evaluation or re-tuning?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 真实世界、动态和交互特定GUI基准
      解决的问题: 覆盖点击式静态任务之外的评估缺口：macOS桌面GUI+CLI任务、动态短视频观察、拖拽交互和视频引导GUI接地。
      尚未覆盖: 细粒度指标揭示子目标与观察控制缺口，但多个基准仍局限于平台或单步；局限性常未报告，跨界面迁移未被证实。
    - 路线: 通过训练、任务合成与harness演进的代理适配
      解决的问题: 通过优化冻结执行harness、扩展可验证在线RL、利用未标注截图或选择任务相关关键帧来改进GUI/计算机使用代理。
      尚未覆盖: 骨干模型、harness/技能库、任务数据和规划器效应的归因不清；迁移证据狭窄，数据/标注效率收益边界不完整。
    - 路线: GUI接地的不确定性量化与证据协议
      解决的问题: 基准测试后验UQ方法和共形点击区域，衡量单步GUI接地的排序稳定性和空间安全。
      尚未覆盖: 跨模型和跨接口UQ迁移较弱，共形覆盖在分布偏移下下降，多步代理轨迹尚未覆盖。
    共识:
    - 评估正在从总体成功走向更细信号：子目标完成、信息效率或成本-准确率、拖拽接地和不确定性排序。
    - 当前GUI代理仍与人类水平或稳定部署有差距；收益常与任务特定数据、技能库、harness或评估设置相关，而不只是骨干能力。
    - 可扩展任务合成、未标注截图、在线RL、harness演化和关键帧提取成为降低标注成本或改进冻结/开源代理的重复模式。
    分歧:
    - 有些工作将成功定义为桌面式任务的Pass@1，另一些则使用动态信息流成本-准确率、拖拽接地或不确定性校准点击区域；这些选择改变了优化和报告目标。
    - 改进目标不同：有些方法冻结模型并优化harness，另一些用在线RL或弱监督训练模型，还有一些改变输入关键帧或后验不确定性而非模型参数。
    - 界面假设不同：静态桌面GUI+CLI、动态短视频内容、拖拽交互和视频引导任务需要不同的观察、接地和动作表示；这些设置之间的迁移尚未建立。
    开放问题:
    - 代理如何学习或被引导以控制动态界面中的过度观察和观察不足？
    - 哪些收益应归因于模型、harness或技能库、任务合成/数据和评估协议？
    - 细粒度与UQ指标能否在跨平台、分布偏移和多步轨迹下保持可靠？
    - harness、训练、关键帧和不确定性改进在没有目标特定重新评估或重新调参的情况下能迁移多远？
