  literature_review:
    line_of_work_matrix:
    - line: Real-world application benchmarks and task coverage for GUI agents
      what_it_solves: Provides fine-grained, rule-based or fidelity-aware evaluation
        for desktop, dynamic short-video, drag-based, and video-guided GUI tasks.
      what_remains_open: Coverage is platform- or interaction-specific; agents do
        not reach human-level cost-accuracy on dynamic interfaces, and observation
        control remains weak.
    - line: Reusable skill, memory, and replay strategies for repeated computer-use
        tasks
      what_it_solves: Compiles successful runs or hierarchical multimodal skills so
        agents can reuse procedural knowledge and avoid repeated per-step language-model
        calls.
      what_remains_open: Generalization under UI or workflow changes, clean-state
        verification of stored programs, and retrieval robustness remain under-tested.
    - line: Automated environment and dataset construction from real application or
        web sources
      what_it_solves: Reconstructs source-grounded, reusable web/app environments
        or large interaction datasets without per-site manual implementation after
        initial setup.
      what_remains_open: Per-site authorization is still needed, and fidelity or transfer
        from reconstructed artifacts to real downstream task success has limited evidence.
    - line: Multimodal GUI agent architectures and interaction grounding
      what_it_solves: Builds or fine-tunes vision-language agents for cross-platform
        GUI grounding and navigation, including drag gestures and block-wise diffusion
        generation.
      what_remains_open: Open-weight reproducibility, cross-platform transfer, and
