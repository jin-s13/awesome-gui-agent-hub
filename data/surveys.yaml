  related_work_outline:
  - 'Mainstream direction: Real interactive GUI and computer-use tasks are being benchmarked
    and improved with finer diagnostics beyond aggregate Pass@1, emphasizing visual
    grounding, interaction diversity, observation efficiency, and data-efficient training.'
  - 'Shared research pattern: Works treat visual grounding, observation control, or
    data/evaluation efficiency as central bottlenecks and use controlled environments
    to separate method behavior from overall task success.'
  - 'Key differences: Interventions split across input observation/keyframe selection,
    model training or weak supervision, execution harness optimization, online RL,
    and post-hoc uncertainty calibration; interaction surfaces range from click and
    drag to CLI and dynamic video.'
  - 'Trend evolution: The available high-ranked evidence is concentrated in 2026,
    so the inferred trend is only within the current frontier; it moves from static
    click-only evaluation toward dynamic, multi-application, interaction-rich, verifiable,
    and self-improving settings.'
  - 'Open questions: How much reported gain comes from task synthesis, sampling/harness
    design, or observation selection rather than the policy itself, and whether observation-control
    and uncertainty-calibration findings transfer across platforms, models, and multi-step
    trajectories.'
  related_work_outline_zh:
  - 主流方向：围绕真实交互式GUI与计算机使用任务开展评测和能力提升，强调超越Pass@1的细粒度诊断、视觉接地、交互多样性和数据高效训练。
  - 研究共性：将视觉接地、观察控制或数据/评测效率作为核心瓶颈，并用受控基准或环境隔离方法贡献与整体任务成功率。
  - 关键差异：干预位置分为输入帧/关键帧选择、弱监督训练、执行harness优化、在线RL和后验不确定性校准；交互面涵盖点击、拖拽、CLI与动态视频，评测指标也不统一。
  - 趋势演进：可用高排名证据集中在2026年前沿，因此只能推断当前前沿内趋势；正在从静态点击评测转向动态、多应用、交互丰富、可验证且能自改进的设置。
  - 开放问题：报告增益有多少来自任务合成、采样/harness设计或观察选择而非策略本身；观察控制和不确定性校准能否跨平台、跨模型及多步轨迹泛化。
  literature_review:
    line_of_work_matrix:
    - line: Cross-environment GUI evaluation and fine-grained diagnostics
      what_it_solves: Measures multi-step computer-use and GUI agents beyond binary
        task success through subgoal scoring, interaction-type coverage, dynamic interface
        cost-accuracy, and uncertainty/conformal diagnostics.
      what_remains_open: Whether these protocols transfer across operating systems,
        application genres, and interface dynamics, and whether unreported baselines
        or limitations mask ceiling effects.
    - line: Weakly supervised and verifiable task-data generation
      what_it_solves: Reduces human annotation cost and enables scalable agent training
        by using massive unannotated screenshots or verifiable synthetic tasks and
        rewardable environments.
      what_remains_open: How much of the observed gain is due to task distribution,
        reward design, or curriculum rather than the learned grounding and action
        policy.
    - line: Harness-level self-improvement and efficient online RL
      what_it_solves: Improves frozen or open GUI agents by optimizing execution harness,
        rollout allocation, context segmentation, or verifiable task synthesis instead
        of retraining full backbones.
      what_remains_open: Whether optimized harness and RL recipes transfer to new
        benchmarks without target-specific re-optimization, and whether the gain source
        is fully isolated from the policy.
    - line: Observation and keyframe representation for dynamic GUI tasks
      what_it_solves: Extracts task-relevant frames or controls observation intake
        to make video-guided and dynamic interfaces tractable and information-efficient.
      what_remains_open: Over- and under-observation remains unsolved, and the evidence
        is concentrated on short-video or video-guided interfaces rather than broader
        dynamic environments.
    - line: Uncertainty-aware grounding and decision interfaces
      what_it_solves: Provides confidence ranking and spatial safety regions for single-step
        GUI grounding across open and closed vision-language agents.
      what_remains_open: Cross-model and cross-interface ranking transfer is weak,
        and evaluation stops at single-step grounding rather than multi-step agent
        trajectories.
    consensus:
    - Finer evaluation signals such as subgoal completion, information cost, interaction-type
      coverage, and uncertainty coverage expose behavior hidden by aggregate task
      success.
    - Visual grounding and observation control are recurring bottlenecks across static,
      dynamic, drag-based, and video-guided GUI tasks.
    - Training and improvement increasingly rely on reducing human annotations through
      weak supervision, verifiable task synthesis, or optimizing the execution context
      around a frozen model.
    - Benchmarks are shifting toward real interactive environments and broader action/interface
      coverage rather than only screenshot-level click actions.
    disagreements:
    - 'Intervention locus differs: some work changes model training or RL, some changes
      the execution harness, some changes input observation or keyframes, and some
      adds post-hoc uncertainty calibration.'
    - 'Interaction scope and supervision differ: drag-based, GUI+CLI, dynamic short-video,
      and video-guided tasks create incomparable evaluation surfaces with different
      dominant failure modes.'
    - 'Evaluation target differs: task success, subgoal completion, cost-accuracy,
      uncertainty ranking transfer, and conformal coverage are optimized separately
      rather than unified.'
    - 'Deployment assumptions differ: frozen open models, fine-tuned open-weight models,
      and closed vendor models are treated differently due to access and interface
      constraints.'
    open_questions:
    - Which reported gains are attributable to task synthesis, sampling/harness optimization,
      or observation extraction rather than to the learned policy or model representation?
    - Can observation-control failures observed in dynamic short-video environments
      be mitigated without losing task accuracy or cross-interface generality?
    - Does uncertainty ranking transfer remain stable from single-step GUI grounding
      to multi-step trajectories and from open-weight to closed models without re-ranking?
    - What are the limits of weakly supervised and verifiable task data on unseen
      actions, long-horizon tasks, or interfaces with dynamic content changes?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 跨环境GUI评测与细粒度诊断
      解决的问题: 通过子目标评分、交互类型覆盖、动态界面成本-准确率和不确定性/共形诊断，衡量多步GUI与计算机使用任务，而不只看二元成功率。
      尚未覆盖: 这些协议能否跨操作系统、应用类型和界面动态迁移，以及未报告基线或局限是否会掩盖性能上限。
    - 路线: 弱监督与可验证任务数据生成
      解决的问题: 利用海量未标注截图或可验证合成任务和可奖励环境，降低人工标注成本并支持可扩展训练。
      尚未覆盖: 观测增益有多少来自任务分布、奖励设计或课程学习，而不是所学到的视觉接地和动作策略。
    - 路线: harness级自改进与高效在线RL
      解决的问题: 通过优化执行harness、采样分配、上下文分割或可验证任务合成来改进冻结或开源GUI智能体，而无需全量重训骨干。
      尚未覆盖: 优化后的harness与RL配方能否在不做目标特定再优化的情况下迁移到新基准，以及增益来源是否与策略贡献完全隔离。
    - 路线: 面向动态GUI任务的观察与关键帧表示
      解决的问题: 提取任务相关帧或控制观察摄入，使视频引导和动态界面更可处理且信息更高效。
      尚未覆盖: 过度观察和观察不足仍未解决，且证据集中在短视频或视频引导界面，尚未覆盖更广泛的动态环境。
    - 路线: 不确定性感知的接地与决策接口
      解决的问题: 为开源和闭源视觉语言智能体的单步GUI接地提供置信度排序和空间安全区域。
      尚未覆盖: 跨模型和跨接口排序迁移较弱，且评测止步于单步接地，未覆盖多步智能体轨迹。
    共识:
    - 子目标完成、信息成本、交互类型覆盖和不确定性覆盖等细粒度信号能暴露整体任务成功率所掩盖的行为差异。
    - 视觉接地和观察控制是静态、动态、拖拽和视频引导GUI任务中的反复瓶颈。
    - 训练与改进越来越依赖弱监督、可验证任务合成或围绕冻结模型优化执行上下文来减少人工标注。
    - 基准正转向真实交互环境和更广的动作/界面覆盖，而非仅限截图级点击动作。
    分歧:
    - 干预位置不同：有的改变模型训练或RL，有的改变执行harness，有的改变输入观察或关键帧，有的加入后验不确定性校准。
    - 交互范围与监督不同：拖拽、GUI+CLI、动态短视频和视频引导任务形成难以直接比较的评测面，主要失败模式也不同。
    - 评测目标不同：任务成功率、子目标完成、成本-准确率、不确定性排序迁移和共形覆盖率被分别优化，缺少统一协议。
    - 部署假设不同：冻结开源模型、微调开源模型和闭源供应商模型因可访问性与接口限制而被区别处理。
    开放问题:
    - 报告增益中有多少来自任务合成、采样/harness优化或观察提取，而非所学策略或模型表示本身？
    - 在动态短视频环境中观察到的观察控制失败，能否在不损失任务准确率或跨界面泛化性的前提下得到缓解？
    - 不确定性排序迁移从单步GUI接地扩展到多步轨迹、从开源模型扩展到闭源模型时，是否无需重新排序仍能保持稳定？
    - 弱监督和可验证任务数据在未见动作、长程任务或动态内容变化界面上的边界在哪里？
