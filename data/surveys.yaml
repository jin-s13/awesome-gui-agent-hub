  related_work_outline:
  - 'Mainstream direction: Real-world computer-use benchmarking is shifting toward
    multi-application desktop, mobile, and web task suites with fine-grained sub-goal
    and cost-aware metrics, while methods increasingly add reusable skills, memories,
    or replay to improve repeated-task efficiency.'
  - 'Shared research pattern: Papers first construct or extend a task-specific benchmark
    or dataset, evaluate frontier GUI agents, identify a bottleneck such as grounding,
    observation control, or interaction coverage, then propose a method targeting
    that bottleneck.'
  - 'Key differences: Evaluation targets range from static macOS desktop tasks to
    dynamic short-video interfaces, video-guided tasks, and drag-only interactions;
    improvement mechanisms range from multimodal skill retrieval and trajectory compilation
    to model-architecture changes and keyframe extraction.'
  - 'Trend evolution: Available top-paper evidence is concentrated in 2026, so the
    trend is within the current frontier rather than a long-term evolution; the visible
    shift is from click-focused success metrics toward multimodal grounding, dynamic
    interfaces, cross-platform coverage, and repeated-task efficiency.'
  - 'Open questions: Whether skill and memory reuse transfers across changing interfaces,
    how to add observation control for living-screen environments, whether rule-based
    success metrics capture real-world semantic success, and whether benchmark-specific
    gains transfer to professional tools remain unresolved.'
  related_work_outline_zh:
  - 主流方向：真实计算机使用评测正从简单点击任务转向跨应用桌面、移动和网页任务，并引入细粒度子目标与成本感知指标；同时方法越来越多地使用可复用技能、记忆或重放来提升重复任务效率。
  - 研究共性：研究者通常先构建或扩展一个任务特定的基准或数据集，评估前沿GUI智能体，识别出定位、观察控制或交互覆盖等瓶颈，再针对该瓶颈提出方法。
  - 关键差异：评测目标从静态macOS桌面任务到动态短视频界面、视频引导任务和拖拽任务各不相同；改进机制包括多模态技能检索、轨迹编译、模型架构变化和关键帧提取。
  - 趋势演进：现有高排名论文集中在2026年，因此趋势处于当前前沿，无法推断长期演变；可见变化是从粗粒度点击成功指标转向多模态定位、动态界面、跨平台覆盖和重复任务效率。
  - 开放问题：技能与记忆复用能否跨界面变化迁移，如何为动态屏幕智能体引入观察控制，规则式成功指标能否反映真实语义成功，以及基准特定收益能否迁移到专业工具仍待解决。
  literature_review:
    line_of_work_matrix:
    - line: Real-world desktop GUI benchmarking (e.g., MacAgentBench)
      what_it_solves: Evaluates computer-use agents on multi-application desktop tasks
        spanning GUI and CLI, using deterministic fine-grained sub-goal scoring to
        expose capability differences masked by Pass@1.
      what_remains_open: Evidence is macOS-specific and rule-based; semantic task
        success, cross-OS transfer, and sensitivity to application or interface changes
        remain unmeasured.
    - line: Skill and memory reuse for repeated computer tasks (e.g., VISUALSKILL,
        PreAct, EchoPath)
      what_it_solves: Compresses validated GUI trajectories or multimodal application
        knowledge into retrievable skills, state-machine programs, or callable memories
        to improve UI grounding and reduce token and time cost on repeated tasks.
      what_remains_open: Replay and retrieval assume deterministic or previously validated
        states; generalization to changed interfaces, ambiguous workflows, and novel
        task parameters is not established.
    - line: Dynamic and video-guided GUI interaction benchmarking (e.g., LivingScreen,
        VG-GUIBench)
      what_it_solves: Tests and improves agents on dynamic content and video-guided
        GUI tasks by formalizing observation control, information efficiency, and
        task-aware keyframe extraction.
      what_remains_open: Dynamic-interface coverage is limited to short-video platforms;
        human-level cost-accuracy has not been reached; video-guided keyframe gains
        are reported on selected VideoQA datasets and one GUI benchmark.
    - line: Specialized interaction primitives and GUI model architectures (e.g.,
        DragOn, LLaDA-UI)
      what_it_solves: Covers drag-based grounding and interaction data, and extends
        block-wise diffusion vision-language models to GUI grounding and navigation
        across mobile, desktop, and web platforms.
      what_remains_open: Drag coverage represents one interaction primitive; diffusion-agent
        reproducibility and real deployment are verification gaps beyond reported
        benchmark comparisons.
    consensus:
    - Benchmarks are shifting from coarse click-focused success to fine-grained sub-goal,
      capability, and cost-accuracy metrics because aggregate success hides important
      process differences.
    - Visual grounding and multimodal UI understanding are central bottlenecks; retaining
      visual evidence or aligning native-resolution vision encoders improves UI element
      identification and workflow state verification.
    - Reusing successful trajectories, skills, or memories can substantially reduce
      repeated-task cost and latency without requiring per-step language model planning.
    - Current agents still struggle with dynamic or changing screen content, notably
      over- and under-observation, so observation control is an unresolved capability.
    - Benchmark-specific evidence dominates; performance claims rely on constructed
      or platform-specific task suites rather than broad real-world professional-tool
      deployment.
    disagreements:
    - 'Evaluation settings differ: static multi-app desktop task suites with deterministic
      rule scoring, living-screen dynamic interfaces with cost-accuracy metrics, and
      video-guided or drag-specific task suites emphasize different validity criteria.'
    - 'Improvement mechanism differs: some augment agent context with multimodal skill
      artifacts, some compile trajectory memory for replay, some change the underlying
      vision-language generation paradigm, and some preprocess video frames via keyframe
      extraction.'
    - 'Interaction-mode focus differs: GUI plus CLI actions, drag-only interactions,
      repeated task replay, and video-guided or dynamic-content observation are treated
