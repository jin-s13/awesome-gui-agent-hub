  literature_review:
    line_of_work_matrix:
    - line: Taxonomy and roadmap synthesis
      what_it_solves: Organizes recent GUI-agent work into direction-level clusters
        such as supervision and task generation, execution-harness/context control,
        and reliability/safety benchmarking.
      what_remains_open: The supplied evidence does not include explicit survey or
        taxonomy protocol details, so systematic coverage and representativeness cannot
        be verified.
    - line: Comparative evaluation synthesis
      what_it_solves: Summarizes how evaluation choices such as single-step grounding,
        long-horizon completion, constrained evidence, and adversarial safety shape
        conclusions across models and datasets.
      what_remains_open: Cross-benchmark compatibility is unresolved; several records
        lack limitation, baseline, metric, code, or dataset details, making setting-level
        comparison uncertain.
    - line: Open problem and gap mapping
      what_it_solves: Converts observed failure patterns such as weak uncertainty
        transfer, domain-conditioned safety, benign recall loss, and long-horizon
        context drift into concrete next research questions.
      what_remains_open: The evidence does not prioritize which gaps matter most or
        validate which intervention should be explored first.
    consensus:
    - GUI-agent progress is evaluated mainly through task completion or grounding
      accuracy on interactive benchmarks; visual grounding and long-horizon execution
      remain central bottlenecks.
    - Supervision quality, interaction context, and benchmark constraints materially
      affect agent success, motivating synthesized tasks, dense annotations, structured
      memory, or harness changes.
    - Frozen foundation models can be improved through external scaffolds, context
      management, or fine-tuning on synthetic/dense data rather than only through
      pretraining scale.
    - Safety, uncertainty, and evidence quality are increasingly treated as first-class
      deployment concerns rather than separate afterthoughts.
    disagreements:
    - 'Intervention stage differs: some works focus on training-time data or online
      reinforcement learning, while others optimize deployment-time harness or context
      around frozen backbones.'
    - 'Evaluation focus differs: single-step grounding and uncertainty calibration,
      long-horizon task completion, and constrained-evidence safety are optimized
      separately; success in one setting does not directly transfer to another.'
    - 'Safety findings conflict across settings: frontier agents resist hand-crafted
      browser prompt injections but fail on coding-domain skill injection, suggesting
      domain-conditioned rather than general robustness.'
    - 'Generalization evidence is mixed: some works report out-of-distribution benchmark
      transfer, while uncertainty-ranking transfer across model tiers is weak and
      target-specific.'
    open_questions:
    - Which evaluation setting best predicts deployed GUI-agent reliability when single-step
      grounding, long-horizon completion, and safety benchmarks give different signals?
    - How can uncertainty calibration remain stable across model tiers and interfaces
      when cross-tier ranking transfer is weak and coverage degrades under distribution
      shift?
    - What evidence is necessary for fraud or safety decisions when reputation shortcuts
      are unavailable, and how can agents maintain benign recall?
    - What are the failure boundaries of harness and context optimization across interfaces,
      and do gains transfer without re-optimization?
    - Can missing limitation, baseline, metric, and code/data details in several evidence
      records be treated as verification gaps rather than negative evidence?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 分类体系与路线图综合
      解决的问题: 将近期GUI智能体研究聚类为监督与任务生成、执行harness/上下文控制、可靠性与安全评测等方向，并梳理缺口。
      尚未覆盖: 证据包未提供明确的综述纳入标准或系统筛选过程，覆盖率与代表性无法验证。
    - 路线: 对比评测综合
      解决的问题: 归纳单步定位、长程任务完成、受限证据与对抗安全等评测选择如何影响跨模型和跨数据集结论。
      尚未覆盖: 跨基准兼容性未解决；部分记录缺少局限性、基线、指标、代码或数据集细节，难以做设置级比较。
    - 路线: 开放问题与缺口映射
      解决的问题: 把不确定性迁移弱、领域条件安全、良性召回不足、长程上下文漂移等观测转化为后续研究问题。
      尚未覆盖: 证据不足以判断哪些缺口优先；也缺少对下一步干预效果的验证。
    共识:
    - GUI智能体的进展主要通过交互基准上的任务完成率或定位准确率衡量；视觉定位和长程执行仍是核心瓶颈。
    - 监督质量、交互上下文和基准约束会显著影响成功，因此工作多采用合成任务、密集标注、结构化记忆或harness改动。
    - 冻结基座模型可通过外部脚手架、上下文管理或合成/密集数据微调获得提升，而不只依赖预训练规模扩张。
    - 安全性、不确定性和证据质量正成为部署中的一级关注点，而非事后补充。
    分歧:
    - 干预阶段不同：一些工作侧重训练期数据或在线强化学习，另一些在部署期围绕冻结骨干优化harness或上下文。
    - 评测聚焦不同：单步定位与不确定性校准、长程任务完成、受限证据安全分别被单独优化，单一设置的成功难以直接迁移。
    - 安全性结论随设置冲突：前沿智能体在手工浏览器提示注入下表现稳健，但在编码领域技能注入下失败，说明安全是领域性而非全局性。
    - 泛化证据不一致：部分工作报告分布外基准迁移，但不确定性排名跨模型层级迁移较弱，需要针对目标重排。
    开放问题:
    - 当单步定位、长程完成和安全基准给出不一致信号时，哪个评测设置最能预测部署后的GUI智能体可靠性？
    - 跨模型层级和界面不确定性排名迁移弱、分布偏移下覆盖度下降，校准应如何保持稳定？
    - 在信誉捷径不可用时，欺诈/安全判断至少需要哪些证据，智能体如何同时维持良性召回？
    - harness与上下文优化在跨界面部署时的失败边界是什么，增益是否必须重新优化？
    - 部分证据缺少局限性、基线、指标或代码/数据信息，这些是验证缺口还是需要负面证据来确认？
