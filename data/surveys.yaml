    line_of_work_matrix:
    - line: Taxonomy and roadmap synthesis
      what_it_solves: 'Turns fragmented GUI-agent evidence into ordered research directions:
        grounding, long-horizon execution, self-improvement, uncertainty, safety,
        and data generation.'
      what_remains_open: Whether the synthesis is backed by systematic inclusion criteria;
        the packet lacks survey-level method details and only 2026 top examples are
