  - 主流方向：当前证据以近期方法和评测研究为主，而非已完成的综述；主流任务是把GUI智能体工作组织为能力、评测和可信度等分类体系，重点包括可验证强化学习、执行框架级自改进、不确定性与安全。
  - 研究共性：论文普遍把任务完成转化为可执行的评测信号，例如截图、重复运行、可验证Docker任务或净化后的网页证据，并围绕策略、执行框架或评测协议进行改进。
  - 关键差异：优化目标不同，有的编辑冻结模型周围的执行框架，有的对策略做在线强化学习，有的主动管理上下文，有的把有噪声评估器反馈作为奖励；部署设置和评测粒度也不同。
  - 趋势演进：在2024至2026年前沿窗口内，研究从静态GUI定位走向可验证任务合成、样本高效强化学习、长程上下文管理以及安全与不确定性审计；时间跨度较窄，难以判断更长历史趋势。
  - 开放问题：跨设置与跨接口迁移的证据仍较弱；安全与不确定性发现依赖特定场景；多条记录缺少局限性与可重复性细节，泛化、部署就绪度和缺口优先级仍未解决。
