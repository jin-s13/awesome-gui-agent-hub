  - 'Mainstream direction: The 2026 frontier concentrates on evaluating GUI agents
    under more realistic interaction constraints—macOS desktop tasks, dynamic short-video
    screens, drag interactions, video-guided control—while also improving training
    and self-improvement efficiency with weak supervision, synthetic verifiable RL,
    and frozen-model harness optimization.'
  - 'Shared research pattern: Papers pair a benchmark or task expansion with analysis
    of a specific GUI capability gap: fine-grained multi-step scoring, observation
    control, keyframe extraction, drag grounding, uncertainty calibration, or failure-driven
    harness edits.'
  - 'Key differences: Contributions split between new evaluation protocols and new
    training/adaptation methods; they differ in supervision, action interface, and
    target claim, such as human, weak, synthetic/verifiable, or repeat-run evidence;
    click, drag, GUI+CLI, dynamic content, or video-guided control; and benchmark
    measurement, open model training, or frozen model improvement.'
  - 'Trend evolution: Because highly visible evidence is heavily concentrated in 2026,
    the observed trend is within the current frontier: from static click-only GUI
    benchmarks toward interaction-rich, verifiable, sample-efficient, and uncertainty-aware
    computer-use agents.'
  - 'Open questions: Evidence still lacks consistent multi-step trajectory-level attribution,
    cross-benchmark and cross-model transfer, deployment robustness under distribution
    shift, and clear separation of model gains from harness, planner, or task-generation
    effects.'
  related_work_outline_zh:
  - 主流方向：2026年前沿集中在更真实交互约束下的GUI代理评测，如macOS桌面、动态短视频、拖拽操作、视频引导控制，同时通过弱监督、可验证在线强化学习和冻结模型执行框架优化来提高训练与自改进效率。
  - 研究共性：论文普遍将基准扩展与某一具体GUI能力缺口分析结合，例如细粒度多步评分、观察控制、关键帧提取、拖拽定位、不确定性校准或失败驱动的框架编辑。
  - 关键差异：贡献分为新评测协议与新训练/适应方法；监督信号、动作接口和目标结论不同，涉及人工、弱监督、可验证合成或重复运行证据，点击、拖拽、GUI+CLI、动态内容或视频引导，以及基准度量、开放模型训练或冻结模型改进。
  - 趋势演进：由于高相关证据主要集中在2026年，观察到的趋势属于当前前沿内部：从静态点击式GUI基准转向交互更丰富、可验证、样本高效且具备不确定性感知的计算机使用代理。
  - 开放问题：仍缺少一致的多步轨迹归因、跨基准跨模型迁移、分布偏移下的部署鲁棒性证据，以及模型收益与执行框架、规划器或任务生成效果之间的清晰分离。
  literature_review:
    line_of_work_matrix:
    - line: Interaction-rich GUI evaluation and benchmark construction
      what_it_solves: Turns grounding, planning, and action prediction into measurable
        tasks across desktop OS, dynamic short-video UIs, drag interactions, and video-guided
        control; reveals fine-grained capability gaps such as sub-goal completion,
        observation control, and information efficiency.
      what_remains_open: Most evidence is held-out task success or single-step grounding;
        cross-interface, multi-step trajectory, and cross-model generalization remain
        lightly covered, and several limitations fields are empty.
    - line: Training and self-improvement methods under limited or synthetic supervision
      what_it_solves: Reduces dependence on expensive human annotations and retraining
        by using unannotated screenshots, verifiable synthetic RL tasks, repeated-run
        evidence, and frozen-backbone harness edits to improve GUI agents.
      what_remains_open: Gain attribution is not cleanly separated from task generation,
        harness, model choice, and training infrastructure; many method papers report
        no limitations or external verification details.
    - line: Action-grounding representation and perception for dynamic visual input
      what_it_solves: 'Addresses action grounding when visual content changes: keyframe
        extraction for video-guided tasks and benchmark formalization of living-screen
        interfaces with observation control as a measurable failure mode.'
      what_remains_open: Evidence is concentrated in short-video or VideoQA-derived
        settings; transfer to other dynamic GUI families and whether perception representation
        or policy behavior is the limiting factor remain open.
    - line: Uncertainty quantification and calibrated action selection for GUI grounding
      what_it_solves: Benchmarks post-hoc UQ methods and conformal click regions to
        signal when GUI grounding decisions should be trusted or spatially guarded.
      what_remains_open: Ranking transfer to closed-source models and cross-interface
        settings is weak; coverage degrades under distribution shift, and the protocol
        is limited to single-step executable grounding.
    - line: Method attribution and reproducibility protocols
      what_it_solves: Separates method contribution from harness, dataset, baseline,
        metric, and implementation effects through benchmark design, repeated runs,
        and fine-grained scoring.
      what_remains_open: Several top papers lack limitation statements, artifact signals,
        or cross-benchmark ablations, leaving evidence gaps about what transfers beyond
        the reported suite.
    consensus:
    - The field is converging on richer, executable GUI tasks and process-level scoring
      rather than static, single-turn action matching.
    - Frozen backbone adaptation and lower-cost supervision are accepted as important
      because human annotation and full retraining are expensive.
    - Multiple papers combine task success with diagnostics such as sub-goal completion,
      observation efficiency, or calibration quality.
    - Researchers treat realistic interfaces—dynamic content, drag, GUI plus CLI,
      and video-guided control—as underexplored limits of prior GUI agents.
    disagreements:
    - 'Supervision assumptions differ: unannotated screenshots, verifiable synthetic
      tasks, repeated-run evidence, or small annotated sets.'
    - 'Intervention location differs: some fine-tune or apply RL to the model, while
      others optimize the execution harness or only select input frames.'
    - Evaluation targets differ across single-step grounding, dynamic screen cost-accuracy,
      GUI+CLI multi-application tasks, drag interactions, and video-guided tasks.
    - 'Evidence on transfer differs: some report frozen-harness transfer across benchmarks,
      while UQ evaluations report weak cross-model and cross-interface ranking transfer.'
    open_questions:
    - How much of reported GUI-agent improvement comes from the model versus the harness,
      task generator, action interface, or selected visual context?
    - Can fine-grained and cost-accuracy metrics generalize across desktop, dynamic
      web, drag, and video-guided settings without re-evaluation?
    - What training or architecture changes are needed to address observation control
      failures beyond the short-video benchmark setting?
    - How can uncertainty estimates maintain conformal coverage and ranking quality
      under interface or distribution shift?
    - What multi-step trajectory and limitation evidence is missing from the current
      benchmark and method reports?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 交互丰富的GUI评测与基准构建
      解决的问题: 将定位、规划和动作预测变成可测量任务，覆盖桌面操作系统、动态短视频界面、拖拽操作和视频引导控制，并揭示子目标完成、观察控制和信息效率等细粒度能力缺口。
      尚未覆盖: 证据主要来自保留集成功或单步定位；跨界面、多步轨迹和跨模型泛化覆盖较少，若干论文局限性字段为空。
    - 路线: 有限或合成监督下的训练与自改进方法
      解决的问题: 通过未标注截图、可验证合成RL任务、重复运行证据和冻结骨干Harness编辑降低对人工标注和重训练的依赖，从而改进GUI代理。
      尚未覆盖: 收益归因尚未与任务生成、Harness、模型选择和训练基础设施清晰分离；许多方法论文未报告局限性或外部验证细节。
    - 路线: 动态视觉输入下的动作定位表示与感知
      解决的问题: 处理内容变化时的动作定位：面向视频引导任务的关键帧提取，以及将动态屏幕界面的观察控制形式化为可测量失败模式。
      尚未覆盖: 证据集中在短视频或VideoQA衍生场景；其他动态GUI类型上的迁移，以及瓶颈是感知表示还是策略行为，仍未解决。
    - 路线: GUI定位中的不确定性量化与校准动作选择
      解决的问题: 基准化后验UQ方法和共形点击区域，以指示何时应信任GUI定位决策或进行空间防护。
      尚未覆盖: 向闭源模型和跨接口场景的排名迁移较弱；分布偏移下覆盖度下降，且协议仅限于单步可执行定位。
    - 路线: 方法归因与可复现协议
      解决的问题: 通过基准设计、重复运行和细粒度评分区分方法贡献与Harness、数据集、基线、指标和实现因素的影响。
      尚未覆盖: 多篇高排名论文缺少局限性说明、工件信号或跨基准消融，留下超越报告套件后能迁移什么的证据缺口。
    共识:
    - 领域正从静态、单轮动作匹配转向更丰富的可执行GUI任务和过程级评分。
    - 冻结骨干适应和低成本监督被普遍视为重要方向，因为人工标注和完整重训练成本很高。
    - 多项工作将任务成功与子目标完成、观察效率或校准质量等诊断信号结合。
    - 研究者将动态内容、拖拽、GUI加CLI、视频引导控制等真实接口视为先前GUI代理尚未充分探索的边界。
    分歧:
    - 监督假设不同：未标注截图、可验证合成任务、重复运行证据或小规模标注集。
    - 干预位置不同：有的微调或对模型施加RL，有的只优化执行Harness或只选择输入帧。
    - 评测目标不同：单步定位、动态屏幕成本-准确性、GUI+CLI多应用任务、拖拽交互和视频引导任务。
    - 迁移证据不同：有工作报告冻结Harness跨基准迁移，而不确定性量化评估报告跨模型和跨接口排名迁移较弱。
    开放问题:
    - 报告中的GUI代理改进有多少来自模型本身，多少来自Harness、任务生成器、动作接口或所选视觉上下文？
    - 细粒度指标和成本-准确性指标能否在桌面、动态网页、拖拽和视频引导场景中无需重新评测即可泛化？
    - 需要哪些训练或架构变化来解决短视频基准之外的观察控制失败？
    - 不确定性估计如何在接口或分布偏移下维持共形覆盖和排名质量？
    - 当前基准和方法报告中还缺少哪些多步轨迹与局限性证据？
