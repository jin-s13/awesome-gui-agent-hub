    - 部署场景不同：桌面、移动、网页和视频引导任务产生不同的动作空间、状态观测和失败模式。
    开放问题:
    - 定位与不确定性结果能否从单步基准迁移到多步 GUI 轨迹和未见过界面？
    - 在 OSWorld、AndroidControl、ScreenSpot-Pro、MobileWorld 和 WindowsAgentArena 上报告的提升在协议和基线不同时是否可比？
    - 更广泛数据包中存在哪些系统综述/分类体系证据；有界的高排名样本看起来偏向方法与基准，这是一个验证缺口。
