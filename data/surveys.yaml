  - 主流方向：围绕真实桌面、动态短视频和拖拽等交互场景构建 GUI 代理评测与改进方法，强调细粒度评估而非只看总体成功率。
  - 研究共性：先形式化某类被忽视的交互或评估缺口，构建任务集或训练信号，再用强基线报告定向提升或反复出现的失败模式。
  - 关键差异：监督来源、优化层级、交互类型、可靠性目标和迁移证据各不相同，尚未形成统一路径。
  - 趋势演进：在 2024–2026 前沿区间内，研究从粗粒度成功率转向观察控制、不确定性量化、harness/技能演化和低标注/可验证扩展。
