  related_work_outline_zh:
  - 主流方向：在真实与动态GUI交互上构建更细粒度评测，并推进数据高效或可验证奖励驱动的训练方法，如弱监督与在线强化学习。
  - 研究共性：先通过基准揭示缺失能力，如拖拽、动态观察、长时程上下文或不确定性，再用配对方法、数据或策略补齐缺口或量化决策属性。
  - 关键差异：工作范围覆盖静态单步定位、动态视频任务、拖拽交互、桌面GUI+CLI与移动长时程；监督信号覆盖未标注截图、可验证合成任务与标注轨迹。
  - 趋势演进：证据集中在2026年前沿；领域正从点击/静态任务成功转向动态观察控制、数据效率和不确定性校准。
  - 开放问题：跨环境迁移、方法增益与系统组件的归因，以及细粒度基准指标能否预测真实部署可靠性仍不清楚。
  literature_review:
    line_of_work_matrix:
    - line: Realistic GUI benchmarking and fine-grained evaluation
      what_it_solves: Moves GUI-agent evaluation from simplified click success toward
        multi-application, dynamic, video-guided, drag-based, and sub-goal/safety-aware
        measurement of agent capabilities.
      what_remains_open: Benchmarks are often restricted to one platform or interface;
        cross-interface transfer and whether fine-grained metrics predict real-world
        task success remain unresolved.
    - line: Grounded policy learning and data- or reward-efficient training
      what_it_solves: Trains GUI grounding and action prediction from large-scale
        unannotated screenshots, small annotated trajectories, or verifiable synthetic
        tasks combined with online RL.
      what_remains_open: Reported gains are not clearly isolated from model capability,
        task design, data scale, or surrounding frameworks and skill libraries; transfer
        beyond reported platforms remains limited.
    - line: Long-horizon context and observation control
      what_it_solves: Mitigates information loss and over/under-observation in multi-step
        dynamic interfaces through compact structured context or proactive context-management
        actions.
      what_remains_open: Current agents still show observation-control failures, and
        learned context policies lack broad deployment evidence beyond reported mobile
        or dynamic-video settings.
    - line: Uncertainty-aware grounding and calibration
      what_it_solves: Provides post-hoc uncertainty estimates and calibrated spatial
        regions to make single-step GUI grounding more selective and safety-aware.
      what_remains_open: Findings are limited to single-step executable grounding;
        uncertainty ranking transfers weakly across model tiers and interfaces, requiring
        target-specific recalibration.
    consensus:
    - Realistic evaluation settings expose capability deficits that aggregate success
      hides, including sub-goal completion differences, observation inefficiency,
      drag grounding difficulty, and calibration coverage loss.
    - Recent work seeks to reduce expensive human supervision through weak supervision
      from unannotated screenshots, synthetic verifiable tasks, or structured trajectory
      datasets.
    - GUI-agent progress is evaluated across broader action spaces and interfaces,
      including desktop GUI+CLI, dynamic short-video screens, drag operations, and
      long-horizon mobile tasks.
    - Method contribution and system contribution are often confounded; evaluation
      must separate policy ability from frameworks, skill libraries, task priors,
      data scale, and base VLM choice.
    disagreements:
    - 'Supervision strategy differs: weak-screenshot pretraining plus RL calibration,
      verifiable task synthesis plus online RL, and supervised fine-tuning on context-managed
      trajectories.'
    - 'Evaluation scope differs: static single-step grounding, multi-step task success,
      cost-accuracy in dynamic screens, drag interaction completion, and long-horizon
      mobile generalization.'
    - 'Primary evidence metric differs: Pass@1, fine-grained sub-goal scores, cost-accuracy,
      task-specific drag accuracy, and uncertainty ranking or conformal coverage.'
    - 'Interaction assumptions differ: click-based action spaces, drag operations,
      GUI+CLI mixed workflows, dynamic content changing between actions, and proactive
      context management.'
    open_questions:
    - Can data-efficient grounding and verifiable RL transfer from reported desktop
      or static settings to dynamic, drag-heavy, and long-horizon deployment without
      target-specific fine-tuning?
    - Do fine-grained benchmark metrics such as sub-goal completion, cost-accuracy,
      or calibrated click regions predict success on real downstream computer-use
      tasks?
    - How much of reported GUI-agent gain is attributable to the policy, the task
      synthesis pipeline, the base vision-language model, or the surrounding framework
      and skill library?
    - How should observation control and context management be learned and evaluated
      beyond task success to prevent over/under-observation in dynamic interfaces?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 真实GUI交互基准与细粒度评估
      解决的问题: 将GUI代理评测从简化点击成功转向多应用、动态、视频引导、拖拽和子目标/安全感知的能力测量。
      尚未覆盖: 基准通常限于单一平台或接口；跨界面迁移以及细粒度指标是否预测真实任务成功仍未解决。
    - 路线: 策略学习与数据/奖励规模化训练
      解决的问题: 从大规模未标注截图、少量标注轨迹或可验证合成任务与在线RL训练GUI定位和动作预测。
      尚未覆盖: 收益是来自模型能力、数据规模、任务设计还是技能库/框架未隔离，跨平台证据仍然不足。
    - 路线: 长时程上下文与观察控制
      解决的问题: 通过紧凑结构化上下文或主动上下文管理动作缓解多步动态任务中的信息丢失和过度/不足观察。
      尚未覆盖: 当前模型仍存在观察控制不足；学习到的上下文策略缺少更广泛部署验证。
    - 路线: 不确定性感知定位与校准
      解决的问题: 提供后验不确定性和校准点击区域，使单步GUI定位更安全且具备可选择性。
      尚未覆盖: 仅限单步定位；不确定性排名跨模型层级与接口迁移较弱，仍需目标特定校准。
    共识:
    - 真实评测暴露聚合成功指标隐藏的能力缺陷，包括子目标完成差异、观察低效、拖拽定位困难与校准覆盖下降。
    - 研究试图通过未标注截图弱监督、可验证合成任务或结构化轨迹数据降低对昂贵人工标注的依赖。
    - 动作空间与接口从点击扩展至拖拽、GUI+CLI、动态短视频和移动长时程任务。
    - 方法贡献与系统贡献经常混杂，需要将策略能力与框架、技能库、任务先验、数据规模和基础视觉语言模型分开。
    分歧:
    - 监督策略不同：弱监督截图预训练加RL校准、可验证任务合成加在线RL、标注上下文管理轨迹的监督微调。
    - 评测范围不同：静态单步定位、多步任务成功、动态屏幕成本-准确率、拖拽完成、长时程移动泛化。
    - 主要证据指标不同：Pass@1、细粒度子目标得分、成本-准确率、拖拽准确率、不确定性排名或共形覆盖。
    - 交互假设不同：点击动作空间、拖拽操作、GUI+CLI混合工作流、动作间内容动态变化、主动上下文管理。
    开放问题:
    - 数据高效定位与可验证RL能否从桌面或静态场景迁移到动态、拖拽密集和长时程部署，且无需目标特定微调？
    - 子目标完成、成本-准确率或校准点击区域等细粒度基准指标是否预测真实下游计算机使用任务成功？
    - 已报告的GUI代理增益有多少归因于策略、任务合成管线、基础视觉语言模型或外围框架与技能库？
    - 如何在任务成功之外学习与评估观察控制和上下文管理，以避免动态界面中的过度/不足观察？
