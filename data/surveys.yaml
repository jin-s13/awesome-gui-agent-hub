  related_work_outline:
  - 'Mainstream direction: The current frontier concentrates on grounding and action
    prediction for GUI/computer-use agents evaluated on realistic, fine-grained interactive
    benchmarks, with parallel work on model training, data efficiency, and test-time
    harness or observation control.'
  - 'Shared research pattern: Vision-language backbones are probed with screenshot-based
    tasks; success is decomposed into sub-goal, checkpoint, or cost-accuracy scores,
    and improvements come from targeted data, RL, keyframe/observation selection,
    or harness changes.'
  - 'Key differences: Work splits between training the agent with weak supervision
    or RL, optimizing a frozen execution harness, adding task-relevant keyframe extraction,
    and benchmarking or calibrating uncertainty and interaction coverage.'
  - 'Trend evolution: Within the narrow 2024-2026 evidence, methods are moving from
    static click grounding toward dynamic interfaces, verifiable task synthesis, GUI+CLI
    interaction coverage, and uncertainty-aware calibration.'
  - 'Open questions: Cross-platform transfer, separating model contribution from harness/data/planner
    choices, observation control under changing interfaces, and UQ transfer beyond
    single-step grounding remain under-evidenced.'
  related_work_outline_zh:
  - 主流方向：当前前沿集中在真实、细粒度交互基准上的GUI/计算机使用代理 grounding 与动作预测，并在模型训练、数据效率和测试期 harness/观察控制之间形成分工。
  - 研究共性：视觉-语言骨干以截图任务被评估；成功被分解为子目标、检查点或成本-准确性得分；改进来自定向数据、RL、关键帧/观察选择或 harness 变化。
  - 关键差异：工作分为以弱监督或 RL 训练代理、优化冻结执行 harness、添加任务相关关键帧提取，以及测评或校准不确定性与交互覆盖。
  - 趋势演进：在本证据包 2024-2026 前沿内，方法从静态点击 grounding 向动态界面、可验证任务合成、GUI+CLI 交互覆盖和不确定性感知校准演进。
  - 开放问题：跨平台迁移、分离模型贡献与 harness/数据/规划器选择、变化界面下的观察控制、以及超越单步 grounding 的 UQ 迁移仍证据不足。
  literature_review:
    line_of_work_matrix:
    - line: Realistic GUI/computer-use benchmarking with fine-grained completion scoring
      what_it_solves: Converts heterogeneous desktop, dynamic short-video, and drag-based
        interactions into measurable agent capabilities beyond coarse pass/fail.
      what_remains_open: Results are tied to specific OS/platform or interaction subsets;
        cross-interface and cross-task transfer, plus missing limitation evidence,
        limit generalizability.
    - line: Weakly-supervised and RL-based training for GUI action grounding
      what_it_solves: Reduces annotation cost and scales verifiable computer-use tasks
        through unannotated screenshots, curriculum calibration, and online RL.
      what_remains_open: Reported gains are benchmark-specific; contribution from
        task synthesis, sampling strategy, and visual context compression is not fully
        isolated.
    - line: Test-time execution-harness and observation-control optimization
      what_it_solves: Improves frozen or pre-trained GUI models by optimizing the
        executable harness, accumulating run evidence, or selecting task-relevant
        keyframes.
      what_remains_open: Separation between model ability and harness/planner/observation
        policy is unclear; transfer beyond evaluated harness and video domains remains
        unproven.
    - line: Post-hoc uncertainty quantification for grounding decisions
      what_it_solves: Provides confidence estimates and conformal click/action regions
        for GUI grounding, enabling selective trust and spatial safety.
      what_remains_open: Benchmark coverage is limited to single-step grounding; multi-step
        agent trajectories and closed-source cross-tier transfer require target-specific
        re-ranking.
    - line: Interaction coverage and action-interface formalization
      what_it_solves: Formalizes dynamic living-screen and drag/gesture interactions
        that click-only benchmarks miss, and maps them to model-human cost-accuracy
        comparison.
      what_remains_open: Coverage is limited to short-video or drag tasks; integration
        with complete agent planning and action prediction pipelines is not established.
    consensus:
    - Current GUI-agent evaluation uses screenshot-based vision-language backbones
      and decomposes success into sub-goal, checkpoint, or cost-accuracy scores rather
      than only final Pass@1.
    - Several results show that data, harness, or observation choices, rather than
      backbone model alone, drive performance differences; this motivates separately
      reporting model and system/harness contributions.
    - Across real-world and dynamic interfaces, even frontier models remain below
      human-level, with over-observation, under-observation, and grounding failures
      recurring.
    - 'Verification gaps are common: many recent entries report limited or empty limitation
      sections, and reproducibility signals vary; this is a missing-evidence issue
      rather than proof of absent artifacts.'
    disagreements:
    - 'Intervention mode differs: train the agent with weak supervision or RL versus
      optimize the execution harness around a frozen model versus select keyframes/observations
      versus benchmark and calibrate uncertainty.'
    - 'Supervision and data source differ: unannotated screenshots with weak labels,
      verifiable synthesized RL tasks, and human-annotated benchmark suites create
      different generalization assumptions.'
    - 'Evaluation target differs: single-step grounding, multi-step application completion,
      dynamic observation control, and drag/gesture interaction are measured separately,
      limiting direct comparability.'
    - 'Metric emphasis differs: Pass@1 success, cost-accuracy, sub-goal completion,
      skill-library contribution, and UQ ranking/coverage are prioritized differently
      across studies.'
    - 'Transfer evidence differs: some work reports cross-benchmark harness transfer,
      while uncertainty work finds weak cross-model and closed-source ranking transfer,
      so transferability remains unresolved.'
    open_questions:
    - How well do methods transfer beyond macOS, short-video, OSWorld/ScienceBoard,
      and drag-specific suites to unseen interfaces and multi-step workflows?
    - Can future work isolate the contribution of the backbone model from verifiable
      task synthesis, sampling, harness changes, and observation or keyframe selection?
    - What training or test-time mechanisms can give agents robust observation control
      so they neither over-observe nor under-observe dynamic interfaces?
    - Can post-hoc uncertainty quantification remain calibrated across closed-source
      models, interfaces, and multi-step agent trajectories without target-specific
      re-ranking?
    - Are drag/gesture and dynamic-screen formalizations integrated with planning
      and action prediction, or do they remain separate benchmark niches?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 真实 GUI/计算机使用基准与细粒度完成评分
      解决的问题: 将异构桌面、动态短视频和拖拽交互转化为超越粗粒度通过/失败的可衡量代理能力。
      尚未覆盖: 结果绑定在特定 OS/平台或交互子集；跨界面与跨任务迁移以及缺失的局限性证据限制泛化。
    - 路线: 弱监督与 RL 基训练用于 GUI 动作 grounding
      解决的问题: 通过未标注截图、课程校准和在线 RL，降低标注成本并扩展可验证的计算机使用任务。
      尚未覆盖: 报告收益绑定于特定基准；任务合成、采样策略和视觉上下文压缩的贡献未被完全隔离。
    - 路线: 测试期执行 harness 与观察控制优化
      解决的问题: 通过优化可执行 harness、累积运行证据或选择任务相关关键帧，改善冻结或预训练 GUI 模型。
      尚未覆盖: 模型能力与 harness/规划器/观察策略的区分不清；超出已评估 harness 与视频域的迁移未证明。
    - 路线: grounding 决策的后验不确定性量化
      解决的问题: 为 GUI grounding 提供模型置信度和共形点击/动作区域，支持选择性信任与空间安全。
      尚未覆盖: 基准覆盖限于单步 grounding；多步代理轨迹和闭源跨层迁移需要目标特定重排序。
    - 路线: 交互覆盖与动作接口形式化
      解决的问题: 形式化动态 living-screen 和拖拽/手势交互，弥补仅点击基准的缺失，并映射到成本-准确性比较。
      尚未覆盖: 覆盖限于短视频或拖拽任务；与完整代理规划和动作预测管线的集成尚未建立。
    共识:
    - 当前 GUI 代理评估使用基于截图的视觉-语言骨干，并将成功分解为子目标、检查点或成本-准确性得分，而非仅看最终 Pass@1。
    - 多项结果显示数据/harness/观察选择而非仅骨干模型驱动性能差异，因此需要分别报告模型与系统/harness 贡献。
    - 在真实与动态界面中，即使前沿模型仍低于人类水平，过度观察/观察不足和 grounding 失败反复出现。
    - 验证缺口常见：许多近期条目 limitations 为空或有限，可复现信号不一，这是证据缺失问题，而非证明缺少工件。
    分歧:
    - 干预位置不同：用弱监督或 RL 训练代理，相对于优化冻结模型的执行 harness，或选择关键帧/观察，或测评与校准不确定性。
    - 监督与数据来源不同：未标注截图的弱标签、可验证合成 RL 任务或人工标注基准套件各有不同泛化假设。
    - 评测目标不同：单步 grounding、多步应用完成、动态观察控制和拖拽/手势交互被分开测量，结论难以直接比较。
    - 指标侧重不同：Pass@1、成本-准确性、子目标完成、技能库贡献和 UQ 排名/覆盖在不同研究中被强调。
    - 迁移证据不同：部分研究报告跨基准 harness 迁移，而不确定性研究发现跨模型/闭源排名迁移弱，迁移性尚未解决。
    开放问题:
    - 方法能否迁移到 macOS、短视频、OSWorld/ScienceBoard 和拖拽特定套件之外的未知界面与多步工作流？
    - 未来工作能否隔离骨干模型与可验证任务合成、采样、harness 变化及观察/关键帧选择的贡献？
    - 何种训练或测试期机制能让代理在动态界面中既不观察过度也不观察不足？
    - 后验不确定性量化能否在闭源模型、界面和多步代理轨迹中无需目标特定重排序保持校准？
    - 拖拽/手势与动态屏幕形式化是否与规划和动作预测集成，还是仍为独立基准细分？
