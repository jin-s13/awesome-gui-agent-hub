    研究路线矩阵:
    - 路线: 端到端在线强化学习训练框架
      解决的问题: 让GUI智能体通过实时交互和多轮策略优化自我改进，超越静态模型推理。
      尚未覆盖: RL训练后错误恢复仍弱；Harness设计显著影响可训练性；跨多种环境的泛化性未验证。
    - 路线: 基于弱监督与课程学习的数据高效视觉接地
      解决的问题: 利用未标注截图和网页学习UI元素定位，减少对昂贵人工标注的依赖。
      尚未覆盖: 向复杂多步任务扩展以及与在线交互学习的结合未探索；真实开放任务的验证缺失。
    - 路线: 可复用的智能体技能与记忆构件
      解决的问题: 提供即插即用的多模态技能库或动作接地记忆，提高任务成功率，减少状态级失败。
      尚未覆盖: 跨应用迁移和技能构件的维护成本未解决；记忆组件仅在有限基准上测试，对动态环境的影响未知。
    - 路线: 面向GUI交互理解的诊断与安全基准
      解决的问题: 评估细粒度能力，如GUI过渡预测、状态验证和抵御提示注入，超越端到端任务成功。
      尚未覆盖: 离线基准无法捕捉异步时序、实时动态和在线上下文；领域条件安全意味着加固不能泛化到编码代理或其他界面。
    共识:
    - 视觉接地及与真实或模拟环境的交互对GUI智能体至关重要；纯文本或静态方法性能不足。
    - 在线交互和多轮优化（如强化学习）是提升智能体鲁棒性、缩小与专有系统差距的关键。
    - 开源框架、可复现工件和公开基准是加速进展和实现独立验证的必要条件。
    - 安全与隐私是部署计算机使用智能体不可忽视的问题，需要明确的评估和缓解策略。
    分歧:
    - 训练信号：来自未标注静态数据的弱监督 vs. 来自在线环境反馈的交互式强化学习。
    - 评估深度：步骤级诊断准确率（如时序排序、动作推断） vs. 端到端任务成功率。
    - 系统架构：模块化技能库检索 vs. 无显式技能分解的端到端策略训练。
    - 交互模式：基于Harness的编排与容器化回滚 vs. 无中间Harness的直接浏览器操控。
    开放问题:
    - 为何多轮RL训练后错误恢复仍薄弱，何种架构变化能改善？
    - 如何使安全加固领域无关，使浏览器训练的智能体在编码或其他界面中不遭受注入攻击？
    - 离线诊断指标与在线交互性能之间的差距多大，如何设计基准以更好预测真实行为？
    - 在多样化且不断演化的软件生态中，构建与维护应用特定技能库或记忆系统的成本与可行性如何？
