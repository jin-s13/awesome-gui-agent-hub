  literature_review:
    line_of_work_matrix:
    - line: End-to-end RL training frameworks for GUI/web agents
      what_it_solves: 'Bridges policy training to the actual runtime: live-browser
        or Kubernetes-isolated harness rollouts, with model calls logged into standard
        RL stacks such as veRL.'
      what_remains_open: Error recovery remains weak after training, some harnesses
        are substantially harder to learn than others, and evidence is limited to
        selected benchmarks and environments.
    - line: Multimodal skill and trajectory memory layers
      what_it_solves: Reuses validated GUI trajectories or skills, retaining visual
        artifacts, preconditions, and parameters to reduce token cost and execution
        time.
      what_remains_open: Replay only covers deterministic compatible steps; ambiguous
        or incompatible states are diverted, and cross-application coverage and quality
        are not fully established.
    - line: Diagnostic benchmarks and safety audits for computer-use agents
      what_it_solves: Isolates GUI transition understanding or prompt-injection safety
        beyond end-task success, revealing failure dimensions such as state verification,
        source tracking, and domain-conditioned hardening.
      what_remains_open: Offline benchmarks miss asynchronous real-time dynamics;
        safety findings are limited to hand-crafted attacks, specific platforms, and
        a predefined action vocabulary.
    - line: Data-efficient and alternative-generation GUI agent models
      what_it_solves: Reduces annotation/data needs via weak supervision from unannotated
        screenshots, or explores block-wise diffusion generation for grounding and
        navigation.
      what_remains_open: Reported improvements depend on selected baselines and benchmarks;
        robustness, compute trade-offs, and broader GUI settings are not fully specified
        in visible evidence.
    consensus:
    - 'Evidence converges on closed-loop GUI execution and training as the core abstraction:
      agents act in live or replayed environments, produce trajectories, and those
      trajectories become training data or reusable memory.'
    - Multiple works treat visual or full-context information as necessary for grounding
      and workflow verification; text-only or single-frame signals are seen as insufficient.
    - Evaluation is shifting from single-frame grounding or end-task success toward
      step-level, trajectory-level, and safety diagnostics.
    disagreements:
    - 'Representation differs: some systems retain multimodal figures and structured
      callable memories, while others use text-only, coordinate-free, or diffusion-based
      outputs.'
    - 'Training supervision differs: online multi-turn RL in live websites, RL over
      intercepted harness calls in isolated containers, weak supervision from unannotated
      screenshots, and offline supervised fine-tuning coexist.'
    - 'Evaluation target differs: end-to-end benchmark success, step-level transition
      reconstruction, and adversarial safety audit are used as primary evidence.'
    - 'Deployment setting differs: browser-only, cross-platform mobile/desktop/web,
      Linux desktop, and harness-specific coding/tool agents.'
    open_questions:
    - How can error recovery be improved after RL training, rather than only benchmark
      success?
    - Why do some agent harnesses remain substantially harder to learn, and which
      design properties transfer across environments?
    - Can offline diagnostic benchmarks be connected to live asynchronous GUI dynamics
      without losing step-level interpretability?
    - Does safety hardening transfer across browser and coding domains, and can red-teaming
      results be reproduced without unpublished optimized attack strings?
  literature_review_zh:
    研究路线矩阵:
    - 路线: GUI/网页代理的端到端强化学习训练框架
      解决的问题: 将策略训练接入真实运行环境：在实时浏览器或 Kubernetes 隔离容器中执行 harness rollout，并把模型调用记录为标准
        RL 训练数据。
      尚未覆盖: 训练后错误恢复仍弱；某些 harness 明显更难学习；当前证据限于所选基准与环境。
    - 路线: 多模态技能与轨迹记忆层
      解决的问题: 复用已验证的 GUI 轨迹或技能，保留视觉工件、前置条件和参数，以降低 token 成本与执行时间。
      尚未覆盖: 只能确定性地重放兼容步骤；模糊或不兼容状态会被转移，跨应用覆盖与质量尚未完全验证。
    - 路线: 计算机使用代理的诊断基准与安全审计
      解决的问题: 在最终任务成功之外隔离 GUI 过渡理解或提示注入安全，揭示状态验证、来源追踪和领域条件加固等失败维度。
      尚未覆盖: 离线基准缺少异步实时动态；安全结论限于手工攻击、特定平台和预定义动作词汇。
    - 路线: 数据高效与替代生成范式
      解决的问题: 通过未标注截图的弱监督降低标注数据需求，或探索块级扩散生成以完成 grounding 与导航。
      尚未覆盖: 提升依赖所选基线与基准；鲁棒性、计算权衡和更广 GUI 设置的边界在可见证据中说明不足。
    共识:
    - 证据共同指向闭环 GUI 执行与训练作为核心抽象：代理在实时或重放环境中行动，产生轨迹，并转化为训练数据或可复用记忆。
    - 多项工作认为视觉或完整上下文信息对定位与工作流状态验证必要，纯文本或单帧信号不够。
    - 评测重点正从单帧定位或最终任务成功转向步骤级、轨迹级和安全诊断。
    分歧:
    - 表示方式不同：部分系统保留多模态图形和结构化可调用记忆，另一些采用纯文本、无坐标或扩散生成输出。
    - 监督信号不同：在线多轮 RL、通过代理拦截 harness 调用的隔离容器 RL、未标注截图弱监督、离线监督微调并存。
    - 评测目标不同：以端到端基准成功率、步骤级过渡重构或对抗安全审计作为主要证据。
    - 部署设置不同：仅浏览器、跨移动/桌面/网页平台、Linux 桌面或特定 harness 编码/工具代理。
    开放问题:
    - 强化学习训练后，如何在基准成功率之外提升错误恢复能力？
    - 为什么某些代理 harness 明显更难学习，哪些设计属性可跨环境迁移？
    - 离线诊断基准如何与实时异步 GUI 动态衔接，同时保留步骤级可解释性？
    - 安全加固能否跨浏览器与编码领域泛化，红队结果能否在缺少未公开优化攻击字符串的情况下被复现？
