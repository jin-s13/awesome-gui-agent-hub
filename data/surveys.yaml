  literature_review:
    line_of_work_matrix:
    - line: Real-world application benchmarking and fine-grained evaluation
      what_it_solves: Measures GUI agent behavior on macOS desktop tasks and dynamic
        short-video tasks using multi-checkpoint scoring, capability annotations,
        and cost-accuracy beyond simple pass/fail.
      what_remains_open: Platform and task coverage is limited; dynamic-platform agents
