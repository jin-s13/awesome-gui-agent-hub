      browsing, web navigation, drag interaction, and video-guided tasks.
    - Method representations differ, including multimodal skill libraries, compiled
      state-machine replay, block-wise diffusion, keyframe extraction, and generated
      web environments.
    - Optimization objectives differ among task accuracy, cost-accuracy or observation
      efficiency, and repeated-task speed.
    - Learning mechanisms differ, including in-context retrieval, fine-tuning on generated
      trajectories, and end-to-end model training.
    open_questions:
