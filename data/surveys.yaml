  related_work_outline:
  - 'Mainstream direction: Building interactive GUI/OS benchmarks that evaluate computer-use
    agents on multi-step real-world or simulated application tasks, often with fine-grained
    or cost-aware metrics.'
  - 'Shared research pattern: Construct task suites on applications or platforms,
    evaluate frontier VLM agents against baselines, and report gaps in observation
    control, action grounding, or workflow completion.'
  - 'Key differences: Benchmarks specialize in different evaluation targets, including
    real desktop cross-app workflows, dynamic short-video screens, drag interactions,
    video-guided tasks, and uncertainty calibration; metrics vary from Pass@1 to sub-goal,
    cost-accuracy, and UQ.'
  - 'Trend evolution: The evidence is concentrated in 2026, shifting from static click-based
    GUI tasks toward dynamic, verifiable, multi-application, and training-integrated
    benchmark suites; this is a current-frontier trend.'
  - 'Open questions: Coverage of dynamic/drag/video interfaces, cross-model UQ transfer,
    generalization of synthesized or weakly supervised data, and alignment between
    fine-grained metrics and user utility remain unresolved.'
  related_work_outline_zh:
  - 主流方向：构建交互式GUI/OS基准，评估计算机使用代理在多步真实或模拟应用任务上的表现，并常引入细粒度或成本感知指标。
  - 研究共性：在应用或平台上构造任务集，评估前沿VLM代理与基线，并报告观察控制、动作基础或工作流完成方面的差距。
  - 关键差异：基准在评估目标上专门化，包括真实桌面跨应用工作流、动态短视频屏幕、拖拽交互、视频引导任务和不确定性校准；指标从Pass@1到子目标、成本准确性和UQ不等。
  - 趋势演进：证据集中在2026年，从静态点击式GUI任务转向动态、可验证、多应用且与训练结合的基准套件；这属于当前前沿趋势。
  - 开放问题：动态/拖拽/视频接口覆盖、跨模型UQ迁移、合成或弱监督数据泛化、细粒度指标与用户效用的一致性仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: Real-world desktop/OS task benchmarks
      what_it_solves: Creates multi-application computer-use tasks covering GUI and
        CLI workflows, deterministic scoring, and cross-framework/model baseline comparisons.
      what_remains_open: Coverage across OS and application states is still limited;
        fine-grained sub-goal scores may not map to end-user task success or deployment
        utility.
    - line: Specialized interaction and dynamic-screen benchmarks
      what_it_solves: Addresses gaps beyond click-based static tasks by covering dynamic
        short-video platforms, drag interactions, and video-guided GUI tasks.
      what_remains_open: Each benchmark remains restricted to a platform or interaction
        family; agents still show weak observation control and have not reached human-level
        cost-accuracy.
    - line: Metric and uncertainty/stress-test design
      what_it_solves: Probes reliability through fine-grained multi-checkpoint scoring,
        cost-accuracy tradeoffs, and post-hoc uncertainty quantification for GUI grounding.
      what_remains_open: UQ ranking transfer across model tiers and interfaces is
        weak; conformal coverage degrades under distribution or interface mismatch;
        proxy metrics may not align with deployment utility.
    - line: Scalable task/data artifacts and training-oriented evaluation
      what_it_solves: Produces verifiable training tasks, weakly supervised grounding
        data, multimodal skill libraries, and large drag datasets to improve and evaluate
        agents.
      what_remains_open: Train/test separation, cross-application reuse, and whether
        gains transfer to unseen benchmarks remain under-evidenced in the bounded
        packet.
    consensus:
    - Current work treats GUI automation as interactive multi-step environment evaluation
      rather than static visual question answering.
    - Aggregate success is increasingly supplemented by finer process, cost, or uncertainty
      signals.
    - Frontier models still show clear failures in robust observation control and
      under-covered interaction types such as dynamic content and drag.
    - Evaluations typically compare multiple VLM or agent frameworks, but findings
      remain constrained to specific platforms or datasets.
    disagreements:
    - Evaluation targets differ from single-step GUI grounding to full desktop workflows
      to dynamic or video-guided interaction, emphasizing different failure modes.
    - 'Interaction coverage differs: click/type, GUI plus CLI, drag, and short-video
      scrolling; some studies isolate action grounding while others score workflow
      completion.'
    - 'Supervision and data sources differ: weakly supervised screenshots, verifiable
      synthesized tasks, skill libraries, and human-designed task suites.'
    - 'Scoring conventions differ: Pass@1, sub-goal completion, cost-accuracy, ranking
      correlation, conformal coverage, and skill lift are not directly interchangeable.'
    open_questions:
    - Do fine-grained sub-goal and cost-aware metrics align with real user utility
      or end-task completion in deployment?
    - Can uncertainty rankings and calibration transfer across model families and
      interface settings without target-specific re-ranking?
    - How should benchmarks cover dynamic, drag, and video-guided interactions without
      becoming overly platform-specific?
    - Do synthesized or weakly supervised training datasets create leakage or overfitting
      when reused as evaluation suites?
    - Are benchmark conclusions stable across frameworks, compute budgets, and reimplementations
      when artifact visibility is uneven?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 真实桌面/OS任务基准
      解决的问题: 构造多应用计算机使用任务，覆盖GUI与CLI工作流，采用确定性评分并进行跨框架/模型基线比较。
      尚未覆盖: 对OS与应用状态覆盖仍有限；细粒度子目标得分未必对应终端用户任务成功或部署效用。
    - 路线: 专门交互与动态屏幕基准
      解决的问题: 填补点击式静态任务之外的空白，覆盖动态短视频平台、拖拽交互与视频引导GUI任务。
      尚未覆盖: 各基准仍限于特定平台或交互类型；代理仍表现出观察控制较弱，尚未达到人类级成本准确性。
    - 路线: 指标与不确定性/压力测试设计
      解决的问题: 通过细粒度多检查点评分、成本准确性权衡和后验不确定性量化来探测可靠性。
      尚未覆盖: UQ排名跨模型层级和接口迁移较弱；分布或接口不匹配下共形覆盖下降；代理指标未必对齐部署效用。
    - 路线: 可扩展任务/数据工件与训练导向评测
      解决的问题: 生成可验证训练任务、弱监督定位数据、多模态技能库和大规模拖拽数据集，以改进并评测代理。
      尚未覆盖: 训练/测试分离、跨应用复用以及性能向未见基准的迁移在证据包中仍缺乏充分验证。
    共识:
    - 当前工作将GUI自动化视为交互式多步环境评测，而非静态视觉问答。
    - 在总体成功率之外，越来越多引入过程、成本或不确定性信号。
    - 前沿模型在稳健观察控制和未充分覆盖的交互类型（如动态内容、拖拽）上仍存在明显失败。
    - 评测通常跨多个VLM或代理框架进行比较，但结论常受限于特定平台或数据集。
    分歧:
    - 评测目标从单步GUI定位、完整桌面工作流到动态或视频引导交互不等，强调不同失败模式。
    - 交互覆盖不同：点击/输入、GUI加CLI、拖拽和短视频滚动；有的隔离动作定位，有的评估工作流完成。
