  literature_review:
    line_of_work_matrix:
    - line: Benchmark and controlled evaluation construction for GUI agents
      what_it_solves: Creates task suites for web, mobile, OS, video-guided, fraud
        detection, safety, and uncertainty quantification; provides controlled evidence
        about agent capabilities under specific conditions.
      what_remains_open: Whether results are compatible across different task lengths,
        modalities, reward signals, and shortcut availability; several benchmarks
        are limited in size or suppress real-world cues.
    - line: Training-time capability improvement for computer-use agents
      what_it_solves: Improves task success through online RL with verifiable synthesized
        tasks or supervised training with structured long-horizon context management.
      what_remains_open: Reward noise from autonomous evaluators, task synthesis verification,
        and generalization beyond OSWorld, ScienceBoard, MobileWorld, and related
        suites remain underevidenced.
    - line: Frozen-backbone harness and context optimization
      what_it_solves: Improves agent performance without changing model weights by
        optimizing execution harnesses, context fields, or keyframe selection around
        frozen models.
      what_remains_open: Whether gains depend on benchmark-specific observations or
        repeated-run evidence; several reports lack explicit limitation statements
        and broad cross-baseline validation.
    - line: Safety, robustness, and uncertainty auditing for GUI agents
      what_it_solves: Measures prompt injection resistance, fraud detection without
        reputation shortcuts, and post-hoc uncertainty calibration for GUI grounding.
      what_remains_open: Weak cross-domain and cross-model transfer, coverage degradation
        under distribution shift, limited attack types, and incomplete reproducibility
        of optimized attack strings.
    consensus:
    - Recent GUI agent research relies on VLM-based agents that consume screenshots
      and instructions and produce actions, with success rate or completion as the
      primary evidence.
    - Evaluation is increasingly multi-step and benchmark-driven, spanning OSWorld,
      ScienceBoard, mobile, web, and fraud/safety settings.
    - Many works report gains relative to baselines under task-specific metrics, with
      improvement either through policy training or through frozen-model external
      mechanisms.
    - There is shared concern for verifiability or reproducibility, but several top-ranked
      papers have empty limitation fields or low artifact-signal scores, leaving verification
      gaps.
    disagreements:
    - One line tunes policy weights via RL or supervised fine-tuning, while another
      keeps the backbone frozen and changes harness, context, or keyframe selection.
    - 'Evaluation targets differ: single-step GUI grounding uncertainty, long-horizon
      task success, and safety attack success rate are not directly comparable.'
    - Safety evaluation varies between suppressing URL and reputation shortcuts in
      fraud detection and testing hand-crafted prompt injection across browser and
      coding domains.
    - 'Reward and verification signals differ: noisy autonomous VLM evaluation, verifiable
      Docker task synthesis, and executable before-after screenshot evidence are used
      for different purposes.'
    - Benchmark settings such as OSWorld, ScienceBoard, MobileWorld, WindowsAgentArena,
      and VG-GUIBench differ in interaction mode and success criteria, making SOTA-style
      claims difficult to compare.
    open_questions:
    - How do these methods transfer to unseen interfaces and domains beyond the specific
      benchmark suites used in evaluation?
    - Can noisy autonomous evaluation replace verifiable environment rewards without
      overfitting to evaluator bias?
    - Why does safety hardening appear domain-conditioned, and how can browser and
      coding attack surfaces be defended consistently?
    - Are reported results comparable when task length, modality, reward, and shortcut
      availability differ across benchmarks?
    - What is the evidence gap for papers with missing code, dataset, metric, or limitation
      details, and how should that affect confidence in the conclusions?
  literature_review_zh:
    研究路线矩阵:
    - 路线: GUI智能体基准与受控评测构建
      解决的问题: 为网页、移动端、操作系统、视频引导、欺诈检测、安全与不确定性量化构建任务集，提供受控条件下的能力证据。
      尚未覆盖: 不同任务长度、模态、奖励信号和快捷线索下结果是否兼容；部分基准规模有限或人为抑制现实线索。
    - 路线: 计算机使用智能体的训练时能力提升
      解决的问题: 通过可验证合成任务的在线RL或带结构化长时域上下文的监督训练提升任务成功率。
      尚未覆盖: 自主评估器奖励噪声、任务合成验证，以及OSWorld、ScienceBoard、MobileWorld等之外泛化仍缺少充分证据。
    - 路线: 冻结骨干的harness与上下文优化
      解决的问题: 不改变模型权重，通过优化执行框架、上下文字段或关键帧选择提升冻结模型表现。
      尚未覆盖: 增益是否依赖基准特定观察或重复运行证据；若干报告缺少明确局限性说明和广泛跨基线验证。
    - 路线: GUI智能体的安全、鲁棒性与不确定性审计
      解决的问题: 测量提示注入抵抗力、无信誉捷径欺诈检测，以及GUI定位的后验不确定性校准。
      尚未覆盖: 跨域和跨模型迁移弱，分布偏移下覆盖度下降，攻击类型有限，优化攻击字符串的可复现性不足。
    共识:
    - 近期GUI智能体研究多基于VLM，以截图和指令为输入、动作为输出，用成功率或完成率作为主要证据。
    - 评测趋向多步且由基准驱动，覆盖OSWorld、ScienceBoard、移动端、网页和欺诈/安全等场景。
    - 多数工作报告相对基线的任务特定指标提升，改进方式要么训练策略，要么在冻结模型上使用外部机制。
    - 研究普遍关注可验证性或可复现性，但若干高排名论文局限性字段为空或工件信号较低，属于验证缺口。
    分歧:
    - 一条路线通过RL或监督微调改变策略权重，另一条冻结骨干并改变harness、上下文或关键帧选择。
    - 评测目标不同：单步GUI定位不确定性、长时域任务成功与安全攻击成功率之间不可直接比较。
    - 安全评测有的压制URL和信誉捷径进行欺诈判断，有的在浏览器与编码领域测试手工提示注入。
    - 奖励与验证信号不同：带噪自主VLM评估、可验证Docker任务合成、以及执行前后截图证据用于不同机制。
    - OSWorld、ScienceBoard、MobileWorld、WindowsAgentArena和VG-GUIBench等设置交互方式与成功标准不同，使SOTA式结论难以对比。
    开放问题:
    - 这些方法在未见界面和超出特定基准套件的领域中能否稳定迁移？
    - 带噪自主评估能否替代可验证环境奖励，而不引入评估器偏差并导致过拟合？
    - 安全加固为何呈现领域条件性，浏览器与编码攻击面之间如何实现一致防御？
    - 当任务长度、模态、奖励与快捷线索不同，已报告结果是否真正兼容？
    - 缺代码、数据集、指标或局限性细节的证据缺口如何影响结论可信度？
