    webpage evidence, and improve either the policy, the execution harness, or the
    evaluation protocol while keeping success grounded in interaction.'
  - 'Key differences: They differ by optimization target: frozen-model harness edits,
    online RL with synthesized tasks, proactive context management, or noisy evaluator
    reward. They also differ by deployment setting and evaluation grain, from single-step
    grounding to multi-step trajectories.'
  - 'Trend evolution: Within the 2024-2026 frontier, the cluster moves from static
    GUI grounding toward verifiable task synthesis, sample-efficient RL, long-horizon
    context, and security or uncertainty audits; the year span is too narrow for longer
    historical trend claims.'
  - 'Open questions: Cross-setup and cross-interface transfer remains weakly evidenced;
    safety and uncertainty findings appear regime-specific; many records omit limitation
    or reproducibility details, leaving generalization, deployment readiness, and
    gap prioritization unresolved.'
