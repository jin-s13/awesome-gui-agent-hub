  related_work_outline:
  - 'Mainstream direction: Scaling GUI agent training through data-efficient paradigms
    (weak supervision, online RL with verifiable task synthesis) and expanding action
    interfaces beyond clicks to include drag, context management, and observation
    control.'
  - 'Shared research pattern: Most works introduce a new benchmark or dataset to reveal
    a specific capability gap (dynamic screens, drag, uncertainty, long-horizon context),
    then propose a training or inference method to address it, evaluated against baselines
    on that benchmark.'
  - 'Key differences: Training signal ranges from massive unlabeled screenshots (weakly
    supervised) to fully verifiable online RL; action space expansion includes context-as-action,
    drag operations, and keyframe selection; evaluation targets differ across task
    completion, uncertainty calibration, and observation efficiency.'
  - 'Trend evolution: Within 2024–2026, the frontier moved from static click-based
    benchmarks to dynamic, multi-modal, long-horizon, and interaction-rich settings,
    with growing emphasis on training efficiency and open-source reproducibility.'
  - 'Open questions: Whether weak supervision or online RL can generalize to unseen
    app ecosystems without task-specific reward engineering; how to integrate diverse
    action interfaces into a unified agent without bloating the action space; and
    how to perform reliable uncertainty estimation for safety-critical deployments.'
  related_work_outline_zh:
  - 主流方向：通过高效数据范式（弱监督、可验证任务合成的在线强化学习）扩展GUI代理训练，并将动作界面从点击拓展到拖拽、上下文管理和观察控制。
  - 研究共性：多数工作引入新基准或数据集以揭示特定能力缺口（动态屏幕、拖拽、不确定性、长时程上下文），然后提出训练或推理方法在该基准上评估。
  - 关键差异：训练信号从海量无标注截图（弱监督）到完全可验证的在线强化学习；动作空间扩展包括上下文作为动作、拖拽操作和关键帧选择；评测目标在任务完成、不确定性校准和观察效率上不同。
  - 趋势演进：2024–2026年间，前沿从静态点击基准转向动态、多模态、长时程和交互丰富的场景，并越来越重视训练效率和开源可复现性。
  - 开放问题：弱监督或在线强化学习能否泛化到未见应用生态而不依赖任务特定奖励工程；如何将多样化的动作接口整合到统一代理中而不使动作空间膨胀；以及如何为安全关键部署进行可靠的不确定性估计。
  literature_review:
    line_of_work_matrix:
    - line: Training paradigm and objective design for GUI agents
      what_it_solves: Reduces reliance on expensive human annotations by using weak
        supervision from unlabeled screenshots, online RL with automatically verifiable
        tasks, or structured context management as trainable actions.
      what_remains_open: Whether these training recipes transfer across operating
        systems, application domains, or interaction modalities without re-engineering
        the reward function or data pipeline; and whether gains are from the objective
        or from orchestration components like skill libraries.
    - line: Action interface and observation control expansion
      what_it_solves: Enables agents to handle drag operations, dynamic content that
        changes between actions, and long-horizon tasks by treating context management
        as a first-class action or extracting task-relevant keyframes.
      what_remains_open: How much of the performance improvement comes from the new
        action representation versus the underlying planner or task prior; and whether
        combining multiple action extensions causes interference or reduces generalization.
    - line: Benchmark-driven capability evaluation and uncertainty quantification
      what_it_solves: Provides reproducible testbeds for GUI grounding, dynamic screen
        interaction, drag-based manipulation, and confidence estimation, revealing
        failure modes like over-/under-observation and selective UQ transfer.
      what_remains_open: Evidence that benchmark scores isolate the proposed method
        rather than reflecting dataset bias, implementation choices, or baseline tuning;
        stability of uncertainty rankings across model families and interfaces remains
        weak.
    consensus:
    - Current vision-language models lack observation control and struggle with dynamic
      interfaces where content changes between actions.
    - Fine-tuning on task-specific interaction data (e.g., drag trajectories, context
      management annotations) improves performance, but models still fail on long-horizon
      tasks without explicit memory or context pruning.
    - Efficient training with minimal human annotation is critical; leveraging unlabeled
      data or automatically generated verifiable tasks shows promise.
    - Evaluation must go beyond task success and include fine-grained metrics such
      as sub-goal completion, cost-accuracy trade-offs, and uncertainty calibration.
    disagreements:
    - 'Training signal: weakly supervised learning from unlabeled screenshots (GUICrafter)
      versus online RL with synthesized verifiable tasks (SCALECUA) versus supervised
      fine-tuning on expert demonstrations (MemGUI-Agent).'
    - 'Action representation: whether context management should be a distinct action
      type emitted by the policy (MemGUI-Agent) or handled implicitly through observation
      truncation; whether drag should be a separate grounding primitive or a compound
      of existing clicks.'
    - 'Evaluation target: task completion on static benchmarks (MacAgentBench, DragOn)
      versus observation efficiency and cost-accuracy (LivingScreen) versus uncertainty
      calibration and coverage (Argus).'
    - 'Deployment setting: mobile long-horizon tasks (MemGUI-Agent) versus desktop
      multi-app coordination (MacAgentBench) versus video-guided browser tasks (VG-GUIBench,
      LivingScreen).'
    open_questions:
    - Can weak supervision from unlabeled screenshots capture the full diversity of
      real-world GUI tasks, or does it bias toward surface-level visual patterns?
    - How does online RL with verifiable task synthesis scale to applications where
      reward verification is noisy or expensive, such as creative tools or collaborative
      workflows?
    - What is the minimal set of action primitives that covers the majority of GUI
      interactions without making the action space too sparse for current training
      methods?
    - Under what conditions can post-hoc uncertainty quantification reliably transfer
      from one model family to another, and how should agents use uncertainty to trigger
      fallback behaviors?
  literature_review_zh:
    研究路线矩阵:
    - 路线: GUI代理的训练范式与目标设计
      解决的问题: 通过利用无标注截图的弱监督、自动可验证任务的在线强化学习或可训练的结构化上下文管理，减少对昂贵人工标注的依赖。
      尚未覆盖: 这些训练配方能否在不重新设计奖励函数或数据流水线的情况下迁移到不同操作系统、应用领域或交互模态；收益来自目标函数还是来自技能库等编排组件。
    - 路线: 动作接口与观察控制扩展
      解决的问题: 使代理能够处理拖拽操作、动作间内容变化的动态界面，以及通过将上下文管理作为第一类动作或提取任务相关关键帧来应对长时程任务。
      尚未覆盖: 性能提升有多少来自新的动作表示，而不是底层的规划器或任务先验；组合多种动作扩展是否会导致干扰或降低泛化性。
    - 路线: 基准驱动的能力评估与不确定性量化
      解决的问题: 为GUI接地、动态屏幕交互、拖拽操作和置信度估计提供可复现的测试平台，揭示过度/不足观察和选择性不确定性迁移等失败模式。
      尚未覆盖: 基准分数是否隔离了所提方法，而非反映数据集偏差、实现选择或基线调优；不确定性排名在不同模型族和接口间的稳定性仍然较弱。
    共识:
    - 当前视觉语言模型缺乏观察控制，在内容在动作间变化的动态界面上表现困难。
    - 在特定交互数据（如拖拽轨迹、上下文管理注释）上微调可以提升性能，但模型在长时程任务上若没有显式记忆或上下文剪枝仍会失败。
    - 以最少人工标注实现高效训练至关重要；利用无标注数据或自动生成可验证任务显示出前景。
    - 评估应超越任务成功率，纳入子目标完成度、成本-准确性权衡和不确定性校准等细粒度指标。
    分歧:
    - 训练信号：弱监督从无标注截图学习（GUICrafter） vs 基于合成可验证任务的在线强化学习（SCALECUA） vs 在专家演示上的监督微调（MemGUI-Agent）。
    - 动作表示：上下文管理是否应作为策略发出的独立动作类型（MemGUI-Agent）还是通过观察截断隐式处理；拖拽是否应作为独立接地原语，还是现有点击操作的复合。
    - 评测目标：静态基准上的任务完成（MacAgentBench、DragOn） vs 观察效率与成本-准确性（LivingScreen） vs 不确定性校准与覆盖度（Argus）。
    - 部署场景：移动端长时程任务（MemGUI-Agent） vs 桌面多应用协调（MacAgentBench） vs 视频引导的浏览器任务（VG-GUIBench、LivingScreen）。
    开放问题:
    - 无标注截图的弱监督能否捕捉真实世界GUI任务的完整多样性，还是仅偏向于表面视觉模式？
    - 在奖励验证噪声大或成本高的应用中（如创意工具或协作工作流），可验证任务合成的在线强化学习如何扩展？
    - 覆盖大部分GUI交互的最小动作原语集是什么，同时不会使动作空间过于稀疏以适应当前训练方法？
    - 在什么条件下后验不确定性量化可以可靠地从一个模型族迁移到另一个，代理应如何利用不确定性触发回退行为？
