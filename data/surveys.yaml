  - 研究共性：构建具有确定性或基于规则评分的任务套件，比较多种前沿视觉语言模型，并识别观察控制、多模态定位和不确定性管理等能力缺口。
  - 关键差异：基准在环境范围（桌面macOS vs. 浏览器动态Web）、交互类型侧重（拖拽 vs. 通用GUI操作）、评估指标焦点（准确率 vs. 成本效率
