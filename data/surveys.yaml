  literature_review:
    line_of_work_matrix:
    - line: End-to-end harness-native agent training and RL orchestration
      what_it_solves: Turns real harness model calls into training data and enables
        RL across GUI, computer-use, and tool-calling environments without modifying
        the harness itself.
      what_remains_open: Error recovery remains weak after RL, and some harness designs
        are substantially harder to learn than others.
    - line: Data-efficient and architecture-level visual-language GUI agent learning
      what_it_solves: Reduces reliance on large annotated datasets through weakly
        supervised visual grounding or explores block-wise diffusion generation for
        GUI agents.
      what_remains_open: Several papers do not report explicit limitations, and cross-platform
        or cross-benchmark generalization boundaries are not fully evidenced.
    - line: Unified GUI-and-code action space for desktop agents
      what_it_solves: Coordinates direct GUI actions with code execution in one end-to-end
        multimodal model, improving desktop task success on OSWorld-Verified.
      what_remains_open: Evidence mainly covers Ubuntu/Windows desktop settings; independent
        reproduction and explicit failure conditions are not fully stated.
    - line: Reusable multimodal skill and execution-memory scaffolding
      what_it_solves: Captures visual/text procedures or validated trajectories as
        callable memories to improve UI grounding and cut token cost and execution
        time.
      what_remains_open: Memory reuse is bounded by deterministic applicability checks,
        so ambiguous or incompatible states are rejected rather than handled robustly.
    - line: Diagnostic evaluation for recovery and personalization failures
      what_it_solves: Moves beyond task success by formalizing transition-consistent
        recovery and by localizing when and where personalized GUI agents fail.
      what_remains_open: Current agents do not exploit their latent recovery capability,
        and personalization bottlenecks remain in evidence selection and preference
        timing.
    consensus:
    - Systems are usually validated on task success over GUI or computer-use benchmarks,
      with secondary attention to token cost, execution time, or step efficiency.
    - Retaining visual information in agent artifacts or perception improves UI element
      identification and workflow state verification compared with text-only forms.
    - Explicitly coupling agent training with real harness and environment interaction
      produces performance gains, but failure recovery remains consistently weak after
      training.
    - Reusing validated trajectories or skills is recognized as a practical way to
      lower token and time cost while improving grounding.
    - Several contributions separate popularity and citation signals from methodology
      or reproducibility evidence, and missing citation metadata or code links are
      treated as verification gaps rather than quality judgments.
    disagreements:
    - 'Supervision signal differs: weak supervision from unannotated screenshots,
      online RL from harness rollouts, and authored-plus-explored multimodal skill
      construction.'
    - 'Action-space design differs: some systems use GUI-only actions, while others
      unify GUI actions with code execution in a single end-to-end model.'
    - 'Evaluation target differs: benchmark success rate, transition-consistent recovery,
      personalization failure diagnosis, or execution cost and time.'
    - 'Generation paradigm differs: one route uses block-wise diffusion for visual-language
      GUI agents, while others rely on conventional language-model policy training
      or harness calls.'
    - 'Deployment mode differs: Kubernetes-orchestrated RL rollouts, runtime memory/harness
      scaffolding, and diagnostic benchmark instrumentation each impose different
      system assumptions.'
    open_questions:
    - Under what conditions can reinforcement learning improve error recovery rather
      than only nominal task completion in real computer-use harnesses?
    - How well do unified GUI/code policies and trained agents transfer from Ubuntu/OSWorld
      settings to Windows, mobile, and web without task-specific tuning?
    - What representations would allow skill or memory systems to generalize beyond
      deterministic replay instead of rejecting ambiguous or incompatible states?
    - How should user preferences be selected, represented, and timed in agent execution
      without degrading non-personalized task performance?
    - What independent verification gaps remain because several evidence items lack
      explicit limitations or accessible reproducibility artifacts?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端harness原生智能体训练与RL编排
      解决的问题: 将真实harness模型调用转化为训练数据，并在GUI、computer-use和工具调用环境中进行RL，无需修改harness本身。
      尚未覆盖: RL后错误恢复仍然较弱，且不同harness设计对可训练性影响很大。
    - 路线: 数据高效与架构级视觉语言GUI智能体学习
      解决的问题: 通过弱监督视觉定位或块级扩散生成，减少对大规模人工标注数据的依赖。
      尚未覆盖: 部分论文未报告明确局限性，跨平台或跨基准的泛化边界尚未充分证明。
    - 路线: GUI与代码统一动作空间的桌面智能体
      解决的问题: 在单个端到端多模态模型中协调GUI操作与代码执行，提升OSWorld-Verified上的桌面任务成功率。
      尚未覆盖: 证据主要集中在Ubuntu/Windows桌面场景；独立复现和明确失败条件尚未完全说明。
    - 路线: 可复用多模态技能与执行记忆框架
      解决的问题: 将视觉/文本流程或经验证轨迹保存为可调用记忆，以提升UI grounding并减少token成本与执行时间。
      尚未覆盖: 记忆复用受确定性适用性检查限制，模糊或不兼容状态会被拒绝而非被鲁棒处理。
    - 路线: 面向错误恢复与个性化失败的诊断评测
      解决的问题: 超越任务成功率，形式化transition-consistent recovery，并定位个性化GUI智能体在何时、何处失败。
      尚未覆盖: 当前智能体未能利用潜在恢复能力，个性化瓶颈仍集中在证据选择与偏好生效时机。
    共识:
    - 系统通常以GUI或computer-use基准上的任务成功为验证核心，同时次要关注token成本、执行时间或步骤效率。
    - 在智能体工件或感知中保留视觉信息，相比纯文本形式更能改善UI元素识别与工作流状态验证。
    - 将智能体训练与真实harness和交互环境显式耦合能带来性能提升，但训练后的失败恢复仍普遍较弱。
    - 复用经验证轨迹或技能被视为降低token和时间成本、改善grounding的实用方法。
    - 若干工作区分了流行度/引用信号与方法论/可复现证据；缺失引用元数据或代码链接被视作验证缺口而非质量结论。
    分歧:
    - 监督信号不同：未标注截图上的弱监督、harness rollout上的在线RL，以及编写加探索的多模态技能构建。
    - 动作空间设计不同：有的系统仅使用GUI动作，有的在单个端到端模型中统一GUI动作与代码执行。
    - 评测目标不同：基准成功率、transition-consistent recovery、个性化失败诊断，或执行成本与时间。
    - 生成范式不同：一条路线采用块级扩散视觉语言GUI智能体，其他路线采用常规语言模型策略训练或harness调用。
    - 部署模式不同：Kubernetes编排的RL rollout、运行时记忆/harness框架与诊断基准仪器化各自形成不同的系统假设。
    开放问题:
    - 在哪些条件下强化学习能真正改善错误恢复，而不是只提升真实computer-use harness中的名义任务完成率？
    - 统一的GUI/代码策略和训练智能体如何从Ubuntu/OSWorld迁移到Windows、移动端和Web，且无需大量任务特定调优？
    - 何种表示方式能让技能或记忆系统超越确定性重放，从而处理模糊或不兼容状态？
    - 用户偏好应如何在agent执行中被选择、表示和定时，而不损害非个性化任务表现？
    - 由于若干证据项缺少明确局限性或可访问的可复现工件，还存在哪些独立验证缺口？
