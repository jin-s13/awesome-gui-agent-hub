  literature_review:
    line_of_work_matrix:
    - line: Cross-application desktop task benchmarking
      what_it_solves: Reproducible evaluation of GUI agents on real operating system
        tasks combining GUI and CLI actions, with rule-based and fine-grained checkpoint
        scoring.
      what_remains_open: Cross-platform generalization and why similar overall success
        can hide different sub-goal completion patterns remain incompletely evidenced.
    - line: Dynamic and interaction-diverse GUI benchmark design
      what_it_solves: Evaluation beyond click-only static tasks by covering drag interactions,
        video-guided tasks, and short-video interfaces with cost-accuracy or task-specific
        metrics.
      what_remains_open: Observation control, information-efficiency tradeoffs, and
        transfer beyond specific platforms or interaction types are unresolved.
    - line: Multimodal skill construction and retrieval
      what_it_solves: Reusable computer-use knowledge that retains visual figures
        alongside text to improve UI element identification and workflow state verification.
      what_remains_open: Skill maintenance, scaling across many applications, and
        transfer to unseen workflows are not fully demonstrated.
    - line: Compiled replay for repeated tasks
      what_it_solves: Acceleration and consistency on repeated tasks by converting
        successful agent runs into state-machine programs with screen checks and fallback.
      what_remains_open: Generalization to novel task variants or interface changes
        and long-term reliability of stored programs remain open.
    - line: GUI agent model training and environment/data generation
      what_it_solves: Grounding and navigation improvements through block-wise diffusion
        training, fine-tuning on drag/video/web interaction data, and automated reconstruction
        of real web environments.
      what_remains_open: Cross-platform robustness, data diversity, and verification
        of reproduced artifacts or training details are incomplete.
    consensus:
    - Evaluation is moving beyond coarse task success toward fine-grained checkpoints,
      information efficiency, and dynamic-content assessment.
    - Multimodal visual information, including screenshots and figures, improves UI
      element identification and workflow verification.
    - Reusing successful interaction experience through skill libraries, replay programs,
      or generated trajectories can improve success, speed, or data efficiency.
    - Current GUI agents still show clear weaknesses in observation control, cross-application/platform
      generalization, and dynamic interface handling.
    disagreements:
    - 'Reuse mechanisms differ: hierarchical multimodal skills, state-machine replay,
      and reconstructed environment plus trajectory generation.'
    - 'Evaluation targets differ: rule-based completion and sub-goal scoring, cost-accuracy
      in dynamic observation, drag-specific grounding, and video-guided task performance.'
    - 'Training paradigms differ: block-wise diffusion generation versus fine-tuning
      of vision-language models.'
    - 'Interaction assumptions differ: relatively static desktop/web tasks versus
      dynamic short-video content and drag-based manipulation.'
    - 'Deployment settings differ: real macOS desktop, browser-simulated short-video,
      mobile/desktop/web navigation, and source-grounded web environments.'
    open_questions:
