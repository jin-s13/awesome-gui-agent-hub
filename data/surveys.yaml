  literature_review:
    line_of_work_matrix:
    - line: Realistic desktop and dynamic-interface benchmark construction
      what_it_solves: Creates shared tasks, environments, and deterministic or efficiency-aware
        metrics for comparing computer-use agents beyond single-screen success.
      what_remains_open: Coverage across operating systems, long-horizon multi-app
        workflows, dynamic media, and deployment-distribution shifts remains sparse;
        several benchmark limitations are incomplete in the evidence.
    - line: Fine-grained and stress-test metric design
      what_it_solves: Probes sub-goal progress, observation/information efficiency,
        uncertainty calibration, and grounding quality beyond aggregate Pass@1.
      what_remains_open: Alignment between these proxy signals and downstream decisions
        is only partially shown; cross-interface and multi-step transfer of uncertainty
        rankings is weak.
    - line: Agent improvement via skill/harness/data/RL
      what_it_solves: Improves frozen or trained computer-use agents through reusable
        multimodal skills, harness optimization, verifiable task synthesis, online
        RL, or weak supervision from unannotated screenshots.
      what_remains_open: Whether gains hold across frameworks, benchmarks, compute
        budgets, and deployment environments is not established from the available
        evidence; many papers omit limitations or artifact details.
    consensus:
    - Benchmarks increasingly score finer-grained evidence such as sub-goal completion,
      observation cost or information efficiency, uncertainty ranking, and grounding
      quality rather than only end-task success.
    - Realistic, rule-based, or verifiable task outcomes are favored to make agent
      performance more auditable and comparable across models.
    - Current computer-use agents show systematic gaps in observation control and
      target-specific robustness even when aggregate scores look comparable.
    disagreements:
    - 'Supervision and improvement signals differ: manually curated benchmark tasks
      with deterministic rules, verifiable synthesized tasks, weak supervision from
      unannotated screenshots, and post-hoc uncertainty calibration target different
      bottlenecks.'
    - 'Evaluation target and interaction mode differ: static desktop GUI+CLI tasks,
      dynamic short-video interfaces, video-guided GUI tasks, and single-step executable
      grounding expose different failure modes.'
    - 'Deployment and model-access settings differ: open-weight internal-state methods
      and closed-source API-only constraints affect what can be measured and how uncertainty
      or robustness transfers.'
    open_questions:
    - How well do benchmark results transfer across operating systems, interface modalities,
      dynamic content, and unseen deployment conditions?
    - Which fine-grained metrics such as sub-goal completion, cost-accuracy, uncertainty
      coverage, or grounding quality best predict reliable real-world computer-use
      behavior?
    - Can skill-library, harness-optimization, RL, and weak-supervision gains transfer
      across frameworks and benchmarks without target-specific re-optimization?
    - How should uncertainty quantification be evaluated for multi-step agent trajectories
      and distribution-shifted interfaces when current evidence is limited to single-step
      grounding?
    - The packet lacks some limitation and artifact details, so implementation stability
      and compute-budget sensitivity remain verification gaps rather than proven properties.
  literature_review_zh:
    研究路线矩阵:
    - 路线: 真实桌面与动态界面基准构建
      解决的问题: 提供共享任务、环境及确定性或效率感知指标，用于比较超越单屏成功率的计算机使用代理。
      尚未覆盖: 跨操作系统、长程多应用工作流、动态媒体和部署分布偏移的覆盖仍不足；部分基准限制在证据中不完整。
    - 路线: 细粒度指标与压力测试设计
      解决的问题: 在总体Pass@1之外检验子目标进展、观察/信息效率、不确定性校准和grounding质量。
      尚未覆盖: 这些代理指标与下游决策的一致性只被部分展示；不确定性排名跨界面和多步迁移较弱。
    - 路线: 基于技能/harness/数据/RL的代理改进
      解决的问题: 通过可复用多模态技能、harness优化、可验证任务合成、在线RL或未标注截图弱监督来提升冻结或训练后的计算机使用代理。
      尚未覆盖: 目前证据未证明这些提升能在框架、基准、算力预算和部署环境之间稳定迁移；许多论文省略限制或工件细节。
    共识:
    - 基准越来越多评估细粒度证据：子目标完成、观察成本或信息效率、不确定性排名和grounding质量，而不只看端到端成功。
    - 更倾向使用真实、基于规则或可验证的任务结果，使代理性能可审计、可跨模型比较。
