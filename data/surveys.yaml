    - 什么样的最低基准协议和报告标准能使OSWorld、ScienceBoard、ScreenSpot-Pro、WebArena-Infinity、MobileWorld和VG-GUIBench的结果可比较？
    - 为什么不确定性排名和安全加固在数据集、界面、领域和开闭源模型层级之间选择性迁移？
    - 密集监督、可验证任务合成、harness优化和上下文管理是否解决互补的失败模式，还是存在重叠？
    - 如何在长程记忆、定位不确定性、欺诈良性召回、领域条件安全和基准泛化之间确定开放缺口的优先级？
