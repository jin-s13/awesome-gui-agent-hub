  literature_review:
    line_of_work_matrix:
    - line: End-to-end agent training and orchestration stacks
      what_it_solves: Trains agents that use complex inference harnesses or native
        GUI/code action spaces in executable environments, via RL or hybrid supervision.
      what_remains_open: Error recovery remains weak after RL; harness design affects
        trainability; independent cross-team and cross-infrastructure reproduction
        is not yet established.
    - line: Efficient action policies and serving
      what_it_solves: Reduces inference latency or parameter count for GUI action
        selection through latent-space scoring or block-wise diffusion generation.
      what_remains_open: Efficiency can trade off against accuracy and generalization;
        evidence is sparse outside AndroidControl and selected GUI benchmarks; limitations
        are partly unstated.
    - line: Weakly supervised and data-efficient learning
      what_it_solves: Builds GUI agents from large-scale unannotated screenshots to
        reduce expensive human annotation.
      what_remains_open: Generalization beyond small calibration data and comparisons
        across broader supervision budgets are not fully evidenced.
    - line: Reusable multimodal skills and artifacts
      what_it_solves: Provides hierarchical multimodal skill knowledge that preserves
        visual figures for UI element identification and workflow verification.
      what_remains_open: Coverage beyond reported benchmarks and independent reuse
        across applications remain uncertain.
    - line: Unified GUI and code execution
      what_it_solves: Combines GUI actions and code execution in one end-to-end policy,
        avoiding naive prompt-level tool composition that degrades GUI performance.
      what_remains_open: Cross-platform transfer is shown but narrow; no explicit
        limitations are stated in the available evidence.
    - line: Diagnostic evaluation and behavior analysis
      what_it_solves: Measures recovery consistency or preference personalization
        through controlled probes, error injection, and stage-wise diagnostics.
      what_remains_open: Current agents do not exploit latent recovery; personalization
        evidence selection and timing remain bottlenecks, with remediation under-evaluated.
    consensus:
    - GUI and computer-use control is increasingly treated as a learnable multimodal
      policy rather than a fixed prompt-and-tool scaffold.
    - Training signal quality, action representation, and evaluation environment selection
      materially affect agent success.
    - Visual grounding signals, whether from screenshots or preserved figures, improve
      UI element identification and task execution.
    - Benchmarks such as OSWorld-Verified, AndroidControl, WebVoyager, and OSExpert-Eval
      are common but not yet sufficient for cross-platform claims.
    disagreements:
    - Supervision strategy ranges from weakly supervised unannotated screenshots to
      verifiable hybrid supervision with online RL.
    - 'Action generation differs: latent candidate scoring, block-wise diffusion,
      autoregressive VLM output, and unified GUI/code actions are all proposed.'
    - 'Evaluation targets differ: overall task success, recovery consistency, preference
      personalization, or latency-accuracy efficiency.'
    - 'Deployment settings differ: mobile, web, desktop Linux, and Windows agents
      face different state, action, and rollback constraints.'
    - Some systems train the actual deployment harness while others train standalone
      policies, making harness-specific trainability a contested boundary.
    open_questions:
    - How can efficient latent or diffusion-based GUI policies close accuracy gaps
      beyond narrow benchmarks like AndroidControl?
    - What training signals or reset-like mechanisms can teach reliable error recovery
      when current agents fail to exploit latent recovery capabilities?
    - What supervision mix best balances annotation cost, verifiability, and generalization
      across web, mobile, desktop, and Windows settings?
    - How do multimodal skill artifacts and behavior memory logs generalize beyond
      small task distributions, and how can evidence selection be improved?
    - Which harness and infrastructure design choices are necessary for reproducible
      agent training across teams and deployments?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端智能体训练与编排栈
      解决的问题: 在可执行环境中训练使用推理框架或统一 GUI/代码动作空间的智能体，采用强化学习或混合监督。
      尚未覆盖: 错误恢复在 RL 后仍弱；推理框架设计影响可训练性；跨团队、跨基础设施复现尚未建立。
    - 路线: 高效动作策略与服务
      解决的问题: 通过潜空间评分或块级扩散生成降低 GUI 动作选择的推理延迟或参数规模。
      尚未覆盖: 效率可能与精度和泛化相权衡；除 AndroidControl 和有限 GUI 基准外证据不足；部分局限未说明。
    - 路线: 弱监督与数据高效学习
      解决的问题: 从大规模未标注截图学习 GUI 智能体，减少昂贵人工标注。
      尚未覆盖: 小规模校准数据之外的泛化，以及更广监督预算下的对比证据不充分。
    - 路线: 可复用多模态技能与工件
      解决的问题: 提供分层多模态技能知识，在工件中保留视觉图形以辅助 UI 元素识别与工作流验证。
      尚未覆盖: 所报告基准之外的覆盖和跨应用独立复用仍不确定。
    - 路线: 统一 GUI 与代码执行
      解决的问题: 在同一个端到端策略中组合 GUI 操作与代码执行，避免提示级工具组合损害 GUI 性能。
      尚未覆盖: 跨平台迁移已有展示但范围有限；可用证据中未明确说明局限。
    - 路线: 诊断式评估与行为分析
      解决的问题: 通过受控探针、错误注入和分阶段诊断测量恢复一致性或偏好个性化能力。
      尚未覆盖: 当前智能体未利用潜在恢复能力；个性化证据选择与时机仍是瓶颈，修复方案未充分评测。
    共识:
    - GUI/计算机使用控制越来越被视为可学习多模态策略，而不是固定的提示与工具脚手架。
    - 训练信号质量、动作表示和评测环境选择会显著影响智能体成功。
    - 来自截图或保留图形的视觉 grounding 信号可改善 UI 元素识别和任务执行。
    - OSWorld-Verified、AndroidControl、WebVoyager、OSExpert-Eval 等基准常见，但尚不足支撑跨平台结论。
    分歧:
    - 监督策略从海量未标注截图弱监督，到可验证混合监督加在线 RL，差异明显。
    - 动作生成方式不同：潜空间候选评分、块级扩散、自回归 VLM 输出与统一 GUI/代码动作均被提出。
    - 评测目标不同：总体任务成功、恢复一致性、偏好个性化或延迟-精度效率。
    - 部署设置不同：移动、Web、桌面 Linux 与 Windows 智能体面临不同状态、动作与回滚约束。
    - 一些系统训练实际部署的推理框架，另一些训练独立策略，使得框架特定可训练性成为未定边界。
    开放问题:
    - 高效潜空间或扩散 GUI 策略如何在 AndroidControl 等窄基准之外缩小精度差距？
    - 当当前智能体未能利用潜在恢复能力时，哪些训练信号或类重置机制能教会可靠错误恢复？
    - 哪种监督组合能在标注成本、可验证性和 Web/移动/桌面/Windows 泛化之间取得平衡？
    - 多模态技能工件和行为记忆日志如何在更大任务分布上泛化，证据选择如何改进？
    - 哪些推理框架和基础设施设计是跨团队、跨部署复现智能体训练所必需的？
