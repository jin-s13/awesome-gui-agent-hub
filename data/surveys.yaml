  - 'Mainstream direction: Formalization through executable task suites and measurable
    metrics rather than abstract proofs; computer-use benchmarks and training methods
    define GUI agent capability on desktops, mobile, dynamic short-video, and drag
    interactions.'
  - 'Shared research pattern: Decompose agent competence into grounding, interaction,
    planning, context management, and reliability; evaluate via datasets, baselines,
    fine-grained scoring, and cost or uncertainty signals.'
  - 'Key differences: Evaluation targets range from single-step grounding to long-horizon
    task completion; interaction modes include click, drag, GUI+CLI, and dynamic content;
    supervision spans weak screenshots, verifiable RL, skill retrieval, and context-action
    training.'
  - 'Trend evolution: Within the 2024-2026 frontier, work moves from static task benchmarks
    toward real desktop, dynamic living-screen, long-horizon mobile, and reliability/uncertainty
    quantification.'
  - 'Open questions: Cross-platform and cross-model transfer, multi-step uncertainty
    calibration, observation control, and missing limitation evidence for several
    training and synthesis methods.'
  related_work_outline_zh:
  - 主流方向：通过可执行任务套件和可测指标进行形式化，而非抽象证明；计算机使用基准和训练方法定义桌面、移动、动态短视频和拖拽交互中的代理能力。
  - 研究共性：把代理能力分解为定位、交互、规划、上下文管理和可靠性，并通过数据集、基线、细粒度评分、成本或不确定性信号评估。
  - 关键差异：评测目标从单步定位到长时程任务完成；交互模式包括点击、拖拽、GUI+CLI 和动态内容；监督信号包括无标注截图、可验证RL、技能检索和上下文动作训练。
  - 趋势演进：在2024-2026前沿内，工作从静态任务基准转向真实桌面、动态屏幕、长时程移动和可靠性/不确定性量化。
  - 开放问题：跨平台与跨模型迁移、多步不确定性校准、观察控制，以及若干训练与合成方法的局限性证据缺失。
  literature_review:
    line_of_work_matrix:
    - line: Task abstraction and benchmark design
      what_it_solves: Defines executable task suites, interaction modes, and metrics
        for measuring GUI/computer-use agent behavior, including dynamic interface
        and drag-based tasks.
      what_remains_open: Coverage is platform- or interaction-specific; limitation
        evidence is often absent; generalization to other dynamic interfaces and real
        desktop tasks remains unverified.
    - line: Skill and context management
      what_it_solves: Maintains long-horizon procedural knowledge and compact state
        through multimodal skill artifacts or explicit context-management actions.
      what_remains_open: Evidence is limited to selected base models and benchmarks;
        cross-application and cross-model generalization, and failure modes under
        much longer horizons, are unresolved.
    - line: Data-efficient and verifiable training
      what_it_solves: Reduces human annotation or improves online RL sample efficiency
        through weak supervision from unannotated screenshots and verifiable task
        synthesis.
      what_remains_open: No explicit limitations are recorded in the visible evidence;
        performance outside the reported benchmarks and robustness under distribution
        shift are not covered.
    - line: Reliability and uncertainty quantification
      what_it_solves: Measures post-hoc uncertainty for GUI grounding and provides
        conformal spatial safety regions.
      what_remains_open: Evaluation is single-step rather than multi-step trajectory-level;
        cross-model and cross-interface ranking transfer is weak and requires target-specific
        re-evaluation.
    consensus:
    - Executable environments and explicit metrics are treated as the main evidence
      for agent capability rather than qualitative claims.
    - Agent competence is decomposed into sub-capabilities such as grounding, interaction,
      planning, context management, and reliability, with separate evaluation signals.
    - Data scale, training efficiency, and reusable knowledge are treated as central
      levers for improving computer-use agents.
    - Reliability is addressed through deterministic scoring, uncertainty quantification,
      or observation-cost metrics rather than a single shared account.
    disagreements:
    - 'Evaluation target differs: single-step grounding uncertainty, full-task Pass@1,
      cost-accuracy, and sub-goal completion.'
    - 'Interaction coverage differs: click-only versus drag-based manipulation, GUI-only
      versus combined GUI and CLI, and static versus dynamically changing screen content.'
    - 'Supervision and training paradigm differs: verifiable online RL, weak supervision
      from unannotated screenshots, retrieval of multimodal skill artifacts, and supervised
      context-action training.'
    - 'Reliability framing differs: post-hoc uncertainty and conformal safety regions
      versus deterministic rule-based evaluation versus information-efficiency metrics.'
    - 'Context and knowledge representation differs: external multimodal skill files,
      structured compact history fields, or policy-internal learned behavior.'
    open_questions:
    - Can single-step GUI-grounding uncertainty methods be extended to multi-step
      agent trajectories and closed-source model interfaces?
    - How well do agents trained or evaluated on specific platforms transfer to unseen
      dynamic interfaces, real desktop/mobile settings, and new interaction modes?
    - Do skill-retrieval and context-management methods retain their gains across
      different base models, applications, and substantially longer horizons?
    - What are the missing limitation and failure-boundary details for verifiable
      task synthesis and weak-supervision training pipelines?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 任务抽象与基准设计
      解决的问题: 定义可执行任务套件、交互模式和指标，以测量GUI/计算机使用代理行为，包括动态界面和拖拽任务。
      尚未覆盖: 覆盖范围局限于平台或交互类型；局限性证据常缺失；对其他动态界面和真实桌面任务的泛化未验证。
    - 路线: 技能与上下文管理
      解决的问题: 通过多模态技能工件或显式上下文管理动作，维护长时程程序性知识和紧凑状态。
      尚未覆盖: 证据限于少数基座模型和基准；跨应用、跨模型泛化及更长时程失效模式未解决。
    - 路线: 数据高效与可验证训练
      解决的问题: 通过未标注截图的弱监督和可验证任务合成，减少人工标注或提升在线RL样本效率。
      尚未覆盖: 可见证据中无明确局限性记录；报告基准之外的表现和分布偏移鲁棒性未被覆盖。
    - 路线: 可靠性与不确定性量化
      解决的问题: 测量GUI定位的后验不确定性，并提供共形空间安全区域。
      尚未覆盖: 评测为单步而非多步轨迹级；跨模型和跨接口排名迁移弱，需目标特定重评。
