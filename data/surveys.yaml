  related_work_outline_zh:
  - 主流方向：在真实桌面、移动端和短视频等动态 GUI 环境中训练与评测视觉语言代理，重点从静态点击转向拖拽、动态观察控制和长时程任务。
  - 研究共性：以 VLM 进行屏幕理解和动作预测，并引入比 Pass@1 更细的子目标或成本-准确率指标来区分能力差异。
  - 关键差异：评测设置涵盖 macOS GUI+CLI、移动端长程、短视频动态流、拖拽和视频引导任务；监督信号和动作接口也明显分化。
  - 趋势演进：证据集中在 2026 年，属当前前沿；正从静态单步代理走向数据高效的在线强化学习、弱监督、上下文管理、观测控制和不确定性评估。
  - 开放问题：跨平台与跨界面泛化、轨迹级不确定性校准、可学习的观测控制、以及方法贡献与任务生成器/规划器/框架/技能库的隔离仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: GUI grounding and action representation methods
      what_it_solves: Learning to map screen or video observations to actions such
        as clicks, drags, and context-management operations; includes task-driven
        keyframe extraction and visual grounding from unannotated screenshots.
      what_remains_open: Whether learned representations transfer beyond the reported
        interface family and whether action spaces such as drag or context-as-action
        are sufficient for unseen long-horizon tasks.
    - line: Training-data and objective design methods
      what_it_solves: Reducing annotation cost and improving sample efficiency through
        weakly supervised visual grounding, verifiable task synthesis, online RL with
        frontier sampling, and compact context representations.
      what_remains_open: The relative contribution of data recipe, task generator,
        RL objective, and base VLM is not isolated; data quality and diversity beyond
        reported benchmarks remain unverified.
    - line: Planning, observation-control, and long-horizon context management
      what_it_solves: Connecting perception to intervention in dynamic and long-horizon
        interfaces by treating observation or memory updates as first-class actions
        and scoring action accuracy against information cost.
      what_remains_open: Whether gains come from the policy's planning/context management
        rather than the grounding model, and whether observation-control behavior
        transfers across platforms.
    - line: Evaluation, uncertainty, and ablation protocol methods
      what_it_solves: Separating model capabilities from framework and task effects
        via deterministic scoring, fine-grained sub-goal metrics, and post-hoc uncertainty
        quantification for GUI grounding.
      what_remains_open: Uncertainty rankings transfer weakly across model classes
        and are mostly validated for single-step grounding; several papers lack visible
        code, dataset, or limitation evidence, leaving ablation strength partially
        unverified.
    consensus:
    - Pass@1 alone is insufficient; fine-grained sub-goal, cost-accuracy, or calibration
      metrics reveal differences between similarly successful agents.
    - Screen grounding and action localization remain central bottlenecks across static,
      dynamic, drag-based, and long-horizon GUI tasks.
    - Evaluation is moving into realistic or browser-faithful interactive environments
      rather than relying only on static offline screenshots.
    - 'Data efficiency matters: weak supervision, verifiable task synthesis, online
      RL, and context compaction are all proposed to reduce annotation cost and improve
      training throughput.'
    - Dynamic and long-horizon settings expose new requirements beyond action success,
      especially observation control, memory management, and uncertainty awareness.
    disagreements:
    - 'Evaluation target differs: macOS desktop tasks mixing GUI and CLI, mobile long-horizon
      tasks, dynamic short-video streams, drag-based interactions, and video-guided
      GUI tasks each assume different success conditions.'
    - 'Action space differs: methods emphasize single-step click grounding, drag manipulations,
      GUI plus CLI operations, or context-management actions emitted alongside UI
      actions.'
    - 'Supervision differs: some methods learn from massive unannotated screenshots
      with a small annotated calibration set, others synthesize verifiable tasks for
      online RL, and others use curated trajectory annotations.'
    - 'Interface assumptions differ: uncertainty work relies on open-weight internal
      states while also testing closed-source models where logits or hidden states
      are inaccessible, limiting a single consistent method.'
    - 'Contribution attribution differs: one benchmark attributes top performance
      to a skill library rather than framework design, while method papers attribute
      gains to training recipes or context policies; the underlying source of improvement
      is not consistently isolated.'
    open_questions:
    - How can uncertainty or calibration be estimated reliably for multi-step GUI
      trajectories and for closed-source agents that expose only actions?
    - 'Which components drive improvements in online RL and weak supervision: task
      generation, sampling strategy, visual context segmentation, policy objective,
      or base model capability?'
    - Can observation control be learned as a first-class action and generalized beyond
      short-video platforms to other dynamic interfaces?
    - Do macOS, mobile, drag, and video-guided benchmarks predict cross-app and cross-interface
      deployment success?
    - What gaps are hidden by absent code, datasets, baselines, or limitations sections
      in several current reports?
  literature_review_zh:
    研究路线矩阵:
    - 路线: GUI 定位与动作表示方法
      解决的问题: 学习将屏幕或视频观察映射为点击、拖拽和上下文管理等动作；包括任务驱动的关键帧提取和从未标注截图学习视觉定位。
      尚未覆盖: 所学报表示能否迁移到报告界面族之外，以及拖拽或上下文即动作等动作空间是否足以处理未见长时程任务。
    - 路线: 训练数据与目标设计方法
      解决的问题: 通过弱监督视觉定位、可验证任务合成、带前沿采样的在线强化学习和紧凑上下文表示，降低标注成本并提高样本效率。
      尚未覆盖: 数据配方、任务生成器、强化学习目标和基础 VLM 的相对贡献尚未隔离；所报基准之外的数据质量和多样性仍未验证。
    - 路线: 规划、观测控制与长时程上下文管理
      解决的问题: 将感知连接到动态和长时程界面中的干预，把观察或记忆更新视为第一类动作，并用动作准确率与信息成本联合评分。
      尚未覆盖: 收益是否来自策略的规划/上下文管理而非定位模型，以及观测控制行为能否跨平台迁移。
    - 路线: 评估、不确定性与消融协议方法
      解决的问题: 通过确定性评分、细粒度子目标指标和 GUI 定位的后验不确定性量化，区分模型能力与框架、任务效应。
      尚未覆盖: 不确定性排名跨模型类别迁移弱，且主要在单步定位中验证；多篇论文未见代码、数据集或局限性证据，消融强度部分未核验。
    共识:
    - Pass@1 单独不够；细粒度子目标、成本-准确率或校准指标能揭示成功分数相似代理之间的差异。
    - 屏幕定位与动作定位仍是静态、动态、拖拽和长时程 GUI 任务中的核心瓶颈。
    - 评测正从静态离线截图转向真实或浏览器保真的交互式环境。
    - 数据效率受到重视：弱监督、可验证任务合成、在线强化学习和上下文压缩都被用来降低标注成本并提升训练效率。
    - 动态和长时程环境提出了动作成功之外的新需求，尤其是观测控制、记忆管理和不确定性感知。
    分歧:
    - 评测目标不同：macOS 桌面 GUI 与 CLI 混合任务、移动端长时程任务、动态短视频流、拖拽交互和视频引导任务各自设定不同成功条件。
    - 动作空间不同：方法分别强调单步点击定位、拖拽操作、GUI 与 CLI 操作，或与 UI 动作同时输出的上下文管理动作。
    - 监督信号不同：有的利用大规模未标注截图加少量标注校准，有的为在线强化学习合成可验证任务，还有的使用人工整理的轨迹标注。
    - 模型接口假设不同：不确定性研究依赖开源模型内部状态，同时也测试只能获得动作或输出的闭源模型，难以使用单一一致方法。
    - 贡献归属不同：一个基准将最佳表现归因于技能库而非框架设计，方法论文则归因于训练配方或上下文策略；背后的提升来源未被一致隔离。
    开放问题:
    - 如何为多步 GUI 轨迹和仅输出动作的闭源代理可靠估计不确定性或校准？
    - 在线强化学习与弱监督中的提升究竟来自任务生成、采样策略、视觉上下文分割、策略目标还是基础模型能力？
    - 观测控制能否作为第一类动作被学习，并从短视频平台泛化到其他动态界面？
    - macOS、移动端、拖拽和视频引导基准能否预测跨应用与跨界面的实际部署表现？
    - 当前若干报告中缺失的代码、数据集、基线和局限性说明背后隐藏了哪些验证缺口？
