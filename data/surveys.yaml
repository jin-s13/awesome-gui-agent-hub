  related_work_outline:
  - 'Mainstream direction: The evidence centers on GUI/computer-use agents that perceive
    screen observations and predict grounded actions, with movement toward dynamic
    video/living-screen settings, richer action spaces such as drag and GUI+CLI, and
    data-efficient training or self-improvement.'
  - 'Shared research pattern: Work combines VLM backbones, closed-loop interaction,
    large task collections, and fine-grained metrics such as sub-goal completion,
    multi-checkpoint scoring, cost-accuracy, or uncertainty calibration instead of
    relying only on aggregate success.'
  - 'Key differences: Adaptation occurs in different places: weakly supervised or
    online-RL model training, frozen-backbone harness optimization, keyframe extraction,
    and post-hoc uncertainty calibration; evaluation also ranges from single-step
    grounding to multi-step dynamic trajectories and desktop benchmarks.'
  - 'Trend evolution: The available 2026 evidence suggests a current-frontier shift
    from static click-only evaluation toward verifiable task synthesis, unannotated
    screenshot curricula, self-improving harnesses, video/dynamic observation control,
    and reliability benchmarking.'
  - 'Open questions: Reported gains are not fully isolated from frameworks, skill
    libraries, or task priors; transfer across platforms, model tiers, and multi-step
    settings remains weak; multiple papers lack limitation or artifact details.'
  related_work_outline_zh:
  - 主流方向：证据集中在以屏幕观察和动作预测为核心的GUI/计算机使用代理，向动态视频/活屏设置、拖拽与GUI+CLI等更丰富动作空间，以及数据高效训练或自改进发展。
  - 研究共性：工作普遍使用VLM骨干、闭环交互、大规模任务集合和细粒度指标，如子目标完成、多检查点评分、成本-准确性或不确定性校准，而非只看总成功率。
  - 关键差异：适应位置不同：弱监督或在线RL训练、冻结骨干harness优化、关键帧提取和后验UQ校准；评测也从单步定位到多步动态轨迹及桌面基准不等。
  - 趋势演进：现有2026年证据显示从静态点击测评向可验证任务合成、未标注截图课程、自改进harness、视频/动态观察控制和可靠性评测的前沿转变。
  - 开放问题：报告提升未与framework、技能库或任务先验完全隔离；跨平台、模型层级和多步设置的迁移仍弱；多篇论文缺少局限或工件说明。
  literature_review:
    line_of_work_matrix:
    - line: Supervision and self-improvement for GUI action prediction
      what_it_solves: Reduces expensive human annotation and manual tuning by using
        unannotated screenshots, verifiable task synthesis, online RL, repetition
        evidence, and harness optimization to improve action grounding and task success.
      what_remains_open: Whether gains transfer beyond OSWorld, ScienceBoard, and
        WindowsAgentArena, and whether improvements come from model capability, harness
        changes, skill libraries, or task priors remains only partially isolated.
    - line: Observation and keyframe selection for video or dynamic GUI interfaces
      what_it_solves: Selects task-relevant frames for video-guided GUI tasks and
        reveals performance limits of agents on living-screen interfaces where content
        changes between actions.
      what_remains_open: Observation control and dynamic-interface generalization
        beyond short-video platforms and the chosen VideoQA/GUI benchmarks are not
        yet established.
    - line: Action-space and interface grounding evaluation
      what_it_solves: Measures grounding across click, drag, and GUI+CLI interaction
        modalities through large datasets, multi-checkpoint scoring, and fine-grained
        sub-goal metrics.
      what_remains_open: Coverage of multi-step trajectories, cross-platform transfer,
        and whether dataset fine-tuning improvements translate to downstream computer-use
        tasks still need more evidence.
    - line: Uncertainty quantification and evidence protocols for grounding reliability
      what_it_solves: Benchmarks post-hoc uncertainty estimates for GUI grounding
        and introduces conformal click regions to assess calibration and spatial safety.
      what_remains_open: Ranking transfer is weak across model tiers and interfaces,
        evaluation is limited to single-step grounding, and coverage degrades under
        distribution shift, leaving deployment robustness unresolved.
    consensus:
    - Modern GUI agents are evaluated as closed-loop systems that take screenshots
      or observations and produce grounded actions, with success measured through
      Pass@1 or cost-accuracy rather than static visual question answering.
    - Frontier VLM backbones show meaningful but incomplete progress; no evaluated
      model reaches human-level cost-accuracy in dynamic environments, and fine-grained
      metrics reveal differences hidden by aggregate success.
    - Research is converging on scalable training or adaptation signals such as unannotated
      screenshots, synthesized tasks, repeated runs, and harness changes rather than
      only human-labeled single-step data.
    - Separating model capability from framework, harness, or skill-library effects
      is recognized as necessary, but the available studies do not all isolate these
      factors consistently.
    disagreements:
    - 'Adaptation location differs: some methods update model weights through weak
      supervision or online RL, while others keep backbones frozen and optimize the
      execution harness.'
    - 'Evaluation targets differ: static desktop and drag grounding, dynamic short-video
      interfaces, video-guided tasks, and long-horizon OSWorld/ScienceBoard-style
      success coexist, with observation control foregrounded in only some settings.'
    - 'Interaction modality focus differs: click grounding, drag-based actions, GUI+CLI
      multi-application operation, and video keyframe selection are treated as distinct
      core capabilities.'
    - 'Reliability evidence differs: uncertainty benchmarking focuses on single-step
      grounding and post-hoc UQ, while training and self-improvement work emphasizes
      multi-step trajectories or online RL, reducing direct comparability.'
    open_questions:
    - How much of reported improvement comes from the proposed method rather than
      the surrounding model, framework, skill library, or task generation process?
    - Can observation control, dynamic-interface handling, and drag/GUI+CLI grounding
      be unified in one agent without platform-specific tuning?
    - Do uncertainty rankings and calibration transfer from open-weight single-step
      grounding to closed-source models and multi-step computer-use trajectories under
      distribution shift?
    - Where code, dataset, baseline, metric, or limitation details are absent, can
      the claimed methodological contribution be separated from benchmark or system
      choices?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 面向GUI动作预测的监督与自改进
      解决的问题: 通过未标注截图、可验证任务合成、在线RL、重复运行证据和harness优化，减少昂贵人工标注与手动调优，提升动作定位和任务成功率。
      尚未覆盖: OSWorld、ScienceBoard、WindowsAgentArena之外的迁移，以及收益来自模型能力、harness修改、技能库还是任务先验，尚未充分隔离。
    - 路线: 视频或动态GUI界面的观察与关键帧选择
      解决的问题: 为视频引导的GUI任务选择任务相关帧，并揭示动态屏幕环境中代理在操作间内容变化时的性能边界。
      尚未覆盖: 观察控制和动态界面泛化是否超越短视频平台及所选VideoQA/GUI基准尚未验证。
    - 路线: 动作空间与界面定位评测
      解决的问题: 通过大规模数据集、多检查点评分和细粒度子目标指标，衡量点击、拖拽和GUI+CLI交互中的定位能力。
      尚未覆盖: 多步轨迹覆盖、跨平台迁移，以及截图微调提升能否转化为下游计算机使用任务仍缺少证据。
    - 路线: 面向基础可靠性的不确定性量化与证据协议
      解决的问题: 对GUI基础的后验不确定性估计进行基准评估，并引入共形点击区域以衡量校准与空间安全。
      尚未覆盖: 跨模型类别和接口的排名迁移较弱，评估限于单步定位，分布偏移下覆盖率下降，部署鲁棒性尚未解决。
    共识:
    - 现代GUI代理被作为闭环系统评估：以截屏或观察为输入并输出可执行动作，主要通过Pass@1或成本-准确性评分，而非静态视觉问答。
    - 前沿VLM骨干模型虽有进步，但在动态环境中未达到人类水平；细粒度指标能揭示总成功率掩盖的子目标完成差异。
    - 研究趋同于寻找可扩展的训练或适应信号：未标注截图、合成任务、重复运行或harness优化，而非仅依赖人工标注单步数据。
    - 区分模型能力与框架、harness或技能库的影响被认为是必要的，但目前并非所有证据都做到一致隔离。
    分歧:
    - 适应位置不同：弱监督或在线RL方法修改模型权重，而harness优化保持骨干冻结并修改执行系统。
    - 评测目标不同：静态桌面与拖拽定位、动态短视频界面、视频引导任务和OSWorld/ScienceBoard长程任务并存，观察控制的显著性不同。
    - 交互模态重点不同：点击定位、拖拽操作、GUI+CLI多应用操作与视频关键帧选择被视为不同核心能力。
    - 可靠性证据不同：不确定性基准集中在单步定位和后验UQ，训练与自改进工作则关注多步轨迹或在线RL，降低直接可比性。
    开放问题:
    - 报告提升中有多少来自方法本身，而非周边模型、framework、技能库或任务生成过程？
    - 观察控制、动态界面处理和拖拽/GUI+CLI定位能否不做平台特定调优而集成到同一代理？
    - UQ排序与校准能否从开源单步定位迁移到闭源模型及多步计算机使用轨迹？
    - 当缺少代码、数据集、基线、指标或局限说明时，方法贡献能否与基准或系统选择分离？
