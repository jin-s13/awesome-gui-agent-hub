  related_work_outline_zh:
  - 主流方向：端到端 GUI 与计算机使用智能体系统，融合多模态屏幕理解、统一动作空间和基于环境的 RL 或课程训练，而非仅依赖静态提示。
  - 研究共性：多数工作将模型策略与屏幕/动作数据或工件结合，并以 GUI 基准评估；系统类工作进一步加入训练或部署编排层。
