  literature_review:
    line_of_work_matrix:
    - line: Method representation and objective design (training methods)
      what_it_solves: Designs training paradigms—online RL with verifiable task synthesis,
        weakly supervised curriculum learning from unlabeled screenshots, and supervised
        fine-tuning with proactive context management—to improve GUI agent performance
        while reducing reliance on expensive human annotations.
      what_remains_open: Cross-platform and cross-task generalization of these training
        regimes is unproven; ablation studies rarely isolate the contribution of representation,
        optimizer, and task prior; the trade-off between training cost and data efficiency
        remains under-explored.
    - line: Planning and action-interface methods (action space expansion)
      what_it_solves: Extends the action space of GUI agents beyond click and type
        to include drag-based interactions and context-management actions (e.g., folding
        history, summarizing UI state), enabling richer interaction with dynamic interfaces
        and long-horizon tasks.
      what_remains_open: Compatibility with existing click-based agents, the impact
        of new actions on multi-step task success rates, and whether explicit planning
        components would further improve sequential decision-making have not been
        assessed.
    - line: Method evidence and ablation protocol (benchmarking and evaluation)
      what_it_solves: Provides fine-grained capability assessments, failure-mode analyses
        (e.g., observation control, uncertainty calibration), and metrics beyond Pass@1
        to separate method contributions from framework design, skill libraries, and
        other system-level factors.
      what_remains_open: Benchmark coverage of real-world diversity (dynamic content,
        diverse interaction types) is still narrow; the correlation between benchmark
        metrics and online deployment performance is unverified; cross-benchmark consistency
        of conclusions has not been tested.
    consensus:
    - Current GUI agents exhibit systemic deficiencies in handling dynamic interfaces,
      particularly over- and under-observation, indicating a lack of observation control.
    - Fine-grained evaluation metrics (sub-goal completion, cost-accuracy) reveal
      capability differences that coarse metrics like Pass@1 conceal, making them
      essential for method comparison.
    - Training with limited or no human annotations—via weak supervision, synthetic
      task generation, or online RL—can yield competitive agents, reducing the annotation
      bottleneck.
    - Proactive context management (e.g., summarizing history, folding UI state) is
      critical for long-horizon tasks and outperforms passive accumulation of raw
      interaction history.
    disagreements:
    - 'Supervision signal: online RL with verifiable tasks vs. weakly supervised curriculum
      learning from unlabeled data vs. fully supervised fine-tuning with structured
      context; the optimal data source and training paradigm is unresolved.'
    - 'Action space extension: drag interactions are treated as a separate primitive,
      while context management is framed as an action emitted by the policy; there
      is no unified view on which new primitives should be standardized.'
    - 'Evaluation target: benchmarks target real-world desktop (macOS), short-video
      platforms, video-guided tasks, or specific interaction types (drag); the priority
      among these dimensions is not agreed upon.'
    - 'Reliability assessment: uncertainty quantification is central in some works
      but absent in most training-oriented papers, leaving unclear whether safety-critical
      deployment requires UQ or if current methods are robust enough.'
    open_questions:
    - How can agents acquire observation control to balance information gathering
      and cost, and are the observed failures (over-observation, under-observation)
      inherent to the VLM backbone or the agent design?
    - What is the distribution gap between synthetically generated tasks and real
      user tasks, and how does it affect the generalization of RL-trained or weakly
      supervised agents?
    - Does expanding action spaces to include drag, context management, and other
      primitives improve end-user task success without introducing disproportionate
      complexity or error modes?
    - Can uncertainty quantification remain calibrated across multi-step agent trajectories,
      and what is the minimal set of UQ signals needed for safe autonomous GUI operation?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 方法表示与目标设计（训练方法）
      解决的问题: 设计训练范式——基于可验证任务合成的在线RL、从无标注截图的弱监督课程学习、带主动上下文管理的监督微调——以提升GUI代理性能，同时减少对昂贵人工标注的依赖。
      尚未覆盖: 这些训练范式的跨平台、跨任务泛化性未被证实；消融研究很少隔离表示、优化器和任务先验的贡献；训练成本与数据效率之间的权衡尚未充分探索。
    - 路线: 规划与动作接口方法（动作空间扩展）
      解决的问题: 将GUI代理的动作空间从点击和输入扩展到拖拽交互和上下文管理动作（如折叠历史、总结UI状态），从而实现对动态界面和长时域任务的更丰富交互。
      尚未覆盖: 与现有基于点击代理的兼容性、新动作对多步任务成功率的影响，以及显式规划组件是否能进一步提升顺序决策，均未被评估。
    - 路线: 方法证据与消融协议（基准与评估）
      解决的问题: 提供细粒度能力评估、失败模式分析（如观察控制、不确定性校准），以及超越Pass@1的指标，以分离方法贡献与框架设计、技能库等系统因素。
      尚未覆盖: 基准对真实世界多样性（动态内容、多样化交互类型）的覆盖仍较窄；基准指标与线上部署性能的关联尚未验证；跨基准结论的一致性未被测试。
    共识:
    - 当前GUI代理在处理动态界面时存在系统性缺陷，尤其是过度观察和观察不足，表明缺乏观察控制能力。
    - 细粒度评估指标（子目标完成度、成本-准确性）能揭示粗粒度指标如Pass@1所掩盖的能力差异，因此对方法比较至关重要。
    - 通过弱监督、合成任务生成或在线RL，在有限或无人工标注情况下训练出的代理具有竞争力，缓解了标注瓶颈。
    - 主动上下文管理（如总结历史、折叠UI状态）对于长时域任务至关重要，优于被动累积原始交互历史。
    分歧:
    - 监督信号来源：基于可验证任务的在线RL vs. 从无标注数据的弱监督课程学习 vs. 带结构化上下文的完全监督微调；最优数据源和训练范式尚无定论。
    - 动作空间扩展方向：拖拽交互被视为独立原语，而上下文管理被建模为策略发出的动作；尚未形成统一观点哪些新原语应被标准化。
    - 评估目标：基准分别面向真实桌面（macOS）、短视频平台、视频引导任务或特定交互类型（拖拽）；这些维度之间的优先级尚未达成共识。
    - 可靠性评估：不确定性量化在部分工作中是核心，但在大多数训练导向论文中缺失，安全关键部署是否需要UQ或当前方法是否足够鲁棒仍不明确。
    开放问题:
    - 代理如何获得观察控制能力以平衡信息获取与效率，观察到的失败模式（过度观察、观察不足）是VLM骨干固有的还是代理设计造成的？
    - 合成生成任务与真实用户任务之间的分布差异有多大，它如何影响RL训练或弱监督代理的泛化能力？
    - 扩展动作空间以包含拖拽、上下文管理及其他原语，能否在不过度增加复杂性或错误模式的情况下提升终端用户任务成功率？
    - 不确定性量化能否在多步代理轨迹中保持校准，安全自主GUI操作所需的最小UQ信号集是什么？
