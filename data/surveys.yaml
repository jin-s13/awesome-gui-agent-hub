      解决的问题: 将GUI评测扩展到拖拽、视频引导和短视频动态界面等非点击静态任务，并引入成本-准确率或任务相关指标。
      尚未覆盖: 观察控制、信息效率权衡和跨平台/交互类型迁移仍未解决。
    - 路线: 多模态技能构建与检索
      解决的问题: 通过保留图形和文本的分层可复用知识，提升UI元素识别与工作流状态验证。
      尚未覆盖: 技能维护、跨应用扩展和未见工作流迁移尚未充分证明。
    - 路线: 重复任务的状态机回放与加速
      解决的问题: 将成功执行编译为带屏幕检查与回退机制的状态机程序，以降低重复任务时延并提高一致性。
      尚未覆盖: 任务变体、界面变化和程序长期可靠性的泛化仍属开放问题。
    - 路线: GUI智能体训练与环境/数据生成
      解决问题的能力: 通过块级扩散训练、拖拽/视频/网页交互数据微调和真实网页环境自动重建，改进grounding与导航能力。
      尚未覆盖: 跨平台稳健性、数据多样性以及重建工件和训练细节的验证证据仍不完整。
    共识:
