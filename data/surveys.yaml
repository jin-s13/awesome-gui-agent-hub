  related_work_outline_zh:
  - 主流方向：证据集中在GUI智能体的基准、训练与评测方法上，尤其是长程桌面/移动任务；重点包括grounding、监督训练和评测可靠性，而非传统综述本身。
  - 研究共性：构建受控任务或监督信号，以视觉语言智能体评测任务完成、定位或不确定性；通过限制线索、可验证或密集标注隔离单一能力。
  - 关键差异：表示方式分为潜空间候选评分与文本生成MLLM动作；监督来源包括在线RL、密集桌面标注、harness演化和上下文动作SFT；评测目标从单步定位到长程完成不等。
  - 趋势演进：2024-2026年间，研究从单一模型能力转向环境/harness工程、合成任务生成、密集监督、可靠性基准和效率优先策略；目前属于当前前沿趋势。
  - 开放问题：跨界面与跨模型泛化、脱离净化/静态基准后的鲁棒性、速度与精度权衡、多步不确定性等仍缺乏充分证据。
  literature_review:
    line_of_work_matrix:
    - line: Evaluation and benchmarking of GUI-agent capabilities
      what_it_solves: Builds controlled probes to isolate grounding, video-guided
        interaction, fraud judgment, and uncertainty behavior in vision-language agents.
      what_remains_open: Many evaluations remain single-step, sanitized, or limited
        in dataset size; cross-interface and cross-model generalization is not yet
        established.
    - line: Scalable supervision and online RL for computer-use agents
      what_it_solves: Uses verifiable task synthesis or dense desktop annotations
        to improve GUI grounding and long-horizon task completion.
      what_remains_open: Whether gains from synthetic or dense supervision transfer
        across environments and to real deployment settings remains unclear.
    - line: Execution-harness and action-policy design
      what_it_solves: Improves frozen GUI models through harness optimization, proactive
        context management, or latent candidate scoring, balancing efficiency and
        long-horizon memory.
      what_remains_open: Evidence is often limited to specific benchmarks, and efficiency
        gains may trade off against absolute accuracy.
    consensus:
    - GUI-agent performance is sensitive to the evidence and shortcuts available in
      the evaluation environment.
    - Frozen backbone models can be improved by changing the surrounding harness,
      context policy, or training signal rather than only scaling model parameters.
    - Controlled benchmarks help expose specific failures such as benign recall, uncertainty
      transfer, or long-horizon state tracking.
    - Grounding decisions in observed interface state or environment feedback is a
      recurring requirement across approaches.
    disagreements:
    - Whether actions should be represented as decoded text from a large vision-language
      model or as scored candidate latents in a compact policy.
    - Whether improvement should come from external harness evolution, online RL with
      synthetic tasks, dense supervised annotations, or proactive context-management
      actions.
    - Evaluation targets differ across single-step executable grounding, long-horizon
      task completion, video-guided interaction, and webpage fraud judgment.
    - 'Efficiency is treated differently: some prioritize inference speed and parameter
      count, while others accept heavier models or training for state-of-the-art accuracy.'
    open_questions:
    - Can gains from synthetic verifiable tasks or dense desktop annotations transfer
      to unseen interfaces and real deployment settings?
    - How should uncertainty quantification extend from single-step GUI grounding
      to multi-step agent trajectories?
    - Do sanitized benchmark settings hide reputation or shortcut cues that agents
      would legitimately use in production?
    - What is the right tradeoff between compact latent action policies and full VLM
      decoding for long-horizon reliability?
  literature_review_zh:
    研究路线矩阵:
    - 路线: GUI智能体能力的评测与基准构建
      解决的问题: 通过受控探针隔离视觉语言智能体的 grounding、视频引导交互、欺诈判断和不确定性行为。
      尚未覆盖: 许多评测仍为单步、净化或数据规模有限；跨界面与跨模型泛化尚未建立。
    - 路线: 计算机使用智能体的可扩展监督与在线RL
      解决的问题: 通过可验证任务合成或密集桌面标注提升 GUI 定位和长程任务完成能力。
      尚未覆盖: 合成或密集监督的收益能否跨环境迁移并适用于真实部署仍不清楚。
    - 路线: 执行harness与动作策略设计
      解决的问题: 对冻结 GUI 模型进行 harness 优化、主动上下文管理或潜空间候选评分，平衡效率与长时记忆。
      尚未覆盖: 证据常限于特定基准，效率收益可能以一定的绝对准确率为代价。
    共识:
    - GUI智能体性能受评测环境中证据和捷径可用性的影响。
    - 冻结骨干模型可通过外部harness、上下文策略或训练信号改进，而非仅扩大模型参数。
    - 受控基准有助于暴露良性召回、不确定性迁移和长时状态跟踪等具体失败。
    - 将决策 grounding 到界面状态或环境反馈是跨方法的反复要求。
    分歧:
    - 动作表示：是通过大视觉语言模型逐 token 解码动作，还是在紧凑潜空间中对候选动作评分。
    - 改进来源：外部harness演化、在线RL合成任务、密集监督标注或主动上下文管理。
    - 评测目标：单步可执行 grounding、长程任务完成、视频引导交互或网页欺诈判断。
    - 效率定位：有的优先推理速度和参数规模，有的为SOTA准确率接受更大模型或训练成本。
    开放问题:
    - 来自合成可验证任务或密集桌面标注的收益能否迁移到未见界面和真实部署环境？
    - 不确定性量化如何从单步GUI grounding扩展到多步智能体轨迹？
    - 净化后的基准是否隐藏了生产环境中本可合法使用的信誉或捷径线索？
    - 紧凑潜空间动作策略与完整VLM解码在长程可靠性上的权衡是什么？
