  - 开放问题：跨平台泛化、模型/harness/规划器/任务先验的贡献归因、观察控制修复、不确定性迁移与可复现性缺口仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: Method representation and objective design
      what_it_solves: 'Converts GUI-agent capability into learnable representations
        and objectives: visual grounding from unannotated screenshots, task-aware
        keyframe extraction, verifiable online RL tasks, and drag grounding data.'
      what_remains_open: Which representation and objective choices transfer beyond
        reported datasets, platforms, and interaction types remains unclear; several
        papers lack stated limitations or component ablations.
    - line: Planning and action-interface methods
      what_it_solves: 'Connects model decisions to executable actions and interfaces:
        optimizing an execution harness around frozen backbone models, handling GUI+CLI
        and dynamic observation control, and covering drag-based actions.'
      what_remains_open: Attribution between model, harness, planner, skill library,
        and task prior is under-evidenced; current agents still fail at over- and
        under-observation in dynamic interfaces.
    - line: Method evidence and ablation protocol
      what_it_solves: Separates method contribution from surrounding system choices
        through fine-grained scoring, held-out harness transfer, benchmark baselines,
        and uncertainty ranking transfer.
      what_remains_open: Evidence is often limited to one benchmark family or single-step
        grounding; cross-model and cross-interface uncertainty transfer is weak, and
        some reproducibility signals are low or missing.
    consensus:
    - Aggregate success alone hides capability differences, so fine-grained sub-goal,
      cost-accuracy, and calibration metrics are becoming central.
    - Evaluation and training are moving toward richer action environments such as
      GUI+CLI, dynamic screens, drag interactions, and video-guided tasks.
    - Supervision is shifting toward verifiable synthesis, weak supervision from unannotated
      screenshots, and large automatically labeled datasets to reduce human annotation.
    - Current agents remain below human-level or robust performance, especially in
      observation control, drag grounding, and sub-goal completion.
    - Reported gains require isolation from backbone, framework, skill library, harness,
      and task-prior effects.
    disagreements:
    - Evaluation focus ranges from desktop task success to dynamic observation efficiency,
      single-step grounding uncertainty, drag interaction, and video-guided tasks.
    - 'Improvement strategy differs: train the agent with online RL or weak supervision,
      optimize the execution harness while freezing the model, or improve input keyframe
      extraction.'
    - 'Supervision signal differs: verifiable task reward, weak contextual grounding,
      or post-hoc uncertainty scores.'
    - 'Metric emphasis differs: Pass@1 or success, fine-grained sub-goal scores, cost-accuracy,
      and ranking or conformal coverage.'
    - 'Task scope differs: multi-step agent trajectories versus single-step executable
      grounding, and static desktop versus dynamic changing interfaces.'
    open_questions:
    - 'Which component drives gains: backbone model, harness, framework, skill library,
      task synthesis, frontier sampling, or input representation?'
    - Do reported methods and benchmarks generalize beyond OSWorld, ScienceBoard,
      macOS, short-video platforms, drag tasks, and WindowsAgentArena?
    - Can observation-control failures in dynamic interfaces be repaired through training,
      input representation, or harness changes?
    - How robust are uncertainty rankings and conformal click regions across model
      families, interfaces, and distribution shifts?
    - What is the reproducibility status of top methods when code, dataset, metric,
      baseline, or limitation details are missing or weakly evidenced?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 方法表示与目标设计
      解决的问题: 将GUI代理能力转化为可学习的表示和目标：从未标注截图进行视觉定位、任务感知关键帧提取、可验证在线RL任务以及拖拽定位数据。
      尚未覆盖: 哪些表示和目标选择能迁移到已报告数据集、平台和交互类型之外仍不清楚；若干净论文缺少局限性说明或组件消融。
    - 路线: 规划与动作接口方法
      解决的问题: 将模型决策连接到可执行动作和接口：在冻结骨干模型上优化执行harness、处理GUI+CLI和动态观察控制、覆盖拖拽类动作。
      尚未覆盖: 模型、harness、规划器、技能库和任务先验之间的贡献归因证据不足；当前代理在动态界面中仍存在过度观察和观察不足。
    - 路线: 方法证据与消融协议
      解决的问题: 通过细粒度评分、保留集harness迁移、基准基线和不确定性排名迁移，区分方法贡献与周边系统选择。
      尚未覆盖: 证据通常局限于单一基准族或单步定位；跨模型和跨接口的不确定性迁移较弱，部分可复现信号较低或缺失。
    共识:
    - 总体成功率会掩盖能力差异，因此细粒度子目标、成本-准确性和校准指标正变得更重要。
    - 评估与训练正从静态点击屏幕扩展到GUI+CLI、动态屏幕、拖拽交互和视频引导任务。
    - 监督信号正从昂贵人工标注转向可验证任务合成、未标注截图的弱监督和大规模自动标注数据。
    - 当前代理仍低于人类水平或缺乏鲁棒性，尤其在观察控制、拖拽定位和子目标完成方面。
    - 报告的性能提升需要与骨干模型、框架、技能库、harness和任务先验等贡献隔离。
    分歧:
    - 评测焦点覆盖桌面任务成功、动态观察效率、单步定位不确定性、拖拽交互和视频引导任务。
    - 改进策略不同：在线RL或弱监督训练、冻结模型下优化执行harness，或改进关键帧提取。
    - 监督信号不同：可验证任务奖励、弱上下文定位或后验不确定性分数。
    - 指标侧重不同：Pass@1或成功率、细粒度子目标分数、成本-准确性和排名或共形覆盖。
    - 任务范围不同：多步代理轨迹与单步可执行定位，静态桌面与动态变化界面。
    开放问题:
    - 骨干模型、执行harness、框架、技能库、任务合成、frontier sampling或输入表示中，哪个组件驱动了收益？
    - 报告方法能否泛化到OSWorld、ScienceBoard、macOS、短视频平台、拖拽任务和WindowsAgentArena之外？
    - 能否通过训练、输入表示或harness变化修复动态界面中的观察控制失败？
    - 不确定性排名和共形点击区域在不同模型家族、接口和分布偏移下的鲁棒性如何？
    - 在代码、数据集、指标、基线或局限性信息缺失或证据较弱时，方法的可复现性如何？
