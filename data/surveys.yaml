  literature_review:
    line_of_work_matrix:
    - line: Task and interaction abstraction for GUI agent evaluation
      what_it_solves: Formalizes real desktop, dynamic short-video, drag-based, and
        GUI+CLI tasks to expose action coverage and fine-grained completion.
      what_remains_open: Each abstraction is platform- or action-specific; cross-platform,
        cross-action, and multi-step trajectory validity is not established in the
        packet.
    - line: Evidence-driven adaptation around frozen agents
      what_it_solves: Uses screenshots, repeated runs, skill artifacts, and harness
        edits to improve frozen GUI models without retraining.
      what_remains_open: Transfer is tested only on selected benchmarks; visible evidence
        lacks explicit limitation and failure-mode coverage for broader deployment.
    - line: Scalable training and verifiable data synthesis for GUI control
      what_it_solves: Generates verifiable RL tasks or uses unannotated screenshots
        and curriculum/reinforcement learning to reduce annotation cost and improve
        performance.
      what_remains_open: Evidence concentrates on OSWorld and ScienceBoard; sample-efficiency
        tradeoffs and generalization beyond these suites remain open.
    - line: Reliability and uncertainty quantification for GUI grounding
      what_it_solves: Benchmarks post-hoc uncertainty methods and conformal click
        regions to assess calibrated confidence in single-step grounding.
      what_remains_open: Multi-step agent trajectory uncertainty is not covered; cross-model
        and cross-interface ranking transfer degrades without re-evaluation.
    - line: Multimodal skill and knowledge representation
      what_it_solves: Retains visual figures in hierarchical skill artifacts to improve
        UI element identification and workflow verification.
      what_remains_open: Evaluation is limited to a single CLI setup and two benchmarks;
        maintenance, cross-app generalization, and failure modes are unverified in
        the visible evidence.
    consensus:
    - GUI agent evaluation is shifting from coarse end-to-end success to fine-grained,
      verifiable, or cost-aware scoring.
    - Frozen backbones can be improved by changing external artifacts, skills, or
      harnesses rather than retraining the model itself.
    - Dynamic and real-world interfaces reveal observation-control and grounding failures
      that static click-focused settings miss.
    - Many gains are demonstrated on benchmark-specific suites, so cross-benchmark
      or cross-platform generalization remains a verification gap.
    disagreements:
    - 'Representation of improvement: visual multimodal skill files vs text-only skill
      or harness code vs model-internal visual grounding learned from unannotated
      screenshots.'
    - 'Supervision signal: deterministic rule-based scoring, verifiable synthesized
      RL rewards, weak supervision from unannotated screenshots, or human baseline
      comparison.'
    - 'Evaluation target: task success or score vs cost-accuracy and information efficiency
      vs uncertainty calibration and conformal coverage.'
    - 'Interaction mode: click-only focus vs drag-based actions vs combined GUI+CLI
      execution vs living or dynamic screen observation control.'
    - 'Deployment setting: macOS desktop, short-video browser environments, or benchmark-specific
      sandboxes; this affects which failures are visible.'
    open_questions:
