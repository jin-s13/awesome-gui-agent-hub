      尚未覆盖: 缺少交互形式理论，跨应用与跨界面泛化仍未解决。
    - 路线: 多模态技能与知识复用
      解决的问题: 为每个应用组织带视觉图形的过程性知识，按需检索以改善UI元素识别与工作流状态验证。
      尚未覆盖: 仅在少数基准上验证，未见未知应用的规模化、新鲜度与安全边界评估。
    - 路线: 自改进与数据高效学习
