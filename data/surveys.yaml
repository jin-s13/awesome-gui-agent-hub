  literature_review:
    line_of_work_matrix:
    - line: Benchmarking and evaluation frameworks
      what_it_solves: Provides systematic testbeds and metrics for GUI agent capabilities,
        including task success, fine-grained sub-goal scoring, and post-hoc uncertainty
        quantification.
      what_remains_open: Cross-benchmark comparability remains weak; uncertainty calibration
        degrades under distribution shift, and benchmarks do not yet capture multi-step
        safety-critical deployment scenarios.
    - line: Skill and knowledge organization
      what_it_solves: Improves agent accuracy and efficiency by structuring reusable
        knowledge as multimodal skill libraries or proactive context management policies.
      what_remains_open: Automatic skill construction and update across applications
        is unverified; generalization to unseen tasks and very long horizons remains
        untested.
    - line: Training and data efficiency
      what_it_solves: Reduces reliance on expensive human annotations through weakly
        supervised visual grounding, online RL with verifiable task synthesis, and
        frontier sampling.
      what_remains_open: Online exploration in real environments is unsafe; synthetic
        task coverage may miss real-world edge cases, and the scaling behavior of
        these methods is not formalized.
    - line: Interaction formalization
      what_it_solves: Defines and models non-standard interaction types such as dynamic
        living-screen content and drag-based manipulations, exposing agent limitations
        in observation control and continuous input.
      what_remains_open: Formal assumptions are not validated against empirical model
        behavior; a unified abstraction for diverse interaction modalities is missing.
    consensus:
    - Vision-language models serve as the backbone for current GUI agents, and their
      grounding capability is the primary bottleneck.
    - Evaluation must go beyond end-to-end success rate to include fine-grained, sub-goal,
      or cost-accuracy metrics that reveal nuanced failure modes.
    - Agents still lack robust observation control, often performing too many or too
      few UI inspections compared to humans.
    disagreements:
    - 'Supervision strategy: some works rely on massive unannotated screenshots and
      weak supervision, while others use online RL with verifiable rewards or pure
      supervised fine-tuning on curated trajectories.'
    - 'Interaction scope: benchmarks and methods focus on different primitives—click-based,
      drag-based, or dynamic video interfaces—with no consensus on whether a single
      agent should handle all.'
    - 'Knowledge representation: one line encodes multimodal skill artifacts with
      visual figures, another uses structured context fields with explicit management
      actions, and a third relies on implicit model memory.'
    open_questions:
    - How can we design evaluation protocols that transfer reliably across model families
      and interface types without requiring expensive re-ranking?
    - What formal guarantees can be provided for agent safety when uncertainty quantification
      degrades under distribution shift?
    - Can proactive context management and observation control be unified into a single
      decision-theoretic framework for long-horizon tasks?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准测试与评测框架
      解决的问题: 为GUI代理能力提供系统性的测试平台和指标，包括任务成功率、细粒度子目标评分和事后不确定性量化。
      尚未覆盖: 跨基准可比性仍弱；分布偏移下不确定性校准下降，且基准尚未捕获多步安全关键部署场景。
    - 路线: 技能与知识组织
      解决的问题: 通过将可重用知识构建为多模态技能库或主动上下文管理策略，提高代理的准确性和效率。
      尚未覆盖: 跨应用的自动技能构建与更新未经验证；对未见任务和极长时域的泛化未测试。
    - 路线: 训练与数据效率
      解决的问题: 通过弱监督视觉定位、可验证任务合成的在线RL以及前沿采样，减少对昂贵人工标注的依赖。
      尚未覆盖: 真实环境中的在线探索不安全；合成任务覆盖可能遗漏真实世界的边界情况，且这些方法的缩放行为未被形式化。
    - 路线: 交互形式化
      解决的问题: 定义和建模非标准交互类型，如动态生活屏幕内容和拖拽操作，揭示代理在观察控制和连续输入方面的局限。
      尚未覆盖: 形式假设未经验证与实际模型行为一致；缺少多样交互模态的统一抽象。
    共识:
    - 视觉语言模型是当前GUI代理的骨干，其定位能力是主要瓶颈。
    - 评测必须超越端到端成功率，包含细粒度、子目标或成本-准确性指标，以揭示细微的失败模式。
    - 代理仍缺乏稳健的观察控制，与人类相比，往往执行过多或过少的UI检查。
    分歧:
    - 监督策略：有的工作依赖海量未标注截图和弱监督，有的使用带可验证奖励的在线RL，还有的采用在精选轨迹上的纯监督微调。
    - 交互范围：基准和方法关注不同的原语——基于点击、基于拖拽或动态视频界面——对于单一代理是否应处理所有尚无共识。
    - 知识表示：一条路线将多模态技能工件与视觉图形一起编码，另一条使用结构化上下文字段和显式管理动作，第三条则依赖隐式模型记忆。
