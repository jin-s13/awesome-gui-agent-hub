  - 主流方向：证据集中在GUI智能体的方法/基准构建，包括定位、任务合成、harness/上下文优化与可靠性/安全评测；未见明确的综述协议证据。
  - 研究共性：多数工作通过改变监督信号、执行上下文或评测约束来提升视觉语言智能体，并在OSWorld、ScreenSpot、MobileWorld、ScienceBoard或自定义套件上报告成功率/排名稳定性。
