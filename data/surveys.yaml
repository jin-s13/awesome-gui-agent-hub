    - 路线: 视频引导与动态界面交互
      解决的问题: 通过从视频中提取关键帧或设计动态屏幕环境基准，使智能体能在内容随时间演化的界面上操作。
      尚未覆盖: 观察控制与时序推理的整合，以及动态场景中观察不足/过度失败的解决。
    共识:
    - 所有工作均假设智能体具备视觉基础能力（截图、视频），并依赖大型多模态模型。
    - 任务成功率是主要指标，但存在变体（Pass@1、细粒度检查点得分、成本-准确性）。
    - 基准测试表明，即使强模型也在多步任务、观察控制和罕见交互类型上存在困难。
    分歧:
    - 研究的交互模态不同：仅点击/轻触、拖拽、视频引导、CLI+GUI。
