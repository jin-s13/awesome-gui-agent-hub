    - 'Deployment surface differs: mobile GUIs, desktop computer-use, web agent fraud
      detection, and video-guided interactive tasks each impose different action spaces
      and evaluation protocols.'
    - 'Supervision signal differs: verifiable outcomes, dense environment annotations,
      repeated-run execution evidence, or benchmark labels for fraud judgment.'
    - 'Evaluation scope differs: single-step grounding is the focus in some work,
      while others target long-horizon trajectories, transfer to unseen benchmarks,
      or safety-oriented detection.'
    - 'Model-access assumptions differ: open-weight VLM agents expose internal states
