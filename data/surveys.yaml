  literature_review:
    line_of_work_matrix:
    - line: Task and interaction abstraction benchmarks
      what_it_solves: 'Formalizes executable GUI tasks and scoring beyond clicks:
        multi-app macOS tasks, dynamic short-video interfaces, and drag-based interactions.'
      what_remains_open: Coverage is platform- or interaction-specific; dynamic-interface
        agents still lack observation control, and drag findings need downstream computer-use
        validation.
    - line: Skill and harness reliability improvement
      what_it_solves: Improves frozen model performance by external multimodal skill
        retrieval or evidence-driven execution-harness edits, avoiding backbone retraining.
      what_remains_open: Published evidence is concentrated on OSWorld-Verified, CUA-World,
        and OSExpert-Eval; transfer and failure boundaries for new apps or frameworks
        remain partially demonstrated.
    - line: Verifiable and weakly supervised scaling
      what_it_solves: Reduces annotation burden and creates verifiable reward tasks
        for online RL, yielding strong open-source results on OSWorld and ScienceBoard.
      what_remains_open: Limitations are not stated in the provided evidence; task
        quality, contamination, and generalization beyond the reported benchmarks
        need independent validation.
    - line: Uncertainty quantification and safety framing
      what_it_solves: Benchmarks post-hoc uncertainty quantification for GUI grounding
        and introduces conformal click regions to translate uncertainty estimates
        into spatial safety.
      what_remains_open: Evidence is restricted to single-step grounding; ranking
        transfer across model classes is weak, and training-based or hybrid UQ methods
        are not covered.
    consensus:
    - GUI agents are evaluated primarily through executable, grounded tasks with rule-based
      or programmatic success signals.
    - Fine-grained scoring reveals capability differences that aggregate pass rates
      hide, especially sub-goal completion and cost-accuracy.
    - External scaffolds—skill libraries, harness edits, or verifiable task synthesis—can
      improve frozen or open agents without changing backbone weights.
    - Current agents still lack robust control over observation and interaction beyond
      narrow click or single-step settings.
    disagreements:
    - 'Improvement locus differs: external skill or harness scaffolding versus model
      training via RL or weak supervision.'
    - 'Supervision source differs: unannotated screenshots with weak supervision versus
      verifiable docker interactions and synthetic RL tasks.'
    - 'Evaluation target differs: dynamic observation efficiency, drag interaction
      coverage, uncertainty calibration, or multi-app GUI+CLI completion.'
    - 'Reliability framing differs: post-hoc uncertainty or conformal safety versus
      evidence-driven harness repair.'
    open_questions:
    - Can observations in dynamic interfaces be formalized and certified so agents
      avoid over- or under-observation?
    - Do uncertainty-ranking transfers remain weak beyond single-step grounding and
      closed-source models, and what recalibration is needed?
    - Are gains from synthesized tasks and weak supervision robust to task leakage,
      dataset quality, and new application contexts?
    - How do multimodal skill artifacts and harness edits transfer when applications
      or execution environments change?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 任务与交互抽象基准
      解决的问题: 形式化可执行的GUI任务与评分，超越点击：多应用macOS任务、动态短视频界面和拖拽交互。
      尚未覆盖: 覆盖范围具有平台或交互特异性；动态界面代理仍缺乏观察控制，拖拽发现需要下游计算机使用验证。
    - 路线: 技能与执行框架可靠性改进
      解决的问题: 通过外部多模态技能检索或证据驱动的执行harness编辑提升冻结模型性能，避免骨干网络再训练。
      尚未覆盖: 已发表证据集中在OSWorld-Verified、CUA-World和OSExpert-Eval；新应用或框架的迁移与失败边界仍只部分展示。
    - 路线: 可验证与弱监督规模化
      解决的问题: 减少标注负担并创建可验证奖励任务用于在线RL，在OSWorld和ScienceBoard上取得强开源结果。
      尚未覆盖: 提供证据中未陈述局限性；任务质量、污染及在报告基准之外的泛化需独立验证。
    - 路线: 不确定性量化与安全框架
      解决的问题: 为GUI定位基准化后验UQ，并引入共形点击区域，将不确定性估计转化为空间安全。
      尚未覆盖: 证据限于单步定位；跨模型类别的排名迁移较弱，未覆盖基于训练或混合UQ方法。
    共识:
    - GUI代理主要通过可执行、有依据的任务和规则化或程序化成功信号进行评估。
    - 细粒度评分揭示聚合通过率隐藏的能力差异，尤其是子目标完成和成本-准确性。
    - 外部脚手架——技能库、harness编辑或可验证任务合成——可以在不改变骨干权重的情况下改进冻结或开源代理。
    - 当前代理在窄点击或单步设置之外仍缺乏对观察和交互的稳健控制。
    分歧:
    - 改进落点不同：外部技能或执行框架脚手架 vs 通过RL或弱监督进行模型训练。
    - 监督来源不同：未标注截图弱监督 vs 可验证docker交互和合成RL任务。
    - 评测目标不同：动态观察效率、拖拽交互覆盖、不确定性校准或多应用GUI+CLI完成。
    - 可靠性表述不同：后验不确定性或共形安全 vs 证据驱动harness修复。
    开放问题:
