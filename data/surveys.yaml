  related_work_outline:
  - 'Mainstream direction: Building large-scale, realistic-environment benchmarks
    for GUI agents with fine-grained diagnostics, focusing on multi-application, multimodal
    interaction, and dynamic content scenarios.'
  - 'Shared research pattern: Benchmarks go beyond aggregate success rates by introducing
    step-level, efficiency, and calibration metrics that reveal model weaknesses in
    observation control, interaction grounding, and uncertainty estimation.'
  - 'Key differences: Interaction modalities evaluated (click, drag, GUI+CLI, video-watching),
    environment fidelity (real desktop OS vs. browser-based simulators), and the target
    diagnostic dimension (observation control, drag grounding, uncertainty quantification,
    keyframe extraction).'
  - 'Trend evolution: Moving from static, single-modal benchmarks toward dynamic,
    multimodal, and diagnostically granular benchmarks; recent work integrates task
    synthesis and online RL evaluation, shifting from static test sets to extensible
    evaluation frameworks.'
  - 'Open questions: How to unify evaluation across diverse interaction types and
    platforms; whether fine-grained proxy metrics align with human user satisfaction;
    and the ecological validity of synthetic tasks for real-world deployment.'
  related_work_outline_zh:
  - 主流方向：构建大规模、真实环境下的GUI代理基准，强调细粒度诊断，覆盖多应用、多模态交互和动态内容场景。
  - 研究共性：基准设计超越单一的总体成功率，引入步骤级、信息效率和校准等指标，揭示模型在观察控制、交互定位和不确定性估计等方面的不足。
  - 关键差异：评估的交互模态（点击、拖拽、GUI+CLI、视频观察）、环境保真度（真实桌面操作系统 vs 浏览器模拟器）以及诊断目标维度（观察控制、拖拽定位、不确定性量化、关键帧提取）。
  - 趋势演进：从静态、单模态基准向动态、多模态、诊断粒度更细的基准演进；近期工作开始整合任务合成与在线强化学习评估，从固定测试集转向可扩展的评估框架。
  - 开放问题：如何统一跨交互类型和平台的评估；细粒度代理指标是否与人类用户满意度对齐；合成任务对真实部署的生态效度如何。
  literature_review:
    line_of_work_matrix:
    - line: Realistic desktop OS benchmarks
      what_it_solves: Evaluating GUI agents on genuine multi-application, GUI+CLI
        workflows with fine-grained step-level and capability-annotated scoring.
      what_remains_open: Generalization across operating systems and the inclusion
        of long-horizon task efficiency metrics.
    - line: Dynamic interface benchmarks
      what_it_solves: Assessing agent observation control and information efficiency
        on content-changing interfaces where frames change between actions.
      what_remains_open: Coverage beyond short-video platforms to other dynamic UI
        types, and the assumption that screen recordings fully capture necessary state.
    - line: Video-guided GUI task benchmarks
      what_it_solves: Bridging video understanding and multi-step GUI actions by evaluating
        keyframe extraction methods that improve task-relevant scene selection.
      what_remains_open: Applicability to long-form video and complex instructional
        contexts beyond the tested datasets.
    - line: Uncertainty quantification benchmarks
      what_it_solves: Comparing post-hoc UQ methods for GUI grounding to determine
        which families provide stable confidence estimates across models and datasets.
      what_remains_open: Transferability of UQ rankings to multi-step agent trajectories
        and closed-source models, and robustness under distribution shift.
    - line: Interaction-modality-specific benchmarks
      what_it_solves: Filling the gap in evaluating drag-based interactions such as
        text highlighting, resizing, and slider manipulation that are absent from
        click-centric benchmarks.
      what_remains_open: Extension to other under-represented modalities like gesture,
        scroll, and multi-touch; the impact of fine-tuning on downstream real-world
        tasks.
    - line: Synthetic task generation for online RL evaluation
      what_it_solves: Producing large-scale verifiable tasks to enable online RL training
        and evaluation, alleviating the scarcity of static benchmark tasks.
      what_remains_open: Alignment between the distribution of synthetic tasks and
        real user intent, and cross-benchmark stability of the resulting performance
        gains.
    consensus:
    - Fine-grained diagnostics beyond pass/fail accuracy are necessary; step-level
      completion, information cost, and uncertainty calibration are adopted as key
      dimensions.
    - Current multimodal agents exhibit systematic weaknesses in observation control,
      interaction grounding, and confidence estimation, which are masked by aggregate
      success rates.
    - Realistic environments (real OS, browser-based dynamic platforms) are preferred
      over simplified simulators to improve ecological validity.
    - Combining multiple interaction modalities (GUI, CLI, drag, video) within a single
      benchmark is a growing trend.
    disagreements:
    - 'Evaluation targets differ: some benchmarks focus on task completion accuracy,
      while others prioritize information efficiency, uncertainty calibration, or
      observation control.'
    - 'Interaction modalities are split: drag-based, video-guided, and GUI+CLI benchmarks
      each address distinct subsets of user actions, with no unified coverage.'
    - Environmental fidelity varies from real macOS desktops to browser-based short-video
      simulators, leading to different generalization assumptions.
    - 'Training integration diverges: some works treat benchmarks purely as static
      test sets, whereas others use them as reward signals for online RL with task
      synthesis.'
    open_questions:
    - How can benchmarks be unified to cover click, drag, video observation, and CLI
      interactions without becoming intractable?
    - Do the proposed fine-grained metrics (step-level, cost-accuracy, UQ calibration)
      correlate with real user satisfaction and task completion quality?
    - Can synthetic task generation produce evaluation sets that match the diversity
      and difficulty of genuine user workflows, and how should this alignment be measured?
    - How do uncertainty quantification rankings transfer across unseen model families
      and multi-step trajectories, and what recalibration is needed?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 真实桌面操作系统基准
      解决的问题: 在真实多应用、GUI+CLI工作流上评估代理，提供细粒度的步骤级和能力注释评分。
      尚未覆盖: 跨操作系统泛化，以及长时间任务效率指标的纳入。
    - 路线: 动态界面基准
      解决的问题: 评估代理在动作间画面变化的动态界面上的观察控制能力和信息效率。
      尚未覆盖: 超越短视频平台覆盖其他动态UI类型，以及屏幕录制能否完全捕获必要状态的假设。
    - 路线: 视频引导的GUI任务基准
      解决的问题: 通过评估关键帧提取方法，桥接视频理解和多步GUI操作，提升任务相关场景选择。
      尚未覆盖: 对长视频和超出测试数据集的复杂指令情境的适用性。
    - 路线: 不确定性量化基准
      解决的问题: 比较GUI接地的后验UQ方法，确定哪些方法族在不同模型和数据集上提供稳定的置信度估计。
      尚未覆盖: UQ排名向多步代理轨迹和闭源模型的可迁移性，以及分布偏移下的鲁棒性。
    - 路线: 交互模态专项基准
      解决的问题: 填补以点击为中心的基准所缺失的拖拽交互（如文本高亮、调整大小、滑块操作）评估空白。
      尚未覆盖: 扩展到其他未充分代表的模态（如手势、滚动、多点触控）；微调对下游真实任务的影响。
    - 路线: 面向在线RL的合成任务生成
      解决的问题: 生成大规模可验证任务以支持在线强化学习训练和评估，缓解静态基准任务稀缺问题。
      尚未覆盖: 合成任务分布与真实用户意图的对齐，以及由此产生的性能提升在跨基准上的稳定性。
    共识:
    - 超越通过/失败准确率的细粒度诊断是必要的；步骤完成度、信息成本和不确定性校准被采纳为关键维度。
    - 当前多模态代理在观察控制、交互定位和置信度估计方面存在系统性缺陷，这些缺陷被总体成功率所掩盖。
    - 为提高生态效度，倾向于使用真实环境（真实操作系统、基于浏览器的动态平台）而非简化的模拟器。
    - 在单个基准中组合多种交互模态（GUI、CLI、拖拽、视频）是日益增长的趋势。
    分歧:
    - 评估目标不同：部分基准关注任务完成准确率，而其他基准则优先考虑信息效率、不确定性校准或观察控制。
    - 交互模态被分割：基于拖拽、视频引导和GUI+CLI的基准各自处理不同的用户操作子集，缺乏统一覆盖。
    - 环境保真度从真实macOS桌面到基于浏览器的短视频模拟器各异，导致不同的泛化假设。
    - 训练集成方式分歧：部分工作将基准纯粹视为静态测试集，而其他工作则将其用作在线强化学习与任务合成的奖励信号。
    开放问题:
    - 如何构建统一基准以覆盖点击、拖拽、视频观察和CLI交互，同时避免变得过于复杂？
    - 所提出的细粒度指标（步骤级、成本-准确性、UQ校准）是否与真实用户满意度和任务完成质量相关？
    - 合成任务生成能否产生与真实用户工作流多样性和难度相匹配的评估集，以及如何衡量这种对齐？
    - 不确定性量化排名如何在未见过的模型族和多步轨迹间迁移，以及需要何种重新校准？
