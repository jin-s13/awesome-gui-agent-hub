  related_work_outline:
  - 'Mainstream direction: GUI agent research is converging on task-specific benchmarks,
    weakly supervised or verifiable training signals, and fine-grained evaluation
    for action grounding across desktop, mobile, dynamic-video, and drag-based interfaces.'
  - 'Shared research pattern: Works construct a task suite or training pool, evaluate
    or train vision-language agents, and then analyze success beyond end-to-end Pass@1
    using sub-goal, cost-accuracy, action correctness, or uncertainty signals.'
  - 'Key differences: Papers differ by input dynamics, action space, supervision signal,
    evaluation target, and deployment setting; static screenshot grounding, video-guided
    keyframes, drag interactions, mixed GUI/CLI, and long-horizon mobile workflows
    are treated as separate problems.'
  - 'Trend evolution: The 2026 evidence shows the current frontier moving from static
    click grounding toward dynamic observation control, verifiable online RL, weak
    supervision, long-horizon context management, and uncertainty calibration; the
    year span is narrow, so this trend is within the current frontier.'
  - 'Open questions: It remains unclear how much gain comes from frameworks or skill
    libraries, whether observation-control and uncertainty findings transfer across
    interfaces, and how training or context methods generalize beyond their reported
    task families.'
  related_work_outline_zh:
  - 主流方向：GUI 智能体研究正围绕任务基准、弱监督或可验证训练信号以及细粒度评估展开，覆盖桌面、移动端、动态视频和拖拽交互中的动作定位。
  - 研究共性：工作通常构建任务集或训练池，评估或训练视觉语言智能体，并在端到端 Pass@1 之外用子目标、成本-准确性、动作正确性或不确定性信号分析差异。
  - 关键差异：输入动态性、动作空间、监督信号、评估目标和部署环境不同；静态截图定位、视频关键帧引导、拖拽交互、混合 GUI/CLI 以及长时域移动工作流被分别处理。
  - 趋势演进：2026 年证据表明当前前沿正从静态点击定位转向动态观察控制、可验证在线 RL、弱监督、长时域上下文管理和不确定性校准；年份跨度窄，趋势属于当前前沿。
  - 开放问题：收益有多少来自框架或技能库，观察控制与不确定性结论能否跨接口迁移，训练或上下文方法能否泛化到报告任务族之外，仍未明确。
  literature_review:
    line_of_work_matrix:
    - line: Task synthesis and weak supervision for training computer-use agents
      what_it_solves: Reducing dependence on costly human annotations by using unannotated
        screenshots for visual grounding or verifiable synthetic tasks for online
        RL, as in GUICrafter and SCALECUA.
      what_remains_open: Whether learned policies transfer beyond the training task
        families, and how much improvement comes from reward design, sampling efficiency,
        or the base model rather than the proposed objective.
    - line: Long-horizon context and action-interface management
      what_it_solves: Making extended GUI trajectories tractable by managing folded
        action history, UI state, and recent step records so the policy can preserve
        critical facts without context overload, as in MemGUI-Agent.
      what_remains_open: Generalization to other interfaces and longer horizons, and
        whether context-as-action remains useful without curated trajectory annotations
        or beyond mobile settings.
    - line: Dynamic, video, and drag-based grounding benchmarks
      what_it_solves: Evaluating GUI agents on living screens, video-guided tasks,
        and drag interactions that click-only benchmarks miss; keyframe extraction
        is used to select task-relevant frames from dynamic video observations.
      what_remains_open: Coverage beyond short-video or drag-specific tasks, whether
        keyframe extraction improves GUI action prediction and not only VideoQA, and
        how observation-control behavior performs across other dynamic interfaces.
    - line: Fine-grained evaluation and uncertainty quantification protocols
      what_it_solves: Separating surface success from sub-goal completion, cost-accuracy,
        action correctness, and calibrated uncertainty; measuring selective transfer
        of uncertainty ranking and conformal click regions.
      what_remains_open: Most evidence remains single-step or benchmark-bound; multi-step
        trajectories, cross-model uncertainty transfer, and distribution-shift robustness
        are not yet established.
    consensus:
    - Evaluation is moving beyond end-to-end task success toward finer signals such
      as sub-goal completion, cost-accuracy, action correctness, and uncertainty calibration.
    - Reliable GUI agents require explicit observation and context management when
      screens change dynamically or histories grow long.
    - Synthetic, weakly supervised, and verifiable training signals can reduce annotation
      cost, but transfer beyond the training distribution is not yet demonstrated.
    - 'Interaction coverage matters: click-only benchmarks miss drag, mixed GUI/CLI,
      video-guided, and dynamic-content workflows.'
    - Reproducibility and evaluation artifacts remain uneven; some works provide datasets
      or code while others report only aggregate results or leave limitations unspecified.
    disagreements:
    - 'Supervision signal: weak visual grounding from unannotated screenshots differs
      from verifiable RL rollouts, curated supervised fine-tuning, or benchmark-only
      probing.'
    - 'Evaluation target: Pass@1 and sub-goal scoring differ from cost-accuracy, uncertainty
      ranking, conformal coverage, and drag-action correctness.'
    - 'Representation: static screenshot grounding differs from task-driven keyframe
      extraction and structured folded context fields.'
    - 'Interaction mode: click/type, drag-based manipulation, mixed GUI and CLI, short-video
      dynamic content, and long-horizon mobile workflows are not covered uniformly.'
    - 'Deployment setting: macOS desktop, browser-based short-video platforms, and
      mobile devices impose different environment assumptions.'
    - 'Contribution attribution: reported gains may be confounded by skill libraries,
      base models, frameworks, or training data, and evidence designs differ in whether
      they isolate the proposed method.'
    open_questions:
    - How much of the best-configuration gain in MacAgentBench comes from the skill
      library rather than the base model or framework design?
    - Can the over- and under-observation failures identified in LivingScreen be corrected,
      and do they transfer beyond short-video platforms?
    - Does TASKER keyframe extraction improve GUI action prediction as much as it
      improves VideoQA, and does it help static or non-video GUI tasks?
    - How far do GUICrafter and SCALECUA transfer outside the task families and benchmark
      suites used for training?
    - Can uncertainty ranking and conformal click regions from Argus generalize to
      multi-step GUI trajectories and closed-model interfaces?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 面向计算机使用智能体的任务合成与弱监督训练
      解决的问题: 减少对昂贵人工标注的依赖，通过未标注截图进行视觉定位，或通过可验证合成任务进行在线 RL，如 GUICrafter 和 SCALECUA。
      尚未覆盖: 所学策略能否迁移到训练任务族之外，以及改进有多少来自奖励设计、采样效率或基础模型，而不是所提出的目标。
    - 路线: 长时域上下文与动作接口管理
      解决的问题: 通过折叠动作历史、UI 状态和最近步骤记录，在不过载上下文的情况下保留关键事实，使长 GUI 轨迹可处理，如 MemGUI-Agent。
      尚未覆盖: 能否泛化到其他接口和更长时间范围，以及在缺少精心标注轨迹或移动端之外，上下文即动作是否仍然有效。
    - 路线: 动态、视频和拖拽式定位基准
      解决的问题: 在动态屏幕、视频引导任务和拖拽交互上评估 GUI 智能体，补足点击式基准缺失的覆盖；关键帧提取用于从动态视频观测中选择任务相关帧。
      尚未覆盖: 对短视频或拖拽任务之外的覆盖不足，关键帧提取是否提升 GUI 动作预测而不只是 VideoQA，以及其他动态界面上的观察控制表现仍不清楚。
    - 路线: 细粒度评估与不确定性量化协议
      解决的问题: 用子目标完成、成本-准确性、动作正确性和校准不确定性替代纯成功率，并测量不确定性排名的选择性迁移和共形点击区域。
      尚未覆盖: 多数证据仍停留在单步或基准范围内；多步轨迹、跨模型不确定性迁移和分布偏移鲁棒性尚未建立。
    共识:
    - 评估正从端到端任务成功转向更细粒度信号，如子目标完成、成本-准确性、动作正确性和不确定性校准。
    - 可靠的 GUI 智能体需要显式的观察和上下文管理，尤其在屏幕动态变化或历史较长时。
    - 合成、弱监督和可验证训练信号能降低标注成本，但尚未证明能迁移到训练分布之外。
    - 交互覆盖很重要：仅点击式基准会遗漏拖拽、混合 GUI/CLI、视频引导和动态内容工作流。
    - 可复现性和评估工件仍不均衡；部分工作提供数据或代码，部分仅报告聚合结果或未说明局限性。
    分歧:
    - 监督信号不同：未标注截图的弱视觉定位，区别于可验证 RL 轨迹、人工监督微调或仅基准探测。
    - 评估目标不同：Pass@1 和子目标评分，区别于成本-准确性、不确定性排名、共形覆盖和拖拽动作正确性。
    - 表示方式不同：静态截图定位，区别于任务驱动关键帧提取和结构化折叠上下文字段。
    - 交互模式不同：点击/键入、拖拽操作、混合 GUI/CLI、短视频动态内容和长时域移动工作流未统一覆盖。
    - 部署场景不同：macOS 桌面、基于浏览器的短视频平台和移动设备具有不同环境假设。
    - 贡献归因不同：报告收益可能受技能库、基础模型、框架或训练数据混淆，证据设计在隔离方法贡献方面不一致。
    开放问题:
    - MacAgentBench 最佳配置的收益有多少来自技能库，而不是基础模型或框架设计？
    - LivingScreen 观察过度和观察不足问题能否被纠正，并且是否迁移到短视频平台之外？
    - TASKER 关键帧提取是否能像提升 VideoQA 那样提升 GUI 动作预测，并且能否帮助静态或非视频 GUI 任务？
    - GUICrafter 和 SCALECUA 在训练任务族和基准之外能迁移多远？
    - Argus 的不确定性排名和共形点击区域能否泛化到多步 GUI 轨迹和闭源模型接口？
