  literature_review:
    line_of_work_matrix:
    - line: Runnable training and orchestration frameworks for computer-use agents
      what_it_solves: Enables end-to-end RL training of agents that use complex inference
        harnesses in live or diverse environments without modifying the harness, by
        intercepting model calls and isolating rollouts in containers.
      what_remains_open: Error recovery remains weak after RL, harness design heavily
        influences trainability, and independent reuse across infrastructure environments
        is not yet evidenced.
    - line: Weakly-supervised and online RL data pipelines for GUI and web agents
      what_it_solves: Reduces dependence on expensive annotations by learning visual
        grounding from large unannotated screenshots or by using live website interaction
        and trajectory-level success signals.
      what_remains_open: Cross-platform generalization, the minimal supervision needed,
        and reproducibility of live training gains outside the original infrastructure
        remain open.
    - line: Reusable multimodal skills and execution-level memory
      what_it_solves: Lowers token cost and execution time by converting validated
        trajectories or authored documentation into retrievable or replayable artifacts
        that guide future runs.
      what_remains_open: Deterministic applicability limits deployment to compatible
        runtime states, and transfer to novel applications or changing UI layouts
        is not established.
    - line: Alternative generative architectures for multimodal GUI agents
      what_it_solves: Applies block-wise diffusion to vision-language GUI grounding
        and navigation, aiming to preserve parallel decoding advantages while handling
        visual interface understanding.
      what_remains_open: Evidence covers grounding and navigation benchmarks but leaves
        live interaction, safety, long-horizon error recovery, and deployment robustness
        largely uncovered.
    - line: Diagnostic and safety evaluation for computer-use agents
      what_it_solves: Measures step-level GUI transition reconstruction and domain-conditioned
        prompt-injection risk, isolating abilities such as state verification, source
        tracking, and context-aware control.
      what_remains_open: Offline evaluation does not capture asynchronous live timing;
        safety audits have not reproduced RL-optimized attack strings or broad non-browser
        surfaces.
    consensus:
    - Computer-use agents are treated as closed-loop systems that need to read visual
      interface state, act, and verify outcomes across multiple steps.
    - 'Visual grounding is a recurring prerequisite: retaining visual UI evidence
      improves interface element identification and workflow state verification.'
    - Training and evaluation increasingly use live or harness-based environments
      and trajectory-level outcomes instead of only static supervised examples.
    - Reusable skills or memories can reduce repeated reasoning cost and execution
      time when their applicability can be checked.
    - Aggregate task success is insufficient; finer diagnostics for GUI transitions,
      state verification, and safety reveal remaining gaps.
    disagreements:
    - Supervision signal differs among large-scale unannotated screenshot pre-training,
      online multi-turn RL with trajectory-level success, and curated or validated
      demonstration pipelines.
    - 'Generation representation differs: one route uses block-wise diffusion for
      multimodal GUI output, while others rely on standard VLM generation inside a
      harness.'
    - 'Evaluation target differs: end-task success benchmarks, step-level GUI transition
      diagnostics, and adversarial safety audits measure different failure modes.'
    - 'Artifact granularity differs: hierarchical multimodal skill libraries store
      retrievable topic-level guidance, whereas execution-level memory stores parameter-controlled
      callable trajectories.'
    - Deployment setting differs across live browser/desktop interaction, offline
      Linux desktop snapshots, and coding-domain cross-reference, implying different
      interaction and timing assumptions.
    open_questions:
    - Can subsequent training or memory mechanisms improve error recovery, which current
      RL evidence shows remains weak?
    - How does safety hardening transfer beyond browser surfaces when RL-optimized
      attack strings and additional application domains are included?
    - Do offline GUI transition diagnostics predict performance in asynchronous, delay-sensitive
      live interactions?
    - What artifact and infrastructure release levels are needed to independently
      reproduce agent training and evaluation across teams and deployment stacks?
    - How can replayable memory or skills adapt when deterministic applicability checks
      fail under novel applications or changed UI states?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 面向计算机使用代理的可运行训练与编排框架
      解决的问题: 在不修改复杂推理harness的前提下，通过拦截模型调用并在隔离容器中运行rollout，对使用harness的代理进行端到端RL训练。
      尚未覆盖: RL后错误恢复仍然较弱；harness设计显著影响可训练性；跨基础设施的独立复用尚缺证据。
    - 路线: GUI与网页代理的弱监督及在线RL数据流水线
      解决的问题: 通过大规模未标注截图学习视觉grounding，或通过真实网站交互和轨迹级成功信号，降低对昂贵标注的依赖。
      尚未覆盖: 跨平台泛化、所需最低监督量，以及在线训练增益在原基础设施之外的复现性仍不清楚。
    - 路线: 可复用多模态技能与执行级记忆
      解决的问题: 将经过验证的轨迹或编写文档转化为可检索、可回放的工件，以降低token成本与执行时间。
      尚未覆盖: 确定性适用条件限制部署到兼容的运行时状态；向新应用或变化UI布局的迁移尚未建立。
    - 路线: 面向多模态GUI代理的替代生成架构
      解决的问题: 将块级扩散应用于视觉语言GUI grounding与导航，在理解视觉界面的同时保持并行解码优势。
      尚未覆盖: 证据集中在grounding与导航基准上，实时交互、安全性、长程错误恢复和部署鲁棒性仍缺少覆盖。
    - 路线: 计算机使用代理的诊断与安全评测
      解决的问题: 评测步骤级GUI过渡重构和领域条件提示注入风险，单独考察状态验证、源跟踪与上下文感知控制等能力。
      尚未覆盖: 离线评测无法捕捉异步实时动态；安全审计尚未复现RL优化攻击字符串或覆盖更广的非浏览器场景。
    共识:
    - 计算机使用代理被视作闭环系统，需要读取视觉界面状态、执行动作并在多步中验证结果。
    - 视觉grounding是反复出现的前提：保留视觉UI证据可改善界面元素识别与工作流状态验证。
    - 训练与评测越来越多地使用实时或基于harness的环境及轨迹级结果，而非仅使用静态监督样本。
    - 在可检查适用性时，可复用技能或记忆能降低重复推理成本和执行时间。
    - 仅看聚合任务成功并不足够；针对GUI过渡、状态验证和安全性的细粒度诊断才能揭示剩余差距。
    分歧:
    - 监督信号不同：大规模未标注截图预训练、基于轨迹级成功的在线多轮RL、以及经过整理或验证的演示流水线之间存在差异。
    - 生成表示不同：一条路线使用块级扩散进行多模态GUI输出，而其他路线依赖harness内标准VLM生成。
    - 评测目标不同：端到端任务成功基准、步骤级GUI过渡诊断和对抗性安全审计关注不同的失败模式。
    - 工件粒度不同：分层多模态技能库存储可检索的主题级指导，而执行级记忆存储参数可控的可调用轨迹。
    - 部署设置不同：实时浏览器/桌面交互、离线Linux桌面快照和编码领域交叉参考之间存在不同的交互与时序假设。
    开放问题:
    - 后续训练或记忆机制能否改善当前RL证据中仍然较弱的错误恢复能力？
    - 当纳入RL优化攻击字符串和更多应用领域时，安全加固能否超越浏览器场景泛化？
    - 离线GUI过渡诊断能否预测异步、延迟敏感的实时交互表现？
    - 需要哪些工件与基础设施发布水平，才能在跨团队和部署栈之间独立复现代理训练与评测？
    - 当确定性适用检查在新应用或变化UI状态下失败时，可回放记忆或技能如何自适应？
