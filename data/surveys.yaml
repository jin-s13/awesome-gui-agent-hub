    研究路线矩阵:
    - 路线: 对比评测与受控基准构建
      解决的问题: 建立受控协议，在去除信誉捷径或不可观测内部状态等便利线索后，测试 GUI/计算机使用智能体的基础、不确定性校准、欺诈判断与安全性。
