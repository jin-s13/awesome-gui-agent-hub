  literature_review:
    line_of_work_matrix:
    - line: Taxonomy and roadmap synthesis for GUI agents
      what_it_solves: Maps fragmented agent capabilities, evaluation surfaces, and
        failure modes into research directions and milestones.
      what_remains_open: Whether the synthesis is grounded in systematic evidence
        rather than selective examples; older-year coverage is not visible in the
        packet.
    - line: Comparative evaluation synthesis
      what_it_solves: Clarifies how benchmark, interface, baseline, and metric choices
        shape conclusions about GUI agent performance.
      what_remains_open: Compatibility across OSWorld, ScienceBoard, MobileWorld,
        VG-GUIBench, and single-step versus multi-step settings is not established.
    - line: Open problem and gap mapping
      what_it_solves: Turns broad literature coverage into concrete next questions
        on safety, calibration, memory, fraud detection, and generalization.
      what_remains_open: Which gaps matter most for progress remains unprioritized
        in the available evidence.
    - line: Verifiable task synthesis and online RL for computer-use agents
      what_it_solves: Scales agent training by generating verifiable tasks and reward
        signals with less handcrafted supervision.
      what_remains_open: Reward noise from autonomous evaluators and transfer beyond
        OSWorld/ScienceBoard-style environments remain open.
    - line: Benchmark-driven capability and failure isolation
      what_it_solves: Creates controlled settings to separate video-guided grounding,
        SMS-to-webpage fraud, prompt-injection safety, and uncertainty behavior.
      what_remains_open: Findings often depend on masked shortcuts, narrow domains,
        or single-step interactive surfaces; multi-step trajectory evaluation is limited.
    - line: Context and perception management for long-horizon GUI tasks
      what_it_solves: Improves long-horizon mobile or web behavior through structured
        context memory or task-aware keyframe extraction.
      what_remains_open: Out-of-distribution generalization and combined perception-context
        approaches need further evidence.
    consensus:
    - Frontier work treats GUI and computer-use agents as systems requiring benchmarks
      that isolate specific failure modes rather than single overall scores.
    - Most evidence uses controlled task construction and agent-versus-baseline comparisons,
      with success rate or ranking as the main outcome.
    - Researchers agree that current agents have clear robustness boundaries under
      distribution shift, hidden shortcuts, or long-horizon context.
    disagreements:
    - 'Supervision differs: some work uses supervised fine-tuning with annotated trajectories,
      while others use online RL with verifiable or evaluator-derived reward signals.'
    - 'Evaluation targets differ: capability, prompt-injection safety, uncertainty
      calibration, fraud detection, and video-guided planning are prioritized differently.'
    - 'Interaction granularity and domain differ: single-step executable grounding
      versus multi-step mobile or web trajectories makes results non-interchangeable.'
    - 'Representation choices differ: structured context actions, keyframe extraction,
      and benchmark-only observation each target different failure modes.'
    open_questions:
    - How much reported success-rate gain transfers when the same agent is moved across
      OSWorld, ScienceBoard, MobileWorld, or a browser safety benchmark?
    - Can verifiable task synthesis and autonomous evaluator rewards be reliable enough
      for RL without adding noise that masks true policy improvement?
    - What systematic taxonomy can reconcile single-step grounding evidence with multi-step
      trajectory behavior, and how should surveys weight closed-source evidence with
      hidden internal states?
    - 'Which open gaps matter most: long-horizon memory, uncertainty calibration,
      prompt-injection safety, or benign recall in fraud-like tasks?'
    - How should missing code, dataset, and limitation metadata be treated as reproducibility
      audit gaps rather than evidence about model capability?
