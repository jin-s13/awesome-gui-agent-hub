  related_work_outline_zh:
  - 主流方向：构建端到端训练与部署框架，整合在线强化学习、弱监督学习以及结构化技能/记忆库，以提升GUI智能体在真实任务中的完成度。
  - 研究共性：多模态视觉输入为核心，以模拟或真实交互环境中的任务成功率为评估指标，旨在弥合短期基准与长期、安全关键工作流之间的差距。
  - 关键差异：训练范式分为利用未标注截图的离线弱监督和基于真实交互的在线强化学习；记忆表示存在全帧截图与动作接地裁剪的路径分歧；安全评估揭示领域条件差异，浏览器任务中安全但编码任务中漏洞严重。
  - 趋势演进：领域正从静态、短周期基准转向在线、长周期和安全审计评估，同时强调开源、可复现框架，能够跨不同harness和环境训练智能体。
  - 开放问题：如何统一训练难度差异大的harness、将领域条件安全泛化至所有计算机使用场景、在长周期任务中维持约束、以及无需大量人工编写即可自动构建技能。
  literature_review:
    line_of_work_matrix:
    - line: Runnable training and deployment pipelines
      what_it_solves: Transforming agent models into scalable, end-to-end workflows
        that support training, inference, and evaluation across diverse environments
        (web, desktop) and agent harnesses.
      what_remains_open: Harnesses differ substantially in learnability; trained agents
        exhibit weak error recovery; generalization from low-data interaction to long-horizon
        tasks and integration of safety constraints remain unverified.
    - line: Real-time interactive serving and safety
      what_it_solves: Enabling agents to learn from live, multi-turn interactions
        and assessing safety risks such as prompt injection in dynamic browser and
        coding environments.
      what_remains_open: Online RL introduces unresolved safety risks during training;
        domain-conditioned safety hardening does not transfer across domains; user-sensitive
        state detection lacks experimental validation and standardized criteria.
    - line: Artifacts and reproducible engineering
      what_it_solves: Providing reusable skill libraries, action-grounded memory structures,
        and standardized benchmarks to make GUI agent systems inspectable, shareable,
        and rigorously comparable.
      what_remains_open: Skill artifacts require manual authoring and lack cross-application
        transfer; memory mechanisms have not been tested jointly with safety constraints;
        existing benchmarks do not cover all attack surfaces and show low independent
        reproducibility.
    consensus:
    - Multimodal visual input is the core modality for GUI agents, with tasks formulated
      as step-by-step action sequences.
    - Task success rate is the primary evaluation metric, with growing recognition
      that partial scores and long-horizon completion reveal more meaningful capability
      gaps.
    - Current agents consistently fail on error recovery, constraint following, and
      hidden-state reasoning, indicating fundamental limitations beyond basic UI grounding.
    - Open-source frameworks and reproducible artifacts are considered essential for
      advancing the field, moving away from closed, proprietary evaluations.
    disagreements:
    - 'Training signal: weakly-supervised learning from massive unannotated screenshots
      versus online multi-turn RL from live website interactions.'
    - 'Memory representation: full-image visual memory worsens action-level errors,
      while action-grounded image crops improve task success by 33.3%.'
    - 'Safety evaluation: hand-crafted injection attacks show 0% success on browser
      agents but up to 100% on coding agents, revealing domain-conditioned safety
      that challenges earlier red-teaming conclusions.'
    - 'Task horizon: short, single-step tasks contrast with long-horizon workflows
      requiring hundreds of tool calls, where current agents achieve only ~20% completion.'
    - 'Interaction model: explicit skill libraries with multimodal retrieval versus
      end-to-end policy learning without structured knowledge bases.'
    open_questions:
    - How can a single training framework handle harnesses with vastly different learnability,
      and what design choices make some harnesses substantially harder to learn?
    - Can safety hardening be generalized beyond browser-based tasks, and what mechanisms
      would prevent domain-conditioned vulnerabilities in coding agents?
    - What training strategies enable agents to maintain constraints and reason about
      hidden states over hundreds of interaction steps?
    - How can skill artifacts be automatically constructed and adapted to new applications
      without extensive manual authoring and live UI exploration?
    - How can online RL training be made safe against prompt injection and other adversarial
      inputs during live interaction?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 可运行训练与部署流水线
      解决的问题: 将智能体模型转化为可扩展的端到端工作流，支持跨多种环境（网页、桌面）和智能体harness的训练、推理与评估。
      尚未覆盖: 不同harness的可学习性差异显著；训练后的智能体错误恢复能力弱；从少量交互数据到长周期任务的泛化以及安全约束的集成尚未验证。
    - 路线: 实时交互式服务与安全
      解决的问题: 使智能体能够从真实多轮交互中学习，并评估动态浏览器和编码环境中的提示注入等安全风险。
      尚未覆盖: 在线强化学习在训练过程中引入未解决的安全风险；领域条件安全加固无法跨领域迁移；用户敏感状态检测缺乏实验验证和标准化准则。
    - 路线: 工件与可复现工程
      解决的问题: 提供可复用的技能库、动作接地记忆结构和标准化基准，使GUI智能体系统可检查、可共享和可严格比较。
      尚未覆盖: 技能工件依赖人工编写，缺乏跨应用迁移；记忆机制尚未与安全约束联合测试；现有基准未覆盖所有攻击面，独立复现性低。
    共识:
    - 多模态视觉输入是GUI智能体的核心模态，任务被表述为逐步动作序列。
    - 任务成功率是主要评估指标，同时逐步认识到部分得分和长周期完成率能揭示更有意义的能力差距。
    - 当前智能体在错误恢复、约束遵循和隐藏状态推理方面持续失败，表明存在超出基本UI接地的根本性局限。
    - 开源框架和可复现工件被视为推动领域发展的必要条件，逐渐摆脱封闭、专有的评估方式。
    分歧:
    - 训练信号：利用海量未标注截图的弱监督学习与基于真实网站交互的在线多轮强化学习形成对比。
    - 记忆表示：全图像视觉记忆加剧动作级错误，而动作接地图像裁剪使任务成功率提升33.3%。
    - 安全评估：手工注入攻击在浏览器智能体上成功率为0%，但在编码智能体上高达100%，揭示领域条件安全性，挑战了先前红队测试的结论。
    - 任务周期：短单步任务与需要数百次工具调用的长周期工作流形成对比，当前智能体在后者中仅完成约20%。
    - 交互模式：具备多模态检索的显式技能库与无结构化知识库的端到端策略学习存在分歧。
    开放问题:
    - 单一训练框架如何应对可学习性差异巨大的harness，哪些设计选择导致某些harness更难学习？
    - 安全加固能否泛化至浏览器之外的任务，何种机制能防止编码智能体的领域条件漏洞？
    - 何种训练策略能让智能体在数百步交互中维持约束并推理隐藏状态？
    - 如何自动构建技能工件并适应新应用，而无需大量人工编写和实时UI探索？
    - 如何在真实交互过程中使在线强化学习对提示注入等对抗性输入具有安全性？
