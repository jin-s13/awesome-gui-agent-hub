  related_work_outline:
  - 'Mainstream direction: Constructing multi-modal, multi-interaction (click, drag,
    dynamic) GUI agent benchmarks with fine-grained metrics and verifiable tasks to
    diagnose agent capabilities beyond overall success rates.'
  - 'Shared research pattern: Multi-application, deterministic rule-based evaluation
    in procedurally generated environments, with task suites designed to reveal capability
    landscapes rather than single scores.'
  - 'Key differences: Interaction types differ (static desktop, dynamic short-video,
    drag-based); evaluation signals differ (task completion, uncertainty quantification,
    observation efficiency); environments differ (real desktop apps vs. browser simulators);
    some provide training datasets while others are zero-shot only.'
  - 'Trend evolution: Within the 2024–2026 frontier, benchmarks have expanded from
    static desktop tasks to dynamic and video-guided interfaces, and are beginning
    to incorporate uncertainty quantification and training data generation, moving
    from single-score to multi-dimensional evaluation.'
  - 'Open questions: Observation control in dynamic environments remains unsolved;
    cross-model uncertainty quantification transfers poorly; drag and fine-grained
    interaction benchmarks are scarce; no unified benchmark covers long-tail interactions
    across platforms.'
  related_work_outline_zh:
  - 主流方向：构建多模态、多交互（点击、拖拽、动态）的GUI代理基准，通过细粒度指标和可验证任务诊断代理能力，而非仅看总分。
  - 研究共性：在多应用环境中采用确定性规则评估，任务套件旨在揭示能力格局，而非单一分数。
  - 关键差异：交互类型不同（静态桌面、动态短视频、拖拽）；评估信号不同（任务完成、不确定性量化、观察效率）；环境实现不同（真实桌面应用 vs 浏览器模拟器）；部分提供训练数据，其他仅用于零样本评估。
  - 趋势演进：在2024–2026年前沿期内，基准从静态桌面任务扩展到动态和视频引导界面，并开始集成不确定性量化和训练数据生成，评估从单一分数走向多维诊断。
  - 开放问题：动态环境中的观察控制仍未解决；跨模型不确定性量化迁移性差；拖拽等精细交互基准稀缺；缺乏覆盖跨平台长尾交互的统一基准。
  literature_review:
    line_of_work_matrix:
    - line: Cross-platform GUI benchmark design
      what_it_solves: 'Creates shared tasks across multiple applications and interaction
        types (click, drag, CLI) to make agent capabilities comparable. Examples:
        MacAgentBench covers 25 macOS apps with GUI+CLI tasks; DragOn benchmarks drag-based
        interactions.'
      what_remains_open: Whether task distributions cover long-tail real-world operations,
        multi-app workflows, and diverse interface paradigms beyond the tested platforms.
    - line: Dynamic and video-guided interaction evaluation
      what_it_solves: Simulates content-changing interfaces and video instructions
        to evaluate agent observation and action in non-static environments. LivingScreen
        targets short-video platforms; VG-GUIBench bridges video QA and GUI tasks
        with keyframe extraction.
      what_remains_open: Generalization to other dynamic interfaces (games, AR) is
        unknown; observation control and cost-accuracy metrics are not yet solved.
    - line: Uncertainty quantification and fine-grained metrics
      what_it_solves: Provides post-hoc UQ methods and multi-checkpoint scoring to
        diagnose reliability and sub-goal completion. Argus benchmarks UQ for GUI
        grounding; MacAgentBench uses fine-grained multi-checkpoint scoring; LivingScreen
        uses cost-accuracy efficiency metric.
      what_remains_open: UQ ranking transfer across model tiers is weak; alignment
        between proxy metrics and downstream user decisions remains unverified; conformal
        coverage degrades under distribution shift.
    - line: Benchmark-driven task synthesis and training
      what_it_solves: Expands training data through verifiable task synthesis and
        weak supervision to reduce annotation cost. ScaleCUA generates verifiable
        RL tasks; GUICrafter leverages unannotated screenshots for training.
      what_remains_open: Fidelity of synthetic tasks compared to human-constructed
        benchmarks; whether gains on synthetic tasks fully transfer to standard benchmarks
        across diverse agent architectures.
    consensus:
    - All benchmarks employ multi-task, deterministic rule-based evaluation and emphasize
      diagnostic capability breakdowns beyond aggregate success rates.
    - Environments are procedurally controlled and tasks are designed to probe specific
      interaction abilities (click, drag, dynamic observation) rather than single-step
      image understanding.
    - Artifacts and task suites are publicly released to promote reproducibility,
      though code and data availability varies.
    disagreements:
    - 'Interaction modes differ: some benchmarks focus on click and drag operations,
      while others simulate dynamic content changes and video-guided tasks.'
    - 'Evaluation signals vary: task completion accuracy, uncertainty quantification,
      observation efficiency, and cost-accuracy trade-offs are emphasized to different
      degrees.'
    - Environment implementations range from real desktop applications (macOS) to
      browser-based simulators, affecting the fidelity and transferability of results.
    - 'Training data availability: DragOn releases a large-scale training set for
      drag grounding, while most other benchmarks are designed for zero-shot evaluation.'
    open_questions:
    - How can a unified benchmark cover dynamic, drag-based, and long-tail interactions
      across operating systems without sacrificing evaluation fidelity?
    - Can uncertainty quantification methods be made robust enough for safe deployment
      when rankings fail to transfer across model families?
    - Do synthetic task generation pipelines produce benchmarks that reliably track
      agent progress compared to human-curated benchmarks?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 跨平台 GUI 基准设计
      解决的问题: 创建跨多应用、多交互类型（点击、拖拽、命令行）的共享任务，使代理能力可比。例如 MacAgentBench 覆盖 25 个 macOS 应用的
        GUI+CLI 任务；DragOn 基准测试拖拽交互。
      尚未覆盖: 任务分布是否覆盖真实场景中的长尾操作、多应用工作流和测试平台之外的多样界面范式。
    - 路线: 动态与视频引导交互评估
      解决的问题: 模拟内容变化的界面和视频指令，评估代理在非静态环境中的观察与行动能力。LivingScreen 面向短视频平台；VG-GUIBench 通过关键帧提取桥接视频问答与
        GUI 任务。
      尚未覆盖: 泛化到其他动态界面（游戏、AR）未知；观察控制和成本-准确性指标尚未解决。
    - 路线: 不确定性量化与细粒度指标
      解决的问题: 提供后验 UQ 方法和多检查点评分，诊断代理的可靠性和子目标完成度。Argus 基准测试 GUI 接地的 UQ；MacAgentBench
        使用细粒度多检查点评分；LivingScreen 使用成本-准确性效率指标。
      尚未覆盖: 跨模型层级的 UQ 排名迁移弱；代理指标与下游用户决策的一致性未经验证；共形覆盖在分布偏移下下降。
    - 路线: 基准驱动的任务合成与训练
      解决的问题: 通过可验证任务合成和弱监督扩展训练数据，降低标注成本。ScaleCUA 生成可验证 RL 任务；GUICrafter 利用未标注截图进行训练。
      尚未覆盖: 合成任务与人工基准的保真度比较；合成任务上的收益是否在不同代理架构的标准基准上完全迁移。
    共识:
    - 所有基准均采用多任务、确定性规则评估，并强调超越总分的能力诊断分解。
    - 环境是程序化控制的，任务设计旨在探究特定的交互能力（点击、拖拽、动态观察），而非单步图像理解。
    - 工件和任务套件公开发布以促进可重复性，但代码和数据可用性各异。
    分歧:
    - 交互模式不同：部分基准聚焦点击和拖拽操作，另一些模拟动态内容变化和视频引导任务。
    - 评估信号各异：任务完成准确性、不确定性量化、观察效率、成本-准确性权衡被不同程度地强调。
    - 环境实现从真实桌面应用（macOS）到基于浏览器的模拟器不等，影响结果的保真度和可迁移性。
    - 训练数据可用性：DragOn 为拖拽接地发布大规模训练集，而多数其他基准设计用于零样本评估。
    开放问题:
    - 如何构建一个统一基准，覆盖跨操作系统的动态、拖拽和长尾交互，同时不牺牲评估保真度？
    - 当排名在模型家族间无法迁移时，不确定性量化方法能否足够稳健以实现安全部署？
    - 合成任务生成流水线是否产生可靠跟踪代理进展的基准，与人工策划基准相比如何？
