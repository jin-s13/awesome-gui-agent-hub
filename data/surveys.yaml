  related_work_outline:
  - 'Mainstream direction: Realistic GUI/OS automation benchmarks and agent improvement
    dominate; current work expands from static app/web tasks to dynamic screens, video-guided
    tasks, verifiable task synthesis, and fine-grained evaluation.'
  - 'Shared research pattern: Build an executable environment or dataset, evaluate
    agent trajectories with success plus auxiliary metrics, then diagnose failures
    such as observation control, grounding, or calibration gaps.'
  - 'Key differences: Benchmarks target different surfaces—macOS desktop, short-video
    platforms, video-guided GUI, single-step grounding versus multi-step trajectories—while
    methods differ in external skills, harness edits, online RL, or weak supervision.'
  - 'Trend evolution: Within the 2024–2026 frontier, tasks move toward more realistic
    and dynamic settings, and evaluation shifts from aggregate pass rates to sub-goal,
    cost-accuracy, and uncertainty signals.'
  - 'Open questions: Generalization across model tiers and interfaces, alignment of
    proxy metrics with real user decisions, and benchmark stability across implementations
    and compute budgets remain unresolved.'
  related_work_outline_zh:
  - 主流方向：构建真实GUI/OS自动化基准并改进代理；当前工作从静态应用/网页任务扩展到动态屏幕、视频引导任务、可验证任务合成和细粒度评估。
  - 研究共性：构建可执行环境或数据集，以成功率加辅助指标评估代理轨迹，再诊断观察控制、界面接地或校准等失败模式。
  - 关键差异：基准覆盖不同表面——macOS桌面、短视频平台、视频引导GUI、单步接地与多步轨迹；方法在外部技能、harness编辑、在线RL或弱监督上不同。
  - 趋势演进：在2024–2026前沿内，任务走向更真实动态设置，评估从总通过率转向子目标、成本-准确性和不确定性信号。
  - 开放问题：跨模型层级和接口的泛化、代理指标与真实用户决策的一致性、基准在不同实现和算力预算下的稳定性仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: Realistic desktop and OS benchmark design
      what_it_solves: Creates executable macOS/desktop tasks with deterministic rule-based
        scoring and multi-checkpoint capability annotations for comparable agent evaluation.
      what_remains_open: Coverage of dynamic interfaces, mobile/web, long-horizon
        workflows, and deployment conditions is limited; available packet does not
        confirm all artifacts.
    - line: Dynamic and video-guided task benchmarking
      what_it_solves: Tests agents on time-varying screens and video-guided interactions,
        jointly measuring task accuracy and information efficiency.
      what_remains_open: Current domains include short-video platforms and selected
        video-guided tasks; observation control and generalization to other dynamic
        interfaces remain unresolved.
    - line: Metric and stress-test design
      what_it_solves: Adds sub-goal scoring, cost-accuracy, and post-hoc uncertainty
        quantification to expose differences hidden by aggregate pass rates.
      what_remains_open: Uncertainty evidence covers single-step GUI grounding more
        than multi-step trajectories; alignment between proxy metrics and real user
        utility is not established.
    - line: Skill, harness, and training-based agent improvement
      what_it_solves: Improves agents by adding multimodal skill libraries, optimizing
        execution harnesses, synthesizing verifiable RL tasks, or weakly supervised
        grounding.
      what_remains_open: Transfer and stability across benchmarks, model tiers, compute
        budgets, and annotation verification are only partially demonstrated.
    - line: Comparable baselines and reporting
      what_it_solves: Provides common frameworks and model comparisons, with some
        artifacts and scripts, enabling auditability of benchmark claims.
      what_remains_open: Several papers lack visible code/dataset/limitation details;
        missing evidence is a verification gap rather than proof of absence.
    consensus:
    - Real executable environments with deterministic or verifiable checks are treated
      as more comparable than static text-only evaluations.
    - Aggregate success is insufficient; fine-grained sub-goal, observation/cost,
      and uncertainty signals reveal agent gaps.
    - Current agents still fail consistently on dynamic-screen observation control,
      UI grounding, and cross-tier generalization.
    - External scaffolds such as skills, harness edits, synthesized tasks, or weak
      supervision are common routes to improve frozen or data-limited agents.
    disagreements:
    - Some evaluations target static or real desktop/OS tasks, while others target
      dynamic short-video or video-guided interactions.
    - Some focus on single-step grounding and calibration, while others evaluate multi-step
      end-to-end trajectories.
    - Some keep models frozen and modify skills or harnesses, while others train with
      online RL or weak supervision.
    - 'Representation of visual knowledge differs: some preserve figures in multimodal
      skill artifacts, others extract keyframes or learn from unannotated screenshots.'
    - Evaluation targets differ between task success, sub-goal completion, information
      cost, and uncertainty calibration.
    open_questions:
    - How well do cost-accuracy and uncertainty rankings transfer across model classes
      and interfaces without target-specific reranking?
    - Do sub-goal and information-efficiency metrics align with user-relevant task
      completion, or do they remain benchmark-specific?
    - Are benchmark conclusions stable across different implementations, compute budgets,
      and missing code/dataset artifacts?
    - Which dynamic interface types, long-horizon workflows, and multi-step uncertainty
      settings remain uncovered by current tasks?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 真实桌面与OS基准设计
      解决的问题: 创建可执行的macOS/桌面任务，使用确定性规则评分和多检查点能力注释，使代理评估可比较。
      尚未覆盖: 动态界面、移动/网页、长程工作流和部署条件覆盖有限；证据包未确认全部工件。
    - 路线: 动态与视频引导任务基准
      解决的问题: 测试代理在时变屏幕和视频引导交互上的表现，联合测量任务准确性和信息效率。
      尚未覆盖: 当前覆盖短视频平台和部分视频引导任务；观察控制与其他动态界面的泛化尚未解决。
    - 路线: 指标与压力测试设计
      解决的问题: 增加子目标评分、成本-准确性和后验不确定性量化，揭示总通过率掩盖的差异。
      尚未覆盖: 不确定性证据更多覆盖单步GUI接地而非多步轨迹；代理指标与真实用户效用的一致性未建立。
    - 路线: 技能、执行框架与训练式代理改进
      解决的问题: 通过多模态技能库、优化执行harness、合成可验证RL任务或弱监督接地来改进代理。
      尚未覆盖: 跨基准、模型层级、算力预算和标注验证的迁移与稳定性仅部分展示。
    - 路线: 可比基线与报告规范
      解决的问题: 提供通用框架和模型比较，以及部分工件和脚本，使基准结论可审计。
      尚未覆盖: 若干论文缺少可见代码/数据集/局限性说明；缺失证据属于验证缺口而非不存在。
    共识:
    - 真实可执行环境与确定性或可验证检查被视为比静态纯文本评估更具可比性。
    - 总成功率不足以反映能力；细粒度子目标、观察/成本与不确定性信号揭示代理缺口。
