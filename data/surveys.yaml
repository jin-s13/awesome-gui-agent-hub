  literature_review:
    line_of_work_matrix:
    - line: Multimodal skill and tool stacks for computer-use agents
      what_it_solves: organizes reusable application knowledge as on-demand multimodal
        artifacts, helping agents identify UI elements and verify workflow state
      what_remains_open: how these skill artifacts generalize across applications,
        stay current, and survive independent deployment without tightly coupled infrastructure
    - line: Data-efficient and weakly supervised GUI policy training
      what_it_solves: reduces dependence on costly human annotations by learning visual
        grounding from unannotated screenshots and calibrating with small curated
        data
      what_remains_open: robustness to noisy or out-of-distribution interfaces and
        transfer to user-specific, real-world workflows beyond reported benchmarks
    - line: Efficient action generation and serving for GUI closed loops
      what_it_solves: lowers latency and parameter cost through latent candidate scoring
        or block-wise generation instead of token-by-token action decoding
      what_remains_open: whether efficiency gains can match or exceed strong autoregressive
        baselines across broader platforms and out-of-distribution tasks
    - line: Harness-native end-to-end training and unified action spaces
      what_it_solves: trains agents inside actual deployment frameworks and merges
        GUI actions with code execution, enabling environment-grounded learning and
        verifiable task completion
      what_remains_open: error recovery remains weak, harness design strongly affects
        trainability, and cross-platform transfer is only partially evidenced
    - line: Diagnostic evaluation of failure modes
      what_it_solves: makes recovery consistency and personalization failures measurable
