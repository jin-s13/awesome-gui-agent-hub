    研究路线矩阵:
    - 路线: 端到端Harness原生与在线训练框架
      解决的问题: 在真实或Harness环境中拦截模型调用或运行浏览器/桌面回滚，用于强化学习训练智能体。
      尚未覆盖: 错误恢复仍弱，Harness复杂度影响可训练性，证据集中在特定Web和桌面基准。
    - 路线: 多模态技能与执行级记忆
      解决的问题: 复用已验证GUI工作流和视觉工件，降低token/时间成本并改善UI grounding。
      尚未覆盖: 适用性似乎限于可确定性重放的步骤；模糊或不兼容步骤仍需grounding修复或重新规划。
    - 路线: 数据高效弱监督GUI智能体
      解决的问题: 利用未标注截图先学习视觉定位，再用少量高质量标注校准，降低人工标注依赖。
      尚未覆盖: 仍需少量高质量校准数据；报告设置之外的鲁棒性缺乏局限性证据。
    - 路线: 统一GUI与代码动作的智能体
      解决的问题: 在单一端到端动作空间中协调GUI交互与代码执行，并构造环境可验证任务。
      尚未覆盖: 跨平台证据不完整，未报告明确局限，部署边界不清。
    - 路线: 恢复行为评测与诊断框架
      解决的问题: 通过受控错误注入和目标导向动作重放，形式化并测量转移一致性恢复。
      尚未覆盖: 环境重置可行性、长时程重放成本和仅API回滚限制落地，实际恢复改进仍开放。
    - 路线: 替代式解码GUI智能体模型
      解决的问题: 将块级扩散引入多模态GUI grounding与导航，以保留并行解码优势。
      尚未覆盖: 证据包中未提供延迟/质量权衡与交互式服务行为证据。
    共识:
    - 监督初始化后接强化学习或校准，是在线/Harness原生智能体系统中常见的训练模式。
    - 评测依赖接地气的交互基准，通常报告OSWorld-Verified、Online-Mind2Web、CUA-World或OSExpert-Eval上的任务成功率。
    - 可复用轨迹、技能库和记忆工件被当作部署组件，用于改善grounding或降低执行成本。
    - 原生计算机使用越来越多被视为界面交互加可执行动作的协调，而不是孤立的GUI点击。
    分歧:
    - 动作表示不同：有的仅保留GUI操作，有的在单一动作空间统一GUI与代码执行。
    - 训练信号不同：未标注截图弱监督、真实网站或Harness在线多轮强化学习、以及扩散式监督微调是不同优化路线。
    - 记忆与技能集成方式不同：作为技能库的上下文检索、已验证轨迹的确定性可调用重放、以及端到端策略内部记忆是不同机制。
    - 主要评测目标不同：端到端任务成功、恢复一致性、token/时间效率或跨平台迁移。
    - 部署设置不同：网页实时浏览器训练、桌面/OS环境和Harness原生多环境编排带来不同可复现条件。
    开放问题:
    - 在证据显示强化学习后错误恢复仍弱的情况下，后训练或记忆机制能否改善恢复？
    - 当GUI状态模糊或不可复现时，确定性可重放记忆的安全适用范围是什么？
    - Harness设计或基础设施变化如何影响跨团队的可训练性与可复现性？
    - 块级扩散GUI智能体在部署规模下能否保持交互服务的延迟和质量？
    - 基于截图的弱监督能否可靠迁移到报告以外的Web和桌面grounding场景？
