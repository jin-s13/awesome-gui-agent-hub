  - 'Mainstream direction: The visible evidence centers on building and probing GUI/computer-use
    agents through controlled benchmarks and scalable training, especially verifiable
    task synthesis, online RL, long-horizon context management, and reliability benchmarks.'
  - 'Shared research pattern: Studies combine a task/benchmark or training protocol
    with an agent architecture, rely on multimodal perception-action grounding, and
    report success-rate gains or failure-mode evidence under constrained settings.'
  - 'Key differences: Work splits among single-step or multi-step evaluation, training
    signal design, safety and reliability targets, and demonstration source; settings
    range from sanitized fraud judgment to browser red-teaming and video-guided control.'
  - 'Trend evolution: Within the narrow 2024–2026 evidence window, the frontier moves
    from static grounding toward verifiable, safety-aware, and long-horizon computer-use
    tasks; historical trend beyond this frontier is not visible.'
  - 'Open questions: Cross-setting generalization, reward noise correction, domain-conditioned
    safety transfer, context compaction trade-offs, and systematic evidence for survey-style
    roadmaps remain unresolved.'
  related_work_outline_zh:
  - 主流方向：围绕GUI/计算机使用智能体建立受控基准与可扩展训练，重点包括可验证任务合成、在线RL、长时程上下文管理和可靠性评测。
  - 研究共性：论文通常组合任务/基准或训练协议与智能体架构，依赖多模态感知-动作对齐，并以成功率提升或约束条件下的失败模式作为证据。
  - 关键差异：工作分为单步/多步评测、训练信号设计、安全与可靠性目标、演示来源；场景涵盖去除信誉捷径的欺诈判断、浏览器红队和视频引导控制。
  - 趋势演进：在2024–2026窄时间窗内，前沿从静态基础定位转向可验证、安全感知和长时程计算机使用任务；更早历史趋势在当前证据中不可见。
  - 开放问题：跨设置泛化、奖励噪声校正、领域条件安全迁移、上下文压缩权衡，以及面向综述式路线图的系统性证据仍待解决。
  literature_review:
    line_of_work_matrix:
    - line: Taxonomy and roadmap synthesis for GUI agent capabilities
      what_it_solves: Organizes fragmented evidence across multimodal grounding, long-horizon
        control, training, evaluation, safety, and tutorial generation into directions
        and research gaps.
      what_remains_open: The packet contains primary method and benchmark evidence
        rather than systematic review protocols, so roadmap claims remain selective
        unless backed by systematic search and critical appraisal.
    - line: Comparative evaluation synthesis for computer-use agents
      what_it_solves: Summarizes how controlled benchmarks expose capability boundaries,
        including single-step grounding, video-guided tasks, uncertainty transfer,
        sanitized fraud detection, and domain-conditioned safety.
      what_remains_open: Compared results are often not compatible across settings;
        single-step, sanitized, or attack evaluations do not directly generalize to
        multi-step real-world deployment.
    - line: Open problem and gap mapping for reliable GUI agents
      what_it_solves: Turns observed failures in safety, uncertainty, benign recall,
        long-horizon context, and evaluator noise into concrete next research questions.
      what_remains_open: Prioritization and cross-domain validation of gaps are unresolved;
        some limitations are missing, so severity and boundary conditions remain verification
        gaps.
    consensus:
    - Success-rate benchmarks are the dominant evidence for GUI/computer-use agents,
      with shared references such as OSWorld, ScienceBoard, MobileWorld, and Windows
      Agent Arena.
    - Multimodal perception-action grounding is a shared assumption across video-guided,
      screenshot-based, and browser-based tasks.
    - Training and evaluation are shifting toward verifiable or autonomous reward
      signals, but those signals are treated as noisy and requiring correction.
    - Long-horizon context management, uncertainty quantification, and domain-conditioned
      safety are recognized failure modes or reliability concerns.
    disagreements:
    - 'Evaluation target varies: single-step grounding versus multi-step trajectories
      versus browser-safety attacks versus sanitized fraud detection versus video-guided
      tasks.'
    - 'Training signal varies: supervised fine-tuning from annotated trajectories
      versus online RL from synthesized verifiable tasks versus RL from noisy autonomous
      VLM rewards.'
    - 'Demonstration source varies: human screen recordings versus synthetic docker-generated
      tasks versus benchmark-collected episodes.'
    - Reliability framing differs across uncertainty calibration, prompt or skill
      injection safety, fraud overprediction, and context compaction.
    open_questions:
    - How well do uncertainty ranking transfer results hold beyond the observed weak
      cross-tier and cross-interface transfer?
    - Does browser-domain safety hardening transfer to coding and other interactive
      surfaces?
    - Can verifiable task synthesis and autonomous evaluators scale while controlling
      reward noise and domain bias?
    - What is the trade-off between context compaction and preserving critical facts
      in long-horizon tasks?
    - Do generated tutorials or human demonstrations generalize to unseen applications
      and real users beyond evaluated suites?
