  - 开放问题：当前任务分布是否覆盖了真实用户工作流的长尾，如何将对下游决策的满意度与代理指标对齐，以及在基准上表现出色的训练方法在分布偏移和开放世界部署下是否仍具鲁棒性。
  literature_review:
    line_of_work_matrix:
    - line: GUI task and environment design
      what_it_solves: Creates shared, reproducible task suites that capture varied
        interaction modalities (macOS desktop, short-video platforms, video-guided
        tasks, drag-based interactions) to enable systematic comparison of GUI agents.
      what_remains_open: Coverage of dynamic, multi-step, cross-application workflows
        is still narrow; most benchmarks are platform-specific and underrepresent
        long-tail user tasks, leaving generalizations to real-world usage unverified.
    - line: Multi-dimensional evaluation and stress-testing
      what_it_solves: Moves beyond aggregate success rates by introducing fine-grained
        scoring (sub-goal checkpoints), cost-accuracy metrics, observation efficiency,
        and post-hoc uncertainty quantification to reveal agent brittleness.
      what_remains_open: Assumed alignment between these proxy metrics and actual
        human satisfaction or downstream task utility is not validated; uncertainty
        rankings transfer poorly across model families and interface types, limiting
        safe deployment.
    - line: Data-efficient and scalable agent training
      what_it_solves: Reduces reliance on expensive human annotations by using verifiable
        task synthesis with online RL, or weakly supervised learning from massive
        unannotated screenshots, to scale up agent capabilities.
      what_remains_open: Robustness of these training recipes under real-world distribution
        shifts and their tendency to overfit to specific benchmark environments remain
        unaddressed; the trade-off between data efficiency and generalization is not
        quantified.
    - line: Structured multimodal skill augmentation
      what_it_solves: Enhances computer-use agents with hierarchical, application-specific
        multimodal skill libraries that retain visual cues, improving UI element identification
        and workflow verification.
      what_remains_open: Scalability to arbitrary unseen applications and the cost
        of automated skill construction are uncertain; experiments are limited to
        a few environments and a single model family, so cross-agent generality is
        not established.
    consensus:
    - Realistic GUI benchmarks must capture multi-application, dynamic, and multi-step
      workflows rather than isolated single-step tasks.
    - Aggregate success rate alone is insufficient; fine-grained metrics that reflect
      sub-goal progress, observation efficiency, and reliability are necessary to
      diagnose agent failures.
    - Current frontier agents still fall short of human-level performance on tasks
      requiring sustained observation control, flexible multimodal grounding, and
      robustness to interface variations.
    - Leveraging unannotated data or synthesized tasks can substantially reduce the
      annotation bottleneck for training GUI agents.
    disagreements:
    - 'Evaluation methodology: deterministic rule-based verification versus model-based
      metrics or uncertainty quantification, with no consensus on which best predicts
      real-world reliability.'
    - 'Interaction modality coverage: some works focus on point-and-click, others
      introduce drag, video-guided, or command-line actions, reflecting different
      assumptions about essential agent capabilities.'
    - 'Training paradigm: online RL with synthesized tasks versus weakly supervised
      pretraining on screenshots, with conflicting evidence on which approach yields
      more robust generalization.'
    - 'Environment scope: narrow benchmarks (e.g., short-video platforms) enable deep
      analysis but may not transfer to general desktop automation, while broad benchmarks
      risk superficial evaluation.'
    open_questions:
    - How can we design metrics that are both automated and faithfully aligned with
      the downstream utility users care about, beyond proxy scores?
    - What is the minimal set of interaction modalities and interface types a benchmark
      must cover to guarantee reasonable generalization to unseen real-world tasks?
    - Under what conditions do training gains from synthetic tasks or weak supervision
      persist when agents are deployed in environments with significant distribution
      shift or adversarial inputs?
    - Can uncertainty quantification methods be made robust across model architectures
      and interface styles without per-target recalibration, and how should they be
      integrated into agent safety loops?
  literature_review_zh:
    研究路线矩阵:
    - 路线: GUI 任务与环境设计
      解决的问题: 创建共享、可复现的任务集，涵盖多种交互模态（macOS 桌面、短视频平台、视频引导任务、拖拽交互），以系统性地比较 GUI 代理。
      尚未覆盖: 对动态、多步、跨应用工作流的覆盖仍然狭窄；多数基准只针对特定平台，且对长尾用户任务的代表性不足，能否泛化到真实使用场景尚未验证。
    - 路线: 多维度评估与压力测试
      解决的问题: 超越总体成功率，引入细粒度评分（子目标检查点）、成本-准确性指标、观测效率以及事后不确定性量化，以暴露代理的脆弱性。
      尚未覆盖: 这些代理指标与实际用户满意度或下游任务效用之间的假设对齐尚未验证；不确定性排名在不同模型家族和界面类型之间的迁移性较差，限制了安全部署。
    - 路线: 数据高效且可扩展的代理训练
      解决的问题: 通过可验证的任务合成与在线 RL，或从海量未标注截图中进行弱监督学习，减少对昂贵人工标注的依赖，以规模化提升代理能力。
      尚未覆盖: 这些训练方法在真实世界分布偏移下的鲁棒性，以及它们对特定基准环境过拟合的倾向仍未被解决；数据效率与泛化能力之间的权衡未量化。
    - 路线: 结构化多模态技能增强
      解决的问题: 通过保留视觉线索的分层、应用特定的多模态技能库增强计算机使用代理，改善 UI 元素识别和工作流验证。
      尚未覆盖: 向任意未见应用的扩展能力以及自动化技能构建的成本尚不明确；实验仅局限于少数环境和单一模型家族，跨代理的通用性尚未建立。
    共识:
    - 真实的 GUI 基准必须捕捉多应用、动态、多步的工作流，而非孤立的单步任务。
    - 仅凭总体成功率是不够的；反映子目标进度、观测效率和可靠性的细粒度指标对于诊断代理失败是必要的。
    - 当前前沿代理在需要持续观察控制、灵活多模态定位和对界面变化鲁棒性的任务上仍远低于人类水平。
    - 利用未标注数据或合成任务可以大幅减轻训练 GUI 代理的标注瓶颈。
    分歧:
    - 评估方法论：基于确定性规则的验证对比基于模型的指标或不确定性量化，对于哪种方法最能预测真实世界可靠性尚无共识。
    - 交互模态覆盖：部分工作聚焦于点击，另一些引入拖拽、视频引导或命令行操作，反映了对代理基本能力的不同假设。
    - 训练范式：基于合成任务的在线 RL 对比基于截图的弱监督预训练，两种方法在泛化鲁棒性上证据相互矛盾。
    - 环境范围：狭窄的基准（如短视频平台）能进行深入分析，但可能无法迁移到通用桌面自动化；而宽泛的基准则可能流于表面评估。
    开放问题:
    - 如何设计既自动化又忠实于用户关心的下游效用的指标，而非仅停留在代理评分上？
    - 基准必须覆盖的最小交互模态和界面类型组合是什么，才能保证对未知真实任务有合理的泛化能力？
    - 在何种条件下，合成任务或弱监督带来的训练收益能在代理部署于存在显著分布偏移或对抗性输入的环境中时得以保持？
    - 不确定性量化方法能否在不同模型架构和界面风格之间实现鲁棒性，而无需针对每个目标重新校准，以及如何将其整合到代理安全循环中？
