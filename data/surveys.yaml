  related_work_outline:
  - 'Mainstream direction: current GUI agent methods concentrate on turning screen
    or video observations into grounded, executable interactions and on evaluating
    those agents in more realistic environments such as macOS desktops, short-video
    platforms, video-guided tasks, and drag-based interfaces.'
  - 'Shared research pattern: papers combine a visual grounding or observation-processing
    component with fine-grained, task-level evaluation; many methods improve performance
    through large-scale supervision, verifiable RL, self-improving harnesses, or keyframe
    extraction rather than only static prompting.'
  - 'Key differences: the papers differ in whether they train model weights, freeze
    models and optimize the surrounding harness or observation pipeline, or build
    benchmarks; they also differ in action coverage, evaluation target, and use of
    deterministic, cost-accuracy, grounding, or uncertainty metrics.'
  - 'Trend evolution: the visible 2024-2026 frontier moves from single-step click/tap
    grounding and narrow OS tasks toward multi-step desktop control, dynamic observation
    control, verifiable task synthesis, data-efficient training, and uncertainty-aware
    evaluation.'
  - 'Open questions: transfer across interfaces and model classes, isolating model
    gains from harness/data/skill effects, observation control on dynamic content,
    drag and multi-step trajectory coverage, and UQ robustness under distribution
    shift remain unresolved.'
  related_work_outline_zh:
  - 主流方向：当前GUI智能体方法主要研究如何将屏幕或视频观测转化为可执行的界面动作，并在更真实的环境中评测，例如macOS桌面、短视频平台、视频引导任务和拖拽式界面。
  - 研究共性：多篇工作将视觉基础或观测处理与细粒度任务评测结合；方法改进常见于大规模监督、可验证强化学习、自改进执行框架或关键帧提取，而非仅依赖静态提示。
  - 关键差异：不同工作分别侧重训练模型权重、冻结模型并优化周围执行框架/观测管线，或构建基准；在动作覆盖、评测目标以及确定性得分、成本-准确率、基础定位或不确定性等指标上存在差异。
  - 趋势演进：可见的2024-2026前沿从单步点击/点按基础与狭窄OS任务，转向多步桌面控制、动态观测控制、可验证任务合成、数据高效训练和不确定性感知评测。
  - 开放问题：跨界面和跨模型类别的迁移、区分模型收益与执行框架/数据/技能库影响、动态内容上的观测控制、拖拽与多步轨迹覆盖，以及分布偏移下不确定性量化的鲁棒性仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: Grounding and action-interface methods
      what_it_solves: Translate screen or video observations into grounded GUI actions,
        with expanding coverage from click/tap to drag, GUI+CLI, and content that
        changes between actions.
      what_remains_open: Generalization beyond reported platforms, interaction types,
        or single-step grounding; dynamic observation control is still missing in
        current agents.
    - line: Training and self-improvement methods
      what_it_solves: Improve GUI agent capability through verifiable online RL, weakly
        supervised learning from unannotated screenshots, or evidence-driven optimization
        of the execution harness around frozen models.
      what_remains_open: Whether gains come from the learned model, reward/task synthesis,
        keyframe extraction, or harness edits; transfer across benchmarks and backbones
        remains partial.
    - line: Evaluation and uncertainty protocols for GUI agents
      what_it_solves: Provide task suites, fine-grained sub-goal scores, cost-accuracy
        metrics, or post-hoc uncertainty signals to separate surface success from
        capability and reliability.
      what_remains_open: Most evidence is limited to chosen environments; cross-model
        and cross-interface UQ transfer is weak, and multi-step trajectory evaluation
        is not fully covered.
    consensus:
    - Modern GUI agent results are measured by grounding visual observations to executable
      actions, with fine-grained scoring beyond Pass@1 to expose sub-goal or information-efficiency
      differences.
    - Large-scale data, verifiable rewards, or self-improving observation/harness
      pipelines provide gains without requiring fully annotated demonstrations for
      every task.
    - Real-world and dynamic interfaces reveal failure modes such as over-observation,
      under-observation, or missing drag interaction skills that static click/tap
      benchmarks do not capture.
    disagreements:
    - 'Method locus differs: some methods update model weights with RL or weak supervision,
      while others freeze the model and optimize keyframe extraction, execution harness,
      or skill library.'
    - 'Evaluation target differs: desktop OS task completion with rule-based scores,
      dynamic short-video interaction with cost-accuracy, video-guided task success,
      drag grounding, and single-step uncertainty are not interchangeable.'
    - 'Supervision and reward assumptions differ: verifiable synthetic task rollouts,
      unannotated screenshots plus small calibration data, or post-hoc uncertainty
      calibration without model training.'
    - 'Action and observation scope differs: click/tap grounding, drag operations,
      combined GUI+CLI control, and dynamic observation pacing cover different evaluation
      boundaries.'
    open_questions:
    - Which observed gains are attributable to the proposed method rather than the
      surrounding harness, skill library, task generator, or benchmark scoring design?
    - How well do GUI agent training and uncertainty methods transfer across operating
      systems, application domains, dynamic interfaces, and open-vs-closed model tiers?
    - Can agents learn explicit observation control to avoid over- and under-observation
      on content that changes between actions?
    - What evaluation protocols are needed for multi-step trajectories, drag-based
      interactions, and distribution-shifted deployments beyond current single-step
      or platform-specific suites?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基础定位与动作接口方法
      解决的问题: 将屏幕或视频观测转化为可执行的GUI动作，覆盖从点击/点按到拖拽、GUI+CLI以及操作之间内容变化的界面。
      尚未覆盖: 跨平台和交互类型的迁移尚未充分验证；动态内容下的观测控制仍是当前智能体缺失能力。
    - 路线: 训练与自改进方法
      解决的问题: 通过可验证在线强化学习、基于未标注截图的弱监督学习，或对冻结模型周围执行框架进行证据驱动优化，提升GUI智能体能力。
      尚未覆盖: 收益来自模型权重、奖励/任务合成、关键帧提取还是执行框架改动仍难分离；跨基准和骨干模型的迁移仍不完整。
    - 路线: GUI智能体评测与不确定性协议
      解决的问题: 提供任务套件、细粒度子目标评分、成本-准确率指标或后验不确定性信号，以区分表面成功率与真实能力和可靠性。
      尚未覆盖: 证据多局限于所选环境；跨模型、跨接口的不确定性排名迁移较弱，多步轨迹评测覆盖不足。
    共识:
    - 现代GUI智能体结果通过将视觉观测基础化为可执行动作来衡量，并在Pass@1之外使用细粒度评分揭示子目标或信息效率差异。
    - 大规模数据、可验证奖励或自改进观测/执行管线可以减少对每任务全量人工标注的依赖并带来性能提升。
    - 真实和动态界面暴露出过度观察、观察不足或拖拽技能缺失等失败模式，这些是静态点击/点按基准难以捕捉的。
    分歧:
    - 方法作用点不同：部分方法通过强化学习或弱监督更新模型权重，另一些方法冻结模型并优化关键帧提取、执行框架或技能库。
    - 评测目标不同：桌面OS任务完成、动态短视频交互、视频引导任务、拖拽基础定位和单步不确定性并非等价。
    - 监督与奖励假设不同：可验证合成任务轨迹、未标注截图加少量校准数据、以及不训练模型的后验不确定性校准代表不同路径。
    - 动作与观测范围不同：点击/点按基础定位、拖拽操作、GUI+CLI组合控制和动态观测节奏覆盖不同评测边界。
    开放问题:
    - 哪些观测到的收益仍应归因于所提方法，而非周围执行框架、技能库、任务生成器或基准评分设计？
    - GUI智能体训练和不确定性方法在操作系统、应用域、动态界面以及开源与闭源模型之间的迁移能力如何？
    - 智能体能否学习显式观测控制，以避免在内容随动作变化的界面上出现过度观察或观察不足？
    - 针对多步轨迹、拖拽类交互和分布偏移部署，需要哪些超越当前单步或平台特定套件的评测协议？
