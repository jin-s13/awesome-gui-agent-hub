    metrics, uncertainty diagnostics, and frozen-model or weak-supervision improvement.'
  - 'Open questions: Whether the benchmarks transfer across platforms and compute
    budgets, whether proxy metrics align with user decisions, and whether skill/harness
    gains overfit to particular task distributions remain unresolved.'
  related_work_outline_zh:
  - 主流方向：基准测试正从静态截图定位转向真实GUI/OS自动化套件，覆盖更多应用和多步骤任务，并采用细粒度评分。
  - 研究共性：工作通常结合可执行环境、多个VLM/代理基线、确定性或规则检查，并引入子目标、成本或不确定性等辅助指标。
  - 关键差异：部分工作评测静态截图定位，部分面向桌面工作流、动态短视频界面或视频引导任务；部分优化技能或执行框架而非仅评测。
  - 趋势演进：现有证据集中在2026年，显示从静态单步评测转向动态观察、成本敏感指标、不确定性诊断，以及冻结模型或弱监督改进。
