  related_work_outline_zh:
  - 主流方向：当前前沿正从静态点击式GUI评测转向真实macOS、动态短视频、拖拽式任务套件（如MacAgentBench、LivingScreen、DragOn）；改进主要来自外部脚手架、技能库、harness演化、弱监督和在线RL，而不仅依赖模型规模扩展。
  - 研究共性：论文在可执行环境中定义GUI任务，将性能细分为子目标完成、能力注释、成本-准确性或不确定性排序等信号，并比较开放权重与闭源VLM代理。
  - 关键差异：部分方法冻结骨干模型，优化技能或harness；另一些方法利用大规模未标注数据或可验证RL训练；评测目标从完整OS工作流到单步定位、拖拽原语和动态观察控制各不相同。
  - 趋势演进：可用年份集中在2024-2026，主要是2026年，因此趋势在当前前沿内：基准测试增加交互与界面多样性，研究向可靠性、数据效率和自改进脚手架倾斜。
