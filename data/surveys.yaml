  - 'Mainstream direction: real-world GUI/OS/desktop and dynamic-screen benchmarks
    dominate, emphasizing realistic application interactions and fine-grained evaluation
    rather than toy tasks; representative examples include MacAgentBench and LivingScreen.'
  - 'Shared research pattern: benchmark construction pairs tasks with executable environments
    and diagnostic metrics such as subgoal/checkpoint scores, cost-accuracy, or uncertainty
    ranking, then evaluates frontier VLM or GUI agents against human or baseline references.'
  - 'Key differences: static desktop/CLI tasks contrast with living-screen or video-guided
    dynamic interfaces; single-step grounding benchmarks contrast with multi-step
    workflow trajectories; success-rate metrics contrast with uncertainty, conformal,
    and efficiency metrics; method-building interventions contrast with benchmark-only
    measurement.'
  - 'Trend evolution: within the 2024–2026 frontier, work is moving from aggregate
    Pass@1 on stable GUIs toward dynamic content, observation-control failure analysis,
    and confidence or calibration diagnostics; the representative evidence clusters
    in 2026, so the visible trend is current-frontier rather than long-run.'
  - 'Open questions: cross-platform and cross-interface transfer without re-evaluation,
    metric alignment with downstream task utility, coverage of multi-step uncertainty
    and dynamic interactions, and reproducibility gaps from missing code, dataset,
    limitation, or artifact details.'
