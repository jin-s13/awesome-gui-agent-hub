  related_work_outline:
  - 'Mainstream direction: Building more realistic GUI-agent benchmarks and training
    methods, covering desktop, mobile, dynamic video, drag, video-guided, and uncertainty-aware
    evaluation, while improving agents through verifiable RL, weak supervision, and
    context management.'
  - 'Shared research pattern: Use frontier VLM/MLLM backbones as the base agent, construct
    task suites or datasets with specialized scoring, then fine-tune or analyze failure
    modes around grounding, observation, and long-horizon execution.'
  - 'Key differences: Papers differ in evaluation target, interaction primitive, supervision
    signal, and metric emphasis, including static vs dynamic environments, click vs
    drag/GUI+CLI, verifiable tasks vs unannotated screenshots, and Pass@1 vs cost-accuracy
    or uncertainty.'
  - 'Trend evolution: Within the narrow 2024-2026 frontier, evaluation is shifting
    from click-only pass rates toward fine-grained, dynamic, long-horizon, uncertainty-aware
    measurement, while methods shift toward scalable task/data generation and lightweight
    adaptation.'
  - 'Open questions: Whether benchmark gains transfer across platforms and interfaces,
    whether RL or weak-supervision gains isolate from base model and framework effects,
    how to evaluate observation cost and uncertainty in trajectories, and missing
    explicit limitations in several papers.'
  related_work_outline_zh:
  - 主流方向：构建更真实的 GUI 智能体基准与训练方法，覆盖桌面、移动、动态视频、拖拽、视频引导和不确定性评测，并通过可验证强化学习、弱监督和上下文管理改进智能体。
  - 研究共性：以前沿 VLM/MLLM 为底座，构造专门任务套件与评分，再进行微调或分析失败模式，关注定位、观察和长时程执行。
  - 关键差异：差异集中在评测目标、交互原语、监督信号和指标侧重，包括静态/动态环境、点击/拖拽/GUI+CLI、可验证任务/未标注截图，以及 Pass@1/成本-准确性/不确定性。
  - 趋势演进：在 2024-2026 的狭窄前沿内，评测从点击通过率转向细粒度、动态、长时程和不确定性感知；方法从人工数据转向可扩展任务/数据生成与轻量适配。
  - 开放问题：基准收益是否跨平台、跨接口迁移；强化学习或弱监督收益是否与底座模型和框架效果隔离；如何评测轨迹中的观察成本与不确定性；部分论文缺少显式限制说明。
  literature_review:
    line_of_work_matrix:
    - line: GUI task evaluation and interaction coverage
      what_it_solves: Measures agent success on desktop, dynamic short-video, drag,
        video-guided, and mobile long-horizon tasks, often using finer checkpoints
        than a single pass rate.
      what_remains_open: Evidence is mostly limited to one environment or interaction
        type; cross-platform generalization and full trajectory evaluation remain
        underevidenced, and several papers omit explicit limitations.
    - line: Data and RL scaling for GUI agents
      what_it_solves: Reduces human annotation or expands task coverage through verifiable
        task synthesis, online RL sampling, weak supervision from unannotated screenshots,
        and compact context annotations.
      what_remains_open: Contribution is not cleanly separated from base model, framework
        or skill-library effects, or benchmark-specific tuning; transfer beyond settings
        similar to OSWorld or ScienceBoard is unclear.
    - line: State/action representation and uncertainty handling
      what_it_solves: Represents dynamic observations and executable actions through
        keyframes, drag primitives, GUI+CLI actions, observation-control behaviors,
        and uncertainty-aware click regions.
      what_remains_open: Findings are mostly isolated to single-step grounding or
        a specific interface; observation control, uncertainty transfer, and model-versus-interface
        contributions need more evidence.
    consensus:
    - Frontier VLM/MLLM backbones are the default substrate; papers evaluate or fine-tune
      these rather than proposing standalone non-learned planners.
    - 'There is a shared shift from binary pass rate to finer capability evidence:
      sub-goal completion, cost-accuracy, uncertainty, and interaction-type-specific
      scores.'
    - 'Data and interface fidelity matter: realistic tasks, drag/GUI+CLI primitives,
      dynamic observation, and long-horizon context reveal failures hidden by simpler
      click-only benchmarks.'
    - Current GUI agents still fall short of robust human-level behavior, especially
      under dynamic observation, long horizon, and distribution shift.
    disagreements:
    - 'Evaluation target and interaction mode differ: desktop GUI+CLI, dynamic short-video
      feeds, drag-only interactions, mobile long-horizon, and video-guided tasks create
      non-comparable metrics and baselines.'
    - 'Training supervision differs: verifiable online RL from generated tasks, weak
      supervision from unannotated screenshots, and context-management annotations
      make different assumptions about annotation cost and verifiability.'
    - 'Metric emphasis differs: some use deterministic multi-checkpoint Pass@1, others
      cost-accuracy, uncertainty ranking transfer, or conformal safety, answering
      different research questions.'
    - 'Evidence isolation differs: some report framework or skill-library effects
      and fine-tuning deltas, while others lack enough ablation or limitation detail
      to attribute gains to the proposed method.'
    open_questions:
    - Can GUI agent improvements transfer across desktop, mobile, dynamic video, and
      drag interfaces without target-specific fine-tuning or reranking?
    - Do verifiable RL and weak-supervision gains persist outside OSWorld, ScienceBoard,
      or curated browser-based environments?
    - How should evaluation combine task success, sub-goal completion, observation
      cost, uncertainty, and long-horizon trajectory quality?
    - What explains failures when models have similar Pass@1 but different sub-goal
      profiles, and can observation-control actions reduce over- or under-observation?
    - Because several top papers provide no limitation statements, what deployment
      boundaries and failure modes are omitted?
  literature_review_zh:
    研究路线矩阵:
    - 路线: GUI 任务评测与交互覆盖
      解决的问题: 在桌面、动态短视频、拖拽、视频引导和移动长时程任务上评测智能体成功，常使用比单次通过率更细的检查点。
      尚未覆盖: 证据多来自单一环境或单一交互；跨平台泛化和完整轨迹评测仍缺乏证据，部分论文省略显式限制。
    - 路线: GUI 智能体的数据与强化学习扩展
      解决的问题: 通过可验证任务合成、在线强化学习采样、未标注截图弱监督和紧凑上下文标注，减少人工标注或扩大任务覆盖。
      尚未覆盖: 方法贡献未与底座模型、框架或技能库、基准特化清晰分离；超出 OSWorld/ScienceBoard 类似设置的迁移尚不明确。
    - 路线: 状态/动作表示与不确定性处理
      解决的问题: 通过关键帧、拖拽原语、GUI+CLI 动作、观察控制行为和不确定性感知点击区域表示动态观察与可执行动作。
      尚未覆盖: 发现大多局限于单步基础或特定接口；观察控制、不确定性迁移和模型与接口贡献需要更多证据。
    共识:
    - 前沿 VLM/MLLM 底座是默认载体；工作主要评估或微调这些模型，而非提出独立非学习规划器。
    - 从二元通过率转向更细的能力证据：子目标完成、成本-准确性、不确定性和按交互类型评分。
    - 数据和界面保真度很重要：真实任务、拖拽/GUI+CLI 原语、动态观察和长时程上下文能揭示简单点击基准隐藏的失败。
    - 当前 GUI 智能体在动态观察、长时程和分布偏移下仍不如稳健人类水平。
    分歧:
    - 评测目标和交互模式不同：桌面 GUI+CLI、动态短视频流、拖拽、移动长时程和视频引导任务产生不可直接比较的指标与基线。
    - 训练监督不同：生成任务的可验证在线强化学习、未标注截图弱监督和上下文管理标注，对标注成本与可验证性有不同假设。
    - 指标侧重不同：有的用确定性多检查点 Pass@1，有的用成本-准确性、不确定性排名迁移或共形安全，回答不同问题。
    - 证据隔离不同：一些报告框架或技能库效应和微调增量，另一些缺少消融或限制细节，难以将收益归因于所提方法。
    开放问题:
    - GUI 智能体的改进能否跨桌面、移动、动态视频和拖拽接口迁移，且无需目标特定微调或重排？
    - 可验证强化学习和弱监督的收益能否在 OSWorld、ScienceBoard 或受控浏览器环境之外持续？
    - 如何将任务成功、子目标完成、观察成本、不确定性和长时程轨迹质量结合成统一评测？
    - 当模型的 Pass@1 相近但子目标剖面不同时是什么导致失败？观察控制动作能否减少过度或不足观察？
    - 由于若干论文缺少限制说明，哪些部署边界和失败模式被忽略？
