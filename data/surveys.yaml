    - What multi-step trajectory metrics would connect grounding quality, observation
      control, and task completion without collapsing to aggregate Pass@1?
    - Which static versus dynamic interface assumptions are necessary for agent robustness
      claims, and how should benchmarks cover living-screen or fast-changing interface
      behavior?
    - What formal safety or calibration guarantees can be attached to GUI agents when
      uncertainty ranking transfer is weak and limitation evidence is sparse?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 真实桌面与交互任务抽象
      解决的问题: 定义可执行的GUI任务套件，覆盖桌面、短视频和拖拽交互，并在任务级和子目标级测量完成度。
      尚未覆盖: 对动态界面类型的泛化有限，多步轨迹评测仍与单步定位或任务成功分离。
    - 路线: GUI定位的不确定性量化与可靠性评估
      解决的问题: 评测后验不确定性与校准方法在定位决策和空间安全上的表现，揭示选择性预测与共形覆盖条件。
      尚未覆盖: 证据限于单步定位；跨模型类别和界面迁移较弱，分布偏移下的部署鲁棒性仍未解决。
    - 路线: 通过执行框架优化与高效或弱监督实现自改进
      解决的问题: 通过优化执行框架、合成可验证在线RL任务或利用未标注截图降低监督成本，提升冻结或可训练模型。
      尚未覆盖: 提升仅在选定基准上得到验证；缺少形式化保证、失败预测和跨基准泛化证据。
    - 路线: 计算机使用智能体的多模态技能表示
      解决的问题: 以应用相关的视觉与文本技能工件保存知识，改善UI元素识别和工作流状态验证。
      尚未覆盖: 证据来自特定基准与单一模型设置，向新应用扩展和迁移的边界尚未明确。
    共识:
    - 当前GUI智能体研究把真实可执行的任务评测视为揭示聚合成功指标所隐藏失败模式的必要条件。
    - 细粒度交互覆盖，包括GUI加CLI、拖拽原语和动态内容，能暴露观察控制与子目标完成方面的缺口。
    - 提升计算机使用智能体越来越依赖截图、重复运行、视觉技能工件或弱监督等外部证据，而非仅靠模型架构。
    - 可复现性信号不一：部分工作发布基准或工件，但局限声明和跨模型、跨界面迁移证据往往不完整。
