  related_work_outline:
  - 'Mainstream direction: Building and benchmarking GUI agents for realistic computer-use
    tasks across desktop, dynamic, video-guided, and drag interfaces, with parallel
    work on training, execution-harness, and fine-grained evaluation.'
  - 'Shared research pattern: Interactive environments and fine-grained scoring are
    used to compare frontier and fine-tuned or harness-optimized agents, revealing
    failure modes in observation control, action grounding, and non-click interaction.'
  - 'Key differences: One cluster improves policy or execution harness through RL,
    weak supervision, or evidence-driven harness edits; another improves measurement
    through dynamic, video, or drag benchmarks; supervision, metrics, and interfaces
    differ.'
  - 'Trend evolution: Within the 2024-2026 frontier and top evidence concentrated
    in 2026, work is shifting from aggregate Pass@1 toward cost-accuracy, subgoal,
    interaction-type, and uncertainty signals, plus scalable training and frozen-harness
    self-improvement.'
  - 'Open questions: Whether gains transfer across platforms, model families, and
    interfaces; how agents can control observation in dynamic screens; whether uncertainty
    and reward signals remain robust under shift; and how to separate method, backbone,
    harness, and evaluation effects.'
  related_work_outline_zh:
  - 主流方向：围绕真实计算机使用任务构建GUI智能体与评测，覆盖macOS、动态界面、视频引导和拖拽交互，并探索训练与自改进方法。
  - 研究共性：使用细粒度评分和真实交互环境，比较冻结前沿模型与微调或harness优化后的智能体，以暴露观察控制、动作定位和非点击交互的失败模式。
  - 关键差异：一派通过RL、弱监督或harness演化改进模型/harness；另一派通过动态、视频或拖拽基准改进测量；监督信号、指标与接口不同。
  - 趋势演进：在2024-2026前沿内，证据集中于2026年，显示从聚合Pass@1转向成本-准确率、子目标、交互类型与不确定性信号，并趋向可扩展训练与冻结harness自改进。
  - 开放问题：方法收益能否跨平台、模型族和接口迁移；智能体如何控制动态界面观察；不确定性与奖励信号在分布偏移下是否稳健；如何分离方法、模型、harness和评测的贡献。
  literature_review:
    line_of_work_matrix:
    - line: Dynamic and multi-interface GUI task benchmarking
      what_it_solves: Measures realistic computer-use capability across desktop, dynamic
        short-video, video-guided, and drag interactions with fine-grained scoring.
      what_remains_open: Transferability beyond the specific platform or interaction
        type; multi-step trajectory and cost-accuracy evidence remains limited.
    - line: Training and self-improvement for computer-use policy learning
      what_it_solves: Reduces annotation cost or uses verifiable rewards and harness
        evidence to improve GUI grounding and task completion on frozen or fine-tuned
        backbones.
      what_remains_open: Gains may be confounded with backbone choice, task distribution,
        evaluation suite, or harness edits; ablation evidence isolating method contribution
        is missing.
    - line: Observation and grounding under non-static or non-click interfaces
      what_it_solves: Addresses dynamic content, keyframe selection, and drag-based
        action prediction where screens and interfaces change between actions.
      what_remains_open: Observation control and generalization across action interfaces
        remain weak; keyframe and drag methods are evaluated on narrow benchmarks.
    - line: Uncertainty quantification and reliability for GUI grounding
      what_it_solves: Produces post-hoc confidence and conformal spatial regions for
        single-step executable grounding decisions across vision-language model interfaces.
      what_remains_open: Cross-model and closed-source transfer is weak, and single-step
        evidence does not cover multi-step agent trajectories or distribution shift.
    consensus:
    - Realistic task suites are moving beyond aggregate success to fine-grained subgoal,
      cost-accuracy, and interaction-type signals.
    - Frozen frontier models still show clear failure modes in dynamic observation
      control and non-click interactions.
    - Training, weak supervision, and harness self-improvement each improve computer-use
      policies, but evidence about which component drives the gain is incomplete.
    - Verification signals such as deterministic rules, screenshots, repeated runs,
      and verifiable task rewards are becoming central to both evaluation and learning.
    disagreements:
    - Method-level split between editing the execution harness around frozen models
      and training the agent policy with RL or weak supervision.
    - 'Evaluation targets differ: single-step executable grounding versus multi-step
      interactive tasks; desktop versus dynamic short-video, video-guided, or drag
      interactions.'
    - 'Metrics differ: Pass@1, fine-grained subgoal scoring, cost-accuracy, or uncertainty
      and conformal coverage; this changes which failure modes become visible.'
    - 'Supervision and reward signals differ: large unannotated screenshots with curriculum
      calibration, verifiable synthesized tasks with online RL, or repeated-run evidence
      without backbone updates.'
    open_questions:
    - Can reported improvements transfer across different operating systems, interfaces,
      and model families without target-specific reranking or harness edits?
    - How should agents learn observation control to avoid over- and under-observation
      in dynamic interfaces?
    - Do uncertainty and calibration methods remain reliable across multi-step trajectories
      and distribution shifts?
    - Which gains are attributable to task synthesis, harness design, base model capability,
      or evaluation scoring rather than the proposed method?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 动态与多接口GUI任务基准评测
      解决的问题: 在桌面、动态短视频、视频引导和拖拽交互上，用细粒度评分衡量真实计算机使用能力。
      尚未覆盖: 平台或交互类型之外的迁移性；多步轨迹与成本-准确率证据仍有限。
    - 路线: 计算机使用策略的学习与自改进
      解决的问题: 通过弱监督、可验证奖励或执行框架证据，在冻结或微调骨干上改善GUI定位与任务完成。
      尚未覆盖: 收益可能与骨干选择、任务分布、评测套件或harness编辑混淆；缺少隔离方法贡献的消融证据。
    - 路线: 非静态或非点击接口下的观察与定位
      解决的问题: 处理动态内容、关键帧选择和拖拽式动作预测，弥补截图间变化的接口。
      尚未覆盖: 观察控制与跨动作接口泛化仍弱；关键帧与拖拽方法仅在较窄基准上评估。
    - 路线: GUI定位的不确定性与可靠性
      解决的问题: 为单步可执行GUI定位提供后验置信度和共形空间区域。
      尚未覆盖: 跨模型或闭源迁移较弱，单步证据未覆盖多步代理轨迹或分布偏移。
    共识:
    - 真实任务套件正从聚合成功率转向细粒度子目标、成本-准确率与交互类型信号。
    - 冻结前沿模型在动态观察控制和非点击交互上仍存在明显失败模式。
    - 训练、弱监督与harness自改进均能改善计算机使用策略，但哪个组件驱动收益仍不明确。
    - 确定性规则、截图、重复运行和可验证奖励等验证信号正成为评测与学习的核心。
    分歧:
    - 方法路线分裂为围绕冻结模型编辑执行harness，与通过RL或弱监督训练智能体策略。
    - 评测目标不同：单步可执行定位对多步交互任务；桌面对动态短视频、视频引导或拖拽交互。
    - 指标不同：Pass@1、细粒度子目标评分、成本-准确率或不确定性/共形覆盖，导致可见失败模式不同。
    - 监督与奖励信号不同：大规模未标注截图结合课程校准、可验证合成任务结合在线RL，或重复运行证据且不更新骨干。
    开放问题:
    - 报告的性能提升能否跨操作系统、接口和模型族迁移，而无需目标特定重排或harness编辑？
    - 智能体应如何学习观察控制，以避免动态界面中的过度观察和观察不足？
    - 不确定性与校准方法在多步轨迹和分布偏移下是否仍然可靠？
    - 哪些收益应归因于任务合成、harness设计、基座模型能力或评测评分，而不是所提方法？
