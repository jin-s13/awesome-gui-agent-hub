  related_work_outline:
  - 'Mainstream direction: Building end-to-end training frameworks and skill libraries
    that enable GUI agents to learn from live, multi-turn interactions with real websites
    and operating systems, moving beyond static offline datasets.'
  - 'Shared research pattern: Combining large-scale pretraining (often with weak supervision
    or unlabeled screenshots) with online reinforcement learning, and augmenting agents
    with multimodal memory structures that capture action-grounded visual context.'
  - 'Key differences: Some works focus on the training infrastructure and RL algorithm
    design (OpenForgeRL, OpenWebRL), while others emphasize knowledge representation
    through hierarchical skill libraries or crop-based memory (VISUALSKILL, AGMem).
    A separate thrust tackles data efficiency via weakly-supervised curriculum learning
    (GUICrafter), and a growing safety line audits domain-conditioned vulnerabilities.'
  - 'Trend evolution: The field is shifting from short-horizon, offline benchmarks
    to long-horizon, real-world tasks with streaming interaction and dynamic environments.
    Safety and reproducibility auditing are emerging as critical concerns, with evidence
    that frontier models exhibit domain-specific safety hardening.'
  - 'Open questions: How to achieve robust error recovery after RL training, how to
    build skill libraries that generalize across applications, whether safety can
    be made domain-agnostic, and how to evaluate agents on open-ended tasks where
    partial completion and constraint tracking matter.'
  related_work_outline_zh:
  - 主流方向：构建端到端训练框架和技能库，使GUI智能体能够从真实网站和操作系统的实时多轮交互中学习，从而超越静态离线数据集。
  - 研究共性：将大规模预训练（常结合弱监督或未标注截图）与在线强化学习相结合，并通过动作接地视觉记忆增强智能体，以捕捉多模态上下文。
  - 关键差异：部分工作聚焦于训练基础设施和RL算法设计（如OpenForgeRL、OpenWebRL），其他工作则强调通过分层技能库或裁剪记忆进行知识表示（如VISUALSKILL、AGMem）。另有路线通过弱监督课程学习解决数据效率问题（GUICrafter），而安全审计路线则揭示领域条件漏洞。
  - 趋势演进：领域正从短程离线基准转向包含流式交互和动态环境的长期真实任务。安全性和可复现性审计正成为关键关注点，前沿模型展现出领域特定的安全加固特性。
  - 开放问题：如何在RL训练后实现稳健的错误恢复，如何构建跨应用泛化的技能库，安全性能否实现领域无关化，以及如何在部分完成和约束跟踪至关重要的开放任务上评估智能体。
  literature_review:
    line_of_work_matrix:
    - line: Online multi-turn RL frameworks for GUI agents
      what_it_solves: Enables agents to learn from live interactions with websites
        and operating systems, scaling from small SFT seeds to strong performance
        through trajectory-level optimization.
      what_remains_open: Error recovery after RL training remains weak; harness design
        strongly influences trainability; scalability to thousands of tasks and diverse
        environments is not yet demonstrated.
    - line: Multimodal skill libraries and action-grounded visual memory
      what_it_solves: Captures reusable visual knowledge for UI tasks and corrects
        the failure modes of naive full-image memory, such as hidden operation blindness
        and grounding errors.
      what_remains_open: Skill construction still requires authored documentation
        and live exploration; memory retrieval may not generalize to unseen applications,
        and the interaction between skill libraries and RL fine-tuning is not studied.
    - line: Weakly-supervised pretraining from unlabeled screenshots
      what_it_solves: Reduces the dependence on expensive human annotations for GUI
        grounding, achieving competitive performance with only 0.1% of the data used
        by previous methods.
      what_remains_open: The curriculum learning stages may need careful calibration
        for each domain; performance on complex, long-horizon tasks and cross-domain
        transfer remains untested.
    - line: Safety auditing and domain-conditioned robustness evaluation
      what_it_solves: Measures the real-world susceptibility of frontier computer-using
        agents to prompt injection, revealing that safety hardening is domain-specific
        and that published high attack success rates may not replicate without optimized
        strings.
      what_remains_open: Only hand-crafted attack templates were tested; RL-optimized
        injection strings from prior work were not reproduced, so the full attack
        surface is unknown. Safety hardening does not transfer across domains.
    - line: Long-horizon real-world task benchmarks
      what_it_solves: Exposes failure modes that short-horizon benchmarks miss, such
        as constraint forgetting, mid-task information loss, guessing, and hidden
        state recovery, providing a realistic test of computer-use agents.
      what_remains_open: Current agents achieve only ~20% completion; evaluation metrics
        for partial progress and streaming interaction are still evolving, and the
        benchmark's coverage of diverse applications is limited.
    consensus:
    - Current GUI agents, even frontier models, struggle with long-horizon tasks,
      constraint tracking, and error recovery, achieving low absolute completion rates
      on realistic benchmarks.
    - Training on live environments with online multi-turn RL consistently improves
      performance over static imitation learning, and small amounts of SFT data can
      seed effective RL training.
    - Visual memory must be action-grounded rather than full-image; naive full-image
      memory increases action-level errors such as grounding mistakes and hidden operation
      blindness.
    - 'Safety properties of computer-using agents are domain-conditioned: models hardened
      against browser-based prompt injection remain vulnerable to skill injection
      in coding tasks.'
    - Reproducibility of safety evaluations is compromised when attackers use optimized
      but unpublished injection strings, making published high attack success rates
      hard to verify.
    disagreements:
    - Approaches diverge on whether to invest in training infrastructure and RL algorithms
      (end-to-end framework design) versus knowledge representation through skill
      libraries and memory architectures. The former targets general learning capability,
      while the latter aims to inject structured prior knowledge.
    - 'Evaluation settings vary significantly: some use OSWorld and its variants for
      desktop tasks, others use Online-Mind2Web and DeepShop for web shopping, and
      yet others construct custom benchmarks like CUA-World or OSExpert-Eval. This
      makes direct comparison difficult.'
    - 'The role of visual figures is debated: VISUALSKILL retains them alongside text
      as beneficial, while AGMem replaces full-image memory with action crops to reduce
      errors. The optimal granularity of visual memory remains unresolved.'
    - 'Safety benchmarks differ in attack generation: one provides hand-crafted templates,
      while prior work used RL-optimized strings. The discrepancy raises questions
      about which attack methodology reflects real threats.'
    - 'Frameworks vary in their interaction mode: some use CLI-based harnesses (Claude
      Code CLI), others use direct browser automation, and some depend on Kubernetes
      orchestration. The effect of harness choice on agent performance and trainability
      is not yet systematically compared.'
    open_questions:
    - How can RL-trained GUI agents be made robust to error recovery and dynamic state
      changes, given that current training still leaves critical failure modes such
      as hidden operation blindness and grounding errors?
    - Can multimodal skill libraries be constructed automatically and generalize across
      unseen applications, or will they always require per-app authoring and live
      exploration?
    - What is the minimal set of safety evaluations needed to ensure that a computer-using
      agent is robust across all domains, and how can we reproduce attacks that rely
      on optimized adversarial strings?
    - How should evaluation metrics for long-horizon tasks incorporate partial completion,
      streaming interaction, and constraint satisfaction, rather than relying solely
      on binary task completion?
    - To what extent does the choice of inference harness (CLI, browser automation,
      container orchestration) influence the training dynamics and final performance
      of GUI agents, and can these effects be disentangled from the learning algorithm?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 在线多轮强化学习框架
      解决的问题: 使智能体能够从与网站和操作系统的实时交互中学习，通过轨迹级优化从小规模SFT种子扩展到强大性能。
      尚未覆盖: RL训练后的错误恢复能力仍然薄弱；推理框架设计显著影响可训练性；尚未展示在数千个任务和多样化环境中的可扩展性。
    - 路线: 多模态技能库与动作接地视觉记忆
      解决的问题: 为UI任务捕获可复用的视觉知识，纠正朴素全图像记忆导致的隐藏操作盲区和接地错误等失败模式。
      尚未覆盖: 技能构建仍需人工编写文档和实时探索；记忆检索可能无法泛化到未见应用，且技能库与RL微调的交互尚未研究。
    - 路线: 从未标注截图的弱监督预训练
      解决的问题: 降低对昂贵人工标注的依赖，仅用先前方法0.1%的数据即达到竞争性GUI接地性能。
      尚未覆盖: 课程学习阶段可能需要针对每个领域仔细校准；在复杂长程任务和跨领域迁移上的性能尚未测试。
    - 路线: 安全审计与领域条件鲁棒性评估
      解决的问题: 衡量前沿计算机使用智能体对提示注入的真实易感性，揭示安全加固是领域特定的，且已发布的高攻击成功率可能因优化字符串缺失而无法复现。
      尚未覆盖: 仅测试了手工制作攻击模板；先前工作的RL优化注入字符串未复现，因此完整攻击面未知，且安全加固无法跨领域迁移。
    - 路线: 长期真实世界任务基准
      解决的问题: 暴露短程基准遗漏的失败模式，如遗忘约束、丢失任务中途信息、猜测和隐藏状态恢复，为计算机使用智能体提供真实测试。
      尚未覆盖: 当前智能体仅完成约20%的任务；用于部分进展和流式交互的评估指标仍在发展，基准对多样化应用的覆盖有限。
    共识:
    - 当前GUI智能体，即使是前沿模型，在长期任务、约束跟踪和错误恢复上仍挣扎，在真实基准上的绝对完成率低。
    - 在真实环境中使用在线多轮RL训练持续优于静态模仿学习，少量SFT数据即可有效启动RL训练。
    - 视觉记忆必须是动作接地的，而非全图像；朴素全图像记忆会增加接地错误和隐藏操作盲区等动作级错误。
    - 计算机使用智能体的安全特性是领域条件的：经浏览器安全加固的模型在编码任务中仍易受技能注入攻击。
    - 当攻击者使用优化但未公开的注入字符串时，安全评估的可复现性受损，使已发布的高攻击成功率难以验证。
    分歧:
    - 路线在投入方向上有分歧：是构建训练基础设施与RL算法（端到端框架设计），还是通过技能库和记忆架构注入结构化先验知识。前者追求通用学习能力，后者追求结构化知识表示。
    - 评估设置差异显著：有的使用OSWorld及其变体进行桌面任务，有的使用Online-Mind2Web和DeepShop进行网页购物，还有的构建如CUA-World或OSExpert-Eval的自定义基准，难以直接比较。
    - 视觉图形的作用存在争议：VISUALSKILL将其与文本一并保留视为有益，而AGMem用动作裁剪替代全图像以减少错误，视觉记忆的最优粒度尚未解决。
    - 安全基准在攻击生成方式上不同：一项使用手工制作模板，先前工作则依赖RL优化字符串，这种差异引发了对哪种攻击方法反映真实威胁的疑问。
    - 框架的交互模式各异：有的使用基于CLI的Harness（如Claude Code CLI），有的使用直接浏览器自动化，还有的依赖Kubernetes编排，Harness选择对智能体性能和可训练性的影响尚未得到系统比较。
    开放问题:
    - 如何使RL训练的GUI智能体在错误恢复和动态状态变化上具有鲁棒性，因为当前训练仍遗留隐藏操作盲区和接地错误等关键失败模式？
    - 多模态技能库能否自动构建并泛化到未见应用，还是始终需要按应用人工编写和实时探索？
    - 确保计算机使用智能体跨领域安全所需的最小安全评估集是什么，以及如何复现依赖优化对抗字符串的攻击？
    - 长期任务的评估指标应如何纳入部分完成、流式交互和约束满足，而非仅依赖二元任务完成？
    - 推理Harness的选择（CLI、浏览器自动化、容器编排）在多大程度上影响GUI智能体的训练动态和最终性能，这些影响能否与学习算法解耦？
