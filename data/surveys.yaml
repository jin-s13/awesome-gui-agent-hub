    theory; recent work defines GUI task boundaries for dynamic, drag, desktop, and
    GUI+CLI interaction.'
  - 'Shared research pattern: Papers ground analysis in screenshots and interface
    state, use fine-grained or rule/cost-aware scoring, compare open and proprietary
    vision-language backbones, and improve frozen models via external skills, harness
    edits, or data strategies.'
  - 'Key differences: Evaluation unit spans single-step grounding, end-to-end task
    completion, and dynamic cost-constrained sessions; improvement targets differ
    among model weights, skill/harness layers, and benchmark coverage; interaction
    primitives and supervision signals are heterogeneous.'
  - 'Trend evolution: The 2026 frontier shifts from click-only static tasks toward
    drag, dynamic-screen, and desktop multi-app evaluation, and from raw model comparisons
    toward frozen-model adaptation, data efficiency, and uncertainty calibration.'
  - 'Open questions: Whether single-step uncertainty helps multi-step reliability,
    whether gains transfer across platforms and model tiers, and whether missing limitation/artifact
    fields hide constraints.'
  related_work_outline_zh:
  - 主流方向：通过可执行基准、任务抽象和可靠性指标进行经验性形式化，而非独立理论证明；近期工作定义动态、拖拽、桌面及GUI+CLI交互的GUI任务边界。
  - 研究共性：以截图和界面状态为证据，采用细粒度、规则化或成本感知指标，比较开放与专有视觉语言骨干，并通过外部技能、harness或数据策略改进冻结模型。
  - 关键差异：评测单元从单步grounding到端到端任务再到动态成本受限会话；改进对象包括模型权重、外部技能/harness和基准覆盖；交互原语与监督信号多种多样。
  - 趋势演进：2026年前沿从静态点击任务转向拖拽、动态屏幕和桌面多应用评测，并从模型原始对比转向冻结模型适配、数据效率和不确定性校准。
  - 开放问题：单步不确定性是否有助于多步可靠性；技能/数据/harness增益能否跨平台和模型层级迁移；多篇限制字段缺失是否掩盖约束。
  literature_review:
    line_of_work_matrix:
    - line: Formal definitions and task abstractions (e.g., MacAgentBench, LivingScreen,
        DragOn)
      what_it_solves: Clarifies GUI-agent capability boundaries by defining executable
        task spaces for desktop, dynamic, drag, and GUI+CLI interactions.
      what_remains_open: Coverage remains platform- and interaction-specific; there
        is no unified formal account of observation control, interaction primitives,
        and score decomposition.
    - line: Scaling and sample-efficiency methods (e.g., ScaleCUA, GUICrafter)
      what_it_solves: Connects data/training strategies such as verifiable synthesis,
        weak supervision, and online RL to improved agent behavior with lower annotation
        cost.
      what_remains_open: Claims are validated on selected benchmarks; direct evidence
        that scaling or data-efficiency gains predict transfer or failure is missing.
    - line: Reliability and uncertainty framing (e.g., Argus)
      what_it_solves: Measures post-hoc confidence calibration and spatial safety
        for GUI grounding, exposing where agent predictions are untrustworthy.
      what_remains_open: Evaluation is mostly single-step grounding; cross-model,
        cross-interface, and distribution-shift robustness remain weak.
    - line: External skill and execution-harness augmentation (e.g., VISUALSKILL,
        GUI-HARVEST)
      what_it_solves: Improves frozen backbone agents by retaining multimodal procedural
        knowledge or by evidence-driven harness evolution.
      what_remains_open: Generalization beyond specific benchmarks is unclear, and
        several limitation fields are absent, making failure boundaries hard to assess.
    consensus:
    - The packet treats theory mainly through task abstractions, evaluation criteria,
      and measurable reliability properties rather than standalone formal proofs.
    - Executable benchmarks with fine-grained, rule-based, or cost-aware scoring are
      the dominant evidence for GUI agent capability.
    - Visual grounding and observation control are recurring bottlenecks, not just
      final task success.
    - Frozen-model adaptation via skills, harnesses, weak supervision, or synthesized
      tasks is a consistent route to improving agents.
    - Open-weight and proprietary models require different evaluation or uncertainty
      handling because internal state access differs.
    disagreements:
    - Whether evaluation should isolate single-step grounding, full end-to-end tasks,
      or cost-constrained dynamic sessions.
    - Whether to improve model weights via RL, external multimodal skills/harnesses,
      or data-generation and weak-supervision strategies.
    - 'Which interaction primitives matter most: click, drag, GUI+CLI, or dynamic
      observation control.'
    - 'What counts as state of the art: proprietary versus open systems, Pass@1 versus
      sub-goal/cost-aware scores, and different benchmark selections.'
    open_questions:
    - Can post-hoc uncertainty quantification from single-step grounding be made useful
      for multi-step GUI-agent trajectories?
    - Do gains from skill augmentation, harness evolution, weak supervision, or verifiable
      RL transfer across platforms and interfaces without target-specific tuning?
    - Are missing limitation and artifact fields in several papers masking negative
      results or platform-specific constraints?
    - How should over- and under-observation in dynamic interfaces be formalized,
      measured, and controlled?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 形式化定义与任务抽象（如 MacAgentBench、LivingScreen、DragOn）
      解决的问题: 通过定义桌面、动态、拖拽和 GUI+CLI 交互的可执行任务空间，澄清 GUI 智能体的能力边界。
      尚未覆盖: 覆盖范围仍受平台和交互类型限制；缺少对观察控制、交互原语和评分分解的统一形式化。
    - 路线: 数据与训练规模效率方法（如 ScaleCUA、GUICrafter）
      解决的问题: 通过可验证合成、弱监督和在线强化学习，在较低标注成本下连接数据/训练策略与智能体行为提升。
      尚未覆盖: 结果仅在选定基准上验证；缺少这些增益能否预测迁移或失败的直接证据。
    - 路线: 可靠性与不确定性框架（如 Argus）
      解决的问题: 度量 GUI 定位的后验置信度校准和空间安全，揭示模型预测不可信的位置。
      尚未覆盖: 评测主要是单步定位；跨模型、跨界面和分布偏移下的鲁棒性仍然较弱。
    - 路线: 外部技能与执行 harness 增强（如 VISUALSKILL、GUI-HARVEST）
      解决的问题: 通过保留多模态程序知识或证据驱动 harness 演化，提升冻结骨干智能体的表现。
      尚未覆盖: 在特定基准之外的泛化不明确，且多篇论文未报告限制，难以评估失效边界。
    共识:
    - 该证据包主要通过任务抽象、评测标准和可度量的可靠性属性处理理论问题，而非独立形式证明。
    - 可执行基准与细粒度、规则化或成本感知评分是 GUI 智能体能力的主要证据。
    - 视觉理解和观察控制是反复出现的瓶颈，不仅限于最终任务成功率。
    - 通过技能、harness、弱监督或合成任务对冻结模型进行适配是提升智能体的常见路线。
