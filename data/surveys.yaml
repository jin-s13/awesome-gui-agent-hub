      尚未覆盖: 证据集中在特定平台和交互类型；跨模型层级和多步轨迹评测的迁移尚未建立。
    - 路线: 多模态技能与结构化上下文管理
      解决的问题: 通过保留视觉技能工件或将上下文管理作为一级策略动作，改善定位与长时域控制。
      尚未覆盖: 构建的技能与上下文字段能否跨应用迁移，以及能否解决动态观察控制缺陷，仍未验证。
    - 路线: 可验证与弱监督的计算机使用代理训练
      解决的问题: 用可验证任务合成或未标注截图扩展训练数据或在线 rollout，降低人工标注并提升样本效率。
      尚未覆盖: 增益多为基准特定；向长时域、动态或拖拽密集型任务及系统失败模式的泛化未完全建立。
    - 路线: GUI 定位的可靠性量化与不确定性框架
      解决的问题: 为可执行 GUI 定位决策提供后验不确定性排序和共形空间区域。
      尚未覆盖: 仅覆盖单步定位；跨层级和闭源排序迁移弱，分布偏移下的校准鲁棒性未验证。
    共识:
    - 子目标完成、成本-准确性、交互类型覆盖和不确定性校准等细粒度信号，能揭示聚合通过率掩盖的代理差异。
    - 多模态或结构化上下文比非结构化屏幕或历史输入更能改善 GUI 定位和长时域行为。
    - 若能配以合适的校准或奖励结构，可验证或弱监督可大幅降低对高质量标注数据的依赖。
    - 可靠性结果具有体制依赖性：模型内证据迁移好于跨模型或跨接口迁移。
    分歧:
    - 评测目标不同：静态多应用桌面任务成功、动态屏幕成本-准确性、仅拖拽定位，或单步定位不确定性。
    - 交互模式不同：GUI+CLI 动作完成、主动观察控制、拖拽式定位，或上下文即动作管理。
    - 监督与学习不同：可验证在线强化学习任务合成、基于截图的弱监督视觉定位、少量高质量标注校准，或监督式上下文-动作轨迹。
    - 可靠性框架不同：后验不确定性量化与共形安全区域，对比更广泛的基准鲁棒性；尚无统一评测协议覆盖所有场景。
