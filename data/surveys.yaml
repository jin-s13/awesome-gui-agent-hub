  literature_review:
    line_of_work_matrix:
    - line: 'Benchmark and task abstraction: MacAgentBench, LivingScreen, DragOn'
      what_it_solves: Expands evaluation beyond static click-based GUIs to multi-app
        desktop GUI+CLI, dynamic short-video interfaces, and drag-based interaction
        primitives.
      what_remains_open: Transfer from these suites to other interfaces is not shown;
        metrics are suite-specific, and dynamic observation control remains a capability
        gap.
    - line: 'Verifiable and weakly supervised training-data scaling: ScaleCUA, GUICrafter'
      what_it_solves: Reduces human annotation or enables online RL by generating
        verifiable tasks and using unannotated screenshots for visual grounding.
      what_remains_open: Evidence is mainly on OSWorld and ScienceBoard or limited
        comparisons; broader transfer to dynamic, drag, mobile, and multi-app settings
        is not established.
    - line: 'Skill and context augmentation: VISUALSKILL, MemGUI-Agent'
      what_it_solves: Provides multimodal procedural skill artifacts and compact,
        actively managed long-horizon context to improve action grounding and workflow
        verification.
      what_remains_open: Generalization beyond the reported CLI/mobile benchmarks
        is limited; artifact construction and context-action training assumptions
        need broader validation.
    - line: 'Reliability and uncertainty framing: Argus'
      what_it_solves: Benchmarks post-hoc uncertainty quantification for GUI grounding
        and introduces conformal click regions for spatial safety.
      what_remains_open: Restricted to single-step grounding; UQ ranking transfers
        poorly across model tiers and interfaces, and conformal coverage degrades
        under distribution shift.
    consensus:
    - Current GUI-agent research is moving toward more realistic task abstractions
      and finer evaluation signals rather than only final task success.
    - Frontier VLMs still have clear gaps in dynamic observation control, drag-based
      interaction, long-horizon context, and uncertainty-calibrated reliability.
    - Targeted interventions such as skill conditioning, weak supervision, online
      RL, and explicit context management yield measurable gains over plain model
      or framework baselines.
    - Many results are reported on narrow benchmark families, so cross-benchmark and
      deployment transfer remains underevidenced.
    disagreements:
    - 'Evaluation target differs: static multi-app desktop task completion, dynamic
      short-video cost-accuracy, drag-specific interaction success, mobile long-horizon
      completion, and single-step grounding uncertainty.'
    - 'Supervision and training strategy differs: verifiable online RL, weak screenshot-based
      supervision, inference-time multimodal skill retrieval, and supervised context-action
      management.'
    - 'Interaction-mode focus differs: GUI+CLI composition, drag primitives, dynamic
      interface observation, and long-horizon mobile action history are emphasized
