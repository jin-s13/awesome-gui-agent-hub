  related_work_outline_zh:
  - 主流方向：构建大规模、可验证的GUI/OS自动化基准，引入细粒度评分、动态或视频界面和基准代理；2026年前沿强调超越总体成功率的可靠性与效率。
  - 研究共性：构建可执行的桌面、浏览器、Docker或视频关联任务，运行多种当前代理/模型，并加入子目标完成、成本准确性、不确定性或迁移增益等评估信号。
  - 关键差异：环境范围不同，从静态桌面到动态短视频和视频引导交互；评估目标不同，从单步定位到多步工作流；改进路径不同，包括弱监督、合成强化学习、harness优化和多模态技能检索。
  - 趋势演进：证据集中在2026年，可见趋势处于当前前沿内：从静态Pass@1转向动态观察控制、可验证任务生成、样本高效训练和不确定性/可靠性评估。
  - 开放问题：真实动态部署接口覆盖、跨模型不确定性排序迁移、代理指标与下游效用的一致性，以及生成任务基准的稳定性仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: Real-world and dynamic GUI task suite construction
      what_it_solves: Creates executable task distributions across desktop, browser,
        video, and OS environments so GUI agents can be compared under verifiable
        conditions.
      what_remains_open: Coverage remains bounded by specific platforms, apps, or
        interface types; dynamic settings beyond short-video and multi-step trajectory
        reliability are under-covered.
    - line: Fine-grained and reliability-aware evaluation metrics
      what_it_solves: Moves evaluation beyond aggregate success by scoring sub-goal
        completion, observation efficiency, uncertainty ranking, and calibrated action
        coverage.
      what_remains_open: Proxy metrics may not align with user-facing downstream outcomes;
        uncertainty rankings and conformal coverage degrade across models, interfaces,
        and distribution shifts.
    - line: Verifiable task synthesis and benchmark-driven agent improvement
      what_it_solves: Uses verifiers, synthetic tasks, weak supervision, harness optimization,
        or multimodal skill retrieval to improve agent performance and sample efficiency.
      what_remains_open: Conclusions depend on benchmark-specific artifacts and generated
        task distributions; transfer, implementation stability, and compute-budget
        sensitivity remain unverified.
    consensus:
    - Executable desktop, browser, or Docker environments with deterministic or verifiable
      reward signals are treated as necessary for reproducible GUI-agent evaluation.
    - Aggregate success alone hides meaningful differences; sub-goal completion, information
      efficiency, and uncertainty or coverage metrics expose extra failure modes.
    - Frontier agents still do not reach human-level performance on dynamic interfaces
      and commonly fail through over- or under-observation.
    - Benchmark-driven improvement, such as skill augmentation, synthetic tasks, weak
      supervision, or harness edits, can lift frozen or open agents without retraining
      the backbone.
    disagreements:
    - Evaluation setting differs from static desktop tasks to living-screen short-video
      and video-guided interactions, changing which interface dynamics are stressed.
    - 'Evaluation target differs: some work scores single-step GUI grounding with
      uncertainty, while others score multi-step task completion and sub-goal progression.'
    - 'Improvement signal differs: unannotated screenshots, verifiable synthetic RL
      tasks, repeated-run harness diagnosis, and retrieved multimodal skills make
      different assumptions about available supervision and artifacts.'
    - 'Metrics differ: pass scores, cost-accuracy, uncertainty ranking, conformal
      coverage, and fine-grained checkpoint scores can rank the same model differently.'
    open_questions:
    - Do current GUI/OS benchmark task distributions cover real deployment interfaces
      beyond the specific apps, platforms, and dynamic interface types tested?
    - Which proxy metrics are most aligned with downstream user decisions when ranking
      GUI/OS automation agents?
    - Under what conditions can uncertainty rankings and calibrated action regions
      transfer across models, interfaces, and multi-step trajectories rather than
      requiring target-specific reranking?
    - How stable are conclusions from synthetic or generated task suites across implementations,
      compute budgets, and repeated runs?
    - What metric or environment change best captures observation-control failure,
      since frontier agents still over-observe or under-observe dynamic content?
    - Several top records include empty limitation fields, so negative results and
      boundary conditions remain underdocumented as a verification gap.
  literature_review_zh:
    研究路线矩阵:
    - 路线: 真实与动态GUI任务套件构建
      解决的问题: 创建桌面、浏览器、视频和操作系统环境中的可执行任务分布，使GUI代理在可验证条件下可比。
      尚未覆盖: 覆盖仍受特定平台、应用或界面类型限制；短视频之外的动态设置及多步轨迹可靠性覆盖不足。
    - 路线: 细粒度与可靠性评估指标
      解决的问题: 通过子目标完成、观察效率、不确定性排序和校准动作覆盖，使评估超越总体成功率。
      尚未覆盖: 代理指标与用户下游结果的对齐尚不明确；不确定性排序和共形覆盖在跨模型、跨接口及分布偏移时会退化。
    - 路线: 可验证任务合成与基准驱动的代理改进
      解决的问题: 通过可验证器、合成任务、弱监督、harness优化或多模态技能检索提升代理性能与样本效率。
      尚未覆盖: 结论依赖基准特定工件和生成任务分布；迁移、实现稳定性和算力预算敏感性仍未验证。
    共识:
    - 可执行的桌面、浏览器或Docker环境以及确定性或可验证奖励信号，被视为可复现GUI代理评测的必要条件。
    - 仅看总成功率会掩盖重要差异；子目标完成、信息效率和不确定性或覆盖指标能暴露额外失败模式。
    - 前沿代理在动态界面上仍达不到人类水平，常见失败是过度观察或观察不足。
    - 技能增强、合成任务、弱监督或harness编辑等基准驱动改进可在不重训骨干模型的情况下提升代理表现。
    分歧:
    - 评测设置不同：从静态桌面任务到动态短视频和视频引导交互，对不同界面动态的考验不同。
    - 评测目标不同：有的考察单步GUI定位及其不确定性，有的考察多步任务完成和子目标进展。
    - 改进信号不同：未标注截图、可验证合成强化学习任务、重复运行harness诊断和检索式多模态技能对监督与工件假设不同。
    - 指标不同：通过分数、成本准确性、不确定性排序、共形覆盖和细粒度检查点分数可能对同一模型给出不同排名。
    开放问题:
    - 当前GUI/OS基准任务分布是否覆盖了具体应用、平台和动态接口测试之外的部署场景？
    - 在GUI/OS自动化代理排名中，哪些代理指标与用户下游决策最为一致？
    - 不确定性排序和校准动作区域在哪些条件下可跨模型、接口和多步轨迹迁移，而不必针对目标重新排序？
    - 合成或生成任务套件的结论在实现、算力预算和重复运行下有多稳定？
    - 前沿代理仍会过度或不足观察动态内容，哪种指标或环境变化最能捕捉观察控制失败？
    - 若干顶部记录缺少局限性说明，因此负面结果与边界条件作为验证缺口仍未充分记录。
