  related_work_outline:
  - 'Mainstream direction: Constructing benchmarks that cover more realistic and diverse
    GUI interactions—desktop macOS, short-video platforms, drag actions, and video-guided
    tasks—and developing fine-grained, multi-dimensional evaluation metrics beyond
    task success rate.'
  - 'Shared research pattern: Using deterministic rule-based environments or verifiable
    containers to enable automatic, reproducible evaluation while providing capability-level
    diagnostics (sub-goal completion, cost-accuracy, uncertainty) that reveal specific
    agent weaknesses.'
  - 'Key differences: Benchmarks vary in the interaction modality they target (static
    vs. dynamic screens, click vs. drag, video guidance vs. desktop workflows) and
    in the granularity of evaluation—from macro success to sub-step completion, information
    efficiency, and uncertainty quantification.'
  - 'Trend evolution: Over 2024–2026, the frontier moves from static web/mobile tasks
    toward complex desktop operating systems, dynamic content platforms, and video-guided
    agent tasks; evaluation shifts from a single pass/fail score to multi-dimensional
    reliability diagnostics, and task generation is becoming more automated.'
  - 'Open questions: How to align proxy metrics with real-world user satisfaction
    and safety, how to ensure uncertainty quantification transfers across models and
    interfaces, and whether automatically synthesized tasks retain the difficulty
    and distribution of human-annotated benchmarks.'
  related_work_outline_zh:
  - 主流方向：构建覆盖更真实、多样化 GUI 交互的基准——包括 macOS 桌面、短视频平台、拖拽操作和视频引导任务——并发展超越任务成功率的多维度细粒度评估指标。
  - 研究共性：使用确定性规则环境或可验证容器实现自动、可复现的评估，同时提供能力层面的诊断（子目标完成、成本-准确性、不确定性），以揭示代理的具体弱点。
  - 关键差异：基准在目标交互模态（静态 vs 动态屏幕、点击 vs 拖拽、视频引导 vs 桌面工作流）和评估粒度（从宏观成功到子步骤完成、信息效率、不确定性量化）上存在差异。
  - 趋势演进：2024–2026 年间，前沿从静态网页/移动任务转向复杂桌面操作系统、动态内容平台和视频引导代理任务；评估从单一通过/失败分数转向多维度可靠性诊断，任务生成也变得更加自动化。
  - 开放问题：如何使代理指标与真实用户满意度和安全性对齐，如何确保不确定性量化在跨模型和跨界面时迁移，以及自动合成任务是否能保持人工标注基准的难度和分布。
  literature_review:
    line_of_work_matrix:
    - line: Diverse real-world environment benchmark design
      what_it_solves: Expands agent evaluation from simplified click-based tasks to
        realistic scenarios involving multi-application, multi-modal interaction (drag,
        CLI+GUI), dynamic content, and video guidance, improving ecological validity
        of task distributions.
      what_remains_open: Most benchmarks remain confined to a single platform or application
        type, with unknown cross-environment generalization; key capabilities such
        as observation control in dynamic interfaces lack systematic evaluation; task
        difficulty calibration and coverage of rare long-tail interactions are still
        incomplete.
    - line: Fine-grained evaluation and reliability diagnostics
      what_it_solves: Goes beyond overall success rate by providing sub-goal completion,
        cost-accuracy, and uncertainty quantification metrics, exposing specific failure
        modes in grounding, planning, and observation control, and measuring agent
        reliability and risk.
      what_remains_open: Alignment between these proxy metrics and the downstream
        decisions or safety guarantees users actually care about is not yet established;
        uncertainty quantification ranking transfer is weak across model tiers and
        interfaces, and calibrated conformal coverage degrades under distribution
        shift.
    - line: Efficient benchmark construction and automatic verification
      what_it_solves: Reduces human annotation effort through deterministic rule-based
        evaluation, verifiable environment synthesis (e.g., Docker), and programmatic
        task generation, enabling scalable and reproducible benchmarking.
      what_remains_open: Quality of automatically synthesized tasks in matching real
        user intent distributions and avoiding spurious artifacts is not fully validated;
        weakly-supervised or generated tasks lack standardized difficulty verification,
        and the stability of benchmark conclusions across implementation budgets remains
        under-studied.
    consensus:
    - Benchmarks must move closer to real-world usage, including complex multi-app
      workflows and dynamic content, rather than relying on simplified simulators.
    - A single pass/fail score is insufficient; fine-grained, multi-dimensional metrics
      are necessary to uncover specific capability deficits in GUI agents.
    - Deterministic rule-based evaluation and verifiable environments are critical
      for reproducible and scalable benchmarking.
    - Current agents exhibit consistent weaknesses in dynamic observation control,
      drag interactions, and video-guided tasks, indicating missing capabilities.
    - Open-source, reproducible benchmark artifacts and code are essential for fair
      comparison and rapid progress.
    disagreements:
    - 'The scope of target interactions: some benchmarks focus on desktop productivity
      suites, others on short-video platforms, drag-based editing, or video-guided
      navigation, without a unified taxonomy covering all interaction types.'
    - 'The choice of evaluation metrics: works differ in emphasizing sub-goal completion,
      information efficiency, or uncertainty calibration, and there is no agreed-upon
      standard for combining these dimensions into a single reliability score.'
    - 'Task generation philosophy: human-designed tasks (crowdsourced or expert-curated)
      versus automatically synthesized tasks (rule-based or agent-generated) differ
      in presumed authenticity, with limited evidence on which paradigm better predicts
      real-world performance.'
    - 'Level of assessment: some benchmarks evaluate only single-step grounding, while
      others measure multi-step trajectories or skill usage, making cross-benchmark
      comparison difficult.'
    open_questions:
    - How can we build a unified benchmark that covers static, dynamic, drag, and
      video-guided interactions, and still allows fair comparison across heterogeneous
      agent architectures?
    - What evidence is needed to connect fine-grained proxy metrics (e.g., sub-goal
      completion, cost-accuracy, conformal prediction sets) to user satisfaction and
      safety in deployed agent systems?
    - Given the poor transferability of uncertainty quantification rankings across
      model classes and interfaces, how can we design robust reliability diagnostics
      that generalize without per-target re-calibration?
    - Under what conditions do automatically synthesized tasks produce benchmark conclusions
      that are consistent with those from human-annotated tasks, and how should we
      measure and control task validity?
    - How stable are current benchmark results across different implementations and
      compute budgets, and what reporting standards are needed to ensure reproducibility?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 多样化真实环境基准设计
      解决的问题: 将代理评估从简化的点击任务扩展到包含多应用、多模态交互（拖拽、CLI+GUI）、动态内容和视频引导的真实场景，提升任务分布的生态效度。
      尚未覆盖: 大多数基准仍局限于单一平台或应用类型，跨环境泛化性未知；动态界面中的观察控制等关键能力缺乏系统评估；任务难度校准和稀有长尾交互的覆盖仍不完整。
    - 路线: 细粒度评估与可靠性诊断
      解决的问题: 超越整体成功率，通过子目标完成、成本-准确性和不确定性量化，揭示代理在定位、规划和观察控制中的具体失败模式，测量代理的可靠性和风险。
      尚未覆盖: 这些代理指标与用户真正关心的下游决策和安全性之间的一致性尚未建立；不确定性量化排名在跨模型层级和接口间的迁移性弱，校准后的共形覆盖度在分布偏移下下降。
    - 路线: 高效基准构建与自动验证
      解决的问题: 通过确定性规则评估、可验证环境合成（如 Docker）和程序化任务生成，减少人工标注，实现可扩展、可复现的基准测试。
      尚未覆盖: 自动合成任务是否与真实用户意图分布一致并避免虚假特征尚未充分验证；弱监督或生成任务缺乏标准化的难度验证，且基准结论在不同实现预算下的稳定性研究不足。
    共识:
    - 基准必须更贴近真实使用场景，包括复杂多应用工作流和动态内容，而非依赖简化模拟器。
    - 单一通过/失败分数不足，需要细粒度、多维度指标来揭示 GUI 代理的具体能力缺陷。
    - 确定性规则评估和可验证环境对于可复现和可扩展的基准测试至关重要。
    - 当前代理在动态观察控制、拖拽交互和视频引导任务中表现出一致的弱点，表明存在能力缺失。
    - 开源、可复现的基准工件和代码对于公平比较和快速进步不可或缺。
    分歧:
    - 目标交互范围：有的基准聚焦桌面办公套件，有的聚焦短视频平台、拖拽式编辑或视频引导导航，缺乏覆盖所有交互类型的统一分类法。
    - 评估指标选择：不同工作侧重子目标完成、信息效率或不确定性校准，没有公认的标准将这些维度组合成单一可靠性分数。
    - 任务生成哲学：人工设计任务（众包或专家策划）与自动合成任务（基于规则或代理生成）在真实度上存在分歧，且缺乏证据表明哪种范式更能预测真实世界表现。
    - 评测层次：有的基准仅评测单步定位，有的则测量多步轨迹或技能使用，导致跨基准比较困难。
    开放问题:
    - 如何构建一个统一基准，同时覆盖静态、动态、拖拽和视频引导交互，并允许对异构代理架构进行公平比较？
    - 需要哪些证据将细粒度代理指标（如子目标完成、成本-准确性、共形预测集）与部署中用户满意度和安全性联系起来？
    - 鉴于不确定性量化排名在跨模型类别和接口间迁移性差，如何设计鲁棒的可靠性诊断方法，使其无需针对每个目标重新校准？
    - 在什么条件下自动合成任务能产生与人工标注任务一致的基准结论，以及如何测量和控制任务有效性？
    - 当前基准结果在不同实现和算力预算下是否稳定，需要哪些报告标准来确保可复现性？
