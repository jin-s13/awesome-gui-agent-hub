    - 可靠性目标：不确定性校准、欺诈检测、提示注入安全或奖励噪声各有不同失败模型。
    - 部署设置：可访问内部状态的开源模型与闭源前沿API不同；跨设置迁移较弱。
    开放问题:
    - 哪种标准化评测协议能让单步、多步、浏览器、移动和编码设置下的GUI智能体结果可比较？
    - 不确定性与安全抗性是否能在不做目标特定重评测的情况下跨模型层级迁移？
