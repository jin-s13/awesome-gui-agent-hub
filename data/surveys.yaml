  related_work_outline_zh:
  - 主流方向：围绕桌面、移动、网页、动态短视频、拖拽和反欺诈等具体 GUI 应用场景构建基准，并用技能库、记忆编译、历史感知评判等方式增强代理。
  - 研究共性：以可执行任务集评估代理，关注成功率之外的子目标、信息效率、执行速度与错误拦截；用应用特定知识或历史状态弥补端到端模型不足。
  - 关键差异：交互模态不同（点击/拖拽/GUI+CLI/动态观察）；增强信号不同（视觉技能、状态机程序、历史摘要与视觉校验）；评测目标不同（Pass@1、成本-准确率、良性召回）。
