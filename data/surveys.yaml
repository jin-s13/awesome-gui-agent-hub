  literature_review:
    line_of_work_matrix:
    - line: Skill and replayable memory layers for computer-use agents (e.g., VISUALSKILL,
        EchoPath)
      what_it_solves: Reduces token cost, execution time, and grounding errors by
        storing validated multimodal workflows or callable trajectory memories for
        reuse.
      what_remains_open: Generalization beyond deterministic preconditions, per-application
        skill construction, and dynamic UI changes.
    - line: Weakly supervised and reinforcement-learning training frameworks for GUI
        agents (e.g., GUICrafter, OpenForgeRL, OpenWebRL)
      what_it_solves: Lowers annotation requirements and enables end-to-end policy
        optimization on live websites, harness calls, or unannotated screenshots.
      what_remains_open: Error recovery remains weak and trainability varies with
        harness and environment design.
    - line: Generative vision-language architectures for GUI agents (e.g., LLaDA-UI)
      what_it_solves: Provides a block-wise diffusion GUI agent for grounding and
        navigation across mobile, desktop, and web platforms.
      what_remains_open: Inference-efficiency tradeoffs and evidence for stable long-horizon
        deployment remain limited in the packet.
    - line: Step-level and domain-specific evaluation environments (e.g., Desktop-Delta
        Bench, OSWorld-Science)
      what_it_solves: Measures GUI transition understanding and scientific software
        workflow completion beyond end-task success.
      what_remains_open: Offline evaluation gaps, Linux and action-vocabulary restrictions,
        and limited live dynamic coverage.
    consensus:
    - The field is shifting from single-frame grounding to full trajectories, state
      verification, and end-to-end execution success.
    - Environment-grounded signals, reusable skills, and validated trajectory memory
      are central mechanisms for improving reliability and cost.
    - Evaluation increasingly includes execution outcomes and step-level diagnostics
      rather than static input-output matching.
    - System and harness design materially affects trainability, inference cost, and
      agent behavior.
    disagreements:
    - 'Supervision mode varies: weakly supervised screenshots with RL calibration,
      online multi-turn RL on live websites, harness-call logging for RL, and deterministic
      trajectory replay.'
    - 'Representation choices differ: multimodal skill artifacts with visual figures,
      parameterized callable memories, block-wise diffusion generation, and training
      proxy records.'
    - 'Evaluation targets differ: end-to-end success, step-level GUI transition understanding,
      and domain-specific scientific software workflows.'
    - 'Deployment settings differ: offline desktop or web diagnostics, live browser
      and website sessions, containerized Kubernetes orchestration, and scientific
      desktop applications.'
    open_questions:
    - Can error recovery be substantially improved by current online RL or memory
      mechanisms?
    - Does offline step-level diagnostic performance predict live, long-horizon task
      success?
    - How can skill and memory systems generalize across applications, operating systems,
      and dynamic UIs without strict deterministic preconditions?
    - How should harness design and policy capability be isolated in evaluation and
      training comparisons?
