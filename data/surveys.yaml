  related_work_outline_zh:
  - 主流方向：构建可运行的端到端GUI代理系统，采用基于截图的原生交互和在线强化学习，并配备可扩展的训练基础设施。
  - 研究共性：引入框架或记忆机制提升代理性能，并在OSWorld、Online-Mind2Web、WebVoyager等基准上进行评估。
  - 关键差异：视觉记忆设计（全图、动作接地裁剪、多模态技能工件）、训练范式（弱监督课程学习、在线RL、大规模监督微调）以及安全评估目标。
  - 趋势演进：2024–2026年间，前沿从静态数据集的离线训练转向在真实环境中的在线RL，从单体代理转向模块化、可训练、具有专用记忆和安全诊断的框架。
