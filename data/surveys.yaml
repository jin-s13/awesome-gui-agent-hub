  related_work_outline:
  - 'Mainstream direction: The bounded evidence emphasizes empirical GUI-agent benchmarks
    and improvement methods rather than standalone theory. Work is converging on realistic,
    dynamic, multimodal computer-use settings, with benchmarks that diagnose fine-grained
    failures and methods that improve agents without full retraining or expensive
    annotation.'
  - 'Shared research pattern: Each paper defines a gap in GUI task coverage, interaction
    type, or reliability; builds an environment, dataset, or optimization loop; evaluates
    open and proprietary models; and reports both aggregate success and diagnostic
    evidence such as sub-goal completion, observation cost, or uncertainty ranking.'
  - 'Key differences: Some contributions are evaluation-first, targeting desktop CLI+GUI,
    dynamic short-video, drag interactions, or uncertainty grounding; others are improvement-first,
    using multimodal skill libraries, frozen-harness optimization, verifiable task
    synthesis with online RL, or weak supervision from unannotated screenshots.'
  - 'Trend evolution: Top evidence is concentrated in 2026, so the observed trend
    is current-frontier: from click-focused static tasks toward dynamic observation
    control, fine-grained and cost-aware metrics, multimodal skill artifacts, verifiable
    synthetic tasks, and uncertainty-aware safety calibration.'
  - 'Open questions: Cross-environment transfer, multi-step uncertainty, generalization
    of observation control, missing limitation and reproducibility evidence, and whether
    weak or synthetic training methods can match strong frozen benchmarks under controlled
    budgets remain open.'
  related_work_outline_zh:
  - 主流方向：证据集中在真实、动态、多模态的GUI智能体基准与改进方法，而非单独理论。主要收敛于诊断细粒度失败，并在不完整重训或昂贵标注下提升能力。
  - 研究共性：定义任务覆盖、交互类型或可靠性缺口，构建环境、数据、指标或优化流程，评估开放与专有模型，同时报告整体成功率和诊断证据。
  - 关键差异：有的偏评测，覆盖桌面CLI+GUI、动态短视频、拖拽或不确定性定位；有的偏改进，采用多模态技能库、冻结harness优化、可验证任务合成与在线RL，或未标注截图弱监督。
  - 趋势演进：主要证据集中于2026年，属当前前沿：从静态点击任务转向动态观察控制、细粒度与成本意识指标、多模态技能、可验证合成任务及不确定性安全校准。
  - 开放问题：跨环境迁移、多步不确定性、观察控制泛化、若干研究限制与复现证据缺失，以及弱监督或合成训练在受控预算下能否匹敌强冻结基准。
  literature_review:
    line_of_work_matrix:
    - line: Real-world, dynamic, and interaction-specific GUI benchmarking
      what_it_solves: Specifies task suites, environments, and fine-grained or cost-aware
        metrics to reveal gaps such as sub-goal completion, observation control, drag
        grounding, and uncertainty calibration.
      what_remains_open: Coverage remains tied to specific platforms or single-step
        settings; missing limitation details and limited cross-benchmark generalization
        reduce reliability.
    - line: Improving frozen or sample-efficient GUI agents through skills, harnesses,
        and synthetic tasks
      what_it_solves: Uses multimodal skill artifacts, evidence-driven harness edits,
        verifiable task synthesis with online RL, or weak supervision from unannotated
        screenshots to improve performance and data efficiency.
      what_remains_open: Transfer beyond reported benchmarks is only partially tested;
        failure mechanisms, limitation evidence, and reproducibility details are thin
        or missing for several methods.
    - line: Uncertainty-aware evaluation and safety/calibration for GUI grounding
      what_it_solves: Benchmarks post-hoc uncertainty quantification across models
        and datasets, and constructs conformal click regions for spatial safety.
      what_remains_open: Single-step grounding results do not cover multi-step trajectories;
        cross-model and cross-interface ranking transfer is weak under distribution
        shift.
    - line: Task/interaction assumption formalization
      what_it_solves: Defines assumptions for dynamic living-screen interfaces and
        bounded evaluation settings such as observation control and executable grounding.
      what_remains_open: Formal assumptions are not yet connected to direct empirical
        validation showing that they predict real model behavior or deployment failures.
    consensus:
    - Aggregate task success can hide meaningful sub-goal or cost-accuracy differences
      among GUI agents.
    - Multimodal skill or knowledge artifacts improve UI identification and workflow
      verification over text-only or no-skill baselines.
    - Current agents lack reliable observation control and cross-model uncertainty
      transfer, especially for dynamic interfaces and closed-source models.
    - Fine-grained, rule-based, or cost-aware evaluation is necessary because similar
      pass rates can mask different capability profiles.
    disagreements:
    - 'Evaluation target: static or click-only versus dynamic short-video versus desktop
      GUI+CLI versus drag-specific versus single-step grounding.'
    - 'Improvement locus: visual multimodal skills versus frozen harness optimization
      versus verifiable task synthesis and online RL versus weak supervision from
      unannotated screenshots.'
    - 'Supervision signal: deterministic task success or checkpoints, verifiable rollout
      success, visual contextual signals, or post-hoc uncertainty calibration.'
    - 'Interaction and deployment setting: multi-step computer-use trajectories versus
      single-step executable grounding, and open-weight versus closed-source observable
      internals.'
    open_questions:
    - Can skill, harness, or synthetic-task gains transfer across operating systems,
      dynamic web or video interfaces, and drag-rich applications without target-specific
      re-optimization?
    - How should uncertainty and safety be defined for multi-step GUI trajectories
      rather than only single-step grounding?
    - Do observation-control limitations found on short-video platforms generalize
      to other rapidly changing or event-driven interfaces?
    - What verification gaps exist in the visible evidence for code, datasets, limitations,
      and baseline details, and how do they affect reported improvements?
    - Can weak supervision and verifiable synthesis produce training signals as informative
      as dense human-annotated click or drag traces under controlled budgets?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 真实世界、动态及交互特定的GUI基准构建
      解决的问题: 通过任务套件、环境和细粒度或成本意识指标，揭示子目标完成、观察控制、拖拽定位和不确定性校准等缺口。
      尚未覆盖: 覆盖范围仍绑定特定平台或单步设置；若干研究缺少局限性说明，跨基准泛化证据不足。
    - 路线: 通过技能、harness与合成任务改进冻结或样本高效的GUI智能体
      解决的问题: 利用多模态技能工件、证据驱动的harness编辑、可验证任务合成加在线RL，或未标注截图弱监督，提升性能与数据效率。
      尚未覆盖: 对报告基准之外的迁移仅部分验证；若干方法的失败机制、局限性和复现证据较薄或缺失。
    - 路线: GUI定位的不确定性感知评估与安全或校准
      解决的问题: 跨模型和数据集评估后验不确定性量化，并构造共形点击区域以保障空间安全。
      尚未覆盖: 单步定位结果不能覆盖多步轨迹；跨模型和跨接口的排序迁移在分布偏移下较弱。
    - 路线: 任务或交互假设形式化
      解决的问题: 为动态屏幕界面和评估边界定义假设，例如观察控制和可执行定位。
      尚未覆盖: 形式化条件尚未与其预测真实模型行为或部署失败的直接经验验证相连接。
    共识:
    - 总体任务成功率可能掩盖GUI智能体在子目标完成和成本准确性上的有意义的差异。
    - 多模态技能或知识工件相比纯文本或无技能基线，能改善UI元素识别和工作流状态验证。
    - 当前智能体在动态界面和闭源模型上缺少可靠的观察控制与跨模型不确定性迁移。
    - 需要细粒度、确定规则或成本感知的评估，因为相近通过率可能掩盖不同的能力轮廓。
    分歧:
    - 评测目标：静态或仅点击、动态短视频、桌面GUI+CLI、拖拽特定、单步定位等设置不同。
    - 改进着力点：视觉多模态技能、冻结harness优化、可验证任务合成与在线RL、未标注截图弱监督。
    - 监督信号：确定性任务成功或检查点、可验证轨迹成功、视觉上下文信号，或后验不确定性校准。
    - 交互与部署设置：多步计算机使用轨迹与单步可执行定位，开源权重与闭源可观察内部状态不同。
    开放问题:
    - 技能、harness或合成任务带来的提升能否跨操作系统、动态网页或视频界面和拖拽密集应用迁移而不需目标特定再优化？
    - 多步GUI轨迹的不确定性和安全应如何定义，而非仅评估单步定位？
    - 短视频平台上发现的观察控制局限能否推广到其他快速变化或事件驱动的界面？
    - 可见证据中代码、数据集、局限性和基线信息存在哪些验证缺口，它们是否影响所报告改进的可靠性？
    - 弱监督和可验证合成能否在受控预算下产生与密集人工标注的点击或拖拽轨迹同样有用的训练信号？
