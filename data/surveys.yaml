  literature_review:
    line_of_work_matrix:
    - line: Taxonomy and roadmap synthesis
      what_it_solves: Mapping a fragmented field into directions, milestones, and
        research gaps for GUI agents.
      what_remains_open: The top-ranked evidence is mostly methods and benchmarks,
        so systematic survey evidence is missing; conclusions may reflect selective
        examples rather than full literature coverage.
    - line: Comparative evaluation synthesis
      what_it_solves: Summarizing how different evaluation choices shape conclusions
        across GUI agent papers.
      what_remains_open: Protocols and metrics across OSWorld-Verified, ScienceBoard,
        ScreenSpot-Pro, MobileWorld, WindowsAgentArena, VG-GUIBench, and FraudSMSWalker
        are not unified; cross-setting compatibility is unverified.
    - line: Open problem and gap mapping
      what_it_solves: Turning broad literature coverage into concrete next research
        questions for GUI agents.
      what_remains_open: Prioritization among reliability, safety, long-horizon context,
        grounding, and cross-domain migration still lacks evidence-grounded ranking.
    consensus:
    - Benchmark-defined task completion and grounding accuracy are the dominant evaluation
      currency across GUI agent studies.
    - Recent work increasingly augments frozen or moderately sized vision-language
      backbones with external adaptation, such as harness optimization, dense grounding
      data, verifiable task synthesis, or context management, rather than only scaling
      the base model.
    - Reproducibility and reliability signals such as code, data artifacts, uncertainty
      benchmarks, and safety audits are becoming part of the evidence base, but they
      are reported inconsistently.
    - Safety and reliability findings are evaluated in narrow conditions and do not
      yet show stable transfer across browser, desktop, mobile, video, and coding
      domains.
    disagreements:
    - One subset uses online RL and task synthesis to scale agent capabilities end-to-end,
      while another keeps models frozen and shifts learning into the execution harness
      or supervision pipeline.
    - 'Evaluation granularity differs: single-step grounding under uncertainty versus
      long-horizon task completion; conclusions may not be comparable because protocols
      and benchmarks differ.'
    - Safety studies split between attack resistance under prompt injection and fraud-detection
      decision making, with different threat models and evidence constraints.
    - Interaction surfaces vary across desktop, mobile, browser, SMS-to-webpage, and
      video-guided tasks, so representations and failure modes are not directly aligned.
    open_questions:
    - Which adaptation strategy, including verifiable RL, dense grounding supervision,
      harness optimization, or context management, best improves cross-benchmark generalization
      without overfitting to one evaluation suite?
    - How do uncertainty quantification methods transfer across model families and
      GUI interfaces, especially from open-weight to closed-source models?
    - What would a systematic GUI agent survey or taxonomy need to add beyond these
      method and benchmark results to prioritize open problems?
    - Can domain-conditioned safety findings be reproduced when optimized attack strings,
      rather than only hand-crafted templates, are available?
