  related_work_outline:
  - 'Mainstream direction: Constructing comprehensive GUI automation benchmarks that
    cover diverse platforms, interaction modes, and dynamic environments, paired with
    fine-grained, multi-dimensional evaluation metrics.'
  - 'Shared research pattern: Moving beyond pass/fail to probe sub-goal completion,
    cost-accuracy trade-offs, and reliability; leveraging both real-world tasks and
    synthetic data generation.'
  - 'Key differences: Benchmarks target different interaction primitives (click, drag,
    video-guided), interface types (desktop, web, short-video), and evaluation dimensions
    (accuracy, efficiency, uncertainty).'
  - 'Trend evolution: Within 2024–2026, the frontier shifts from static desktop/web
    tasks to dynamic, multimodal, and specialized interactions, with growing emphasis
    on robustness, calibration, and data-efficient agent training.'
  - 'Open questions: Whether benchmark distributions capture long-horizon and open-ended
