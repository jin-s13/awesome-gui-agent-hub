      尚未覆盖: 评测常限于单一平台或单步；多步轨迹、跨界面泛化和部署级验证仍缺乏证据。
    - 路线: 数据与强化学习规模化
      解决的问题: 通过可验证任务合成或未标注截图弱监督来扩展训练，降低标注成本并提高采样效率。
      尚未覆盖: 模拟环境之外的可验证性、弱监督质量以及从训练任务到真实部署的迁移尚未被直接证实。
    - 路线: 技能与上下文管理
      解决的问题: 组织多模态或结构化程序知识，使代理能够检索技能并压缩长时上下文，而非被动累积历史。
      尚未覆盖: 仅在狭窄应用或基准上评估；分布外泛化及与其他代理组件的交互仍未解决。
    - 路线: 交互模式抽象
      解决的问题: 将代理形式化从静态点击任务扩展到动态屏幕和拖拽式操作。
      尚未覆盖: 证据局限于短视频或拖拽领域；人类级成本准确率和观察控制尚未达到。
    - 路线: 可靠性与不确定性框架
      解决的问题: 为 GUI 定位提供置信度或空间校准，以支持更安全的代理决策。
      尚未覆盖: 现有证据主要是单步；多步轨迹、闭源模型以及分布或界面不匹配会使校准下降。
    共识:
    - GUI 代理被视为多模态系统，必须在屏幕或界面中实现感知定位并输出可执行动作，而不仅回答问题。
    - 评测正从单一任务成功指标转向细粒度子目标、成本准确率/观察效率、长时上下文和不确定性等多个维度。
    - 训练规模扩展是共同关注点；合成可验证任务和弱标注截图被用于减少对昂贵人工标注的依赖。
    - 当前证据显示，前沿代理在动态、拖拽、长时或不确定定位等场景中尚未完全达到可靠性。
    分歧:
    - 评测粒度不同：有的工作关注单步定位或点击/拖拽正确性，有的则评估长时任务完成和信息成本。
    - 监督信号不同：可验证奖励合成、未标注截图弱监督和带上下文动作标注轨迹分别用于不同路线。
    - 表示方式不同：视觉技能工件、结构化上下文字段和策略生成的上下文管理动作之间存在差异。
    - 部署与界面假设不同：桌面 GUI 加 CLI、移动长时、动态短视频和拖拽交互构成不同的评测条件。
    开放问题:
    - 单一平台或交互模式的任务形式化能否跨界面和跨模型类别迁移，而无需逐基准重新评估？
    - 哪些不确定性量化和校准方法在多步轨迹、闭源模型和分布偏移下仍然有效？
    - 可验证任务合成与截图弱监督是否只提升基准表现，还是能预测真实部署失败？
    - 主动技能或上下文管理能否在当前基准之外的应用和分布上泛化？
    - 当前高可见证据中缺少独立形式理论，理论主要内嵌在任务形式化和可靠性基准中，这一缺口仍需验证和填补。
