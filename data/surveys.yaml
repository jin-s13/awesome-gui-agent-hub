  literature_review:
    line_of_work_matrix:
    - line: Formalizing interaction regimes and benchmark boundaries
      what_it_solves: Produces task abstractions, scoring rules, and failure-mode
        evidence for desktop, dynamic short-video, and drag interactions, including
        fine-grained multi-checkpoint and cost-accuracy signals.
      what_remains_open: Coverage is bounded to selected platforms and interaction
        types; formal assumptions are not directly matched to model behavior beyond
        observed failure modes, and several artifacts are not visible.
    - line: Scaling and training-data efficiency
      what_it_solves: Reduces reliance on costly annotation or dense human rewards
        through verifiable task synthesis, online RL, weak supervision from unannotated
        screenshots, and visual context segmentation.
      what_remains_open: Limitations are largely absent in this evidence, and direct
        validation that these methods predict failures or transfer beyond reported
        benchmarks is missing.
    - line: Skill and context management for long-horizon control
      what_it_solves: Improves long-horizon and UI-grounded workflows by retrieving
        multimodal skill artifacts or by emitting context-management actions that
        keep compact but informative state.
      what_remains_open: The reported gains depend on specific base models and frameworks;
        out-of-distribution generalization is only partially tested, and robustness
        across application/interface changes remains unclear.
    - line: Reliability quantification for GUI grounding
      what_it_solves: Benchmarks post-hoc uncertainty quantification methods and conformal
        click regions, separating stable open-weight UQ families from weak cross-tier
        transfer.
      what_remains_open: Evaluation is limited to single-step executable grounding
        rather than multi-step agent trajectories, and coverage degrades under calibration/test
        or interface mismatch.
    consensus:
    - The field treats GUI agents as vision-language policies over screen or UI states
      and evaluates them with task success plus finer metrics rather than pass rate
      alone.
    - There is broad agreement that click-only evaluation under-represents real computer
      use, motivating coverage of mixed GUI/CLI, dynamic content, drag interactions,
      and long-horizon context.
    - Method papers justify gains through baseline comparisons on benchmark suites
      and often attribute improvements to curated data, skill libraries, or context
      mechanisms rather than architecture alone.
    disagreements:
    - 'Evaluation targets differ: some measure general desktop task completion, while
      others target dynamic content cost-accuracy, drag grounding, uncertainty ranking,
      or long-horizon mobile control.'
    - 'Supervision and training regimes differ: verifiable RL synthesis, weak supervision
      from unannotated screenshots, retrieved multimodal skills, and supervised context
      actions each make different data assumptions.'
    - Deployment settings differ substantially, including macOS desktop, browser-based
      short-video environments, mobile devices, and single-step grounding, implying
      different observability and action spaces.
    - Capability-focused work prioritizes success-rate improvements, while reliability-focused
      work prioritizes selective uncertainty ranking and conformal spatial coverage,
      revealing a tension between state-of-the-art claims and safety-oriented evaluation.
    open_questions:
    - How do different task formalizations and metric choices change model rankings
      or training targets across platforms, interaction types, and model tiers?
    - Do verifiable task synthesis and weak supervision predict failure and transfer
      to environments beyond the reported benchmarks?
    - Can uncertainty-quantification rankings transfer across model classes and observable
      interfaces without target-specific reranking?
    - Which context-management or multimodal skill representations preserve long-horizon
      reliability when the base vision-language model or agent framework changes?
