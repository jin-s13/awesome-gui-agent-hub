      尚未覆盖: 在可重复性有限、基线细节缺失和局限性说明缺位的情况下，哪些缺口最应优先解决仍缺少证据排序。
    共识:
    - 普遍采用可执行的、以交互为证据的成功判定：从界面状态、截图、重复运行或净化后的网页证据判断任务完成，而非仅看语言输出。
