  literature_review:
    line_of_work_matrix:
    - line: Formal interaction assumptions and task abstractions
      what_it_solves: Clarifies assumptions about agent actions and observations,
        including GUI+CLI, drag interactions, and dynamic living-screen content.
      what_remains_open: Generalization beyond specific platforms and interaction
        types is unproven; there is no unified formal model of observation control.
    - line: Scaling and supervision for capability acquisition
      what_it_solves: Connects unannotated screenshots, verifiable task synthesis,
        online RL, harness edits, and skill artifacts to improved agent competence.
      what_remains_open: Claims are mostly benchmark-specific; direct evidence that
        these training or scaffolding gains predict failures and transfers is missing.
    - line: Reliability and uncertainty quantification
      what_it_solves: Quantifies confidence, spatial safety, and failure modes in
        GUI grounding and execution, including conformal click regions.
      what_remains_open: Evidence is largely single-step; cross-model and cross-interface
        ranking transfer is weak, and multi-step reliability is not yet covered.
    - line: Evaluation metric and benchmark boundary taxonomy
      what_it_solves: Organizes evaluation beyond Pass@1 into sub-goal checks, information
        efficiency, uncertainty ranking, and interaction coverage.
      what_remains_open: Metric consistency across benchmarks is unresolved, and several
        artifacts lack visible code, data, or limitation details.
    consensus:
    - 'GUI-agent evaluation needs evidence beyond final success: sub-goal completion,
      information cost, uncertainty, and failure-mode evidence matter.'
    - External artifacts and harness design can improve frozen or lightly tuned backbone
      models without full retraining.
    - Multimodal visual grounding is treated as a central bottleneck, and retaining
      visual evidence improves UI element identification and workflow verification.
    disagreements:
    - 'Action and observation assumptions differ: some work addresses static click/type
      actions, others dynamic living-screen content or continuous drag interactions.'
    - 'Improvement paths differ: weak supervision from unannotated screenshots, verifiable
      RL task synthesis, multimodal skill libraries, and harness-level evidence are
      used separately.'
    - 'Reliability targets differ: single-step grounding uncertainty, multi-step failure
      diagnosis, and task-level success are not evaluated with a shared framing.'
    - Deployment and evaluation settings differ across desktop OS, short-video platforms,
      and generic desktop/web suites, limiting comparability.
    open_questions:
    - Can fine-grained metrics and uncertainty rankings transfer across datasets,
      interfaces, and open or closed model classes without target-specific re-evaluation?
    - What formal observation-control policies are needed for dynamic interfaces where
      content changes between actions?
    - Do scaffolded, weakly supervised, or RL-based gains survive distribution shift
      beyond the reported benchmarks and interaction types?
    - Can spatial safety or conformal guarantees be extended from single-step grounding
      to multi-step agent trajectories?
    - Which failure boundaries are hidden by incomplete limitation and artifact reporting
      in the current evidence?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 形式化交互假设与任务抽象
      解决的问题: 澄清智能体动作和观察假设，包括GUI+CLI、拖拽交互和动态屏幕内容。
      尚未覆盖: 跨平台和交互类型的泛化未证明；缺少统一的观察控制形式模型。
    - 路线: 缩放与监督驱动的能力获取
      解决的问题: 把未标注截图、可验证任务合成、在线RL、执行框架编辑和技能工件与能力提升联系起来。
      尚未覆盖: 结论多为基准特定，缺少这些训练或脚手架增益预测失败和迁移的直接证据。
    - 路线: 可靠性与不确定性量化
      解决的问题: 量化GUI定位与执行中的置信度、空间安全和失败模式，包括共形点击区域。
      尚未覆盖: 证据主要是单步；跨模型和跨界面排序迁移较弱，多步可靠性尚未覆盖。
    - 路线: 评测指标与基准边界分类
      解决的问题: 将评估从Pass@1扩展到子目标检查、信息效率、不确定性排序和交互覆盖。
      尚未覆盖: 跨基准指标一致性未解决，部分工件缺少可见代码、数据或局限性说明。
    共识:
    - GUI代理评估不应只看最终成功率，还需子目标完成、信息成本、不确定性和失败模式证据。
    - 外部工件和执行框架设计可以在不完全重新训练的情况下提升冻结或轻调骨干模型。
    - 多模态视觉定位被视为核心瓶颈，保留视觉证据能改善UI元素识别和工作流验证。
