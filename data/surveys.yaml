  related_work_outline:
  - 'Mainstream direction: Building realistic multi-step GUI/OS benchmarks and environments
    that evaluate agents in real desktops, browsers, or dynamic interfaces rather
    than only static single-step grounding.'
  - 'Shared research pattern: Benchmark suites pair task designs with fine-grained,
    rule-based, cost-aware, or uncertainty metrics to reveal sub-goal progress, observation
    control, and calibration beyond aggregate Pass@1.'
  - 'Key differences: Evaluation targets range from static single-step GUI grounding
    and video-guided tasks to multi-application macOS workflows and dynamic short-video
    interfaces; some focus on success rate, others on uncertainty, efficiency, or
    training gains.'
  - 'Trend evolution: Within the 2024-2026 frontier, work is moving from task-only
    collections toward dynamic environments, multi-checkpoint scoring, verifiable
    task synthesis, and benchmark-driven agent improvement or uncertainty auditing.'
  - 'Open questions: Cross-platform and cross-model transfer stability, proxy-metric
    alignment with user utility, long-horizon workflow coverage, and missing code/limitation
    verification gaps remain unresolved.'
  related_work_outline_zh:
  - 主流方向：构建真实、多步骤的GUI/OS基准与环境，在真实桌面、浏览器或动态界面中评估智能体，而非仅做静态单步接地。
  - 研究共性：基准任务套件通常结合细粒度、基于规则、成本感知或不确定性指标，揭示子目标进展、观察控制和校准，而不只依赖Pass@1。
  - 关键差异：评测目标从静态单步GUI接地、视频引导任务到多应用macOS工作流和动态短视频界面；有的关注成功率，有的关注不确定性、效率或训练收益。
  - 趋势演进：在2024-2026前沿内，研究正从仅提供任务集合转向动态环境、多检查点评分、可验证任务合成，以及基准驱动的智能体改进或不确定性审计。
  - 开放问题：跨平台与跨模型迁移稳定性、代理指标与用户效用的对齐、长程工作流覆盖，以及代码与局限性披露的验证缺口仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: Realistic task and environment benchmark construction (e.g., MacAgentBench,
        LivingScreen, VG-GUIBench)
      what_it_solves: Provides shared multi-step, multi-application, OS/browser/dynamic-screen
        tasks for comparing GUI and computer-use agents.
      what_remains_open: Coverage of long-horizon multi-application workflows and
        transfer beyond specific platforms, app sets, or dynamic interface types is
        not established.
    - line: Metric and stress-test design (e.g., fine-grained multi-checkpoint scoring,
        cost-accuracy, Argus uncertainty benchmark)
      what_it_solves: Probes sub-goal completion, observation control, information
        efficiency, and uncertainty calibration instead of relying only on aggregate
        task success.
      what_remains_open: Alignment between these proxy metrics and downstream user
        decisions, and stability under distribution or interface shift, remain unresolved.
    - line: Benchmark-based agent improvement and comparable baselines (e.g., VISUALSKILL,
        GUI-HARVEST, ScaleCUA, GUICrafter)
      what_it_solves: Uses existing benchmarks to evaluate skill libraries, harness
        optimization, weakly supervised training, and verifiable RL under shared held-out
        or benchmark conditions.
      what_remains_open: Cross-implementation and cross-benchmark stability, training/compute
        budget sensitivity, and missing code or limitation evidence leave reproducibility
        gaps.
    consensus:
    - Modern GUI/OS benchmarks increasingly use interactive environments with real
      operating systems, browsers, or simulated dynamic interfaces rather than static
      screenshot grounding alone.
    - Fine-grained process and auxiliary metrics are needed because similar Pass@1
      can hide differences in sub-goal completion, observation efficiency, and uncertainty
      quality.
    - Visual grounding and observation control are treated as central bottlenecks
      for computer-use agents.
    - Benchmark results are used not only to rank models but also to drive agent improvement
      through skill libraries, harness changes, or training data.
    disagreements:
    - 'Evaluation target differs: single-step executable GUI grounding, multi-step
      desktop workflows, video-guided tasks, and dynamic content interactions appear
      as separate settings.'
    - 'Supervision or training strategy differs: weakly supervised learning from unannotated
      screenshots, verifiable task synthesis with online RL, frozen-model harness
      optimization, and skill-library enhancement.'
    - 'Metric focus differs: task success or Pass@1, fine-grained sub-goal/capability
      scoring, cost-accuracy information efficiency, and uncertainty ranking or calibration
      are emphasized differently.'
    - 'Interaction mode differs: static screenshot observation, selected keyframes,
      loaded visual skill figures, and active observation control over changing screens
      are not equivalent.'
    open_questions:
    - How stable are benchmark rankings and uncertainty findings when transferred
      across operating systems, interface types, model classes, and implementations?
    - Which fine-grained metrics best predict downstream user success and safety rather
      than leaderboard improvement?
    - Do current task distributions sufficiently cover long-horizon multi-application
      workflows and dynamic content changes between actions?
    - Can weakly supervised, verifiable-RL, or harness-level improvements maintain
      gains under different base models, compute budgets, and repeated evaluation
      runs?
    - How should missing code, dataset, metric, baseline, or limitation details be
      treated as verification gaps when interpreting benchmark differences?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 真实任务与环境基准构建（如 MacAgentBench、LivingScreen、VG-GUIBench）
      解决的问题: 提供共享的多步骤、多应用、OS/浏览器/动态界面任务，用于比较GUI与计算机使用智能体。
      尚未覆盖: 长程多应用工作流覆盖，以及跨平台、跨应用集合或跨动态界面类型的迁移性尚未确立。
    - 路线: 指标与压力测试设计（如细粒度多检查点评分、成本-准确性、Argus不确定性基准）
      解决的问题: 在总分之外检验子目标完成、观察控制、信息效率和不确定性校准。
      尚未覆盖: 这些代理指标与用户下游决策是否对齐，以及在分布或界面偏移下的稳定性仍不明确。
    - 路线: 基于基准的智能体改进与可比基线（如 VISUALSKILL、GUI-HARVEST、ScaleCUA、GUICrafter）
      解决的问题: 利用既有基准评测技能库、harness优化、弱监督训练和可验证RL在共享条件下的表现。
      尚未覆盖: 跨实现与跨基准稳定性、训练/算力预算敏感性，以及代码与局限性披露缺口仍限制可审计性。
    共识:
    - 现代GUI/OS基准越来越多使用真实操作系统、浏览器或模拟动态界面的交互环境，而非仅做静态截图接地。
    - 需要细粒度过程指标和辅助指标，因为相似Pass@1可能掩盖子目标完成、观察效率和不确定性质量差异。
    - 视觉接地与观察控制被视为计算机使用智能体的核心瓶颈。
    - 基准结果不仅用于排名，还用于通过技能库、harness修改或训练数据改进智能体。
    分歧:
    - 评估目标不同：单步可执行GUI接地、多步骤桌面工作流、视频引导任务和动态内容交互作为不同设置存在。
    - 监督或训练策略不同：来自未标注截图的弱监督、可验证任务合成+在线RL、冻结模型harness优化和技能库增强。
    - 指标侧重不同：任务成功或Pass@1、细粒度子目标/能力评分、成本-准确性信息效率、不确定性排序或校准各有侧重。
    - 交互模式不同：静态截图观察、抽取关键帧、加载视觉技能图形和主动观察控制动态屏幕并不等价。
    开放问题:
    - 当跨操作系统、界面类型、模型类别和实现迁移时，基准排名与不确定性结论能保持多稳定？
