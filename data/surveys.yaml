    - 'Model deployment assumptions differ: some keep backbones frozen and optimize
      around them, others fine-tune VLM parameters, and one removes the decoder entirely,
      making accuracy and latency tradeoffs inconsistent.'
    open_questions:
    - Do gains from synthetic or desktop supervision transfer to real-world, evolving
      applications and interfaces not represented in current benchmarks?
    - Can efficient latent or keyframe policies close the accuracy gap while remaining
      robust out-of-distribution beyond AndroidControl or video QA?
    - How should uncertainty quantification extend from single-step grounding to multi-step
      agent trajectories under interface and distribution shift?
    - What real-world fraud detection evaluation would preserve realistic cues while
      preventing shortcut reliance?
