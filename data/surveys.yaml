    - line: Scalable training and task synthesis
      what_it_solves: Reduces annotation cost and improves agent performance through
        verifiable online RL task generation and weak supervision from unannotated
        screenshots.
      what_remains_open: Validation focuses on benchmark scores; transfer to other
        interfaces, safety constraints, and failure prediction under distribution
        shift remain open.
    - line: Skill and context representation
      what_it_solves: Uses multimodal skill libraries and proactive context management
        to preserve visual grounding and long-horizon state without losing critical
        facts.
      what_remains_open: Evidence covers selected frameworks and applications; generalization
        across platform conventions and interaction types is not established.
    - line: Uncertainty and reliability quantification
      what_it_solves: Benchmarks post-hoc uncertainty for GUI grounding and spatial
        safety, showing which uncertainty families are stable within a model class.
      what_remains_open: Current evidence is single-step; multi-step trajectory uncertainty
