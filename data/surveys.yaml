    - There is a shift from prompt-only model use toward trained or augmented agent
      systems that operate in runnable environments.
    - Supervision increasingly relies on environment feedback, curriculum learning,
      or online reinforcement learning rather than only curated demonstrations.
    - Failure modes such as recovery and personalization are now treated as performance-critical,
      not peripheral.
