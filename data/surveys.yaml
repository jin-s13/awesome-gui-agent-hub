  literature_review:
    line_of_work_matrix:
    - line: Real-world desktop/OS task benchmarking
      what_it_solves: Creates shared GUI+CLI task suites with deterministic scoring
        so different frameworks and models can be compared on realistic computer-use
        workflows.
      what_remains_open: Coverage is still OS- and application-specific; deterministic
        rules may miss open-ended task success; some studies lack reported limitations
        or verifiable artifact availability.
    - line: Dynamic and multimodal interaction benchmarking
      what_it_solves: 'Covers interaction types that static click benchmarks miss:
        drag manipulation, content-changing short-video screens, and video-guided
        GUI actions.'
      what_remains_open: Platform-specific environments make transfer unclear; dynamic-screen
        agents still fail from over- and under-observation; drag benchmarking mainly
        shows fine-tuning gains rather than broad deployment evidence.
    - line: Metric and stress-test design
      what_it_solves: Moves beyond aggregate Pass@1 with sub-goal checkpoints, cost-accuracy,
        uncertainty ranking, and conformal spatial safety.
      what_remains_open: Proxy metrics lack demonstrated alignment with downstream
        user decisions; uncertainty rankings transfer weakly across model classes
        and interfaces; conformal coverage degrades under distribution shift.
    - line: Agent improvement methods evaluated on these benchmarks
      what_it_solves: Uses skill libraries, verifiable RL task synthesis, weakly supervised
        grounding, and keyframe extraction to improve computer-use agent performance.
      what_remains_open: Gains are benchmark-specific; real-world deployment robustness
        is not yet demonstrated, and missing artifact signals make exact comparison
        and reuse uncertain.
    consensus:
    - Computer-use evaluation is shifting toward more realistic, multimodal, multi-step
      interaction, including desktop GUI plus CLI, drag actions, dynamic video-like
      screens, and video-guided tasks.
    - Aggregate success scores are not enough; fine-grained checkpoints, information/cost
      efficiency, uncertainty ranking, and spatial safety are being added.
    - Current frontier agents still underperform human-level performance on dynamic
      and long-horizon computer-use tasks, with observation control as a shared weakness.
    - 'Benchmarks are tightly coupled to agent improvement: skill retrieval, RL, weak
      supervision, and keyframe selection use them as evidence, but evaluation remains
      tied to specific suites.'
    disagreements:
    - Evaluation target ranges from real desktop GUI+CLI workflows, to dynamic short-video
      screens, to drag-only grounding, to video-guided GUI actions, and to single-step
      GUI grounding for uncertainty.
    - 'Observation and interaction mode differ: some assume screenshot-based action
      loops, some require observation-cadence control, and some use selected keyframes
      or multimodal skill artifacts.'
    - 'Improvement strategy differs: constructing benchmarks and metrics versus changing
      agent capabilities through learned skills, online RL with synthesized tasks,
      weak supervision, or keyframe extraction.'
    - 'Metric philosophy differs: deterministic rule-based checkpoints and Pass@1
      versus cost-accuracy versus selective-transfer uncertainty ranking and conformal
      coverage.'
    - 'Deployment setting differs: static application workflows, dynamic living screens,
      short-video platforms, and single-step grounding under distribution shift.'
    open_questions:
    - How well do benchmark rankings and uncertainty findings transfer across operating
      systems, application types, and interface styles?
    - Which fine-grained metrics best predict user-valued task success rather than
      benchmark-specific completion?
    - How can agents learn to control observation cadence in dynamic interfaces without
      sacrificing task accuracy or information efficiency?
    - Do training gains from verifiable synthetic tasks, unannotated screenshots,
      or multimodal skill libraries persist outside the source benchmarks?
    - What is the practical effect of missing limitation statements and artifact signals
      on reproducing and comparing reported results?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 真实桌面/操作系统任务基准
      解决的问题: 用共享GUI+CLI任务集和确定性评分，比较不同框架与模型在真实计算机使用工作流上的表现。
      尚未覆盖: 覆盖仍受限于特定操作系统或应用；确定性规则可能遗漏开放式任务成功；部分研究缺少局限性或可验证工件证据。
    - 路线: 动态与多模态交互基准
      解决的问题: 覆盖静态点击基准缺失的交互类型，包括拖拽操作、内容变化的短视频界面和视频引导的GUI动作。
      尚未覆盖: 平台特定环境导致可迁移性不明；动态屏幕代理仍因过度观察或观察不足而失败；拖拽基准主要展示微调收益，缺乏广泛部署证据。
    - 路线: 指标与压力测试设计
      解决的问题: 通过子目标检查点、成本-准确性、不确定性排名和共形空间安全，超越聚合Pass@1。
      尚未覆盖: 代理指标尚未证明与下游用户决策一致；不确定性排名跨模型类别和接口迁移较弱；分布偏移下共形覆盖度下降。
    - 路线: 在这些基准上评测的智能体改进方法
      解决的问题: 利用技能库、可验证RL任务合成、弱监督定位和关键帧提取提升计算机使用智能体表现。
      尚未覆盖: 收益具有基准特异性；真实部署鲁棒性尚未得到证明；缺少工件信号使精确比较和复用存在不确定性。
    共识:
    - 计算机使用评测正从静态点击转向更真实、多模态、多步交互，包括桌面GUI与CLI、拖拽、动态短视频式界面和视频引导任务。
