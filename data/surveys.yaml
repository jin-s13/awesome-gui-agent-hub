      解决的问题: 通过共享任务套件和确定性或多检查点评分，在真实应用工作流上比较智能体，例如macOS桌面任务与OS级GUI/CLI操作。
      尚未覆盖: 跨操作系统、应用和多应用工作流的覆盖尚未建立，成功率或子目标得分未必完全反映可靠性。
    - 路线: 动态与多模态界面基准构建
      解决的问题: 构建浏览器或视频引导环境及多模态工件，评估内容变化界面上的视觉定位和观察控制。
      尚未覆盖: 当前动态证据主要限于短视频平台或视频引导任务，关键帧或技能方法向其他动态界面迁移仍不明确。
    - 路线: 指标与压力测试设计
      解决的问题: 开发成本-准确性、子目标、不确定性和共形覆盖指标，在总分之外探测智能体行为。
      尚未覆盖: 代理指标与用户决策的关联尚未确定；不确定性排序跨模型和接口迁移弱，且缺少多步轨迹评测。
    - 路线: 可比基线与训练评测报告
      解决的问题: 提供统一基线、harness、可验证任务合成和冻结模型包装，使智能体改进在不同基准上可审计。
      尚未覆盖: 跨实现、技能/harness变体和算力预算的稳定性不确定；多条可见顶会论文缺少局限性或工件证据。
    共识:
    - 基准任务逐渐覆盖真实GUI/OS工作流，而不是孤立合成控件，包括桌面应用、浏览器环境或视频引导交互。
    - 评测正在从总分转向子目标检查点、成本-准确性效率、不确定性估计或视觉验证。
    - 即使模型骨干相似，harness、技能库、观察行为和任务合成等执行上下文也会显著影响智能体得分。
    分歧:
    - 静态桌面设置假设动作之间屏幕内容稳定，而动态短视频和视频引导设置需要内容变化下的观察控制。
    - 一类方法通过弱监督或在线RL训练智能体，另一类保持骨干冻结并优化harness或后验校准。
    - 主要指标不同：成功率、Pass@1、成本-准确性、子目标完成和不确定性排序/覆盖率各自定义不同的进展。
