  related_work_outline_zh:
  - 主流方向：该证据集以基准驱动的GUI智能体工程为主：新数据集或环境与用于定位、长程执行、自改进、不确定性和安全性的方法配对。调查式综合在该证据中更多是隐含的，而非可见产物。
  - 研究共性：论文构建或采用可执行的GUI任务，从截图、无障碍树、重复运行或可验证结果中获取监督，然后在留出基准上评估。增益通常表现为基准特定的改进，有时迁移到外部任务。
  - 关键差异：工作在评测目标（单步定位、多步桌面/移动/网页/视频、欺诈、安全）、监督信号（密集标注、RL任务合成、harness编辑、上下文动作）和模型设置（冻结/微调/开放/封闭）上有所不同。
  - 趋势演进：现有2024-2026窗口且所有排名示例来自2026年，表明前沿正转向可扩展可验证训练、自改进和鲁棒性/安全审计；由于未包含更早年份，无法评估长期演变。
  - 开放问题：如何在不同协议和指标下比较结论；如何跨域或跨模型层级迁移不确定性与安全保证；哪种监督方式能改善长程泛化；以及调查级综合缺少哪些系统性纳入标准。
  literature_review:
    line_of_work_matrix:
    - line: Taxonomy and roadmap synthesis
      what_it_solves: 'Turns fragmented GUI-agent evidence into ordered research directions:
        grounding, long-horizon execution, self-improvement, uncertainty, safety,
        and data generation.'
      what_remains_open: Whether the synthesis is backed by systematic inclusion criteria;
        the packet lacks survey-level method details and only 2026 top examples are
        visible.
    - line: Comparative evaluation synthesis
      what_it_solves: Summarizes how evaluation choices across OSWorld, ScienceBoard,
        ScreenSpot-Pro, WebArena-Infinity, MobileWorld, VG-GUIBench, and fraud/safety
        benchmarks shape claims about GUI agents.
      what_remains_open: Compatibility across protocols, model tiers, interfaces,
        and metrics remains uncertain; several papers omit limitation or artifact
        evidence.
    - line: Open problem and gap mapping
      what_it_solves: Converts broad coverage into concrete gaps such as selective
        uncertainty transfer, domain-conditioned safety, benign recall under sanitized
        cues, and long-horizon context management.
      what_remains_open: Which gaps should be prioritized; missing systematic prioritization
        and evidence of real-world deployment boundaries.
    consensus:
    - Evaluation has shifted toward executable GUI benchmarks that expose grounding,
      planning, and safety under realistic interface conditions.
    - Supervision derived from environment interaction, such as screenshots, accessibility
      trees, repeated rollouts, or verifiable task completion, is widely treated as
      necessary for improving agents.
    - No single benchmark or protocol is sufficient; papers use multiple external
      benchmarks to support transfer and robustness claims.
    - Uncertainty and safety are empirically sensitive to model tier, interface, and
      domain, with stronger claims requiring target-specific re-evaluation.
    disagreements:
    - Evaluation scope ranges from single-step grounding to multi-step desktop, mobile,
      web, video, fraud, and safety tasks, making direct comparison difficult.
    - 'Supervision choices differ: dense environment annotation, verifiable RL-task
      synthesis, evidence-driven harness optimization, and proactive context management
      each target different bottlenecks.'
    - 'Safety and uncertainty results conflict across domains and model classes: browser-domain
      injection resistance can coexist with coding-domain vulnerability, and uncertainty
      rankings transfer weakly across tiers.'
    - Some work assumes frozen backbone models improved by harness or context edits,
      while other work fine-tunes or trains with online RL, changing what agent improvement
      means.
    open_questions:
    - What minimal benchmark protocol and reporting standard would make results from
      OSWorld, ScienceBoard, ScreenSpot-Pro, WebArena-Infinity, MobileWorld, and VG-GUIBench
      comparable?
    - Why do uncertainty rankings and safety hardening transfer selectively across
      datasets, interfaces, domains, and open/closed model tiers?
    - Do dense supervision, verifiable task synthesis, harness optimization, and context
      management address complementary failure modes or overlap?
    - How should open gaps be prioritized among long-horizon memory, grounding uncertainty,
      fraud benign recall, domain-conditioned safety, and benchmark generalization?
    - The packet provides no systematic survey inclusion criteria or limitation details
      for several primary papers; what evidence is needed to turn this into an auditable
      taxonomy or roadmap?
