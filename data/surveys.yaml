  related_work_outline:
  - 'Mainstream direction: Realistic OS and GUI benchmark construction dominates,
    expanding from static screens to macOS desktop, dynamic short-video, and video-guided
    interaction; fine-grained, efficiency, and uncertainty metrics complement Pass@1.'
  - 'Shared research pattern: Papers combine benchmark/environment design with agent
    adaptation methods, evaluate frontier VLM agents, and show that skills, training
    data, or harness optimization yield measurable gains.'
  - 'Key differences: Evaluation settings range from single-step grounding to multi-step
    desktop tasks; supervision spans manual labels, unannotated screenshots, and synthesized
    verifiable tasks; metrics and deployment assumptions differ.'
  - 'Trend evolution: Within the 2024-2026 frontier, focus is moving from static GUI
    benchmarking toward dynamic observation-aware tasks, verifiable training data,
    and uncertainty/calibration evaluation for computer-use agents.'
  - 'Open questions: Cross-platform/regime transfer, observation-control alignment,
    synthesized task coverage, multi-step uncertainty boundaries, and missing limitation
    evidence remain unverified.'
  related_work_outline_zh:
  - 主流方向：真实 OS 与 GUI 基准构建占主导，从静态屏幕扩展到 macOS 桌面、动态短视频和视频引导交互；细粒度、效率与不确定性指标补充 Pass@1。
  - 研究共性：工作多将基准/环境设计与智能体适应方法结合，评估前沿 VLM 智能体，并显示技能、训练数据或 harness 优化可带来可测量提升。
  - 关键差异：评测设置从单步 GUI 定位到多步桌面任务不等；监督信号包括人工标注、未标注截图和可验证合成任务；指标与部署假设不同。
  - 趋势演进：在 2024-2026 前沿内，关注点正从静态 GUI 基准转向动态观察感知任务、可验证训练数据和面向计算机使用智能体的不确定性校准评估。
  - 开放问题：跨平台/体制迁移、观察控制对齐、合成任务覆盖、多步不确定性边界，以及缺失的限制证据仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: Desktop and OS automation benchmark construction
      what_it_solves: Creates shared real-application environments and tasks, such
        as macOS desktop workflows, with deterministic checks and sub-goal scoring.
      what_remains_open: Coverage beyond a single OS and static desktop app set, and
        whether task distributions include dynamic multi-app interaction and reported
        limitations.
    - line: Dynamic and video-guided GUI benchmark design
      what_it_solves: Extends GUI evaluation to content-changing short-video interfaces
        and video-guided interactive tasks, adding efficiency-aware scoring.
      what_remains_open: Whether findings transfer to other dynamic interface types;
        agents still over-observe or under-observe relative to humans.
    - line: Evaluation metrics, scoring protocols, and uncertainty calibration
      what_it_solves: Probes sub-goal completion, cost-accuracy, uncertainty ranking
        transfer, and conformal click regions beyond aggregate Pass@1.
      what_remains_open: Alignment with real deployment decisions, cross-model/interface
        stability, and multi-step trajectory evaluation remain uncovered.
    - line: Methods for improving GUI agents under benchmark pressure
      what_it_solves: Uses skill libraries, harness optimization, online RL task synthesis,
        weak supervision from screenshots, and keyframe extraction to lift benchmark
        performance.
      what_remains_open: Generalization beyond evaluated benchmarks and sample/compute
        budgets; many reports lack limitation statements for boundary conditions.
    - line: Verifiable task synthesis and efficient training
      what_it_solves: Generates verifiable computer-use tasks and trains agents with
        reduced annotation or efficient RL to reach state-of-the-art OSWorld and ScienceBoard
        scores.
      what_remains_open: Whether synthesized tasks cover real user task variety and
        whether gains are stable across frameworks and model classes.
    consensus:
    - Benchmark papers converge on the need for realistic GUI/OS environments rather
      than synthetic static screens, using real applications or faithful browser simulations.
    - Aggregate success rate is treated as insufficient; evidence points to sub-goal
      orchestration, observation efficiency, and spatial uncertainty as important
      evaluation dimensions.
    - Frozen model performance improves materially when agents are equipped with task-specific
      scaffolding such as skill retrieval, harness edits, or synthesized verifiable
      tasks.
    - Deterministic or verifiable checks are favored for auditing improvements, especially
      where human annotation or dynamic reward signals are difficult.
    - Current agents still lag behind human performance on dynamic cost-accuracy or
      calibrated uncertainty, showing observation-control and cross-regime generalization
      gaps.
    disagreements:
    - 'Studies target different evaluation settings: single-step GUI grounding, multi-step
      OS desktop, browser-based short-video interaction, and video-guided GUI tasks.'
    - 'Supervision and data assumptions differ: manually benchmarked tasks, unannotated
      screenshots, generated verifiable RL tasks, or human baselines.'
    - 'Metrics differ: multi-checkpoint Pass@1, cost-accuracy, uncertainty ranking
      and conformal coverage, or keyframe-related VideoQA gain.'
    - Deployment regimes split open-weight models with internal state access from
      closed-source vendor APIs, and transfer evidence is weak across these tiers.
    - 'Intervention points differ: retrieval-based multimodal skills, frozen-model
      harness optimization, training curricula, online RL, and keyframe preprocessing.'
    open_questions:
    - How stable are benchmark rankings when moving across OS platforms, interface
      types, model classes, and harness implementations?
    - Can observation-control and cost-accuracy metrics be made predictive of downstream
      user task success beyond short-video or single-step settings?
    - Do synthesized verifiable tasks and weakly-supervised screenshot curricula cover
      the long tail of real GUI workflows, or do they mainly optimize benchmark-specific
      patterns?
    - What is the boundary of uncertainty quantification and safety calibration for
      multi-step agent trajectories under distribution shift?
    - Several top-ranked works do not report limitations or release details in the
      provided evidence, leaving reproducibility and boundary conditions uncertain.
  literature_review_zh:
    研究路线矩阵:
    - 路线: 桌面与 OS 自动化基准构建
      解决的问题: 构建共享真实应用环境和任务，如 macOS 桌面工作流，并用确定性检查与子目标评分衡量智能体。
      尚未覆盖: 对单一 OS 和静态桌面之外覆盖不足，任务是否包含动态多应用交互及完整限制说明仍不明确。
    - 路线: 动态与视频引导 GUI 基准设计
      解决的问题: 将 GUI 评测扩展到内容变化的短视频界面和视频引导交互任务，引入效率感知评分。
      尚未覆盖: 结论能否迁移到其他动态界面类型未知；智能体相比人类仍存在过度或不足观察。
    - 路线: 评估指标、评分协议与不确定性校准
      解决的问题: 在 Pass@1 之外评估子目标完成、成本-准确性、UQ 排名迁移和共形点击区域。
      尚未覆盖: 与真实部署决策的一致性，以及跨模型/界面稳定性和多步轨迹评估仍待解决。
    - 路线: 面向基准压力的 GUI 智能体改进方法
      解决的问题: 通过技能库、harness 优化、在线 RL 任务合成、截图弱监督和关键帧提取提升基准表现。
      尚未覆盖: 在已评测基准之外的泛化性、算力与样本预算边界不明；多个报告缺少限制说明。
    - 路线: 可验证任务合成与高效训练
      解决的问题: 生成可验证计算机使用任务，并以低标注或高效 RL 达到 OSWorld 与 ScienceBoard 的领先成绩。
      尚未覆盖: 合成任务是否覆盖真实用户任务多样性，以及跨框架和模型类别的稳定性未知。
    共识:
    - 基准工作普遍要求真实 GUI/OS 环境，而非静态合成屏幕，并使用真实应用或忠实浏览器仿真。
    - 总分不足以衡量智能体；子目标完成、观察效率和空间不确定性是重要评测维度。
    - 冻结模型搭配任务特定脚手架（如技能检索、harness 编辑或可验证合成任务）能带来明显性能提升。
    - 确定性或可验证检查更受偏好，用于在人工标注或动态奖励难以获得时审查改进。
    - 当前智能体在动态成本-准确性或校准不确定性上仍低于人类，显示观察控制与跨体制泛化不足。
    分歧:
    - 评测对象不同：单步 GUI 定位、多步 OS 桌面、浏览器短视频交互、视频引导 GUI 任务并存。
    - 监督与数据假设不同：人工标注基准、未标注截图、可验证生成任务和人类基线被分别使用。
    - 指标不同：多检查点 Pass@1、成本-准确性、不确定性排名/共形覆盖，以及关键帧带来的 VideoQA 提升。
    - 部署环境不同：开源权重可访问内部状态与闭源黑盒 API 并存，跨层级迁移证据较弱。
    - 干预层级不同：多模态技能检索、冻结模型 harness 优化、弱监督课程、在线 RL 和关键帧预处理分别被采用。
    开放问题:
    - 在不同操作系统、界面类型、模型类别和 harness 实现之间，基准排名是否稳定？
    - 观察控制和成本-准确性指标能否预测下游用户任务成功，而不仅限于短视频或单步设置？
    - 合成的可验证任务和弱监督截图课程是否覆盖真实 GUI 工作流长尾，还是主要优化基准特定模式？
    - 在分布偏移下，多步智能体轨迹的不确定性量化和安全校准的边界在哪里？
    - 若干高排名工作在给定证据中没有报告局限性或完整发布信息；其可复现性与边界条件仍待验证。
