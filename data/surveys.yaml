    and diagnostic probes.'
  - 'Key differences: Some efforts train end-to-end policies across unified GUI or
    GUI-plus-code action spaces; others leave the base agent fixed and add retrieval-style
    skill libraries, replayable memories, or RL proxies. Supervision and evaluation
    targets also split between end-to-end RL/SFT, weak supervision from unannotated
    screenshots, and failure-mode diagnostics such as recovery and personalization.'
  - 'Trend evolution: Within the 2024–2026 frontier, the focus is moving from single-task
    GUI policies toward deployable systems that coordinate GUI actions, code execution,
    memory, and harness-native RL; recent works increasingly evaluate repair, personalization,
    and cost/latency trade-offs rather than only success rate.'
  - 'Open questions: Error recovery remains weak even after RL; skill and memory layers
    are constrained by deterministic applicability and per-application construction;
    weak supervision and cross-platform transfer need independent reproduction beyond
    reported benchmarks.'
  related_work_outline_zh:
  - 主流方向：领域正汇聚到可运行的GUI/计算机使用智能体，它们在真实桌面、移动与网页环境中执行任务，重点包括视觉定位、端到端策略训练，以及与现有部署harness的兼容。
  - 研究共性：工作通常把模型或智能体与外部运行层结合，例如监督/RL训练循环、技能/记忆模块或评估harness，并在OSWorld-Verified、WebVoyager、CUA-World以及诊断探针等任务上进行验证。
  - 关键差异：一类工作直接训练端到端策略，动作空间为GUI或GUI+代码统一；另一类保持基础智能体固定，叠加检索式技能库、可重放记忆或RL代理。监督与评测目标也有差异：端到端RL/SFT、未标注截图的弱监督，以及恢复与个性化等失败模式诊断。
  - 趋势演进：在2024–2026前沿期内，重点从单一GUI任务策略转向可部署系统，系统需要协调GUI操作、代码执行、记忆和harness原生RL；近期工作也更关注修复、个性化以及成本/延迟权衡，而不只是成功率。
  - 开放问题：即使经过RL，错误恢复仍弱；技能与记忆层受确定性适用条件和按应用构建的限制；弱监督和跨平台迁移需要在已报告基准之外进行独立复现。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end trained GUI/computer-use policies
      what_it_solves: Trains a multimodal policy to ground screenshots and produce
        actions, reducing human annotation or improving task success across desktop,
        mobile, and web benchmarks.
      what_remains_open: Error recovery remains weak after RL; cross-platform transfer
        and scalability beyond reported benchmarks are not independently verified;
        many abstracts omit explicit limitations.
    - line: Harness-native RL and orchestration frameworks
      what_it_solves: Turns deployed agent harnesses into trainable rollouts by intercepting
        model calls and running stateful multi-process inference in isolated environments.
      what_remains_open: Harness design strongly influences trainability; some abilities
        such as recovery remain weak; reproducibility signals such as code and dataset
        availability are incomplete.
    - line: Skill and memory layers over GUI agents
      what_it_solves: Converts validated trajectories or authored documentation into
        reusable multimodal skills or replayable memories to cut token cost, time,
        and grounding errors.
      what_remains_open: Memory reuse is limited to deterministic or compatible runtime
        states; skill construction is per-application and needs coverage beyond tested
        applications.
    - line: Diagnostic evaluation for recovery and personalization
      what_it_solves: Measures when and why agents fail on recovery consistency or
        user-preference execution rather than only aggregate task completion.
      what_remains_open: Current agents show large personalization drops and fail
        to exploit latent recovery; ideal recovery is simulated or condition-specific,
        and long-horizon replay cost is unresolved.
    consensus:
    - GUI/computer-use agents need visual grounding and environment-grounded evaluation
      on realistic interactive tasks.
    - External runtime layers—training loops, skill libraries, memory, or evaluation
      harnesses—can improve task success or efficiency without necessarily retraining
      the base model.
    - Reported gains are usually measured against task-success benchmarks and matched
      baselines, with error recovery, personalization, and adaptability remaining
      weak across systems.
    - Executable, reproducible artifacts are still unevenly available; missing code,
      dataset, or limitation details are verification gaps rather than proof of absence.
    disagreements:
    - Whether to train an end-to-end policy over a unified action space or keep the
      base agent fixed and add external skills, memory, or RL proxies.
    - Whether supervision should come from unannotated screenshots with weak labels,
      hybrid application-artifact supervision, or online RL in deployed harnesses.
    - Whether evaluation should target aggregate benchmark success or diagnostic failure
      modes such as recovery consistency and preference execution.
    - Whether the agent should emit GUI-only actions or a combined GUI-plus-code action
      space, and whether generation should be diffusion-based or follow standard LLM
      decoding.
    open_questions:
    - Can post-training or memory layers reduce error recovery failures that remain
      weak even after RL training?
    - Do skill and replayable-memory systems generalize beyond deterministic, per-application
      or benchmark-specific conditions?
    - Can weak supervision from unannotated screenshots scale to broad computer-use
      tasks while maintaining the reported data-efficiency gains?
    - How should personalization and recovery be evaluated independently from overall
      task success, and which metrics best capture user-specific execution?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端训练的GUI/计算机使用策略
      解决的问题: 训练多模态策略对屏幕进行视觉定位并生成动作，减少人工标注或提升桌面、移动、网页基准上的任务成功率。
      尚未覆盖: RL后错误恢复仍然弱；跨平台迁移与已报告基准之外的可扩展性缺乏独立验证；许多摘要未明确说明局限。
    - 路线: Harness原生RL与编排框架
      解决的问题: 通过拦截模型调用并在隔离环境中运行有状态多进程推理，把已部署的智能体harness转化为可训练的rollout。
      尚未覆盖: Harness设计显著影响可训练性；恢复等能力仍然较弱；代码、数据集等可复现信号不完整。
    - 路线: GUI智能体的技能与记忆层
      解决的问题: 把已验证轨迹或编写文档转化为可复用多模态技能或可重放记忆，以降低token成本、执行时间和定位错误。
      尚未覆盖: 记忆复用受确定性或兼容运行态限制；技能构建按应用定制，覆盖范围需超出已测应用。
    - 路线: 面向恢复与个性化的诊断评测
      解决的问题: 测量智能体在恢复一致性或用户偏好执行上何时、为何失败，而不只看总体任务完成度。
      尚未覆盖: 当前智能体在个性化任务上大幅下滑且未利用潜在恢复能力；理想恢复依赖条件模拟，长时程重放成本未解决。
    共识:
    - GUI/计算机使用智能体需要视觉定位，并需要在真实交互任务上进行环境扎根评测。
    - 外部运行层——训练循环、技能库、记忆或评估harness——可以在不重新训练基础模型的情况下提升任务成功率或效率。
    - 报告的性能通常以任务成功基准和匹配基线衡量，但错误恢复、个性化和适应性在各系统中仍然较弱。
    - 可执行、可复现的工件供给仍不均衡；缺失代码、数据集或局限细节属于验证缺口，不应视为该工作没有这些内容的证据。
    分歧:
    - 一种路线在统一动作空间上训练端到端策略，另一种保持基础智能体固定并叠加外部技能、记忆或RL代理。
    - 监督来源存在差异：未标注截图的弱监督、应用-工件混合监督，或在已部署harness中进行的在线RL。
    - 评测目标不同：有的关注聚合基准成功率，有的关注恢复一致性和偏好执行等诊断性失败模式。
    - 动作输出空间不同：有的仅输出GUI动作，有的统一输出GUI+代码；生成范式也存在扩散生成与常见LLM解码的差异。
    开放问题:
    - 后训练或记忆层能否减少错误恢复失败？现有证据显示RL后恢复能力仍然较弱。
    - 技能与可重放记忆系统能否跨出确定性、单应用或基准特定条件进行泛化？
    - 基于未标注截图的弱监督能否扩展到更广泛的计算机使用任务，同时保持已报告的数据效率优势？
    - 如何独立于总体任务成功率评测个性化与恢复，哪些指标最能反映用户特定执行？
