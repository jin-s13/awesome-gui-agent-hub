    - 路线: 对比评测综合
      解决的问题: 总结移动、桌面、网页和视频引导GUI任务中，不同基准与协议选择如何影响结论。
      尚未覆盖: 跨设置兼容性尚未建立；若干高排序论文缺少可见基线、指标或局限性说明，且跨层级不确定性迁移较弱，结果可能不可泛化。
    - 路线: 开放问题与缺口映射
      解决的问题: 把GUI智能体方法与基准覆盖转化为具体缺口，如长程记忆、样本高效强化学习、无信誉捷径下的良性召回、不确定性排名迁移。
      尚未覆盖: 哪些缺口最值得优先推进，以及当前基准是否覆盖真实部署条件，如可用信誉线索与分布偏移，仍缺少优先排序。
    共识:
    - 证据集中在基准驱动验证上，主要贡献至少在某个命名基准或协议上报告性能。
    - 论文共享一种接地机制：通过任务验证器、前后截图、密集标注或掩码网页证据，将模型动作与观察到的结果关联。
    - 近期工作认为仅依赖冻结模型提示不够，需要加入证据驱动、自改进或上下文管理组件来提升GUI任务完成。
    - 复现信号不一致：有些论文披露了代码、数据集或工件信号，另一些只报告基准结果而没有可见局限性。
    分歧:
    - 干预点不同：关键帧选择、执行harness编辑、在线强化学习训练、上下文作为动作策略、密集监督、潜在评分或后验不确定性校准。
    - 部署界面不同：移动GUI、桌面计算机使用、网页代理欺诈检测和视频引导交互各自带来不同动作空间与评测协议。
    - 监督信号不同：可验证结果、密集环境标注、重复运行执行证据或用于欺诈判断的基准标签。
    - 评测范围不同：有的关注单步 grounding，有的关注长程轨迹、跨基准迁移或安全导向检测。
    - 模型访问假设不同：开源权重VLM代理暴露内部状态用于不确定性方法，而专有API限制访问，需要不同校准方式。
    开放问题:
    - 若统一基线和指标定义，已报告的提升能否在操作系统、界面和评测协议之间迁移？
    - 长程上下文、样本效率、不确定性迁移或掩码证据下的良性召回，哪一个缺口最限制实际GUI智能体？
    - 当可用数据包主要由2026年原始方法和基准而非正式分类体系或路线图构成时，综述层面的映射有多系统？
    - 如果补充缺失的基线、局限性与工件细节并强制执行跨基准兼容性检查，结论会如何变化？
