    研究路线矩阵:
    - 路线: GUI智能体交互的形式化定义与假设
      解决的问题: 澄清动态屏幕、拖拽交互、不确定性条件和能力注释等设定，而不是让交互约束隐含在任务集中。
      尚未覆盖: 这些单步或任务集形式化是否符合多步智能体行为，并跨界面和模型类别迁移，仍未解决。
    - 路线: 可扩展与可验证的训练保证
      解决的问题: 通过弱监督定位、可验证任务合成、前沿感知采样和高效在线RL降低标注成本并规模化计算机使用策略。
      尚未覆盖: 数据效率和SOTA收益能否预测失败、安全边界或向未见过任务/界面的迁移，仍缺直接验证。
    - 路线: 技能、记忆与上下文管理方法
      解决的问题: 通过保留多模态技能工件，或把上下文压缩和检索作为一等动作，改善长时程和跨应用可靠性。
      尚未覆盖: 压缩后的上下文字段是否在现有基准之外保留关键事实，技能库是否无需目标特定编写即可迁移，仍未解决。
    - 路线: 不确定性量化与可靠性框架
      解决的问题: 对GUI定位的后验UQ方法进行基准测试，并通过共形点击区域把不确定性与空间安全连接起来。
      尚未覆盖: 多步轨迹不确定性、跨模型和跨界面排名迁移，以及分布偏移下的覆盖退化仍是未解决边界。
    共识:
    - 当前GUI智能体研究把评测覆盖、任务设计和训练效率视为一等可靠性杠杆，通常将新环境与显式能力指标配对，而不是只看总成功率。
    - 子目标完成、成本-准确性、排名迁移、交互定位和上下文动作记录等细粒度信号揭示了聚合分数掩盖的模型差异。
    - 跨论文趋势是应对动态或长时程交互：把知识外化为技能、可控上下文或可验证任务生成器。
    分歧:
    - 评测目标不同：单步定位不确定性、多步桌面或移动任务完成、动态观察成本和拖拽专门定位被分别处理。
    - 监督模式不同：策展/规则化评测、未标注截图弱监督、可验证在线RL前沿采样，以及带上下文动作注释的SFT并存。
    - 安全与可靠性处理不同：一些工作对单步定位做空间安全校准，另一些改善长时程任务成功率或上下文压缩，但未测故障风险或部署偏移。
    - 技能与上下文表示不同：多模态视觉工件、纯文本技能、折叠上下文字段和上下文即动作机制编码了不同复用或压缩假设。
    开放问题:
    - 技能库提升或拖拽微调等基准特定收益，在分布外界面和闭源模型层级上是否仍能保持？
