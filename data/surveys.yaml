  - 主流方向：证据集中在以任务完成基准评测的GUI/计算机使用智能体，而非调研式综合；近期工作结合环境交互、密集监督和可验证奖励或结果信号。
  - 研究共性：论文构建或扩展基准/数据集，适配视觉语言策略或智能体harness，并在留出套件上报告定位或任务完成提升。
