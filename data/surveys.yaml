  - 'Mainstream direction: Rigorous benchmarking and evaluation of GUI agents, focusing
    on controlled probe tasks for grounding, safety, uncertainty, and fraud detection,
    rather than broad capability surveys.'
  - 'Shared research pattern: Designing benchmarks that suppress spurious cues (URLs,
    reputation) and testing diverse agents under identical protocols to surface systematic
    weaknesses, often with reproduciility audits.'
  - 'Key differences: Domains vary (browser, mobile, coding, video-guided); evaluation
    targets differ (task success, safety ASR, UQ ranking, benign recall); improvement
    methods split between end-to-end RL fine-tuning and modular context/procedural
    enhancements.'
  - 'Trend evolution: From 2024–2025 towards 2026, the focus is narrowing from general
    computer-use benchmarks to specialized safety audits, uncertainty quantification,
    and training-based improvements, while survey papers remain absent in this evidence
    window.'
  - 'Open questions: The evidence lacks a unified taxonomy or roadmap; cross-domain
    generalization of safety and evaluation findings is unverified; autonomous reward
    signals for RL are still noisy and require correction.'
  related_work_outline_zh:
  - 主流方向：通过严格基准测试评估GUI智能体，重点放在受控的探测任务（如接地、安全性、不确定性、欺诈检测）上，而非宽泛的能力综述。
  - 研究共性：设计抑制虚假线索（URL、信誉）的基准，在相同协议下测试多种智能体，以揭示系统性弱点，并经常进行可重复性审计。
  - 关键差异：领域不同（浏览器、移动端、编码、视频引导）；评估目标不同（任务成功率、安全攻击成功率、UQ排名、良性召回率）；改进方法分为端到端RL微调与模块化上下文/程序增强。
  - 趋势演进：从2024-2025年到2026年，焦点从通用计算机使用基准转向专门的安全审计、不确定性量化和基于训练的改进，而本证据窗口内未见综述论文。
  - 开放问题：缺乏统一分类体系或路线图；安全性和评估结果的跨领域泛化未经验证；自主RL奖励信号仍存在噪声，需要校正。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark-driven evaluation synthesis
      what_it_solves: Systematically comparing GUI agent capabilities under controlled
        conditions, revealing weaknesses in grounding, safety, and uncertainty handling.
      what_remains_open: Most benchmarks are domain-specific and lack a unified taxonomy;
        cross-benchmark generalization of findings is unclear, and long-horizon trajectory
        evaluation is underrepresented.
    - line: Safety and reliability analysis
      what_it_solves: Quantifying agent vulnerabilities to prompt injection, auditing
        safety claims, and measuring uncertainty in GUI grounding.
      what_remains_open: Current analyses cover only hand-crafted attacks and single-step
        grounding; multi-step RL-optimized exploits and cross-domain safety transfer
        are not addressed.
    - line: Task design and reward shaping for agent training
      what_it_solves: Improving agent performance through verifiable task synthesis,
        context management, and noisy autonomous reward signals, enabling scalable
        RL fine-tuning.
      what_remains_open: Methods are evaluated on specific benchmarks, and their transferability
        to other architectures, domains, or real-world deployment remains an open
        gap.
    consensus:
    - Rigorous evaluation requires suppressing shortcuts such as URLs or reputation
      signals to reveal true agent understanding.
    - Current GUI agents still struggle with long-horizon tasks and need better context
      management or memory.
    - Uncertainty quantification and safety audits are emerging as critical components
      for trustworthy deployment.
    disagreements:
    - Approaches diverge between end-to-end policy learning via online RL and modular
      systems with explicit context management actions.
    - 'Evaluation settings differ: some focus on single-step GUI grounding, others
      on multi-step trajectories; domains include browser, mobile, and coding, making
      direct comparisons difficult.'
    - 'Safety results are domain-conditioned: agents resist prompt injection on browser
      tasks but fail on coding tasks, showing that safety findings do not generalize
      across interfaces.'
    open_questions:
    - How can we build a unified taxonomy of GUI agent tasks that spans diverse interfaces,
      modalities, and evaluation dimensions?
    - What evaluation protocols ensure that benchmark success rates predict real-world
      agent performance, especially for long-horizon tasks?
    - Can safety hardening be made domain-agnostic, or will it always require per-domain
      calibration and re-evaluation?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基于基准的评估综合
      解决的问题: 在受控条件下系统比较GUI智能体能力，揭示其在接地、安全性和不确定性处理方面的弱点。
      尚未覆盖: 多数基准为特定领域设计，缺乏统一分类体系；跨基准的发现泛化性不明确，长时域轨迹评估不足。
    - 路线: 安全性与可靠性分析
      解决的问题: 量化智能体对提示注入的脆弱性，审计安全声明，并测量GUI接地中的不确定性。
      尚未覆盖: 当前分析仅覆盖手工攻击和单步接地；多步RL优化攻击和跨领域安全迁移未涉及。
    - 路线: 面向智能体训练的任务设计与奖励塑形
      解决的问题: 通过可验证任务合成、上下文管理和带噪自主奖励信号提升智能体性能，实现可扩展的RL微调。
      尚未覆盖: 方法在特定基准上评估，其向其他架构、领域或真实部署的可迁移性仍是开放缺口。
    共识:
    - 严格评估需要抑制URL或信誉等捷径信号，以揭示智能体真实理解能力。
    - 当前GUI智能体在长时域任务上仍面临困难，需要更好的上下文管理或记忆机制。
    - 不确定性量化和安全审计正在成为可信部署的关键组件。
    分歧:
    - 路线分为端到端在线RL策略学习与具有显式上下文管理动作的模块化系统。
    - 评估设置差异较大：有的关注单步GUI接地，有的关注多步轨迹；领域涵盖浏览器、移动端和编码，直接比较困难。
    - 安全结果具有领域条件性：智能体在浏览器任务上抵抗提示注入，但在编码任务上失效，说明安全发现不能跨界面泛化。
    开放问题:
    - 如何构建一个统一的GUI智能体任务分类体系，覆盖多样化的界面、模态和评估维度？
    - 何种评估协议能够确保基准成功率预测真实世界中的智能体表现，尤其是长时域任务？
    - 安全加固能否做到领域无关，还是永远需要针对每个领域进行校准和重新评估？
