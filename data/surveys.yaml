  literature_review:
    line_of_work_matrix:
    - line: Real-world desktop OS task benchmarking
      what_it_solves: Measures multi-app GUI and CLI agent behavior on deterministic
        desktop tasks with fine-grained sub-goal scoring across frameworks and models.
      what_remains_open: No visible limitation evidence; generalization beyond the
        tested desktop OS, long-horizon reliability, and sensitivity to system or
        application updates remain unverified.
    - line: Dynamic and interaction-specific GUI task evaluation
      what_it_solves: Tests agents on dynamic short-video interfaces and drag-based
        interactions, exposing observation control and interaction grounding gaps.
      what_remains_open: Limited to selected platforms and domains; code and data
        artifacts are inconsistently available; transfer to other dynamic interfaces
        or real user workflows remains open.
    - line: Multimodal skill and replay memory
      what_it_solves: Improves accuracy through hierarchical multimodal skill retrieval
        and reduces repeated-task latency through state-machine replay with screen-checking
        fallback.
      what_remains_open: Limitation fields are mostly absent; skill construction cost,
        maintenance under interface drift, and fallback robustness beyond tested benchmarks
        need evidence.
    - line: Scalable web environment and trajectory generation
      what_it_solves: Reconstructs reusable source-grounded web environments and trajectories
        without per-site manual implementation, improving fidelity and fine-tuning
        outcomes.
      what_remains_open: Requires initial per-site setup and authorization; fidelity
        beyond audited domains and deployment safety on live websites remain open.
    - line: Video-guided GUI task grounding
      what_it_solves: Bridges video comprehension and GUI action by extracting task-relevant
        and scene-aware keyframes for video-guided agentic evaluation and training.
      what_remains_open: No limitation details are provided; evidence mainly covers
        video question-answering gains, with limited proof of broad generalization
        across GUI interfaces.
    - line: Alternative model architectures for GUI agents
      what_it_solves: Applies block-wise diffusion vision-language modeling to GUI
        grounding and navigation across mobile, desktop, and web benchmarks.
      what_remains_open: Only six reported GUI benchmarks and no limitation details;
        compute, reproducibility, and real deployment trade-offs are not established.
    consensus:
    - Evaluation is expanding from static web or click-only tasks to richer real-application
      interfaces such as multi-app desktop, drag interactions, dynamic feeds, and
      GUI+CLI workflows.
    - Fine-grained process metrics such as sub-goal completion, information cost-accuracy,
      latency, and fidelity reveal agent weaknesses that pass-rate alone obscures.
    - Providing agents with reusable environment artifacts, multimodal skills, or
      training trajectories improves task success or efficiency.
    - Current frontier models still fall short on observation control, drag grounding,
      and cross-application generalization when measured on these application benchmarks.
    disagreements:
    - 'Representation of agent knowledge differs: multimodal skill libraries versus
