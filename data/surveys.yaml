  - 'Mainstream direction: Building domain-specific benchmarks and improving agent
    execution through skill libraries, optimization, and critic models to advance
    real-world GUI agent applications.'
  - 'Shared research pattern: Most works evaluate multimodal agents on tailored benchmarks,
    identify performance gaps (planning, observation control, interaction fidelity),
    and propose modular enhancements (skills, replay, critiques) without altering
    the base agent architecture.'
  - 'Key differences: Application domains vary widely (desktop, short-video platforms,
    drag-based UI, video-guided tasks, fraud detection), evaluation metrics differ
    (Pass@1, cost-accuracy, fine-grained checkpoints), and improvement strategies
    target distinct bottlenecks (skill grounding, execution speed, history-aware planning,
    keyframe extraction).'
  - 'Trend evolution: Within the 2024–2026 frontier, research shifts from static click-based
    benchmarks to dynamic and multimodal interfaces, and from pure evaluation to integrated
    optimization and reliability methods that address real-world deployment constraints.'
  - 'Open questions: How well do skill libraries and critics transfer across unseen
    applications and platforms? Can agents autonomously control observation frequency
    in dynamic interfaces? Do execution optimizations like replay compromise adaptability
    to novel tasks? How to balance fraud detection accuracy without relying on reputation
    shortcuts?'
  related_work_outline_zh:
  - 主流方向：构建特定领域的基准测试，并通过技能库、执行优化和评判模型增强代理，以推进真实世界的 GUI 代理应用。
  - 研究共性：多数工作在多模态代理上针对定制基准进行评估，识别性能差距（规划、观察控制、交互保真度），并提出模块化增强（技能、回放、评判），而不改变基础代理架构。
  - 关键差异：应用领域各异（桌面、短视频平台、拖拽式 UI、视频引导任务、欺诈检测），评估指标不同（Pass@1、成本-准确性、细粒度检查点），改进策略针对不同瓶颈（技能落地、执行速度、历史感知规划、关键帧提取）。
  - 趋势演进：在 2024–2026 年的前沿窗口中，研究从静态点击式基准转向动态多模态界面，并从纯评估转向集成优化与可靠性方法，以应对真实部署约束。
