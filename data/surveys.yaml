    of benchmarks remains unverified.'
  related_work_outline_zh:
  - 主流方向：构建可运行的GUI代理框架与长时基准，整合训练、多模态技能和实时执行，并开始审计安全与失败模式。
  - 研究共性：多模态视觉信息（图形、动作接地裁剪）优于纯文本或全图记忆；在线RL在真实网站上训练优于离线数据；长时任务暴露出目标漂移、错误传播和约束遗忘的普遍问题。
  - 关键差异：训练范式分为弱监督课程学习、在线多轮RL、监督微调；记忆机制分为全图、动作接地裁剪、分层多模态技能库；安全焦点分为提示注入防御与用户敏感状态探索；评估设置从静态基准到实时网站和小时级专业工作流不等。
  - 趋势演进：2024至2026年间，评估从短任务转向长时真实工作流，训练从离线转向在线RL，技能从文本转向多模态工件，关注点从能力分数扩展到安全与可靠性审计。
  - 开放问题：如何在动态环境中保持长期工作流一致性；如何将多模态技能和记忆泛化到未见应用；如何防御RL优化攻击并实现跨领域安全；基准的独立复现性尚未验证。
  literature_review:
    line_of_work_matrix:
    - line: GUI agent frameworks and runtime systems
      what_it_solves: End-to-end agent training, multimodal skill integration, and
        live execution, turning model capabilities into operable workflows.
      what_remains_open: Cross-application robustness, resource efficiency under deployment
        variability, and long-term stability in real-world settings.
    - line: Safety and failure analysis systems
      what_it_solves: Identifying vulnerabilities, failure modes, and safety risks
        of GUI agents, and designing auditing or defense mechanisms.
      what_remains_open: Closing the loop from offline audit to online active defense,
        and generalizing protection to RL-optimized and cross-domain attacks.
    - line: Benchmarking and evaluation systems
      what_it_solves: Standardized, reproducible assessment of long-horizon, multi-step
        tasks that reveal real-world challenges and agent limitations.
      what_remains_open: Independent reproduction across teams, infrastructure, and
        versions; maintenance of benchmark freshness and cross-platform consistency.
    consensus:
    - Multimodal visual information, such as retained figures and action-grounded
      image crops, improves GUI agent performance over text-only or full-image memory.
    - Online reinforcement learning on live websites produces stronger agents than
      offline supervised training on static datasets.
    - Current agents struggle with long-horizon tasks, with success rates around 20–30%,
      and commonly exhibit goal drift, error propagation, and constraint forgetting.
    - Safety hardening is domain-conditioned; resistance in browser tasks does not
      guarantee safety in coding or other agent modalities.
    disagreements:
    - 'Visual memory representation: full-image screenshots versus action-grounded
      local crops versus hierarchical multimodal skill libraries.'
    - 'Supervision signal: weakly-supervised learning from unannotated screenshots
      versus online RL with trajectory-level rewards versus supervised fine-tuning
      on expert demonstrations.'
    - 'Evaluation target: short, single-step tasks versus long-horizon multi-step
      real-world workflows versus professional domain-specific workflows.'
    - 'Interaction mode: static benchmarks versus live websites and real applications,
      which affects the observed failure distribution and safety assessment.'
    open_questions:
    - How can weakly-supervised or online RL methods scale to thousands of applications
      without expensive human annotations?
    - How do multimodal skill libraries adapt to frequent UI updates and unseen application
      interfaces?
    - Can domain-conditioned safety hardening be extended to other agent modalities
      such as file systems or command-line interfaces?
    - Are long-horizon benchmarks independently reproducible, given the current lack
      of released code and datasets?
  literature_review_zh:
    研究路线矩阵:
    - 路线: GUI代理框架与运行时系统
      解决的问题: 端到端的代理训练、多模态技能集成和实时执行，将模型能力转化为可操作的工作流。
      尚未覆盖: 跨应用鲁棒性、部署变化下的资源效率，以及真实环境中的长期稳定性。
    - 路线: 安全性与故障分析系统
      解决的问题: 识别GUI代理的脆弱性、故障模式和安全风险，并设计审计或防御机制。
      尚未覆盖: 从离线审计到在线主动防御的闭环，以及对RL优化攻击和跨领域攻击的泛化防护。
    - 路线: 基准与评估系统
      解决的问题: 标准化、可复现地评估长期、多步骤任务，揭示真实世界挑战和代理局限性。
      尚未覆盖: 跨团队、基础设施和版本的独立复现；基准的持续更新和跨平台一致性。
    共识:
    - 多模态视觉信息（如保留的图形和动作接地图像裁剪）比纯文本记忆或全图记忆更能提升GUI代理性能。
    - 在真实网站上的在线强化学习比离线静态数据上的监督训练产生更强的代理。
    - 当前代理在长期任务中成功率仅约20–30%，普遍存在目标漂移、错误传播和约束遗忘。
    - 安全加固是领域条件的；浏览器任务中的抵抗力不能保证编码或其他代理模态中的安全性。
    分歧:
    - 视觉记忆表示：全图截图 vs. 动作接地局部裁剪 vs. 分层多模态技能库。
    - 监督信号：来自未标注截图的弱监督学习 vs. 使用轨迹级奖励的在线RL vs. 基于专家演示的监督微调。
    - 评估目标：短小单步任务 vs. 长期多步骤真实工作流 vs. 专业领域特定工作流。
    - 交互模式：静态基准 vs. 实时网站和真实应用，影响观察到的失败分布和安全评估。
    开放问题:
    - 弱监督或在线RL方法如何在没有昂贵人工标注的情况下扩展到数千个应用？
    - 多模态技能库如何适应频繁的UI更新和未见过的应用界面？
    - 领域条件安全加固能否扩展到文件系统或命令行界面等其他代理模态？
    - 在代码和数据集未充分发布的情况下，长期基准能否被独立复现？
