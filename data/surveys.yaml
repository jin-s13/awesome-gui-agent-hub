  related_work_outline:
  - 'Mainstream direction: Building more realistic, executable GUI/OS benchmarks and
    paired evaluation methods for computer-use agents across macOS desktop, dynamic
    short-video, video-guided, and verifiable task settings.'
  - 'Shared research pattern: Papers combine frontier VLM/agent baselines with deterministic
    or rule-based task checks and add diagnostic signals such as sub-goal completion,
    information efficiency, uncertainty, or failure-pattern diagnosis.'
  - 'Key differences: Evaluation targets range from aggregate pass rates to fine-grained
    sub-goal/cost-accuracy/UQ; environments range from real OS/dynamic content to
    synthesized verifiable tasks; improvement routes include training/RL, harness/skill
    scaffolding, weak supervision, and benchmark design.'
  - 'Trend evolution: Within the 2024-2026 frontier, work is shifting from static
    GUI routes toward real macOS/OS tasks, dynamic living screens, multimodal skill
    artifacts, verifiable task synthesis, and post-hoc uncertainty evaluation.'
  - 'Open questions: Platform and interface generalization, metric-to-decision alignment,
    observation control beyond short-video domains, UQ transfer to closed-source agents,
    and reproducibility stability given missing artifacts and limitation evidence
    remain unresolved.'
  related_work_outline_zh:
  - 主流方向：构建更真实、可执行的 GUI/OS 基准与配套评测方法，覆盖 macOS 桌面、动态短视频、视频引导和可验证任务设置的计算机使用代理。
  - 研究共性：将前沿视觉-语言/代理基线置于确定性或规则式任务检查中，并加入子目标完成、信息效率、不确定性或失败模式等诊断信号。
  - 关键差异：评测目标从总体通过率到细粒度子目标/成本-准确性/UQ 各有侧重；环境从真实 OS/动态内容到合成可验证任务不同；提升路线包括训练/RL、harness/技能库、弱监督和基准设计。
  - 趋势演进：在 2024-2026 当前前沿内，工作从静态 GUI 路线转向真实 macOS/OS 任务、动态屏幕、多模态技能工件、可验证任务合成与后验不确定性评测。
  - 开放问题：平台与界面泛化、指标与决策对齐、短视频之外的观察控制、UQ 向闭源代理迁移，以及缺少工件和局限性证据时的可复现稳定性仍待解决。
  literature_review:
    line_of_work_matrix:
    - line: Real-world and dynamic environment benchmark and task design (e.g., MacAgentBench,
        LivingScreen, VG-GUIBench)
      what_it_solves: Creates shared GUI/OS tasks across macOS desktop, short-video,
        and video-guided interactions so agent claims are comparable beyond static
        web navigation.
      what_remains_open: Coverage remains limited to selected platforms, app sets,
        and interface dynamics; multi-step trajectory generalization and cross-platform
        transfer are underevaluated.
    - line: Metric, uncertainty, and stress-test design (e.g., MacAgentBench fine-grained
        scoring, LivingScreen cost-accuracy, Argus)
      what_it_solves: Moves beyond aggregate success to probe sub-goal completion,
        observation control, information efficiency, and post-hoc uncertainty calibration
        for GUI grounding.
      what_remains_open: Alignment between these proxy metrics and downstream user
        decisions is not demonstrated; UQ ranking transfer across model classes and
        interfaces is weak.
    - line: Shared baselines, task synthesis, and reporting harnesses (e.g., OSWorld,
        WindowsAgentArena, CUA-World, OSExpert-Eval, ScienceBoard)
      what_it_solves: Supports auditable comparison for skill libraries, harness evolution,
        weakly supervised agents, and online RL through common benchmarks and reported
        gains.
      what_remains_open: Missing code, dataset, limitation, and citation signals leave
        verification gaps; stability across implementations and compute budgets remains
        unclear.
    consensus:
    - The field is moving from static, annotated GUI tasks toward real operating systems,
      dynamic content, and multimodal interaction, evaluated with task success plus
      diagnostic signals.
    - Frontier vision-language/agent models still fall short of reliable human-level
      operation on sub-goal completion, observation control, uncertainty calibration,
      or information efficiency.
    - Deterministic or rule-based evaluation is treated as necessary but insufficient,
      prompting added fine-grained, efficiency, uncertainty, or failure-pattern views.
    disagreements:
    - 'The primary evaluation target differs: aggregate task success versus sub-goal
      scores versus cost-accuracy versus calibrated uncertainty.'
    - 'Environment preference differs: real OS/desktop/dynamic-video settings versus
      controlled or synthesized verifiable tasks.'
    - 'The expected source of gains differs: online RL or training versus frozen-model
      harness and skill scaffolding versus improved benchmark/task design.'
    - 'The right stress-test level differs: single-step GUI grounding versus multi-step
      agent trajectories.'
    open_questions:
    - Can observation control and information-efficiency metrics be made consistent
      across dynamic interfaces beyond short-video platforms?
    - Do fine-grained, uncertainty, and cost-accuracy metrics align with end-user
      task success and decision quality?
    - How stable are benchmark conclusions across implementations, compute budgets,
      and missing code/dataset/limitation artifacts?
    - Can UQ ranking transfer from open-weight GUI grounding to closed-source agents
      without target-specific re-evaluation?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 真实与动态环境基准及任务设计（如 MacAgentBench、LivingScreen、VG-GUIBench）
      解决的问题: 提供 macOS 桌面、短视频与视频引导的共享 GUI/OS 任务，使代理能力在静态网页之外也可比较。
      尚未覆盖: 覆盖仍限于所选平台、应用集和界面动态；多步轨迹泛化与跨平台迁移尚未充分评估。
    - 路线: 指标、不确定性与压力测试设计（如 MacAgentBench 细粒度评分、LivingScreen 成本-准确性、Argus）
      解决的问题: 在总体成功率之外检验子目标完成、观察控制、信息效率和 GUI grounding 的后验不确定性校准。
      尚未覆盖: 这些代理指标与用户真正关心的下游决策之间的一致性尚未证明；跨模型类别的 UQ 排名迁移较弱。
    - 路线: 共享基线、任务合成与报告规范（如 OSWorld、WindowsAgentArena、CUA-World、OSExpert-Eval、ScienceBoard）
      解决的问题: 通过统一基准和报告收益，支持技能库、harness 演进、弱监督代理和在线 RL 的可审计比较。
      尚未覆盖: 缺失代码、数据集、局限性说明和引用信号，结论在不同实现和算力预算下的稳定性仍不明确。
    共识:
    - 研究正从静态、人工标注的 GUI 任务转向真实操作系统、动态内容和多模态交互，并以任务成功加诊断信号联合评估。
    - 前沿视觉-语言/代理模型在子目标完成、观察控制、不确定性校准或信息效率上仍未达到可靠的人类级表现。
    - 确定性或规则式评估被视为必要但不充分，工作普遍加入细粒度、效率、不确定性或失败模式视角。
    分歧:
    - 主要评测目标不同：总体任务成功率、子目标得分、成本-准确性、校准不确定性各有侧重。
    - 环境取向不同：真实 OS/桌面/动态视频环境与受控或合成可验证任务之间存在权衡。
    - 性能提升来源不同：训练或在线 RL、冻结模型 harness/技能库脚手架、弱监督数据与基准设计各自被强调。
    - 压力测试层级不同：单步 GUI grounding 与多步代理轨迹哪个更关键尚无一致答案。
    开放问题:
