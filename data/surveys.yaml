  literature_review:
    line_of_work_matrix:
    - line: Formal task abstraction and interaction boundaries
      what_it_solves: Clarifies task classes, interaction types, and evaluation assumptions
        for GUI agents, including multi-app desktop workflows, dynamic living-screen
        observation, drag-based actions, and single-step grounding.
      what_remains_open: Abstractions are benchmark-specific; evidence that formal
        interaction classes transfer to unseen interfaces or deployment conditions
        is missing.
    - line: Skill and harness engineering around frozen models
      what_it_solves: Improves agent behavior without retraining by retrieving multimodal
        skill artifacts or diagnosing and editing executable harnesses from observed
        interface transitions.
      what_remains_open: Transfer and interaction between skill/harness interventions
        and changing backbone models or unseen task distributions remains unclear.
    - line: Scalable training with weak or verifiable supervision
      what_it_solves: Reduces expensive human annotation through unannotated screenshot
        visual grounding, verifiable task synthesis, and online RL calibration.
      what_remains_open: Synthetic or weakly supervised data may not cover real-world
        GUI variability; direct validation of failure prediction and transfer is still
        needed.
    - line: Reliability, safety, and uncertainty framing
      what_it_solves: Measures confidence and spatial safety for GUI grounding, and
        observation efficiency for dynamic interfaces, using post-hoc uncertainty,
        conformal prediction, and cost-accuracy metrics.
      what_remains_open: Single-step UQ does not extend to multi-step trajectories;
        cross-model/interface calibration degrades under distribution shift.
    consensus:
    - Fine-grained evaluation beyond aggregate Pass@1 is necessary to expose differences
      in sub-goal completion, observation efficiency, or grounding certainty.
    - Multimodal visual context, including screenshots and visual skill artifacts,
      improves interface grounding and workflow verification.
    - Frozen models can still be improved by external knowledge, harness edits, or
      targeted low-data/RL calibration, separating backbone capability from execution
      scaffolding.
    - Uncertainty and observation control are not yet robust across dynamic interfaces
      or model families.
    disagreements:
    - 'Level of intervention: some work changes evaluation/task abstractions, others
      change skill retrieval, executable harness, or model parameters.'
    - 'Interaction scope: static desktop tasks, dynamic content-changing interfaces,
      drag manipulation, and single-step grounding represent different generalization
      assumptions.'
    - 'Supervision type: unannotated screenshots, verifiable generated tasks, and
      post-hoc UQ benchmarks make different claims about annotation cost and reliability.'
    - 'Primary success metric: Pass@1, cost-accuracy, sub-goal completion, or UQ ranking
      transfer; these metrics reward different agent properties.'
    open_questions:
    - Can observation control be defined formally and improved directly, rather than
      only observed as over- or under-observation in dynamic benchmarks?
    - How can uncertainty quantification transfer across model families and interfaces
      when internal state access changes?
    - Do skill-library and harness-level gains persist across unseen GUI applications
      and new backbone models?
    - Which evaluation abstractions are sufficient to guarantee real-world reliability,
      given several works lack explicit limitations or cross-benchmark validation?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 形式化任务抽象与交互边界
      解决的问题: 澄清GUI代理的任务类别、交互类型和评测假设，包括多应用桌面工作流、动态屏幕观察、拖拽操作与单步grounding。
      尚未覆盖: 抽象与具体基准绑定，缺少其跨未见界面或部署条件迁移的证据。
    - 路线: 围绕冻结模型的技能与执行框架工程
      解决的问题: 在不重训模型的情况下，通过检索多模态技能工件或基于观察到的界面变化诊断并编辑执行框架来改进代理行为。
      尚未覆盖: 技能/执行框架干预在不同骨干模型和未见任务分布上的迁移与相互作用仍不清晰。
    - 路线: 弱监督或可验证监督下的可扩展训练
      解决的问题: 通过未标注截图视觉定位、可验证任务合成和在线RL校准，减少对昂贵人工标注的依赖。
      尚未覆盖: 合成或弱监督数据可能无法覆盖真实GUI变化；对失败预测和迁移的直接验证仍缺失。
