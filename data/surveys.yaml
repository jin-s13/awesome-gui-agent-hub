  literature_review_zh:
    研究路线矩阵:
    - 路线: 真实桌面与应用基准构建
      解决的问题: 在多应用任务中评估 GUI 代理，覆盖 GUI 与命令行混合交互，并采用确定性评分和细粒度检查点指标。
      尚未覆盖: 基准成功能否跨操作系统、未见应用、长程真实工作以及动态或专门化界面条件迁移尚不明确。
    - 路线: 计算机使用代理的技能与记忆构建
      解决的问题: 将成功工作流编码为多模态技能工件或状态机程序，以提高准确率和重复任务执行速度。
      尚未覆盖: 未见任务变化、技能检索与验证失败，以及屏幕状态、布局或用户目标改变时的可靠性仍待解决。
    - 路线: 动态与专门化交互理解
      解决的问题: 覆盖静态点击导向基准难以处理的动态屏幕内容、视频引导指令和拖拽操作。
      尚未覆盖: 动态界面中的观察控制与信息效率，以及短视频平台和四类拖拽之外的更广覆盖范围仍不足。
    - 路线: 统一多模态动作模型与执行
      解决的问题: 训练或适配视觉语言代理，以在桌面、移动和网页平台输出 GUI 动作、代码执行或扩散式输出。
      尚未覆盖: 跨平台迁移、监督与在线强化学习流水线的可扩展性，以及代码、数据和局限信息缺失时的复现验证仍待观察。
    共识:
    - 领域正从仅点击式评估转向覆盖桌面、移动、网页和操作系统级任务的真实应用套件。
    - 多模态屏幕或视频证据处于核心地位；纯文本技能或指令变体较弱。
    - 除 Pass@1 外，子目标完成、成本-准确率或运行速度等细粒度评测日益重要。
    - 领域特定工件能提升性能，例如视觉技能库、拖拽数据集、关键帧提取和操作系统文件工件组合。
    分歧:
    - 评测目标不同：静态桌面工作流、动态短视频流、视频引导任务、拖拽交互或 GUI+代码执行。
    - 动作表示不同：仅 GUI 动作、GUI/代码统一动作空间、编译式状态机重放或块级扩散生成。
    - 监督与学习方式不同：提示式技能检索、监督微调、在线强化学习，或重放成功运行且无需逐步语言模型调用。
    - 指标侧重不同：Pass@1、细粒度检查点完成、成本-准确率、加速比或跨基准 grounding。
    开放问题:
    - 技能与记忆方法在应用、布局或用户目标变化时能否保持可靠？
