  related_work_outline_zh:
  - 主流方向：构建面向真实应用的 GUI 智能体基准，并通过可复用技能、轨迹编译或环境重建增强智能体。
  - 研究共性：在真实或高保真界面中评估前沿视觉语言智能体，采用任务成功率与细粒度子目标/成本效率指标。
  - 关键差异：方案层次、交互模态、知识表示、生成范式与评测目标不同。
  - 趋势演进：在2024-2026前沿期内，研究从静态点击评测扩展到桌面 OS、动态界面、拖拽、视频引导和可复用执行。
  - 开放问题：观察控制、跨平台/跨应用迁移、模拟或重建环境收益与真实可靠性一致性，以及可复现性缺口。
  literature_review:
    line_of_work_matrix:
    - line: Real-world desktop OS benchmarking
      what_it_solves: Measures GUI agents on authentic macOS tasks spanning multiple
        applications and combined GUI/CLI operations with fine-grained sub-goal scoring.
      what_remains_open: Evidence mainly covers macOS and a limited application set;
        cross-operating-system, dynamic-interface, and enterprise-workflow transfer
        is unverified.
    - line: Multimodal skill libraries for computer-use agents
      what_it_solves: Encodes reusable application-specific workflows while preserving
        visual figures for UI element identification and state verification.
      what_remains_open: Skill construction depends on per-application documentation
        and live exploration; cross-application and unseen-workflow generalization
        remains open.
    - line: Dynamic living-screen interface evaluation
      what_it_solves: Benchmarks agents on short-video-style platforms where screen
        content changes between actions and scores both accuracy and information efficiency.
      what_remains_open: Current agents lack observation control; the benchmark is
        limited to a specific dynamic interface family.
    - line: Video-guided GUI task grounding
      what_it_solves: Connects video instructions to GUI actions by extracting task-relevant,
        scene-aware keyframes for multimodal agents.
      what_remains_open: Reported gains are strongest on VideoQA; agentic GUI transfer
        and broader real-task coverage require more evidence.
    - line: Drag-based interaction grounding
      what_it_solves: Builds data and evaluation for drag interactions such as highlighting,
        resizing, cell selection, and slider manipulation beyond click-focused tasks.
      what_remains_open: Only four interaction types are covered, and dataset or artifact
        verification is limited; generalization to diverse interfaces is not established.
    - line: Reusable trajectory compilation for repeated tasks
      what_it_solves: Compiles successful computer-use runs into state-machine programs
        to replay tasks faster without per-step language model calls.
      what_remains_open: Assumes an initial successful run and sufficiently stable
        screen states; fallback robustness under interface drift is only partially
        tested.
    - line: Efficient vision-language GUI agent architectures
      what_it_solves: Trains a non-autoregressive diffusion-based multimodal agent
        for GUI grounding and navigation across mobile, desktop, and web benchmarks.
      what_remains_open: Reproducibility signals are sparse and evaluation is limited
        to selected benchmarks; deployment efficiency and robustness need further
        evidence.
    - line: Automated web environment reconstruction
      what_it_solves: Creates source-grounded, reusable web agent environments from
        real URLs, reducing manual implementation and supporting training trajectories.
      what_remains_open: Initial setup or authorization is still required per site;
        long-term maintenance, drift handling, and broader domain coverage are not
        shown.
    consensus:
    - Evaluation should move beyond single-task success to fine-grained sub-goal,
      cost-accuracy, or checkpoint-level measures.
    - Realistic interfaces and visual screen state are central to GUI agent performance;
      losing visual or application-specific context degrades results.
    - Reusable artifacts such as skills, compiled programs, generated environments,
      and interaction datasets can improve agent capability or efficiency.
    - Current agents still fall short of human-level behavior on dynamic or complex
      real-world tasks.
    - Coverage is expanding from click-based web and mobile tasks toward desktop operating
      systems, drag operations, video-guided tasks, and dynamic screens.
    disagreements:
    - 'Knowledge representation differs: text-only skill retrieval, multimodal visual
      skill artifacts, compiled state-machine trajectories, and source-grounded web
      environments.'
    - 'Solution focus differs: some work contributes evaluation suites, others training
      datasets, agent architectures, skill libraries, or environment generators.'
    - 'Interaction scope differs: static versus living/dynamic screens, click/tap
      versus drag, and GUI-only versus combined GUI/CLI operation.'
    - 'Evaluation target differs: task success or pass rates, fine-grained sub-goal
      completion, cost-accuracy efficiency, grounding accuracy, or replay speed.'
    - 'Generation paradigm differs: mainstream autoregressive vision-language action
      generation versus block-wise diffusion generation for GUI actions.'
    open_questions:
    - How can GUI agents explicitly control their own observation frequency to avoid
      over- and under-observation in dynamic interfaces?
    - Can reusable skills or compiled state machines transfer across applications,
      operating systems, or interface styles without per-app construction?
    - Do gains on drag, video-guided, or reconstructed web-environment benchmarks
      transfer to broader real-world desktop and mobile task suites?
    - Are rule-based, browser-based, or reconstructed environment results aligned
      with real macOS, mobile, or enterprise operational reliability and safety?
    - What is the actual reproducibility status for methods lacking visible code,
      datasets, baselines, or limitation statements in the evidence packet?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 真实桌面操作系统基准
      解决的问题: 在真实 macOS 任务中跨多应用、结合 GUI 与 CLI 操作进行细粒度子目标评测。
      尚未覆盖: 证据主要覆盖 macOS 与有限应用集，跨操作系统、动态界面或企业工作流的迁移尚未验证。
    - 路线: 面向计算机使用智能体的多模态技能库
      解决的问题: 保存可复用的应用特定流程，同时保留视觉图形以辅助 UI 元素识别与状态验证。
      尚未覆盖: 技能构建依赖逐应用文档和实时探索，跨应用及未见工作流的泛化仍不明确。
    - 路线: 动态屏幕界面评测
      解决的问题: 在内容随操作变化的短视频类界面中评测智能体，同时衡量任务准确性与信息效率。
      尚未覆盖: 当前智能体缺乏观察控制；基准只覆盖一类动态界面，代表性有限。
    - 路线: 视频引导的 GUI 任务定位
      解决的问题: 通过任务相关、场景感知的关键帧提取，把视频指令连接到 GUI 操作。
      尚未覆盖: 增益主要体现在 VideoQA，智能体 GUI 任务迁移与真实任务覆盖仍需更多证据。
    - 路线: 拖拽交互定位
      解决的问题: 为点击之外的高亮、调整大小、单元格选择和滑块操作构建数据与评测。
