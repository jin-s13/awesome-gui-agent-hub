  - 开放问题：观察控制机制、跨平台迁移、真实安全结果对齐、反欺诈良性召回，以及代码/数据/局限性的可验证性。
  literature_review:
    line_of_work_matrix:
    - line: Cross-application desktop task benchmarking
      what_it_solves: Measures agent success on real desktop workflows that mix GUI
        and CLI across many applications, with sub-goal scoring.
      what_remains_open: Aggregate Pass@1 may mask sub-goal differences; available
        evidence is macOS-specific and the limitation field is missing.
    - line: Application-specific multimodal skill retrieval
      what_it_solves: Supplies agents with hierarchical visual and textual documentation
        to improve UI element identification and workflow-state verification.
      what_remains_open: Evaluated on two benchmarks; transfer to unseen applications
        and long-horizon tasks is not established, and limitations are not documented.
    - line: Dynamic screen and video-guided task evaluation
      what_it_solves: Measures GUI agents on living screens where content changes
        between actions and on video-guided tasks requiring task-aware keyframe selection.
      what_remains_open: Dynamic coverage is limited to short-video platforms; current
        agents lack observation control, and video-guided generalization is unproven.
    - line: Drag-based interaction grounding
      what_it_solves: Builds large-scale data for drag interactions, moving beyond
        click-focused task assumptions.
      what_remains_open: Fine-tuning gain is shown, but artifact release signals are
        weak and generalization outside the four drag interaction types remains unclear.
    - line: Repeated-task execution efficiency
      what_it_solves: Compiles successful agent runs into state-machine programs to
        avoid per-step language model calls during replay.
      what_remains_open: Relies on screen-state verification and fallback; generalization
        beyond tested mobile, desktop, and web benchmarks is not shown.
    - line: History-aware visually grounded execution correction
      what_it_solves: Uses macro-action history and visual grounding to intercept
        flawed actions before execution.
      what_remains_open: Trained on real GUI trajectories; cross-policy and cross-domain
        transfer are not assessed in the available evidence.
    - line: SMS-to-webpage fraud investigation
      what_it_solves: Evaluates web agents on fraud judgments when URL and reputation
        cues are suppressed.
      what_remains_open: Benign recall is weak; artificial suppression of reputation
        shortcuts may not match real deployment, and the dataset is limited in size
        and scenarios.
    consensus:
    - Current work operationalizes GUI application tasks through concrete benchmark
      suites with success rate, sub-goal, or cost-accuracy metrics.
    - Application-specific prior knowledge, such as retrievable skills or compiled
      past runs, improves agent accuracy or efficiency.
    - Visual grounding and state/history checking are recurring mechanisms for reducing
      execution errors.
    - A single aggregate score is insufficient; fine-grained metrics reveal differences
      in sub-goal completion, observation efficiency, or recall.
    - 'Methodological and reproducibility evidence is uneven: several top papers omit
      limitations and do not fully document code, data, or artifact availability.'
    disagreements:
    - Static desktop, web, and mobile manipulation differ from living screens and
      video-guided observation settings.
    - 'Auxiliary knowledge representation differs: multimodal visual-text skills,
      textual state-machine programs, and macro-action history summaries.'
    - 'Evaluation emphasis differs: broad cross-application task success versus information
      efficiency versus safety-oriented benign and fraud recall.'
    - 'Interaction scope differs: GUI-only click or drag tasks versus mixed GUI plus
      CLI workflows.'
    - 'Deployment assumptions differ: reputation cues suppressed or available; repeated-task
      memory versus one-off operation.'
    open_questions:
    - Can over- and under-observation in dynamic interfaces be reduced with explicit
      observation-control policies without losing task accuracy?
    - Do multimodal skill libraries and compiled replay programs generalize across
      unseen applications, platforms, or longer workflows?
    - How do benchmark gains translate into real-world automation reliability and
      safety, especially in fraud-sensitive web tasks?
    - How can fraud-detection agents improve benign recall when reputation shortcuts
      are unavailable?
    - Which code, datasets, benchmarks, and limitation documents are actually released
      given visible verification gaps?
