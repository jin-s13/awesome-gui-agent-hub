  related_work_outline_zh:
  - 主流方向：面向计算机使用智能体的端到端训练与服务框架，特别是在真实网站和harness原生回滚上进行在线强化学习；OpenForgeRL、OpenWebRL是代表性系统。
  - 研究共性：系统把原始策略学习包装为可运行层，包括回滚编排、记忆/技能检索和诊断基准，以降低token成本、改善状态验证并暴露失败模式。
  - 关键差异：监督信号覆盖在线RL、弱截图监督和多模态技能监督；评测目标覆盖端到端成功、步骤级GUI过渡和对抗安全；交互方式覆盖实时浏览器到确定性回放。
  - 趋势演进：在2024–2026前沿内，研究正从静态单帧定位和总体成功率转向实时多轮训练、执行级回放、过渡诊断与安全可复现审计。
  - 开放问题：harness相关的可训练性与错误恢复、离线到实时泛化、跨领域安全迁移以及独立可复现性仍缺乏充分证据。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end online RL training stacks for GUI or web agents, exemplified
        by OpenForgeRL and OpenWebRL
      what_it_solves: Runs multi-turn agent training in live browser or harness-native
        environments, converting model calls and rollouts into policy optimization
        data.
      what_remains_open: Error recovery remains weak after RL; harness design affects
        trainability; independent deployment and artifact reproducibility are not
        yet fully evidenced.
    - line: Replayable memory and multimodal skill serving for computer-use tasks,
        exemplified by EchoPath and VISUALSKILL
      what_it_solves: Caches validated trajectories or application-specific visual/text
        knowledge into callable memories or skills, reducing repeated planning cost
        and improving UI element identification.
      what_remains_open: Applicability checks reject ambiguous or incompatible steps;
        generalization across applications, runtime states, and independent artifacts
        is not established.
    - line: Step-level diagnostic and safety evaluation, exemplified by Desktop-Delta
        Bench and the domain-conditioned safety audit
      what_it_solves: Isolates GUI transition understanding, state/source tracking,
        and adversarial prompt-injection resistance instead of relying only on aggregate
        task success.
      what_remains_open: Offline evaluation misses asynchronous live timing; current
        scope is limited to Linux/desktop or selected browser/coding domains; optimized
        attack strings were not reproduced.
    - line: Low-annotation and alternative-generation GUI policy learning, exemplified
        by GUICrafter and LLaDA-UI
      what_it_solves: Lowers annotation data needs by learning from unannotated screenshots
        and explores block-wise diffusion decoding for multimodal GUI agents.
      what_remains_open: Reported limitations are sparse; integration with live system
        stacks and independent cross-platform reproduction remain open.
    consensus:
    - Multiple systems treat validated interaction trajectories or application-specific
      knowledge as reusable artifacts to reduce token/time cost and improve grounding.
    - Several works combine a small amount of curated or validated data with scalable
      environments—live webpages, harness containers, or unannotated screenshots—to
      train or adapt agents.
    - 'Evaluators increasingly add diagnostic layers beyond final task success: transition
      ordering, action payload recognition, state verification, or adversarial attack
      success.'
    disagreements:
    - 'Training signal differs: online multi-turn RL from live rollouts versus weak
      supervision from unannotated screenshots versus supervised fine-tuning on multimodal
      skill data.'
    - 'Evaluation target differs: one line measures polished end-task benchmarks,
      another isolates step-level transition understanding, and another tests adversarial
      safety across domains.'
    - 'Interaction mode differs: replayable memory assumes deterministic applicability
      and rejects ambiguous steps, while live RL assumes stateful, asynchronous browser
      or harness processes.'
    - 'Artifact representation differs: multimodal figure-retaining skills assist
      visual grounding, while callable parameterized memories store preconditions
      and validated GUI evidence.'
    open_questions:
    - Which harness or environment properties most affect trainability and post-training
      error recovery?
    - Can offline step-level diagnostics be extended to asynchronous live GUI dynamics
      without losing controllability?
    - How well does browser-domain safety hardening transfer to coding or other tool-use
      domains?
    - Do artifact-based memory and skill systems remain reliable across varied applications,
      operating systems, and independently reproduced deployments?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端在线强化学习训练栈，例如OpenForgeRL和OpenWebRL
      解决的问题: 在真实浏览器或harness原生环境中运行多轮智能体训练，将模型调用和回滚转化为策略优化数据。
      尚未覆盖: 强化学习后错误恢复仍弱；harness设计影响可训练性；跨部署与工件可复现性仍缺乏独立证据。
    - 路线: 可回放记忆与多模态技能服务，例如EchoPath和VISUALSKILL
      解决的问题: 将已验证轨迹或应用相关的视觉/文本知识缓存为可调用记忆或技能，降低重复规划成本并改善UI元素识别。
      尚未覆盖: 适用性检查会拒绝模糊或不兼容步骤；跨应用、运行时状态及独立工件的泛化尚未确立。
    - 路线: 步骤级诊断与安全评测，例如Desktop-Delta Bench和领域条件安全审计
      解决的问题: 隔离GUI过渡理解、状态/来源跟踪和对抗提示注入抵抗，而非只看总体任务成功率。
      尚未覆盖: 离线评测无法捕捉异步实时动态；当前范围限于Linux/桌面或选定的浏览器/编码领域；优化攻击字符串未被复现。
    - 路线: 低标注与替代生成式GUI策略学习，例如GUICrafter和LLaDA-UI
      解决的问题: 通过未标注截图降低标注数据需求，并探索块级扩散解码用于多模态GUI智能体。
      尚未覆盖: 局限性披露较少；与实时系统栈的集成及跨平台独立复现仍未解决。
    共识:
    - 多个系统将已验证交互轨迹或应用特定知识视为可复用工件，以降低token/时间成本并改善grounding。
    - 若干工作用少量精选或验证数据结合可扩展环境，如真实网页、harness容器或未标注截图，来训练或适配智能体。
    - 评测越来越多地加入最终任务成功之外的诊断层，包括过渡排序、动作载荷识别、状态验证或对抗攻击成功率。
    分歧:
    - 训练信号不同：在线多轮强化学习使用实时回滚，弱监督使用未标注截图，监督微调使用多模态技能数据。
    - 评测目标不同：一条路线衡量端到端基准分数，另一条隔离步骤级过渡理解，第三条测试跨领域对抗安全。
    - 交互模式不同：可回放记忆假设确定性适用并拒绝模糊步骤，而实时强化学习假设有状态、异步的浏览器或harness进程。
    - 工件表示不同：多模态技能保留图形以辅助视觉定位，而可调用参数化记忆存储前置条件与已验证GUI证据。
    开放问题:
    - 哪些harness或环境属性最影响可训练性和训练后的错误恢复？
    - 离线步骤级诊断能否扩展到异步实时GUI动态，同时保持可控性？
    - 浏览器领域的安全加固在编码或其他工具使用领域中的迁移效果如何？
    - 基于工件的记忆与技能系统在多样应用、操作系统和独立复现部署下是否仍然可靠？
