    - Which uncertainty quantification methods remain valid for multi-step GUI trajectories
      and for closed-source models with hidden internal states?
    - Do reported gains from verifiable RL, weak supervision, and harness evolution
      persist under distribution shift and with explicit limitation and reproducibility
      evidence?
  literature_review_zh:
    研究路线矩阵:
    - 路线: GUI代理任务与交互抽象评估
      解决的问题: 形式化真实桌面、动态短视频、拖拽和GUI+CLI任务，揭示动作覆盖与细粒度完成差异。
      尚未覆盖: 每个抽象绑定特定平台或动作类型，跨平台、跨动作和多步轨迹有效性尚未建立。
    - 路线: 围绕冻结代理的证据驱动适配
      解决的问题: 利用截图、重复运行、技能工件和harness编辑，在不重新训练的情况下提升冻结GUI模型。
      尚未覆盖: 仅在选定基准上测试迁移，可见证据缺少更广泛部署下的明确局限与失败模式覆盖。
    - 路线: 可扩展训练与可验证数据合成
      解决的问题: 生成可验证RL任务或利用未标注截图与课程/强化学习，降低标注成本并提升性能。
      尚未覆盖: 证据集中在OSWorld和ScienceBoard，样本效率权衡及跨套件泛化仍不明确。
    - 路线: GUI基础任务的可靠性与不确定性量化
      解决的问题: 评估后验UQ方法和共形点击区域，衡量单步基础中的校准置信度。
      尚未覆盖: 未覆盖多步代理轨迹；跨模型和跨接口排序迁移在不重新评估时会下降。
    - 路线: 多模态技能与知识表示
      解决的问题: 在分层技能工件中保留视觉图形，改善UI元素识别和工作流状态验证。
      尚未覆盖: 仅用单一CLI和两个基准评估，维护、跨应用泛化和失败模式在可见证据中未验证。
    共识:
    - GUI代理评估正从粗粒度端到端成功转向细粒度、可验证或成本感知评分。
    - 冻结骨干模型可通过改变外部工件、技能或执行框架来提升，而非必须重新训练模型本身。
    - 动态和真实界面暴露的观察控制与基础定位失败，是静态点击式设置所忽略的。
    - 多数提升在基准特定套件上展示，跨基准或跨平台泛化证据不足，应作为验证缺口处理。
    分歧:
    - 改进表示：视觉多模态技能文件、纯文本技能或执行框架代码、或从未标注截图学到的模型内部视觉定位。
    - 监督信号：确定性规则评分、可验证合成RL奖励、未标注截图弱监督、或人类基线比较。
    - 评测目标：任务成功率或分数、成本-准确率与信息效率、或不确定性校准与共形覆盖。
    - 交互模式：仅点击、拖拽、GUI+CLI组合、或动态/活屏观察控制。
    - 部署场景：macOS桌面、短视频浏览器环境或基准专用沙盒，这会影响可见的失败类型。
    开放问题:
    - 执行框架、技能或训练带来的提升能否在不同操作系统、平台和动作空间中迁移，而无需目标特定重评估？
