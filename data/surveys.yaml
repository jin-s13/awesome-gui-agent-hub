  - 趋势演进：可获得的高排名证据几乎全部来自2026年，趋势属于当前前沿；重点从单步定位转向长程可验证任务、自改进和可靠性。
  - 开放问题：缺少系统性跨基准兼容、多步不确定性、分布偏移鲁棒性以及调研级断言验证；若干可复现性和局限性细节仍是缺口。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark and controlled evaluation construction
      what_it_solves: Produces labeled GUI/computer-use task suites with controlled
        conditions and metrics for grounding or task completion.
      what_remains_open: Most evidence covers single-step or specific scenarios; cross-suite
        compatibility and multi-step trajectory coverage remain unclear.
    - line: Dense supervision and trajectory data generation
      what_it_solves: Turns environment states, screenshots, accessibility trees,
        and repeated runs into training annotations for grounding and long-horizon
        tasks.
      what_remains_open: Whether generated supervision carries hidden environment
        artifacts and transfers across interfaces has not been fully verified.
    - line: Harness optimization and online RL for self-improvement
      what_it_solves: Improves frozen backbones by optimizing the execution harness
        or allocating RL rollouts to verifiable tasks without full model replacement.
      what_remains_open: Reported transfer gains are limited to a few suites; training
        cost and failure-mode coverage are not fully evidenced.
    - line: Efficient action policies and context management
      what_it_solves: Reduces inference cost or context collapse by scoring candidate
        actions in latent space or explicitly managing mobile-agent memory.
      what_remains_open: Latent policies report accuracy below large VLM baselines;
        long-horizon generalization beyond the given mobile benchmark is not established.
    - line: Reliability and adversarial evaluation
      what_it_solves: Assesses uncertainty calibration, spatial safety, and fraud
        detection under sanitized or mismatched observation conditions.
      what_remains_open: UQ transfer across model tiers and interfaces is weak, and
        multi-step trustworthy deployment remains untested.
    consensus:
    - Evaluation is typically benchmark-driven and reports task success or grounding
      accuracy after model adaptation.
    - Combining visual screenshots with structured interface state and executed outcomes
      is a recurring source of performance improvement.
    - Recent papers emphasize long-horizon computer-use and mobile tasks with verifiable
      or environment-derived feedback rather than static single-step prediction alone.
    - Method papers frequently pair a proposed model or system with a new dataset
      or benchmark to demonstrate held-out gains.
    disagreements:
    - 'Supervision source differs: generated desktop annotations, verifiable RL task
      synthesis, harness-observed failure evidence, and mobile trajectory annotations
      make different assumptions.'
    - 'Deployment target differs: some optimizations target mobile AndroidControl
      tasks, while others target desktop OSWorld or ScienceBoard, web fraud, or video-guided
      GUI interaction.'
    - 'Efficiency versus accuracy differs: latent-space action scoring gains speed
      and lower parameter count but does not match large VLM accuracy, while RL and
      harness methods pursue higher task success.'
    - 'Evaluation controllability differs: fraud detection deliberately removes reputation
      shortcuts, whereas desktop and RL benchmarks use executable environment feedback,
      making reported conclusions context-dependent.'
    open_questions:
    - Can gains on OSWorld, ScienceBoard, AndroidControl, or synthetic desktop conditions
      transfer across model tiers and real interfaces?
    - Which supervision or reward signal yields general GUI-agent capability without
      benchmark-specific artifacts?
    - How should uncertainty quantification be extended from single-step grounding
      to long-horizon agent trajectories under distribution shift?
    - Does evidence-driven harness optimization cover enough failure modes to support
      survey-level claims about self-improvement?
    - Why does screen-dynamics pre-training offer no decision gain in the latent policy
      evidence, and what does that imply for efficient GUI policies?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准与受控评测构建
      解决的问题: 生成带标注的GUI/计算机使用任务套件和受控条件，用于评测定位或任务完成。
      尚未覆盖: 多数证据只覆盖单步或特定场景；跨套件兼容性和多步轨迹覆盖仍不清楚。
    - 路线: 密集监督与轨迹数据生成
      解决的问题: 把环境状态、截图、无障碍树和重复运行转化为训练标注，用于定位和长程任务。
      尚未覆盖: 生成监督是否带有隐藏环境伪影以及能否跨界面迁移，尚未被充分验证。
    - 路线: Harness优化与在线RL自改进
      解决的问题: 在冻结骨干模型上优化执行harness，或把RL rollout分配到可验证任务，而无需完全替换模型。
      尚未覆盖: 已报告的迁移提升仅限于少数套件；训练成本和失败模式覆盖仍缺乏充分证据。
    - 路线: 高效动作策略与上下文管理
      解决的问题: 通过在潜空间中对候选动作评分或显式管理移动端智能体记忆，降低推理成本或避免上下文塌缩。
      尚未覆盖: 潜空间策略准确率低于大型VLM基线；在给定移动基准之外的长程泛化尚未建立。
    - 路线: 可靠性与对抗性评测
      解决的问题: 在净化或不匹配的观察条件下评估不确定性校准、空间安全和欺诈检测。
      尚未覆盖: UQ跨模型层级和接口迁移较弱，多步可信部署仍未得到测试。
    共识:
    - 评测通常由基准驱动，报告模型适配后的任务成功率或定位准确率。
    - 将视觉截图与结构化界面状态、执行结果结合是反复出现的性能提升来源。
    - 近期论文强调长程计算机使用和移动任务，以及可验证或环境派生的反馈，而不是仅做静态单步预测。
    - 方法论文经常同时提出模型或系统与新的数据集或基准，以证明留出集上的提升。
    分歧:
    - 监督来源不同：桌面密集标注、可验证RL任务合成、harness观测到的失败证据和移动轨迹标注各自依赖不同假设。
    - 部署目标不同：有的优化移动AndroidControl任务，有的面向桌面OSWorld或ScienceBoard、网页欺诈或视频引导GUI交互。
    - 效率与准确率取舍不同：潜空间动作评分换取速度和更少参数，但未匹配大型VLM准确率；RL和harness方法则追求更高任务成功。
    - 评测可控性不同：欺诈检测刻意移除信誉捷径，而桌面和RL基准使用可执行环境反馈，结论依赖评测设置。
    开放问题:
    - OSWorld、ScienceBoard、AndroidControl或合成桌面条件上的提升能否跨模型层级和真实界面迁移？
    - 哪种监督或奖励信号能产生通用的GUI智能体能力，而不会带来基准特定伪影？
    - 如何将不确定性量化从单步定位扩展到分布偏移下的长时程智能体轨迹？
    - 证据驱动的harness优化是否覆盖足够多的失败模式，以支撑关于自改进的调研级结论？
    - 在潜空间策略证据中，屏幕动态预训练未带来决策收益意味着什么，对高效GUI策略有何启示？
