  - 主流方向：构建可运行的GUI/计算机使用智能体系统，重点在在线强化学习训练框架、技能与记忆编排，以及执行导向的诊断/基准环境。
  - 研究共性：将智能体框架或执行环境与轨迹/任务配对，并以执行成功或任务检查器揭示模型静态输出之外的能力差距。
