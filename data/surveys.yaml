  related_work_outline_zh:
  - 主流方向：2026年前沿将GUI/计算机使用基准与组件级干预结合，包括可验证任务合成与在线RL、无标注截图弱监督、冻结模型harness演化、观察/关键帧选择、不确定性校准和扩展拖拽/GUI+CLI动作覆盖。
  - 研究共性：论文通常用证据支撑方法或基准：任务套件、细粒度指标或保留集迁移，并展示干预领先于前沿GUI代理或揭示能力缺口。
  - 关键差异：优化对象从模型权重到冻结模型harness，从观察/关键帧策略到后验不确定性估计；界面覆盖macOS GUI+CLI、动态视频、拖拽和视频引导GUI任务。
  - 趋势演进：代表性证据均为2026年，趋势处于当前前沿内部：从静态点击评估走向动态、多应用、多动作、可验证和资源高效的GUI代理流程。
