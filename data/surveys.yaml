  - 'Shared research pattern: each top paper introduces a benchmark or evaluation
    protocol, runs multiple models/frameworks, reports aggregate success, then uses
    sub-goal, cost-efficiency, or uncertainty metrics to reveal hidden failure modes.'
  - 'Key differences: static desktop versus dynamic/video interface settings; single-step
    grounding versus multi-step trajectory evaluation; frozen-model skill/harness
    optimization versus weak-supervision/reinforcement-learning training; pass-rate
    versus cost-aware and uncertainty-aware metrics.'
  - 'Trend evolution: available top evidence clusters in 2026, showing a frontier
    shift from static GUI benchmarks toward real OS/desktop and dynamic short-video/web
    tasks, and from aggregate scores toward process-, efficiency-, and uncertainty-aware
    evaluation.'
  - 'Open questions: cross-platform/dynamic interface coverage; multi-step trajectory
    uncertainty calibration; benchmark stability across implementations, compute budgets,
    and harness choices; and observation-control mechanisms for dynamic-screen agents.'
  related_work_outline_zh:
  - 主流方向：构建真实可交互的 GUI/OS 自动化基准，比较前沿视觉语言代理，覆盖 macOS 桌面、动态短视频、视频引导任务与细粒度过程指标。
  - 研究共性：引入基准或评测协议，在多个模型和框架上报告综合成功率，并用子目标、成本效率或不确定性指标暴露隐藏失败模式。
  - 关键差异：静态桌面与动态/视频界面设置不同；单步 grounding 与多步轨迹目标不同；冻结模型的技能/harness 优化与弱监督/在线强化学习路线不同；成功率与成本感知指标不同。
  - 趋势演进：证据集中在 2026 年前沿，从静态 GUI 基准走向真实 OS/桌面与动态短视频/web 场景，从只看总分走向过程、效率和不确定性联合评测。
  - 开放问题：跨平台与动态界面覆盖、多步轨迹不确定性校准、基准结论在不同实现/算力/harness 下稳定性、模型观察控制不足等证据缺口。
  literature_review:
    line_of_work_matrix:
    - line: Realistic desktop and OS task suite design
      what_it_solves: Creates shared interactive tasks across applications and GUI/CLI
        modalities with deterministic checks and fine-grained sub-goal scoring so
        partial completion and capability differences become comparable.
      what_remains_open: Cross-platform transfer beyond macOS and dynamic streaming
        interfaces is not covered; whether rule-based scoring generalizes to mobile,
        web, and dynamic UIs remains unverified.
    - line: Dynamic and video-guided interface task suite design
      what_it_solves: Models tasks where screen content changes between actions or
        where video context guides interaction, enabling evaluation of observation
        control, information efficiency, and task-relevant keyframe use.
      what_remains_open: Current evidence is limited to short-video platforms and
        selected video-guided tasks; models still fail human-level cost-accuracy,
        and observation-control deficits remain unresolved.
    - line: Uncertainty and calibration metric stress tests
      what_it_solves: Benchmarks post-hoc uncertainty quantification for GUI grounding
        across open-weight and closed-source models, measuring ranking transfer and
        conformal click-region coverage.
      what_remains_open: Evidence covers only single-step executable grounding; cross-tier
        ranking transfer is weak, and calibration/test or interface mismatch degrades
        coverage, leaving multi-step deployment unverified.
    - line: Intervention-aware evaluation on shared GUI suites
      what_it_solves: Measures whether skill libraries, harness optimization, weak
        supervision, or online reinforcement learning improve frozen or trained agents
        on common suites such as OSWorld-Verified, CUA-World, OSExpert-Eval, or ScienceBoard.
      what_remains_open: Whether gains reflect general agent capability or benchmark/harness
        fit remains uncertain; transfer evidence is partial, compute/data budgets
        vary, and many top results lack explicit limitation details.
    consensus:
    - Current computer-use benchmarking favors real interactive environments over
      static screenshots, using multi-step tasks and rule-based or executable checks.
    - Aggregate success alone is insufficient; sub-goal, cost-efficiency, and uncertainty
      metrics are introduced to separate agents with similar pass rates.
    - 'Frontier vision-language agents still show systematic gaps: observation control
      in dynamic interfaces, weak uncertainty-ranking transfer across model tiers,
      and large headroom below human-level cost-accuracy.'
    - Shared testbeds such as OSWorld, OSWorld-Verified, CUA-World, OSExpert-Eval,
      and ScienceBoard provide common ground for comparing frozen models and different
      intervention strategies.
    disagreements:
    - Task setting differs between static desktop/OS workflows and dynamic living-screen
      or video-guided interfaces where content changes between actions.
    - Evaluation target differs between multi-step task completion and single-step
      GUI grounding uncertainty, limiting direct cross-benchmark generalization.
    - 'Primary improvement axis differs: frozen-model skill/harness optimization versus
      training-based weak supervision or online reinforcement learning, so reported
      gains may reflect different mechanisms.'
    - 'Success criteria differ: deterministic rule-based pass-rate versus cost-accuracy
      and information-efficiency metrics.'
    - 'Interface access differs: open-weight models allow hidden-state uncertainty
      methods, while closed-source vendors do not, producing asymmetric evaluation.'
    open_questions:
    - How can benchmarks extend to cross-platform and dynamic interface variation
      while retaining deterministic or verifiable scoring?
    - Can uncertainty and calibration metrics be extended from single-step GUI grounding
      to multi-step trajectories without coverage degradation?
    - Are skill, harness, and training gains stable across implementations, compute
      budgets, and unseen benchmarks, or do they partly reflect suite-specific fit?
    - Which observation-control mechanisms would bring dynamic-screen agents closer
      to human-level cost-accuracy?
    - How should the field audit top-scoring results that currently lack explicit
      limitation or reproducibility details?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 真实桌面与 OS 任务套件设计
      解决的问题: 在跨应用、GUI 与 CLI 混合的真实 macOS 任务中提供确定性检查和细粒度子目标评分，使部分完成和能力差异可比较。
      尚未覆盖: 跨移动、网页和动态流式界面迁移证据不足；规则评分能否在非桌面 UI 上普适仍未知。
    - 路线: 动态与视频引导界面任务套件设计
      解决的问题: 刻画内容在操作间变化的短视频平台界面及视频引导任务，评估观察控制、信息效率和任务相关关键帧使用。
      尚未覆盖: 平台覆盖较窄；模型未达到人类水平成本-准确性，观察控制缺陷仍未解决。
    - 路线: 不确定性与校准压力测试
      解决的问题: 在 GUI grounding 上跨开源/闭源模型和数据集评估事后不确定性方法，测量排序迁移和共形点击区域覆盖。
      尚未覆盖: 仅覆盖单步 grounding；跨层级排序迁移弱，分布/接口偏移下覆盖度下降，多步部署未验证。
    - 路线: 共享 GUI 基准上的干预与训练评测
      解决的问题: 在 OSWorld-Verified、CUA-World、OSExpert-Eval、ScienceBoard 等共享基准上评估技能库、harness
        优化、弱监督、在线强化学习等干预是否改善代理。
      尚未覆盖: 收益是否来自通用能力或对特定 benchmark/harness 的过拟合不确定；迁移证据有限，算力与数据预算不可比，部分高排名结果缺少 explicit
        limitations。
    共识:
    - 当前计算机使用评测偏向真实交互环境而非静态截图，常使用多步任务和基于规则或可执行的检查。
    - 单一总成功率不够；需要子目标、成本效率或不确定性等细粒度指标区分总分数接近的模型。
    - 前沿视觉语言代理仍存在系统差距：动态界面中的观察控制不足、跨模型层级的不确定性排序迁移弱、与人类水平成本-准确性差距大。
    - 共享测试集如 OSWorld、OSWorld-Verified、CUA-World、OSExpert-Eval、ScienceBoard 被广泛使用，便于比较冻结模型与不同干预策略。
    分歧:
    - 任务设置：静态桌面/OS 工作流与动态 living-screen 或视频引导界面不同，后者内容在操作间变化。
    - 评测目标：多步任务完成与单步 GUI grounding 不确定性不同，跨评测目标的结论不可直接迁移。
    - 主要改进轴：冻结模型的技能/harness 优化与基于训练的弱监督或在线强化学习不同，报告提升可能反映不同机制。
    - 成功标准：基于规则的 pass-rate 与成本准确性和信息效率指标不同。
