    consensus:
    - 'Screen-based actions are a shared abstraction: agents consume screenshots or
      visual state and produce grounded actions, with visual artifacts or history
      improving UI element identification and state verification over text-only context.'
    - Training and evaluation are moving from static single-step benchmarks to multi-turn,
      online, or rollout-based settings that require scalable orchestration and trajectory-level
      success signals.
    - Intermediate state verification and transition understanding are recognized
      as a missing evaluation layer between single-frame grounding and final task
      success.
    - Safety and reproducibility are treated as system-level properties, but existing
      evidence shows protections do not transfer uniformly across domains.
    - Reported results often lack independent reproduction signals; missing code,
      data, or reproducibility artifacts should be treated as verification gaps rather
      than proof of absence.
    disagreements:
    - 'Supervision strategy differs: large-scale unannotated screenshot weak supervision,
      online multi-turn reinforcement learning, and supervised initialization combined
      with verifiable rewards represent distinct training routes.'
    - 'Interaction mode differs: native screenshot/keyboard/mouse control, harness-based
      tool or code paths, and live-browser rollouts imply different deployment and
      generalization assumptions.'
    - 'Memory representation differs: full-image history, action-grounded crops, multimodal
      hierarchical skill artifacts, and compressed screenshot blocks make different
      trade-offs between state recall and action grounding.'
    - 'Evaluation target differs: end-task success, offline step-level transition
      diagnostics, and security or red-teaming audits emphasize different failure
      modes and cannot replace one another.'
    open_questions:
    - Can error recovery be substantially improved by post-training or architecture
      changes, or is it constrained by current interaction scaffolding?
    - Why is safety hardening domain-conditioned, and which training or inference
      changes could generalize browser protections to coding-domain computer-use tasks?
    - What memory or skill representation simultaneously improves visual context recall
      and action-level grounding without introducing hidden-operation blindness?
    - Do offline transition benchmarks predict live asynchronous GUI competence, and
      which real-time dynamics remain unmeasured?
    - Which harness and orchestration design choices make agents more trainable and
      transferable across environments under bounded rollouts?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端GUI与计算机使用智能体训练
      解决的问题: 从截图、交互或弱标注数据中学习以屏幕为条件的动作策略，降低标注成本。
      尚未覆盖: 强化学习后的错误恢复仍然较弱；数据约束和harness设计选择如何影响鲁棒性尚不清楚。
    - 路线: 交互式编排与真实环境服务
      解决的问题: 在有状态harness、浏览器、桌面或云回滚环境中运行和训练智能体，完成闭环任务。
      尚未覆盖: 可扩展性、保真度、可控性、延迟与跨环境部署之间的权衡仍待解决；某些harness比其他更难学习。
    - 路线: 记忆与技能工件架构
      解决的问题: 为智能体提供可检索的视觉或多模态上下文，用于UI元素识别、工作流验证和恢复。
      尚未覆盖: 存什么与何时检索尚无定论；全图记忆可能加剧动作级接地错误，裁剪和技能文件需要更好的更新与检索策略。
    - 路线: 诊断与安全评测套件
      解决的问题: 隔离过渡理解、失败模式和攻击抵抗力，超越最终任务成功率的粗粒度评测。
      尚未覆盖: 离线基准忽略异步实时动态；安全结果呈领域条件性，优化攻击文本未被完整复现。
    共识:
    - 截图感知与动作接地是共享抽象：多个工作显示视觉图形或视觉历史比纯文本上下文更能改善UI元素识别和状态验证。
    - 训练和评测正从静态单步基准转向多轮、在线或回滚式设置，需要可扩展编排和轨迹级成功判定。
    - 中间状态验证和过渡理解被看作单帧接地与最终任务成功之间的缺失评测层。
    - 安全与可复现被当作系统级属性，但已有证据表明防护不能跨域一致迁移。
    - 很多结果缺乏独立复现信号；代码、数据或复现工件缺失应视为验证缺口，而不是证明其不存在。
    分歧:
    - 监督信号不同：大规模未标注截图的弱监督、在线多轮强化学习、以及监督初始化加可验证奖励的混合路线并存。
    - 交互模式不同：原生截图/键鼠控制、基于harness的工具/代码路径和实时浏览器回滚代表不同泛化与部署假设。
    - 记忆表示不同：全图历史、动作接地裁剪、多模态分层技能工件和压缩截图块在状态回忆与动作接地之间作出不同权衡。
    - 评测目标不同：最终任务成功、离线步骤级过渡诊断和安全/红队审计关注不同失败模式，不能互相替代。
    开放问题:
    - 错误恢复能否通过后训练或架构调整显著提升，还是受当前交互脚手架限制？
    - 为什么安全加固呈现领域条件性，哪些训练或推理改变可将浏览器防护泛化到编码域计算机使用任务？
    - 何种记忆或技能表示能同时优化视觉上下文回忆与动作级接地，并避免隐藏操作盲区？
    - 离线过渡基准能否预测真实异步GUI能力，当前未测量的实时动态有哪些？
    - 哪些harness和编排设计使智能体在有限回滚下更可训练、可迁移？
