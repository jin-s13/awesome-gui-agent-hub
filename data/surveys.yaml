  literature_review:
    line_of_work_matrix:
    - line: Benchmark-driven task formalization
      what_it_solves: Defines reproducible GUI tasks, fine-grained scoring, and platform-specific
        interaction coverage for desktop, dynamic short-video, and drag-based settings.
      what_remains_open: Evidence is limited to selected platforms and interaction
        classes; task formalization has not been connected to formal reliability guarantees
        or long-horizon safety outcomes.
    - line: Formal assumptions for dynamic and fine-grained interaction
      what_it_solves: Gives explicit abstractions for living-screen-native interfaces
        where content changes between actions, and for drag interaction primitives
        often missing from click-only benchmarks.
      what_remains_open: Assumptions stay descriptive; there is no verified mapping
        from these abstractions to model observation-control guarantees or cross-platform
        boundary conditions.
    - line: Training and data scaling for GUI policies
      what_it_solves: Reduces annotation dependence and improves success through verifiable
        synthesized tasks, online RL, sampling efficiency, and weakly-supervised visual
        grounding.
      what_remains_open: Reported gains are mostly success-rate based; failure modes,
        safety constraints, and transfer under distribution shift are not directly
        validated.
    - line: Uncertainty and reliability calibration
      what_it_solves: Quantifies post-hoc confidence for single-step GUI grounding
        and constructs conformal spatial regions to indicate where predictions may
        be unreliable.
      what_remains_open: Ranking transfer is weak across model classes and interfaces;
        multi-step agent trajectories and training-time or hybrid uncertainty remain
        unassessed.
    - line: Skill, context, and observation management
      what_it_solves: Improves long-horizon execution by retrieving multimodal skill
        artifacts, treating context management as first-class actions, and identifying
        over- or under-observation failure.
      what_remains_open: Findings are tied to specific scaffolds and benchmarks; how
        these mechanisms generalize across applications, frameworks, and dynamic interfaces
        remains unclear.
    consensus:
    - Fine-grained evaluation beyond end-task success is becoming common because similar
      Pass@1 scores can hide different sub-goal, observation, or grounding behavior.
    - Several works move away from passive prompt context by making skills, context
      actions, or observation control explicit components of the agent system.
    - 'Current reliability evidence is benchmark-relative: methods are validated on
      task scores or ranking correlations rather than formal cross-setting guarantees.'
    disagreements:
    - Evaluation target ranges from static multi-app desktop tasks, to dynamic short-video
      observation, to drag interaction primitives, to long-horizon mobile workflows.
    - 'Supervision signal differs: verifiable synthesized tasks and online RL, weakly-supervised
      screenshots, supervised context-action traces, or post-hoc uncertainty calibration.'
    - 'Interaction mode differs: click/CLI desktop actions, observation-control on
      dynamic feeds, drag-only manipulation, or proactive context management actions.'
    - 'Deployment/reliability emphasis differs: task success and efficiency, spatial
      uncertainty regions, or memory/context retention; none unifies these into one
      safety framework.'
    open_questions:
    - Do fine-grained success, cost-accuracy, or sub-goal metrics predict real deployment
      reliability and safety under interface or distribution shift?
    - What formal conditions would guarantee observation control in dynamically changing
      GUI content, and how can they be verified beyond short-video benchmarks?
    - Can post-hoc UQ rankings be made stable across open and closed model classes
      and across grounding datasets without target-specific reranking?
    - Are skill-library and proactive context gains robust across different frameworks,
      applications, and out-of-distribution long-horizon tasks?
