  related_work_outline:
  - 'Mainstream direction: Building end-to-end runnable GUI agent systems that combine
    large-scale reinforcement learning, native visual interaction, and structured
    skill libraries to operate across diverse desktop and browser environments.'
  - 'Shared research pattern: Agents follow a perception-reasoning-action loop using
    screenshots as input; multi-modal visual information (figures, image crops) consistently
    outperforms text-only representations.'
  - 'Key differences: Training paradigm differs (weak supervision with unannotated
    data vs. online RL with verifiable rewards vs. supervised fine-tuning); visual
    memory design diverges (full-image history vs. action-grounded local crops); safety
    evaluation reveals domain-conditioned hardening (browser-safe but code-vulnerable).'
  - 'Trend evolution: Within 2024-2026, the frontier moves from offline static benchmarks
    to online live-website training and deployment, from task-level success to fine-grained
    failure diagnostics, and from full human annotation to weak supervision and verifiable
    reward signals.'
  - 'Open questions: Effective error recovery after RL training, generalization of
    safety hardening across domains, bridging the gap between offline diagnostic benchmarks
    and online interactive dynamics, and the scalability of weakly supervised methods
    to complex multi-application workflows.'
  related_work_outline_zh:
  - 主流方向：构建端到端的可运行GUI代理系统，将大规模强化学习训练、原生视觉交互和结构化技能库相结合，以在各类桌面和浏览器环境中执行任务。
  - 研究共性：代理遵循感知-推理-动作循环，以截图作为输入；多模态视觉信息（图形、图像裁剪）始终优于纯文本表示。
  - 关键差异：训练范式不同（利用未标注数据的弱监督、基于可验证奖励的在线RL、监督微调）；视觉记忆设计存在分歧（全图历史 vs 动作接地的局部裁剪）；安全评估揭示领域条件性加固（浏览器安全但代码脆弱）。
  - 趋势演进：2024-2026年间，前沿从离线静态基准转向在线真实网站训练与部署，从任务级成功率转向细粒度失败诊断，从完全人工标注转向弱监督和可验证奖励信号。
  - 开放问题：RL训练后的有效错误恢复，安全加固的跨领域泛化，离线诊断基准与在线交互动态之间的差距，弱监督方法在复杂多应用工作流中的可扩展性。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end training and deployment frameworks
      what_it_solves: Turning agent models into scalable, online-trainable systems
        that interact with real GUI environments, handling data collection, multi-turn
        RL optimization, and scaffold orchestration.
      what_remains_open: Error recovery remains weak after RL; harness design heavily
        influences trainability; safety hardening is domain-conditioned and does not
        transfer across browser and coding tasks.
    - line: Structured knowledge and memory augmentation
      what_it_solves: Reducing cognitive and visual errors by equipping agents with
        multimodal skill libraries or action-grounded visual memory that captures
        local UI regions relevant to successful actions.
      what_remains_open: Automation of skill library construction and maintenance;
        how to avoid action-level error amplification caused by full-image memory;
        cross-application generalization of skill representations.
    - line: Diagnostic benchmarks and safety evaluation
      what_it_solves: Decomposing end-task success into step-level diagnostics for
        GUI transition understanding, failure mode analysis, and safety auditing,
        revealing weaknesses hidden by aggregate metrics.
      what_remains_open: Offline benchmarks cannot capture asynchronous timing, delays,
        and real-time dynamics; safety evaluation is limited to specific OS and action
        types; domain-conditioned hardening leaves coding agents highly vulnerable.
    consensus:
    - GUI agents are predominantly built as a perception-reasoning-action loop that
      takes visual observations (screenshots) and outputs keyboard/mouse actions,
      with multi-modal visual information proving more effective than text-only descriptions.
    - Online reinforcement learning on real environments, combined with a small amount
      of supervised initialization, has become a key method for improving agent performance
      beyond static training.
    - Fine-grained failure diagnostics—including GUI transition understanding, hidden
      operation blindness, and grounding errors—are essential for identifying and
      mitigating agent weaknesses beyond simple task success rates.
    - 'Safety hardening in frontier agents is domain-conditioned: the same model can
      resist hand-crafted prompt injections on browser tasks while remaining highly
      vulnerable to skill-injection attacks on coding tasks.'
    disagreements:
    - 'Visual memory design: full-image history approaches reduce state-level failures
      but increase action-level errors such as grounding mistakes, while action-grounded
      memory that stores local image crops avoids this trade-off.'
    - 'Training data efficiency: weak supervision from massive unannotated screenshots
      can achieve competitive performance with a fraction of the annotated data needed
      by fully supervised methods, but the ceiling of such weak supervision under
      complex workflows is not yet established.'
    - 'Agent architecture: some frameworks support training agents across multiple
      harnesses (e.g., Claude Code, Codex) and environments, while native agents are
      designed with a fixed scaffold and interaction modality, raising questions about
      the portability of training gains.'
    - 'Safety evaluation scope: hand-crafted multi-step attacks completely fail against
      browser agents, yet the same attack methodology succeeds against coding agents,
      indicating that safety mechanisms are tied to specific task domains rather than
      general agent behavior.'
    open_questions:
    - What mechanisms can enable robust error recovery in GUI agents after reinforcement
      learning, especially for long-horizon, multi-application tasks?
    - How can offline diagnostic benchmarks like Desktop-Delta Bench be extended to
      capture the real-time dynamics and asynchronous visual feedback of live GUI
      interactions?
    - To what extent can weakly supervised learning from unannotated screenshots scale
      to the complexity of open-ended desktop workflows without sacrificing reliability?
    - How can safety hardening be generalized across domains so that coding agents
      are not left vulnerable while browser agents are protected?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端训练与部署框架
      解决的问题: 将代理模型转化为可扩展、可在线训练的系统，与真实GUI环境交互，处理数据收集、多轮RL优化和脚手架编排。
      尚未覆盖: RL训练后错误恢复依然薄弱；框架设计严重影响可训练性；安全加固具有领域条件性，无法在浏览器和编码任务之间迁移。
    - 路线: 结构化知识与记忆增强
      解决的问题: 通过为代理提供多模态技能库或动作接地的视觉记忆，捕获与成功动作相关的局部UI区域，减少认知和视觉错误。
      尚未覆盖: 技能库构建与维护的自动化；如何避免全图像记忆带来的动作级错误放大；技能表示在跨应用场景下的泛化能力。
    - 路线: 诊断基准与安全评估
      解决的问题: 将最终任务成功分解为步骤级诊断，用于评估GUI过渡理解、失败模式分析和安全审计，揭示聚合指标掩盖的弱点。
      尚未覆盖: 离线基准无法捕捉异步时序、延迟和实时动态；安全评估仅限于特定OS和动作类型；领域条件性加固使编码代理高度脆弱。
    共识:
    - GUI代理普遍采用感知-推理-动作循环，以视觉观察（截图）作为输入，输出键盘/鼠标动作，多模态视觉信息比纯文本描述更有效。
    - 在真实环境中进行在线强化学习，并结合少量监督初始化，已成为提升代理性能超越静态训练的关键方法。
    - 细粒度失败诊断——包括GUI过渡理解、隐藏操作盲区和接地错误——对于识别和缓解代理弱点至关重要，而不仅仅依赖任务成功率。
    - 前沿代理的安全加固具有领域条件性：同一模型在浏览器任务上可抵抗手工提示注入，但在编码任务上仍极易受到技能注入攻击。
    分歧:
    - 视觉记忆设计：全图像历史方法减少了状态级别失败，但增加了接地错误等动作级别失败，而存储局部图像裁剪的动作接地记忆则避免了这种权衡。
    - 训练数据效率：利用海量未标注截图的弱监督方法能用极少量标注数据达到与全监督方法竞争的性能，但复杂工作流下弱监督的性能上限尚未确定。
    - 代理架构：一些框架支持跨多个推理框架（如Claude Code、Codex）和环境训练代理，而原生代理则采用固定脚手架和交互模态，引发训练收益可移植性的问题。
    - 安全评估范围：手工制作的多步骤攻击对浏览器代理完全无效，但相同攻击方法对编码代理却成功，表明安全机制与特定任务领域绑定，而非一般代理行为。
    开放问题:
    - 在强化学习后，什么样的机制能让GUI代理在长周期、多应用任务中实现稳健的错误恢复？
    - 如何将像Desktop-Delta Bench这样的离线诊断基准扩展到能捕捉实时动态和异步视觉反馈的在线交互评估？
    - 未标注截图的弱监督学习在多大程度上能扩展到开放式桌面工作流的复杂性而不牺牲可靠性？
    - 安全加固如何跨领域泛化，避免编码代理在浏览器代理受到保护的同时仍然脆弱？
