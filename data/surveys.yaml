    programs to improve task completion.'
  - 'Key differences: Papers differ in interaction substrate (static desktop/mobile/web,
    dynamic content, drag, GUI+CLI, video-guided), improvement mechanism (skill library,
    critic, replay, diffusion architecture), and evaluation metric (Pass@1, success,
    cost-accuracy, speed).'
  - 'Trend evolution: Within the 2024-2026 frontier, evaluation is expanding from
    static GUI grounding to dynamic, multimodal, and repeated-use scenarios; methods
    are shifting from single-step action generation toward persistent artifacts and
    runtime verification.'
  - 'Open questions: Whether benchmark gains transfer to real application use, how
    to control observation in changing interfaces, how to balance replay or skill
    reuse with generalization, and how much progress is independently verifiable when
    code, data, and limitations are not visible.'
  related_work_outline_zh:
  - 主流方向：构建和评测面向真实应用的GUI智能体，包括macOS桌面任务、动态短视频界面、拖拽交互和视频引导任务。
  - 研究共性：通过任务集或工件暴露未被充分测试的交互与观察需求，再用技能、记忆、评判器或编译程序提升任务完成。
  - 关键差异：论文在交互载体（静态桌面/移动/网页、动态内容、拖拽、GUI+CLI、视频引导）、改进机制（技能库、评判器、重放、扩散架构）和评测指标（Pass@1、成功率、成本-准确性、速度）上不同。
  - 趋势演进：在2024-2026前沿期内，评测从静态GUI grounding扩展到动态、多模态和重复使用场景；方法从单步动作生成转向持久工件和运行时验证。
  - 开放问题：基准提升能否迁移到真实应用；变化界面中如何控制观察；重放或技能复用与泛化如何平衡；在代码、数据和局限性不可见时进展有多少可独立验证。
  literature_review:
    line_of_work_matrix:
    - line: Realistic application benchmark construction, such as MacAgentBench, DragOn,
        and LivingScreen
      what_it_solves: Covers under-tested GUI application tasks including multi-app
        desktop workflows, drag-based manipulation, and dynamic short-video interfaces
        with task-specific scoring or datasets.
      what_remains_open: Evaluations are often limited to a single platform or curated
        environment; cross-platform transfer, real user workflows, and complete limitation
        details remain unresolved.
    - line: Dynamic and video-guided interaction evaluation, such as LivingScreen
        and video-guided GUI benchmarks
      what_it_solves: Addresses interfaces where content changes between actions and
        tasks guided by video references, measuring both accuracy and information
        cost.
      what_remains_open: No evaluated model reached human-level cost-accuracy, showing
        missing observation control; coverage is limited to specific dynamic platforms
        or video task formats.
    - line: Reusable skill, memory, and compiled replay, such as VISUALSKILL and PreAct
      what_it_solves: Improves repeated-task speed and completion by retaining multimodal
        skills, hierarchical topic indexes, or state-machine programs compiled from
        successful runs.
      what_remains_open: Generalization when application layouts, task goals, or interface
        states change, and the robustness of fallback or mismatch handling remain
        open.
    - line: Runtime verification and visually grounded critique, such as HiViG
      what_it_solves: Intercepts execution errors by summarizing action history and
        checking raw execution coordinates against current screens before action execution.
      what_remains_open: Evidence is limited to specific base policies and benchmarks;
        long-term reliability and cross-policy deployment boundaries are not established.
    - line: Generative model training for GUI grounding and navigation, such as LLaDA-UI
      what_it_solves: Trains multimodal GUI agents to directly generate grounding
        and navigation actions across mobile, desktop, web, and grounding benchmarks.
      what_remains_open: Model scale, inference efficiency, cross-platform robustness,
        and visible code or checkpoint evidence remain verification gaps.
    consensus:
    - GUI agents are primarily evaluated through task success on curated application
      benchmarks, often with rule-based or reference-based scoring.
    - Explicitly retained knowledge, whether multimodal skills, history summaries,
      or compiled programs, improves task completion or efficiency over no-memory
      baselines.
    - Visual grounding and screen-state checking help catch execution errors that
      pass-level or success-only metrics may hide.
    - Even strong models still show substantial gaps on dynamic interfaces, uncommon
      interactions, and sub-goal completion.
    - 'Reproducibility is uneven: several works report benchmarks and trained artifacts,
      but visible code, dataset splits, checkpoints, or limitation statements are
      often incomplete.'
    disagreements:
    - 'Interaction scope differs: static desktop, mobile, and web clicks; dynamic
      living screens; drag manipulations; GUI+CLI multi-app workflows; and video-guided
      reference tasks.'
    - 'Improvement strategy differs: multimodal skill libraries, state-machine replay,
      history-aware critics, and block-wise diffusion architectures target different
      bottlenecks such as knowledge reuse, speed, execution errors, or action generation.'
    - 'Evaluation target differs: some optimize Pass@1 or success rate, while others
      add cost-accuracy, sub-goal completion, or replay speed, which can rank systems
      differently.'
    - 'Supervision differs: synthetic or generated GUI data for fine-tuning, frozen-model
      prompting with retrieved skills, and critic training on real trajectories assume
      different training and deployment constraints.'
    - 'Deployment setting differs: some methods require fallback to an agent at runtime,
      some require per-application skill construction, and others require platform-specific
      trajectory data for training.'
    open_questions:
    - Do gains on curated single-platform or synthetic interaction benchmarks transfer
