  literature_review:
    line_of_work_matrix:
    - line: Task abstraction and interaction taxonomy (e.g., MacAgentBench, DragOn,
        LivingScreen)
      what_it_solves: Turns GUI-agent competence into measurable task suites for desktop,
        drag-based, and dynamic short-video interfaces, with executable or rule-based
        checks.
      what_remains_open: Pass@1 can hide subgoal gaps; platform-specific findings
        and empty limitation fields leave cross-domain validity uncertain.
    - line: External skill and harness improvement (e.g., VISUALSKILL, GUI-HARVEST)
      what_it_solves: Improves frozen backbone agents by adding multimodal visual
        skills or evolving the execution harness from action-and-screenshot evidence.
      what_remains_open: Skill artifacts appear application-specific; cross-benchmark
        transfer evidence exists mainly for harness optimization, and limitation documentation
        is missing.
    - line: Scalable supervision and verifiable RL (e.g., ScaleCUA, GUICrafter)
      what_it_solves: Lowers annotation cost and supports online RL via unannotated
        visual grounding or synthesized verifiable tasks with frontier sampling.
      what_remains_open: Verification environments may not cover real-world GUI variability;
        reported gains are largely benchmark-specific and limitation evidence is sparse.
    - line: Uncertainty quantification and reliability framing (e.g., Argus)
      what_it_solves: Benchmarks post-hoc uncertainty signals for GUI grounding, measuring
        ranking stability and conformal click-region calibration.
      what_remains_open: Evidence is limited to single-step grounding; cross-model
        and cross-interface ranking transfer is weak, and coverage degrades under
        distribution shift.
    consensus:
    - Executable or rule-based verification is the dominant way to turn GUI task success
      into a measurable signal.
    - Single Pass@1-style success hides capability differences; finer subgoal, cost-accuracy,
      or uncertainty metrics are needed.
    - Improving agents without full backbone retraining via external skills, harness
      changes, or weak supervision is a shared frontier direction.
    - Scale and verifiability of training/evaluation data are treated as central levers
      for GUI-agent capability.
    disagreements:
    - 'Representation: static screenshot/click/drag abstractions coexist with dynamic
      living-screen interfaces requiring observation control.'
    - 'Supervision and adaptation route: some approaches update policies through weak
      supervision or online RL, while others keep models frozen and modify skills
      or harness.'
    - 'Evaluation target: success rate, subgoal completion, information efficiency,
      and uncertainty calibration are optimized differently.'
    - 'Deployment setting: desktop macOS, short-video platforms, drag interactions,
      and single-step grounding lead to different assumptions about interface stability.'
    open_questions:
    - Do current task abstractions transfer to long-horizon, cross-application workflows
      outside their original platforms?
    - Which uncertainty signals remain stable across model tiers and interfaces, and
      can calibration survive distribution shift?
    - Can verifiable RL task synthesis preserve enough real-world diversity to avoid
      overfitting to docker or benchmark environments?
    - What evidence links fine-grained subgoal metrics to downstream reliability,
      safety, and user-facing task completion?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 任务抽象与交互分类（例如 MacAgentBench、DragOn、LivingScreen）
      解决的问题: 将GUI智能体能力转化为桌面、拖拽式和动态短视频界面中可测量、可执行或基于规则检查的任务套件。
