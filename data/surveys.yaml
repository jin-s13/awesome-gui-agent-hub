  literature_review:
    line_of_work_matrix:
    - line: GUI task abstraction and evaluation benchmarking
      what_it_solves: Makes interaction assumptions explicit for static desktop, dynamic
        screen-native, multimodal, and drag-based tasks; supplies fine-grained scoring
        beyond aggregate success.
      what_remains_open: Coverage is bounded to tested applications/platforms; formal
        conditions are not yet linked to model behavior under shifting interfaces.
    - line: Frozen-backbone agent improvement through skills and execution harnesses
      what_it_solves: Improves agents without altering backbone weights by organizing
        verifiable/multimodal skills or diagnosing harness-level failure patterns.
      what_remains_open: Most work lacks explicit limitation analysis and cross-benchmark/backbone
        attribution; transfer is only partially demonstrated.
    - line: Policy learning and data efficiency for GUI action grounding
      what_it_solves: Reduces human annotation burden and scales RL/training via verifiable
        task synthesis, curriculum learning, and efficient rollout/training strategies.
      what_remains_open: Reproducibility and training details are uneven; gains depend
        on benchmark choices; no clear failure boundary is established.
    - line: Uncertainty quantification and reliability framing for GUI grounding
      what_it_solves: Benchmarks post-hoc uncertainty methods and calibration for
        single-step grounding, linking confidence to error and spatial safety.
      what_remains_open: Multi-step behavior, closed-source transfer, and distribution-shift
        coverage remain unresolved.
    consensus:
    - Aggregate success metrics are insufficient; fine-grained sub-goal, cost-accuracy,
      and grounding-level scores reveal hidden capability differences across models.
    - Current GUI agents still fail on dynamic and non-click-heavy interactions, often
      because observation or execution context is not controlled.
    - External artifacts around a frozen model, such as skill libraries or optimized
      harnesses, can yield substantial gains without retraining.
    - 'Reproducibility evidence varies: several artifacts are available, but not all
      benchmarks or methods show public code, data, or explicit limitations.'
    disagreements:
    - 'Evaluation settings differ: some target macOS desktop GUI+CLI tasks, others
      short-video dynamic screens, drag-based interactions, or single-step GUI grounding.'
    - 'Improvement locus differs: frozen-backbone harness or skill changes versus
      policy learning via online RL or weakly supervised data.'
    - 'Success signal differs: task completion Pass@1, cost-accuracy, uncertainty
      ranking calibration, or drag task success after fine-tuning.'
    - Uncertainty evidence shows ranking transfer is strong within a model but weak
      across model tiers and interfaces, creating a generalization disagreement.
    open_questions:
    - Can dynamic-screen and drag interaction benchmarks generalize to unseen platforms,
      application versions, or interface types?
    - What causes over- and under-observation in dynamic screen-native agents, and
      which training or harness changes can control it?
    - Under what conditions can uncertainty rankings calibrated on open-weight models
      transfer to closed-source or shifted interfaces?
    - Do harness- and skill-level improvements remain robust when combined with RL-trained
      or weakly supervised policies?
