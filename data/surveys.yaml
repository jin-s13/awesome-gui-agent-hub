  - 开放问题：错误恢复仍弱，安全性呈现领域条件性，离线诊断可能遗漏实时动态，最优记忆与harness设计尚未解决。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end GUI and computer-use agent training
      what_it_solves: Learning screen-conditioned action policies from screenshots,
        interactions, or weakly labeled data while reducing annotation cost.
      what_remains_open: Error recovery after reinforcement learning remains weak;
