  related_work_outline_zh:
  - 主流方向：当前前沿将 GUI 智能体进展视为测量问题——真实任务套件、细粒度评分、交互原语和可靠性基准——而形式理论大多仍是隐含的。
  - 研究共性：工作通常构建任务环境或工件，运行前沿视觉语言智能体，与基线比较，并将剩余错误归因于视觉定位、观察控制或缺少可复用工作流知识。
  - 关键差异：改进落点不同，包括基准设计、多模态技能检索、冻结 harness 优化、通过强化学习或弱监督训练策略、后验不确定性；评测范围从单步定位到多步工作流，从静态桌面到动态界面。
  - 趋势演进：在 2026 年证据窗口内，研究从桌面任务成功率扩展到动态平台、拖拽交互、不确定性量化，以及数据或计算约束下的自改进。
  - 开放问题：没有形式理论将这些结果与部署安全连接起来；开放缺口包括观察控制形式化、跨界面迁移、分布偏移下的不确定性保证，以及独立验证所需的工件可用性。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark-driven task abstraction and capability annotation
      what_it_solves: Defines observable GUI agent capabilities through real-world
        multi-application task suites and fine-grained or cost-aware metrics.
      what_remains_open: Whether task sampling transfers to deployment distributions
        and dynamic interfaces; formal relation between subgoal metrics and task success
        is missing.
    - line: Multimodal knowledge and reusable skill libraries
      what_it_solves: Encodes application workflows as retrievable multimodal artifacts
        to reduce exploratory interaction and improve UI identification.
      what_remains_open: Whether visual skill artifacts generalize across application
        versions or interfaces, and how they depend on model-specific perception errors.
    - line: Evidence-driven harness evolution and self-improvement
      what_it_solves: Diagnoses recurrent failure patterns from repeated runs and
        optimizes execution scaffolding while keeping backbone models frozen.
      what_remains_open: Transfer evidence is limited to tested benchmarks, and there
        is no formal guarantee of safe behavior after harness edits.
    - line: Scalable training with verifiable or weak supervision
      what_it_solves: Reduces annotation and compute burdens by synthesizing verifiable
        tasks or using unannotated screenshots for grounding and reinforcement learning.
      what_remains_open: Direct validation that learned policies remain reliable on
        unseen workflows and do not overfit to narrow verifiable reward checks.
    - line: Uncertainty quantification and reliability evaluation
      what_it_solves: Benchmarks post-hoc uncertainty estimators for GUI grounding
        and introduces conformalized interaction regions as spatial safety.
      what_remains_open: UQ ranking transfer is selective across model tiers and interfaces;
        coverage degrades under distribution shift; single-step grounding is not multi-step
        agent reliability.
    consensus:
    - GUI agent evaluation is shifting from single-application success rates to real-world,
      multi-application tasks with fine-grained or cost-aware scoring.
    - Visual grounding and interface perception are central bottlenecks; retaining
      visual information or learning grounding from screenshots improves performance.
    - Data and task synthesis, weak supervision, and verifiable reward are becoming
      major routes for improving GUI agents.
    - Reliability is operationalized through uncertainty quantification, failure-pattern
      diagnosis, or spatial safety regions rather than formal safety properties.
    - Frozen models can gain substantial performance from external scaffolds such
      as skill libraries or optimized execution harnesses.
    disagreements:
    - 'Evaluation target differs: single-step grounding versus multi-step interactive
      workflows versus specific interaction primitives such as dragging.'
    - 'Improvement locus differs: modifying frozen-model skills or harnesses versus
      updating model parameters through reinforcement learning or weak supervision.'
    - 'Interface assumptions differ: static and deterministic desktop tasks versus
      dynamic continuously changing interfaces, leading to different failure attribution.'
    - 'Supervision signal differs: human-annotated or generated verifiable tasks versus
      unannotated screenshots versus executable environment checks.'
    - 'Reliability formulation differs: post-hoc uncertainty ranking versus conformal
      spatial safety versus evidence-driven failure-pattern diagnosis.'
    open_questions:
    - How do fine-grained multi-checkpoint scores relate to deployed task success
      when platforms and interface dynamics shift?
    - Can observation-control failures in dynamic interfaces be formalized and improved
      across interaction modalities?
    - Does uncertainty ranking transfer remain stable for multi-step agent trajectories
      and under cross-interface distribution shift?
    - Do skill-library and harness optimizations generalize across application versions
      without relying on platform-specific assumptions?
    - What guarantees connect verifiable training tasks or harness edits to safe behavior
      on unseen GUI workflows?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基于基准的任务抽象与能力标注
      解决的问题: 通过真实多应用任务套件和细粒度或成本感知指标，界定可观测的 GUI 智能体能力。
      尚未覆盖: 任务采样能否迁移到部署分布和动态界面尚不明确；细粒度子目标指标与任务成功之间的形式关系缺失。
    - 路线: 多模态知识与可复用技能库
      解决的问题: 将应用工作流编码为可检索的多模态工件，以减少探索性交互并改善 UI 识别。
      尚未覆盖: 视觉技能工件能否跨应用版本或界面泛化，以及其效果如何依赖模型特定的感知误差。
    - 路线: 证据驱动的 harness 演进与自改进
      解决的问题: 从重复运行中诊断反复出现的失败模式，并在保持骨干模型冻结的情况下优化执行脚手架。
      尚未覆盖: 迁移证据仅限于已测试基准，且缺少 harness 编辑后安全行为的形式保证。
    - 路线: 基于可验证或弱监督的可扩展训练
      解决的问题: 通过合成可验证任务或使用未标注截图进行定位和强化学习，减少标注与计算负担。
      尚未覆盖: 缺少直接验证，证明学习策略在未见工作流上可靠且不会过拟合到狭窄的可验证奖励检查。
    - 路线: 不确定性量化与可靠性评测
      解决的问题: 对 GUI 定位的后验不确定性估计器进行基准测试，并引入共形交互区域作为空间安全机制。
      尚未覆盖: 不确定性排名的迁移在不同模型层级和接口之间具有选择性；覆盖度在分布偏移下下降；单步定位不能代表多步智能体可靠性。
    共识:
    - GUI 智能体评测正在从单应用成功率转向真实、多应用和细粒度或成本感知评分。
    - 视觉定位与界面感知是核心瓶颈，保留视觉信息或从截图学习定位会改善性能。
    - 数据与任务合成、弱监督和可验证奖励正在成为提升 GUI 智能体的主要路径。
    - 可靠性被操作化为不确定性量化、故障模式诊断或空间安全区域，而不是形式安全属性。
    - 冻结模型可以通过技能库或优化执行 harness 等外部脚手架获得显著提升。
    分歧:
    - 评测目标不同：单步定位、多步交互工作流、以及拖拽等特定交互原语。
    - 改进层级不同：修改冻结模型的技能或 harness，与通过强化学习或弱监督更新模型参数。
    - 界面假设不同：静态确定性桌面任务与动态连续变化界面，导致不同的失败归因。
    - 监督信号不同：人工标注或生成的可验证任务、未标注截图、可执行环境检查。
    - 可靠性表述不同：后验不确定性排序、共形空间安全、证据驱动故障模式诊断。
    开放问题:
