    report success rate or ranking gains, and stress generalization or distribution
    shift across agentic GUI, web, or mobile tasks.'
  - 'Key differences: Evaluation targets range from single-step GUI grounding to long-horizon
    mobile workflows, browser safety, coding cross-domain tasks, and video-guided
    tasks; supervision and optimization differ across annotated trajectories, verifiable
    online RL, noisy VLM rewards, and human-demo tutorial distillation.'
  - 'Trend evolution: Within the 2024–2026 span, the visible frontier is shifting
    from static benchmark comparisons toward verifiable tasks, efficient online RL,
    calibration, and safety audits; because the selected evidence is concentrated
    in 2026, broader historical trends remain uncertain.'
  - 'Open questions: Systematic survey inclusion criteria, cross-benchmark comparability,
    distribution-shift robustness for safety and uncertainty, and missing limitation
    or reproducibility details remain open.'
  related_work_outline_zh:
  - 主流方向：证据包主要覆盖GUI智能体的基准与系统工作，如视频引导评估、可验证在线RL、长时移动上下文、UQ与安全审计，而非典型综述论文；综述层需将这些证据组织为分类、评测综合与缺口映射。
  - 研究共性：多数工作同时提出基准/数据集与方法/系统，并以成功率或排名为依据；评测日益转向多步、交互式、基于屏幕或网页/移动轨迹。
  - 关键差异：评测目标与监督信号不同，覆盖单步点击定位、长时移动流程、浏览器安全、编码跨域与视频引导任务；优化目标在能力、安全性、不确定性和人类学习之间分化。
  - 趋势演进：可见论文集中于2026年前沿，趋势表现为从静态基准转向可验证任务、在线RL、校准与安全审计；因年份较窄，只能视为当前前沿内的演化。
  - 开放问题：系统综述的纳入标准、跨基准兼容性、分布转移下的安全与UQ可靠性，以及若干论文缺失的局限性和复现信息仍需解决。
  literature_review:
    line_of_work_matrix:
    - line: Taxonomy and roadmap synthesis
      what_it_solves: Organizing fragmented GUI-agent evidence across video grounding,
        computer-use RL, long-horizon mobile control, safety, and uncertainty into
        research directions, milestones, and gaps.
      what_remains_open: Whether the synthesis uses systematic search and inclusion
        criteria rather than selective examples; the packet contains no survey protocol
        evidence.
    - line: Comparative evaluation synthesis
      what_it_solves: Summarizing how different evaluation choices—single-step GUI
        grounding, masked web chains, hand-crafted safety episodes, cross-domain coding
        tasks—shape capability and robustness conclusions.
      what_remains_open: Whether reported success rates and rankings are compatible
        across different baselines, metrics, and dataset distributions; several visible
        works leave limitations unstated.
    - line: Open problem and gap mapping
      what_it_solves: Converting primary evidence into concrete next research questions
        such as long-horizon context management, distribution-shift safety, and uncertainty-transfer
        boundaries.
      what_remains_open: Prioritization of which gaps matter most is not evidenced;
        the packet lacks a formal gap-ranking framework or survey conclusion.
    consensus:
    - 'Contributions cohere around benchmark-plus-method/system evaluation: each work
      constructs or extends a benchmark or dataset and reports success or ranking
      gains on agentic GUI tasks.'
    - Evaluation is becoming more interactive and multi-step, with screenshots, actions,
      or web and mobile episodes serving as core evidence.
    - Generalization and distribution shift are recurrent concerns, visible in out-of-distribution
      benchmarks, masked reputation cues, cross-domain safety checks, and cross-model
      uncertainty transfer.
    - Several visible evidence fields lack limitation statements, so a systematic
      survey must separate reported results from unverified reproducibility signals.
    disagreements:
    - 'Evaluation target differs: single-step executable GUI grounding, long-horizon
      mobile workflows, browser safety episodes, coding-domain cross-reference, and
      video-guided tasks.'
    - 'Training and reward signals differ: supervised fine-tuning with annotated trajectories,
      online RL with verifiable task synthesis, noisy autonomous VLM rewards, and
      demo-to-tutorial distillation.'
    - 'Optimization object differs: capability or success rate versus safety resistance
      versus uncertainty calibration versus human learning and planning quality.'
    - 'Safety conclusions conflict across domains: browser hand-crafted injection
      shows near-total resistance, while coding skill injection succeeds at up to
      100% in the same frontier model class.'
    - Benchmark comparability is weak because works use different baselines, metrics,
      task scopes, and curated datasets, limiting direct cross-paper ordering.
    open_questions:
    - What systematic inclusion criteria would identify actual surveys, taxonomies,
      tutorials, position papers, and roadmaps in this topic, given the packet is
      dominated by primary method and benchmark papers?
    - How do single-step uncertainty-quantification ranking and conformal coverage
      findings transfer to multi-step agent trajectories and shifted interfaces?
    - Where do domain-conditioned safety boundaries fail across browser, coding, mobile,
      and real-world deployment settings?
    - Which missing limitations, code, dataset, baseline, or metric details in the
      visible evidence should be treated as verification gaps rather than negative
      findings?
    - Can evaluation be standardized across OSWorld, ScienceBoard, MemGUI-Bench, MobileWorld,
      Argus, and domain-specific fraud or safety benchmarks without losing task-specific
