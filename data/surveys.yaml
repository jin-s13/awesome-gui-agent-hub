    - line: Diagnostic and recovery evaluation frameworks
      what_it_solves: Measures whether agents recover from state deviations and follow
        personalized user preferences through controlled probes and replay-based consistency
        checks.
      what_remains_open: Long-horizon replay is expensive, recovery metrics may not
