  literature_review:
    line_of_work_matrix:
    - line: Evaluation and audit of GUI-agent uncertainty, safety, and detection
      what_it_solves: Establishes controlled benchmarks for uncertainty calibration
        in GUI grounding, prompt-injection safety in browser/coding agents, and fraud
        detection under sanitized evidence.
      what_remains_open: Findings are constrained to single-step grounding or limited
        task families; cross-model, cross-interface, and domain transfer remain weak
        or domain-conditioned, and optimized attack strings are not reproduced.
    - line: Training-signal and harness synthesis for computer-use agents
      what_it_solves: Generates dense desktop annotations, verifiable RL tasks, or
        automatic harness edits to improve GUI grounding and task completion without
        always retraining frozen models.
      what_remains_open: Gains are measured on selected benchmarks; external validity
        across unseen apps, long-horizon tasks, and open/closed model tiers is not
        established from the provided excerpts.
    - line: Long-horizon and temporal context management in GUI agents
      what_it_solves: Adds proactive context compaction and task-relevant keyframe
        extraction to preserve critical state in long mobile and video-guided GUI
        tasks.
      what_remains_open: Packet limitations are largely absent, so verification gaps
        remain for out-of-distribution robustness, dataset coverage, and whether benefits
        persist beyond the evaluated mobile or video-guided benchmarks.
    - line: Survey and roadmap synthesis for GUI-agent research
      what_it_solves: Intended to organize fragmented work into directions, comparative
        evaluation lessons, and research gaps.
      what_remains_open: The bounded packet does not contain actual survey/taxonomy
        papers; it contains method and benchmark papers, so systematic inclusion criteria
        and gap prioritization cannot be verified.
    consensus:
    - Controlled environment or benchmark design is central to producing comparable
      evidence for GUI-agent progress.
    - Open and frontier VLM agents show task-specific gains from additional supervision,
      harness optimization, or context management, but transfer across datasets and
      model classes remains fragile.
    - Evaluation protocols that remove shortcuts or vary domain conditions expose
      instability in agent confidence, recall, or safety.
    - Reproducibility and auditability are emerging as first-class concerns, especially
      for safety and uncertainty claims.
    disagreements:
    - 'Studies evaluate different capability slices: single-step grounding versus
      multi-step task completion versus safety or fraud decisioning, making direct
      comparison difficult.'
    - 'Approaches differ in what is optimized: frozen-model harness logic, dense supervised
      fine-tuning, online RL with verifiable tasks, or context-management actions.'
    - 'Safety conclusions conflict across domains: frontier browser agents resist
      hand-crafted injections, while coding tasks show high skill-injection success,
      suggesting domain-conditioned rather than model-wide robustness.'
    - Uncertainty rankings are stable within an open-weight tier but do not reliably
      transfer to closed-source vendors, implying evaluation must be target-specific.
    - Some protocols deliberately suppress real-world shortcuts such as URL or reputation
      cues, while others use real desktop, web, or mobile environments; this changes
      external validity.
    open_questions:
    - Can verifiable task synthesis or dense desktop supervision improvements transfer
      to unseen long-horizon tasks outside the reported suites?
    - How should GUI-agent surveys aggregate evidence when evaluation settings, model
      tiers, and domain conditions are not compatible?
    - What explains domain-conditioned safety hardening, and can browser-focused hardening
      extend to coding or other computer-use surfaces?
    - Is target-specific uncertainty recalibration always required when moving between
      open-weight and frontier closed models?
    - Do current long-horizon context management methods remain robust under distribution
      shifts beyond the evaluated mobile or video-guided benchmarks?
  literature_review_zh:
    研究路线矩阵:
    - 路线: GUI智能体不确定性、安全与检测的评测与审计
      解决的问题: 为GUI定位的不确定性校准、浏览器/编码智能体的提示注入安全以及净化证据下的欺诈判断建立受控基准。
      尚未覆盖: 发现局限于单步定位或有限任务族；跨模型、跨接口与跨领域迁移仍然较弱或呈现领域条件化，优化攻击字符串未复现。
    - 路线: 计算机使用智能体的训练信号与执行框架合成
      解决的问题: 生成密集桌面标注、可验证RL任务或自动harness编辑，以改进GUI定位与任务完成，部分方法无需重训冻结模型。
      尚未覆盖: 提升主要在选定基准上观测；未见应用、长时任务和开源/闭源模型层级的跨环境外部效度尚未从提供摘录中确立。
    - 路线: 长时与时间上下文管理
      解决的问题: 通过主动上下文压缩和任务相关关键帧提取，在长时移动与视频引导GUI任务中保留关键状态。
      尚未覆盖: 证据包中的局限性字段大多为空，因此在分布外鲁棒性、数据集覆盖以及能否泛化到已评测移动或视频引导基准之外仍属验证缺口。
    - 路线: GUI智能体研究的综述与路线图综合
      解决的问题: 旨在把碎片化工作组织为方向、对比评测教训与研究缺口。
      尚未覆盖: 有界证据包中没有实际综述/分类学论文，只有方法与基准论文，因此系统性纳入标准和缺口优先级无法验证。
    共识:
    - 受控环境或基准设计是产生GUI智能体可比较证据的核心。
    - 开源与前沿VLM智能体在额外监督、harness优化或上下文管理下获得任务特定提升，但跨数据集与模型类别迁移仍脆弱。
    - 移除捷径或改变领域条件的评测协议会暴露智能体信心、召回或安全的稳定性问题。
    - 可复现性与可审计性正成为安全与不确定性主张的首要关注点。
    分歧:
    - 研究评测不同能力切片：单步定位、多步任务完成、安全或欺诈决策，难以直接比较。
    - 优化对象不同：冻结模型harness逻辑、密集监督微调、可验证任务在线RL或上下文管理动作。
    - 安全结论跨领域冲突：前沿浏览器智能体可抵抗手工注入，但编码任务技能注入成功率高，表明安全是领域条件而非模型全局。
    - 不确定性排名在开源权重层级内稳定，但难以迁移到闭源厂商，要求目标特定评测。
    - 一些协议刻意抑制URL或信誉等真实世界捷径，另一些使用真实桌面、网页或移动环境，外部效度存在差异。
    开放问题:
    - 可验证任务合成或密集桌面监督的收益能否迁移到报告套件之外的长时任务？
    - 当评测设置、模型层级和领域条件不兼容时，GUI智能体综述应如何聚合证据？
    - 什么原因解释领域条件化的安全加固，浏览器加固能否扩展到编码或其他计算机使用界面？
    - 在开源权重与前沿闭源模型之间移动时，是否总是需要目标特定的不确定性重校准？
    - 当前长时上下文管理方法在超出已评测移动或视频引导基准的分布偏移下是否仍稳健？
