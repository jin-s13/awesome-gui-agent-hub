  related_work_outline:
  - 'Mainstream direction: Building realistic GUI/computer-use benchmarks on real
    OS, browser, dynamic, and video-guided interfaces, with fine-grained metrics beyond
    Pass@1 to expose capability gaps.'
  - 'Shared research pattern: Constructing executable tasks/environments, evaluating
    current multimodal agents, and reporting failure modes such as observation control,
    grounding, and transfer rather than only aggregate success.'
  - 'Key differences: Evaluation targets range from static multi-app desktop suites
    to dynamic/video-guided screens; some works measure uncertainty or calibration,
    while others improve agents via skill libraries, harness optimization, weakly
    supervised training, or online RL.'
  - 'Trend evolution: The 2024–2026 frontier moves from fixed task suites toward dynamic
    living-screen/video-guided settings, real-world macOS/OS tasks, multi-checkpoint
    scoring, and method studies that use existing benchmarks for self-improvement
    and calibration.'
  - 'Open questions: Task coverage for real OS/interface variability, transferability
    of fine-grained metrics and uncertainty rankings, and reproducibility gaps from
    missing artifacts or baseline details remain unresolved.'
  related_work_outline_zh:
  - 主流方向：构建更真实的 GUI/计算机使用基准，覆盖真实 macOS、浏览器、动态界面和视频引导任务，并用细粒度指标补充 Pass@1 以暴露能力缺口。
  - 研究共性：围绕可执行交互构建任务，评估现有多模态代理并报告观察控制、UI 定位或迁移等失败模式，而非只看总分。
  - 关键差异：评测对象从静态多应用任务到动态/视频引导界面；有的关注不确定性与校准，有的通过技能库、harness 优化、弱监督训练或在线 RL 改进代理。
  - 趋势演进：2024–2026 处于当前前沿，从固定任务集转向动态屏幕/视频引导设置，并引入多检查点评分、自改进与校准。
  - 开放问题：任务分布是否覆盖真实 OS 与界面变异；细粒度指标和不确定性排名是否跨模型/接口迁移；缺失代码、数据或基线是否影响可复现结论。
  literature_review:
    line_of_work_matrix:
    - line: Real-world desktop and cross-application task suites
      what_it_solves: Makes GUI+CLI computer-use ability comparable across applications
        and frameworks through rule-based multi-checkpoint scoring.
      what_remains_open: Coverage across OS versions, hardware, and application workflows;
        deterministic scoring may miss semantic success or user preferences.
    - line: Dynamic and video-guided interface benchmarks
      what_it_solves: Measures agents on content that changes between actions and
        on video-guided interactive tasks.
      what_remains_open: Evidence is limited to short-video/browser or selected video
        settings; generalization to other dynamic interfaces and long-horizon tasks
        remains untested.
    - line: Fine-grained grounding, cost-accuracy, and uncertainty evaluation
      what_it_solves: Probes UI grounding, observation efficiency, and confidence
        calibration instead of only final task accuracy.
      what_remains_open: Single-step uncertainty evidence does not cover multi-step
        agent trajectories; cross-model and cross-interface ranking transfer is weak.
    - line: Benchmark-driven self-improvement and training methods
      what_it_solves: Uses OSWorld, ScienceBoard, CUA-World, and related suites to
        improve frozen or open agents via harness edits, RL, weak supervision, or
        verifiable task synthesis.
      what_remains_open: Task synthesis and harness optimization may overfit benchmark
        surfaces; transfer and data requirements beyond tested suites need more evidence.
    - line: Multimodal skill and capability artifacts
      what_it_solves: Provides retrievable visual-text skills for application workflows,
        improving UI element identification and state verification.
      what_remains_open: Artifact construction cost, cross-app/benchmark transfer,
        and maintenance under interface changes are not fully established.
    consensus:
    - 'Executable environment fidelity matters: studies converge on real/desktop/browser
      settings rather than only static screenshots.'
    - 'Aggregate success is insufficient: multi-checkpoint, cost-accuracy, sub-goal,
      and uncertainty/calibration metrics reveal differences hidden by Pass@1.'
    - Frontier GUI agents still show observable capability gaps, especially in observation
      control, grounding transfer, and generalization beyond tested interfaces.
    - Training, harness, or skill interventions can improve the same frozen backbone,
      so evaluation conclusions are sensitive to the agent wrapper and environment.
    disagreements:
    - 'Evaluation target differs: single-step GUI grounding, multi-step desktop workflows,
      and dynamic/video-guided screens are treated separately.'
    - 'Intervention approach differs: retrieve multimodal skills, optimize the execution
      harness, train with weak supervision or online RL, or synthesize verifiable
      tasks.'
    - 'Metric priority differs: deterministic rule-based scoring, cost-accuracy efficiency,
      uncertainty ranking transfer, and SOTA success rates are emphasized differently.'
    - 'Deployment setting differs: real macOS desktop, browser-simulated platforms,
      video-guided tasks, or containerized OSWorld/ScienceBoard tasks.'
    open_questions:
    - Do current benchmark task distributions cover the settings where computer-use
      agents are expected to help, such as long-horizon workflows, OS/version drift,
      and permission-restricted apps?
    - Which fine-grained metrics best predict downstream user utility and safe deployment
      when Pass@1, cost-accuracy, and uncertainty rankings may not transfer across
      models or interfaces?
    - How stable are benchmark conclusions across implementation harnesses, compute
      budgets, and repeated runs, especially when harness optimization yields large
      gains on frozen models?
    - Can uncertainty quantification extend beyond single-step grounding to multi-step
      GUI trajectories and dynamic screens without target-specific re-ranking?
    - Where do missing artifacts and baseline details limit direct comparison, and
      how should reporting standards separate methodology evidence from popularity
      or recency signals?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 真实桌面与跨应用任务套件
      解决的问题: 通过规则化多检查点评分，让 GUI+CLI 计算机使用能力在应用和框架之间可比。
      尚未覆盖: 跨 OS 版本、硬件和工作流的覆盖；确定性评分可能遗漏语义成功或用户偏好。
    - 路线: 动态与视频引导界面基准
      解决的问题: 评估内容在动作间变化以及视频引导交互任务中的代理表现。
      尚未覆盖: 目前限于短视频/浏览器或选定视频设置；对其他动态界面和长程任务的泛化未充分检验。
    - 路线: 细粒度定位、成本效率与不确定性评估
      解决的问题: 在最终任务准确率之外，考察 UI 定位、观察效率和置信度校准。
      尚未覆盖: 单步不确定性证据未覆盖多步代理轨迹；跨模型、跨接口的排名迁移较弱。
    - 路线: 基准驱动的自改进与训练方法
      解决的问题: 利用 OSWorld/ScienceBoard/CUA-World 等套件，通过 harness 编辑、RL、弱监督或可验证任务合成改进冻结或开源代理。
      尚未覆盖: 任务合成和 harness 优化可能过拟合基准表面；跨套件迁移和真实部署证据不足。
    - 路线: 多模态技能与能力工件
      解决的问题: 提供可检索的视觉-文本应用工作流技能，改善 UI 元素识别和状态验证。
      尚未覆盖: 工件构建成本、跨应用/基准迁移及界面变化下的维护尚无充分证据。
    共识:
    - 可执行环境的保真度很重要：研究趋向真实桌面/浏览器设置，而非仅静态截图。
    - 总分不够：多检查点、成本-准确率、子目标和不确定性/校准等细粒度指标能揭示 Pass@1 隐藏的差异。
    - 前沿 GUI 代理仍存在可观察的能力缺口，尤其是观察控制、定位迁移和跨界面泛化。
    - 对同一冻结骨干，训练/harness/技能干预可提升表现，说明评测结论对执行框架和环境敏感。
    分歧:
    - 评测目标不同：单步 GUI 定位、多步桌面工作流与动态/视频引导屏幕各有侧重。
    - 干预方式不同：检索多模态技能、优化执行 harness、弱监督或在线 RL 训练、可验证任务合成。
    - 指标重点不同：确定性规则评分、成本-准确率效率、不确定性排名迁移与 SOTA 成功率。
    - 部署设置不同：真实 macOS 桌面、浏览器模拟平台、视频引导任务或容器化 OSWorld/ScienceBoard 任务。
    开放问题:
    - 当前任务分布是否覆盖计算机使用代理预期帮助的真实设置，例如长程工作流、OS/版本漂移和权限受限应用？
    - 当 Pass@1、成本-准确率和不确定性排名不能跨模型或接口迁移时，哪些细粒度指标最能预测下游用户效用和部署安全？
    - 在 harness 优化能带来大额冻结模型增益的情况下，基准结论在不同实现、算力预算和重复运行下是否稳定？
