  related_work_outline:
  - 'Mainstream direction: Building realistic GUI/OS automation benchmarks that evaluate
    frontier VLM agents on desktop, dynamic short-video, drag, and video-guided tasks,
    with growing emphasis on fine-grained and cost-aware metrics beyond aggregate
    pass rates.'
  - 'Shared research pattern: Works construct task suites or environments, compare
    multiple VLM agents/frameworks, and treat visual grounding and action grounding
    as core challenges; they add sub-goal, efficiency, or uncertainty signals to aggregate
    success.'
  - 'Key differences: They differ in interface dynamics and interaction scope (static
    desktop, dynamic content, drag, video-guided), evaluation target (Pass@1, cost-accuracy,
    uncertainty coverage), and agent-improvement strategy (skill libraries, weak supervision,
    verifiable synthetic RL, fine-tuning).'
  - 'Trend evolution: Within 2024-2026, the frontier is moving from click-focused
    static benchmarks toward more dynamic, multimodal, and fine-grained evaluation,
    and from benchmarking alone toward using benchmarks to train or equip agents with
    skills and synthesized tasks.'
  - 'Open questions: Evidence gaps remain around long-horizon multi-step coverage,
    observation control, metric-to-utility alignment, uncertainty transfer across
    model classes/interfaces, and reproducibility of benchmark-driven training gains.'
  related_work_outline_zh:
  - 主流方向：构建真实 GUI/OS 自动化基准，在桌面、动态短视频、拖拽和视频引导任务上评估前沿 VLM 代理，并越来越重视总分之外的细粒度和成本感知指标。
  - 研究共性：工作普遍构建任务集或环境，比较多模型/框架，并将视觉定位与动作定位作为核心挑战；在总分之上补充子目标、效率或不确定性信号。
  - 关键差异：界面动态与交互范围不同，如静态桌面、动态内容、拖拽、视频引导；评测目标不同，如 Pass@1、成本-准确性、不确定性覆盖；代理提升策略不同，如技能库、弱监督、可验证合成
    RL、微调。
  - 趋势演进：2024-2026 年内，前沿正从点击式静态基准转向更动态、多模态和细粒度评估，并从单纯评测转向用基准训练或装备代理。
  - 开放问题：证据缺口集中在长程多步覆盖、观察控制、指标与效用对齐、跨模型类别/接口的不确定性迁移，以及基准驱动训练收益的可复现性。
  literature_review:
    line_of_work_matrix:
    - line: Real-world and dynamic GUI task and dataset design
      what_it_solves: Creates shared environments and task suites spanning desktop
        OS, dynamic short-video interfaces, drag interactions, and video-guided tasks
        so agent capabilities can be compared.
      what_remains_open: Coverage is concentrated in specific platforms or simulated
        settings; long-horizon multi-step workflows and cross-platform OS/mobile/web
        generalization lack clear evidence.
    - line: Fine-grained metric and stress-test design
      what_it_solves: Adds sub-goal scoring, cost-accuracy, drag grounding, and post-hoc
        uncertainty or conformal evaluation beyond Pass@1 to expose hidden capability
        differences.
      what_remains_open: Whether these proxy metrics align with downstream user utility,
        and whether uncertainty rankings transfer across model classes and interfaces,
        remains unresolved.
    - line: Benchmark-driven agent bootstrapping and task synthesis
      what_it_solves: Uses multimodal skill libraries, weakly supervised unannotated
        screenshots, and verifiable synthetic RL tasks to improve GUI agents.
      what_remains_open: The influence of annotation volume, environment fidelity,
        and compute on stable conclusions is not fully evidenced; training gains may
        not generalize beyond chosen baselines and benchmarks.
    - line: Comparable baselines and reporting artifacts
      what_it_solves: Makes results auditable through multiple frameworks, models,
        and artifact signals.
      what_remains_open: Several summaries lack limitation details or accessible artifact
        metadata in the provided packet, so replication stability remains a verification
        gap.
    consensus:
    - GUI agent benchmarks are moving beyond click-only static environments toward
      richer interaction modes, including GUI+CLI, drag, dynamic content, and video-guided
      tasks.
    - Aggregate task success is insufficient; fine-grained evaluation of sub-goal
      completion and information efficiency reveals differences hidden by Pass@1.
    - Frontier models still show clear weaknesses in observation control, uncertainty
      calibration, and interaction types outside click-based workflows.
    - Visual grounding and multimodal understanding are treated as central capabilities
      for computer-use agents.
    disagreements:
    - 'Evaluation targets differ: some works measure end-to-end Pass@1, while others
      measure cost-accuracy or post-hoc uncertainty/conformal coverage, making direct
      comparison difficult.'
    - 'Supervision and training signals differ: unannotated screenshot weak supervision,
      verifiable synthetic RL tasks, and curated skill libraries optimize different
      failure modes.'
    - 'Interaction scope differs: static desktop tasks, dynamic short-video interfaces,
      drag-only tasks, and video-guided tasks expose different agent limitations.'
    - 'Scoring and coverage differ: deterministic rule-based scoring coexists with
      model/human reference or post-hoc calibration, affecting comparability and generalizability.'
    open_questions:
    - Do current GUI benchmark task distributions cover the long-horizon, multi-step,
      cross-application workflows users actually care about?
    - How can observation control be measured and improved without conflating task
      success with information efficiency?
    - Which uncertainty signals transfer across open-weight and closed-source VLM
      agents, and how should safety or conformal metrics adapt to interface shifts?
    - Can weakly supervised, synthetic, or skill-based training produce gains that
      remain stable across frameworks, models, and compute budgets?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 真实与动态 GUI 任务与数据集设计
      解决的问题: 构建桌面 OS、短视频动态界面、拖拽和视频引导任务的共享环境与任务集，使代理能力可比较。
      尚未覆盖: 覆盖集中在特定平台或模拟设置，长程多步工作流以及跨平台 OS/mobile/web 泛化缺乏明确证据。
    - 路线: 细粒度指标与压力测试设计
      解决的问题: 在 Pass@1 之外引入子目标评分、成本-准确性、拖拽定位和不确定性/共形评估，以暴露隐藏能力差异。
      尚未覆盖: 这些代理指标是否与用户下游效用一致，以及不确定性排名能否跨模型类别和接口迁移仍未解决。
    - 路线: 基准驱动的代理训练与任务合成
      解决的问题: 使用多模态技能库、未标注截图弱监督和可验证合成 RL 任务提升 GUI 代理。
      尚未覆盖: 标注量、环境保真度和算力对结论稳定性的影响尚未充分证明；训练收益可能无法泛化到所选基线和基准之外。
    - 路线: 可比基线与报告工件
      解决的问题: 通过多框架、多模型对比和工件信号使结果可审计。
      尚未覆盖: 证据包中若干条目缺少 limitations 或可访问工件元数据，复制稳定性仍属验证缺口。
    共识:
    - GUI 代理基准正从纯点击静态环境转向 GUI+CLI、拖拽、动态内容和视频引导等更丰富的交互模式。
    - 仅看总分不够，子目标完成和信息效率等细粒度评估能揭示 Pass@1 隐藏的差异。
    - 前沿模型在观察控制、不确定性校准和点击以外交互类型上仍存在明显不足。
    - 视觉定位和多模态理解被视为计算机使用代理的核心能力。
    分歧:
    - 评测目标不同：有些工作衡量端到端 Pass@1，有些衡量成本-准确性或后验不确定性/共形覆盖率，难以直接比较。
    - 监督与训练信号不同：未标注截图弱监督、可验证合成 RL 任务和精选技能库分别优化不同失败模式。
