  related_work_outline:
  - 'Mainstream direction: building and evaluating GUI agents via fine-grained computer-use
    benchmarks and self-improvement/training methods, with emphasis on open-source
    action grounding and real or dynamic interfaces.'
  - 'Shared research pattern: pair a task benchmark or training recipe with frontier
    VLM baselines and report task success plus finer signals such as subgoal completion,
    cost-accuracy, or uncertainty transfer.'
  - 'Key differences: evaluation settings include desktop GUI+CLI, dynamic short-video,
    drag interactions, video-guided tasks, and single-step grounding; methods differ
    by optimizing the model, execution harness, or visual grounding from unannotated
    screenshots.'
  - 'Trend evolution: within the available 2026 frontier, the field is moving from
    Pass@1-only evaluation toward fine-grained capability, reliability, data efficiency,
    and self-improvement.'
  - 'Open questions: cross-interface transfer, isolating method contribution from
    system choices, observation control, uncertainty calibration under shift, and
    multi-step trajectory evaluation.'
  related_work_outline_zh:
  - 主流方向：通过更细粒度的计算机使用基准和自改进/训练方法构建与评估 GUI 代理，强调开源动作定位和真实或动态界面。
  - 研究共性：将任务基准或训练配方与前沿 VLM 基线配对，在任务成功率之外报告子目标、成本-准确性或不确定性等细粒度信号。
  - 关键差异：评测对象包括桌面 GUI+CLI、动态短视频、拖拽、视频引导任务和单步定位；方法分别优化模型、执行框架或利用未标注截图学习视觉定位。
  - 趋势演进：可见证据集中在 2026 年前沿，领域从只看 Pass@1 转向细粒度能力、可靠性、数据效率和自改进。
  - 开放问题：跨界面迁移、方法贡献与系统选择解耦、观察控制、分布偏移下的不确定性校准和多步轨迹评测。
  literature_review:
    line_of_work_matrix:
    - line: GUI benchmark and evaluation design
      what_it_solves: characterizes GUI grounding and computer-use capabilities with
        fine-grained scoring across desktop, dynamic, drag, and video-guided settings
      what_remains_open: coverage is constrained by platform-specific task suites
        and short or single-step episodes; cross-interface and long-horizon generalization
        is not established
    - line: GUI action prediction via supervision, RL, and self-improvement
      what_it_solves: reduces reliance on human annotations and improves frozen or
        trainable models through unannotated screenshots, verifiable task synthesis,
        online RL, or execution-harness evolution
      what_remains_open: gains are not yet isolated from backbone models, harness
        choices, task priors, or framework components; several limitations are unreported
    - line: Reliability and observation-aware grounding
      what_it_solves: quantifies grounding confidence, builds conformal click regions,
        and exposes missing observation control in dynamic interfaces
      what_remains_open: existing evidence mostly covers single-step grounding; cross-model
        uncertainty transfer is weak and calibration degrades under interface or distribution
        shift
    consensus:
    - Frontier VLMs still show non-human reliability gaps such as sub-goal failure,
      over- and under-observation, and weak cross-model uncertainty transfer.
    - Fine-grained evaluation beyond Pass@1 is needed because similarly successful
      agents differ on subgoals, information efficiency, or confidence quality.
    - Self-improvement, weakly supervised training, and RL scaling can improve open-source
      computer-use agents without solely relying on large human-annotated datasets.
    - 'Performance attribution is fragile: one study found a skill library, not framework
      design, drove the strongest configuration, pointing to system-level confounds.'
    disagreements:
    - 'Evaluation targets and interfaces differ: desktop GUI+CLI, dynamic short-video,
      drag interactions, video-guided tasks, and single-step GUI grounding produce
      incomparable capability estimates.'
    - 'Improvement strategy differs: one line optimizes a frozen execution harness,
      another uses online RL with synthesized tasks, and another learns visual grounding
      from unannotated screenshots, implying different data and model-access assumptions.'
    - 'Reliability assessment differs: one line targets post-hoc uncertainty ranking
      and conformal click regions, another targets observation cost, and another targets
      fine-grained task completion, without a shared multi-step protocol.'
    open_questions:
    - Which evaluation dimensions transfer across platforms, interfaces, and multi-step
      trajectories rather than remaining specific to a test suite?
    - How much of each reported gain comes from the proposed method versus backbone
      model, task synthesis, harness, or interface assumptions when limitations are
      not reported?
    - Can uncertainty scoring and conformal calibration remain valid across open and
      closed VLM families and under realistic GUI deployment shifts?
    - What observation-control or memory mechanism would reduce over- and under-observation
      in dynamic interfaces such as short-video platforms?
    - Can drag, video-guided, and desktop GUI benchmarks be unified into a shared
      action-grounding evaluation without sacrificing their specific validity?
  literature_review_zh:
    研究路线矩阵:
    - 路线: GUI 基准与评测设计
      解决的问题: 在桌面、动态界面、拖拽和视频引导等设置中，用细粒度评分刻画 GUI 定位与计算机使用能力
      尚未覆盖: 覆盖受限于平台特定任务套件和短或单步片段，跨界面与长程泛化未被证实
    - 路线: 通过监督、强化学习与自改进进行 GUI 动作预测
      解决的问题: 通过未标注截图、可验证任务合成、在线强化学习或执行框架演进，减少人工标注依赖并提升冻结或可训练模型
      尚未覆盖: 收益尚未与骨干模型、执行框架、任务先验或系统组件隔离，部分限制未报告
    - 路线: 可靠性与观察感知定位
      解决的问题: 量化定位置信度、构建共形点击区域，并揭示动态界面中观察控制能力缺失
      尚未覆盖: 现有证据主要覆盖单步定位；跨模型不确定性迁移弱，且校准在界面或分布偏移下退化
    共识:
    - 前沿 VLM 仍存在非人类水平的可靠性缺口，如子目标失败、过度/不足观察和跨模型不确定性迁移弱。
    - 仅看 Pass@1 不够，因为成功率相近的代理在子目标、信息效率或置信度质量上可能差异明显。
    - 自改进、弱监督训练和 RL 扩展能减少对大规模人工标注的依赖并提升开源计算机使用代理。
    - 性能归因脆弱：一项研究发现技能库而非框架设计驱动最佳配置，说明系统级混淆因素很重要。
    分歧:
    - 评测目标与界面不同：桌面 GUI+CLI、动态短视频、拖拽、视频引导任务和单步 GUI 定位产生不可直接比较的能力估计。
    - 改进策略不同：一方优化冻结执行框架，一方用合成任务做在线 RL，另一方从未标注截图学习视觉定位，反映不同的数据和模型访问假设。
    - 可靠性评估不同：一方关注后验不确定性排序和共形点击区域，一方关注观察成本，另一方关注细粒度任务完成，尚未形成共享的多步协议。
    开放问题:
    - 哪些评测维度能跨平台、跨界面和多步轨迹迁移，而不只限于特定测试套件？
    - 在限制未报告时，报告收益中有多少来自方法本身，而不是骨干模型、任务合成、执行框架或界面假设？
    - 不确定性评分和共形校准能否在开源与闭源 VLM 家族间以及真实 GUI 部署偏移下保持有效？
    - 需要何种观察控制或记忆机制来减少短视频平台等动态界面中的过度与不足观察？
    - 能否将拖拽、视频引导和桌面 GUI 基准统一为共享的动作定位评测，同时保留各自有效性？
