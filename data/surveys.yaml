  literature_review_zh:
    研究路线矩阵:
    - 路线: 以基准为载体的任务与交互抽象（如 MacAgentBench、LivingScreen、DragOn）
      解决的问题: 把真实桌面、动态短视频和拖拽式GUI交互转化为规则化或环境模拟的任务套件，并提供更细的子目标和成本-准确性度量。
      尚未覆盖: 抽象仍按平台或交互类型划分，未形成统一的观察控制或跨界面迁移的形式化说明。
    - 路线: GUI grounding 的可靠性与不确定性量化（如 Argus）
      解决的问题: 评估后验不确定性方法在GUI grounding上的表现，并用共形点击区域刻画空间安全。
      尚未覆盖: 证据集中在单步grounding；跨模型排名迁移弱，校准/测试或界面不匹配下覆盖率下降。
    - 路线: 弱监督与可验证任务驱动的训练（如 GUICrafter、ScaleCUA）
      解决的问题: 通过挖掘未标注截图或合成可验证任务，减少对昂贵人工标注的依赖。
      尚未覆盖: 缩放与失败预测主张缺少更广泛部署场景的直接验证；可见分析中常缺明确局限性说明。
    - 路线: 面向长时程计算机使用的技能、记忆与上下文增强（如 VISUALSKILL、MemGUI-Agent）
      解决的问题: 通过保留视觉技能工件或将上下文管理作为第一类动作，提升子目标完成度。
      尚未覆盖: 收益主要在所选基准上体现，跨应用、跨平台和失败边界的迁移尚未充分报告。
    共识:
    - 细粒度评测信号（子目标完成、成本-准确性、能力注释）能揭示聚合Pass@1隐藏的差异。
    - 视觉grounding和保留视觉信息有助于识别UI元素与验证工作流状态。
    - 上下文或观察管理是反复出现的瓶颈，动态短视频和移动长时程任务均暴露该问题。
    - 标注效率受到关注：弱监督和可验证合成任务被用作昂贵人工标注的替代路径。
    分歧:
    - 评测目标不同：真实macOS桌面GUI+CLI、动态短视频环境、纯拖拽交互和移动长时程任务各有不同有效性边界。
    - 监督方式不同：未标注截图预训练、可验证合成在线强化学习、有监督技能或上下文微调与后验不确定性基准评测分别优化不同目标。
    - 指标不同：确定性规则Pass@1和子目标检查、成本-准确性信息效率、UQ排名稳定性和共形覆盖率并不统一。
    - 交互重点不同：点击/输入、拖拽、GUI+CLI和动态观察控制被分别处理，尚未纳入同一交互理论。
    开放问题:
    - 动态或拖拽式GUI交互的形式化任务抽象能否预测失败模式并跨平台迁移，而不是只在固定任务套件上排序模型？
    - 闭源代理内部状态不可访问时，哪些不确定性量化信号在分布偏移下仍可靠？
    - 多模态技能或主动上下文动作能否在已报告基准和模型家族之外提升长时程可靠性？
    - 可见的多数高证据论文分析未明确列出局限，弱监督或可验证监督与安全、校准之间的假设需要哪些直接验证？
