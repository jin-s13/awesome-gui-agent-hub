  literature_review:
    line_of_work_matrix:
    - line: Formal task and interface abstractions for GUI evaluation
      what_it_solves: Maps heterogeneous GUI interactions such as static desktop/CLI,
        dynamic short-video, and drag manipulation into reproducible task suites and
        fine-grained metrics, including Pass@1, cost-accuracy, sub-goal checks, and
        grounding accuracy.
      what_remains_open: Generalization beyond short-video and macOS or desktop settings
        remains unresolved, and no unified abstraction links interface dynamics to
        observation control or reliability.
    - line: Externalized capability adaptation through skills and harness optimization
      what_it_solves: Improves frozen agent behavior by adding multimodal skill libraries
        or by diagnosing and editing execution harnesses using before/after screenshots
        and repeated runs.
      what_remains_open: Transfer evidence is limited to OSWorld, CUA-World, OSExpert-Eval,
        and WindowsAgentArena; limitation statements are largely absent, leaving scaffold
        failure modes and reuse boundaries unclear.
    - line: Scalable supervision and verifiable reinforcement learning for computer-use
        agents
      what_it_solves: Reduces dependence on human annotation or manual task design
        through weak supervision from unannotated screenshots and verifiable task
        synthesis for online RL.
      what_remains_open: Assumptions enabling verifiability and weak supervision are
        not shown to hold across operating systems and applications; reported gains
        remain benchmark-specific on OSWorld and ScienceBoard.
    - line: Reliability and uncertainty quantification for GUI grounding
      what_it_solves: Measures post-hoc confidence calibration and spatial action
        safety for single-step GUI grounding across open-weight and closed-source
        vision-language models.
      what_remains_open: Evidence is limited to single-step grounding; cross-model
        and cross-interface rank transfer is weak, and conformal coverage degrades
        under distribution or interface mismatch.
    consensus:
    - GUI capability is treated as measurable through decomposed task, sub-goal, action,
      and grounding evidence rather than a single overall score.
    - Frozen vision-language backbones can be improved through external scaffolds
      such as skill libraries, harness edits, generated curricula, or post-hoc calibration.
    - Evaluation is expanding from pass rates to cost-accuracy, fine-grained sub-goal
      metadata, drag interaction grounding, and uncertainty-aware confidence measures.
    - Dynamic and non-click interactions expose weaknesses in current agents, especially
      observation control and grounding transfer.
    - Several high-relevance records contain empty limitation fields or limited code
      and dataset links, so methodology and reproducibility claims should be treated
      as verification gaps.
    disagreements:
    - 'Training regime: some work updates models via online RL or weak supervision,
      while other work keeps the backbone frozen and changes external skills or harness
      behavior.'
    - 'Evaluation setting: static desktop/CLI, dynamic short-video, drag-based interaction,
      and single-step grounding are assessed as separate abstractions with different
      assumptions.'
    - 'Reliability integration: uncertainty quantification is treated as a post-hoc
      benchmark rather than embedded into agent planning, training, or task evaluation.'
    - 'Success metric: Pass@1, sub-goal completion, cost-accuracy, conformal coverage,
      and held-out transfer gains each encode different definitions of agent competence.'
    - 'Interaction mode: task suites differ in whether they model GUI plus CLI, living-screen
      content change, drag manipulation, or short-video platform dynamics.'
    open_questions:
    - How do skill and harness improvements transfer to unseen operating systems,
      applications, and interaction modalities beyond the benchmark platforms in the
      evidence?
    - Can uncertainty and reliability measures be extended from single-step GUI grounding
      to multi-step agent trajectories and closed-source deployments?
    - What formal assumptions are needed for verifiable task synthesis and weakly
      supervised grounding to remain valid across dynamic interfaces?
    - What evaluation abstraction would unify observation control, sub-goal completion,
      and calibration without overfitting to a specific platform?
