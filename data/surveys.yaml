  literature_review_zh:
    研究路线矩阵:
    - 路线: 面向桌面、网页、移动与动态媒体的真实GUI任务基准
      解决的问题: 提供应用相关任务集和基于规则、子目标、定位或成本精度的指标，用于比较GUI代理。
      尚未覆盖: 跨平台与跨交互类型的覆盖仍不均匀，动态观察控制和真实可靠性仍未有结论。
    - 路线: 多模态技能与流程知识库
      解决的问题: 将工作流和视觉参考编码为分层多模态技能或已编译状态机，以提高准确率或重复任务速度。
      尚未覆盖: 跨应用、界面更新和非重复任务的迁移未见证据；可视化技能收益限于已报告基准。
    - 路线: 大规模定位数据集与模型训练流程
      解决的问题: 通过大规模截图/指代表达数据集和监督微调、D2RL或块级扩散训练提升元素定位与导航。
      尚未覆盖: 跨平台和跨规模的泛化，以及数据与训练算法的相对贡献仍不明确。
    - 路线: 动态与视频GUI感知及观察控制
      解决的问题: 从动态或视频界面提取与任务相关的视觉证据，并衡量信息效率。
      尚未覆盖: 已识别出过度或不足观察失败，但缺少在短视频和视频引导基准之外的通用解决方案。
    - 路线: 成功GUI任务运行的编译与重放
      解决的问题: 将成功轨迹编译为带屏幕检查的状态机程序，消除逐步语言模型调用并加速重复任务。
      尚未覆盖: 对界面漂移、任务变化和长流程专业工作流的稳健性缺少证据；回退仅在基准层面得到验证。
    共识:
    - 应用导向的评估更多报告子目标进展、定位准确率或信息成本，而非只报告最终成功率，从而暴露粗粒度通过率隐藏的失败模式。
    - 领域特定的视觉和流程信息有助于提升代理：保留视觉图形、收集拖拽或截图定位数据、在应用数据上微调都能改善表现。
    - 现有GUI代理在动态媒体、拖拽操作和多任务观察控制上仍未达到人类级别可靠性。
    - 桌面、网页、移动平台以及GUI+CLI交互被视为相互关联的代理能力面，而不是彼此独立的评估标签。
    分歧:
