  related_work_outline:
  - 'Mainstream direction: Building comprehensive benchmarks and training methods
    for GUI agents that handle dynamic, long-horizon, and multi-modal interactions
    beyond simple click-based tasks.'
  - 'Shared research pattern: Constructing fine-grained evaluation protocols or training
    pipelines that leverage synthetic/unannotated data to expose model weaknesses
    in sub-goal completion, observation control, and interaction diversity.'
  - 'Key differences: Benchmarks target heterogeneous platforms (macOS, short-video,
    mobile, drag-based) and interaction primitives; training approaches diverge into
    weak supervision, online RL with verifiable task synthesis, and proactive context
    management, each making different assumptions about data availability and deployment
    constraints.'
  - 'Trend evolution: Within the 2024–2026 frontier, the field is shifting from static
    screenshots and single-step evaluation toward dynamic, living interfaces; from
    click-only actions to drag, video-guided, and observation-aware actions; and from
    fully supervised fine-tuning to data-efficient and reinforcement-based adaptation.'
  - 'Open questions: How to unify evaluation across platforms and interaction types
    so that agent rankings transfer reliably; whether weak supervision or synthetic
    RL tasks capture the long tail of real-world GUI states; how to integrate observation
    control into policy learning without sacrificing task completion; and how to scale
    context management for very long-horizon sessions without losing critical information.'
  related_work_outline_zh:
  - 主流方向：构建面向动态、长时域和多模态交互的GUI代理综合基准与训练方法，超越简单的点击式任务。
  - 研究共性：设计细粒度评估协议或利用合成/未标注数据的训练管线，以揭示模型在子目标完成、观察控制和交互多样性方面的不足。
  - 关键差异：基准测试覆盖异构平台（macOS、短视频、移动端、拖拽）与交互原语；训练路径分为弱监督、基于可验证任务合成的在线强化学习，以及主动上下文管理，各方法对数据可用性和部署约束的假设不同。
  - 趋势演进：在2024-2026年前沿内，领域正从静态截图和单步评估转向动态、living界面；从仅点击动作扩展到拖拽、视频引导和观察感知动作；从全监督微调转向数据高效和基于强化学习的自适应。
  - 开放问题：如何统一跨平台和交互类型的评估协议，使代理排名可靠迁移；弱监督或合成RL任务能否覆盖真实世界GUI状态的长尾分布；如何在不牺牲任务完成的前提下将观察控制集成到策略学习中；如何在极长时域会话中扩展上下文管理而不丢失关键信息。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark design and evaluation protocols
      what_it_solves: Provides standardized tasks, fine-grained metrics, and evaluation
        protocols to reliably compare GUI agent capabilities across diverse platforms
        and interaction types.
      what_remains_open: Existing benchmarks are limited to specific platforms and
        interaction modes (e.g., macOS desktop, short-video, drag-based), and evaluation
        mainly focuses on single-step or short-horizon tasks, leaving multi-step,
        cross-application, and dynamic environment generalization largely unverified;
        uncertainty quantification benchmarks only cover single-step grounding and
        show weak cross-model transfer.
    - line: Data-efficient training and representation learning
      what_it_solves: Reduces reliance on expensive human annotations through weak
        supervision from unannotated screenshots, curriculum learning, and verifiable
        task synthesis for online RL; improves long-horizon performance by structured
        context management.
      what_remains_open: Weakly supervised methods depend on the quality and coverage
        of unannotated web data; RL-based approaches risk distribution mismatch between
        synthetic tasks and real-world GUI dynamics; context management strategies
        have been validated on relatively short trajectories and may not scale to
        arbitrarily long sessions with complex state dependencies.
    - line: Interaction primitives and observation control
      what_it_solves: Expands agent capabilities beyond click-only actions to include
        drag, video-guided keyframe extraction, and dynamic observation control, enabling
        agents to handle dynamic or long-form interactive content.
      what_remains_open: How to integrate these diverse interaction primitives into
        a unified agent architecture without combinatorial explosion; observation
        control policies are not yet learned end-to-end with task objectives, and
        current models exhibit over- or under-observation, indicating missing cost-sensitive
        observation strategies.
    consensus:
    - Contemporary GUI agent research is moving beyond static click-based tasks toward
      dynamic, multi-modal, and long-horizon scenarios, as evidenced by new benchmarks
      targeting short-video platforms, drag interactions, and multi-application workflows.
    - Fine-grained evaluation metrics (e.g., sub-goal completion, cost-accuracy, checkpoint-level
      scoring) are critical for distinguishing models that achieve similar overall
      success rates, and consensus holds that traditional Pass@1 alone is insufficient.
    - Leveraging unannotated or synthetic data is a key theme across training methods,
      with multiple works showing that competitive performance can be achieved with
      only a fraction of the human-annotated data previously required.
    - Current agents universally lack reliable observation control, either over-observing
      or under-observing dynamic content, which is recognized as a fundamental capability
      gap that limits deployment on living interfaces.
    disagreements:
    - 'Benchmarks differ in platform and interaction scope: one targets macOS desktop
      with GUI+CLI, another focuses on short-video dynamic interfaces, a third on
      drag-based interactions, and yet another on mobile long-horizon tasks, leading
      to platform-specific performance rankings that may not generalize.'
    - 'Training methodology diverges: some works advocate weak supervision and curriculum
      learning with minimal annotation, others emphasize online RL with verifiable
      task synthesis and frontier sampling, and a third stream promotes proactive
      context management via action-augmented policies, reflecting different assumptions
      about data availability, compute budget, and deployment latency.'
    - 'Uncertainty quantification studies reveal that the best UQ method depends on
      the model family and interface: hidden-state and density methods are strong
      for open-weight models, but rankings do not transfer to closed-source models,
      suggesting that evaluation and calibration strategies must be tailored to model
      access and architecture rather than a single best practice.'
    open_questions:
    - Can a unified evaluation suite be built that covers static, dynamic, drag-based,
      and multi-application tasks while providing consistent model rankings across
      platforms?
    - To what extent do weak supervision signals from unannotated screenshots capture
      the long-tail of real-world GUI states, and when do synthetic RL tasks fail
      to bridge the gap?
    - How can observation control be formalized as a learnable policy component that
      balances information gain with task completion cost, and what training signal
      enables that balance?
    - What are the scaling limits of current context management techniques when trajectory
      lengths grow to thousands of steps, and how can critical information be preserved
      without exceeding context windows?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准设计与评估协议
      解决的问题: 提供标准化任务、细粒度指标和评估协议，以在跨平台、跨交互类型下可靠比较GUI代理能力。
      尚未覆盖: 现有基准局限于特定平台和交互模式（如macOS桌面、短视频、拖拽），且评估主要针对单步或短时域任务，多步、跨应用和动态环境泛化未被充分验证；不确定性量化基准仅覆盖单步grounding，且跨模型迁移性弱。
    - 路线: 数据高效训练与表示学习
      解决的问题: 通过利用未标注截图的弱监督、课程学习以及可验证任务合成实现在线RL，减少对昂贵人工标注的依赖；通过结构化上下文管理提升长时域性能。
      尚未覆盖: 弱监督方法依赖未标注数据的质量与覆盖范围；基于RL的方法面临合成任务与真实世界GUI动态的分布不匹配；上下文管理策略仅在相对短的轨迹上验证，可能无法扩展到包含复杂状态依赖的极长会话。
    - 路线: 交互原语与观察控制
      解决的问题: 将代理能力从仅点击扩展到拖拽、视频引导关键帧提取和动态观察控制，使代理能够处理动态或长时域交互内容。
      尚未覆盖: 如何将多样交互原语集成到统一代理架构中而不产生组合爆炸；观察控制策略尚未与任务目标端到端联合学习，当前模型普遍存在过度观察或观察不足，缺少成本敏感的观察策略。
    共识:
    - 当前GUI代理研究正从静态点击任务向动态、多模态和长时域场景扩展，多个新基准针对短视频平台、拖拽交互和多应用工作流。
    - 细粒度评估指标（如子目标完成度、成本-准确性、检查点级别评分）对于区分整体成功率相近的模型至关重要，共识认为仅靠Pass@1不够。
    - 利用未标注或合成数据是训练方法中的关键主题，多篇工作证明仅需以前所需人工标注数据的一小部分即可达到竞争性能。
    - 当前代理普遍缺乏可靠的观察控制，或过度观察或观察不足，这被认为是限制其在动态界面上部署的根本能力缺口。
    分歧:
    - 基准测试在平台和交互范围上存在差异：一个针对macOS桌面且包含GUI与CLI，另一个聚焦短视频动态界面，第三个关注拖拽交互，还有一个针对移动端长时域任务，导致平台特定的性能排名可能无法泛化。
    - 训练方法论路径分化：一些工作提倡弱监督和课程学习且仅需极少标注，另一些强调基于可验证任务合成和前沿采样的在线RL，还有一派推崇通过动作增强策略进行主动上下文管理，这反映了对数据可用性、计算预算和部署延迟的不同假设。
    - 不确定性量化研究揭示，最佳UQ方法依赖于模型家族和接口：隐藏状态和密度方法对开源权重模型最为稳健，但排名无法迁移到闭源模型，表明评估和校准策略必须针对模型访问方式和架构进行定制，而非遵循单一最佳实践。
    开放问题:
    - 能否构建一个覆盖静态、动态、拖拽和多应用任务的统一评估套件，并在跨平台情况下提供一致的模型排名？
    - 来自未标注截图的弱监督信号在多大程度上捕捉了真实世界GUI状态的长尾分布，合成RL任务在何种情况下难以弥合这一差距？
    - 如何将观察控制形式化为一个可学习的策略组件，以平衡信息增益与任务完成成本，以及何种训练信号能够实现该平衡？
    - 当轨迹长度增至数千步时，当前上下文管理技术的规模极限在哪里，如何在不超出上下文窗口的情况下保留关键信息？
