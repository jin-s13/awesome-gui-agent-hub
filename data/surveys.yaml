  related_work_outline_zh:
  - 主流方向：可运行、可训练、可评测的计算机使用/GUI智能体成为重点，开放框架与基准从单步定位走向端到端工作流、实时交互和基于执行的评估。
  - 研究共性：多项工作将视觉语言智能体接入工具或harness控制循环，从真实或模拟GUI环境采集轨迹，围绕任务成功率、数据效率或部署成本优化。
  - 关键差异：监督信号、评测粒度、运行环境和工件表示存在分化，包括弱监督、在线强化学习、扩散解码、可调用记忆和技能库。
  - 趋势演进：2024-2026证据显示前沿正在转向重基础设施系统：容器化强化学习回滚、开放浏览器训练、可复用多模态技能、可重放记忆和隔离状态转换理解的诊断基准。
  - 开放问题：错误恢复稳健性、跨应用与操作系统泛化、离线诊断对在线任务的预测效度，以及独立可复现性仍缺少充分证据。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end trainable agent frameworks and deployment stacks
      what_it_solves: Converts vision-language or harness-native agents into executable
        multi-turn workflows by instrumenting model calls, managing rollouts, and
        applying online or weakly supervised learning in GUI/computer-use environments.
      what_remains_open: Error recovery after training is weak, harness design affects
        trainability, and live-environment training depends on scalable browser/container
        infrastructure not fully shown to transfer across settings.
    - line: Reusable skill and memory artifacts for efficient computer use
      what_it_solves: Encodes validated GUI workflows as multimodal skill libraries
        or parameter-controlled replayable memories to reduce token cost, execution
        time, and repeated exploration.
      what_remains_open: Replay is limited to deterministic applicability, ambiguous
        steps are rejected, and multimodal artifact generalization beyond evaluated
        application/OS subsets remains unmeasured.
    - line: Diagnostic and domain-focused computer-use evaluation suites
      what_it_solves: Evaluates whether agents understand action-to-GUI transitions
        or can complete scientific software workflows using execution-based checks
        and step-level diagnostics.
      what_remains_open: Offline suites omit asynchronous timing and live dynamics,
        desktop evidence is Linux-centric with fixed action vocabularies, and scientific
        coverage is constrained to 146 expert-designed tasks.
    - line: Model architectures and data-efficient training paradigms for GUI control
      what_it_solves: Reduces annotation reliance through weak supervision from unannotated
        screenshots or explores block-wise diffusion decoding for multimodal GUI agents
        across mobile, desktop, and web platforms.
      what_remains_open: Calibration with small high-quality data is not fully generalized,
        broad platform and grounding coverage remains partial, and reproducibility
        signals such as code or artifact availability are inconsistent.
    consensus:
    - There is broad agreement that computer-use agents should be evaluated through
      execution or trajectory-level success in realistic GUI, web, or desktop environments
      rather than only static single-frame grounding.
    - Most approaches treat multi-turn interaction, tool/harness integration, and
      live or stateful environment control as first-class system requirements.
    - Visual grounding and workflow state verification are consistently treated as
      bottlenecks, with several works adding retained figures, transition diagnostics,
      or target reaiming.
    - Open frameworks increasingly separate agent training from deployed harness inference
      and use container or browser orchestration to manage rollouts.
    disagreements:
    - 'Supervision and optimization signals differ: some systems use weakly supervised
      visual grounding from unannotated screenshots, others use online multi-turn
      RL in live sites, and others rely on supervised fine-tuning or diffusion pretraining.'
    - 'Evaluation grain and target differ: end-to-end task success on scientific or
      web workflows contrasts with step-level temporal ordering and action recognition
      diagnostics, and with efficiency metrics such as token or time reduction.'
    - 'Runtime and interaction setting differ: offline evaluation instances do not
      capture asynchronous live dynamics, while online frameworks optimize in live
      browser or containerized environments.'
    - 'Artifact representation and execution style differ: one line stores multimodal
      figures in skill libraries, another stores parameter-controlled callable memories
      that require deterministic replay, and text-only skill representations are treated
      as weaker.'
    open_questions:
    - Can agents trained through online RL or weak supervision acquire robust error
      recovery, given evidence that critical recovery abilities remain weak after
      training?
    - Do multimodal skill artifacts and callable memories generalize beyond the evaluated
      Linux desktop applications, fixed action vocabularies, or benchmark task sets?
    - Do offline step-level diagnostics of GUI transition understanding predict online
      task success or improve live agents?
    - What is the independent reproducibility status of these frameworks and evaluation
      suites when code, dataset, or artifact signals are absent or inconsistent in
      the evidence packet?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端可训练智能体框架与部署栈
      解决的问题: 通过拦截模型调用、管理回滚并应用在线或弱监督学习，将视觉语言或harness原生智能体转化为可在GUI/计算机使用环境中执行的多轮工作流。
      尚未覆盖: 训练后的错误恢复仍然较弱，harness设计影响可训练性，实时环境训练依赖的基础设施与跨设置可迁移性尚未充分证明。
    - 路线: 面向高效计算机使用的可复用技能与记忆工件
      解决的问题: 将经过验证的GUI工作流编码为多模态技能库或参数可控的可重放记忆，以降低token成本、执行时间和重复探索。
      尚未覆盖: 仅支持确定性可重放条件下的调用，会拒绝模糊或不可兼容步骤，跨应用与操作系统子集之外的泛化未被充分测量。
    - 路线: 诊断性与领域化计算机使用评测套件
      解决的问题: 通过基于执行的检查和步骤级诊断，评估智能体是否理解动作到GUI状态的过渡，或能否完成科学软件工作流。
      尚未覆盖: 离线套件忽略异步时序和实时动态，桌面证据以Linux和固定动作词汇为主，科学任务覆盖受限于专家设计的146个任务。
    - 路线: 面向GUI控制的模型架构与数据高效训练范式
      解决的问题: 通过未标注截图的弱监督降低人工标注依赖，或探索块级扩散解码用于移动、桌面和网页平台的多模态GUI智能体。
      尚未覆盖: 少量高质量数据校准的泛化性、跨平台grounding覆盖和代码/工件可复现信号仍需补充。
    共识:
    - 多项工作一致认为，计算机使用智能体应在真实或接近真实的GUI、网页或桌面环境中通过执行或轨迹级成功来评测，而非仅依赖静态单帧定位。
    - 多数方法把多轮交互、工具/harness集成以及有状态环境控制视为系统设计的一等公民。
    - 视觉定位和工作流状态验证被反复视为瓶颈，部分工作通过保留图形、状态转换诊断或目标重瞄准来缓解。
    - 开放框架越来越多地将智能体训练与已部署harness推理解耦，并通过容器或浏览器编排管理训练和回滚。
    分歧:
    - 监督与优化信号不同：弱监督视觉定位、在线多轮强化学习、监督微调或扩散预训练各有侧重。
    - 评测粒度与目标不同：端到端科学或网页工作流成功率、步骤级时序排序与动作识别诊断、以及token和时间等效率指标并存。
    - 运行与交互设置不同：离线评测实例忽略异步实时动态，在线框架则在真实浏览器或容器化环境中学习。
    - 工件表示与执行风格不同：多模态技能库保留图形，可调用记忆要求确定性重放，纯文本技能表示则被视为较弱。
    开放问题:
    - 在线强化学习或弱监督训练得到的智能体能否获得稳健的错误恢复能力，目前证据显示训练后错误恢复仍可能较弱？
    - 多模态技能工件和可调用记忆是否能泛化到证据覆盖的Linux桌面应用、固定动作词汇或特定任务集之外？
    - 步骤级GUI状态转换的离线诊断是否能预测在线任务成功，或有效改进实时智能体？
    - 在证据包中缺少一致代码、数据或工件信号的情况下，这些框架和评测套件的独立可复现状态如何？
