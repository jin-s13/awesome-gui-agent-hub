  literature_review:
    line_of_work_matrix:
    - line: Task and interface formalization for under-covered GUI interactions
      what_it_solves: Defines benchmarkable task abstractions, action types, and scoring
        signals for desktop, dynamic short-video, and drag-based GUI control, moving
        beyond click-only success rates.
      what_remains_open: Coverage remains tied to specific platforms and action classes,
        and multi-step trajectory reliability is not consistently evaluated.
    - line: External scaffolding and skill/harness evolution around frozen agents
      what_it_solves: Improves frozen GUI models by retrieving multimodal visual-textual
        skills or optimizing execution harnesses from observed action-outcome evidence.
      what_remains_open: Cross-application and cross-benchmark generalization is only
        partially shown; several works omit limitation details, leaving failure boundaries
        unclear.
    - line: Data/RL scaling with weak or verifiable supervision
      what_it_solves: Reduces annotation reliance and improves open-source GUI models
        via unannotated screenshots plus RL calibration or verifiable synthesized
        tasks and online RL.
      what_remains_open: Evidence is concentrated on OSWorld/ScienceBoard and matching
        model families; task synthesis validity and transfer to unseen interfaces
        remain open.
    - line: Uncertainty quantification and spatial safety for grounding
      what_it_solves: Benchmarks post-hoc uncertainty methods and conformal click
        regions for GUI grounding, identifying stable UQ families and calibration-sensitive
        spatial safety gains.
      what_remains_open: Single-step grounding does not cover multi-step agent trajectories;
        cross-model and cross-interface transfer is weak and degrades under distribution
        shift.
    consensus:
    - Evaluation is shifting from aggregate pass rates to fine-grained signals such
      as sub-goal completion, interaction-specific grounding, cost-accuracy, and uncertainty
      calibration.
    - Improving GUI agents no longer depends only on larger backbone models; external
      skills, harness edits, verifiable or weak supervision, and fine-tuning provide
      complementary gains.
    - Visual/screenshot evidence and spatial grounding are critical for action verification
      and UI element identification.
    - Current evidence shows consistent weaknesses in observation control, cross-model
      transfer, and generalization beyond tested platforms.
    disagreements:
    - 'Optimization layer differs: post-hoc uncertainty calibration, harness-level
      edits, skill retrieval, online RL, or weak-supervision fine-tuning each intervene
      at different stages.'
    - 'Supervision assumptions differ: manually authored multimodal skills, unannotated
      screenshots, verifiable synthesized tasks, and annotated benchmark data imply
      different cost and coverage trade-offs.'
    - 'Evaluation target differs: static desktop GUI+CLI tasks, dynamic content-changing
      video interfaces, drag interactions, and multi-step OS tasks are not directly
      comparable.'
    - 'Transfer claims differ: some approaches show frozen-harness cross-benchmark
      transfer, while uncertainty rankings transfer poorly across model classes and
      interfaces.'
    open_questions:
    - Which fine-grained metrics best predict real-world task success, safety, and
      user cost for GUI agents?
    - Can observation control be modeled, trained, or evaluated beyond short-video
      platforms where current agents fail?
    - Do uncertainty and conformal spatial-safety guarantees hold across multi-step
      trajectories, model tiers, and interface shifts?
    - What are the generalization limits of verifiable task synthesis and harness
      optimization when apps or workflows are unseen?
    - Several papers lack limitation details, creating verification gaps around negative
      results, robustness, and release artifacts.
