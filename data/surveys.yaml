  literature_review:
    line_of_work_matrix:
    - line: Comparative evaluation and controlled benchmark construction
      what_it_solves: Creates controlled protocols to test GUI/computer-use agent
        grounding, uncertainty calibration, fraud judgment, and safety without shortcuts
        such as reputation cues or inaccessible internal states.
      what_remains_open: Several protocols cover single-step or domain-limited tasks;
        compatibility across interfaces, datasets, and model openness is not established.
    - line: Scalable training and context management for GUI agents
      what_it_solves: Improves success rates and data efficiency through verifiable
        task synthesis, online RL, noisy reward correction, and structured context
        compression for long-horizon tasks.
      what_remains_open: Reliability beyond evaluated benchmarks, reward-noise propagation,
        and reproducibility of training artifacts remain under-evidenced.
    - line: Multimodal demonstration and guidance transformation
      what_it_solves: Converts human screen recordings or keyframes into tutorials
        or condensed visual context to improve human learning and GUI agent planning.
      what_remains_open: Whether generated guidance improves agents across diverse
        GUI environments beyond the reported tasks lacks sufficient evidence.
    consensus:
    - Current work usually couples a method contribution with a new benchmark or dataset
      to expose a specific agent capability or failure.
    - Evaluation targets vary widely but commonly rely on VLM-based agents operating
      over visual and textual interface states.
    - Scalable supervision is a recurring theme, including verifiable task generation,
      noisy autonomous rewards, structured context, and tutorial-style guidance.
    - Reported improvements are often benchmark-specific and model-class-specific,
      so cross-setting generalization is not yet established.
    - Safety and uncertainty results appear sensitive to domain, interface, and model
      access conditions rather than being uniform properties.
    disagreements:
    - 'Evaluation target differs: some work measures task success rate, while others
      measure uncertainty-ranking transfer, attack success, fraud decision quality,
      or tutorial utility.'
    - 'Supervision differs: online RL from verifiable tasks, RL from noisy VLM judgment,
