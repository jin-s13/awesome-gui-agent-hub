  related_work_outline_zh:
  - 主流方向：围绕真实GUI/桌面自动化基准与代理适配展开，覆盖真实macOS任务、动态短视频界面、拖拽交互、视频引导任务和不确定性感知的视觉定位。
  - 研究共性：普遍将任务或数据集构建与细粒度评分、成本-准确性或不确定性指标结合，用前沿视觉语言模型基线暴露观察控制、视觉定位和交互覆盖问题。
  - 关键差异：评测目标包括静态桌面、动态信息流、拖拽交互和视频引导指令；训练路线包括弱监督截图、在线强化学习和多模态技能检索；指标重点包括Pass@1、成本-准确性和不确定性迁移。
