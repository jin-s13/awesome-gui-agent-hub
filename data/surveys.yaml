  literature_review:
    line_of_work_matrix:
    - line: Real-world and interaction-specific GUI task and environment construction
      what_it_solves: Supplies shared tasks, datasets, and environments for desktop,
        dynamic short-video, drag, and video-guided GUI tasks so different agent implementations
        can be compared on concrete interaction surfaces.
      what_remains_open: Coverage is limited to specific platforms or interaction
        types; dynamic-interface observation control and cross-platform generalization
        remain unverified.
    - line: Fine-grained and reliability-oriented evaluation metrics
      what_it_solves: Probes subgoal completion, information efficiency, uncertainty
        ranking, and interaction-specific correctness beyond aggregate pass rates.
      what_remains_open: Proxy signals may not align with downstream user decisions;
        uncertainty and calibration rankings transfer weakly across model tiers or
        interfaces and degrade under distribution shift.
    - line: Agent improvement through task synthesis, skill representation, and weak
        supervision
      what_it_solves: Scales training or inference with verifiable generated tasks,
        multimodal skill artifacts, or unannotated screenshot grounding to raise benchmark
        performance and data efficiency.
      what_remains_open: Evidence is often tied to selected benchmarks; implementation
        and compute-budget stability, as well as broader multi-step deployment, are
        not fully established.
    - line: Comparable baselines and reporting practice
      what_it_solves: Uses frontier open-weight and closed-source VLM agents, fixed
        benchmarks, and reported artifacts to make results auditable.
      what_remains_open: Code, dataset, and limitation reporting is uneven; missing
        artifacts or baseline details create verification gaps rather than proof of
        absence.
    consensus:
    - Benchmarks increasingly evaluate beyond aggregate success rate, using subgoal
      completion, cost-accuracy, uncertainty, or interaction-specific correctness.
    - Frontier VLM agents still fall short of human-level performance on dynamic,
      multi-application, or observation-controlled tasks.
    - Representation and training interventions such as multimodal skills, generated
      RL tasks, and weak supervision yield substantial gains over simple baselines.
    - Findings are often conditioned on a single platform or model class; cross-platform
      and cross-model stability is not yet demonstrated.
    disagreements:
    - 'Evaluation targets differ: deterministic multi-checkpoint scoring, cost-accuracy
      on dynamic feeds, post-hoc uncertainty ranking, and drag interaction accuracy.'
    - 'Supervision and improvement strategies differ: weakly supervised grounding
      from unannotated screenshots, verifiable generated tasks with online RL, and
      multimodal skill artifacts with visual figures.'
    - 'Interaction surfaces differ: real macOS desktop with GUI and CLI, short-video
      browser environments, drag gestures, video-guided tasks, and single-step GUI
      grounding.'
    - 'Deployment regimes differ: open-weight versus closed-source model access, simulated
      versus real OS/browser settings, and single-step versus multi-step trajectories.'
    open_questions:
    - How well do fine-grained metrics align with the downstream decisions users actually
      care about in real GUI workflows?
    - Can dynamic-interface observation control be benchmarked and improved without
      overfitting to one platform such as short-video feeds?
    - Does uncertainty or calibration transfer across model tiers and interfaces,
      or must rankings be re-estimated for each deployment target?
    - Are benchmark conclusions stable across implementation choices, compute budgets,
      and missing artifacts when code and dataset availability is uneven?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 真实世界与交互特定的GUI任务和环境构建
      解决的问题: 为桌面、动态短视频、拖拽和视频引导GUI任务提供共享任务、数据集与环境，使不同代理实现能在具体交互表面上比较。
      尚未覆盖: 覆盖范围受限于特定平台或交互类型；动态界面的观察控制与跨平台泛化仍未验证。
    - 路线: 细粒度与可靠性导向的评价指标
      解决的问题: 在总分之外检验子目标完成、信息效率、不确定性排序和交互特定正确性。
      尚未覆盖: 代理指标可能偏离下游用户决策；不确定性与校准排序跨模型层级或接口迁移较弱，并在分布偏移下退化。
    - 路线: 通过任务合成、技能表示与弱监督改进代理
      解决的问题: 用可验证生成任务、多模态技能工件或未标注截图定位来规模化训练或推理，提升基准表现与数据效率。
      尚未覆盖: 证据通常绑定在选定基准上；实现与算力预算稳定性、以及更广泛的多步部署尚未充分建立。
    - 路线: 可比基线与报告规范
      解决的问题: 使用前沿开源与闭源VLM代理、固定基准和公开工件使结果可审计。
      尚未覆盖: 代码、数据集和局限性报告不均衡；缺失工件或基线细节构成验证缺口，而非证明不存在。
    共识:
    - 基准越来越多地在总体成功率之外评价子目标完成、成本-准确性、不确定性或交互特定正确性。
    - 前沿VLM代理在动态、多应用或需要观察控制的任务上仍低于人类水平。
    - 多模态技能、生成RL任务和弱监督等表示与训练干预相比简单基线带来显著提升。
    - 结论常以单一平台或模型类别为条件；跨平台和跨模型稳定性尚未得到证明。
    分歧:
    - 评价目标不同：确定性多检查点评分、动态信息流上的成本-准确性、后验不确定性排序和拖拽交互准确率。
    - 监督与改进策略不同：未标注截图弱监督定位、可验证生成任务配合在线RL、以及保留视觉图形的多模态技能工件。
    - 交互表面不同：真实macOS桌面的GUI与CLI、短视频浏览器环境、拖拽手势、视频引导任务和单步GUI定位。
    - 部署体制不同：开源与闭源模型访问、模拟与真实OS/浏览器设置、单步与多步轨迹。
    开放问题:
    - 细粒度指标能在多大程度上对齐用户在真实GUI工作流中真正关心的下游决策？
