    consensus:
    - Evaluation is shifting toward fine-grained, multi-condition task completion
      such as sub-goal checkpoints, cost-accuracy, fidelity, and interaction-type
      coverage rather than binary success.
    - Reusable artifacts, whether multimodal skills, replay programs, or reconstructed
      environments, can improve efficiency or downstream performance without relying
      solely on model scale.
    - Visual figures, screen-state checks, and keyframes matter for UI element identification,
      workflow verification, and dynamic observation control.
    - 'Many benchmark and method papers share a verification gap: code, data, metrics,
