  - 'Open questions: Remaining gaps include robustness to dynamic interfaces, weak
    error recovery after reinforcement learning, partial safety generalization across
    domains, limited reproducibility signals, and weak evidence that offline diagnostics
    predict online performance.'
  related_work_outline_zh:
  - 主流方向：研究集中在可运行的计算机使用与GUI智能体系统，将部署框架或真实环境与训练、记忆或回放组件（如技能库、强化学习框架）结合，面向网页、桌面或OS任务的多步骤执行。
  - 研究共性：多项工作把轨迹、截图或任务文档等经验转化为可复用工件，并在交互式计算机使用任务中评估；同时强调容器化回滚、代理日志和MCP式工具访问等执行循环基础设施。
  - 关键差异：一部分关注弱监督或在线强化学习的训练侧扩展，另一部分关注推理时的技能/记忆复用；评测目标在任务成功率、GUI过渡理解和领域条件安全之间分化；多数证据采用harness驱动智能体，少数探索块级扩散。
  - 趋势演进：在2024–2026前沿范围内，明显变化是从静态单帧grounding转向实时/在线交互与执行级复用；近期工作强调harness原生训练、真实浏览器/桌面执行以及超越基准成功率的诊断与安全审计。
  - 开放问题：动态界面鲁棒性、强化学习后错误恢复仍弱、安全跨域泛化不足、可复现信号有限，以及离线诊断能否预测在线表现仍缺证据。
  literature_review:
    line_of_work_matrix:
    - line: Reusable skill and execution-memory layers for computer-use agents
      what_it_solves: Organizes validated GUI workflows into multimodal skills or
        callable memories to reduce token cost, execution time, and grounding errors.
      what_remains_open: Deterministic replay rejects ambiguous or incompatible runtime
        states; evidence is missing on interface drift, cross-application transfer,
        and long-term memory maintenance.
    - line: Annotation-efficient weakly supervised training for GUI agents
      what_it_solves: Learns visual grounding and policy behavior from massive unannotated
        screenshots with a small high-quality reinforcement-learning calibration step.
      what_remains_open: Visible evidence lacks explicit limitations; it is unclear
        how unannotated data biases action priors and whether the reported data-efficiency
        transfer holds beyond the tested GUI benchmarks.
    - line: Harness-native and online multi-turn reinforcement learning frameworks
      what_it_solves: Trains agents end-to-end inside deployed inference harnesses
        or live websites by using proxy-traced model calls and containerized rollouts.
      what_remains_open: Error recovery remains weak after reinforcement learning,
        harness design strongly affects trainability, and live-environment reproducibility
        details are underreported.
    - line: Diagnostic and safety evaluation for computer-use agents
      what_it_solves: Measures whether models understand GUI transitions and whether
        browser-hardened safety transfers to other domains, moving beyond end-task
        success.
      what_remains_open: Offline diagnostics lack asynchronous dynamics, are restricted
        to specific OS and action vocabularies, and security audits omit RL-optimized
        attack strings.
    - line: Alternative vision-language generation architectures for GUI grounding
      what_it_solves: Applies block-wise diffusion Mixture-of-Expert models to GUI
        grounding and navigation while preserving parallel decoding characteristics.
      what_remains_open: Visible evidence does not report limitations or real-time
        tradeoffs; end-to-end success on broader computer-use workflows remains unverified.
    consensus:
    - Computer-use agents are evaluated on multi-step interactive tasks across web,
      desktop, or OS environments, with success rate as a central metric.
    - Reusable artifacts derived from agent experience, screenshots, or documentation
      are used to improve grounding, data efficiency, or execution cost.
    - There is a shared distinction between low-level localization or grounding and
      higher-level process control, with the latter remaining less saturated.
    - Infrastructure is treated as a first-class concern through proxy logging, containerized
      rollouts, MCP-style tool access, or live-browser scaffolding.
    disagreements:
    - 'Training signal differs: weak supervision from unannotated screenshots, online
      multi-turn reward against live websites, or supervised fine-tuning followed
      by RL calibration.'
    - 'Evaluation target differs: end-to-end task success, offline step-level transition
      understanding, or adversarial safety in specific domains.'
    - 'Deployment setting differs: deterministic replay of prior workflows versus
      exploratory fresh planning in live environments; offline diagnostic benchmarks
      versus live browser or desktop sessions.'
    - 'Architecture differs: block-wise diffusion vision-language generation versus
      harness-driven autoregressive agents.'
    - 'Safety evidence is domain-conditioned: browser-task prompt-injection resistance
      does not transfer to coding skill-injection, so conclusions do not generalize
      across surfaces.'
    open_questions:
    - How can replayable skill or memory artifacts remain valid when GUI layout, state,
      or application version changes?
    - Why does reinforcement-learning training improve task success yet leave error
      recovery weak across different harnesses?
    - How well do offline transition diagnostics predict live asynchronous computer-use
      reliability?
    - Can safety hardening be made more general across browser, coding, and desktop
      domains without domain-specific retraining?
    - What reproducibility, cost, and failure-mode details are missing for large-scale
      live-environment training frameworks?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 面向计算机使用智能体的可复用技能与执行记忆层
      解决的问题: 把已验证的GUI工作流组织为多模态技能或可调用记忆，降低token成本、执行时间和grounding错误。
      尚未覆盖: 确定性回放会拒绝模糊或不兼容的运行时状态；界面漂移、跨应用迁移和长期记忆维护的证据不足。
    - 路线: 面向GUI智能体的弱监督少标注训练
      解决的问题: 从海量未标注截图学习视觉定位，并用少量高质量强化学习校准策略。
      尚未覆盖: 可见证据缺少显式限制说明；未讨论未标注数据如何偏置动作先验，以及报告的数据效率优势能否迁移到已有基准之外。
    - 路线: Harness原生与在线多轮强化学习框架
      解决的问题: 在已部署推理harness或真实网站中，通过代理追踪的模型调用和容器化回滚端到端训练智能体。
      尚未覆盖: 强化学习后错误恢复仍弱；harness设计影响可训练性；真实环境可复现性细节不足。
    - 路线: 计算机使用智能体的诊断与安全评测
      解决的问题: 衡量模型是否理解GUI过渡，以及浏览器安全加固能否迁移到其他领域，超越最终任务成功指标。
      尚未覆盖: 离线诊断缺异步动态，OS和动作词汇受限；安全审计省略RL优化攻击字符串。
    - 路线: 面向GUI grounding的替代视觉语言生成架构
      解决的问题: 将块级扩散MoE模型用于GUI grounding与导航，旨在保持并行解码特性。
      尚未覆盖: 可见证据未报告限制或实时权衡；更广泛计算机使用端到端任务效果未验证。
    共识:
    - 计算机使用智能体多在网页、桌面或OS环境中的多步骤交互任务上评测，成功率是核心指标。
    - 来自智能体经验、截图或文档的可复用工件被用于改善grounding、数据效率或执行成本。
    - 研究普遍区分低层定位或grounding与高层过程控制，并显示后者更远未饱和。
    - 基础设施被反复视为关键：代理日志、容器化回滚、MCP式工具访问或实时浏览器脚手架支撑训练与执行。
    分歧:
    - 训练信号不同：海量未标注截图的弱监督、面向真实网站的在线多轮奖励，或监督微调后接RL校准。
    - 评测目标不同：端到端任务成功率、离线步骤级过渡理解，或特定领域的对抗安全。
    - 部署设置不同：先前工作流的确定性回放，或真实环境中的探索式新规划；离线诊断基准，或实时浏览器/桌面会话。
    - 架构不同：块级扩散视觉语言生成，或harness驱动的自回归智能体。
    - 安全证据呈领域条件性：浏览器任务上对提示注入的抵抗力不迁移到编码技能注入，因此结论不跨界面泛化。
    开放问题:
    - 界面布局、状态或应用版本变化时，可回放技能或记忆工件如何持续有效？
    - 为何强化学习训练能提升任务成功率但错误恢复仍然较弱？不同harness间是否存在共同原因？
    - 离线过渡诊断能在多大程度上预测真实异步计算机使用的可靠性？
    - 浏览器、编码和桌面领域的安全加固能否更通用，而不依赖领域内重训？
    - 大规模真实环境训练框架在可复现性、成本与失败模式方面还缺哪些关键细节？
