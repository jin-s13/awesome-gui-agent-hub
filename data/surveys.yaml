    研究路线矩阵:
    - 路线: 面向GUI代理的多模态技能库
      解决的问题: 通过提供可检索的多模态文档（文本+图形）来帮助代理识别UI元素和验证工作流状态，提升复杂应用中的任务完成度。
      尚未覆盖: 技能库在不同应用和操作系统间的泛化能力，以及在没有人工编写文档的情况下自动化构建技能的成本。
    - 路线: GUI代理评测基准
      解决的问题: 建立标准化测试环境，衡量代理在真实桌面、移动和网络任务上的表现，覆盖多应用工作流、细粒度评分和多种交互类型（点击、拖拽、GUI+CLI）。
      尚未覆盖: 基准多为平台特定，缺乏能跨操作系统和交互模态比较代理的统一框架，且指标很少捕捉真实效率或安全性。
    - 路线: 动态与视频引导的交互代理
      解决的问题: 使代理能处理随时间变化的内容（如短视频平台）或根据视频指令行动，要求代理具备观察控制和从视频流中提取关键帧的能力。
      尚未覆盖: 对实时变化和未知任务的适应能力，以及关键帧提取在复杂遮挡或快速场景切换的视频类型中的鲁棒性。
    - 路线: 执行效率与可靠性优化
      解决的问题: 通过将成功运行编译为状态机程序来降低重复任务延迟，并通过引入历史感知的批判模型来拦截有缺陷的动作，从而改进规划。
      尚未覆盖: 在无先前成功记录的开放域新任务上的效果，以及基于重放的方法的速度与完全重新推理方案的质量之间的权衡。
    - 路线: 受限信息下的安全关键网页代理
      解决的问题: 评估代理在信誉捷径（URL、域名）被隐藏时仅根据网页内容和短信上下文进行欺诈检测的能力。
      尚未覆盖: 在真实世界信誉线索可用时的性能，以及对短信-网页场景之外的其他安全关键领域（如一般钓鱼检测）的泛化。
    共识:
    - GUI代理根本上依赖多模态大模型，结合屏幕截图的视觉理解和文本指令遵循。
    - 包含多个子目标的长步骤任务仍然具有挑战性，跨步骤的错误累积是主要失败模式。
    - 用外部记忆、历史摘要或预编译知识增强代理，相比纯反应式逐步推理能持续提升性能。
    - 复杂多应用任务上尚未达到人类水平，最佳系统在MacAgentBench上最优配置下仅达到73.7% Pass@1。
    分歧:
    - 评测环境：部分工作使用真实操作系统环境（MacAgentBench），而其他工作依赖基于浏览器的模拟（LivingScreen）或静态截图数据集（DragOn），导致泛化声明不同。
    - 交互粒度：DragOn专注于拖拽坐标和定位，而多数基准假设点击/触摸动作；PreAct进一步将动作抽象为确定性状态转换，以交互性换取速度。
    - 优化目标：PreAct和VISUALSKILL追求效率（速度和技能复用），而HiViG和FraudSMSWalker追求可靠性和安全性，形成“更快代理”与“更安全代理”的分裂。
    - 外部知识的作用：VISUALSKILL注入策划的多模态技能库，HiViG从轨迹数据学习历史批判器，PreAct将过去运行编译为程序——三种不同的缓存内容和利用方式。
    - 动态与静态内容：LivingScreen形式化了必须控制观察频率的“动态屏幕原生”代理，而其他基准使用每步静态屏幕，使得改进能否迁移到动态界面尚不明确。
    开放问题:
    - 在一组应用（如macOS桌面）上训练的技能库或历史批判器能否在不重新训练的情况下迁移到完全不同的平台（如Android）？
    - GUI代理如何处理旨在误导人类用户和自动化代理的对抗性或欺骗性UI元素，如欺诈检测中部分探索的场景？
    - 在任务变异性高或需要新探索时，编译时效率（PreAct）与运行时灵活性之间的最佳平衡点是什么？
    - 证据包中没有证据表明多模态技能库（VISUALSKILL）或历史批判器（HiViG）带来的准确性提升，在持续变化的真实世界部署中是否仍然存在。
    - 如何统一评估基准，以便在拖拽、视频引导和动态内容任务之间比较代理，同时不丢失每种交互类型的特化信息？
