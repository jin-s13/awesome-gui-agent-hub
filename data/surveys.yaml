  related_work_outline:
  - 'Mainstream direction: The field is converging on realistic executable GUI/OS
    benchmarks, such as MacAgentBench and LivingScreen, alongside methods that improve
    computer-use agents through multimodal skills, harness evolution, verifiable online
    RL, or weak supervision, all evaluated on shared task suites.'
  - 'Shared research pattern: Work uses deterministic or rule-based scoring in executable
    environments, compares multiple frontier/open models, and supplements aggregate
    success with finer signals such as sub-goal completion, cost-accuracy, uncertainty
    ranking, or conformal coverage.'
  - 'Key differences: Evaluation targets range from long-horizon desktop tasks to
    dynamic short-video observation, video-guided tasks, and single-step GUI grounding;
    metric emphasis and improvement strategy also differ across method and benchmark
    papers.'
  - 'Trend evolution: Within the available 2024-2026 evidence, the frontier is shifting
    from static single-step grounding toward dynamic, long-horizon, multi-application
    and multimodal agent evaluation; the narrow year span limits older-trend inference.'
  - 'Open questions: Cross-platform transfer, stability across frameworks/compute,
    weak UQ transfer, metric alignment with user decisions, and missing limitation
    details remain verification gaps.'
  related_work_outline_zh:
  - 主流方向：该领域正汇聚到真实可执行的GUI/OS基准（如MacAgentBench和LivingScreen），同时通过多模态技能、执行框架演进、可验证在线RL或弱监督改进计算机使用代理，并在共享任务套件上评测。
  - 研究共性：在可执行环境中采用确定性或基于规则的评分，比较多类前沿/开放模型，并在总分之上补充子目标完成、成本-准确性、不确定性排名或共形覆盖等细粒度信号。
  - 关键差异：评测目标从长程桌面任务、动态短视频观察、视频引导任务到单步GUI基础不等；指标侧重和改进策略在方法类与基准类论文之间也不同。
  - 趋势演进：在2024-2026可用证据内，前沿正从静态单步基础转向动态、长程、多应用和多模态代理评测；年份跨度较窄，难以推断更早趋势。
  - 开放问题：跨平台迁移、跨框架/算力稳定性、UQ迁移较弱、指标与用户决策对齐，以及局限性细节缺失，仍是验证缺口。
  literature_review:
    line_of_work_matrix:
    - line: Long-horizon real-OS task and environment benchmarking
      what_it_solves: Creates shared executable desktop tasks with deterministic rule-based
        scoring and fine-grained multi-checkpoint capability annotations, enabling
        comparison of agents across applications and frameworks.
      what_remains_open: Coverage outside a specific OS and static or desktop setting
        remains uncertain; limitation details for the benchmark boundary are not reported
        in the available evidence.
    - line: Dynamic and video-guided interface benchmarking
      what_it_solves: Measures agents when interface content changes between actions
        or when tasks require video/keyframe understanding, using task tiers and cost-accuracy
        scoring.
      what_remains_open: Generalization beyond short-video platforms and alignment
        between observation-cost metrics and real user utility remain unresolved.
    - line: Skill, harness, and training methods evaluated on GUI benchmarks
      what_it_solves: Improves computer-use agents by adding multimodal skill artifacts,
        evolving execution harnesses, synthesizing verifiable online RL tasks, or
        weak supervision from unannotated screenshots.
      what_remains_open: Many reported gains lack explicit limitation statements;
        transfer and stability across tasks/platforms are only partially tested.
    - line: Reliability and uncertainty metric design
      what_it_solves: Stress-tests GUI grounding with post-hoc uncertainty quantification,
        ranking transfer, and conformal click regions, moving beyond aggregate success.
      what_remains_open: Cross-model and cross-interface UQ ranking transfer is weak,
        coverage degrades under shift, and single-step grounding findings do not cover
        multistep trajectories.
    - line: Comparable baselines and reporting conventions
      what_it_solves: Makes results auditable by comparing multiple frameworks/models
        and reporting artifacts, baselines, and reproducible scores.
      what_remains_open: The evidence packet does not establish stability across implementations,
        compute budgets, or independently reproduced baselines; several top-paper
        limitation fields are empty.
    consensus:
    - Executable environments with deterministic or rule-based scoring are preferred
      over text-only judgment for agent evaluation, and results are usually reported
      with multiple models and baselines.
    - Aggregate success metrics are supplemented by finer signals such as sub-goal
      completion, cost-accuracy, uncertainty ranking, or conformal coverage to reveal
      differences masked by similar Pass@1/scores.
    - Improvement methods are evaluated on shared GUI/OS benchmarks such as OSWorld,
      CUA-World, OSExpert-Eval, or OSWorld-Verified, and reported as score or Pass@1
      lifts over baselines.
    disagreements:
    - 'Evaluation target differs: long-horizon multi-application desktop completion,
      dynamic short-video observation control, video-guided GUI tasks, and single-step
      GUI grounding each measure different agent capabilities.'
    - 'Supervision and improvement strategy differ: weak supervision from unannotated
      screenshots, verifiable task synthesis plus online RL, harness evolution around
      frozen models, and multimodal skill retrieval make different assumptions about
      where gains should come from.'
    - 'Metric emphasis differs: some compare Pass@1/score, others use fine-grained
      sub-goal checkpoints, cost-accuracy, or uncertainty/conformal coverage; these
      are not directly interchangeable.'
    - 'Deployment setting differs: real macOS desktop, browser-based short-video environment,
      video input interfaces, and single-step grounding datasets expose different
      failure modes such as over-observation or calibration shift.'
    open_questions:
    - Do OS/desktop and dynamic-interface findings transfer to mobile, web, or cross-platform
      tasks when current evidence is restricted to specific platforms?
    - Why does uncertainty ranking transfer degrade across model tiers/interfaces,
      and can conformal coverage remain valid under distribution or interface shift?
    - What boundary conditions explain gains from skill libraries, harness evolution,
      online RL, and weak supervision when several available limitation fields are
      empty?
    - Can sub-goal, cost-accuracy, and uncertainty metrics be aligned with downstream
      user decisions when similar Pass@1 models differ in sub-goal completion and
      no model reaches human-level cost-accuracy?
    - Are benchmark conclusions stable across different frameworks, implementations,
      and compute budgets given the limited comparison matrix in the available top-paper
      evidence?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 长程真实操作系统任务与环境基准构建
      解决的问题: 构建共享可执行桌面任务、基于规则的确定性评分和细粒度多检查点能力注释，使跨应用和跨框架的代理比较成为可能。
      尚未覆盖: 对特定操作系统和静态桌面设置之外的覆盖仍不确定；可用证据中未报告基准边界的局限性细节。
    - 路线: 动态与视频引导界面基准构建
      解决的问题: 在界面内容随动作变化或任务需要视频/关键帧理解时评估代理，使用分层任务和成本-准确性评分。
      尚未覆盖: 短视频平台之外的泛化，以及观察成本指标与真实用户效用之间的对齐仍未解决。
    - 路线: 在GUI基准上评测的技能、执行框架与训练方法
      解决的问题: 通过多模态技能工件、执行框架演进、可验证在线RL任务合成或未标注截图的弱监督来改进计算机使用代理。
      尚未覆盖: 许多报告的提升缺少明确局限性说明；跨任务和平台的迁移与稳定性仅被部分测试。
    - 路线: 可靠性与不确定性指标设计
      解决的问题: 用后验不确定性量化、排名迁移和共形点击区域对GUI基础进行压力测试，超越聚合成功分数。
      尚未覆盖: 跨模型和跨接口的UQ排名迁移较弱，覆盖度在分布偏移下下降，且单步基础发现未覆盖多步轨迹。
    - 路线: 可比基线与报告规范
      解决的问题: 通过比较多框架/模型并报告工件、基线和可复现得分，使结果可审计。
      尚未覆盖: 证据包未能确立实现、算力预算或独立复现基线下的稳定性；若干高排名论文的局限性字段为空。
    共识:
    - 当前工作倾向于在可执行环境中采用确定性或基于规则的评分，而不是纯文本判断，并通常在多个模型和基线上报告结果。
    - 在总分基础上补充子目标完成、成本-准确性、不确定性排名或共形覆盖等信号，以揭示相似Pass@1/分数掩盖的差异。
    - 改进方法多在OSWorld、CUA-World、OSExpert-Eval或OSWorld-Verified等共享GUI/OS基准上评测，并报告相对于基线的分数或Pass@1提升。
    分歧:
    - 评测目标不同：长程多应用桌面完成、动态短视频观察控制、视频引导GUI任务和单步GUI基础分别衡量不同的代理能力。
    - 监督与改进策略不同：未标注截图的弱监督、可验证任务合成加在线RL、冻结模型周围的执行框架演进，以及多模态技能检索，各自假设收益来源不同。
    - 指标侧重不同：有的比较Pass@1/分数，有的使用细粒度子目标检查点、成本-准确性或不确定性/共形覆盖；这些指标不可直接互换。
