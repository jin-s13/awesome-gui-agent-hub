  - 研究共性：多数工作将多模态策略或技能设计与可控的训练或评估闭环结合，GUICrafter和OS-Helix通过弱监督、混合工件和强化学习降低标注成本，并在OSWorld-Verified、AndroidControl等基准上评估。
  - 关键差异：表示与运行方式不同：GUI-JEPA在潜空间评分候选动作，LLaDA-UI采用块级扩散生成，OS-Helix统一GUI/代码动作，VISUALSKILL提供技能检索，OpenForgeRL侧重外部训练编排；评测目标也明显分化。
  - 趋势演进：2024-2026窗口内的主要证据集中在2026年，显示从静态提示转向可训练智能体、端到端动作模型和面向鲁棒性的评估框架，趋势偏向开放部署栈与诊断能力。
  - 开放问题：跨平台泛化、恢复与个性化鲁棒性、速度与精度权衡、跨基础设施独立复现仍缺少充分证据；若干论文在给定数据包中未展示局限性或独立代码/数据集验证。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end multimodal action policies, e.g. OS-Helix and LLaDA-UI
      what_it_solves: Directly producing executable GUI or computer-use actions, including
        grounded GUI steps and code execution, from multimodal screen and instruction
        inputs.
      what_remains_open: Cross-platform generalization, distribution-shift accuracy,
        and recovery after incorrect actions remain unresolved; some papers in this
        packet omit explicit limitations.
    - line: Training and orchestration frameworks for harness-native agents, e.g.
        OpenForgeRL
      what_it_solves: Converting real agent/harness interactions into RL or supervised
        training loops while keeping deployment harnesses intact across GUI, computer-use,
        and tool environments.
      what_remains_open: Error recovery remains weak after RL, and harness design
        strongly affects trainability; independent reproduction across teams and infrastructure
        is not yet evidenced.
    - line: Weakly supervised and data-efficient policy learning, e.g. GUICrafter
      what_it_solves: Reducing reliance on expensive human GUI annotations by learning
        visual grounding from unannotated screenshots or from hybrid and synthetic
        supervision.
      what_remains_open: Generalization beyond the reported task benchmarks and robustness
        to diverse interfaces remain open; evidence on downstream recovery and personalization
        is limited.
    - line: Latency- and parameter-efficient action scoring, e.g. GUI-JEPA
      what_it_solves: Avoiding token-by-token decoding by scoring candidate actions
        in latent space, enabling faster or lower-overhead GUI action policies.
      what_remains_open: Reported accuracy does not match the larger VLM baseline,
        evaluation is narrow, and screen-dynamics pretraining was not necessary in
        the available evidence.
    - line: Multimodal skill and tool layers, e.g. VISUALSKILL
      what_it_solves: Providing on-demand, per-application multimodal skills that
        retain visual figures and text, improving UI element identification and workflow-state
        verification.
      what_remains_open: Skill-library construction cost, cross-application generalization,
        and how such artifacts interact with different base agent capabilities remain
        open.
    - line: Diagnostic and recovery evaluation frameworks, e.g. ReTrace and PrefDiag-Bench
      what_it_solves: Systematically measuring computer-use agent recovery consistency
        and diagnosing where mobile GUI agents fail to follow personalization preferences.
      what_remains_open: Action replay and rollback are costly or limited in many
        settings, and it is not yet shown how diagnostic findings transfer into improved
        training or deployment.
    consensus:
    - Systems are built as multimodal screen-reading and action-execution loops over
      mobile, desktop, or web interfaces.
    - There is convergence on reducing human annotation cost through weak supervision,
      synthetic or hybrid action-artifact data, and RL or supervised fine-tuning over
      agent trajectories.
    - Evaluation centers on task success or action-level metrics in runnable environments
      such as OSWorld-Verified, AndroidControl, and WebVoyager.
    - Recent work treats inference speed, harness interoperability, and deployment
      orchestration as first-class research concerns alongside policy quality.
    - Robustness dimensions such as error recovery, personalization, and distribution
      shift are recognized as bottlenecks rather than solved capabilities.
    disagreements:
    - 'Representation and generation differ: some policies score candidate actions
      in latent space, while others generate actions through block-wise diffusion
      or retrieve multimodal skills.'
    - 'Supervision signal differs across works: unannotated screenshots, RL over harness
      trajectories, composed application/file artifacts, or external skill provisioning
      without new training.'
    - 'Evaluation target differs: some work prioritizes latency and parameter efficiency,
      while others target end-to-end success, recovery consistency, or preference-following
      diagnostics.'
    - 'Interaction mode differs: end-to-end policy models, training orchestrators
      that intercept harness calls, and MCP-accessed skill libraries place control
      and knowledge at different system boundaries.'
    - 'Deployment setting differs: evidence spans mobile, desktop, and web, but cross-platform
      breadth and transfer evidence vary, producing inconsistent generalization claims.'
    open_questions:
    - Can low-latency or low-parameter GUI policies close the accuracy gap to larger
      VLM baselines without losing their speed advantage?
    - Is screen-dynamics or predictor pretraining necessary when evidence suggests
      random initialization can match pretraining on reported decision performance?
    - How can agents learn robust error recovery and preference handling when environment
      reset, rollback, or action replay is expensive or unavailable?
    - Do open frameworks and benchmarks reproduce across independent teams, datasets,
      and infrastructure when visible artifact or limitation evidence is incomplete?
    - What is the right boundary between harness-native training, end-to-end policy
      training, and external skill/tool layers for cross-platform computer-use tasks?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端多模态动作策略，如OS-Helix和LLaDA-UI
      解决的问题: 从屏幕和指令中直接生成可执行的GUI操作或代码执行，统一多平台动作输出。
      尚未覆盖: 跨平台泛化、分布偏移下的精度、错误后的恢复仍不清晰；部分工作在数据包中未给出明确局限。
    - 路线: 面向Harness原生智能体的训练与编排框架，如OpenForgeRL
      解决的问题: 在保留Claude Code、Codex等推理Harness和真实环境的情况下，把智能体交互转化为RL或监督训练数据。
      尚未覆盖: RL后错误恢复仍弱，Harness设计影响可训练性；跨团队、跨基础设施的独立复现尚无证据。
    - 路线: 弱监督与数据高效策略学习，如GUICrafter
      解决的问题: 通过未标注截图或混合监督降低对昂贵GUI人工标注的依赖。
      尚未覆盖: 在更多界面和任务上的泛化仍待验证；对恢复和个性化等下游能力的证据不足。
    - 路线: 低延迟与参数高效动作评分，如GUI-JEPA
      解决的问题: 通过在潜空间对候选动作评分，避免逐token解码，从而加速GUI动作策略。
      尚未覆盖: 精度未达到较大VLM基线，评测较窄；屏幕动态预训练在此证据中没有必要。
    - 路线: 多模态技能与工具层，如VISUALSKILL
      解决的问题: 提供按需加载的应用级文字与视觉图形技能，改善UI元素识别和工作流状态验证。
      尚未覆盖: 技能库跨应用构建与泛化成本未充分评估，与底模型能力如何协同仍开放。
    - 路线: 诊断与恢复评估框架，如ReTrace和PrefDiag-Bench
      解决的问题: 系统测量计算机使用智能体的错误恢复一致性，并诊断移动GUI智能体在个性化偏好上的失败阶段。
      尚未覆盖: 动作重放和API回滚成本过高，诊断结果向训练或部署改进的迁移仍不明确。
    共识:
    - 研究普遍把GUI智能体构建为多模态屏幕理解与动作执行的闭环，覆盖移动、桌面和网页界面。
    - 越来越多工作通过弱监督、合成或混合动作工件以及RL或监督微调来降低人工标注成本。
    - 评估主要依赖可运行环境中的任务成功率或动作级指标，如OSWorld-Verified、AndroidControl和WebVoyager。
    - 推理速度、Harness兼容性和部署编排被视为与策略精度同样重要的一等研究对象。
    - 恢复、个性化和分布偏移等鲁棒性问题被承认是关键瓶颈，但尚未解决。
    分歧:
    - 表示与生成方式不同：有的在潜空间对候选动作评分，有的做块级扩散生成，有的检索多模态技能。
    - 监督信号不同：分别采用未标注截图、Harness轨迹RL、应用与文件工件组合，或不做训练而依赖外部技能。
    - 评测目标不同：有的优先评估延迟和参数效率，有的关注端到端成功率、恢复一致性或偏好遵循。
    - 交互位置不同：端到端策略模型、训练编排器和技能库对控制与知识放在哪里持有不同假设。
    - 部署场景不同：移动、桌面、网页证据分布不均，跨平台泛化结论不一致。
    开放问题:
    - 低延迟或低参数GUI策略能否在不损失速度的情况下缩小与更大VLM基线的精度差距？
    - 当证据显示随机初始化可匹配预训练时，屏幕动态或预测器预训练是否必要？
    - 在环境重置、回滚或动作重放昂贵且受限时，智能体如何学习错误恢复和偏好遵循？
    - 在可见工件和局限性证据不完整的情况下，开放框架与基准能否跨团队和基础设施独立复现？
    - Harness原生训练、端到端策略训练和外部技能层在跨平台计算机使用任务中的边界是什么？
