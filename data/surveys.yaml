  - 主流方向：可见工作通过细粒度基准、可验证或弱监督训练、多模态技能/上下文抽象以及不确定性校准，将 GUI 代理理论操作化，而非提供独立形式证明。
  - 研究共性：论文将任务成功拆分为子目标完成、成本-准确性、拖拽定位、不确定性排序等细粒度信号，并将模型能力与专门数据或工具接口耦合。
