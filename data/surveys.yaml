  literature_review:
    line_of_work_matrix:
    - line: Cross-application desktop and OS benchmarking
      what_it_solves: Measures real-world GUI agent success across many applications
        and GUI/CLI interaction using fine-grained sub-goal scoring.
      what_remains_open: Whether fine-grained scores transfer beyond one OS or application
        set, and whether framework choice matters once skill libraries are controlled.
    - line: Reusable skill and replay memory for computer-use agents
      what_it_solves: Captures app-specific multimodal procedures or compiled state-machine
        programs to reduce repeated per-step inference cost and execution errors.
      what_remains_open: Adaptation to UI updates, new tasks, or unseen apps is not
        established; evidence is benchmark-scoped and some artifacts are not visible
        in the packet.
    - line: Dynamic and video-guided interface grounding
      what_it_solves: Addresses interfaces that change between actions or tasks guided
        by video, using observation-control metrics and task-aware keyframe extraction.
      what_remains_open: Observation control remains unsolved; short-video and video-guided
        findings may not cover other dynamic or live interfaces.
    - line: Action-space and interaction primitive coverage
      what_it_solves: Expands evaluation beyond click and form filling to drag-based
        interactions and GUI/CLI combinations, using large datasets for action grounding.
      what_remains_open: Transfer of drag fine-tuning to real applications and from
        collected screenshots to live OS environments is not yet demonstrated.
    - line: History-aware and visually grounded execution critics
      what_it_solves: Intercepts short-sighted planning and coordinate-level execution
        errors by summarizing macro-action history and comparing actions to screenshots.
      what_remains_open: Cross-domain critic generalization and behavior in long-horizon
        live tasks remain open; current evidence comes from benchmark evaluations.
    - line: Security and adversarial web-task evaluation
      what_it_solves: Evaluates agentic fraud judgment without URL or reputation shortcuts,
        requiring reasoning from sanitized webpage evidence.
      what_remains_open: Benign recall is weak, and the benchmark is limited to 699
        cases across ten scenarios, so shortcut-rich real-world detection is not measured.
    consensus:
    - Evaluation is shifting from binary success to fine-grained, sub-goal, capability-tagged,
      or cost-accuracy metrics because similar Pass@1 can hide different completion
      behavior.
    - Frontier agents share failure modes around observation control, short-sighted
      planning, and per-step inference cost; repeated interventions add memory, skill
      retrieval, replay compilation, or visual grounding.
    - 'Visual context matters for GUI tasks: retaining visual figures or screenshot
      grounding improves UI element identification and workflow state verification.'
    - Application-specific task design is needed to expose distinct agent weaknesses
      across desktop, web, mobile, short-video, drag-based, and security settings.
    disagreements:
    - 'Representation of reusable knowledge differs: text-only skill memory, multimodal
      visual skill artifacts, compiled state-machine programs, and no-memory routes
      coexist.'
    - 'Evaluation target differs: static desktop task completion is contrasted with
      dynamic short-video interfaces, video-guided tasks, drag interactions, and security
      judgment.'
    - 'Assessment signal differs: deterministic rule-based scoring, fine-grained multi-checkpoint
      sub-goal scoring, cost-accuracy against human performance, and sanitized evidence-based
      fraud judgment.'
    - 'Interaction mode differs: common click and form-filling settings are extended
      by GUI/CLI combinations, drag actions, and dynamic observation control.'
    - 'Deployment setting differs: real macOS desktop, browser-based short-video simulation,
      web/mobile/desktop benchmarks, and URL-masked security environments.'
    open_questions:
    - Can reusable skill libraries and compiled replay programs remain reliable when
      application layouts or workflows change?
    - How can observation control be improved so agents neither over-observe dynamic
      content nor miss critical state changes?
    - Do fine-grained sub-goal and cost-accuracy metrics predict real-world computer-use
      reliability, safety, or operational efficiency?
    - Does drag-based or video-guided training transfer to downstream desktop or web
      tasks beyond the reported benchmark splits?
    - Can visually grounded critics generalize across web, mobile, and desktop without
      app-specific trajectory training?
    - How do fraud-detection agents behave when reputation cues are available, given
      the observed benign-recall weakness in shortcut-suppressed settings?
