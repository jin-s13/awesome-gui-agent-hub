  related_work_outline:
  - 'Mainstream direction: building large-scale, real-world GUI/OS automation datasets
    and environments that combine desktop, dynamic-screen, and video-guided tasks
    with verifiable or fine-grained evaluation.'
  - 'Shared research pattern: works pair benchmark task design with stress metrics
    and compare multiple frontier agents or models to expose hidden failure modes
    such as observation control, grounding uncertainty, and sub-goal completion.'
  - 'Key differences: evaluation targets differ across deterministic success/checkpoints,
    cost-accuracy, uncertainty ranking/conformal regions, and benchmark-driven agent
    improvements; environment assumptions also differ.'
  - 'Trend evolution: with available evidence concentrated in the 2024-2026 frontier,
    the field appears to be shifting from static screenshot grounding toward dynamic,
    multimodal, verifiable, and uncertainty-aware benchmarking while agent-side methods
    are optimized on these suites.'
  - 'Open questions: transfer to real deployments, multi-step trajectories, and interface
    mismatch remains under-evidenced, as does the alignment between fine-grained benchmarks
    and user-valued decisions.'
  related_work_outline_zh:
  - 主流方向：构建大规模真实GUI/OS自动化基准，覆盖桌面、动态界面、视频引导任务，并用细粒度或可验证指标比较前沿代理。
  - 研究共性：将任务设计与度量/压力测试结合，在统一环境中评估VLM/代理，暴露观察控制、定位不确定、子目标完成等隐蔽失败。
  - 关键差异：评估目标从Pass@1、确定性检查点到成本-准确率、不确定性排名和训练/harness提升各不相同；环境覆盖静态桌面、动态短视频、视频引导和单步定位。
  - 趋势演进：证据集中在2024-2026前沿，重点从静态截图定位转向动态、多模态、可验证和不确定性感知评测，同时方法侧在基准上持续优化。
  - 开放问题：基准结果能否迁移到真实部署、多步轨迹和界面偏移？细粒度代理指标是否对应真实用户决策与安全需求？
  literature_review:
    line_of_work_matrix:
    - line: Real-world OS and desktop task benchmarks
      what_it_solves: Build shared macOS/Windows-style desktop and OS tasks that compare
        GUI+CLI agents across applications, workflows, and multi-step sub-goals.
      what_remains_open: Fixed task suites leave deployment-transfer and boundary
        conditions under-evidenced; some benchmark limitations are not reported.
    - line: Dynamic and video-guided interface benchmarks
      what_it_solves: Model interfaces that change between actions and video-guided
        GUI tasks, testing observation efficiency and keyframe-based perception.
      what_remains_open: Coverage is limited to short-video or video-guided cases,
        so generalization to other dynamic UI classes remains open.
    - line: Fine-grained metric and stress-test design
      what_it_solves: Add sub-goal checkpoints, cost-accuracy, grounding uncertainty,
        and conformal click regions beyond aggregate success.
      what_remains_open: Proxy metrics may not match user decisions; uncertainty-ranking
        transfer is weak across model tiers and interfaces, and multi-step trajectories
        are not covered.
    - line: Benchmark-driven agent adaptation and verifiable training signals
      what_it_solves: Improve frozen agents via skills, harness optimization, verifiable
        task synthesis, weak supervision, and online RL using benchmark environments
        as evaluation signal.
      what_remains_open: Gains may be suite-specific; several works lack explicit
        limitations or reproducibility boundaries, leaving stability across implementations
        and compute budgets unresolved.
    - line: Comparable baselines and reporting conventions
      what_it_solves: Compare frameworks, open and proprietary models, and frozen
        versus optimized configurations under common task suites.
      what_remains_open: Stable cross-benchmark conclusions are scarce, and inconsistent
        limitation/artifact reporting creates verification gaps.
    consensus:
    - Large-scale GUI/OS evaluation increasingly uses real-world task suites rather
      than only static or single-step grounding.
    - Aggregate success masks meaningful differences; sub-goal checkpoints, observation
      cost, uncertainty calibration, and harness/skill effects provide additional
      signal.
    - Current computer-use agents remain limited in dynamic observation control, GUI
      grounding uncertainty, and multi-step workflows.
    - Evaluation conclusions depend materially on environment design, metric selection,
      and observable interfaces.
    disagreements:
    - 'Evaluation focus differs: aggregate task completion with deterministic checks
      versus efficiency-aware observation cost versus posterior uncertainty ranking.'
    - 'Setting assumptions differ: static desktop interfaces, dynamic short-video
      content, video-guided GUI tasks, and single-step executable grounding make different
      assumptions about content change and trajectory-level interaction.'
    - 'Improvement strategy differs: frozen-harness optimization, multimodal skill
      retrieval, verifiable task synthesis with online RL, weakly supervised visual
      grounding, and keyframe extraction target different bottlenecks.'
    - 'Limitation and reproducibility evidence is uneven: some reports include explicit
      limitations and artifacts, while others leave limitation fields empty or provide
      lower reproducibility signals, creating verification gaps.'
    open_questions:
    - Do benchmark results transfer beyond fixed task suites to held-out desktop,
      mobile, web, or OS deployments when interfaces and models shift?
    - Which fine-grained metrics align with user-valued task success, safety, and
      decision confidence, and which are only proxy signals?
    - Can observation control and uncertainty calibration be integrated into multi-step
      computer-use agents rather than being isolated in single-step grounding or short-video
      tasks?
    - How stable are benchmark-driven improvements such as skills, harness edits,
      online RL, and weakly supervised training across implementations, compute budgets,
      and benchmark versions?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 真实桌面与OS任务基准
      解决的问题: 在macOS、Windows等桌面环境中构建跨应用和混合GUI/CLI工作流，比较代理的任务完成与子目标进度。
      尚未覆盖: 固定任务套件之外的迁移、边界条件覆盖，以及某些基准的局限性证据缺失。
    - 路线: 动态与视频引导界面基准
      解决的问题: 建模操作间内容变化的动态界面和视频引导任务，检验观察效率与关键帧感知。
      尚未覆盖: 动态界面类型覆盖有限，短视频或视频引导结论外推到其他界面仍缺少证据。
    - 路线: 细粒度指标、不确定性与压力测试
      解决的问题: 在总体成功率之外增加子目标检查点、成本-准确率、定位不确定性和共形点击区域。
      尚未覆盖: 代理指标与用户决策是否一致，跨模型/接口不确定性排名迁移弱，多步轨迹未被覆盖。
    - 路线: 基准驱动的代理改进与可验证训练信号
      解决的问题: 利用技能、harness优化、可验证任务合成、弱监督和在线RL提升基准性能。
      尚未覆盖: 提升可能依赖特定基准，部分方法缺少明确局限性或复现边界；实现与算力预算下的稳定性未知。
    - 路线: 可比基线与报告规范
      解决的问题: 在统一任务套件下比较框架、开放与专有模型及冻结/优化配置。
      尚未覆盖: 跨基准稳定结论不足，局限性和工件披露不一致形成验证缺口。
    共识:
