  - 主流方向：以真实 GUI/OS/桌面和动态屏幕环境为主，强调贴近实际应用的交互任务与细粒度评估；代表性工作如 MacAgentBench 和 LivingScreen。
  - 研究共性：基准构建常将任务与可执行环境配对，并在 Pass@1 之外引入子目标/检查点、成本-准确性或不确定性诊断，评估前沿 VLM 或智能体与人类/基线表现的差距。
  - 关键差异：静态桌面与命令行任务对比动态短视频或视频引导界面；单步 grounding 对比多步轨迹；成功率指标对比不确定性/共形与效率指标；方法型训练或 harness
