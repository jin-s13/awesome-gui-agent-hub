  literature_review_zh:
    研究路线矩阵:
    - 路线: 真实GUI任务基准测试
      解决的问题: 用多应用或动态界面任务和细粒度指标比较代理能力，而不只看任务成功。
      尚未覆盖: 覆盖限于已测平台和交互类型；轨迹级安全、跨平台稳定与形式化可靠性尚未建立。
    - 路线: 多模态技能与harness增强
      解决的问题: 通过视觉技能工件或根据观察到的失败自动编辑执行harness，改进冻结或已部署的GUI代理。
      尚未覆盖: 泛化仅依靠少量基准迁移；应用相似性、骨干兼容性和harness编辑边界等假设未被充分测试。
    - 路线: 计算机使用代理的可扩展学习与任务合成
      解决的问题: 通过弱监督、可验证任务生成和在线RL减少对昂贵标注的依赖，用于GUI动作策略。
      尚未覆盖: 证据显示基准提升，但未直接验证合成任务和课程是否能预测失败覆盖或稳健迁移。
    - 路线: 不确定性与失败模式量化
      解决的问题: 度量GUI grounding的置信度，并暴露过度观察、观察不足或选择性UQ排序迁移等失败模式。
      尚未覆盖: UQ大多限于单步或特定平台；跨模型与分布偏移校准在不做目标侧重排时仍然较弱。
    共识:
    - 细粒度指标能揭示任务成功率之外的子目标、成本效率或grounding差异。
    - 截图、重复运行和交互原语等执行证据被视为诊断能力缺口的核心。
    - 人工标注被视作瓶颈，弱监督、可验证合成或自动化harness/技能改进因此受到关注。
    - 前沿GUI模型在动态观察控制、拖拽grounding和校准不确定性迁移上仍存在明显失败。
    分歧:
    - 改进路径不同：有的通过技能库或harness编辑增强冻结模型，有的通过RL或弱监督更新模型参数。
    - 评测目标不同：确定性多检查点成功、成本-准确性信息效率、单步不确定性排序和拖拽grounding各侧重不同能力。
    - 界面假设不同：静态桌面或通用GUI假设受到动态屏幕内容和拖拽交互套件的挑战。
    - 不确定性迁移预期不同：模型内排序迁移较强，但跨模型/闭源迁移较弱，隐含着可复用性的不同判断。
    开放问题:
    - 哪些形式化假设能解释GUI代理在动态界面中的观察控制失败和可靠性边界？
    - 细粒度基准、技能库收益或harness编辑能否迁移到未见的应用和多步轨迹？
    - 可验证合成任务是否足够覆盖人工标注任务的失败模式，从而预测稳健部署行为？
    - 事后不确定性量化如何在闭源模型和分布偏移下无需目标特定重排而保持校准？
