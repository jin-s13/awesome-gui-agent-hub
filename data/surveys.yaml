    frozen agents.'
  - 'Trend evolution: Within the narrow 2024-2026 evidence window, work appears to
    move from static or single-step evaluation toward multi-step desktop/dynamic/video
    tasks and toward benchmark-coupled self-improvement and verifiable training.'
  - 'Open questions: Cross-platform and cross-interface transfer, observation control
    in dynamic interfaces, alignment between metrics and user utility, and missing
    code/data/limitation details remain unresolved or under-verified.'
  related_work_outline_zh:
  - 主流方向：以环境为依托的GUI/OS自动化基准占主导，任务覆盖桌面OS工作流、动态浏览器/短视频界面、视频引导GUI交互与单步GUI定位。
  - 研究共性：论文定义可执行的GUI/网页/OS任务，评估前沿VLM智能体，并在总体成功之外报告子目标完成、成本-准确性或不确定性排序迁移等指标。
  - 关键差异：评测目标在静态桌面任务、动态实时界面、视频引导任务和GUI定位之间分化；部分工作从评测转向优化harness、技能库、训练数据或RL目标。
  - 趋势演进：在较窄的2024-2026证据窗口内，重点从静态或单步评测转向多步桌面/动态/视频任务，并出现基准驱动的自改进与可验证训练。
  - 开放问题：跨平台和跨界面迁移、动态界面中的观察控制、指标与用户效用的一致性，以及代码/数据/限制说明缺失带来的验证缺口仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: Real-world desktop and OS task benchmarking
      what_it_solves: Captures multi-application desktop workflows with GUI and CLI
        interaction, using deterministic rule-based scoring and fine-grained sub-goal
        metrics.
      what_remains_open: Coverage is limited to one OS/application ecosystem; cross-platform
        stability and framework-vs-skill confounding are not controlled; limitation
        details are missing.
    - line: Dynamic and living-interface evaluation
      what_it_solves: Evaluates GUI agents when screen content changes between actions,
        and measures task accuracy jointly with information or observation efficiency.
      what_remains_open: Evidence is restricted to short-video platforms; cost-accuracy
        thresholds are not tied to user utility; observation-control capability is
        identified as missing.
    - line: Video-guided GUI task benchmarking
      what_it_solves: Connects video understanding with interactive GUI decisions
        by benchmarking video-guided agentic tasks and extracting task-relevant keyframes.
      what_remains_open: Reported gains are concentrated on VideoQA; GUI-task evidence
        remains limited; generalization beyond the selected video domains is not measured.
    - line: Uncertainty diagnostics and stress testing for GUI grounding
      what_it_solves: Compares post-hoc uncertainty methods across VLM architectures
        and GUI grounding datasets, and builds calibration-aware click regions for
        spatial decisions.
      what_remains_open: Restricted to single-step grounding; cross-model and cross-interface
        transfer is weak; conformal coverage degrades under distribution shift; training-time
        or hybrid UQ is excluded.
    - line: Benchmark-driven agent improvement and verifiable training
      what_it_solves: Uses benchmark feedback or verifiable task synthesis to improve
        frozen agents, execution harnesses, RL sample efficiency, or weak-supervision
        pipelines.
      what_remains_open: Transfer evidence is limited to specific OS/Windows/agent
        suites; missing limitations and artifact details; stability across implementations
        and compute budgets is uncertain.
    - line: Multimodal skill and knowledge libraries for computer-use agents
      what_it_solves: Improves UI element identification and workflow-state verification
        by organizing multimodal skill artifacts and retrieving them during computer-use
        tasks.
      what_remains_open: Evaluation is limited to two computer-use benchmarks; there
        is no cross-environment ablation; the effect of skill-artifact quality is
        not systematically assessed.
    consensus:
    - Executable GUI/OS environments are the primary testbed, and task success is
      usually judged by rule-based or benchmark-specific scoring.
    - Fine-grained metrics beyond aggregate success are necessary because models with
      similar overall scores can differ substantially in sub-goal completion, observation
      cost, or calibration.
    - Current VLM-based computer-use agents remain unreliable on dynamic interfaces
      and long-horizon OS tasks, so evaluation must include observation control and
      robustness signals.
    - The evidence is concentrated in 2026, and benchmark evaluation is tightly coupled
      with agent improvement methods such as harness optimization, skill retrieval,
      and verifiable RL.
    disagreements:
    - 'Target environments differ: real static desktop tasks assume stable interface
      state, while dynamic and video-guided tasks assume content may change between
      actions.'
    - 'Evaluation focus differs: some work measures complete task success, while others
      prioritize sub-goal decomposition, cost-accuracy, uncertainty calibration, or
      verifiable task synthesis.'
    - 'Intervention level differs: some studies evaluate frozen models as-is, while
      others alter the harness, skill library, training data, or RL objective, changing
      what benchmark scores imply about model capability.'
    - Deployment settings differ across macOS, browser-based short-video platforms,
      video-guided GUI tasks, GUI grounding datasets, and OS/Windows arenas, limiting
      direct comparability.
    open_questions:
    - How well do benchmark rankings transfer across OS platforms, interface types,
      and model tiers when cross-tier uncertainty-ranking transfer is weak?
    - Which fine-grained metrics align with downstream user goals, and what thresholds
      define acceptable cost-accuracy or observation control?
    - Can agents learn to regulate observation in dynamic interfaces instead of over-
      and under-observing?
    - Do harness, skill, and RL improvements remain stable across implementations,
      compute budgets, and unseen tasks beyond the evaluated suites?
    - Many records omit limitations or lack code/data artifact detail; which missing
      reproducibility signals are merely absent from the packet, and which reflect
      actual verification gaps?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 真实桌面与OS任务基准
      解决的问题: 覆盖多应用桌面工作流，结合GUI与CLI交互，并用确定性规则评分和细粒度子目标指标衡量能力。
      尚未覆盖: 仅覆盖单一OS/应用生态；跨平台稳定性与框架/技能混淆未被控制；缺少限制说明。
    - 路线: 动态与实时界面评测
      解决的问题: 评估动作之间界面内容变化时的GUI智能体，并同时衡量任务准确性与信息或观察效率。
      尚未覆盖: 证据限于短视频平台；成本-准确性阈值未与用户效用对齐；观察控制能力被识别为缺失。
    - 路线: 视频引导的GUI任务基准
      解决的问题: 通过视频引导任务和任务相关关键帧提取，连接视频理解与交互式GUI决策。
      尚未覆盖: 提升主要见于VideoQA；GUI任务证据有限；所选视频域之外的泛化未被测量。
    - 路线: GUI定位的不确定性与压力测试
      解决的问题: 比较不同VLM架构和GUI定位数据集上的后验不确定性方法，并为空间决策构造校准感知的点击区域。
      尚未覆盖: 仅限单步定位；跨模型和跨界面迁移弱；分布偏移下共形覆盖下降；训练期或混合UQ被排除。
    - 路线: 基于基准反馈的智能体改进与可验证训练
      解决的问题: 利用基准反馈或可验证任务合成改进冻结智能体、执行harness、RL采样效率或弱监督流程。
      尚未覆盖: 迁移证据限于特定OS/Windows/Agent套件；缺少限制与工件细节；跨实现和算力预算的稳定性未知。
    - 路线: 面向计算机使用智能体的多模态技能库
      解决的问题: 通过组织多模态技能工件并在任务中检索，改善UI元素识别和工作流状态验证。
      尚未覆盖: 仅两个计算机使用基准上的证据；缺少跨环境消融；技能工件质量的影响未被系统评估。
    共识:
    - 可执行GUI/OS环境是主要评测平台，任务成功通常通过规则或基准特定评分判定。
    - 细粒度指标是必要的，因为总体分数相近的模型可能在子目标完成、观察成本或校准上差异显著。
    - 当前VLM驱动的计算机使用智能体在动态界面和长程OS任务上仍不可靠，评测需要纳入观察控制与鲁棒性信号。
    - 证据集中在2026年，基准评测与harness优化、技能检索、可验证RL等智能体改进方法高度耦合。
    分歧:
