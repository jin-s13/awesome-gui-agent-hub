    - Why do uncertainty rankings and safety hardening transfer selectively across
      datasets, interfaces, domains, and open/closed model tiers?
    - Do dense supervision, verifiable task synthesis, harness optimization, and context
      management address complementary failure modes or overlap?
    - How should open gaps be prioritized among long-horizon memory, grounding uncertainty,
      fraud benign recall, domain-conditioned safety, and benchmark generalization?
    - The packet provides no systematic survey inclusion criteria or limitation details
      for several primary papers; what evidence is needed to turn this into an auditable
      taxonomy or roadmap?
