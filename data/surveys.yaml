  - 主流方向：证据不是综述或分类体系，而是方法与基准驱动，围绕可验证监督、环境优化和受控评测构建并评估 GUI/计算机使用智能体。
  - 研究共性：论文将智能体或骨干模型与任务环境、基准或执行框架耦合，在留出套件上报告提升并尝试迁移到第二个基准，但局限记录不均衡。
  - 关键差异：监督来源、评测目标与部署界面不同，包括可验证任务合成、桌面/移动密集标注、冻结框架自改进、定位不确定性、长程移动上下文以及安全/欺诈探测。
  - 趋势演进：可见证据集中在2026年，显示当前前沿转向可验证任务合成、密集环境监督、自改进执行框架和边界专用安全与评测探针。
  - 开放问题：合成或密集监督能否跨操作系统、应用与界面迁移；单步定位指标如何关联长程成功；安全与不确定性结论是否跨模型层级和界面泛化；以及证据包中缺少系统综述产物。
  literature_review:
    line_of_work_matrix:
    - line: Verifiable task synthesis and efficient online RL for computer-use agents
      what_it_solves: Addresses the scarcity of verifiable interactive tasks and low
        sample efficiency when training computer-use agents.
      what_remains_open: Generated tasks are evaluated mainly on OSWorld and ScienceBoard;
        coverage beyond those applications, interfaces, and domains remains unverified.
    - line: Dense environment-driven supervision for GUI grounding
      what_it_solves: Creates large-scale annotated desktop observations to improve
        UI element grounding and downstream long-horizon task completion.
      what_remains_open: Transfer to unseen desktop conditions, application sets,
        and planner-model combinations is only partially evidenced.
    - line: Harness-level self-improvement around frozen agent backbones
      what_it_solves: Improves GUI agent performance by optimizing the execution harness
        rather than retraining the backbone model.
      what_remains_open: Generalization beyond OSWorld-Verified and WindowsAgentArena,
        and across different harness codebases or task families, is not fully shown.
    - line: Long-horizon mobile GUI context management
      what_it_solves: Reduces context growth and critical fact loss in long-horizon
        mobile GUI tasks by making context management a first-class action.
      what_remains_open: Evidence covers MemGUI-Bench and MobileWorld; generalization
        to broader interfaces, languages, and out-of-distribution tasks remains open.
    - line: Uncertainty quantification for GUI grounding and spatial safety
      what_it_solves: Evaluates and ranks post-hoc uncertainty methods for GUI grounding,
        including conformal click regions for spatial safety.
      what_remains_open: Benchmark evidence is limited to single-step grounding, and
        cross-tier or cross-interface UQ transfer is weak.
    - line: Safety and fraud decision benchmarking for web and computer-use agents
      what_it_solves: Tests agent judgment under controlled protocols that mask reputation
        shortcuts or use hand-crafted attack templates to isolate safety and fraud-detection
        behavior.
      what_remains_open: Reproducibility of optimized attacks, coverage of more domains,
        and safety generalization beyond tested surfaces remain unresolved.
    - line: Video-guided GUI task benchmarking via keyframe extraction
      what_it_solves: Builds a benchmark and keyframe extraction method for evaluating
        MLLM-based GUI agents on video-guided interactive tasks.
      what_remains_open: Broader video task diversity, multi-step agentic evaluation,
        and separation of benchmark effects from keyframe quality remain open.
    consensus:
    - Recent work evaluates GUI agents through task completion or grounding benchmarks
      rather than isolated component metrics.
    - Papers emphasize transfer evidence on held-out or out-of-distribution suites,
      not only in-distribution performance.
    - Data synthesis, environment design, and execution-harness optimization are treated
      as central levers beyond model pretraining.
    - Safety, uncertainty, and robustness are measured through controlled protocols
      that remove or vary cues to isolate specific capabilities.
    disagreements:
    - 'Improvement paths differ: some optimize frozen backbones through harness edits,
      while others fine-tune vision-language models on dense annotations or train
      via online RL.'
    - 'Evaluation targets differ: single-step grounding, long-horizon task completion,
      video-guided interaction, fraud judgment, and prompt-injection safety coexist.'
    - 'Supervision modalities differ: verifiable docker task rewards, screenshot/accessibility/window-geometry
      annotations, repeated-run harness evidence, and keyframe selection.'
    - 'Deployment surfaces differ: desktop, mobile, web, video-guided, and coding-domain
      cross-reference settings are evaluated separately.'
    - 'Transfer conclusions are selective: within-model uncertainty rankings transfer,
      but cross-tier uncertainty transfer is weak, and browser-domain safety hardening
      does not transfer to coding tasks.'
    open_questions:
    - Does large-scale synthetic or dense supervision transfer across operating system
      versions, application sets, and interaction modalities beyond the tested benchmarks?
    - How should single-step GUI grounding metrics be related to long-horizon task
      success in a shared evaluation framework?
    - How can uncertainty quantification be reliably selected and calibrated when
      model internals are hidden or interface distributions shift?
    - Why is safety behavior domain-conditioned, and what additional cross-domain
      evidence would predict robustness on coding, mobile, or other surfaces?
    - The topic is labeled as survey, but the evidence packet contains method and
      benchmark papers rather than systematic surveys, taxonomies, tutorials, or roadmaps;
      where is the survey-level evidence base?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 可验证任务合成与高效在线RL
      解决的问题: 缓解可验证交互任务稀缺和训练样本效率低的问题。
      尚未覆盖: 生成任务主要在OSWorld和ScienceBoard上评测，其应用、界面和领域覆盖未验证。
    - 路线: 密集环境监督与GUI定位数据生成
      解决的问题: 通过大规模桌面标注提升UI元素定位和下游长程任务完成。
      尚未覆盖: 对未知桌面条件、应用集和规划器组合的迁移只得到部分验证。
    - 路线: 围绕冻结骨干的执行框架级自改进
      解决的问题: 在不重训骨干模型的情况下，通过优化执行框架提升GUI智能体。
      尚未覆盖: 对OSWorld-Verified和WindowsAgentArena之外的框架代码和任务家族泛化未充分展示。
    - 路线: 长程移动GUI上下文管理
      解决的问题: 在长时域移动任务中降低上下文膨胀和关键事实丢失风险。
      尚未覆盖: 证据集中在MemGUI-Bench和MobileWorld，更广界面、语言和分布外任务仍需验证。
    - 路线: GUI定位不确定性与空间安全评测
      解决的问题: 评估和排序GUI定位后验不确定性方法，并用共形点击区域支持空间安全。
      尚未覆盖: 基准局限于单步定位，跨模型层级和跨界面UQ迁移较弱。
    - 路线: 网页与计算机使用智能体的安全与欺诈决策基准
      解决的问题: 在隐去信誉线索或使用手工攻击模板的受控条件下，测试智能体的安全与欺诈判断边界。
      尚未覆盖: 优化攻击的可复现性、更多领域覆盖以及安全泛化仍未解决。
    - 路线: 视频引导GUI任务基准与关键帧提取
      解决的问题: 通过基准和关键帧提取方法，评测基于MLLM的GUI智能体在视频引导交互任务上的表现。
      尚未覆盖: 更广泛视频任务多样性、多步智能体评测以及基准效应与关键帧质量的分离仍开放。
    共识:
    - 近期工作通过任务完成或定位基准评估GUI智能体，而不是只做组件级评估。
    - 论文重视留出集或分布外套件上的迁移证据，而非仅报告分布内表现。
    - 数据合成、环境设计和执行框架优化被视为模型预训练之外的关键提升路径。
    - 安全、不确定性和鲁棒性通过受控协议去除或变化线索来隔离具体能力。
    分歧:
    - 改进路径不同：有的通过执行框架编辑优化冻结骨干，有的通过密集标注微调视觉语言模型，有的通过在线RL训练。
    - 评测目标不同：单步定位、长程完成、视频引导交互、欺诈判断和提示注入安全并存。
    - 监督形态不同：可验证任务奖励、截图/无障碍树/窗口几何标注、重复运行证据和关键帧选择各成路线。
    - 部署界面不同：桌面、移动、网页、视频引导和编码领域被分别评估。
    - 迁移结论存在选择性：模型内不确定性排名可迁移，跨层级不确定性迁移弱，浏览器安全加固不迁移到编码任务。
    开放问题:
    - 大规模合成或密集监督能否跨操作系统版本、应用集和交互模态泛化？
    - 单步GUI定位指标如何与长程任务成功建立共享评测关系？
    - 当模型内部状态不可见或界面分布变化时，如何可靠选择和校准不确定性方法？
    - 为什么安全行为随领域变化，哪些跨领域证据能预测编码、移动或其他界面上的鲁棒性？
    - 本主题标注为survey，但证据包主要是方法和基准论文，缺少系统综述、分类体系、教程或路线图；应如何补足综述级证据？
