  related_work_outline:
  - 'Mainstream direction: Building scalable GUI agent frameworks that combine online
    reinforcement learning, multimodal skill libraries, and large-scale training infrastructure
    to deploy agents on real websites and desktops.'
  - 'Shared research pattern: Enhancing visual memory or skill representations (e.g.,
    action-grounded crops, multimodal skill artifacts) to improve state understanding
    and action accuracy; reducing reliance on expensive human annotations via weak
    supervision or online RL.'
  - 'Key differences: Training paradigms divide into online RL, offline weak supervision,
    and supervised fine-tuning at scale; skill representations range from multimodal
    skill libraries to image-crop memories; evaluation targets differ between offline
    step-level diagnostics and online end-to-end task success.'
  - 'Trend evolution: Within the 2024–2026 frontier, the field is shifting from single-task
    benchmarks toward end-to-end system deployment, with growing emphasis on online
    training, reproducibility, and domain-conditioned safety auditing.'
  - 'Open questions: How to transfer offline diagnostic insights to online performance;
    how to generalize safety and skills across domains; how to design memory mechanisms
    that balance state tracking and action precision; error recovery remains weak
    even after RL training.'
  related_work_outline_zh:
  - 主流方向：构建可扩展的GUI代理框架，结合在线强化学习、多模态技能库和大规模训练基础设施，在真实网站和桌面环境中部署代理。
  - 研究共性：通过增强视觉记忆或技能表示（如动作接地裁剪、多模态技能工件）改善状态理解与动作准确性；通过弱监督或在线RL减少对昂贵人工标注的依赖。
  - 关键差异：训练范式分为在线RL、离线弱监督和大规模监督微调；技能表示包括多模态技能库、图像裁剪记忆等；评估目标在离线步骤级诊断与在线端到端任务成功之间分化。
  - 趋势演进：2024–2026年前沿期内，领域从单任务基准向端到端系统部署转变，越来越重视在线训练、可复现性和领域条件安全性审计。
  - 开放问题：如何将离线诊断见解转化为在线性能；如何跨域泛化安全性和技能；如何设计兼顾状态跟踪与动作精度的记忆机制；RL训练后错误恢复仍薄弱。
  literature_review:
    line_of_work_matrix:
    - line: Runnable pipelines and deployment stacks
      what_it_solves: Integrating model training and inference into end-to-end workflows
        that support online RL, weak supervision, or large-scale supervised fine-tuning
        for GUI agents.
      what_remains_open: Error recovery remains weak after RL training; harness design
        heavily influences trainability, and cross-environment generalization is not
        guaranteed.
    - line: Real-time and interactive serving
      what_it_solves: Meeting low-latency and interactivity requirements through scaffold
        designs that manage multi-turn screenshot history and live-website interactions.
      what_remains_open: Offline benchmarks cannot capture asynchronous timing, delays,
        and real-time dynamics; trade-offs between speed, fidelity, and system complexity
        are not systematically studied.
    - line: Artifacts and reproducible engineering
      what_it_solves: Making system behavior inspectable and reusable through multimodal
        skill libraries, action-grounded visual memories, and step-level diagnostic
        benchmarks.
      what_remains_open: Automated construction of multimodal skill libraries, independent
        reproduction across teams and infrastructure, and generalization of memory
        mechanisms to dynamic environments.
    consensus:
    - Visual memory is critical for GUI agents, but naive full-image memory can worsen
      action-level errors by introducing visual clutter.
    - Online reinforcement learning on real websites or desktops substantially improves
      agent performance, but requires large-scale rollout infrastructure.
    - Multimodal information (images + text) outperforms text-only representations
      for UI element identification and workflow state verification.
    - 'Safety hardening is domain-conditioned: agents robust against browser prompt
      injections can remain vulnerable to the same attack class in coding tasks.'
    disagreements:
    - 'Training paradigm: online RL using live environments versus offline weak supervision
      on unannotated screenshots versus large-scale supervised fine-tuning with scaffolded
      rollouts.'
    - 'Skill representation: hierarchical multimodal skill libraries (VISUALSKILL)
      versus action-grounded image crops (AGMem) versus no explicit skill store.'
    - 'Evaluation target: step-level diagnostic understanding of GUI transitions (Desktop-Delta
      Bench) versus end-to-end task success rates on online benchmarks.'
    - 'Safety scope: browser-only threat models versus cross-domain comparisons revealing
      domain-conditioned safety properties.'
    open_questions:
    - How can offline diagnostic benchmarks inform online training to improve specific
      failure modes such as hidden operation blindness?
    - Under what conditions do skill libraries and visual memories generalize across
      applications and operating systems?
    - Why do some harnesses remain substantially harder to learn than others, and
      what design choices determine trainability?
    - How can error recovery be explicitly targeted during RL training given it remains
      weak across frameworks?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 可运行流水线与部署栈
      解决的问题: 将模型训练与推理整合为端到端工作流，支持在线强化学习、弱监督或大规模监督微调，用于GUI代理。
      尚未覆盖: 错误恢复在RL训练后仍薄弱；框架设计显著影响可训练性，跨环境泛化尚未保证。
    - 路线: 实时与交互式服务
      解决的问题: 通过脚手架设计管理多轮截图历史和真实网站交互，满足低延迟和交互性需求。
      尚未覆盖: 离线基准无法捕捉异步时序、延迟和实时动态；速度、保真度与系统复杂度之间的权衡缺乏系统研究。
    - 路线: 工件与可复现工程
      解决的问题: 通过多模态技能库、动作接地视觉记忆和步骤级诊断基准，使系统行为可检查、可复用。
      尚未覆盖: 多模态技能库的自动化构建、跨团队和基础设施的独立复现，以及记忆机制对动态环境的泛化。
    共识:
    - 视觉记忆对GUI代理至关重要，但朴素全图记忆可能引入视觉杂乱，恶化动作级错误。
    - 在真实网站或桌面上的在线强化学习能显著提升代理性能，但需要大规模部署基础设施。
    - 多模态信息（图像+文本）在UI元素识别和工作流状态验证中优于纯文本表示。
    - 安全加固是领域条件的：在浏览器提示注入上鲁棒的代理，在编码任务中可能对同类攻击仍然脆弱。
    分歧:
    - 训练范式：使用真实环境的在线RL versus 基于未标注截图的离线弱监督 versus 使用脚手架回放的大规模监督微调。
    - 技能表示：分层多模态技能库（VISUALSKILL） versus 动作接地图像裁剪（AGMem） versus 无显式技能存储。
    - 评估目标：对GUI过渡的步骤级诊断理解（Desktop-Delta Bench） versus 在线基准上的端到端任务成功率。
    - 安全范围：仅针对浏览器的威胁模型 versus 揭示领域条件安全特性的跨领域比较。
    开放问题:
    - 离线诊断基准如何指导在线训练，以改善隐藏操作盲区等特定失败模式？
    - 技能库和视觉记忆在什么条件下能跨应用和操作系统泛化？
    - 为何某些框架明显更难学习，哪些设计选择决定了可训练性？
    - 如何在RL训练中显式地针对错误恢复进行优化，鉴于该能力在各框架中仍普遍薄弱？
