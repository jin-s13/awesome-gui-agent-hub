  related_work_outline:
  - 'Mainstream direction: Building realistic, large-scale GUI agent benchmarks that
    move beyond simplified web environments to real operating systems (macOS, short-video
    platforms) with fine-grained, multi-dimensional evaluation metrics.'
  - 'Shared research pattern: All works introduce either a new benchmark dataset,
    a new evaluation protocol, or a training methodology that addresses a specific
    gap in prior GUI agent research—such as missing interaction types (drag, dynamic
    content), lack of observation control, or reliance on expensive human annotations.'
  - 'Key differences: Benchmarks differ in interaction modality (click-only vs. drag-based
    vs. GUI+CLI), environment dynamics (static vs. living-screen), and evaluation
    granularity (end-to-end success vs. sub-goal checkpoints vs. uncertainty quantification).
    Training methods differ in supervision signal (weakly-supervised from unlabeled
    screenshots vs. online RL with verifiable rewards).'
  - 'Trend evolution: Within the 2024–2026 frontier, the field is shifting from single-modality,
    click-only benchmarks toward multi-modal, multi-interaction, and dynamic-environment
    evaluation, with growing emphasis on fine-grained metrics, training efficiency,
    and uncertainty awareness.'
  - 'Open questions: Whether current benchmark distributions cover the long-tail of
    real-world GUI tasks; how well evaluation metrics align with downstream user satisfaction;
    and whether agents trained on one platform or interaction mode generalize to others
    without re-benchmarking.'
  related_work_outline_zh:
  - 主流方向：构建大规模、真实环境下的GUI代理基准测试，从简化的网页环境走向真实操作系统（macOS、短视频平台），并采用细粒度、多维度的评估指标。
  - 研究共性：所有工作都引入了新的基准数据集、新的评估协议或新的训练方法，以填补先前GUI代理研究的空白——如缺失的交互类型（拖拽、动态内容）、观察控制能力的缺乏，或对昂贵人工标注的依赖。
  - 关键差异：基准测试在交互模态（仅点击 vs. 拖拽 vs. GUI+CLI）、环境动态性（静态 vs. 动态屏幕）和评估粒度（端到端成功率 vs. 子目标检查点
    vs. 不确定性量化）上存在差异。训练方法在监督信号上存在差异（基于未标注截图的弱监督 vs. 基于可验证奖励的在线强化学习）。
  - 趋势演进：在2024–2026年的前沿窗口中，该领域正从单一模态、仅点击的基准测试，转向多模态、多交互类型和动态环境的评估，并越来越重视细粒度指标、训练效率和不确定性感知。
  - 开放问题：当前基准测试的分布是否覆盖了真实世界GUI任务的长尾部分；评估指标与下游用户满意度之间的对齐程度；在一个平台或交互模式上训练的代理能否在不重新基准测试的情况下泛化到其他平台或模式。
  literature_review:
    line_of_work_matrix:
    - line: Realistic OS-level benchmark design
      what_it_solves: Moves GUI agent evaluation from simplified web sandboxes to
        real operating systems with diverse applications, multi-step workflows, and
        combined GUI+CLI interactions.
      what_remains_open: Cross-platform comparability remains limited; task distributions
        may not cover long-tail real-world scenarios, and evaluation environments
        are often restricted to a single OS or application ecosystem.
    - line: Interaction modality coverage
      what_it_solves: Fills gaps in existing benchmarks that focus predominantly on
        click-based actions, by introducing drag-based, dynamic-content, and video-guided
        interaction tasks.
      what_remains_open: Complex multi-step interaction chains spanning multiple modalities
        within a single task are still underexplored; generalization of agents trained
        on one modality to others is unverified.
    - line: Skill-augmented agent architectures
      what_it_solves: Improves agent performance by providing structured, retrievable
        skill libraries that capture application-specific workflows, with multimodal
        artifacts that retain visual figures alongside text.
      what_remains_open: Skill libraries are manually or semi-automatically constructed
        per application; their transferability across applications and platforms is
        not demonstrated, and the scalability of skill construction remains an open
        question.
    - line: Efficient training with reduced supervision
      what_it_solves: Reduces reliance on expensive human-annotated demonstrations
        by using weak supervision from unlabeled screenshots or verifiable task synthesis
        with online RL.
      what_remains_open: The diversity and safety of synthetically generated tasks
        are not fully characterized; online RL in real environments may introduce
        risks, and the gap between synthetic and real-world task distributions is
        not quantified.
    - line: Fine-grained evaluation and uncertainty quantification
      what_it_solves: Goes beyond aggregate success rates by introducing sub-goal
        checkpoints, cost-accuracy trade-offs, and post-hoc uncertainty quantification
        to assess agent reliability and observation control.
      what_remains_open: Uncertainty quantification rankings transfer poorly across
        model tiers and interfaces; the connection between proxy metrics (e.g., conformal
        prediction sets) and downstream task completion is not yet established.
    consensus:
    - Realistic environments with diverse applications and multi-step tasks are necessary
      for meaningful GUI agent evaluation.
    - Fine-grained, multi-dimensional metrics are superior to binary success/failure
      for diagnosing agent capabilities.
    - Multimodal information (visual screenshots combined with textual or structural
      representations) is essential for accurate GUI grounding and action prediction.
    - Reducing reliance on expensive human annotations is a shared goal, whether through
      weak supervision, synthetic task generation, or online RL with verifiable rewards.
    disagreements:
    - Evaluation protocols differ in whether they use deterministic rule-based scoring
      or model-based judgment, leading to potential incomparability in reported scores.
    - 'Interaction modalities are unevenly covered: some benchmarks focus on click-only
      actions, while others introduce drag, scroll, or CLI interactions, with no consensus
      on the minimal set of modalities a comprehensive benchmark should include.'
    - 'Training philosophies diverge: one line uses weak supervision from massive
      unlabeled screenshots to bootstrap visual grounding, while another uses online
      RL with verifiable task synthesis, reflecting different assumptions about data
      availability and environment access.'
    - 'Skill representation formats vary: some works encode skills as pure text, while
      others argue that retaining visual figures in skill artifacts is critical for
      UI element identification and workflow verification.'
    open_questions:
    - How well do current benchmark task distributions represent the diversity and
      long-tail nature of real-world GUI automation needs across different user populations
      and application domains?
    - To what extent do fine-grained evaluation metrics (sub-goal completion, uncertainty
      calibration, cost-accuracy) correlate with actual user satisfaction and task
      completion in unconstrained deployment settings?
    - Can agents trained on one platform, interaction modality, or visual style generalize
      to others without requiring target-specific re-benchmarking or re-training?
    - What is the minimal set of interaction modalities and environment dynamics that
      a benchmark must cover to provide meaningful guarantees about an agent's real-world
      readiness?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 真实操作系统级基准设计
      解决的问题: 将GUI代理评估从简化的网页沙盒迁移到真实操作系统，包含多样化应用、多步工作流和GUI+CLI组合交互。
      尚未覆盖: 跨平台可比性仍然有限；任务分布可能未覆盖长尾真实场景，评估环境通常局限于单一操作系统或应用生态。
    - 路线: 交互模态覆盖
      解决的问题: 填补现有基准测试主要关注点击操作的空白，引入拖拽、动态内容和视频引导的交互任务。
      尚未覆盖: 在单个任务中跨越多种模态的复杂多步交互链仍未被充分探索；代理在一种模态上训练后能否泛化到其他模态尚未验证。
    - 路线: 技能增强的代理架构
      解决的问题: 通过提供结构化、可检索的技能库来提升代理性能，技能库捕获应用特定的工作流，并以多模态工件形式保留视觉图形与文本。
      尚未覆盖: 技能库是手动或半自动为每个应用构建的；其跨应用和跨平台的可迁移性未被证明，技能构建的可扩展性仍是开放问题。
    - 路线: 减少监督的高效训练
      解决的问题: 通过利用未标注截图的弱监督或可验证任务合成与在线RL，减少对昂贵人工标注示范的依赖。
      尚未覆盖: 合成生成的任务的多样性和安全性尚未被充分表征；真实环境中的在线RL可能引入风险，合成任务与真实任务分布之间的差距未被量化。
    - 路线: 细粒度评估与不确定性量化
      解决的问题: 超越聚合成功率，引入子目标检查点、成本-准确性权衡和后验不确定性量化，以评估代理的可靠性和观察控制能力。
      尚未覆盖: 不确定性量化排名在不同模型层级和接口间迁移性较差；代理指标（如共形预测集）与下游任务完成之间的关联尚未建立。
    共识:
    - 具有多样化应用和多步任务的真实环境对于有意义的GUI代理评估是必要的。
    - 细粒度、多维度的指标优于二元成功/失败，能够更好地诊断代理能力。
    - 多模态信息（视觉截图与文本或结构化表示结合）对于准确的GUI基础定位和动作预测至关重要。
    - 减少对昂贵人工标注的依赖是共同目标，无论是通过弱监督、合成任务生成，还是带有可验证奖励的在线RL。
    分歧:
    - 评估协议在是否使用确定性规则评分或基于模型的判断上存在差异，导致报告分数可能不可比。
    - 交互模态覆盖不均衡：一些基准测试仅关注点击操作，另一些引入了拖拽、滚动或CLI交互，对于综合基准测试应包含的最小模态集合没有共识。
    - 训练哲学存在分歧：一种路线使用来自海量未标注截图的弱监督来引导视觉定位，另一种使用带有可验证任务合成的在线RL，反映了对数据可用性和环境访问的不同假设。
    - 技能表示格式各不相同：一些工作将技能编码为纯文本，而另一些则主张在技能工件中保留视觉图形对UI元素识别和工作流验证至关重要。
