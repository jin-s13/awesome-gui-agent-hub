  literature_review:
    line_of_work_matrix:
    - line: Training and objective design for GUI action grounding
      what_it_solves: Reduces annotation dependence and scales action prediction through
        verifiable task synthesis, online RL, or weak supervision from unannotated
        screenshots.
      what_remains_open: Transfer beyond OSWorld, ScienceBoard, and UI-TARS/GUI-R1
        comparisons is not established; ablation of curriculum, reward, or data-scale
        choices is only partially shown.
    - line: Observation and action-interface methods
      what_it_solves: Selects task-aware keyframes or expands interaction spaces such
        as drag and GUI+CLI to improve grounding on dynamic/video and desktop interfaces.
      what_remains_open: Dynamic-screen observation control is not solved; drag evidence
        is limited to a fine-tuned model; cross-interface generalization remains underexplored.
    - line: Evidence-driven harness and planner optimization
      what_it_solves: Improves frozen GUI agents by diagnosing failure patterns from
        before-and-after screenshots and repeated runs, then editing the execution
        harness instead of model weights.
      what_remains_open: Limitation details are missing; gain attribution between
        model, harness, and skill library is not isolated; transfer evidence is benchmark-specific.
    - line: Uncertainty quantification and evaluation protocols
      what_it_solves: Calibrates post-hoc confidence for GUI grounding with conformal
        regions and exposes fine-grained sub-goal, cost-accuracy, and ranking transfer
        differences.
      what_remains_open: Limited to single-step executable grounding; cross-tier transfer
        is weak; coverage degrades under calibration/test or interface mismatch; training-time
        or hybrid UQ is not assessed.
    consensus:
    - 'There is a shared move toward richer evidence: task suites use fine-grained
      checkpoints, cost-accuracy, action-type coverage, and calibration metrics rather
      than a single pass/fail score.'
    - Multiple papers treat the vision-language policy as one component inside a larger
      system, contrasting model weights, execution harness, observation selection,
      or uncertainty filters.
    - Evaluations consistently show that frontier models still have capability gaps
      in GUI grounding, observation control, or uncertainty estimation, motivating
      component-level methods.
    - Several contributions couple benchmark construction with method intervention,
      using datasets for training, calibration, or held-out transfer.
    disagreements:
    - 'Optimization level differs: end-to-end weight training via online RL or weak
      supervision versus frozen-model harness editing versus observation/keyframe
      selection versus post-hoc uncertainty calibration.'
    - 'Evaluation context differs: static desktop and single-step grounding versus
      dynamic video/living-screen interfaces versus multi-application GUI+CLI workflows
      versus drag interactions.'
    - 'Supervision source differs: human-annotated gold labels, unannotated screenshots
      with weak labels and minimal calibration data, synthetic verifiable RL tasks,
      or repeated-run execution evidence.'
    - Some methods assume frozen backbones and change system internals, while others
      assume model training is necessary; reported gains do not yet isolate model
      contribution from harness, skill-library, or task-synthesis effects.
    open_questions:
    - How well do gains on OSWorld, ScienceBoard, macOS, short-video, and video-guided
      benchmarks transfer to unseen interfaces, applications, and long-horizon multi-step
      workflows?
    - Can observation-control and keyframe-selection methods be generalized from dynamic
      video contexts to desktop GUI tasks where state changes between actions?
    - Is post-hoc uncertainty quantification sufficient for multi-step GUI trajectories,
      and which UQ family remains calibrated under distribution shift and cross-interface
      transfer?
    - What portion of reported gains comes from the proposed model or method versus
      the surrounding harness, skill library, task generation, or observation strategy?
    - Where limitation fields are empty, what boundary conditions, failure modes,
      and verification gaps remain for reproducibility and deployment?
  literature_review_zh:
    研究路线矩阵:
    - 路线: GUI动作接地的训练与目标设计
      解决的问题: 通过可验证任务合成、在线RL或无标注截图弱监督降低标注依赖并扩展动作预测。
      尚未覆盖: OSWorld、ScienceBoard和UI-TARS/GUI-R1对比之外的迁移未建立；课程、奖励或数据规模的消融仅部分展示。
    - 路线: 观察与动作接口方法
      解决的问题: 选择任务感知关键帧或扩展拖拽、GUI+CLI等交互空间，以改进动态视频和桌面界面中的接地能力。
      尚未覆盖: 动态屏幕观察控制未解决；拖拽证据限于微调模型；跨界面泛化探索不足。
    - 路线: 证据驱动的harness与规划器优化
      解决的问题: 通过前后截图和重复运行诊断失败模式，编辑执行harness而不是模型权重来改进冻结GUI代理。
      尚未覆盖: 局限性细节缺失；模型、harness和技能库之间的收益归因未隔离；迁移证据局限于特定基准。
    - 路线: 不确定性量化与评估协议
      解决的问题: 用共形区域校准GUI接地的后验置信度，并揭示细粒度子目标、成本准确性和排名迁移差异。
      尚未覆盖: 限于单步可执行接地；跨层级迁移弱；校准/测试或界面不匹配时覆盖率下降；未评估训练时或混合UQ。
    共识:
    - 研究共同转向更丰富的证据：任务套件采用细粒度检查点、成本-准确性、动作类型覆盖和校准指标，而不是单一成败分数。
    - 多篇文章将视觉语言策略视作更大系统的一个组件，对比模型权重、执行harness、观察选择或不确定性过滤。
    - 评估一致显示前沿模型在GUI接地、观察控制或不确定性估计上仍存在能力缺口，从而推动组件级方法。
    - 若干工作把基准构建与方法干预结合，利用数据集进行训练、校准或保留集迁移。
    分歧:
    - 优化层次不同：通过在线RL或弱监督进行端到端权重训练，对比冻结模型harness编辑、观察/关键帧选择、后验不确定性校准。
    - 评测场景不同：静态桌面与单步接地，对比动态视频/动态屏幕接口、多应用GUI+CLI流程、拖拽交互。
    - 监督来源不同：人工标注金标签、无标注截图加少量校准数据、合成可验证RL任务或重复运行执行证据。
    - 部分方法假设冻结骨干并修改系统内部，另一些假设必须训练模型；报告收益尚未将模型贡献与harness、技能库或任务合成效应隔离。
    开放问题:
    - OSWorld、ScienceBoard、macOS、短视频和视频引导基准上的提升能否迁移到未见界面、应用和长程多步工作流？
    - 观察控制和关键帧选择方法能否从动态视频语境推广到桌面GUI任务？
    - 后验不确定性量化对多步GUI轨迹是否足够，哪个UQ族在分布偏移和跨接口迁移下仍保持校准？
    - 报告收益中有多少来自所提模型或方法，而不是周围harness、技能库、任务生成或观察策略？
    - 在局限性字段为空的情况下，哪些边界条件、失败模式和验证缺口仍未说明？
