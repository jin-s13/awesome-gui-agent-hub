  literature_review:
    line_of_work_matrix:
    - line: Real-world OS desktop task suite design
      what_it_solves: Provides large application and task coverage with GUI and CLI
        interaction plus deterministic fine-grained scoring for comparable multi-step
        desktop-agent evaluation.
      what_remains_open: Evidence is concentrated on macOS desktop and rule-based
        checks; stability across operating systems, frameworks, implementations, and
        compute budgets is underevidenced.
    - line: Dynamic interface and video-guided task benchmarking
      what_it_solves: Captures interfaces whose content changes between actions and
        video-conditioned GUI tasks, testing observation efficiency and temporal reasoning.
      what_remains_open: Short-video platform scope may not generalize to all dynamic
        interface types; observation-control failure modes and cost-accuracy metrics
        lack broader cross-platform validation.
    - line: Fine-grained metrics and uncertainty stress testing
      what_it_solves: Moves beyond aggregate success to sub-goal completion, cost-accuracy,
        and post-hoc uncertainty calibration for GUI grounding.
      what_remains_open: Single-step grounding results may not transfer to multi-step
        agent trajectories; cross-model and cross-interface uncertainty ranking transfer
        is weak.
    - line: Skill and execution-harness adaptation evaluated on GUI benchmarks
      what_it_solves: Improves GUI agents while keeping backbone models frozen through
        multimodal skill libraries or automatically optimized execution harnesses.
      what_remains_open: Gains are benchmark-specific; generalization to deployment
        settings, avoidance of overfitting to observed failure patterns, and robustness
        across repeated runs need more evidence.
    - line: Scalable task synthesis and weak-supervision training
      what_it_solves: Generates verifiable tasks or uses unannotated screenshots to
        reduce annotation cost and support online RL at scale for computer-use agents.
      what_remains_open: State-of-the-art claims rest on particular benchmark suites;
        training data quality, possible benchmark leakage, and long-horizon robustness
        remain underverified.
    - line: Cross-benchmark transfer and comparable reporting
      what_it_solves: Probes whether benchmark conclusions, optimized harnesses, or
        uncertainty rankings transfer across benchmarks, interfaces, and model tiers.
      what_remains_open: Most evidence is single-benchmark or limited transfer; reporting
        conventions and artifact availability vary, leaving auditability and reproducibility
        incomplete.
    consensus:
    - GUI and OS automation is usually evaluated through executable environment interactions
      with deterministic or rule-based success signals.
    - Aggregate success alone is insufficient; work increasingly adds sub-goal, cost-accuracy,
      or uncertainty signals to reveal hidden failure modes.
    - Rankings and gains are sensitive to dataset, interface, model tier, and evaluation
      setting, so target-specific evaluation is often necessary.
    - Recent work shifts toward improving agents under frozen model constraints, synthetic
      task generation, or weak supervision to lower annotation and training costs.
    - Dynamic, real-world, and multi-step tasks expose failures that static screenshot
      grounding or single-step evaluation misses.
    disagreements:
    - Some work evaluates static screenshot grounding, while other work targets multi-step
      desktop workflows, dynamic living interfaces, or video-guided tasks.
    - 'The primary object of study differs: benchmark creation and scoring versus
      agent-side skill or harness optimization versus training-data synthesis and
      RL.'
    - 'Supervision assumptions differ: fully annotated task suites, weakly supervised
      learning from unannotated screenshots, and verifiable synthetic task generation.'
    - 'Observation models differ: some assume relatively stable screen content, while
      dynamic-interface work treats content change and observation cost as a central
      challenge.'
    - 'Uncertainty-transfer evidence conflicts in strength: within-model ranking transfer
      can be strong, but cross-tier and cross-interface transfer is much weaker.'
    open_questions:
    - Do benchmark conclusions remain stable across unseen platforms, frameworks,
      implementations, and compute budgets?
    - How well do fine-grained, cost-accuracy, and uncertainty metrics align with
      downstream user decisions and deployment risk?
    - How representative are short-video, macOS desktop, or video-guided task distributions
      for the broader space of GUI, web, mobile, and OS automation?
    - Can skill-library and execution-harness gains transfer without overfitting to
      a single benchmark's failure patterns or repeated-run evidence?
    - How should benchmarks handle observation control, repeated runs, and execution
      variability without leaking evaluation signal?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 真实OS桌面任务套件设计
      解决的问题: 提供大规模应用与任务覆盖，结合GUI和CLI交互及确定性细粒度评分，使多步骤桌面代理评测更具可比性。
      尚未覆盖: 证据主要集中在macOS桌面与规则检查；跨操作系统、框架、实现与算力预算的稳定性仍缺乏验证。
    - 路线: 动态界面与视频引导任务基准
      解决的问题: 捕捉操作之间内容变化和视频条件GUI任务，检验观察效率与时间推理能力。
      尚未覆盖: 短视频平台范围未必能推广到所有动态界面；观察控制失效模式与成本-准确性指标缺少更广泛的跨平台验证。
    - 路线: 细粒度指标与不确定性压力测试
      解决的问题: 超越总体成功率，引入子目标完成、成本-准确性和GUI定位的事后不确定性校准。
      尚未覆盖: 单步定位结果未必迁移到多步代理轨迹；跨模型和跨接口的不确定性排名迁移较弱。
    - 路线: 技能与执行框架适配评测
      解决的问题: 在保持骨干模型冻结的情况下，通过多模态技能库或自动优化执行框架改进GUI代理。
      尚未覆盖: 收益集中在特定基准；部署场景泛化、避免对失败模式过拟合以及重复运行稳健性仍需更多证据。
    - 路线: 可扩展任务合成与弱监督训练
      解决的问题: 生成可验证任务或利用未标注截图，降低标注成本并支持计算机使用代理的大规模在线RL。
      尚未覆盖: 最优性能声明依赖特定基准；训练数据质量、可能的基准泄漏和长程稳健性仍未充分验证。
    - 路线: 跨基准迁移与报告规范
      解决的问题: 检验基准结论、优化后的执行框架或不确定性排名能否跨基准、接口和模型层级迁移。
      尚未覆盖: 多数证据仍为单基准或有限迁移；报告规范与工件可用性不一致，可审计性和可复现性不完整。
    共识:
    - GUI与OS自动化通常通过可执行环境交互和确定性或规则化的成功信号进行评测。
    - 仅看总体成功并不足够；研究越来越多地加入子目标、成本-准确性或不确定性信号，以揭示隐藏失败模式。
    - 排名和增益对数据集、接口、模型层级与评测设置敏感，因此往往需要针对目标场景重新评测。
    - 近期工作转向在冻结模型约束下改进代理、合成任务生成或弱监督，以降低标注和训练成本。
    - 动态、真实和多步骤任务会暴露静态截图定位或单步评测遗漏的失败。
    分歧:
    - 部分工作评测静态截图定位，部分工作面向多步骤桌面工作流、动态活屏界面或视频引导任务。
    - 研究对象不同：基准创建与评分、代理端技能或执行框架优化、训练数据合成与RL。
    - 监督假设不同：全标注任务套件、来自未标注截图的弱监督学习、可验证合成任务生成。
    - 观察模型不同：部分假设屏幕内容相对稳定，而动态界面工作将内容变化和观察成本视为核心挑战。
    - 不确定性迁移证据强度不一致：模型内排名迁移可较强，但跨层级和跨接口迁移弱得多。
