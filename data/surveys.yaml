  - 主流方向：可运行的GUI/计算机使用智能体正被构建为端到端系统，重点包括训练框架、可复用技能或记忆层，以及跨网页、桌面和科学软件的基于执行的评测。
  - 研究共性：论文将模型或智能体与编排或检索层结合，在任务基准上验证，并报告成功率或成本时间改进；视觉定位和工作流状态验证反复成为核心瓶颈。
