  - 'Key differences: Evaluation targets split across single-step GUI grounding, long-horizon
    mobile/web tasks, fraud judgment, tutorial-driven planning, and safety. Supervision
    ranges from supervised fine-tuning and human demonstrations to online RL and autonomous
    VLM reward.'
  - 'Trend evolution: Evidence is concentrated in the 2024-2026 frontier, especially
    2026, showing movement from isolated GUI grounding to reliability, safety, memory,
    and data-generation concerns at the edge of current computer-use agents.'
  - 'Open questions: Missing systematic survey evidence, limited cross-domain generalization,
    weak UQ transfer to closed-source or multi-step settings, unresolved autonomous
