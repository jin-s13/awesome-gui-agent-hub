  related_work_outline:
  - 'Mainstream direction: Building and evaluating VLM-based GUI agents across diverse
    tasks (desktop, mobile, web, video) with growing emphasis on scaling via online
    RL, proactive context management, and systematic robustness evaluation.'
  - 'Shared research pattern: All works treat GUI screenshots as the primary input,
    use task completion or success rate as the core metric, and leverage standardized
    benchmarks to compare agent performance, while increasingly acknowledging the
    need for distribution-shift robustness.'
  - 'Key differences: Training paradigms diverge (online RL with verifiable or noisy
    rewards vs. supervised fine-tuning with context management), evaluation targets
    span different safety/uncertainty dimensions, and some works control for external
    shortcuts (URLs) while others do not.'
  - 'Trend evolution: The cluster of papers from 2024–2026 reflects a frontier shift
    from static task success to dynamic concerns—online RL scaling, safety audits,
    uncertainty quantification, and bridging modalities like video and tutorials.'
  - 'Open questions: How to achieve cross-domain safety and uncertainty transfer,
    how to evaluate long-horizon agents without ground-truth verifiers, and how to
    integrate human demonstrations into continual agent improvement.'
  related_work_outline_zh:
  - 主流方向：构建并评估基于视觉语言模型的GUI智能体，覆盖桌面、移动、网页、视频等多类任务，重点转向在线强化学习扩展、主动上下文管理和系统性鲁棒性评测。
  - 研究共性：各工作均以GUI截图为输入，以任务完成度或成功率作为核心指标，并在标准化基准上比较智能体表现，同时逐渐认识到分布偏移鲁棒性的必要性。
  - 关键差异：训练范式存在分歧（可验证或噪声奖励下的在线RL vs. 监督微调加上下文管理），评测目标涉及不同安全/不确定性维度，部分工作刻意屏蔽外部快捷信号（如URL）而另一些则保留。
  - 趋势演进：2024–2026年论文集群显示前沿从静态任务成功转向动态关注——在线RL扩展、安全审计、不确定性量化以及视频、教程等模态桥接。
  - 开放问题：跨领域安全与不确定性迁移、缺乏真值验证时如何评估长程智能体、如何将人类演示融入智能体持续改进。
  literature_review:
    line_of_work_matrix:
    - line: Scaling computer-use agents with verifiable task synthesis and online
        RL
      what_it_solves: Scalable training of GUI agents that can autonomously improve
        on complex desktop tasks without manual reward design, using synthetic task
        generation and noise-corrected evaluator feedback.
      what_remains_open: Task coverage and semantic diversity of synthetic pipelines,
        generalization to tasks without executable verifiers, and robustness of noisy
        reward models across diverse GUIs.
    - line: Benchmarking robustness, uncertainty, and safety of GUI agents
      what_it_solves: Systematic evaluation of VLMs in GUI grounding under adversarial
        conditions such as prompt injection, fraud without reputation cues, and post-hoc
        uncertainty quantification across model families.
      what_remains_open: Cross-model and cross-domain transfer of uncertainty rankings
        is weak, safety hardening is domain-conditioned (browser vs. coding), and
        unified robustness frameworks are missing.
    - line: Proactive context management for long-horizon mobile agents
      what_it_solves: Maintaining task-critical information over extended trajectories
        by treating context management as explicit policy actions, enabling compact
        history without losing important facts.
      what_remains_open: Scalability to multi-app scenarios with larger action spaces,
        and combination with online RL or other training paradigms.
    - line: Bridging video understanding and GUI interaction via keyframe extraction
      what_it_solves: Connecting video-guided agentic tasks with GUI benchmarks by
        extracting task-relevant keyframes, improving both video QA and GUI action
        prediction.
      what_remains_open: How well keyframe-based methods generalize to long, interactive
        GUI sequences beyond single-step grounding, and integration with execution
        feedback.
    - line: Generating multimodal tutorials from human demonstrations
      what_it_solves: Automatically converting raw screen recordings into structured
        image-text tutorials that accelerate human learning and improve GUI agent
        planning.
      what_remains_open: Automated quality assessment of generated tutorials and generalization
        across diverse software domains.
    consensus:
    - Vision-language models are the predominant backbone for GUI agents, with screenshots
      as the primary perceptual input.
    - Standardized benchmarks are essential for reproducible comparisons, but they
      often fail to capture distribution-shift or long-horizon challenges.
    - Safety and robustness are emerging as critical dimensions for agent deployment,
      beyond raw task success rate.
    - Online learning and autonomous evaluation signals are promising for scaling
      agent capabilities without exhaustive manual labeling.
    disagreements:
    - Some benchmarks intentionally suppress external reputation shortcuts (e.g.,
      URLs) to test pure reasoning, while others retain them, leading to different
      conclusions about agent capability.
    - Safety hardening is shown to be domain-conditioned (effective in browser tasks
      but failing in coding tasks), suggesting that current safety metrics do not
      generalize across interfaces.
    - 'Training approaches differ: online RL with verifiable or noisy rewards versus
      supervised fine-tuning with explicit context management, and their relative
      effectiveness on long-horizon tasks remains unclear.'
    - Uncertainty quantification methods show strong within-model transfer but poor
      cross-tier transfer to closed-source models, implying that UQ choices must be
      re-evaluated per deployment setting.
    open_questions:
    - Can a unified evaluation framework cover video-guided, desktop, mobile, and
      adversarial GUI tasks while maintaining cross-domain validity?
    - How can domain-conditioned safety be transformed into a general property without
      sacrificing performance on legitimate tasks?
    - What is the most reliable way to assess long-horizon agent performance when
      ground-truth verifiers are unavailable or expensive?
    - How can human demonstrations and automatically generated tutorials be integrated
      into a continual improvement loop for GUI agents?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 通过可验证任务合成与在线RL扩展计算机使用智能体
      解决的问题: 在没有人工奖励设计的情况下，使用合成任务生成和噪声校正评估器反馈，让GUI智能体在复杂桌面任务上自主改进。
      尚未覆盖: 合成管线的任务覆盖与语义多样性，无法执行验证器时泛化能力，以及噪声奖励模型在多样化GUI上的鲁棒性。
    - 路线: GUI智能体鲁棒性、不确定性与安全基准测试
      解决的问题: 系统评估VLM在GUI定位中的对抗条件表现，包括提示注入、无信誉信息的欺诈检测以及跨模型族的事后不确定性量化。
      尚未覆盖: 跨模型和跨领域不确定性排名迁移弱，安全加固是领域条件的（浏览器 vs. 编码），缺乏统一的鲁棒性框架。
    - 路线: 长时程移动智能体的主动上下文管理
      解决的问题: 在长轨迹中维持任务关键信息，将上下文管理作为显式策略动作，在不丢失重要事实的前提下保持历史紧凑。
      尚未覆盖: 在多应用场景下扩展到更大动作空间，以及与在线RL或其他训练范式的结合。
    - 路线: 通过关键帧提取桥接视频理解与GUI交互
      解决的问题: 通过提取任务相关关键帧，连接视频引导的智能体任务与GUI基准，提升视频问答和GUI动作预测。
      尚未覆盖: 关键帧方法在超出单步定位的长交互GUI序列中的泛化效果，以及与执行反馈的整合。
    - 路线: 从人类演示生成多模态教程
      解决的问题: 将原始屏幕录制自动转化为结构化图文教程，加速人类学习并提升GUI智能体规划。
      尚未覆盖: 教程的自动质量评估，以及跨不同软件领域的泛化。
    共识:
    - 视觉语言模型是GUI智能体的主要骨干，截图是核心感知输入。
    - 标准化基准对于可复现比较至关重要，但往往无法捕捉分布偏移或长时程挑战。
    - 安全与鲁棒性正在成为智能体部署的关键维度，超越了单纯的原始任务成功率。
    - 在线学习和自主评估信号在无需详尽人工标注的情况下，对扩展智能体能力具有前景。
    分歧:
    - 部分基准有意屏蔽外部信誉捷径（如URL）以测试纯推理，而另一些则保留，导致对智能体能力的结论不同。
    - 安全加固被证明是领域条件的（在浏览器任务中有效，在编码任务中失败），表明当前安全指标无法跨界面泛化。
    - 训练方法存在分歧：使用可验证或噪声奖励的在线RL 与 带有显式上下文管理的监督微调，它们在长时程任务上的相对有效性仍不明确。
    - 不确定性量化方法在模型内迁移强，但跨层级迁移到闭源模型时效果差，意味着UQ选择需针对每个部署环境重新评估。
    开放问题:
    - 能否设计一个统一的评估框架，同时覆盖视频引导、桌面、移动和对抗性GUI任务，并保持跨领域有效性？
    - 如何将领域条件的安全加固转化为通用属性，而不牺牲在合法任务上的性能？
    - 当无法获得真值验证器时，评估长时程智能体性能的最可靠方法是什么？
    - 如何将人类演示和自动生成的教程融入GUI智能体的持续改进循环中？
