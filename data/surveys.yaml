  related_work_outline_zh:
  - 主流方向：当前可见的高排名工作主要通过任务抽象和基准测试形式化 GUI 代理能力，而非独立的纯理论论文；重点覆盖桌面、动态短视频、拖拽操作和不确定性等评估协议。
  - 研究共性：这些工作都定义任务套件或协议，比较前沿模型，并报告观察控制、多模态定位、长时记忆或校准方面的能力缺口。
  - 关键差异：评测目标、界面/部署场景、监督信号和表示方式不同：有单步定位与长时任务、桌面/移动/动态媒体、可验证合成/弱监督截图/标注轨迹、视觉技能与结构化上下文等差异。
  - 趋势演进：2024–2026 前沿从静态点击任务转向动态界面、拖拽操作、长时上下文管理和可靠性感知评测；形式化理论主要内嵌在任务定义中。
  - 开放问题：这些形式化能否跨界面和跨模型类别迁移；不确定性估计和合成训练数据能否预测真实部署失败；主动上下文/技能管理能否泛化到分布外场景。
  literature_review:
    line_of_work_matrix:
    - line: Task and benchmark formalization
      what_it_solves: Defines measurable GUI-agent tasks, metrics, and interaction
        protocols across desktop, dynamic media, drag actions, and grounding under
        uncertainty.
      what_remains_open: Evaluations are often per-platform or single-step; multi-step
        trajectory evaluation, cross-interface generalization, and deployment-level
        validation remain under-evidenced.
    - line: Data and reinforcement-learning scaling
      what_it_solves: Scales agent training through verifiable task synthesis or weak
        supervision from unannotated screenshots, reducing annotation cost and improving
        sample efficiency.
      what_remains_open: Verification outside simulated environments, weak-supervision
        quality, and transfer from training tasks to real deployments are not directly
        established.
    - line: Skill and context management
      what_it_solves: Organizes multimodal or structured procedural knowledge so agents
        can retrieve skills and compress long-horizon context instead of passively
        accumulating raw history.
      what_remains_open: Evaluated on narrow apps or benchmarks; out-of-distribution
        generalization and interaction with other agent components remain unresolved.
    - line: Interaction-mode abstraction
      what_it_solves: Expands agent formalization from static click-only tasks to
        dynamic living screens and drag-based manipulation.
      what_remains_open: Evidence is limited to short-video or drag domains; human-level
        cost-accuracy and observation control have not been achieved.
    - line: Reliability and uncertainty framing
      what_it_solves: Quantifies confidence or spatial calibration for GUI grounding
        in order to support safer agent decisions.
      what_remains_open: Current evidence is mainly single-step; multi-step trajectories,
        closed-source models, and distribution or interface mismatch degrade calibration.
    consensus:
    - GUI agents are treated as multimodal systems that must ground perception in
      screens or interfaces and emit executable actions, not merely answer questions.
    - Evaluation is moving beyond raw task success to include fine-grained subgoals,
      cost-accuracy or observation efficiency, long-horizon context, and uncertainty.
    - Training scalability is a shared concern; synthetic verifiable tasks and weakly
      labeled screenshots are used to reduce dependence on expensive annotation.
    - Current evidence shows no evaluated frontier agent saturates reliability across
      dynamic, drag-based, long-horizon, or uncertain grounding settings.
    disagreements:
    - 'Evaluation granularity differs: some work focuses on single-step grounding
      or click/drag correctness, while other work assesses long-horizon task completion
      and information cost.'
    - 'Supervision signal differs: one route uses verifiable reward synthesis, another
      uses unannotated screenshots with weak supervision, and another uses trajectories
      annotated with context-management actions.'
    - 'Representation differs: visual skill artifacts, structured context fields,
      and policy-generated context-management actions make different assumptions about
      what the agent must store or retrieve.'
    - 'Deployment and interface assumptions differ: desktop GUI plus CLI, mobile long-horizon,
      dynamic short-video, and drag-based interaction create distinct evaluation conditions.'
    open_questions:
    - Can task formalizations from a single platform or interaction mode transfer
      to other interfaces and model classes without per-benchmark re-evaluation?
    - Which uncertainty quantification and calibration methods remain valid for multi-step
      trajectories, closed-source models, and distribution shifts?
    - Do verifiable task synthesis and weak screenshot supervision predict real deployment
      failures, or only benchmark performance?
    - Does proactive skill or context management generalize beyond the apps and distributions
      represented in current benchmarks?
    - Where is standalone formal theory for GUI agents? Top visible evidence embeds
      theory mostly as task formalization and reliability benchmarking, leaving a
      verification gap.
