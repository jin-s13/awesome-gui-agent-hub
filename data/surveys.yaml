  literature_review:
    line_of_work_matrix:
    - line: Real-world desktop OS benchmark design
      what_it_solves: Creates broad multitask desktop evaluation across many applications,
        mixing GUI and CLI interaction, with rule-based multi-checkpoint scoring to
        expose sub-goal completion differences.
      what_remains_open: Whether a single macOS-focused task distribution transfers
        to other operating systems and application sets, and whether sub-goal scores
        align with downstream user-valued task completion.
    - line: Dynamic living-interface benchmark design
      what_it_solves: Evaluates agents on interfaces whose content changes between
        actions, using a browser-based short-video platform simulation and metrics
        that combine accuracy with information efficiency.
      what_remains_open: Coverage is limited to short-video-style dynamic interfaces;
        observation-control capability is identified as missing but not yet broadly
        defined or benchmarked.
    - line: Video-guided GUI task benchmark design
      what_it_solves: Bridges video question answering and GUI interaction by introducing
        video-guided agentic tasks and task-driven keyframe extraction that improves
        both video QA and GUI task performance.
      what_remains_open: Whether the keyframe extraction and benchmark tasks generalize
        beyond the studied video domains, and how video-guided evaluation maps to
        longer-horizon agent workflows.
    - line: Uncertainty and risk evaluation for GUI grounding
      what_it_solves: Benchmarks post-hoc uncertainty quantification across open-weight
        and closed-source VLM grounding methods, measuring ranking transferability
        and conformal click-region safety.
      what_remains_open: Evaluation is restricted to single-step grounding, cross-model
        and cross-interface UQ transfer is weak, and training-based or hybrid uncertainty
        methods are not covered.
    - line: Verifiable task synthesis and harness evolution around existing benchmarks
      what_it_solves: Uses existing OS/Windows benchmark suites to evaluate methods
        that generate verifiable RL tasks or optimize execution harnesses while keeping
        backbone models frozen.
      what_remains_open: Whether gains from synthesized tasks or optimized harnesses
        remain stable across implementation details, compute budgets, and unseen benchmark
        distributions.
    consensus:
    - Evaluation is shifting from aggregate success to diagnostic signals such as
      sub-goal completion, cost-accuracy, uncertainty ranking transfer, and failure-mode
      observation control.
    - Benchmarks increasingly use deterministic or rule-based scoring and compare
      multiple frontier models, frameworks, or baselines to separate model capability
      from framework, skill, or harness effects.
    - Settings are becoming more realistic and multimodal, including real desktop
      applications, mixed GUI/CLI workflows, dynamic interfaces, and video-guided
      tasks.
    - Methods evaluated on these benchmarks show improvements can come from skill
      artifacts, harness evolution, verifiable task synthesis, weak supervision from
      unannotated screenshots, or uncertainty calibration, not only from stronger
      base models.
    disagreements:
    - 'Evaluation target differs: broad real-desktop task completion versus dynamic
      short-video cost-accuracy versus video-guided GUI task success versus single-step
      grounding uncertainty.'
    - 'Metric philosophy differs: raw success or Pass@1 versus fine-grained multi-checkpoint
      sub-goal scoring versus combined accuracy-and-efficiency versus UQ ranking transfer
      and conformal coverage.'
    - 'Interaction and deployment setting differs: native desktop with GUI and CLI,
      browser-based living screens, video-guided control, and single-step grounding
      inputs.'
    - 'Improvement path differs: some works create new benchmarks or stress tests,
      while others optimize an execution harness, synthesize verifiable training tasks,
      learn from unlabeled screenshots, or add multimodal skill artifacts around a
      frozen model.'
    open_questions:
    - How well do benchmark rankings and diagnostic metrics transfer across operating
      systems, application versions, interface dynamics, and closed-source model regimes
      without target-specific re-evaluation?
    - Do sub-goal completion and cost-accuracy metrics align with the downstream user
      outcomes and safety properties that actually matter, given models with similar
      success rates can differ substantially?
    - Can observation control be defined, measured, and improved as a first-class
      capability, since dynamic-interface evaluations identify over-observation and
      under-observation as dominant failure modes?
    - Are verifiable task synthesis and harness optimization gains stable across implementations,
      compute budgets, and unseen benchmark distributions when transfer evidence is
      limited?
    - Which benchmark conclusions are not yet independently verifiable because limitation
      sections or artifact/reproducibility evidence are missing or thin?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 真实桌面操作系统基准设计
      解决的问题: 构建跨多个应用的桌面任务评估，混合GUI和CLI交互，以规则化多检查点评分揭示子目标完成差异。
      尚未覆盖: 单一macOS任务分布是否迁移到其他操作系统和应用集合；子目标分数是否对齐用户重视的任务完成结果。
    - 路线: 动态生活屏幕界面基准设计
      解决的问题: 在动作之间内容变化的界面上评估智能体，使用浏览器模拟短视频平台，并用复合指标同时衡量准确性与信息效率。
      尚未覆盖: 覆盖范围限于短视频类动态界面；观察控制能力被识别为缺失但尚未被广泛定义或基准化。
    - 路线: 视频引导的GUI任务基准设计
      解决的问题: 通过视频引导交互任务和任务驱动关键帧提取，桥接视频问答与GUI操作评估，并同时改善视频问答和GUI任务性能。
      尚未覆盖: 关键帧提取与任务是否泛化到研究视频域之外；视频引导评估如何映射到更长程的智能体工作流。
    - 路线: GUI定位的不确定性与风险评估
