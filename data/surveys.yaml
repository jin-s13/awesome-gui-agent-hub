  related_work_outline_zh:
  - 主流方向：当前GUI智能体研究以改进MLLM/VLM计算机使用智能体为主，通过自改进、可验证任务合成、强化学习或执行框架优化，并强化可靠性、安全、不确定性与长时域评测；证据集中在2024-2026前沿，而非传统综述式总结。
  - 研究共性：多项工作将GUI智能体视为基于MLLM/VLM的策略，以界面截图和指令为输入，输出动作，并以交互基准上的任务成功率评测；多篇使用可验证任务、重复运行、掩码线索、不确定性量化或自主评估器作为证据。
  - 关键差异：优化信号存在差异，包括冻结执行框架编辑、在线RL、监督式上下文管理、有噪声VLM奖励；评测范围涵盖单步基础、长时域移动/桌面/网页、视频引导、欺诈、安全及不确定性校准。
  - 趋势演进：从2024到2026，证据显示从静态GUI任务评测转向可验证任务合成、自改进闭环、冻结模型适配，以及不确定性、安全性和可重复性审计；时间窗口较窄，趋势仍处于当前前沿。
  - 开放问题：跨基准与跨域迁移、不同设置下结果兼容性、分布或界面偏移下的校准、浏览器之外的安全、记忆扩展，以及代码、数据、基线或局限性缺失造成的验证缺口仍需解决。
  literature_review:
    line_of_work_matrix:
    - line: Taxonomy and roadmap synthesis
      what_it_solves: Maps fragmented GUI-agent research into directions such as evaluation,
        learning, safety, memory, and grounding, and provides milestones or gap identification.
      what_remains_open: Whether the synthesis is systematic over all 71 papers or
        reflects selective top-ranked evidence is unclear; no meta-analytic coverage
        or priority ranking is shown in the bounded packet.
    - line: Comparative evaluation synthesis
      what_it_solves: Compares how benchmarks and protocols shape conclusions, including
        uncertainty ranking transfer, URL-masking ablation, browser/coding safety
        cross-reference, and frozen-harness transfer.
      what_remains_open: Result compatibility across heterogeneous settings is unresolved;
        within-model transfer can be strong while cross-model and cross-interface
        transfer weakens, and safety hardening appears domain-conditioned.
    - line: Open problem and gap mapping
      what_it_solves: Converts broad coverage into concrete next research questions
        around verifiable rewards, context management, uncertainty, fraud detection,
        and prompt-injection or agentic safety.
      what_remains_open: Prioritization of gaps for research progress remains unaddressed;
        several top records lack visible code, dataset, baseline, or limitation details,
        creating verification gaps rather than confirmed absence.
    consensus:
    - GUI agents are predominantly built as MLLM/VLM policies that consume interface
      screenshots and instructions and produce actions evaluated by task success on
      interactive benchmarks.
    - Reliability and evaluation quality are treated as first-order problems; several
      works use repeated runs, verifiable tasks, uncertainty quantification, or masked
      cues to reduce spurious success.
    - Frozen-model adaptation and self-improvement are active levers; agents are improved
      by optimizing the surrounding harness, context, reward, or task distribution
      without changing some backbone models.
    - Cross-domain transfer is treated as important but not guaranteed; multiple works
      test generalization to out-of-distribution tasks, interfaces, or domains.
    disagreements:
    - Some works optimize the agent's environment or harness while keeping model weights
      frozen, whereas others fine-tune policies with online RL or supervised context
      actions.
    - Evaluation targets diverge across single-step grounding, long-horizon mobile/web/desktop
      task success, safety attack success, fraud detection, video-guided tasks, and
      uncertainty calibration.
    - 'Supervision and reward assumptions differ: verifiable Docker tasks, autonomous
      VLM terminal feedback with noise correction, manual SFT annotations, and hand-crafted
      attack templates coexist.'
    - Some findings claim strong cross-benchmark transfer for optimized harnesses,
      while uncertainty and safety findings show limited cross-model or cross-domain
      transfer, requiring target-specific re-evaluation.
    open_questions:
    - Do improvements on OSWorld or ScienceBoard transfer to video-guided, mobile,
      fraud, and safety settings without target-specific adaptation?
    - How should uncertainty quantification be selected or recalibrated when model
      class or interface shifts?
    - What systematic coverage and prioritization criteria would turn survey-style
      synthesis into verifiable gap rankings across 71 heterogeneous papers?
    - Which failure modes are best addressed by harness edits, context management,
      policy RL, or task synthesis, and what combinations are complementary?
