  literature_review:
    line_of_work_matrix:
    - line: Taxonomy and roadmap synthesis
      what_it_solves: Organizes fragmented GUI-agent advances in training, harness
        adaptation, context management, safety, and evaluation into research directions
        and gaps.
      what_remains_open: The bounded evidence contains recent primary method and benchmark
        papers rather than systematic survey protocols or inclusion criteria, so coverage
        and selection bias cannot be verified.
    - line: Comparative evaluation synthesis
      what_it_solves: Summarizes how evaluation choices such as OSWorld, ScienceBoard,
        MobileWorld, MemGUI-Bench, browser fraud, and browser safety tasks shape cross-paper
        conclusions.
      what_remains_open: Compared results are often not compatible across supervision,
        interface, metric, and deployment settings, and several top papers omit limitation
        or reproducibility details.
    - line: Open problem and gap mapping
      what_it_solves: Translates broad literature coverage into concrete next-step
        questions around long-horizon context, noisy reward, uncertainty transfer,
        and domain-conditioned safety.
      what_remains_open: Prioritization of which gaps matter most for progress remains
        open, and single-step or single-domain findings may not extrapolate to multi-step
        deployment.
    consensus:
    - GUI and computer-use agents commonly take screenshots or interface state as
      observations and use vision-language models as backbones to choose actions in
      interactive environments.
    - Task success or executable verification is the main evaluation signal, often
      measured on OSWorld, ScienceBoard, MobileWorld, MemGUI-Bench, or custom browser
      and fraud tasks.
    - Recent work increasingly targets reliability through context management, harness
      optimization, reward correction, uncertainty estimation, and safety or red-team
      audits.
    - New methods are often accompanied by new datasets or benchmarks and report state-of-the-art
      gains, but limitations and code or data release evidence are unevenly documented.
    disagreements:
    - 'Improvement strategy differs: some papers fine-tune policies with reinforcement
      learning or supervised fine-tuning, while others freeze the backbone and modify
      harness or context, or change input representation such as keyframe selection.'
    - 'Supervision differs: verifiable task completion, noisy VLM evaluator rewards,
      trajectory annotations, or failure evidence from repeated runs and before-and-after
      screenshots serve as learning or evaluation signals.'
    - Evaluation target differs across desktop OSWorld or ScienceBoard, mobile MobileWorld
      or MemGUI-Bench, video-guided GUI, browser fraud detection, and browser prompt-injection
      safety, so findings are not automatically transferable.
    - 'Evidence completeness differs: some papers report limitations and reproducibility
      artifacts, while others omit limitations or provide weak code and data signals,
      making comparison less certain.'
    open_questions:
    - Can single-step GUI grounding uncertainty-quantification rankings transfer to
      multi-step trajectories, closed-source interfaces, or shifted deployment conditions?
    - How should noisy or self-generated reward signals be calibrated so reinforcement
      learning gains are not inflated by evaluator or reward bias?
    - Does browser-task safety hardening generalize to coding and other domains, and
      how should red-teaming reproduce optimized attack strings rather than only hand-crafted
      templates?
    - Which proactive context or memory strategy transfers across desktop, mobile,
      and web without task-specific context fields and long-horizon trajectory engineering?
    - Where systematic survey inclusion criteria, limitations, code, or dataset release
      are missing, how should the field qualify state-of-the-art comparisons and reproducibility
      claims?
