  related_work_outline_zh:
  - 主流方向：构建面向桌面、网络、移动与动态应用的GUI智能体评测，以及通过技能/记忆/程序复用提升真实任务效率。
  - 研究共性：以多步交互、视觉定位与状态验证为核心，用细粒度指标评估能力，并以视觉语言模型作为主要基线。
  - 关键差异：评测对象从静态桌面到动态短视频，交互从点击/输入到拖拽/GUI+CLI，方法从评测集到模型架构与执行加速。
  - 趋势演进：2024-2026年当前前沿中，研究从静态点击基准扩展到动态、多模态、应用特定基准，并叠加复用层以降本提速。
  - 开放问题：跨应用与界面变化的迁移、动态观察控制、成本-准确性权衡及窄基准泛化仍缺少证据。
  literature_review:
    line_of_work_matrix:
    - line: Application-grounded GUI benchmarks and task suites
      what_it_solves: Measure real-world computer-use ability over multi-step application
        tasks, including desktop, dynamic short-video, drag, and video-guided interactions,
        with fine-grained success/cost metrics.
      what_remains_open: Coverage remains limited to selected platforms and interaction
        types; dynamic-interface agents still fall below human cost-accuracy, especially
        in observation control.
    - line: Reusable multimodal skills and execution memory
      what_it_solves: Convert validated agent trajectories into hierarchical visual/text
        skills or replayable programs/memories to cut token cost and execution time
        while preserving task success on repeated computer-use workflows.
      what_remains_open: Replay and skill lookup rely on deterministic screen/precondition
        matching; changed UIs, ambiguous steps, and cross-application generalization
        remain weakly evidenced.
    - line: GUI-agent model architectures and task-specific adaptation
      what_it_solves: Improve visual grounding and action generation across mobile,
        desktop, and web platforms via diffusion-based vision-language modeling or
        fine-tuning on specialized interaction data such as drag tasks.
      what_remains_open: Evaluations concentrate on selected benchmarks; real-world
        adoption, cross-task transfer, and robustness under distribution shift are
        not established.
    - line: Multimodal observation and video/keyframe grounding
      what_it_solves: Extract task-relevant visual evidence from dynamic screens or
        video to support GUI-agent decision-making and video-guided interactive tasks.
      what_remains_open: Current agents over- or under-observe; keyframe or observation
        strategies show gains on specific benchmarks but lack evidence across broader
        GUI applications.
    consensus:
    - End-to-end GUI-agent performance is evaluated on application-level, multi-step
      tasks rather than isolated UI element recognition.
    - Visual grounding and state verification are treated as central bottlenecks,
      addressed through visual skill artifacts, screen checks, or keyframe extraction.
    - Reusing validated workflows as skills, programs, or memories is an emerging
      way to reduce repeated language-model calls and execution cost.
    - Fine-grained metrics beyond Pass@1 are necessary because similar task success
      can hide different sub-goal, cost, or information-efficiency behavior.
    disagreements:
    - 'Evaluation environments differ in dynamics: static or quasi-static desktop/mobile
      tasks versus short-video interfaces whose content changes between actions.'
    - 'Contributions target different layers: some create benchmarks or datasets,
      some improve model architecture or fine-tune a policy, and others add post-hoc
      replay/skill layers.'
    - 'Success criteria diverge: one set reports Pass@1 or sub-goal completion; another
      uses cost-accuracy/information efficiency; another reports token and time reductions.'
    - Interaction scope varies from click/type to drag manipulation, GUI+CLI control,
      and video-guided task completion.
    open_questions:
    - How well do compiled skills, programs, or memories transfer across application
      updates, layout changes, and unseen multi-app workflows without brittle coordinate
      or screen assumptions?
    - What observation-control mechanism lets agents balance enough visual evidence
      against token/time cost in continuously changing interfaces?
    - Which evaluation dimensions beyond Pass@1—sub-goal completion, cost-accuracy,
      runtime efficiency—best predict real-world computer-use reliability and user
      value?
    - Do specialized interaction benchmarks such as drag or video-guided tasks improve
      general GUI-agent ability, or only narrow distribution performance?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 面向应用的GUI基准与任务套件
      解决的问题: 衡量多步骤真实计算机操作能力，覆盖桌面、动态短视频、拖拽和视频引导交互，并提供细粒度成功率与成本指标。
      尚未覆盖: 覆盖仍限于所选平台与交互类型；动态界面智能体在成本-准确性上仍低于人类，尤其观察控制不足。
    - 路线: 可复用的多模态技能与执行记忆
      解决的问题: 将验证过的智能体轨迹转化为分层视觉/文本技能或可重放程序/记忆，降低token成本与执行时间，保持重复任务成功率。
      尚未覆盖: 重放与技能检索依赖确定性屏幕/前置条件匹配；界面变化、模糊步骤和跨应用泛化证据仍不足。
