  literature_review:
    line_of_work_matrix:
    - line: Harness-native agent training and orchestration frameworks
      what_it_solves: End-to-end reinforcement learning or online policy optimization
        for agents embedded in complex inference harnesses or live browser environments,
        including scalable rollout isolation and trajectory collection.
      what_remains_open: Error recovery remains weak after training; harness design
        appears to affect trainability; visible reproducibility artifacts and independent
        deployment evidence are limited.
    - line: Weakly supervised and diffusion-based GUI policy models
      what_it_solves: Train visual grounding and navigation policies with limited
        annotation or alternative decoding, targeting mobile, desktop, and web control.
      what_remains_open: Cross-platform generalization, breadth of comparison against
        larger or proprietary systems, and unreported limitations remain unclear.
    - line: Reusable skill and memory layers for computer-use agents
      what_it_solves: Convert validated GUI trajectories or documented workflows into
        multimodal or callable artifacts to reduce token cost, execution time, and
        repeated planning.
      what_remains_open: Deterministic replay applies only when preconditions match;
        ambiguous, incompatible, dynamic, or asynchronous UI steps are rejected or
        not fully evaluated.
    - line: Step-level diagnostics and safety benchmarks for GUI agents
      what_it_solves: Isolate transition understanding and adversarial safety in browser
        or coding settings beyond end-task success, including temporal ordering, action
        inference, and prompt injection.
      what_remains_open: Offline and OS/action-vocabulary constraints limit ecological
        validity; optimized attack reproducibility and broader attack surfaces are
        not directly measured.
    consensus:
    - The 2026 frontier treats GUI agents as runnable systems rather than static models,
      with closed-loop rollouts, task success, and cost or latency treated as first-class
      evaluation signals.
    - There is a shared effort to reduce reliance on expensive annotations and repeated
      planning by learning from unannotated screenshots, live interaction, or validated
      trajectories.
    - Evaluation is expanding from final task completion to include step-level transitions,
      failure diagnostics, and adversarial safety behavior.
    - These systems separate policy learning from complex harness or browser infrastructure
      through proxies, orchestrators, or containerized rollouts.
    disagreements:
    - 'Learning signal differs: weak supervision from unannotated screenshots plus
      small calibration data, online multi-turn RL on live environments, supervised
      fine-tuning with diffusion decoding, or retrieval/replay without policy training.'
    - 'Artifact and representation choices differ: visual-augmented skill libraries
      retain interface images, callable memories encode preconditions and payloads,
      while model-centric approaches encode behavior in weights.'
    - 'Evaluation depth differs: some target end-to-end benchmark success, others
      target step-level temporal ordering and action recognition, and others target
      adversarial task completion under prompt injection.'
    - 'Deployment setting differs: offline diagnostic instances cannot capture asynchronous
      live dynamics, while live-browser and containerized rollouts introduce different
      reproducibility and safety boundaries.'
    open_questions:
    - Can post-training RL improve error recovery, and how much does harness design
      limit trainability?
    - How do skill and memory systems generalize beyond deterministic replay to ambiguous,
      asynchronous, or cross-OS interactions?
    - Does safety hardening transfer across application domains, or is it inherently
      conditioned on task surface and optimization-based attacks?
    - What independent reproduction evidence exists given that several visible papers
      lack code, dataset, or artifact links beyond textual claims?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 面向推理框架的智能体训练与编排系统
      解决的问题: 对嵌入复杂推理框架或实时浏览器环境的智能体进行端到端强化学习或在线策略优化，并提供可扩展回滚隔离与轨迹收集。
      尚未覆盖: 训练后错误恢复仍弱；框架设计影响可训练性；可见复现工件与独立部署证据有限。
    - 路线: 弱监督与扩散式GUI策略模型
      解决的问题: 以有限标注或替代解码方式训练视觉定位与导航策略，覆盖移动、桌面和网页控制。
      尚未覆盖: 跨平台泛化、与更大或专有系统的对比广度，以及未报告的限制仍不明确。
    - 路线: 计算机使用智能体的可复用技能与记忆层
      解决的问题: 将已验证GUI轨迹或文档化流程转化为多模态或可调用工件，以降低token成本、执行时间和重复规划。
      尚未覆盖: 确定性回放仅在前提条件匹配时有效；模糊、不兼容、动态或异步界面步骤尚未充分评估。
    - 路线: GUI智能体的步骤级诊断与安全基准
      解决的问题: 在浏览器或编码设定中隔离状态转换理解与对抗安全，覆盖时序排序、动作推断和提示注入。
      尚未覆盖: 离线、特定操作系统和预设动作词汇限制生态效度；优化攻击复现及更广攻击面未被直接测量。
    共识:
    - 2026年前沿将GUI智能体视为可运行系统，而不是静态模型，闭环执行、任务成功率与成本/延迟成为主要评估信号。
    - 普遍尝试通过未标注截图、实时交互或已验证轨迹来减少昂贵标注与重复规划。
    - 评估从最终任务完成扩展到步骤级状态转换、失败诊断和对抗安全行为。
    - 系统借助代理、编排器或容器化执行将策略学习与复杂的框架/浏览器基础设施解耦。
    分歧:
    - 学习信号不同：未标注截图的弱监督加小量校准、真实环境在线多轮强化学习、扩散解码的监督微调，或无策略训练的检索/回放。
    - 工件与表示不同：视觉增强技能库保留界面图像，可调用记忆编码前提条件和动作载荷，模型中心方法把行为写入权重。
    - 评测深度不同：有的关注端到端基准成功率，有的关注步骤级时序排序与动作识别，有的关注提示注入下的对抗任务完成。
    - 部署设定不同：离线诊断无法捕捉异步实时动态，而实时浏览器和容器化执行带来不同的复现与安全边界。
    开放问题:
    - 训练后强化学习能否稳定提升错误恢复，框架设计对可训练性的限制有多大？
    - 技能与记忆系统能否在模糊、异步或跨操作系统交互中超越确定性回放边界？
    - 安全加固能否跨应用领域迁移，还是本质上取决于任务表面和优化攻击形式？
    - 在多篇论文缺乏可见代码、数据集或工件链接的情况下，独立复现能提供什么证据？
