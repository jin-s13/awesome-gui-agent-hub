      解决的问题: 对开源和闭源视觉语言模型在单步GUI定位上进行事后置信度校准和空间动作安全测量。
      尚未覆盖: 证据仅限于单步定位；跨模型和跨界面排名迁移较弱，共形覆盖在分布或界面不匹配时下降。
