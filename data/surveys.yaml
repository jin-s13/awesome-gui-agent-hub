    - 交互表面不同：桌面、移动端、浏览器和视频引导任务在动作空间、上下文窗口与安全假设上不同。
    - 部署设置不同：冻结模型上的框架优化不更新骨干，而在线强化学习更新策略权重；不确定性基准只覆盖单步定位而非多步轨迹。
    开放问题:
    - 合成桌面监督能否在移动端、浏览器和欺诈检测等场景中无需目标适配即可迁移？
