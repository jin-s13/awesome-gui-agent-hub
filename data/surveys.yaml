      尚未覆盖: 尚未给出基于证据的缺口优先级；现有证据大多局限于单步或单一基准。
    共识:
    - 受控基准与环境被视为揭示单步指标遗漏的长程或安全失败的必要手段。
    - 冻结或微调的视觉语言代理都受益于超出原始截图的任务相关上下文或监督。
    - 安全、不确定性和长程可靠性被作为一级能力来评测，而不仅是任务得分。
    - 多数发现具有基准特异性，跨界面或跨模型类别迁移需要重新评估。
    分歧:
