  - 主流方向：在桌面、网页、移动端及动态视频平台上构建和评测真实计算机使用任务的GUI智能体，通过密集基准对任务成功率和中间步骤评分。
  - 研究共性：论文引入任务特定资源或机制，如基准、技能库、关键帧提取、重放程序、环境生成或扩散智能体，并比较前沿视觉语言智能体，发现超出总体精度的能力缺口。
