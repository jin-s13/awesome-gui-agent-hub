  related_work_outline:
  - 'Mainstream direction: Current work centers on building executable GUI/desktop/video
    benchmarks and paired agent improvements, moving beyond static screenshots to
    real macOS tasks, dynamic short-video interfaces, drag interactions, and video-guided
    actions.'
  - 'Shared research pattern: Many works combine a new task suite or dataset with
    a capability probe, using fine-grained or cost-aware scoring to reveal that aggregate
    success masks failures in sub-goal completion, observation control, calibration,
    or interaction coverage.'
  - 'Key differences: They differ in deployment surface (desktop OS, browser/video
    platform, GUI grounding, drag interactions), supervision and evaluation target
    (rule-based pass/fail, uncertainty calibration, cost-accuracy), and whether the
    contribution is a benchmark, an agent training method, or both.'
  - 'Trend evolution: Within the 2024–2026 frontier, evidence is concentrated in 2026;
    direction is moving from general static GUI benchmarks toward dynamic, multimodal,
    interaction-rich environments and toward using benchmarks to drive RL, weak supervision,
    and skill-library agent improvements.'
  - 'Open questions: Coverage of rare/dynamic interactions and long-horizon multi-app
    workflows remains unproven; metric-to-decision alignment, cross-interface generalization,
    and stability of gains across frameworks and models are open verification gaps.'
  related_work_outline_zh:
  - 主流方向：当前工作集中于构建可执行的GUI/桌面/视频基准，并配套改进代理能力，覆盖真实macOS任务、动态短视频界面、拖拽交互和视频引导操作。
  - 研究共性：多数工作将新任务集或数据集与能力探测结合，通过细粒度或成本感知评分揭示总体成功率掩盖的子目标完成、观察控制、校准或交互覆盖问题。
  - 关键差异：差异体现在部署面（桌面OS、浏览器/视频平台、GUI定位、拖拽）、监督与评测目标（规则通过/失败、不确定性校准、成本-准确率）以及成果类型（基准、训练方法或二者混合）。
  - 趋势演进：在2024–2026前沿窗口内，证据集中在2026年；方向正从静态GUI基准转向动态、多模态、交互密集环境，并更多用基准驱动强化学习、弱监督和技能库改进。
  - 开放问题：稀有/动态交互与长程多应用工作流覆盖仍待验证；指标与决策对齐、跨界面泛化、以及不同框架与模型间的效果稳定性仍属证据缺口。
  literature_review:
    line_of_work_matrix:
    - line: Executable GUI/desktop/video task and dataset construction
      what_it_solves: Creates shared environments and tasks for comparing computer-use
        agents across applications, interaction types, and dynamic content.
      what_remains_open: Coverage of rare, multi-application, long-horizon, and dynamic-interface
        settings remains limited; most evidence is single-platform and does not verify
        cross-platform generalization.
    - line: Skill, data, and RL-driven agent improvement
      what_it_solves: Reduces annotation burden and raises agent success by adding
        multimodal skill libraries, weak supervision from unannotated screenshots,
        and verifiable synthesized tasks for online RL.
      what_remains_open: Whether gains transfer across benchmarks and model families
        is unclear; low reproducibility signals are evidence gaps rather than proof
        that artifacts are absent.
    - line: Fine-grained evaluation, uncertainty, and interaction metrics
      what_it_solves: Probes sub-goal completion, cost-accuracy, drag interaction
        coverage, and uncertainty calibration beyond aggregate pass rates.
      what_remains_open: Proxy metrics are not yet tied to user decisions, uncertainty
        ranking transfer across model interfaces is weak, and multi-step trajectory
        evaluation remains largely unaddressed.
    - line: Comparable baselines and reporting practice
      what_it_solves: Provides multi-framework, multi-model baseline comparisons and
        benchmark suites intended to make results auditable.
      what_remains_open: Implementation and compute stability plus artifact availability
        are inconsistently evidenced; missing code or dataset links should be treated
        as verification gaps.
    consensus:
    - Executable benchmarks with deterministic or model-based scoring are treated
      as necessary for comparing computer-use agents, but aggregate pass rates alone
      are insufficient.
    - Multimodal visual context and fine-grained sub-goal signals improve agent performance
      and reveal failures hidden by overall success.
    - Dynamic or interaction-rich interfaces such as video feeds, drag operations,
      and multi-application desktop use are underrepresented in earlier static benchmark
      assumptions and require new task designs.
    - Benchmarks are increasingly used not only for evaluation but also as training
      signal through reinforcement learning or weak supervision.
    disagreements:
    - 'Deployment and evaluation surface differs: full desktop OS workflows, browser
      short-video dynamics, single-step GUI grounding, or drag interactions are emphasized
      separately.'
    - 'Evaluation target differs: rule-based pass/fail, cost-accuracy, uncertainty
      calibration, sub-goal completion, or training efficiency is prioritized depending
      on the work.'
    - 'Contribution mode differs: some works provide benchmark datasets or environments,
      others provide agent training methods, and a few combine both.'
    - 'Supervision assumptions differ: verifiable reward, small high-quality annotations,
      unannotated screenshots, or authored multimodal skill artifacts are treated
      as key conditions.'
    open_questions:
    - Can benchmark task distributions cover rare dynamic interactions, long-horizon
      multi-application workflows, and cross-platform transfer without task-specific
      overfitting?
    - Which fine-grained or cost-aware metrics predict downstream user value, and
      do these metrics remain stable across frameworks and model families?
    - Given weak cross-interface uncertainty ranking transfer, can uncertainty calibration
      and skill/RL gains transfer across model interfaces and benchmarks?
    - How much of reported progress depends on hidden artifacts, compute budgets,
      or skill libraries rather than general agent capability?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 可执行GUI/桌面/视频任务与数据集构建
      解决的问题: 为跨应用、交互类型和动态内容的计算机使用代理提供共享环境和任务可比性。
      尚未覆盖: 稀有、多应用、长程和动态界面设置覆盖仍有限；多数证据限于单一平台，未验证跨平台泛化。
    - 路线: 技能、数据与强化学习驱动的代理能力提升
      解决的问题: 通过多模态技能库、未标注截图弱监督以及可验证合成任务的在线RL降低标注负担并提升成功率。
      尚未覆盖: 增益是否跨基准和模型族迁移尚不明确；低复现信号是证据缺口，不等同于工件不存在。
    - 路线: 细粒度评估、不确定性与交互指标
      解决的问题: 在总体通过率之外探测子目标完成、成本准确率、拖拽交互覆盖和不确定性校准。
      尚未覆盖: 代理指标尚未与用户决策绑定；跨模型接口的UQ排名迁移弱；多步轨迹评估仍基本未解决。
    - 路线: 可比基线与报告实践
      解决的问题: 通过多框架多模型基线比较使结果可审计。
      尚未覆盖: 实现和算力稳定性及工件可用性证据不一致；缺失代码或数据集链接应视为验证缺口。
    共识:
    - 可执行基准和确定性或模型评分被视为比较计算机使用代理的必要条件，但总体通过率并不足够。
    - 多模态视觉上下文和细粒度子目标信号能改善性能并揭示整体成功率掩盖的失败。
    - 动态或交互密集界面（视频信息流、拖拽操作、多应用桌面使用）在早期静态基准假设中覆盖不足，需要新任务设计。
    - 基准不仅用于评测，也开始为强化学习和弱监督提供训练信号。
    分歧:
    - 部署与评测表面不同：桌面OS全流程、浏览器短视频动态、单步GUI定位或拖拽交互各有侧重。
    - 评测目标不同：规则通过/失败、成本准确率、不确定性校准、子目标完成或训练效率被分别强调。
    - 成果类型不同：有的提供基准数据集或环境，有的提供训练方法，少数同时提供二者。
    - 监督假设不同：可验证奖励、少量高质量标注、未标注截图或多模态技能工件分别被作为关键条件。
    开放问题:
    - 基准任务分布能否覆盖稀有动态交互、长程多应用工作流和跨平台迁移，同时避免任务级过拟合？
