  related_work_outline_zh:
  - 主流方向：当前可见研究集中在通过基准驱动方法提升 GUI/computer-use agent 的可靠性和能力，包括密集桌面监督、执行框架自改进、可验证在线强化学习和长时程上下文管理。
  - 研究共性：多篇工作不是只扩展基础模型，而是围绕冻结或较小 VLM 增加外部机制，如合成任务、密集标注、重复运行证据或上下文动作，并以任务成功和 GUI grounding
