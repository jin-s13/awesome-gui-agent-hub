  related_work_outline:
  - 'Mainstream direction: Real-world, dynamic, and fine-grained GUI-agent evaluation
    and training; methods combine verifiable or weak supervision with frontier vision-language
    agents to improve grounding, action prediction, and reliability on desktop, video,
    or drag interfaces.'
  - 'Shared research pattern: Build richer task suites, measure beyond Pass@1 with
    sub-goal, cost-accuracy, or uncertainty signals, then diagnose grounding, observation-control,
    and interaction-coverage failures; several methods use RL, weak supervision, harness
    optimization, or keyframe extraction.'
  - 'Key differences: Evaluation settings span macOS GUI+CLI tasks, dynamic short-video
    interfaces, video-guided agentic tasks, drag interactions, and single-step grounding;
    training signals range from unannotated screenshots to synthesized verifiable
    tasks; some work optimizes a frozen execution harness rather than the model.'
  - 'Trend evolution: Evidence is concentrated in 2026, so the trend is within the
    current frontier; work is moving from click-centric static benchmarks toward dynamic
    observation control, richer interaction modes, and more sample-efficient self-improvement.'
  - 'Open questions: Cross-environment transfer, observation-control calibration,
    uncertainty under interface shift, and isolation of model gains from task, framework,
    and harness choices remain under-evidenced.'
  related_work_outline_zh:
  - 主流方向：真实、动态和细粒度的 GUI 智能体评测与训练；方法将可验证或弱监督信号与前沿视觉语言代理结合，提升 grounding、动作预测和可靠性。
  - 研究共性：构建更丰富的任务集，以子目标、成本-准确性或不确定性等信号超越 Pass@1，并诊断 grounding、观察控制和交互覆盖失败；多类方法使用 RL、弱监督、harness
    优化或关键帧提取。
  - 关键差异：评测设置覆盖 macOS GUI+CLI 任务、动态短视频、视频引导任务、拖拽操作和单步 grounding；训练信号从无标注截图到可验证合成任务；部分工作优化冻结执行框架而非模型。
  - 趋势演进：证据集中在 2026 年，因此趋势属于当前前沿内部变化；工作正从点击式静态基准转向动态观察控制、更丰富交互模式与更少标注的自改进。
  - 开放问题：跨环境迁移、观察控制校准、界面漂移下的不确定性，以及模型收益与任务、框架和 harness 选择的隔离仍缺少证据。
  literature_review:
    line_of_work_matrix:
    - line: Real-world GUI agent benchmarking and interaction coverage
      what_it_solves: Expands evaluation beyond click-only static screens to desktop
        tasks, dynamic short-video interfaces, drag interactions, and video-guided
        action, while adding fine-grained sub-goal and cost-accuracy metrics.
      what_remains_open: Whether coverage generalizes across operating systems, applications,
        and dynamic-interface families; existing benchmarks remain limited to chosen
        platforms and often to specific task or trajectory settings.
    - line: Data-efficient and self-improving GUI training methods
      what_it_solves: Reduces annotation and sample cost through verifiable task synthesis
        with online RL, weakly supervised grounding from unannotated screenshots,
        task-driven keyframe extraction, or evidence-driven harness evolution.
      what_remains_open: Transfer beyond reported held-out suites is not established,
        and how much gain comes from the training signal versus the harness, skill
        library, or rollout allocation remains unclear.
    - line: Reliability and uncertainty evaluation for GUI grounding
      what_it_solves: Measures model confidence, spatial grounding, and observation
        control, using cross-model uncertainty ranking and conformal click regions
        to expose miscalibration.
      what_remains_open: Multi-step trajectory uncertainty is not covered, and ranking
        or coverage degrades under calibration-test or interface distribution shift,
        limiting deployment robustness.
    consensus:
    - Evaluation is moving from static click-only screenshots toward dynamic, multi-interface,
      and fine-grained task settings that measure sub-goal completion, information
      efficiency, or grounding reliability.
    - Frontier vision-language agents still underperform humans in dynamic or cost-sensitive
      settings; failures often come from grounding, observation control, or interface
      coverage rather than only action correctness.
    - Methods increasingly use weak supervision, verifiable synthetic tasks, keyframe
      selection, or harness optimization to improve GUI agents without massive human
      annotation or full model retraining.
    disagreements:
    - 'Evaluation target and interaction mode differ: desktop GUI+CLI tasks, dynamic
      short-video observation, video-guided agentic tasks, drag interactions, and
      single-step executable grounding.'
    - 'Improvement strategy differs: some train through online RL with synthesized
      verifiable tasks, some use unannotated screenshot weak supervision, some optimize
      a frozen execution harness or skill library, and some evaluate uncertainty or
      keyframe extraction.'
    - 'Primary metric differs: Pass@1 with fine-grained sub-goal scoring, cost-accuracy
      or information efficiency, uncertainty ranking and conformal coverage, or drag-task
      success.'
    - 'Evidence scope differs: some report multi-run transfer to another benchmark,
      while others restrict findings to one platform, single-step grounding, or selected
      interface types.'
    open_questions:
    - Can observation-control and dynamic-interface findings transfer across desktop,
      short-video, and video-guided tasks?
    - Which supervision signal—synthetic verifiable tasks, unannotated screenshots,
      or harness-editing evidence—yields robust generalization beyond the reported
      benchmarks?
    - How can uncertainty calibration be maintained across open-weight and closed-source
      vision-language agents under interface and distribution shift?
    - Do fine-grained benchmark metrics isolate model or method contribution from
      framework, skill-library, harness, and rollout-allocation effects?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 真实 GUI 智能体基准与交互覆盖
      解决的问题: 将评测从静态点击屏幕扩展至桌面任务、动态短视频、拖拽操作和视频引导操作，并加入细粒度子目标、成本-准确性等指标。
      尚未覆盖: 覆盖性能否跨操作系统、应用与动态界面族泛化仍不明确；现有基准受限于所选平台，并常局限于特定任务或轨迹设置。
    - 路线: 数据高效与自改进的 GUI 训练方法
      解决的问题: 通过可验证任务合成与在线 RL、未标注截图弱监督、任务驱动关键帧提取或证据驱动的 harness 演化，降低标注和样本成本。
      尚未覆盖: 在报告保留套件之外的迁移尚未确立；收益有多少来自训练信号而非 harness、技能库或 rollout 分配仍不清晰。
    - 路线: GUI grounding 的可靠性与不确定性评测
      解决的问题: 测量模型置信度、空间定位和观察控制，并通过跨模型不确定性排序与共形点击区域揭示校准问题。
      尚未覆盖: 多步轨迹的不确定性尚未覆盖；排序与覆盖在校准-测试或界面分布漂移下退化，限制部署鲁棒性。
    共识:
    - 评测正从静态点击屏幕转向动态、多界面和细粒度任务设置，测量子目标完成、信息效率或 grounding 可靠性。
    - 前沿视觉语言代理在动态或成本敏感设置中仍低于人类水平；失败常源自 grounding、观察控制或界面覆盖，而非仅动作正确性。
    - 方法越来越多使用弱监督、可验证合成任务、关键帧选择或 harness 优化，以在少量人工标注或冻结模型条件下提升 GUI 智能体。
    分歧:
    - 评测目标与交互模式不同：桌面 GUI+CLI 任务、动态短视频观察、视频引导智能体任务、拖拽操作和单步 grounding。
    - 改进策略不同：有的通过可验证合成任务进行在线 RL，有的使用未标注截图弱监督，有的优化冻结执行框架或技能库，有的评测不确定性或关键帧提取。
    - 主要指标不同：细粒度子目标的 Pass@1、成本-准确性或信息效率、不确定性排序与共形覆盖，或拖拽任务成功率。
    - 证据范围不同：一些报告多轮迁移到另一个基准，另一些只覆盖单一平台、单步 grounding 或选定界面类型。
    开放问题:
    - 动态界面下的观察控制发现能否迁移到桌面、短视频和视频引导任务？
    - 合成可验证任务、未标注截图或 harness 编辑证据中，哪种监督信号能更稳健地泛化到报告基准之外？
    - 如何在开源与闭源视觉语言代理之间、以及界面与分布漂移下维持不确定性校准？
    - 细粒度指标是否真正隔离了模型或方法贡献与框架、技能库、harness、rollout 分配的影响？
