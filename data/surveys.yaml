  - 'Open questions: Method-to-gain attribution, observation control, transfer across
    interfaces and operating systems, and robustness of uncertainty quantification
    remain unresolved.'
  related_work_outline_zh:
  - 主流方向：真实、动态且交互多样的GUI智能体基准，以及面向VLM智能体的规模化训练、RL或harness自改进方法。
  - 研究共性：通过环境中的任务完成和确定性或细粒度评分解码，结合VLM智能体与执行证据进行失败诊断。
  - 关键差异：测量与行为改进、监督信号、交互范围如点击/拖拽/GUI+CLI/动态屏幕，以及开源权重与闭源模型访问。
  - 趋势演进：可见高排名论文集中在2026年，当前前沿正从静态点击定位转向动态屏幕、更丰富动作原语和自改进。
  - 开放问题：方法收益归因、观察控制、跨界面与跨操作系统迁移，以及不确定性量化的鲁棒性仍不明确。
  literature_review:
    line_of_work_matrix:
    - line: Real-world GUI agent benchmarking and task design
      what_it_solves: Measures VLM agent capability on macOS desktop, dynamic short-video,
        and drag-based interactions, exposing gaps in observation control, skill use,
        and action coverage.
      what_remains_open: Evidence is concentrated in specific platforms and interaction
        types; cost-accuracy, sub-goal metrics, and cross-benchmark transfer are not
        yet standardized.
    - line: Training and self-improvement methods for GUI agents
      what_it_solves: Reduces annotation cost and improves success through weak supervision,
        verifiable task synthesis, online RL, or harness optimization around frozen
        backbone models.
      what_remains_open: Attribution is hard because gains may come from the base
        model, framework, skill library, or harness; transfer beyond OSWorld, WindowsAgentArena,
        and ScienceBoard is underevidenced.
    - line: Visual grounding and input representation for GUI control
      what_it_solves: Handles video-guided tasks, drag grounding, and grounded uncertainty
        by extracting keyframes, covering drag interactions, and calibrating click
        regions.
      what_remains_open: Observation control under dynamic content, cross-model and
        cross-interface UQ transfer, and multi-step grounding remain unresolved.
    consensus:
    - Current GUI agent work treats VLM-based agents as the default decision model
      and evaluates them through environment-grounded task completion rather than
      only static UI understanding.
    - Papers agree that real-world and dynamic GUI tasks expose failures not visible
      in static click-only benchmarks, especially observation strategy, execution
      variability, and action primitive coverage.
    - Multiple methods move from manual annotation toward scalable supervision or
      self-improvement, using screenshots, execution traces, verifiable task synthesis,
      or harness edits.
    - Evaluation increasingly uses deterministic checks, fine-grained sub-goal scoring,
      or cost-accuracy trade-offs to separate pass/fail from capability.
    disagreements:
    - Some work targets better measurement through benchmarks, while other work targets
      better behavior through training, RL, or harness optimization.
    - 'Supervision assumptions differ: unannotated screenshots plus small calibrated
      data, verifiable synthesized tasks, frozen-model harness edits, and fine-tuning
      on drag-specific data are competing routes.'
    - Interaction scope differs across click grounding, GUI+CLI tasks, short-video
      dynamic content, and drag actions, so findings do not automatically transfer
      across interfaces.
    - Evaluation targets differ from single-step grounding with uncertainty or conformal
      regions to multi-step desktop task completion, changing which failure modes
      are visible.
    - Closed-source models require different UQ or adaptation strategies because internal
      states are inaccessible, while open-weight methods allow hidden-state or density-based
      approaches.
    open_questions:
    - How much of reported gains on OSWorld-like or desktop benchmarks comes from
      the proposed training or harness method rather than skill libraries, framework
      choices, or backbone model capability?
    - Can observation control be learned or built into agents to reduce over- and
      under-observation on dynamic screens without losing task accuracy?
    - Do drag-based and GUI+CLI grounding improvements generalize to downstream multi-step
      computer-use tasks beyond the studied benchmark?
    - How should uncertainty quantification be selected or adapted when models and
      interfaces change, given weak cross-tier UQ ranking transfer?
    - What evidence would establish transfer across operating systems, application
      sets, and interaction modalities beyond the studied macOS, short-video, drag,
      and OSWorld-style environments?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 真实GUI智能体基准与任务设计
      解决的问题: 在macOS桌面、动态短视频和拖拽交互上测量VLM智能体能力，暴露观察控制、技能使用和动作覆盖缺口。
      尚未覆盖: 证据集中在特定平台和交互类型；成本-准确性、子目标指标和跨基准迁移仍不统一。
    - 路线: GUI智能体训练与自改进方法
      解决的问题: 通过弱监督、可验证任务合成、在线RL或冻结骨干模型的harness优化，降低标注成本并提高成功率。
      尚未覆盖: 收益难以归因于方法本身而不是基座模型、框架、技能库或harness；OSWorld、WindowsAgentArena和ScienceBoard之外的迁移证据不足。
    - 路线: GUI控制的视觉定位与输入表示
      解决的问题: 通过关键帧提取、拖拽动作覆盖和点击区域校准，处理视频引导任务、拖拽定位和有依据的不确定性。
      尚未覆盖: 动态内容下的观察控制、跨模型与跨界面UQ迁移以及多步定位仍未解决。
    共识:
    - 当前GUI智能体工作默认以VLM作为决策模型，并通过环境中的任务完成评估，而不只是静态UI理解。
    - 论文普遍认为真实和动态GUI任务会暴露静态点击基准看不到的失败，尤其是观察策略、执行可变性和动作原语覆盖。
    - 多种方法从人工标注转向可扩展监督或自改进，利用截图、执行轨迹、可验证任务合成或harness编辑。
    - 评估越来越多采用确定性检查、细粒度子目标评分或成本-准确性权衡来区分通过率和能力差异。
    分歧:
    - 有些工作侧重通过基准揭示能力边界的测量，另一些则侧重通过训练、RL或harness优化改进行为。
    - 监督假设不同：未标注截图加少量校准数据、可验证合成任务、冻结模型harness编辑和拖拽数据微调是相互竞争的路线。
    - 交互范围在点击定位、GUI+CLI、短视频动态内容和拖拽动作之间不同，发现不能自动跨界面迁移。
    - 评测目标从单步定位与不确定性或共形区域到多步桌面任务完成，不同目标暴露不同失败模式。
    - 闭源模型因内部状态不可访问，需要与开源权重模型不同的UQ或适配策略。
    开放问题:
    - 报告在OSWorld类或桌面基准上的提升中，有多少来自训练或harness方法本身，而不是技能库、框架选择或基座模型能力？
    - 能否学习或内置观察控制，以在动态屏幕上减少过度观察和观察不足而不损失任务准确性？
    - 拖拽和GUI+CLI定位改进能否泛化到下游多步计算机使用任务？
    - 在模型和界面变化时如何选择或适配不确定性量化，鉴于跨层级UQ排名转移较弱？
    - 除了已研究的macOS、短视频、拖拽和OSWorld风格环境，哪些证据能证明跨操作系统、应用集和交互模态迁移？
