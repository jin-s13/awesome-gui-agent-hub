  literature_review:
    line_of_work_matrix:
    - line: End-to-end multimodal GUI and computer-use agents with unified action
        spaces
      what_it_solves: Combines visual grounding, GUI interaction, and code execution
        into a single trainable policy for desktop and mobile computer-use tasks.
      what_remains_open: Cross-platform and out-of-distribution generalization beyond
        reported benchmarks; long-term stability of learned GUI/code coordination
        under deployment is not evidenced.
    - line: Data-efficient and weakly supervised GUI agent training
      what_it_solves: Lowers reliance on expensive human annotations by learning visual
        grounding from unannotated screenshots and calibrating with small supervised
        or RL data.
      what_remains_open: Transfer beyond the reported GUI settings and the minimal
        annotation required for unseen applications remain open.
    - line: Lightweight and low-latency action policies
      what_it_solves: Avoids token-by-token VLM decoding through decoder-free latent
        scoring or block-wise diffusion to improve inference speed and parameter efficiency.
      what_remains_open: Accuracy still trails larger fine-tuned VLMs, and evidence
        is limited to in-distribution or single-benchmark evaluations.
    - line: Harness-native training and orchestration frameworks
      what_it_solves: Enables RL and containerized rollout orchestration for agents
        built on complex multi-process inference harnesses without rewriting the harness.
      what_remains_open: Error recovery remains weak after training and harness design
        heavily affects trainability; independent reproduction and deployment evidence
        is incomplete.
    - line: Skill and memory layers for computer-use agents
      what_it_solves: Provides retrievable hierarchical multimodal skill artifacts
        that retain visual figures to improve UI element identification and workflow
        verification.
      what_remains_open: Robustness across broader application sets, long-horizon
        skill maintenance, and interaction with varied base agents need more evidence.
    - line: Diagnostic and recovery evaluation frameworks
      what_it_solves: Formalizes recovery consistency and personalization failures
        through controlled probes and goal-oriented action replay, locating capability
        bottlenecks.
      what_remains_open: Current agents underuse latent recovery and personalization
        capabilities; cost, reset constraints, and narrow platform/API coverage limit
        evaluation.
    consensus:
    - Vision-language grounding is treated as a core component of computer-use and
      GUI agent capability.
    - Success-rate evaluations on GUI/computer-use benchmarks are the common evidence
      signal, often with baselines and ablations.
    - Adding structure beyond raw visual/text policy, such as multimodal skills, code
      actions, latent candidate scoring, or RL orchestration, is used to improve task
      success or inference efficiency.
    - Supervised fine-tuning or RL after pretraining is a shared recipe for aligning
      agents to computer-use behavior.
    - Error recovery and personalization are recognized as weak points even when task
      completion is relatively high.
    disagreements:
    - 'Action representation differs: explicit GUI operations, code execution, latent
      candidate scoring, or block-wise diffusion generation.'
    - 'Supervision signal differs: weak supervision from unannotated screenshots,
      hybrid application-artifact supervision, online RL, or harness-recorded rollouts.'
    - 'Inference mode differs: autoregressive VLM decoding, decoder-free latent scoring,
      and block-wise diffusion decoding trade speed against accuracy.'
    - 'Deployment setting differs: mobile, desktop, web, and harness-specific orchestration
      are evaluated separately, making cross-setting transfer unclear.'
    - 'Evaluation target differs: grounding/navigation, end-to-end task success, recovery
      consistency, or personalization diagnosis; these are not interchangeable evidence.'
    open_questions:
    - How can lightweight low-latency policies close the accuracy gap while preserving
      their speed and parameter-efficiency advantages?
    - What recovery mechanisms would allow agents to exploit latent recovery capabilities
      without expensive resets or long-horizon replays?
    - How well do unified GUI/code action spaces transfer across operating systems,
      application sets, and deployment containers?
    - What is the minimal supervision and environment coverage needed for weakly supervised
      GUI agents to generalize beyond reported benchmarks?
    - Can personalization and memory mechanisms improve preference-sensitive tasks
      without degrading performance on non-personalized tasks?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端多模态GUI/计算机使用智能体与统一动作空间
      解决的问题: 将视觉定位、GUI交互和代码执行合并为单一可训练策略，用于桌面和移动计算机使用任务。
      尚未覆盖: 已报告基准之外的跨平台与分布外泛化，以及学习到的GUI/代码协调在部署中的长期稳定性尚缺乏证据。
    - 路线: 数据高效与弱监督GUI智能体训练
      解决的问题: 通过未标注截图学习视觉定位，再用少量监督或强化学习校准，降低对昂贵人工标注的依赖。
      尚未覆盖: 跨出已报告GUI设置后的迁移，以及未知应用所需的最少标注量仍未明确。
    - 路线: 轻量低延迟动作策略
      解决的问题: 通过无解码器潜空间评分或块级扩散避免逐token VLM解码，提高推理速度与参数效率。
      尚未覆盖: 准确率仍落后于更大微调VLM，且证据主要限于分布内或单一基准评测。
    - 路线: Harness原生训练与编排框架
      解决的问题: 无需重写harness即可对基于复杂多进程推理harness的智能体进行强化学习和容器化回滚编排。
      尚未覆盖: 训练后错误恢复仍较弱，harness设计显著影响可训练性；独立复现与部署证据不足。
    - 路线: 面向计算机使用智能体的技能与记忆层
      解决的问题: 提供可检索的分层多模态技能工件，保留视觉图形以改善UI元素识别和工作流验证。
      尚未覆盖: 在更广泛应用中长期维护技能，以及与不同基座智能体的交互仍缺少证据。
    - 路线: 诊断与恢复评测框架
      解决的问题: 通过受控探针和目标导向动作重放，形式化恢复一致性与个性化失败，定位能力瓶颈。
      尚未覆盖: 当前智能体尚未充分利用潜在恢复与个性化能力；成本、重置限制和平台/API覆盖不足。
    共识:
    - 视觉语言grounding被视为计算机使用和GUI智能体能力的核心组件。
    - GUI/计算机使用基准上的成功率是常见证据信号，通常配合基线与消融实验。
    - 在原始视觉/文本策略之外加入多模态技能、代码动作、潜在候选评分或RL编排等结构，被用于提升成功率或推理效率。
    - 预训练后进行监督微调或强化学习是对齐智能体计算机使用行为的共享方法。
    - 即使任务完成率较高，错误恢复和个性化能力仍被识别为薄弱点。
    分歧:
    - 动作表示不同：显式GUI操作、代码执行、潜在候选评分或块级扩散生成。
    - 监督信号不同：未标注截图弱监督、混合应用-工件监督、在线RL或harness记录回滚。
    - 推理模式不同：自回归VLM解码、无解码器潜在评分和块级扩散在速度与准确率之间做不同权衡。
    - 部署场景不同：移动、桌面、网页和harness专用编排被分别评测，跨场景迁移尚不清晰。
    - 评测目标不同：grounding/导航、端到端任务成功、恢复一致性或个性化诊断，不能互换作为证据。
    开放问题:
    - 轻量低延迟策略如何在保持速度和参数效率优势的同时缩小准确率差距？
    - 什么恢复机制能让智能体在无需昂贵重置或长时程重放的情况下利用潜在恢复能力？
    - 统一GUI/代码动作空间在操作系统、应用集和部署容器之间的迁移表现如何？
    - 弱监督GUI智能体需要多少监督和环境覆盖才能泛化到已报告基准之外的场景？
    - 个性化和记忆机制能否在不降低非个性化任务性能的情况下改善偏好敏感任务？
