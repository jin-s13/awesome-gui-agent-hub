      what_remains_open: Prioritization of which gaps matter most for progress, and
        whether current benchmarks capture real-world deployment conditions such as
        available reputation cues and distribution shift.
    consensus:
    - The evidence converges on benchmark-driven validation, with each principal contribution
      reporting performance on at least one named suite or protocol.
    - 'Papers share a grounding mechanism: model actions are tied to observed outcomes,
      whether through task verifiers, before-after screenshots, dense annotations,
      or masked webpage evidence.'
    - Recent work treats frozen-model prompting alone as insufficient and adds evidence-driven,
      self-improving, or context-managed components to improve GUI task completion.
    - 'Reproducibility signals are inconsistent: some papers disclose code, dataset,
      or artifact signals while others only show benchmark results without visible
      limitations.'
    disagreements:
    - 'Intervention point differs: keyframe selection, execution harness editing,
