    - 路线: GUI任务抽象与评测基准构建
      解决的问题: 显式定义静态桌面、动态屏幕、多模态和拖拽等交互假设，并提供比总体成功率更细粒度的评分。
      尚未覆盖: 覆盖范围受限于已测应用/平台；形式化条件尚未与实际界面漂移下的模型行为关联。
    - 路线: 基于技能与执行框架的冻结骨干改进
      解决的问题: 在不改变骨干权重的情况下，通过多模态技能库或harness级别诊断来提升智能体表现。
      尚未覆盖: 多数工作缺少明确局限性分析，跨基准和骨干的归因与迁移仅部分验证。
    - 路线: GUI动作基座的策略学习与数据效率
      解决的问题: 通过可验证任务合成、课程学习和高效在线RL/采样降低人工标注依赖并扩展训练。
      尚未覆盖: 训练细节与可复现性不均衡，增益依赖基准选择，缺少清晰失败边界。
    - 路线: GUI基座的不确定性量化与可靠性框架
      解决的问题: 对单步GUI基座的后验不确定性方法和校准/安全区域进行基准测量。
      尚未覆盖: 多步轨迹、闭源模型迁移和分布偏移下的覆盖保障仍待解决。
    共识:
    - 总体成功率不足，细粒度的子目标、成本-准确率或基座级指标能揭示被掩盖的能力差异。
    - 当前GUI智能体在动态和拖拽等非纯点击任务上仍不稳健，观察或执行上下文未被有效控制。
    - 围绕冻结骨干的外部工件，如技能库或优化的执行框架，可在不重训模型时带来明显提升。
    - 可复现证据不均衡：部分基准/方法提供代码或数据，另一些缺少明确局限性或可获取工件。
    分歧:
    - 评测场景不同：有静态macOS桌面GUI+CLI、短视频动态屏幕、拖拽交互和单步GUI基座。
    - 改进层级不同：有的修改冻结骨干外围的技能/执行框架，有的通过在线RL或弱监督数据学习策略。
    - 成功信号不同：Pass@1、成本-准确率、不确定性校准排名或微调后的拖拽成功率。
    - 不确定性排名迁移结论存在差异：模型内强迁移，跨模型层级和界面则明显下降。
