  related_work_outline:
  - 'Mainstream direction: Large-scale GUI/OS automation benchmarks are expanding
    from static click/tap tasks toward real desktop, dynamic-screen, drag-interaction,
    and video-guided tasks, with fine-grained scoring and efficiency metrics.'
  - 'Shared research pattern: New benchmarks pair task suites with multi-checkpoint,
    cost-accuracy, or uncertainty metrics, while methods improve scores through multimodal
    skills, weak supervision, keyframe extraction, or online RL.'
  - 'Key differences: Environment realism and platform scope vary from real macOS
    desktops to simulated short-video or drag-only settings; evaluation targets differ
    among Pass@1, sub-goal completion, observation cost, and calibration.'
  - 'Trend evolution: The available 2024-2026 evidence shows a frontier shift toward
    verifiable or weakly supervised training and multimodal/dynamic evaluation, but
    the 2026-heavy span limits longer trend claims.'
  - 'Open questions: Generalization across OS/app versions and interfaces, alignment
    of fine-grained metrics with user utility, weak uncertainty-ranking transfer across
    model tiers, and missing code/artifact details remain verification gaps.'
  related_work_outline_zh:
  - 主流方向：大规模GUI/OS自动化基准从静态点击/点按任务扩展到真实桌面、动态屏幕、拖拽交互和视频引导任务，并采用细粒度评分与效率指标。
  - 研究共性：新基准将任务套件与多检查点、成本-准确性或不确定性指标结合，方法通过技能库、弱监督、关键帧提取或在线RL提升表现。
  - 关键差异：环境真实性和平台范围从真实macOS桌面到模拟短视频或仅拖拽设置不等；评测目标在Pass@1、子目标完成、观察成本和校准之间不同。
  - 趋势演进：2024-2026证据显示前沿转向可验证或弱监督训练以及多模态/动态评测，但2026年集中使长期趋势判断受限。
  - 开放问题：跨OS/应用版本和界面泛化、细粒度指标与用户效用对齐、跨模型层级的UQ迁移弱，以及缺少代码/工件细节仍是验证缺口。
  literature_review:
    line_of_work_matrix:
    - line: Real-world desktop OS task benchmark construction
      what_it_solves: Creates reproducible GUI and CLI tasks across native applications
        to compare agents beyond synthetic steps.
      what_remains_open: Evidence is centered on one macOS suite, so cross-OS, app-version,
        and framework stability is not established.
    - line: Dynamic, drag-based, and video-guided interaction benchmarks
      what_it_solves: Extends evaluation beyond static click/tap into changing screens,
        drag gestures, and video-guided GUI workflows.
      what_remains_open: Coverage is limited to short-video platforms, four drag types,
        or keyframe-based tasks; generalization to broader interfaces is unresolved.
    - line: Metric and stress-test design
      what_it_solves: Adds sub-goal checkpoints, cost-accuracy, and uncertainty calibration
        to reveal failure modes hidden by aggregate success rates.
      what_remains_open: Whether these proxy metrics align with downstream user decisions
        and remain stable across model tiers or interfaces.
    - line: Skill, data-efficiency, and RL training methods for benchmark improvement
      what_it_solves: Improves computer-use agents via multimodal skill libraries,
        weak supervision from unannotated screenshots, or verifiable online RL.
      what_remains_open: Many results rely on selected benchmarks and lack released
        artifacts; saturation and robustness across environments are not shown.
    - line: Uncertainty quantification benchmarking for grounding
      what_it_solves: Evaluates post-hoc uncertainty methods for GUI grounding and
        spatial safety via conformal click regions.
      what_remains_open: Limited to single-step grounding; cross-tier ranking transfer
        is weak and coverage degrades under distribution shift.
    consensus:
    - Aggregate pass rates are insufficient; fine-grained metrics expose sub-goal,
      observation, or calibration differences.
    - Benchmarks are moving from static click-only setups toward richer interaction
      modes and dynamic or multimodal screens.
    - Current agents still show clear gaps in observation control and dynamic-interface
      performance.
    - Training or skill-based interventions can improve benchmark performance while
      reducing reliance on expensive annotations.
    disagreements:
    - 'Evaluation realism and platform scope differ: native desktop environments versus
      simulated browser or specialized interaction suites.'
    - 'Success metric priorities differ: task completion, sub-goal checkpoints, information
      cost, uncertainty calibration, or spatial safety.'
    - 'Supervision and learning settings differ: verifiable online RL, weak supervision
      from unannotated screenshots, and retrieval-based skill libraries.'
    - Benchmark focus differs between multi-step agent trajectories and single-step
      executable grounding.
    open_questions:
    - Do real desktop benchmark results transfer across operating systems, application
      versions, and framework implementations?
    - Are cost-accuracy and fine-grained checkpoint metrics aligned with user utility
      in real workflows?
    - Can uncertainty ranking methods remain stable across open-weight and closed-source
      model tiers and interface shifts?
    - How broadly do drag-based, video-guided, and dynamic-screen benchmarks represent
      real-world GUI automation?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 真实桌面OS任务基准构建
      解决的问题: 构建可复现的GUI与CLI任务，比较不同智能体在原生应用上的表现。
      尚未覆盖: 证据集中于单一macOS套件，跨OS、应用版本和框架的稳定性尚未建立。
    - 路线: 动态、拖拽与视频引导交互基准
      解决的问题: 将评测从静态点击扩展到动态屏幕、拖拽手势和视频引导GUI流程。
      尚未覆盖: 覆盖范围限于短视频平台、四类拖拽或关键帧任务，向更广泛界面的泛化未解决。
    - 路线: 指标与压力测试设计
      解决的问题: 通过子目标检查点、成本-准确性和不确定性校准揭示总分隐藏的失败模式。
      尚未覆盖: 代理指标是否与用户下游决策一致，并在模型层级和界面间保持稳定。
    - 路线: 技能、数据效率与在线RL训练方法
      解决的问题: 通过多模态技能库、未标注截图弱监督或可验证在线RL提升计算机使用智能体。
      尚未覆盖: 多数结果依赖选定基准且缺少公开工件；跨环境的饱和与鲁棒性未得到证明。
    - 路线: GUI定位的不确定性量化基准
      解决的问题: 评估GUI定位的后验不确定性方法，并用共形点击区域衡量空间安全。
      尚未覆盖: 仅限于单步定位；跨模型层级的排名迁移较弱，分布偏移下覆盖度下降。
    共识:
    - 仅看总通过率不够，细粒度指标能揭示子目标、观察或校准差异。
    - 基准正从静态点击设置转向更丰富的交互模式和动态或多模态屏幕。
    - 当前智能体在观察控制和动态界面表现上仍存在明显差距。
    - 技能或训练干预可提升基准表现，同时降低对昂贵标注的依赖。
    分歧:
    - 评测真实性与平台范围不同：原生桌面环境对模拟浏览器或专门交互套件。
    - 成功指标重点不同：任务完成、子目标检查点、信息成本、不确定性校准或空间安全。
    - 监督与学习设置不同：可验证在线RL、未标注截图弱监督和检索式技能库。
    - 基准关注点不同：多步智能体轨迹对单步可执行定位。
    开放问题:
    - 真实桌面基准结果是否能跨操作系统、应用版本和框架实现迁移？
    - 成本-准确性和细粒度检查点指标是否与真实工作流中的用户效用一致？
