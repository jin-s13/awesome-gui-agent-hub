  literature_review:
    line_of_work_matrix:
    - line: Benchmark-driven task and interaction abstraction (e.g., MacAgentBench,
        LivingScreen, DragOn)
      what_it_solves: Turns real desktop, dynamic short-video, and drag-based GUI
        interactions into rule-based or environment-simulated task suites with finer
        sub-goal and cost-accuracy metrics.
      what_remains_open: Abstractions remain platform- or interaction-specific; no
        shared formal account of observation control or cross-interface transfer is
        established.
    - line: Reliability and uncertainty quantification for GUI grounding (e.g., Argus)
      what_it_solves: Evaluates post-hoc uncertainty methods for GUI grounding and
        spatial safety via conformal click regions.
      what_remains_open: Evidence covers single-step grounding; cross-model rankings
        transfer weakly, and coverage degrades under calibration/test or interface
        mismatch.
    - line: Weakly supervised and verifiable task-driven training (e.g., GUICrafter,
        ScaleCUA)
      what_it_solves: Reduces dependence on expensive human annotations by mining
        unannotated screenshots or synthesizing verifiable reinforcement-learning
        tasks.
      what_remains_open: Scaling and failure-prediction claims lack direct validation
        across broader deployment settings; visible analysis often omits explicit
        limitations.
    - line: Skill, memory, and context augmentation for long-horizon computer use
        (e.g., VISUALSKILL, MemGUI-Agent)
      what_it_solves: Improves sub-goal completion by retaining visual skill artifacts
        or treating context management as first-class actions.
      what_remains_open: Gains are shown on selected benchmarks; transfer to other
        applications, platforms, and failure boundaries remains under-reported.
    consensus:
    - Fine-grained evaluation signals such as sub-goal completion, cost-accuracy,
      and capability annotations reveal differences hidden by aggregate Pass@1.
    - Visual grounding and retained visual information improve UI element identification
      and workflow state verification.
    - Context or observation management is a recurring bottleneck in both long-horizon
      mobile tasks and dynamic short-video settings.
    - Annotation efficiency is a shared concern, with weak supervision and verifiable
      synthetic task generation pursued as alternatives to expensive human labels.
    disagreements:
    - 'Evaluation targets differ: real macOS desktop GUI+CLI tasks, dynamic short-video
      environments, drag-only interactions, and mobile long-horizon tasks imply different
      validity boundaries.'
    - 'Supervision differs: unannotated screenshot pretraining, verifiable synthesized
      online reinforcement learning, supervised skill or context fine-tuning, and
      post-hoc uncertainty benchmarking optimize different objectives.'
    - 'Metrics differ: deterministic rule-based Pass@1 and sub-goal checks versus
      cost-accuracy information efficiency versus uncertainty ranking stability and
      conformal coverage.'
    - 'Interaction focus differs: click/type, drag, GUI+CLI, and dynamic observation
      control are treated separately rather than under one interaction theory.'
    open_questions:
    - Can formal task abstractions for dynamic or drag-based GUI interaction predict
      failure modes and transfer across platforms rather than only rank models on
      fixed suites?
    - Which uncertainty quantification signals remain reliable for closed-source agents
      with inaccessible internal states, and under what distribution shifts?
    - Do multimodal skills or proactive context actions improve long-horizon reliability
      beyond the reported benchmarks and model families?
