  related_work_outline_zh:
  - 主流方向：构建和评测面向真实计算机使用任务的 GUI 代理；当前前沿工作覆盖桌面、移动、网页、动态视频和操作系统级应用，并在基准之外同时提出技能、重放或统一动作生成方法。
  - 研究共性：以多模态屏幕或视频证据为基础，利用领域特定工件或训练提升任务完成率，并用任务级指标而非孤立 UI 定位来评测。
  - 关键差异：静态与动态部署表面；仅 GUI 与 GUI+代码动作空间；技能检索、监督微调/在线强化学习与状态机重放；任务成功率、成本-准确率与加速比等指标侧重不同。
  - 趋势演进：2024–2026 证据显示从点击导向/静态基准转向动态视频、拖拽、操作系统级和代码执行任务；效率与细粒度检查点评测逐渐成为核心目标。
  - 开放问题：跨平台泛化、动态界面中的观察控制、重复任务可靠性，以及基准提升能否迁移到真实专业工作流。
  literature_review:
    line_of_work_matrix:
    - line: Real-world desktop and application benchmarking
      what_it_solves: Evaluating GUI agents across multi-application tasks that mix
        GUI and command-line interactions, with deterministic scoring and fine-grained
        checkpoint metrics.
      what_remains_open: Whether benchmark success transfers across operating systems,
        unseen applications, long-horizon real work, and dynamic or specialized interface
        conditions.
    - line: Skill and memory construction for computer-use agents
      what_it_solves: Codifying successful workflows as multimodal skill artifacts
        or state-machine programs to improve accuracy and repeated-task execution
        speed.
      what_remains_open: Generalization to unseen task variations, skill retrieval
        and validation failures, and reliability when screen states, layouts, or user
        goals change.
    - line: Dynamic and specialized interaction understanding
      what_it_solves: Covering dynamic screen content, video-guided instructions,
        and drag-based manipulations that static click-oriented benchmarks miss.
      what_remains_open: Observation control and information efficiency in dynamic
        interfaces, plus broader coverage beyond short-video platforms and the four
        highlighted drag types.
    - line: Unified multimodal action models and execution
      what_it_solves: Training or adapting vision-language agents to emit GUI actions,
        code execution, or diffusion-based outputs across desktop, mobile, and web
        platforms.
      what_remains_open: Cross-platform transfer, scalability of supervised and online
        RL pipelines, and reproducibility verification when code, data, and limitation
        details are absent.
    consensus:
    - The field is moving from narrow click-only evaluation toward realistic application
      suites spanning desktop, mobile, web, and OS-level tasks.
    - Multimodal screen or video evidence is central; text-only skill or instruction
      variants are weaker.
    - Fine-grained evaluation beyond Pass@1, such as sub-goal completion, cost-accuracy,
      or runtime speed, is increasingly necessary.
    - 'Domain-specific artifacts improve performance: visual skill libraries, drag
      datasets, keyframe extraction, and OS file-artifact composition.'
    disagreements:
    - 'Evaluation target varies: static desktop workflows, dynamic short-video feeds,
      video-guided tasks, drag-only interactions, or GUI-plus-code execution.'
    - 'Action representation varies: GUI-only actions, unified GUI/code action spaces,
      compiled state-machine replay, or block-wise diffusion generation.'
    - 'Supervision and learning vary: prompted skill retrieval, supervised fine-tuning,
      online reinforcement learning, or replaying successful runs without per-step
      language model calls.'
    - 'Metric emphasis varies: Pass@1, fine-grained checkpoint completion, cost-accuracy,
      speedup, or cross-benchmark grounding.'
    open_questions:
    - Can skill and memory methods remain reliable as applications, layouts, or user
      goals change?
    - How can dynamic-interface agents learn observation control to avoid over-observation
      or under-observation?
    - Do benchmark gains translate to real-world productivity, safety, and cross-platform
      robustness?
    - Are missing code, dataset, limitation, and artifact details verification gaps
