  related_work_outline:
  - 'Mainstream direction: Constructing and evaluating GUI/computer-use agents on
    real-world, dynamic, and fine-grained interaction tasks, then improving them through
    online RL, weakly supervised grounding, or execution-harness optimization.'
  - 'Shared research pattern: Papers pair a new task suite, dataset, or evaluation
    protocol with frozen or specialized backbone models, report pass-level plus finer
    sub-goal/cost/uncertainty metrics, and connect failures to observation, grounding,
    or harness-interface gaps.'
  - 'Key differences: Some work targets static click grounding, while others cover
    drag interaction, macOS GUI+CLI, dynamic short-video screens, or video-guided
    tasks; some keep backbones frozen and optimize data or harness, while others use
    online RL or fine-tuning.'
  - 'Trend evolution: Visible evidence is concentrated in the 2024-2026 frontier,
    moving from single-step grounding toward multi-application, dynamic, and drag-based
    tasks, and from model-only scaling toward verifiable task synthesis, weak supervision,
    and harness-level self-improvement.'
  - 'Open questions: Which component drives gains after controlling for backbone,
    harness, skill-library, or task prior; whether findings transfer across platforms,
    interfaces, and closed models; how to provide observation control and calibrated
    uncertainty in multi-step trajectories.'
  related_work_outline_zh:
  - 主流方向：在真实、动态且细粒度的GUI/计算机使用任务上构建与评估代理，并通过在线强化学习、弱监督定位或执行框架优化加以改进。
  - 研究共性：论文通常引入新任务集、数据集或评测协议，在冻结或专用骨干模型上报告Pass级及更细的子目标/成本/不确定性指标，并归因于观察、定位或框架接口缺口。
  - 关键差异：有的关注静态点击定位，有的覆盖拖拽、macOS GUI+CLI、动态短视频界面或视频引导任务；有的冻结骨干优化数据或harness，有的采用在线RL或微调。
  - 趋势演进：可见证据集中在2024-2026前沿，从单步定位走向多应用、动态和拖拽任务，从单纯模型缩放走向可验证任务合成、弱监督和harness级自改进。
  - 开放问题：控制骨干、harness、技能库或任务先验后，哪些组件驱动增益；发现能否跨平台、接口和闭源模型迁移；如何在多步轨迹中实现观察控制与校准不确定性。
  literature_review:
    line_of_work_matrix:
    - line: Real-world and dynamic GUI evaluation
      what_it_solves: Covers multi-application macOS tasks, dynamic short-video interfaces,
        drag interactions, and video-guided GUI tasks with fine-grained scoring such
        as sub-goal completion and cost-accuracy.
      what_remains_open: Evaluation remains platform- or interaction-specific, with
        limited evidence on multi-step trajectory generalization, observation control,
        and consistently reported limitation or verification details.
    - line: GUI agent training and self-improvement
      what_it_solves: Scales online RL through verifiable task synthesis, reduces
        annotation dependence via unannotated screenshots, and improves frozen backbone
        models by optimizing their execution harness from observed failures.
      what_remains_open: It is not fully isolated whether gains come from the model,
        harness, skill library, data recipe, or task prior; transfer beyond the reported
        benchmarks is only partially evidenced.
    - line: Action, observation, and uncertainty grounding
      what_it_solves: Improves keyframe/observation selection, drag grounding, and
        post-hoc uncertainty quantification with calibrated click regions for single-step
        GUI grounding.
      what_remains_open: Most evidence is single-step; cross-model and cross-interface
        UQ ranking transfer is weak, and conformal coverage degrades under distribution
        or interface shift.
    - line: Execution-interface and representation design
      what_it_solves: Turns GUI task inputs into usable representations such as visual
        context segments, task-relevant keyframes, drag coordinates, or harness code
        edits.
      what_remains_open: Which representation or interface choices transfer beyond
        the reported task family and backbone setup remains unclear.
    consensus:
    - Fine-grained evaluation reveals capability differences that coarse Pass@1 scores
      hide.
    - GUI-agent performance can be improved by scalable task or data construction
      and by optimizing the surrounding execution interface, not only by scaling model
      weights.
    - Current agents still show failures in observation control, drag interaction,
      dynamic content handling, and uncertainty transfer across model classes.
    disagreements:
    - 'Evaluation target differs: single-step grounding versus multi-step agent trajectories
      versus multi-application desktop tasks.'
    - 'Method locus differs: some update model weights through RL or fine-tuning,
      while others keep backbones frozen and optimize data, keyframes, or harness
      code.'
    - Uncertainty evidence is stable within models across datasets but not across
      open and closed model classes or interfaces, implying target-specific reranking
      is necessary.
    - 'Supervision and task creation differ: human-curated benchmarks, verifiable
      synthetic tasks, and unannotated weak supervision emphasize different scalability
      and evidence assumptions.'
    open_questions:
    - Can improvements transfer to unseen platforms or interfaces without re-evaluation
      or harness re-optimization?
    - Does observation-control capability generalize from short-video or desktop benchmarks
      to multi-step agent trajectories?
    - Which component of an agent system accounts for measured gains after controlling
      for backbone, harness, skill library, and task prior?
    - Can uncertainty and conformal calibration remain reliable under deployment distribution
      shifts and cross-interface mismatches?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 真实与动态 GUI 评估协议
      解决的问题: 覆盖多应用 macOS、动态短视频界面、拖拽交互和视频引导任务，并提供子目标完成、成本-准确性等细粒度评分。
      尚未覆盖: 评估仍局限于特定平台或交互，缺少多步轨迹泛化、观察控制及一致的局限性与验证证据。
    - 路线: GUI 代理训练与自改进
      解决的问题: 通过可验证任务合成扩展在线 RL，利用未标注截图降低标注依赖，并基于观测失败优化冻结骨干的执行框架。
      尚未覆盖: 尚未充分隔离模型、harness、技能库、数据配方或任务先验的贡献；跨基准迁移仅有部分证据。
    - 路线: 动作、观察与不确定性基础方法
      解决的问题: 改进关键帧/观察选择、拖拽定位，以及针对单步 GUI grounding 的后验 UQ 和共形点击区域校准。
      尚未覆盖: 证据多为单步；跨模型和跨接口的 UQ 排名迁移较弱，共形覆盖在分布或接口偏移下退化。
    - 路线: 执行接口与表示设计
      解决的问题: 将 GUI 任务输入转化为可用表示，例如视觉上下文分段、任务相关关键帧、拖拽坐标或 harness 代码编辑。
      尚未覆盖: 哪些表示或接口选择能迁移到已报告任务族和骨干设置之外，仍不清楚。
    共识:
    - 细粒度评估能揭示粗粒度 Pass@1 分数所掩盖的能力差异。
    - GUI 代理性能可通过可扩展任务或数据构建，以及优化周边执行接口来提升，而非仅靠模型权重扩展。
    - 当前代理在观察控制、拖拽交互、动态内容处理和跨模型类不确定性迁移方面仍存在失败。
    分歧:
    - 评测目标不同：单步 grounding 与多步代理轨迹、多应用桌面任务之间存在差异。
    - 方法作用点不同：有的通过 RL 或微调更新模型权重，有的冻结骨干并优化数据、关键帧或 harness 代码。
    - 不确定性证据在同一模型跨数据集间稳定，但在开源与闭源模型类或接口之间不稳定，需要目标特定重排。
    - 监督与任务创建不同：人工策划基准、可验证合成任务和未标注弱监督强调不同的可扩展性与证据假设。
    开放问题:
    - 改进能否在未见平台或接口上迁移，而无需重新评估或重新优化 harness？
    - 观察控制能力是否能从短视频或桌面基准泛化到多步代理轨迹？
    - 控制骨干、harness、技能库和任务先验后，代理系统中的哪个组件解释了实测增益？
    - 在部署分布偏移和跨接口不匹配下，不确定性与共形校准是否仍能保持可靠？
