  related_work_outline:
  - 'Mainstream direction: GUI agent research is converging on realistic computer-use
    tasks: grounding actions in visual interfaces, training agents with synthesized
    or weakly supervised data, and benchmarking fine-grained reliability across desktop,
    mobile, dynamic, drag, and video-guided settings.'
  - 'Shared research pattern: Papers pair a new benchmark or dataset with frontier
    VLM evaluation, then show that aggregate success masks gaps in sub-goal completion,
    observation control, action-space coverage, or uncertainty; several propose a
    targeted method to improve data efficiency or context management.'
  - 'Key differences: Differences include interaction scope such as GUI+CLI, drag-only,
    dynamic short-video, mobile long-horizon, and video-guided tasks; supervision
    strategy such as verifiable online RL, weak supervision from unannotated screenshots,
    SFT context actions, and keyframe extraction; and reliability target such as fine-grained
    scoring, cost-accuracy, uncertainty calibration, or out-of-distribution generalization.'
  - 'Trend evolution: Within the 2024-2026 current frontier, the field is shifting
    from static click-centric evaluation toward dynamic, real-world, multi-action
    benchmarks and toward training recipes that reduce annotation cost or scale RL;
    uncertainty and long-horizon context are emerging as reliability subfields.'
  - 'Open questions: Cross-interface generalization, observation control, multi-step
    uncertainty transfer, and isolation of method contribution from surrounding skills
    or planners remain open; several papers also leave limitation details or artifact/code
    information unreported as verification gaps.'
  related_work_outline_zh:
  - 主流方向：GUI智能体研究正在聚焦真实计算机使用任务，包括视觉界面动作定位、训练数据效率，以及桌面、移动、动态、拖拽和视频引导场景下的细粒度可靠性评测。
  - 研究共性：论文通常同时提出新基准或数据集并评估前沿VLM，结果显示聚合成功率掩盖子目标完成、观察控制、动作空间覆盖或不确定性方面的差距。
  - 关键差异：交互范围、监督策略和可靠性目标不同，如GUI+CLI、拖拽、动态短视频、移动长时程、视频引导；在线RL、弱监督、SFT上下文动作、关键帧提取等。
  - 趋势演进：2024-2026当前前沿从静态点击评测向动态真实多动作基准、从纯模型评测向数据/训练方法与可靠性评估发展。
  - 开放问题：跨界面泛化、观察控制、多步不确定性转移、方法贡献隔离，以及若干论文未报告限制或代码/数据等验证缺口。
  literature_review:
    line_of_work_matrix:
    - line: GUI grounding and interaction-coverage benchmarking
      what_it_solves: evaluating whether agents can locate and execute actions across
        click, drag, GUI+CLI, dynamic-screen, and video-guided interfaces
      what_remains_open: whether an agent that succeeds on one interaction or platform
        family transfers to others without new demonstrations or benchmark-specific
        tuning
    - line: Training-data and supervision scaling
      what_it_solves: reducing human annotation and compute constraints through verifiable
        task synthesis, online RL, weak supervision from unannotated screenshots,
        and visual context segmentation
      what_remains_open: how much performance gain comes from the training objective
        versus the task distribution, environment, or base model, and whether gains
        replicate beyond reported suites
    - line: Long-horizon context and policy-action design
      what_it_solves: keeping relevant context compact while preserving facts for
        long mobile or desktop trajectories by treating context management as first-class
        policy actions
      what_remains_open: whether the learned context-action policy generalizes across
        platforms and task lengths beyond the reported out-of-distribution benchmark
    - line: Uncertainty quantification and reliability evaluation
      what_it_solves: measuring and calibrating confidence in GUI grounding and spatial
        clicking, including conformal regions for safety
      what_remains_open: whether single-step grounding uncertainty transfers to multi-step
        trajectories, closed-source interfaces, and distribution-shifted deployment
    - line: Task-aware input compression and observation control
      what_it_solves: selecting task-relevant frames and controlling information cost
        for video and dynamic-screen agents
      what_remains_open: whether keyframe selection or observation policy is the actual
        driver of accuracy, and whether it extends across non-video dynamic GUI families
    consensus:
    - Aggregate success rates alone are insufficient measures of GUI agent capability.
    - Realistic benchmarks expose gaps that static or click-only evaluation misses,
      especially observation, drag, GUI+CLI, and long-horizon coverage.
    - Data- or training-focused interventions can improve agent performance, but the
      improvement is often benchmark- or model-specific.
    - Frontier models still do not reach human-level reliability on several dynamic
      or fine-grained GUI tasks.
    disagreements:
    - 'Interaction scope: some work covers GUI+CLI desktop tasks, while others target
      drag-only, short-video dynamic screens, mobile long-horizon interactions, or
      video-guided tasks.'
    - 'Supervision signal: one line uses verifiable online RL with synthesized tasks,
      another uses weakly supervised visual grounding from unannotated screenshots,
      and another uses SFT with context-management annotations.'
    - 'Reliability target: fine-grained sub-goal scoring, cost-accuracy observation
      efficiency, uncertainty calibration, and out-of-distribution generalization
      each emphasize different failure modes.'
    - 'Evidence scope: some evaluations stop at single-step grounding while others
      assess full trajectories and multi-application workflows.'
    open_questions:
    - How can agents learn observation control that avoids over- and under-observation
      on dynamic interfaces?
    - Can uncertainty quantification transfer across model tiers and interface distributions
      without target-specific re-ranking?
    - How well do scaling, weak supervision, keyframe selection, and context management
      methods transfer across desktop, mobile, drag, and CLI settings?
    - What unreported limitations, code, dataset, and baseline details are verification
      gaps for reproducibility and method isolation?
  literature_review_zh:
    研究路线矩阵:
    - 路线: GUI动作定位与交互覆盖评测
      解决的问题: 评估智能体能否在点击、拖拽、GUI+CLI、动态屏幕和视频引导等接口中定位并执行动作
      尚未覆盖: 在某一交互或平台上成功的智能体能否无需新演示或平台特定调优迁移到其他场景
    - 路线: 训练数据与监督扩展
      解决的问题: 通过可验证任务合成、在线RL、未标注截图弱监督和视觉上下文分段，降低人工标注和计算成本
      尚未覆盖: 性能提升有多少来自训练目标而非任务分布、环境或基础模型，以及能否在已报告套件之外复现
    - 路线: 长时程上下文与策略动作设计
      解决的问题: 在保持上下文紧凑的同时保留关键事实，将上下文管理作为策略的一等动作
      尚未覆盖: 学习到的上下文管理策略能否跨平台和任务长度泛化到报告外的分布外基准
    - 路线: 不确定性量化与可靠性评估
      解决的问题: 测量并校准GUI定位和空间点击的置信度，包括共形区域以支持安全决策
      尚未覆盖: 单步定位不确定性能否转移到多步轨迹、闭源接口和分布偏移部署
    - 路线: 任务感知输入压缩与观察控制
      解决的问题: 为视频和动态屏幕智能体选择任务相关帧并控制信息成本
      尚未覆盖: 精度提升是来自关键帧选择还是观察策略，以及能否扩展到非视频动态GUI家族
    共识:
    - 聚合成功率不足以衡量GUI智能体能力。
    - 真实基准暴露出静态或仅点击评测忽略的观察、拖拽、GUI+CLI和长时程等问题。
    - 数据或训练干预可提升性能，但提升通常依赖特定基准或模型。
    - 前沿模型在若干动态或细粒度GUI任务上仍未达到人类级可靠性。
    分歧:
    - 交互范围：桌面GUI+CLI、拖拽、动态短视频、移动长时程、视频引导各有覆盖。
    - 监督信号：可验证在线RL、未标注截图弱监督、SFT上下文管理标注等路线不同。
    - 可靠性目标：细粒度子目标评分、成本-准确性观察效率、不确定性校准、分布外泛化各有侧重。
    - 证据范围：部分评测只到单步定位，另一些评估完整轨迹与多应用流程。
    开放问题:
    - 智能体如何学习动态界面上的观察控制，避免过度或不足观察？
    - 不确定性量化能否在模型层级和界面分布之间迁移而不需要目标特定重排？
    - 扩展、弱监督、关键帧选择和上下文管理方法能否跨桌面、移动、拖拽和CLI场景迁移？
    - 未报告的限制、代码、数据集和基线细节是否构成可复现性与方法隔离的验证缺口？
