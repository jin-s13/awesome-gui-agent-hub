  related_work_outline:
  - 'Mainstream direction: Current work centers on executable GUI/computer-use agents,
    with benchmark papers expanding evaluation from static click success toward fine-grained
    subgoals, dynamic observation, drag interactions, and uncertainty calibration;
    method papers improve agents through verifiable task synthesis, weak supervision,
    or frozen-model harness optimization.'
  - 'Shared research pattern: Most papers use vision-language model backbones and
    evaluate on grounded GUI task completion; improvements are typically sought through
    data, task generation, action-interface coverage, evaluation granularity, or execution
    harness changes rather than through a single architectural novelty.'
  - 'Key differences: Interventions differ across model fine-tuning or RL, frozen-model
    harness optimization, keyframe/observation selection, and post-hoc uncertainty
    calibration; action interfaces span click, drag, video-guided dynamic screens,
    and mixed GUI/CLI workflows; evaluation metrics span Pass@1, subgoal checkpoints,
    cost-accuracy, uncertainty ranking transfer, and conformal coverage.'
  - 'Trend evolution: Within the 2024-2026 frontier, the topic is moving from static
    click-focused GUI benchmarks toward dynamic/living screens and richer action spaces,
    and from pure model training toward self-improvement, data efficiency, observation
    control, and calibration for deployment.'
  - 'Open questions: Cross-platform and cross-interface generalization remains unclear;
    current evidence often cannot separate model gains from harness, skill library,
    task synthesis, or evaluation priors; observation control and uncertainty robustness
    under distribution shift need further evidence.'
  related_work_outline_zh:
  - 主流方向：当前工作集中在可执行的GUI/计算机使用智能体，基准论文从静态点击成功扩展到细粒度子目标、动态观察、拖拽交互和不确定性校准；方法论文通过可验证任务合成、弱监督或冻结模型执行框架优化来提升智能体。
  - 研究共性：多数论文以视觉语言模型为骨干，在GUI截图或视频上评估任务完成或基础定位能力；改进通常来自数据、任务生成、动作接口覆盖、评估粒度或执行harness变化，而非单一新架构。
  - 关键差异：干预层面包括模型微调或RL、冻结模型harness优化、关键帧/观察选择、事后不确定性校准；动作接口涵盖点击、拖拽、视频引导动态屏幕和GUI/CLI混合流程；评估指标涵盖Pass@1、子目标检查点、成本-准确性、不确定性排名迁移和共形覆盖。
  - 趋势演进：在2024-2026前沿内，研究正从静态点击式GUI基准转向动态/活态屏幕和更丰富动作空间，并从纯模型训练转向自改进、数据效率、观察控制和面向部署的校准。
  - 开放问题：跨平台与跨接口泛化仍不清楚；现有证据常难以区分模型增益与harness、技能库、任务合成或评估先验的作用；观察控制和分布偏移下的不确定性鲁棒性仍需更多证据。
  literature_review:
    line_of_work_matrix:
    - line: Realistic GUI evaluation and fine-grained scoring
      what_it_solves: Covers real desktop, dynamic short-video, and drag-based interaction
        tasks beyond single click success, using subgoal, cost-aware, or multi-checkpoint
        metrics.
      what_remains_open: Coverage is domain-specific; transfer across operating systems,
        interface types, and dynamic content is not established, and several benchmark
        papers lack complete limitation or code/dataset details in this evidence packet.
    - line: Observation selection and dynamic interface control
      what_it_solves: Improves video-guided and living-screen GUI tasks by selecting
        task-relevant frames or diagnosing over- and under-observation.
      what_remains_open: No evaluated model reaches human-level cost-accuracy in the
        living-screen setting; whether gains come from keyframe selection, environment
        assumptions, or the underlying multimodal model remains unresolved.
    - line: Data-efficient and scalable GUI-agent training
      what_it_solves: Reduces annotation reliance through unannotated screenshots,
        verifiable generated tasks, or large drag interaction datasets, improving
        open-source computer-use performance.
      what_remains_open: Generalization beyond the reported benchmarks is not isolated;
        the relative contribution of curriculum design, RL, task distribution, and
        potential evaluation contamination remains under-specified.
    - line: Frozen-model harness and execution optimization
      what_it_solves: Improves GUI agents without updating backbone weights by aligning
        model outputs with screenshot evidence and optimizing the executable harness
        from repeated runs.
      what_remains_open: Evidence is limited to OSWorld-Verified and one transfer
        benchmark; attribution of gains to harness edits versus repeated-run variance,
        task selection, or scaffold priors needs more controlled study.
    - line: Uncertainty quantification for GUI grounding
      what_it_solves: Benchmarks post-hoc uncertainty methods and evaluates conformal
        click regions for spatial safety across open-weight and closed-source GUI
        grounding agents.
      what_remains_open: Evaluation is restricted to single-step grounding; cross-tier
        and cross-interface ranking transfer is weak, and conformal coverage degrades
        under calibration/test or interface shift.
    consensus:
    - 'The papers share an executable GUI/computer-use framing: agents observe screens
      or video, predict grounded actions, and are scored on task success or grounding
      accuracy.'
    - Vision-language models are the common backbone, while improvements are often
      sought through data, task generation, action-interface coverage, external harness
      changes, or post-hoc calibration rather than novel architecture alone.
    - There is convergence on finer evaluation signals beyond aggregate success, such
      as subgoal completion, information efficiency, and uncertainty quality.
    - Several works treat static or click-focused benchmarks as insufficient for deployment
      realism, especially around dynamic content, drag actions, observation control,
      and mixed GUI/CLI workflows.
    - 'System-level components matter: evidence often separates framework, skill library,
      harness, task synthesis, or calibration effects from raw model pass rates.'
    disagreements:
    - 'Where to intervene differs: some methods update model weights with weak supervision
      or RL tasks, while others freeze the model and optimize inputs/harness, and
      others only evaluate post-hoc uncertainty calibration.'
    - 'The supervision signal differs: unannotated screenshots, generated verifiable
      tasks, small high-quality human annotations, and no additional training signal
      are used across different works.'
    - 'Action interface and environment differ: click/point grounding, drag interaction,
      dynamic short-video observation, video-guided tasks, and combined GUI/CLI workflows
      are treated as separate evaluation spaces.'
    - 'Success metrics differ: aggregate Pass@1 and subgoal checkpoints, cost-accuracy
      observation efficiency, uncertainty ranking transfer, and conformal coverage
      each capture different agent properties.'
    - 'Deployment realism differs: real macOS desktop, browser-simulated living screens,
      containerized or synthetic OSWorld/ScienceBoard tasks, and video-guided benchmarks
      impose different controllability and domain constraints.'
    open_questions:
    - How well do benchmark-specific gains transfer across operating systems, dynamic
      interfaces, and action modalities?
    - Can future work isolate the contribution of model weights from harness, skill
      library, task synthesis, and evaluation priors?
    - What observation-control policy enables agents to balance information cost and
      task accuracy in living-screen and video-guided settings?
    - Can uncertainty quantification remain calibrated across multi-step trajectories,
      closed-source interfaces, and distribution shift?
    - Do weakly supervised and verifiable-RL training approaches remain robust to
      contamination, annotation artifacts, and task distribution changes when scaled
      beyond reported benchmarks?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 真实GUI评估与细粒度评分
      解决的问题: 覆盖真实桌面、动态短视频和拖拽交互任务，超越单一点击成功，引入子目标、成本感知或多检查点评分。
      尚未覆盖: 覆盖范围具有领域特定性；跨操作系统、界面类型和动态内容的迁移未建立，且若干基准论文在本证据包中缺少完整局限性与代码/数据集细节。
    - 路线: 观察选择与动态界面控制
      解决的问题: 通过选择任务相关帧或诊断过度/不足观察，提升视频引导和动态屏幕GUI任务表现。
      尚未覆盖: 在动态屏幕场景中尚无模型达到人类级成本-准确性；收益来自关键帧选择、环境假设还是底层多模态模型尚不明确。
    - 路线: 数据高效与可扩展GUI智能体训练
      解决的问题: 通过未标注截图、可验证生成任务或大规模拖拽数据降低标注依赖，提升开源计算机使用性能。
      尚未覆盖: 报告基准之外的泛化未隔离；课程设计、RL、任务分布和潜在评估污染的相对贡献仍不清晰。
    - 路线: 冻结模型harness与执行优化
      解决的问题: 在不更新骨干权重的情况下，通过将模型输出与截图证据对齐并从重复运行中优化执行harness来提升GUI智能体。
      尚未覆盖: 证据主要限于OSWorld-Verified和一个迁移基准；需要更受控研究来区分harness编辑、重复运行方差、任务选择或脚手架先验的收益。
    - 路线: GUI定位的不确定性量化
      解决的问题: 对事后不确定性方法进行基准测试，并评估共形点击区域在开源与闭源GUI定位智能体中的空间安全性。
      尚未覆盖: 评估仅限于单步定位；跨层级和跨接口排名迁移较弱，共形覆盖在校准/测试或接口偏移下下降。
    共识:
    - 论文共享可执行GUI/计算机使用框架：智能体观察屏幕或视频，预测可执行动作，并以任务成功或定位准确性评分。
    - 视觉语言模型是共同骨干，而改进常通过数据、任务生成、动作接口覆盖、外部harness变化或事后校准实现，而非仅靠新架构。
    - 研究正在收敛到更细粒度的评估信号，如子目标完成、信息效率和不确定性质量。
    - 多篇工作认为静态或点击式基准不足以反映部署现实，尤其涉及动态内容、拖拽动作、观察控制和GUI/CLI混合流程。
    - 系统级组件很重要：证据常将框架、技能库、harness、任务合成或校准效应与原始模型通过率区分开。
    分歧:
    - 干预位置不同：有的用弱监督或RL更新模型权重，有的冻结模型并优化输入/harness，有的仅评估事后不确定性校准。
    - 监督信号不同：未标注截图、生成式可验证任务、少量高质量人工标注和无新增训练信号在不同工作中并存。
    - 动作接口和环境不同：点击/点定位、拖拽交互、动态短视频观察、视频引导任务和GUI/CLI混合流程被视为不同评估空间。
    - 成功指标不同：聚合Pass@1与子目标检查点、成本-准确性观察效率、不确定性排名迁移和共形覆盖各自捕捉不同属性。
    - 部署真实性不同：真实macOS桌面、浏览器模拟动态屏幕、容器化或合成OSWorld/ScienceBoard任务以及视频引导基准带来不同的可控性和领域约束。
    开放问题:
    - 针对特定基准的收益在操作系统、动态界面和动作模态之间能多大程度迁移？
    - 未来工作能否隔离模型权重与harness、技能库、任务合成和评估先验的贡献？
    - 何种观察控制策略能让智能体在动态屏幕和视频引导设置中平衡信息成本与任务准确性？
    - 不确定性量化能否在多步轨迹、闭源接口和分布偏移下保持校准？
    - 弱监督和可验证RL训练方法在扩展到报告基准之外时，能否对污染、标注伪影和任务分布变化保持鲁棒？
