  literature_review:
    line_of_work_matrix:
    - line: Application-specific GUI agent benchmarks
      what_it_solves: Evaluate agents in realistic desktop, web, mobile, or dynamic
        interface tasks using fine-grained success, cost, or efficiency metrics.
      what_remains_open: Cross-platform transfer and whether benchmark gains correspond
        to real operational outcomes remain unclear.
    - line: Reusable skills and replay programs
      what_it_solves: Improve computer-use agents by providing multimodal skill libraries
        or compiling successful runs into screen-checked state-machine replays.
      what_remains_open: Robustness to unseen tasks, interface updates, changed workflows,
        and novel user goals remains untested in the available evidence.
    - line: Video-guided and living-screen GUI tasks
      what_it_solves: Ground agents in dynamic visual interfaces and video instructions,
        scoring both task accuracy and information efficiency.
      what_remains_open: Current agents still over- or under-observe and lack observation
        control; evidence is limited to short-video and video-guided settings.
    - line: Interaction-driven datasets beyond click
      what_it_solves: Cover drag-based GUI interactions such as text highlighting,
        cell selection, resizing, and slider manipulation for grounding and fine-tuning.
      what_remains_open: Whether improvements transfer to richer interaction sets
        and real applications is not established in the packet.
    - line: Multimodal foundation models for GUI control
      what_it_solves: Provide end-to-end vision-language grounding and navigation
        across mobile, desktop, and web platforms.
      what_remains_open: Benchmark breadth, generalization, and reproducible artifact
        evidence are incomplete in the visible fields.
    - line: Automated web environment and trajectory construction
      what_it_solves: Rebuild source-grounded reusable web environments and generate
        interaction trajectories for downstream agent fine-tuning.
      what_remains_open: Per-site setup and authorization, plus live-web drift, limit
        fully automated scaling beyond the studied sites.
    consensus:
    - Realistic executable environments and fine-grained or efficiency-aware metrics
      reveal differences that binary task success may miss.
    - Multimodal screen grounding and reusable artifacts such as skills, replay programs,
      or generated environments consistently improve success or efficiency.
    - The evidence shows a common gap between benchmark-specific gains and robust
      cross-application or real-world deployment.
    disagreements:
