  related_work_outline:
  - 'Mainstream direction: Real-world GUI/computer-use agent benchmarks with fine-grained,
    efficiency-aware, and uncertainty-aware evaluation, alongside skill, harness,
    and training improvements validated on those benchmarks.'
  - 'Shared research pattern: Researchers decompose performance into sub-goal completion,
    observation cost, and grounding uncertainty; they compare multiple backbones and
    frameworks in real or browser-simulated environments.'
  - 'Key differences: Static desktop vs dynamic platform settings; single-step grounding
    vs multi-step trajectories; aggregate success vs cost-accuracy or uncertainty;
    frozen-model harness/skill editing vs online RL, weak supervision, or keyframe
    extraction.'
  - 'Trend evolution: Available top-paper evidence is concentrated in 2026; within
    this current frontier, work is shifting from static success rates toward observation
    control, fine-grained scoring, verifiable training, and uncertainty calibration.'
  - 'Open questions: Cross-platform and cross-model metric transfer, trajectory-level
    uncertainty, observation control, generalization of training/harness improvements,
    and dataset coverage beyond current platforms.'
  related_work_outline_zh:
  - 主流方向：面向真实 GUI/计算机使用智能体的基准设计，配套细粒度、效率感知与不确定性感知的评测，以及技能、执行框架和训练方法的改进验证。
  - 研究共性：研究者将表现分解为子目标、观察成本、定位不确定性等信号，在真实或浏览器模拟环境中进行多基座、多框架比较。
  - 关键差异：静态桌面与动态平台；单步定位与多步轨迹；总体成功率与成本-准确率或不确定性；冻结模型 harness/skill 编辑与在线 RL、弱监督或关键帧提取。
  - 趋势演进：现有高相关证据集中在 2026 年；在当前前沿内，工作正从静态成功率转向观察控制、细粒度评分、可验证训练与不确定性校准。
  - 开放问题：跨平台跨模型指标迁移、轨迹级不确定性、观察控制、训练/执行框架改进的泛化，以及数据集的领域覆盖不足。
  literature_review:
    line_of_work_matrix:
    - line: Real-world and dynamic environment benchmark design
      what_it_solves: Constructs shared GUI agent tasks across real desktop apps,
        mixed GUI+CLI workflows, and browser-simulated dynamic short-video interfaces
        so agent ability becomes comparable.
      what_remains_open: Whether task distributions generalize across mobile, web,
        OS, and other dynamic interfaces; current evidence is strongest for macOS
        and short-video platforms.
    - line: Fine-grained evaluation and stress-test metrics
      what_it_solves: Decomposes agent performance into sub-goal completion, observation
        cost-accuracy, and grounding uncertainty instead of relying only on aggregate
        success.
      what_remains_open: Cross-model and cross-interface transfer of rankings is weak;
        uncertainty evaluation stops at single-step grounding rather than multi-step
        trajectories.
    - line: Skill, harness, and training improvements evaluated on benchmarks
      what_it_solves: Improves GUI/computer-use agents through multimodal skill libraries,
        harness evolution around frozen models, verifiable task synthesis with online
        RL, or weak supervision from unannotated screenshots.
      what_remains_open: Whether gains transfer across frameworks, backbones, and
        environments is uncertain; several claims lack limitation or artifact details,
        so verification is incomplete.
    - line: Video-guided GUI tasks and keyframe extraction
      what_it_solves: Connects video inputs to GUI actions through generalized keyframe
        extraction and a benchmark for video-guided interactive tasks.
      what_remains_open: Evaluation evidence remains mainly video question answering
        plus a single GUI benchmark; multi-step agent trajectory value is still underexplored.
    consensus:
    - Benchmarks now target realistic interface conditions such as mixed GUI+CLI workflows,
      dynamic content changes between actions, and information efficiency.
    - 'Evaluation is moving beyond Pass@1: sub-goal checkpoints, capability annotations,
      observation cost, and uncertainty rankings reveal differences hidden by aggregate
      scores.'
    - Studies compare multiple model backbones and frameworks, making model ability
      more separable from harness or skill-library contributions.
    - Current agents still fail on observation control and fine-grained execution
      even when top configurations achieve moderate overall success.
    - Several papers show code, dataset, or artifact availability signals, but missing
      limitation statements and sparse citation metadata remain verification gaps.
    disagreements:
    - Some work evaluates static desktop task success, while others make dynamic living-screen
      cost-accuracy the primary target.
    - Single-step grounding evaluation differs from multi-task, multi-step agent trajectory
      assessment.
    - 'Improvement locus differs: frozen-model harness or skill editing, online RL
      with synthesized verifiable tasks, weak supervision from unannotated screenshots,
      or video-guided keyframe extraction.'
    - 'Deployment settings differ: real macOS desktop apps, browser-based short-video
      simulation, OSWorld/ScienceBoard/WindowsAgentArena, and GUI grounding datasets.'
    - Some papers report task success without explicit limitations, while others constrain
      conclusions by platform or single-step scope.
    open_questions:
    - Do fine-grained and uncertainty metrics transfer across unseen platforms, interfaces,
      and closed-source models without target-specific re-evaluation?
    - How can observation control be measured and improved beyond short-video or single-app
      benchmark environments?
    - Which training or harness improvements generalize across frameworks and backbones
      instead of being benchmark-specific wins?
    - Can uncertainty and stress-test benchmarks be extended from single-step grounding
      to full agent trajectories?
    - Are current datasets representative enough for mobile, web, and operating-system
      automation outside the evaluated macOS, browser, short-video, and OSWorld-style
      settings?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 真实与动态环境基准设计
      解决的问题: 构造跨真实桌面应用、GUI+CLI 混合工作流和浏览器模拟动态短视频界面的共享任务，使智能体能力可比较。
      尚未覆盖: 任务分布是否覆盖移动、Web、OS 及其他动态界面；现有证据主要来自 macOS 和短视频平台。
    - 路线: 细粒度评测与压力测试指标
      解决的问题: 将智能体表现分解为子目标完成、观察成本-准确率与定位不确定性，而非只看总体成功率。
      尚未覆盖: 跨模型、跨界面排名迁移较弱；不确定性评测止于单步定位，未覆盖多步轨迹。
    - 路线: 技能、执行框架与训练改进的基准评测
      解决的问题: 通过多模态技能库、围绕冻结模型的执行框架演进、可验证任务合成与在线强化学习、未标注截图弱监督来提升 GUI 智能体。
      尚未覆盖: 提升是否跨框架、基座和环境迁移仍不确定；若干工作缺少局限或工件细节，验证不完整。
    - 路线: 视频引导的 GUI 任务与关键帧提取
      解决的问题: 通过广义关键帧提取和视频引导交互任务基准连接视频输入与 GUI 动作。
      尚未覆盖: 评测证据主要限于视频问答加一个 GUI 基准；多步智能体轨迹价值仍不充分。
    共识:
    - 基准开始面向真实界面条件：混合 GUI+CLI、动作间动态内容变化以及信息效率。
    - 评测普遍超越 Pass@1，报告子目标检查点、能力标注、观察成本和不确定性排序，以揭示总分掩盖的差异。
    - 研究普遍覆盖多个模型基座和执行框架，使模型能力与技能库或框架贡献更容易区分。
    - 当前智能体仍然在观察控制和细粒度执行上失败，即使顶层配置达到中等总体成功率。
