    - 'Interaction format differs: video-guided keyframes, mobile long-horizon UI,
      browser multi-step attacks, SMS-to-webpage fraud chains, and screen recording
      tutorials require distinct protocols.'
    - 'Model observability differs: open-weight models allow hidden-state and density-based
      analysis, while closed-source APIs restrict evaluation to externally observable
      signals.'
    - 'Safety evidence differs by domain: browser prompt-injection resistance appears
      strong, while coding skill-injection vulnerability can be much higher, suggesting
      domain-conditioned rather than general safety.'
