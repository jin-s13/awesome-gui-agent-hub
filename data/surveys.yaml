  - 趋势演进：2026年证据从静态单帧定位转向轨迹级和执行级能力，包括可回放记忆、真实浏览器在线强化学习、原生计算机使用智能体与诊断式基准层。
  - 开放问题：错误恢复在强化学习后仍然偏弱；框架设计与确定性回放边界尚缺乏证据；离线基准未覆盖异步时序；跨平台与按应用泛化仍待验证。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end trainable agent frameworks and deployment stacks
      what_it_solves: Turning multimodal models into runnable computer/web agents
        with training, rollout, and evaluation pipelines.
      what_remains_open: Robustness across harnesses, hardware, live sites, and external
        environments; error recovery after policy optimization.
    - line: Unified action-space and architecture design
      what_it_solves: Representing GUI clicks, typing, and code execution, or diffusion-based
        generation, within a single agent policy.
      what_remains_open: Cross-platform transfer and complex action-payload reasoning;
        generalization evidence remains bounded by reported benchmarks and operating
        systems.
    - line: Weakly supervised and data-efficient agent learning
      what_it_solves: Reducing annotation cost by learning visual grounding from unannotated
        screenshots, then calibrating with small high-quality data or RL.
      what_remains_open: Calibration quality under minimal high-quality data and transfer
        to complex, dynamic workflows.
    - line: Reusable skills and execution-level memory
      what_it_solves: Converting validated GUI trajectories into callable multimodal
        skills or memories to reduce token and execution time cost.
      what_remains_open: Replay is limited to deterministic runtime preconditions;
        ambiguous or incompatible steps still require fresh planning.
    - line: Step-level diagnostic evaluation and transition understanding
      what_it_solves: Testing whether models can reconstruct GUI state transitions,
        source tracking, and context-aware control beyond end-task success.
      what_remains_open: Offline evaluation omits asynchronous timing and live dynamics;
        Linux desktop and limited action vocabulary constrain generalization.
    consensus:
    - There is a shared move toward environment-verifiable execution instead of isolated
      UI grounding.
    - Visual state is treated as first-class evidence for UI element identification
      and workflow verification.
    - Supervised fine-tuning is usually a warm start, while online RL or verifier-based
      rewards are used to lift long-horizon success.
    - Evaluation is shifting from single-frame grounding toward trajectory-level or
      end-task reliability, though diagnostic layers remain underdeveloped.
    disagreements:
    - 'Supervision type: weak labels from unannotated screenshots versus hybrid verifiable
      supervision versus live online RL.'
    - 'Action representation: GUI pointer/keyboard actions, unified GUI-plus-code
      execution, or retrieved replayable skills.'
    - 'Generation and policy form: one route explores block-wise diffusion, while
      other work emphasizes RL or data efficiency rather than changing generation
      mechanics.'
    - 'Reuse strategy: explicit memory/skill artifact retrieval versus end-to-end
      policy learning without retrieval.'
    - 'Evaluation level: end-to-end task success versus offline step-level transition
      understanding, which may not capture live dynamics.'
    open_questions:
    - Why does error recovery remain weak after RL training in runnable frameworks?
    - How much do harness design and multi-process complexity affect trainability
      and final agent capability?
    - Can execution-level replayable memories generalize beyond deterministic runtime
      preconditions while preserving token and time savings?
    - Do offline step-level transition benchmarks transfer to live asynchronous GUI
      settings and other operating systems?
    - At what point does weak supervision from unannotated screenshots require high-quality
      verifiable or annotated data to keep improving?
