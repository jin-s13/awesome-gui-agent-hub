  - 'Shared research pattern: Papers couple an agent harness or environment with trajectories/tasks
    and use execution success or task-specific checkers to reveal capability gaps
    beyond static model outputs.'
  - 'Key differences: Supervision ranges from weak annotation-free grounding (GUICrafter)
    to online multi-turn RL; evaluation targets span end-task success, step-level
    transition reasoning, token/time cost, and specialized scientific software use.'
  - 'Trend evolution: The available evidence is concentrated in 2026, so the observable
    trend is within the current frontier: moving from standalone GUI policies toward
    trainable, deployable, and diagnosable agent systems that integrate live or containerized
    execution.'
  - 'Open questions: Evidence is missing or limited for cross-deployment generalization,
    error recovery after RL, harness-specific trainability, deterministic memory portability,
    and transfer from offline diagnostics to live asynchronous GUI environments.'
  related_work_outline_zh:
  - 主流方向：构建可运行的GUI/计算机使用智能体系统，重点在在线强化学习训练框架、技能与记忆编排，以及执行导向的诊断/基准环境。
  - 研究共性：将智能体框架或执行环境与轨迹/任务配对，并以执行成功或任务检查器揭示模型静态输出之外的能力差距。
  - 关键差异：监督信号从弱监督未标注截图到在线多轮强化学习不等；评测目标覆盖端到端成功、步骤级转换、token/时间开销和科学软件使用。
  - 趋势演进：可见证据集中在2026年，趋势限于当前前沿：从独立GUI策略转向可训练、可部署、可诊断的智能体系统。
  - 开放问题：跨部署泛化、强化学习后的错误恢复、框架可训练性、确定性记忆迁移，以及离线诊断到实时异步GUI环境的转移仍缺少证据。
  literature_review:
    line_of_work_matrix:
    - line: Harness-integrated reinforcement-learning training stacks
      what_it_solves: End-to-end policy improvement for GUI, web, and computer-use
        agents inside the same harnesses used for deployment, including live-browser
        and containerized rollouts.
      what_remains_open: Error recovery remains weak after RL, and some harnesses
        are substantially harder to learn than others; cross-team reproduction and
        live infrastructure drift are not yet evidenced.
    - line: Data-efficient policy acquisition from weak supervision
      what_it_solves: Reduces dependence on expensive human GUI annotations by using
        large-scale unannotated screenshots for visual grounding before small-data
        RL calibration.
      what_remains_open: Evidence is limited to reported screenshot and webpage settings;
        generalization to live, multi-step, asynchronous computer-use tasks and failure
        recovery is not covered.
    - line: Reusable skill and replayable-memory orchestration
      what_it_solves: Caches validated GUI procedures as multimodal skills or parameter-controlled
        memories to cut token cost, execution time, and repeated planning.
      what_remains_open: Deterministic applicability checks reject ambiguous or incompatible
        steps, so portability across applications, UI changes, and long-horizon recovery
        remains unresolved.
    - line: Alternative multimodal generation backbones
      what_it_solves: Brings block-wise diffusion generation to vision-language GUI
        agents, targeting grounding and navigation across mobile, desktop, and web
        platforms.
      what_remains_open: Visible evidence lacks limitation analysis and does not establish
        serving latency, throughput, or deployment-scale trade-offs for real-time
        interactive use.
    - line: Execution-based diagnostic and domain benchmarks
      what_it_solves: Provides granular capability measurement for GUI transition
        understanding and scientific software workflows beyond aggregate end-task
        success.
      what_remains_open: Offline, Linux-desktop, and predefined action-vocabulary
        settings limit transfer to live asynchronous interactions, other platforms,
        and open-ended software workflows.
    consensus:
    - 'Execution-based evaluation is central: systems are judged through task success,
      artifact checks, or environment state rather than static prediction only.'
    - Harness and environment design materially affects agent capability; training,
      memory, and evaluation are increasingly coupled to actual deployment interfaces.
    - Current computer-use agents still show substantial gaps in state verification,
      recovery, and specialized software use even when using strong base models.
    - 'Published artifacts are uneven: several papers report open frameworks or benchmark
      environments, but limitation and reproducibility evidence is not uniformly available.'
    disagreements:
    - 'Supervision signal differs: weak grounding from unannotated screenshots versus
      online multi-turn reinforcement learning versus retrieval-style skill or memory
      execution.'
    - 'What the system optimizes differs: end-task success, step-level transition
      understanding, token/time cost, or domain-specific scientific utility.'
    - 'Interaction and representation choices differ: multimodal skill files with
      visual figures and an MCP tool, parameter-controlled replayable trajectory memory,
      or a diffusion-based multimodal policy.'
    - 'Deployment setting differs: containerized multi-process harness rollouts, live
      web browsing, offline Linux desktop diagnostics, and expert-designed scientific
      software environments.'
    open_questions:
    - Why do error recovery and harness-specific trainability remain weak after reinforcement
      learning, and which framework properties improve them?
    - Can weakly supervised visual grounding from unannotated screenshots transfer
      reliably to live multi-step GUI tasks?
    - How far can deterministic replayable memory scale before exact preconditioning
      or incompatible steps block generalization?
    - Do offline GUI transition diagnostics predict performance in live asynchronous
      computer-use environments?
    - Which scientific software capabilities are missing from current VLMs, and which
      failures reflect harness or evaluation artifacts?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 与框架集成的强化学习训练栈
      解决的问题: 在部署所用的真实框架和环境中对GUI、网页及计算机使用智能体进行端到端策略改进，包括实时浏览器和容器化rollout。
      尚未覆盖: 强化学习后的错误恢复仍弱，且部分框架更难训练；跨团队复现和实时基础设施漂移尚缺证据。
    - 路线: 弱监督下的数据高效策略获取
      解决的问题: 利用海量未标注截图进行视觉定位，再以少量高质量数据校准，降低GUI智能体对昂贵人工标注的依赖。
      尚未覆盖: 证据限于所报告的截图与网页设置，尚未覆盖实时多步异步计算机使用任务和失败恢复。
    - 路线: 可复用技能与可回放记忆编排
      解决的问题: 将验证过的GUI流程缓存为多模态技能或参数可控记忆，以降低重复规划、token成本和执行时间。
      尚未覆盖: 确定性适用检查会拒绝模糊或不兼容步骤，跨应用、UI变化和长程恢复的可迁移性仍未解决。
    - 路线: 替代性多模态生成骨干
      解决的问题: 将块级扩散生成引入视觉语言GUI智能体，目标覆盖移动、桌面和网页平台的grounding与导航。
      尚未覆盖: 可见证据缺少局限性分析，实时交互所需的推理延迟、吞吐和部署规模权衡尚不明确。
    - 路线: 执行导向的诊断与领域基准
      解决的问题: 在最终任务成功之外，细粒度测量GUI状态转换理解和科学软件工作流能力。
      尚未覆盖: 离线、Linux桌面和预定义动作词表限制其向实时异步交互、其他平台及开放软件工作流的迁移。
    共识:
    - 执行导向评测处于核心位置：系统通过任务成功、产物检查或环境状态来判定，而非仅依赖静态预测。
    - 框架与环境设计显著影响智能体能力；训练、记忆和评测越来越与实际部署接口耦合。
    - 即使使用强基础模型，当前计算机使用智能体在状态验证、错误恢复和专业软件使用上仍存在明显差距。
    - 已发布工件完整性不一：多篇论文报告了开源框架或基准环境，但局限性与可复现证据并非普遍完整。
    分歧:
    - 监督信号不同：未标注截图的弱监督、在线多轮强化学习、以及检索式技能或记忆执行并存。
    - 系统优化目标不同：端到端任务成功、步骤级转换理解、token/时间开销或领域科学价值。
    - 交互与表示方式不同：含视觉图形和MCP工具的多模态技能文件、参数可控回放轨迹记忆，或扩散式多模态策略。
    - 部署设置不同：容器化多进程框架rollout、实时网页浏览、离线Linux桌面诊断和专家科学软件环境。
    开放问题:
    - 为什么强化学习后的错误恢复和框架特定可训练性仍然较弱，哪些框架特性可以改善？
    - 未标注截图上的弱监督视觉定位能否可靠迁移到实时多步GUI任务？
    - 确定性回放记忆在精确前置条件不再满足时能扩展到何种程度？
    - 离线GUI转换诊断能否预测实时异步计算机使用环境中的性能？
    - 当前VLM缺失哪些科学软件能力，哪些失败来自框架或评测误差？
