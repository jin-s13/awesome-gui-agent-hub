  literature_review:
    line_of_work_matrix:
    - line: Realistic GUI task benchmarking
      what_it_solves: Measures end-to-end completion of multi-application desktop
        tasks with fine-grained sub-goal scoring, including GUI and CLI workflows.
      what_remains_open: Coverage is limited to specific operating systems and application
        sets; evidence does not yet show cross-platform transfer or formal task-abstraction
        boundaries.
    - line: Knowledge and skill augmentation
      what_it_solves: Encodes application-specific procedural and visual knowledge
        to improve UI element identification and workflow state verification.
      what_remains_open: Generalization beyond evaluated applications and the cost
        of constructing and maintaining multimodal skill artifacts remain unclear.
    - line: Dynamic and interaction-specific evaluation
      what_it_solves: Exposes agents to changing interfaces and non-click actions
        such as drag, measuring observation control and interaction grounding.
      what_remains_open: Task suites are mostly limited to single platforms; methods
        still lack adaptive observation control and broad interaction-type coverage.
    - line: Self-improvement and sample-efficient training
      what_it_solves: Reduces annotation cost or frozen-model limitations through
        harness evolution, verifiable task synthesis, online reinforcement learning,
        or weak supervision from unannotated screenshots.
      what_remains_open: Cross-benchmark transfer, verifier or reward quality, and
        composition of these improvements have not been established.
    - line: Reliability and uncertainty quantification
      what_it_solves: Benchmarks post-hoc uncertainty for GUI grounding and evaluates
        spatial safety via conformal click regions.
      what_remains_open: Evaluation covers single-step grounding only; cross-model
        and cross-interface transfer is weak, and calibration degrades under distribution
        shift.
    consensus:
    - 'Fine-grained evaluation matters: success-rate alone can hide differences in
      sub-goal completion, observation cost, or grounding quality.'
    - Visual and interface-grounded context improves GUI agents more than text-only
      abstraction, especially for UI element identification.
    - Frozen or lightly tuned backbone models can be substantially improved through
      external context, harness optimization, or limited reinforcement learning and
      calibration.
    - Reliability is treated mainly as an empirical benchmark property such as uncertainty
      ranking, observation efficiency, or interaction coverage, not as a formal safety
      guarantee.
    disagreements:
    - 'Where to intervene: methods vary among modifying skill context, optimizing
      the execution harness, training with reinforcement learning, using weak supervision,
      or applying post-hoc uncertainty calibration.'
    - 'What to evaluate: real desktop multi-application task completion, dynamic living-screen
      behavior, non-click drag interactions, and single-step GUI grounding are separate
      evaluation targets with different assumptions.'
    - 'Which supervision or reward signal is sufficient: unannotated screenshots,
      verifiable docker rollouts, repeated-run evidence, and rule-based scoring are
      used but not shown to be equivalent.'
    - 'How to define reliability: observation control through cost-accuracy, uncertainty
      ranking for grounding, and interaction-type coverage do not yet share a common
      metric.'
    open_questions:
    - Do improvements on current GUI benchmarks transfer to unseen operating systems,
      application styles, and dynamic interface regimes?
    - Can observation control and uncertainty calibration be combined into a single
      multi-step reliability framework?
    - Which intervention layers, such as skills, harnesses, training, and calibration,
      compose without conflict or redundant cost?
    - What minimal formal task abstraction would support safety and reliability claims
      beyond benchmark-specific results?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 真实GUI任务基准测试
      解决的问题: 衡量多应用桌面任务的端到端完成情况，并提供跨GUI与CLI的细粒度子目标评分。
      尚未覆盖: 覆盖范围限于特定操作系统和应用集；缺少跨平台迁移与正式任务抽象边界证据。
    - 路线: 知识与技能增强
      解决的问题: 编码应用特定的流程与视觉知识，以改善UI元素识别和工作流状态验证。
      尚未覆盖: 跨应用泛化以及多模态技能工件的构建与维护成本仍不清楚。
    - 路线: 动态与交互特定评测
      解决的问题: 将代理暴露于动态变化界面和拖拽等非点击操作，测量观察控制与交互定位。
      尚未覆盖: 任务套件多限于单一平台；方法仍缺少自适应观察控制和更广交互类型覆盖。
    - 路线: 自改进与样本高效训练
      解决的问题: 通过执行框架演进、可验证任务合成、在线强化学习或未标注截图的弱监督，降低标注成本并提升冻结模型性能。
      尚未覆盖: 跨基准迁移、验证器或奖励质量，以及这些改进之间的可组合性尚未被验证。
    - 路线: 可靠性与不确定性量化
      解决的问题: 评测GUI定位的后验不确定性，并通过共形点击区域评估空间安全。
      尚未覆盖: 仅覆盖单步定位；跨模型与跨接口迁移弱，且校准在分布偏移下会退化。
    共识:
    - 细粒度评测很重要：仅看成功率会掩盖子目标完成、观察成本或定位质量的差异。
    - 视觉与界面上下文比纯文本抽象更能提升GUI代理，尤其对UI元素识别。
    - 冻结或轻调骨干模型可通过外部上下文、执行框架优化或有限强化学习与校准获得明显提升。
    - 可靠性主要以不确定性排序、观察效率或交互覆盖等经验基准属性呈现，而非正式安全保证。
    分歧:
    - 干预层级不同：有的修改技能上下文，有的优化执行框架，有的使用强化学习训练，有的采用弱监督，有的进行后验不确定性校准。
