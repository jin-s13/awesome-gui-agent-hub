    - Does retaining visual or structured context improve long-horizon reliability
      across interface variability without excessive cost?
    - Can GUI-grounding uncertainty be made transferable across model classes and
      interfaces while covering multi-step trajectories?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准与任务抽象：MacAgentBench、LivingScreen、DragOn
      解决的问题: 将评测从静态点击式 GUI 扩展到多应用桌面 GUI+CLI、动态短视频界面和拖拽式交互原语。
      尚未覆盖: 这些套件向其他界面的迁移尚未得到证明；指标与套件绑定，动态观察控制仍是能力缺口。
    - 路线: 可验证与弱监督训练数据扩展：ScaleCUA、GUICrafter
      解决的问题: 通过生成可验证任务和使用未标注截图进行视觉定位，减少人工标注或支撑在线 RL。
      尚未覆盖: 证据主要集中在 OSWorld 与 ScienceBoard 或有限对比；向动态、拖拽、移动和多应用场景的迁移尚未确立。
    - 路线: 技能与上下文增强：VISUALSKILL、MemGUI-Agent
      解决的问题: 提供多模态程序性技能工件和紧凑、主动管理的长时域上下文，以改善动作定位和工作流状态验证。
      尚未覆盖: 在已报告 CLI/移动基准之外的泛化有限；工件构建与上下文动作训练假设需要更广泛验证。
    - 路线: 可靠性与不确定性框架：Argus
      解决的问题: 对 GUI grounding 事后不确定性量化进行基准测试，并引入用于空间安全的共形点击区域。
      尚未覆盖: 仅限于单步 grounding；UQ 排名跨模型层级和接口迁移较弱，共形覆盖在分布偏移下下降。
    共识:
    - 当前 GUI 代理研究正在转向更真实的任务抽象与更细粒度的评估信号，而非只看最终任务成功。
    - 前沿 VLM 在动态观察控制、拖拽交互、长时域上下文和不确定性校准的可靠性方面仍有明显差距。
    - 技能条件、弱监督、在线 RL 和显式上下文管理等目标干预带来可测量的提升。
    - 许多结果在较窄的基准族上报告，跨基准与部署迁移证据仍然不足。
    分歧:
    - 评测目标不同：静态多应用桌面任务完成、动态短视频成本准确性、拖拽交互成功、移动长时域完成、单步 grounding 不确定性。
    - 监督与训练策略不同：可验证在线 RL、基于截图的弱监督、推理时多模态技能检索、有监督上下文动作管理。
