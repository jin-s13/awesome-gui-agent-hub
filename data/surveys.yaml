  literature_review:
    line_of_work_matrix:
    - line: Task abstraction and benchmark formalization for executable GUI evaluation
      what_it_solves: Converts real GUI work into measurable task suites, scoring
        rules, and interface/action assumptions across applications or dynamic feeds.
      what_remains_open: Coverage is limited to selected platforms and interaction
        types; formal assumptions are not yet validated against broader agent behavior.
    - line: Formal interaction assumptions for dynamic GUI agents
      what_it_solves: Clarifies how agents must observe and control interfaces where
        content changes between actions, making evaluation claims more precise.
      what_remains_open: Only the short-video dynamic case is formalized in the packet;
        there is no broader cross-setting theory or empirical validation.
    - line: Frozen-model skill and harness adaptation
      what_it_solves: Improves execution reliability without retraining by organizing
        multimodal skills or optimizing the harness from observed action effects.
      what_remains_open: Transfer evidence beyond reported benchmarks is thin, and
        missing limitation or artifact details leave reproducibility gaps.
    - line: Data-efficient training and verifiable or weak supervision
      what_it_solves: Reduces reliance on costly human annotations through synthesized
        verifiable tasks, online RL, and visual grounding from unannotated screenshots.
      what_remains_open: Limitations are largely absent; whether these training regimes
        predict failure modes or transfer to unseen interfaces is not directly validated.
    - line: Uncertainty quantification and spatial safety for GUI grounding
      what_it_solves: Benchmarks post-hoc uncertainty and calibrated click regions
        for executable grounding decisions.
      what_remains_open: Evidence is restricted to single-step grounding; cross-model
        and cross-interface transfer is weak, and coverage degrades under distribution
        shift.
    - line: Expanded interaction taxonomies for drag and living-screen tasks
      what_it_solves: Moves GUI evaluation beyond click-centric assumptions to drag
        actions and dynamic, changing interfaces.
      what_remains_open: Platform and action-space coverage remains narrow, and no
        evidence shows these taxonomies yet alter downstream model or system design.
    consensus:
    - Fine-grained evaluation is necessary because similar overall success can hide
      differences in sub-goal completion, observation cost, or reliability.
    - External skills, harness changes, and verifiable or weakly supervised data can
      improve GUI agents without necessarily changing backbone weights.
    - Current agents are not reliable enough for dynamic or deployment-like settings;
      observation control, uncertainty transfer, and interface shift remain weak.
    - Deterministic or verifiable task evaluation is favored when possible, but it
      does not yet cover multi-step uncertainty or all interaction types.
    disagreements:
    - Some studies assume static or task-level desktop environments, while others
      formalize living-screen interfaces where content changes between actions.
    - Some improve performance by optimizing the execution harness or skill library
      around frozen models, while others train or fine-tune backbones via RL or weak
      supervision.
    - Some evaluate single-step executable grounding for uncertainty and spatial safety,
      while others evaluate multi-step, multi-application, or dynamic workflows, so
      reliability findings may not transfer.
    - 'Interaction coverage differs substantially: click/type and GUI+CLI, drag, and
      dynamic short-video each imply distinct action and observation spaces.'
    open_questions:
    - Can post-hoc uncertainty quantification be extended from single-step GUI grounding
      to full multi-step trajectories with formal coverage guarantees?
    - Do harness- or skill-based improvements transfer to unseen applications and
      interfaces beyond the reported evaluation suites?
    - Which formal observation-control and action-space assumptions are necessary
      for dynamic, drag-based, and multi-application GUI agents?
    - How well do fine-grained benchmark gains and verifiable training signals predict
      failure modes, robustness, or safety in real deployments?
