  literature_review:
    line_of_work_matrix:
    - line: Agent training frameworks and infrastructure
      what_it_solves: Turning a base model into a deployable GUI agent through end-to-end
        reinforcement learning with scalable rollout and orchestration layers.
      what_remains_open: Error recovery remains weak after RL; harness design heavily
        influences trainability, and cross-environment generalization is not yet demonstrated.
    - line: Multi-modal skill libraries and knowledge grounding
      what_it_solves: Improving agent performance by retaining visual figures alongside
        textual instructions, reducing grounding errors and state misinterpretation.
      what_remains_open: How to dynamically update the skill library for new applications
        and whether the approach scales to open-ended desktop environments.
    - line: Data-efficient and weakly supervised training
      what_it_solves: Reducing the need for expensive human annotation by leveraging
        large-scale unannotated screenshots and curriculum learning.
      what_remains_open: Performance ceiling compared to RL-trained agents on complex
        multi-step tasks, and the boundary of what can be learned from static screenshots
        alone.
    - line: Diagnostic benchmarks for GUI understanding
      what_it_solves: Isolating specific failure dimensions such as state verification,
        temporal ordering, and context-aware control beyond end-task success.
      what_remains_open: Offline metrics may not transfer to live asynchronous dynamics;
        current benchmarks are limited to Linux desktops and a fixed action vocabulary.
    - line: Safety and robustness evaluation
      what_it_solves: Measuring and hardening agent resilience against prompt injection
        and skill misuse, revealing domain-conditioned safety behaviors.
      what_remains_open: Hardening does not generalize across domains (e.g., browser
        vs. coding); RL-optimized attacks remain untested, and reproducibility of
        prior red-teaming results is low.
    - line: Visual memory representation and failure analysis
      what_it_solves: Diagnosing how full-image memory can increase action-level errors
        and proposing action-grounded visual memory to improve task success.
      what_remains_open: Whether the memory strategy generalizes to diverse GUI layouts
        and whether the failure taxonomy applies to RL-trained agents.
    consensus:
    - Screenshot-based visual perception is the dominant input modality, with a shift
      away from reliance on DOM or accessibility trees.
    - Reinforcement learning is a key enabler for improving agent performance beyond
      static supervised fine-tuning.
    - Scalable, containerized infrastructure is necessary for training and evaluating
      agents on live or realistic environments.
    - Evaluation must move beyond task success rate to include step-level diagnostics,
      safety, and transition understanding.
    - Visual memory matters, but naive full-image approaches can introduce action-level
      errors.
    disagreements:
    - 'Visual memory representation: some works retain full screenshots, while others
      propose action-grounded local crops, with conflicting evidence on which reduces
      grounding errors.'
    - 'Safety generalization: frontier agents show strong resistance to hand-crafted
      attacks in browser tasks but remain vulnerable in coding tasks, suggesting domain-conditioned
      safety rather than global robustness.'
    - 'Training data scale: one line achieves competitive results with only 0.1% of
      the data used by another, questioning whether massive data collection is necessary
      or if curriculum and weak supervision suffice.'
    - 'Interaction modality: native screenshot-only agents contrast with designs that
      incorporate DOM or accessibility metadata, revealing a trade-off between generality
      and precision.'
    open_questions:
    - Can purely visual agents handle tasks that require precise text selection or
      understanding of hidden UI states without additional structured input?
    - How can error recovery be systematically improved through RL or memory design
      without making the training pipeline overly complex?
    - What are the minimal data requirements for training a GUI agent that generalizes
      across operating systems and application domains?
    - How can safety mechanisms be made robust across all agent domains, and what
      evaluation protocols would reliably detect remaining vulnerabilities?
    - To what extent do offline diagnostic benchmarks predict real-world, latency-sensitive
      performance in interactive settings?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 智能体训练框架与基础设施
      解决的问题: 通过可扩展的强化学习框架和编排层，将基础模型转变为可部署的GUI智能体。
      尚未覆盖: 错误恢复在RL后依然薄弱；框架设计显著影响可训练性；跨环境泛化尚未验证。
    - 路线: 多模态技能库与知识接地
      解决的问题: 通过保留视觉图形与文本指令，提升智能体性能，减少接地错误和状态误判。
      尚未覆盖: 如何动态更新技能库以适应新应用，以及该方法是否能扩展到开放式桌面环境。
    - 路线: 数据高效与弱监督训练
      解决的问题: 利用大规模未标注截图和课程学习，降低对昂贵人工标注的依赖。
      尚未覆盖: 在复杂多步骤任务上与RL智能体的性能上限比较，以及仅从静态截图能学到什么边界。
    - 路线: GUI理解的诊断基准
      解决的问题: 分离并测量状态验证、时序排序和上下文感知控制等具体失败维度，超越最终任务成功。
      尚未覆盖: 离线指标可能无法迁移到实时异步动态；现有基准仅限于Linux桌面和固定动作集。
    - 路线: 安全性与鲁棒性评估
      解决的问题: 测量并加固智能体抵抗提示注入和技能误用的能力，揭示领域条件安全行为。
      尚未覆盖: 加固不跨领域泛化（如浏览器 vs 编码）；RL优化的攻击未测试；先前红队结果可复现性低。
    - 路线: 视觉记忆表示与失败分析
      解决的问题: 诊断全图像记忆为何增加动作级错误，并提出动作接地视觉记忆以提升任务成功率。
      尚未覆盖: 记忆策略是否能泛化到多样GUI布局，以及失败分类法是否适用于RL训练的智能体。
    共识:
    - 基于截图的视觉感知是主导输入模态，减少对DOM或可访问性树的依赖。
    - 强化学习是提升智能体性能、超越静态监督微调的关键手段。
    - 可扩展的容器化基础设施对在真实或仿真环境中训练和评估智能体至关重要。
    - 评估必须从任务成功率延伸到步骤级诊断、安全性和过渡理解。
    - 视觉记忆很重要，但朴素的全图像方法可能引入动作级错误。
    分歧:
    - 视觉记忆表示：部分工作保留全截图，其他提出动作接地的局部裁剪，关于哪种方式减少接地错误存在矛盾证据。
    - 安全泛化：前沿智能体对浏览器任务中的手工攻击抵抗力强，但在编码任务中依然脆弱，表明安全是领域条件的而非全局鲁棒。
    - 训练数据规模：一条路线仅用另一路线0.1%的数据即达到竞争性能，质疑海量数据收集是否必要，或课程和弱监督是否足够。
    - 交互模态：原生纯截图智能体与结合DOM或可访问性元数据的设计形成对比，揭示通用性与精确性之间的权衡。
    开放问题:
    - 纯视觉智能体能否在没有额外结构化输入的情况下，处理需要精确文本选择或理解隐藏UI状态的任务？
    - 如何通过RL或记忆设计系统性提升错误恢复，同时不使训练管道过于复杂？
    - 训练一个能跨操作系统和应用领域泛化的GUI智能体所需的最小数据量是多少？
    - 如何使安全机制在所有智能体领域中鲁棒，并且什么样的评估协议能可靠地检测残余漏洞？
    - 离线诊断基准在多大程度上能预测交互式环境中对延迟敏感的真实性能？
