  - 主流方向：基于VLM和RL的可扩展GUI代理，通过可验证任务合成和自主评估，在多样化数字环境中进行基准测试。
  - 研究共性：所有工作均以视觉语言模型为骨干，采用多步交互，并通过新提出的基准强调评估。
  - 关键差异：它们针对不同领域（视频、移动端、浏览器、编码），使用不同训练信号（RL、SFT、噪声校正奖励），并解决正交挑战（不确定性、安全性、上下文管理）。
  - 趋势演进：2024至2026年，前沿从静态基准转向动态在线RL、自主评估和领域条件安全，越来越强调开源可复现性。
  - 开放问题：跨领域泛化、自主评估器的可靠性、跨代理层级的不确定性量化统一、以及超越手工攻击的可扩展安全。
  literature_review:
    line_of_work_matrix:
    - line: Benchmarking and comparative evaluation of GUI agents
      what_it_solves: Systematically measuring agent capabilities across diverse tasks
        (video-guided, mobile, web, coding) and revealing failure modes through controlled
        protocols.
      what_remains_open: Cross-benchmark comparability remains weak because task definitions,
        metrics, and data distributions are not standardized; reproducibility audits
        show that published results often depend on unreleased optimization strings.
    - line: Training and optimization of GUI agents with RL
      what_it_solves: Scaling agent performance beyond zero-shot prompting by using
        online RL, verifiable task synthesis, and autonomous evaluators to provide
        reward signals without human annotation.
      what_remains_open: Autonomous evaluators introduce noise that must be explicitly
        modeled; the learned policies often overfit to the training environment and
        show limited transfer to out-of-distribution tasks.
    - line: Context management and knowledge grounding for long-horizon agents
      what_it_solves: Enabling agents to maintain task-relevant information over extended
        interactions by structuring context or extracting procedural knowledge from
        human demonstrations.
      what_remains_open: Proactive context management is trained on a fixed dataset,
        and it is unclear how it generalizes to unseen app interfaces; human-to-agent
        tutorial transfer has not been tested on real-world dynamic workflows.
    - line: Safety and uncertainty quantification for computer-use agents
      what_it_solves: Identifying when agents are likely to fail or be exploited by
        measuring uncertainty in grounding and by auditing resistance to prompt injection
        across domains.
      what_remains_open: Uncertainty ranking does not transfer from open-weight to
        closed-source models; domain-conditioned safety means hardening in one domain
        (browser) does not protect another (coding), and current attacks are hand-crafted
        rather than optimized.
    consensus:
    - Vision-language models are the de facto core component for GUI agents, with
      all evaluated systems using a VLM or MLLM to process screenshots and instructions.
    - Multi-step, interactive evaluation is essential; single-step accuracy metrics
      are insufficient to capture real-world agent behavior.
    - Autonomous, verifiable reward signals are critical for scaling RL training,
      as manual labeling does not scale across diverse tasks.
    - 'Safety and uncertainty are domain-dependent: a model robust in one environment
      can be brittle in another, indicating that universal robustness is not yet achieved.'
    disagreements:
    - 'Training paradigm: Some works advocate online RL with environment interaction,
      while others rely on supervised fine-tuning from curated datasets or human demonstrations.'
    - 'Evaluation protocol: Benchmarks differ in whether they suppress natural shortcuts
      (URLs, reputation metadata) or allow them, leading to conflicting conclusions
      about agent capability.'
    - 'Context representation: Passive accumulation of full history versus proactive
      structured context management represents a fundamental trade-off between completeness
      and efficiency.'
    - 'Uncertainty method: Different families of post-hoc UQ (logit-based, hidden-state,
      conformal) show conflicting stability across models, and no single method is
      universally superior.'
    open_questions:
    - How can we align evaluation protocols across benchmarks so that an agent's performance
      on one reliably predicts its performance on another?
    - Can autonomous evaluators be calibrated to provide noise-free rewards, or is
      a hybrid human-in-the-loop approach necessary for reliable training?
    - How can safety hardening generalize across domains without re-auditing every
      new agent surface, given that prompt injection resistance is model-weight–specific?
    - What is the minimum set of assumptions needed to transfer uncertainty quantification
      rankings from open-weight to closed-source models?
  literature_review_zh:
    研究路线矩阵:
    - 路线: GUI代理的基准测试与对比评估
      解决的问题: 系统测量代理在多样化任务（视频引导、移动端、网页、编码）上的能力，并通过受控协议揭示失败模式。
      尚未覆盖: 跨基准可比性弱，因为任务定义、指标和数据分布未标准化；可复现性审计显示，已发表的结果常依赖未发布的优化字符串。
    - 路线: 基于强化学习的GUI代理训练与优化
      解决的问题: 通过在线RL、可验证任务合成和自主评估器提供奖励信号，将代理性能扩展到零样本提示之上，无需人工标注。
      尚未覆盖: 自主评估器引入的噪声必须显式建模；学习到的策略往往过拟合训练环境，向分布外任务的迁移有限。
    - 路线: 长时程代理的上下文管理与知识根基
      解决的问题: 通过结构化上下文或从人类演示中提取程序性知识，使代理能在扩展交互中维持任务相关信息。
      尚未覆盖: 主动上下文管理在固定数据集上训练，其在未见应用界面上的泛化不清楚；从人到代理的教程迁移未在真实世界的动态工作流中测试。
    - 路线: 计算机使用代理的安全性与不确定性量化
      解决的问题: 通过测量基础中的不确定性以及跨领域审计对提示注入的抵抗力，识别代理何时可能失败或被利用。
      尚未覆盖: 不确定性排序不能从开源权重迁移到闭源模型；领域条件安全性意味着在一个领域（浏览器）的加固不能保护另一个领域（编码），且当前攻击为手工制作而非优化。
    共识:
    - 视觉语言模型是GUI代理的事实核心组件，所有评估系统均使用VLM或MLLM处理截图和指令。
    - 多步交互式评估不可或缺；单步准确率指标不足以捕捉真实世界的代理行为。
    - 自主、可验证的奖励信号对于扩展RL训练至关重要，因为人工标注无法跨多样化任务缩放。
    - 安全性与不确定性是领域依赖的：在一个环境中鲁棒的模型在另一个环境中可能脆弱，表明通用鲁棒性尚未实现。
    分歧:
    - 训练范式：部分工作主张与环境交互的在线RL，而其他工作依赖从精选数据集或人类演示中进行监督微调。
    - 评估协议：基准在是否抑制自然捷径（URL、信誉元数据）或允许它们方面存在差异，导致对代理能力得出矛盾结论。
    - 上下文表示：被动累积完整历史与主动结构化上下文管理代表了完整性与效率之间的根本权衡。
    - 不确定性方法：不同家族的后验UQ（基于logits、隐藏状态、共形）在模型间显示出冲突的稳定性，没有一种方法普遍最优。
    开放问题:
    - 如何对齐跨基准的评估协议，使得一个基准上的性能能够可靠地预测另一个基准上的性能？
    - 自主评估器能否被校准以提供无噪声奖励，还是需要混合人机回环方法才能可靠训练？
    - 鉴于提示注入抵抗力是模型权重特定的，安全加固如何跨领域泛化，而无需重新审计每个新代理表面？
    - 将不确定性量化排序从开源权重迁移到闭源模型所需的最小假设集是什么？
