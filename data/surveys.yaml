  literature_review:
    line_of_work_matrix:
    - line: Real-world GUI task benchmarking across desktop, mobile, web, dynamic,
        video-guided, and drag-based interfaces
      what_it_solves: Defines grounded task suites, interaction modalities, and scoring
        protocols for evaluating GUI agents in application contexts.
      what_remains_open: Current suites are often platform- or interaction-specific;
        cross-domain generalization, metric validity, and human-level cost-accuracy
        remain unresolved.
    - line: Skill and memory augmentation for computer-use agents
      what_it_solves: Encodes application-specific multimodal procedures as reusable
        artifacts to improve task completion and UI state verification.
      what_remains_open: Skill library maintenance and generalization beyond evaluated
        apps, and transfer of gains across models or frameworks, lack evidence.
    - line: Observation selection and dynamic interface grounding
      what_it_solves: Extracts task-relevant visual or keyframe evidence from video
        or changing screens to support GUI and video-guided decisions.
      what_remains_open: Observation control is still weak; agents over- or under-observe
        dynamic content, and current keyframe coverage may not generalize across interface
        types.
    - line: Efficient execution and unified action architectures
      what_it_solves: Improves latency, repeatability, and action coverage through
        replay programs, diffusion-based GUI policies, or unified GUI-plus-code action
        spaces.
      what_remains_open: Real-world deployment safety, scalability, and reproducibility
        are underevidenced; several papers provide limited artifact or limitation
        details.
    consensus:
    - Evaluation is increasingly grounded in real application environments rather
      than synthetic static screens.
    - Multimodal visual grounding is central, and preserving visual information improves
      UI element identification and workflow state verification.
    - Reusing successful demonstrations, skills, or extracted keyframes improves repeated-task
      efficiency or task success.
    - Current agents still fall short of human-level performance on dynamic or information-cost-sensitive
      tasks.
    disagreements:
    - Benchmark scope differs across desktop, short-video, video-guided, and drag-based
      interaction modalities.
    - Some methods store skills as text or multimodal libraries, while others compile
      successful trajectories into state-machine replay programs.
    - Supervision differs among manually curated benchmarks, fine-tuning datasets,
      multimodal skill construction, and online reinforcement learning.
    - 'Action-space design differs: GUI-only observation and action, unified GUI and
      code execution, or block-wise diffusion generation.'
    - Evaluation targets differ, including Pass@1, sub-goal completion, cost-accuracy,
      speedup, and platform-specific success rates.
    open_questions:
    - Do gains on platform-specific benchmarks transfer across operating systems,
      applications, and interaction modalities?
    - Can agents learn observation control to balance information cost and task accuracy
      in dynamic interfaces?
    - How should fine-grained metrics complement aggregate success rates to expose
      capability differences among models?
    - Which missing code, dataset, baseline, or limitation details create verification
      gaps that affect reproducibility and validation?
