  - 开放问题：专门基准和训练增益能否跨平台和模型层级迁移，以及如何评测多步轨迹的不确定性、观察控制和动态界面覆盖，仍不明确。
  literature_review:
    line_of_work_matrix:
    - line: Fine-grained interaction benchmarking and task abstraction
      what_it_solves: Captures GUI-agent differences beyond aggregate success by scoring
        sub-goal completion, dynamic observation cost, and drag-operation coverage.
      what_remains_open: Evidence is concentrated on specific platforms and interaction
        types; transfer across model tiers and multi-step trajectory evaluation is
        not yet established.
    - line: Multimodal skill and structured context management
      what_it_solves: Improves grounding and long-horizon control by retaining visual
        skill artifacts or by treating context management as first-class policy actions.
      what_remains_open: Whether constructed skills and structured context transfer
        across applications, and whether they address dynamic observation-control
        deficits, remains unverified.
    - line: Verifiable and weakly supervised training for computer-use agents
      what_it_solves: Scales training data or online rollouts with verifiable task
        synthesis or unannotated screenshots, reducing manual annotation and improving
        sample efficiency.
      what_remains_open: Reported gains are benchmark-specific; generalization to
        long-horizon, dynamic, or drag-heavy tasks and systematic failure modes is
        not fully established.
    - line: Uncertainty quantification and reliability framing for GUI grounding
      what_it_solves: Provides post-hoc uncertainty ranking and conformal spatial
        regions for executable GUI-grounding decisions.
      what_remains_open: Coverage is limited to single-step grounding; cross-tier
        and closed-source ranking transfer is weak, and calibration under distribution
        shift remains unverified.
    consensus:
    - Fine-grained signals such as sub-goal completion, cost-accuracy, interaction-type
      coverage, and uncertainty calibration reveal agent differences that aggregate
      pass rates hide.
    - Multimodal or structured context improves GUI grounding and long-horizon behavior
      over unstructured screen or history inputs.
    - Training data requirements can be substantially reduced through verifiable or
      weak supervision when paired with suitable calibration or reward structure.
    - 'Reliability results are regime-dependent: within-model evidence transfers better
      than cross-model or cross-interface evidence.'
    disagreements:
    - 'Evaluation target: static multi-app desktop task success, dynamic living-screen
      cost-accuracy, drag-only interaction grounding, or single-step grounding uncertainty.'
    - 'Interaction mode: GUI+CLI action completion, proactive observation control,
      drag-based grounding, or context-as-action management.'
    - 'Supervision and learning: verifiable online reinforcement-learning task synthesis,
      weak screenshot-based visual grounding, small high-quality annotation calibration,
      or supervised context-action trajectories.'
    - 'Reliability framing: post-hoc uncertainty quantification and conformal safety
      regions versus broader benchmark robustness; no single evaluation protocol spans
      all settings.'
    open_questions:
    - What formal assumptions or abstraction boundaries are needed for dynamic GUI
      tasks where content changes between observations and actions?
    - Can verifiable or weak-supervision gains transfer to long-horizon, dynamic,
      and drag-based computer-use tasks without target-specific retraining or re-ranking?
    - Which uncertainty quantification and calibration methods remain valid for multi-step
      trajectories, closed-source models, or shifted interfaces?
    - Do skill libraries and structured context buffers solve over-observation and
      under-observation failures, or only mitigate context length while perception
      policy remains passive?
