      尚未覆盖: 哪些缺口应优先解决仍缺乏排序；部分证据缺少局限性说明，严重性和边界条件属于验证缺口。
    共识:
    - 任务成功率是GUI/计算机使用智能体的核心证据指标，常用OSWorld、ScienceBoard、MobileWorld、Windows Agent Arena等基准。
    - 多模态感知-动作对齐是共同前提，覆盖视频引导、截图和浏览器任务。
    - 训练和评测正从手工奖励或标签转向可验证或自主奖励信号，但这些信号被视作有噪声并需要校正。
