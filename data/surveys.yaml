  - 趋势演进：现有证据集中在2026年，前沿正从静态点击式网页/桌面基准转向交互特化任务、动态观察控制、可复用技能/程序以及可扩展真实环境重建，并报告Pass@1、成本-准确率、子目标完成等更细粒度指标。
