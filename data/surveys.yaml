  literature_review:
    line_of_work_matrix:
    - line: Formal definitions and assumptions for GUI-agent interaction
      what_it_solves: Clarifies dynamic living-screen settings, drag interaction assumptions,
        uncertainty conditions, and capability annotations instead of leaving interaction
        constraints implicit in task suites.
      what_remains_open: Whether these single-step or task-suite formalizations match
        multi-step agent behavior and transfer across interfaces and model classes
        remains unresolved.
    - line: Scaling and verifiable training guarantees
      what_it_solves: Reduces annotation cost and scales computer-use policies through
        weakly supervised grounding, verifiable task synthesis, frontier-aware rollout
        allocation, and efficient online RL.
      what_remains_open: Direct validation that data-efficiency and state-of-the-art
        gains predict failures, safety margins, or transfer to unseen tasks and interfaces
        is missing.
    - line: Skill, memory, and context-management methods
      what_it_solves: Improves long-horizon or cross-application reliability by retaining
        multimodal skill artifacts or treating context compression and retrieval as
        first-class agent actions.
      what_remains_open: Whether compressed context fields preserve critical facts
        beyond current benchmarks, and whether skill libraries transfer without target-specific
        authoring, remains open.
    - line: Uncertainty quantification and reliability framing
      what_it_solves: Benchmarks post-hoc uncertainty methods for GUI grounding and
        connects uncertainty to spatial safety through conformal click regions.
      what_remains_open: Multi-step trajectory uncertainty, cross-model and cross-interface
        ranking transfer, and coverage degradation under distribution shift are unresolved
        boundaries.
    consensus:
    - Current GUI-agent work treats evaluation coverage, task design, and training
      efficiency as first-class reliability levers, often pairing new environments
      with explicit capability metrics rather than aggregate success alone.
    - Fine-grained signals such as sub-goal completion, cost-accuracy, ranking transfer,
      interaction grounding, and context-action records reveal model differences that
      aggregate scores hide.
    - There is a cross-paper shift toward handling dynamic or long-horizon interaction
      by externalizing knowledge as skills, controlled context, or verifiable task
      generators.
    disagreements:
    - 'Evaluation target differs: single-step grounding uncertainty, multi-step desktop
      or mobile task completion, dynamic observation cost, and drag-specific grounding
      are treated separately.'
    - 'Supervision mode differs: curated rule-based evaluation, weak supervision from
      unannotated screenshots, verifiable online RL with frontier sampling, and supervised
      fine-tuning with context-action annotations coexist.'
    - 'Safety and reliability treatment differs: some work calibrates spatial safety
      for single-step grounding, while other work improves long-horizon task success
      or context compression without measuring failure risk or deployment shift.'
    - 'Skill and context representation differs: multimodal visual artifacts, text-only
      skills, folded context fields, and context-as-action mechanisms encode different
      assumptions about what should be reused or compressed.'
    open_questions:
    - Do benchmark-specific gains such as skill-library lift or drag fine-tuning persist
      under out-of-distribution interfaces and closed-source model tiers?
    - Are formal task abstractions for dynamic or drag interactions sufficient to
      predict multi-step agent failures, rather than only current benchmark scores?
    - What verification evidence is missing when paper records have empty limitation
      fields, no code/dataset signal, or no reported baseline comparison details?
    - Can uncertainty ranking transfer be improved across observable interfaces and
      model classes without target-specific reranking, given evidence of weak cross-tier
      transfer?
