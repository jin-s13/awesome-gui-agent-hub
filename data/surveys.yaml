    研究路线矩阵:
    - 路线: 真实桌面与跨应用GUI任务基准测评
      解决的问题: 评测多模态智能体在混合GUI与CLI的多应用桌面任务上的表现，并用细粒度子目标评分补充最终成功率。
      尚未覆盖: 证据仅覆盖一个操作系统和选定应用；未见局限性说明，跨桌面环境迁移尚未验证。
    - 路线: 面向计算机使用智能体的多模态技能、历史感知评判与重放
      解决的问题: 通过保留视觉技能工件、总结宏观动作历史、以屏幕截图校验坐标，以及把成功运行编译为可重放状态机来改进基础性与效率。
      尚未覆盖: 跨应用与任务的泛化未被确立；部分方法缺少可见代码或工件，对未见布局和屏幕错配的鲁棒性仍开放。
    - 路线: 动态、交互类型细分与视频引导的GUI任务评测
      解决的问题: 覆盖动态短视频界面、拖拽交互和视频引导操作，提出综合准确性与信息成本或子任务覆盖的指标。
      尚未覆盖: 范围限于短视频平台、拖拽类型或选定视频任务；尚无模型达到人类水平成本-准确性，跨领域迁移未被证明。
    - 路线: 净化证据下的安全导向网页任务评测
      解决的问题: 在隐藏URL、域名和信誉捷径的情况下测试网页智能体对短信到网页欺诈链的判断，暴露证据使用不足和良性召回下降。
      尚未覆盖: 净化设置可能无法反映真实检测中信誉线索可用的情况；数据规模、场景覆盖和真实部署泛化能力有限。
    共识:
    - 当前评测普遍将多模态前沿模型作为GUI智能体，在真实或模拟界面任务上采用细粒度成功与诊断指标。
    - 视觉基础与历史上下文能改善执行：保留视觉工件、视觉校验坐标或提取任务相关关键帧可减少短视错误。
    - 重复交互和专门操作被视为一级问题，包括拖拽操作和重放先前成功运行。
    - 基准测试越来越多报告子目标、成本-准确性或召回权衡，而非仅看最终任务完成。
    分歧:
    - 表示选择不同：视觉技能工件、带坐标评判的宏观动作历史、状态机程序和任务驱动关键帧提取编码了不同的执行知识。
    - 监督与评测目标不同：最终Pass@1、子目标完成度、准确性-成本权衡、拖拽覆盖和良性召回各有侧重。
    - 交互模式不同：GUI加CLI、动作间动态变化的内容、仅拖拽操作、视频引导动作和净化网页导航。
    - 部署场景不同：桌面应用、短视频平台、移动或网页式交互任务以及短信到网页欺诈链带来不同约束。
