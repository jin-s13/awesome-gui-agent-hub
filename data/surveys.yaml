    - line: Open problem and gap mapping
      what_it_solves: Turns broad literature coverage into concrete next research
        questions around harness evolution, reinforcement-learning sample efficiency,
        context management, and trust.
      what_remains_open: Prioritization of gaps under limited reproducibility, missing
