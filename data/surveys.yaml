  related_work_outline:
  - 'Mainstream direction: The topic is dominated by GUI-agent benchmarks and methods
    that couple evaluation environments with training or adaptation recipes, moving
    from static click/grounding tasks to real desktop use, dynamic interfaces, drag
    actions, and video-guided interaction.'
  - 'Shared research pattern: Work repeatedly pairs a task environment or dataset
    with fine-grained metrics to expose capabilities that pass@1 hides, then uses
    that signal to drive model training, harness changes, or grounding improvements.'
  - 'Key differences: Contributions differ in whether they modify the frozen agent
    harness, fine-tune or RL-train the model, extract visual context, or quantify
    uncertainty; evaluation settings also differ across OS, browser, short-video,
    and drag interfaces.'
  - 'Trend evolution: Available evidence is concentrated in 2026, so the trend is
    within the current frontier: from single-step command success toward fine-grained
    sub-goal scoring, dynamic observation control, and scalable self-improvement with
    weaker supervision or verifiable synthesis.'
  - 'Open questions: Whether reported gains isolate the proposed method from system
    and data choices; whether uncertainty and observation-control failures generalize
    across interfaces; and whether benchmark success predicts real deployment.'
  related_work_outline_zh:
  - 主流方向：以GUI代理基准测试和方法为主，将评测环境与训练或适配方法结合，从静态点击/定位任务扩展到真实桌面、动态界面、拖拽动作和视频引导交互。
  - 研究共性：多篇工作用细粒度评测揭示Pass@1难以反映的子目标完成、成本效率等能力，并将该信号用于训练模型、调整执行框架或改进视觉定位。
  - 关键差异：贡献点分别在于冻结模型的外部harness优化、模型微调/在线强化学习、视觉上下文提取或不确定性量化；评测接口覆盖macOS、浏览器、短视频和拖拽式交互。
  - 趋势演进：证据集中在2026年，趋势属于当前前沿：从单步成功转向细粒度评分、动态观察控制，以及用弱监督或可验证合成任务实现可扩展自改进。
  - 开放问题：报告收益是否真正隔离了方法贡献而非系统与数据因素；不确定性与观察控制失败能否跨接口泛化；基准测试表现能否预测真实部署效果。
  literature_review:
    line_of_work_matrix:
    - line: Evaluation environments and interaction coverage
      what_it_solves: Captures capabilities beyond click-only or static grounding
        by covering real desktop workflows, dynamic short-video interfaces, drag interactions,
        and video-guided GUI tasks.
      what_remains_open: Benchmark-specific results may not transfer across OS/browser/mobile
        interfaces; human-level comparison is limited; missing limitation and artifact
        details prevent full reproducibility.
    - line: Execution-harness and action-interface optimization
      what_it_solves: Improves frozen GUI agents by aligning outputs with observed
        screen transitions, diagnosing failure modes, and editing the surrounding
        harness rather than retraining the backbone.
      what_remains_open: Gains may be confounded with harness, task, or baseline choices;
        migration to unseen benchmarks and long-horizon environments remains uncertain.
    - line: Scalable training and data-efficiency methods
      what_it_solves: Reduces reliance on costly annotations or human task design
        through unannotated screenshots, weak supervision, verifiable task synthesis,
        and efficient online RL.
      what_remains_open: Open-source SOTA gains are reported on narrow benchmarks;
        contribution isolation between synthesis, sampling, and training components
        is not established.
    - line: Visual context and video-guided grounding
      what_it_solves: Selects task-relevant frames or keyframes so MLLM-based agents
        can handle video-guided GUI tasks without dense visual context.
      what_remains_open: Evidence is limited to short-video platforms and VideoQA-style
        tasks; generalization to other dynamic interfaces and multi-step execution
        is missing.
    - line: Uncertainty quantification for GUI grounding
      what_it_solves: Evaluates post-hoc uncertainty quantification methods to calibrate
        click/grounding confidence and produce spatially safe prediction regions.
      what_remains_open: Single-step grounding evaluation may not extend to multi-step
        trajectories; cross-model and cross-interface ranking transfer is weak under
        distribution shift.
    consensus:
    - Fine-grained evaluation signals expose gaps hidden by coarse end-task success;
      examples include sub-goal completion, cost-accuracy, and uncertainty-calibrated
      spatial coverage.
    - Current GUI agents remain below human-level on dynamic, long-horizon, or non-click
      interaction tasks, often due to observation control or interaction grounding
      gaps.
    - Data-efficient training is a shared concern, with approaches using unannotated
      screenshots, synthetic verifiable tasks, or harness-level adaptation to avoid
      expensive model retraining.
    - 'Verification gaps are common: several leading papers lack visible limitation
      statements or artifact/reproducibility details, so reported results cannot be
      fully audited.'
    disagreements:
    - 'Where improvement is inserted differs: frozen-harness optimization versus model
      fine-tuning or online RL versus keyframe extraction versus post-hoc uncertainty
      calibration.'
    - 'Evaluation settings differ by interface and platform: real desktop with GUI
      and CLI, browser-based short-video environments, drag-only interactions, video-guided
      tasks, and single-step grounding.'
    - 'Task focus differs in time horizon: multi-step computer-use tasks versus single-step
      executable grounding versus video-conditioned interaction.'
    - 'Supervision assumptions differ: massive unannotated screenshots, verifiable
      synthetic rollouts, human-designed benchmark tasks, or post-hoc confidence methods
      without training.'
    - 'Uncertainty transfer evidence challenges a generalizability assumption: within-model
      ranking stability does not imply cross-tier or cross-interface transfer.'
    open_questions:
    - Do observed gains from harness optimization, RL task synthesis, and weak supervision
      isolate the proposed method from surrounding system, task, and data choices?
    - Can observation-control, drag-interaction, and video-guided grounding capabilities
      transfer across OS, browser, mobile, or long-horizon deployment settings?
    - Can post-hoc uncertainty methods maintain spatial coverage and ranking stability
      under calibration-test or interface distribution shift?
    - Are current benchmark successes on OSWorld, ScienceBoard, LivingScreen, DragOn,
      and MacAgentBench predictive of real-world computer-use reliability?
    - What verification standards are needed when artifact, code, dataset, and limitation
      evidence are absent or uneven across method and benchmark work?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 评测环境与交互覆盖
      解决的问题: 覆盖真实桌面工作流、动态短视频界面、拖拽交互和视频引导GUI任务，揭示点击式或静态定位之外的模型能力。
      尚未覆盖: 结果可能不跨OS/浏览器/移动端迁移；人类水平对比有限；部分工作缺少限制与工件细节，复现证据不足。
    - 路线: 执行框架与动作接口优化
      解决的问题: 在不重新训练骨干模型的情况下，通过对齐输出与屏幕状态、诊断失败模式并修改外围harness来改进冻结GUI代理。
      尚未覆盖: 收益可能混淆于harness、任务或基线选择；在未见过基准和长程环境中的迁移仍不明确。
    - 路线: 可扩展训练与数据效率方法
      解决的问题: 利用未标注截图、弱监督、可验证任务合成与高效在线RL，降低对昂贵标注或人工任务设计的依赖。
      尚未覆盖: 开源的SOTA增益多在窄基准上报告；合成、采样与训练组件的方法贡献未被隔离。
    - 路线: 视觉上下文与视频引导定位
      解决的问题: 选择任务相关帧或关键帧，使基于MLLM的代理能在视频引导GUI任务中避免密集视觉上下文。
      尚未覆盖: 证据限于短视频平台和VideoQA式任务，向其他动态界面和多步执行泛化不足。
    - 路线: GUI定位的不确定性量化
      解决的问题: 评估后验不确定性量化方法，为点击或定位提供校准置信度和空间安全的预测区域。
      尚未覆盖: 单步定位评测可能无法推广到多步轨迹；跨模型、跨接口的UQ排名迁移较弱，分布偏移下覆盖度下降。
    共识:
    - 细粒度评测信号揭示粗粒度任务成功所掩盖的差距，例如子目标完成、成本效率和不确定性校准空间覆盖。
    - 当前GUI代理在动态、长程或非点击交互任务上仍低于人类水平，常见原因是观察控制或交互定位不足。
    - 数据效率训练是共同关注点，方法包括未标注截图、合成可验证任务或harness级适配，以避免高昂模型重训。
    - 验证缺口普遍存在：若干领先工作缺少可见的限制说明或工件、复现细节，导致结果无法完全审计。
    分歧:
    - 改进插入点不同：冻结harness优化、模型微调或在线RL、关键帧提取，或后验不确定性校准。
    - 评测设置因接口和平台不同：带GUI和CLI的真实桌面、浏览器内短视频环境、纯拖拽交互、视频引导任务和单步定位。
    - 时间跨度不同：多步计算机使用任务、单步可执行定位，或视频条件交互。
    - 监督假设不同：大规模未标注截图、可验证合成轨迹、人工设计基准任务，或不训练而使用后验置信方法。
    - UQ迁移证据挑战泛化假设：模型内排名稳定不代表跨层级或跨接口可迁移。
    开放问题:
    - 来自harness优化、RL任务合成和弱监督的收益是否隔离了所提方法，而非周边系统、任务与数据选择？
    - 观察控制、拖拽交互和视频引导定位能力能否跨OS、浏览器、移动端或长程部署环境迁移？
    - 后验不确定性方法能否在校准-测试或接口分布偏移下保持空间覆盖率和排名稳定性？
    - OSWorld、ScienceBoard、LivingScreen、DragOn和MacAgentBench等基准成功是否能预测真实计算机使用可靠性？
    - 当方法类工作的代码、数据集、工件和局限性证据缺失或不均衡时，应建立何种验证标准？
