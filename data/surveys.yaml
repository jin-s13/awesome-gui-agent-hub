  related_work_outline:
  - 'Mainstream direction: Building realistic multi-step, multi-application GUI/OS
    automation benchmarks and using them to improve agents through fine-grained metrics,
    skill libraries, harness optimization, or RL.'
  - 'Shared research pattern: Define environments and tasks, evaluate frontier/open
    models, diagnose failure modes, then propose a targeted metric or agent-improvement
    method.'
  - 'Key differences: Evaluation target, interface dynamics, supervision/improvement
    mechanism, and metric emphasis differ across studies.'
  - 'Trend evolution: Evidence is concentrated in 2024–2026; work is shifting from
    static single-step grounding toward dynamic, video-guided, multi-app, uncertainty-aware,
    and efficiency-aware evaluation.'
  - 'Open questions: Cross-benchmark transfer, metric alignment with real user decisions,
