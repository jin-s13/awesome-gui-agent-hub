  related_work_outline:
  - 'Mainstream direction: Benchmarking real-world GUI/OS automation agents across
    desktop, browser, dynamic-screen, and video-guided tasks, while coupling benchmarks
    with agent-improvement methods using skills, harness optimization, synthetic tasks,
    or weak supervision.'
  - 'Shared research pattern: Papers construct task suites or environments and apply
    fine-grained or cost-aware metrics; several show that headline success scores
    miss sub-goal completion, observation control, or calibration differences.'
  - 'Key differences: Evaluation target ranges from single-step grounding to multi-step
    trajectories; interaction surface ranges from GUI-only to GUI+CLI desktop, browser
    video, and dynamic short-video; improvement strategy ranges from frozen-model
    skill/harness changes to model training via RL or weak supervision.'
  - 'Trend evolution: Within the 2024–2026 frontier, the evidence shifts from broad
    accuracy benchmarking toward verifiable and deterministic scoring, dynamic/video-guided
    settings, and using benchmark evidence for self-improvement; available top papers
    cluster at 2026.'
  - 'Open questions: Cross-platform and cross-task generalization, metric alignment
    with downstream user decisions, transferability of gains, and missing limitation
    statements remain open; mobile-specific automation is not visible in the top-paper
    evidence.'
  related_work_outline_zh:
  - 主流方向：围绕桌面、浏览器、动态屏幕和视频引导任务构建真实计算机使用代理基准，并将基准与技能、harness优化、合成任务或弱监督等改进方法结合。
  - 研究共性：构建任务套件与环境，并采用细粒度或成本感知指标评估前沿模型；多项工作表明总分/Pass@1会掩盖子目标完成、观察控制或校准差异。
  - 关键差异：评测目标从单步grounding到多步轨迹不等；交互面从GUI-only到GUI+CLI桌面、浏览器视频和动态短视频不等；改进策略从冻结模型技能/harness修改到通过RL或弱监督训练模型。
  - 趋势演进：在2024–2026前沿内，从宽泛准确率基准向可验证/确定性评分、动态与视频引导设置、以及利用基准证据做自改进发展；证据中论文集中在2026年。
  - 开放问题：跨平台与跨任务泛化、指标与下游用户决策一致性、提升迁移性、以及多篇论文缺少限制说明仍待解决；顶级论文证据中未见到移动端自动化。
  literature_review:
    line_of_work_matrix:
    - line: OS desktop and cross-app task benchmarking
      what_it_solves: Provides shared multi-application GUI+CLI tasks with deterministic
        rule-based scoring and fine-grained sub-goal metrics, making real desktop
        agent performance comparable.
      what_remains_open: Whether results generalize beyond the specific apps and OS,
        and how missing limitation details bound failure cases.
    - line: Dynamic and video-guided task benchmarking
      what_it_solves: Covers interfaces that change between actions and tasks grounded
        in video, where static-screen assumptions fail.
      what_remains_open: Dynamic interface coverage is narrow, and video-guided evaluation
        is tied to keyframe extraction quality and platform-specific environments.
    - line: Metric and stress-test design
      what_it_solves: Adds sub-goal scoring, cost-accuracy, uncertainty ranking, and
        conformal click regions to expose blind spots hidden by accuracy-only evaluation.
      what_remains_open: Proxy metrics are not yet aligned with downstream user decisions,
        and uncertainty ranking transfers weakly across model classes and interfaces.
    - line: Skill and harness augmentation for frozen agents
      what_it_solves: Improves computer-use agents without changing backbone weights
        by using multimodal skill libraries or evidence-driven execution harness edits.
      what_remains_open: Generalization beyond evaluated benchmarks and the scalability
        or maintenance of skills and harness edits are not fully shown.
    - line: Data-efficient training and online RL for GUI agents
      what_it_solves: Uses verifiable synthetic tasks, unannotated screenshots, or
        online RL to improve open GUI agents while reducing human annotation cost.
      what_remains_open: Benchmark-specific gains may not transfer, and several papers
        lack limitation statements or broader deployment evidence.
    consensus:
    - Benchmarks are moving toward real interactive computer-use tasks rather than
      isolated UI element recognition, with multi-step actions across applications,
      browsers, or dynamic screens.
    - Aggregate success scores are treated as insufficient; several works add sub-goal
      completion, observation cost, uncertainty, or contribution decomposition.
    - Deterministic or verifiable evaluation signals are favored, with rule-based
      checks and executable environments recurring across the evidence.
    - The same benchmarks are being repurposed for agent improvement via skill libraries,
      harness optimization, synthetic task generation, or weak supervision.
    disagreements:
    - Evaluation target varies from single-step GUI grounding to multi-step trajectories
      and dynamic observation control, changing what the metric measures.
    - Interaction surface varies from GUI-only to GUI+CLI desktop, browser-based dynamic
      video, and desktop OS settings, producing different task difficulty and failure
      modes.
    - 'Improvement strategy differs: some keep model weights frozen and modify skills
      or execution harness, while others train via online RL or weakly supervised
      curricula.'
    - Metric preference differs across accuracy, cost-accuracy, sub-goal coverage,
      uncertainty calibration, and training speed, creating different definitions
      of progress.
    - Deployment assumption differs by platform and interface observability, where
      some settings require internal model states and others rely only on executable
      actions.
    open_questions:
    - Do gains on OSWorld/ScienceBoard, macOS desktop, or short-video benchmarks transfer
      across OS, apps, and dynamic interface types?
    - Which metrics best predict downstream user value and safe deployment across
      observation cost, uncertainty, and sub-goal completion?
    - Can frozen harness or skill improvements generalize beyond the evaluated benchmarks,
      and how should these artifacts be maintained as interfaces change?
    - Several top papers lack limitation statements; what failure boundaries are undocumented
      for task coverage, scoring, and transfer claims?
    - Mobile-specific automation is not visible in the top-paper evidence, leaving
      its relationship to the provided desktop/browser findings unverified.
  literature_review_zh:
    研究路线矩阵:
    - 路线: OS桌面与跨应用任务基准
      解决的问题: 提供多应用GUI+CLI任务、确定性规则评分和子目标细粒度评分，使真实macOS桌面表现可比。
      尚未覆盖: 结果能否跨应用/OS泛化，以及缺失限制说明对失败边界的约束尚不明确。
    - 路线: 动态与视频引导任务基准
      解决的问题: 覆盖操作间内容变化的界面和视频引导任务，弥补静态屏幕假设不足。
      尚未覆盖: 动态界面类型覆盖较窄，视频引导评估依赖关键帧提取质量和特定平台环境。
    - 路线: 指标与压力测试设计
      解决的问题: 引入子目标评分、成本-准确率、不确定性排序和共形点击区域，揭示只看准确率的盲点。
      尚未覆盖: 代理指标与下游用户决策不一致；不确定性排序跨模型类别和接口迁移较弱。
    - 路线: 冻结代理的技能与harness增强
      解决的问题: 通过多模态技能库或证据驱动执行harness编辑，在不改骨干权重下提升计算机使用代理。
      尚未覆盖: 评估基准之外的泛化，以及技能与harness编辑的扩展性和维护尚未充分展示。
    - 路线: 数据高效训练与在线RL
      解决的问题: 通过可验证合成任务、未标注截图或在线RL，在减少人工标注的情况下改进开源GUI代理。
      尚未覆盖: 基准特定收益可能不迁移，且多篇论文缺少限制声明或更广部署证据。
    共识:
    - 基准正从孤立UI元素识别转向真实交互式计算机使用任务，涉及跨应用、浏览器或动态屏幕的多步操作。
    - 总分被认为不足以反映能力；多项工作补充子目标完成、观察成本、不确定性或贡献分解。
    - 确定性与可验证评估信号更受青睐，基于规则的检查和可执行环境在证据中反复出现。
    - 同一基准正被复用于通过技能库、harness优化、合成任务或弱监督来改进代理。
    分歧:
    - 评测目标从单步GUI grounding到多步轨迹和动态观察控制不等，改变了指标含义。
    - 交互面从GUI-only到GUI+CLI桌面、浏览器动态视频和桌面OS设置不等，任务难度和失败模式不同。
    - 改进策略不同：有的冻结模型权重并修改技能或执行harness；有的通过在线RL或弱监督课程训练模型。
    - 指标偏好不同：准确率、成本-准确率、子目标覆盖、不确定性校准与训练速度形成不同进展定义。
    - 部署假设在平台和接口可观测性上不同，有些设置依赖内部模型状态，有些只能依赖可执行动作。
    开放问题:
