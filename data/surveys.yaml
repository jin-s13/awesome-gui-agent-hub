  literature_review:
    line_of_work_matrix:
    - line: Real-world GUI agent benchmarking across desktop and multi-application
        tasks
      what_it_solves: Provides task suites and fine-grained scoring for computer-use
        agents operating over real desktop applications, including GUI+CLI workflows
        and capability annotations.
      what_remains_open: Coverage is concentrated on specific operating systems and
        applications; cross-platform generalization and missing limitation analysis
        leave boundary conditions unclear.
    - line: Interaction-specialized GUI evaluation
      what_it_solves: Targets dynamic, drag-based, and video-guided interactions that
        click-focused benchmarks underrepresent, using browser-based or video-derived
        task suites and cost-accuracy or grounding metrics.
      what_remains_open: Observation control in changing interfaces, coverage of all
        dynamic interaction types, and transfer to live production settings remain
        unresolved.
    - line: Reusable skills and replay compilation for computer-use agents
      what_it_solves: Improves agent performance or repeated-task efficiency by retrieving
        multimodal skill artifacts or compiling successful runs into screen-checked
        state-machine programs.
      what_remains_open: Robustness when UI states, workflows, or application versions
        change, and whether stored programs or skills transfer across tasks and platforms,
        is not established.
    - line: Scalable environment reconstruction from real web sources
      what_it_solves: Automatically builds source-grounded, reusable web environments
        from real URLs to support large-scale agent training and evaluation without
        manual per-site implementation.
      what_remains_open: Requires initial per-site setup and authorization; fidelity
        outside the covered domains and downstream real-world operational impact are
        not fully measured.
    - line: Model-level advances for GUI grounding and video-guided input
      what_it_solves: Develops multimodal agent models or keyframe selection methods
        to improve grounding, navigation, and video-guided GUI task performance.
      what_remains_open: Few direct comparisons exist across platforms and benchmarks,
        and latency, scalability, and generalization to unseen interactive tasks remain
        open.
    consensus:
    - Visual interface grounding is central to GUI agent progress, whether via screen-state
      verification, visual figures in skills, or keyframe selection.
    - Task success is commonly reported through Pass@1 or aggregate scores, with a
      shift toward fine-grained sub-goal, cost-accuracy, or task-type metrics.
    - Constructing reusable artifacts such as benchmark task suites, skill libraries,
      replay programs, training datasets, or reconstructed environments is a recurring
      strategy for improving or evaluating agents.
    - Static click-only settings are viewed as insufficient; the field is expanding
      to drag, dynamic, video-guided, and multi-application computer-use tasks.
    disagreements:
    - 'Improvement strategy differs: some work uses supervised fine-tuning on constructed
      interaction data, while other work improves inference-time behavior through
      skill retrieval or compiled replay without per-step model calls.'
    - 'Evaluation target differs: real desktop multi-app tasks, browser-based dynamic
      short-video platforms, drag-specific interactions, video-guided GUI tasks, and
      wild web environments are measured with different success criteria.'
    - 'Representation differs: some approaches retain visual figures in skill artifacts,
      others use text-only or keyframe-selected inputs, and one agent model uses block-wise
      diffusion generation.'
    - 'Primary objective differs: some papers optimize task accuracy, while others
      optimize repeated-task speed or cost-accuracy, making direct comparison difficult.'
    open_questions:
    - How do skills, replay programs, or environment-reconstruction gains transfer
      when application UIs, workflows, or platform rules change?
    - Can GUI agents achieve human-level observation control in dynamic interfaces
      where content changes between actions?
