  - 开放问题：离线诊断向在线控制的迁移、强化学习后的错误恢复、确定性记忆回放的泛化、跨基础设施复现性，以及弱监督与在线探索的平衡仍待解决。
  literature_review:
    line_of_work_matrix:
    - line: Runnable reinforcement-learning training and deployment stacks
      what_it_solves: Trains GUI or web agents end-to-end inside harness-native or
        live-browser settings using containerized rollouts, proxy logging, supervised
        initialization, and multi-turn policy optimization.
      what_remains_open: Error recovery remains weak after RL, harness design affects
        trainability, and most evidence is limited to a small set of web or GUI benchmarks.
    - line: Weakly supervised data-efficient training methods
      what_it_solves: Reduces reliance on costly human annotations by learning visual
        grounding from large-scale unannotated screenshots and then calibrating with
        small amounts of high-quality data.
      what_remains_open: Limitations are not explicitly stated in the visible evidence,
        and independent reproduction across environments and datasets is still missing.
    - line: Reusable multimodal skills and execution-level memory
      what_it_solves: Converts validated GUI trajectories into callable, parameter-controlled
        multimodal memories or skills, reducing repeated planning, token cost, and
        execution time while retaining visual evidence for grounding.
      what_remains_open: Deterministic replay rejects ambiguous or incompatible steps,
        and cross-application generalization as well as independent reproduction remain
        unproven.
    - line: Alternative generative architectures for GUI grounding and navigation
      what_it_solves: Brings block-wise diffusion decoding to multimodal GUI agents,
        aiming to retain parallel decoding advantages while handling grounding and
        navigation tasks.
      what_remains_open: Evidence covers a subset of GUI benchmarks with no stated
        limitations, and broader platform, latency, and independent verification are
        missing.
    - line: Diagnostic and execution-based benchmark environments
      what_it_solves: Creates step-level transition-understanding tasks or domain-specific
        software workflows to isolate state verification, source tracking, and artifact
        correctness beyond end-task success.
      what_remains_open: Offline benchmarks miss asynchronous timing and real-time
        dynamics, and current coverage is limited to Linux desktop actions or a fixed
        set of scientific tasks and models.
    consensus:
    - Runnable GUI agents are evaluated by executing tasks in environments and checking
      outcomes or artifacts, not by static question answering.
    - Visual grounding and workflow-state verification are critical bottlenecks across
      web, desktop, and scientific software tasks.
    - Memory, weak supervision, or reinforcement learning is used to reduce annotation
      cost, token cost, or execution time.
    - Even strong models remain below saturation on transition understanding and difficult
      computer-use tasks.
    disagreements:
    - Some work optimizes inference-time memory or skill retrieval, while others focus
      on training-time weak supervision or online reinforcement learning.
    - 'Supervision sources differ: unannotated screenshots, live interactive rollouts,
      or authored documentation plus interface exploration.'
    - Evaluation granularity differs from end-to-end success to step-level GUI transition
      diagnosis and domain-specific scientific workflows.
    - 'Representation choices differ: text-only versus multimodal visual evidence,
      autoregressive versus block-wise diffusion, and raw screenshots versus callable
      memory abstractions.'
    - Deployment settings differ across harness-native CLI, live browser, Linux desktop,
      and scientific software environments.
    open_questions:
    - How well do offline step-level diagnostics transfer to live, asynchronous GUI
      control?
    - Can deterministic memory replay generalize to ambiguous, cross-application,
      or non-deterministic workflows?
    - What makes error recovery remain weak after reinforcement learning, and which
      harness design choices improve trainability?
    - How reproducible are these systems across different teams, datasets, and infrastructure
      given limited artifact signals?
    - How should weak supervision be combined with online exploration to avoid overfitting
      to narrow benchmark distributions?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 可运行的强化学习训练与部署栈
      解决的问题: 在harness原生或真实浏览器环境中端到端训练GUI或网页智能体，包括容器化回滚、代理日志、监督初始化和多轮策略优化。
      尚未覆盖: 强化学习后的错误恢复仍弱，harness设计影响可训练性，且多数证据局限于少量网页或GUI基准。
    - 路线: 基于未标注数据的弱监督数据高效训练方法
      解决的问题: 通过大规模未标注截图学习视觉定位，再用少量高质量数据进行校准，降低对昂贵人工标注的依赖。
      尚未覆盖: 可见证据中未明确说明局限性，跨环境和数据集的独立复现仍缺失。
    - 路线: 可复用多模态技能与执行级记忆
      解决的问题: 将验证过的GUI轨迹转化为可调用的参数化多模态记忆或技能，减少重复规划、token成本与执行时间，同时保留视觉证据以改善定位。
      尚未覆盖: 确定性回放会拒绝模糊或不兼容步骤，跨应用泛化和独立复现仍未得到证明。
    - 路线: 替代性生成式GUI架构
      解决的问题: 将块级扩散解码引入多模态GUI智能体，试图保留并行解码优势并完成定位与导航任务。
      尚未覆盖: 仅在部分GUI基准上比较，缺少局限性说明，更广泛平台、延迟和独立验证不足。
    - 路线: 诊断式与基于执行的基准环境
      解决的问题: 通过步骤级状态转换任务或领域软件工作流，隔离状态验证、来源追踪和工件正确性，而不只看最终任务成功。
      尚未覆盖: 离线基准缺少异步时序与实时动态，当前覆盖局限于Linux桌面动作或固定科学任务与模型。
    共识:
    - 可运行GUI智能体通过在环境中执行任务并检查结果或工件来评估，而非静态问答。
    - 视觉定位和工作流状态验证在网页、桌面和科学软件任务中都是关键瓶颈。
    - 研究普遍通过记忆、弱监督或强化学习来降低标注成本、token成本或执行时间。
    - 即使强模型在状态转换理解和困难计算机使用任务上仍远未饱和。
    分歧:
    - 部分工作优化推理期记忆或技能检索，另一些则聚焦训练期弱监督或在线强化学习。
    - 监督来源不同：未标注截图、在线交互回滚，或人工编写加界面探索的技能文档。
    - 评测粒度不同：端到端成功、步骤级GUI状态转换诊断，或领域科学软件工作流。
    - 表示选择不同：纯文本与多模态视觉证据、自回归与块级扩散、原始截图与可调用记忆抽象。
    - 部署环境不同：harness原生CLI、真实浏览器、Linux桌面和科学软件环境。
    开放问题:
    - 离线步骤级诊断结果能在多大程度上迁移到实时异步GUI控制？
    - 确定性记忆回放能否泛化到模糊、跨应用或非确定性工作流？
    - 为何强化学习后错误恢复仍然较弱，哪些harness设计选择能改善可训练性？
    - 在工件信号有限的情况下，这些系统跨团队、数据集和基础设施的可复现性如何？
    - 如何组合弱监督与在线探索，避免过度适应窄基准分布？
