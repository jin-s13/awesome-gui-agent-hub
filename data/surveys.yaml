    - 冻结视觉语言模型可通过外部框架改进，例如技能库、框架编辑、生成课程或事后校准。
    - 评测正在从通过率扩展到成本-准确性、细粒度子目标元数据、拖拽交互定位和不确定性感知的置信度。
