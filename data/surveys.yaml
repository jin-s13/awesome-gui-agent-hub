    - 'Supervision signals differ: large-scale unannotated screenshots with reinforcement
      calibration, hybrid supervised fine-tuning plus online reinforcement learning,
      and retrieval-based skill augmentation make different assumptions.'
    - 'Deployment training targets differ: some methods train through real agent harness
      containers, while others evaluate fixed or separately fine-tuned model policies.'
    - 'Interaction modality differs: GUI-only action spaces and navigation are central
      in some work, whereas others unify GUI actions with code execution or external
      tool retrieval.'
    - Evaluation targets differ across navigation, grounding, step accuracy and latency,
      recovery consistency, and preference-specific personalization.
    open_questions:
    - How well do current systems generalize beyond the specific platforms and benchmarks
      used for training and evaluation?
    - Can error recovery be trained and measured under a consistent consistency criterion
      across deployed environments?
    - Can efficient inference and low-parameter policies close the remaining accuracy
      gap with large autoregressive agents?
    - How can weakly supervised and data-efficient approaches handle real user preferences,
      noisy interfaces, and personalized workflows?
    - What independent reproduction and artifact reliability evidence is missing when
      trained agents move across teams, datasets, and infrastructure environments?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 面向计算机使用智能体的多模态技能与工具栈
      解决的问题: 将可复用的应用知识组织为按需加载的多模态工件，帮助智能体识别界面元素并验证工作流状态
      尚未覆盖: 这些技能工件如何跨应用泛化、持续更新，并在不依赖紧耦合基础设施的情况下独立部署
    - 路线: 数据高效与弱监督 GUI 策略训练
      解决的问题: 通过从未标注截图学习视觉定位，并结合少量精选数据校准，降低对昂贵人工标注的依赖
      尚未覆盖: 对噪声和分布外界面的鲁棒性，以及向用户特定、真实工作流的迁移能力
    - 路线: 面向 GUI 闭环的高效动作生成与服务
      解决的问题: 通过潜空间候选评分或块级生成替代逐 token 动作解码，降低延迟和参数成本
      尚未覆盖: 效率提升能否在更广泛的平台和分布外任务上匹配或超越强自回归基线
    - 路线: 框架原生端到端训练与统一动作空间
      解决的问题: 在实际部署框架内训练智能体，并将 GUI 动作与代码执行合并，实现环境扎根学习和可验证任务完成
      尚未覆盖: 错误恢复仍较弱，框架设计显著影响可训练性，跨平台迁移证据仍不充分
    - 路线: 失败模式的诊断式评测
      解决的问题: 通过受控探针和基于重放的评测，使恢复一致性和个性化失败可测量
      尚未覆盖: 标准化部署指标、干预向真实环境的迁移，以及当前移动和计算机使用场景之外的覆盖范围
    共识:
    - 多模态视觉接地是 GUI 和计算机使用智能体系统的共同基础。
    - 研究者更倾向使用可执行环境中的成功率和一致性指标，而非仅依赖静态定位分数。
    - 领域正在从仅使用提示词的模型策略，转向在可运行环境中训练或增强的智能体系统。
    - 监督信号越来越多地来自环境反馈、课程学习或在线强化学习，而非仅依赖人工演示。
    - 恢复和个性化等失败模式被视为关键性能问题，而非边缘问题。
    分歧:
    - 动作生成方式不同：有的方法自回归地生成动作或统一 GUI/代码动作空间，有的在潜空间中对候选动作评分，有的采用块级生成。
    - 监督信号不同：大规模未标注截图加强化校准、混合监督微调加在线强化学习、基于检索的技能增强各自依赖不同假设。
    - 部署训练目标不同：部分方法通过真实智能体框架容器训练，其他方法则评测固定或单独微调的模型策略。
    - 交互模态不同：部分工作聚焦 GUI 动作和导航，另一些工作将 GUI 动作与代码执行或外部工具检索统一。
    - 评测目标不同：分别侧重导航、定位、步数和延迟、恢复一致性以及偏好相关的个性化能力。
    开放问题:
    - 当前系统在训练和评测所使用的特定平台与基准之外，泛化能力如何？
    - 能否在部署环境中依据一致性标准训练和测量错误恢复能力？
    - 高效推理和低参数策略能否缩小与大参数自回归智能体之间的精度差距？
    - 弱监督和数据高效方法如何处理真实用户偏好、噪声界面和个性化工作流？
    - 当训练得到的智能体跨团队、数据集和基础设施环境迁移时，缺失哪些独立复现和工件可靠性证据？
