    and by using visual and execution evidence to diagnose failures.'
  - 'Key differences: Studies target different interaction surfaces such as desktop,
    dynamic video, drag, or single-step grounding; they adapt at the skill, harness,
    weak-supervision, online RL, or uncertainty layer and optimize different objectives.'
  - 'Trend evolution: Available high-ranked evidence is concentrated in 2026, so the
    trend is within the current frontier: from static click-oriented evaluation toward
    dynamic, multimodal, verifiable, and reliability-aware evaluation.'
  - 'Open questions: Whether fine-grained metrics predict deployment reliability,
