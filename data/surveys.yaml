  related_work_outline:
  - 'Mainstream direction: Building benchmarks that move beyond static screenshots
    to dynamic, multimodal, and interaction-rich environments (video, drag, CLI+GUI)
    for GUI agents.'
  - 'Shared research pattern: Using fine-grained diagnostics (multi-checkpoint scoring,
    uncertainty quantification, cost–accuracy) to expose capability gaps that aggregate
    success rates hide.'
  - 'Key differences: Benchmarks differ in interaction modality (click vs. drag, static
    vs. live video), evaluation target (task completion vs. observation efficiency
    vs. uncertainty), and platform scope (macOS desktop, short-video platforms, video-guided
    tasks).'
  - 'Trend evolution: Within the 2024–2026 frontier, the field is shifting from single-platform,
    click-only tasks to dynamic, cross-modal settings and from pass/fail metrics to
    capability-aware, risk-sensitive evaluation.'
  - 'Open questions: Whether benchmark conclusions transfer across platforms, interfaces,
    and model families; how to align proxy metrics with real user utility; and how
    to design agents with observation control and calibrated uncertainty.'
  related_work_outline_zh:
  - 主流方向：构建超越静态截图的基准，转向动态、多模态和交互丰富的环境（视频、拖拽、CLI+GUI）以评估GUI代理。
  - 研究共性：利用细粒度诊断（多检查点评分、不确定性量化、成本-准确性）揭示总体成功率掩盖的能力差距。
  - 关键差异：基准在交互模态（点击 vs. 拖拽，静态 vs. 动态视频）、评估目标（任务完成 vs. 观察效率 vs. 不确定性）和平台范围（macOS桌面、短视频平台、视频引导任务）上存在分歧。
  - 趋势演进：在2024-2026年前沿，领域正从单平台、仅点击任务转向动态、跨模态设置，并从通过/失败指标转向能力感知、风险敏感的评估。
  - 开放问题：基准结论是否跨平台、接口和模型家族迁移；代理指标如何与真实用户效用对齐；以及如何设计具有观察控制和校准不确定性能力的代理。
  literature_review:
    line_of_work_matrix:
    - line: Real-world task and environment design
      what_it_solves: Creates diverse, interactive benchmarks (macOS apps, short-video
        platforms, drag operations) that capture GUI complexity beyond click-based
        static screenshots.
      what_remains_open: Whether the task distribution covers all critical interaction
        patterns and deployment settings; generalizability across operating systems
        and interface types.
    - line: Fine-grained capability diagnostics
      what_it_solves: Replaces single success rate with multi-checkpoint scoring,
        cost–accuracy trade-offs, and uncertainty quantification to reveal model weaknesses
        in sub-goal completion, observation control, and risk awareness.
      what_remains_open: Alignment between these proxy metrics and the downstream
        decisions users actually care about; stability of diagnostic rankings across
        model tiers and interfaces.
    - line: Scalable and reproducible evaluation pipelines
      what_it_solves: Enables systematic comparison through deterministic rule-based
        evaluation, synthesized task generation, online RL training, and weak supervision,
        while driving performance with limited annotation.
      what_remains_open: Whether benchmark conclusions remain stable across implementations
        and compute budgets; how well open-source agents approximate closed-source
        baselines without re-evaluation.
    consensus:
    - Aggregate success rates mask important differences in agent behavior; fine-grained
      metrics (sub-goal completion, observation steps, cost) are necessary.
    - Current GUI agents lack observation control, often over- or under-observing
      dynamic interfaces, and cannot reliably self-assess uncertainty.
    - Real-world computer use involves diverse interactions (drag, CLI+GUI, video
      context) that static screenshot benchmarks do not cover.
    - Training methods that leverage unannotated data or verifiable synthetic tasks
      can improve agent performance and reduce annotation cost.
    disagreements:
    - 'Evaluation target: some benchmarks focus on task completion accuracy, others
      on information efficiency (cost–accuracy) or on post-hoc uncertainty calibration.'
    - 'Interaction modality: environments range from click-only desktop GUIs to drag
      operations, live video streams, and video-guided sequences, with no single benchmark
      covering all.'
    - 'Platform and deployment: macOS desktop, short-video platforms, and video-guided
      tasks each impose different assumptions about state representation and action
      space.'
    - 'Training vs. evaluation emphasis: some works prioritize online RL scaling with
      synthetic tasks, while others stress weak supervision from unannotated screenshots,
      leading to different reproducibility and data requirements.'
    open_questions:
    - How can we design agents with explicit observation control so they can decide
      when to gather more information?
    - Do uncertainty-aware and cost-sensitive metrics lead to better real-world deployment
      decisions than pure success rate?
    - Can conclusions from one GUI platform (e.g., macOS desktop) transfer to dynamic,
      video-based interfaces without re-benchmarking?
    - What mixture of interaction types should a comprehensive benchmark include to
      reliably predict real-world agent utility?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 真实世界任务与环境设计
      解决的问题: 创建多样化的交互基准（macOS应用、短视频平台、拖拽操作），捕捉超越点击式静态截图的GUI复杂性。
      尚未覆盖: 任务分布是否覆盖所有关键交互模式和部署场景；跨操作系统和界面类型的泛化性。
    - 路线: 细粒度能力诊断
      解决的问题: 用多检查点评分、成本-准确性权衡和不确定性量化替代单一成功率，揭示模型在子目标完成、观察控制和风险感知方面的弱点。
      尚未覆盖: 这些代理指标与用户真正关心的下游决策之间是否一致；诊断排名在模型层级和接口之间的稳定性。
    - 路线: 可扩展与可复现的评估流水线
      解决的问题: 通过确定性基于规则的评估、合成任务生成、在线RL训练和弱监督实现系统比较，同时在有限标注下提升性能。
      尚未覆盖: 基准结论在不同实现和算力预算下是否稳定；开源代理在无需重新评估的情况下多大程度上逼近闭源基线。
    共识:
    - 聚合成功率掩盖了代理行为中的重要差异；细粒度指标（子目标完成度、观察步数、成本）是必要的。
    - 当前GUI代理缺乏观察控制，常在动态界面上过度或不足观察，且无法可靠地自我评估不确定性。
    - 真实世界计算机使用涉及多种交互（拖拽、CLI+GUI、视频上下文），这是静态截图基准无法覆盖的。
    - 利用未标注数据或可验证合成任务的训练方法可以提升代理性能并降低标注成本。
    分歧:
    - 评估目标：一些基准关注任务完成准确性，另一些关注信息效率（成本-准确性）或事后不确定性校准。
