  related_work_outline:
  - 'Mainstream direction: Building and using GUI/computer-use benchmarks around real
    or simulated interactive environments—desktop, short-video, and video-guided—with
    explicit task success checks and multi-model comparisons. The field is moving
    from static screenshots toward dynamic, multimodal, and real-world OS/web tasks.'
  - 'Shared research pattern: Works define tasks, evaluate agents against baselines,
    and report success plus failure modes; many add finer signals such as sub-goal
    completion, cost-accuracy, or uncertainty. They also pair benchmark results with
    attempts to improve agents through skills, harness changes, weak supervision,
    or RL.'
  - 'Key differences: Evaluation targets range from single-step grounding to multi-step
    task completion; metrics emphasize aggregate Pass@1, information efficiency, or
    uncertainty calibration; supervision uses manual annotation, synthesized verifiable
    tasks, or unannotated screenshots; interventions span frozen-model scaffolding
    and training.'
  - 'Trend evolution: Selected evidence is all 2026 within a narrow 2024–2026 span,
    so the visible trend is within the current frontier: more dynamic/multimodal benchmarks,
    finer-grained evaluation, and scaling through synthetic or weakly supervised data
    plus scaffold optimization.'
  - 'Open questions: Observation control in dynamic interfaces, cross-platform and
    cross-model metric transfer, alignment of benchmark scores with user utility,
    and stability of benchmark-driven gains across implementations and compute budgets
    remain unresolved. Several sources have missing limitation or artifact details,
    leaving verification gaps.'
  related_work_outline_zh:
  - 主流方向：围绕真实或模拟交互环境构建GUI/计算机使用基准，覆盖桌面、短视频和视频引导任务，以明确任务成功检查和多模型比较为核心，从静态截图走向动态多模态与真实OS/Web任务。
  - 研究共性：大多定义任务、对基线评估并报告成功率与失败模式；部分增加子目标完成、成本-信息效率或不确定性等细粒度信号，同时用技能库、执行框架、弱监督或RL改进代理。
  - 关键差异：评估目标从单步GUI定位到多步任务完成；指标侧重总分、信息效率或校准；监督来自人工标注、可验证合成或未标注截图；干预层次包括冻结模型脚手架与策略训练。
  - 趋势演进：证据集中在2026年，处于2024–2026窄区间前沿；可见趋势是更多动态多模态基准、更细粒度评估，以及通过合成/弱监督数据和执行框架优化进行扩展。
  - 开放问题：动态界面中的观察控制、跨平台与跨模型指标迁移、基准分数与用户效用的一致性、基准提升在不同实现和算力预算下的稳定性，以及若干可复现性缺口仍待解决。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design
      what_it_solves: Creates shared tasks and environments for comparing GUI/computer-use
        agents on desktop, short-video, and video-guided interactions with explicit
        success conditions.
      what_remains_open: Coverage beyond tested platforms and dynamic interface types
        is not established; some sources do not report limitation details or task-distribution
        rationale in the visible evidence.
    - line: Metric and stress-test design
      what_it_solves: Probes sub-goal completion, cost-accuracy/information efficiency,
        and uncertainty/calibration of GUI grounding rather than relying only on aggregate
        scores.
      what_remains_open: Single-step grounding evaluations do not cover multi-step
        agent trajectories; uncertainty-ranking transfer across model classes and
        interfaces is weak, and conformal coverage degrades under distribution shift.
    - line: Comparable baselines and benchmark-driven agent improvement
      what_it_solves: Separates model capability from scaffolding and training interventions—skill
        libraries, harness edits, weak supervision, verifiable synthesis, and online
        RL—across shared benchmark backbones and transfer checks.
      what_remains_open: Cross-benchmark stability is only partially verified; the
        impact of implementation details, compute budgets, and training-data scale
        is not fully controlled, and several reproducibility details are absent from
        visible evidence.
    consensus:
    - Current evaluation is organized around task completion in executable or simulated
      interactive environments with explicit success checks and multiple model/framework
      comparisons.
    - Aggregate success scores are treated as insufficient because they hide differences
      in sub-goal completion, observation efficiency, or grounding uncertainty.
    - Task design is expanding toward real desktops, dynamic feeds, and video-guided
      interfaces, adding multimodal observation challenges beyond static screens.
    - Reducing reliance on expensive human annotation is a shared concern, addressed
      through verifiable task synthesis, weak supervision, skill libraries, or harness
      optimization.
    disagreements:
    - 'Evaluation target differs: single-step GUI grounding versus multi-step task
      completion versus dynamic-interface observation control.'
    - 'Supervision differs: manually curated or annotated datasets versus verifiable
      synthesized tasks versus weakly supervised use of unannotated screenshots.'
    - 'Metric emphasis differs: aggregate Pass@1 and sub-goal checkpoints versus cost-accuracy/information
      efficiency versus uncertainty ranking and conformal spatial coverage.'
    - 'Intervention level differs: frozen-agent scaffolding such as multimodal skills
      or harness edits versus training the policy through weak supervision or online
      RL.'
    open_questions:
    - How well do current benchmark task distributions transfer to unobserved platforms,
      dynamic interfaces, and multi-application workflows beyond the tested apps?
    - Can uncertainty-aware GUI grounding maintain calibration and ranking across
      model classes, interfaces, and distribution shifts without target-specific reranking?
    - Which proxy metrics—such as Pass@1, cost-accuracy, or sub-goal completion—best
      predict downstream user utility and deployment reliability?
    - Are improvements from skill libraries, harness edits, and weak supervision stable
      across implementations, compute budgets, and unseen benchmark suites?
    - What mechanisms can give agents explicit control over over- and under-observation
      in dynamic interfaces?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 真实与动态GUI基准任务与数据集设计
      解决的问题: 为桌面、短视频和视频引导交互环境中的GUI/计算机使用代理提供共享任务、成功条件和多模型比较基础。
      尚未覆盖: 任务分布对未覆盖平台、动态界面和多应用工作流的覆盖仍缺乏证据，部分来源在可见证据中缺少限制说明。
    - 路线: 细粒度指标与压力测试设计
      解决的问题: 在总分之外评估子目标完成、成本-信息效率以及GUI定位不确定性或校准。
      尚未覆盖: 单步GUI定位无法覆盖多步轨迹；跨模型与跨接口的不确定性排序迁移较弱，分布偏移下共形覆盖下降。
    - 路线: 可比较的基线与基准驱动的代理改进
      解决的问题: 在共享基准上区分模型能力与技能库、执行框架、弱监督或RL等干预带来的增益，并进行跨基准迁移检查。
      尚未覆盖: 结论在不同实现、算力预算和部署设置下的稳定性未被充分验证；部分方法在可见证据中缺少完整限制与可复现工件细节。
    共识:
    - 当前工作围绕可执行或模拟交互环境中的任务完成展开，使用显式成功检查和多模型/框架比较。
    - 单一成功率或总分不足以区分能力，研究者普遍加入子目标、成本效率或不确定性等细粒度信号。
    - 任务设计正在向真实桌面、动态短视频和视频引导等多模态界面扩展。
    - 减少对昂贵人工标注的依赖是共同关注点，方法包括可验证合成、弱监督、技能库和执行框架优化。
    分歧:
    - 评估目标不同：单步GUI定位、多步任务完成、动态界面观察控制等。
    - 监督信号不同：人工标注数据集、可验证合成任务、未标注截图的弱监督。
    - 指标侧重不同：Pass@1与子检查点、成本-信息效率、不确定性排序与共形空间覆盖。
    - 干预层次不同：冻结代理的外部技能或执行框架修改，与通过RL训练策略本身。
    开放问题:
    - 当前基准任务分布在多大程度上能迁移到未见平台、动态界面和多应用工作流？
    - 基于不确定性的GUI定位能否在跨模型、跨接口和分布偏移下保持校准与排序，而无需目标特定重排？
    - 哪种代理指标，如Pass@1、成本-信息效率或子目标完成，最能预测用户实际效用和部署可靠性？
    - 技能库、执行框架和弱监督带来的提升能否在不同实现、算力预算和未见基准上保持稳定？
