  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端训练与部署闭环的GUI/计算机使用智能体
      解决的问题: 将GUI操作、代码执行、弱截图监督或框架回滚转化为可训练智能体策略，使其在桌面、网页、移动或框架环境中运行。
