  related_work_outline_zh:
  - 主流方向：在真实计算机使用任务上评测和改进 GUI 智能体，覆盖桌面、移动、网页和动态媒体应用；关注任务完成率、细粒度指标、技能/记忆增强和执行效率。
  - 研究共性：构建面向应用的交互任务和可执行/规则化检查，评估前沿视觉语言智能体，再通过模块化知识/记忆或专用 GUI 模型改善定位与重复执行。
  - 关键差异：任务覆盖静态桌面、动态短视频、拖拽和视频引导交互；改进方式包括多模态技能库、可重放记忆/状态机、微调或扩散模型；指标从 Pass@1 到成本-准确率和子目标完成度不等。
  - 趋势演进：在 2024-2026 证据包中，代表性工作集中在 2026 前沿；趋势由点击式网页任务转向真实 OS/应用基准、动态界面和效率导向的复用机制。
  - 开放问题：未解决问题包括观察控制、多模态技能与重放记忆在已测应用之外的迁移、复现工件缺失，以及真实部署中的成本与安全权衡。
  literature_review:
    line_of_work_matrix:
    - line: Realistic GUI task benchmarking and evaluation
      what_it_solves: Measures agent capability on real OS/application, dynamic media,
        drag-based, and video-guided tasks with fine-grained task outcomes.
      what_remains_open: Whether benchmark results transfer across platforms and task
        types; current models lack observation control and human-level cost-accuracy
        on dynamic interfaces.
    - line: Multimodal skill and operational knowledge provisioning
      what_it_solves: Provides application-specific visual and textual procedures
        to improve UI element identification and workflow state verification.
      what_remains_open: Evidence is limited to selected applications and benchmarks;
        transfer to new or dynamic apps and alignment with live UI changes remain
        unclear.
    - line: Reusable memory and replay-based efficiency
      what_it_solves: Compiles validated trajectories into state-machine programs
        or parameter-controlled callable memories to reduce token cost and execution
        time for repeated tasks.
      what_remains_open: Deterministic applicability constraints limit use; generalization
        under layout, state, or parameter changes and tradeoffs with fresh planning
        remain open.
    - line: GUI-native vision-language model training
      what_it_solves: Builds multimodal agents via supervised fine-tuning or block-wise
        diffusion training for grounding and navigation across platforms.
      what_remains_open: Reported benchmark coverage and reproducibility evidence
        are limited; cross-platform deployment, safety, and comparison with retrieval-augmented
        systems remain unclear.
    consensus:
    - GUI agents are evaluated on grounded interactive tasks with executable or rule-based
      checks, moving beyond static screenshot-only evaluation.
    - Fine-grained task outcomes are necessary because aggregate success hides differences
      in sub-goal completion, observation efficiency, and grounding quality.
    - Augmenting agents with externalized knowledge, procedures, or memory improves
      either task success or runtime efficiency.
    - Frontier models still do not reach human-level performance on dynamic, drag-based,
      and video-guided GUI tasks.
    disagreements:
    - 'Reusable knowledge representation differs: some works store multimodal visual-textual
      skills, while others compile state-machine programs or parameter-controlled
      callable memories.'
    - 'Evaluation target differs: desktop OS application completion, dynamic short-video
      information tasks, drag-only grounding, and video-guided interactive tasks focus
      on different interaction modes.'
    - 'Improvement mechanism differs: retrieval or loading of external skills, replay
      compilation, fine-tuning a VLM on drag data, or training a diffusion-based GUI
      model.'
    - 'Metrics differ: Pass@1 and score-based completion coexist with cost-accuracy,
      information efficiency, sub-goal completion, and grounding accuracy, making
      direct comparison difficult.'
    open_questions:
    - How can GUI agents acquire explicit observation control to reduce over- and
      under-observation on dynamic interfaces?
    - Do multimodal skill libraries transfer beyond the few evaluated applications
      and benchmarks, and how much does live UI exploration matter?
    - Under what conditions do replayable memories remain safe and correct when layouts,
      parameters, or application states change?
    - Is block-wise diffusion training for GUI agents competitive beyond reported
      grounding and navigation benchmarks and reproducible in real deployments?
    - 'Which evaluation metric should be prioritized for professional or office automation:
      task completion, cost-accuracy, sub-goal progress, or execution time?'
  literature_review_zh:
    研究路线矩阵:
    - 路线: 真实 GUI 任务基准与评测
      解决的问题: 衡量智能体在真实操作系统/应用、动态媒体、拖拽和视频引导任务上的能力，并提供细粒度结果反馈。
      尚未覆盖: 基准结果能否跨平台和任务类型迁移；当前模型在动态界面上的观察控制和成本-准确率未达人类水平。
    - 路线: 多模态技能与操作知识供给
      解决的问题: 提供面向应用的可视化和文本化操作过程，以改善 UI 元素识别和工作流状态校验。
      尚未覆盖: 现有证据来自特定应用/基准；向新应用或动态 UI 变化的迁移，以及与实时界面状态的匹配仍不明确。
    - 路线: 可复用记忆与重放式效率优化
      解决的问题: 将已验证轨迹编译为状态机程序或参数可控的可调用记忆，以降低重复任务的 token 成本与执行时间。
      尚未覆盖: 受确定性适用条件限制；布局、状态或参数变化时的泛化，以及重放与重新规划之间的权衡仍未解决。
    - 路线: GUI 原生视觉语言模型训练
      解决的问题: 通过监督微调或块级扩散训练构建多模态智能体，用于跨平台定位和导航。
      尚未覆盖: 已报告基准覆盖和复现证据有限；跨平台部署、安全性以及与检索增强系统的比较尚不清楚。
    共识:
    - GUI 智能体在具有可执行或规则化检查的交互任务上评估，已超越仅静态截图评测。
    - 需要细粒度结果反馈，因为总体成功率会掩盖子目标完成、观察效率或拖拽/定位质量的差异。
    - 通过外部化知识、操作流程或记忆进行增强，可改善成功率或执行效率。
    - 前沿模型在动态、拖拽和视频引导的 GUI 任务上仍未达到人类水平。
