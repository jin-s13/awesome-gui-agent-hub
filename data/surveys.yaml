  literature_review:
    line_of_work_matrix:
    - line: Survey/roadmap synthesis
      what_it_solves: Organizes fragmented GUI-agent evidence into directions, milestones,
        and research gaps for readers and future work.
      what_remains_open: Whether the synthesis is systematic or selective, and which
        gaps should be prioritized for the next research cycle.
    - line: Comparative evaluation synthesis
      what_it_solves: Summarizes how controlled benchmarks and evaluation choices
        shape claims about GUI agent success, transfer, and uncertainty.
      what_remains_open: Comparability across different interfaces, task horizons,
        and availability of cues such as URLs, internal states, or executable outcomes.
    - line: Open problem and gap mapping
      what_it_solves: Turns broad GUI-agent coverage into concrete next questions
        about robustness, safety, and long-horizon control.
      what_remains_open: Prioritization of gaps and validation of proposed directions
        beyond single benchmark settings.
    - line: Benchmark and protocol construction
      what_it_solves: Produces task suites and protocols for video-guided, mobile,
        SMS-to-webpage, and browser/coding agent evaluation under controlled cues.
      what_remains_open: Reported performance may not hold under distribution shift,
        optimized attacks, or multi-step trajectories; missing artifacts and limitations
        reduce reproducibility.
    - line: Capability scaling and training synthesis
      what_it_solves: Uses verifiable task synthesis, demonstration transformation,
        or online RL with noisy evaluator rewards to improve agent success.
      what_remains_open: Noise correction, domain generalization, and availability
        of training and evaluation artifacts remain partially verified.
    - line: Safety and uncertainty auditing
      what_it_solves: Measures whether agents know what they do not know and whether
        safety hardening resists hand-crafted attacks across domains.
      what_remains_open: Evaluation is limited to specific attack templates, single-step
        grounding, or particular model tiers; transfer to optimized attacks and other
        interfaces is open.
    consensus:
    - Controlled evaluation settings are used to reduce shortcut-based claims and
      make agent behavior comparable under known cues.
    - Task success and ranking transfer are treated as important evidence, but often
      require target-specific re-evaluation.
    - Evaluation signals, whether VLM judges, verifiable rollouts, or post-hoc uncertainty,
      are modeled as imperfect or condition-dependent.
    - Long-horizon and multi-step settings expose weaknesses not visible in single-step
      grounding.
    disagreements:
    - Interaction surfaces differ across mobile, desktop/web, video-guided, and SMS-to-webpage
      workflows, changing grounding and horizon requirements.
    - 'Supervision signals differ: verifiable task execution, autonomous vision-language
      judges, human demonstrations, or post-hoc calibration each carry different noise
      and coverage assumptions.'
    - 'Safety and robustness evidence is domain-conditioned: strong browser attack
      resistance does not transfer to coding tasks, and uncertainty rankings transfer
      only within narrower dataset/model conditions.'
    - Evaluation protocols differ between single-step executable grounding and multi-step
      agent trajectories, making cross-benchmark claims difficult.
    open_questions:
    - Which GUI-agent evaluation settings and metrics are comparable across surfaces,
      horizons, and cue-availability conditions?
    - How can verifiable reward or evaluator noise be calibrated without overfitting
      to a particular benchmark?
    - Can uncertainty calibration and safety hardening transfer across domains, interfaces,
      and attack optimization levels without target-specific reranking?
    - Which gaps should survey/roadmap work prioritize when many high-scoring papers
      still lack visible code, dataset, baseline, or limitation details?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 综述/路线图综合
      解决的问题: 把碎片化 GUI 智能体证据整理为方向、里程碑和研究缺口。
      尚未覆盖: 综合是否系统性而非选择性，以及哪些缺口应优先进入下一轮研究。
    - 路线: 比较评测综合
      解决的问题: 总结受控基准和评测选择如何影响 GUI 智能体成功率、迁移和不确定性结论。
      尚未覆盖: 在界面、任务长度以及 URL、内部状态或可执行结果等线索可用性不同的条件下，结果是否可比。
    - 路线: 开放问题与缺口映射
      解决的问题: 把广泛 GUI 智能体覆盖转化为关于鲁棒性、安全性和长时域控制的具体研究问题。
      尚未覆盖: 缺口优先级以及这些方向在单一基准之外是否仍然成立。
    - 路线: 基准与协议构建
      解决的问题: 为视频引导、移动端、短信到网页以及浏览器/编码智能体提供受控任务集和评测协议。
      尚未覆盖: 性能在分布偏移、优化攻击或多步轨迹下可能不保持；代码、数据集和局限信息缺失影响可复现性。
    - 路线: 能力扩展与训练综合
      解决的问题: 通过可验证任务合成、演示转换或带噪声评估器奖励的在线强化学习提升智能体成功率。
      尚未覆盖: 噪声校正、跨域泛化和训练/评测工件可用性仍待验证。
    - 路线: 安全与不确定性审计
      解决的问题: 评估智能体是否了解自身不确定性，以及安全加固能否跨域抵抗手工攻击。
      尚未覆盖: 评测限于特定攻击模板、单步基础或特定模型层级，向优化攻击和其他界面的迁移尚未解决。
    共识:
    - 受控评测设置被用来减少捷径式判断，使智能体行为在已知线索下更可比较。
    - 任务成功率和排名迁移被视作重要证据，但通常需要针对目标模型或数据集重新评估。
    - 评测信号（VLM 评估器、可验证执行或后验不确定性）被建模为不完美或依赖条件。
    - 长时域和多步设置暴露了单步基础中不可见的弱点。
    分歧:
    - 交互载体不同：移动端、桌面/网页、视频引导和短信到网页工作流改变了基础与时间跨度要求。
    - 监督信号不同：可验证任务执行、自主视觉语言评估器、人类演示或后验校准各有不同噪声和覆盖假设。
    - 安全与鲁棒性证据具有领域条件：浏览器攻击抵抗不迁移到编码任务，不确定性排名仅在较窄数据集/模型条件下迁移。
    - 评测协议不同：单步可执行基础与多步智能体轨迹之间的跨基准声明难以比较。
    开放问题:
    - 哪些 GUI 智能体评测设置和指标能在不同界面、时间跨度和线索可用性之间保持可比？
    - 如何校准可验证奖励或评估器噪声而不在特定基准上过拟合？
    - 不确定性校准和安全加固能否在域、界面和攻击优化水平之间迁移而无需目标特定重排？
    - 当许多高分论文仍缺少可见代码、数据集、基线或局限细节时，综述/路线图应优先关注哪些缺口？
