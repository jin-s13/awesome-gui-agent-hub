  literature_review:
    line_of_work_matrix:
    - line: Real-world and dynamic GUI/computer-use benchmark construction
      what_it_solves: Creates shared tasks for desktop, browser, and app automation
        where agents must ground screens, choose actions, and complete multi-step
        goals under realistic interaction constraints.
      what_remains_open: Coverage remains skewed by each suite's chosen platforms
        and interaction modes; dynamic content, drag actions, GUI+CLI, and cross-app
        workflows are only partially sampled.
    - line: Fine-grained metric and uncertainty/stress-test design
      what_it_solves: Moves evaluation beyond aggregate success to measure sub-goal
        completion, observation efficiency, grounding certainty, and spatial safety.
      what_remains_open: Proxy metrics are not yet tied to downstream user decisions,
        and uncertainty rankings transfer weakly across model classes and interfaces.
    - line: Training-data, task-synthesis, and skill-library methods evaluated against
        benchmarks
      what_it_solves: Reduces annotation dependence and improves agent performance
        via weak supervision, verifiable synthesized tasks, or multimodal skill retrieval.
      what_remains_open: Whether gains reflect learned capability or benchmark-specific
        task distributions, and whether they transfer to unseen applications and deployment
        settings remains unclear.
    - line: Comparable evaluation protocols and multi-framework baselines
      what_it_solves: Provides deterministic checks, multiple model/framework comparisons,
        and artifacts for auditing benchmark results.
      what_remains_open: Stability across implementations, compute budgets, and closed-source
        internal-state access is not established; some top results lack explicit limitation
        or artifact evidence.
    consensus:
    - GUI/computer-use evaluation requires realistic environments that span more than
      static click-only screens; recent work converges on adding desktop OS, dynamic
      video feeds, drag, and cross-modal workflows.
    - Aggregate pass/fail is insufficient; fine-grained sub-goal, cost-accuracy, calibration,
      and observability measures reveal model gaps that top-level success hides.
    - Grounding and action choice improve when agents can access structured artifacts
      such as skills, task curricula, or synthesized verifiable tasks, rather than
      relying only on raw screen pixels and text.
    - Current agents still underperform humans in observation control, sub-goal completion,
      and uncertainty-aware decision making, so benchmarks double as stress tests.
    disagreements:
    - 'Evaluation target: some works evaluate single-step executable grounding and
      calibration, while others evaluate multi-step desktop/web trajectories or task-level
      pass rates.'
    - 'Interaction/deployment setting: environments differ among real macOS desktops,
      browser-based short-video simulations, drag-specific datasets, and video-guided
      GUI tasks.'
    - 'Supervision and learning signal: approaches differ between human-labeled tasks,
      weakly supervised unannotated screenshots, verifiable online RL task synthesis,
      and retrieval over multimodal skill libraries.'
    - 'Success metric: choices differ among Pass@1, fine-grained checkpoint scores,
      cost-accuracy, UQ ranking transfer, and calibrated spatial coverage; these can
      rank models differently.'
    open_questions:
    - How well do current benchmark distributions cover the full space of real GUI
      interactions, including drag, dynamic content, CLI+GUI, and cross-application
      workflows?
    - Can uncertainty quantification and conformal coverage remain reliable when transferred
      across open/closed model tiers, interfaces, or deployment shifts?
    - Are verifiable task synthesis and weak supervision teaching general computer-use
      behavior, or mostly optimizing for particular benchmark success signals?
    - When aggregate success and sub-goal scores disagree, which metrics best predict
      user-facing reliability and decision utility?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 真实与动态 GUI/计算机使用基准构建
      解决的问题: 为桌面、浏览器和应用自动化建立共享任务，使代理在现实交互约束下完成屏幕定位、动作选择和多步目标。
      尚未覆盖: 各套件对平台和交互模式的采样仍偏窄；动态内容、拖拽、GUI+CLI、跨应用流程只被部分覆盖。
    - 路线: 细粒度指标与不确定性/压力测试设计
      解决的问题: 超越总体成功率，衡量子目标完成、观察效率、定位确定性和空间安全。
      尚未覆盖: 代理指标尚未与下游用户决策对齐，不确定性排序在模型类别和界面间迁移较弱。
    - 路线: 面向基准评测的训练数据、任务合成与技能库方法
      解决的问题: 通过弱监督、可验证合成任务或多模态技能检索降低标注依赖并提升代理表现。
      尚未覆盖: 性能提升究竟是真实能力还是基准特定分布所致，以及能否迁移到未见应用和部署环境仍不清楚。
    - 路线: 可比评测协议与多框架基线
      解决的问题: 提供确定性检查、多模型多框架比较和可审计工件。
      尚未覆盖: 实现、算力预算和闭源内部状态访问下的稳定性尚未建立；部分成果缺少明确的局限性与工件证据。
    共识:
    - GUI/计算机使用评测需要覆盖静态点击之外的现实环境，近期工作汇集到桌面 OS、动态视频流、拖拽和跨模态流程。
    - 单一通过率不够；细粒度子目标、成本-准确性、校准和观察效率指标能揭示模型差异。
    - 当代理能访问技能、课程或可验证合成任务等结构化工件时，定位和动作选择往往优于仅依赖屏幕像素与文本。
    - 当前代理在观察控制、子目标完成和不确定性感知决策上仍弱于人类，因此基准同时承担压力测试角色。
    分歧:
    - 评测目标：有的工作评估单步可执行定位与校准，有的评估多步桌面/网页轨迹或任务级通过率。
    - 交互与部署设置：环境分为真实 macOS 桌面、浏览器短视频模拟、拖拽专项数据集和视频引导 GUI 任务。
    - 监督与学习信号：人工标注、未标注截图弱监督、可验证在线 RL 合成和技能库检索之间存在差异。
    - 成功指标不同：Pass@1、细粒度检查点得分、成本-准确性、UQ 排序迁移和校准空间覆盖可能给出不同排名。
    开放问题:
