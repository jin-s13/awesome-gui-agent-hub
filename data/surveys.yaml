    strategy (rule-based vs. model-based), and optimization focus (accuracy vs. efficiency
    vs. safety).'
  - 'Trend evolution: From static single-app benchmarks to dynamic, multi-app, video-guided,
    and repeat-task scenarios, with a 2026 peak in realism and efficiency.'
  - 'Open questions: Generalization across unseen apps and dynamic interfaces, observation
    control for video agents, and safe deployment without reputation shortcuts.'
  related_work_outline_zh:
  - 主流方向：通过丰富基准和技能库，将GUI代理扩展到真实桌面、移动和网页应用。
  - 研究共性：多模态视觉语言模型与特定应用基础结合，并通过细粒度任务级指标评估。
  - 关键差异：交互粒度（点击、拖拽、视频），评估策略（基于规则 vs 基于模型），优化重点（准确性 vs 效率 vs 安全性）。
  - 趋势演进：从静态单应用基准到动态、多应用、视频引导和重复任务场景，2026年达到真实性和效率的顶峰。
  - 开放问题：在未见应用和动态界面上的泛化，视频代理的观察控制，以及在无信誉捷径下的安全部署。
  literature_review:
    line_of_work_matrix:
    - line: Real-world application benchmarks
      what_it_solves: Systematic evaluation of GUI agents on diverse desktop, mobile,
        and web tasks with fine-grained metrics, revealing failure modes such as over‑observation
        and poor benign recall.
      what_remains_open: Benchmarks are often platform‑ or scenario‑specific; generalization
        to unseen applications and real‑world deployment conditions remains unverified.
    - line: Skill and knowledge injection
      what_it_solves: Improving GUI agent performance by providing hierarchical multimodal
        skill libraries or compiled state‑machine programs that capture visual and
        procedural knowledge.
      what_remains_open: Skill construction still requires manual or semi‑automated
        pipelines; transfer across applications and resilience to UI changes are not
        yet demonstrated.
    - line: Dynamic and video‑guided interaction
      what_it_solves: Extending GUI agents to environments where content changes between
        actions, and to tasks where instructions come from video demonstrations.
      what_remains_open: Observation control (deciding when to look) remains a key
        weakness; efficient keyframe selection and handling of long‑form video are
        open problems.
    - line: Agent execution optimization
      what_it_solves: Reducing cost and latency for repeated tasks by replaying verified
        action sequences, and improving planning with history‑aware visual critics.
      what_remains_open: Compiled programs may break under UI variations; critics
        require training on real trajectories and may not generalize to entirely new
        agent architectures.
    - line: Safety‑critical applications
      what_it_solves: Applying GUI agents to detect fraud in SMS‑to‑webpage chains
        without relying on URL reputation shortcuts.
      what_remains_open: Performance degrades when reputation signals are removed;
        benign recall remains low, and the limited case set may not cover real‑world
        fraud diversity.
    consensus:
    - Multimodal vision‑language models are the backbone for GUI agents, but they
      need application‑specific grounding to handle diverse interfaces.
    - Fine‑grained, multi‑step evaluation (e.g., checkpoint scoring, cost‑accuracy)
      is necessary to capture subtle capability differences.
    - Current agents struggle with dynamic content, rare interactions, and tasks requiring
      long‑term planning or observation control.
    disagreements:
    - 'Evaluation philosophy: rule‑based deterministic scoring (MacAgentBench) vs.
      model‑based or human‑referenced metrics (LivingScreen, VG‑GUIBench).'
    - 'Knowledge representation: explicit skill libraries with visual figures (VISUALSKILL)
      vs. compiled state‑machine programs (PreAct) vs. learned critics (HiViG).'
    - 'Interaction focus: click‑based GUIs (DragOn) vs. video‑driven tasks (VG‑GUIBench)
      vs. dynamic short‑video platforms (LivingScreen).'
    - 'Optimization goal: raw success rate (MacAgentBench, DragOn) vs. efficiency
      and speed (PreAct) vs. safety and fraud detection (FraudSMSWalker).'
    open_questions:
    - How can agents learn to control their own observation frequency in dynamic interfaces
      without exhaustive manual tuning?
    - Can skill libraries and compiled programs automatically adapt to UI updates
      or application version changes?
    - What is the minimal set of reputation or context signals needed to maintain
      fraud detection accuracy while preserving benign recall?
    - How do benchmark rankings translate to real‑world user satisfaction and task
      completion rates in unconstrained environments?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 真实应用基准测试
      解决的问题: 在多样化桌面、移动和网页任务上系统评估GUI代理，通过细粒度指标揭示失败模式，如过度观察和良性召回不足。
      尚未覆盖: 基准通常局限于特定平台或场景；对未见应用和真实部署条件的泛化仍未被验证。
    - 路线: 技能与知识注入
      解决的问题: 通过提供层次化多模态技能库或编译的状态机程序来提升GUI代理性能，捕获视觉和流程知识。
      尚未覆盖: 技能构建仍需人工或半自动流水线；跨应用迁移和对UI变化的适应尚未被证明。
    - 路线: 动态与视频引导交互
      解决的问题: 将GUI代理扩展到内容在操作间变化的环境，以及指令来自视频演示的任务。
      尚未覆盖: 观察控制（何时观察）仍是关键弱点；高效关键帧选择和处理长视频是开放问题。
    - 路线: 代理执行优化
      解决的问题: 通过重放已验证的动作序列降低重复任务的成本和延迟，并利用历史感知的视觉评判器改善规划。
      尚未覆盖: 编译的程序可能在UI变化时失效；评判器需要真实轨迹训练，可能无法泛化到全新代理架构。
    - 路线: 安全关键应用
      解决的问题: 将GUI代理应用于短信到网页欺诈检测，不依赖URL信誉捷径。
      尚未覆盖: 移除信誉信号后性能下降，良性召回率低，且有限的案例集可能无法覆盖真实欺诈多样性。
    共识:
    - 多模态视觉语言模型是GUI代理的骨干，但需要特定应用的基础来应对多样化界面。
    - 细粒度、多步骤评估（如检查点评分、成本-准确性）对于捕捉隐性能力差异是必要的。
    - 当前代理在动态内容、罕见交互以及需要长期规划或观察控制的任务上表现挣扎。
    分歧:
    - 评估哲学：基于规则的确定性评分（如 MacAgentBench）与基于模型或人工参考的指标（如 LivingScreen、VG‑GUIBench）。
    - 知识表示：显式含视觉图文的技能库（VISUALSKILL）与编译的状态机程序（PreAct）与学习的评判器（HiViG）。
    - 交互聚焦：基于点击的GUI（DragOn）与视频驱动的任务（VG‑GUIBench）与动态短视频平台（LivingScreen）。
    - 优化目标：原始成功率（MacAgentBench、DragOn）与效率与速度（PreAct）与安全与欺诈检测（FraudSMSWalker）。
    开放问题:
    - 代理如何在没有详尽手动调参的情况下，学会在动态界面中控制自身的观察频率？
    - 技能库和编译程序能否自动适应UI更新或应用版本变化？
    - 在保持良性召回的同时，实现欺诈检测所需的最少信誉或上下文信号是什么？
    - 基准排名如何转化为无约束环境中的真实用户满意度和任务完成率？
