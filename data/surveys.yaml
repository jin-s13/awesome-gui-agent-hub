    consensus:
    - Recent work uses vision-language or multimodal models as GUI/computer-use agents
      and judges progress by benchmark success rates or ranking metrics.
    - 'There is a common move toward scalable signals: verifiable task generation,
      autonomous evaluators, trajectory demonstrations, or inferred context actions
      reduce reliance on hand-built examples.'
    - Evaluation is becoming more robustness-aware, covering uncertainty, safety attacks,
      and out-of-distribution generalization rather than only clean task success.
    - Reproducibility evidence is uneven; some papers expose code or datasets while
