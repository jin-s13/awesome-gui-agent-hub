    disagreements:
    - 'Representation and generation differ: text-only skills versus multimodal visual
      artifacts versus block-wise diffusion vision-language agents versus task-driven
      keyframe extraction.'
    - 'Supervision and improvement signals differ: rule-based scoring, interaction-data
      fine-tuning, skill-library retrieval, state-machine replay with fallback, and
      environment reconstruction verification.'
    - 'Evaluation targets and interaction modes differ: static desktop/web click-type
      tasks, GUI+CLI mixed workflows, drag gestures, dynamic short-video feeds, and
      video-guided tasks.'
    - 'Deployment assumptions differ: some require per-site authorization, some assume
      clean-state verification, and some depend on runtime screen checking, guardrails,
