  - 'Shared research pattern: Environment-grounded task completion with deterministic
    or fine-grained scoring, VLM agents, and failure diagnosis from execution evidence.'
  - 'Key differences: Measurement versus behavior improvement; supervision signal;
    interaction scope such as click, drag, GUI+CLI, or dynamic screens; open-weight
    versus closed-source access.'
  - 'Trend evolution: Visible top-paper evidence is concentrated in 2026, suggesting
    a current-frontier shift from static click grounding toward dynamic screens, richer
