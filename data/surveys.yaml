  - 关键差异：有的引入多模态技能库（VISUALSKILL），有的把成功轨迹编译为状态机以加速（PreAct），有的用扩散解码改变模型架构（LLaDA-UI），有的统一
    GUI 与代码动作空间（OS-Helix）。
  - 趋势演进：在 2024-2026 前沿内，重点从静态点击任务转向动态、视频引导和拖拽交互，并更关注细粒度评分、可复用技能、编译工作流以及端到端强化学习训练。
  - 开放问题：动态界面中的观察控制尚未解决；跨系统、应用和未见工作流的迁移仍不清楚；代码、数据集与局限说明缺失仍是复现性缺口。
  literature_review:
    line_of_work_matrix:
    - line: Real-world OS and desktop agent benchmarking
      what_it_solves: Measures end-to-end GUI and CLI task completion in authentic
        desktop environments with task suites, rule-based checkpoints, and capability
        annotations.
      what_remains_open: Whether fine-grained sub-goal metrics predict real productivity,
        and whether results transfer across operating systems, applications, and interface
        languages.
    - line: Dynamic and video-guided interface perception
      what_it_solves: Formalizes GUI control when screen content or workflows change
        over time and evaluates observation efficiency rather than only final accuracy.
      what_remains_open: Observation-control mechanisms remain weak; evidence is currently
        concentrated on short-video platforms and specific video question-answering
        benchmarks.
    - line: Application-specific multimodal skill libraries
      what_it_solves: Captures visual and textual workflow knowledge per application
        so agents can retrieve grounded instructions and UI figures during task execution.
      what_remains_open: Generalization to unseen applications, version drift, skill-building
        cost, and whether visual artifacts remain useful at scale are unclear.
    - line: Specialized interaction grounding
      what_it_solves: Covers drag-based, non-click interactions including highlighting,
        resizing, cell selection, and slider manipulation via large datasets and fine-tuning.
      what_remains_open: Whether drag grounding transfers to real-world continuous
        control, touch, or stylus input beyond the collected screenshot-task distribution.
    - line: Efficient and reusable workflow execution
      what_it_solves: Compiles successful agent trajectories into state-machine programs
        with screen-check fallback to remove per-step language model calls and speed
        repeated tasks.
      what_remains_open: Robustness under GUI layout changes, distribution shift,
        ambiguous state matching, and long-term maintenance of compiled programs are
        not fully tested.
    - line: End-to-end generative agent architectures and action unification
      what_it_solves: Trains vision-language models directly for GUI grounding and
        navigation, including diffusion decoding and unified GUI/code action spaces
        with online RL.
      what_remains_open: Scalability, training-data coverage, cross-platform transfer,
        and whether learned GUI/code coordination avoids silent failures need more
        evidence.
    consensus:
    - 'Real GUI agents need composite action and observation: models must ground visual
      elements, decide when to observe more, and choose GUI or code actions depending
      on the task.'
    - Benchmarks are moving beyond single-step click accuracy to multi-step task success,
      fine-grained sub-goal scoring, and cost-accuracy or efficiency metrics.
    - Application-specific precomputed knowledge or reusable execution traces improve
      performance or speed over generic zero-shot agent calls.
    - Current models still have large headroom relative to human performance, especially
      on dynamic, long-horizon, or non-click interactions.
    disagreements:
    - 'Representation: some approaches store application knowledge as multimodal figures
      plus text, while others compile runtime screen states into deterministic state-machine
      programs.'
    - 'Supervision: some use supervised fine-tuning on GUI screenshots and tasks;
      others use online reinforcement learning in executable OS environments or rely
      on retrieval without training.'
    - 'Evaluation target: work differs across Pass@1 task success, fine-grained sub-goal
      completion, observation efficiency, replay speed, and cross-benchmark grounding
      or navigation scores.'
    - 'Interaction mode: click-based, GUI+CLI, drag-based, video-guided dynamic screens,
      and unified GUI/code actions are treated as distinct or partially overlapping
      operating settings.'
    - 'Deployment setting: browser-based simulators, real macOS or Ubuntu desktops,
      mobile or web benchmarks, and short-video platform simulators create different
      evidence conditions.'
    open_questions:
    - Can observation control be learned or architecturally enforced so agents do
      not over- or under-observe dynamic screens?
    - Do task success and fine-grained sub-goal metrics align with real user productivity,
      reliability, and cost across long-horizon office or professional workflows?
    - How do compiled workflows, multimodal skills, and fine-tuned GUI policies handle
      application updates, layout changes, language shifts, and unseen software?
    - Is unified GUI-and-code action generation safer and more robust than tool-composition
      baselines when code execution permits irreversible changes?
    - How reusable are drag, video, and short-video benchmarks outside their source
      domains, and what training or evaluation is needed for continuous, stylus, or
      physical input?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 真实操作系统与桌面代理评测
      解决的问题: 在真实桌面环境中度量端到端 GUI 与 CLI 任务完成，提供任务套件、规则化检查点和能力标注。
      尚未覆盖: 细粒度子目标指标能否预测实际生产率，以及结果能否跨操作系统、应用和界面语言迁移。
    - 路线: 动态与视频引导的界面感知
      解决的问题: 定义屏幕内容或工作流随时间变化时的 GUI 控制，并同时评估最终准确率和观察效率。
      尚未覆盖: 观察控制机制仍较弱；证据目前集中在短视频平台和特定视频问答基准。
    - 路线: 面向应用的多模态技能库
      解决的问题: 按应用沉淀图文工作流知识，使智能体在执行中检索可落地的说明和界面图形。
      尚未覆盖: 对未见应用、版本漂移、技能构建成本以及视觉工件在大规模下是否持续有用尚不明确。
    - 路线: 特定交互定位
      解决的问题: 覆盖点击之外的拖拽、高亮、缩放、单元格选择和滑块操作，依托大规模数据集和微调。
      尚未覆盖: 拖拽定位能否迁移到现实连续控制、触控或手写输入仍缺少证据。
    - 路线: 高效可复用工作流执行
      解决的问题: 把成功轨迹编译为带屏幕校验回退的状态机，去除逐步骤语言模型调用并加速重复任务。
      尚未覆盖: GUI 布局变化、状态匹配歧义和长期维护下的鲁棒性尚未充分验证。
    - 路线: 端到端生成式智能体架构与动作统一
      解决的问题: 直接训练视觉语言模型进行 GUI 定位和导航，包括扩散解码、统一 GUI/代码动作空间与在线强化学习。
      尚未覆盖: 可扩展性、训练数据覆盖、跨平台迁移及 GUI/代码协调是否避免静默失败仍需更多证据。
    共识:
    - 真实 GUI 智能体需要复合动作与观察：模型必须定位视觉元素、判断何时继续观察，并按任务选择 GUI 或代码动作。
    - 基准正从单击准确率转向多步骤任务成功、细粒度子目标评分和成本-准确率或效率指标。
    - 预计算的应用知识或可复用执行轨迹比零样本智能体调用更能提升性能或速度。
    - 当前模型与人类水平仍有明显差距，尤其在动态、长流程或非点击交互上。
    分歧:
    - 表示方式：有的将应用知识保存为图文多模态工件，有的把运行期屏幕状态编译为确定性状态机程序。
    - 监督信号：有的使用截图和任务做监督微调，有的在可执行 OS 环境中做在线强化学习，有的仅做检索而无需训练。
    - 评测目标：各工作分别强调 Pass@1、细粒度子目标完成、成本-准确率/观察效率、重放速度或跨基准定位导航分数。
    - 交互模式：点击、GUI+CLI、拖拽、视频引导动态屏幕和统一 GUI/代码动作被视为不同或部分重叠的操作设定。
    - 部署场景：包括浏览器仿真、真实 macOS/Ubuntu 桌面、移动或网页基准，以及短视频平台仿真器。
    开放问题:
    - 观察控制能否通过学习或架构约束来实现，避免动态屏幕中的过度观察或观察不足？
    - 任务成功和细粒度指标是否与真实用户生产力、可靠性和长流程成本一致？
    - 编译工作流、多模态技能和微调策略面对应用更新、界面变化、语言切换和未知软件时如何泛化？
    - 当代码执行可能造成不可逆更改时，统一的 GUI 与代码动作生成是否比工具组合更安全可靠？
    - 拖拽、视频和短视频基准在其源域以外是否可复用，连续控制、触控或手写输入还需要哪些训练与评测？
