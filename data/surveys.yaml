    SFT followed by RL or calibration, and evidence is reported as success, latency,
    recovery, or preference metrics.'
  - 'Key differences: They differ in action representation (latent candidate scoring
    vs. block-wise diffusion vs. unified GUI/code decoding), supervision source (unannotated
    screenshots, application-artifact hybrid data, harness-call interception), and
    evaluation target (task success, recovery, latency, personalization).'
  - 'Trend evolution: Available evidence sits within the 2026 frontier; the movement
    is from prompt-only or tool-composed agents toward end-to-end trainable systems
    and frameworks that instrument RL in deployable harnesses, alongside finer diagnostics
    for recovery and user alignment.'
  - 'Open questions: Major open issues are long-horizon error recovery, cross-platform
    generalization under limited supervision, latency-accuracy tradeoffs in efficient
    action policies, skill/personalization freshness, and independent reproducibility
    of framework artifacts.'
  related_work_outline_zh:
  - 主流方向：围绕可运行 GUI/计算机使用智能体的端到端训练与部署框架，将视觉感知、动作预测、RL 或弱监督集成到真实/基准环境中；证据集中在 2026 年，强调训练、系统和评测一体化。
  - 研究共性：大多提出智能体策略、框架或评测探针，在 OSWorld、AndroidControl、WebVoyager、ClawEval 等基准上比较强化 VLM
    基线；常采用监督微调后 RL/校准、技能库或评估诊断，关注成功率和效率。
  - 关键差异：动作表示与生成方式不同，如潜空间候选评分、块级扩散、统一 GUI/代码解码；监督信号不同，如未标注截图弱监督、混合工件监督+在线 RL、拦截框架调用；评测目标覆盖任务成功率、恢复一致性、时延、个性化。
  - 趋势演进：现有证据集中在 2026 年前沿，趋势从提示式/工具组合评测转向可训练的智能体与可插拔 RL/部署框架，并引入恢复、个性化、延迟等细粒度诊断。
  - 开放问题：恢复与长时程可靠性、跨平台泛化、低时延动作策略的精度缺口、最小监督下的稳健性、技能与个性化维护、复杂框架的可复现性。
  literature_review:
    line_of_work_matrix:
    - line: End-to-end trainable GUI/computer-use agent frameworks
      what_it_solves: Turns pretrained VLM or harness-based agents into task-specific
        policies via supervised fine-tuning, RL, or proxy-collected environment rollouts.
      what_remains_open: Error recovery remains weak, harness/tool design affects
        trainability, and generalization depends on benchmark-specific supervision
        and compute infrastructure.
    - line: Low-latency or efficient action-space policies for GUI serving
      what_it_solves: Uses latent candidate scoring or block-wise diffusion to avoid
        slow token-by-token decoding and reduce serving cost for mobile and desktop
        GUI tasks.
      what_remains_open: Reported accuracy may trail teacher VLM baselines, and out-of-distribution
        or cross-platform latency-accuracy tradeoffs are underexplored.
    - line: Reusable multimodal skills and memory artifacts
      what_it_solves: Stores hierarchical task knowledge with visual figures and retrieves
        it on demand to improve UI element identification and workflow verification.
      what_remains_open: Coverage across applications, skill maintenance, and robustness
        over longer workflows remain unresolved.
    - line: Weakly supervised and data-efficient GUI agent training
      what_it_solves: Reduces annotation cost by learning visual grounding from unannotated
        screenshots and calibrating with small high-quality datasets.
      what_remains_open: Broader domain generalization and the minimum supervision
        threshold are not established beyond the reported benchmarks.
    - line: Evaluation and diagnostics for recovery, robustness, and user alignment
      what_it_solves: Injects controlled errors, replay actions, or preference probes
        to isolate failures beyond overall task completion.
      what_remains_open: Diagnostic findings have not been converted into broadly
        validated training interventions, and scalable recovery remains limited in
        proprietary or long-horizon settings.
    - line: Unified GUI action and code execution policies
      what_it_solves: Combines GUI interactions and code execution in one action space
        so tasks can be solved by direct manipulation or verifiable code.
      what_remains_open: Cross-platform transfer, failure modes of GUI/code coordination,
        and online RL stability are only partially evidenced.
    consensus:
    - Research is shifting from prompt-only tool composition toward trainable computer-use
      agents whose action policies are optimized with supervised or reinforcement
      signals in real or simulated GUI/desktop environments.
    - Evaluation anchors on GUI/computer-use task success and compares against strong
      VLM baselines, while newer probes add recovery consistency, personalization
      failure location, and latency/parameter efficiency.
    - Many systems report benchmark gains on OSWorld, AndroidControl, WebVoyager,
      ClawEval, CUA-World, or OSExpert-Eval, but limitation sections and artifact
      availability remain uneven.
    disagreements:
    - 'Action representation differs: latent candidate scoring avoids decoding, block-wise
      diffusion parallelizes generation, and unified action spaces couple GUI actions
      with code execution.'
    - 'Supervision differs: unannotated screenshot weak supervision, application-artifact
      hybrid supervision plus online RL, and harness-call proxy rollouts each optimize
      a different training signal.'
    - 'Evaluation priorities differ: some optimize task success, others recovery consistency,
      latency, personalization, or GUI/code coordination; a faster or cheaper policy
      can trail a teacher VLM''s accuracy.'
    open_questions:
    - Can recovery and long-horizon reliability be improved without environment resets,
      expensive action replay, or API rollback in production settings?
    - Which supervision signal and action representation generalize across mobile,
      desktop, and web interfaces without benchmark-specific adaptation?
    - How can latent or diffusion-based action policies close the accuracy gap to
      autoregressive VLM agents outside their reported benchmarks?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 端到端可训练的 GUI/计算机使用智能体框架
      解决的问题: 将预训练 VLM 或 harness 智能体转化为面向 GUI 桌面任务的策略，通过 SFT/RL 或代理采集 rollout 进行训练。
      尚未覆盖: 错误恢复仍弱，harness/工具设计影响可训练性，跨平台与独立复现证据有限。
    - 路线: 低延迟动作评分与实时交互策略
      解决的问题: 在移动/桌面 GUI 中减少逐 token 解码，使用潜空间评分或并行扩散提升推理速度与参数效率。
      尚未覆盖: 精度上限、分布外泛化和跨基准实时约束仍未充分验证。
    - 路线: 可复用技能与记忆工件
      解决的问题: 以分层多模态技能库保存并检索任务知识与视觉图形，提高 UI 元素识别与工作流验证。
      尚未覆盖: 应用覆盖范围、技能更新与更长工作流维护仍缺少证据。
    - 路线: 弱监督与数据约束下的训练流水线
      解决的问题: 利用未标注截图和课程学习降低人工标注依赖，并用少量高质量数据校准。
      尚未覆盖: 跨数据集/平台的泛化与最小标注量的稳健边界未明确。
    - 路线: 恢复、个性化与诊断评测
      解决的问题: 用受控错误、动作重放或探针框架诊断恢复行为与用户偏好失败。
      尚未覆盖: 诊断结果如何转化为训练干预、在专有环境和长时程中可扩展恢复仍未解决。
    - 路线: 统一 GUI 与代码执行的动作空间
      解决的问题: 将 GUI 点击/滚动与代码执行合并到一体化智能体，协调异构动作并支持结果验证。
      尚未覆盖: 跨平台迁移、代码/GUI 协调的失败模式及在线 RL 稳定性尚未充分报告。
    共识:
    - 系统正从提示式工具组合转向可训练的计算机使用智能体，以监督或强化信号优化真实/基准环境中的动作策略。
    - 评测围绕 GUI/计算机使用任务成功率展开，同时加入恢复、个性化、时延等探针，比较对象多为 Qwen 等 VLM 基线。
    - 多数证据来自基准提升，但错误恢复、局限性和独立复现仍是常见缺口。
    分歧:
    - 动作生成范式不同：潜空间候选评分、块级扩散和统一 GUI/代码解码并存。
    - 监督与训练信号不同：未标注截图弱监督、应用工件混合监督+在线 RL、拦截框架调用分别形成路线。
    - 评测目标不同：任务成功率、恢复一致性、延迟/参数效率、个性化诊断和代码/GUI 协调各有侧重，且可能相互冲突。
    开放问题:
    - 生产环境中无法重置或回滚时，计算机使用智能体如何保持恢复与长时程可靠性？
    - 何种监督信号与动作表示能跨移动、桌面和 Web 泛化，而不依赖平台特定训练？
    - 低时延潜空间/扩散策略能否在分布外 GUI 任务上缩小与自回归 VLM 智能体的精度差距？
