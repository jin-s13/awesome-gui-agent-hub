  related_work_outline_zh:
  - 主流方向：可用高相关证据以基准和方法为主，形式化主要体现在GUI智能体的任务抽象、指标设计和可靠性评估中。
  - 研究共性：工作把GUI能力分解为任务、子目标、动作或定位证据；评估冻结视觉语言模型；并通过外部框架、弱监督或可验证强化学习进行改进。
