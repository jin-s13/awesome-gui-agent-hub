  literature_review:
    line_of_work_matrix:
    - line: Real desktop and application task benchmarks
      what_it_solves: Evaluates realistic multi-app GUI/CLI task completion through
        deterministic rules and fine-grained multi-checkpoint scoring.
      what_remains_open: Evidence is limited to a specific OS and rule-based scoring;
        cross-platform stability and open-ended task coverage remain unverified.
    - line: Dynamic and observation-heavy interface benchmarks
      what_it_solves: Probes agents on interfaces whose content changes between actions,
        using accuracy plus information-efficiency metrics.
      what_remains_open: Current evidence is restricted to short-video platforms and
        reveals over- and under-observation, leaving other dynamic interface types
        uncovered.
    - line: Interaction-type-specific dataset and benchmark design
      what_it_solves: Addresses the click-centered gap by covering drag interactions
        with large screenshot and task collections.
      what_remains_open: Drag grounding gains are shown, but transfer to complete
        downstream computer-use workflows remains underevidenced.
    - line: Video-guided GUI task evaluation and keyframe extraction
      what_it_solves: Bridges video understanding and GUI interaction by selecting
        task-relevant, scene-aware keyframes for agents.
      what_remains_open: Strong evidence concentrates on VideoQA datasets; video-guided
        GUI agent results remain comparatively narrow.
    - line: Agent training and skill adaptation methods
      what_it_solves: Improves GUI agents through multimodal skill libraries, verifiable
        synthesized tasks with online RL, or weak supervision from unannotated screenshots.
      what_remains_open: Cross-benchmark stability, compute and implementation sensitivity,
        and detailed limitation or ablation reporting are still missing.
    - line: Uncertainty quantification for GUI grounding
      what_it_solves: Measures post-hoc uncertainty ranking transfer and conformal
        click regions across models and datasets.
      what_remains_open: Coverage is limited to single-step grounding, and transfer
        or calibration weakens across model tiers, interfaces, and distribution shifts.
    consensus:
    - Evaluation should go beyond aggregate success because fine-grained checks, cost-accuracy,
      or uncertainty measures reveal differences that a single success rate hides.
    - Realistic environments and diverse tasks expose current vision-language-agent
      weaknesses, especially observation control and UI grounding.
    - Large-scale synthesized data, weak supervision, or skill augmentation can improve
      agent performance, but the gain depends on data quality, verifiability, and
      baseline choice.
    disagreements:
    - 'Evaluation target differs: static desktop applications, dynamic content-changing
      platforms, video-guided tasks, and drag-specific interactions.'
    - 'Metric emphasis differs: deterministic sub-goal success, cost-accuracy efficiency,
      uncertainty ranking transfer or calibration coverage, and fine-tuned task-specific
      accuracy.'
    - 'Agent improvement route differs: retrieving multimodal skills, synthesizing
      verifiable RL tasks, weakly supervised visual grounding, or task-aware keyframe
      extraction.'
    - 'Interaction assumptions differ: some work focuses on single-step click or grounding,
      while others target multi-step workflows, dynamic observation control, or drag
      manipulation.'
    open_questions:
    - Do benchmark task distributions and metrics align with user-valued task success
      and real deployment variability?
    - How do gains from skills, RL synthesis, weak supervision, or keyframe extraction
      transfer across OS platforms, interfaces, and model classes?
    - Can observation-control and uncertainty-calibration methods remain reliable
      under interface shift and multi-step agent trajectories?
    - Which missing code, dataset, baseline, and limitation details create verification
      gaps for the reported benchmark or training results?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 真实桌面与应用任务基准
      解决的问题: 通过确定性规则和细粒度多检查点评分，评估真实多应用GUI/CLI任务完成能力。
      尚未覆盖: 证据限于特定操作系统和规则化评分，跨平台稳定性和开放式任务覆盖仍未验证。
    - 路线: 动态与观察密集型界面基准
      解决的问题: 评估代理在内容动态变化界面上的准确性与信息效率，量化观察控制问题。
      尚未覆盖: 当前证据限于短视频平台，过度或不足观察突出，其他动态界面类型尚未覆盖。
    - 路线: 交互类型专项数据集与基准
      解决的问题: 填补以点击为主的研究缺口，覆盖拖拽定位所需的大规模截图和任务。
      尚未覆盖: 拖拽定位提升已显示，但能否稳定转化为完整下游计算机使用任务仍缺少证据。
    - 路线: 视频引导GUI任务与关键帧抽取
      解决的问题: 通过任务相关且场景感知的关键帧选择，连接视频理解和GUI交互。
      尚未覆盖: 强证据集中在VideoQA数据集，视频引导GUI代理的结果仍相对较窄。
    - 路线: 代理训练与技能适配方法
      解决的问题: 通过多模态技能库、可验证任务合成与在线强化学习、或未标注截图弱监督来提升GUI代理能力。
      尚未覆盖: 跨基准稳定性、算力与实现敏感性、限制条件和消融报告仍缺失。
    - 路线: GUI定位的不确定性量化
      解决的问题: 跨模型和数据集测量后验不确定性排序迁移与共形点击区域。
      尚未覆盖: 覆盖仅限于单步可执行定位，跨模型层级、界面和分布偏移时迁移或校准会减弱。
    共识:
    - 评估应超越总体成功率，因为细粒度检查、成本-准确性或不确定性指标能揭示单一成功率掩盖的差异。
    - 真实环境和多样任务暴露当前视觉语言模型代理的观察控制和UI定位等薄弱环节。
    - 大规模合成数据、弱监督或技能增强可以提升代理表现，但提升依赖数据质量、可验证性和基线选择。
