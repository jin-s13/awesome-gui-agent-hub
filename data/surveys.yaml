  related_work_outline:
  - 'Mainstream direction: Current work centers on realistic GUI/OS automation benchmarks
    such as MacAgentBench, OSWorld-Verified, and WindowsAgentArena, plus benchmark-driven
    methods that improve computer-use agents through verifiable tasks, skills, or
    harness optimization.'
  - 'Shared research pattern: Studies combine interactive environments with task suites,
    evaluate frontier models, and use diagnostic signals beyond pass@1 such as fine-grained
    checkpoints, cost-accuracy, observation behavior, or uncertainty.'
  - 'Key differences: Papers differ in evaluation target: static desktop tasks, dynamic
    short-video screens, video-guided GUI tasks, or single-step GUI grounding; they
    also differ in supervision source and metric emphasis.'
  - 'Trend evolution: The 2024-2026 frontier is moving from static webpage-only evaluation
    toward real desktop/mobile tasks, dynamic interfaces, verifiable and efficient
    online RL, and self-improvement around frozen models.'
  - 'Open questions: How to measure and improve observation control on live-changing
    interfaces; whether fine-grained metrics and uncertainty transfer across model
    tiers and interfaces; and whether benchmark-driven gains remain stable without
    train/evaluation contamination.'
  related_work_outline_zh:
  - 主流方向：当前工作集中在真实GUI/OS自动化基准（MacAgentBench、OSWorld-Verified、WindowsAgentArena）以及基于基准的方法，通过可验证任务、技能或harness优化提升计算机使用代理。
  - 研究共性：论文通常构建交互环境与任务套件，评估前沿模型，并在pass@1之外使用细粒度检查点、成本-准确性、观察行为或不确定性等诊断信号。
  - 关键差异：研究面向静态桌面任务、动态短视频界面、视频引导GUI任务或单步GUI grounding；监督信号与评测重点各不相同。
  - 趋势演进：2024-2026前沿从静态网页基准转向真实桌面/移动任务、动态界面、可验证高效在线RL，以及围绕冻结模型的自我改进。
  - 开放问题：如何衡量并改善动态界面上的观察控制；细粒度指标与不确定性能否跨模型层级和接口迁移；基准驱动的提升在无污染设定下是否稳定。
  literature_review:
    line_of_work_matrix:
    - line: Realistic desktop and OS task benchmarks
      what_it_solves: Creates shared interactive task suites with deterministic or
        verifiable checks, covering GUI and CLI interaction across multiple real applications.
      what_remains_open: Dynamic content coverage and cross-platform/cross-application
        generalization beyond the specific apps and OS versions tested.
    - line: Dynamic and video-guided interface benchmarks
      what_it_solves: Evaluates interfaces that change between actions and require
        selective observation or keyframe understanding under task efficiency constraints.
      what_remains_open: Coverage is concentrated on short-video platform settings;
        no evaluated model reached human-level cost-accuracy or observation control.
    - line: Fine-grained metrics, observation diagnostics, and uncertainty quantification
      what_it_solves: Moves beyond aggregate success to reveal sub-goal completion,
        cost-accuracy, over/under-observation, and GUI grounding uncertainty differences.
      what_remains_open: Proxy alignment with downstream multi-step reliability remains
        unclear; uncertainty ranking transfer is selective across model tiers and
        interfaces.
    - line: Benchmark-driven training, harness, and skill improvement
      what_it_solves: Uses verifiable task synthesis, unannotated screenshots, multimodal
        skill artifacts, or harness optimization to improve frozen or RL-trained agents.
      what_remains_open: Stability across implementations, compute budgets, repeated
        runs, and possible train/evaluation contamination remains incompletely verified.
    consensus:
    - Realistic interactive environments with deterministic or verifiable task checks
      are replacing purely static or synthetic webpage-only evaluation.
    - 'Aggregate task success is insufficient: fine-grained sub-goal checkpoints,
      cost-accuracy, observation efficiency, and uncertainty measures reveal different
      agent behaviors.'
    - 'Frozen models can be improved substantially by changing around them: skill
      memory, execution harness, or training curriculum, not only model scaling.'
    - Current agents still underperform human reference levels on dynamic or real-world
      computer-use tasks, often because of weak observation control or grounding reliability.
    disagreements:
    - 'Evaluation target differs: static desktop app completion, dynamic living-screen
      interfaces, video-guided tasks, or single-step GUI grounding.'
    - 'Supervision source differs: verifiable reward/task synthesis, unannotated screenshots,
      authored multimodal skills, or repeated-run evidence.'
    - 'Primary metric differs: pass@1 task success, fine-grained checkpoints, cost-accuracy,
      or uncertainty calibration and conformal coverage.'
    - 'Deployment setting differs: macOS desktop, Windows desktop, browser-based short-video
      platforms, and cross-platform harness transfer.'
    open_questions:
    - Which diagnostic metrics best predict downstream user trust and multi-step task
      reliability outside the tested benchmark distributions?
    - Can uncertainty quantification and observation-control findings transfer across
      open-weight and closed-source model tiers and across interface regimes without
      target-specific re-evaluation?
    - How much of benchmark-driven improvement arises from train/evaluation overlap,
      specific harness implementations, or skill libraries rather than general agent
      capability?
    - Do dynamic-interface findings generalize beyond short-video platforms to OS,
      web, and mobile automation with continuously changing content?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 真实桌面与OS任务基准
      解决的问题: 构建共享交互任务与确定性或可验证检查，测试跨应用GUI/CLI完成能力。
      尚未覆盖: 动态内容覆盖以及超出特定应用和OS版本后的跨平台、跨应用泛化尚未稳定验证。
    - 路线: 动态与视频引导界面基准
      解决的问题: 评测操作之间内容变化的界面，考察选择性观察或关键帧理解，并纳入效率约束。
      尚未覆盖: 当前覆盖集中在短视频平台场景；尚无模型达到人类水平的成本-准确性或观察控制。
    - 路线: 细粒度指标、观察诊断与不确定性量化
      解决的问题: 在pass@1之外揭示子目标完成、成本-准确性、过度/不足观察和GUI grounding不确定性差异。
      尚未覆盖: 与下游多步可靠性之间的代理指标一致性仍不明确；不确定性排名跨模型层级和接口迁移具有选择性。
    - 路线: 基准驱动的训练、harness与技能改进
      解决的问题: 通过可验证任务合成、未标注截图、多模态技能工件或harness优化改进冻结或RL训练代理。
      尚未覆盖: 跨实现、算力预算、重复运行稳定性以及训练/评估污染控制仍缺少完整验证。
    共识:
    - 真实交互环境中的确定性或可验证任务检查正在替代纯静态或合成网页评测。
    - 总分不足以评价代理：细粒度子目标检查点、成本-准确性、观察效率和不确定性度量能揭示不同行为。
    - 冻结模型可通过技能记忆、执行harness或训练课程显著改进，而非仅依靠模型扩展。
    - 当前代理在动态或真实计算机使用任务上仍低于人类水平，常因观察控制或grounding可靠性不足。
    分歧:
    - 评测目标不同：静态桌面任务完成、动态短视频界面、视频引导任务或单步GUI grounding。
    - 监督来源不同：可验证奖励/任务合成、未标注截图、人工编写的多模态技能或重复运行证据。
    - 主要指标不同：pass@1任务成功、细粒度检查点、成本-准确性，或不确定性校准与conformal覆盖。
    - 部署场景不同：macOS桌面、Windows桌面、基于浏览器的短视频平台和跨平台harness迁移。
    开放问题:
    - 哪些诊断指标最能预测下游用户信任和多步任务可靠性，仍缺少跨基准验证。
    - 不确定性量化与观察控制发现能否跨开源/闭源模型层级和接口迁移，还是必须进行目标特定重新评估？
    - 基准驱动的提升有多少来自训练/评估重叠、特定harness实现或技能库，而非通用代理能力？
    - 动态界面结果能否推广到持续变化的OS、web和移动端自动化场景，仍是开放问题。
