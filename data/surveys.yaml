    consensus:
    - Evaluation has shifted toward executable GUI benchmarks that expose grounding,
      planning, and safety under realistic interface conditions.
    - Supervision derived from environment interaction, such as screenshots, accessibility
      trees, repeated rollouts, or verifiable task completion, is widely treated as
      necessary for improving agents.
    - No single benchmark or protocol is sufficient; papers use multiple external
      benchmarks to support transfer and robustness claims.
    - Uncertainty and safety are empirically sensitive to model tier, interface, and
      domain, with stronger claims requiring target-specific re-evaluation.
    disagreements:
