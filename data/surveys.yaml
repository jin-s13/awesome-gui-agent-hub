  - 趋势演进：可见年份为2024-2026，但高排序证据集中在2026，趋势处于当前前沿：交互空间更丰富，从单纯准确率转向可靠性、成本-准确率与不确定性感知。
  - 开放问题：跨环境与跨接口迁移、方法贡献与周边系统选择隔离、动态界面观察控制、分布偏移或多步轨迹下的不确定性校准仍待解决。
  literature_review:
    line_of_work_matrix:
    - line: Real-world and dynamic GUI evaluation protocols
      what_it_solves: Measures GUI agent success on richer interaction spaces such
        as real desktop multi-app tasks, dynamic short-video interfaces, drag operations,
        and fine-grained sub-goal completion rather than only static click accuracy.
      what_remains_open: Coverage beyond specific applications/platforms and single-step
        or short-horizon settings, plus evidence on multi-step trajectory evaluation
        and distribution shift remains limited.
    - line: Training and self-improvement for GUI action prediction
      what_it_solves: Reduces annotation cost and improves agent performance through
        verifiable task synthesis with online RL, weak supervision from unannotated
        screenshots, and automatic harness evolution around frozen models.
      what_remains_open: How much improvement transfers across environments and interfaces,
        and how to separate policy gains from task-generation, reward, or execution-harness
        effects.
    - line: Observation representation and grounding for dynamic or non-click inputs
      what_it_solves: Selects relevant visual context and grounds actions for video-guided
        or drag-based GUI tasks, using task-driven keyframe extraction or large-scale
        drag grounding data.
      what_remains_open: Whether keyframe and drag-action representation choices generalize
        beyond reported datasets, platforms, and cost-accuracy trade-offs in dynamic
        interfaces.
    - line: Post-hoc uncertainty and calibrated decision interfaces
      what_it_solves: Benchmarks uncertainty quantification for GUI grounding and
        constructs conformal click regions to make spatial action confidence explicit
        for safer deployment.
      what_remains_open: Multi-step agent trajectories, cross-model and cross-interface
        transfer, training-based or hybrid uncertainty methods, and coverage under
        calibration-test or interface mismatch are not covered.
    consensus:
    - The field is moving from static click-based GUI tasks toward richer action spaces
      and dynamic or real-world interface settings, with pass-based, fine-grained
      sub-goal, and cost-accuracy metrics becoming prominent.
    - VLM backbones are the common substrate, while improvements are often attributed
      to surrounding task synthesis, weak supervision, keyframe selection, harness
      optimization, or calibration mechanisms.
    - Current agents still fall short of human-level reliability in dynamic and real-world
      settings, particularly when observation control and uncertainty are evaluated.
    disagreements:
    - 'Improvement strategy differs: some efforts train policies via online RL or
      weak supervision, while others keep the backbone frozen and optimize the execution
      harness or input representation.'
    - Evaluation settings differ across real desktop multi-app tasks, dynamic short-video
      platforms, single-step grounding, and drag interactions, implying different
      assumptions about environment and interaction mode.
    - 'Supervision and data assumptions differ: verifiable task synthesis, unannotated
      screenshots, repeated run evidence, curated benchmarks, and post-hoc calibration
      each create different generalization expectations.'
    open_questions:
    - Do task-synthesis, weak-supervision, or harness gains transfer across operating
      systems, application domains, and interface dynamics beyond the evaluated suites?
    - What fraction of reported gains comes from the policy, planner, task prior,
      or execution harness rather than the surrounding system choices?
    - How can GUI agents learn when to observe and stop observing in dynamic interfaces
      without fixed human-crafted budgets or severe efficiency loss?
    - Can post-hoc uncertainty and conformal grounding remain calibrated under cross-model,
      cross-interface, temporal, and distribution shift, and over multi-step trajectories?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 真实与动态GUI评测协议
      解决的问题: 在真实桌面多应用、动态短视频界面、拖拽操作和细粒度子目标完成等更丰富交互空间中衡量GUI代理成功，而非仅静态点击准确率。
      尚未覆盖: 对特定应用/平台和单步或短程设定之外的覆盖不足，多步轨迹评测和分布偏移证据仍然有限。
    - 路线: GUI动作预测的训练与自改进
      解决的问题: 通过可验证任务合成与在线强化学习、未标注截图弱监督、以及冻结模型周围的自动harness演进，降低标注成本并提升代理表现。
      尚未覆盖: 提升在环境和接口间的迁移程度不明，且难以区分策略增益与任务生成、奖励或执行harness效应。
    - 路线: 动态或非点击输入的观察表示与grounding
      解决的问题: 为视频引导或拖拽式GUI任务选择相关视觉上下文并grounding动作，采用任务驱动关键帧提取或大规模拖拽grounding数据。
      尚未覆盖: 关键帧和拖拽动作表示选择能否泛化到报告数据集、平台和动态界面的成本-准确率权衡之外。
    - 路线: 后验不确定性与校准决策接口
      解决的问题: 对GUI grounding的不确定性量化进行基准测试，并构建共形点击区域，使空间动作置信度显式化以支持更安全部署。
      尚未覆盖: 多步代理轨迹、跨模型和跨接口迁移、基于训练或混合的不确定性方法，以及校准-测试或接口不匹配下的覆盖度未被覆盖。
    共识:
    - 领域正从静态点击式GUI任务转向更丰富的动作空间和动态或真实世界界面，基于通过率、细粒度子目标和成本-准确率的指标日益突出。
    - VLM骨干是共同基础，而提升常被归因于任务合成、弱监督、关键帧选择、harness优化或校准等周边机制。
    - 当前代理在动态和真实世界环境中仍达不到人类水平的可靠性，在观察控制和不确定性被评估时尤其明显。
    分歧:
    - 改进策略不同：部分工作通过在线强化学习或弱监督训练策略，另一些冻结骨干而优化执行harness或输入表示。
    - 评测设置不同：真实桌面多应用任务、动态短视频平台、单步grounding和拖拽交互，各自隐含不同的环境和交互模式假设。
    - 监督与数据假设不同：可验证任务合成、未标注截图、重复运行证据、人工基准和后验校准带来不同的泛化预期。
    开放问题:
    - 任务合成、弱监督或harness增益能否迁移到评测套件之外的操作系统、应用领域和界面动态？
    - 报告增益中有多少来自策略、规划器、任务先验或执行harness，而非周边系统选择？
    - GUI代理如何在动态界面中学习何时观察和停止观察，而不依赖固定人工预算或造成严重效率损失？
    - 后验不确定性和共形grounding能否在跨模型、跨接口、时间和分布偏移以及多步轨迹下保持校准？
