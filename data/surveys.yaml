  literature_review:
    line_of_work_matrix:
    - line: Realistic desktop and interaction task abstraction
      what_it_solves: Defines executable GUI task suites and interaction coverage
        for desktop, short-video, and drag-based settings, measuring task completion
        and sub-goal detail.
      what_remains_open: Generalization across dynamic interface types is limited,
        and multi-step trajectory evaluation remains separated from single-step grounding
        or task success.
    - line: Uncertainty quantification and reliability assessment for GUI grounding
      what_it_solves: Evaluates post-hoc uncertainty and calibration methods for grounding
        decisions and spatial safety, revealing conditions for selective prediction
        and conformal coverage.
      what_remains_open: Evidence covers single-step grounding; cross-model and cross-interface
        transfer is weak, and deployment robustness under distribution shift is unresolved.
    - line: Self-improvement through harness optimization and efficient or weak supervision
      what_it_solves: Improves frozen or trainable models by optimizing the execution
        harness, synthesizing verifiable online RL tasks, or using unannotated screenshots
        to reduce annotation cost.
      what_remains_open: Gains are demonstrated on selected benchmarks; formal guarantees,
        failure prediction, and cross-benchmark generalization are not established.
    - line: Multimodal skill and knowledge representation for computer-use agents
      what_it_solves: Retains application-specific visual and textual knowledge as
        multimodal skill artifacts, improving UI element identification and workflow
        state verification.
      what_remains_open: Evidence focuses on specific benchmarks and a single model
        setup, leaving scaling behavior and transfer to new applications under-specified.
    consensus:
    - Current GUI agent research treats realistic, executable task evaluation as necessary
      for revealing model failure modes that aggregate success metrics hide.
    - Fine-grained interaction coverage, including GUI plus CLI, drag primitives,
      and dynamic content, exposes gaps in observation control and sub-goal completion.
    - Improving computer-use agents increasingly depends on external evidence or knowledge
      such as screenshots, repeated runs, visual skill artifacts, or weak supervision,
      rather than model architecture alone.
    - 'Reproducibility signals are mixed: several works release benchmarks or artifacts,
      but limitation statements and cross-model or cross-interface transfer evidence
      are often incomplete.'
    disagreements:
    - 'Evaluation target differs: some focus on desktop OS task completion, while
      others target dynamic short-video cost-accuracy, single-step grounding uncertainty,
      or drag interaction accuracy.'
    - 'Intervention level differs: some freeze the backbone and optimize the harness
      or skill library, while others train via online RL or weak supervision, implying
      different assumptions about where capability gains originate.'
    - 'Interaction primitive coverage differs: click-focused evaluation can overlook
      drag and dynamic observation control, while dedicated benchmarks target those
      under-served regimes.'
    - 'Supervision assumptions differ: methods range from fully verifiable online
      RL to weak supervision with minimal annotation, creating different data requirements
      and scaling claims.'
    open_questions:
    - Can reliability gains from harness optimization, skill libraries, or uncertainty
      calibration transfer across unseen interfaces, model classes, and deployment
