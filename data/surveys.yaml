  - 主流方向：当前前沿集中在可运行的多模态计算机使用与网页代理上，涵盖端到端训练框架、GUI/代码统一动作空间、技能与记忆复用以及真实环境评测。
  - 研究共性：多篇工作将视觉截图接地与可执行动作耦合，并以环境级成功作为判断标准；先监督预训练、再用强化学习或可验证奖励优化的路径反复出现。
