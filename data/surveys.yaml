  related_work_outline_zh:
  - 主流方向：构建并评测端到端 GUI/计算机使用智能体，融合多模态视觉 grounding、动作生成和真实环境中的强化学习训练，常用 OSWorld-Verified、AndroidControl
    等基准。
  - 研究共性：多数工作超越纯提示式智能体，转向可训练策略或可复用技能/工件层，利用 SFT、RL 或自监督，并在交互式 GUI 基准上报告任务成功率。
  - 关键差异：动作表示不同：自回归工具调用、潜空间评分、块级扩散、GUI+代码统一；监督信号不同：未标注截图、可验证环境奖励、技能文档；评测目标不同：任务成功、恢复、个性化。
  - 趋势演进：在 2024-2026 前沿窗口内，重点从单一 GUI 策略转向系统级训练框架、恢复诊断和个性化评测；架构探索 JEPA、扩散等效率路线。
  - 开放问题：如何改善恢复与偏好处理、跨平台与部署泛化、协调速度与准确性，以及哪些 harness/环境因素影响可训练性。
  literature_review:
    line_of_work_matrix:
    - line: Runnable harness-native agent training and deployment stacks
      what_it_solves: Converting harness/tool-based agents into trainable policies
        by intercepting model calls and running rollouts in isolated containers across
        GUI and computer-use environments.
      what_remains_open: Error recovery remains weak, harness design strongly affects
        trainability, and independent deployment beyond the reported orchestration
        setting is not fully verified.
    - line: Efficient action policy architectures for GUI control
      what_it_solves: Reducing inference cost and data needs through latent-space
        candidate scoring, block-wise diffusion, or weak supervision from unannotated
        screenshots.
      what_remains_open: Speed gains often trade accuracy; evidence is limited to
        in-distribution platforms such as AndroidControl, and generalization to broader
        GUIs is unresolved.
    - line: Multimodal skill and artifact libraries for computer-use agents
      what_it_solves: Providing reusable hierarchical skills that retain visual figures
        and on-demand tool access to improve UI element identification and workflow
        verification.
      what_remains_open: Scalability across applications and transfer of skill artifacts
        across agents and environments are not fully evidenced.
    - line: Reliability and personalization diagnostics
      what_it_solves: Formalizing recovery consistency and preference-dependent execution
        stages to reveal hidden capability bottlenecks beyond aggregate task success.
      what_remains_open: Current agents still fail to exploit latent recovery abilities;
        preference handling for ranking and process remains low, and interventions
        only partially close the gap.
    - line: End-to-end unified GUI and code execution agents
      what_it_solves: Combining GUI actions with code execution in a single action
        space and training with hybrid supervision plus online RL in real desktop
        environments.
      what_remains_open: Cross-platform generalization has partial evidence but is
        not fully covered; explicit limitations are absent, leaving failure boundaries
        as a verification gap.
    consensus:
    - The field is converging on end-to-end trainable GUI/computer-use agents evaluated
      through executable, verifiable interactive benchmarks rather than static visual
      question answering.
    - Multimodal visual grounding from screenshots or retained figures is treated
      as important for UI element identification and state verification.
    - Training recipes combine supervised fine-tuning with reinforcement learning
      or self-supervised pretraining, often in real or emulated environments.
    - Error recovery and user preference handling are gaining attention as reliability
      evaluation targets, with evidence that current agents underperform on these
      axes.
    disagreements:
    - 'Action representation differs: latent candidate scoring, block-wise diffusion
      generation, harness/tool calls, and unified GUI-plus-code execution imply different
      latency, parameter, and control trade-offs.'
    - 'Supervision and data emphasis differ: unannotated screenshots for weak supervision,
      verifiable environment rewards for RL, and authored multimodal skill documentation
      as auxiliary context.'
    - 'Evaluation focus differs: aggregate task success benchmarks versus recovery
      consistency after injected errors versus stage-wise preference personalization
      diagnostics.'
    - Deployment setting differs across mobile, desktop-native, web, and harness-mediated
      environments, changing assumptions about observability, rollback, and reproducibility.
    open_questions:
    - How can GUI agents retain the speed and parameter efficiency of latent or non-autoregressive
      policies while closing the reported 86-92% accuracy gap to fine-tuned VLM baselines?
    - What training and environment design choices would make error recovery and preference-sensitive
      behavior improve end-to-end rather than remain latent or partially addressed?
    - To what extent do current benchmark successes on OSWorld-Verified, AndroidControl,
      and WebVoyager transfer to unseen platforms, applications, and user-specific
      workflows?
    - Why does screen-dynamics pretraining of a latent predictor fail to improve decision
      performance, and what does that imply for GUI agent pretraining objectives?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 可运行的 harness 原生智能体训练与部署栈
      解决的问题: 通过拦截模型调用并在隔离容器中执行 rollout，将基于工具/harness 的智能体转化为可训练策略，覆盖 GUI 与计算机使用环境。
      尚未覆盖: 错误恢复仍弱；harness 设计显著影响可训练性；在 Kubernetes/编排环境之外的独立部署未充分验证。
    - 路线: 面向 GUI 控制的高效动作策略架构
      解决的问题: 通过潜空间候选评分、块级扩散或未标注截图弱监督降低推理成本和数据需求。
      尚未覆盖: 速度提升常以准确率为代价；证据多限于 AndroidControl 等分布内平台，广泛 GUI 泛化未解决。
    - 路线: 面向计算机使用智能体的多模态技能与工件库
      解决的问题: 提供保留视觉图形并按需加载的可复用分层技能，以改进 UI 元素识别和工作流状态验证。
      尚未覆盖: 跨应用可扩展性以及技能/工件在不同智能体和环境间迁移未充分证明。
    - 路线: 可靠性与个性化诊断
      解决的问题: 形式化恢复一致性并诊断偏好导致的分阶段执行失败，揭示整体任务成功率之下的隐藏能力瓶颈。
      尚未覆盖: 当前智能体仍未充分释放恢复能力；Ranking/Process 偏好处理仍较低，干预只能部分弥补。
    - 路线: 端到端 GUI 与代码执行统一智能体
      解决的问题: 在单一动作空间中统一 GUI 操作与代码执行，并通过混合监督和在线 RL 在真实桌面环境中训练。
      尚未覆盖: 跨平台迁移有初步证据但未完全覆盖；明确局限性缺失，失败边界构成验证缺口。
    共识:
    - 领域正汇聚到可端到端训练的 GUI/计算机使用智能体，并以可执行、可验证的交互式基准而非静态 VQA 进行评估。
    - 来自截图或保留图形的多模态视觉 grounding 被视为识别 UI 元素和验证状态的重要手段。
    - 训练方案多结合监督微调、强化学习或自监督预训练，并常在真实或仿真环境中执行。
    - 错误恢复与用户偏好等可靠性维度开始成为独立评测目标，证据显示当前智能体在这些方面仍表现不足。
    分歧:
    - 动作表示不同：潜空间候选评分、块级扩散生成、harness/工具调用、GUI+代码统一动作空间，导致不同的延迟、参数和控制权衡。
    - 监督与数据重点不同：未标注截图弱监督、可验证环境奖励的 RL、编写的多模态技能文档作为辅助上下文。
    - 评测焦点不同：整体任务成功基准、注入错误后的恢复一致性、分阶段偏好个性化诊断。
    - 部署设置不同：移动端、桌面原生、Web 与 harness 中介环境对可观测性、回滚和可复现性假设不同。
    开放问题:
    - 如何让 GUI 智能体在保持潜空间或非自回归策略速度与参数效率的同时，弥合相对微调 VLM 基线 86-92% 的准确率差距？
    - 哪些训练与环境设计选择能让错误恢复和偏好敏感行为端到端提升，而不是停留在潜在或部分解决状态？
    - OSWorld-Verified、AndroidControl、WebVoyager 上的成功在多大程度上迁移到未见平台、应用和用户特定工作流？
    - 为何屏幕动态预训练未提升潜在预测器决策性能，这对 GUI 智能体的预训练目标意味着什么？
