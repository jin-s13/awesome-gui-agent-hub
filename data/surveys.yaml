  related_work_outline:
  - 'Mainstream direction: Building comprehensive benchmarks and training methods
    for GUI agents that go beyond static click-based tasks, covering dynamic interfaces,
    drag interactions, long-horizon tasks, and multi-step agentic workflows.'
  - 'Shared research pattern: Almost all works propose a new benchmark to expose current
    model weaknesses, then often pair it with a training strategy (weakly-supervised,
    online RL, or context management) that improves performance on that benchmark.'
  - 'Key differences: Benchmarks target different platforms (macOS desktop, short-video
    platforms, mobile) and interaction types (click, drag, dynamic content); training
    methods differ in supervision signal (unannotated screenshots vs. verifiable RL
    tasks vs. curated behavioral trajectories) and how they handle history and context.'
  - 'Trend evolution: Within the 2024–2026 frontier, the field is moving from single-step
    static GUI grounding to dynamic, drag-based, and long-horizon tasks, with growing
    emphasis on data efficiency, uncertainty quantification, and proactive context
    management.'
  - 'Open questions: How to unify diverse interaction types into a single agent; whether
    uncertainty quantification can be integrated into multi-step decision-making;
    how to make online RL safe and sample-efficient for real computer-use agents;
    and how to achieve cross-platform generalization without expensive per-domain
    annotation.'
  related_work_outline_zh:
  - 主流方向：构建超越静态点击任务的GUI代理综合基准与训练方法，覆盖动态界面、拖拽交互、长时域任务和多步智能体工作流。
  - 研究共性：几乎所有工作都提出一个新基准来暴露当前模型弱点，并通常配对一种训练策略（弱监督、在线RL或上下文管理）以提升在该基准上的性能。
  - 关键差异：基准面向不同平台（macOS桌面、短视频平台、移动端）和交互类型（点击、拖拽、动态内容）；训练方法在监督信号（未标注截图 vs 可验证RL任务 vs
    策划的行为轨迹）以及如何处理历史和上下文方面存在差异。
  - 趋势演进：在2024-2026年的前沿中，领域正从单步静态GUI定位转向动态、拖拽和长时域任务，同时越来越重视数据效率、不确定性量化和主动上下文管理。
  - 开放问题：如何将多种交互类型统一到单一代理中；不确定性量化能否集成到多步决策中；如何使在线RL在真实计算机使用代理中安全且样本高效；以及如何在没有昂贵领域标注的情况下实现跨平台泛化。
  literature_review:
    line_of_work_matrix:
    - line: Benchmarking GUI agents across diverse platforms and interaction types
      what_it_solves: Systematically measures agent capabilities on real-world tasks,
        exposing failure modes like over/under-observation on dynamic content, poor
        drag performance, and lack of long-horizon context management.
      what_remains_open: Each benchmark focuses on a specific platform (macOS, short-video,
        mobile) and interaction subset; no single benchmark covers the full spectrum
        of GUI actions, and evaluation protocols (Pass@1, fine-grained checkpointing,
        cost-accuracy) are not standardized across them.
    - line: Data-efficient and weakly-supervised training for GUI agents
      what_it_solves: Reduces reliance on expensive human-annotated demonstrations
        by leveraging unannotated screenshots, verifiable task synthesis, and online
        RL to train agents with limited or no ground-truth action labels.
      what_remains_open: The generalization of weakly-supervised methods to highly
        dynamic or drag-based tasks is unproven; online RL approaches assume safe
        sandbox environments and may not transfer to live systems with real-world
        risks.
    - line: Extending agent action spaces and context management
      what_it_solves: Moves beyond simple click actions to include drag interactions,
        observation control on dynamic screens, and proactive context management actions
        that compress history while preserving critical facts for long-horizon tasks.
      what_remains_open: Integration of these expanded action spaces into a unified
        agent architecture is not yet solved; the interaction between context management
        actions and the policy's core task-solving ability is underexplored outside
        the specific benchmarks used in evaluation.
    consensus:
    - Current GUI agents, even frontier models, struggle with interactive tasks that
      require more than simple click-based actions, especially on dynamic interfaces
      and in long-horizon scenarios.
    - There is a clear need for benchmarks that move beyond static screens and single-step
      evaluation to reflect real-world computer use, including drag, CLI, and multi-app
      workflows.
    - Data efficiency is a critical bottleneck; methods that reduce the need for expensive
      human annotations (e.g., using unlabeled screenshots or synthetic task generation)
      are seen as a promising direction.
    disagreements:
    - 'The choice of training regime: one line favors weak supervision from massive
      unannotated screenshots followed by small RL calibration, while another advocates
      end-to-end online RL with verifiable task synthesis, and a third relies on supervised
      fine-tuning on curated trajectory datasets.'
    - 'The evaluation target and metric: benchmark tasks range from short single-step
      grounding to long-horizon mobile workflows, and metrics include pass@1, sub-goal
      completion, cost-accuracy, and uncertainty calibration, making cross-work comparison
      difficult.'
    - 'The role of context management: some works treat context as a passive history
      buffer, while others propose making context management a first-class action
      of the policy, and there is no consensus on the right abstraction for long-horizon
      tasks.'
    open_questions:
    - Can a single GUI agent architecture handle click, drag, dynamic content observation,
      and CLI interactions without task-specific modules?
    - How should uncertainty quantification be integrated into multi-step agent trajectories
      to improve safety and reliability beyond single-step grounding?
    - What are the minimal supervision requirements for an agent to generalize across
      operating systems and application domains?
    - Can online RL training for computer-use agents be made safe and sample-efficient
      enough for deployment on real user machines, not just sandboxes?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 跨平台和交互类型的GUI代理基准测试
      解决的问题: 系统地测量代理在真实世界任务上的能力，暴露动态内容上的过度/不足观察、拖拽性能差、长时域上下文管理缺失等失败模式。
      尚未覆盖: 每个基准关注特定平台（macOS、短视频、移动端）和交互子集；没有单一基准覆盖完整的GUI动作范围，评估协议（Pass@1、细粒度检查点、成本-准确性）在各基准间未标准化。
    - 路线: 数据高效和弱监督的GUI代理训练
      解决的问题: 通过利用未标注截图、可验证任务合成和在线RL，减少对昂贵人工标注示范的依赖，以有限或无真实动作标签训练代理。
      尚未覆盖: 弱监督方法在高度动态或拖拽任务上的泛化能力未经证实；在线RL方法假设安全的沙盒环境，可能无法迁移到具有真实风险的实际系统。
    - 路线: 扩展代理动作空间与上下文管理
      解决的问题: 超越简单的点击动作，包括拖拽交互、动态屏幕上的观察控制，以及主动上下文管理动作，这些动作在保持关键事实的同时压缩历史，用于长时域任务。
      尚未覆盖: 将这些扩展的动作空间集成到统一的代理架构中尚未解决；上下文管理动作与策略核心任务解决能力之间的交互，在评估所用的特定基准之外尚待探索。
    共识:
    - 当前的GUI代理，即使是前沿模型，在需要超越简单点击的交互任务上（尤其是动态界面和长时域场景）表现挣扎。
    - 明显需要超越静态屏幕和单步评估的基准，以反映真实计算机使用，包括拖拽、CLI和多应用工作流。
    - 数据效率是一个关键瓶颈；减少昂贵人工标注需求的方法（如使用未标注截图或合成任务生成）被视为有前景的方向。
    分歧:
    - 训练范式的选择：一条路线偏好从海量未标注截图进行弱监督，然后进行小规模RL校准；另一条路线提倡通过可验证任务合成进行端到端在线RL；第三条路线依赖在策划轨迹数据集上的监督微调。
    - 评估目标和指标：基准任务从短单步定位到长时域移动工作流不等，指标包括Pass@1、子目标完成度、成本-准确性和不确定性校准，使得跨工作比较困难。
    - 上下文管理的角色：一些工作将上下文视为被动历史缓冲区，而另一些工作提议将上下文管理作为策略的第一类动作，对于长时域任务的正确抽象尚无共识。
    开放问题:
    - 单一的GUI代理架构是否能处理点击、拖拽、动态内容观察和CLI交互，而无需任务特定模块？
    - 如何将不确定性量化集成到多步代理轨迹中，以提升超越单步定位的安全性和可靠性？
    - 代理跨操作系统和应用领域泛化的最低监督要求是什么？
    - 计算机使用代理的在线RL训练能否变得足够安全和样本高效，以部署在真实用户机器上，而不仅仅是沙盒中？
