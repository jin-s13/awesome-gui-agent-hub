  related_work_outline_zh:
  - 主流方向：构建更真实的多步、多应用GUI/OS自动化基准，并用细粒度指标、技能库、harness优化或RL改进智能体表现。
  - 研究共性：先定义环境与任务，评价前沿或开源模型并定位失败，再提出针对性指标或智能体改进方法。
  - 关键差异：评测目标、界面动态性、监督与改进方式、指标侧重点不同。
  - 趋势演进：证据集中在2024–2026前沿；从静态单步向动态、视频引导、多应用、不确定性与效率评估演进。
  - 开放问题：跨基准迁移、指标与真实决策对齐、动态/长程任务覆盖、artifact与基线可比性验证缺口。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design
      what_it_solves: Creates shared GUI/OS automation tasks and environments that
        make computer-use agents comparable across operating systems, applications,
        web platforms, and video-guided workflows.
      what_remains_open: Coverage across dynamic interfaces, multi-step/multi-app
        workflows, and long-horizon trajectories remains incomplete; several benchmarks
        expose only a subset of desktop or browser settings.
    - line: Metric and stress-test design
      what_it_solves: Adds fine-grained scoring, cost-accuracy trade-offs, and uncertainty/calibration
        probes beyond aggregate success rates.
      what_remains_open: Single-step grounding and proxy metrics may not align with
        downstream user decisions, and uncertainty calibration degrades under model
        or interface shift.
    - line: Benchmark-grounded agent improvement
      what_it_solves: Uses benchmark tasks to improve agents through skill libraries,
        harness evolution, verifiable task synthesis with online RL, or weak supervision
        from unlabeled screenshots.
      what_remains_open: Transfer of benchmark-specific gains to unseen environments,
        frozen or low-data regimes, and real deployment settings remains uncertain.
    - line: Comparable baselines and artifact reporting
      what_it_solves: Makes results auditable through common baselines and released
        datasets, code, or repositories; evidence is uneven because provenance and
        metadata are partially missing.
      what_remains_open: Whether conclusions remain stable across implementations,
        model versions, compute budgets, and missing artifact signals is not yet demonstrated.
    consensus:
    - The field is moving toward real-world, multi-step, multi-application GUI/OS
      automation rather than isolated single-step grounding tasks.
    - Aggregate success scores hide important differences, so fine-grained checkpoints,
      efficiency signals, or uncertainty estimates are increasingly included.
    - Current agents still fail on observation control, dynamic interfaces, and uncertainty
      transfer, showing that benchmark design and agent improvement are tightly coupled.
    disagreements:
    - 'Evaluation target differs: single-step executable grounding, full desktop/browser
      trajectories, and dynamic or video-guided interactive tasks are treated as separate
      problems.'
    - 'Intervention point differs: some studies change the external skill or harness,
      while others train the model with verifiable RL or weak supervision.'
    - 'Metric emphasis differs: success rate, sub-goal completion, cost-accuracy,
      and conformal uncertainty are optimized by different studies.'
    open_questions:
    - Which benchmark task distributions transfer to real-world computer-use deployment,
      especially for dynamic and long-horizon interfaces?
    - How should cost-accuracy, uncertainty, and fine-grained success metrics be combined
      into decision-relevant evaluation without overfitting to benchmark harnesses?
    - Can skill, harness, and training gains remain stable across different implementations,
      backbone models, and compute budgets?
    - What evidence is missing for artifact availability, baseline comparability,
      and limitation reporting because several top-ranked papers lack complete reproducible
      metadata?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计
      解决的问题: 构建共享的GUI/OS自动化任务与环境，使计算机使用智能体在操作系统、应用、网页平台和视频引导工作流上具备可比性。
      尚未覆盖: 动态界面、多步/多应用工作流和长程轨迹覆盖仍不完整；若干基准只覆盖桌面或浏览器的部分设置。
    - 路线: 指标与压力测试设计
      解决的问题: 在总体成功率之外引入细粒度评分、成本-准确性权衡和不确定性/校准探测。
      尚未覆盖: 单步grounding与代理指标未必对齐下游用户决策，且不确定性校准在模型或界面迁移下会下降。
    - 路线: 基于基准的智能体改进
      解决的问题: 通过技能库、harness演进、可验证任务合成与在线RL，或利用未标注截图的弱监督来提升智能体。
      尚未覆盖: 基准特定提升能否迁移到未见环境、冻结或低数据制度以及真实部署场景仍不确定。
    - 路线: 可比基线与工件报告
      解决的问题: 通过统一基线、数据集、代码或仓库使结果可审计；证据不均，因部分来源与元数据缺失。
      尚未覆盖: 不同实现、模型版本、算力预算和缺失工件信号下，基准结论是否稳定尚未得到验证。
    共识:
    - 研究正在从孤立单步任务转向真实、多步、多应用的GUI/OS自动化评估。
    - 单纯成功率会掩盖子目标、效率或置信度差异，评估越来越多加入细粒度或不确定性信号。
    - 现有智能体在动态界面、观察控制和不确定性迁移上仍存在明显不足。
    分歧:
    - 评测目标不同：单步可执行grounding、桌面/浏览器多步轨迹，以及动态或视频引导交互任务被作为不同问题处理。
    - 改进层面不同：有的修改外部技能或执行harness，有的通过可验证RL或弱监督调整模型。
    - 指标重点不同：成功率、子目标完成、成本-准确性、共形不确定性各有侧重。
    开放问题:
    - 哪些基准任务分布能够迁移到真实计算机使用部署，尤其是动态和长程界面？
    - 如何将成本-准确性、不确定性与细粒度成功指标结合为决策相关评估，同时避免过拟合基准harness？
    - 技能、harness和训练带来的提升能否在不同实现、骨干模型和算力预算下保持稳定？
    - 由于若干高排名论文缺少完整可复现元数据，artifact可用性、基线可比性和局限性证据还存在哪些缺口？
