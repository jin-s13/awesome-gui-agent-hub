  literature_review:
    line_of_work_matrix:
    - line: Benchmarks for real-world and dynamic GUI task execution
      what_it_solves: Defines task suites and metrics for desktop, dynamic short-video,
        drag-based, and single-step GUI grounding settings; exposes failure modes
        such as over- and under-observation and similar Pass@1 with different sub-goal
        completion.
      what_remains_open: Coverage is restricted by platform and interaction type;
        dynamic observation control is unsolved; multi-step trajectory uncertainty
        and broader interface transfer are not evaluated.
    - line: External augmentation of frozen GUI agents
      what_it_solves: Improves frozen backbone models by providing hierarchical multimodal
        skills or optimizing the execution harness from observed action effects.
      what_remains_open: Evidence is limited to evaluated benchmarks and apps; whether
        visual skill artifacts or harness edits transfer across applications and model
        families remains open.
    - line: Scalable training and task synthesis for GUI agents
      what_it_solves: Reduces human annotation reliance and scales online RL by generating
        verifiable tasks from docker interactions or learning visual grounding from
        unannotated screenshots.
      what_remains_open: Real-world generalization beyond synthesized or weakly supervised
        distributions is not established; verifiability and resource cost at larger
        scale remain open.
    - line: Reliability and safety evaluation for GUI grounding agents
      what_it_solves: Quantifies post-hoc uncertainty for GUI grounding and builds
        conformal click regions; formalizes dynamic living-screen agents and observation-control
        limits.
      what_remains_open: Uncertainty rankings transfer weakly across model classes
        and interfaces; conformal coverage degrades under distribution shift; formal
        assumptions are not validated on multi-step trajectories.
    consensus:
    - GUI agents need fine-grained evaluation beyond overall task success because
      similar success rates can hide different sub-goal or observation behaviors.
    - Frozen-model and training-based methods can improve GUI agents by exploiting
      screenshot evidence, skills, harness edits, or synthetic/weak supervision.
    - 'Dynamic and fine-grained interactions are under-supported: current models lack
      observation control, drag grounding is a gap, and uncertainty calibration is
      selective.'
    disagreements:
    - 'Representation of skills or artifacts: one line retains visual figures in multimodal
      skills, while another compares against text-only skill variants and shows multimodal
      artifacts improve grounding.'
    - 'Interaction mode evaluated: desktop GUI+CLI tasks, dynamic short-video feeds,
      drag-only interactions, and single-step grounding impose different action spaces
      and reliability criteria.'
    - 'Evaluation target: some reward task success or Pass@1, others target cost-accuracy,
      sub-goal completion, or uncertainty coverage; these targets expose different
      agent properties.'
    - 'Intervention setting: evaluation-only benchmarks, frozen-model augmentation,
      and online RL or weak supervision differ in whether they alter the agent''s
      training or a wrapping harness.'
    open_questions:
    - Can observation control be learned or built into GUI agents for living-screen
      interfaces where content changes between actions?
    - Does uncertainty quantification transfer from single-step grounding to multi-step
      agent trajectories and across closed-source model classes?
    - Do skill-library and harness-optimization gains persist on held-out applications
      beyond the evaluated desktop and benchmark suites?
    - Are verifiable task synthesis and weakly supervised grounding sufficient for
      real-world GUI tasks with diverse interface layouts and failure modes?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 面向真实与动态GUI任务执行的基准测试
      解决的问题: 为桌面、动态短视频、拖拽和单步GUI基础定位设置定义任务套件和指标；暴露过度观察与观察不足、相似Pass@1但子目标完成不同等失败模式。
      尚未覆盖: 覆盖受平台和交互类型限制；动态观察控制未解决；多步轨迹不确定性和跨界面迁移未评估。
    - 路线: 冻结GUI智能体的外部增强
      解决的问题: 通过提供分层多模态技能或依据观察到的动作效果优化执行框架，在保持骨干模型冻结的情况下提升性能。
      尚未覆盖: 证据限于已评测基准和应用；视觉技能工件或框架编辑是否能跨应用和模型家族迁移仍未解决。
    - 路线: GUI智能体的可扩展训练与任务合成
      解决的问题: 通过docker交互生成可验证任务或从无标注截图中学习视觉基础，减少人工标注依赖并扩展在线强化学习。
      尚未覆盖: 尚未证明在合成或弱监督分布之外的真实世界泛化；更大规模下的可验证性与资源成本仍未解决。
    - 路线: GUI基础定位智能体的可靠性与安全评估
      解决的问题: 量化GUI基础定位的后验不确定性并构建共形点击区域；形式化动态屏幕原生智能体及观察控制限制。
      尚未覆盖: 不确定性排序跨模型类别和界面迁移较弱；共形覆盖在分布偏移下下降；形式假设未在多步轨迹上验证。
    共识:
    - GUI智能体需要超越整体任务成功的细粒度评测，因为相似成功率可能掩盖子目标或观察行为差异。
    - 冻结模型和基于训练的方法都能通过截图证据、技能、执行框架编辑或合成/弱监督来改进GUI智能体。
    - 动态和细粒度交互支持不足：当前模型缺乏观察控制，拖拽基础定位存在缺口，不确定性校准具有选择性。
    分歧:
    - 技能或工件表示：一条路线在多模态技能中保留视觉图形，另一条用纯文本技能变体作为基线并表明多模态工件能改善基础定位。
    - 评测的交互模式：桌面GUI+CLI任务、动态短视频信息流、仅拖拽交互和单步基础定位施加了不同动作空间与可靠性标准。
    - 评测目标：有的奖励任务成功或Pass@1，有的关注成本-准确性、子目标完成或不确定性覆盖；这些目标暴露不同智能体属性。
    - 干预设置：仅评测基准、冻结模型增强和在线强化学习或弱监督在是否改变智能体训练或包装执行框架上不同。
    开放问题:
    - 能否为内容在操作之间变化的动态屏幕界面学习或构建观察控制能力？
    - 不确定性量化能否从单步基础定位迁移到多步智能体轨迹，并跨闭源模型类别保持稳定？
    - 技能库和执行框架优化的增益能否在桌面和基准套件之外的保留应用中持续存在？
    - 可验证任务合成与弱监督基础定位是否足以应对真实世界GUI任务中多样的界面布局和失败模式？
