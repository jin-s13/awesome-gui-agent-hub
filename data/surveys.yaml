  related_work_outline:
  - 'Mainstream direction: Scaling GUI agent capability through training and evaluation
    loops: weak supervision from unannotated screenshots, verifiable task synthesis
    with online RL, frozen-model harness self-improvement, and richer benchmarks covering
    desktop, dynamic short-video, video-guided, drag, and uncertainty grounding.'
  - 'Shared research pattern: Papers pair proposed methods or benchmarks with controlled
    evaluations and fine-grained metrics; aggregate Pass@1 is treated as insufficient,
    so studies report sub-goal completion, cost-accuracy, keyframe gains, grounding
    errors, or uncertainty ranking transfer.'
  - 'Key differences: Interventions differ in where improvement is applied—model training
    from weak or synthetic data, frozen-model execution harness, keyframe extraction,
    online RL task synthesis—and in evaluation target: desktop, dynamic content, video
    guidance, drag actions, or single-step grounding uncertainty.'
  - 'Trend evolution: Within 2024–2026 evidence, the frontier moves from click-centric
    desktop benchmarks toward dynamic and multimodal GUI conditions, and from static
    model comparison toward self-improvement, task synthesis, harness optimization,
    and uncertainty calibration.'
  - 'Open questions: Cross-environment generalization, contribution attribution, observation
    control, multi-step uncertainty, and verification for drag/dynamic interactions
    remain unresolved; several method papers omit limitations, weakening evidence.'
  related_work_outline_zh:
  - 主流方向：围绕 GUI 智能体训练与评测闭环，提升 grounding、动作预测与观察控制；包括弱监督课程学习、可验证任务合成与在线 RL、冻结模型 harness
    自改进，以及桌面、动态短视频、视频引导、拖拽、不确定性等基准。
  - 研究共性：研究将方法/基准与细粒度指标结合，发现单一 Pass@1 不足；普遍报告子目标完成、成本准确率、关键帧提升、grounding 误差或不确定性排名迁移。
  - 关键差异：改进位置不同，包括视觉 grounding/策略训练、冻结模型外围 harness、关键帧提取、在线 RL 任务合成；评测目标涵盖真实桌面、动态内容、视频引导、拖拽和单步
    grounding 不确定性。
  - 趋势演进：2024–2026 前沿从以点击为中心的桌面基准，转向动态、多模态 GUI 条件；从静态模型比较走向自改进、任务合成、harness 优化与不确定性校准。
  - 开放问题：跨环境泛化、贡献归因、观察控制、多步不确定性，以及拖拽/动态交互的验证仍待解决；部分方法论文缺少 limitations，证据强度受限。
  literature_review:
    line_of_work_matrix:
    - line: Weakly supervised and interaction-data-driven GUI policy training
      what_it_solves: Reduces dependence on expensive annotations by using unannotated
        screenshots, webpages, or drag interaction datasets for visual grounding and
        action prediction; calibrates with small high-quality annotated sets via reinforcement
        learning.
      what_remains_open: Cross-application, cross-platform, and multi-step trajectory
        generalization is largely unproven; limitations are often unreported, so negative
        results and failure boundaries remain unclear.
    - line: Verifiable task synthesis, online RL, and execution-harness self-improvement
      what_it_solves: Scales computer-use agent training or adaptation by generating
        verifiable tasks, allocating rollouts to the learning frontier, and optimizing
        the executable harness around frozen models, yielding gains on OSWorld, ScienceBoard,
        and WindowsAgentArena.
      what_remains_open: Contribution attribution among model, planner/harness, task
        prior, and data is unresolved; evaluation is concentrated on a few benchmarks,
        and missing limitation statements weaken confidence in generalization.
    - line: GUI grounding, observation-control, and interaction benchmarking
      what_it_solves: Measures real desktop GUI+CLI tasks, dynamic short-video interfaces,
        video-guided tasks, drag interactions, and post-hoc uncertainty quantification
        across models, revealing sub-goal, efficiency, and grounding failures beyond
        Pass@1.
      what_remains_open: Coverage remains fragmented by platform and interaction type;
        uncertainty ranking transfer across model tiers/interfaces is weak, conformal
        coverage degrades under distribution shift, and multi-step agent trajectories
        are not fully evaluated.
    - line: Keyframe extraction for video-guided agentic tasks
      what_it_solves: Compresses video evidence for video-guided GUI tasks by selecting
        task-relevant and scene-dynamic frames, improving VideoQA and GUI interactive
        task performance.
      what_remains_open: Evidence is limited to video question answering and selected
        GUI tasks; integration with planners and broader dynamic-agent settings remains
        open.
    consensus:
    - Aggregate Pass@1 is insufficient for comparing GUI agents; fine-grained metrics
      such as sub-goal completion, cost-accuracy, grounding error, keyframe gain,
      and uncertainty ranking transfer reveal otherwise hidden differences.
    - GUI-specific training or adaptation improves computer-use capabilities, whether
      through weakly supervised grounding, interaction datasets, verifiable RL tasks,
      keyframe selection, or frozen-model harness optimization.
    - 'Current agents show an observation-control gap: they over-observe or under-observe
      relative to task demands, and grounding uncertainty rankings transfer selectively
      across datasets, models, and interfaces.'
    disagreements:
    - 'Intervention location differs: some methods update model weights via weak supervision
      or RL; others keep the backbone frozen and optimize the surrounding execution
      harness or input keyframe extraction.'
    - 'Evaluation target differs: desktop multi-application tasks, dynamic short-video
      feeds, video-guided instruction following, drag interactions, and single-step
      grounding uncertainty each emphasize different capability boundaries.'
    - 'Supervision and verifiability assumptions differ: weak supervision requires
      little annotated data but may need calibrated RL; online RL relies on verifiable
      task goals; harness optimization relies on repeated runs and screenshot evidence;
      uncertainty benchmarks rely on internal model states.'
    open_questions:
    - How well do weakly supervised, harness-optimized, and RL-trained GUI agents
      transfer to unseen applications, operating systems, dynamic interfaces, and
      multi-step trajectories?
    - What evaluation protocols can isolate model contribution from harness design,
      skill libraries, task priors, and training task synthesis?
    - Under what conditions can GUI grounding uncertainty rankings and conformal click
      regions transfer across model tiers and interfaces without target-specific recalibration?
    - How should observation control and drag/dynamic interactions be evaluated when
      current evidence centers on click-dominated or single-step grounding tasks?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 弱监督与交互数据驱动的 GUI 策略训练
      解决的问题: 利用未标注截图、网页或拖拽交互数据降低昂贵人工标注依赖，进行视觉定位与动作预测；通过小规模高质量标注和强化学习进行校准。
      尚未覆盖: 跨应用、跨平台和多步轨迹泛化大多未被证明；局限性常未报告，负面结果与失败边界不清。
    - 路线: 可验证任务合成、在线 RL 与执行 harness 自改进
      解决的问题: 通过可验证任务生成、按学习前沿分配 rollout、以及围绕冻结模型优化执行 harness 来扩展计算机使用智能体能力，在 OSWorld、ScienceBoard、WindowsAgentArena
        上取得提升。
      尚未覆盖: 模型、规划器/harness、任务先验与数据之间的贡献归因尚不明确；评测集中在少数基准，且缺少 limitations 说明影响泛化信心。
    - 路线: GUI grounding、观察控制与交互基准评测
      解决的问题: 衡量真实桌面 GUI+CLI、动态短视频、视频引导任务、拖拽交互以及后验不确定性量化，揭示 Pass@1 之外的子目标、效率和 grounding
        失败。
      尚未覆盖: 平台和交互类型覆盖碎片化；跨模型层级/接口的 UQ 排名迁移较弱，分布偏移下 conformal coverage 下降，多步轨迹尚未充分评估。
    - 路线: 面向视频引导任务的关键帧提取
      解决的问题: 通过选择任务相关且场景动态的关键帧压缩视频证据，改善视频问答和视频引导 GUI 交互任务表现。
      尚未覆盖: 证据限于视频问答和少量 GUI 任务，与规划器及更广泛动态智能体环境的结合仍待验证。
    共识:
    - 单一 Pass@1 不足以比较 GUI 智能体；子目标完成、成本准确率、grounding 误差、关键帧增益和不确定性排名迁移等细粒度指标能暴露隐藏差异。
    - GUI 特定训练或适配可提升计算机使用能力，包括弱监督 grounding、交互数据集、可验证 RL 任务、关键帧选择和冻结模型 harness 优化等路径。
    - 当前智能体存在观察控制缺口：过度观察或观察不足，且 grounding 不确定性排名在数据集、模型和接口间仅选择性迁移。
    分歧:
    - 干预位置不同：一些方法通过弱监督或强化学习更新模型权重，另一些冻结骨干模型，仅优化执行 harness 或输入关键帧提取。
    - 评测目标不同：桌面多应用任务、动态短视频流、视频引导指令跟随、拖拽交互和单步 grounding 不确定性各自强调不同的能力边界。
    - 监督与可验证性假设不同：弱监督需要极少量标注但可能依赖 RL 校准；在线 RL 依赖可验证任务目标；harness 优化依赖重复运行和截图证据；不确定性评测依赖模型内部状态。
    开放问题:
    - 弱监督、harness 优化和 RL 训练的 GUI 智能体能否跨未见过应用、操作系统、动态界面和多步轨迹泛化？
    - 什么评测协议能分离模型贡献与 harness 设计、技能库、任务先验和训练任务合成的影响？
    - 在哪些条件下 GUI grounding 不确定性排名和共形点击区域可跨模型层级与接口迁移，而无需目标特定重校准？
    - 当前证据偏点击/单步 grounding，如何评测观察控制、拖拽和动态交互的多步任务？
