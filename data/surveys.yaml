  related_work_outline:
  - 'Mainstream direction: Building comprehensive benchmarks for GUI/web/mobile/OS
    automation that span diverse interaction types (click, drag, video-guided, CLI)
    and environments, with a shift toward fine-grained evaluation metrics and uncertainty
    quantification.'
  - 'Shared research pattern: New benchmarks codify a task distribution and evaluation
    protocol, then expose agent failure modes (e.g., over‑/under‑observation, weak
    drag grounding) through multi‑checkpoint scoring or cost‑accuracy metrics, while
    method papers leverage these benchmarks to demonstrate improved agent capabilities.'
  - 'Key differences: Benchmarks differ in the interaction modality they cover (static
    clicks vs. dynamic short‑video feeds vs. drag operations vs. multi‑app desktop
    workflows), the granularity of their evaluation (pass@1 vs. sub‑goal completion
    vs. information‑efficiency cost), and whether they target single‑step grounding
    or multi‑step trajectories.'
  - 'Trend evolution: From 2024 to 2026, the field moved from static, click‑only GUI
    tasks to benchmarks that include dynamic screen‑native interfaces, drag‑based
    interactions, and multi‑application desktop environments, accompanied by a rise
    in fine‑grained metrics, uncertainty quantification, and synthetic task generation
    for agent training.'
  - 'Open questions: How to design tasks that span long‑horizon, cross‑app workflows
    and truly dynamic interfaces; whether proxy metrics align with real‑world user
    decisions; how to achieve stable uncertainty quantification across model classes
    and interface types; and whether benchmark rankings remain consistent under different
    implementations and compute budgets.'
  related_work_outline_zh:
  - 主流方向：构建涵盖点击、拖拽、视频引导、命令行等多种交互类型和桌面/网页/移动/OS环境的综合基准，同时向细粒度评估和不确定性量化演进。
  - 研究共性：新基准通过定义任务分布和评估协议，利用多检查点评分或成本‑准确性指标暴露代理的失败模式（如观察过度/不足、拖拽定位弱），方法论文则借助这些基准展示代理能力的提升。
  - 关键差异：各基准在覆盖的交互模态（静态点击 vs. 动态短视频信息流 vs. 拖拽操作 vs. 多应用桌面工作流）、评估粒度（pass@1 vs. 子目标完成度
    vs. 信息效率成本）以及是否面向单步定位或多步轨迹上存在差异。
  - 趋势演进：2024‑2026年，领域从静态点击任务扩展到包含动态屏幕原生界面、拖拽交互和多应用桌面环境的基准，同时兴起了细粒度指标、不确定性量化以及用于代理训练的合成任务生成。
  - 开放问题：如何设计覆盖长时跨应用工作流和真实动态界面的任务；代理指标与用户真实需求之间如何对齐；跨模型类和接口类型的不确定性量化能否稳定；基准排名在不同实现和算力预算下是否一致。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design
      what_it_solves: Creates shared task suites that operationalize GUI/web/mobile/OS
        automation into reproducible evaluation protocols; covers diverse interaction
        types (click, drag, video‑guided, CLI) and environments (desktop, browser,
        short‑video platforms) to make agent capabilities comparable.
      what_remains_open: Whether the task distributions reflect long‑horizon, cross‑app
        workflows and truly dynamic interfaces; the coverage of rare interaction types
        like drag remains limited; the generalizability of findings across platforms
        and observation modalities is not yet established.
    - line: Metric and stress‑test design
      what_it_solves: Probes agent behavior beyond aggregate success rates through
        fine‑grained sub‑goal completion scores, information‑efficiency metrics, and
        uncertainty quantification, thereby revealing weaknesses such as over‑/under‑observation,
        grounding instability, and over‑confidence.
      what_remains_open: Alignment between these proxy metrics and the downstream
        decisions users actually care about; the transferability of uncertainty quantification
        rankings across model tiers and interface types is selective and currently
        weak; conformal prediction coverage degrades under distribution shift.
    - line: Comparable baselines and reporting
      what_it_solves: Enables auditable comparisons through verifiable task synthesis,
        standardized skill libraries, and training protocols that use weak supervision
        or online RL, helping to measure progress under controlled data and compute
        budgets.
      what_remains_open: Whether benchmark conclusions remain stable across different
        implementations, compute budgets, and open‑source vs. closed‑source model
        families; the reproducibility of newly proposed training pipelines and their
        reliance on specific proprietary models is not yet fully validated.
    consensus:
    - Fine‑grained evaluation metrics (sub‑goal completion, cost‑accuracy, checkpoint‑based
      scoring) provide more actionable insights into agent performance than single‑number
      pass rates.
    - Current GUI agents lack robust observation control, frequently over‑observing
      or under‑observing dynamic interfaces, which limits their effectiveness on real‑world
      tasks.
    - Leveraging large‑scale unannotated screenshots or synthetically generated verifiable
      tasks can substantially reduce the need for expensive human annotations in agent
      training.
    - Multimodal skill artifacts that retain visual figures improve UI element identification
      and workflow state verification compared to text‑only skill descriptions.
    disagreements:
    - Some benchmarks focus on single‑step grounding accuracy, while others evaluate
      multi‑step trajectory completion, leading to different conclusions about model
      capabilities.
    - 'Evaluation settings diverge: some use real desktop environments with rule‑based
      checks, others use browser‑based simulators, and still others rely on static
      screenshots, which affects the perceived difficulty and failure modes.'
    - 'The choice of primary metric varies: pass@1, task success rate, and information‑efficiency
      cost emphasize different aspects of agent behavior, and their rankings are not
      always consistent.'
    - Uncertainty quantification methods show strong within‑model stability but weak
      cross‑model and cross‑interface transferability, creating tension between generality
      and practical deployment.
    open_questions:
    - How can benchmarks be designed to faithfully represent long‑horizon, cross‑application
      workflows and dynamic content that changes between actions?
    - To what extent do fine‑grained proxy metrics correlate with the utility that
      real users derive from GUI agents in daily tasks?
    - Can uncertainty quantification techniques be made reliably transferable across
      different model families and interface modalities without extensive re‑calibration?
    - What is the minimum set of benchmarks and evaluation protocols needed to ensure
      that performance improvements generalize beyond the specific test environment
      and implementation?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计
      解决的问题: 构建将GUI/网页/移动/OS自动化转化为可复现评估协议的共享任务套件，覆盖点击、拖拽、视频引导、命令行等多种交互类型和桌面、浏览器、短视频平台等环境，使代理能力具备可比性。
      尚未覆盖: 任务分布是否反映长时跨应用工作流和真正动态界面；拖拽等罕见交互类型的覆盖仍然有限；跨平台和观察模态的泛化性尚未明确。
    - 路线: 指标与压力测试设计
      解决的问题: 通过细粒度子目标完成度评分、信息效率指标和不确定性量化，探查代理在总分之外的行为，揭示过度观察/观察不足、定位不稳定和过度自信等弱点。
      尚未覆盖: 这些代理指标与用户实际关心的下游决策之间的一致性；不确定性量化排名跨模型层级和接口类型的迁移性较弱且选择性有限；共形预测覆盖度在分布偏移下下降。
    - 路线: 可比基线与报告规范
      解决的问题: 通过可验证的任务合成、标准化技能库以及使用弱监督或在线强化学习的训练协议，使结果可审计，有助于在受控数据和算力预算下衡量进展。
      尚未覆盖: 基准结论在不同实现、算力预算以及开源与闭源模型家族之间是否稳定；新提出的训练管线的可复现性及其对特定专有模型的依赖尚未得到充分验证。
    共识:
    - 细粒度评估指标（子目标完成度、成本‑准确性、检查点评分）比单一成功率数字更能揭示代理行为的可操作洞察。
    - 当前GUI代理缺乏稳健的观察控制能力，在动态界面上频繁出现过度观察或观察不足，限制了其在真实任务中的有效性。
    - 利用大规模未标注截图或合成可验证任务，可以大幅减少代理训练对昂贵人工标注的依赖。
    - 保留视觉图元的多模态技能工件相比纯文本技能描述，能够改善UI元素识别和工作流状态验证。
    分歧:
    - 部分基准聚焦于单步定位准确性，而另一些则评估多步轨迹完成度，导致对模型能力得出不同结论。
    - 评估设置存在差异：有的使用真实桌面环境配合基于规则的检查，有的采用基于浏览器的模拟器，还有的依赖静态截图，这会影响感知难度和失败模式。
    - 主要指标的选择各不相同：pass@1、任务成功率和信息效率成本强调代理行为的不同方面，其排名并不总是一致。
    - 不确定性量化方法在模型内表现稳定，但跨模型和跨接口的可迁移性弱，这在通用性和实际部署之间形成了张力。
    开放问题:
    - 如何设计基准以忠实呈现长时跨应用工作流和内容在操作之间变化的动态界面？
    - 细粒度代理指标与真实用户在日常任务中从GUI代理获得的效用之间有多大程度的相关性？
    - 不确定性量化技术能否在无需大量重新校准的情况下，可靠地迁移到不同模型家族和接口模态？
    - 确保性能提升能够泛化到特定测试环境和实现之外所需的最小基准集和评估协议是什么？
