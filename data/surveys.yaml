  related_work_outline_zh:
  - 主流方向：该 survey 主题的证据主要由 GUI 智能体系统、基准与审计构成，而非传统综述文本；主流方向是对可扩展训练、可验证评测、不确定性、长程记忆与安全进行经验系统化。
  - 研究共性：论文构建或使用可执行或掩码式 GUI 任务，以明确成功标准为基础，在受控设置下比较智能体，以隔离能力、不确定性或安全效应。
  - 关键差异：目标场景如浏览器、移动端、编码、视频引导和短信到网页存在差异；监督方式如 SFT、在线 RL 和 VLM 奖励不同；评测目标如单步 grounding、多步任务成功和安全鲁棒性也不同。
  - 趋势演进：2024-2026 窗口显示前沿从演示级 GUI grounding 转向可验证任务合成、带自主评估器的在线 RL、结构化长程记忆以及安全或不确定性审计。
  - 开放问题：如何在互不兼容的基准之间综合结论仍未解决；由于可见摘要多为方法和基准而非显式综述或路线图，系统性综述证据仍是验证缺口。
  literature_review:
    line_of_work_matrix:
    - line: Taxonomy and roadmap synthesis
      what_it_solves: Maps GUI agent work into directions such as task modality, interaction
        horizon, training signal, and evaluation environment, helping structure fragmented
        evidence around capabilities and gaps.
      what_remains_open: Whether the mapping is backed by systematic cross-corpus
        evidence rather than selective method or benchmark examples remains unclear
        from the provided abstracts.
    - line: Comparative evaluation synthesis
      what_it_solves: Summarizes how evaluation choices shape conclusions across GUI
        agent settings, including single-step grounding, multi-step task success,
        uncertainty ranking transfer, and safety audits.
      what_remains_open: 'Compared results are often incompatible across settings:
        uncertainty ranking transfers strongly within models but weakly across closed/open
        tiers, and safety hardening appears domain-conditioned.'
    - line: Open problem and gap mapping
      what_it_solves: Converts observed failures such as weak benign recall under
        masked fraud cues, long-horizon memory limits, noisy VLM rewards, and domain-conditioned
        safety into concrete next research questions.
      what_remains_open: Prioritization of gaps and creation of standardized evaluation
        across browser, mobile, coding, video-guided, and fraud-related settings are
        still unresolved.
    consensus:
    - GUI agent research is converging on multimodal and multi-step interactive tasks
      as the core evaluation unit, rather than isolated text or image classification.
    - Verifiable or executable task outcomes are treated as a more reliable signal
      than static labels, leading to task synthesis and benchmark suites with explicit
      success criteria.
    - Long-horizon and context management are recognized as a bottleneck for mobile
      and general GUI agents.
    - Safety, robustness, and uncertainty are increasingly audited as separate dimensions
      of agent capability, often using controlled benchmarks.
    - 'Reproducibility evidence is mixed: some works provide code or data signals
      while others only describe methods, so artifact availability cannot be assumed
      consistent.'
    disagreements:
    - 'Training signal: supervised context-action annotations differ from online RL
      with verifiable synthesized tasks and from RL fine-tuning that uses noisy vision-language
      success judgments.'
    - 'Evaluation target: single-step executable grounding is used in uncertainty
      work, while other evidence evaluates multi-step task success, safety attack
      success, or video-guided agentic tasks.'
    - 'Deployment setting: browser, mobile, coding, video-guided, and SMS-to-webpage
      fraud environments impose different perception, memory, and safety assumptions.'
    - 'Generalization claims: uncertainty ranking transfer is strong within model
      but weak across model tiers and closed interfaces, while safety resistance appears
      domain-conditioned and fails outside browser hardening.'
    - 'Task construction: masked fraud tasks intentionally remove URL and reputation
      shortcuts to force reasoning, whereas computer-use tasks retain executable environment
      state and verifiable task completion.'
    open_questions:
    - Do synthesized rankings and claims hold across open-weight and closed-source
      GUI agents when cross-tier uncertainty transfer is weak?
    - Can verifiable task synthesis and autonomous vision-language evaluation scale
      without propagating evaluator noise or environment-selection bias?
    - How should safety and robustness be measured beyond browser and coding domains,
      given that hardening appears domain-conditioned?
    - What long-horizon memory representations are necessary for mobile GUI tasks
      that require compact context without losing critical facts?
    - How can systematic survey evidence be extracted from a field where the visible
      sample is dominated by method and benchmark contributions rather than self-identified
      surveys?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 分类体系与路线图综合
      解决的问题: 将 GUI 智能体研究按任务模态、交互时程、训练信号与评测环境组织为方向、里程碑和研究缺口，帮助将碎片化证据结构化。
      尚未覆盖: 从可见摘要无法确定该综合是否由系统跨语料证据支撑，而不是选择性方法或基准示例。
    - 路线: 对比评测综合
      解决的问题: 总结不同评测选择如何塑造结论，包括单步 grounding、多步任务成功、不确定性排名迁移与安全审计。
      尚未覆盖: 不同设置间结果兼容性不足：不确定性排序在模型内迁移强，跨闭源或开源层级弱，且安全加固呈领域条件性。
    - 路线: 开放问题与缺口映射
      解决的问题: 将掩码欺诈下良性召回弱、长程记忆限制、VLM 奖励噪声、领域条件安全等具体失败转化为下一步研究问题。
      尚未覆盖: 各缺口在浏览器、移动端、编码、视频引导和欺诈相关场景中的优先级及统一评测标准仍不明确。
    共识:
    - GUI 智能体研究正在以多模态、多步交互任务作为核心评测单元，而非孤立的文本或图像分类。
    - 可验证或可执行任务结果被视为比静态标签更可靠的信号，催生了带显式成功标准的任务合成和基准套件。
    - 长时程与上下文管理被认为是移动端及通用 GUI 智能体的关键瓶颈。
    - 安全、鲁棒性和不确定性日益作为智能体能力的独立维度而被审计，多采用受控基准。
    - 可复现证据参差不齐：部分工作提供代码或数据信号，部分仅描述方法，因此不能假设工件一致公开。
    分歧:
    - 训练信号：监督式上下文动作标注、基于可验证合成任务的在线 RL，以及用带噪视觉语言成功判断微调的 RL 彼此不同。
    - 评测目标：单步可执行 grounding 与多步任务成功、安全攻击成功、视频引导智能体任务等评测目标存在差异。
    - 部署场景：浏览器、移动端、编码、视频引导和短信到网页欺诈环境对感知、记忆和安全的假设不同。
    - 泛化论断：不确定性排名在模型内迁移强，但跨模型层级和闭源接口弱；安全抗性也呈领域条件性，离开浏览器硬化后不一定成立。
    - 任务构造：掩码欺诈任务刻意移除 URL 和声誉捷径以逼出推理，而计算机使用任务保留可执行环境状态和可验证完成信号。
    开放问题:
    - 在跨层级不确定性迁移较弱的情况下，综合排名与结论能否同时适用于开源权重和闭源 GUI 智能体？
    - 可验证任务合成与自主视觉语言评估能否在规模化时不放大评估器噪声或环境选择偏置？
    - 在浏览器和编码之外，如何测量 GUI 智能体的安全与鲁棒性？现有证据显示安全加固具有领域条件性。
    - 移动端长时程 GUI 任务需要何种记忆表示，才能在保持紧凑上下文的同时不丢失关键事实？
    - 当可见样本以方法和基准贡献为主而非自标识综述时，如何抽取系统性综述证据并标明验证缺口？
