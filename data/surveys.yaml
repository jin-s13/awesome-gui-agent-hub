  - 趋势演进：可用高相关证据集中在 2026 年，处于当前前沿内，正从静态点击评测转向动态/观察感知、多模态技能和自我改进的代理设计。
  - 开放问题：跨界面泛化、多步不确定性与可靠性、观察控制、合成任务的多样性与可验证性，以及弱监督下的数据泄漏与覆盖尚未解决。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark and task abstraction for GUI action coverage
      what_it_solves: Formalizes evaluation tasks and scoring for underexplored GUI
        settings such as macOS GUI+CLI workflows and drag-based interactions, revealing
        gaps in click-only assumptions.
      what_remains_open: Coverage remains platform- or interaction-specific; evidence
        does not yet show these benchmarks predict cross-environment or multi-step
        agent reliability.
    - line: Dynamic interface observation formalization
      what_it_solves: Defines interaction with living screens where content changes
        between actions and measures observation control through cost-accuracy metrics.
      what_remains_open: Current models lack observation control; evidence is limited
        to short-video platforms and does not cover other dynamic interface classes.
    - line: External skill and harness adaptation for frozen agents
      what_it_solves: Improves frozen backbone models by retrieving multimodal skill
        artifacts or by optimizing the execution harness from observed action-outcome
        evidence.
      what_remains_open: Generalization of learned harness edits or skill libraries
        across operating systems, applications, and evaluation protocols is only partially
        demonstrated.
    - line: Weakly supervised and verifiable training-data scaling
      what_it_solves: Reduces reliance on costly annotations through unannotated screenshots
        or verifiable synthetic task generation, combined with efficient online RL
        or curriculum calibration.
      what_remains_open: Results center on specific suites such as OSWorld and ScienceBoard;
        leakage, verifier diversity, and performance outside these suites remain open.
    - line: Post-hoc uncertainty quantification and calibration for GUI grounding
      what_it_solves: Benchmarks ranking stability of UQ methods for GUI element grounding
        and evaluates conformal click regions as a spatial safety mechanism.
      what_remains_open: Evidence is single-step only, cross-model and cross-interface
        UQ transfer is weak, and conformal coverage degrades under calibration-test
        or interface shift.
    consensus:
    - GUI agent evaluation is shifting beyond final success rates toward fine-grained
      completion, capability, and efficiency metrics.
    - Frozen or pre-trained visual-language models can be improved through external
      artifacts, harness modifications, or targeted training-data generation.
    - Benchmarks need to cover interaction modes beyond static click sequences, including
      drag, GUI+CLI, and content-changing interfaces.
    - Evidence-grounded evaluation and verifiable or rule-based task checks are becoming
      central for measuring agent behavior.
    disagreements:
    - 'Intervention point differs: evaluation formalization only versus external skill/harness
      adaptation versus training-time weak supervision or RL versus post-hoc uncertainty
      calibration.'
    - 'Evaluation scope differs: single-step GUI grounding versus multi-step trajectories,
      with some work explicitly limited to executable single-step settings while others
      target full workflows.'
    - 'Interaction coverage differs: click-focused task assumptions versus drag-heavy,
      GUI+CLI, and dynamic living-screen interfaces.'
    - 'Data assumptions differ: human-designed benchmark tasks versus massive unannotated
      screenshots versus verifiable synthetic tasks generated at scale.'
    open_questions:
    - Do harness and skill improvements transfer reliably across operating systems
      and interfaces beyond the evaluated benchmark sets?
    - Can uncertainty quantification be extended from single-step grounding to multi-step
      GUI trajectories without losing ranking stability or coverage?
    - What training or architecture changes would give agents explicit observation
      control in dynamic interfaces?
    - To what extent do weakly supervised or verifiable synthetic training methods
      suffer from benchmark leakage or verifier overfitting?
