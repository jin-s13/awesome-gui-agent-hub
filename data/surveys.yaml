    研究路线矩阵:
    - 路线: 真实桌面/移动/网页 GUI 代理基准，如 MacAgentBench、DragOn、LivingScreen
      解决的问题: 定义跨应用和交互类型的计算机使用任务、环境与评分，揭示模型优势与失败模式。
      尚未覆盖: 覆盖仍较分散，桌面 CLI/GUI、拖拽和短视频动态分别测试；跨平台迁移与局限性证据缺失。
    - 路线: 多模态技能与可复用行为库，如 VISUALSKILL、PreAct
      解决的问题: 编码应用特定流程或编译成功运行，使代理能检索视觉/文本技能或更快重放重复任务。
      尚未覆盖: 工件依赖稳定 UI 流程；UI 或任务变化后的维护与迁移、技能或程序构建过程复现性未充分证明。
    - 路线: 动态与视频引导的 GUI 任务，如 LivingScreen、VG-GUIBench 与 TASKER
      解决的问题: 覆盖动作之间变化的界面和视频引导交互任务，通过成本-准确率或任务驱动关键帧提取缓解问题。
      尚未覆盖: 观察控制仍弱；评测限于短视频或视频问答式设置，向其他动态媒体泛化未展示。
    - 路线: 可扩展网页环境与轨迹生成，如 WebAnything
      解决的问题: 从真实 URL 自动重建有源头的网页应用和交互轨迹，用于训练与评测网页代理。
      尚未覆盖: 需要逐站点设置与授权；证据集中在网页保真度和微调收益，跨领域运营或安全结果有限。
    - 路线: 面向 GUI 的视觉语言模型架构与微调，如 LLaDA-UI、DragOn 微调
      解决的问题: 通过块级扩散生成或交互特定训练数据，提升移动/桌面/网页中的定位与导航能力。
      尚未覆盖: 基线对比主要围绕 Qwen 类模型；跨平台部署和拖拽专用提升未完全确立，复现工件不清晰。
    共识:
    - 当前代理在真实应用任务上仍低于可靠的人类表现。
    - 评测应超越最终任务成功率，引入子目标完成、成本-准确率或交互特定定位，因为相似成功率可能掩盖不同能力。
    - 屏幕观察、动态界面变化和交互多样性是 GUI 代理的核心障碍。
    - 可复用工件或训练轨迹，如技能、状态机程序、网页环境，可提升下游能力或效率。
    - 证据以多模态 LLM/VLM 代理为基础，施加应用特定数据或流程，而非替代通用模型。
    分歧:
    - 评测目标不同：确定性桌面任务成功、动态屏幕成本-准确率、拖拽定位与视频引导交互成功并存。
    - 表示方式不同：分层多模态技能文件、编译状态机程序、微调模型权重与自动重建的网页环境并存。
    - 交互模式不同：部分工作关注点击和文本输入，另一些关注拖拽、动态短视频浏览或 GUI+CLI 桌面工作流。
    - 部署场景不同：真实 macOS 基准、基于浏览器的仿真、逐站点授权的网页重建各自隐含不同保真度和控制假设。
    开放问题:
    - 桌面、网页和动态界面评测能否跨操作系统、应用与交互类型组合或迁移而不损失可靠性？
    - 代理应采用何种机制在变化界面中决定观察多少屏幕信息后才采取行动？
    - 当 UI 流程改变、任务偏移或运行时屏幕状态不匹配时，应如何更新可复用技能、程序或环境？
    - 哪种训练或评测数据格式，如拖拽轨迹、视频引导关键帧、网页环境轨迹或视觉技能工件，最有助于泛化？
    - 证据包对部分高排名方法未提供代码、数据、基线与局限性，复现性和稳健比较仍属验证缺口。
