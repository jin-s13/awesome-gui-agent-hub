        context management by augmenting agents with multimodal skill artifacts, curriculum
        learning from unannotated screenshots, verifiable task synthesis, and proactive
        context actions.
      what_remains_open: Generalization to unseen applications and platforms is not
        rigorously tested; skill creation scalability and robustness to distribution
        shifts are assumed but not demonstrated.
    - line: Formalization of interaction models and reliability for GUI agents
      what_it_solves: Provides formal definitions for dynamic living-screen-native
        agents, drag-based interaction primitives, and post-hoc uncertainty quantification
        for grounding, offering a basis for safe deployment and observation control.
      what_remains_open: Formalisms are not yet integrated into training pipelines;
        multi-step safety guarantees, observation control policies, and cross-model
        reliability transfer are missing.
    consensus:
    - Evaluating GUI agents requires metrics beyond task success, such as sub-goal
      completion, information efficiency, and uncertainty calibration.
    - 'Data efficiency is critical: reducing reliance on expensive human annotations
      through weak supervision, synthetic task generation, or skill reuse is a shared
      goal.'
    - Current agents lack robust observation control and reliable uncertainty estimation,
      leading to over- or under-observation and unsafe grounding in dynamic environments.
    disagreements:
    - 'Evaluation methodology varies: deterministic rule-based scoring (MacAgentBench)
      vs. task completion with human verification (LivingScreen) vs. conformal risk
      control (Argus).'
    - 'Interaction scope: some works focus on click-based actions, while DragOn specifically
      addresses drag interactions, and LivingScreen targets continuously changing
      interfaces.'
    - 'Enhancement strategy: one line uses multimodal skill libraries (VISUALSKILL),
      another uses online RL with synthetic tasks (ScaleCUA), and a third uses weak
      supervision from unannotated screenshots (GUICrafter), implying different assumptions
      about data availability and training cost.'
    open_questions:
    - How can post-hoc uncertainty quantification for single-step grounding be extended
      to full agent trajectories to provide end-to-end safety guarantees?
    - What is the failure boundary of skill libraries and RL-trained policies when
      deployed on applications and platforms not seen during training?
    - Can formal observation-control and interaction-type constraints be incorporated
      into the learning objective of GUI agents to mitigate over-observation and under-observation?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 全面的GUI代理基准测试与评估框架
      解决的问题: 通过细粒度、多步或基于规则的指标，评估代理在真实桌面任务、动态短视频界面、拖拽交互和接地不确定性上的能力，超越简单的通过/失败评估。
      尚未覆盖: 基准测试目前主要限于单步或单领域；多步轨迹评估、跨平台泛化以及安全约束的集成尚未得到验证。
    - 路线: 通过技能库、弱监督和强化学习增强代理能力
      解决的问题: 通过多模态技能工件、未标注截图的课程学习、可验证任务合成和主动上下文动作，提升任务成功率、数据效率和长时域上下文管理。
      尚未覆盖: 对未见应用和平台的泛化缺乏严格测试；技能创建的可扩展性以及对分布偏移的鲁棒性仅为假设，未被证明。
    - 路线: GUI代理交互模型与可靠性的形式化
      解决的问题: 为动态屏幕原生代理、拖拽交互原语和接地后验不确定性量化提供形式化定义，为安全部署和观察控制奠定基础。
      尚未覆盖: 形式化尚未集成到训练流程中；多步安全保证、观察控制策略和跨模型可靠性迁移仍然缺失。
    共识:
    - GUI代理的评估需要超越任务成功率的指标，例如子目标完成度、信息效率和不确定性校准。
    - 数据效率至关重要：通过弱监督、合成任务生成或技能复用来减少对昂贵人工标注的依赖是一个共同目标。
    - 当前代理缺乏鲁棒的观察控制和可靠的不确定性估计，导致动态环境中的过度观察、观察不足和不安全接地。
    分歧:
    - 评估方法存在差异：确定性规则评分（MacAgentBench）vs. 结合人工验证的任务完成评分（LivingScreen）vs. 共形风险控制（Argus）。
    - 交互范围：一些工作专注于点击动作，而DragOn专门处理拖拽交互，LivingScreen则针对持续变化的界面。
    - 增强策略：一条路线使用多模态技能库（VISUALSKILL），另一条使用合成任务在线强化学习（ScaleCUA），第三条使用未标注截图的弱监督（GUICrafter），隐含着对数据可用性和训练成本的不同假设。
    开放问题:
    - 如何将单步接地的后验不确定性量化扩展到完整的代理轨迹，以提供端到端的安全保证？
    - 技能库和强化学习训练策略在训练时未见过的应用和平台上部署时，其失效边界是什么？
    - 能否将形式化的观察控制和交互类型约束纳入GUI代理的学习目标中，以减轻过度观察和观察不足？
