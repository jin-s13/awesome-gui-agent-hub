  related_work_outline:
  - 'Mainstream direction: Constructing and evaluating computer-use/GUI agents on
    real-world desktop, browser, and dynamic screen tasks, with a secondary push to
    improve agents through synthetic task synthesis, weak supervision, and multimodal
    skill libraries.'
  - 'Shared research pattern: Papers combine a benchmark or environment with rule-based
    or verifiable scoring, then stress-test frontier agents and methods using finer
    signals than aggregate success.'
  - 'Key differences: Evaluation targets differ across macOS desktop workflows, short-video
    dynamic screens, drag-only interactions, and video-guided tasks; supervision differs
    across synthetic online RL, weak screenshot-based grounding, and skill artifacts;
    metrics differ across Pass/subgoal, cost-accuracy, and uncertainty rankings.'
  - 'Trend evolution: Within the 2024-2026 window, the sampled evidence is concentrated
    in 2026 and shows a frontier shift from static click-based GUI tasks toward dynamic,
    multimodal, video-guided, drag-based, and desktop OS benchmarks, and from single
    success metrics to fine-grained, cost-aware, and uncertainty-aware evaluation.'
  - 'Open questions: Cross-platform and cross-model transfer of benchmark conclusions;
    alignment of fine-grained, cost, and uncertainty metrics with deployment utility;
    multi-step trajectory evaluation; observation control on dynamic screens; and
    the stability of synthetic or weakly supervised training gains.'
  related_work_outline_zh:
  - 主流方向：构建并评测面向真实桌面、浏览器和动态屏幕的计算机使用/GUI智能体，同时通过合成任务、弱监督和多模态技能库提升智能体能力。
  - 研究共性：通常构建基准或环境，并用基于规则或可验证的评分进行评测，在总体成功率之外引入更细粒度信号。
  - 关键差异：评测目标覆盖macOS桌面工作流、短视频动态屏幕、拖拽交互和视频引导任务；监督信号涵盖合成在线强化学习、截图弱监督和技能工件；指标关注Pass/subgoal、成本-准确性和不确定性排名。
  - 趋势演进：在2024-2026窗口内，可见证据集中在2026年，体现当前前沿趋势：从静态点击式GUI任务转向动态、多模态、视频引导、拖拽和桌面OS基准，从单一成功率转向细粒度、成本感知和不确定性感知指标。
  - 开放问题：基准结论跨平台和跨模型迁移；细粒度/成本/不确定性指标与真实部署效用的一致性；多步轨迹评测；动态屏幕的观察控制；合成与弱监督训练收益的稳定性。
  literature_review:
    line_of_work_matrix:
    - line: Real-world GUI/OS benchmark and dataset construction
      what_it_solves: Creates shared desktop, browser, and interaction-specific tasks
        so computer-use agents can be compared beyond short, static click-only workflows.
      what_remains_open: Coverage is concentrated in macOS, short-video platforms,
        or drag primitives; cross-environment, multi-app, and long-horizon workflow
        transfer remains underevidenced.
    - line: Metric, stress-test, and uncertainty evaluation
      what_it_solves: Probes sub-goal completion, cost-accuracy, drag grounding, and
        post-hoc uncertainty or calibration instead of relying only on aggregate success
        rates.
      what_remains_open: Many evaluations are single-step or platform-specific; alignment
        between proxy metrics and downstream deployment decisions is not yet established.
    - line: Agent training and skill-artifact construction
      what_it_solves: Reduces annotation or interaction cost and improves agent success
        through verifiable RL task synthesis, weak supervision from unannotated screenshots,
        or multimodal skill libraries.
      what_remains_open: Limitations are largely omitted in the provided evidence;
        cross-application generality, data and compute budgets, and attribution of
        gains to model, framework, or artifact are unclear.
    - line: Multimodal, video-guided, and observation-control grounding
      what_it_solves: Links visual frames or figures to GUI action and evaluates dynamic-screen
        failure modes such as over- and under-observation.
      what_remains_open: Only a small set of video, dynamic, or drag tasks is covered;
        current agents have not demonstrated reliable observation control or broad
        transfer.
    consensus:
    - Evaluation is shifting from aggregate success to finer actionable signals such
      as sub-goal completion, cost-accuracy, calibration, and uncertainty transfer.
    - Frontier agents still fall short on realistic GUI/OS tasks, especially where
      dynamic content, grounding, or interaction diversity is required.
    - Supplying agents with additional structured text or visual knowledge improves
      performance, but the source and quality of that knowledge matter.
    - 'Reproducibility evidence is uneven: several papers provide task, dataset, or
      benchmark signals, while limitation and artifact coverage remain incomplete.'
    disagreements:
    - 'Evaluation setting differs: real macOS desktop workflows versus dynamic short-video
      screens versus drag-only or video-guided interactions.'
    - 'Supervision signal differs: verifiable synthetic task synthesis with online
      RL versus weak supervision from unannotated screenshots versus curated multimodal
      skill retrieval.'
    - 'Metric priority differs: Pass@1 and sub-goal completion versus cost-accuracy
      and observation efficiency versus uncertainty-ranking transfer and conformal
      click regions.'
    - 'Interaction granularity differs: multi-checkpoint multi-application workflows
      versus single-step GUI grounding versus primitive drag operations.'
    open_questions:
    - How well do conclusions from macOS, short-video, drag, and video-guided benchmarks
      transfer across interfaces, operating systems, and model classes?
    - 'Which evaluation signals best predict real-world user utility: fine-grained
      subgoal completion, cost-accuracy, or calibrated uncertainty?'
    - Can agents learn or be trained to control observation on dynamic screens without
      sacrificing task success?
    - Do synthetic RL, weak supervision, and multimodal skill gains remain stable
      across application variety, implementation choices, and compute budgets?
    - What missing limitation or artifact details would change the current reliability
      and comparability of these reported results?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 真实GUI/OS基准与数据集构建
      解决的问题: 构建共享的桌面、浏览器及交互专项任务，使计算机使用智能体能够在静态点击工作流之外进行比较。
      尚未覆盖: 覆盖集中于macOS、短视频平台或拖拽原语；跨环境、多应用和长程工作流迁移缺乏证据。
    - 路线: 指标、压力测试与不确定性评测
      解决的问题: 在总体成功率之外检验子目标完成、成本-准确性、拖拽定位和后验不确定性或校准。
      尚未覆盖: 许多评测仍是单步或平台特定；代理指标与真实下游部署决策的一致性尚未建立。
    - 路线: 智能体训练与技能工件构建
      解决的问题: 通过可验证强化学习任务合成、未标注截图弱监督或多模态技能库降低标注和交互成本，提升智能体成功率。
      尚未覆盖: 可见证据大多缺少局限性说明；跨应用通用性、数据与算力预算，以及模型、框架和工件各自的增益贡献尚不清楚。
    - 路线: 多模态、视频引导与观察控制基础
      解决的问题: 将视觉帧或图形连接到GUI操作，并评估动态屏幕中的过度观察和观察不足等失效模式。
      尚未覆盖: 仅覆盖少量视频、动态或拖拽任务；当前智能体尚未表现出可靠的观察控制能力和广泛迁移。
    共识:
    - 评测正在从总成功率转向更细的可操作信号，如子目标完成、成本-准确性、校准和不确定性迁移。
    - 在需要动态内容、定位或交互多样性的现实GUI/OS任务上，前沿智能体仍明显不足。
    - 为智能体提供结构化的文本或视觉知识可提升性能，但知识来源与质量对结果影响显著。
    - 可复现证据不均衡：部分工作提供任务、数据集或基准信号，但局限性和工件信息不完整。
    分歧:
    - 评测场景不同：真实macOS桌面工作流、动态短视频屏幕、拖拽或视频引导交互。
    - 监督信号不同：可验证合成任务驱动的在线RL、未标注截图弱监督、策展式多模态技能检索。
    - 指标优先级不同：Pass@1与子目标完成、成本-准确性与观察效率、UQ排名迁移和共形点击区域。
    - 交互粒度不同：多检查点多应用工作流、单步GUI定位、基础拖拽操作。
    开放问题:
