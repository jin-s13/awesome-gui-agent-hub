      尚未覆盖: 跨其他操作系统/应用集和真实办公结果的迁移不清；局限性与工件信息不完整。
    - 路线: 动态与视频引导界面评测
      解决的问题: 定义动作之间屏幕变化或需要关键帧/视频理解的任务，结合准确率与信息成本进行评估。
