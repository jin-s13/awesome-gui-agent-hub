  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准驱动的任务与交互抽象
      解决的问题: 定义真实 GUI 任务套件和指标，覆盖动态、多应用、拖拽和长时交互，暴露二进制成功之外的细粒度能力差距。
      尚未覆盖: 覆盖范围限于所选平台和交互类型；尚无统一抽象连接静态定位与多步观察控制的可靠性。
    - 路线: 可扩展训练与任务合成
      解决的问题: 通过可验证在线 RL 任务生成和基于未标注截图的弱监督，降低标注成本并提升代理性能。
      尚未覆盖: 验证集中于基准分数；跨界面迁移、安全约束和分布偏移下的失败预测仍未解决。
    - 路线: 技能与上下文表示
      解决的问题: 使用多模态技能库和主动上下文管理，保持视觉定位与长时状态，避免丢失关键事实。
      尚未覆盖: 证据覆盖所选框架和应用；跨平台约定和交互类型的泛化尚未建立。
    - 路线: 不确定性与可靠性量化
      解决的问题: 对 GUI 定位的后验不确定性及空间安全进行基准测试，显示同一模型类内哪些 UQ 家族稳定。
      尚未覆盖: 现有证据仅限单步；多步轨迹 UQ 及跨模型或跨接口迁移较弱，需重新评估。
    共识:
    - 真实 GUI 评测正从静态仅点击的成功指标扩展到 GUI+CLI、动态内容、拖拽、长时移动和多应用工作流。
    - 细粒度评测揭示聚合成功率隐藏的能力差异，包括子目标完成、成本-精度、观察效率和不确定性校准。
    - 技能、记忆与上下文管理被视为代理的一等能力，而非被动历史或简单提示。
    - 弱监督、可验证任务合成和在线 RL 等可扩展数据与训练方案，是提升 GUI 代理的重要杠杆。
    分歧:
    - 评测目标不同：单步定位不确定性、端到端 Pass@1、成本-精度与子目标完成并存。
    - 表示方式不同：多模态视觉技能、文本记忆与结构化主动上下文字段各有取舍。
    - 监督信号不同：弱监督视觉定位加 RL 校准，与可验证合成任务的在线 RL 形成差异。
    - 交互范围不同：动态内容观察控制、长时移动工作流、拖拽原语和桌面多应用工作流。
