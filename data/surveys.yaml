  literature_review_zh:
    研究路线矩阵:
    - 路线: 应用特定 GUI 智能体基准
      解决的问题: 在真实桌面、网页、移动或动态界面任务中，用细粒度成功、成本或效率指标评估智能体。
      尚未覆盖: 跨平台迁移以及基准得分能否对应真实运行结果仍不清楚。
    - 路线: 可复用技能与重放程序
      解决的问题: 通过多模态技能库或将成功运行编译为带屏幕检查的状态机重放，提升计算机使用智能体的成功率和效率。
      尚未覆盖: 在未见任务、界面更新、工作流变化及新用户目标下的鲁棒性仍未验证。
    - 路线: 视频引导与动态屏幕 GUI 任务
      解决的问题: 在动态视觉界面和视频指令中建立智能体 grounding，并同时评估任务准确性与信息效率。
      尚未覆盖: 当前智能体仍存在过度观察或观察不足，缺乏观察控制；证据限于短视频和视频引导设置。
    - 路线: 面向非点击交互的数据集
      解决的问题: 覆盖文本高亮、单元格选择、缩放和滑块等拖拽式 GUI 交互，用于 grounding 和微调。
      尚未覆盖: 改进能否迁移到更丰富的交互集合和实际应用尚未在证据中确认。
    - 路线: 用于 GUI 控制的多模态基础模型
      解决的问题: 在移动、桌面和网页平台提供端到端视觉语言 grounding 与导航。
      尚未覆盖: 在可见信息中，基准广度、泛化性和可复现工件证据不完整。
    - 路线: 自动化网页环境与轨迹构建
      解决的问题: 重建基于真实来源的可复用网页环境，并生成交互轨迹用于下游智能体微调。
