  related_work_outline:
  - 'Mainstream direction: Building comprehensive GUI-agent benchmarks and training
    methods that expose capability gaps in dynamic, multimodal, and long-horizon settings,
    with growing emphasis on reliability, interaction diversity, and sample efficiency.'
  - 'Shared research pattern: Researchers construct new datasets or environments that
    extend the interaction space (drag, dynamic screens, multimodal skills, context
    management) and evaluate frontier models to reveal systematic failures, then propose
    targeted improvements.'
  - 'Key differences: Some works focus on expanding the action space (drag, context-as-action)
    while others address data efficiency (weak supervision, synthetic RL tasks) or
    reliability (uncertainty quantification). Evaluation metrics range from Pass@1
    to fine-grained, cost-accuracy, and UQ-based measures.'
  - 'Trend evolution: 2024–2026 evidence is concentrated in 2026, indicating a very
    recent frontier. The trend is moving from static web/click benchmarks toward dynamic,
    desktop-scale, multimodal, and safety-aware agent settings.'
  - 'Open questions: How well do synthetic training tasks and UQ methods transfer
    across platforms and models? Can formal interaction models (e.g., living-screen,
    drag) be unified, and will they lead to provable guarantees for agent behavior?'
  related_work_outline_zh:
  - 主流方向：构建全面的GUI代理基准和训练方法，揭示动态、多模态、长时域场景下的能力缺口，并越来越重视可靠性、交互多样性和样本效率。
  - 研究共性：研究者构建新数据集或环境来扩展交互空间（拖拽、动态屏幕、多模态技能、上下文管理），通过评估前沿模型发现系统性失败，然后提出针对性改进。
  - 关键差异：部分工作聚焦于扩展动作空间（拖拽、上下文作为动作），其他则关注数据效率（弱监督、合成RL任务）或可靠性（不确定性量化）。评测指标从Pass@1到细粒度、成本-准确性、UQ等不一。
  - 趋势演进：2024–2026年证据集中在2026年，表明这是一个非常前沿的领域。趋势从静态网页/点击基准向动态、桌面级、多模态和安全感知的代理设置演进。
  - 开放问题：合成训练任务和UQ方法跨平台、跨模型的迁移能力如何？动态屏幕、拖拽等形式化交互模型能否统一，以及能否为代理行为提供可证明的保证？
  literature_review:
    line_of_work_matrix:
    - line: Benchmarking novel interaction modalities and dynamic environments
      what_it_solves: Identifies failure modes of GUI agents beyond simple click-based
        static interfaces, such as drag operations, living-screen dynamics, and multi-application
        workflows.
      what_remains_open: These benchmarks are restricted to specific platforms or
        interaction types and do not yet provide formal guarantees; it is unclear
        whether performance improvements on one benchmark transfer to other interaction
        modalities or real-world deployment.
    - line: Multimodal skill and context representation
      what_it_solves: Improves agent performance by organizing knowledge hierarchically
        (VISUALSKILL) or by actively managing long-horizon context (MemGUI-Agent),
        thus reducing errors from missing visual cues or context overflow.
      what_remains_open: These approaches assume that the skill library or context
        fields remain accurate and up-to-date; their robustness to novel applications
        or adversarial UI changes has not been verified.
    - line: Data-efficient and scalable training recipes
      what_it_solves: Reduces reliance on expensive human annotations by using weak
        supervision from unannotated screenshots (GUICrafter) or synthesized verifiable
        tasks with online RL (ScaleCUA), achieving strong performance with significantly
        less data.
      what_remains_open: The scalability of synthesis pipelines to diverse OS environments
        and the ability of RL-trained policies to generalize beyond the set of synthesized
        tasks are not established; potential shifts in behavior under distributional
        shift remain unexamined.
    - line: Reliability and uncertainty quantification for agent actions
      what_it_solves: Provides a framework to measure and compare the confidence of
        GUI grounding decisions across different models and UQ methods, enabling safer
        deployment by flagging uncertain actions.
      what_remains_open: UQ ranking transfer across model tiers and interfaces is
        weak, and conformal coverage degrades under distribution shift, so current
        methods do not yet offer robust deployment-time safety without task-specific
        recalibration.
    consensus:
    - Current GUI agents are brittle in dynamic, long-horizon, and multimodal scenarios,
      and benchmark-driven analysis is a primary tool for revealing systematic weaknesses.
    - Expanding the interaction space (e.g., drag, context management) and improving
      sample efficiency are both necessary to make agents practical for real-world
      computer use.
    - Providing agents with structured prior knowledge, such as skill libraries or
      compact context representations, consistently improves task completion over
      raw end-to-end approaches.
    - Reliability concerns, including uncertainty quantification and observation control,
      are emerging as critical dimensions that go beyond raw task success rates.
    disagreements:
    - 'Evaluation focus: Some works prioritize task-level Pass@1 or score, while others
      emphasize fine-grained sub-goal metrics, cost-accuracy trade-offs, or uncertainty
      calibration, leading to different conclusions about what aspects of agent behavior
      matter most.'
    - 'Interaction representation: One line of work treats new interaction primitives
      (drag, context-as-action) as first-class actions, whereas another line relies
      on implicit multimodal understanding without explicit action-space expansion.'
    - 'Training paradigm: Approaches range from supervised fine-tuning on small annotated
      data, to weak supervision on massive unlabeled data, to online RL with self-generated
      tasks; there is no consensus on the most effective or safe training recipe.'
    - 'Deployment domain: Static desktop/mobile benchmarks, dynamic short-video platforms,
      and drag-specific interfaces each define different environment assumptions,
      and findings from one domain do not obviously transfer to others.'
    open_questions:
    - To what extent can UQ methods and synthesized training tasks be transferred
      across operating systems, application interfaces, and model families without
      re-calibration or re-training?
    - How can formal interaction models (e.g., living-screen, drag) be integrated
      into a unified agent framework that provides behavioral guarantees under distributional
      shift?
    - What is the minimal set of interaction primitives and context representations
      needed to cover the majority of real-world GUI tasks, and how can this be validated
      empirically?
