  related_work_outline:
  - 'Mainstream direction: Evaluation-driven construction of realistic GUI agent benchmarks
    spanning desktop, dynamic video, drag, and long-horizon mobile tasks, with fine-grained
    or cost-aware metrics.'
  - 'Shared research pattern: Papers pair a new environment or task suite with model
    analysis and frequently add a method for grounding, action prediction, training,
    context management, or uncertainty calibration.'
  - 'Key differences: They focus on different interaction settings and method layers;
    some improve policy training, some redesign context handling, and some isolate
    evaluation, uncertainty, or observation-control failures.'
  - 'Trend evolution: Within the narrow 2024–2026 frontier, evaluation is moving beyond
    static click-only benchmarks toward multi-application, dynamic, long-horizon,
    interaction-rich, and reliability-aware GUI agent tasks.'
  - 'Open questions: Cross-platform and cross-model transfer, supervision/data efficiency,
    observation control, multi-step uncertainty calibration, and whether gains come
    from the learned agent or from task/skill libraries remain unresolved; several
    top records omit limitation details, leaving verification gaps.'
  related_work_outline_zh:
  - 主流方向：以真实桌面、动态短视频、视频引导、拖拽和长时程移动任务为主构建GUI智能体基准，并引入细粒度或代价感知指标。
  - 研究共性：论文通常将新环境或任务套件与模型分析结合，同时提出用于定位、动作预测、训练、上下文管理或不确定性校准的方法。
  - 关键差异：研究侧重不同交互场景和方法层级；有的改进策略训练，有的重设计上下文管理，有的专注评测、不确定性或观察控制失败。
  - 趋势演进：在2024至2026年的当前前沿内，评测正从静态点击基准转向多应用、动态、长时程、交互丰富且关注可靠性的GUI智能体任务。
  - 开放问题：跨平台与跨模型迁移、监督与数据效率、观察控制、多步不确定性校准，以及收益来自学习智能体还是任务或技能库仍不明确；部分记录缺少局限性说明，属于验证缺口。
  literature_review:
    line_of_work_matrix:
    - line: Method representation and objective design for GUI grounding and action
        prediction
      what_it_solves: Turns GUI agent capabilities into trainable objectives using
        verifiable task synthesis, weak supervision from unannotated screens, online
        RL, or specialized drag interaction data.
      what_remains_open: Transfer beyond reported benchmarks and task families, synthesis
        quality, and whether gains come from the policy objective or surrounding system
        choices remain unclear.
    - line: Planning and action-interface methods for dynamic or long-horizon GUI
        control
      what_it_solves: Connects grounding and action prediction to observation control,
        context compression, keyframe selection, and proactive history management
        over extended or changing interfaces.
      what_remains_open: Dynamic content still induces over- and under-observation,
        and compact context strategies lack broad validation across platforms and
        interface types.
    - line: Method evidence and evaluation protocol for GUI agents
      what_it_solves: Separates method contribution from environment, scoring, and
        reliability effects through fine-grained benchmarks, cost-aware metrics, and
        uncertainty calibration.
      what_remains_open: Most evidence is platform-specific or single-step; limitation
        fields are often absent, leaving robustness and cross-benchmark transfer as
        verification gaps.
    consensus:
    - GUI agents are evaluated through executable tasks in realistic or simulated
      interfaces, with task success plus finer sub-goal or cost-aware metrics.
    - Grounding and action prediction are treated as learnable or optimizable capabilities,
      with many works reducing annotation cost through synthesis, weak supervision,
      fine-tuning, or RL.
    - Long-horizon and dynamic interfaces require explicit context or observation
      management rather than passive accumulation of full interaction history.
    - Detailed capability scoring is preferred over coarse pass-only evaluation because
      models with similar success can differ in sub-goal completion.
    disagreements:
    - 'Evaluation settings differ widely: real desktop, live short-video interfaces,
      video-guided tasks, drag-only interactions, and long-horizon mobile tasks.'
    - Some works modify agent policy training, while others add benchmark-level metrics,
      post-hoc uncertainty calibration, or evaluation artifacts without retraining
      the agent.
    - 'Success attribution differs: one study attributes gains mainly to a skill library
      rather than framework design, while others claim training or context-management
      mechanisms as the main driver.'
    - Observation handling differs between dynamic and long-horizon settings, with
      one side identifying over- and under-observation failures and another proposing
      proactive context actions.
    open_questions:
    - Can verifiable task synthesis or weakly supervised screenshots transfer beyond
      specific desktop and science-browser evaluations?
    - How should agents balance observation cost and accuracy on dynamic interfaces
      where content changes between actions?
    - Can uncertainty-aware click regions remain calibrated under interface shift
      and multi-step agent trajectories?
    - Do deterministic fine-grained metrics capture user-relevant success without
      overfitting to rule-based scoring artifacts?
    - Given absent limitation fields in several top records, which robustness and
      failure-mode claims are verification gaps rather than supported evidence?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 面向GUI定位与动作预测的方法表示与目标设计
      解决的问题: 通过可验证任务合成、未标注截图弱监督、在线RL或专门拖拽交互数据，将GUI智能体能力转化为可训练目标。
      尚未覆盖: 在已评基准和任务族之外的迁移、合成质量，以及提升来自策略目标还是系统配套选择仍不清晰。
    - 路线: 用于动态或长时程GUI控制的规划与动作接口方法
      解决的问题: 将定位与动作预测连接到观察控制、上下文压缩、关键帧选择和主动历史管理，以应对较长或变化界面。
      尚未覆盖: 动态内容仍会导致过度观察或观察不足，紧凑上下文策略缺乏跨平台和跨界面类型的广泛验证。
    - 路线: GUI智能体的方法证据与评估协议
      解决的问题: 通过细粒度基准、代价感知指标和不确定性校准，区分方法贡献与环境、评分和可靠性影响。
      尚未覆盖: 多数证据限于特定平台或单步设置；局限性字段常缺失，使鲁棒性和跨基准迁移成为验证缺口。
    共识:
    - GUI智能体通过在真实或模拟界面中执行任务来评测，并使用任务成功率加更细的子目标或代价感知指标。
    - 定位和动作预测被视为可学习或可优化能力，许多工作通过合成、弱监督、微调或RL降低标注成本。
    - 长时程和动态界面需要显式的上下文或观察管理，而非被动累积完整交互历史。
    - 细粒度能力评分优于粗粒度仅通过率，因为成功率相近的模型在子目标完成上可能差异显著。
    分歧:
    - 评估设置差异明显：真实桌面、动态短视频界面、视频引导任务、纯拖拽交互和长时程移动任务。
    - 有的工作改变智能体策略训练，有的则在基准指标、后验不确定性校准或评估工件层面贡献，而不重新训练智能体。
    - 成功归因不同：一项研究认为优势主要来自技能库而非框架设计，其他研究则称训练或上下文管理机制是主因。
    - 观察处理在动态与长时程设置中不同：一方识别出过度观察和观察不足失败，另一方提出主动上下文动作。
    开放问题:
    - 可验证任务合成或弱监督截图能否迁移到具体桌面和科学浏览器评测之外？
    - 智能体在内容随动作变化的动态界面上如何平衡观察成本与准确性？
    - 不确定性感知点击区域能否在界面偏移和多步智能体轨迹下保持校准？
    - 确定性细粒度指标能否捕捉用户相关成功，而不过拟合基于规则的评分工件？
    - 部分顶部记录缺少局限性字段，哪些鲁棒性与失败模式声明属于验证缺口而非已获证据支持？
