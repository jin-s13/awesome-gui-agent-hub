  related_work_outline:
  - 'Mainstream direction: The 2026 GUI-agent frontier is converging on richer, evidence-driven
    evaluation and adaptation. Work is moving beyond coarse task success toward fine-grained,
    verifiable, multimodal interaction signals, including macOS desktop plus CLI,
    dynamic screens, video-guided workflows, drag-based interactions, uncertainty
    calibration, and execution-harness self-improvement.'
  - 'Shared research pattern: Papers build prototypes or benchmarks around actual
    interaction evidence such as before/after screenshots, repeated runs, deterministic
    checks, or executable grounding. Many report strong gains but leave limitation
    sections thin or empty, so transfer boundaries and failure conditions are often
    under-specified.'
  - 'Key differences: Supervision ranges from weak unannotated screenshots to automatically
    verifiable synthesized RL tasks. Adaptation ranges from frozen-harness editing
    to online RL and fine-tuning. Evaluation targets include pass success, sub-goal
    completion, cost-accuracy, drag completion, and uncertainty calibration. Interaction
    modes include static desktop, dynamic short-video, video-guided, drag, and GUI
    plus CLI tasks.'
  - 'Trend evolution: The available top evidence clusters in 2026, so the trend is
    within the current frontier. Research is shifting from static click and single-interface
    GUI tasks toward multi-application, multi-interface, dynamic, observation-controlled,
    fine-grained, and reliability-aware evaluation, with adaptation moving from prompt-only
    control toward evidence-driven harnesses, verifiable RL task synthesis, and weak
    supervision.'
  - 'Open questions: How well do reported gains transfer across platforms, interfaces,
    and model classes? Does the benefit come from the backbone model, skill library,
    harness edit, task distribution, or planner? Are observation control and uncertainty
    reliable under distribution shift and multi-step deployment? Missing limitation
    details block precise boundary inference.'
  related_work_outline_zh:
  - 主流方向：2026年GUI代理前沿集中在更丰富的评测与可扩展适应上，更多工作转向细粒度、可验证和多模态交互信号，包括macOS桌面加CLI、动态屏幕、视频引导、拖拽交互、不确定性校准和执行框架自改进。
  - 研究共性：工作通常围绕真实交互证据构建方法或基准，如操作前后截图、重复运行、确定性检查或可执行定位；多数论文报告显著收益，但局限说明常缺失或过薄，迁移边界和失败条件不够明确。
  - 关键差异：监督信号从无标注截图到可验证合成RL任务不等；适应方式包括冻结执行框架编辑、在线RL和微调；评测目标覆盖任务成功、子目标完成、成本准确性、拖拽完成和不确定性校准；交互模式覆盖静态桌面、动态短视频、视频引导、拖拽和GUI加CLI任务。
  - 趋势演进：可见高分论文集中在2026年，趋势属于当前前沿内部；研究从静态点击和单一界面GUI任务转向多应用、多接口、动态观察控制、细粒度和可靠性感知评测，适应方式从只用提示词转向证据驱动执行框架、可验证RL任务合成和弱监督。
  - 开放问题：报告增益能否跨平台、接口和模型类别迁移；收益来自骨干模型、技能库、执行框架编辑、任务分布还是规划器；观察控制和不确定性在多步部署及分布偏移下是否可靠；缺失的局限性说明阻碍边界推断。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark and evaluation design for GUI interaction coverage
      what_it_solves: Provides measurable evidence beyond coarse task success for
        interaction types including desktop GUI plus CLI, dynamic short-video, drag
        operations, and video-guided tasks, using fine-grained scoring such as sub-goal
        completion and cost-accuracy.
      what_remains_open: Coverage remains platform- and task-specific; dynamic, drag,
        video, and multi-step settings have limited cross-environment generalization
        evidence, and missing limitation fields make boundary inference difficult.
    - line: Training and data-efficiency methods for GUI grounding and action prediction
      what_it_solves: Reduces dependence on costly human annotation and scales task
        coverage through weak supervision from unannotated screenshots, verifiable
        synthesized tasks, and keyframe extraction for video-conditioned grounding.
      what_remains_open: Evidence does not fully isolate data scale, representation
        choice, or reward design from downstream model quality, and generalization
        beyond reported benchmarks or backbones is not established.
    - line: Execution-harness and self-improvement methods
      what_it_solves: Improves frozen agent behavior by optimizing the executable
        harness around it, using repeated runs and before/after screenshots to diagnose
        and patch recurring failure patterns without updating backbone weights.
      what_remains_open: Contribution is ambiguous because gains may come from the
        harness, skill library, or task prior rather than agent reasoning; transfer
        evidence is limited to a few benchmarks, and harness-edit boundaries need
        more coverage.
    - line: Reliability, observation-control, and grounding diagnostics
      what_it_solves: Evaluates whether GUI grounding is calibrated, whether uncertainty
        rankings transfer, and whether agents manage observation costs on changing
        interfaces; supports spatial safety through conformal click regions and cost-accuracy
        metrics.
      what_remains_open: Evidence is mostly single-step grounding rather than multi-step
        trajectories; uncertainty transfer across model and interface regimes is weak,
        and coverage degrades under distribution shift, so deployment robustness remains
        unresolved.
    consensus:
    - Evaluation is moving beyond binary task success toward finer signals such as
      sub-goal completion, information cost, drag completion, and uncertainty calibration.
    - Learning from large-scale screenshots, repeated trajectories, and verifiable
      tasks is treated as a central path to better GUI action prediction.
    - Real observed interaction effects, especially before/after screen changes and
      executed actions, are becoming the core grounding evidence for adaptation and
      diagnosis.
    disagreements:
    - 'What to adapt differs: some methods keep model weights frozen and modify the
      harness, others apply fine-tuning or online RL, and still others change input
      keyframes or representations.'
    - 'Supervision assumptions differ: weak unannotated screenshots, automatically
      verifiable synthesized tasks, and manually curated benchmarks imply different
      evidence quality and cost.'
    - 'Evaluation targets differ: pass-level success, sub-goal completion, cost-accuracy,
      drag operation completion, uncertainty calibration, and single-step grounding
      are each emphasized differently.'
    - 'Interaction scope differs: static desktop or operating-system tasks, dynamic
      short-video feeds, video-guided workflows, drag interactions, and GUI plus CLI
      mixed tasks create different problem boundaries.'
    open_questions:
    - Do reported gains transfer across operating systems, applications, interface
      dynamics, and model classes beyond the studied benchmarks?
    - 'Which part of a GUI-agent system contributes most: backbone model, skill library,
      harness edit, task distribution, or planner/controller?'
    - How should observation control and uncertainty estimation be validated in multi-step
      deployments under distribution shift?
    - What evidence is missing when limitations are not specified, and can ablation
      protocols separate task synthesis, training, and runtime adaptation effects?
  literature_review_zh:
    研究路线矩阵:
    - 路线: GUI交互覆盖的基准与评测设计
      解决的问题: 在粗粒度成功之外提供可测量证据，覆盖桌面GUI加CLI、动态短视频、拖拽操作和视频引导任务，并使用子目标完成、成本准确性等细粒度评分。
      尚未覆盖: 覆盖仍主要局限于具体平台和任务；动态、拖拽、视频和多步设置在跨环境泛化方面证据不足，缺失的局限性字段使边界推断困难。
    - 路线: 面向GUI定位与动作预测的训练和数据效率方法
      解决的问题: 通过无标注截图的弱监督、可验证合成任务和关键帧提取降低人工标注依赖，并扩展任务覆盖与视频条件下的定位能力。
      尚未覆盖: 证据未完全隔离数据规模、表示选择或奖励设计对下游模型质量的贡献，跨基准或跨骨干模型的泛化尚未建立。
    - 路线: 执行框架与自改进方法
      解决的问题: 在不更新骨干权重的情况下优化代理周围的可执行框架，利用重复运行和前后截图诊断并修复反复出现的失败模式。
      尚未覆盖: 收益可能来自执行框架、技能库或任务先验，而非代理推理本身；迁移证据限于少数基准，框架编辑的作用边界需要更多覆盖。
    - 路线: 可靠性、观察控制与定位诊断
      解决的问题: 评估GUI定位是否校准、不确定性排名是否可迁移，以及代理在动态界面上是否控制观察成本，并通过共形点击区域支持空间安全。
      尚未覆盖: 证据主要为单步定位而非多步轨迹；跨模型和接口的不确定性迁移较弱，分布偏移下覆盖度下降，部署鲁棒性尚未解决。
    共识:
    - 评测正从二元任务成功转向更细的信号，如子目标完成、信息成本、拖拽完成和不确定性校准。
    - 基于大规模截图、重复轨迹和可验证任务的学习被视为改进GUI动作预测的核心路径。
    - 真实交互效果尤其是操作前后屏幕变化和执行动作，正在成为适应与诊断的接地证据。
    分歧:
    - 适应对象不同：有的保持模型权重冻结并修改执行框架，有的进行微调或在线RL，还有的仅改变输入关键帧或表示。
    - 监督假设不同：弱标注截图、自动可验证合成任务和人工构建基准各有不同的证据质量和成本。
    - 评测目标不同：任务成功率、子目标完成、成本准确性、拖拽完成、不确定性校准和单步定位各有强调。
    - 交互范围不同：静态桌面或操作系统任务、动态短视频信息流、视频引导工作流、拖拽交互和GUI加CLI混合任务形成不同问题边界。
    开放问题:
    - 报告增益能否跨操作系统、应用、界面动态和模型类别迁移到所研究基准之外？
    - GUI代理系统哪一部分贡献最大：骨干模型、技能库、执行框架编辑、任务分布还是规划控制器？
    - 如何在多步部署和分布偏移下验证观察控制与不确定性估计的可靠性？
    - 当局限性未说明时缺失哪些证据，消融协议能否区分任务合成、训练和运行时适应的影响？
