  related_work_outline_zh:
  - 主流方向：面向桌面、移动和网页平台的 GUI 代理综合基准测试与技能增强方法，重点在于真实任务完成和细粒度评估。
  - 研究共性：所有论文均评估多模态（视觉-语言）代理在任务导向 GUI 交互上的表现，使用屏幕截图和动作历史，并报告专有模型与人类水平或完美成功之间的差距。
  - 关键差异：评估目标从静态桌面应用延伸到动态短视频界面；交互模态涵盖点击、拖拽和命令行；改进策略分为技能库、执行重放和评判模块，而指标从 Pass@1 到成本-准确性和细粒度子目标评分不等。
  - 趋势演进：在 2026 年前沿内，基准正从单应用扩展到多应用，从静态到动态屏幕环境，从纯准确性扩展到效率和鲁棒性度量，并越来越强调视觉基础与技能复用。
  - 开放问题：技能和重放能否跨操作系统和应用领域迁移？如何为动态界面赋予代理观察控制能力？当代理在无 URL/信誉捷径的真实世界任务（如欺诈检测）中部署时，存在哪些安全保证？
  literature_review:
    line_of_work_matrix:
    - line: General GUI agent benchmarks and skill libraries
      what_it_solves: Provides standardized environments and reusable multimodal skill
        artifacts to evaluate and improve agent performance on desktop/mobile tasks
        requiring GUI and CLI interaction.
      what_remains_open: Skill libraries are built per application and may not generalize
        to unseen apps; benchmarks cover fixed sets of applications and tasks, leaving
        open-domain robustness unverified.
    - line: Dynamic and video-guided GUI interaction
      what_it_solves: Adapts GUI agents to interfaces where content changes between
        actions (e.g., short-video platforms) or where tasks are defined by video
        instructions, requiring agents to jointly reason about temporal dynamics and
        UI elements.
      what_remains_open: Agents lack observation control, leading to over-/under-observation;
        video-guided tasks depend on keyframe extraction quality, and the benchmarks
        are limited to specific platforms (short-video, ego-centric video).
    - line: Efficiency and reliability via execution replay and critics
      what_it_solves: Reduces latency and cost by compiling successful trajectories
        into state-machine programs for fast replay, and increases robustness by intercepting
        erroneous actions via history-aware visual grounding.
      what_remains_open: Replay relies on deterministic screen matching and may fail
        under UI drift; the critic is trained on existing trajectories and may not
        generalize to entirely new action types or domains.
    - line: Domain-specific safety-critical applications
      what_it_solves: Applies web agents to SMS-to-webpage fraud detection in a controlled
        setting that removes URL and reputation shortcuts, forcing models to rely
        on content-based evidence.
      what_remains_open: Real-world deployment would reintroduce shortcuts; the benchmark's
        small scale (699 cases, 10 scenarios) and the weak benign recall of agents
        limit practical trustworthiness.
    consensus:
    - Multimodal vision-language models are the backbone of current GUI agents, but
      they still fall short of human-level reliability on complex, multi-step tasks.
    - Fine-grained evaluation beyond aggregate success rate (e.g., sub-goal completion,
      cost-accuracy, multi-checkpoint scoring) is necessary to differentiate agent
      capabilities.
    - Skill augmentation, whether textual or multimodal, lifts agent performance significantly,
      but the construction of such skills remains application-specific and labor-intensive.
    - Agents struggle with execution errors and short-sighted planning, motivating
      the integration of history-aware critics and runtime verification.
    disagreements:
    - 'Interaction modality focus: some works emphasize click-based actions while
      others highlight drag-based or CLI-inclusive interactions, leading to different
      benchmark designs and failure mode coverage.'
    - 'Evaluation metric design: MacAgentBench uses deterministic rule-based multi-checkpoint
      scoring, LivingScreen uses cost-accuracy jointly, and others use simple Pass@1
      or score lifts, which are not directly comparable.'
    - 'Improvement strategy: PreAct pursues speed via trajectory compilation, VISUALSKILL
      pursues accuracy via multimodal skill retrieval, and HiViG pursues robustness
      via visual grounding and macro-action history, reflecting different assumptions
      about the primary bottleneck (latency, skill grounding, or planning).'
    - 'Deployment context: most benchmarks target office automation and general computer
      use, while FraudSMSWalker targets a security-critical application with artificially
      suppressed reputation cues, creating a tension between controlled evaluation
      and real-world applicability.'
    open_questions:
    - How can skill libraries and replay programs be transferred across different
      operating systems or application genres without manual re-authoring?
    - What mechanisms can give agents explicit observation control to avoid over-
      or under-observation in dynamic, living-screen environments?
    - Can the gains from visual skill retention, history-aware critics, and replay
      compilation be combined without conflicts, and would they generalize to safety-critical
      domains like fraud detection?
    - What is the minimum set of evaluation dimensions (accuracy, latency, cost, robustness
      to UI drift) required to certify a GUI agent for real-world deployment?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 通用 GUI 代理基准与技能库
      解决的问题: 提供标准化环境和可复用的多模态技能工件，以评估和提升代理在需要 GUI 和 CLI 交互的桌面/移动任务上的表现。
      尚未覆盖: 技能库按应用构建，可能无法泛化到未见过的应用；基准覆盖的应用和任务集固定，开放域鲁棒性未经验证。
    - 路线: 动态与视频引导的 GUI 交互
      解决的问题: 将 GUI 代理适配到内容在操作之间变化的界面（如短视频平台）或由视频指令定义的任务，要求代理同时推理时间动态和 UI 元素。
