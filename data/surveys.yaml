  related_work_outline:
  - 'Mainstream direction: Application-focused GUI-agent research is centering on
    real desktop, browser, and interaction-specific benchmarks that measure end-to-end
    task completion and operational efficiency, then pairing those benchmarks with
    agent-side skill, memory, or architecture improvements to raise reliability and
    reduce cost.'
  - 'Shared research pattern: Work formalizes a computer-use task distribution, evaluates
    frontier models on grounded UI actions, and introduces a reusable artifact such
    as a benchmark, dataset, skill library, state-machine program, or diffusion model
    to address observed failures in grounding, observation control, or repeated-task
    overhead.'
  - 'Key differences: Studies differ in interaction surface, including multi-app desktop
    with CLI, dynamic short-video feeds, drag gestures, and video-guided tasks; in
    optimization target such as accuracy, cost-accuracy, speed, or token cost; and
    in method type such as evaluation-only, replay/memory augmentation, multimodal
    skill retrieval, or new vision-language architecture.'
  - 'Trend evolution: The available top evidence is concentrated at the 2026 frontier.
    Within this window, work is moving from static click-focused benchmarks toward
    dynamic, interaction-heavy, multimodal tasks, and from single-run model accuracy
    toward reusable skill/memory execution and efficiency.'
  - 'Open questions: How observation control can be made explicit; whether drag or
    video-guided improvements transfer to real workflows; how far memory and skill
    artifacts generalize across applications and OS versions; and why many method
    papers omit limitations, code, or dataset releases.'
  related_work_outline_zh:
  - 主流方向：GUI 智能体研究围绕真实桌面、浏览器和交互型基准展开，既评测端到端任务完成度，也考察 token、执行时间和子目标等效率指标；并配套技能、记忆或模型架构改进来提升可靠性。
  - 研究共性：将计算机使用任务形式化为可评测的界面操作轨迹；用多模态或轨迹证据增强 UI 定位；以任务成功、效率和复用性共同衡量代理。
  - 关键差异：交互表面不同，如多应用桌面含 CLI、动态短视频、拖拽和视频引导任务；优化目标不同，如准确率、成本-准确率、执行速度；方法类型不同，如仅评测、记忆/技能复用、多模态检索或扩散架构。
  - 趋势演进：可见证据集中在 2026 年前沿。窗口内方向从静态点击基准转向动态、交互密集、多模态任务，从单次准确率转向可复用技能/记忆执行和效率。
  - 开放问题：如何显式控制观察；拖拽与视频引导提升能否迁移到真实工作流；技能/记忆跨应用和系统版本泛化；方法论文普遍缺失局限性和公开工件。
  literature_review:
    line_of_work_matrix:
    - line: Real-world desktop/OS GUI benchmarking
      what_it_solves: Provides multi-application, fine-grained evaluation for GUI
        and CLI workflows, capturing partial completion rather than only final task
        success.
      what_remains_open: Transfer to other OS/application sets and real office outcomes
        is unexplained; limitation and artifact details are incomplete.
    - line: Dynamic and video-guided interface evaluation
      what_it_solves: Defines tasks where screens change between actions or require
        keyframe/video understanding, measuring accuracy together with information
        cost.
      what_remains_open: Coverage is limited to short-video platforms or video-question
        proxies; explicit observation-control policies are still missing.
    - line: Interaction-type-specific dataset construction
      what_it_solves: Builds task suites and training data for drag-based interactions
        that click-focused benchmarks ignore, including text selection, cells, resizing,
        and sliders.
      what_remains_open: Whether fine-tuned grounding gains translate into end-to-end
        computer-use success remains only suggested, not established.
    - line: Skill, memory, and replay augmentation
      what_it_solves: Converts validated GUI trajectories or authored app knowledge
        into reusable multimodal skills, state-machine programs, or callable memories,
        reducing token/time cost and improving UI identification.
      what_remains_open: Deterministic replay rejects ambiguous steps; cross-application
        generalization, lifecycle maintenance, and failure modes need more evidence.
    - line: Diffusion vision-language GUI architectures
      what_it_solves: Trains a block-wise diffusion multimodal model for GUI grounding
        and navigation, aiming to preserve parallel decoding for interactive use.
      what_remains_open: Benchmark gains are reported on a limited set, and reproducibility,
        limitations, and deployment cost are not fully documented.
    consensus:
    - Studies agree that real GUI task evaluation requires grounded interface interaction
      rather than text-only instruction following.
    - Task success must be complemented by efficiency or subgoal metrics such as token
      cost, execution time, Pass@1, or cost-accuracy.
    - Reusing validated trajectories or multimodal skills is a promising route to
      improve both reliability and efficiency.
    - Current frontier agents still fail on multi-application workflows, dynamic interfaces,
      or underrepresented interaction types.
    disagreements:
    - 'They disagree on evaluation surface: desktop multi-app with CLI, dynamic short-video
      platforms, drag interactions, or video-guided GUI tasks.'
    - 'They differ in optimization focus: some target model architecture or training,
      others target runtime replay, skill retrieval, or benchmark construction.'
    - 'They use different action representations: screenshot grounding with pixel/tool
      calls, state-machine replay with screen checks, or extracted keyframes.'
    - They evaluate complementary outcomes such as final task success, sub-goal completion,
      cost-accuracy, speedup, or grounding accuracy, making direct comparison difficult.
    open_questions:
    - Can memory or skill artifacts generalize across unseen application layouts,
      OS versions, and user-specific workflows?
    - How should GUI agents decide when to observe more, act, or reuse a past trajectory
      in non-stationary and dynamic interfaces?
    - Do dataset-level gains from drag or video-guided training transfer to long-horizon
      computer-use tasks?
    - What is the actual reproducibility of reported GUI-agent improvements when code,
      datasets, baseline details, and limitations are not disclosed?
