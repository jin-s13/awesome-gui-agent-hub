    研究路线矩阵:
    - 路线: GUI智能体能力的分类体系与路线图综合
      解决的问题: 把碎片化的GUI智能体研究组织为视频引导任务、长时程移动控制、基础定位不确定性、安全和数据生成等方向。
      尚未覆盖: 证据包中缺少显式综述或系统分类；综合只能从基准和方法论文中推断，覆盖范围与筛选标准没有得到证据支撑。
    - 路线: 跨GUI基准与协议的对比评测综合
      解决的问题: 展示屏蔽线索、系统提示变化、数据集偏移和接口差异如何影响跨视觉语言模型、GUI定位、网页和移动任务的结论。
      尚未覆盖: 单步与多步设置、闭源内部状态不可访问以及工件披露不一致，限制了可比性。
    - 路线: 可靠性、安全与部署的开放问题映射
      解决的问题: 把不确定性量化迁移、领域条件安全、长时程上下文和自主评估器噪声等实证结果转化为研究缺口。
      尚未覆盖: 缺口优先级没有证据；多步不确定性量化、优化攻击和真实世界信誉线索边界仍未解决。
    - 路线: 面向可扩展GUI智能体训练的任务与演示生成
      解决的问题: 创建可验证任务、人类录屏教程和合成上下文管理演示，用于监督学习和强化学习。
      尚未覆盖: 证据未显示生成任务或教程是否保留真实世界复杂性，或是否仅在少数基准成功率上过拟合。
    - 路线: 计算机使用智能体的安全与鲁棒性审计
      解决的问题: 通过手工构造注入的受控红队测试揭示浏览器任务鲁棒性与编码任务失败，区分攻击类别声明与优化字符串效应。
      尚未覆盖: 仅测试手工攻击；强化学习优化的注入字符串和跨域防御泛化仍未验证。
    共识:
    - 该领域正收敛到以多模态GUI/计算机使用智能体为核心、以任务成功率或基准指标为主要证据，但证据多来自狭窄受控设置而非广泛真实部署。
    - 基准设计和协议会实质改变结论：屏蔽URL或信誉线索、改变系统提示、区分单步定位与多步轨迹都会暴露不同失效模式。
    - 可靠性正在成为一等评测目标，不确定性量化、安全审计和噪声校正的自主奖励是共同关注点。
    - 工件与局限性报告不均衡，形成可复现性和跨论文比较的验证缺口。
    分歧:
    - 评测范围：单步GUI定位、长时程移动控制、欺诈检测、教程驱动规划与浏览器安全使用不兼容的指标或任务时程。
    - 监督与训练：人类或合成演示的监督微调、可验证任务在线强化学习、以及仅基准评测等方法对能力证据的信号不同。
    - 安全与部署：浏览器任务对手工提示注入表现较强抵抗，而编码任务技能注入成功率很高，说明安全是领域条件而非通用。
    - 不确定性表示：基于logits、隐藏状态/密度、共形和口头化置信度的方法排名不同，跨模型迁移弱。
    - 评测条件：部分工作移除真实世界URL或信誉捷径以隔离推理，另一部分使用真实计算机任务和系统提示，导致失效分布不同。
    开放问题:
    - 不确定性量化如何在闭源接口和从单步GUI定位到多步轨迹之间迁移，而无需目标特定重新排名？
    - 哪些生成任务或教程分布能保留真实世界复杂性并避免在基准成功率上过拟合？
    - 为什么浏览器域的安全加固在编码任务中失效，需要哪些跨域或优化攻击协议才能建立通用鲁棒性？
    - 如何在不引入基准特定偏差或掩盖真实任务失败的情况下校正有噪声的自主评估器奖励？
    - 本主题的系统综述或分类证据在哪里？证据包显示方法/基准论文，综述结论仍存在验证缺口。
