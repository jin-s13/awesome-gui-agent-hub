  related_work_outline:
  - 'Mainstream direction: Benchmark design and agent adaptation are converging on
    GUI/computer-use automation, with shared executable environments spanning real
    macOS desktop, dynamic browser/short-video, and video-guided tasks.'
  - 'Shared research pattern: Papers construct task suites with deterministic or rule-based
    scoring, compare frontier VLM/LLM agents, and augment evaluation with fine-grained
    metrics such as sub-goal, cost-accuracy, and uncertainty.'
  - 'Key differences: They differ in evaluation target, scoring philosophy, and intervention:
    static multi-app desktop workflows vs dynamic living-screen/video tasks; Pass@1
    vs cost-accuracy vs uncertainty/conformal metrics; benchmark-only vs skill/training/harness
    methods.'
  - 'Trend evolution: From 2024-2026 the frontier shifts from aggregate task success
    toward observation efficiency, uncertainty-aware assessment, and training/harness-level
    improvements; the sample is concentrated in 2026, so this is a current-frontier
    trend.'
  - 'Open questions: Cross-platform and dynamic-interface generalization, metric alignment
    with user decisions, transferability of uncertainty and frozen harness gains,
    and stability across implementations and annotation budgets remain unresolved.'
  related_work_outline_zh:
  - 主流方向：基准设计与智能体能力改进在GUI/计算机使用自动化上汇聚，共享可执行环境覆盖真实macOS桌面、动态浏览器/短视频和视频引导任务。
  - 研究共性：构建确定性或规则化评分的任务套件，比较前沿VLM/LLM智能体，并用子目标、成本-准确性、不确定性等细粒度指标补充评测。
  - 关键差异：评测目标、评分哲学和干预方式不同：静态多应用桌面工作流 vs 动态屏幕/视频任务；Pass@1 vs 成本-准确性 vs 不确定性/共形指标；仅基准评测
    vs 技能/训练/harness方法。
  - 趋势演进：2024-2026年间前沿从总体任务成功率转向观察效率、不确定性感知评测和训练/harness层改进；样本集中在2026年，因此属于当前前沿趋势。
  - 开放问题：跨平台与动态界面泛化、指标与用户决策对齐、不确定性与冻结harness收益的可迁移性、以及实现与标注预算下的结论稳定性仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: Real-world GUI/OS task and dataset design
      what_it_solves: Creates executable shared tasks for macOS desktop, browser-simulated
        short-video, and video-guided GUI control so model claims are comparable across
        frameworks and models.
      what_remains_open: Coverage remains narrow by platform and interaction type;
        multi-step trajectory generalization and cross-platform transfer are not established.
    - line: Fine-grained metric and stress-test design
      what_it_solves: Probes sub-goal completion, cost-accuracy/observation efficiency,
        uncertainty ranking, and conformal click regions beyond aggregate success.
      what_remains_open: Alignment between these proxy metrics and downstream user
        utility is unresolved; uncertainty ranking transfers weakly across model classes
        and interfaces, and conformal coverage degrades under shift.
    - line: Agent capability and adaptation methods
      what_it_solves: Improves computer-use agents through multimodal skills, weakly
        supervised visual grounding, verifiable RL task synthesis, evidence-driven
        harness evolution, and keyframe extraction.
      what_remains_open: Held-out generalization, frozen-harness transfer to other
        benchmarks, sample efficiency, and reliance on benchmark-specific tuning remain
        verification gaps.
    - line: Comparable baselines and reproducibility artifacts
      what_it_solves: Supports auditability by comparing multiple models/frameworks,
        using deterministic rule-based scoring, repeated-run evidence, and releasing
        scripts or artifacts.
      what_remains_open: Several analyses lack explicit limitation, code, or dataset
        details; stability across implementations and compute budgets is not directly
        evidenced.
    consensus:
    - Shared environments use deterministic or rule-based executable scoring to make
      GUI-agent results auditable.
    - Fine-grained evaluation beyond Pass@1 reveals hidden gaps in sub-goal completion,
      observation control, and uncertainty calibration.
    - Frontier VLM/LLM agents still fall short of human-level or stable general-purpose
      performance on dynamic and multi-application tasks.
    disagreements:
    - Evaluation targets range from real macOS multi-application desktop workflows
      to browser-simulated dynamic short-video tasks, video-guided GUI tasks, and
      single-step GUI grounding.
    - 'Scoring philosophies differ: Pass@1 with sub-goal checking, cost-accuracy and
      observation efficiency, uncertainty ranking with conformal safety, and video-guided
      task accuracy.'
    - 'Intervention level differs: some works only measure baselines, while others
      modify skills, training data, RL objectives, or the execution harness.'
    - 'Interaction assumptions differ: mixed GUI+CLI desktop control, living-screen
      content that changes between actions, and single-step GUI grounding are not
      interchangeable.'
    open_questions:
    - How well do scores on static or platform-specific benchmarks transfer to dynamic
      living-screen, cross-platform, and multi-app workflows?
    - Which fine-grained metrics best track downstream user decisions when agents
      over-observe or under-observe?
    - Can uncertainty ranking and conformal click regions calibrated on one model
      or interface transfer to closed-source or shifted settings without target-specific
      reranking?
    - How stable are benchmark conclusions across framework implementations, compute
      budgets, and missing code or limitation details?
    - Does weak supervision or verifiable RL on synthesized GUI tasks generalize beyond
      the specific suites where gains are reported?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 真实GUI/OS任务与数据集设计
      解决的问题: 构建macOS桌面、浏览器模拟短视频和视频引导GUI的可执行共享任务，使不同框架和模型的代理能力可比较。
      尚未覆盖: 平台与交互类型覆盖仍较窄；多步轨迹泛化与跨平台迁移尚未得到充分验证。
    - 路线: 细粒度指标与压力测试设计
      解决的问题: 在总体成功率之外检验子目标完成、成本-准确性/观察效率、不确定性排序和共形点击区域。
      尚未覆盖: 这些代理指标与下游用户效用的一致性尚未解决；不确定性排序跨模型类别和接口迁移弱，共形覆盖在分布偏移下下降。
    - 路线: 智能体能力与适应方法
      解决的问题: 通过多模态技能、弱监督视觉定位、可验证RL任务合成、证据驱动harness演进和关键帧提取来改进计算机使用智能体。
      尚未覆盖: 保留集泛化、冻结harness向其他基准的迁移、样本效率以及对特定基准调优的依赖仍是验证缺口。
    - 路线: 可比基线与可复现工件
      解决的问题: 通过多模型/多框架比较、确定性规则评分、重复运行证据和脚本/工件发布来支持可审计性。
      尚未覆盖: 若干分析缺少明确的局限性、代码或数据集细节；跨实现和算力预算的结论稳定性未直接证实。
    共识:
    - 共享环境采用确定性或规则化可执行评分，使GUI智能体结果可审计。
    - 超越Pass@1的细粒度评估揭示子目标完成、观察控制和不确定性校准方面的隐藏差距。
    - 前沿VLM/LLM智能体在动态和多应用任务上仍达不到人类水平或稳定的通用性能。
    分歧:
    - 评测目标覆盖真实macOS多应用桌面工作流、浏览器模拟动态短视频任务、视频引导GUI任务和单步GUI基础。
    - 评分重点不同：Pass@1与子目标检查、成本-准确性与观察效率、不确定性排序与共形安全、视频引导任务准确性。
    - 干预层级不同：有的仅测量基线，有的修改技能、训练数据、RL目标或执行harness。
    - 交互假设不同：GUI+CLI混合桌面控制、动作间动态变化的屏幕内容、单步GUI grounding不可互换。
    开放问题:
    - 静态或平台特定基准的分数能否迁移到动态屏幕、跨平台和多应用工作流？
    - 哪些细粒度指标最贴合智能体过度观察或观察不足时的下游用户决策？
    - 在一种模型或接口上校准的不确定性排序和共形点击区域，能否无需目标特定重新排序就迁移到闭源或偏移场景？
    - 在框架实现、算力预算以及代码或局限性细节缺失的情况下，基准结论是否稳定？
    - 基于合成GUI任务的弱监督或可验证RL，是否能泛化到报告提升之外的具体套件？
