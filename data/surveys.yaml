  related_work_outline:
  - 'Mainstream direction: GUI agent evaluation and training are shifting from static
    click-only tasks to real desktops, dynamic short-video feeds, video-guided interaction,
    and drag-based interfaces, with fine-grained or cost-aware scoring.'
  - 'Shared research pattern: build or scale a task suite/environment, evaluate frontier
    models across multiple frameworks or datasets, and use failures to motivate either
    a training method or a scoring/granularity change.'
  - 'Key differences: evaluation targets split between single-step grounding, multi-step
    desktop tasks, and dynamic video/feed tasks; training interventions split between
    frozen-harness adaptation, online RL, and weakly-supervised visual grounding.'
  - 'Trend evolution: available top-paper evidence is concentrated in 2026, so the
    observed movement is within the current frontier—toward verifiable task synthesis,
    self-improvement, observation control, and low-annotation training.'
  - 'Open questions: cross-platform transfer of failure diagnoses, observation control
    in dynamic interfaces, model uncertainty over trajectories, and whether data-efficient
    or harness-level adaptation generalizes beyond reported benchmarks.'
  related_work_outline_zh:
  - 主流方向：GUI智能体评测与训练正从静态点击任务转向真实桌面、动态短视频流、视频引导交互和拖拽式界面，并引入细粒度或代价感知的评分。
  - 研究共性：构建或扩大任务集/环境，在多个框架或数据集上评测前沿模型，并利用失败模式反推训练方法或评分粒度改进。
  - 关键差异：评测目标在单步grounding、多步桌面任务和动态视频/信息流任务之间分化；训练干预在冻结harness适配、在线RL和弱监督视觉定位之间分化。
  - 趋势演进：可见的高相关论文集中在2026年，因此观察到的演变属于当前前沿内变化：转向可验证任务合成、自改进、观察控制和低标注训练，而非更长历史轨迹。
  - 开放问题：失败诊断能否跨平台迁移，动态界面中的观察控制，智能体轨迹层面的不确定性量化，以及数据高效或harness级自适应能否推广到已报告基准之外。
  literature_review:
    line_of_work_matrix:
    - line: Task and benchmark design for GUI grounding and interaction
      what_it_solves: Measures action grounding and task completion across real desktop,
        dynamic short-video, video-guided, and drag-based interfaces, replacing coarse
        click-only metrics with sub-goal, cost-accuracy, and interaction-type coverage.
      what_remains_open: Coverage is still constrained to specific platforms or interaction
        types; missing limitation details and transfer evidence leave cross-interface
        generalization unresolved.
    - line: Training and self-improvement objectives for GUI agents
      what_it_solves: Improves GUI policies through verifiable online RL task synthesis,
        weakly-supervised visual grounding from unannotated screenshots, or evidence-driven
        optimization of the execution harness around frozen models.
      what_remains_open: Papers often report gains on one or two suites without full
        limitations; the contribution split among model, data, reward, framework,
        and harness remains under-ablated.
    - line: Inference-time representation and uncertainty for GUI grounding
      what_it_solves: Uses keyframe extraction for video-guided tasks and post-hoc
        uncertainty quantification to make GUI grounding more selective, efficient,
        or spatially calibrated.
      what_remains_open: Uncertainty evidence is single-step grounding, not multi-step
        agent trajectories; post-hoc transfer is weak across model tiers/interfaces,
        and conformal coverage degrades under distribution shift.
    consensus:
    - 'Overall success rates hide important differences: fine-grained sub-goal scores,
      cost-accuracy ratios, or checkpoint-level completion are needed to compare agents.'
    - Current agents share bottlenecks around dynamic observation, non-click interactions,
      and weak transfer across interfaces or model tiers.
    - Large-scale synthetic, weakly-labeled, or verifiable data and deterministic/rule-based
      checks are common supports for GUI-agent evaluation and improvement.
    disagreements:
    - Some evaluations target static desktop or app task completion, while others
      target dynamic living-screen or video-guided task completion, so the demanded
      agent capability differs.
    - Some methods update the policy with online RL or weak supervision, while others
      keep the model frozen and modify the execution harness or observation representation.
    - Uncertainty evidence is anchored in single-step grounding, whereas agent training
      and benchmark results are anchored in multi-step task completion, creating different
      validity boundaries.
    - 'Contribution attribution is not standardized: one benchmark reports framework-independent
      skill-library gains, while another system reports state-of-the-art open-agent
      results, muddling whether gain comes from method or surrounding system choices.'
    open_questions:
    - Which failure patterns require retraining versus harness or observation-side
      changes, and how can this be tested across independent benchmarks?
    - Can dynamic living-screen and video-guided benchmarks produce a transferable
      observation-control signal for real-world GUI agents?
    - What uncertainty estimators remain calibrated across multi-step trajectories,
      closed-source models, and shifted interfaces?
    - Does weak supervision from unannotated screenshots scale to broader GUI domains
      while preserving grounding reliability?
  literature_review_zh:
    研究路线矩阵:
    - 路线: GUI定位与交互的任务和基准设计
      解决的问题: 在真实桌面、动态短视频、视频引导和拖拽式界面中测量动作定位与任务完成，用子目标、代价-精度和交互类型覆盖替代粗略的点击指标。
      尚未覆盖: 覆盖仍受特定平台或交互类型限制；缺失的局限性说明和迁移证据使跨界面泛化仍未解决。
    - 路线: GUI智能体的训练与自改进目标
      解决的问题: 通过可验证在线RL任务合成、基于未标注截图的弱监督视觉定位，或围绕冻结模型优化执行harness来提升GUI策略。
      尚未覆盖: 多篇论文只报告一两个套件上的提升且未给完整限制；模型、数据、奖励、框架和harness的贡献拆分仍缺少充分消融。
    - 路线: GUI grounding的推理表示与不确定性
      解决的问题: 通过视频引导任务的关键帧提取和后验不确定性量化，使GUI定位更具选择性、信息效率或空间校准。
      尚未覆盖: UQ证据停留在单步grounding而非多步智能体轨迹；后验方法跨模型层级/接口迁移弱，共形覆盖在分布偏移下下降。
    共识:
    - 总体成功率会掩盖重要差异，需要子目标得分、代价-精度比或检查点级完成度来比较智能体。
    - 当前智能体在动态观察、非点击交互以及跨接口或模型层级迁移方面存在共同瓶颈。
    - 大规模合成、弱标注或可验证数据以及确定性/规则检查是GUI智能体评测和改进的常见支撑。
    分歧:
    - 有的评测面向静态桌面或应用任务完成，有的面向动态短视频或视频引导任务完成，所要求的能力不同。
    - 有的方法通过在线RL或弱监督更新策略，有的保持模型冻结并修改执行harness或观察表示。
    - 不确定性证据锚定在单步grounding，而智能体训练与基准结果锚定在多步任务完成，形成不同的效度边界。
    - 贡献归属尚未标准化：有基准报告技能库带来的增益，有系统报告开放智能体最优结果，难以分辨方法本身与周边系统选择的贡献。
    开放问题:
    - 哪些失败模式需要重新训练，哪些只需改变harness或观察侧，如何用独立基准验证？
    - 动态短视频和视频引导基准能否产生可迁移到真实GUI智能体的观察控制信号？
    - 哪些不确定性估计量能在多步轨迹、闭源模型和分布偏移接口上保持校准？
    - 基于未标注截图的弱监督能否在保持grounding可靠性的同时扩展到更广GUI领域？
