  literature_review:
    line_of_work_matrix:
    - line: End-to-end RL training frameworks for live computer-use and web agents
      what_it_solves: Trains agents in real browser, desktop, and harness environments
        by converting rollouts into RL data, reducing reliance on large annotated
        corpora.
      what_remains_open: Error recovery remains weak after training, some harnesses
        are harder to learn, and deployment robustness plus independent reproduction
        need more evidence.
    - line: Multimodal skill and memory libraries for GUI agents
      what_it_solves: Improves computer-use performance by retrieving task-relevant
        visual and text artifacts or storing action-grounded image crops.
      what_remains_open: Generalization beyond curated applications and the trade-off
        between memory granularity and action-level errors are not fully covered.
    - line: Native screenshot-only computer-use models and scaffolding
      what_it_solves: Produces keyboard/mouse actions directly from screenshots, with
        fixed-size visual history to support long-horizon tasks without DOM or accessibility
        metadata.
      what_remains_open: Coverage beyond predefined operating-system/action vocabularies
        and real-time asynchronous dynamics has not been fully verified.
    - line: Diagnostic benchmarks for GUI transition understanding and action inference
      what_it_solves: Isolates state verification, source tracking, context-aware
        control, and action recognition failures that end-task success metrics may
        hide.
      what_remains_open: Offline evaluation misses live timing, delays, and cross-OS
        interaction; current evidence is limited to Linux and five action types.
    - line: Safety auditing and red-teaming for computer-using agents
      what_it_solves: Measures prompt/skill injection resistance and audits whether
        prior red-teaming results reproduce across browser and coding domains.
      what_remains_open: Only hand-crafted templates were tested; optimized injection
        strings were not reproduced, and safety appears domain-conditioned.
    - line: Open-source orchestration infrastructure for stateful harness rollouts
      what_it_solves: Enables scalable agent training and inference through containerized
        isolation and standard reinforcement-learning stacks.
      what_remains_open: Independent replication across teams, datasets, and infrastructure
        environments is still a verification gap.
    consensus:
    - Training and evaluation increasingly occur in actual GUI, browser, desktop,
      or harness environments rather than only static single-frame grounding.
    - Combining a small amount of supervised or high-quality data with reinforcement
      learning improves data efficiency and task success.
    - Visual context is necessary but not sufficient; its representation and grounding
      shape action-level reliability.
    - Benchmarks are moving toward diagnosing sub-task failures and safety, not only
      reporting aggregate task success.
    disagreements:
    - 'Representation differs: some agents use screenshots only, while others augment
      text with visual figures or action-grounded image crops.'
    - 'Supervision differs: weakly supervised learning from unannotated screenshots,
      online multi-turn RL from live rollouts, and harness-call proxy RL use different
      training signals.'
    - 'Evaluation target differs: task success, diagnostic transition ordering/action
      inference, and attack success rate measure different abilities.'
    - 'Interaction mode differs: direct keyboard/mouse output, harness-mediated calls,
      and browser/desktop flows create different integration assumptions.'
    - 'Deployment setting differs: live websites, Linux desktop environments, coding
      agents, and browser tasks expose different dynamics and safety boundaries.'
    open_questions:
    - Can reinforcement learning retain or improve error recovery, given evidence
      that recovery remains weak even after training?
    - Which harness properties make an environment learnable, and can trainability
      be improved without changing deployment behavior?
    - How well do screenshot-only and skill-augmented agents generalize beyond Linux,
      five actions, and curated application sets?
    - What safety evaluation is needed to cover optimized injection strings and cross-domain
      skill injection beyond hand-crafted browser attacks?
    - How do offline diagnostic results transfer to live asynchronous GUI dynamics,
      and what artifacts are sufficient for independent reproduction?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 面向真实计算机使用与网页智能体的端到端强化学习训练框架
      解决的问题: 将浏览器、桌面和Harness环境中的执行轨迹转化为强化学习数据，降低对大规模标注语料的依赖。
      尚未覆盖: 错误恢复在训练后仍然较弱，部分Harness更难学习；部署鲁棒性与独立复现证据不足。
    - 路线: 面向GUI智能体的多模态技能与记忆库
      解决的问题: 通过检索任务相关文本与视觉工件，或存储动作接地图像裁剪，提升计算机使用表现。
      尚未覆盖: 精选应用之外的泛化，以及记忆粒度与动作级错误之间的权衡尚未充分覆盖。
    - 路线: 基于纯截图的原生计算机使用模型与脚手架
      解决的问题: 仅从截图输出键盘鼠标动作，以固定大小视觉历史支持长程任务，避免依赖DOM或可访问性元数据。
      尚未覆盖: 对预定义操作系统/动作词汇和实时异步动态之外的覆盖尚未充分验证。
    - 路线: GUI过渡理解与动作推断的诊断基准
      解决的问题: 分离状态验证、源跟踪、上下文感知控制和动作识别失败，避免只由最终任务成功率掩盖问题。
      尚未覆盖: 离线评估缺少实时时序、延迟和跨操作系统交互，证据限于Linux和五类动作。
    - 路线: 计算机使用智能体的安全审计与红队测试
      解决的问题: 衡量提示/技能注入抗性，并审计浏览器与编码领域中以往红队结果是否可复现。
      尚未覆盖: 仅测试手工模板；未复现优化注入字符串，安全性呈领域条件性。
    - 路线: 面向有状态Harness的开放式编排基础设施
      解决的问题: 通过容器化隔离和标准强化学习栈实现可扩展的智能体训练与推理。
      尚未覆盖: 跨团队、数据集和基础设施环境的独立复现仍是验证缺口。
    共识:
    - 训练和评测越来越多发生在真实GUI、浏览器、桌面或Harness环境中，而不仅是静态单帧定位。
    - 少量监督或高质量数据结合强化学习可在数据效率和任务成功率上获益。
    - 视觉上下文必要但不充分，其表示与接地方式影响动作级可靠性。
    - 基准正在转向诊断子任务失败与安全性，而不只报告总体任务成功。
    分歧:
    - 表示方式不同：一些智能体仅使用截图，另一些在文本基础上引入视觉图形或动作接地图像裁剪。
    - 监督信号不同：未标注截图弱监督、真实环境在线多轮强化学习和Harness调用代理强化学习使用不同训练来源。
    - 评测目标不同：任务成功率、诊断性过渡排序/动作推断和攻击成功率分别衡量不同能力。
    - 交互模式不同：直接键盘鼠标输出、Harness中介调用以及浏览器/桌面流程带来不同集成假设。
    - 部署场景不同：真实网站、Linux桌面、编码智能体和浏览器任务暴露不同的动态与安全边界。
    开放问题:
    - 在OpenForgeRL报告训练后错误恢复仍弱的情况下，强化学习能否保留并提升错误恢复？
    - 哪些Harness属性使环境更可学习，能否在不改变部署行为的情况下改善可训练性？
    - 纯截图和技能增强代理在Linux、五类动作和精选应用之外的泛化如何？
    - 除手工浏览器攻击外，如何评测优化注入字符串和跨领域技能注入的安全性？
    - 离线诊断结果如何迁移到实时异步GUI动态，何种工件足以支持独立复现？
