  - 关键差异：训练范式不同——基于可验证任务的RL vs. 弱监督课程学习 vs. 带上下文管理的监督微调。评估目标不同：真实桌面任务、短视频平台、视频引导交互或拖拽操作。对可靠性（如不确定性量化）的考虑程度从缺失到核心不等。
