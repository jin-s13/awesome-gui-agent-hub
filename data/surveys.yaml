  related_work_outline:
  - 'Mainstream direction: The evidence is dominated by GUI-agent benchmarking and
    training recipes that target realistically complex computer-use tasks, including
    desktop, mobile, short-video, drag, and mixed GUI/CLI interactions, with fine-grained
    evaluation beyond pass@1.'
  - 'Shared research pattern: Papers construct task suites or environments, evaluate
    VLM-based agents on grounded interaction, diagnose failures such as weak observation
    control or sub-goal gaps, and then improve agents through weakly supervised, synthetic,
    online RL, or context-management methods.'
  - 'Key differences: They diverge in evaluation target (single-step grounding vs
    long-horizon trajectories), interface coverage (click, drag, GUI+CLI, dynamic
    screens), supervision signal (unannotated screenshots, verifiable RL, SFT context
    annotations), and access assumptions (open-weight vs closed-source APIs).'
  - 'Trend evolution: Within 2024–2026, work moves from static click grounding toward
    dynamic, long-horizon, mixed-interface scenarios and adds uncertainty, observation
    control, verifiable synthetic-task RL, and data-efficient training as frontier
    concerns.'
  - 'Open questions: Cross-interface and cross-model transfer, attribution of gains
    to policies versus frameworks or skill libraries, robust uncertainty under shift,
    and scalable supervision for complex multi-step interaction remain unresolved.'
  related_work_outline_zh:
  - 主流方向：证据集中在面向真实复杂计算机使用任务的GUI智能体基准与训练方法，覆盖桌面、移动端、短视频、拖拽以及GUI/CLI混合交互，并在Pass@1之外引入更细粒度评估。
  - 研究共性：研究通常构建任务套件或环境，在具体交互任务上评估基于视觉语言模型的智能体，诊断观察控制不足或子目标差距，并通过弱监督、合成任务、在线强化学习或上下文管理加以改进。
  - 关键差异：差异体现在评测目标（单步定位与长程轨迹）、交互范围（点击、拖拽、GUI/CLI、动态屏幕）、监督信号（未标注截图、可验证在线RL、带上下文标注的SFT）以及模型可访问性假设。
  - 趋势演进：在2024–2026年内，研究从静态点击定位转向动态、长程、混合接口场景，并开始关注不确定性、观察控制、可验证合成任务在线RL和数据高效训练。
  - 开放问题：跨接口和跨模型迁移、收益归因（策略本身还是框架/技能库）、分布偏移下的可靠不确定性，以及复杂多步交互的可扩展监督仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: Real-world GUI task and interaction benchmarking
      what_it_solves: Covers evaluation gaps for desktop, mobile, dynamic short-video,
        drag, and mixed GUI/CLI tasks using fine-grained, cost-aware, or capability-annotated
        metrics.
      what_remains_open: Most suites are platform- or interface-specific; single-step
        grounding evidence is not shown to transfer to multi-step trajectories or
        other model tiers.
    - line: Scalable training and online RL for GUI action prediction
      what_it_solves: Reduces expensive human annotation and improves grounding/action
        success via unannotated screenshots, verifiable synthetic task generation,
        and sample-efficient online RL.
      what_remains_open: Gains are not clearly isolated from task-synthesis quality,
        framework/skill-library effects, or benchmark design; cross-benchmark generalization
        is only partially evidenced.
    - line: Context and observation management for long-horizon agents
      what_it_solves: Makes policies actively compress or manage context and observation
        so dynamic or long-horizon GUI tasks stay tractable.
      what_remains_open: Evidence is limited to particular mobile or short-video settings;
        over-/under-observation and generalization to other dynamic interfaces remain
        unresolved.
    - line: Uncertainty quantification and calibration for GUI grounding
      what_it_solves: Evaluates post-hoc uncertainty methods for single-step executable
        grounding and turns calibrated uncertainty into spatial-safe click regions.
      what_remains_open: Ranking transfer across model classes and interfaces is weak;
        multi-step trajectories, training-based UQ, and distribution-shift robustness
        are not covered.
    - line: Video-guided keyframe extraction for agent-task grounding
      what_it_solves: Bridges video understanding and GUI task execution by selecting
        task-relevant and scene-aware keyframes for VLM-based agents.
      what_remains_open: Reported improvements are mainly on selected VideoQA and
        GUI benchmarks; generalization to real dynamic GUI workflows is not established.
    consensus:
    - Multiple studies evaluate VLM-based GUI agents on realistic or simulated environments
      and report that fine-grained diagnostics reveal capability gaps hidden by aggregate
      success rates.
    - Current agents generally remain below human-level performance on dynamic screens
      or long-horizon tasks, often due to observation control and context management
      failures.
    - GUI-specific training or fine-tuning, whether from unannotated screenshots,
      synthetic verifiable tasks, or context-annotated trajectories, improves downstream
      grounding and action execution.
    - Evaluation is moving toward mixed interaction modes and multi-checkpoint/cost-aware
      metrics rather than single click accuracy alone.
    disagreements:
    - 'Interaction and evaluation scope: one line targets single-step executable grounding,
      while others target drag, GUI+CLI, dynamic short-video, or long-horizon mobile
      trajectories.'
    - 'Supervision strategy: weakly supervised grounding from unannotated screenshots
      contrasts with verifiable online RL, SFT with context-management annotations,
      and direct dataset fine-tuning.'
    - 'Deployment assumptions: open-weight methods expose internal states for uncertainty
      estimation, whereas closed-source API evaluation restricts usable uncertainty
      signals.'
    - 'Primary success criterion: studies optimize different objectives, including
      pass@1, cost-accuracy, sub-goal completion, drag-task success, and uncertainty-calibrated
      spatial safety.'
    - 'Attribution emphasis: some evidence attributes gains primarily to external
      components such as skill libraries or task generation, while others emphasize
      learned policy behavior.'
    open_questions:
    - How well do GUI-agent training and evaluation findings transfer across platforms,
      interaction types, and model tiers without target-specific revalidation?
    - Can observation control and context management be integrated with action prediction
      to reduce over-/under-observation on dynamic interfaces?
    - What portion of reported gains comes from the learned policy versus verifiable
      task synthesis, framework design, skill libraries, or benchmark choices?
    - Can post-hoc uncertainty calibration remain valid under distribution shift,
      cross-interface mismatch, and multi-step GUI trajectories?
    - What minimal annotation or synthetic-data recipe yields robust long-horizon
      grounding across click, drag, GUI+CLI, and dynamic screen interactions?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 真实GUI任务与交互基准测试
      解决的问题: 覆盖桌面、移动端、动态短视频、拖拽和GUI/CLI混合任务的评估缺口，使用细粒度、成本感知或能力注释指标。
      尚未覆盖: 多数套件局限于特定平台或接口；单步定位证据尚未证明可迁移到多步轨迹或其他模型层级。
    - 路线: 面向GUI动作预测的可扩展训练与在线强化学习
      解决的问题: 通过未标注截图、可验证合成任务生成和样本高效在线强化学习，减少昂贵人工标注并改善定位与动作执行。
      尚未覆盖: 收益尚未与任务合成质量、框架/技能库效应或基准设计清晰隔离；跨基准泛化仅有部分证据。
    - 路线: 长程智能体的上下文与观察管理
      解决的问题: 让策略主动压缩或管理上下文和观察，使动态或长程GUI任务保持可处理。
      尚未覆盖: 证据集中在特定移动端或短视频设置；观察过度/不足及其到其他动态接口的泛化仍待解决。
    - 路线: GUI定位的不确定性量化与校准
      解决的问题: 评估单步可执行定位的后验不确定性方法，并把校准后的不确定性转化为空间安全的点击区域。
      尚未覆盖: 跨模型层级和接口的排序迁移较弱；多步轨迹、基于训练的不确定性方法及分布偏移鲁棒性尚未覆盖。
    - 路线: 面向智能体任务的视频引导关键帧提取
      解决的问题: 通过选择任务相关且场景感知的关键帧，桥接视频理解与GUI任务执行，供VLM智能体使用。
      尚未覆盖: 报告改进主要集中在选定的VideoQA和GUI基准上；在真实动态GUI工作流中的泛化尚未确立。
    共识:
    - 多项研究在真实或仿真环境中评估基于视觉语言模型的GUI智能体，并发现细粒度诊断能揭示总体成功率无法反映的能力差距。
    - 当前智能体在动态屏幕或长程任务上通常仍低于人类水平，常见原因是观察控制与上下文管理不足。
    - 无论采用未标注截图、可验证合成任务，还是带上下文标注的轨迹，GUI特定训练或微调都能改善下游定位与动作执行。
    - 评测从单一点击准确率转向混合交互模式、多检查点或成本感知指标。
    分歧:
    - 交互与评测范围：一条路线针对单步可执行定位，其他路线针对拖拽、GUI/CLI、动态短视频或长程移动轨迹。
    - 监督策略：未标注截图的弱监督定位与可验证在线强化学习、带上下文管理标注的SFT以及直接数据集微调形成对比。
    - 部署假设：开放权重方法可访问内部状态用于不确定性估计，而闭源API评测只能使用受限的不确定性信号。
    - 主要成功标准：不同工作优化不同目标，包括Pass@1、成本准确性、子目标完成、拖拽任务成功率以及校准后的空间安全性。
    - 归因重点：部分证据将收益主要归于技能库或任务生成等外部组件，另一些则强调学习到的策略行为。
    开放问题:
    - GUI智能体训练和评测结论在平台、交互类型和模型层级之间的迁移，是否需要目标特定的重新验证？
    - 能否将观察控制与上下文管理同动作预测联合学习，以减少动态接口上的观察过度或不足？
    - 报告收益中多少来自学习到的策略，多少来自可验证任务合成、框架设计、技能库或基准选择？
    - 后验不确定性校准在分布偏移、跨接口不匹配和多步GUI轨迹下是否仍然有效？
    - 何种最小标注或合成数据配方能在点击、拖拽、GUI/CLI和动态屏幕交互中产生稳健的长程定位能力？
