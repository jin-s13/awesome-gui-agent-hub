    with growing attention to agent reliability and data efficiency.'
  - 'Open questions: Can uncertainty quantification be integrated into closed-loop
    agent decisions to enable safe fallback? How well do synthetic-task-trained agents
    generalize to real-world distribution shifts? Can proactive context management
    combine with uncertainty awareness for robust long-horizon tasks?'
  related_work_outline_zh:
  - 主流方向：构建真实、细粒度的GUI代理基准测试与方法，处理长时域、动态和多模态交互，同时强调可靠性和效率。
  - 研究共性：所有工作都在真实任务上提出或评估代理，交互类型丰富，诊断超越最终任务成功的模型弱点，并通过额外上下文、技能或不确定性信号增强代理。
  - 关键差异：基准测试聚焦不同的交互模式（点击、拖拽、动态内容）和评测维度（任务完成、信息效率、不确定性校准）；方法在训练范式（在线RL、弱监督、技能库注入）和上下文管理上存在分歧。
  - 趋势演进：在2026年前沿，社区正从静态纯点击评估转向动态、多步和跨应用设置，并越来越关注代理可靠性和数据效率。
  - 开放问题：不确定性量化能否集成到闭环代理决策中，实现安全回退？合成任务训练的代理在真实世界分布外任务上的泛化如何？主动上下文管理能否与不确定性感知结合，以实现稳健的长时域任务？
  literature_review:
    line_of_work_matrix:
    - line: Real-world GUI agent benchmarks with fine-grained evaluation
      what_it_solves: Provide diverse tasks across real applications, multi-step interactions,
        and metrics beyond Pass@1 to capture sub-goal completion and observation efficiency.
      what_remains_open: Benchmarks are platform-specific; limited coverage of dynamic,
        drag-based, and long-horizon tasks; no unified evaluation of agent reliability
        in deployment.
    - line: Multimodal skill libraries and tool augmentation
      what_it_solves: Enhance agent capability by injecting hierarchical, visually-rich
        skill artifacts that improve UI element grounding and state verification.
      what_remains_open: Skill construction requires human authoring and live exploration;
        cross-application skill transfer and maintenance remain unverified.
    - line: Scalable training with verifiable task synthesis and weak supervision
      what_it_solves: Reduce human annotation cost by generating tasks via RL-driven
        synthesis or leveraging unlabeled screenshots, and improve sample efficiency
        during online RL.
      what_remains_open: Gap between synthetic and real-world tasks; weak supervision
        signal quality may introduce bias; generalizability to unseen applications
        is not fully tested.
    - line: Proactive context management for long-horizon agents
      what_it_solves: Treat context management as a first-class action to maintain
        compact, structured history, preventing information loss in multi-step tasks.
      what_remains_open: Context management strategies are trained on specific datasets;
        robustness to out-of-distribution scenarios and task complexity is unclear.
    - line: Post-hoc uncertainty quantification for GUI grounding
      what_it_solves: Quantify model confidence in element selection to support safe
        fallback and spatial calibration, without retraining.
      what_remains_open: UQ ranking transfer across model tiers and interfaces is
        weak; not yet integrated into closed-loop agent decision-making; conformal
        coverage degrades under distribution shift.
    consensus:
    - Current GUI agents underperform humans on realistic, dynamic, and multi-step
      tasks, requiring richer evaluation dimensions beyond final success rate.
    - Extra information beyond raw screen pixels and action history, such as skill
      artifacts, structured context, or uncertainty estimates, consistently improves
      agent performance.
    - Fine-grained diagnostic metrics (sub-goal completion, cost-accuracy, calibration)
      reveal hidden weaknesses that single-score Pass@1 masks.
    disagreements:
    - 'Evaluation focuses diverge: some work prioritizes information efficiency or
      observation control, while others target drag interaction coverage or uncertainty
      calibration, leading to incompatible metric suites.'
    - 'Training paradigms differ: online RL with verifiable task synthesis (ScaleCUA)
      is contrasted with weak supervision from unlabeled screenshots (GUICrafter)
      and pure in-context skill injection (VISUALSKILL), with no consensus on the
      most data-efficient approach.'
    - 'Interaction modality coverage is fragmented: click, drag, and dynamic-content
      benchmarks are developed in isolation, leaving cross-modal agent behavior uncharacterized.'
    open_questions:
    - How can post-hoc uncertainty quantification be embedded into the decision loop
      of a multi-step GUI agent to trigger safe fallback actions?
    - To what extent do agents trained on synthetic tasks generalize to real-world
      distribution shifts, and what failure modes emerge?
    - Can proactive context management be combined with uncertainty awareness to let
      agents self-assess when accumulated history is sufficient for task completion?
    - Are there unified evaluation protocols that cover click, drag, and dynamic interactions
      while measuring both task success and safety?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 真实环境GUI代理细粒度基准测试
      解决的问题: 提供跨真实应用、多步交互的多样化任务，以及超越Pass@1的指标，以捕捉子目标完成度和观察效率。
      尚未覆盖: 基准测试平台特定；动态、拖拽和长时域任务的覆盖有限；缺少对代理部署可靠性的统一评估。
    - 路线: 多模态技能库与工具增强
      解决的问题: 通过注入层次化、富含视觉的技能工件，提升代理对UI元素的定位和状态验证能力。
      尚未覆盖: 技能构建依赖人工编写与实时探索；跨应用的技能迁移与维护未经验证。
    - 路线: 可验证任务合成与弱监督下的可扩展训练
      解决的问题: 通过RL驱动的任务生成或利用未标注截图来减少人工标注成本，并提高在线RL的样本效率。
      尚未覆盖: 合成任务与真实世界的差距；弱监督信号质量可能引入偏差；对未见应用的泛化未充分测试。
    - 路线: 长时域代理的主动上下文管理
      解决的问题: 将上下文管理视为一级动作，以维护紧凑的结构化历史，防止多步任务中的信息丢失。
      尚未覆盖: 上下文管理策略在特定数据集上训练；对分布外场景和任务复杂度的鲁棒性未知。
    - 路线: GUI基础模型的后验不确定性量化
      解决的问题: 在不重新训练的情况下，量化模型对元素选择的置信度，以支持安全回退和空间校准。
      尚未覆盖: UQ排名跨模型层和接口的迁移性弱；尚未集成到闭环代理决策中；共形覆盖度在分布偏移下退化。
    共识:
    - 当前GUI代理在真实、动态、多步任务上的表现显著低于人类，需要超越最终成功率的更丰富评估维度。
    - 除原始屏幕像素和动作历史之外的额外信息（如技能工件、结构化上下文或不确定性估计）能持续提升代理性能。
    - 细粒度诊断指标（子目标完成度、成本-准确率、校准度）揭示了单一Pass@1分数掩盖的隐藏弱点。
    分歧:
    - 评估目标分歧：部分工作侧重信息效率或观察控制，另一些则聚焦拖拽交互覆盖或不确定性校准，导致指标套件不兼容。
    - 训练范式分歧：可验证任务合成的在线RL（ScaleCUA）与利用未标注截图的弱监督（GUICrafter）以及纯上下文技能注入（VISUALSKILL）形成对比，数据效率最优方案尚无共识。
    - 交互模态覆盖碎片化：点击、拖拽和动态内容基准测试各自独立开发，导致跨模态代理行为未被刻画。
    开放问题:
    - 如何将后验不确定性量化嵌入多步GUI代理的决策循环，以触发安全回退动作？
    - 合成任务训练的代理在真实世界分布偏移下的泛化程度如何，会出现哪些失效模式？
    - 主动上下文管理能否与不确定性感知结合，使代理自行评估累积历史是否足够完成任务？
    - 是否存在统一的评估协议，能同时覆盖点击、拖拽和动态交互，并兼顾任务成功与安全性？
