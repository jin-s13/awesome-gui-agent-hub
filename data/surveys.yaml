  related_work_outline_zh:
  - 主流方向：当前前沿集中在可执行的GUI/计算机使用基准，评估真实桌面、浏览器或容器任务，重点从单步定位转向多步工作流。
  - 研究共性：论文常将新任务或环境与细粒度指标及代理改进结合；视觉定位、子目标过程信号和基准验证反复出现。
  - 关键差异：在平台与动态性、监督策略、指标重点和评测目标上不同，如单步不确定性、多步任务成功或视频引导任务。
  - 趋势演进：在2024-2026前沿内，评估从静态定位转向动态、多模态、可验证任务，指标从Pass@1扩展到代价、观察和不确定性。
  - 开放问题：跨平台迁移、指标与决策对齐、多步不确定性、可复现稳定性，以及动态观察控制覆盖仍是缺口。
  literature_review:
    line_of_work_matrix:
    - line: Realistic GUI task and environment benchmarking
      what_it_solves: Creates executable multi-app desktop, dynamic browser, and video-guided
        tasks so computer-use agents can be compared beyond static single-step grounding.
      what_remains_open: Coverage remains platform-specific, dynamic-interface coverage
        is partial, and many benchmark papers omit detailed limitation or artifact
        evidence; transfer across settings is not established.
    - line: Fine-grained metrics, stress tests, and uncertainty evaluation
      what_it_solves: Measures sub-goal completion, observation/cost efficiency, and
        post-hoc uncertainty or conformal safety to expose failure modes hidden by
        Pass@1.
      what_remains_open: Proxy metrics are not yet tied to downstream user decisions,
        uncertainty transfer weakens across model tiers/interfaces, and evaluation
        often remains single-step rather than trajectory-level.
    - line: Agent improvement through skills, data, RL, and harness optimization
      what_it_solves: Uses multimodal skill libraries, weak supervision from unannotated
        screenshots, verifiable RL task synthesis, and frozen-model harness editing
        to raise GUI agent performance.
      what_remains_open: Evidence for generalization and stability across frameworks/compute
        is limited; limitation sections and sometimes exact artifacts are missing,
        making reproducibility a verification gap.
    consensus:
    - The frontier is shifting from static image grounding to executable multi-step
      GUI workflows on real or simulated desktops, browsers, and video-based tasks.
    - Visual grounding and multimodal visual artifacts are central to identifying
      UI elements and verifying workflow state.
    - Fine-grained process signals reveal model differences that aggregate task success
      hides.
    - Benchmark-based verification is shared, but reproducibility evidence is uneven
      because limitation and artifact sections are often absent or incomplete.
    disagreements:
    - Evaluation target ranges from single-step uncertainty grounding to multi-step
      task success to video-guided interactive tasks.
    - Interaction mode differs between relatively structured desktop applications
      and living-screen/dynamic interfaces where content changes between actions.
    - Supervision strategy differs among weak supervision from unannotated screenshots,
      verifiable online RL task synthesis, and frozen-model execution-harness optimization.
    - 'Metrics differ in emphasis: cost-accuracy observation efficiency, sub-goal
      checkpoint completion, and conformal uncertainty coverage.'
    - Deployment setting differs across macOS desktop, browser-based short-video platforms,
      and containerized OS tasks.
    open_questions:
    - Do reported GUI benchmark results transfer across platforms, interface dynamics,
      and open-weight versus closed-source model tiers?
    - How can fine-grained metrics be linked to user-facing reliability and decision
      quality rather than only task completion?
    - How should uncertainty quantification extend from single-step grounding to multi-step
      agent trajectories under distribution shift?
    - Are performance gains stable across frameworks, compute budgets, and implementations
      when code, data, or limitation details are unavailable?
    - How can benchmarks cover dynamic observation-control failures without becoming
      too platform-specific or expensive?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 真实GUI任务与环境基准构建
      解决的问题: 构建可执行的多应用桌面、动态浏览器和视频引导任务，使计算机使用代理在静态单步定位之外可比较。
      尚未覆盖: 覆盖仍受平台限制，动态界面覆盖不完整，多数论文未给出详细局限或工件证据，跨设置迁移未建立。
    - 路线: 细粒度指标、压力测试与不确定性评估
      解决的问题: 衡量子目标完成、观察/代价效率以及后验不确定性或共形安全，揭示Pass@1遗漏的失败模式。
      尚未覆盖: 代理指标尚未与用户下游决策关联，不确定性迁移跨模型层级/接口变弱，评估常停留在单步而非轨迹级。
    - 路线: 通过技能、数据、RL与执行框架优化的代理改进
      解决的问题: 利用多模态技能库、未标注截图弱监督、可验证RL任务合成和冻结模型执行框架编辑提升GUI代理表现。
      尚未覆盖: 跨框架和算力预算的泛化与稳定性证据有限；局限性章节常缺失，可复现性仍是验证缺口。
    共识:
    - 前沿正在从静态图像定位转向真实或模拟桌面、浏览器和视频任务上的可执行多步GUI工作流。
    - 视觉定位与多模态视觉工件对识别UI元素和验证工作流状态至关重要。
    - 细粒度过程信号能揭示总成功率掩盖的模型差异。
    - 基于基准的验证是共同路径，但可复现证据不均衡，局限与工件信息常缺失。
    分歧:
    - 评测目标不同：从单步不确定性定位，到多步任务成功，再到视频引导交互任务。
    - 交互模式不同：结构化桌面应用与内容随动作变化的动态屏幕之间存在差异。
    - 监督策略不同：未标注截图弱监督、可验证在线RL任务合成，以及冻结模型执行框架优化各有侧重。
    - 指标重点不同：成本-准确性观察效率、子目标检查点完成度与共形不确定性覆盖。
    - 部署设置不同：macOS桌面、浏览器短视频平台和容器化OS任务各有边界。
    开放问题:
    - 当前GUI基准结果能否跨平台、跨接口动态以及开源与闭源模型层级迁移？
    - 如何将细粒度指标与用户侧可靠性和决策质量连接，而不只衡量任务完成？
    - 不确定性量化如何从单步定位扩展到分布偏移下的多步代理轨迹？
    - 在代码、数据或局限性信息缺失时，性能提升是否在框架、算力和实现间稳定？
    - 基准如何覆盖动态观察控制失败，同时避免过于平台特定或成本过高？
