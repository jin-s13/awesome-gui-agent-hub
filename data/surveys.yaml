  related_work_outline:
  - 'Mainstream direction: Real-world GUI/OS automation benchmarks and agent evaluation
    dominate, with task suites such as MacAgentBench, LivingScreen, and Argus comparing
    agents under fine-grained or risk-aware metrics.'
  - 'Shared research pattern: Papers build task sets or environments, evaluate frozen
    or trained agents, use rule-based or compound metrics, and analyze failure modes
    including observation control and uncertainty.'
  - 'Key differences: Static desktop/macOS tasks versus dynamic short-video interfaces;
    single-step GUI grounding versus multi-step trajectories; frozen-model skill/harness
    changes versus online RL/weak supervision; aggregate scores versus cost-accuracy,
    sub-goal, and uncertainty metrics.'
  - 'Trend evolution: Within the 2024-2026 frontier, work is shifting from basic GUI
    task evaluation toward real-world OS/desktop and dynamic interfaces, fine-grained
    scoring, verifiable RL task synthesis, and uncertainty-aware benchmarking.'
  - 'Open questions: Coverage of dynamic and multi-step deployment settings, metric
    alignment with user risk, cross-model/cross-interface uncertainty transfer, stability
    of benchmark gains, and reproducibility gaps from missing limitations or artifacts
    remain open.'
  related_work_outline_zh:
  - 主流方向：真实 GUI/OS 自动化基准与代理评测为主，典型如 MacAgentBench、LivingScreen、Argus，强调细粒度或风险感知指标。
  - 研究共性：构建任务或环境，评估冻结或训练后的代理，采用规则或复合指标，分析观察控制、不确定性等失败模式。
  - 关键差异：静态桌面/动态界面、单步 grounding/多步轨迹、冻结技能或 harness 改进/在线 RL 或弱监督、总分/成本准确性/子目标与不确定性指标。
  - 趋势演进：2024-2026 前沿显示从基础 GUI 评测转向真实 OS、动态界面、细粒度评分、可验证 RL 任务合成和不确定性基准。
  - 开放问题：动态多步部署覆盖、指标与真实风险对齐、跨模型跨界面不确定性迁移、基准收益稳定性，以及缺失局限与工件带来的复现缺口。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and environment design
      what_it_solves: Creates shared task suites and environments for comparing GUI
        agents on real desktop, dynamic short-video, and video-guided interactive
        workflows; examples include MacAgentBench, LivingScreen, and VG-GUIBench.
      what_remains_open: Coverage of diverse dynamic interfaces, multi-step trajectories,
        cross-platform transfer, and whether curated tasks match real deployment distributions
        remain under-evidenced.
    - line: Metric and stress-test design
      what_it_solves: Probes agent behavior beyond aggregate success using fine-grained
        multi-checkpoint scoring, cost-accuracy/observation control, sub-goal completion,
        and post-hoc uncertainty/conformal evaluation, as in Argus.
      what_remains_open: Alignment between proxy metrics and downstream user decisions,
        stability across model tiers and interfaces, and robustness under distribution
        shift remain open.
    - line: Agent capability methods validated on benchmarks
      what_it_solves: Improves computer-use agents through multimodal skill libraries,
        evidence-driven harness edits, verifiable online RL task synthesis, weakly
        supervised grounding, or task-aware keyframe extraction, with gains reported
        on shared suites such as OSWorld, ScienceBoard, CUA-World, and OSExpert-Eval.
      what_remains_open: Whether reported benchmark lifts transfer to held-out suites
        and deployment settings, the cost-benefit of training versus frozen-model
        adaptation, and missing limitation/artifact details are verification gaps.
    - line: Comparable baselines and reporting
      what_it_solves: Makes results more auditable by reporting common baselines,
        framework/model comparisons, and artifact signals such as code, dataset, and
        repository availability.
      what_remains_open: Stability of benchmark conclusions across implementations
        and compute budgets is not directly established; several top papers lack visible
        limitations or artifact access, leaving reproducibility partly unverified.
    consensus:
    - Rule-based or deterministic evaluation is widely used to make GUI/OS benchmark
      judgments reproducible; fine-grained checkpoints expose differences that aggregate
      Pass@1 can hide.
    - Current agents share recurring failure modes in dynamic or long-horizon interaction,
      especially over- and under-observation and weak uncertainty calibration.
    - Frozen-model or data-efficient improvements such as skills, harness edits, and
      weak supervision can deliver sizable benchmark gains without retraining the
      entire model.
    - Code and dataset availability is common, but several works leave limitations
      blank or artifact details partial, so evidence quality is uneven.
    disagreements:
    - 'Evaluation target: single-step executable GUI grounding is treated separately
      from multi-step computer-use trajectories, limiting comparability.'
    - 'Interface setting: static desktop/application workflows differ from dynamic
      short-video or video-guided tasks where observation control is central.'
    - 'Improvement pathway: training-based methods such as online RL and weak supervision
      are contrasted with frozen-model skill or harness adaptation.'
    - 'Metrics: aggregate success, cost-accuracy, sub-goal completion, and uncertainty/conformal
      ranking represent different evaluation priorities and can rank agents differently.'
    open_questions:
    - Do current benchmark task distributions cover dynamic, long-horizon, cross-platform
      workflows where GUI agents are expected to operate?
    - Which fine-grained or risk-aware metrics best align with deployment decisions,
      and under what conditions do they diverge from Pass@1?
    - Can uncertainty rankings and conformal coverage transfer across model classes,
      interfaces, and distribution shifts without target-specific re-evaluation?
    - How stable are reported gains from skill libraries, harness optimization, or
      RL across held-out benchmarks, frameworks, and compute budgets?
    - What are the missing reproducibility and limitation details across the current
      evidence, and do they conceal boundary conditions for the reported results?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 真实 GUI/OS 任务与环境设计
      解决的问题: 构建共享任务或环境，比较真实桌面、短视频动态界面和视频引导交互中的 GUI 代理；例如 MacAgentBench、LivingScreen、VG-GUIBench。
      尚未覆盖: 动态界面类型、多步轨迹、跨平台迁移以及任务分布与真实部署的一致性仍缺少证据。
    - 路线: 指标与压力测试设计
      解决的问题: 通过多检查点评分、成本-准确性/观察控制、子目标完成度以及后验不确定性/共形评估，揭示总分以外的能力。
      尚未覆盖: 代理指标与用户决策风险是否一致，跨模型层级/界面是否稳定，分布偏移下是否鲁棒。
    - 路线: 面向共享基准的代理能力方法
      解决的问题: 通过多模态技能库、证据驱动 harness 编辑、可验证在线 RL 任务合成、弱监督视觉定位或任务感知关键帧提取提升代理能力，并在 OSWorld、ScienceBoard、CUA-World
        等基准上验证。
      尚未覆盖: 基准提升能否迁移到保留集和部署环境；训练与冻结模型适配的成本收益；部分论文缺少局限或工件细节。
    - 路线: 可比基线与报告规范
      解决的问题: 通过统一基线、框架/模型比较和代码、数据集、仓库等工件信号提升结果可审计性。
      尚未覆盖: 结论在不同实现和算力预算下是否稳定；若干论文局限字段为空或工件不完整，复现性仍有缺口。
    共识:
    - 规则或确定性评估常用于提升基准可复现性；细粒度检查点能揭示总分掩盖的代理差异。
    - 当前代理在动态或长程交互中表现出过度观察、观察不足和不确定性校准弱等共性失败模式。
    - 技能库、harness 编辑、弱监督等冻结模型或数据高效方法可在不重训整模型的情况下获得明显基准提升。
    - 代码与数据集发布较常见，但部分论文未提供可见局限，证据质量不均衡。
    分歧:
    - 评测目标：单步可执行 GUI grounding 与多步计算机使用轨迹被分别处理，难以直接比较。
    - 界面设置：静态桌面/应用工作流不同于短视频或视频引导任务，后者更依赖观察控制。
    - 改进路径：在线 RL、弱监督等训练方法与冻结模型的技能/harness 适配形成不同路线。
    - 指标：总分、成本-准确性、子目标完成度、不确定性/共形排序代表不同优先级，可能产生不同排名。
    开放问题:
    - 当前基准任务分布是否覆盖 GUI 代理预期工作的动态、长程和跨平台场景？
    - 哪些细粒度或风险感知指标更贴近真实部署决策，并在什么条件下与 Pass@1 偏离？
    - 不确定性排序和共形覆盖能否跨模型类别、接口和分布偏移迁移，而不需目标特定重排序？
    - 技能库、harness 优化或 RL 的收益在保留集、框架和算力预算下是否稳定？
    - 当前证据中缺失的复现与局限细节是否隐藏了结果边界？
