  - 主流方向：研究重心正转向端到端可训练的GUI代理系统，直接从截图操作，利用强化学习或弱监督减少对昂贵人工标注的依赖，并集成可扩展的基础设施进行回滚、训练和评估。
  - 研究共性：所有工作都依赖纯视觉输入（截图）和键盘/鼠标动作，构建基于强化学习或课程学习的训练流水线，并以多步任务成功率为核心评估指标；许多论文发布开源框架或工件以降低复现门槛。
  - 关键差异：监督信号选择明显不同——GUICrafter 利用未标注截图的弱监督，OpenWebRL 和 OpenForgeRL 使用在线多轮强化学习，而 Qwen-CUA
    结合可验证奖励与迭代微调。记忆表示也存在分歧：VISUALSKILL 保留带视觉图形的多模态技能工件，AGMem 存储动作接地图像裁剪，Qwen-CUA 将视觉历史压缩为固定大小块。评估目标从离线步骤级诊断推理（Desktop-Delta
    Bench）到在线端到端任务成功率和安全性攻击（Domain-Conditioned Safety）。
  - 趋势演进：在 2024–2026 前沿窗口内，系统已从静态基准和单步操作转向在真实网站和桌面上的动态多轮在线学习，同时对安全性、失败模式分析以及技能库和视觉记忆等工件角色日益关注。
  - 开放问题：（1）如何改善强化学习训练后的错误恢复能力，即使在先进框架中这一能力仍然薄弱。（2）安全加固是否能跨域泛化，鉴于浏览器安全模型在编码任务上失败。（3）当大多数基准是离线且缺乏异步时序时，如何评估实时交互动态。（4）当前框架能否在团队、数据集和基础设施环境之间独立复现，因为许多工件缺少代码或完全复现信号。
  literature_review:
    line_of_work_matrix:
    - line: Runnable pipelines and deployment stacks
      what_it_solves: Turning model ideas into end-to-end workflows for training,
        inference, rollout, and evaluation of GUI agents, often by orchestrating containers,
        proxies, and RL codebases to handle stateful, multi-process harnesses.
      what_remains_open: Error recovery remains weak after training; harness design
        heavily influences trainability; independent reproduction across teams, datasets,
        and infrastructure environments is not yet demonstrated.
    - line: Artifacts and reproducible engineering
      what_it_solves: Making agent internals inspectable and reusable through code,
        skill libraries, memory frameworks, and benchmarks that expose failure modes
        or safety gaps.
      what_remains_open: Many artifacts lack full code or dataset releases; benchmarks
        are often offline and cannot capture real-time dynamics; safety evaluations
        are domain-conditioned and do not generalize across application types.
    consensus:
    - Visual-only input (screenshots) is sufficient and preferred for GUI agents,
      displacing DOM or accessibility metadata in many designs.
    - Reinforcement learning and weak supervision can drastically reduce the amount
      of human-annotated data needed for competitive agent performance.
    - Multi-turn, online interaction with live environments is essential for training
      agents that generalize beyond static datasets.
    - Standardized benchmarks (OSWorld, Online-Mind2Web, etc.) are necessary for comparing
      agents, but they miss critical dimensions such as temporal reasoning and safety.
    - Skill memory and visual context management improve task success, but naive full-image
      memory can harm action-level performance.
    disagreements:
    - 'Supervision strategy: weak supervision from unannotated screenshots vs. online
      multi-turn RL vs. verifiable reward with iterative fine-tuning.'
    - 'Memory representation: multimodal skill artifacts with visual figures vs. action-grounded
      image crops vs. compressed fixed-size visual history blocks.'
    - 'Evaluation target: offline step-level diagnostic reasoning (ordering, state
      verification) vs. online end-to-end task success and safety attack success rate.'
    - 'Safety assessment scope: browser-based prompt injection vs. coding-domain skill
      injection, with evidence that hardening is domain-conditioned and not universal.'
    - 'Deployment environment: local desktop setups vs. containerized Kubernetes orchestrators
      vs. cloud-based rollout fleets, affecting scalability and reproducibility.'
    open_questions:
    - Why does error recovery remain weak even after RL training in state-of-the-art
      frameworks, and which architectural changes can improve it?
    - Can safety hardening be made domain-agnostic, given that browser-safe models
      fall to skill-injection on coding tasks?
    - How can offline benchmarks be extended to capture asynchronous timing, delays,
      and real-time dynamics of live GUI interactions?
    - What is the minimum required infrastructure and annotation budget to independently
      reproduce the strongest reported results on a new domain or operating system?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 可运行流水线与部署栈
      解决的问题: 将模型想法转化为覆盖训练、推理、回滚和评估的端到端工作流，通常通过编排容器、代理和强化学习代码库来处理有状态、多进程的推理框架。
      尚未覆盖: 训练后错误恢复能力仍然薄弱；框架设计对可训练性影响显著；跨团队、数据集和基础设施环境的独立复现尚未得到验证。
    - 路线: 工件与可复现工程
      解决的问题: 通过代码、技能库、记忆框架和暴露失败模式或安全差距的基准，使代理内部可检查、可复用。
      尚未覆盖: 许多工件缺少完整代码或数据集发布；基准通常是离线的，无法捕捉实时动态；安全评估是领域条件的，不能在应用类型之间泛化。
    共识:
    - 纯视觉输入（截图）对 GUI 代理是足够且更受欢迎的，在许多设计中取代了 DOM 或可访问性元数据。
    - 强化学习和弱监督可以大幅减少达到竞争性能所需的人工标注数据量。
    - 与真实环境的多轮在线交互对于训练超越静态数据集的代理至关重要。
    - 标准化基准（如 OSWorld、Online-Mind2Web）是代理比较的必要条件，但它们遗漏了时序推理和安全性等关键维度。
    - 技能记忆和视觉上下文管理能提升任务成功率，但朴素的全局图像记忆可能损害动作级性能。
    分歧:
    - 监督策略：基于未标注截图的弱监督 vs. 在线多轮强化学习 vs. 结合可验证奖励的迭代微调。
    - 记忆表示：带视觉图形的多模态技能工件 vs. 动作接地图像裁剪 vs. 压缩的固定大小视觉历史块。
    - 评估目标：离线步骤级诊断推理（排序、状态验证） vs. 在线端到端任务成功率和安全攻击成功率。
    - 安全评估范围：基于浏览器的提示注入 vs. 编码领域的技能注入，证据表明安全加固是领域条件的，不具有普遍性。
    - 部署环境：本地桌面设置 vs. 容器化 Kubernetes 编排器 vs. 基于云端的回滚集群，影响可扩展性和可复现性。
    开放问题:
    - 为什么即使在最先进框架中经过强化学习训练后，错误恢复能力仍然薄弱，哪些架构改进可以改善这一点？
    - 能否使安全加固与领域无关，鉴于浏览器安全模型在编码任务上对技能注入失败？
    - 如何扩展离线基准以捕捉实时 GUI 交互中的异步时序、延迟和动态变化？
    - 在新领域或操作系统上独立复现最强报告结果所需的最少基础设施和标注预算是多少？
