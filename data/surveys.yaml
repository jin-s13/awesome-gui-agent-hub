  literature_review:
    line_of_work_matrix:
    - line: Desktop multi-application benchmark and native agent training
      what_it_solves: Measures and improves end-to-end computer-use success across
        real OS applications, including GUI and CLI actions and verifiable environment
        states.
      what_remains_open: Cross-platform transfer, explicit limitations, real-world
        safety, and reproducibility signals remain incompletely evidenced.
    - line: Multimodal skill and procedure reuse for computer-use agents
      what_it_solves: Improves task success and repeated-task efficiency by storing,
        retrieving, or replaying successful expert procedures as visual/text skills
        or state-machine programs.
      what_remains_open: Transfer across applications or interface shifts, recovery
        from dynamic changes, and long-term library maintenance are unresolved.
    - line: Dynamic and video-guided GUI evaluation and observation control
      what_it_solves: Covers interfaces where visual context changes between actions
        and video gives task grounding, scoring task accuracy jointly with information
        efficiency.
      what_remains_open: Observation control is lacking; benchmarks are limited to
        specific platform types and do not yet establish generalization to all dynamic
        interfaces.
    - line: Grounded action datasets for underrepresented interaction types
      what_it_solves: Creates training and evaluation data for drag-based GUI interactions
        beyond click-focused benchmarks, enabling fine-tuning for grounded manipulation.
      what_remains_open: Whether drag grounding transfers to downstream computer-use
        tasks and whether artifacts/data are fully available remains a verification
        gap.
    - line: Alternative vision-language model training and action-space integration
      what_it_solves: Trains GUI agents with non-autoregressive diffusion generation
        or unified GUI/code action spaces to improve grounding, navigation, and desktop
        task completion.
      what_remains_open: Scalability, broader baseline comparison, cross-platform
        validation, and coordination between heterogeneous action types remain only
        partially shown.
    consensus:
    - Application-focused GUI agent research is shifting toward fine-grained, verifiable
      evaluations rather than single success-rate only, including sub-goal checkpoints,
      executable final states, and information-cost metrics.
    - Memory or skill reuse improves agent performance and repeated-task efficiency
      beyond just scaling model prompts; text-only retained knowledge is often less
      effective than retaining visual or procedural artifacts.
    - Current agents still lag human-level performance on dynamic or multi-application
      tasks, with observation control and GUI/code coordination identified as central
      weaknesses.
    disagreements:
    - One line compiles successful trajectories into executable state-machine programs
      for fast replay, while another retrieves hierarchical visual-text skill files
      on demand; these differ in representation, execution, and how they handle novelty.
    - 'Action-space choices differ: some work focuses on GUI grounding actions only,
      while another unifies GUI actions with code execution and trains the agent end-to-end
      for both.'
    - 'Evaluation settings differ substantially: real desktop OS tasks, dynamic short-video
