  related_work_outline:
  - 'Mainstream direction: Current work centers on making GUI agents more realistic
    and robust: desktop OS tasks, dynamic short-video interfaces, GUI+CLI workflows,
    drag interactions, video-guided tasks, and uncertainty-aware grounding. Evaluation
    is moving past static click-only success rates toward granular sub-goal, cost-accuracy,
    and spatial confidence signals.'
  - 'Shared research pattern: Many methods improve frozen or data-limited backbone
    models by changing supervision, observation, or execution context rather than
    full retraining—weak labels from unannotated screenshots, verifiable synthetic
    RL tasks, keyframe selection, harness edits, or post-hoc uncertainty calibration.'
  - 'Key differences: Papers update different system components: benchmark design,
    pretraining or RL data, keyframe extraction, executable harness, drag fine-tuning,
    or uncertainty calibration. Evaluation targets differ across task completion,
    information efficiency, single-step grounding, video-guided behavior, and calibration
    under distribution shift.'
  - 'Trend evolution: The visible top evidence is concentrated in 2026, so the trend
    belongs to the current frontier: from click-heavy static benchmarks toward dynamic,
    multi-app, multi-action, and verifiable environments, with growing emphasis on
    data and training efficiency and self-improvement without model retraining.'
  - 'Open questions: Contributions are not always isolated from skill libraries, harnesses,
    or task generators; cross-benchmark transfer and observation control remain weak;
    uncertainty coverage degrades under shift; many visible abstracts omit limitations
    and ablation details, leaving verification gaps.'
  related_work_outline_zh:
  - 主流方向：当前工作聚焦更真实、更动态的GUI智能体，包括真实macOS桌面、短视频动态界面、GUI+CLI流程、拖拽交互、视频引导任务和不确定性校准；评测从静态点击成功率转向细粒度子目标、信息效率和空间置信度。
  - 研究共性：在冻结或数据受限的主干模型上，通过改变监督、观察或执行上下文来提升能力，例如未标注截图弱监督、可验证合成任务、关键帧选择、执行harness编辑和事后不确定性量化，而非完全重训模型。
  - 关键差异：不同工作更新不同组件：基准设计、预训练或RL数据、关键帧提取、执行harness、拖拽微调或UQ校准；评测目标涵盖任务完成、信息效率、单步定位、视频引导行为和分布偏移下的校准。
  - 趋势演进：可见top证据集中在2026年，趋势属于当前前沿：从点击为主的静态基准走向动态、多应用、多动作和可验证环境，同时更强调数据与训练效率以及不重训模型的自改进。
  - 开放问题：方法贡献尚未与技能库、harness或任务生成器充分分离；跨基准迁移和观察控制仍弱；UQ覆盖在分布偏移下下降；多篇摘要缺少局限性与消融细节，形成验证缺口。
  literature_review:
    line_of_work_matrix:
    - line: Realistic and dynamic GUI evaluation
      what_it_solves: Captures agent competence beyond static click-only interfaces
        via macOS desktop, dynamic short-video, GUI+CLI, and drag-based task suites
        with granular scoring or cost-accuracy metrics.
      what_remains_open: Transfer of findings across environments remains unclear;
        benchmarks often leave limitation evidence absent or restricted to single
        platforms or interaction types.
    - line: Data-efficient grounding and action training
      what_it_solves: Reduces dependency on costly annotations or expands supervision
        through weak supervision, synthetic verifiable tasks, and drag-specific fine-tuning
        for GUI grounding and action prediction.
      what_remains_open: Cross-benchmark and unseen-app generalization is not fully
        demonstrated; visible evidence only partially separates gains from data scale,
        task generator, and training recipe.
    - line: Execution-harness and self-improvement methods
      what_it_solves: Improves frozen GUI agents by optimizing the executable harness
        through repeated-run evidence and bounded source edits, transferring improvements
        without model retraining.
      what_remains_open: How far harness edits generalize beyond reported computer-use
        suites, and whether gains depend on task family, requires more evidence.
    - line: Observation control and keyframe extraction
      what_it_solves: Addresses dynamic visual input for GUI agents by formalizing
        living-screen interfaces and selecting task-relevant keyframes for video-guided
        tasks.
      what_remains_open: Observation control remains a recognized missing capability;
        keyframe extraction is evaluated partly on VideoQA, leaving end-to-end agent
        trajectory impact open.
    - line: Uncertainty quantification for GUI grounding
      what_it_solves: Benchmarks post-hoc confidence and spatial calibration for single-step
        GUI grounding, identifying stable UQ families and conformal click regions.
      what_remains_open: Multi-step agent deployment and cross-model or cross-interface
        transfer are weak; coverage degrades under calibration-test or interface mismatch.
    consensus:
    - 'Evaluation is becoming finer-grained: granular multi-checkpoint, cost-accuracy,
      and spatial-calibration signals are used because aggregate success alone can
      hide sub-goal or over/under-observation differences.'
    - Several approaches target frozen or data-limited models by improving external
      supervision or execution context instead of full model retraining, and report
      gains on GUI grounding or computer-use suites.
    - Visual observation and grounding are treated as a bottleneck across dynamic
      short-video, video-guided, and drag-based tasks; selection, calibration, or
      fine-tuning are proposed to address it.
    - Method contributions are frequently evaluated on single or few benchmark suites,
      and visible abstracts often omit detailed limitation and ablation evidence,
      so verification is incomplete.
    disagreements:
    - 'Evaluation targets differ: broad desktop task completion on macOS, cost-accuracy
      under dynamic short-video observations, single-step grounding uncertainty, drag
      interactions, and video-guided QA plus GUI tasks each impose different demands.'
    - 'Supervision and update targets differ: weak-label visual grounding plus RL
      calibration, verifiable online RL task synthesis, execution-harness source edits,
      keyframe extraction, or post-hoc uncertainty calibration.'
    - Some methods keep the backbone frozen and modify the harness, while others fine-tune
      the VLM or train an agent policy; this changes what should be credited for observed
      improvements.
    - 'Generalization expectations differ: some work reports cross-benchmark harness
      transfer, while uncertainty and dynamic-interface findings are limited by weak
      cross-model or cross-interface transfer or single-platform coverage.'
    open_questions:
    - How do agent improvements decompose among backbone model, skill library or framework,
      task generation, and execution-harness choices?
    - Can observation control be learned directly, rather than only diagnosed as over/under-observation
      on dynamic video-style interfaces?
    - Does keyframe extraction selected for VideoQA improve end-to-end video-guided
      GUI task success beyond frame-selection metrics?
    - Can post-hoc GUI grounding uncertainty calibration remain reliable across closed-source
      models, unseen interfaces, and multi-step trajectories?
    - What ablation and limitation evidence is missing from the visible abstracts,
      and would that evidence change attribution of reported gains?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 真实与动态GUI评测
      解决的问题: 通过macOS桌面、动态短视频、GUI+CLI和拖拽任务套件，以细粒度评分或成本-准确性指标捕捉超出静态点击界面的代理能力。
      尚未覆盖: 跨环境发现的可迁移性仍不明确；多个基准仅覆盖单一平台或交互类型，且可见局限性证据有限。
    - 路线: 数据高效的定位与动作训练
      解决的问题: 通过未标注截图弱监督、可验证合成任务和拖拽专用微调，降低对昂贵标注的依赖并扩展GUI定位与动作预测监督。
      尚未覆盖: 跨基准和未见应用的泛化未充分证明；可见证据未完全分离数据规模、任务生成器与训练配方的影响。
    - 路线: 执行harness与自改进方法
      解决的问题: 通过重复运行的证据和受限源代码编辑优化执行harness，在冻结主干模型下提升GUI代理，并显示跨基准迁移。
      尚未覆盖: harness编辑在已报告计算机使用套件之外的泛化边界，以及收益是否依赖任务族，仍需更多证据。
    - 路线: 观察控制与关键帧提取
      解决的问题: 形式化动态屏幕原生代理，并通过任务相关键帧选择处理视频引导GUI任务中的动态视觉输入。
      尚未覆盖: 观察控制仍是缺失能力；关键帧提取部分仅在VideoQA上评估，端到端代理轨迹影响尚不明确。
    - 路线: GUI定位的不确定性量化
      解决的问题: 对单步GUI定位的后验置信度和空间校准进行基准测试，识别稳定UQ家族与共形点击区域。
      尚未覆盖: 多步代理场景和跨模型或跨界面迁移较弱；覆盖度在校准-测试或界面不匹配时下降。
    共识:
    - 评测正在变得更细粒度：细粒度多检查点、成本-准确性和空间校准信号被使用，因为单一成功率会掩盖子目标或过度/不足观察差异。
    - 多种方法通过改进外部监督或执行上下文来提升冻结或数据受限模型，并在GUI定位或计算机使用套件上报告收益，而非完全重训模型。
    - 视觉观察与定位被视为动态短视频、视频引导和拖拽任务中的瓶颈；选择、校准或微调被提出来缓解。
    - 方法贡献通常仅在单个或少数基准套件上评估，且可见摘要常缺少局限性与消融细节，验证尚不完整。
    分歧:
    - 评测目标不同：真实macOS桌面任务完成、动态短视频信息效率、单步定位不确定性、拖拽交互、视频引导QA与GUI任务各有侧重。
    - 监督与更新对象不同：弱监督视觉定位加RL校准、可验证在线RL、执行harness编辑、关键帧提取或事后UQ校准互不相同。
    - 一些工作保持骨干冻结并修改harness，另一些微调VLM或策略；这改变了收益归因。
    - 泛化结论不同：有工作报告跨基准harness迁移，而UQ和动态界面发现仍受限于跨模型或跨界面迁移弱或单一平台覆盖。
    开放问题:
    - 智能体提升如何分解到骨干模型、技能库或框架、任务生成器与执行harness选择？
    - 观察控制能否被直接学习，而不是仅在动态视频界面上被发现为过度/不足观察？
    - 为VideoQA选择的关键帧能否提升端到端视频引导GUI任务，而不仅是帧选择指标？
    - 事后GUI定位不确定性校准能否在闭源模型、未见界面和多步轨迹上保持覆盖？
    - 可见摘要缺少哪些消融与局限性证据？这些证据是否会改变已报告收益的归因？
