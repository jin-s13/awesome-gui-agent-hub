  literature_review:
    line_of_work_matrix:
    - line: Real-world GUI task benchmarking
      what_it_solves: Specifies multi-application or dynamic-interface tasks and fine-grained
        metrics to compare agent capabilities beyond task success.
      what_remains_open: Coverage is limited to tested platforms and interaction types;
        trajectory-level safety, cross-platform stability, and formal reliability
        are not established.
    - line: Multimodal skill and harness augmentation
      what_it_solves: Improves frozen or deployed GUI agents by providing visual skill
        artifacts or automatically editing execution harnesses from observed failures.
      what_remains_open: Generalization rests on a few benchmark transfers; assumptions
        about app similarity, backbone compatibility, and harness edit boundaries
        are not fully tested.
    - line: Scalable learning and task synthesis for computer-use agents
      what_it_solves: Reduces dependence on expensive annotations through weak supervision,
        verifiable task generation, and online RL for GUI action policies.
      what_remains_open: Evidence shows benchmark gains, but does not directly validate
        whether synthesized tasks and curricula predict failure coverage or robust
        transfer.
    - line: Uncertainty and failure-mode quantification
      what_it_solves: Measures confidence in GUI grounding and exposes failure modes
        such as over/under-observation or selective UQ ranking transfer.
      what_remains_open: UQ is mostly single-step or platform-specific; cross-model
        and distribution-shift calibration remains weak without target-specific reranking.
    consensus:
    - Fine-grained metrics beyond task success are useful for revealing sub-goal,
      cost-efficiency, or grounding differences among GUI agents.
    - Execution evidence such as screenshots, repeated runs, and interaction primitives
      is treated as central to diagnosing agent capability gaps.
    - Human annotation is viewed as a bottleneck, motivating weak supervision, verifiable
      synthesis, or automated harness/skill improvement.
    - Frontier GUI models still show clear failures in dynamic observation control,
      drag grounding, and calibrated uncertainty transfer.
    disagreements:
    - 'The improvement path differs: some augment frozen models through skill libraries
      or harness edits, while others update model parameters by RL or weak supervision.'
    - 'Evaluation targets differ: deterministic multi-checkpoint task success, cost-accuracy
