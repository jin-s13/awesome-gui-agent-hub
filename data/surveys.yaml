      尚未覆盖: 异构设置下的结果兼容性未解决；模型内迁移可能强，但跨模型、跨接口迁移弱，安全加固呈现领域条件性。
    - 路线: 开放问题与缺口映射
      解决的问题: 把文献覆盖转化为关于可验证奖励、上下文管理、不确定性、欺诈检测和提示注入安全的下一步研究问题。
      尚未覆盖: 缺口的优先级未回答；部分记录缺少可见代码、数据集、基线或局限性，构成验证缺口而非已证实缺失。
    共识:
    - GUI智能体多被构建为MLLM/VLM策略，以界面截图和指令为输入，并以交互基准上的任务成功率为主要评测目标。
    - 评估质量与可靠性被视为一级问题：多项工作通过重复运行、可验证任务、不确定性量化或掩码线索减少虚假成功。
    - 冻结模型适配与自改进是活跃路径：可在不改变某些骨干模型的情况下，通过优化执行框架、上下文、奖励或任务分布提升表现。
    - 跨域泛化被反复检验但未获保证；多数工作会测试分布外任务、界面或领域上的迁移。
    分歧:
    - 优化对象不同：有的在冻结模型下编辑执行框架，有的用在线RL或监督式上下文动作微调策略。
    - 评测目标不同：单步基础、长时域移动/网页/桌面任务、安全攻击成功率、欺诈检测、视频引导任务、不确定性校准各有侧重。
