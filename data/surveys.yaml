    - 'Reliability framing differs: observation control, context compression, and
      post-hoc uncertainty calibration are treated as separate problems with different
      evidence types.'
    open_questions:
    - Can agents trained or tuned on one GUI task family transfer to dynamic, drag-based,
      long-horizon, and multi-app tasks without target-specific re-annotation or re-ranking?
    - What formal task abstraction explains the observed failure modes such as over-observation,
