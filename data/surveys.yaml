  literature_review:
    line_of_work_matrix:
    - line: Real-world GUI task benchmarking across desktop, web, mobile, and dynamic
        interfaces
      what_it_solves: Provides application-specific task suites and metrics for evaluating
        GUI agents on office, mobile, web, desktop, drag, and dynamic short-video
        workflows.
      what_remains_open: Most suites are platform- or interaction-specific; evidence
        of cross-benchmark transfer is limited, and dynamic interfaces expose missing
        observation-control capability.
    - line: Skill, memory, and replay reuse for computer-use workflows
      what_it_solves: Compiles successful runs or stores multimodal per-application
        artifacts so agents can complete repeated tasks faster or with higher accuracy.
      what_remains_open: Unclear how well retrieved skills and state-machine replays
        transfer to unseen applications or adapt when screen states, goals, and task
        variants change.
    - line: Model-level grounding and action generation adaptation
      what_it_solves: Improves GUI element grounding, navigation, and action generation
        through large curated grounding datasets, distillation-to-reinforcement learning,
        or block-wise diffusion architectures.
      what_remains_open: Reported gains concentrate on grounding and navigation benchmarks;
        full closed-loop application impact and real-world deployment evidence remain
        limited.
    - line: Observation encoding for dynamic and video-guided agent tasks
      what_it_solves: Selects task-relevant visual evidence or keyframes for video-guided
        GUI tasks, addressing changing content between actions.
      what_remains_open: Only evaluated on a bounded set of video tasks; whether keyframe
        selection generalizes to live dynamic interfaces and professional software
        is unresolved.
    consensus:
    - Current GUI agents need richer benchmarks that cover real applications, fine-grained
      scoring, and interaction types beyond simple clicking.
    - Reusable skills, compiled replay programs, or improved grounding models can
      raise agent performance over direct unassisted execution.
    - Grounding and observation are central bottlenecks, especially in dynamic interfaces
      where content changes between actions.
    - Existing evaluations suggest models still fall short of human-level performance
      on information-constrained or fine-grained application tasks.
    - Verification gaps remain because several papers lack full code, dataset, baseline,
      and limitation details in the visible evidence.
    disagreements:
    - Evaluation target differs across desktop GUI+CLI workflows, drag-based interactions,
      dynamic short-video interfaces, and video-guided tasks.
    - 'Improvement locus differs: runtime skill retrieval and programmatic replay
      versus model-internal training or architecture replacement.'
    - 'Success metric differs: task success or Pass@1, fine-grained sub-goal completion,
      cost-accuracy, replay speedup, and grounding accuracy are not unified.'
    - 'Interaction mode differs: point or box grounding, drag manipulation, combined
      GUI and command-line actions, and observation control each receive separate
      treatment.'
    - Supervision and training signal differ, including documented plus live-UI skill
      construction, keyframe extraction, supervised fine-tuning followed by reinforcement,
      and diffusion-based generation.
    open_questions:
    - Can fine-grained sub-goal metrics and cost-accuracy measures become comparable
      across heterogeneous application benchmarks?
    - Which skill or replay mechanisms generalize beyond a fixed benchmark or application
      without accumulating stale or faulty programs?
    - Do grounding and navigation improvements transfer to full end-to-end GUI task
      completion in real professional tools?
    - What observation-control and keyframe-selection capabilities are needed for
      dynamic and video-guided interfaces?
    - How do missing code, dataset, and limitation details affect the reproducibility
      of the reported gains?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 面向桌面、网页、移动端和动态界面的真实GUI任务基准
      解决的问题: 提供应用相关的任务套件和指标，用于评测GUI智能体在办公、移动、网页、桌面、拖拽和动态短视频等场景中的表现。
      尚未覆盖: 多数评测套件只覆盖特定平台或交互类型；跨基准迁移证据有限，动态界面暴露出观察控制能力缺口。
    - 路线: 计算机使用工作流中的技能、记忆与重放复用
      解决的问题: 将成功运行编译为状态机程序，或存储多模态应用工件，使智能体在重复任务上更快或更准确地执行。
      尚未覆盖: 检索到的技能和状态机重放能否迁移到未见应用，能否适应屏幕状态、目标和任务变体的变化尚不明确。
    - 路线: 模型层的GUI定位与动作生成适配
      解决的问题: 通过大规模标注数据、蒸馏到强化学习或块级扩散架构，提升GUI元素定位、导航和动作生成能力。
      尚未覆盖: 收益主要集中在定位与导航基准上；完整闭环应用效果和真实部署证据仍然有限。
    - 路线: 面向动态与视频引导任务的观察编码
      解决的问题: 为视频引导的GUI任务选择任务相关的视觉证据或关键帧，以应对动作之间内容不断变化的界面。
      尚未覆盖: 仅在有限的视频任务上评估；关键帧选择能否泛化到实时动态界面和专业软件尚无结论。
    共识:
    - 当前GUI智能体需要覆盖真实应用、细粒度评分以及点击以外交互类型的更丰富基准。
