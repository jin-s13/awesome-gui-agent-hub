  related_work_outline:
  - 'Mainstream direction: The evidence is dominated by building computer-use and
    GUI benchmarks for realistic operating-system, dynamic-interface, drag, video-guided,
    and uncertainty-aware evaluation rather than only static click-based tasks.'
  - 'Shared research pattern: Papers pair a new task suite or dataset with fine-grained,
    cost-aware, or uncertainty-aware metrics, evaluate frontier and open models, then
    expose missing capabilities such as observation control, grounding transfer, or
    interaction coverage.'
  - 'Key differences: Work differs by interaction surface, supervision strategy, and
    evaluation target: deterministic desktop tasks, dynamic short-video, drag manipulation,
    video-guided keyframes, single-step grounding, synthesized verifiable tasks, and
    weak supervision from unannotated screenshots.'
  - 'Trend evolution: The 2024-2026 window is narrow, but the visible frontier is
    moving from aggregate GUI success rates toward specialized interaction benchmarks,
    multimodal skill artifacts, synthesized verifiable training, and metrics beyond
    Pass@1.'
  - 'Open questions: Cross-interface and cross-model transfer remains unclear; observation
    control on dynamic content is unresolved; proxy metrics still need alignment with
    downstream user decisions, and reproducibility evidence is incomplete for several
    records.'
  related_work_outline_zh:
  - 主流方向：证据集中在构建真实操作系统、动态界面、拖拽、视频引导和不确定性感知的计算机使用与GUI基准，而非仅评估静态点击任务。
  - 研究共性：论文通常将新任务套件或数据集与细粒度、成本感知或不确定性感知指标结合，评估前沿和开源模型，并揭示观察控制、定位迁移或交互覆盖等能力缺口。
  - 关键差异：工作因交互表面、监督策略和评测目标而异，包括确定性桌面任务、动态短视频、拖拽操作、视频引导关键帧、单步定位、可验证合成任务和未标注截图弱监督。
  - 趋势演进：2024-2026窗口较窄，但可见前沿正从总体GUI成功率转向专门交互基准、多模态技能工件、可验证合成训练以及超越总体Pass@1的指标。
  - 开放问题：跨界面和跨模型迁移仍不明确；动态内容上的观察控制尚未解决；代理指标与下游用户决策的一致性仍缺乏证据，部分记录的可复现性也不完整。
  literature_review:
    line_of_work_matrix:
    - line: Benchmark task and dataset design
      what_it_solves: Creates shared GUI/computer-use tasks for macOS desktop workflows,
        dynamic short-video interfaces, drag interactions, and video-guided actions
        so agent capabilities can be compared on realistic interaction surfaces.
      what_remains_open: Coverage is still skewed to selected apps and platforms;
        dynamic and non-click interactions are only partially sampled; cross-platform
        and unseen-app generalization is not established.
    - line: Metric and stress-test design
      what_it_solves: Goes beyond aggregate success by adding fine-grained sub-goal
        scoring, cost-accuracy measures for observation efficiency, and uncertainty-quantification
        benchmarks with conformal spatial safety checks.
      what_remains_open: Proxy metrics are not yet aligned with downstream user decisions;
        uncertainty ranking transfer weakens across model tiers and interfaces, and
        evaluation mostly stops at single-step grounding rather than multi-step trajectories.
    - line: Comparable baselines and reporting
      what_it_solves: Makes results auditable through common baselines, artifacts,
        and reporting conventions; recent methods strengthen baselines via verifiable
        task synthesis, unannotated screenshot pretraining plus calibration, multimodal
        skill libraries, and online RL reports on standard benchmarks.
      what_remains_open: Benchmark conclusions may still shift across implementations,
        compute budgets, and closed-source model access; several packet records lack
        full code, dataset, or limitation details, leaving reproducibility unverified.
    consensus:
    - Current GUI agents still fail on realistic computer-use tasks well below human-level
      or near-ceiling performance, especially when tasks require mixed GUI/CLI, dynamic
      observation, or precise manipulation.
    - Aggregate success masks important capability differences; fine-grained sub-goal,
      cost-accuracy, and uncertainty-calibration signals reveal failures that Pass@1
      alone would hide.
    - 'Training or retrieval support matters as much as base model choice: skill libraries,
      task synthesis, weak supervision, or fine-tuning improve results over no-support
      baselines.'
    disagreements:
    - 'Evaluation slices differ: some work targets deterministic desktop task completion,
      while others isolate single-step grounding, drag manipulation, short-video observation,
      or video-guided keyframe use, making cross-benchmark comparisons weak.'
    - 'Supervision assumptions conflict: one line uses large unannotated screenshot
      corpora with minimal labels, another synthesizes verifiable tasks in controlled
      containers, and some rely on human-authored or environment-defined tasks.'
    - 'Metric priorities differ: some optimize Pass@1 or benchmark score, others optimize
      cost-accuracy or uncertainty coverage; the field has not agreed on a unified
      utility metric.'
    open_questions:
    - How well do current GUI benchmark rankings transfer to unseen apps, operating
      systems, and interaction modes?
    - Can observation control be made an explicit agent capability rather than an
      emergent failure mode on dynamic interfaces?
    - Which supervision or task-synthesis pipeline yields the best cost-to-generalization
      tradeoff without overfitting to container or browser environments?
    - Are uncertainty-calibration and fine-grained sub-goal metrics predictive of
      downstream user success, and do they remain stable under distribution shift?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 基准任务与数据集设计
      解决的问题: 构建共享的GUI/计算机使用任务，覆盖macOS桌面工作流、动态短视频界面、拖拽交互和视频引导动作，使代理能力能在真实交互表面上比较。
      尚未覆盖: 覆盖仍偏向选定应用或平台；动态与非点击交互仅被部分采样；跨平台和未见应用泛化尚未建立。
    - 路线: 指标与压力测试设计
      解决的问题: 在总体成功率之外，增加细粒度子目标评分、观察效率的成本精度指标，以及不确定性量化基准和共形空间安全检查。
      尚未覆盖: 代理指标尚未与下游用户决策对齐；不确定性排名迁移在模型层级和界面间较弱；评估主要停留在单步定位而非多步轨迹。
    - 路线: 可比基线与报告规范
      解决的问题: 通过统一基线、工件和报告规范让结果可审计；近期方法通过可验证任务合成、未标注截图预训练加校准、多模态技能库和在线强化学习在标准基线上增强可比性。
      尚未覆盖: 基准结论可能随实现、算力预算和闭源模型访问而变化；若干记录缺少完整代码、数据集或局限性信息，可复现性仍待验证。
    共识:
    - 当前GUI代理在真实计算机使用任务上仍明显低于人类水平或接近上限，尤其在混合GUI/CLI、动态观察或精确操作场景中失败。
