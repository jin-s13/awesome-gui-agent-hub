  related_work_outline:
  - 'Mainstream direction: Building GUI agents that operate across desktop, mobile,
    and web platforms, with a strong focus on multimodal perception, long-horizon
    task completion, and skill reuse.'
  - 'Shared research pattern: Most works augment vision-language models with external
    knowledge (skill libraries, history critics, compiled programs) or controlled
    benchmarks to improve task success and efficiency.'
  - 'Key differences: Papers diverge on the interaction modality (click vs drag vs
    GUI+CLI), the evaluation setting (real OS vs simulated environment), the use of
    static vs dynamic content, and whether efficiency or safety is the primary optimization
    target.'
  - 'Trend evolution: The 2024–2026 window shows a shift from simple click-based static
    benchmarks toward richer interaction types (drag, video-guided, dynamic content),
    and from pure accuracy metrics to joint optimization of accuracy, latency, and
    safety.'
  - 'Open questions: There is no evidence on cross-platform skill transfer, real-world
    robustness against adversarial interfaces, or how to balance the tension between
    task-specific optimization and generalization to unseen applications.'
  related_work_outline_zh:
  - 主流方向：构建跨桌面、移动和网络平台的GUI代理，重点在于多模态感知、长步骤任务完成和技能复用。
  - 研究共性：多数工作通过外部知识（技能库、历史批判、编译程序）或受控基准来增强视觉-语言模型，以提高任务成功率和效率。
  - 关键差异：论文在交互模态（点击 vs 拖拽 vs GUI+CLI）、评测环境（真实操作系统 vs 模拟环境）、内容动态性（静态 vs 动态）以及优化目标（效率
    vs 安全性）上存在分歧。
  - 趋势演进：2024–2026年窗口显示从简单点击式静态基准转向更丰富的交互类型（拖拽、视频引导、动态内容），从纯准确率指标转向准确率、延迟和安全的联合优化。
  - 开放问题：尚无证据表明跨平台技能迁移、真实世界对抗性界面下的鲁棒性，以及如何平衡任务特定优化与对未知应用的泛化。
  literature_review:
    line_of_work_matrix:
    - line: Multimodal skill libraries for GUI agents
      what_it_solves: Improves task completion in complex applications by providing
        retrievable multimodal documentation (text + figures) that helps agents identify
        UI elements and verify workflow states.
      what_remains_open: Generalization of skill libraries across different applications
        and operating systems, and the cost of automating skill construction without
        human-authored documentation.
    - line: Benchmarks for GUI agent evaluation
      what_it_solves: Creates standardized testbeds to measure agent performance on
        realistic desktop, mobile, and web tasks, covering multi-app workflows, fine-grained
        scoring, and diverse interaction types (click, drag, GUI+CLI).
      what_remains_open: Benchmarks are typically platform-specific; no unified evaluation
        framework exists that can compare agents across different OS and interaction
        modalities, and metrics rarely capture real-world efficiency or safety.
    - line: Dynamic and video-guided interactive agents
      what_it_solves: Enables agents to handle content that changes over time (e.g.,
        short-video platforms) or to follow video instructions, requiring observation
        control and keyframe extraction from video streams.
      what_remains_open: Adaptation to real-time changes and unseen tasks, and the
        robustness of keyframe extraction across video genres with heavy occlusions
        or rapid scene transitions.
    - line: Execution efficiency and reliability optimization
      what_it_solves: Reduces repeated-task latency by compiling successful runs into
        state-machine programs, and improves planning by incorporating history-aware
        critics that intercept flawed actions before execution.
      what_remains_open: Effectiveness on novel, open-domain tasks where no prior
        successful run exists, and the trade-off between the speed of replay-based
        methods and the quality of fully re-inferred plans.
    - line: Security-critical web agents under constrained information
      what_it_solves: Evaluates an agent's ability to detect fraud when reputation
        shortcuts (URLs, domains) are hidden, forcing reasoning solely on webpage
        content and SMS context.
      what_remains_open: Performance when real-world reputation cues are available,
        and generalization to other safety-critical domains such as phishing detection
        outside of the SMS-to-webpage scenario.
    consensus:
    - GUI agents fundamentally rely on multimodal large models that combine visual
      understanding of screenshots with textual instruction following.
    - Long-horizon tasks with multiple sub-goals remain challenging, and error accumulation
      across steps is a primary failure mode.
    - Augmenting agents with external memory, history summaries, or pre-compiled knowledge
      consistently improves performance over purely reactive step-by-step reasoning.
    - Human-level performance on complex, multi-application tasks has not been achieved,
      with the best systems reaching 73.7% Pass@1 (MacAgentBench) under optimal configurations.
    disagreements:
    - 'Evaluation setting: some works use real operating system environments (MacAgentBench)
      while others rely on browser-based simulations (LivingScreen) or static screenshot
      datasets (DragOn), leading to different generalization claims.'
    - 'Interaction granularity: DragOn focuses on drag-based coordinates and grounding,
      while most other benchmarks assume click/tap actions; PreAct further abstracts
      actions into deterministic state transitions, trading interactivity for speed.'
    - 'Optimization target: PreAct and VISUALSKILL target efficiency (speed and skill
      reuse) whereas HiViG and FraudSMSWalker target reliability and safety, creating
      a split between ''faster agents'' and ''safer agents''.'
    - 'Role of external knowledge: VISUALSKILL injects a curated multimodal skill
      library, while HiViG learns a history critic from trajectory data, and PreAct
      compiles past runs into programs—three different philosophies on what to cache
      and how to use it.'
    - 'Dynamic vs static content: LivingScreen formalizes living-screen-native agents
      that must control observation frequency, whereas other benchmarks use static
      screens per step, making it unclear whether improvements transfer to dynamic
      interfaces.'
    open_questions:
    - Can skill libraries or history critics trained on one set of applications (e.g.,
      macOS desktop) transfer to a completely different platform (e.g., Android) without
      retraining?
    - How do GUI agents handle adversarial or deceptive UI elements that are designed
      to mislead both human users and automated agents, as partially explored in fraud
      detection?
    - What is the optimal balance between compile-time efficiency (PreAct) and runtime
      flexibility, especially when tasks have high variability or require novel exploration?
    - There is no evidence in the packet on whether accuracy improvements from multimodal
      skill libraries (VISUALSKILL) or history critics (HiViG) persist when agents
      are deployed in continuously changing, real-world environments.
    - How can evaluation benchmarks be unified to compare agents across drag-based,
      video-guided, and dynamic content tasks without losing the specificity of each
      interaction type?
