  related_work_outline:
  - 'Mainstream direction: The current frontier is moving from static GUI task suites
    toward real desktop/browser and video-dynamic environments with fine-grained,
    cost-aware, or uncertainty-based evaluation.'
  - 'Shared research pattern: Papers couple benchmark or evaluation-harness construction
    with multi-model and multi-framework runs, showing that aggregate Pass@1 hides
    sub-goal, observation, and framework effects.'
  - 'Key differences: They differ in task medium and dynamics, metric emphasis, and
    adaptation strategy; settings include macOS desktop, short-video feeds, video-guided
    tasks, and single-step GUI grounding.'
  - 'Trend evolution: The available top evidence is concentrated in 2026, so the visible
    trend is a narrow frontier shift toward verifiable synthetic tasks, local multimodal
    skill artifacts, and observation-efficiency or uncertainty metrics.'
  - 'Open questions: Cross-platform and dynamic-interface coverage, ranking stability
    under harness choices, and transferability of single-step findings to multi-step
    trajectories remain unresolved.'
  related_work_outline_zh:
  - 主流方向：当前前沿正从静态GUI任务集转向真实桌面/浏览器和视频动态环境，并引入细粒度、成本感知或不确定性评估。
  - 研究共性：多数工作将基准或评估执行框架与多模型、多框架运行结合，表明仅看总体Pass@1会掩盖子目标、观察和框架影响。
  - 关键差异：任务介质与动态性、指标重点和适应策略不同；设置涵盖macOS桌面、短视频信息流、视频引导任务和单步GUI定位。
  - 趋势演进：可用高排序证据集中在2026年，可见趋势是窄前沿向可验证合成任务、局部多模态技能工件和观察效率或不确定性指标演进。
  - 开放问题：跨平台与动态界面覆盖、不同执行框架选择下的排名稳定性，以及单步结论向多步轨迹迁移仍未解决。
  literature_review:
    line_of_work_matrix:
    - line: Real-world desktop and dynamic web task suites
      what_it_solves: Establishes shared GUI/OS automation tasks in actual applications
        and browser environments, including multi-application and continuous-observation
        settings.
      what_remains_open: Platform coverage is still concentrated, dynamic interface
        types are limited, and some top-paper limitation fields are absent, leaving
        coverage boundaries under-specified.
    - line: Fine-grained and stress-test metric design
      what_it_solves: Probes sub-goal completion, observation cost-accuracy, uncertainty
        ranking, and conformal spatial safety beyond aggregate success scores.
      what_remains_open: Uncertainty-ranking transfer across model classes and interfaces
        is weak, and single-step grounding metrics may not cover multi-step agent
        trajectories.
    - line: Scalable task synthesis and weak supervision
      what_it_solves: Reduces annotated GUI task cost through verifiable task generation,
        unannotated screenshot use, and multimodal skill construction.
      what_remains_open: Whether synthetic or weakly labeled task distributions match
        deployment settings, and whether gains are robust without benchmark-specific
        tuning, remains unclear.
    - line: Comparable harness and reporting baselines
      what_it_solves: Makes cross-framework and cross-skill-library model comparisons
        more auditable by exposing execution-harness and artifact effects.
      what_remains_open: Several high-ranked papers lack complete limitation and reproducibility
        details; the extent to which framework choices shift leaderboard conclusions
        is not fully controlled.
    consensus:
    - Faithful application or browser environments provide more information than simplified
      static screens.
    - Aggregate completion metrics are insufficient because fine-grained checkpoints,
      observation cost, or uncertainty metrics reveal differences hidden by pass rates.
    - Current agents still show clear gaps on dynamic or long-horizon computer-use
      tasks, especially in observation control and grounding.
    - Framework, execution-harness, and skill-library choices materially affect measured
      performance and should be reported.
    disagreements:
    - Evaluation targets diverge across static desktop multi-application tasks, dynamic
      short-video feeds, video-guided action, and single-step GUI grounding.
    - Metric emphasis differs among sub-goal completion scoring, cost-accuracy efficiency,
      and uncertainty ranking with conformal spatial safety.
    - 'Adaptation and supervision differ: frozen-model harness optimization, multimodal
      skill libraries, verifiable reinforcement-learning task synthesis, and weakly
      supervised grounding from unannotated screenshots.'
    - 'Generalization claims differ: some evidence supports cross-benchmark harness
      transfer, while other evidence shows ranking transfer weakens without target-specific
      re-evaluation.'
    open_questions:
    - Do benchmark tasks cover the heterogeneous OS, web, and mobile dynamic-interface
      conditions where computer-use agents are deployed?
    - Which fine-grained or cost-aware metrics best track downstream user utility
      and remain stable across model classes and observation interfaces?
    - How much do harness, skill-library, task-generation, and reporting choices shift
      leaderboard conclusions?
    - Can observation-control and uncertainty-quantification findings transfer from
      single-step GUI grounding to multi-step agent trajectories?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 真实桌面与动态网页任务套件
      解决的问题: 在实际应用和浏览器环境中建立共享的GUI/OS自动化任务，覆盖多应用和连续观察设置。
      尚未覆盖: 平台覆盖仍较集中，动态界面类型有限，部分顶层论文缺少局限性字段，覆盖边界说明不足。
    - 路线: 细粒度与压力测试指标设计
      解决的问题: 在总体成功分数之外，检验子目标完成、观察成本-准确性、不确定性排序和共形空间安全。
      尚未覆盖: 不确定性排序跨模型类别和接口迁移较弱，单步定位指标未必覆盖多步智能体轨迹。
    - 路线: 可扩展任务合成与弱监督
      解决的问题: 通过可验证任务生成、未标注截图利用和多模态技能构建降低GUI任务标注成本。
      尚未覆盖: 合成或弱标注任务分布是否匹配部署环境，以及性能是否在没有基准特定调优时仍稳健，仍不明确。
    - 路线: 可比的执行框架与报告基线
      解决的问题: 通过揭示执行框架和工件效应，使跨框架、跨技能库的模型对比更可审计。
      尚未覆盖: 部分高排名论文缺少完整的局限性和复现细节；框架选择在多大程度上改变榜单结论尚未完全控制。
    共识:
    - 真实应用或浏览器环境比简化静态屏幕提供更多信息。
    - 仅看总体完成指标不够，因为细粒度检查点、观察成本或不确定性指标能揭示通过率隐藏的差异。
    - 当前智能体在动态或长期计算机使用任务上仍有明显差距，尤其是观察控制和定位能力。
    - 框架、执行harness和技能库会实质改变测量性能，应当被报告。
    分歧:
    - 评测目标在静态桌面多应用、动态短视频信息流、视频引导动作和单步GUI定位之间存在分歧。
    - 指标重点不同：子目标完成评分、成本-准确性效率、不确定性排序与共形空间安全各有侧重。
    - 适应与监督信号不同：冻结模型harness优化、多模态技能库、可验证强化学习任务合成和未标注截图弱监督并存。
    - 泛化结论不同：一些证据支持跨基准harness迁移，另一些证据显示排名迁移在未做目标特定重评时会变弱。
    开放问题:
    - 基准任务是否覆盖计算机使用智能体部署时面对的异构OS、网页和移动端动态界面条件？
    - 哪些细粒度或成本感知指标最能反映下游用户效用，并在模型类别和观察接口之间保持稳定？
    - harness、技能库、任务生成和报告选择会在多大程度上改变榜单结论？
    - 观察控制与不确定性量化结论能否从单步GUI定位迁移到多步智能体轨迹？
