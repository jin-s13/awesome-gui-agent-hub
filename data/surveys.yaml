    evaluation and capability improvement, using richer task suites and external knowledge
    or harness modifications while keeping vision-language backbones frozen or training
    them with data-efficient or verifiable signals.'
  - 'Shared research pattern: Work formalizes a task or interaction boundary, builds
    a benchmark or artifact, then measures success or fine-grained metrics; gains
    come from sub-goal scoring, multimodal skills, harness evolution, weak supervision,
    or uncertainty calibration.'
  - 'Key differences: Evaluation targets range from static desktop tasks to dynamic
    short-video interfaces and drag interactions; improvement mechanisms include external
    skills, harness edits, online reinforcement learning, weak supervision, and post-hoc
