  related_work_outline:
  - 'Mainstream direction: The research coalesces around rigorous formalization and
    diagnostic benchmarks that uncover specific failure modes of GUI agents, such
    as observation control, uncertainty miscalibration, and neglected interaction
    types like drag, rather than proposing new agent architectures.'
  - 'Shared research pattern: Works define a targeted problem space (dynamic screens,
    drag interactions, UQ), build a dedicated benchmark or dataset, and evaluate a
    wide range of models to reveal systematic weaknesses, with a strong emphasis on
    granular, multi-dimensional metrics.'
  - 'Key differences: Some focus on single-step grounding (e.g., UQ) while others
    span long-horizon tasks; evaluation settings range from desktop to mobile to video
    platforms; and metrics vary from Pass@1 to cost-accuracy, sub-goal completion,
    and selective ranking transferability.'
  - 'Trend evolution: From 2024 to 2026, the frontier shifts from broadly assessing
    GUI task success to fine-grained capability diagnosis, reliability/safety framing
    (UQ), and weakly-supervised or RL-based scaling methods that reduce annotation
    cost, all within a single wave of recent work.'
  - 'Open questions: Whether formalized failure modes transfer across platforms and
    models; how to achieve observation control in dynamic interfaces; and whether
    the proposed taxonomies and UQ methods alter agent design rather than only benchmarking.'
  related_work_outline_zh:
  - 主流方向：研究围绕严格的形式化定义和诊断性基准展开，揭示 GUI 代理的具体失效模式（如观察控制、不确定性校准失误、拖拽等被忽视的交互类型），而非提出新架构。
  - 研究共性：多数工作先界定一个明确的问题空间（动态屏幕、拖拽交互、UQ），构建专用基准或数据集，并评估大量模型以暴露系统性弱点，普遍采用细粒度多维指标。
  - 关键差异：有的聚焦单步基础能力（如 UQ），有的面向长程任务；评估环境从桌面到移动端再到短视频平台；指标从 Pass@1 到成本-准确性、子目标完成度、选择性排名迁移等各异。
  - 趋势演进：2024–2026 年间，前沿从粗粒度 GUI 任务成功转向细粒度能力诊断、可靠性/安全性框架（UQ），以及降低标注成本的弱监督与基于 RL 的规模化方法，整体处于同一波近期工作中。
  - 开放问题：形式化失效模式能否跨平台和跨模型迁移；如何在动态界面中实现观察控制；所提出的分类体系和 UQ 方法是否真的改变了代理设计，而非仅停留在评测层面。
  literature_review:
    line_of_work_matrix:
    - line: Formal definitions and assumptions
      what_it_solves: Clarifies what constitutes a valid GUI agent problem setting
        by formalizing concepts such as living-screen-native agents, observation control,
        and post-hoc uncertainty quantification, and by specifying the assumptions
        under which these definitions hold.
      what_remains_open: Whether the formal conditions (e.g., dynamic content change
        rates, calibration/test distribution matching) align with empirical agent
        behavior in realistic, unconstrained usage, and whether the diagnosed failure
        modes generalize across platforms and model families.
    - line: Conceptual taxonomy and boundaries
      what_it_solves: Organizes fragmented GUI interaction phenomena into structured
        categories—drag action types, UQ method families, task tiers, and capability
        dimensions—to enable systematic diagnosis and comparison of agent limitations.
      what_remains_open: The taxonomies remain descriptive; there is no evidence that
        they directly guide the design of new agents or training procedures, and their
        coverage of emerging interaction modalities (e.g., multimodal skill artifacts)
        is incomplete.
    - line: Scaling laws and guarantees
      what_it_solves: Connects model/data scaling and training efficiency methods
        (weak supervision, verifiable task synthesis, online RL with frontier sampling)
        to improved agent performance on established benchmarks.
      what_remains_open: Direct validation that the claimed scaling benefits (e.g.,
        data reduction, training speedup) reliably predict failures, transfers, and
        safety margins across diverse environments, and that the efficiency gains
        are not specific to the chosen benchmarks.
    consensus:
    - Current GUI agents exhibit systematic weaknesses that generic success-rate metrics
      fail to capture, motivating fine-grained diagnostic metrics.
    - Expanding the scope of interaction types beyond click/tap to include drag, dynamic
      content, and multimodal skill use is necessary for realistic evaluation.
    - Uncertainty awareness and reliability are emerging as critical dimensions, but
      existing post-hoc UQ methods show limited cross-model transferability.
    - Large-scale annotation remains a bottleneck; weakly supervised, RL-based, and
      skill-library approaches are converging as viable strategies to reduce reliance
      on expensive human demonstrations.
    disagreements:
    - 'Contrasting evaluation targets: some works benchmark single-step grounding
      accuracy, while others assess long-horizon task completion, leading to different
      views on what constitutes a capable agent.'
    - 'Representation of context: passive history accumulation versus proactive context
      management as explicit actions, highlighting a disagreement on how agents should
      handle long trajectories.'
    - 'Mode of supervision: some methods rely on minimal annotated data with weak
      supervision to match fully supervised counterparts, while others scale up verifiable
      RL without human annotations, reflecting different assumptions on data quality
      and task verifiability.'
    open_questions:
    - How can observation control be embedded into agent policies to prevent over-
      and under-observation in dynamic interfaces?
    - To what extent do UQ rankings and failure-mode diagnoses transfer across different
      model families and interface platforms without re-evaluation?
    - Can the proposed taxonomies and formal definitions be operationalized as design
      constraints or reward signals that actively improve agent robustness, rather
      than serving only as post-hoc analysis tools?
    - Do the scaling strategies that work on specific benchmarks (e.g., OSWorld, ScienceBoard)
      maintain their efficiency and performance guarantees when deployed in open-ended,
      real-world computer use scenarios?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 形式化定义与假设
      解决的问题: 通过形式化“动态屏幕原生代理”、“观察控制”、“后验不确定性量化”等概念，明确 GUI 代理问题设定的边界，并指定这些定义成立的假设条件。
      尚未覆盖: 形式化条件（如动态内容变化率、校准/测试分布匹配）是否与真实场景下的经验行为一致，以及所诊断的失效模式能否跨平台、跨模型家族泛化。
    - 路线: 概念分类与边界
      解决的问题: 将碎片化的 GUI 交互现象组织为结构化类别——拖拽动作类型、UQ 方法族、任务层级、能力维度——以实现系统性的能力诊断和比较。
      尚未覆盖: 这些分类目前仍停留在描述层面，缺乏证据表明它们能直接指导新代理或训练过程的设计，且对新兴交互模态（如多模态技能工件）的覆盖不完整。
    - 路线: 缩放规律与保证
      解决的问题: 通过弱监督、可验证任务合成、在线 RL 与前沿采样等方法，将模型/数据规模化和训练效率提升与已有基准上的性能改进联系起来。
      尚未覆盖: 所声称的规模化收益（如数据减少、训练加速）能否可靠预测跨环境的失败、迁移和安全裕度，以及效率提升是否仅限于所选基准，缺乏直接验证。
    共识:
    - 当前 GUI 代理存在系统性弱点，通用成功率指标无法揭示这些弱点，因此需要细粒度诊断指标。
    - 将交互类型从点击/轻触扩展到拖拽、动态内容和多模态技能使用，对于真实评估不可或缺。
    - 不确定性感知与可靠性正成为关键维度，但现有的后验 UQ 方法跨模型迁移性有限。
    - 大规模标注仍是瓶颈；弱监督、基于 RL 的方法和技能库等策略逐渐汇聚为减少对昂贵人工示范依赖的可行路径。
    分歧:
    - 评测目标分歧：部分工作评估单步基础准确性，另一些则评估长程任务完成情况，导致对何为“能干”的代理有不同定义。
    - 上下文表示方式分歧：被动累积历史与将上下文管理作为显式动作的主动管理，反映了在长轨迹处理策略上的不同选择。
    - 监督模式分歧：一些方法仅用极少标注数据配合弱监督即可匹敌全监督方法，另一些则通过可验证 RL 扩展而不依赖人工标注，体现了对数据质量和任务可验证性的不同假设。
    开放问题:
    - 如何将观察控制能力嵌入代理策略，以防止动态界面中的过度观察和观察不足？
    - UQ 排名和失效模式诊断在不同模型家族和界面平台间的迁移程度如何，是否需要重新评估？
    - 所提出的分类体系和形式化定义能否转化为设计约束或奖励信号，以主动提升代理鲁棒性，而不仅仅作为事后分析工具？
    - 在特定基准（如 OSWorld、ScienceBoard）上有效的规模化策略，在开放式的真实计算机使用场景中是否仍能保持其效率和性能保证？
