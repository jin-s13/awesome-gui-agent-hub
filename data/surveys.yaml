    - 路线: 面向冻结代理的外部技能与执行框架适配
      解决的问题: 通过检索多模态技能工件或根据观测到的动作-结果证据优化执行框架，提升冻结骨干模型。
      尚未覆盖: 学习到的框架编辑或技能库在操作系统、应用和评测协议间的迁移仅得到部分验证。
    - 路线: 弱监督与可验证训练数据规模化
      解决的问题: 通过未标注截图或可验证合成任务生成，结合高效在线 RL 或课程校准，降低对昂贵标注的依赖。
      尚未覆盖: 结果集中在 OSWorld 和 ScienceBoard 等特定套件；泄漏、验证器多样性及套件外表现仍未解决。
    - 路线: GUI grounding 的后验不确定性量化与校准
      解决的问题: 评测 GUI 元素定位中 UQ 方法的排序稳定性，并评估共形点击区域作为空间安全机制。
      尚未覆盖: 证据仅限单步，跨模型和跨界面 UQ 迁移弱，校准-测试或界面偏移下共形覆盖度会下降。
    共识:
    - GUI 代理评测正在从最终成功率转向细粒度完成度、能力和效率指标。
    - 冻结或预训练的视觉-语言模型可以通过外部工件、执行框架修改或定向训练数据生成得到提升。
    - 基准需要覆盖静态点击序列之外的交互方式，包括拖拽、GUI+CLI 和内容变化的界面。
    - 基于证据的评测以及可验证或基于规则的任务检查正成为衡量代理行为的核心。
    分歧:
    - 介入点不同：仅评测形式化、外部技能/执行框架适配、训练期弱监督或 RL、后验不确定性校准。
    - 评测范围不同：单步 GUI grounding 与多步轨迹，部分工作明确限于可执行单步设置，另一些面向完整工作流。
    - 交互覆盖不同：点击导向的任务假设与拖拽、GUI+CLI、动态屏幕界面并存。
    - 数据假设不同：人工设计基准任务、海量未标注截图、规模化可验证合成任务之间存在明显差异。
