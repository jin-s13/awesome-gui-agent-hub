    - line: Reusable computer-use knowledge and repeated-task speedup
      what_it_solves: Improves agent performance or execution cost by storing multimodal
        per-application skills or compiling successful runs into replayed state-machine
        programs with runtime screen checks.
      what_remains_open: Generalization to unseen applications and workflows, fallback
        behavior under interface drift, and evaluation breadth are not fully established.
    - line: Specialized interaction grounding and task-driven observation
      what_it_solves: Addresses drag-based GUI operations and video-guided tasks through
        large interaction datasets or task-relevant keyframe extraction from dynamic
        visual input.
      what_remains_open: 'Downstream GUI-specific transfer evidence is partial: keyframe
        gains are reported mainly on VideoQA, and drag fine-tuning is verified mainly
        on one VLM.'
    - line: Scalable real-web environment reconstruction
      what_it_solves: Builds reusable source-grounded web environments from real URLs
        for evaluating and fine-tuning web agents across many sites and task categories.
      what_remains_open: Requires per-site setup and authorization; transfer to broader
        professional web/software workflows and long-term environment maintenance
        remain open.
    consensus:
    - Application evaluation is shifting from coarse task success to fine-grained
      signals such as sub-goal completion, capability annotations, cost-accuracy,
      and replay/store-time verification.
    - 'GUI tasks need broader interface coverage: desktop GUI+CLI, drag manipulation,
      dynamic feeds, video-guided workflows, and real-web environments rather than
      static click-only settings.'
    - Frontier agents still fall short on dynamic or observation-demanding tasks,
      with observation control and long-tail interaction grounding remaining weak.
    - Artifacts such as skill libraries, interaction datasets, state-machine programs,
      and reconstructed environments can improve downstream agent performance or efficiency.
    disagreements:
    - 'Evaluation targets differ: one line scores real macOS desktop tasks, another
      cost-accuracy on dynamic short-video feeds, another drag-only interactions,
      another video-guided GUI tasks, and another webpage environment fidelity.'
    - 'Improvement mechanisms differ: external per-application skills, vision-language
      pretraining/fine-tuning, diffusion generation, runtime compilation into state
      machines, task-driven keyframe extraction, or automatic environment construction.'
    - 'Success metrics differ: Pass@1, sub-goal completion, cost-accuracy, replay
      speedup, store-time task retention, and downstream benchmark lifts are not directly
      comparable.'
    - 'Deployment assumptions differ: some methods assume a live agent with per-step
      model calls and fallback, while others compile runs into programs without per-step
      language model calls, creating different latency and adaptability trade-offs.'
    open_questions:
    - What mechanisms can give GUI agents explicit observation control so they neither
      over-observe nor under-observe continuously updating interfaces?
    - How well do skill libraries, drag datasets, replayed programs, keyframe extraction,
      and reconstructed web environments transfer across applications, platforms,
      languages, and professional software?
    - Are fine-grained benchmark metrics such as cost-accuracy and sub-goal completion
      aligned with real office automation and software-operation productivity?
    - Several packet entries omit limitation details and show variable artifact/reproducibility
      signals; what failure modes and robustness boundaries remain unverified?
    - Can gains from specialized training, such as drag fine-tuning or video keyframe
      training, be reproduced on downstream computer-use tasks beyond the evaluated
      VLM and benchmarks?
