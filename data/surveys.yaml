  related_work_outline_zh:
  - 主流方向：为GUI智能体能力构建形式化评估框架和分类体系，重点关注可靠性、不确定性量化和动态交互属性。
  - 研究共性：多数工作提出一个新的基准或数据集，用于隔离某项特定智能体能力（如拖拽、不确定性、长时域上下文、动态界面），然后评估当前前沿模型在该基准上的表现，揭示系统性差距。
  - 关键差异：工作之间的差异在于针对的交互模态（点击 vs. 拖拽 vs. CLI vs. 动态屏幕）和形式化的智能体可靠性维度（任务完成 vs. 不确定性校准
    vs. 上下文管理 vs. 观察效率）。
  - 趋势演进：所有证据均来自2026年，显示当前前沿正从静态任务成功率转向更丰富的智能体评估维度，包括成本效率、不确定性和主动控制。
  - 开放问题：提出的形式化条件和分类体系是否改变下游模型设计或训练；不确定性排名迁移是否在部署分布下保持；以及如何弥合基准特定发现与通用智能体安全保障之间的差距。
  literature_review:
    line_of_work_matrix:
    - line: Formalizing agent interaction domains and evaluation protocols
      what_it_solves: Provides precise definitions of novel GUI interaction types
        (drag, dynamic screen, long-horizon) and corresponding metrics, enabling systematic
        comparison of agent capabilities beyond simple task success.
      what_remains_open: The formalizations are tied to specific benchmarks; it is
        unclear whether the defined properties (e.g., observation control, proactive
        context management) transfer to real-world deployment or influence model architecture
        design.
    - line: Uncertainty quantification and reliability benchmarking for GUI agents
      what_it_solves: Characterizes the trustworthiness of agent actions via post-hoc
        uncertainty methods, revealing that within-model ranking is stable but cross-model
        transfer is weak, and that conformal prediction can provide spatial safety
        guarantees.
      what_remains_open: The analysis is limited to single-step grounding; there is
        no evidence that UQ rankings or conformal guarantees hold for multi-step trajectories
        or under distribution shift, which is critical for safety-critical deployment.
    - line: Scaling and sample-efficient training of GUI agents via RL and weak supervision
      what_it_solves: Demonstrates that online RL with verifiable task synthesis and
        weak supervision from unannotated screenshots can achieve state-of-the-art
        performance with fewer annotations, addressing data scarcity and training
        efficiency.
      what_remains_open: The scaling laws connecting model size, data, and RL objectives
        to expected behavior are not formally derived; the observed improvements are
        empirical and lack guarantees on failure prediction or transfer across platforms.
    consensus:
    - 'Current GUI agents lack reliability in nuanced interaction dimensions: they
      fail to control observation frequency, quantify uncertainty, and manage long-horizon
      context without explicit mechanisms.'
    - A benchmark-driven approach is the dominant methodology for surfacing agent
      limitations; each benchmark isolates a specific formal property (e.g., cost-accuracy
      trade-off, uncertainty ranking, drag grounding) and shows that frontier models
      perform poorly on that dimension.
    - Introducing structured representations (hierarchical skill libraries, context
      fields, uncertainty scores) consistently improves performance over unstructured
      baselines, indicating that current end-to-end models lack innate organization
      for complex GUI tasks.
    disagreements:
    - 'The primary interaction primitives studied differ: click-based grounding (Argus)
      vs. drag-based actions (DragOn) vs. dynamic UI observation (LivingScreen) vs.
      multi-modal skill retrieval (VISUALSKILL), leading to incompatible evaluation
      criteria.'
    - Some works aim to improve agents through post-hoc calibration (uncertainty quantification)
      while others focus on changing the training regime (online RL, weak supervision),
      implying different assumptions about whether current models are fundamentally
      limited or just undertrained.
    - 'The role of context management is treated differently: MemGUI-Agent makes context
      actions a first-class policy output, whereas others treat context as passive
      input history, revealing a disagreement on whether context management should
      be learned or architecturally imposed.'
    open_questions:
    - Can the formal properties and taxonomies proposed by these benchmarks be operationalized
      as training objectives or architecture constraints, rather than just evaluation
      metrics?
    - How do uncertainty calibration and observation control interact in multi-step
      agent trajectories, and do improvements in one dimension degrade the other?
    - Under what distribution shifts do the uncertainty ranking transfers and conformal
      coverage guarantees break down, and what re-calibration strategies are needed
      for safe deployment?
