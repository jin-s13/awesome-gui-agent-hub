  literature_review:
    line_of_work_matrix:
    - line: Controlled evaluation and gap mapping
      what_it_solves: Turns GUI-agent claims into measurable failure modes for grounding,
        safety, fraud detection, uncertainty, and reproducibility through controlled
        benchmarks and audit protocols.
      what_remains_open: Each benchmark isolates a narrow setting; cross-interface,
        cross-model, and cross-attack transfer is often weak, and no sampled evidence
        provides systematic priority ranking across gaps.
    - line: Dense supervision and verifiable task synthesis
      what_it_solves: Addresses data and task scarcity for training computer-use agents
        using controlled desktop environments, dense element annotations, large-scale
        synthetic corpora, and verifiable RL task generation.
      what_remains_open: Transfer from synthetic or controlled environments to unseen
        real-world applications and long-horizon reliability is only partially demonstrated;
        distribution shift and application-state coverage remain unresolved.
    - line: Harness, context, and policy optimization
      what_it_solves: Improves frozen or small models by optimizing the executable
        harness, managing long-horizon context proactively, or allocating rollouts
        efficiently instead of retraining full backbones.
      what_remains_open: Evidence is concentrated on OSWorld, ScienceBoard, mobile,
        and related benchmarks; broader cross-benchmark generalization and failure
        boundaries need more independent verification.
    - line: Video-guided task grounding
      what_it_solves: Bridges video understanding and GUI-agent actions by extracting
        task-relevant keyframes and evaluating MLLM-based agents on video-guided interactive
        tasks.
      what_remains_open: Keyframe benefits are shown on video QA and GUI task benchmarks,
        but integration with multi-step agent trajectories and broader GUI environments
        is not established.
    - line: Survey, taxonomy, and roadmap synthesis
      what_it_solves: Expected to map fragmented GUI-agent research into directions,
        milestones, and research gaps; the topic points here, but the top sampled
        evidence does not surface survey or roadmap papers.
      what_remains_open: Whether the synthesis is backed by systematic evidence, defined
        inclusion criteria, and prioritized gaps cannot be verified from the bounded
        packet.
    consensus:
    - There is convergence on treating GUI-agent evaluation as task completion or
      failure-mode measurement in controlled environments.
    - Multiple works improve pretrained agents through supervision, context, harness,
      or rollout changes rather than only scaling model size.
    - Safety, uncertainty, and reproducibility are emerging as first-class evaluation
      concerns, not auxiliary checks.
    - Benchmark-specific metrics such as task success, grounding accuracy, attack
      success rate, and ranking stability are standard, with held-out or transfer
      tests used to probe generalization.
    disagreements:
    - 'Evaluation target differs: some work measures single-step grounding or uncertainty
      calibration, while other work measures long-horizon task completion, fraud judgment,
      or safety attack success.'
    - 'Supervision mode differs: dense environment annotations, verifiable RL task
      synthesis, repeated-run harness edits, and human-authored attack templates emphasize
      different failure signals.'
    - 'Interaction surface differs: desktop, mobile, web, SMS-to-webpage, coding,
      and video-guided tasks imply different observation and action spaces.'
    - 'Generalization claims differ: some papers report cross-benchmark transfer,
      while others report weak transfer across model tiers or domains and recommend
      target-specific revalidation.'
    - 'Reproducibility evidence differs: some papers provide code, dataset, or artifact
      signals; others provide only paper-level evidence and lack limitation details,
      making verification gaps harder to compare.'
    open_questions:
    - Which benchmark-specific improvements transfer to real-world GUI workflows beyond
      the tested desktop, mobile, web, coding, SMS, and video-guided settings?
    - How should survey and taxonomy work prioritize gaps among grounding, long-horizon
      memory, safety, uncertainty, and data synthesis without systematic coverage
      evidence?
    - Under what conditions do uncertainty rankings or safety hardening transfer across
      model tiers and interface domains?
    - Can dense synthetic supervision or verifiable task synthesis maintain benefit
      under distribution shift and unseen application-state variation?
    - What missing code, dataset, metric, baseline, and limitation details currently
      hide reproducibility gaps in the visible frontier?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 受控评测与缺口映射
      解决的问题: 通过受控基准和审计协议，把GUI智能体声明转化为可测量的失败模式，覆盖定位、安全、欺诈检测、不确定性和可复现性。
      尚未覆盖: 各基准只隔离狭窄设置；跨界面、跨模型和跨攻击迁移往往较弱，采样证据也未提供跨缺口的系统优先级排序。
    - 路线: 密集监督与可验证任务合成
      解决的问题: 利用受控桌面环境、密集元素标注、大规模合成语料和可验证RL任务生成，缓解计算机使用智能体的数据与任务稀缺问题。
      尚未覆盖: 从合成或受控环境到未见真实应用和长程可靠性的迁移只得到部分验证；分布偏移和应用状态覆盖仍未解决。
    - 路线: Harness、上下文与策略优化
      解决的问题: 通过优化执行harness、主动管理长程上下文或高效分配rollouts，在不重新训练完整骨干模型的情况下改进冻结或小模型表现。
      尚未覆盖: 证据集中于OSWorld、ScienceBoard、移动端等基准；更广泛的跨基准泛化与失败边界仍需独立验证。
    - 路线: 视频引导任务定位
      解决的问题: 通过抽取任务相关关键帧并在视频引导交互任务上评估MLLM智能体，桥接视频理解与GUI动作。
      尚未覆盖: 关键帧收益在视频问答和GUI任务基准上有体现，但与多步智能体轨迹及更广泛GUI环境的整合尚不明确。
    - 路线: 综述、分类与路线图综合
      解决的问题: 预期把碎片化的GUI智能体研究整理为方向、里程碑和研究缺口；主题指向此处，但顶层采样证据未出现综述或路线图论文。
      尚未覆盖: 综合是否有系统证据支撑、是否定义纳入标准以及如何优先排序缺口，无法从当前证据包验证。
    共识:
    - 研究趋于一致地把GUI智能体评测视为受控环境中的任务完成或失败模式测量。
    - 多项工作通过监督、上下文、harness或rollout变化改进预训练智能体，而非仅扩大模型规模。
    - 安全、不确定性和可复现性正在成为一级评测关注点，而不是辅助检查。
    - 任务成功率、定位精度、攻击成功率和排名稳定性等基准特定指标成为标准，并用留出或迁移测试检验泛化能力。
    分歧:
    - 评测目标不同：有些工作测量单步定位或不确定性校准，有些测量长程任务完成、欺诈判断或安全攻击成功率。
    - 监督模式不同：密集环境标注、可验证RL任务合成、重复运行harness编辑和人工攻击模板强调不同失败信号。
    - 交互表面不同：桌面、移动、网页、短信到网页、编码和视频引导任务对应不同观察空间与动作空间。
    - 泛化声明不同：部分论文报告跨基准迁移，另一些则报告跨模型层级或领域迁移较弱，建议针对目标重新验证。
    - 可复现性证据不同：有些论文提供代码、数据集或工件信号，有些只有论文级证据且缺少局限性说明，使验证缺口难以比较。
    开放问题:
    - 哪些基准特定的改进能迁移到测试桌面、移动、网页、编码、短信和视频引导设置之外的现实GUI工作流？
    - 在缺少系统覆盖证据的情况下，综述和分类工作应如何在定位、长程记忆、安全、不确定性和数据合成之间排序缺口？
    - 不确定性排名或安全加固在什么条件下能跨模型层级和界面领域迁移？
    - 密集合成监督或可验证任务合成能否在分布偏移和未见应用状态变化下保持收益？
    - 当前可见前沿中，缺失的代码、数据集、指标、基线和局限性说明隐藏了哪些可复现性缺口？
