  related_work_outline:
  - 'Mainstream direction: The evidence centers on application-grounded GUI agent
    benchmarks that evaluate real desktop, browser, dynamic-screen, video-guided,
    and drag-based interaction tasks rather than synthetic toy settings.'
  - 'Shared research pattern: Papers construct task suites with deterministic or verifiable
    scoring, then expose model gaps through finer signals such as sub-goal completion,
    cost-accuracy, uncertainty, and modality-specific grounding.'
  - 'Key differences: Coverage differs by interaction surface (macOS desktop with
    GUI+CLI, short-video dynamic interfaces, drag primitives, video-guided tasks),
    and by evaluation goal (aggregate success, fine-grained capability, uncertainty
    transfer, or training-data effect).'
  - 'Trend evolution: Within the 2024-2026 frontier, work moves from single Pass@1-style
    aggregate success toward capability annotation, observation efficiency, verifiable
    task synthesis, and weak supervision, with benchmarks increasingly used to validate
    agent improvements.'
  - 'Open questions: How well do these task distributions generalize across platforms,
    dynamic content, and interface modalities; how stable are fine-grained and uncertainty
    metrics across model families; and which evaluation signals predict deployed computer-use
    reliability?'
  related_work_outline_zh:
  - 主流方向：证据集中于面向真实应用场景构建GUI智能体基准，覆盖桌面、浏览器、动态界面、视频引导和拖拽交互任务，而非只评估合成简化任务。
  - 研究共性：论文通常构建带确定性或可验证评分的任务套件，并通过子目标完成、成本-准确性、不确定性和模态特定 grounding 等细粒度信号暴露模型短板。
  - 关键差异：覆盖差异体现在交互界面（macOS桌面的GUI+CLI、短视频动态界面、拖拽原语、视频引导任务），以及评测目标（总体成功率、细粒度能力、不确定性迁移或训练数据效应）。
  - 趋势演进：在2024-2026前沿期内，研究从单一Pass@1式总体成功率转向能力注释、观察效率、可验证任务合成与弱监督，基准越来越多被用于验证智能体改进。
  - 开放问题：这些任务分布在平台、动态内容和界面模态之间的泛化程度如何；细粒度与不确定性指标跨模型族是否稳定；哪些评测信号能预测真实计算机使用可靠性？
  literature_review:
    line_of_work_matrix:
    - line: Application-grounded GUI, desktop, browser, dynamic-screen, and interaction-primitive
        benchmark design
      what_it_solves: Creates shared task suites across desktop applications, dynamic
        short-video screens, drag-based interactions, and video-guided GUI tasks so
        computer-use agents can be compared under reproducible conditions.
      what_remains_open: 'Coverage remains partial: desktop success does not prove
        generalization to dynamic or mobile-like interfaces, drag and video-guided
        settings often stay single-platform, and task distributions may not match
        real user workflows.'
    - line: Fine-grained metric and stress-test design
      what_it_solves: Moves beyond aggregate Pass@1 by evaluating sub-goal completion,
        capability annotations, cost-accuracy, observation efficiency, and post-hoc
        uncertainty quantification for GUI grounding.
      what_remains_open: Proxy metrics and uncertainty rankings transfer only selectively
        across models, interfaces, and datasets; most stress tests do not yet cover
        multi-step agent trajectories or deployment-level risk.
    - line: Verifiable task synthesis and low-annotation training evaluation
      what_it_solves: Uses verifiable synthetic tasks, weak supervision from unannotated
        screenshots, and multimodal skill artifacts to improve agents and evaluate
        gains on existing benchmarks.
      what_remains_open: Benchmark conclusions may not be stable across training recipes,
        compute budgets, and skill or RL design choices; improvements on tested apps
        and task formats still need evidence of generalization beyond those suites.
    consensus:
    - Modern GUI automation benchmarks prefer real application environments with deterministic
      rule-based or verifiable evaluation instead of purely text-based or synthetic
      success checks.
    - Aggregate success alone is insufficient; fine-grained scoring, observation efficiency,
      grounding uncertainty, and modality-specific interaction coverage reveal differences
      that a single pass metric hides.
    - Current agents still fall short of human-level reliability on dynamic screens,
      observation control, and less common interaction primitives such as drag.
    - Evaluation findings do not transfer uniformly across model families, interfaces,
      or datasets, so target-specific re-evaluation is necessary.
    disagreements:
    - 'Evaluation target differs: one line targets desktop workflows with mixed GUI
      and CLI actions, another targets dynamic short-video interfaces, another isolates
      drag-based interaction, and another targets video-guided interactive tasks.'
    - 'Measurement focus differs: some works emphasize overall Pass@1, while others
      emphasize sub-goal completion and capability tags, cost-accuracy information
      efficiency, conformal grounding uncertainty, or training-data efficiency.'
    - 'Supervision and intervention assumptions differ: one line treats benchmarks
      as evaluation-only artifacts, while others use verifiable RL task synthesis,
      weakly supervised unannotated screenshots, or multimodal skill libraries to
      improve benchmark performance.'
    - 'Interaction coverage differs by modality: click and text actions are common,
      while drag, GUI+CLI mixed operation, dynamic changing content, and video-guided
      workflows expose separate unresolved boundaries.'
    open_questions:
    - Which benchmark task distributions and metrics best predict reliable computer-use
      behavior in unobserved applications and platforms?
    - Can fine-grained and uncertainty-based evaluation signals remain stable across
      open-weight and closed-source model families without target-specific re-ranking?
    - Do gains from verifiable task synthesis, weak supervision, or multimodal skill
      libraries transfer beyond the specific desktop, video, or drag-based suites
      used for evaluation?
    - How should dynamic-interface benchmarks measure observation control and information
      efficiency without overfitting to short-video or single-platform conventions?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 面向真实应用的 GUI、桌面、浏览器、动态界面与交互原语基准设计
      解决的问题: 构建覆盖桌面应用、动态短视频界面、拖拽交互和视频引导 GUI 任务的共享任务套件，使计算机使用智能体可在可复现条件下比较。
      尚未覆盖: 覆盖仍不完整：桌面任务成功不能证明对动态或类移动界面的泛化；拖拽和视频引导设置常限于单一平台；任务分布未必匹配真实用户工作流。
    - 路线: 细粒度指标与压力测试设计
      解决的问题: 在总体 Pass@1 之外，通过子目标完成、能力注释、成本-准确性、观察效率和 GUI grounding 后验不确定性量化来考察智能体。
      尚未覆盖: 代理指标和不确定性排名跨模型、界面和数据集仅选择性迁移；多数压力测试尚未覆盖多步智能体轨迹或部署级风险。
    - 路线: 可验证任务合成与低标注训练评测
      解决的问题: 通过可验证合成任务、未标注截图弱监督和多模态技能工件改进智能体，并在现有基准上评估收益。
      尚未覆盖: 基准结论在不同训练策略、算力预算和技能或 RL 设计下未必稳定；在测试应用与任务格式之外的泛化仍缺证据。
    共识:
    - 现代 GUI 自动化基准更倾向真实应用环境，并采用确定性规则或可验证评估，而非纯文本或合成式成功检查。
    - 仅看总体成功率不够；细粒度评分、观察效率、grounding 不确定性和模态特定交互覆盖能揭示单一通过率指标掩盖的差异。
    - 当前智能体在动态屏幕、观察控制和拖拽等较少见的交互原语上仍达不到人类水平可靠性。
    - 评估结论不能在不同模型族、界面或数据集间一致迁移，因此需要针对目标设置重新评估。
    分歧:
    - 评测目标不同：一条路线聚焦桌面中 GUI 与 CLI 混合工作流，另一条聚焦短视频动态界面，另一条隔离拖拽交互，还有一条聚焦视频引导交互任务。
    - 测量重点不同：部分工作强调总体 Pass@1，部分强调子目标完成和能力标签、成本-准确性信息效率、共形 grounding 不确定性或训练数据效率。
    - 监督与干预假设不同：一条路线把基准仅作为评测工件，另一条用可验证 RL 任务合成、未标注截图弱监督或多模态技能库来提升基准成绩。
    - 交互覆盖的模态不同：点击和文本输入较常见，而拖拽、GUI+CLI 混合操作、动态变化内容和视频引导工作流暴露各自未解决的边界。
    开放问题:
    - 哪些基准任务分布与指标最能预测智能体在未观测应用和平台上的计算机使用可靠性？
    - 细粒度和基于不确定性的评测信号能否在开源权重与闭源模型族之间保持稳定，而无需按目标重新排序？
    - 可验证任务合成、弱监督或多模态技能库带来的收益能否迁移到所用桌面、视频或拖拽套件之外？
    - 动态界面基准应如何测量观察控制与信息效率，同时避免过度拟合短视频或单一平台约定？
