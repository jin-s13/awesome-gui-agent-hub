    - 'Improvement strategy differs: inference-time retrieval or replay without updating
      model weights versus fine-tuning on generated drag, web, or GUI trajectories.'
    - 'Evaluation target differs: deterministic task completion, information cost-accuracy,
      repeated-task speed, environment fidelity, and video-guided grounding are optimized
      separately.'
    - 'Deployment setting differs: real desktop operating systems, short-video browser
      environments, web environments reconstructed from real URLs, and mobile/desktop/web
