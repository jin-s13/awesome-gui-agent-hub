  related_work_outline_zh:
  - 主流方向：构建面向特定应用场景（桌面、动态视频、拖拽、欺诈检测）的基准，并开发技能库、重放编译、在线批评等增强方法，提升GUI代理在真实应用中的能力与效率。
  - 研究共性：多数工作先构建新基准以暴露代理在特定交互或任务上的不足，再提出针对性改进并在同一基准上验证，但跨基准泛化很少被检验。
  - 关键差异：交互原语（点击、拖拽、动态、视频引导）、增强策略（预定义多模态技能、运行编译、历史感知批评）、评估协议（规则、模型、成本-准确性）和应用领域（桌面、移动、网页、短视频、欺诈）不同。
  - 趋势演进：在2024-2026年这一前沿窗口中，研究从通用GUI基准转向细粒度、面向特定应用的评估，并开始出现效率提升（重放）和错误修正（批评）等工作，但长期趋势尚不清晰。
