    共识:
    - 论文共同采用基准加方法/系统的评测结构，报告任务成功率或排名提升。
    - 评测日益多步与交互化，以截屏、动作或网页/移动轮次作为主要证据。
    - 泛化与分布转移是反复出现的关注点，体现在分布外基准、掩码信誉线索、跨域安全检查和跨模型不确定性迁移。
    - 多个可见证据字段缺失局限性说明，系统综述需将报告结果与未验证的可复现性信号分开。
    分歧:
