  literature_review:
    line_of_work_matrix:
    - line: Multidimensional task abstraction and evaluation frameworks
      what_it_solves: Defines new task types (multi-app, dynamic interfaces, drag)
        and evaluation dimensions (fine-grained sub-goal scoring, information efficiency,
        uncertainty) to capture agent capabilities beyond success rate.
      what_remains_open: These benchmarks are mostly static and do not evaluate online
        adaptation; cross-benchmark generalization and the relationship between single-step
        grounding failures and multi-step task success are not established.
    - line: Knowledge representation and skill learning
      what_it_solves: Reduces reliance on expensive human annotations by constructing
        multimodal skill libraries (e.g., VISUALSKILL) or learning visual grounding
        from massive unlabeled screenshots (e.g., GUICrafter), enabling agents to
        recognize UI elements and verify workflow states.
      what_remains_open: Skill library construction still requires human-authored
        documentation or live exploration; weak supervision has been demonstrated
        on a limited set of applications, and the transfer to unseen interface paradigms
        is unproven.
    - line: Training paradigms and long-horizon efficiency
      what_it_solves: Improves agent performance on complex tasks through verifiable
        task synthesis and online RL (e.g., ScaleCUA) or proactive context management
        (e.g., MemGUI-Agent), addressing sample efficiency and long-trajectory coherence.
      what_remains_open: Training pipelines are environment-specific; context management
        strategies are evaluated on a single out-of-distribution benchmark, and their
        interaction with online RL or multi-application workflows has not been studied.
    - line: Reliability quantification for GUI agents
      what_it_solves: Provides post-hoc uncertainty quantification (UQ) for GUI grounding,
        allowing selective trust and spatial safety margins via conformal prediction
        (e.g., Argus benchmark).
      what_remains_open: Restricted to single-step grounding; UQ rankings do not transfer
        across model families or interface modalities, and the integration of UQ into
        multi-step agent decision loops is unexplored.
    consensus:
    - Current GUI agents are far from human-level performance and require evaluation
      beyond atomic click correctness.
    - Vision-language models are the foundational architecture, but their raw zero-shot
      outputs are insufficient without task-specific adaptation, skill libraries,
      or training.
    - Fine-grained metrics (sub-goal completion, cost-accuracy, uncertainty) reveal
      capability differences that aggregate success rates hide.
    - Real-world interface complexity—dynamic content, CLI interaction, drag—demands
      formalized benchmarks and new interaction primitives.
    disagreements:
    - 'Evaluation setting: some works focus on single-step grounding or static screenshots,
      while others insist on multi-step trajectories in live, dynamic environments.'
    - 'Training signal: approaches range from zero-shot prompting to weak supervision
      from unlabeled data to online RL with verifiable rewards, implying different
      assumptions about the cost and availability of annotations.'
    - 'Skill representation: text-only skill descriptions are contrasted with multimodal
      artifacts retaining visual figures, with evidence that visual information improves
      UI element identification but adds complexity.'
    - 'Reliability treatment: uncertainty quantification is a dedicated focus in one
      benchmark, whereas most other works assume deterministic agent outputs and do
      not report confidence estimates.'
    open_questions:
    - How can uncertainty estimates be incorporated into multi-step agent policies
      to trigger human handoff or exploration?
    - Do skill libraries and training pipelines built on desktop or mobile environments
      generalize to radically different interface paradigms such as VR or embedded
      systems?
    - What is the minimal set of interaction primitives (click, drag, scroll, CLI)
      that a GUI agent must master to be considered generally capable?
    - Can the efficiency gains from online RL and context management be combined without
      sacrificing the reliability improvements from UQ?
