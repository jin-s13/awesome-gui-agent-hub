  related_work_outline:
  - 'Mainstream direction: Building grounded GUI/OS automation benchmarks that move
    beyond static click success toward fine-grained task completion, interaction coverage,
    and real-world desktop/mobile settings.'
  - 'Shared research pattern: Construct curated tasks or environments, evaluate multiple
    frontier models and baselines, then use task success plus auxiliary metrics to
    expose capability gaps rather than only ranking aggregates.'
  - 'Key differences: Evaluation targets split among static desktop tasks, dynamic
    living-screen settings, drag interactions, video-guided flows, and uncertainty/calibration;
    methods also split between benchmark-only design and training/skill interventions
    evaluated on benchmarks.'
  - 'Trend evolution: Within the 2024-2026 frontier window, evaluation is shifting
    from click-only GUI tasks toward real OS applications, dynamic and interaction-rich
    settings, and uncertainty- or cost-aware metrics.'
  - 'Open questions: Whether current benchmark suites cover deployment-relevant variation,
    whether proxy metrics align with user utility, and whether findings remain stable
    across frameworks, models, and re-evaluation conditions.'
  related_work_outline_zh:
  - 主流方向：构建真实GUI/OS自动化基准，从静态点击成功率转向细粒度任务完成、交互覆盖和真实桌面/移动环境。
  - 研究共性：构建精选任务或环境，评估多个前沿模型和基线，通过任务成功和辅助指标暴露能力缺口，而非仅看综合排名。
  - 关键差异：评测目标在静态桌面、动态屏幕、拖拽交互、视频引导任务或不确定性/校准之间不同；方法分为纯基准设计和基于训练/技能干预后评测。
  - 趋势演进：在2024-2026前沿窗口内，评测从点击式GUI任务转向真实操作系统应用、动态和交互密集场景，以及不确定性与成本感知指标。
  - 开放问题：当前基准是否覆盖部署相关变化，代理指标是否与用户效用一致，结论在不同框架、模型和重新评估下是否稳定。
  literature_review:
    line_of_work_matrix:
    - line: Real-world desktop and OS automation benchmark design
      what_it_solves: Creates comparable multi-application GUI/CLI tasks with deterministic
        rule-based scoring for agent assessment.
      what_remains_open: Coverage of dynamic interfaces, long-horizon workflows, deployment
        variance, and separation of framework versus model skill effects.
    - line: Interaction-type and platform-specific task/data design
      what_it_solves: Expands evaluation from click-only to drag, dynamic living-screen,
        and video-guided task settings with task-specific environments or annotations.
      what_remains_open: Platform coverage is narrow, and it is unclear whether simulated
        or browser-based environments transfer to real user workflows and general
        computer-use agents.
    - line: Metric and uncertainty/stress-test design
      what_it_solves: Adds fine-grained sub-goal scoring, cost-accuracy, information
        efficiency, and post-hoc uncertainty or conformal safety measures beyond aggregate
        pass rate.
      what_remains_open: Whether these metrics align with downstream user decisions
        and remain calibrated under model/interface or distribution shift.
    - line: Skill, weakly supervised, and RL training baselines evaluated on GUI benchmarks
      what_it_solves: Improves agent capability through multimodal skill libraries,
        verifiable task synthesis, weakly supervised grounding, and online RL, providing
        stronger baselines.
      what_remains_open: Stability across frameworks, data/compute budgets, and possible
        overfitting to benchmark task distributions or specific action patterns.
    consensus:
    - Benchmark design is moving toward fine-grained, rule-based, deterministic scoring
      and auxiliary metrics rather than relying solely on aggregate task success.
    - 'Model capability and environment coverage both matter: static click-focused
      evaluation misses observation-control, drag, dynamic-content, and multi-app
      workflow failures.'
    - Many studies compare frontier models against human baselines and report observable
      gaps, while also releasing tasks, splits, or scripts to support reproduction.
    - The 2026 frontier evidence treats integrated agent systems, not only isolated
      vision-language grounding, as the main evaluation target.
    disagreements:
    - 'Evaluation setting differs: real macOS desktop tasks, dynamic short-video browser
      environments, drag-only interactions, and video-guided GUI flows lead to different
      task distributions and failure modes.'
    - 'Metric priority differs: some emphasize fine-grained sub-goal completion, others
      cost-accuracy or information efficiency, and others uncertainty ranking and
      conformal safety.'
    - 'Treatment of agent ability differs: skill retrieval, weak supervision from
      unannotated screenshots, verifiable task synthesis with online RL, and benchmark-only
      evaluation represent different assumptions about training data and environment
      access.'
    - 'Interpretation of framework versus model contribution is contested: one result
      attributes gains to a skill library rather than framework design, while methods
      evaluate agents with different scaffolds and compute budgets.'
    open_questions:
    - Do current benchmark suites cover dynamic, multi-app, drag, video-guided, and
      OS-level variability well enough to support general computer-use agent claims?
    - Are rule-based, deterministic, cost-accuracy, and uncertainty metrics aligned
      with the downstream decisions and safety requirements users care about?
    - How stable are reported rankings and gains across frameworks, model tiers, compute
      budgets, and benchmark splits?
    - Can uncertainty estimates transfer across model classes or observable interfaces
      without target-specific re-evaluation?
    - What evidence shows that skill libraries, weakly supervised training, or online
      RL on benchmark tasks generalize beyond the specific action distributions and
      reward checks used?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 真实桌面与操作系统自动化基准设计
      解决的问题: 提供多应用GUI/CLI任务和确定性规则评分，用于可比的代理评测。
      尚未覆盖: 动态界面、长程工作流、部署差异，以及框架和模型技能贡献的分离。
    - 路线: 交互类型与平台特定任务/数据设计
      解决的问题: 将评测从点击扩展到拖拽、动态屏幕和视频引导任务，并提供相应环境或标注。
      尚未覆盖: 平台覆盖较窄，模拟或浏览器环境能否迁移到真实用户工作流和通用计算机使用代理未明。
    - 路线: 指标与不确定性/压力测试设计
      解决的问题: 在聚合成功率之外加入子目标、成本-准确性、信息效率、后验不确定性或共形安全度量。
      尚未覆盖: 这些指标是否与下游用户决策一致，并在模型/接口或分布偏移下保持校准。
    - 路线: 基于技能、弱监督和强化学习的代理训练基线
      解决的问题: 通过多模态技能库、可验证任务合成、弱监督定位和在线强化学习提升代理能力，提供更强基线。
      尚未覆盖: 不同框架、数据和算力预算下是否稳定，以及是否可能对基准任务分布或动作模式过拟合。
    共识:
    - 基准设计正在向细粒度、规则化、确定性评分和辅助指标演进，而不再只依赖综合任务成功率。
    - 模型能力与环境覆盖同样重要：静态点击评测会遗漏观察控制、拖拽、动态内容和多应用工作流中的失败。
    - 多数研究在比较前沿模型与人类基线时报告明显差距，并释放任务、划分或脚本以支持复现。
    - 2026年前沿证据显示，评测对象更多是集成式代理系统，而不是仅孤立地评测视觉语言定位能力。
    分歧:
    - 评测设置不同：真实macOS桌面任务、动态短视频浏览器环境、纯拖拽交互和视频引导GUI流程导致不同任务分布和失败模式。
    - 指标优先级不同：有些强调细粒度子目标完成，有些强调成本-准确性或信息效率，有些强调不确定性排序和共形安全。
    - 代理能力处理方式不同：技能检索、未标注截图弱监督、可验证任务合成加在线强化学习、纯基准评测代表不同的数据和环境访问假设。
    - 对框架与模型贡献的解释存在分歧：一项结果显示收益来自技能库而非框架设计，而方法研究在不同脚手架和算力预算下评测代理。
    开放问题:
