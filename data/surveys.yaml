  related_work_outline:
  - 'Mainstream direction: Building realistic GUI and desktop automation benchmarks
    that span diverse applications, interaction types (click, drag, dynamic watching),
    and evaluation granularity (sub-goal, uncertainty, multi-step) to diagnose agent
    capability beyond aggregate success rates.'
  - 'Shared research pattern: Creating task suites with deterministic or rule-based
    evaluation, fine-grained metrics, and publicly released environments to enable
    reproducible comparison of VLM-based agents; increasingly coupling benchmarks
    with training pipelines to improve agent performance on those same tasks.'
  - 'Key differences: Environments range from real desktop OS (MacAgentBench) to browser-simulated
    dynamic platforms (LivingScreen) and video-guided tasks (VG-GUIBench); evaluation
    focuses include single-step grounding uncertainty (Argus), multi-step trajectory
    completion, and interaction diversity (drag, CLI+GUI); some works use benchmarks
    only for assessment, while others integrate them with online RL or weak supervision
    for training.'
  - 'Trend evolution: From 2024 through 2026, benchmarks evolved from static screenshot-based
    tasks to dynamic, multi-modal, and multi-application settings; metrics expanded
    from pass/fail to capability-level diagnostics and uncertainty estimation; and
    a nascent trend uses benchmark environments as training infrastructure for computer-use
    agents.'
  - 'Open questions: How to define success criteria that remain valid for dynamic,
    non-deterministic interfaces; whether uncertainty quantification methods transfer
    across model families and deployment settings; and how well agents trained on
    synthetic or benchmark-specific tasks generalize to unobserved real-world applications.'
  related_work_outline_zh:
  - 主流方向：构建真实GUI和桌面自动化基准，覆盖多样化应用、交互类型（点击、拖拽、动态观察）和评估粒度（子目标、不确定性、多步），以超越总成功率诊断代理能力。
  - 研究共性：创建具有确定性或基于规则评估的任务套件，采用细粒度指标并公开环境，实现对基于VLM代理的可复现比较；越来越多地将基准与训练流水线耦合以提升代理在相同任务上的性能。
  - 关键差异：环境范围从真实桌面OS（如MacAgentBench）到浏览器模拟动态平台（如LivingScreen）和视频引导任务（如VG-GUIBench）；评估重点包括单步grounding不确定性（Argus）、多步轨迹完成和交互多样性（拖拽、CLI+GUI）；部分工作仅将基准用于评测，而另一些则将其与在线RL或弱监督训练结合。
  - 趋势演进：2024至2026年间，基准从静态截图任务演进到动态、多模态、多应用设置；指标从通过/失败扩展到能力级诊断和不确定性估计；新兴趋势是将基准环境用作计算机使用代理的训练基础设施。
  - 开放问题：如何为动态非确定性界面定义有效的成功标准；不确定性量化方法是否能在不同模型家族和部署设置间迁移；在合成或基准特定任务上训练的代理在未见过的真实应用中泛化能力如何。
  literature_review:
    line_of_work_matrix:
    - line: Realistic GUI and desktop automation benchmarks with diverse tasks and
        deterministic evaluation
      what_it_solves: Provides shared, reproducible tasks across multiple applications
        and interaction types (e.g., macOS desktop with CLI+GUI, short-video platforms,
        drag-based interactions) enabling fine-grained comparison of agent capabilities
        beyond pass/fail rates.
      what_remains_open: Coverage of dynamic, non-deterministic interfaces and cross-platform
        generalization; the alignment between task success in these benchmarks and
        user-perceived utility in real-world workflows remains unverified.
    - line: Fine-grained capability diagnostics and uncertainty quantification for
        agent actions
      what_it_solves: Introduces metrics such as multi-checkpoint sub-goal scoring,
        cost-accuracy efficiency, and post-hoc uncertainty estimation to diagnose
        failure modes and assess the reliability of grounding decisions, moving beyond
        aggregate success.
      what_remains_open: Transferability of uncertainty rankings across model classes
        and interface types is weak; the connection between proxy metrics and actual
        downstream user satisfaction or safety has not been empirically established.
    - line: Benchmark-driven training with synthetic data, weak supervision, or online
        RL
      what_it_solves: Reduces reliance on expensive human annotations by generating
        verifiable tasks from environments or leveraging unannotated screenshots;
        uses benchmark environments as training infrastructure to lift agent performance
        on standardized tasks.
      what_remains_open: Distribution shift between synthetic/benchmark tasks and
        real application workflows; scalability of training across multiple environments
        and the stability of performance gains when deployed outside the training
        distribution are not yet demonstrated.
    consensus:
    - Realistic, multi-application tasks with fine-grained evaluation are necessary
      to reveal capability differences that aggregate success rates hide.
    - Deterministic or rule-based scoring is preferred for reproducibility in agent
      benchmarking.
    - Current VLM-based agents still exhibit significant failure modes, including
      over-observation, under-observation, and weak grounding on dynamic or non-click
      interactions.
    - Publicly released environments and datasets are critical for enabling controlled
      comparisons and progress tracking in the field.
    disagreements:
    - 'Deployment environment: real operating system with access to CLI and GUI versus
      browser-simulated dynamic platforms versus video-guided interactive tasks, leading
      to different coverage of interface complexity.'
    - 'Evaluation target: single-step grounding accuracy and uncertainty versus multi-step
      trajectory completion, with some works emphasizing spatial action reliability
      and others focusing on sequence-level task success.'
    - 'Interaction modality: the majority of benchmarks focus on click-based actions,
      while a few explicitly address drag, resize, and observation-control actions,
      revealing a split on which primitives are considered essential for computer
      use.'
    - 'Role of benchmarks: some works treat benchmarks purely as evaluation tools,
      while others integrate them into training loops (online RL, weak supervision),
      implying different assumptions about benchmark leakage and ecological validity.'
    open_questions:
    - How can success criteria be defined for dynamic interfaces where content changes
      between actions and deterministic replay is not feasible?
    - Can uncertainty quantification methods for GUI grounding be made robust across
      different model families and deployment conditions without per-target recalibration?
    - What is the generalization gap between agents trained on benchmark-specific
      or synthetically generated tasks and their performance on unseen, real-world
      applications?
    - How should observation control and information efficiency be integrated into
      standard agent benchmarks to reflect real-time decision costs?
  literature_review_zh:
    研究路线矩阵:
    - 路线: 真实GUI与桌面自动化基准，包含多样化任务和确定性评估
      解决的问题: 提供跨多应用和交互类型（如macOS桌面CLI+GUI、短视频平台、拖拽交互）的共享可复现任务，实现对代理能力的细粒度比较，超越通过/失败率。
      尚未覆盖: 动态、非确定性界面的覆盖和跨平台泛化；这些基准中的任务成功与用户在实际工作流中感知的效用之间的一致性尚未得到验证。
    - 路线: 代理动作的细粒度能力诊断与不确定性量化
      解决的问题: 引入多检查点子目标评分、成本-准确率效率以及后验不确定性估计等指标，诊断失败模式并评估grounding决策的可靠性，超越总成功率。
      尚未覆盖: 不确定性排名在不同模型类别和接口类型间的迁移性较弱；代理指标与真实下游用户满意度或安全性之间的联系尚未经验证。
    - 路线: 借助合成数据、弱监督或在线强化学习进行基准驱动的训练
      解决的问题: 通过从环境生成可验证任务或利用未标注截图，减少对昂贵人工标注的依赖；将基准环境作为训练基础设施，提升代理在标准化任务上的表现。
      尚未覆盖: 合成/基准任务与真实应用工作流之间的分布偏移；在多环境中训练的可扩展性，以及当部署超出训练分布时性能增益的稳定性尚未得到展示。
    共识:
    - 真实、多应用的任务与细粒度评估对于揭示总成功率所掩盖的能力差异是必要的。
    - 确定性或基于规则的评分在代理基准测试中因其可复现性而受到青睐。
    - 当前基于VLM的代理仍存在显著失败模式，包括过度观察、观察不足以及动态或非点击交互中的弱grounding。
    - 公开发布的环境和数据集对于实现受控比较和领域进展追踪至关重要。
    分歧:
    - 部署环境：真实操作系统（带CLI和GUI）对比浏览器模拟动态平台对比视频引导交互任务，导致对界面复杂性的覆盖不同。
    - 评估目标：单步grounding准确性与不确定性对比多步轨迹完成，部分工作强调空间动作可靠性，另一些则关注序列级任务成功。
    - 交互模态：多数基准聚焦点击动作，少数明确处理拖拽、调整大小和观察控制动作，揭示了对计算机使用必备原语的不同看法。
    - 基准的角色：一些工作将基准纯粹视为评估工具，而另一些将其整合进训练循环（在线RL、弱监督），意味着对基准泄漏和生态有效性的不同假设。
    开放问题:
    - 如何为动作间内容变化的动态界面定义成功标准，且无法进行确定性重放？
    - GUI grounding的不确定性量化方法能否在不同模型家族和部署条件下保持鲁棒，而无需针对每个目标重新校准？
    - 在基准特定或合成任务上训练的代理，在未见过的真实应用上的泛化差距有多大？
    - 如何将观察控制与信息效率融入标准代理基准，以反映实时决策成本？
